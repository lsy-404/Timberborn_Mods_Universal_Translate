koKR = "한 번에 터널을 파고 튜웨이를 설치합니다. 비버들은 그것을 빠른 속도로 통과합니다."
trTR = "Bir tünel kazıyor ve tek adımda bir tubeway kuruyor. Koyunlar üzerinden yüksek hızda seyahat ediyor."
esES = "Excava un túnel e instala un tubo de transporte en un solo paso. Los castores lo recorren a gran velocidad."
itIT = "Scava un tunnel e installa un tubo di trasporto in un solo passaggio. I castori lo percorrono ad alta velocità."
ukUA = "Копає тунель і одразу прокладає тубовий шлях. Бобри переміщуються ним на високій швидкості."
thTH = "ขุดอุโมงค์และติดตั้งท่อลำเลียงในขั้นตอนเดียว บีเวอร์เดินทางผ่านท่อนี้ด้วยความเร็วสูง"
csCZ = "Vykope tunel a jedním krokem nainstaluje tubeway. Veverky po ní jedou vysokou rychlostí."
viVN = "Đào một đường hầm và lắp đặt tubeway trong một bước. Các chú hải ly di chuyển qua nó với tốc độ cao."
caES = "Exposa un túnel i instal·la un tubeway en un sol pas. Els castors hi viatgen a gran velocitat."
beBY = "Капае тунэль і адразу ўсталёўвае трубавую магістраль. Бабры перамяшчаюцца па ёй на высокай хуткасці."
roRO = "Sapă un tunel și instalează o conductă de transport într-un singur pas. Castorii o parcurg cu viteză mare."
huHU = "Egy lépésben ás alagutat és telepít csőalagutat. A bobrok nagy sebességgel közlekednek rajta."
arSA = "يحفر نفقًا ويركّب أنبوب نقل في خطوة واحدة. يسافر الـBeavers عبره بسرعة عالية."

["Building.UndergroundTubeway.FlavorDescription"]
raw = "Why dig first and build later when you can do both at once?"
status = "normal"
enUS = "Why dig first and build later when you can do both at once?"
zhCN = "为何先挖掘再建造，而不能两者同时完成？"
zhTW = "為什麼要先挖掘再建造，當你可以同時完成兩者？"
ruRU = "Зачем копать сначала и строить позже, если можно сделать и то, и другое одновременно?"
jaJP = "同時に両方できるなら、どうして先に掘ってから建てる必要があるのですか？"
frFR = "Pourquoi creuser d'abord et construire plus tard lorsque vous pouvez faire les deux en même temps ?"
deDE = "Warum zuerst graben und später bauen, wenn du beides gleichzeitig tun kannst?"
plPL = "Dlaczego najpierw kopać, a później budować, skoro możesz zrobić obie czynności jednocześnie?"
ptBR = "Por que cavar primeiro e construir depois quando você pode fazer os dois ao mesmo tempo?"
koKR = "먼저 파고 나중에 짓느니, 둘 다 한꺼번에 할 수 있다면?"
trTR = "Neden önce kazıp sonra inşa edesiniz ki, ikisini birden yapamıyorsanız?"
esES = "¿Por qué cavar primero y construir después cuando puedes hacer ambas cosas a la vez?"
itIT = "Perché scavare prima e costruire dopo, quando puoi fare entrambe le cose insieme?"
ukUA = "Чому спочатку копати, а будувати потім, коли можна робити і те, і те одночасно?"
thTH = "ทำไมต้องขุดก่อนแล้วค่อยสร้างทีหลัง ในเมื่อทำทั้งสองอย่างพร้อมกันได้"
csCZ = "Proč nejdříve kopat a stavět až později, když můžete dělat obojí najednou?"
viVN = "Tại sao phải đào trước và xây sau trong khi bạn có thể làm cả hai cùng lúc?"
caES = "Per què cavar primer i construir després quan pots fer les dues coses alhora?"
beBY = "Чаму капаць спачатку і будаваць потым, калі можна рабіць і тое, і другое адначасова?"
roRO = "De ce să săpăm mai întâi și să construim apoi, când poți face ambele în același timp?"
huHU = "Miért ássunk előbb és építsünk utána, amikor a kettőt egyszerre is megteheted?"
arSA = "لماذا تحفر أولاً وتبني لاحقاً، بينما يمكنك فعل الأمرين في وقت واحد؟"

