ruRU = "Сваривает ингредиенты в пасты для дальнейшей переработки."
jaJP = "「原料を煮て、さらなる加工のためのスプレッドを作ります。」"
frFR = "Fait bouillir les ingrédients pour en faire des pâtes à traiter ultérieurement."
deDE = "Kocht Zutaten zu Aufstrichen für die Weiterverarbeitung."
plPL = "Gotuje składniki na pasty do dalszego przetwarzania."
ptBR = "Ferve ingredientes para transformá-los em pastas para processamento posterior."
koKR = "재료를 끓여서 더 가공할 수 있는 스프레드로 만든다."
csCZ = "Vaří ingredience na pomazánky pro další zpracování."
viVN = "Nấu nguyên liệu thành các loại mứt để chế biến tiếp."
trTR = "Malzemeleri daha fazla işleme için ezmelere kaynatır."
esES = "Hierve ingredientes para convertirlos en productos para untar destinados a un procesamiento posterior."
itIT = "Fa bollire gli ingredienti per trasformarli in creme spalmabili da sottoporre a ulteriori lavorazioni."
ukUA = "Варить інгредієнти, перетворюючи їх на намазки для подальшої переробки."
thTH = "ต้มวัตถุดิบให้กลายเป็นสเปรด เพื่อนำไปแปรรูปต่อ"
caES = "Bull ingredients per obtenir cremes per untar per a un processament posterior."
beBY = "Варыць інгрэдыенты, ператвараючы іх у намазкі для далейшай перапрацоўкі."
roRO = "Fierbe ingredientele și le transformă în paste tartinabile pentru prelucrare ulterioară."
huHU = "Az alapanyagokat kenhető krémekké főzi a további feldolgozáshoz."
arSA = "تغلي المكونات وتحولها إلى مواد قابلة للدهن لمزيد من المعالجة."

["Building.JamStove.FlavorDescription"]
raw = "The pot had to be closed up after too many sweet-toothed beavers have been tempted by the delicious jam and cream."
status = "normal"
enUS = "The pot had to be closed up after too many sweet-toothed beavers were tempted by the delicious jam and cream."
zhCN = "“锅必须盖上，因为太多爱吃甜食的海狸被美味的果酱和奶油诱惑。”"
zhTW = "鍋子必須蓋上，因為太多喜愛甜食的海狸被美味的果醬和奶油誘惑了。"
ruRU = "Кастрюлю пришлось закрыть, после того как слишком много любителей сладкого бобров было соблазнено вкусным вареньем и сливками."
jaJP = "「美味しいジャムとクリームに魅了された甘党のビーバーが多すぎたため、鍋は閉じられなければなりませんでした。」"
frFR = "Il fallait fermer le pot après que trop de castors gourmands aient été tentés par la délicieuse confiture et la crème."
deDE = "Der Topf musste verschlossen werden, nachdem zu viele süßnasige Biber von der köstlichen Marmelade und Sahne verführt wurden."
plPL = "Garnek musiał być zamknięty po tym, jak zbyt wiele łasuchów bobrów dało się skusić pysznym dżemem i śmietaną."
ptBR = "A panela teve que ser fechada após muitos castores com gosto por doces terem sido tentados pela deliciosa geléia e creme."
koKR = "너무 많은 단 것 좋아하는 비버들이 맛있는 잼과 크림에 유혹당한 후, 냄비는 닫혀야 했다."
csCZ = "Hrnec musel být zavřený poté, co příliš mnoho medvídků s chutí na sladké podlehlo lahodnému džemu a smetaně."
viVN = "Cái nồi phải được đậy lại sau khi quá nhiều chú nhím có khẩu vị ngọt ngào bị cám dỗ bởi mứt và kem ngon lành."
trTR = "Tencere, fazla şekerli dişlere sahip kunduzların lezzetli reçel ve kremaya kapılması sonrası kapatılmak zorunda kaldı."
esES = "Hubo que cerrar bien la olla después de que demasiados castores golosos se sintieran tentados por la deliciosa mermelada con nata."
itIT = "La pentola ha dovuto essere chiusa dopo che troppi castori golosi si sono lasciati tentare dalla deliziosa marmellata e panna."
ukUA = "Горщик довелося закрити, бо надто багато бобрів-ласунів піддалися спокусі смачного варення з вершками."
thTH = "ต้องปิดฝาหม้อ หลังจากมีบีเวอร์ที่ชอบกินของหวานถูกแยมและครีมแสนอร่อยยั่วใจมากเกินไป"
caES = "L'olla s'ha hagut de tancar després que massa castors llaminers s'hagin deixat temptar per la deliciosa melmelada i la nata."
beBY = "Гаршчок давялося закрыць пасля таго, як занадта шмат баброў-ласуноў спакусіліся смачным варэннем і сліўкамі."
roRO = "Oala a trebuit să fie închisă după ce prea mulți castori pofticioși au fost ispitiți de dulceața delicioasă cu gem și smântână."
huHU = "Az edényt le kellett zárni, miután túl sok édesszájú hódot csábított el a finom lekvár és tejszín."
arSA = "كان لا بد من إغلاق القدر بإحكام بعدما أغرت المربّى والقشدة اللذيذتان عددًا كبيرًا جدًا من القنادس المحبة للحلوى."

