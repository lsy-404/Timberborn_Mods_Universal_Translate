["LV.Pkg.BuiltDone"]
raw = "'Packager' mod built. Please restart the game and enable the built mod.\n<RedHighlight>Do not disable this mod.</RedHighlight>\nIf you want to build the mod again (for example, after changing mods that give/remove items), simply disable the built mod and the button will appear again."
status = "normal"
enUS = "'Packager' mod built. Please restart the game and enable the built mod.\n<RedHighlight>Do not disable this mod.</RedHighlight>\nIf you want to build the mod again (for example, after changing mods that give/remove items), simply disable the built mod and the button will appear again."
zhCN = "Packager模组已构建。请重启游戏，并启用已构建的模组。<br><color=#FF4C4C>警告：</color>启用Packager模组时，请勿禁用此模组。<br>若需重新构建Packager模组（例如在更改提供/移除物品的模组后），请先禁用已构建的模组并重启游戏，按钮将再次出现。"
zhTW = "「'包裝器'模組已建立。請重新啟動遊戲並開啟已建立的模組。\n<RedHighlight>請勿停用此模組。</RedHighlight>\n如果您想重新建立模組（例如，在更改給予/移除物品的模組之後），只需停用已建立的模組，按鈕將再次出現。」"
ruRU = "'Пакетировщик' мод построен. Пожалуйста, перезапустите игру и включите построенный мод.  \n<RedHighlight>Не отключайте этот мод.</RedHighlight>  \nЕсли вы хотите построить мод снова (например, после изменения модов, которые дают/удаляют предметы), просто отключите построенный мод, и кнопка появится снова."
jaJP = "「パッケージャー」モッドが構築されました。ゲームを再起動して、構築されたモッドを有効にしてください。  \n<RedHighlight>このモッドを無効にしないでください。</RedHighlight>  \nモッドを再構築したい場合（アイテムを追加/削除するモッドを変更した後など）は、構築されたモッドを無効にするだけで、ボタンが再び表示されます。"
frFR = "Nom de la clé : LV.Pkg.BuiltDone - Nouveau texte à traduire : \"'Mod 'Packager' construit. Veuillez redémarrer le jeu et activer le mod construit. <RedHighlight>Ne désactivez pas ce mod.</RedHighlight> Si vous souhaitez reconstruire le mod (par exemple, après avoir modifié des mods qui donnent/enlèvent des objets), il suffit de désactiver le mod construit et le bouton réapparaîtra.\""
deDE = "'Packager' Mod erstellt. Bitte starten Sie das Spiel neu und aktivieren Sie den erstellten Mod.\n<RoteMarkierung>Deaktivieren Sie diesen Mod nicht.</RoteMarkierung>\nWenn Sie den Mod erneut erstellen möchten (zum Beispiel nach dem Ändern von Mods, die Gegenstände hinzufügen/entfernen), deaktivieren Sie einfach den erstellten Mod und die Schaltfläche wird wieder angezeigt."
plPL = "'Mod 'Packager' zbudowany. Proszę zrestartować grę i włączyć zbudowany mod. \n<CzerwonyPodświetlenie>Nie wyłączaj tego moda.</CzerwonyPodświetlenie> \nJeśli chcesz zbudować mod ponownie (na przykład po zmianie modów, które dają/usuwają przedmioty), po prostu wyłącz zbudowany mod, a przycisk pojawi się ponownie."
ptBR = "'Mod 'Packager' construído. Por favor, reinicie o jogo e habilite o mod construído. \n<DestaqueVermelho>Não desative este mod.</DestaqueVermelho> \nSe você quiser construir o mod novamente (por exemplo, após mudar mods que dão/removem itens), basta desativar o mod construído e o botão aparecerá novamente."
koKR = "‘패키저’ 모드가 생성되었습니다. 게임을 재시작하고 생성된 모드를 활성화 해주세요.  \n<RedHighlight>이 모드를 비활성화하지 마세요.</RedHighlight>  \n모드를 다시 빌드하고 싶으시다면 (예를 들어 아이템을 주거나 제거하는 모드를 변경한 후), 생성된 모드를 비활성화하면 버튼이 다시 나타납니다."
trTR = "'Packager' modu inşa edildi. Lütfen oyunu yeniden başlatın ve inşa edilen modun etkinleştirildiğinden emin olun.\n<KırmızıVurgu>Bu modu devre dışı bırakmayın.</KırmızıVurgu>\nModu tekrar inşa etmek istiyorsanız (örneğin, eşya veren/alan modları değiştirdikten sonra), sadece inşa edilen modu devre dışı bırakın ve düğme tekrar görünecektir."
esES = "'Packager' mod compilado. Reinicia el juego y activa el mod compilado.\n<RedHighlight>No desactives este mod.</RedHighlight>\nSi quieres volver a compilar el mod (por ejemplo, después de cambiar mods que añadan o quiten objetos), simplemente desactiva el mod compilado y el botón volverá a aparecer."
itIT = "'Packager' mod costruita. Riavvia il gioco e abilita la mod costruita.\n<RedHighlight>Non disabilitare questa mod.</RedHighlight>\nSe vuoi costruire di nuovo la mod (ad esempio dopo aver modificato mod che aggiungono/rimuovono oggetti), disabilita semplicemente la mod costruita e il pulsante ricomparirà."
ukUA = "'Packager' мод зібрано. Будь ласка, перезапустіть гру та увімкніть зібраний мод.\n<RedHighlight>Не вимикайте цей мод.</RedHighlight>\nЯкщо ви хочете зібрати мод знову (наприклад, після зміни модів, які додають/видаляють предмети), просто вимкніть зібраний мод, і кнопка знову з'явиться."
thTH = "'Packager' ของม็อดถูกสร้างแล้ว โปรดรีสตาร์ตเกมและเปิดใช้งานม็อดที่สร้างแล้ว\n<RedHighlight>อย่าปิดการใช้งานม็อดนี้</RedHighlight>\nหากคุณต้องการสร้างม็อดใหม่อีกครั้ง (เช่น หลังจากเปลี่ยนม็อดที่ให้หรือลบไอเทม) ให้ปิดการใช้งานม็อดที่สร้างแล้ว แล้วปุ่มจะปรากฏขึ้นอีกครั้ง"
csCZ = "'Packager' mod byl postaven. Prosím, restartujte hru a povolte postavený mod.  \n<RedHighlight>Nedisablesujte tento mod.</RedHighlight>  \nPokud chcete mod postavit znovu (například po změně modů, které dávají/odebírají předměty), jednoduše deaktivujte postavený mod a tlačítko se znovu objeví."
viVN = "'Packager' mod đã được xây dựng. Vui lòng khởi động lại trò chơi và kích hoạt mod đã được xây dựng.\n<RedHighlight>Đừng vô hiệu hóa mod này.</RedHighlight>\nNếu bạn muốn xây dựng lại mod này (ví dụ, sau khi thay đổi các mod thêm/bỏ vật phẩm), chỉ cần vô hiệu hóa mod đã được xây dựng và nút sẽ xuất hiện trở lại."
caES = "'Packager' mod construït. Reinicia el joc i activa el mod construït.\n<RedHighlight>No desactivis aquest mod.</RedHighlight>\nSi vols tornar a construir el mod (per exemple, després de canviar mods que afegeixen o eliminen elements), simplement desactiva el mod construït i el botó tornarà a aparèixer."
beBY = "«Packager» мод сабраны. Калі ласка, перазапусціце гульню і ўключыце сабраны мод.\n<RedHighlight>Не адключайце гэты мод.</RedHighlight>\nКалі вы хочаце зноў сабраць мод (напрыклад, пасля змены модаў, якія даюць або забіраюць прадметы), проста адключыце сабраны мод, і кнопка зноў з'явіцца."
roRO = "'Packager' a fost construit. Te rugăm să repornești jocul și să activezi modul construit.\n<RedHighlight>Nu dezactiva acest mod.</RedHighlight>\nDacă vrei să construiești din nou modul (de exemplu, după ce modifici modurile care adaugă/elimină obiecte), dezactivează pur și simplu modul construit, iar butonul va apărea din nou."
huHU = "'Packager' mod elkészült. Kérjük, indítsa újra a játékot, és engedélyezze az elkészült modot.\n<RedHighlight>Ne tiltsa le ezt a modot.</RedHighlight>\nHa újra szeretné építeni a modot (például miután olyan modokat változtatott, amelyek tárgyakat adnak hozzá vagy távolítanak el), egyszerűen tiltsa le az elkészült modot, és a gomb ismét megjelenik."
arSA = "تم بناء الحزمة \"Packager\". يرجى إعادة تشغيل اللعبة وتفعيل الحزمة المبنية.\n<RedHighlight>لا تُعطّل هذه الحزمة.</RedHighlight>\nإذا أردت إعادة بناء الحزمة مرة أخرى (على سبيل المثال، بعد تغيير الحزم التي تضيف العناصر أو تُزيلها)، فما عليك سوى تعطيل الحزمة المبنية وسيظهر الزر مجددًا."

