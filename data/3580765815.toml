["LV.Pkg.PackagerFlavor"]
raw = "Born from necessity, perfected by neat freaks. Where there's clutter, there's a Bundler."
status = "normal"
enUS = "Born from necessity, perfected by neat freaks. Where there's clutter, there's a Bundler."
zhCN = "因需求而生，为整洁而精。杂乱所在处，必有打包机。"
zhTW = "源自需求，經由愛整潔者完善。在凌亂中，總有一個打包者。"
ruRU = "Рожденный из необходимости, усовершенствованный аккуратными людьми. Где есть беспорядок, там и Упаковщик."
jaJP = "「必要から生まれ、整理整頓好きによって完璧にされた。散らかっているところには、バンドラーがいる。」"
frFR = "Né de la nécessité, perfectionné par des maniaques de l'ordre. Là où il y a du désordre, il y a un Emballeur."
deDE = "Aus der Not geboren, von Pedanten perfektioniert. Wo Unordnung herrscht, ist ein Bündler zu finden."
plPL = "Narodzony z konieczności, dopracowany przez pedantów. Gdzie jest bałagan, tam jest Pakowacz."
ptBR = "Nascido da necessidade, aperfeiçoado por obsessivos por organização. Onde há bagunça, há um Empacotador."
koKR = "필요에서 태어나, 깔끔을 추구하는 이들에 의해 완성되다. 어지럽혀진 곳에는 번들러가 있다."
trTR = "İhtiyaçtan doğdu, titiz kişiler tarafından mükemmelleştirildi. Dağınıklığın olduğu yerde, bir Paketleyici vardır."
esES = "Nacido de la necesidad, perfeccionado por los maniáticos del orden. Donde hay desorden, hay un Empaquetador."
itIT = "Nata dalla necessità, perfezionata dai maniaci dell'ordine. Dove c'è disordine, c'è un Impacchettatore."
ukUA = "Народжений з необхідності, удосконалений педантами порядку. Там, де є безлад, є Пакувальник."
thTH = "เกิดจากความจำเป็น ถูกทำให้สมบูรณ์แบบโดยคนที่รักความเป็นระเบียบ เมื่อไหร่ที่มีของรกรุงรัง ก็มี Bundler อยู่ตรงนั้น"
csCZ = "Narozen z potřeby, zdokonalen čistotnými šílenci. Kde je nepořádek, tam je Balíčkář."
viVN = "Sinh ra từ nhu cầu, được hoàn thiện bởi những người ham ngăn nắp. Ở đâu có lộn xộn, ở đó có Bundler."
caES = "Nascut de la necessitat, perfeccionat pels obsessius de l'ordre. On hi ha desordre, hi ha un Empaquetador."
beBY = "Нарадзілася з неабходнасці, дасканалена педантамі. Дзе беспарадак, там і Упакоўшчык."
roRO = "Născut din necesitate, perfecționat de pedanții ordinii. Acolo unde e harababură, există un Împachetător."
huHU = "Szükség szülte, a rendmániások tökéletesítették. Ahol rendetlenség van, ott van egy Csomagoló."
arSA = "وُلدت من الحاجة، وكُمِلت على يد عشّاق النظافة. حيثما وُجدت الفوضى، وُجد الـ Bundler."

