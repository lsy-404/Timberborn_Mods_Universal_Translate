["LV.Pkg.Update710"]
raw = "This update gives you two new additional options: Bulk Crates and Liquid Barrels so you can store Pile and Tank goods in Warehouses. Check the mod's description on Steam or Mod.io for more details."
status = "abandoned"
enUS = "This update gives you two new additional options: Bulk Crates and Liquid Barrels so you can store Pile and Tank goods in Warehouses. Check the mod's description on Steam or Mod.io for more details."
zhCN = "本次更新为您提供两个新增选项：板条箱和密封桶，以便您能在仓库中存储材料堆和储水罐的物品。查看Steam或Mod.io上的模组说明以获取更多详情。"
zhTW = "此更新為您提供了兩個新的附加選項：大宗箱和液體桶，以便您可以在倉庫中儲存堆積和罐裝物品。請查看Steam或Mod.io上的模組描述以獲取更多詳細資訊。"
ruRU = "Это обновление предоставляет вам две новые дополнительные опции: крупные ящики и жидкие бочки, чтобы вы могли хранить товар в кучах и резервуарах на складах. Проверьте описание мода на Steam или Mod.io для получения более подробной информации."
jaJP = "このアップデートでは、2つの新しいオプションが追加されました：バルククレートと液体バレルです。これにより、倉庫にパイルとタンクの貨物を保管できるようになります。詳細については、SteamまたはMod.ioのモッドの説明を確認してください。"
frFR = "Nom de la clé : LV.Pkg.Update710 - Nouveau texte à traduire : \"Cette mise à jour vous offre deux nouvelles options supplémentaires : Caisses en vrac et Fûts liquides afin que vous puissiez stocker des marchandises de Pile et de Réservoir dans des entrepôts. Consultez la description du mod sur Steam ou Mod.io pour plus de détails.\""
deDE = "Schlüsselname: LV.Pkg.Update710 - Neuer zu übersetzender Text: \"Dieses Update bietet Ihnen zwei neue zusätzliche Optionen: Großkisten und Flüssigkeitsfässer, mit denen Sie Stapel- und Tankwaren in Lagerhäusern lagern können. Überprüfen Sie die Mod-Beschreibung auf Steam oder Mod.io für weitere Details.\""
plPL = "Ta aktualizacja daje ci dwie nowe dodatkowe opcje: Pudełka zbiorcze i Bańki płynów, dzięki którym możesz przechowywać towary z Półek i Zbiorników w Magazynach. Sprawdź opis moda na Steam lub Mod.io, aby uzyskać więcej szczegółów."
ptBR = "Esta atualização oferece duas novas opções adicionais: Caixas em Lote e Barris de Líquido, para que você possa armazenar bens de Pilha e Tanque nos Armazéns. Verifique a descrição do mod no Steam ou Mod.io para mais detalhes."
koKR = "이 업데이트는 두 가지 새로운 추가 옵션을 제공합니다: 대량 상자와 액체 드럼으로, 창고에 더미 및 탱크 물품을 저장할 수 있습니다. 더 많은 정보는 Steam이나 Mod.io의 모드 설명을 확인하세요."
trTR = "Bu güncelleme size iki yeni ek seçenek sunuyor: Toplu Sandıklar ve Sıvı Varilleri, böylece Yığın ve Tank ürünlerini Depolarda depolayabilirsiniz. Daha fazla ayrıntı için modun açıklamasını Steam veya Mod.io'da kontrol edin."
esES = "Esta actualización te ofrece dos nuevas opciones adicionales: Cajas a granel y Barriles de líquidos, para que puedas almacenar mercancías de tipo Montón y de tipo Tanque en los Almacenes. Consulta la descripción del mod en Steam o Mod.io para obtener más detalles."
itIT = "Questo aggiornamento introduce due nuove opzioni aggiuntive: Casse Sfuse e Barili per Liquidi, così da poter immagazzinare merci Cumulo e Cisterna nei Magazzini. Consulta la descrizione della mod su Steam o Mod.io per maggiori dettagli."
ukUA = "Цей оновлення додає дві нові додаткові опції: Ящики для сипучих матеріалів і Бочки для рідин, щоб ви могли зберігати товари типу «Купа» та «Резервуар» на складах. Докладніше про мод дивіться в описі на Steam або Mod.io."
thTH = "อัปเดตนี้เพิ่มตัวเลือกใหม่สองอย่าง ได้แก่ Bulk Crates และ Liquid Barrels เพื่อให้คุณสามารถเก็บสินค้าประเภท Pile และ Tank ไว้ในคลังสินค้า (Warehouse) ได้ โปรดดูรายละเอียดเพิ่มเติมในคำอธิบายของม็อดบน Steam หรือ Mod.io"
csCZ = "Tato aktualizace vám přináší dvě nové dodatečné možnosti: Hromadné bedny a Kapalinové barely, abyste mohli uskladnit zboží z Hromady a Nádrže ve skladech. Podívejte se na popis modu na Steamu nebo Mod.io pro více podrobností."
viVN = "Phiên bản cập nhật này mang đến cho bạn hai tùy chọn mới: Bulk Crates và Liquid Barrels, cho phép bạn lưu trữ hàng hóa ở dạng Pile và Tank trong các kho lưu trữ. Hãy kiểm tra mô tả của mod trên Steam hoặc Mod.io để biết thêm chi tiết."
caES = "Aquesta actualització us ofereix dues noves opcions addicionals: Caixes a granel i Barrils de líquid, perquè pugueu emmagatzemar mercaderies de tipus Pila i Dipòsit als Magatzems. Consulteu la descripció del mod a Steam o Mod.io per obtenir més detalls."
beBY = "Гэта абнаўленне дае вам дзве новыя дадатковыя опцыі: Масавыя скрыні і Вадкасныя бочкі, каб вы маглі захоўваць грузы тыпу «Куча» і «Рэзервуар» у складах. Больш падрабязна пра мод глядзіце апісанне ў Steam або Mod.io."
roRO = "Această actualizare îți oferă două opțiuni noi suplimentare: Lăzi în vrac și Butoaie pentru lichide, pentru a putea depozita bunuri de tip Grămadă și Rezervor în Depozite. Consultă descrierea modului pe Steam sau Mod.io pentru mai multe detalii."
huHU = "Ez a frissítés két új, további lehetőséget ad: Ömlesztett ládákat és Folyadékhordókat, így a Pile és Tank típusú árukat is tárolhatod raktárakban. További részletekért nézd meg a mod leírását a Steamen vagy a Mod.io-n."
arSA = "هذا التحديث يمنحك خيارين إضافيين جديدين: الصناديق الكبيرة والبراميل السائلة، حتى تتمكن من تخزين بضائع الكومة والخزان في المستودعات. راجع وصف المود على Steam أو Mod.io لمزيد من التفاصيل."
