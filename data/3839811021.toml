[_meta]
name = "Traduções PT-BR"

["TraducoesPTBR.AutoScaffold.ShiftHint"]
new = "Hold SHIFT to anchor the placement to the support below."
status = "normal"

["TraducoesPTBR.EzTube.ShiftHint"]
new = "Hold SHIFT to keep the mine platform instead of demolishing it."
status = "normal"

["TraducoesPTBR.EzShaft.Settings.Description"]
new = "EzShaft places Power Shafts and Vertical Power Shafts directly into solid ground. It tunnels each cell, lays a path inside, then builds shafts farthest-from-exit first so beavers can always retreat."
status = "normal"

["TraducoesPTBR.EzShaft.Settings.ShowBuildOrder"]
new = "Show build order on shafts"
status = "normal"

["TraducoesPTBR.EzShaft.Settings.ShowBuildOrderTooltip"]
new = "Overlay each pending shaft cell with a colored status icon (green = next, yellow = queued, red = last) and a 'B:N' text label showing the build rank. The order updates live as work progresses. Off by default."
status = "normal"

["TraducoesPTBR.EzShaft.Settings.LogDiagnostics"]
new = "Log build-order diagnostics"
status = "normal"

["TraducoesPTBR.EzShaft.Settings.LogDiagnosticsTooltip"]
new = "Write one '[EzShaft] batches=… sources=… rank1=…' line to the Player log every time the computed build order changes. Useful for reporting reachability or ordering bugs. Off by default."
status = "normal"

["TraducoesPTBR.EzShaft.BuildOrder.Next"]
new = "Next to build (1 of {0})"
status = "normal"

["TraducoesPTBR.EzShaft.BuildOrder.Last"]
new = "Last in queue ({0} of {1})"
status = "normal"

["TraducoesPTBR.EzShaft.BuildOrder.Queued"]
new = "Build order: {0} of {1}"
status = "normal"

["TraducoesPTBR.EzShaft.Blocked.SiteUnreachable"]
new = "Construction site unreachable — check your path network."
status = "normal"

["TraducoesPTBR.EzShaft.Blocked.NoColonyExit"]
new = "Waiting for path connection to colony."
status = "normal"
