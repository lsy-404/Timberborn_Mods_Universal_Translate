["Building.CargoZiplineStation.Description"]
raw = "Hangs goods on zipline cables and sends them down the line to a Cargo Receiver. Needs one worker to load, plus haulers to fill its stockpile."
status = "normal"
enUS = "Hangs goods on zipline cables and sends them down the line to a Cargo Receiver. Needs one worker to load, plus haulers to fill its stockpile."
zhCN = "将货物挂在滑索缆线上，并沿缆线运送至货物接收站。需要一名工人装载，另需搬运工填满其库存。"
zhTW = "將貨物掛在滑索纜線上，並沿線送往貨物接收站。需要一名工人裝載，此外還需要搬運工補充其庫存。"
ruRU = "Подвешивает товары на тросы зиплайна и отправляет их по линии к грузоприёмнику. Для загрузки требуется один рабочий, а для пополнения склада — грузчики."
jaJP = "ジップラインのケーブルに荷物を吊るし、路線に沿ってカーゴ受取所まで運びます。積み込みには作業員が1人必要です。また、備蓄所を補充する運搬係も必要です。"
frFR = "Suspend des marchandises aux câbles de tyrolienne et les envoie le long du câble jusqu'à un récepteur de fret. Nécessite un ouvrier pour le chargement, ainsi que des transporteurs pour remplir son stock."
deDE = "Hängt Güter an die Seilbahnkabel und schickt sie entlang der Strecke zu einem Frachtauffänger. Benötigt einen Arbeiter zum Beladen sowie Transportarbeiter, die den Lagerbestand auffüllen."
plPL = "Zawiesza towary na linach transportowych i wysyła je wzdłuż liny do Odbiornika ładunków. Wymaga jednego pracownika do załadunku oraz tragarzy do uzupełniania zapasów."
ptBR = "Pendura mercadorias nos cabos da tirolesa e as envia por eles até um Receptor de Carga. Precisa de um trabalhador para carregar, além de transportadores para abastecer seu estoque."
koKR = "물품을 집라인 케이블에 걸어 화물 수신기로 보냅니다. 적재할 일꾼 한 명과 비축장을 채울 운반꾼이 필요합니다."
csCZ = "Zavěšuje zboží na lana kladkové dráhy a posílá je po dráze do přijímače nákladu. K nakládání potřebuje jednoho pracovníka a zásobu jí musí doplňovat nosiči."
viVN = "Treo hàng hóa lên cáp zipline và gửi chúng dọc theo dây đến Trạm nhận hàng. Cần một công nhân để chất hàng, cùng với nhân viên vận chuyển để bổ sung hàng vào kho chứa."
trTR = "Zipline kablolarına eşya asar ve bunları hat boyunca bir Kargo Alıcısına gönderir. Yüklemek için bir işçiye, stok yığınını doldurmak içinse taşıyıcılara ihtiyaç duyar."

["Building.CargoZiplineStation.FlavorDescription"]
raw = "Who needs a backpack when the cable does the walking?"
status = "normal"
enUS = "Who needs a backpack when the cable does the walking?"
zhCN = "有了滑索代步，还要背包做什么？"
zhTW = "有了纜線代步，誰還需要背包？"
ruRU = "Зачем рюкзак, если груз перемещается по тросу?"
jaJP = "ケーブルが運んでくれるなら、バックパックなんて必要？"
frFR = "Qui a besoin d’un sac à dos quand le câble se charge de transporter les marchandises ?"
deDE = "Wer braucht schon einen Rucksack, wenn das Kabel die Laufarbeit übernimmt?"
plPL = "Kto potrzebuje plecaka, skoro ładunek sam jedzie po linie?"
ptBR = "Quem precisa de uma mochila quando o cabo faz o trajeto?"
koKR = "케이블이 알아서 운반해 주는데 배낭이 왜 필요해?"
csCZ = "Kdo potřebuje batoh, když se kabel postará o přepravu?"
viVN = "Ai cần ba lô khi dây cáp tự đi bộ chứ?"
trTR = "Kablo yürüyebiliyorken sırt çantasına ne gerek var?"

