["Building.CargoZiplineReceiver.Description"]
status = "normal"
raw = "Build it touching a warehouse and every bundle that arrives down the cable goes straight into that warehouse. No worker, no storage of its own, nothing to set up."
enUS = "Build it next to a warehouse, and every bundle that arrives via the cable goes straight into that warehouse. No workers, no storage of its own, nothing to set up."
zhCN = "将其建在与仓库相邻的位置，沿缆索运来的每捆货物都会直接进入该仓库。无需工人，也没有自带储存空间，无需进行任何设置。"
zhTW = "建造時讓它緊鄰倉庫，沿著纜線送達的每一捆貨物都會直接進入該倉庫。不需要工人，也沒有自己的儲存空間，無須設定任何東西。"
ruRU = "Постройте его вплотную к складу, и каждый груз, доставленный по тросу, сразу попадёт на этот склад. Работники не нужны, собственного хранилища нет, ничего настраивать не нужно."
jaJP = "倉庫に接するように建設すると、ケーブルで運ばれてきた荷物はすべて、そのまま倉庫に入ります。作業員は不要で、独自の保管場所もなく、設定も必要ありません。"
frFR = "Construisez-le contre un entrepôt et chaque colis qui arrive par le câble va directement dans cet entrepôt. Aucun ouvrier, aucun stockage propre, rien à configurer."
deDE = "Baue es direkt neben ein Lagerhaus, und jedes Bündel, das über das Seil ankommt, wird direkt in dieses Lagerhaus gebracht. Keine Arbeitskraft, kein eigener Lagerraum, nichts einzurichten."
plPL = "Zbuduj go tak, by stykał się z magazynem, a każda paczka dostarczona kolejką linową trafi prosto do tego magazynu. Nie wymaga pracownika ani własnego miejsca do przechowywania, nie trzeba też niczego konfigurować."
ptBR = "Construa-o encostado a um armazém, e cada pacote que chegar pelo cabo irá direto para esse armazém. Não precisa de trabalhador nem de armazenamento próprio, e não há nada para configurar."
koKR = "창고에 맞닿게 건설하면 케이블을 타고 도착하는 모든 묶음이 곧바로 그 창고로 들어갑니다. 일꾼도 필요 없고, 자체 저장 공간도 없으며, 따로 설정할 것도 없습니다."
csCZ = "Postavte ho tak, aby se dotýkal skladu, a každý balík, který dorazí po lanovce, poputuje rovnou do tohoto skladu. Nepotřebuje pracovníka ani vlastní skladovací prostor a není třeba nic nastavovat."
viVN = "Xây dựng sao cho công trình tiếp giáp với một nhà kho, và mọi bó hàng đến qua cáp sẽ được chuyển thẳng vào nhà kho đó. Không cần công nhân, không có kho chứa riêng, không cần thiết lập gì."
trTR = "Bir depoya bitişik inşa edin; kabloyla gelen her balya doğrudan o depoya gider. İşçi gerekmez, kendine ait deposu yoktur, ayarlanacak hiçbir şey yoktur."

["Building.CargoZiplineReceiver.FlavorDescription"]
status = "normal"
raw = "Gears mesh. So do cables, if you put the hook in the right place."
enUS = "Gears mesh. So do cables, if you put the hook in the right place."
zhCN = "齿轮会啮合。只要把挂钩放在正确的位置，缆绳也会。"
zhTW = "齒輪會嚙合。只要把掛鉤放在正確的位置，纜線也會。"
ruRU = "Шестерёнки сцепляются. Тросы тоже, если правильно расположить крюк."
jaJP = "歯車は噛み合う。ケーブルも、フックを正しい場所に掛ければそうなる。"
frFR = "Les engrenages s’emboîtent. Les câbles aussi, si vous placez le crochet au bon endroit."
deDE = "Zahnräder greifen ineinander. Das tun auch Seile, wenn man den Haken an die richtige Stelle setzt."
plPL = "Koła zębate się zazębiają. Kable też, jeśli umieścisz hak we właściwym miejscu."
ptBR = "Engrenagens se encaixam. Cabos também, se você colocar o gancho no lugar certo."
koKR = "톱니바퀴는 맞물리죠. 케이블도 그래요. 갈고리를 제대로 걸기만 한다면요."
csCZ = "Ozubená kola do sebe zapadají. A kabely taky, když hák umístíte na správné místo."
viVN = "Bánh răng ăn khớp. Dây cáp cũng vậy, nếu bạn móc đúng chỗ."
trTR = "Dişli çarklar birbirine geçer. Kablolar da öyle, kancayı doğru yere takarsanız."
