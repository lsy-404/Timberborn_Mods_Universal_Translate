["Building.CargoZiplineStation.Description"]
status = "normal"
raw = "Hangs goods on zipline cables and sends them down the line to a Cargo Receiver. Needs one worker to load, plus haulers to fill its stockpile."
enUS = "Hangs goods on zipline cables and sends them down the line to a Cargo Receiver. Needs one worker to load, plus haulers to fill its stockpile."
zhCN = "将货物挂在滑索缆线上，并沿缆线运送至货物接收站。需要一名工人装载，另需搬运工填充其库存。"
zhTW = "將貨物掛在滑索纜線上，沿線送往貨物接收站。需要一名工人裝載，並由搬運工填滿其庫存。"
ruRU = "Подвешивает товары на тросы зиплайна и отправляет их по линии к грузовому приёмнику. Для погрузки нужен один работник, а для пополнения запаса — переносчики."
jaJP = "ジップラインのケーブルに商品を吊り下げ、ラインに沿ってカーゴ受取所まで送ります。積み込みには作業員が1人必要で、さらに備蓄場所を満たす運搬人が必要です。"
frFR = "Accroche des marchandises aux câbles de tyrolienne et les envoie le long de la ligne jusqu’à un récepteur de marchandises. Nécessite un ouvrier pour le chargement, ainsi que des transporteurs pour remplir son stock."
deDE = "Hängt Waren an Seilrutschen und schickt sie entlang der Strecke zu einem Fracht-Empfänger. Benötigt einen Arbeiter zum Beladen sowie Transporteure, die den Vorrat füllen."
plPL = "Zawiesza towary na linach transportowych i przesyła je nimi do odbiornika ładunków. Do załadunku potrzebuje jednego pracownika, a do uzupełniania zapasów — tragarzy."
ptBR = "Pendura mercadorias nos cabos de tirolesa e as envia pelo cabo até um Receptor de Carga. Precisa de um trabalhador para carregar, além de carregadores para abastecer seu estoque."
koKR = "물품을 집라인 케이블에 걸어 화물 수신기로 보냅니다. 적재 작업자 1명과 비축장을 채울 운반인이 필요합니다."
csCZ = "Zavěšuje zboží na lanové dráhy a posílá ho po dráze k nákladní přijímací stanici. K nakládání potřebuje jednoho pracovníka a zásoby mu doplňují dopravci."
viVN = "Treo hàng hóa lên cáp zipline và chuyển chúng dọc theo cáp đến một Trạm nhận hàng. Cần một công nhân để bốc hàng, cùng các nhân viên vận chuyển để lấp đầy kho chứa."
trTR = "Mallarını zipline kablolarına asar ve hat boyunca bir Yük Alıcısı'na gönderir. Yüklemek için bir işçiye, stok alanını doldurmak içinse taşıyıcılara ihtiyaç duyar."

