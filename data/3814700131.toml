["Building.CargoZiplineReceiver.Description"]
raw = "Build it touching a warehouse and every bundle that arrives down the cable goes straight into that warehouse. No worker, no storage of its own, nothing to set up."
status = "normal"
enUS = "Build it touching a warehouse, and every bundle that arrives via the cable goes straight into that warehouse. No worker, no storage of its own, and nothing to set up."
zhCN = "将其建在仓库旁，沿缆绳运来的每一捆货物都会直接进入该仓库。无需工人，也没有自带储存空间，无需进行任何设置。"
zhTW = "建造時讓它緊鄰倉庫，沿著滑索送達的每捆貨物就會直接送進該倉庫。不需要工人，也沒有自己的儲存空間，完全不必設定。"
ruRU = "Постройте его вплотную к складу, и каждый тюк, прибывающий по канату, будет сразу попадать в этот склад. Рабочие не нужны, собственного хранилища нет, ничего настраивать не нужно."
jaJP = "倉庫に接するように建設すると、ケーブルで運ばれてきた束はすべて、そのまま倉庫に入ります。作業員も独自の保管場所も不要で、設定もありません。"
frFR = "Construisez-le contre un entrepôt et chaque colis qui arrive par le câble y est directement acheminé. Aucun travailleur, aucun stockage propre, rien à configurer."
deDE = "Baue ihn so, dass er ein Lager berührt, und jedes Bündel, das über das Seil ankommt, wird direkt in dieses Lager transportiert. Keine Arbeiter, kein eigener Lagerraum, nichts einzurichten."
plPL = "Zbuduj go tak, by stykał się z magazynem, a każda paczka dostarczona liną trafi prosto do tego magazynu. Nie wymaga pracownika ani własnego miejsca do przechowywania i nie trzeba niczego konfigurować."
ptBR = "Construa encostado a um armazém, e cada pacote que chegar pelo cabo irá direto para esse armazém. Sem trabalhadores, sem armazenamento próprio e sem nada para configurar."
koKR = "창고에 닿도록 건설하면 케이블을 타고 도착하는 모든 묶음이 곧바로 그 창고로 들어갑니다. 일꾼도, 자체 저장 공간도, 따로 설정할 것도 없습니다."
csCZ = "Postavte ho tak, aby se dotýkal skladu, a každý balík, který dorazí po lanovce, putuje rovnou do tohoto skladu. Nepotřebuje pracovníka ani vlastní úložný prostor a není třeba nic nastavovat."
viVN = "Xây dựng nó tiếp giáp với một nhà kho, và mọi kiện hàng được vận chuyển bằng cáp sẽ đi thẳng vào nhà kho đó. Không cần công nhân, không có kho chứa riêng, không cần thiết lập gì."
trTR = "Bir depoya bitişik inşa edin; kabloyla gelen her paket doğrudan o depoya gider. İşçi gerekmez, kendi deposu yoktur ve ayarlanacak hiçbir şey bulunmaz."

["Building.CargoZiplineReceiver.FlavorDescription"]
raw = "Gears mesh. So do cables, if you put the hook in the right place."
status = "normal"
enUS = "Gears mesh. So do cables, if you put the hook in the right place."
zhCN = "齿轮能啮合。钩子挂对地方的话，缆绳也能。"
zhTW = "齒輪會互相嚙合。纜線也是，只要把掛鉤放在正確的位置。"
ruRU = "Шестерёнки входят в зацепление. Тросы тоже, если закрепить крюк в нужном месте."
jaJP = "歯車は噛み合う。ケーブルも、フックを正しい場所に掛ければ噛み合う。"
frFR = "Les engrenages s'engrènent. Les câbles aussi, si on place le crochet au bon endroit."
deDE = "Zahnräder greifen ineinander. Das tun auch Seile, wenn man den Haken an der richtigen Stelle befestigt."
plPL = "Zębatki zazębiają się. Kable też, jeśli umieścisz hak we właściwym miejscu."
ptBR = "Engrenagens se encaixam. Cabos também, se você colocar o gancho no lugar certo."
koKR = "기어는 맞물린다. 케이블도 그렇다. 갈고리만 제자리에 걸면."
csCZ = "Ozubená kola do sebe zapadají. Stejně tak i kabely, když hák umístíte na správné místo."
viVN = "Bánh răng ăn khớp với nhau. Cáp cũng vậy, nếu bạn móc đúng chỗ."
trTR = "Dişli çarklar birbirine geçer. Kablolar da öyle, kancayı doğru yere takarsan."
