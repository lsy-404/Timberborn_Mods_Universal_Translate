new = "Who needs a backpack when the cable does the walking?"
status = "normal"
enUS = "Who needs a backpack when the cable does the walking?"
zhCN = "有缆绳代步，谁还需要背包？"
zhTW = "有了纜線代步，誰還需要背包？"
ruRU = "Кому нужен рюкзак, если кабель сам всё переносит?"
jaJP = "ケーブルが運んでくれるなら、バックパックなんて誰が必要とするだろう？"
frFR = "Qui a besoin d’un sac à dos quand le câble se charge du transport ?"
deDE = "Wer braucht schon einen Rucksack, wenn das Kabel die Laufarbeit übernimmt?"
plPL = "Kto potrzebuje plecaka, skoro to lina transportowa nosi ładunki?"
ptBR = "Quem precisa de mochila quando o cabo é que carrega as coisas?"
koKR = "케이블이 대신 걸어 주는데 배낭이 왜 필요해?"
csCZ = "Kdo potřebuje batoh, když se o přepravu stará lanovka?"
trTR = "Kablo yürüyorsa sırt çantasına ne gerek var?"

