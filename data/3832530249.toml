["Building.WaterPipe.Description"]
status = "normal"
raw = "Connects intakes, boosters and outlets. Drag to lay a line or stack it to go up. Its inner light shows the pressure: blue = flowing down by gravity; cyan = plenty of pressure; yellow = 1-2 more levels; red = at the limit; off = no water. Badwater glows green instead of blue."
enUS = "Connects intakes, boosters and outlets. Drag to lay a line or stack it to go up. Its inner light shows the pressure: blue = flowing down by gravity; cyan = plenty of pressure; yellow = 1-2 more levels; red = at the limit; off = no water. Badwater glows green instead of blue."
zhCN = "连接进水口、增压器和出水口。拖动可铺设管线，叠放则可向上延伸。其内部灯光显示压力：蓝色＝靠重力向下流动；青色＝压力充足；黄色＝还需再增加1-2级；红色＝已达极限；熄灭＝没有水。恶水时灯光显示为绿色而非蓝色。"
zhTW = "連接進水口、增壓器與出水口。拖曳可鋪設管線，疊放則可向上延伸。內部燈光顯示壓力：藍色＝靠重力向下流動；青色＝壓力充足；黃色＝還需增加1至2層；紅色＝已達上限；熄滅＝沒有水。含有毒水時，燈光會顯示綠色而非藍色。"
ruRU = "Соединяет водозаборы, усилители и выходы. Протяните линию, чтобы проложить трубу, или сложите её стопкой, чтобы поднять вверх. Внутренний свет показывает давление: синий = вода течёт вниз под действием гравитации; голубой = давления достаточно с избытком; жёлтый = не хватает 1–2 уровней; красный = на пределе; выключен = воды нет. Загрязнённая вода (badwater) светится зелёным вместо синего."
jaJP = "接続口、ブースター、出力口をつなぎます。ドラッグして線を引くか、重ねて上方向に延ばせます。内側のライトが水圧を示します。青＝重力で下に流れている、シアン＝十分な水圧がある、黄色＝あと1～2段階で上限、赤＝上限に達している、消灯＝水がない。汚水の場合、青の代わりに緑に光ります。"
frFR = "Relie les prises d'eau, les amplificateurs et les sorties. Faites glisser pour poser une ligne, ou empilez-la pour monter. Sa lumière intérieure indique la pression : bleu = écoulement vers le bas par gravité ; cyan = pression abondante ; jaune = 1 à 2 niveaux de plus ; rouge = à la limite ; éteint = pas d'eau. L'eau mauvaise fait luire en vert au lieu de bleu."
deDE = "Verbindet Zuläufe, Verstärker und Abläufe. Zum Verlegen einer Leitung ziehen, zum Hochführen übereinanderstapeln. Das innere Licht zeigt den Druck an: Blau = fließt durch Schwerkraft nach unten; Cyan = genug Druck; Gelb = 1-2 Stufen mehr; Rot = am Limit; Aus = kein Wasser. Schlechtwasser leuchtet statt Blau grün."
plPL = "Łączy wloty, wzmacniacze i wyloty. Przeciągnij, aby położyć linię, lub ułóż ją w stos, aby prowadzić ją w górę. Jej wewnętrzne światło pokazuje ciśnienie: niebieski = płynie w dół pod wpływem grawitacji; cyjan = duże ciśnienie; żółty = 1-2 poziomy więcej; czerwony = na granicy; wyłączone = brak wody. Zła woda świeci na zielono zamiast na niebiesko."
ptBR = "Conecta entradas, impulsionadores e saídas. Arraste para traçar uma linha ou empilhe para subir. Sua luz interna mostra a pressão: azul = fluindo para baixo pela gravidade; ciano = muita pressão; amarelo = mais 1-2 níveis; vermelho = no limite; apagada = sem água. A água contaminada brilha em verde em vez de azul."
koKR = "커넥트 인테이크, 부스터, 아웃렛을 연결합니다. 드래그하면 파이프 라인을 깔 수 있고, 쌓으면 위로 올라갑니다. 내부 조명은 수압을 보여 줍니다: 파란색 = 중력에 의해 아래로 흐름, 청록색 = 수압 충분함, 노란색 = 1~2단계 더 필요함, 빨간색 = 한계치, 꺼짐 = 물 없음. 독수(badwater)는 파란색 대신 초록색으로 빛납니다."
trTR = "Girişleri, güçlendiricileri ve çıkışları birbirine bağlar. Hat çizmek için sürükleyin; yukarı çıkmak için üst üste yığın. İç ışığı basıncı gösterir: mavi = yerçekimiyle aşağı akıyor; turkuaz = bol basınç; sarı = 1-2 seviye daha; kırmızı = sınırda; kapalı = su yok. Kötü su (badwater) mavi yerine yeşil yanar."
esES = "Conecta tomas, potenciadores y salidas. Arrastra para tender una línea o apílala para subir. Su luz interior muestra la presión: azul = fluye hacia abajo por gravedad; cian = presión abundante; amarillo = 1-2 niveles más; rojo = en el límite; apagada = sin agua. El agua contaminada brilla en verde en lugar de azul."
itIT = "Collega prese d'acqua, potenziatori e sbocchi. Trascina per tracciare una linea oppure sovrapponila per salire di livello. La sua luce interna mostra la pressione: blu = scorre verso il basso per gravità; ciano = pressione abbondante; giallo = 1-2 livelli in più; rosso = al limite; spenta = nessuna acqua. L'acqua cattiva brilla di verde invece che di blu."
ukUA = "З'єднує водозабірники, підсилювачі та виходи. Перетягніть, щоб прокласти лінію, або складіть її вертикально, щоб піднятися вгору. Внутрішнє світло показує тиск: синій = вода тече вниз під дією гравітації; блакитний = достатньо тиску; жовтий = ще 1-2 рівні; червоний = на межі; вимкнено = немає води. Брудна вода світиться зеленим замість синього."
thTH = "เชื่อมต่อช่องรับน้ำ ตัวเพิ่มแรงดัน และช่องส่งออก ลากเพื่อวางท่อเป็นแนวราบ หรือซ้อนขึ้นเพื่อทำเป็นแนวตั้ง แสงภายในแสดงระดับแรงดัน: สีน้ำเงิน = น้ำไหลลงตามแรงโน้มถ่วง; สีฟ้าอมเขียว = แรงดันเหลือเฟือ; สีเหลือง = ต้องการแรงดันเพิ่มอีก 1-2 ระดับ; สีแดง = อยู่ที่ขีดจำกัด; ปิดไฟ = ไม่มีน้ำ น้ำเสียจะเรืองแสงเป็นสีเขียวแทนสีน้ำเงิน"
csCZ = "Spojuje vstupy, zesilovače a výstupy. Přetažením položíte potrubí v řadě, nebo jej naskládáte a vede nahoru. Jeho vnitřní světlo ukazuje tlak: modrá = voda protéká dolů díky gravitaci; tyrkysová = tlaku je dostatek; žlutá = o 1–2 úrovně více; červená = na limitu; vypnuto = žádná voda. Špinavá voda svítí zeleně místo modré."
viVN = "Kết nối các cửa lấy nước, trạm tăng áp và cửa xả. Kéo để đặt một đường ống hoặc xếp chồng để dẫn lên cao. Đèn bên trong cho biết áp suất: xanh dương = nước chảy xuống nhờ trọng lực; xanh lơ = áp suất dồi dào; vàng = còn thiếu 1-2 cấp áp suất; đỏ = đã ở giới hạn; tắt = không có nước. Nước độc sẽ phát sáng màu xanh lá thay vì xanh dương."
caES = "Connecta preses, reforçadors i sortides. Arrossega per tendir una línia o apila-la per pujar. La seva llum interior mostra la pressió: blau = flueix cap avall per gravetat; cian = molta pressió; groc = 1-2 nivells més; vermell = al límit; apagada = sense aigua. L'aigua fètida es mostra en verd en lloc de blau."
beBY = "Злучае ўваходы, узмацняльнікі і выхады. Перацягніце, каб пракласці лінію, або складзіце яе, каб весці ўверх. Унутранае святло паказвае ціск: сіні = цячэ ўніз пад дзеяннем сілы цяжару; ціры (бірузовы) = ціску даволі; жоўты = яшчэ 1–2 ўзроўні; чырвоны = на мяжы; выключана = вады няма. Брудная вада свеціцца зялёным замест сіняга."
roRO = "Conectează sursele de apă, amplificatoarele și ieșirile. Trage pentru a așeza o linie sau suprapune-o pentru a urca. Lumina sa interioară arată presiunea: albastru = curge în jos din cauza gravitației; cyan = presiune abundentă; galben = 1-2 niveluri în plus; roșu = la limită; stins = fără apă. Apa cu deșeuri toxice strălucește în verde în loc de albastru."
huHU = "Csatlakoztatja a vízbeeresztőket, erősítőket és kimeneteket. Húzással fektethet vezetéket, vagy egymásra építve felfelé is vezetheti. Belső fénye a nyomást jelzi: kék = gravitációval lefelé áramlik; ciánkék = bőséges nyomás; sárga = 1–2 szinttel több nyomás szükséges; piros = a határon van; nincs fény = nincs víz. A mocsaras víz kék helyett zölden világít."
arSA = "يربط بين المداخل والمعززات والمخارج. اسحب لإنشاء خط، أو ارصّه للأعلى لبناء مسار صاعد. يُظهر ضوؤه الداخلي الضغط: الأزرق = المياه تتدفق للأسفل بفعل الجاذبية؛ السماوي = ضغط وفير؛ الأصفر = مستوى أو مستويان إضافيان؛ الأحمر = عند الحد الأقصى؛ مطفأ = لا توجد مياه. تتوهج المياه الملوثة باللون الأخضر بدلاً من الأزرق."

