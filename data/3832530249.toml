["Building.WaterPipeValve.Description"]
status = "normal"
raw = "Place it at a pipe junction. Select it to open or close each outlet: water does not pass through a closed side. The yellow plate marks the front."
enUS = "Place it at a pipe junction. Select it to open or close each outlet: water does not pass through a closed side. The yellow plate marks the front."
zhCN = "放置在管道交叉处。选中它可以开启或关闭每个出口：关闭的一侧不会有水通过。黄色板标记正面。"
zhTW = "在管道交匯處放置它。選取它可開啟或關閉各個出口：關閉的一側不會有水通過。黃色標示板表示正面。"
ruRU = "Установите его на перекрёстке труб. Выберите его, чтобы открыть или закрыть каждый выход: вода не проходит через закрытую сторону. Жёлтая пластина отмечает переднюю сторону."
jaJP = "パイプの分岐点に設置します。選択すると各出口を開閉できます。閉じた側には水が通りません。黄色い板が正面を示します。"
frFR = "Placez-le à une jonction de tuyaux. Sélectionnez-le pour ouvrir ou fermer chaque sortie : l'eau ne passe pas par un côté fermé. La plaque jaune indique l'avant."
deDE = "Platziere es an einer Rohrkreuzung. Wähle es aus, um jeden Auslass zu öffnen oder zu schließen: Wasser fließt nicht durch eine geschlossene Seite. Die gelbe Platte markiert die Vorderseite."
plPL = "Umieść ją na skrzyżowaniu rur wodnych. Kliknij ją, aby otworzyć lub zamknąć każde wyjście: woda nie przepływa przez zamknięty bok. Żółta płytka oznacza przód."
ptBR = "Coloque-o em uma junção de canos. Selecione-o para abrir ou fechar cada saída: a água não passa por um lado fechado. A placa amarela marca a frente."
koKR = "파이프 교차점에 설치하세요. 선택하면 각 출구를 열거나 닫을 수 있습니다. 닫힌 측면으로는 물이 통과하지 않습니다. 노란색 판은 앞면을 표시합니다."
trTR = "Bir boru birleşim noktasına yerleştirin. Her çıkışı açmak veya kapatmak için üzerine tıklayın: kapalı bir yan taraftan su geçmez. Sarı plaka ön tarafı işaretler."
esES = "Colócalo en una unión de tuberías. Selecciónalo para abrir o cerrar cada salida: el agua no pasa por un lateral cerrado. La placa amarilla marca el frente."
itIT = "Posizionalo in corrispondenza di un incrocio di tubature. Selezionalo per aprire o chiudere ciascuna uscita: l'acqua non passa attraverso un lato chiuso. La piastra gialla indica il lato anteriore."
ukUA = "Поставте його на перехрестя труб. Виберіть його, щоб відкрити або закрити кожен вихід: вода не проходить через закриту сторону. Жовта пластина позначає переднію частину."
thTH = "วางไว้ที่จุดต่อของท่อน้ำ เลือกเพื่อเปิดหรือปิดแต่ละทางออก น้ำจะไม่ไหลผ่านด้านที่ปิดอยู่ แผ่นสีเหลืองบอกด้านหน้า"
csCZ = "Umístěte ji na křižovatku potrubí. Výběrem ji můžete otevřít nebo zavřít každý výstup: voda neprochází uzavřenou boční stranou. Žlutá destička označuje přední stranu."
viVN = "Đặt nó tại một giao điểm ống nước. Chọn nó để mở hoặc đóng từng cửa ra: nước không đi qua phía bên nào đang đóng. Tấm kim loại màu vàng đánh dấu mặt trước."
caES = "Col·loqueu-la en una unió de canonades. Seleccioneu-la per obrir o tancar cada sortida: l'aigua no passa per un costat tancat. La placa groga indica el davant."
beBY = "Размясціце яго на скрыжаванні труб. Выберыце яго, каб адкрыць або зачыніць кожны выхад: вада не праходзіць праз зачыненую бок. Жоўтая пласціна пазначае перад."
roRO = "Plasați-l la o intersecție de conducte. Selectați-l pentru a deschide sau a închide fiecare ieșire: apa nu trece printr-o latură închisă. Placa galbenă marchează partea din față."
huHU = "Helyezd egy csőelágazáshoz. Kiválasztásával minden kimenetet nyithatsz vagy zárhatsz: zárt oldalon a víz nem halad át. A sárga lemez jelöli az elülső oldalt."
arSA = "ضعه عند تقاطع الأنابيب. اختره لفتح كل مخرج أو إغلاقه: لا يمر الماء عبر الجانب المغلق. اللوحة الصفراء تحدد الجهة الأمامية."

