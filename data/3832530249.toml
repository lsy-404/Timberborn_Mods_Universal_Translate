["Building.WaterPipeIntake.Description"]
status = "normal"
raw = "Place it on the bank with the overhang above the water. Pipes connect to any of the spouts on its left wall and front; power comes in on the right or from a shaft below it. With power and a worker it pumps water up to 6 levels above the source water. Otherwise it works as a siphon: it can rise 2 levels and only feeds outlets lower than the source water. Select it to choose whether it moves clean water or badwater."
enUS = "Place it on the bank with the overhang above the water. Pipes connect to any of the spouts on its left wall and front; power comes in on the right or from a shaft below it. With power and a worker it pumps water up to 6 levels above the source water. Otherwise it works as a siphon: it can rise 2 levels and only feeds outlets lower than the source water. Select it to choose whether it moves clean water or badwater."
zhCN = "把它放在岸边，让挑檐位于水面上方。管道可连接其左侧墙面和正面的任一出水口；动力可从右侧输入，或从其下方的传动轴输入。有动力并配有一名工人时，它可将水从水源水面向上泵送至最多6层。否则它作为虹吸管工作：可升高2层，且只能向低于水源水面的出水口供水。选中它可选择输送清水还是恶水。"
zhTW = "將它放在岸邊，讓突出的部分位於水面上方。管道可連接其左側與前方的任一出水口；動力可從右側輸入，或從其下方的軸輸入。有動力且有工作者時，它能將水從來源水位向上抽升至多 6 層。否則會以虹吸方式運作：最多可上升 2 層，且只會供水給低於來源水位的出水口。選取它即可選擇要輸送清水還是穢水。"
ruRU = "Установите его на берег так, чтобы навес находился над водой. Трубы подключаются к любому из патрубков на его левой и передней стенках; питание поступает справа или от вала, расположенного под ним. При наличии питания и рабочего он качает воду на 6 уровней выше исходной воды. В противном случае работает как сифон: он может подниматься на 2 уровня и подаёт воду только к выходам, расположенным ниже исходной воды. Выберите его, чтобы определить, будет ли он перекачивать чистую воду или дурную воду."
jaJP = "岸辺で、張り出した部分が水の上に来るように設置してください。パイプは左壁と前面にあるどのスパウトにも接続できます。動力は右側から、または真下にあるシャフトから供給されます。動力と作業員がいる場合、元の水源より6段階上まで水を汲み上げられます。それ以外の場合はサイフォンとして動作し、2段階まで上昇でき、元の水源より低い出口にのみ水を供給します。選択すると、清水と汚水のどちらを移送するかを設定できます。"
frFR = "Placez-le sur la berge, avec le surplomb au-dessus de l'eau. Les tuyaux se connectent à n'importe lequel des becs sur sa paroi gauche et sur sa face avant ; l'énergie arrive par la droite ou depuis un arbre situé en dessous. Avec de l'énergie et un ouvrier, il pompe l'eau jusqu'à 6 niveaux au-dessus de l'eau source. Sinon, il fonctionne comme un siphon : il peut monter de 2 niveaux et n'alimente que les sorties situées plus bas que l'eau source. Sélectionnez-le pour choisir s'il déplace de l'eau propre ou de l'eau impure."
deDE = "Platziere es am Ufer, wobei der Überhang über dem Wasser liegt. Rohre verbinden sich mit jedem der Ausläufe an seiner linken Wand und Vorderseite; Strom kommt von rechts oder von einer Welle unterhalb davon. Mit Strom und einem Arbeiter pumpt es Wasser bis zu 6 Ebenen über das Quellwasser hinauf. Andernfalls arbeitet es als Heber: Es kann 2 Ebenen ansteigen und speist nur Auslässe, die unter dem Quellwasser liegen. Wähle es aus, um festzulegen, ob es sauberes Wasser oder Schlechtwasser befördert."
plPL = "Umieść go na brzegu, tak aby wysunięta część znajdowała się nad wodą. Rury łączą się z dowolnym z wylewów na jego lewej ścianie i przedniej ścianie; zasilanie wchodzi od prawej strony lub z wału znajdującego się pod nim. Z zasilaniem i robotnikiem pompuje wodę w górę o maksymalnie 6 poziomów powyżej źródłowej wody. W przeciwnym razie działa jak syfon: może podnieść wodę o 2 poziomy i zasila wyłącznie wyloty położone niżej niż źródłowa woda. Wybierz go, aby zdecydować, czy przesyła czystą wodę, czy zatrutą wodę."
ptBR = "Posicione-a na margem com a saliência acima da água. Os canos se conectam a qualquer um dos bicos na parede esquerda e na frente; a energia entra pela direita ou por um eixo abaixo dela. Com energia e um trabalhador, ela bombeia água até 6 níveis acima da água da fonte. Caso contrário, funciona como um sifão: pode subir 2 níveis e só alimenta saídas abaixo da água da fonte. Selecione-a para escolher se ela move água limpa ou água contaminada."
koKR = "강 가장자리의 물 위로 돌출부가 오도록 설치하세요. 파이프는 왼쪽 벽과 앞면에 있는 어떤 배출구에든 연결할 수 있습니다. 동력은 오른쪽에서 들어오거나 아래에 있는 축을 통해 공급받을 수 있습니다. 동력과 작업자가 있으면 수원보다 최대 6단계 높은 곳까지 물을 끌어올립니다. 그렇지 않으면 사이펀처럼 작동하며, 최대 2단계까지 올릴 수 있고 수원보다 낮은 배출구에만 물을 공급합니다. 선택하면 깨끗한 물을 이송할지 독성 물을 이송할지 정할 수 있습니다."
trTR = "Suyun üstünde çıkıntısı olacak şekilde kıyıya yerleştirin. Borular, solundaki ve önündeki duvardaki musluklardan herhangi birine bağlanabilir; güç sağdan gelir veya altındaki bir milden sağlanır. Bir işçiyle birlikte güç aldığında, kaynak suyun 6 seviye üstüne kadar su pompalar. Aksi halde sifon gibi çalışır: 2 seviye yükselebilir ve yalnızca kaynak sudan daha alçaktaki çıkışları besler. Temiz suyun mu yoksa zehirli suyun mu taşınacağını seçmek için üzerine tıklayın."
esES = "Colócalo en la orilla, con el saliente sobre el agua. Las tuberías se conectan a cualquiera de los caños de su pared izquierda y de su parte frontal; la energía entra por la derecha o desde un eje situado debajo. Con energía y un trabajador, bombea agua hasta 6 niveles por encima del agua de origen. De lo contrario, funciona como un sifón: puede elevarse 2 niveles y solo alimenta salidas situadas por debajo del agua de origen. Selecciónelo para elegir si mueve agua limpia o agua contaminada."
itIT = "Posizionatelo sulla riva con la sporgenza sopra l'acqua. Le tubature si collegano a qualsiasi bocchetta sulla parete sinistra e su quella frontale; l'energia arriva da destra oppure da un albero posto sotto di esso. Con energia e un lavoratore pompa l'acqua fino a 6 livelli sopra l'acqua della sorgente. Altrimenti funziona come sifone: può salire di 2 livelli e alimenta solo gli sbocchi più bassi dell'acqua della sorgente. Selezionatelo per scegliere se far passare acqua pulita o acqua cattiva."
ukUA = "Установіть його на березі так, щоб навіс був над водою. Труби підключаються до будь-якого з отворів на його лівій і передній стінці; живлення надходить справа або від вала під ним. За наявності живлення та робітника він підіймає воду до 6 рівнів над вихідною водою. В іншому разі працює як сифон: він може піднімати воду на 2 рівні й лише живить виходи, розташовані нижче за вихідну воду. Виберіть його, щоб визначити, чи переміщує він чисту воду чи шкідливу воду."
thTH = "วางมันบนฝั่งโดยให้ส่วนยื่นอยู่เหนือน้ำ ท่อต่อเข้ากับปากท่อใดก็ได้บนผนังด้านซ้ายและด้านหน้า พลังงานเข้าทางด้านขวา หรือจากเพลาที่อยู่ด้านล่าง เมื่อมีพลังงานและคนงาน มันจะสูบน้ำขึ้นได้สูงถึง 6 ระดับจากน้ำต้นทาง มิฉะนั้นจะทำงานเป็นไซฟอน โดยยกน้ำขึ้นได้ 2 ระดับ และจ่ายน้ำได้เฉพาะช่องระบายที่อยู่ต่ำกว่าน้ำต้นทางเท่านั้น เลือกตัวอาคารเพื่อเลือกว่าจะให้ลำเลียงน้ำสะอาดหรือน้ำเสีย"
csCZ = "Umístěte jej na břeh tak, aby převis byl nad vodou. Potrubí se připojuje k libovolnému z výtoků na jeho levé stěně a na přední straně; napájení přichází zprava nebo z hřídele pod ním. S napájením a dělníkem čerpá vodu až do výšky 6 úrovní nad zdrojovou vodou. Jinak funguje jako sifon: dokáže vystoupat o 2 úrovně a napájí pouze výtoky nacházející se níže než zdrojová voda. Vyberte jej, abyste zvolili, zda bude přečištěnou vodu, nebo špinavou vodu."
viVN = "Đặt nó trên bờ với phần nhô ra phía trên mặt nước. Ống dẫn nối với bất kỳ vòi nước nào ở thành bên trái và phía trước; điện đi vào từ bên phải hoặc từ trục truyền động bên dưới nó. Khi có điện và một công nhân, nó bơm nước lên cao tới 6 mức so với mặt nước nguồn. Nếu không, nó hoạt động như ống xifông: có thể dâng lên 2 mức và chỉ cấp nước cho các đầu ra thấp hơn mặt nước nguồn. Chọn nó để quyết định nó dẫn nước sạch hay nước độc."
caES = "Col·loqueu-la a la riba amb el voladís per sobre de l'aigua. Les canonades es connecten a qualsevol dels brolladors de la seva paret esquerra i frontal; la potència arriba per la dreta o des d'un eix situat per sota. Amb potència i un treballador, bomba l'aigua fins a 6 nivells per sobre de l'aigua de la font. En cas contrari, funciona com a sifó: pot elevar-se 2 nivells i només alimenta les sortides més baixes que l'aigua de la font. Seleccioneu-la per triar si mou aigua neta o aigua fètida."
beBY = "Пасадзіце яго на беражок так, каб навес быў над вадой. Трубы падключаюцца да любога з патрубкаў на левай і пярэдняй сценах; магутнасць падводзіцца справа або з вала, размешчанага пад ім. Пры наяўнасці магутнасці і працоўнага ён качае ваду ўверх на 6 узроўняў вышэй за крыніцавую ваду. Інакш ён працуе як сіфон: можа падняцца на 2 ўзроўні і падае толькі ў выхады, размешчаныя ніжэй за крыніцавую ваду. Выберыце яго, каб вызначыць, ці перамяшчае ён чыстую ваду або брудную."
roRO = "Plasați-l pe mal, cu partea proeminentă deasupra apei. Conductele se conectează la oricare dintre ieșirile de pe peretele din stânga și din față; energia intră din dreapta sau de la un ax aflat dedesubt. Cu energie și un lucrător, pompează apa până la 6 niveluri deasupra apei sursei. Altfel, funcționează ca un sifon: poate urca 2 niveluri și alimentează doar ieșirile aflate mai jos decât apa sursei. Selectați-l pentru a alege dacă mută apă curată sau apă contaminată."
huHU = "Helyezd a partra úgy, hogy a kiugró rész a víz fölé nyúljon. A csövek a bal oldali és az elülső falán lévő bármelyik kifolyóhoz csatlakoztathatók; az energia a jobb oldalon érkezik, vagy alulról, egy tengelyről. Árammal és munkással a forrásvíz szintje fölé legfeljebb 6 szintre pumpálja a vizet. Egyébként szifonként működik: legfeljebb 2 szintet tud emelni, és csak a forrásvíznél alacsonyabban lévő kifolyókat látja el. Kijelölve választhatod meg, hogy tiszta vizet vagy mérgező vizet mozgasson."
arSA = "ضعه على الضفة مع بروز الحافة فوق الماء. تتصل الأنابيب بأي من الفوهات الموجودة على الجدار الأيسر والأمامي له؛ تأتي الطاقة من اليمين أو من عمود أسفله. عند توفر الطاقة وعامل، يضخ الماء إلى أعلى بمقدار 6 مستويات فوق مصدر الماء. وإلا فإنه يعمل كسيفون: يمكنه الارتفاع بمقدار مستويين، ولا يغذي إلا المخارج الأدنى من مستوى مصدر الماء. حدده لاختيار ما إذا كان يحرك الماء النظيف أم الماء الملوث."

