["Building.WaterPipeTankInlet.Description"]
status = "normal"
raw = "Place it at the end of a pipe, next to a tank: it fills the tank with the water arriving through the pipe, no beavers carrying it. Clean water is stored as water and badwater as badwater. Every 1 m³ of water makes 1 unit, up to 12 per hour."
enUS = "Place it at the end of a pipe, next to a tank: it fills the tank with the water arriving through the pipe, no beavers carrying it. Clean water is stored as water and badwater as badwater. Every 1 m³ of water makes 1 unit, up to 12 per hour."
zhCN = "将其放置在管道末端、紧挨水塔的位置：它会把经由管道流入的水注入水塔，无需海狸搬运。清水以“水”的形式存储，恶水则以“恶水”的形式存储。每 1 m³ 的水产生 1 单位，每小时最多 12 单位。"
zhTW = "將它放在管道末端、緊鄰水罐的位置：它會把經由管道送來的水注入水罐，無需海狸搬運。清水會以「水」的形式儲存，汙水則以「汙水」的形式儲存。每 1 m³ 的水產生 1 單位，每小時最多可產生 12 單位。"
ruRU = "Установите его в конце трубы, рядом с резервуаром: он будет наполнять резервуар водой, поступающей по трубе, без необходимости переносить её бобрами. Чистая вода сохраняется как вода, а мутная вода (badwater) — как badwater. Каждый 1 м³ воды даёт 1 единицу, до 12 в час."
jaJP = "パイプの末端、タンクの隣に設置してください。運ばれてくる水をビーバーが運ばなくても、パイプを通って届いた水をタンクに満たします。真水は水として、汚水は汚水として貯蔵されます。水1 m³ごとに1単位が作られ、最大で1時間あたり12単位までです。"
frFR = "Placez-le à l'extrémité d'un tuyau, à côté d'un réservoir : il remplit le réservoir avec l'eau qui arrive par le tuyau, sans qu'aucun castor ne la transporte. L'eau propre est stockée en tant qu'eau et l'eau polluée en tant qu'eau polluée. Chaque 1 m³ d'eau produit 1 unité, jusqu'à 12 par heure."
deDE = "Platziere es am Ende eines Rohrs neben einem Tank: Es füllt den Tank mit dem Wasser, das durch das Rohr ankommt, ohne dass Biber es tragen müssen. Sauberes Wasser wird als Wasser und Schlechtwasser als Schlechtwasser gespeichert. Jeder 1 m³ Wasser ergibt 1 Einheit, bis zu 12 pro Stunde."
plPL = "Umieść je na końcu rury, obok zbiornika: wypełnia zbiornik wodą dopływającą rurą, bez udziału bobrów noszących wodę. Czysta woda jest magazynowana jako woda, a zła woda (badwater) jako zła woda. Każdy 1 m³ wody daje 1 jednostkę, do 12 na godzinę."
ptBR = "Coloque-o na extremidade de um cano, ao lado de um tanque: ele enche o tanque com a água que chega pelo cano, sem necessidade de castores para transportá-la. A água limpa é armazenada como água e a água ruim como água ruim. Cada 1 m³ de água gera 1 unidade, até 12 por hora."
koKR = "파이프 끝에, 물탱크 옆에 설치하세요. 파이프를 통해 들어오는 물을 비버가 나르지 않아도 탱크에 채워 줍니다. 깨끗한 물은 물로, 독성 물(badwater)은 독성 물로 저장됩니다. 물 1 m³마다 1 단위가 생성되며, 시간당 최대 12단위까지 만들 수 있습니다."
trTR = "Boruya, bir tankın yanına, borunun ucuna yerleştirin: boruyla gelen suyla tankı doldurur, bunu taşıyan kunduz gerekmez. Temiz su, su olarak; kirli su (badwater) ise kirli su olarak depolanır. Her 1 m³ su 1 birim üretir; saatte en fazla 12 birim."
esES = "Colóquelo al final de una tubería, junto a un depósito: llenará el depósito con el agua que llegue por la tubería, sin necesidad de que los castores la transporten. El agua limpia se almacena como agua y el agua contaminada como agua contaminada. Cada 1 m³ de agua produce 1 unidad, hasta 12 por hora."
itIT = "Posizionala all'estremità di una tubatura, accanto a una cisterna: riempirà la cisterna con l'acqua che arriva dalla tubatura, senza che i castori debbano trasportarla. L'acqua pulita viene immagazzinata come acqua e l'acqua cattiva come acqua cattiva. Ogni 1 m³ di acqua produce 1 unità, fino a 12 all'ora."
ukUA = "Розмістіть його в кінці труби, поруч із резервуаром: він наповнює резервуар водою, що надходить трубою, без участі бобрів, які її переносять. Чиста вода зберігається як вода, а поганa вода (badwater) як badwater. Кожен 1 м³ води дає 1 одиницю, до 12 на годину."
thTH = "วางไว้ที่ปลายท่อ ข้างถัง มันจะเติมถังด้วยน้ำที่ไหลมาตามท่อ โดยไม่ต้องให้บีเวอร์ขนน้ำ น้ำสะอาดจะถูกเก็บเป็นน้ำ และน้ำเสียจะถูกเก็บเป็นน้ำเสีย ทุกน้ำ 1 ลูกบาศก์เมตรจะได้ 1 หน่วย สูงสุด 12 หน่วยต่อชั่วโมง"
csCZ = "Umístěte ji na konec potrubí vedle nádrže: naplní nádrž vodou, která přitéká potrubím, a bobři ji nemusejí nosit. Čistá voda se ukládá jako voda a špinavá voda (badwater) jako badwater. Každý 1 m³ vody vytvoří 1 jednotku, až 12 za hodinu."
viVN = "Đặt nó ở cuối một đường ống, cạnh một bể chứa: nó sẽ đổ vào bể nước đi qua đường ống, không cần hải ly mang nước. Nước sạch được lưu trữ dưới dạng nước và nước độc dưới dạng nước độc. Mỗi 1 m³ nước tạo ra 1 đơn vị, tối đa 12 đơn vị mỗi giờ."
caES = "Col·loqui-la al final d'una canonada, al costat d'un dipòsit: omple el dipòsit amb l'aigua que arriba per la canonada, sense que cap castor la transporti. L'aigua neta s'emmagatzema com a aigua i l'aigua contaminada com a aigua contaminada. Cada 1 m³ d'aigua produeix 1 unitat, fins a 12 per hora."
beBY = "Размесціце яго ў канцы трубы, побач з рэзервуарам: ён запаўняе рэзервуар вадой, якая паступае па трубе, без баброў, што яе пераносяць. Чыстая вада захоўваецца як water, а бадвотэр як badwater. Кожныя 1 м³ вады даюць 1 адзінку, але не больш за 12 у гадзіну."
roRO = "Plasați-l la capătul unei conducte, lângă un rezervor: va umple rezervorul cu apa care sosește prin conductă, fără castori care să o transporte. Apa curată este stocată ca apă, iar apa contaminată ca apă contaminată. Fiecare 1 m³ de apă produce 1 unitate, până la 12 pe oră."
huHU = "Helyezd egy csővezeték végére, egy tartály mellé: a csövön érkező vizet tölti a tartályba, nem kell hozzá vízhordó bóbita. A tiszta víz vízként, a mérgező víz (badwater) badwater-ként tárolódik. Minden 1 m³ víz 1 egységet ad, óránként legfeljebb 12 egységet."
arSA = "ضعها في نهاية أنبوب، بجوار خزان: فهي تملأ الخزان بالمياه القادمة عبر الأنبوب، دون حاجة إلى أن يحملها القنادس. تُخزَّن المياه النظيفة كمياه، والمياه الملوثة كمياه ملوثة. كل 1 م³ من المياه يُنتج وحدة واحدة، بحد أقصى 12 وحدة في الساعة."

