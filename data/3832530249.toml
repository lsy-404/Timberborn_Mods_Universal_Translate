status = "normal"

["Building.WaterPipeTankInlet.Description"]
new = "Place it at the end of a pipe, next to a tank: it fills the tank with the water arriving through the pipe, no beavers carrying it. Clean water is stored as water and badwater as badwater. Every 1 m³ of water makes 1 unit, up to 12 per hour."
status = "normal"

