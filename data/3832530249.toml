["Building.WaterPipeLargeIntake.Description"]
status = "normal"
raw = "Like the pipe intake, but with power and a worker it lifts water up to 12 levels above the source water and moves twice as much. Uses twice the power."
enUS = "Like the pipe intake, but with power and a worker it lifts water up to 12 levels above the source water and moves twice as much. Uses twice the power."
zhCN = "像管道取水口一样，但需要动力和一名工作者。它可将水从水源提升至高于水源12层的位置，且输水量为两倍。耗电量为两倍。"
zhTW = "像管道進水口一樣，但需要動力和一名工作者，它能將水從水源向上提升至多12層，並且輸水量是兩倍。耗用的動力是兩倍。"
ruRU = "Как у впускной трубы, но с питанием и работником она поднимает воду до 12 уровней над источником воды и перекачивает вдвое больше. Потребляет вдвое больше энергии."
jaJP = "パイプ取水口と同様だが、動力と作業員を使い、水源の水面より最大12段上まで水を汲み上げ、2倍の量を移送する。消費する動力は2倍。"
frFR = "Comme l'entrée de tuyau, mais avec de la puissance et un travailleur, elle élève l'eau jusqu'à 12 niveaux au-dessus de l'eau source et déplace deux fois plus d'eau. Consomme deux fois plus de puissance."
deDE = "Wie der Rohreinlass, aber mit Strom und einem Arbeiter hebt er Wasser bis zu 12 Ebenen über dem Quellwasser und bewegt doppelt so viel. Benötigt doppelt so viel Strom."
plPL = "Podobnie jak wlot rury, ale z zasilaniem mechanicznym i pracownikiem podnosi wodę nawet o 12 poziomów powyżej wody źródłowej i przepompowuje dwa razy więcej. Zużywa dwukrotnie więcej energii."
ptBR = "Como a entrada de cano, mas com energia e um trabalhador, ela eleva a água até 12 níveis acima da água da fonte e move o dobro de volume. Usa o dobro da energia."
koKR = "파이프 흡입구와 비슷하지만, 동력과 작업자를 사용하여 수원보다 최대 12단계 높이까지 물을 끌어올리며, 처리량은 두 배입니다. 사용하는 동력은 두 배입니다."
trTR = "Boru girişi gibi, ancak güç ve bir işçiyle çalışır; suyu kaynak suyun 12 seviye üzerine kadar kaldırır ve iki kat fazla su taşır. İki kat fazla güç kullanır."
esES = "Como la toma de tubería, pero con energía y un trabajador, eleva el agua hasta 12 niveles por encima del agua de origen y mueve el doble de caudal. Consume el doble de energía."
itIT = "Come la presa a tubo, ma con alimentazione e un lavoratore, solleva l'acqua fino a 12 livelli sopra l'acqua della fonte e ne sposta il doppio. Consuma il doppio dell'energia."
ukUA = "Як і впускний отвір труби, але з живленням і працівником він піднімає воду на 12 рівнів вище за джерело води та переміщує вдвічі більше. Споживає вдвічі більше енергії."
thTH = "เหมือนท่อดูดน้ำ แต่มีพลังงานและคนงานช่วยยกน้ำขึ้นได้สูงสุด 12 ระดับจากแหล่งน้ำ และเคลื่อนย้ายน้ำได้เป็นสองเท่า ใช้พลังงานเป็นสองเท่า"
csCZ = "Podobně jako vodní přívod, ale s napájením a pracovníkem zvedá vodu až o 12 úrovní nad zdrojovou vodu a přečerpá dvakrát tolik. Spotřebovává dvojnásobek energie."
viVN = "Giống như cửa lấy nước ống dẫn, nhưng có thêm năng lượng và một công nhân, nó có thể nâng nước lên cao tới 12 tầng so với nguồn nước và di chuyển lượng nước gấp đôi. Tiêu thụ gấp đôi năng lượng."
caES = "Com la captació de canonada, però amb energia i un treballador, eleva l'aigua fins a 12 nivells per sobre de l'aigua de font i mou el doble de quantitat. Utilitza el doble d'energia."
beBY = "Як і труба-ўваход, але з сілай і працаўніком ён падымае ваду на 12 узроўняў вышэй за крыніцу вады і перамяшчае ўдвая больш. Выкарыстоўвае ўдвая больш энергіі."
roRO = "Ca intrarea de țeavă, dar cu energie și un lucrător, ridică apa cu până la 12 niveluri peste apa sursă și mută de două ori mai multă apă. Consumă de două ori mai multă energie."
huHU = "Mint a csőbemenet, de energiával és munkással emeli a vizet akár 12 szinttel a forrásvíz fölé, és kétszer annyit mozgat. Kétszer annyi energiát használ."
arSA = "مشابهة لمدخل الأنابيب، لكنها تعمل بالطاقة وبوجود عامل، وترفع الماء حتى 12 مستوى فوق مستوى الماء في المصدر، وتنقل ضعف الكمية. تستهلك ضعف الطاقة."

