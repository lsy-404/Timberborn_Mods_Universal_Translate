thTH = "ทำไมต้องแบกถังน้ำ ในเมื่อแม่น้ำเดินไปเองได้"
csCZ = "Proč nosit kbelíky, když si řeka dokáže přijít sama?"
viVN = "Sao phải xách xô khi con sông có thể tự chảy đi đâu được?"
caES = "Per què portar cubs quan el riu pot caminar sol?"
beBY = "Навошта носіць вёдры, калі рака можа сама прыйсці?"
