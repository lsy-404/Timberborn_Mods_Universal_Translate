[_meta]
name = "Water Pipes"

["Building.WaterPipe.DisplayName"]
new = "Water pipe"
status = "normal"

["Building.WaterPipe.Description"]
new = "Connects intakes, boosters and outlets. Drag to lay a line or stack it to go up. Its inner light shows the pressure: blue = flowing down by gravity; cyan = plenty of pressure; yellow = 1-2 more levels; red = at the limit; off = no water. Badwater glows green instead of blue."
status = "normal"

["Building.WaterPipe.FlavorDescription"]
new = "Why carry buckets when the river can walk itself?"
status = "normal"

["Building.WaterPipeIntake.DisplayName"]
new = "Pipe intake"
status = "normal"

["Building.WaterPipeIntake.Description"]
new = "Place it on the bank with the overhang above the water. Pipes connect to any of the spouts on its left wall and front; power comes in on the right. With power and a worker it pumps water up to 6 levels above the source water. Otherwise it works as a siphon: it can rise 2 levels and only feeds outlets lower than the source water. Select it to choose whether it moves clean water or badwater."
status = "normal"

["Building.WaterPipeIntake.FlavorDescription"]
new = "Sip from here, pour over there."
status = "normal"

["Building.WaterPipeLargeIntake.DisplayName"]
new = "Large pipe intake"
status = "normal"

["Building.WaterPipeLargeIntake.Description"]
new = "Like the pipe intake, but with power and a worker it lifts water up to 12 levels above the source water and moves twice as much. Uses twice the power."
status = "normal"

["Building.WaterPipeLargeIntake.FlavorDescription"]
new = "More muscle, more height."
status = "normal"

["Building.WaterPipeBooster.DisplayName"]
new = "Booster pump"
status = "normal"

["Building.WaterPipeBooster.Description"]
new = "Place it in the middle of a pipe. When powered it adds 6 levels to the pressure of the water passing through; several boosters add up. No worker needed."
status = "normal"

["Building.WaterPipeBooster.FlavorDescription"]
new = "A little push halfway there."
status = "normal"

["Building.WaterPipeOutlet.DisplayName"]
new = "Pipe outlet"
status = "normal"

["Building.WaterPipeOutlet.Description"]
new = "Place it at the end of a pipe in any orientation: its mouth faces away on its own and the water pours out right in front of it."
status = "normal"

["Building.WaterPipeOutlet.FlavorDescription"]
new = "Everything that goes in must come out."
status = "normal"

