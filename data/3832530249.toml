["Building.WaterPipeBooster.Description"]
status = "normal"
raw = "Place it in the middle of a pipe. When powered it adds 6 levels to the pressure of the water passing through; several boosters add up. No worker needed."
enUS = "Place it in the middle of a pipe. When powered it adds 6 levels to the pressure of the water passing through; several boosters add up. No worker needed."
zhCN = "将其放置在管道中间。通电后，它会为经过的水增加6级压力；多个增压器可叠加效果。无需工人。"
zhTW = "將它放在管道的中段。通電時，會為流經的水增加 6 級壓力；多個增壓器可以疊加。不需要工作的居民。"
ruRU = "Установите его посреди трубы. При питании он добавляет 6 уровней давления проходящей через него воде; несколько усилителей складываются. Работник не нужен."
jaJP = "パイプの途中に設置してください。動力が供給されている間、通過する水の圧力レベルを6段階上昇させます。複数設置すると効果が累積します。作業員は必要ありません。"
frFR = "Placez-le au milieu d'un tuyau. Lorsqu'il est alimenté, il ajoute 6 niveaux de pression à l'eau qui traverse le tuyau ; plusieurs surpresseurs se cumulent. Aucun travailleur n'est nécessaire."
deDE = "Platziere es in der Mitte einer Leitung. Wenn es mit Strom versorgt wird, erhöht es den Druck des durchfließenden Wassers um 6 Stufen; mehrere Verstärker addieren sich. Es benötigt keinen Arbeiter."
plPL = "Umieść go w środku rury. Po zasileniu dodaje 6 poziomów do ciśnienia przepływającej wody; kilka wzmacniaczy sumuje się. Nie wymaga pracownika."
ptBR = "Coloque-o no meio de um cano. Quando alimentado, ele adiciona 6 níveis à pressão da água que passa por ele; vários impulsionadores se somam. Não precisa de trabalhador."
koKR = "파이프 중간에 설치하세요. 전력이 공급되면 통과하는 물의 압력을 6단계 높이며, 여러 개의 부스터를 설치하면 효과가 누적됩니다. 작업자는 필요하지 않습니다."
trTR = "Boruya ortasına yerleştirin. Güç verildiğinde, içinden geçen suyun basıncına 6 seviye ekler; birden fazla güçlendirici birbirine eklenir. Çalışan işçi gerekmez."
esES = "Colóquelo en medio de una tubería. Cuando recibe energía, añade 6 niveles a la presión del agua que pasa por ella; varios impulsores se suman. No necesita trabajador."
itIT = "Collocala al centro di una condotta. Quando alimentato, aggiunge 6 livelli alla pressione dell'acqua che vi passa attraverso; più potenziatori si sommano. Non richiede lavoratori."
ukUA = "Розмістіть його посеред труби. Коли він отримує живлення, він додає 6 рівнів тиску до води, що проходить через нього; кілька підсилювачів підсумовуються. Робітник не потрібен."
thTH = "วางไว้กลางท่อ เมื่อมีพลังงาน จะเพิ่มระดับแรงดันของน้ำที่ไหลผ่านอีก 6 ระดับ หากมีหลายตัวจะเพิ่มรวมกัน ไม่ต้องใช้คนงาน"
csCZ = "Umístěte jej doprostřed potrubí. Když je napájen, přidává k tlaku procházející vody 6 úrovní; více zesilovačů se sčítá. Není potřeba žádný dělník."
viVN = "Đặt nó ở giữa một đường ống. Khi có điện, nó tăng thêm 6 cấp áp suất cho nước chảy qua; nhiều bộ tăng áp cộng dồn với nhau. Không cần thợ vận hành."
caES = "Col·loqueu-lo al mig d'una canonada. Quan té energia, afegeix 6 nivells a la pressió de l'aigua que hi passa; diversos impulsors se sumen. No necessita cap treballador."
beBY = "Змесціце яго ў сярэдзіне трубы. Пры падачы энергіі ён дадае 6 узроўняў ціску да вады, што праходзіць праз яго; некалькі падсілкавальнікаў складаюцца. Працаўнік не патрэбны."
roRO = "Plasați-l în mijlocul unei conducte. Când este alimentat cu energie, adaugă 6 niveluri la presiunea apei care trece prin el; mai mulți amplificatori se adună. Nu necesită muncitor."
huHU = "Helyezd egy csővezeték közepére. Működés közben 6 szinttel növeli a rajta átfolyó víz nyomását; több fokozó összeadódik. Nincs szükség munkásra."
arSA = "ضعه في منتصف الأنبوب. عند تزويده بالطاقة يضيف 6 مستويات إلى ضغط الماء المار عبره، وتتراكم تأثيرات عدة معززات. لا يحتاج إلى عامل."

