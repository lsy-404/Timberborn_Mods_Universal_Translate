["Building.WaterPipeOutlet.Description"]
status = "normal"
raw = "Place it at the end of a pipe in any orientation: its mouth faces away on its own and the water pours out right in front of it."
enUS = "Place it at the end of a pipe in any orientation: its mouth faces away on its own and the water pours out right in front of it."
zhCN = "将它放在管道末端，任意朝向均可：其出口会自动朝向远离管道的方向，水会直接从它前方流出。"
zhTW = "將它放在水管末端，無論朝向如何都可以：它的出口會自動朝外，水會直接從它前方流出。"
ruRU = "Установите его в конце трубы в любой ориентации: его отверстие само повернётся в сторону от трубы, и вода будет выливаться прямо перед ним."
jaJP = "パイプの末端に、向きを問わず設置できます。吐き出し口は自動的に外側を向き、水はそのすぐ前に流れ出ます。"
frFR = "Placez-le à l'extrémité d'un tuyau, quelle que soit son orientation : sa bouche s'oriente toute seule vers l'extérieur et l'eau se déverse juste devant elle."
deDE = "Platziere es am Ende einer Rohrleitung in beliebiger Ausrichtung: Seine Öffnung zeigt von selbst weg, und das Wasser fließt direkt vor ihr heraus."
plPL = "Umieść go na końcu rury w dowolnej orientacji: jego wylot sam ustawia się w odpowiednim kierunku, a woda wylewa się tuż przed nim."
ptBR = "Coloque-o na extremidade de um cano em qualquer orientação: a boca se direciona para longe sozinha e a água sai bem à frente dela."
koKR = "파이프 끝에 어떤 방향으로든 설치하세요. 출구는 스스로 바깥쪽을 향하며, 물이 바로 앞으로 쏟아져 나옵니다."
trTR = "Bir borunun ucuna her yönde yerleştirebilirsiniz: ağzı kendiliğinden uzağa bakar ve su tam önünde dışarı akar."
esES = "Colócalo al final de una tubería en cualquier orientación: su boca se orienta sola hacia fuera y el agua sale justo frente a ella."
itIT = "Posizionala alla fine di una tubatura in qualsiasi orientamento: la sua bocca si volge automaticamente lontano da essa e l'acqua fuoriesce proprio davanti a lei."
ukUA = "Розмістіть його в кінці труби в будь-якій орієнтації: його отвір сам спрямується від вас, і вода виливатиметься прямо перед ним."
thTH = "วางไว้ที่ปลายท่อใดก็ได้ในทิศทางใดก็ได้ ปากของมันจะหันออกไปเองโดยอัตโนมัติ และน้ำจะไหลออกมาตรงหน้ามันพอดี"
csCZ = "Umístěte jej na konec potrubí v libovolné orientaci: jeho ústí se samo nasměruje pryč a voda vytéká přímo před ním."
viVN = "Đặt nó ở cuối một đường ống theo bất kỳ hướng nào: miệng ống tự động quay ra xa, và nước sẽ chảy ra ngay phía trước nó."
caES = "Col·loqueu-la a l'extrem d'una canonada en qualsevol orientació: la seva boca s'orienta sola cap a fora i l'aigua surt just davant seu."
beBY = "Размяшчайце яго ў канцы труby ў любой арыентацыі: яго отвор сам паварочваецца ад вас, і вада выцякае проста перад ім."
roRO = "Plasați-o la capătul unei conducte, în orice orientare: gura ei se îndreaptă singură în direcția opusă, iar apa se revarsă chiar în fața ei."
huHU = "Helyezd egy cső végére, tetszőleges irányban: a szája magától elfordul, és a víz közvetlenül előtte ömlik ki."
arSA = "ضعه في نهاية الأنبوب بأي اتجاه: سيتجه فمه بعيدًا من تلقاء نفسه، وسينصبّ الماء مباشرةً أمامه."

