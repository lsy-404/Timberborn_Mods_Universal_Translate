["Knatte.IrrigationTower.FlavorDescription"]
raw = "With less than a third of Earth covered in water, irrigation became a must."
enUS = "With less than a third of Earth covered in water, irrigation became essential."
zhCN = "在干旱的日子里，灌溉塔还是很有必要的。"
zhTW = "由於地球上不到三分之一的面積被水覆蓋，灌溉變得必不可少。"
ruRU = "С учетом того, что менее трети Земли покрыто водой, орошение стало необходимостью."
jaJP = "地球の3分の1未満が水に覆われているため、灌漑は必須となりました。"
frFR = "Avec moins d'un tiers de la Terre recouvert d'eau, l'irrigation est devenue nécessaire."
deDE = "Mit weniger als einem Drittel der Erde, das mit Wasser bedeckt ist, wurde Bewässerung notwendig."
plPL = "Mniej niż jedna trzecia Ziemi jest pokryta wodą, dlatego nawadnianie stało się koniecznością."
ptBR = "Com menos de um terço da Terra coberto por água, a irrigação se tornou uma necessidade."
koKR = "지구의 3분의 1도 안 되는 면적이 물로 덮여있어, 관개는 필수가 되었습니다."
trTR = "Yerin üçte birinden azı suyla kaplıyken, sulama zorunluluk haline geldi."
esES = "Con menos de un tercio de la Tierra cubierto por agua, el riego se volvió imprescindible."
itIT = "Con meno di un terzo della Terra coperto d'acqua, l'irrigazione è diventata una necessità."
ukUA = "Менше ніж третина Землі покрита водою, тож зрошення стало необхідністю."
thTH = "น้อยกว่าหนึ่งในสามของพื้นผิวโลกที่ปกคลุมด้วยน้ำ การชลประทานจึงกลายเป็นสิ่งจำเป็น"
csCZ = "S méně než třetinou Země pokrytou vodou se zavlažování stalo nezbytností."
viVN = "Với chưa tới một phần ba diện tích Trái Đất được bao phủ bởi nước, việc tưới tiêu đã trở thành bắt buộc."
caES = "Amb menys d'una tercera part de la Terra coberta per aigua, el reg es va convertir en una necessitat."
beBY = "Са менш чым траццю Зямлі, пакрытай вадой, ірыгацыя стала неабходнасцю."
roRO = "Cu mai puțin de o treime din Pământ acoperit de apă, irigarea a devenit o necesitate."
huHU = "A Föld vízzel borított területe harmadánál is kevesebb, ezért az öntözés elengedhetetlenné vált."
arSA = "أقل من ثلث الأرض مغطى بالمياه، لذلك أصبحت الري ضرورة لا غنى عنها."

