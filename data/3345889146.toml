["Knatte.BigIrrigationTowerIT.Description"]
raw = "Irrigates even More land around it for less Water. \nBlue Pipe indicate starting point of irrigation.\nDoes not use water for tiles that it cant Irrigate"
enUS = "Irrigates even more land around it for less water.  \nBlue pipe indicates the starting point of irrigation.  \nDoes not use water for tiles that it can't irrigate."
zhCN = "灌溉面积非常巨大。耗水量与灌溉面积相关。<br><color=#FFA500>只能灌溉同一平面且不被地形起伏分隔的土地。</color>"
zhTW = "為了更少的水灌溉更多的土地。  \n藍色管道表示灌溉的起始點。  \n不會對無法灌溉的區域使用水。"
ruRU = "Орошает еще больше земли вокруг себя за меньшее количество воды.  \nСиняя труба указывает начальную точку орошения.  \nНе использует воду для плит, которые не может орошать."
jaJP = "周囲の土地をより多く、少ない水で灌漑します。  \n青いパイプは灌漑の開始点を示します。  \n灌漑できないタイルには水を使用しません。"
frFR = "Irrigue encore plus de terres autour d'elle pour moins d'eau.  \nLe tuyau bleu indique le point de départ de l'irrigation.  \nN'utilise pas d'eau pour les carreaux qu'elle ne peut pas irriguer."
deDE = "Bewässert sogar noch mehr Land darum für weniger Wasser.  \nDer blaue Rohr zeigt den Ausgangspunkt der Bewässerung an.  \nVerwendet kein Wasser für Fliesen, die es nicht bewässern kann."
plPL = "Nawadnia jeszcze więcej ziemi wokół siebie przy mniejszym zużyciu wody. \nNiebieska rura wskazuje punkt początkowy nawadniania. \nNie używa wody do płytek, których nie może nawodnić."
ptBR = "Irriga ainda mais terras ao seu redor com menos água.  \nO tubo azul indica o ponto de partida da irrigação.  \nNão usa água para áreas que não pode irrigar."
koKR = "주위의 더 많은 땅을 적은 물로 관개합니다. \n파란 파이프는 관개의 시작점을 나타냅니다. \n관개할 수 없는 타일에는 물을 사용하지 않습니다."
trTR = "Etrafındaki daha fazla alanı daha az suyla suluyor. \nMavi Boru, sulamanın başlangıç noktasını gösterir. \nSulayamadığı karolar için su kullanmaz."
esES = "Riega más terreno a su alrededor con menos agua.\nLas tuberías azules indican el punto de inicio del riego.\nNo usa agua en las casillas que no puede regar."
itIT = "Irriga anche più terreno intorno a sé con meno acqua.\nIl tubo blu indica il punto di partenza dell'irrigazione.\nNon usa acqua per le piastrelle che non riesce a irrigare"
ukUA = "Зрошує більше земель навколо себе за меншу кількість води. \nСиня труба позначає початкову точку зрошення.\nНе витрачає воду на ділянки, які не може зрошувати"
thTH = "รดน้ำพื้นที่รอบตัวได้มากขึ้นกว่าเดิมด้วยน้ำที่น้อยลง\nท่อสีน้ำเงินแสดงจุดเริ่มต้นของการรดน้ำ\nจะไม่ใช้น้ำกับไทล์ที่ไม่สามารถรดน้ำได้"
csCZ = "Zavlažuje ještě více pozemků kolem sebe s menší spotřebou vody. \nModrá trubka označuje výchozí bod zavlažování. \nNepoužívá vodu na dlaždice, které nemůže zavlažit."
viVN = "Tưới nước cho nhiều đất quanh nó hơn nữa với lượng nước ít hơn.\nỐng màu xanh cho biết điểm bắt đầu tưới.\nKhông sử dụng nước cho các ô đất mà nó không thể tưới."
caES = "Reg més terreny al seu voltant amb menys aigua. \nEl tub blau indica el punt d'inici del reg.\nNo utilitza aigua per a les caselles que no pot regar"
beBY = "Палівае больш зямлі вакол сябе пры меншай колькасці вады.\nСіняя труба пазначае пачатковую кропку арашэння.\nНе выкарыстоўвае ваду для клетак, якія не можа арашаць."
roRO = "Irigă mai multă teren din jur cu mai puțină apă. \nConducta albastră indică punctul de start al irigării.\nNu folosește apă pentru plăcile pe care nu le poate iriga"
huHU = "Több földet öntöz a környezetében, kevesebb vízzel.\nA kék cső jelzi az öntözés kezdőpontját.\nNem használ vizet azokhoz a mezőkhöz, amelyeket nem tud megöntözni."
arSA = "تروي مساحة أكبر من الأرض حولها بكمية أقل من الماء.\nيشير الأنبوب الأزرق إلى نقطة بداية الري.\nلا تستهلك الماء على المربعات التي لا تستطيع ريّها."

