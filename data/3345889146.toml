["Knatte.IrrigationTower.Description"]
raw = "Irrigates land around it.\nDoes not use water for tiles that it can't Irrigate"
enUS = "Irrigates the land around it. Does not use water for tiles that it can't irrigate."
zhCN = "灌溉周围的土地。耗水量与灌溉面积相关。<br><color=#FFA500>只能灌溉同一平面且不被地形起伏分隔的土地。</color>"
zhTW = "灌溉周圍的土地。  \n不使用無法灌溉的瓷磚用水。"
ruRU = "Орошает землю вокруг себя. Не использует воду для плитки, которую не может орошать."
jaJP = "周囲の土地に灌漑します。灌漑できないタイルのために水を使用しません。"
frFR = "Irrigue les terres autour.  \nN'utilise pas d'eau pour les dalles qu'elle ne peut pas irriguer."
deDE = "Bewässert das Land um sich herum. Verwendet kein Wasser für Fliesen, die es nicht bewässern kann."
plPL = "Nawadnia teren wokół siebie.  \nNie używa wody do płytek, które nie mogą być nawadniane."
ptBR = "Irriga a terra ao seu redor.  \nNão usa água para azulejos que não pode irrigar."
koKR = "주변의 땅을 관개합니다. 관개할 수 없는 타일에는 물을 사용하지 않습니다."
trTR = "Çevresindeki toprağı sulamak için kullanılır. Sulanamayacak olan kareler için su kullanılmaz."
esES = "Riega el terreno que lo rodea.\nNo usa agua en las casillas que no puede regar."
itIT = "Irriga il terreno circostante.\nNon utilizza acqua per i tasselli che non può irrigare"
ukUA = "Зрошує навколишні ділянки землі.\nНе використовує воду для ділянок, які не може зрошувати"
thTH = "ชลประทานพื้นที่รอบตัวมัน\nไม่ใช้น้ำกับไทล์ที่มันไม่สามารถชลประทานได้"
csCZ = "Zavlažuje okolní půdu.\nNepoužívá vodu na dlaždice, které nemůže zavlažit."
viVN = "Tưới đất xung quanh nó.\nKhông sử dụng nước cho các ô đất mà nó không thể tưới."
caES = "Reega les cases del voltant.\nNo utilitza aigua per a les cases que no pot reegar."
beBY = "Паліўе навакольныя ўчасткі.\nНе выкарыстоўвае ваду для пляцовак, якія яно не можа паліваць"
roRO = "Irigă terenul din jur.\nNu consumă apă pentru plăcile pe care nu le poate iriga"
huHU = "Öntözi a körülötte lévő területet.\nNem használ vizet olyan mezőkhöz, amelyeket nem tud öntözni."
arSA = "يروي الأرض المحيطة به.\nلا يستهلك المياه للبلاط الذي لا يستطيع ريّه"

