viVN = "Với ít hơn một phần ba diện tích Trái Đất được phủ nước, tưới tiêu đã trở thành điều bắt buộc."
caES = "Amb menys d'una tercera part de la Terra coberta d'aigua, el reg va esdevenir indispensable."
