ruRU = "Орощает еще большую площадь вокруг себя с меньшим количеством воды. Желтая труба указывает на начальную точку орошения. Не использует воду для плиток, которые не может орошать."
jaJP = "それは、少ない水で周囲の土地をさらに灌漑します。  \n黄色のパイプは灌漑の開始点を示します。  \n灌漑できないタイルには水を使用しません。"
frFR = "Irrigue encore plus de terres autour de lui pour moins d'eau. \nLe tuyau jaune indique le point de départ de l'irrigation. \nN'utilise pas d'eau pour les tuiles qu'il ne peut pas irriguer."
deDE = "Bewässert sogar mehr Land um sich herum mit weniger Wasser. \nGelbe Rohre zeigen den Startpunkt der Bewässerung an. \nVerwendet kein Wasser für Fliesen, die es nicht bewässern kann."
plPL = "Nawadnia jeszcze więcej ziemi wokół siebie przy mniejszym zużyciu wody. Żółta rura wskazuje punkt początkowy nawadniania. Nie wykorzystuje wody do płytek, których nie może nawodnić."
ptBR = "Irriga ainda mais terra ao redor por menos água.  \nO tubo amarelo indica o ponto de partida da irrigação.  \nNão utiliza água para áreas que não pode irrigar."
koKR = "주변 토지를 더 적은 물로 더 많은 면적을 관개합니다.  \n노란 파이프는 관개의 시작점을 표시합니다.  \n관개할 수 없는 타일에는 물을 사용하지 않습니다."
trTR = "Etrafındaki daha fazla alanı daha az su ile sulamaktadır.  \nSarı boru, sulama başlangıç noktasını gösterir.  \nSulayamayacağı karolar için su kullanmaz."
esES = "Riega aún más terreno a su alrededor con menos agua.\nEl tubo amarillo indica el punto de inicio del riego.\nNo usa agua en las casillas que no puede regar."
itIT = "Irriga anche più terreno intorno a sé con meno acqua.\nIl tubo giallo indica il punto di partenza dell'irrigazione.\nNon usa acqua per le caselle che non può irrigare"
ukUA = "Зрошує ще більше земель навколо себе, витрачаючи менше води. \nЖовта труба вказує на початок зрошення.\nНе витрачає воду на ділянки, які не може зрошувати"
thTH = "ชลประทานพื้นที่รอบๆ ได้มากขึ้นโดยใช้น้ำน้อยลง\nท่อสีเหลืองแสดงจุดเริ่มต้นของการชลประทาน\nจะไม่ใช้น้ำกับช่องที่ไม่สามารถชลประทานได้"
csCZ = "Zavlažuje ještě více půdy kolem sebe za méně vody.  \nŽlutá trubka označuje výchozí bod zavlažování.  \nNepoužívá vodu na dlaždice, které nemůže zavlažovat."
viVN = "Tưới nhiều đất hơn quanh nó với lượng nước ít hơn.\nỐng màu vàng cho biết điểm bắt đầu tưới.\nKhông dùng nước cho các ô đất mà nó không thể tưới."
caES = "Reg més terreny al seu voltant amb menys aigua. \nEl tub groc indica el punt d'inici del reg.\nNo utilitza aigua per a les caselles que no pot regar"
beBY = "Зрашае яшчэ больш зямлі вакол сябе пры меншым расходзе вады.\nЖоўтая труба паказвае пачатковую кропку зрашэння.\nНе выкарыстоўвае ваду на ўчасткі, якія не можа зрашаць."
roRO = "Irigă și mai mult teren din jur, cu mai puțină apă.\nConducta galbenă indică punctul de start al irigării.\nNu consumă apă pentru plăcile pe care nu le poate iriga."
huHU = "Több területet locsol be maga körül kevesebb vízzel. \nA sárga cső jelöli az öntözés kezdőpontját.\nNem használ vizet azokra a mezőkre, amelyeket nem tud megöntözni"
arSA = "يروي مساحة أكبر من الأرض حوله باستخدام كمية أقل من الماء. \nيشير الأنبوب الأصفر إلى نقطة بداية الري.\nلا يستهلك الماء على المربعات التي لا يستطيع ريها."

