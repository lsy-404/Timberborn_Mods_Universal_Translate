["Knatte.IrrigationTowerV2_FT.Description"]
raw = "Irrigates More land around it and can boost tree growth with extract.\nDoes not use water for tiles that it can't Irrigate"
enUS = "Irrigates more land around it and can boost tree growth with extract. Does not use water for tiles that it can't irrigate."
zhCN = "拥有更大的灌溉面积，且能使用提取物促进作物和树木成长。耗水量与灌溉面积相关。<br><color=#FFA500>只能灌溉同一平面且不被地形起伏分隔的土地。</color>"
zhTW = "灌溉周圍更多的土地，並且可以通過提取來促進樹木生長。對於無法灌溉的磚塊，則不使用水源。"
ruRU = "Орошает больше земли вокруг себя и может способствовать росту деревьев с помощью экстракта. Не использует воду для участков, которые не может орошать."
jaJP = "周囲のより多くの土地を灌漑し、エキスで樹木の成長を促進できます。灌漑できないタイルには水を使用しません。"
frFR = "Irrigue plus de terres autour de lui et peut favoriser la croissance des arbres avec un extrait. N'utilise pas d'eau pour des tuiles qu'il ne peut pas irriguer."
deDE = "Bewässert mehr Land um sich herum und kann das Baumwachstum mit Extrakt steigern. Verwendet kein Wasser für Fliesen, die es nicht bewässern kann."
plPL = "Nawadnia więcej ziemi wokół siebie i może wspierać wzrost drzew za pomocą ekstraktu. Nie używa wody do płytek, których nie może nawodnić."
ptBR = "Irriga mais terras ao seu redor e pode impulsionar o crescimento das árvores com extrato. Não usa água para tiles que não pode irrigar."
koKR = "주변의 더 많은 땅을 관개하며 추출물로 나무 성장에 도움을 줄 수 있습니다.\n관개할 수 없는 타일에 대해서는 물을 사용하지 않습니다."
trTR = "Çevresindeki daha fazla arazinin sulanmasını sağlar ve ağaç büyümesini artırabilir. Sulayamadığı karolar için su kullanmaz."
esES = "Riega más terreno a su alrededor y puede acelerar el crecimiento de los árboles con extracto.\nNo gasta agua en las casillas que no puede regar."
itIT = "Irriga più terreno attorno a sé e può potenziare la crescita degli alberi con estratto.\nNon consuma acqua per le piastrelle che non riesce a irrigare"
ukUA = "Зрошує більшу площу земель навколо себе і може прискорювати ріст дерев за допомогою екстракту.\nНе витрачає воду на ділянки, які не може зрошувати."
thTH = "รดน้ำพื้นที่รอบตัวมากขึ้น และสามารถเร่งการเติบโตของต้นไม้ด้วยสารสกัดได้\nจะไม่ใช้น้ำกับไทล์ที่ไม่สามารถรดน้ำได้"
csCZ = "Zavlažuje větší plochu kolem sebe a může urychlit růst stromů s pomocí extraktu. Nevyužívá vodu na dlaždice, které nemůže zavlažovat."
viVN = "Tưới nước cho nhiều diện tích đất quanh nó và có thể thúc đẩy sự tăng trưởng của cây bằng chiết xuất.\nKhông sử dụng nước cho các ô đất mà nó không thể tưới"
caES = "Reg més terreny al seu voltant i pot potenciar el creixement dels arbres amb extracte.\nNo utilitza aigua per a les rajoles que no pot regar."
beBY = "Палівае больш зямлі вакол сябе і можа паскорыць рост дрэў пры дапамозе экстракту.\nНе выкарыстоўвае ваду на плітках, якія не можа паліваць."
roRO = "Irigă mai mult teren în jurul său și poate stimula creșterea copacilor cu extract.\nNu consumă apă pentru plăcile pe care nu le poate iriga"
huHU = "Öntözi a körülötte lévő nagyobb területet, és kivonattal gyorsíthatja a fák növekedését.\nNem használ vizet olyan csempékhez, amelyeket nem tud öntözni."
arSA = "يروي مساحة أكبر من الأرض حولها، ويمكنه تعزيز نمو الأشجار باستخدام المستخلص.\nلا يستهلك الماء للبلاطات التي لا يستطيع ريّها."

