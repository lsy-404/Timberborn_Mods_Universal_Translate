["Knatte.IrrigationTowerV2_IT.Description"]
raw = "Irrigates around it without any worker needed. For more Water usage it also blocks contamination.\nDoes not use water for tiles that it can't Irrigate"
enUS = "Irrigates around it without the need for any workers. It also prevents contamination for increased water usage. It does not use water for tiles that it cannot irrigate."
zhCN = "消耗能量实现自动运转，且能阻止土壤污染。耗水量与灌溉面积相关。<br><color=#FFA500>只能灌溉同一平面且不被地形起伏分隔的土地。</color>"
zhTW = "在周圍灌溉，無需任何工人。為了增加水的使用，它還能阻止污染。對於無法灌溉的瓷磚不會使用水。"
ruRU = "Орошает вокруг без необходимости в работниках. Для большего использования воды также предотвращает загрязнение. Не использует воду для плитки, которую не может орошать."
jaJP = "労働者を必要とせずに周囲を灌漑します。より多くの水を使用するために、汚染を防ぎます。灌漑できないタイルには水を使用しません。"
frFR = "Irrigue autour de lui sans aucun travailleur nécessaire. Pour un usage accru de l'eau, il bloque également la contamination. N'utilise pas d'eau pour les tuiles qu'il ne peut pas irriguer."
deDE = "Bewässert die Umgebung ohne benötigte Arbeiter. Für einen höheren Wasserverbrauch blockiert es auch die Kontamination. Verwendet kein Wasser für Fliesen, die es nicht bewässern kann."
plPL = "Nawadnia wokół siebie bez potrzeby zatrudniania pracowników. Aby zwiększyć zużycie wody, blokuje również zanieczyszczenia. Nie używa wody do płytek, których nie może nawodnić."
ptBR = "Irriga ao redor sem necessidade de trabalhadores. Para um maior uso de água, também bloqueia a contaminação. Não usa água para azulejos que não consegue irrigar."
koKR = "주변을 농사 짓지 않고도 관개합니다. 더 많은 물 사용을 위해 오염을 차단합니다. 관개할 수 없는 타일에는 물을 사용하지 않습니다."
trTR = "Hiçbir işçi gerekmeden çevresini sulamaktadır. Daha fazla su kullanımı için de kontaminasyonu engellemektedir. Sulayamayacağı karolar için su kullanmaz."
esES = "Riega a su alrededor sin que se necesite ningún trabajador. Para un mayor consumo de agua, también bloquea la contaminación.\nNo usa agua en las casillas que no puede regar."
itIT = "Irriga le zone circostanti senza bisogno di alcun lavoratore. Per un maggiore consumo di acqua, blocca anche la contaminazione.\nNon usa acqua per le piastrelle che non riesce a irrigare"
ukUA = "Зрошує навколишні клітинки без потреби в працівниках. Для більшого використання води також блокує забруднення.\nНе використовує воду на клітинках, які вона не може зрошити"
thTH = "ให้น้ำแก่พื้นที่รอบตัวโดยไม่ต้องใช้คนงาน เมื่อใช้น้ำมากขึ้น ยังช่วยป้องกันการปนเปื้อนด้วย\nไม่ใช้น้ำกับช่องที่ไม่สามารถให้น้ำได้"
csCZ = "Zavlažuje okolí bez potřeby pracovníka. Pro větší spotřebu vody také blokuje kontaminaci. Nevyužívá vodu pro dlaždice, které nemůže zavlažovat."
viVN = "Tưới nước xung quanh nó mà không cần công nhân.\nĐể sử dụng nước nhiều hơn, nó cũng ngăn ô nhiễm.\nKhông dùng nước cho các ô đất mà nó không thể tưới."
caES = "Reg al seu voltant sense que calgui cap treballador. Per un major consum d'aigua, també bloqueja la contaminació.\nNo utilitza aigua per a les caselles que no pot regar."
beBY = "Палівае навакольныя ўчасткі без патрэбы ў працаўніках. Для большага выкарыстання вады таксама блакуе забруджванне.\nНе выкарыстоўвае ваду на ўчасткі, якія не можа палівать"
roRO = "Irigă zona din jur fără să fie nevoie de niciun lucrător. Pentru un consum mai mare de apă, blochează și contaminarea.\nNu folosește apă pentru plăcile pe care nu le poate iriga."
huHU = "Öntözi a környezetét, munkás nélkül. A nagyobb vízfelhasználás árán szennyeződés ellen is véd.\nNem használ vizet azokon a csempéken, amelyeket nem tud öntözni."
arSA = "يروي المناطق المحيطة به دون الحاجة إلى أي عامل. ولزيادة استهلاك المياه، فإنه يمنع التلوث أيضاً.\nلا يستخدم المياه للبلاطات التي لا يستطيع ريّها."

["Knatte.IrrigationTowerV2.FlavorDescription"]
