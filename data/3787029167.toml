koKR = "배고픔은 밤에 가장 크게 울부짖었다 — 그리고 밤에는 저장고가 너무 멀어서 걸어갈 수 없었다."
trTR = "Açlık gece en yüksek sesle haykırıyordu — ve gece, ambar yürümek için çok uzaktı."
esES = "El hambre gritaba más fuerte por la noche, y por la noche el almacén simplemente estaba demasiado lejos para caminar hasta él."
itIT = "La fame gridava più forte di notte, e di notte il magazzino era semplicemente troppo lontano per arrivarci a piedi."
ukUA = "Голод кричав найгучніше вночі — а вночі склад був просто занадто далеко, щоб дійти до нього пішки."
thTH = "ความหิวโหยร้องดังที่สุดในตอนกลางคืน และในตอนกลางคืนคลังเก็บของก็อยู่ไกลเกินกว่าจะเดินไปถึงได้"
csCZ = "Hlad křičel nejhlasitěji v noci — a v noci byla zásobárna prostě příliš daleko na to, aby se tam dalo dojít."
