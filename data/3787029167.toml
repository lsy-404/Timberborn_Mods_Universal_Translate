itIT = "Il luccichio sopra il letto del fiume asciutto sembrava così tanto un lago che lui si trascinò verso di esso con le ultime forze — e non ci arrivò mai."
ukUA = "Марево над сухим руслом виглядало так схоже на озеро, що він повз до нього з останніх сил — і так і не дістався."
thTH = "ประกายระยิบบนท้องแม่น้ำแห้งผากดูคล้ายทะเลสาบจนเขาคลานไปหามันด้วยแรงสุดท้าย — แต่ไปไม่ถึงเลย"
csCZ = "Lesk nad suchým korytem řeky vypadal tak podobně jako jezero, že se k němu plazil posledními silami — a nikdy se tam nedostal."
viVN = "Ánh sáng lấp lánh trên lòng sông khô trông giống như một hồ nước đến nỗi anh đã bò về phía đó với sức lực cuối cùng — và không bao giờ đến được."
caES = "La reverberació sobre el llit sec del riu semblava tant un llac que es va arrossegar cap a ell amb les darreres forces, i mai no hi va arribar."
beBY = "Ззянне над сухім рэчышчам выглядала так падобна да возера, што ён папоўз да яго апошнімі сіламі — і так і не дабраўся."
roRO = "Strălucirea de deasupra albiei uscate a râului părea atât de mult a lac, încât el s-a târât spre ea cu ultimele puteri — și nu a ajuns niciodată."
