esES = "Observó cómo un pez se agitaba en un charco que se secaba y comprendió que pronto ocuparía su lugar."
itIT = "Osservò un pesce che si dibatteva in una pozza che si stava prosciugando e capì che presto sarebbe finita al suo posto."
ukUA = "Вона дивилася, як риба б'ється в висихаючій калюжі, і зрозуміла, що незабаром опиниться на її місці."
thTH = "เธอมองดูปลาตัวหนึ่งดิ้นทุรนทุรายอยู่ในแอ่งน้ำที่กำลังแห้งเหือด และเข้าใจว่าไม่ช้าเธอก็จะต้องไปนอนแทนที่มันเช่นกัน"
csCZ = "Sledovala rybu, která se zmítala v vysychající kaluži, a pochopila, že brzy bude na jejím místě."
viVN = "Cô ấy nhìn một con cá vùng vẫy trong một vũng nước khô cạn và hiểu rằng cô sắp ở trong vị trí của nó."
caES = "Va observar un peix que es debatia en un bassal que s'assecava i va entendre que aviat seria al seu lloc."
beBY = "Яна назірала, як рыба б'ецца ў высыхаючай калюжы, і зразумела, што хутка апынецца на яе месцы."
roRO = "Ea a privit un pește zbătându-se într-o băltoacă ce se usca și și-a dat seama că în curând va ajunge în locul lui."
