esES = "El hambre se fue colando sin que ella lo notara durante los largos turnos, hasta el día en que sus piernas simplemente se negaron a levantarla."
itIT = "La fame si insinuò su di lei senza che se ne accorgesse, attraverso i lunghi turni, fino al giorno in cui le gambe semplicemente si rifiutarono di reggerla."
