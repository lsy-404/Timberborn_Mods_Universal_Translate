esES = "El trabajo en el aserradero nunca cesaba ni un momento; la comida, de alguna manera, nunca llegaba."
itIT = "Il lavoro alla segheria non si fermava mai un attimo: il cibo, in qualche modo, non arrivava mai."
ukUA = "Робота на лісопильні ні на мить не припинялася — а їжа, дивним чином, так і не з'явилася."
thTH = "งานที่โรงเลื่อยไม่เคยหยุดพักแม้แต่ประเดี๋ยว ส่วนอาหารนั้นไม่เคยมาถึงเลยสักครั้ง"
csCZ = "Práce v pily nikdy na chvíli nepřestávala — jídlo se, jakýmkoli způsobem, vůbec nedostavilo."
viVN = "Công việc ở nhà máy xẻ gỗ không bao giờ ngừng lại một giây nào — thức ăn, bằng cách nào đó, không bao giờ xuất hiện."
caES = "La feina a l'aserradora no s'aturava mai ni un moment: el menjar, no sé com, mai no arribava."
beBY = "Праца на лесапілцы ні на хвіліну не спынялася — ежа чамусьці так і не з'явілася."
