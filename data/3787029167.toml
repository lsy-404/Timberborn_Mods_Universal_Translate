csCZ = "Kůra na mladých sazenicích vypadala jako spása, ale bylo jí příliš málo a přišlo pozdě."
viVN = "Vỏ cây trên những cây non trông như cứu cánh, nhưng quá ít và đã quá muộn."
caES = "L'escorça dels joves brots semblava la salvació, però n'hi havia massa poca, i massa tard."
beBY = "Кара на маладых саджанцах выглядела як выратаванне, але яе было занадта мала, і занадта позна."
