koKR = "지난 겨울은 따뜻하게 지나갔고, 마치 자연이 그를 부드럽게 보내주기로 결정한 듯했다."
trTR = "Son kış ılıman çıktı, sanki doğa kendisi onu nazikçe bırakmaya karar vermiş gibi."
esES = "Aquel último invierno resultó suave, como si la propia naturaleza hubiera decidido dejarlo partir con suavidad."
itIT = "Quell'ultimo inverno è stato mite, come se la natura stessa avesse deciso di lasciarlo andare dolcemente."
ukUA = "Та остання зима виявилася м'якою, наче сама природа вирішила поступово відпустити його."
thTH = "ฤดูหนาวครั้งสุดท้ายนั้นอ่อนโยนผิดปกติ ราวกับธรรมชาติเองตัดสินใจปล่อยให้เขาจากไปอย่างนุ่มนวล"
csCZ = "Minulá zima se ukázala jako mírná, jako by se sama příroda rozhodla nechat ho odejít tiše."
viVN = "Mùa đông cuối cùng đó hóa ra thật ôn hòa, như thể chính thiên nhiên đã quyết định để ông ra đi một cách nhẹ nhàng."
caES = "Aquell últim hivern va resultar suau, com si la mateixa natura hagués decidit deixar-lo marxar amb delicadesa."
beBY = "Той апошні зіма выдалася мяккай, быццам сама прырода вырашыла дазволіць яму сыйсці спакойна."
roRO = "Iarna aceea din urmă a fost blândă, de parcă însăși natura hotărâse să-l lase să plece ușor."
