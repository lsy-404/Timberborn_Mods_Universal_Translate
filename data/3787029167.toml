csCZ = "Ta se se svou poslední silou táhla směrem ke kanálu, za sebou zanechávajíc suchou stopu praskající půdy."
viVN = "Cô ấy đã kéo mình về phía kênh đào bằng sức lực cuối cùng, để lại một dấu vết khô cằn của đất tan nát phía sau."
caES = "Es va arrossegar cap al canal amb les últimes forces, deixant darrere seu un rastre de terra seca i desfeta."
beBY = "Яна поўзла да канала апошнімі сіламі, пакідаючы за сабой сухі след з крышачай зямлі."
roRO = "Ea s-a târât spre canal cu ultimele puteri, lăsând în urmă o dungă uscată de pământ sfărâmicios."
