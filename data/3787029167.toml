csCZ = "Štědrost v tom cyklu selhala a ona se držela naděje déle, než její tělo dokázalo zvládnout."
viVN = "Mùa thu hoạch đã thất bại trong chu kỳ đó, và cô ấy đã giữ vững hy vọng lâu hơn những gì cơ thể cô có thể chịu đựng."
caES = "La collita havia fracassat aquell cicle, i ella es va aferrar a l'esperança més temps del que el seu cos podia aguantar."
beBY = "Ураджай у гэтым цыкле загінуў, і яна трымалася за надзею даўней, чым магло вытрымаць яе цела."
roRO = "Recolta eșuase în ciclul acela, iar ea s-a agățat de speranță mai mult decât putea suporta trupul ei."
huHU = "A termés abban a ciklusban elbukott, ő pedig tovább kapaszkodott a reménybe, mint ahogy a teste el tudta viselni."
arSA = "كان الحصاد قد فشل في ذلك الموسم، لكنها تمسكت بالأمل أطول مما كان جسدها يحتمل."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.7"]
