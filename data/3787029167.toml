caES = "El dipòsit d'aigua de reserva estava tancat amb clau al magatzem, i la clau pertanyia a un castor que aquell dia no havia vingut a treballar."
beBY = "Запасны рэзервуар з вадой стаяў замкнёным у схованцы, а ключ быў у бобра, які taго дня не з'явіўся на работу."
roRO = "Rezervorul de apă de rezervă stătea încuiat în depozit, iar cheia aparținea unui castor care nu se prezentase la muncă în ziua aceea."
huHU = "A tartalék víztartály zárva állt a raktárban, a kulcs pedig egy olyan bóbitáé volt, aki aznap nem jelent meg a munkahelyén."
