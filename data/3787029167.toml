itIT = "Ha diviso il suo ultimo pezzetto con i cuccioli, tenendone sempre meno per sé, finché non gli rimase nulla."
ukUA = "Він ділив свій останній шматок із малечею, залишаючи собі дедалі менше, доки не лишилося нічого."
thTH = "เขาแบ่งเศษอาหารชิ้นสุดท้ายให้ลูกๆ ตัวเล็ก โดยเก็บไว้ให้ตัวเองน้อยลงเรื่อยๆ จนไม่เหลืออะไรเลย"
csCZ = "Rozdělil svůj poslední kousek s mláďaty, čím dál tím méně si nechával pro sebe, až nezbylo nic."
viVN = "Anh ấy đã chia sẻ miếng cuối cùng với những chú nhóc, giữ lại ngày càng ít cho bản thân cho đến khi không còn gì."
caES = "Va repartir el seu últim fragment amb les cries, quedant-se cada cop menys per a ell mateix, fins que no li va quedar res."
beBY = "Ён аддаваў апошнія крошкі дзяцюкам, сам з кожным разам браў усё менш, пакуль не застаўся зусім без ежы."
roRO = "El își împărțea ultimul rest de hrană cu puii, păstrându-și tot mai puțin pentru sine, până când nu mai rămase nimic."
