plPL = "Mgła osiadła nad dzielnicą na dokładnie jedną noc — a ta jedna noc nie wystarczyła jej, aby zebrać więcej niż kilka kropli."
ptBR = "A neblina cobriu o distrito por exatamente uma noite — e aquela única noite não foi suficiente para ela lamber mais do que algumas gotas."
koKR = "안개가 지역 위에 정확히 하룻밤 동안 내려앉았다 — 그리고 그 하룻밤은 그녀가 몇 방울 이상의 물을 핥아낼 수 있는 충분한 시간이 아니었다."
trTR = "Bölgenin üzerine tam bir gece boyunca sis çökmüştü — ve o bir gece, onun birkaç damladan fazlasını yalaması için yeterli değildi."
esES = "La niebla cubrió el distrito durante exactamente una noche, y esa única noche no bastó para que ella lamiera más que unas cuantas gotas."
itIT = "La nebbia si è posata sul distretto per esattamente una notte, e quella sola notte non le è bastata per leccare più di qualche goccia."
ukUA = "Туман опустився над районом рівно на одну ніч, але цієї ночі їй вдалося злизати лише кілька крапель."
thTH = "หมอกลงปกคลุมเขตอยู่เพียงหนึ่งคืนเท่านั้น และคืนเดียวนั้นก็ไม่เพียงพอให้เธอดื่มน้ำได้มากกว่าไม่กี่หยด"
csCZ = "Mlha se usadila nad obvodem přesně na jednu noc — a ta jedna noc nestačila na to, aby sebrala víc než pár kapek."
viVN = "Sương mù bao phủ khu vực trong đúng một đêm — và đêm đó không đủ để cô ta có thể liếm nhiều hơn vài giọt."
caES = "La boira es va assentar sobre el districte durant exactament una nit, i aquella nit no va ser suficient perquè ella pogués llepar més que unes quantes gotes."
beBY = "Туман апусціўся на раён роўна на адну ноч — і гэтай адной ночы не хапіла ёй, каб злізаць больш за некалькі кропель."
roRO = "Ceața s-a așezat peste district exact o noapte — și acea noapte nu i-a fost de ajuns să lingă mai mult de câteva picături."
huHU = "Köd ülte meg a körzetet pontosan egy éjszakán át — de ez az egy éjszaka nem volt elég ahhoz, hogy többet nyaljon fel belőle, mint néhány cseppet."
arSA = "ضَبَاب استقرّ على المنطقة لليلة واحدة بالضبط، ولم تكن تلك الليلة كافية لها كي تلعق أكثر من بضع قطرات."

