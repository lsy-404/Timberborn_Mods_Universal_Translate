ukUA = "Вночі йому снилася повноводна ріка, а вранці під лапами знову була лише потріскана глина."
thTH = "เมื่อคืนเขาฝันว่าแม่น้ำไหลเต็มฝั่ง แต่พอถึงเช้า ใต้อุ้งเท้าของเขากลับมีเพียงดินแตกระแหงอีกครั้ง"
csCZ = "Večer snil o řece plné vody – a ráno pod jeho tlapkami zůstala jen prasklá hlína."
viVN = "Đêm qua, anh ta mơ thấy một dòng sông đầy nước — và sáng hôm sau chỉ còn lại đất sét nứt nẻ dưới bàn chân của mình."
caES = "Aquella nit somiava un riu que corria ple, i al matí només hi havia de nou el fang esquerdat sota les seves potes."
beBY = "Уночы яму снілася рака, што цякла поўнаводдзем, а раніцай пад лапамі зноў была толькі патрэсканая гліна."
roRO = "Noaptea a visat un râu care curgea plin, iar dimineața nu mai era decât argilă crăpată sub labele lui."
huHU = "Éjszaka folyóról álmodott, amely dagadtan hömpölygött, reggelre pedig újra csak repedezett agyag maradt a mancsai alatt."
arSA = "في الليل حلم بنهرٍ يجري ممتلئًا، وعند الصباح لم يكن أمامه سوى طينٍ متشقق تحت مخالبه من جديد."

["BeaverFamilyTree.CauseOfDeath.Thirst.22"]
