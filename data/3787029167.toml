jaJP = "彼は一口ずつ大切に使い、明日のために少し取っておいた — しかし彼にとって明日は決して訪れなかった。"
frFR = "Il a rationné chaque gorgée, en laissant un peu pour demain — et demain n'est jamais venu pour lui."
deDE = "Er rationierte jeden Schluck und sparte etwas für morgen – und morgen kam für ihn nie."
plPL = "Oszczędzał każdy łyk, zostawiając trochę na jutro — a jutro nigdy nie nadeszło dla niego."
ptBR = "Ele racionou cada gole, guardando um pouco para amanhã — e o amanhã nunca chegou para ele."
koKR = "그는 매번 한 모금을 아껴서 내일을 위해 남겨두었지만, 그에게는 결코 내일이 오지 않았다."
trTR = "Her yudumu dikkatlice ölçtü, yarın için birazını sakladı — ama yarın hiç gelmedi."
esES = "Racionaba cada sorbo, guardando algo para mañana, pero para él el mañana nunca llegó."
itIT = "Razionava ogni sorso, mettendone da parte un po' per domani — e per lui il domani non arrivò mai."
ukUA = "Він економив кожен ковток, відкладаючи трохи на завтра — але для нього завтра так і не настало."
thTH = "เขาประหยัดน้ำทุกอึก เก็บไว้บ้างสำหรับวันพรุ่งนี้ — แต่วันพรุ่งนี้ไม่เคยมาถึงเขาเลย"
csCZ = "Šetřil každou kapkou, na zítřek mu zbylo — a zítřek pro něj nikdy nepřišel."
viVN = "Anh ta đã quản lý từng ngụm, dành một ít cho ngày mai — và ngày mai chưa bao giờ đến với anh ta."
caES = "Racionava cada glop, guardant-ne part per a demà, i el demà mai no va arribar per a ell."
beBY = "Ён эканоміў кожны глыток, адкладаючы частку на заўтра — але заўтра для яго так і не настала."
roRO = "El își raționaliza fiecare înghițitură, păstrând puțin pentru mâine — iar mâine nu a mai venit pentru el."
huHU = "Minden kortyot beosztott, egy részét holnapra tartogatta – de a holnap soha nem jött el számára."
arSA = "كان يقنّن كل رشفة، يدّخر بعضها للغد — لكن الغد لم يأتِ له أبدًا."

["BeaverFamilyTree.CauseOfDeath.Thirst.34"]
raw = "The heat was so fierce that even the shade by the dam gave no relief — the water in his body ran out faster than the day did."
status = "normal"
enUS = "The heat was so fierce that even the shade by the dam offered no relief — the water in his body ran out faster than the day did."
zhCN = "“炎热如此猛烈，即使在大坝旁的阴凉处也没有任何缓解——他体内的水分消耗得比白天还快。”"
zhTW = "炎熱如此猖獗，即使是大壩旁的陰影也無法帶來緩解——他體內的水分耗損得比一天還快。"
ruRU = "Жара была такой невыносимой, что даже тень у плотины не приносила облегчения — вода в его теле испарилась быстрее, чем проходил день."
jaJP = "「暑さは非常に厳しく、ダムの陰でも救われることはなく、彼の体の水分は日が暮れるよりも早く失われていった。」"
frFR = "La chaleur était si intense que même l'ombre près du barrage n'offrait aucun répit — l'eau dans son corps s'évadait plus rapidement que le jour ne se terminait."
deDE = "Die Hitze war so heftig, dass selbst der Schatten am Damm keine Erleichterung bot – das Wasser in seinem Körper ging schneller aus, als der Tag verging."
plPL = "Upał był tak ostry, że nawet cień przy tamie nie przynosił ulgi — woda w jego ciele kończyła się szybciej niż mijał dzień."
ptBR = "o calor era tão intenso que até a sombra perto da represa não ofereceu alívio — a água em seu corpo se esgotou mais rápido do que o dia."
koKR = "더위가 너무 맹렬해서 댐의 그늘에서도 위안이 없었고 — 그의 몸속의 물은 하루가 지나가는 것보다 더 빨리 소진되었다."
trTR = "Isı o kadar şiddetliydi ki barajın gölgesi bile rahatlatmadı — vücudundaki su, gün geçtikçe daha hızlı tükendi."
esES = "El calor era tan intenso que ni siquiera la sombra junto a la presa aliviaba: el agua de su cuerpo se agotaba más deprisa que el día."
itIT = "Il caldo era così intenso che nemmeno l'ombra accanto alla diga offriva sollievo: l'acqua nel suo corpo si esauriva più in fretta di quanto passasse la giornata."
ukUA = "Спека була така пекельна, що навіть тінь біля греблі не давала полегшення — вода в його тілі витікала швидше, ніж минав день."
thTH = "ความร้อนรุนแรงจนแม้แต่ร่มเงาข้างเขื่อนก็ไม่อาจบรรเทาได้ น้ำในร่างกายของเขาหมดไปเร็วกว่าที่วันนั้นจะผ่านพ้นไป"
csCZ = "Horko bylo tak silné, že ani stín u hráze neposkytoval úlevu — voda v jeho těle vycházela rychleji, než den ubíhal."
viVN = "Độ nóng thật khắc nghiệt đến mức ngay cả bóng râm bên đập cũng không mang lại sự dễ chịu - nước trong cơ thể anh ta chảy ra nhanh hơn cả ngày trôi qua."
caES = "La calor era tan intensa que fins i tot l'ombra de la presa no oferia cap alleujament: l'aigua del seu cos s'acabava més de pressa que el dia."
beBY = "Спякота была такой люту, што нават цень ля плаціны не давала палёгкі: вада ў яго целе сыходзіла хутчэй, чым праходзіў дзень."
roRO = "Căldura era atât de puternică încât nici umbra de lângă baraj nu oferea alinare — apa din corpul lui se scurgea mai repede decât trecea ziua."
huHU = "A hőség olyan perzselő volt, hogy még a gát melletti árnyék sem nyújtott enyhülést – a testében lévő víz gyorsabban fogyott el, mint ahogy a nap telt."
arSA = "الحرارة كانت شديدة لدرجة أن حتى الظل بجوار السد لم يمنحه أي راحة، فالماء في جسده نفد أسرع مما نفد النهار."

["BeaverFamilyTree.CauseOfDeath.Thirst.35"]
raw = "He believed the rains started on the same day every cycle — but this year they were late."
status = "normal"
