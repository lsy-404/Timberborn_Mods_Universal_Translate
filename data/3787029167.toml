caES = "Va vagar fins a la frontera del districte amb l'esperança de trobar un canal veí, però la rescloses dels veïns estava tancada als forasters."
beBY = "Яна падарожнічала да мяжы раёна, спадзяючыся на суседні канал, але шлюз суседзяў быў зачынены для чужых."
roRO = "Ea s-a îndreptat spre granița districtului, sperând la un canal vecin, dar stăvilarul vecinilor era închis pentru cei din afară."
huHU = "A körzet határához sodródott egy szomszédos csatorna reményében, de a szomszédok zsilipje idegeneknek el volt zárva."
arSA = "تجوّلت إلى حدود المنطقة على أمل الوصول إلى قناة مجاورة، لكن بوابة تصريف الجيران كانت مغلقة في وجه الغرباء."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.25"]
