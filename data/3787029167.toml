deDE = "Sie schnappte nach Luft, als könnte sie das Wasser ersetzen – und verstummte auf halbem Weg zum Fluss."
plPL = "Łapała powietrze, jakby mogło zastąpić wodę — i zamilkła w połowie drogi do rzeki."
ptBR = "Ela engoliu o ar como se pudesse substituir a água — e ficou em silêncio no meio do caminho para o rio."
koKR = "그녀는 마치 공기가 물을 대신할 수 있는 것처럼 공기를 허겁지겁 삼켰고 — 강으로 가는 도중에 침묵에 빠졌다."
trTR = "Hava, suyun yerini tutabiliyormuş gibi hızla nefes aldı — ve nehre gitmenin ortasında sustu."
esES = "Respiró hondo, como si el aire pudiera sustituir al agua, y calló a medio camino del río."
itIT = "Ansimava con la bocca aperta come se l'aria potesse sostituire l'acqua, e a metà strada verso il fiume tacque."
ukUA = "Вона жадібно ковтала повітря, ніби воно може замінити воду, — і замовкла на півдорозі до річки."
thTH = "เธอสูดอากาศเข้าปอดอย่างหอบหายใจราวกับอากาศจะใช้แทนน้ำได้ — แล้วก็เงียบไปกลางทางถึงแม่น้ำ"
csCZ = "Polkla vzduch, jako by mohl nahradit vodu — a uprostřed cesty k řece zmlkla."
viVN = "Cô ấy nuốt không khí như thể nó có thể thay thế cho nước — và im lặng giữa chừng trên đường đến con sông."
caES = "Ella va xuclar l'aire com si pogués substituir l'aigua, i es va quedar en silenci a mig camí del riu."
beBY = "Яна глынула паветра так, быццам яно магло замяніць ваду, — і змоўкла на паўдарозе да ракі."
roRO = "Gâfâia aer ca și cum ar fi putut înlocui apa, apoi a tăcut la jumătatea drumului spre râu."
huHU = "Nagyot szippantott a levegőből, mintha az pótolhatná a vizet, aztán félúton a folyó felé elhallgatott."
arSA = "ابتلعت الهواء بشراهة كأنه قادر على أن يحل محل الماء، ثم صمتت في منتصف الطريق إلى النهر."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.13"]
raw = "The dam held water beautifully — just not on the side where a beaver needed a drink."
