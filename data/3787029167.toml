esES = "La cosecha había fracasado ese ciclo, y ella aferró la esperanza durante más tiempo del que su cuerpo podía soportar."
itIT = "La raccolta era fallita in quel ciclo, e lei si aggrappava alla speranza più a lungo di quanto il suo corpo potesse sopportare."
ukUA = "Урожай того циклу провалився, і вона трималася за надію довше, ніж могло витримати її тіло."
