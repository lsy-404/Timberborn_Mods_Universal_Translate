roRO = "Foamea se făcea auzită cel mai tare noaptea — iar noaptea, depozitul era pur și simplu prea departe ca să ajungi acolo pe jos."
huHU = "Az éhség éjszaka kiabált a leghangosabban — és éjszaka a raktár egyszerűen túl messze volt ahhoz, hogy elsétáljon oda az ember."
arSA = "الجوع يصرخ بأعلى صوته ليلاً، وفي الليل كان المخزن ببساطة أبعد من أن يُقطع الطريق إليه سيراً على الأقدام."

["BeaverFamilyTree.CauseOfDeath.Hunger.12"]
