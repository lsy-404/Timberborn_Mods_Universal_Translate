thTH = "เขาเลียพื้นดินที่แตกระแหง หวังเพียงหยดน้ำที่ให้ชีวิตเพียงสักหยด แต่ไม่เคยลุกขึ้นจากพื้นที่ร้อนระอุนั้นอีกเลย"
