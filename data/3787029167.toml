esES = "La corteza de los brotes jóvenes parecía la salvación, pero había muy poca y llegó demasiado tarde."
itIT = "La corteccia dei giovani alberelli sembrava la salvezza, ma ce n'era troppo poca, e arrivava troppo tardi."
ukUA = "Кора молодих саджанців здавалася порятунком, але її було замало і запізно."
