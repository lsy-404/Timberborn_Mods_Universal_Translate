viVN = "Công việc tại nhà máy cưa không bao giờ ngừng lại dù chỉ một khoảnh khắc — thực phẩm, bằng cách nào đó, hoàn toàn không xuất hiện."
caES = "La feina a l'aserradora no es va aturar ni un moment; el menjar, no sé com, mai no va arribar."
beBY = "Праца на лесапілцы ні на імгненне не спынялася — ежа, неяк так, так і не з'явілася."
