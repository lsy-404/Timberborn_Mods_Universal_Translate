itIT = "Il bagliore sopra l'alveo asciutto sembrava così tanto un lago che lei si trascinò verso di esso con le ultime forze — e non ci arrivò mai."
ukUA = "Марево над сухим руслом здавалося таким схожим на озеро, що вона повзла до нього останніми силами — і так і не дісталася."
thTH = "ความระยิบระยับเหนือท้องน้ำแห้งดูเหมือนทะเลสาบจนเธอคลานเข้าไปหามันด้วยแรงสุดท้าย — และไม่เคยไปถึงเลย"
csCZ = "Lesk nad suchým korytem řeky vypadal tolik jako jezero, že se k němu plazila se svými posledními silami — a nikdy se tam nedostala."
viVN = "Cái lấp lánh trên lòng sông khô cằn trông giống như một cái hồ đến nỗi cô ấy đã bò về phía nó bằng sức lực cuối cùng — và không bao giờ đến được."
caES = "La vibració sobre el llit de riu sec semblava tant un llac que ella es va arrossegar cap a ell amb les últimes forces, i mai no hi va arribar."
beBY = "Мроя над сухім рэчышчам выглядала так падобна да возера, што яна поўзла да яе апошнімі сіламі — і так і не дабралася."
roRO = "Strălucirea de deasupra albiei uscate a râului arăta atât de mult a lac, încât ea s-a târât spre ea cu ultimele puteri — și nu a ajuns niciodată acolo."
