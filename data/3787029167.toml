roRO = "Ea i-a privit pe ceilalți cărând buşteni și a realizat că nu mai avea puterea să care nici măcar unul."
huHU = "Ő nézte, ahogy a többiek fát cipelnek, és rájött, hogy már egyetlen rönk elcipelésére sincs ereje."
