csCZ = "Stavba hráze zadržovala vodu nádherně — jen ne na straně, kde bobr potřeboval napít."
viVN = "Đập nước giữ nước thật đẹp — chỉ là không ở bên mà một con bọ cạp cần uống."
caES = "La resclosa retenia l'aigua de manera preciosa, només que no al costat on un castor necessitava beure."
beBY = "Дамба красиво держала воду — вот только не с той стороны, где бобру нужно было попить."
