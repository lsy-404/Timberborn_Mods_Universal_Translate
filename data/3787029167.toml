esES = "Siempre se repetía que habría tiempo para comer después del siguiente turno, pero para ella el siguiente turno nunca terminaba."
itIT = "Continuava a ripetersi che ci sarebbe stato tempo per mangiare dopo il prossimo turno, ma per lei il turno successivo non finiva mai."
ukUA = "Вона раз у раз казала собі, що після наступної зміни буде час поїсти, але для неї наступна зміна так і не закінчувалася."
thTH = "เธอบอกตัวเองซ้ำ ๆ ว่าเดี๋ยวจะมีเวลากินข้าวหลังกะถัดไป แต่สำหรับเธอ กะถัดไปไม่เคยจบลงเลย"
csCZ = "Stále si opakovala, že po další směně bude čas na jídlo — ale další směna pro ni nikdy neskončila."
viVN = "Cô ấy cứ tự nhủ rằng sẽ có thời gian để ăn sau ca làm việc tiếp theo — nhưng ca làm việc tiếp theo chưa bao giờ kết thúc đối với cô."
caES = "Es repetia que ja tindria temps de menjar després del següent torn, però per a ella el següent torn mai no acabava."
beBY = "Яна ўвесь час казала сабе, што пасля наступнай змены ў яе будзе час паесці, але наступная змена для яе так і не заканчвалася."
roRO = "Își tot spunea că va avea timp să mănânce după următorul schimb, dar pentru ea următorul schimb nu se terminase niciodată."
huHU = "Mindig azt mondogatta magának, hogy a következő műszak után lesz ideje enni, de számára a következő műszak soha nem ért véget."
arSA = "كانت تقنع نفسها دائمًا بأن هناك وقتًا للأكل بعد المناوبة التالية، لكن المناوبة التالية لم تنتهِ أبدًا بالنسبة لها."

