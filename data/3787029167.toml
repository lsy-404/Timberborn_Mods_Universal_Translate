huHU = "A nyelve az íny tetejéhez tapadt, a legközelebbi csatorna pedig túl messze volt — a szomjúság gyorsabb volt, mint a lábai."
arSA = "لصق لسانه بسقف فمه، وكانت أقرب قناة بعيدة أكثر من اللازم، فسبقه العطش إلى ساقيه."

