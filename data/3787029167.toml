frFR = "Le tuyau qui alimentait le réservoir était depuis longtemps asséché, et il ne restait plus personne pour le réparer."
deDE = "Die Leitung, die das Reservoir speiste, war längst ausgetrocknet, und es war niemand mehr da, um sie zu reparieren."
plPL = "Rura, która niegdyś zasilała zbiornik, dawno już wyschła, a nikt nie pozostał, aby ją naprawić."
ptBR = "O tubo que costumava abastecer o reservatório secou há muito tempo, e não havia mais ninguém para consertá-lo."
koKR = "저수지를 공급하던 파이프는 오래전에 말라버렸고, 수리할 사람도 남아 있지 않았다."
trTR = "Rezervuara su veren boru çoktan kurumuştu ve bunu tamir edecek kimse kalmamıştı."
esES = "La tubería que alimentaba el embalse llevaba mucho tiempo seca, y ya no quedaba nadie para repararla."
itIT = "La tubatura che un tempo alimentava il serbatoio si era prosciugata da tempo, e non c'era più nessuno che potesse ripararla."
ukUA = "Труба, що колись живила водосховище, давно висохла, і її вже не було кому лагодити."
thTH = "ท่อที่เคยส่งน้ำเข้าอ่างเก็บน้ำแห้งเหือดไปนานแล้ว และไม่มีใครเหลืออยู่เพื่อซ่อมมัน"
csCZ = "Trubka, která kdysi zásobovala nádrž, dávno uschla a nikdo ji již neopravoval."
viVN = "Cái ống từng cấp nước cho hồ chứa đã lâu không còn, và không còn ai để sửa nó."
caES = "La canonada que alimentava el dipòsit feia temps que s'havia assecat, i ja no quedava ningú per arreglar-la."
beBY = "Труба, которая раньше питала водохранилище, давно пересохла, и чинить её было некому."
roRO = "Conducta care alimenta rezervorul se uscase demult, iar nu mai rămăsese nimeni care să o repare."
huHU = "A cső, amely korábban a víztározót táplálta, már régen kiszáradt, és nem maradt senki, aki megjavíthatta volna."
