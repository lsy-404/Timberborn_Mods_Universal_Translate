itIT = "Si diresse verso il confine del distretto sperando in un canale vicino, ma la chiusa dei vicini era sbarrata agli estranei."
ukUA = "Вона блукала до кордону району, сподіваючись знайти сусідній канал, але шлюз сусідів був закритий для чужинців."
thTH = "เธอเดินไปยังขอบเขตของเขตเพื่อหวังจะพบคลองที่อยู่ติดกัน แต่ประตูระบายน้ำของเพื่อนบ้านถูกปิดไม่ให้คนนอกเข้า"
csCZ = "Toulala se k hranici okresu v naději na sousední kanál, ale sousedův sluš byl pro cizince zavřený."
