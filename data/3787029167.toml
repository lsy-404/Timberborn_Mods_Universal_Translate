zhTW = "他仍然每天早上出去在陽光下取暖，直到有一天早上他再也沒有出來。"
ruRU = "Он все еще выходил погреться на солнце каждое утро, пока одно утро не настало без него."
jaJP = "彼は毎朝日向で温まるために外に出ていましたが、ある朝彼なしでやってきました。"
frFR = "Il sortait encore pour se réchauffer au soleil chaque matin, jusqu'à ce qu'un matin se lève sans lui."
deDE = "Er ging jeden Morgen noch hinaus, um sich in der Sonne zu wärmen, bis eines Morgens ein Tag ohne ihn kam."
plPL = "Codziennie rano wychodził, aby ogrzać się w słońcu, aż pewnego ranka przyszło słońce bez niego."
ptBR = "Ele ainda saía para se aquecer ao sol todas as manhãs, até que uma manhã chegou sem ele."
koKR = "그는 여전히 매일 아침 태양에 몸을 따뜻하게 하러 나갔지만, 어느 아침 그가 없이 찾아왔다."
trTR = "Her sabah güneşte ısınmak için dışarı çıkmaya devam etti, ta ki bir sabah onu olmadan gelen sabaha kadar."
esES = "Todavía salía cada mañana a calentarse al sol, hasta que una mañana llegó sin él."
itIT = "Usciva ancora ogni mattina a scaldarsi al sole, finché una mattina arrivò senza di lui."
ukUA = "Він і далі щоранку виходив погрітися на сонці, аж поки одного ранку настав день без нього."
thTH = "เขายังคงออกไปอาบแดดให้ตัวเองอุ่นทุกเช้า จนกระทั่งวันหนึ่งเช้ามาถึงโดยไม่มีเขา"
csCZ = "Každé ráno vycházel, aby se ohřál na slunci, až přišlo jedno ráno bez něj."
viVN = "Ông vẫn ra ngoài để tắm nắng mỗi sáng, cho đến khi một buổi sáng không còn ông nữa."
caES = "Encara sortia cada matí a escalfar-se al sol, fins que un matí va arribar sense ell."
beBY = "Ён усё яшчэ выходзіў кожны ранак грэцца на сонцы, пока аднойчы ранак не прыйшоў без яго."
roRO = "El încă ieșea în fiecare dimineață să se încălzească la soare, până când într-o dimineață a venit una fără el."
huHU = "Még mindig kiment minden reggel melegedni a napra, míg egy reggelen már nélküle érkezett el a reggel."
arSA = "كان لا يزال يخرج كل صباح ليدفئ نفسه تحت أشعة الشمس، حتى جاء صباح لم يخرج فيه."

["BeaverFamilyTree.CauseOfDeath.OldAge.8"]
raw = "His fur had long since gone gray, but his eyes still shone to the very last day, looking at the dam he'd helped build."
status = "normal"
enUS = "His fur had long since gone gray, but his eyes still shone to the very last day, looking at the dam he'd helped build."
zhCN = "他的毛发早已变灰，但他的眼睛在最后一天依然闪烁着光芒，注视着他曾帮助建造的坝。"
zhTW = "他的毛皮早已變灰，但他的眼睛在最後一天仍然閃閃發光，注視著他曾經幫助建造的水壩。"
ruRU = "Его мех давно поседел, но глаза все еще сияли до самого последнего дня, глядя на плотину, которую он помог построить."
jaJP = "「彼の毛はとっくに灰色になっていたが、彼の目は最後の日まで輝いており、彼が手伝って作ったダムを見つめていた。」"
frFR = "Son pelage était depuis longtemps devenu gris, mais ses yeux brillaient encore jusqu'au dernier jour, regardant le barrage qu'il avait aidé à construire."
deDE = "Sein Fell war längst grau geworden, aber seine Augen leuchteten bis zum letzten Tag, während er auf den Damm schaute, den er mitgebaut hatte."
plPL = "Jego futro od dawna stało się szare, ale oczy wciąż świeciły do ostatniego dnia, patrząc na tamę, którą pomógł zbudować."
ptBR = "Seu pelo há muito tempo já havia ficado cinza, mas seus olhos ainda brilhavam até o último dia, olhando para a represa que ajudou a construir."
koKR = "그의 털은 오래전부터 회색으로 변했지만, 그의 눈은 마지막 날까지 빛났고, 그가 도운 댐을 바라보았다."
trTR = "Postu çoktan griye dönmüştü, ama gözleri son güne kadar parlamaya devam etti, inşa etmeye yardımcı olduğu barajı izleyerek."
esES = "Tenía el pelaje gris desde hacía mucho tiempo, pero sus ojos seguían brillando hasta el último día, contemplando la presa que había ayudado a construir."
itIT = "Il suo pelo era grigio da tempo, ma i suoi occhi brillavano ancora fino all'ultimo giorno, mentre guardava la diga che aveva contribuito a costruire."
ukUA = "Його хутро давно посивіло, але очі все ще сяяли до самого останнього дня, коли він дивився на греблю, яку допомагав будувати."
thTH = "ขนของเขาหงอกขาวมานานแล้ว แต่ดวงตายังคงเป็นประกายจนถึงวันสุดท้าย ขณะมองเขื่อนที่เขาเคยช่วยสร้างขึ้น"
csCZ = "Jeho srst už dávno zešedivěla, ale jeho oči stále zářily až do posledního dne, když se díval na hráz, kterou pomáhal postavit."
viVN = "Lông của ông đã lâu nay chuyển sang màu xám, nhưng ánh mắt của ông vẫn sáng đến ngày cuối cùng, nhìn về con đê mà ông đã giúp xây dựng."
caES = "El seu pelatge feia temps que s'havia tornat gris, però els seus ulls encara brillaven fins al darrer dia, mirant la resclosa que havia ajudat a construir."
beBY = "Яго футра даўно пасівела, але вочы ўсё яшчэ блішчэлі да самага апошняга дня, калі ён глядзеў на плаціну, якую дапамагаў пабудаваць."
roRO = "Blana lui devenise de mult cenușie, dar ochii îi străluceau până în ultima zi, privind barajul pe care îl ajutase să-l construiască."
huHU = "Szőre már régen megőszült, de szeme még az utolsó napig ragyogott, amikor a gátat nézte, amelynek építésében ő is segédkezett."
arSA = "كان شعره قد شاب منذ زمن بعيد، لكن عينيه ظلتا تلمعان حتى اليوم الأخير، وهو ينظر إلى السد الذي ساعد في بنائه."

["BeaverFamilyTree.CauseOfDeath.OldAge.9"]
raw = "He died the way he lived — sitting by his favorite dam, the very one he'd helped build cycles ago."
status = "normal"
enUS = "He died the way he lived — sitting by his favorite dam, the very one he'd helped build cycles ago."
zhCN = "他去世的方式与他生活的方式一样——坐在他最喜欢的水坝旁边，那是他几轮之前帮助建造的。"
zhTW = "他死在他生活的方式上——坐在他最喜愛的水壩旁邊，那正是他幾個週期前幫忙建造的水壩。"
ruRU = "Он ушел из жизни так, как и жил — сидя у любимой плотины, той самой, которую он помог построить много циклов назад."
jaJP = "「彼は好きなダムのそばに座って、彼が何サイクルも前に作るのを手伝ったそのダムで、彼が生きた方法で亡くなった。」"
frFR = "Il est mort comme il a vécu — assis près de son barrage préféré, celui qu'il avait aidé à construire il y a des cycles."
deDE = "Er starb, wie er gelebt hatte – sitzend an seinem Lieblingsdamm, dem genau dem, den er vor vielen Zyklen mitgebaut hatte."
plPL = "Zmarł tak, jak żył — siedząc przy swojej ulubionej tamie, tej, którą pomógł zbudować wieki temu."
ptBR = "Ele morreu do jeito que viveu — sentado perto da represa que mais gostava, aquela que ajudou a construir há ciclos atrás."
koKR = "그는 자신이 가장 좋아하는 댐 옆에 앉아 살았던 방식으로 죽었다. 그 댐은 그가 몇 사이클 전에 함께 지었을 바로 그 댐이다."
trTR = "En sevdiği barajın yanında oturarak, yıllar önce inşa etmesine yardım ettiği o barajın yanında yaşamını sürdürdüğü gibi öldü."
esES = "Murió como había vivido: sentado junto a su presa favorita, la misma que ayudó a construir hace ciclos."
itIT = "Morì come aveva vissuto: seduto accanto alla sua diga preferita, quella stessa che aveva contribuito a costruire tanti cicli fa."
ukUA = "Він помер так, як жив: сидячи біля улюбленої греблі, тієї самої, яку допомагав будувати багато циклів тому."
thTH = "เขาจากไปอย่างที่เขาเคยใช้ชีวิต คือนั่งอยู่ข้างเขื่อนที่เขาชอบที่สุด เขื่อนเดียวกับที่เขาช่วยสร้างเมื่อหลายรอบปีก่อน"
csCZ = "Zemřel tak, jak žil — seděl u své oblíbené hráze, té, kterou pomáhal postavit před mnoha cykly."
viVN = "Anh ấy đã ra đi như cách sống của mình — ngồi bên con đập yêu thích, chính là nơi anh ấy đã giúp xây dựng từ nhiều vòng trước."
caES = "Va morir com va viure: assegut al seu desaigua preferit, el mateix que havia ajudat a construir fa cicles."
beBY = "Ён памёр так, як жыў — сядзячы каля свайго любімага граблі, той самай, якую ён дапамагаў будаваць шмат цыклаў таму."
roRO = "El a murit așa cum a trăit — stând lângă barajul său preferat, chiar cel pe care îl ajutase să-l construiască cu ani în urmă."
huHU = "Úgy halt meg, ahogyan élt: a kedvenc gátja mellett ülve, amelyet évekkel ezelőtt ő maga segített megépíteni."
arSA = "مات كما عاش، جالساً بجوار سدّه المفضل، ذاك الذي ساعد في بنائه قبل سنوات طويلة."

["BeaverFamilyTree.CauseOfDeath.OldAge.10"]
raw = "His grandkits only noticed grandfather was sleeping too long once the sun was already high in the sky."
status = "normal"
enUS = "His grandkits only noticed grandfather was sleeping too long once the sun was already high in the sky."
zhCN = "“他的孙辈们直到太阳已经高高挂起才注意到爷爷睡得太久了。”"
zhTW = "他的孫子們只有在太陽高懸時才注意到爺爺睡得太久了。"
ruRU = "Его внуки только заметили, что дедушка спит слишком долго, когда солнце уже высоко в небе."
jaJP = "「祖父が長く寝ていることに気づいたのは、太陽が空高く昇ってからだった。」"
frFR = "Ses petits-enfants ont seulement remarqué que grand-père dormait trop longtemps une fois que le soleil était déjà haut dans le ciel."
deDE = "Seine Enkelkits bemerkten erst, dass der Großvater zu lange schlief, als die Sonne bereits hoch am Himmel stand."
plPL = "Jego wnuki zauważyły, że dziadek śpi za długo, dopiero gdy słońce było już wysoko na niebie."
ptBR = "Seus netinhos só perceberam que o avô estava dormindo demais quando o sol já estava alto no céu."
koKR = "손자들은 할아버지가 이미 하늘에 태양이 높이 솟아올랐을 때까지 할아버지가 너무 오랫동안 자고 있다는 것을 깨달았다."
trTR = "Torunları, güneş gökyüzünde yüksek olduğunda dedelerinin çok uzun süre uyuduğunu ancak o zaman fark ettiler."
esES = "Sus nietos solo se dieron cuenta de que el abuelo llevaba durmiendo demasiado tiempo cuando el sol ya estaba alto en el cielo."
itIT = "I suoi nipotini si sono accorti che il nonno dormiva troppo a lungo solo quando il sole era già alto nel cielo."
ukUA = "Його онуки помітили, що дідусь спить занадто довго, лише коли сонце вже піднялося високо в небі."
thTH = "ลูกๆ ของคุณตาเพิ่งสังเกตเห็นว่าปู่หลับนานเกินไปก็ต่อเมื่อดวงอาทิตย์ขึ้นสูงบนท้องฟ้าแล้ว"
csCZ = "Jeho vnoučata si až když bylo slunce už vysoko na obloze uvědomila, že dědeček spí příliš dlouho."
viVN = "Các cháu của ông chỉ nhận ra ông ngủ quá lâu khi mặt trời đã lên cao trên bầu trời."
caES = "Els seus néts només es van adonar que l'avi dormia massa estona quan el sol ja era alt al cel."
beBY = "Яго ўнукі заўважылі, што дзед спіць занадта доўга, толькі калі сонца ўжо стаяла высока на небе."
roRO = "Nepoții lui au observat abia când soarele era deja sus pe cer că bunicul dormea prea mult."
huHU = "Az unokái csak akkor vették észre, hogy nagyapjuk túl sokáig alszik, amikor a nap már magasan járt az égen."
arSA = "هل لاحظ أحفاد جده أنه يُطيل النوم فقط بعد أن ارتفعت الشمس في السماء."

["BeaverFamilyTree.CauseOfDeath.OldAge.11"]
raw = "He quietly stopped breathing somewhere between one heartbeat and the next, never waking from his midday nap."
status = "normal"
enUS = "He quietly stopped breathing somewhere between one heartbeat and the next, never waking from his midday nap."
zhCN = "“他在一次心跳和下一个心跳之间安静地停止了呼吸，从未从他的午睡中醒来。”"
zhTW = "「他靜靜地在一次心跳與下一次心跳之間停止了呼吸，從未從他的午睡中醒來。」"
ruRU = "Он тихо перестал дышать где-то между одним ударом сердца и следующим, так и не проснувшись от своего дневного отдыха."
jaJP = "「彼は昼寝から決して目を覚まさず、一心拍と次の心拍の間に静かに息を引き取りました。」"
frFR = "Il a cessé de respirer tranquillement quelque part entre un battement de cœur et le suivant, ne se réveillant jamais de sa sieste de midi."
deDE = "Er hörte leise zwischen einem Herzschlag und dem nächsten auf zu atmen und erwachte nie wieder aus seinem Mittagsschlaf."
plPL = "Cicho przestał oddychać gdzieś pomiędzy jednym uderzeniem serca a drugim, nigdy nie budząc się z popołudniowej drzemki."
ptBR = "Ele parou de respirar silenciosamente em algum lugar entre um batimento cardíaco e o próximo, nunca acordando de sua soneca de meio-dia."
koKR = "그는 잔잔한 숨결을 거두며 한 박동과 다음 박동 사이에서 조용히 세상을 떠났고, 정오 낮잠에서 깨어나지 못했다."
trTR = "Bir kalp atışı ile diğerinin arasında sessizce nefes almayı bıraktı, öğle uykusundan bir daha asla uyanmadı."
esES = "Dejó de respirar en silencio en algún momento entre un latido y el siguiente, sin despertarse nunca de su siesta de mediodía."
itIT = "Ha smesso di respirare in silenzio, tra un battito del cuore e il successivo, senza mai svegliarsi dal suo sonnellino di mezzogiorno."
ukUA = "Він тихо перестав дихати десь між одним ударом серця і наступним, так і не прокинувшись із полуденного сну."
thTH = "เขาหยุดหายใจอย่างเงียบ ๆ ในช่วงเวลาระหว่างการเต้นของหัวใจครั้งหนึ่งกับครั้งถัดไป โดยไม่เคยตื่นจากการงีบหลับตอนเที่ยงเลย"
csCZ = "Tiše přestal dýchat někde mezi jedním tepem a druhým, nikdy se neprobudil ze své polední siesty."
viVN = "Ông lặng lẽ ngừng thở ở đâu đó giữa một nhịp tim và nhịp tim tiếp theo, không bao giờ tỉnh dậy từ giấc ngủ trưa của mình."
caES = "Va deixar de respirar amb tranquil·litat en algun moment entre un batec del cor i el següent, sense despertar-se mai de la becaina del migdia."
beBY = "Ён ціха перастаў дыхаць недзе паміж адным ударам сэрца і наступным, так і не прачнуўшыся ад паўдзённага сну."
roRO = "S-a oprit din respirat în liniște, undeva între o bătaie de inimă și următoarea, fără să se trezească vreodată din somnul de la prânz."
huHU = "Csendesen abbahagyta a légzést egy szívdobbanás és a következő között, anélkül hogy felébredt volna délutáni szundikálásából."
arSA = "توقف عن التنفس بهدوء في لحظة ما بين نبضة قلب وأخرى، دون أن يستيقظ من قيلولة منتصف النهار."

["BeaverFamilyTree.CauseOfDeath.OldAge.12"]
raw = "His last words were about how the new generation of beavers had completely forgotten how to stack logs properly."
status = "normal"
enUS = "His last words were about how the new generation of beavers had completely forgotten how to stack logs properly."
zhCN = "“他临终前的话是关于新一代的河狸完全忘记了如何正确叠放木头。”"
zhTW = "「他最後的話是關於新一代的海狸完全忘記了如何正確堆疊木頭。」"
ruRU = "Его последние слова касались того, как новое поколение бобров совершенно забыло, как правильно укладывать бревна."
jaJP = "「彼の最後の言葉は、新しい世代のビーバーたちがログを適切に積むことを完全に忘れてしまったということについてだった。」"
frFR = "Ses derniers mots concernaient le fait que la nouvelle génération de castors avait complètement oublié comment empiler les rondins correctement."
deDE = "Seine letzten Worte waren darüber, wie die neue Generation der Biber vollkommen vergessen hatte, wie man Baumstämme richtig stapelt."
plPL = "Jego ostatnie słowa dotyczyły tego, jak nowa generacja bobrów całkowicie zapomniała, jak właściwie układać pnie."
ptBR = "Suas últimas palavras foram sobre como a nova geração de castores havia completamente se esquecido de como empilhar toras corretamente."
koKR = "그의 마지막 말은 새로운 세대의 비버들이 나무를 제대로 쌓는 것을 완전히 잊어버렸다는 것이었다."
trTR = "Son sözleri, yeni nesil bobriklerin kütükleri doğru bir şekilde nasıl istifleyeceklerini tamamen unuttukları hakkında oldu."
esES = "Sus últimas palabras fueron sobre cómo la nueva generación de castores había olvidado por completo cómo apilar troncos correctamente."
itIT = "Le sue ultime parole riguardavano il fatto che la nuova generazione di castori avesse completamente dimenticato come impilare correttamente i tronchi."
ukUA = "Його останніми словами було те, що нове покоління бобрів повністю забуло, як правильно складати колоди."
thTH = "คำพูดสุดท้ายของเขาคือเรื่องที่คนรุ่นใหม่ของบีเวอร์ลืมวิธีเรียงท่อนไม้ให้ถูกต้องไปจนหมดสิ้นแล้ว"
csCZ = "Jeho poslední slova se týkala toho, jak nová generace bobrů úplně zapomněla, jak správně skládat klády."
viVN = "Những lời cuối cùng của ông ấy là về việc thế hệ mới của những con rái cá đã hoàn toàn quên cách xếp gỗ một cách hợp lý."
caES = "Les seves darreres paraules van ser sobre com la nova generació de castors havia oblidat completament com apilar troncs correctament."
beBY = "Яго апошнімі словамі было тое, што новае пакаленне баброў цалкам разучылася правільна складаць бервяно да бервяна."
roRO = "Ultimele lui cuvinte au fost despre faptul că noua generație de castori uitase complet cum să stivuiască buștenii cum trebuie."
huHU = "Utolsó szavai az volt, hogy az új nemzedék bobjai teljesen elfelejtették, hogyan kell rendesen rakni a fatörzseket."
arSA = "كانت كلماته الأخيرة عن كيف أن الجيل الجديد من القنادس نسي تماماً طريقة تكديس الخشب بشكل صحيح."

["BeaverFamilyTree.CauseOfDeath.OldAge.13"]
raw = "He'd outlived many others, seen more than one flood and more than one drought — and passed peacefully, in his own lodge."
status = "normal"
enUS = "He'd outlived many others, seen more than one flood and more than one drought — and passed peacefully, in his own lodge."
zhCN = "他比许多人活得更久，经历过不止一次洪水和干旱——最终安详地在自己的小屋中去世。"
zhTW = "「他比其他許多人活得更久，經歷了多次洪水與乾旱——最終安然無恙地過世，安息於自己的小屋中。」"
ruRU = "Он пережил многих других, видел не одну наводнение и не одну засуху — и ушёл мирно, в своем собственном логове."
jaJP = "彼は多くの他者を超えて生き延び、複数の洪水と干ばつを見た — そして、自分の小屋で静かに息を引き取った。"
frFR = "Il avait survécu à de nombreux autres, avait vu plus d'une inondation et plus d'une sécheresse — et est parti paisiblement, dans son propre terrier."
deDE = "Er hatte viele andere überlebt, mehr als eine Flut und mehr als eine Dürre gesehen – und ist friedlich in seiner eigenen Hütte verstorben."
plPL = "Przeżył wielu innych, widział niejedną powódź i niejedną suszę — i odszedł spokojnie, w swojej własnej chacie."
ptBR = "Ele sobreviveu a muitos outros, viu mais de uma enchente e mais de uma seca — e partiu em paz, em sua própria cabana."
koKR = "그는 많은 다른 이들보다 더 오래 살았고, 한 번 이상의 홍수와 한 번 이상의 가뭄을 겪었으며 — 그리고 자신의 오두막에서 평화롭게 세상을 떠났다."
trTR = "Birçokunu geride bırakmış, birden fazla sel ve birden fazla kuraklık görmüş - ve kendi kulübesinde huzur içinde hayata veda etmişti."
esES = "Había sobrevivido a muchos otros, había visto más de una inundación y más de una sequía, y falleció en paz, en su propia casa-cabaña."
itIT = "Era sopravvissuto a molti altri, aveva visto più di un'alluvione e più di una siccità, e si spense serenamente, nella sua stessa capanna."
ukUA = "Він пережив багатьох інших, бачив не одну повінь і не одну посуху — і спокійно відійшов у вічність, у власній хатинці."
thTH = "เขาใช้ชีวิตยืนยาวกว่าใครหลายคน เคยเห็นน้ำท่วมมาแล้วไม่ต่ำกว่าหนึ่งครั้ง และภัยแล้งมาแล้วไม่ต่ำกว่าหนึ่งครั้ง ก่อนจากไปอย่างสงบในกระท่อมของตัวเอง"
csCZ = "Žil déle než mnozí ostatní, zažil více než jednu povodeň a více než jedno sucho — a odešel v pokoji, ve svém vlastním doupěti."
viVN = "Ông đã sống sót qua nhiều người khác, chứng kiến nhiều trận lũ và nhiều đợt hạn hán — và ra đi bình yên, trong tổ của chính mình."
caES = "Ho havia sobreviscut a molts altres, havia vist més d'una riada i més d'una sequera, i va morir tranquil·lament, a la seva pròpia cabana."
beBY = "Ён пражыў многіх іншых, бачыў больш чым адно паводка і больш чым адну засуху — і адышоў мірна, у ўласнай хатцы."
roRO = "El a supraviețuit multor alții, a văzut mai mult de o inundație și mai mult de o secetă — și s-a stins liniștit, în propria colibă."
huHU = "Ő már sok másnál tovább élt, több áradást és több aszályt is látott, és békésen, a saját odújában hunyt el."
arSA = "هو عاش أطول من كثيرين غيره، وشهد أكثر من فيضان واحد وأكثر من جفاف واحد، ثم رحل بسلام، في بيته الخاص."

["BeaverFamilyTree.CauseOfDeath.OldAge.14"]
raw = "His body grew tired of carrying the weight of the years, and his heart grew tired of beating against its will."
status = "normal"
enUS = "His body grew tired of carrying the weight of the years, and his heart grew tired of beating against its will."
zhCN = "“他的身体厌倦了承受岁月的重负，而他的心也厌倦了违背意志地跳动。”"
zhTW = "他的身體厭倦了承擔歲月的重擔，他的心臟厭倦了違背意志地跳動。"
ruRU = "Его тело устало носить тяжесть лет, а сердце устало биться против своей воле."
jaJP = "「彼の体は年月の重みを背負うことに疲れ果て、彼の心は自分の意志に逆らって鼓動を打ち続けることに疲れ果てた。」"
frFR = "Son corps s'est épuisé à porter le poids des années, et son cœur s'est lassé de battre contre sa volonté."
deDE = "Sein Körper wurde müde, das Gewicht der Jahre zu tragen, und sein Herz wurde müde, gegen seinen Willen zu schlagen."
plPL = "Jego ciało zmęczyło się noszeniem ciężaru lat, a jego serce zmęczyło się bijąc wbrew własnej woli."
ptBR = "Seu corpo se cansou de carregar o peso dos anos, e seu coração se cansou de bater contra a sua vontade."
koKR = "그의 몸은 세월의 무게를 견디는 것에 지쳤고, 그의 마음은 저항하며 박동치는 것에 지쳤다."
trTR = "Bedeni yılların yükünü taşımaktan yoruldu ve kalbi, iradesine karşı atmaktan yoruldu."
esES = "Su cuerpo se cansó de cargar el peso de los años, y su corazón se cansó de latir contra su voluntad."
itIT = "Il suo corpo si era stancato di portare il peso degli anni, e il suo cuore si era stancato di battere contro la sua volontà."
ukUA = "Його тіло втомилося носити тягар років, а серце втомилося битися всупереч собі."
thTH = "ร่างกายของเขาเหนื่อยล้าจากการแบกรับน้ำหนักของปีที่ผ่านมา และหัวใจของเขาก็เหนื่อยล้าจากการเต้นต่อสู้กับความต้องการของตัวเอง"
csCZ = "Jeho tělo se unavilo nést váhu let a jeho srdce se unavilo bít proti své vůli."
viVN = "Cơ thể của anh ấy trở nên mệt mỏi khi mang trọng lượng của những năm tháng, và trái tim của anh ấy trở nên mệt mỏi khi phải đập trái ý mình."
caES = "El seu cos es va cansar de carregar el pes dels anys, i el seu cor es va cansar de batre contra la seva voluntat."
beBY = "Яго цела стамілася ад цяжару гадоў, а сэрца стамілася біцца насуперак свайму жаданню."
roRO = "Corpul lui obosise să poarte greutatea anilor, iar inima lui obosise să bată împotriva voinței sale."
huHU = "A teste megunta az évek súlyának cipelését, a szíve pedig megunta, hogy akarata ellenére dobog."
arSA = "جسده تعب من حمل ثقل السنين، وقلبه تعب من الخفقان رغماً عنه."

["BeaverFamilyTree.CauseOfDeath.OldAge.15"]
raw = "He lived to see his great-grandkits pick up their first logs to build a dam of their own."
status = "normal"
enUS = "He lived to see his great-grandkits pick up their first logs to build a dam of their own."
zhCN = "“他活着看到他的曾孙们捡起第一根木头，自己建起一个水坝。”"
zhTW = "「他活到了看到他的曾孫子們第一次撿起樹木，去建造自己的水壩。」"
ruRU = "Он дожил до того, чтобы увидеть, как его правнуки поднимают свои первые бревна, чтобы построить собственную плотину."
jaJP = "彼は曾孫たちが初めて自分たちのダムを作るために木材を運ぶのを見届けて生涯を終えた。"
frFR = "Il a vécu pour voir ses arrière-petits-enfants ramasser leurs premiers bûches pour construire un barrage à eux."
deDE = "Er erlebte, wie seine Urenkel ihre ersten Baumstämme aufhoben, um einen eigenen Damm zu bauen."
plPL = "Doczekał się, aby jego prawnuki podniosły swoje pierwsze belki, aby zbudować zaporę na własny użytek."
ptBR = "Ele viveu para ver seus bisnetos pegarem seus primeiros troncos para construir uma represa própria."
koKR = "그는 자신의 증손자들이 처음으로 댐을 짓기 위해 나무를 주운 것을 보며 살았다."
trTR = "Torunlarını ilk odunlarını alırken görmeye yaşamıştı ve kendi barajlarını inşa ettiler."
esES = "Vivió lo suficiente para ver a sus tataranietos recoger sus primeros troncos para construir una presa propia."
itIT = "Visse abbastanza a lungo da vedere i suoi pronipoti prendere in mano i primi tronchi per costruire una diga tutta loro."
ukUA = "Він дожив до того, як його правнуки взяли перші колоди, щоб побудувати власну греблю."
thTH = "เขาได้มีชีวิตจนเห็นเหล่าหลานรุ่นทวดของเขาหยิบท่อนไม้ชิ้นแรกขึ้นมาเพื่อสร้างเขื่อนของตัวเอง"
csCZ = "Dožil se toho, že jeho pravnuci zvedli své první klády, aby si postavili vlastní hráz."
viVN = "Ông sống đủ lâu để thấy cháu chắt của mình nhặt những khúc gỗ đầu tiên để xây một cái đập của riêng mình."
caES = "Va viure fins a veure els seus rebesnéts agafar els primers troncs per construir una presa pròpia."
beBY = "Ён дажыў да таго, што ягоныя праўнукі-бабрыняты ўзялі свае першыя бервяні, каб пабудаваць уласную греблю."
roRO = "El a trăit suficient cât să vadă străbunii săi cei mai tineri ridicând primele bușteni pentru a construi propriul baraj."
huHU = "Megélte, hogy dédunokái is felveszik az első fatörzseiket, hogy saját gátat építsenek."
arSA = "عاش حتى رأى أحفاد أحفاده الكبار يلتقطون جذوعهم الأولى لبناء سدٍّ خاص بهم."

["BeaverFamilyTree.CauseOfDeath.OldAge.16"]
raw = "Age took its toll bit by bit: first the legs, then the teeth, and at the end, simply the will to get up in the morning."
status = "normal"
enUS = "Age took its toll bit by bit: first the legs, then the teeth, and at the end, simply the will to get up in the morning."
zhCN = "“岁月一点一点地侵蚀着：首先是腿，接着是牙齿，最后只是早上起床的意愿。”"
zhTW = "歲月逐漸帶走了一切：首先是雙腿，然後是牙齒，最後只剩下早上起床的意志。"
ruRU = "Возраст забирал свое по частям: сначала ноги, затем зубы, а в конце просто желание встать утром."
jaJP = "歳月が少しずつ犠牲をもたらした：最初は脚、次に歯、そして最後には朝起きる意志さえも。"
frFR = "L'âge a fait son œuvre peu à peu : d'abord les jambes, puis les dents, et enfin, tout simplement la volonté de se lever le matin."
deDE = "Das Alter forderte seinen Tribut, Stück für Stück: zuerst die Beine, dann die Zähne und zuletzt einfach der Wille, morgens aufzustehen."
plPL = "Wiek zbierał swoje żniwo kawałek po kawałku: najpierw nogi, potem zęby, a na koniec po prostu chęć, by wstać rano."
ptBR = "A idade fez seu trabalho pouco a pouco: primeiro as pernas, depois os dentes, e no final, simplesmente a vontade de se levantar pela manhã."
koKR = "나이는 조금씩 그 대가를 치렀습니다: 처음에는 다리, 그 다음에는 이, 그리고 마지막에는 아침에 일어날 의지조차 없게 되었습니다."
trTR = "Yaş, yavaş yavaş tolladı: önce bacaklar, sonra dişler ve sonunda, sabah uyanma isteği."
esES = "La vejez se cobró su precio poco a poco: primero las patas, luego los dientes y, al final, simplemente la voluntad de levantarse por la mañana."
itIT = "L'età ha fatto il suo pedaggio a poco a poco: prima le zampe, poi i denti e, alla fine, semplicemente la voglia di alzarsi la mattina."
ukUA = "Вік брав своє поступово: спочатку ноги, потім зуби, а наприкінці просто бажання вставати вранці."
thTH = "อายุขัยค่อย ๆ คร่าชีวิตไปทีละน้อย ขาก่อน แล้วฟัน และสุดท้ายก็เหลือเพียงแค่ความไม่อยากลุกจากเตียงในตอนเช้า"
csCZ = "Věk si vybral svou daň postupně: nejprve nohy, pak zuby a nakonec prostě vůli vstát ráno."
viVN = "Tuổi tác đã lấy đi từng chút một: trước là chân, sau là răng, và cuối cùng, chỉ là ý chí để dậy vào buổi sáng."
caES = "L'edat es va cobrar el seu preu a poc a poc: primer les cames, després les dents i, al final, simplement la voluntat de llevar-se cada matí."
beBY = "Ста́расць бралася сваё паступова: спачатку ногі, потым зубы, а напрыканцы проста жаданне ўстаць раніцай."
roRO = "Vârsta și-a spus cuvântul treptat: mai întâi picioarele, apoi dinții, iar la final, pur și simplu, voința de a se ridica dimineața."
huHU = "Az öregség lassan vette el a sajátját: először a lábak, aztán a fogak, és végül már csak az akarat, hogy reggel felkeljen."
arSA = "الشيخوخة أخذت حقها شيئاً فشيئاً: أولاً الساقان، ثم الأسنان، وفي النهاية، ببساطة، الإرادة على النهوض في الصباح."

["BeaverFamilyTree.CauseOfDeath.OldAge.17"]
raw = "His lodgemates found him sleeping so soundly that no noise could wake him anymore."
status = "normal"
enUS = "His lodgemates found him sleeping so soundly that no noise could wake him anymore."
zhCN = "他的同伴们发现他睡得如此安稳，以至于再也没有任何噪音能把他叫醒。"
zhTW = "他的同伴發現他睡得如此香甜，任何噪音都無法再把他喚醒。"
ruRU = "Его соседи по дому нашли его спящим так крепко, что ни один звук не мог разбудить его."
jaJP = "彼の同居人たちは、彼があまりにも深く眠っているため、どんな音を立てても彼を起こすことができなかった。"
frFR = "Ses camarades de cabane l'ont trouvé endormi si profondément qu'aucun bruit ne pouvait plus le réveiller."
deDE = "Seine Mitbewohner fanden ihn so fest schlafend, dass kein Geräusch ihn mehr wecken konnte."
plPL = "Jego towarzysze z nory znaleźli go śpiącego tak głęboko, że żaden hałas nie był w stanie go obudzić."
ptBR = "Seus companheiros de lodge o encontraram dormindo tão profundamente que nenhum barulho podia mais acordá-lo."
koKR = "그의 동료들이 그가 너무 깊이 잠들어 있어 어떤 소리도 그를 깨울 수 없다는 것을 발견했습니다."
trTR = "Yoldaşları onu öyle derin uyurken buldular ki, artık hiçbir gürültü onu uyandıramazdı."
esES = "Sus compañeros de cabaña lo encontraron durmiendo tan profundamente que ya ningún ruido podía despertarlo."
itIT = "I suoi compagni di alloggio lo trovarono a dormire così profondamente che nessun rumore riusciva più a svegliarlo."
ukUA = "Його сусіди по житлу знайшли його настільки міцно спячим, що жоден шум більше не міг його розбудити."
thTH = "พวกเพื่อนร่วมบ้านของเขาพบว่าเขานอนหลับสนิทมากจนไม่มีเสียงใดปลุกเขาได้อีกแล้ว"
csCZ = "Jeho společníci v norech ho našli spícího tak klidně, že ho už žádný zvuk nemohl probudit."
viVN = "Các bạn chung chòi của anh ấy đã tìm thấy anh ấy ngủ say đến nỗi không có tiếng động nào có thể đánh thức anh ấy nữa."
caES = "Els seus companys de llar el van trobar dormint tan profundament que cap soroll el podia despertar ja."
beBY = "Суседзі па дому знайшлі яго так моцна спячым, што ніякі шум больш не мог яго разбудзіць."
roRO = "Colegii lui l-au găsit dormind atât de adânc, încât niciun zgomot nu-l mai putea trezi."
huHU = "Lakótársai úgy találták, hogy olyan mélyen alszik, hogy már semmilyen zaj sem tudja felébreszteni."
arSA = "ذهب رفاقه في المسكن ليجدوه نائماً بعمق لدرجة أنه لم يعد أي ضجيج قادراً على إيقاظه."

["BeaverFamilyTree.CauseOfDeath.OldAge.18"]
raw = "He faded quietly, surrounded by the family he himself had founded on the banks of this very river."
status = "normal"
enUS = "He faded quietly, surrounded by the family he himself had founded on the banks of this very river."
zhCN = "他静静地去世了，身边围绕着他在这条河岸上建立的家庭。"
zhTW = "他靜靜地離去，周圍是他自己在這條河岸上創建的家庭。"
ruRU = "Он тихо ушел, окруженный семьей, которую он сам основал на берегах этой самой реки."
jaJP = "彼は静かに息を引き取り、彼自身がこの川の岸辺に築いた家族に囲まれていた。"
frFR = "Il s'est éteint paisiblement, entouré de la famille qu'il avait lui-même fondée sur les rives de cette même rivière."
deDE = "Er schwand still dahin, umgeben von der Familie, die er selbst am Ufer dieses Flusses gegründet hatte."
plPL = "Zgasł spokojnie, otoczony przez rodzinę, którą sam założył nad brzegiem tej rzeki."
ptBR = "Ele se apagou tranquilamente, cercado pela família que ele mesmo havia fundado às margens deste mesmo rio."
koKR = "그는 자신이 바로 이 강가에 세운 가족에 둘러싸여 조용히 사라졌다."
trTR = "Bu nehrin kıyısında kendisinin kurduğu aileyle çevrili olarak sessizce yok oldu."
esES = "Se apagó en silencio, rodeado de la familia que él mismo había fundado a orillas de este mismo río."
itIT = "Si spense serenamente, circondato dalla famiglia che aveva fondato proprio sulle rive di questo fiume."
ukUA = "Він тихо згасав, оточений родиною, яку сам заснував на березі цієї самої річки."
thTH = "เขาจากไปอย่างเงียบสงบ ท่ามกลางครอบครัวที่เขาก่อตั้งขึ้นเองบนฝั่งแม่น้ำสายนี้"
csCZ = "Tiše odešel, obklopen rodinou, kterou sám založil na březích této řeky."
viVN = "Ông đã ra đi nhẹ nhàng, bao quanh bởi gia đình mà chính ông đã thành lập bên bờ con sông này."
caES = "Es va apagar tranquil·lament, envoltat de la família que ell mateix havia fundat a les ribes d'aquest mateix riu."
beBY = "Ён ціхенька згас, акружаны сям'ёй, якую сам заснаваў на беразе гэтай самай ракі."
roRO = "El s-a stins liniștit, înconjurat de familia pe care o întemeiase chiar el pe malurile acestui râu."
huHU = "Csendesen hunyt el, körülvéve a családtól, amelyet ezen a folyó partján alapított."
arSA = "توفي بهدوء، محاطًا بالعائلة التي أسسها بنفسه على ضفاف هذا النهر تحديدًا."

["BeaverFamilyTree.CauseOfDeath.OldAge.19"]
raw = "The last thing he did in life was nudge a slightly crooked log back into place by the lodge entrance."
status = "normal"
enUS = "The last thing he did in life was nudge a slightly crooked log back into place by the lodge entrance."
zhCN = "他生命中最后做的事情是将一个稍微歪斜的木头轻轻推回到栖息地入口的位置。"
zhTW = "他一生中最後做的事情是在小屋入口處將一根稍微歪斜的木頭輕輕推回原位。"
ruRU = "Последнее, что он сделал в жизни, это подправил немного кривой бревно у входа в шалаш."
jaJP = "「彼が人生で最後にしたことは、ロッジの入り口の近くにある少し曲がった丸太を元の位置に戻すことでした。」"
frFR = "La dernière chose qu'il a faite dans la vie a été de repousser une bûche légèrement tordue à sa place près de l'entrée du lodge."
deDE = "Das Letzte, was er im Leben tat, war, ein leicht schiefes Holzstück am Eingang zur Lodge wieder an seinen Platz zu schieben."
plPL = "Ostatnią rzeczą, którą zrobił w życiu, było poprawienie lekko krzywego kłody przy wejściu do szałasu."
ptBR = "A última coisa que ele fez na vida foi empurrar uma tora ligeiramente torta de volta ao seu lugar na entrada do alojamento."
