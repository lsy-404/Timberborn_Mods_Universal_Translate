arSA = "وميض السراب فوق المجرى النهري الجاف بدا شبيهاً بالبحيرة إلى حدّ أنها زحفت نحوه بآخر ما تبقّى لها من قوة، ولم تصل إليه أبداً."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.26"]
