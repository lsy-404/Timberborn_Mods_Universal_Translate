koKR = "그녀는 매 순간의 물을 절약하며 내일을 위해 약간 남겨두었지만 — 그녀에게 내일은 결코 오지 않았다."
trTR = "Her zaman için birazını saklayarak her yudumu paylaştı - ama onun için yarın hiç gelmedi."
esES = "Racionaba cada sorbo, guardando algo para mañana, pero el mañana nunca llegó para ella."
itIT = "Razionava ogni sorso, mettendone da parte un po' per domani, ma per lei domani non arrivò mai."
ukUA = "Вона суворо відмірювала кожен ковток, відкладаючи частину на завтра, — але для неї завтра так і не настало."
thTH = "เธอประหยัดน้ำทุกหยด เก็บไว้บ้างสำหรับวันพรุ่งนี้ — แต่วันพรุ่งนี้ไม่เคยมาถึงเธอ"
csCZ = "Každý doušek pečlivě odměřovala, něco si šetřila na zítřejek — a zítřek pro ni nikdy nepřišel."
viVN = "Cô ấy đã phân phối từng ngụm một cách tiết kiệm, dành một ít cho ngày mai — và ngày mai đã không đến với cô ấy."
caES = "Racionava cada glop, guardant-ne una part per a demà; i demà mai no va arribar per a ella."
beBY = "Яна эканоміла кожны глыток, адкладаючы частку на заўтра — але заўтра для яе так і не настала."
roRO = "Ea își raționa fiecare înghițitură, păstrând puțin pentru mâine — iar mâine nu a mai venit pentru ea."
huHU = "Minden kortyot beosztott, egy részét holnapra tartogatta — de a holnap számára nem jött el."
arSA = "هي كانت تقنّن كل رشفة، تدّخر بعضها للغد — وللغد لم تأتِ أبدًا بالنسبة إليها."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.34"]
raw = "The heat was so fierce that even the shade by the dam gave no relief — the water in her body ran out faster than the day did."
status = "normal"
enUS = "The heat was so fierce that even the shade by the dam gave no relief — the water in her body ran out faster than the day did."
zhCN = "炎热如此猛烈，以至于大坝旁的阴凉也无法提供任何缓解——她体内的水分流失得比白天还快。"
zhTW = "「炎熱如此猛烈，以至於連大壩旁的陰影也無法帶來緩解——她體內的水分比白天消逝得更快。」"
ruRU = "Жара была такой жестокой, что даже тень у плотины не спасала — вода в её теле иссякла быстрее, чем длился день."
jaJP = "「暑さが非常に厳しく、ダムの影さえも安らぎを与えなかった — 彼女の体の水分は、日が沈むより速く失われていった。」"
frFR = "La chaleur était si intense que même l'ombre près du barrage ne fournissait aucun répit — l'eau dans son corps s'épuisait plus vite que le jour ne s'écoulait."
deDE = "Die Hitze war so heftig, dass selbst der Schatten am Damm keine Erleichterung verschaffte — das Wasser in ihrem Körper ging schneller aus als der Tag verging."
plPL = "Upał był tak okropny, że nawet cień przy tamie nie przynosił ulgi — woda w jej ciele kończyła się szybciej niż mijał dzień."
ptBR = "O calor era tão intenso que até a sombra perto da barragem não trouxe alívio — a água em seu corpo se esgotou mais rápido do que o dia."
koKR = "더위가 너무 강렬해서 댐 옆 그늘조차도 위안이 되지 않았다 — 그녀의 몸속 물은 하루가 지나기보다 더 빨리 고갈되었다."
trTR = "Sıcaklık o kadar şiddetliydi ki, barajın gölgesi bile ferahlama sağlamıyordu — vücudundaki su, günün geçişinden daha hızlı bir şekilde tükendi."
esES = "El calor era tan intenso que ni siquiera la sombra junto a la presa daba alivio: el agua de su cuerpo se agotaba más rápido que el día."
itIT = "Il caldo era così intenso che nemmeno l'ombra accanto alla diga dava sollievo: l'acqua nel suo corpo si esauriva più in fretta di quanto passasse la giornata."
ukUA = "Спека була такою нестерпною, що навіть тінь біля греблі не давала полегшення: вода в її тілі витікала швидше, ніж минав день."
thTH = "ความร้อนรุนแรงจนแม้แต่ร่มเงาข้างเขื่อนก็ไม่ช่วยให้คลายร้อนเลย น้ำในร่างกายของเธอหมดไปเร็วกว่าที่วันเวลาผ่านไปเสียอีก"
csCZ = "HORKO BYLO TAK INTENZIVNÍ, ŽE I STÍN U DLOUHEM NEPOSKYTOVAL ÚLEVU — VODA V JEJÍM TĚLE MIZELA RYCHLEJI NEŽ DEN."
viVN = "Nóng nực đến nỗi ngay cả bóng râm bên đập cũng không mang lại sự thanh thản — nước trong cơ thể cô ấy cạn nhanh hơn cả ngày trôi qua."
caES = "La calor era tan intensa que fins i tot l'ombra de la presa no oferia alleujament: l'aigua del seu cos s'esgotava més de pressa que el dia."
beBY = "Спёка была такой лютай, што нават цень каля плаціны не даваў палёгкі: вада ў яе целе сыходзіла хутчэй, чым заканчваўся дзень."
roRO = "Căldura era atât de puternică, încât nici umbra de lângă baraj nu oferea alinare — apa din corpul ei se scurgea mai repede decât trecea ziua."
huHU = "A hőség olyan kegyetlen volt, hogy még a gát melletti árnyék sem nyújtott enyhülést – a testében lévő víz gyorsabban fogyott el, mint ahogy a nap telt."
arSA = "الحرارة كانت شديدة لدرجة أن الظل بجوار السد لم يمنحها أي راحة، فقد نفد الماء من جسدها أسرع مما نفد النهار."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.35"]
raw = "She believed the rains started on the same day every cycle — but this year they were late."
status = "normal"
enUS = "She believed the rains started on the same day every cycle — but this year they were late."
zhCN = "“她相信每个周期的同一天都会下雨——但今年雨却晚来了。”"
zhTW = "「她相信每個循環的同一天雨水開始降下——但今年它們來得遲了。」"
ruRU = "Она считала, что дожди начинаются в один и тот же день каждого цикла — но в этом году они опоздали."
jaJP = "「彼女は雨が毎サイクルの同じ日に始まると信じていたが、今年は遅れた。」"
frFR = "Elle croyait que les pluies commençaient le même jour à chaque cycle — mais cette année, elles étaient en retard."
deDE = "Sie glaubte, dass der Regen am selben Tag jedes Zyklus begann – aber in diesem Jahr kam er spät."
plPL = "Uważała, że deszcze zaczynają się w ten sam dzień każdego cyklu — ale w tym roku się spóźniły."
ptBR = "Ela acreditava que as chuvas começavam no mesmo dia a cada ciclo — mas este ano estavam atrasadas."
koKR = "그녀는 비가 매 사이클의 같은 날 시작된다고 믿었다 - 하지만 올해는 늦었다."
trTR = "Yağmurların her döngüde aynı gün başladığına inanıyordu — ama bu yıl geç kaldılar."
esES = "Ella creía que las lluvias llegaban siempre el mismo día de cada ciclo, pero este año se retrasaron."
itIT = "Credeva che le piogge iniziassero sempre lo stesso giorno di ogni ciclo, ma quest'anno sono arrivate in ritardo."
ukUA = "Вона вважала, що дощі починалися щоразу в один і той самий день циклу, але цього року вони запізнилися."
thTH = "เธอเชื่อว่าฝนจะเริ่มตกในวันเดียวกันทุกรอบฤดู แต่ปีนี้มันมาช้า"
csCZ = "Věřila, že deště začínají každý cyklus ve stejný den — ale letos přišly pozdě."
viVN = "Cô ấy tin rằng mưa sẽ bắt đầu vào cùng một ngày trong mỗi chu kỳ — nhưng năm nay nó đến muộn."
caES = "Ella creia que les pluges començaven el mateix dia de cada cicle, però aquest any es van retardar."
beBY = "Яна была ўпэўнена, што дожджы пачыналіся ў адзін і той жа дзень кожнага цыкла, але ў гэтым годзе яны запозніліся."
roRO = "Ea credea că ploile începeau în aceeași zi a fiecărui ciclu — dar anul acesta au întârziat."
huHU = "Úgy hitte, hogy az esők minden ciklusban ugyanazon a napon kezdődnek — de idén későn érkeztek."
arSA = "كانت تعتقد أن الأمطار تبدأ في اليوم نفسه من كل دورة، لكن هذا العام تأخرت."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.36"]
raw = "Her last strength went into dragging herself to the dry canal, just to lie down at its bottom."
status = "normal"
enUS = "Her last strength went into dragging herself to the dry canal, just to lie down at its bottom."
zhCN = "她最后的力气全都用来拖着自己到干涸的渠道，只为躺在底部。"
zhTW = "她最後的力氣用來爬到乾涸的水道，只為躺在底部。"
ruRU = "Её последние силы ушли на то, чтобы дотянуться до сухого канала, лишь чтобы лечь на его дно."
jaJP = "「彼女は最後の力を振り絞って干枯れた運河に這っていき、その底に横たわるだけだった。」"
frFR = "Sa dernière force a été dépensée à se traîner jusqu'au canal sec, juste pour s'allonger au fond."
deDE = "Ihre letzte Kraft ging darauf, sich zum trockenen Kanal zu schleppen, nur um sich am Grund niederzulegen."
plPL = "Jej ostatnie siły poszły na to, by dotrzeć do suchego kanału, tylko po to, by położyć się na jego dnie."
ptBR = "Sua última força foi para arrastar-se até o canal seco, apenas para deitar-se em seu fundo."
koKR = "그녀의 마지막 힘은 마른 수로로 끌어오르는 데 쓰였고, 그곳 바닥에 누워 있었다."
trTR = "Son gücünü, sadece tabanında uzanmak için kuru kanala sürüklenmekte harcadı."
esES = "Su última fuerza se fue en arrastrarse hasta el canal seco, solo para tenderse en su fondo."
itIT = "Le sue ultime forze furono spese per trascinarsi fino al canale asciutto, solo per stendersi sul suo fondo."
ukUA = "Її останні сили пішли на те, щоб доповзти до сухого каналу й лягти на його дно."
thTH = "ความแข็งแรงครั้งสุดท้ายของเธอถูกใช้ไปกับการลากตัวเองไปยังคลองที่แห้งเหือด เพียงเพื่อจะทิ้งตัวลงนอนที่ก้นคลองนั้น"
csCZ = "Její poslední síly šly do toho, aby se dokázala dotáhnout k suchému kanálu, jen aby si mohla lehnout na jeho dno."
viVN = "Năng lực cuối cùng của cô đã đi vào việc tự kéo mình đến kênh khô, chỉ để nằm xuống dưới đáy của nó."
caES = "Les seves últimes forces van anar a arrossegar-se fins al canal sec, només per estirar-se al seu fons."
beBY = "Яе апошнія сілы пайшлі на тое, каб дапаўзці да высахлага канала і лечь на яго дно."
roRO = "Ultimele ei puteri au fost folosite ca să se târască până la canalul uscat, doar ca să se întindă pe fundul lui."
huHU = "Utolsó erejét arra használta, hogy a száraz csatornáig vonszolja magát, hogy aztán annak fenekén heveredjen le."
arSA = "ذهبت آخر قواها في جرّ نفسها إلى القناة الجافة، لتستلقي فقط في قاعها."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.37"]
raw = "She'd long since stopped sweating — her body was rationing even what it no longer had."
status = "normal"
enUS = "She'd long since stopped sweating — her body was rationing even what it no longer had."
zhCN = "“她早已不再出汗——她的身体甚至在节约那些早已没有的东西。”"
zhTW = "「她早已停止流汗——她的身體甚至在節省已經不再擁有的東西。」"
ruRU = "Она давно перестала потеть — её тело начало экономить даже то, чего у неё больше не было."
jaJP = "「彼女はとっくの昔に汗をかくのをやめていた — 彼女の体は、もはや持っていないものさえも分配していた。」"
frFR = "Elle avait depuis longtemps cessé de transpirer — son corps rationnait même ce qu'il n'avait plus."
deDE = "Sie hatte längst aufgehört zu schwitzen — ihr Körper rationierte sogar das, was er nicht mehr hatte."
plPL = "Od dawna przestała się pocić — jej ciało racjonowało nawet to, czego już nie miało."
ptBR = "Ela havia parado de suar há muito tempo — seu corpo estava racionando até mesmo o que não tinha mais."
koKR = "그녀는 이미 오래전에 땀을 흘리는 것을 멈췄다 — 그녀의 몸은 더 이상 없는 것마저도 절약하고 있었다."
trTR = "Artık terlemeyi çoktan bırakmıştı - bedeni, artık sahip olmadığı şeyi bile kısıtlıyordu."
esES = "Hacía tiempo que había dejado de sudar: su cuerpo estaba racionando incluso lo que ya no tenía."
itIT = "Non aveva più sudato da tempo: il suo corpo stava razionando anche ciò che ormai non possedeva più."
ukUA = "Вона вже давно перестала потіти — її організм економив навіть те, чого в неї вже не було."
thTH = "เธอหยุดเหงื่อออกมานานแล้ว ร่างกายของเธอกำลังปันส่วนแม้กระทั่งสิ่งที่ตอนนี้ไม่เหลืออยู่แล้ว"
csCZ = "Už dávno přestala potit — její tělo šetřilo i to, co už dávno nemělo."
viVN = "Cô ấy đã ngừng đổ mồ hôi từ lâu — cơ thể cô ấy đang tiết kiệm ngay cả những gì cô ấy không còn."
caES = "Ja fa temps que havia deixat de suar; el seu cos racionava fins i tot el que ja no tenia."
beBY = "Яна даўно перастала потчавацца — яе арганізм эканомiў нават тое, чаго ў яе ўжо не заставалася."
roRO = "Transpirase de mult timp încetase — corpul ei raționalizase chiar și ceea ce nu mai avea."
huHU = "Már régen nem izzadt — a teste azt is takarékoskodva osztotta be, ami már nem volt neki."
arSA = "هي منذ زمن بعيد توقفت عن التعرّق، فجسدها كان يقنّن حتى ما لم يعد يملكه."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.38"]
raw = "The ditch around the sawmill had shrunk to cracked mud, and the real river was many times farther still."
status = "normal"
enUS = "The ditch around the sawmill had shrunk to cracked mud, and the real river was many times farther still."
zhCN = "锯木厂周围的沟渠已经缩小成干裂的泥土，而真正的河流则远在数倍之外。"
zhTW = "銳切磨坊周圍的溝渠已經縮小成裂開的泥土，而真正的河流則還遙遠得多。"
ruRU = "Канава вокруг пилорамы уменьшилась до треснувшей грязи, а настоящая река была в разы дальше."
jaJP = "製材所の周りの溝はひびの入った泥に縮んでおり、本当の川はさらに何倍も遠くにあった。"
frFR = "Le fossé autour de la scierie s'était réduit à de la boue craquelée, et la véritable rivière était encore bien plus éloignée."
deDE = "Der Graben um die Sägewerk war zu rissigem Schlamm geschrumpft, und der echte Fluss war noch viele Male weiter entfernt."
plPL = "Rów wokół tartaku skurczył się do popękanej błota, a prawdziwa rzeka była jeszcze wiele razy dalej."
ptBR = "A vala ao redor da serraria tinha encolhido para um barro fissurado, e o verdadeiro rio estava muitas vezes mais longe."
koKR = "톱질 공장 주변의 도랑은 갈라진 진흙으로 줄어들었고, 실제 강은 그보다 훨씬 멀리 있었다."
trTR = "Kesimhanenin etrafındaki hendek çatlamış çamur haline gelmişti ve gerçek nehir hala çok daha uzaktaydı."
esES = "El foso alrededor del aserradero se había reducido a barro agrietado, y el verdadero río estaba todavía muchas veces más lejos."
itIT = "Il fossato attorno alla segheria si era ridotto a fango screpolato, e il vero fiume era ancora molte volte più lontano."
ukUA = "Канава навколо пилорами пересохла до тріщинкуватого бруду, а справжня річка була ще в багато разів далі."
thTH = "คูน้ำรอบโรงเลื่อยแห้งจนเหลือเป็นโคลนแตกระแหง ส่วนแม่น้ำตัวจริงอยู่ไกลออกไปอีกหลายเท่าตัว"
csCZ = "Příkop kolem pily se zmenšil na prasklou hlínu a skutečná řeka byla ještě mnohem dál."
viVN = "Rãnh quanh xưởng cưa đã co lại thành bùn nứt nẻ, và dòng sông thật thì còn xa gấp nhiều lần."
caES = "El fossat al voltant de la serradora s'havia reduït a fang esquerdat, i el riu de veritat quedava encara moltes vegades més lluny."
beBY = "Канава вакол лесапілкі ператварылася ў расколатае балота, а сапраўдная рака была яшчэ ў многа разоў далей."
roRO = "Șanțul din jurul gaterului se redusese la noroi crăpat, iar râul adevărat era încă de multe ori mai departe."
huHU = "A fűrésztelep körüli árok repedezett sárrá zsugorodott, az igazi folyó pedig még sokszorosan messzebb volt."
arSA = "كانت الخندق المحيط بمنشرة الخشب قد تقلّص إلى طين متشقق، وكان النهر الحقيقي أبعد بكثير من ذلك."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.39"]
raw = "She looked at the dam one last time — the very one that was supposed to carry water to her, not past her."
status = "normal"
enUS = "She looked at the dam one last time — the very one that was supposed to carry water to her, not past her."
zhCN = "“她最后一次看了看那座大坝——本该将水送给她，而不是越过她的那座。”"
zhTW = "「她最後一次看著大壩——那座應該為她提供水源，而不是流過她的。」"
ruRU = "Она посмотрела на плотину в последний раз — ту самую, которая должна была подавать воду ей, а не мимо."
jaJP = "彼女はダムを最後に一度見つめた—彼女に水を運ぶはずだった、彼女を通り過ぎるのではなく。"
frFR = "Elle regarda le barrage une dernière fois — celui qui était censé lui apporter de l'eau, et non la contourner."
deDE = "Sie sah zum letzten Mal auf den Damm — denjenigen, der Wasser zu ihr bringen sollte, nicht an ihr vorbeifließen."
plPL = "Popatrzyła na tamę po raz ostatni — na tę, która miała dostarczać jej wodę, a nie omijać ją."
ptBR = "Ela olhou para a represa uma última vez — a mesma que deveria levar água até ela, e não passar por ela."
koKR = "그녀는 마지막으로 댐을 바라보았다 — 자신에게 물을 공급해야 했던 바로 그 댐, 그녀를 지나쳐서는 안 되는."
trTR = "Son bir kez baraja baktı - ona su taşımak için yapılan, yanında değil."
esES = "Miró la presa una última vez: la misma que debía llevarle el agua a ella, no dejarla atrás."
itIT = "Guardò la diga un'ultima volta: proprio quella che doveva portare l'acqua fino a lei, e non farla passare oltre."
ukUA = "Вона востаннє глянула на греблю — ту саму, що мала носити воду до неї, а не повз неї."
thTH = "ผู้หญิงคนนั้นมองเขื่อนเป็นครั้งสุดท้าย — เขื่อนที่ควรจะส่งน้ำมาให้เธอ ไม่ใช่ไหลผ่านเธอไปเสีย"
csCZ = "Podívala se na hráz naposledy — na tu, která jí měla přinášet vodu, a ne ji míjet."
viVN = "Cô nhìn vào đập một lần cuối - chính cái đập lẽ ra phải mang nước đến cho cô, không phải chảy qua cô."
caES = "Va mirar la presa una última vegada: precisament la que havia de portar-li l'aigua a ella, i no fer-la passar de llarg."
beBY = "Яна агледзела плаціну ў апошні раз — тую самую, што павінна была несці ваду да яе, а не міма яе."
roRO = "Se uită încă o dată la baraj — exact cel care trebuia să-i aducă apă, nu să treacă pe lângă ea."
huHU = "Egyszer még utoljára ránézett a gátra — arra, amelynek vizet kellett volna hoznia hozzá, nem pedig elvezetnie mellette."
arSA = "نظرت إلى السد للمرة الأخيرة — السد نفسه الذي كان من المفترض أن يوصل الماء إليها، لا أن يمرّ من بجانبها."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.20"]
raw = "She split her grain ration with a sick neighbor and kept too little back to last herself."
status = "normal"
enUS = "She shared her grain ration with a sick neighbor and kept too little for herself."
zhCN = "“她把谷物配给分给了一位生病的邻居，自己留的太少，无法维持。”"
zhTW = "“她把自己的谷物配給分給一位生病的鄰居，自己卻留得太少，無法撐過去。”"
ruRU = "Она поделилась своей зерновой нормой с больным соседом и оставила себе слишком мало, чтобы продержаться."
