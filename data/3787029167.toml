deDE = "Sie schleppte bis zum Schluss weiterhin Stämme zum Damm, obwohl es schon lange her war, dass sie etwas Essbares in ihren Pfoten gehalten hatte."
plPL = "Całe jej życie przenosiła kłody do tamy aż do samego końca, mimo że minęło dużo czasu odkąd miała w łapach coś jadalnego."
ptBR = "Ela continuou carregando troncos para a represa até o fim, embora já fizesse muito tempo desde que segurou algo comestível em suas patas."
koKR = "그녀는 먹을 것을 손에 쥔 지 오래였지만, 끝까지 댐으로 나무를 운반하는 일을 멈추지 않았다."
trTR = "Sonunda dam için odun taşımaya devam etti, ancak ellerinde yenilebilir bir şey tutmasının üzerinden uzun zaman geçmişti."
esES = "Siguió acarreando troncos a la presa hasta el final, aunque hacía mucho tiempo que no tenía nada comestible entre las patas."
itIT = "Continuò a trasportare tronchi fino alla diga fino alla fine, anche se da molto tempo non teneva più nulla di commestibile tra le zampe."
ukUA = "Вона відтягувала колоди до греблі аж до самого кінця, хоча вже давно нічого їстівного не тримала в лапах."
thTH = "เธอยังคงลากท่อนไม้ไปที่เขื่อนจนวาระสุดท้าย ทั้งที่เวลาผ่านมานานแล้วตั้งแต่อุ้งเท้าของเธอถือสิ่งใดที่กินได้"
csCZ = "Celou dobu nosila klády k hrázi, až do posledního okamžiku, i když už uběhla dlouhá doba, co měla něco jedlého ve svých tlapkách."
viVN = "Cô ấy đã tiếp tục kéo gỗ đến đập cho đến tận những phút cuối, mặc dù đã rất lâu rồi kể từ khi cô ấy cầm bất cứ thứ gì có thể ăn được trong tay."
caES = "Va continuar transportant troncs cap a la presa fins al final, tot i que feia molt de temps que no tenia res comestible entre les potes."
beBY = "Яна працягвала цягаць бервяно да плаціны да самага канца, хоць ужо даўно нічога ядомага ў лапах не трымала."
roRO = "Ea a continuat să transporte bușteni spre baraj până la capăt, deși trecuse mult timp de când ținuse în lăbuțe ceva comestibil."
huHU = "Egészen a végéig rönköket cipelt a gátig, pedig már régóta nem tartott a mancsában semmi ehető."
arSA = "ظلّت تجرّ الأخشاب إلى السد حتى النهاية، رغم مرور وقت طويل منذ أن أمسكت بشيء صالح للأكل بين مخالبها."

["BeaverFamilyTree.CauseOfDeath.Hunger.F.5"]
raw = "She checked every pantry in the district — and found the same hollow echo of emptiness in each one."
