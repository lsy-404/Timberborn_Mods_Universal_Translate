caES = "Ella va revisar cada rebost del districte i va trobar en cadascun el mateix eco buit de desolació."
beBY = "Яна правярала кожную кладоўку ў раёне — і ва ўсіх знаходзіла адну і тую ж пустату, гулкую, як пустое рэха."
roRO = "Ea a verificat fiecare magazie din district — și a găsit același ecou gol al golului în fiecare dintre ele."
huHU = "Ellenőrizte a körzet minden kamráját, és mindegyikben ugyanazt az üres, visszhangzó ürességet találta."
