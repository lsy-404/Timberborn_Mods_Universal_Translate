huHU = "Hallotta, hogy valahol a farakas belsejében víz csepeg, ezért a hang felé kúszott, amíg a hang el nem állt."
arSA = "سمعت صوت قطرات ماء تتساقط في مكان ما داخل جدار البيت، فزحفت نحو الصوت حتى توقف الصوت."

