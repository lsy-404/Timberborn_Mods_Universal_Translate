["BeaverFamilyTree.CauseOfDeath.Thirst.F.0"]
raw = "She licked at the cracked earth, hoping for even a drop of life-giving moisture, but never rose from the scorching ground again."
status = "normal"
enUS = "She licked at the cracked earth, hoping for even a drop of life-giving moisture, but never rose from the scorching ground again."
zhCN = "她舔着干裂的土地，希望能得到一滴滋养生命的水分，但再也没有从炙热的地面上爬起。"
zhTW = "她舔着裂开的土地，希望能得到一滴赋予生命的水分，但再也没有从灼热的地面上站起。"
ruRU = "Она лизала треснувшую землю, надеясь на хотя бы каплю дарующей жизнь влаги, но больше никогда не поднялась с жгучей земли."
jaJP = "彼女はひび割れた大地を舐めて、命を与える湿気が一滴でも得られることを望んだが、二度と灼熱の地面から立ち上がることはなかった。"
frFR = "Elle lécha la terre craquelée, espérant même une goutte d'humidité vivifiante, mais ne se leva plus jamais du sol brûlant."
deDE = "Sie leckte an der rissigen Erde und hoffte auf auch nur einen Tropfen lebensspendender Feuchtigkeit, doch sie erhob sich nie wieder vom brennenden Boden."
plPL = "Lizała spękaną ziemię, licząc na choćby kroplę dającej życie wilgoci, ale nigdy już nie podniosła się z palącej ziemi."
ptBR = "Ela lambeu a terra rachada, esperando por até uma gota de umidade vital, mas nunca se levantou do chão escaldante novamente."
koKR = "그녀는 갈라진 땅을 핥으며 생명을 주는 수분이 한 방울이라도 있기를 바랐지만, 다시는 뜨거운 땅에서 일어나지 못했다."
trTR = "Kırılmış toprağı yaladı, yaşam veren nemden en az bir damla umarak ama bir daha asla kavurucu yerden kalkamadı."
esES = "Ella lamió la tierra agrietada, con la esperanza de encontrar siquiera una gota de humedad que le diera vida, pero nunca volvió a levantarse de aquel suelo abrasador."
itIT = "Leccava la terra screpolata, sperando in una sola goccia di umidità che desse vita, ma non si rialzò mai più dal suolo rovente."
ukUA = "Вона лизала потрісканий ґрунт, сподіваючись на хоча б краплю життєдайної вологи, але більше ніколи не піднялася з палючої землі."
thTH = "เธอเลียดินแตกระแหง หวังเพียงหยดความชุ่มชื้นที่หล่อเลี้ยงชีวิตสักหยด แต่ไม่เคยลุกขึ้นจากพื้นที่ร้อนระอุนั้นได้อีกเลย"
csCZ = "Lízala prasklou zem, doufajíc v alespoň kapku životodárné vláhy, ale už se nikdy nezdvihla z pálivé země."
viVN = "Cô liếm vào vùng đất nứt nẻ, hy vọng tìm thấy một giọt độ ẩm ban sự sống, nhưng không bao giờ đứng dậy từ mặt đất cháy bỏng nữa."
caES = "Ella va llepar la terra esquerdada, esperant trobar fins i tot una gota d'humitat que donés vida, però mai més es va aixecar del terra abrasador."
beBY = "Яна лізнула патрэсканую зямлю, спадзеючыся хоць на кропельку жыватворнай вільгаці, але больш ужо не паднялася з абпаленага гrunt."
roRO = "Ea a lins pământul crăpat, sperând la o picătură măcar de umezeală care dă viață, dar nu s-a mai ridicat niciodată de pe solul arzător."
huHU = "Megrepedt földet nyalogatta, abban a reményben, hogy akad rajta akár egy csepp életet adó nedvesség, de a perzselő talajról soha többé nem kelt fel."
arSA = "لحسَت الأرضَ المتشققة، عسى أن تجد ولو قطرة رطوبة تمنح الحياة، لكنها لم تنهض من على الأرض الملتهبة أبدًا."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.1"]
raw = "Her tongue stuck to the roof of her mouth, and the nearest canal was too far — thirst outran her legs."
status = "normal"
enUS = "Her tongue stuck to the roof of her mouth, and the nearest canal was too far — thirst outran her legs."
zhCN = "她的舌头粘在了上颚上，最近的运河太远——口渴超越了她的腿。"
zhTW = "她的舌頭黏在上顎，最近的運河距離太遠——口渴超越了她的雙腿。"
ruRU = "Её язык прилип к небу, а ближайший канал был слишком далеко — жажда обогнала её ноги."
jaJP = "「彼女の舌は口の上あごにくっつき、最寄りの運河は遠すぎた — 渇きが彼女の脚を超えた。」"
frFR = "Sa langue était collée au plafond de sa bouche, et le canal le plus proche était trop loin — la soif devança ses jambes."
deDE = "Zunge klebte am Gaumen und der nächste Kanal war zu weit entfernt – der Durst übertraf ihre Beine."
plPL = "Jej język przykleił się do podniebienia, a najbliższy kanał był zbyt daleko — pragnienie prześcignęło jej nogi."
ptBR = "Sua língua grudou no céu da boca, e o canal mais próximo estava longe demais — a sede superou suas pernas."
koKR = "그녀의 혀는 입천장에 붙어 있었고, 가장 가까운 운하는 너무 멀었다 — 목마름이 그녀의 다리를 앞질렀다."
trTR = "Dili damağına yapıştı ve en yakın kanal çok uzaktaydı — susuzluk bacaklarından hızlıydı."
esES = "Le pegaba la lengua al paladar, y el canal más cercano estaba demasiado lejos: la sed superó a sus piernas."
itIT = "La sua lingua si era attaccata al palato, e il canale più vicino era troppo lontano: la sete ebbe la meglio sulle sue gambe."
ukUA = "Її язик прилип до піднебіння, а найближчий канал був занадто далеко — спрага випередила її ноги."
thTH = "เธอลิ้นติดเพดานปาก และคลองที่ใกล้ที่สุดก็อยู่ไกลเกินไป ความกระหายแซงหน้าขาของเธอไป"
csCZ = "Jazyk jí přilepnul k patru a nejbližší kanál byl příliš daleko — žízeň ji předběhla."
viVN = "Lưỡi của cô dính chặt vào vòm miệng, và kênh gần nhất thì quá xa — cơn khát nhanh hơn cả đôi chân cô."
caES = "La seva llengua s'havia enganxat al paladar, i el canal més proper estava massa lluny: la set li va guanyar la cursa a les cames."
beBY = "Яе язык прыліпаў да неба рота, а найбліжэйшы канал быў занадта далёка — смага абагнала яе ногі."
roRO = "Limba ei s-a lipit de cerul gurii, iar canalul cel mai apropiat era prea departe — setea i-a luat-o înainte picioarelor."
huHU = "A nyelve a szájpadlásához tapadt, a legközelebbi csatorna pedig túl messze volt – a szomj gyorsabb volt a lábainál."
arSA = "لسانها التصق بسقف فمها، وكانت القناة الأقرب بعيدة جدًا — سبقها العطش إلى الركض بساقيها."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.2"]
raw = "She gnawed a little hollow into the parched clay, still believing there was water down there somewhere."
status = "normal"
enUS = "She gnawed a little hollow into the parched clay, still believing there was water down there somewhere."
zhCN = "“她在干裂的泥土中啃出一个小凹槽，仍然相信那里下方有水。”"
zhTW = "「她在焦渴的泥土上啃出一個小凹坑，仍然相信那裡面有水。」"
ruRU = "Она прогрызла небольшую ямку в пересохшей глине, все еще веря, что там внизу где-то есть вода."
jaJP = "「彼女は乾いた粘土に少し穴を開け、そこにどこか水があるとまだ信じていた。」"
frFR = "Elle a rongé un petit creux dans l'argile desséchée, croyant encore qu'il y avait de l'eau là-dessous quelque part."
deDE = "Sie nagte eine kleine Höhlung in den ausgetrockneten Ton, in der Hoffnung, dass sich irgendwo dort unten Wasser befand."
plPL = "Zgruzgotana trochę w suchą glinę, wciąż wierząc, że gdzieś tam na dole jest woda."
ptBR = "Ela roeu uma pequena cavidade na argila ressecada, ainda acreditando que havia água lá embaixo em algum lugar."
koKR = "그녀는 마른 점토에 작은 움푹 패인 자국을 남겼고, 그곳 어딘가에 물이 있을 것이라고 여전히 믿고 있었다."
trTR = "Kuru kilden biraz çiğnedi, orada bir yerde su olduğunu hâlâ inanarak."
esES = "Ella roía un pequeño hueco en la arcilla reseca, aún convencida de que en algún lugar, allá abajo, había agua."
itIT = "Ha rosicchiato una piccola cavità nell'argilla riarsa, convinta che da qualche parte laggiù ci fosse ancora dell'acqua."
ukUA = "Вона прогризла невеличку ямку в спраглій глині, все ще вірячи, що десь там, унизу, є вода."
thTH = "เธอแทะหลุมเล็ก ๆ ลงไปในดินเหนียวที่แห้งแตกระแหง ทั้งที่ยังเชื่อว่าใต้นั้นมีน้ำอยู่ที่ไหนสักแห่ง"
csCZ = "Vytvořila v vyprahlé hlíně malou prohlubeň, stále věříc, že tam dole někde je voda."
viVN = "Cô ấy đã gặm một cái hốc nhỏ vào lớp đất khô cằn, vẫn tin rằng có nước ở đâu đó dưới đó."
caES = "Ella va rosegar un petit forat dins l'argila assecada, encara convençuda que hi havia aigua en algun lloc a sota."
beBY = "Яна пагрызла невялікую ямку ў сухой гліне, усё яшчэ думаючы, што дзесьці там унізе ёсць вада."
roRO = "Ea a roadă o mică scobitură în argila uscată, încă sigură că undeva acolo jos există apă."
huHU = "Kirágott egy kis üreget a kiszáradt agyagba, és még mindig hitte, hogy valahol odalent van víz."
arSA = "قضمت حفرة صغيرة في الطين الجاف المتشقق، وما زالت تعتقد أن هناك ماءً في مكان ما تحت الأرض."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.3"]
raw = "Her throat burned worse than any fire — the water was right there, past the sluice, but the sluice was shut."
status = "normal"
enUS = "Her throat burned worse than any fire — the water was right there, past the sluice, but the sluice was shut."
zhCN = "“她的喉咙比任何火焰都要疼 — 水就在那儿，在水闸的另一边，但水闸关着。”"
zhTW = "她的喉嚨燃燒得比任何火焰都要劇烈——水就在那裡，過了水閘，但水閘卻關閉著。"
ruRU = "Её горло горело хуже любого огня — вода была прямо там, за затвором, но затвор был закрыт."
jaJP = "彼女の喉はどんな火よりもひどく焼けるようだった—水はすぐそこに、排水口の向こうにあったが、排水口は閉まっていた。"
frFR = "Sa gorge brûlait plus que n'importe quel feu – l'eau était juste là, derrière le canal, mais le canal était fermé."
deDE = "Ihr Hals brannte schlimmer als jedes Feuer – das Wasser war direkt dort, hinter dem Schleusentor, aber das Schleusentor war geschlossen."
plPL = "„Jej gardło paliło bardziej niż jakikolwiek ogień — woda była tuż obok, za śluzą, ale śluza była zamknięta.”"
ptBR = "Sua garganta ardia mais do que qualquer fogo — a água estava bem ali, além da comporta, mas a comporta estava fechada."
koKR = "그녀의 목은 어떤 불보다 더 뜨겁게 아팠다 — 물은 바로 저기, 수문을 지나 있었지만, 수문은 닫혀 있었다."
trTR = "Boğazı, tüm ateşlerden daha fazla yanıyordu — su tam oradaydı, kapakların ardında ama kapak kapalıydı."
esES = "Le ardía la garganta más que cualquier fuego: el agua estaba justo ahí, al otro lado de la compuerta, pero la compuerta estaba cerrada."
itIT = "Le bruciava la gola più di qualsiasi fuoco: l'acqua era proprio lì, oltre la chiusa, ma la chiusa era chiusa."
ukUA = "Її горло пекло сильніше за будь-який вогонь — вода була зовсім поруч, за шлюзом, але шлюз був зачинений."
thTH = "เสียงของเธอแสบคอยิ่งกว่าไฟใดๆ — น้ำอยู่ตรงนั้นเลย ผ่านประตูระบายน้ำไป แต่ประตูระบายน้ำถูกปิดอยู่"
csCZ = "Její hrdlo pálilo víc než jakýkoli oheň – voda byla přímo tam, za zámkem, ale zámek byl zavřený."
viVN = "Cổ họng cô ngứa ngáy hơn bất kỳ ngọn lửa nào — nước ngay đó, qua cống, nhưng cống đã bị đóng."
caES = "La seva gola cremava més que qualsevol foc: l'aigua era just allà, més enllà de la comporta, però la comporta estava tancada."
beBY = "Горла ў яе пякло мацней за любы агонь — вада была побач, за шлюзам, але шлюз быў зачынены."
roRO = "Gâtul ei ardea mai rău decât orice foc — apa era chiar acolo, dincolo de stavilă, dar stavila era închisă."
huHU = "A torka úgy égett, mint bármi más tűz — a víz ott volt, a zsilip mögött, de a zsilip zárva volt."
arSA = "حلقها يحترق أكثر من أي نار — كان الماء قريبًا هناك، خلف البوابة، لكن البوابة كانت مغلقة."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.4"]
raw = "She watched the distant water through clouding eyes and never managed that last stretch toward it."
status = "normal"
enUS = "She watched the distant water through clouded eyes and never managed that last stretch toward it."
zhCN = "她透过模糊的眼睛望向远处的水，却始终无法迈出最后一步。"
zhTW = "她透過朦朧的雙眼凝視著遙遠的水面，卻從未能成功走完那最後的距離。"
ruRU = "«Она смотрела на дальнюю воду сквозь затуманенные глаза и так и не сумела совершить последний шаг к ней.»"
jaJP = "「彼女はかすんだ目で遠くの水を見つめ、そこへの最後の距離を越えることはできなかった。」"
frFR = "Elle contemplait l'eau lointaine à travers des yeux embués et n'a jamais réussi à faire ce dernier pas vers elle."
deDE = "Sie sah das ferne Wasser durch trübe Augen und schaffte es nie, die letzten Meter dorthin zurückzulegen."
plPL = "Ona obserwowała odległą wodę przez zamglone oczy i nigdy nie zdołała pokonać ostatniego odcinka w jej kierunku."
ptBR = "Ela observou a água distante através de olhos embaçados e nunca conseguiu alcançar aquela última distância até ela."
koKR = "그녀는 흐려진 눈으로 먼 물을 바라보았지만, 그 물을 향한 마지막 거리를 결코 완주하지 못했다."
trTR = "Uzaklardaki suyu bulanık gözlerle izledi ve ona doğru son saate asla ulaşamadı."
esES = "Miraba el agua lejana con los ojos nublándose y nunca logró recorrer el último tramo hasta ella."
itIT = "Lei guardava l'acqua lontana con gli occhi annebbiati e non riuscì mai a percorrere l'ultimo tratto che la separava da lei."
ukUA = "Вона дивилася на далеку воду затуманеними очима й так і не змогла пройти останню відстань до неї."
thTH = "เธอมองดูแหล่งน้ำที่อยู่ไกลออกไปด้วยดวงตาที่พร่ามัว และไม่เคยสามารถเดินทางมาถึงจุดนั้นได้ในช่วงสุดท้าย"
