deDE = "Sie leckte die Tau von den Farnblättern die ganze Nacht, aber bis zum Morgen war es immer noch nicht genug."
plPL = "Pijała rosę z liści paproci przez całą noc, ale o świcie wciąż było to za mało."
ptBR = "Ela lambeu o orvalho das folhas de samambaia a noite toda, mas ao amanhecer ainda não era o suficiente."
koKR = "그녀는 밤새 양치식물 잎에서 이슬을 핥았지만 새벽이 되어도 여전히 부족했다."
trTR = "Gece boyunca eğreltiotlarının yapraklarından çiy içti ama sabah olunca yine de yeterli olmamıştı."
esES = "Lamió rocío de las hojas de helecho toda la noche, pero al amanecer seguía sin ser suficiente."
itIT = "Ha leccato rugiada dalle foglie di felce per tutta la notte, ma all'alba non era ancora bastata."
ukUA = "Вона злизувала росу з папороті всю ніч, але на світанку її все одно не вистачило."
thTH = "เธอเลียน้ำค้างจากใบเฟิร์นตลอดทั้งคืน แต่พอรุ่งสาง มันก็ยังไม่พอ"
csCZ = "Pila rosu z listů kapradin celou noc, ale k ránu to stále nebylo dost."
viVN = "Cô đã liếm sương trên lá dương xỉ suốt đêm, nhưng đến sáng vẫn không đủ."
caES = "Va llepar rosada de les fulles de falguera tota la nit, però quan va arribar l'alba encara no n'hi havia prou."
beBY = "Яна ўсю ноч злізвала раніцу з папараць-лісця, але на світанку гэтага ўсё роўна не хапіла."
roRO = "Ea a lins toată noaptea apă de rouă de pe frunzele de ferigă, dar până în zori tot nu fusese suficient."
huHU = "Egész éjjel harmatot nyalogatott a páfrányleveleken, de hajnalra még mindig nem volt elég."
