deDE = "Sie versuchte, mit ihren bloßen Pfoten einen Brunnen zu graben, aber der Boden war nach der langen Dürre härter als Stein geworden."
plPL = "Próbowała wykopać studnię swoimi nagimi łapami, ale ziemia stała się twardsza niż kamień po długiej suszy."
ptBR = "Ela tentou cavar um poço com as patas nuas, mas o solo havia se tornado mais duro que pedra após a longa seca."
koKR = "그녀는 맨손으로 우물을 파려고 했지만, 긴 가뭄이 지난 후 땅은 돌보다 더 단단해졌다."
trTR = "Uzun kuraklık sonrası yer taş gibi sertleştiği için çıplak pençeleriyle bir kuyu kazmaya çalıştı."
esES = "Intentó cavar un pozo con sus patas desnudas, pero el suelo se había endurecido más que la piedra tras la larga sequía."
itIT = "Ha cercato di scavare un pozzo con le sue zampe nude, ma il terreno era diventato più duro della pietra dopo la lunga siccità."
ukUA = "Вона намагалася викопати криницю голими лапами, але після довгої посухи земля стала твердішою за камінь."
thTH = "ภายหลังช่วงภัยแล้งที่ยาวนาน พื้นดินแข็งยิ่งกว่าหิน เธอพยายามขุดบ่อน้ำด้วยอุ้งเท้าเปล่า แต่ก็ไม่สำเร็จ"
csCZ = "Pokoušela se vykopat studnu svými holými tlapkami, ale země se po dlouhém suchu stala tvrdší než kámen."
viVN = "Cô cố gắng đào một cái giếng bằng đôi paw trần của mình, nhưng mặt đất đã cứng hơn đá sau thời gian hạn hán dài."
caES = "Va intentar cavar un pou amb les seves pròpies urpes, però el sòl s'havia endurit més que la pedra després de la llarga sequera."
beBY = "Яна спрабавала выкапаць калодзеж голымі лапамі, але пасля доўгай засухі зямля стала цвярдзейшай за камень."
roRO = "Ea a încercat să sape o fântână cu lăbuțele goale, dar pământul devenise mai dur decât piatra după secetă lungă."
huHU = "Megpróbált kutat ásni puszta mancsaival, de a hosszú szárazság után a talaj keményebb lett a kőnél."
arSA = "حاولت أن تحفر بئرًا بمخالبها العارية، لكن الأرض أصبحت أصلب من الحجر بعد الجفاف الطويل."

["BeaverFamilyTree.CauseOfDeath.Thirst.F.29"]
