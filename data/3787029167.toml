ukUA = "Останнє, що вона побачила, було небо, відбите у воді, яка була занадто далеко, щоб до неї дотягнутися."
thTH = "สิ่งสุดท้ายที่เธอเห็นคือท้องฟ้าที่สะท้อนอยู่ในผืนน้ำซึ่งอยู่ไกลเกินกว่าจะเอื้อมถึง"
csCZ = "Poslední věc, kterou viděla, byla obloha odrážející se ve vodě, která byla příliš daleko na to, aby se k ní dostala."
viVN = "Điều cuối cùng cô nhìn thấy là bầu trời phản chiếu trong nước quá xa để đến gần."
caES = "L'última cosa que va veure va ser el cel reflectit en una aigua massa lluny per arribar-hi."
