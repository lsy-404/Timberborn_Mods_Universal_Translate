esES = "Las arrugas de su rostro eran un mapa de los años que había vivido, y un día ese mapa simplemente se cerró."
itIT = "Le rughe sul suo viso erano una mappa degli anni che aveva vissuto, e un giorno quella mappa si chiuse semplicemente."
ukUA = "Зморшки на її обличчі були мапою прожитих років, а одного дня ця мапа просто закрилася."
thTH = "ริ้วรอยบนใบหน้าของเธอเป็นเหมือนแผนที่ของปีที่เธอเคยมีชีวิตอยู่ และวันหนึ่งแผนที่นั้นก็ปิดลงอย่างเรียบง่าย"
csCZ = "Vrásky na jejím obličeji byly mapou let, která prožila — a jednoho dne se ta mapa prostě zavřela."
viVN = "Nếp nhăn trên khuôn mặt cô là một bản đồ của những năm tháng cô đã sống — và một ngày nào đó, bản đồ đó đơn giản đã khép lại."
caES = "Les arrugues del seu rostre eren un mapa dels anys que havia viscut, i un dia aquell mapa simplement es va tancar."
beBY = "Маршчынкі на яе твары былі картай гадоў, пражытых ёю, — а аднойчы гэтая карта проста закрылася."
roRO = "Ridurile de pe fața ei erau o hartă a anilor pe care ii trăise — și într-o zi, harta aceea pur și simplu s-a închis."
huHU = "Az arcán lévő ráncok annak a éveknek a térképe volt, amelyeket leélt — és egy napon ez a térkép egyszerűen bezárult."
arSA = "تجاعيد وجهها كانت خريطة للسنوات التي عاشتها — ثم في يوم ما، انطوت تلك الخريطة ببساطة."

["BeaverFamilyTree.CauseOfDeath.OldAge.F.35"]
