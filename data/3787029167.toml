caES = "Les seves pates fràgils ja no podien aguantar un tronc, però van estrènyer amb força les grapes dels seus néts fins al final."
beBY = "Яе кволыя лапкі ўжо не маглі ўтрымаць бервяно, але да самага канца моцна трымалі лапкі сваіх унукаў."
