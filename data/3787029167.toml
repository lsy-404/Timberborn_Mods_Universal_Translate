beBY = "Ён толькі што перадаў сакрэт сваёй наймацнейшай плаціны, калі з лёгкім сэрцам адышоў на спачын."
roRO = "Tocmai terminase să transmită secretul celui mai rezistent baraj al său, când s-a dus la odihnă cu inima ușoară."
huHU = "Éppen most adta át a legszilárdabb gát titkát, amikor könnyű szívvel nyugovóra tért."
arSA = "كان قد انتهى للتو من تعليم سر أقوى سدوده، ثم مضى إلى راحته وقلبه خفيف."

["BeaverFamilyTree.CauseOfDeath.OldAge.32"]
raw = "His frail paws could no longer hold a log, but they held his grandkits' paws tight right to the end."
