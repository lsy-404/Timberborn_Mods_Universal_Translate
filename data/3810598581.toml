["CreativeMode.Lower.Description"]
raw = "Click and drag over an area to lower every tile by the selected number of levels. Anything standing on the removed terrain is removed."
status = "normal"
enUS = "Click and drag over an area to lower every tile by the selected number of levels. Anything standing on the removed terrain is removed."
zhCN = "在一片区域上点击并拖动，可将其中每个地块降低所选的层数。被移除地形上方的所有物体也会被移除。"
zhTW = "在一片區域上按住並拖曳，將其中每個地磚降低所選的層數。被移除地形上的所有物體也會一併移除。"
ruRU = "Нажмите и перетащите курсор по области, чтобы понизить каждую клетку на выбранное количество уровней. Всё, что стоит на удаляемой местности, будет удалено."
jaJP = "エリア上をクリックしてドラッグすると、すべてのタイルを選択したレベル数だけ低くします。取り除かれた地形の上にあるものはすべて取り除かれます。"
frFR = "Cliquez et faites glisser sur une zone pour abaisser chaque case du nombre de niveaux sélectionné. Tout ce qui se trouve sur le terrain supprimé est supprimé."
deDE = "Klicke und ziehe über einen Bereich, um jedes Feld um die ausgewählte Anzahl an Stufen abzusenken. Alles, was auf dem abgetragenen Gelände steht, wird entfernt."
plPL = "Kliknij i przeciągnij po obszarze, aby obniżyć każdy kafelek o wybraną liczbę poziomów. Wszystko, co znajduje się na usuwanym terenie, zostanie usunięte."
ptBR = "Clique e arraste sobre uma área para rebaixar cada bloco pelo número de níveis selecionado. Tudo o que estiver sobre o terreno removido também será removido."
koKR = "영역을 클릭한 채 드래그하면 해당 영역의 모든 타일을 선택한 단계 수만큼 낮춥니다. 제거된 지형 위에 있던 모든 것도 제거됩니다."
trTR = "Seçilen sayıda seviye alçaltmak için bir alanın üzerinde tıklayıp sürükleyin. Kaldırılan arazinin üzerinde bulunan her şey de kaldırılır."
esES = "Haz clic y arrastra sobre una zona para bajar todas las casillas el número de niveles seleccionado. Todo lo que esté sobre el terreno eliminado desaparecerá."
itIT = "Fai clic e trascina su un'area per abbassare ogni casella del numero di livelli selezionato. Tutto ciò che si trova sul terreno rimosso viene eliminato."
ukUA = "Клацніть і перетягніть по області, щоб знизити кожну клітинку на вибрану кількість рівнів. Усе, що стоїть на видаленому рельєфі, буде видалено."
thTH = "คลิกแล้วลากผ่านพื้นที่เพื่อลดระดับทุกช่องตามจำนวนระดับที่เลือก สิ่งใดก็ตามที่ตั้งอยู่บนภูมิประเทศที่ถูกนำออกจะถูกลบไปด้วย"
csCZ = "Kliknutím a tažením přes oblast snížíte každou dlaždici o zvolený počet úrovní. Vše, co stojí na odstraněném terénu, bude odstraněno."
viVN = "Nhấp và kéo trên một khu vực để hạ mọi ô xuống số cấp đã chọn. Mọi thứ nằm trên địa hình bị xóa cũng sẽ bị xóa."
caES = "Fes clic i arrossega per una zona per rebaixar cada casella el nombre de nivells seleccionat. Tot el que estigui damunt del terreny eliminat també s’elimina."
beBY = "Пстрыкніце і перацягніце курсор па вобласці, каб панізіць кожную клетку на выбраную колькасць узроўняў. Усё, што знаходзіцца на выдаленым рэльефе, таксама будзе выдалена."
roRO = "Faceți clic și trageți peste o zonă pentru a coborî fiecare dală cu numărul selectat de niveluri. Orice se află pe terenul îndepărtat este îndepărtat."
huHU = "Kattints és húzd végig az adott területen, hogy minden csempét a kiválasztott számú szinttel lejjebb süllyessz. Az eltávolított terepen álló minden dolog is eltávolításra kerül."
arSA = "انقر واسحب فوق منطقة لخفض كل بلاطة بعدد المستويات المحدد. يُزال كل ما يقف على التضاريس التي أُزيلت."

