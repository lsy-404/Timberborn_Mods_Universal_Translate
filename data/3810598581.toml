zhTW = "在一片區域上按住並拖曳，將其中每個地磚降低所選的層數。被移除地形上的所有物體也會一併移除。"
ruRU = "Нажмите и перетащите курсор по области, чтобы понизить каждую клетку на выбранное количество уровней. Всё, что стоит на удаляемой местности, будет удалено."
jaJP = "エリア上をクリックしてドラッグすると、すべてのタイルを選択したレベル数だけ低くします。取り除かれた地形の上にあるものはすべて取り除かれます。"
