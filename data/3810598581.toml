["CreativeMode.Lower.Description"]
status = "normal"
raw = "Click and drag over an area to lower every tile by the selected number of levels. Anything standing on the removed terrain is removed."
enUS = "Click and drag over an area to lower every tile by the selected number of levels. Anything standing on the removed terrain is removed."
zhCN = "点击并拖动区域，将该区域内的每个地块降低所选的层数。移除地形上方的所有物体也会被移除。"
zhTW = "在一個區域上按住並拖曳，將該區域內每個地塊降低選定的層數。移除地形上方的任何物體也會一併移除。"
ruRU = "Щёлкните и перетащите курсор по области, чтобы понизить каждую клетку на выбранное количество уровней. Всё, что стоит на удаляемом участке, будет удалено."
jaJP = "範囲をクリックしてドラッグすると、その範囲内のすべてのタイルが選択した段数だけ低くなります。取り除かれた地形の上にあるものはすべて取り除かれます。"
frFR = "Cliquez et faites glisser sur une zone pour abaisser chaque case du nombre de niveaux sélectionné. Tout ce qui se trouve sur le terrain retiré est supprimé."
deDE = "Klicke und ziehe über einen Bereich, um jedes Feld um die ausgewählte Anzahl an Ebenen abzusenken. Alles, was auf dem abgetragenen Gelände steht, wird entfernt."
plPL = "Kliknij i przeciągnij po obszarze, aby obniżyć każdy kafelek o wybraną liczbę poziomów. Wszystko, co znajduje się na usuwanym terenie, zostanie usunięte."
ptBR = "Clique e arraste sobre uma área para rebaixar cada bloco o número selecionado de níveis. Tudo o que estiver sobre o terreno removido também será removido."
koKR = "영역을 클릭한 채 드래그하면 모든 타일을 선택한 단계 수만큼 낮춥니다. 제거된 지형 위에 있던 것은 모두 제거됩니다."
csCZ = "Kliknutím a tažením přes oblast snížíte každou dlaždici o zvolený počet úrovní. Vše, co stojí na odstraněném terénu, bude odstraněno."
viVN = "Nhấp và kéo trên một khu vực để hạ tất cả ô xuống số tầng đã chọn. Mọi thứ nằm trên phần địa hình bị loại bỏ cũng sẽ bị loại bỏ."
trTR = "Seçilen katman sayısı kadar tüm karoları alçaltmak için bir alanın üzerine tıklayıp sürükleyin. Kaldırılan arazinin üzerinde bulunan her şey de kaldırılır."

