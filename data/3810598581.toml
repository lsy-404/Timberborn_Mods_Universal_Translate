deDE = "Klicke und ziehe über einen Bereich, um jedes Feld um die ausgewählte Anzahl an Stufen abzusenken. Alles, was auf dem abgetragenen Gelände steht, wird entfernt."
plPL = "Kliknij i przeciągnij po obszarze, aby obniżyć każdy kafelek o wybraną liczbę poziomów. Wszystko, co znajduje się na usuwanym terenie, zostanie usunięte."
ptBR = "Clique e arraste sobre uma área para rebaixar cada bloco pelo número de níveis selecionado. Tudo o que estiver sobre o terreno removido também será removido."
koKR = "영역을 클릭한 채 드래그하면 해당 영역의 모든 타일을 선택한 단계 수만큼 낮춥니다. 제거된 지형 위에 있던 모든 것도 제거됩니다."
csCZ = "Kliknutím a tažením přes oblast snížíte každou dlaždici o zvolený počet úrovní. Vše, co stojí na odstraněném terénu, bude odstraněno."
viVN = "Nhấp và kéo trên một khu vực để hạ mọi ô xuống số cấp đã chọn. Mọi thứ nằm trên địa hình bị xóa cũng sẽ bị xóa."
trTR = "Seçilen sayıda seviye alçaltmak için bir alanın üzerinde tıklayıp sürükleyin. Kaldırılan arazinin üzerinde bulunan her şey de kaldırılır."

