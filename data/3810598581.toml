["CreativeMode.Raise.Description"]
status = "normal"
raw = "Click and drag over an area to raise every tile by the selected number of levels. Anything standing in the way is removed."
enUS = "Click and drag over an area to raise every tile by the selected number of levels. Anything standing in the way is removed."
zhCN = "点击并拖动选定区域，将其中每个地块抬高所选的层数。挡路的任何物体都会被移除。"
zhTW = "在一片區域上按住並拖曳，即可將其中每個地塊升高所選的層數。擋路的任何物件都會被移除。"
ruRU = "Щёлкните и, удерживая кнопку, проведите по области, чтобы поднять каждую клетку на выбранное число уровней. Всё, что окажется на пути, будет удалено."
jaJP = "エリアをクリックしてドラッグすると、選択したレベル数だけすべてのタイルが高くなります。邪魔になるものはすべて取り除かれます。"
frFR = "Cliquez et faites glisser sur une zone pour élever chaque case du nombre de niveaux sélectionné. Tout ce qui se trouve sur le chemin est supprimé."
deDE = "Klicken und ziehen Sie über einen Bereich, um jede Kachel um die ausgewählte Anzahl an Stufen anzuheben. Alles, was im Weg steht, wird entfernt."
plPL = "Kliknij i przeciągnij po obszarze, aby podnieść każdą kratkę o wybraną liczbę poziomów. Wszystko, co stanie na drodze, zostanie usunięte."
ptBR = "Clique e arraste sobre uma área para elevar cada bloco o número de níveis selecionado. Tudo que estiver no caminho será removido."
koKR = "영역을 클릭한 채 드래그하여 모든 타일을 선택한 레벨만큼 높이세요. 경로를 막는 것은 모두 제거됩니다."
csCZ = "Kliknutím a tažením přes oblast zvýšíte každou dlaždici o zvolený počet úrovní. Vše, co stojí v cestě, bude odstraněno."
viVN = "Nhấp và kéo trên một khu vực để nâng mọi ô lên số tầng đã chọn. Mọi thứ cản đường sẽ bị loại bỏ."
trTR = "Seçilen seviye sayısı kadar tüm karoları yükseltmek için bir alanın üzerine tıklayıp sürükleyin. Yolu üzerinde duran her şey kaldırılır."

