["CreativeMode.InstantBuild.On"]
raw = "ON – new buildings are placed already finished, with no materials or builders needed. Click to turn off."
status = "normal"
enUS = "ON – new buildings are placed already finished, with no materials or builders needed. Click to turn off."
zhCN = "开启——新建筑放置后即已建成，无需材料或建造者。点击以关闭。"
zhTW = "開啟 – 新建築放置後即完工，不需要材料或建築工人。點擊以關閉。"
ruRU = "ВКЛ. Новые здания размещаются уже готовыми — материалы и строители не нужны. Нажмите, чтобы выключить."
jaJP = "オン – 新しい建物は資材も建設者も必要とせず、完成した状態で配置されます。クリックしてオフにします。"
frFR = "ACTIVÉ – les nouveaux bâtiments sont placés déjà terminés, sans matériaux ni bâtisseurs. Cliquez pour désactiver."
deDE = "AN – Neue Gebäude werden sofort fertig platziert, ohne Materialien oder Bauarbeiter zu benötigen. Zum Ausschalten klicken."
plPL = "WŁ. – nowe budynki są od razu gotowe, bez potrzeby dostarczania materiałów ani przydzielania budowniczych. Kliknij, aby wyłączyć."
ptBR = "ATIVADO – novas construções são colocadas já concluídas, sem precisar de materiais nem construtores. Clique para desativar."
