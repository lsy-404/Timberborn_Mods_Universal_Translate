["CreativeMode.Raise.Description"]
raw = "Click and drag over an area to raise every tile by the selected number of levels. Anything standing in the way is removed."
status = "normal"
enUS = "Click and drag over an area to raise every tile by the selected number of levels. Anything standing in the way is removed."
zhCN = "点击并拖动一个区域，将其中每个地块抬高所选的级数。挡路的任何物体都会被移除。"
zhTW = "在一個區域上按住並拖曳，即可將其中每個地塊升高所選的層數。任何擋路的物件都會被移除。"
ruRU = "Щёлкните и перетащите по области, чтобы поднять каждую клетку на выбранное число уровней. Всё, что окажется на пути, будет удалено."
jaJP = "エリアをクリックしてドラッグすると、すべてのタイルを選択した段数だけ高くします。邪魔になるものはすべて取り除かれます。"
frFR = "Cliquez et faites glisser sur une zone pour surélever chaque case du nombre de niveaux sélectionné. Tout ce qui se trouve sur le chemin est supprimé."
deDE = "Klicke und ziehe über einen Bereich, um jede Kachel um die ausgewählte Anzahl an Ebenen anzuheben. Alles, was im Weg steht, wird entfernt."
plPL = "Kliknij i przeciągnij po obszarze, aby podnieść każdą jego kratkę o wybraną liczbę poziomów. Wszystko, co stoi na drodze, zostanie usunięte."
ptBR = "Clique e arraste sobre uma área para elevar cada peça pelo número de níveis selecionado. Tudo que estiver no caminho será removido."
koKR = "영역을 클릭한 채 드래그해 모든 타일을 선택한 레벨 수만큼 올립니다. 길을 막는 것은 무엇이든 제거됩니다."
csCZ = "Kliknutím a tažením přes oblast zvýšíte každou dlaždici o zvolený počet úrovní. Vše, co stojí v cestě, bude odstraněno."
viVN = "Nhấp và kéo qua một khu vực để nâng mọi ô lên số tầng đã chọn. Mọi thứ cản đường sẽ bị xóa bỏ."
trTR = "Seçilen seviye sayısı kadar yükseltmek için bir alanın üzerine tıklayıp sürükleyin. Yoluna çıkan her şey kaldırılır."

