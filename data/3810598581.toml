["CreativeMode.Flatten.Description"]
raw = "Click and drag over an area to flatten it to the height of the first tile you click. Green tiles will be raised, red tiles lowered. Buildings, plants and overhangs in the way are removed."
status = "normal"
enUS = "Click and drag over an area to flatten it to the height of the first tile you click. Green tiles will be raised, red tiles lowered. Buildings, plants, and overhangs in the way are removed."
zhCN = "点击并拖动一片区域，将其夷平至你点击的第一个地块的高度。绿色地块会被抬高，红色地块会被降低。挡路的建筑、植物和悬空结构都会被移除。"
zhTW = "在一個區域上按住並拖曳，將該區域整平至你點擊的第一個地塊高度。綠色地塊會升高，紅色地塊會降低。擋路的建築、植物和懸垂物都會被移除。"
ruRU = "Нажмите и перетащите курсор по области, чтобы выровнять её по высоте первой плитки, на которую вы нажали. Зелёные плитки будут подняты, красные — опущены. Мешающие постройки, растения и нависающие участки будут удалены."
jaJP = "エリアをクリックしてドラッグすると、最初にクリックしたタイルの高さに平らになります。緑色のタイルは高くなり、赤色のタイルは低くなります。妨げになる建物、植物、張り出し部分は取り除かれます。"
frFR = "Cliquez et faites glisser sur une zone pour l’aplanir à la hauteur de la première case sur laquelle vous cliquez. Les cases vertes seront surélevées, les cases rouges abaissées. Les bâtiments, les plantes et les surplombs sur le passage seront supprimés."
deDE = "Klicke und ziehe über einen Bereich, um ihn auf die Höhe der ersten angeklickten Kachel abzuflachen. Grüne Kacheln werden angehoben, rote abgesenkt. Gebäude, Pflanzen und überhängende Teile im Weg werden entfernt."
plPL = "Kliknij i przeciągnij po obszarze, aby wyrównać go do wysokości pierwszego klikniętego pola. Zielone pola zostaną podniesione, a czerwone obniżone. Stojące na drodze budynki i rośliny oraz wystające elementy zostaną usunięte."
ptBR = "Clique e arraste sobre uma área para nivelá-la à altura do primeiro bloco em que você clicar. Os blocos verdes serão elevados, e os vermelhos, rebaixados. Construções, plantas e saliências no caminho serão removidas."
koKR = "영역을 클릭한 채 드래그해 첫 번째로 클릭한 타일의 높이에 맞춰 평탄화합니다. 초록색 타일은 높아지고 빨간색 타일은 낮아집니다. 작업을 방해하는 건물, 식물, 돌출부는 제거됩니다."
csCZ = "Kliknutím a tažením přes oblast ji srovnáte do výšky prvního políčka, na které kliknete. Zelená políčka se zvýší, červená sníží. Překážející budovy, rostliny a převisy budou odstraněny."
viVN = "Nhấp rồi kéo qua một khu vực để làm phẳng khu vực đó theo độ cao của ô đầu tiên bạn nhấp. Các ô màu xanh lá sẽ được nâng lên, các ô màu đỏ sẽ bị hạ xuống. Các công trình, cây cối và phần nhô ra cản đường sẽ bị xóa."
trTR = "Bir alanı tıklayıp sürükleyerek, tıkladığınız ilk karonun yüksekliğine düzleştirin. Yeşil karolar yükseltilir, kırmızı karolar alçaltılır. Yoldaki binalar, bitkiler ve çıkıntılar kaldırılır."

