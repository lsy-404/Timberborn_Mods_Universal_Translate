["CreativeMode.Flatten.Description"]
status = "normal"
raw = "Click and drag over an area to flatten it to the height of the first tile you click. Green tiles will be raised, red tiles lowered. Buildings, plants and overhangs in the way are removed."
enUS = "Click and drag over an area to flatten it to the height of the first tile you click. Green tiles will be raised, red tiles lowered. Buildings, plants, and overhangs in the way are removed."
zhCN = "点击并拖动一片区域，将其整平至你点击的第一个地块的高度。绿色地块会被抬高，红色地块会被降低。挡路的建筑、植物和悬空结构都会被移除。"
zhTW = "在一片區域上點擊並拖曳，將其整平至你點擊的第一個地塊高度。綠色地塊會升高，紅色地塊會降低。擋路的建築、植物和懸伸物都會被移除。"
ruRU = "Нажмите и перетащите курсор по области, чтобы выровнять её по высоте первой выбранной клетки. Зелёные клетки будут подняты, красные — опущены. Мешающие постройки, растения и нависающие участки будут удалены."
jaJP = "エリアをクリックしてドラッグすると、最初にクリックしたタイルの高さに平らにできます。緑色のタイルは高くなり、赤色のタイルは低くなります。邪魔な建物、植物、張り出し部分は取り除かれます。"
frFR = "Cliquez et faites glisser sur une zone pour l’aplanir à la hauteur de la première case sur laquelle vous cliquez. Les cases vertes seront surélevées, les rouges abaissées. Les bâtiments, les plantes et les surplombs qui se trouvent sur le chemin seront supprimés."
deDE = "Klicke auf eine Fläche und ziehe, um sie auf die Höhe der ersten angeklickten Kachel einzuebnen. Grüne Kacheln werden angehoben, rote abgesenkt. Gebäude, Pflanzen und Überhänge, die im Weg sind, werden entfernt."
plPL = "Kliknij i przeciągnij po obszarze, aby wyrównać go do wysokości pierwszego klikniętego pola. Zielone pola zostaną podniesione, a czerwone obniżone. Stojące na drodze budynki, rośliny i nawisające elementy zostaną usunięte."
ptBR = "Clique e arraste sobre uma área para nivelá-la à altura do primeiro bloco em que você clicar. Os blocos verdes serão elevados, e os vermelhos, rebaixados. Construções, plantas e saliências no caminho serão removidas."
koKR = "영역을 클릭한 채 드래그하면, 처음 클릭한 타일의 높이에 맞춰 평평하게 만듭니다. 초록색 타일은 높아지고 빨간색 타일은 낮아집니다. 방해되는 건물, 식물, 돌출부는 제거됩니다."
csCZ = "Kliknutím a tažením přes oblast ji srovnáte do výšky prvního políčka, na které kliknete. Zelená políčka se zvýší, červená sníží. Překážející budovy, rostliny a převisy budou odstraněny."
viVN = "Nhấp rồi kéo qua một khu vực để san phẳng khu vực đó theo độ cao của ô đầu tiên bạn nhấp vào. Các ô màu xanh lá sẽ được nâng lên, các ô màu đỏ sẽ bị hạ xuống. Công trình, cây cối và phần nhô ra chắn đường sẽ bị dỡ bỏ."
trTR = "Bir alanı, tıkladığınız ilk karonun yüksekliğine düzlemek için tıklayıp sürükleyin. Yeşil karolar yükseltilir, kırmızı karolar alçaltılır. Önünüze çıkan binalar, bitkiler ve çıkıntılar kaldırılır."

