["Battery.Flywheels.SmallFlywheel.Description"]
raw = "A small and low-capacity flywheel built inline with a shaft. Platforms can be built over them similar to shafts."
status = "normal"
enUS = "A small, low-capacity flywheel built inline with a shaft. Platforms can be constructed over them similar to shafts."
zhCN = "用旋转的飞轮存储电能，容量较小。储存的电能越多，飞轮转得越快。"
zhTW = "一個小型且低容量的飛輪，與軸線連接。平台可以像軸一樣在它們上面建造。"
ruRU = "Небольшой и низкоемкий маховик, установленный в линию с валом. Над ним можно строить платформы, аналогично валам."
jaJP = "シャフトに直線的に組み込まれた小型で低容量のフライホイール。シャフトと同様に、上にプラットフォームを構築することができます。"
frFR = "Un petit volant d'inertie de faible capacité intégré à un arbre. Des plateformes peuvent être construites au-dessus d'eux, similaires aux arbres."
deDE = "Ein kleiner und niederleistungsfähiger Schw Flywheel, der inline mit einer Welle gebaut ist. Plattformen können ähnlich wie Wellen über ihnen gebaut werden."
plPL = "Małe i niskokapacitacyjne koło zamachowe zbudowane w linii z wałem. Na ich podstawie można budować platformy podobnie jak na wałach."
ptBR = "Um volante pequeno e de baixa capacidade construído em linha com um eixo. Plataformas podem ser construídas sobre eles, semelhantes aos eixos."
koKR = "축과 일체형으로 제작된 작고 저용량의 플라이휠입니다. 축과 유사하게 그 위에 플랫폼을 건설할 수 있습니다."
trTR = "Bir şaft ile hizalanmış küçük ve düşük kapasiteli bir flywheel. Şaftlar gibi üzerine platformlar inşa edilebilir."
esES = "Un volante de inercia pequeño y de baja capacidad, instalado en línea con un eje. Se pueden construir plataformas encima, igual que con los ejes."
itIT = "Un volano piccolo e di capacità ridotta, disposto in linea con un albero. È possibile costruire piattaforme sopra di esso, come sugli alberi."
ukUA = "Невеликий маховик малої місткості, встановлений на одній лінії з валом. Над ним можна будувати платформи, як і над валами."
thTH = "ล้อช่วยแรงขนาดเล็กและมีความจุต่ำ ติดตั้งในแนวเดียวกับเพลา สามารถสร้างแท่นด้านบนได้เช่นเดียวกับเพลา"
csCZ = "Malé a nízkokapacitní setrvačník, který je umístěn podél hřídele. Nad ním lze stavět platformy podobně jako nad hřídeli."
viVN = "Một bánh đà nhỏ có dung lượng thấp được tích hợp trực tiếp với một trục. Các nền tảng có thể được xây trên chúng tương tự như các trục."
caES = "Un volant d'inèrcia petit i de poca capacitat, integrat en línia amb un eix. S'hi poden construir plataformes al damunt, igual que als eixos."
beBY = "Невялікі махавік малой ёмістасці, усталяваны на адной лініі з валам. Над ім можна будаваць платформы, як і над валамі."
roRO = "Un volant mic, cu capacitate redusă, montat în linie cu un ax. Deasupra lui se pot construi platforme, la fel ca deasupra axurilor."
huHU = "Kis méretű, kis kapacitású lendkerék, amely a tengely vonalába épül. A tengelyekhez hasonlóan platformok építhetők föléjük."
arSA = "دولاب موازنة صغير ومنخفض السعة يُركّب على امتداد عمود نقل الحركة. يمكن بناء المنصات فوقه، كما هو الحال مع أعمدة نقل الحركة."

