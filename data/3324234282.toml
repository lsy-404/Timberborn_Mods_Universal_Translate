thTH = "ระเบิดไดนาไมต์โดยอัตโนมัติเมื่อการก่อสร้างเสร็จสมบูรณ์ เทมเพลตนี้สามารถนำไปใช้กับไดนาไมต์ที่สร้างเสร็จแล้วได้เช่นกัน"
