["IgorZ.Automation.Tool.tmpl.EmptyAtXpct.Description"]
raw = "This template can be applied to building that produce goods and have no input stock. If the <i>output</i> stock level exceeds the predetermined threshold, the building will transition into an 'empty' mode, facilitating rapid removal of goods."
status = "normal"
enUS = "This template can be applied to buildings that produce goods and have no input stock. If the <i>output</i> stock level exceeds the predetermined threshold, the building will transition into an 'empty' mode, facilitating rapid removal of goods."
zhCN = "此模板适用于不需要原料的生产建筑。如果产物库存高于预定阈值，建筑将切换到“清空”模式，以便快速清除货物。"
zhTW = "該模板可應用於生產商品且沒有投入庫存的建築。如果<i>產出</i>庫存水平超過預定閾值，建築將轉換為“空置”模式，以促進商品的快速移除。"
ruRU = "Этот шаблон можно применить к зданиям, которые производят товары и не имеют запасов сырья. Если уровень запасов <i>выходного</i> продукта превышает заранее определенный порог, здание перейдет в режим \"пустое\", что облегчит быструю ликвидацию товаров."
jaJP = "このテンプレートは、商品を生産し、入力在庫がない建物に適用できます。<i>出力</i>の在庫レベルが事前に設定された閾値を超えると、建物は「空」モードに移行し、商品の迅速な除去を促進します。"
frFR = "Ce modèle peut être appliqué aux bâtiments qui produisent des biens et n'ont pas de stock d'entrées. Si le niveau de stock <i>de sortie</i> dépasse le seuil prédéfini, le bâtiment passera en mode 'vide', facilitant ainsi l'élimination rapide des biens."
deDE = "Diese Vorlage kann auf Gebäude angewendet werden, die Waren produzieren und keinen Inputvorrat haben. Wenn der <i>Ausgangs-</i>Vorratsbestand den festgelegten Schwellenwert überschreitet, wechselt das Gebäude in einen 'leeren' Modus, um eine schnelle Entfernung von Waren zu ermöglichen."
plPL = "Ten szablon może być stosowany do budynków, które produkują towary i nie mają zapasów surowców. Jeśli poziom zapasów <i>wyjściowych</i> przekroczy ustalony próg, budynek przejdzie w tryb 'pusty', co ułatwi szybkie usuwanie towarów."
ptBR = "Este modelo pode ser aplicado a edifícios que produzem mercadorias e não possuem estoque de insumos. Se o nível de estoque de <i>produtos</i> exceder o limiar pré-determinado, o edifício irá entrar em um modo 'vazio', facilitando a remoção rápida das mercadorias."
koKR = "이 템플릿은 재화를 생산하고 입력 재고가 없는 건물에 적용할 수 있습니다. 만약 <i>출력</i> 재고 수준이 미리 정해진 임계값을 초과하면, 건물은 '비어 있음' 모드로 전환되어 재화의 신속한 제거를 촉진합니다."
csCZ = "Tato šablona může být aplikována na budovy, které vyrábějí zboží a nemají žádný vstupní sklad. Pokud úroveň <i>výstupního</i> skladu překročí stanovený práh, budova přejde do 'prázdného' režimu, což usnadní rychlé odstranění zboží."
viVN = "Mẫu này có thể áp dụng cho các tòa nhà sản xuất hàng hóa và không có tồn kho đầu vào. Nếu mức tồn kho <i>đầu ra</i> vượt quá ngưỡng đã xác định, tòa nhà sẽ chuyển sang chế độ 'rỗng', giúp việc loại bỏ hàng hóa nhanh chóng."
trTR = "Bu şablon, mal üreten ve girdi stokuna sahip olmayan binalara uygulanabilir. Eğer <i>çıktı</i> stok seviyesi önceden belirlenmiş eşiği geçerse, bina 'boş' moda geçecek ve malların hızlı bir şekilde kaldırılmasını kolaylaştıracaktır."

