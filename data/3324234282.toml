["IgorZ.Automation.Tool.tmpl.TemperateSemiOpenFloodgate.Description"]
raw = "Apply this template on floodgates that should open by 0.5m of their max height when the temperate season starts."
status = "normal"
enUS = "Apply this template to floodgates that should open by 0.5m of their maximum height when the temperate season begins."
zhCN = "此规则适用于闸门，会在温和期开始时部分打开，可通过高度为0.5米。需要与其他闸门自动化规则配合使用。"
zhTW = "將此模板應用於應在溫暖季節開始時以最大高度的0.5米打開的洪水閘門。"
ruRU = "Примените этот шаблон для затворов, которые должны открываться на 0,5 м от их максимальной высоты, когда начинается теплая пора года."
jaJP = "このテンプレートを、温暖な季節が始まるときに最大高さの0.5m分開くべきフラッドゲートに適用してください。"
frFR = "Appliquez ce modèle aux vanne d'écluse qui doivent s'ouvrir de 0,5 m de leur hauteur maximale lorsque la saison tempérée commence."
deDE = "Wenden Sie diese Vorlage bei Schleusen an, die sich um 0,5 m ihrer maximalen Höhe öffnen sollten, wenn die Temperatursaison beginnt."
plPL = "Zastosuj ten szablon do grodzisk, które powinny otworzyć się na 0,5 m ich maksymalnej wysokości, gdy rozpoczyna się sezon temperaturowy."
ptBR = "Aplique este modelo em comportas que devem abrir 0,5 m de sua altura máxima quando a temporada temperada começar."
koKR = "온대 계절이 시작될 때 최대 높이의 0.5m만큼 열어야 하는 수문에 이 템플릿을 적용하세요."
trTR = "Bu şablonu, ılıman mevsim başladığında maksimum yüksekliğinin 0.5m açılması gereken baraj kapaklarına uygulayın."
esES = "Aplica esta plantilla a las compuertas de inundación que deben abrirse 0,5 m respecto a su altura máxima cuando comience la estación templada."
itIT = "Applica questo modello alle chiuse che devono aprirsi di 0,5 m rispetto alla loro altezza massima quando inizia la stagione temperata."
ukUA = "Застосуйте цей шаблон до шлюзів, які мають відкриватися на 0,5 м від своєї максимальної висоти, коли починається помірна пора року."
thTH = "ใช้เทมเพลตนี้กับประตูน้ำที่ควรเปิดขึ้นอีก 0.5 เมตรจากความสูงสูงสุดเมื่อฤดูอบอุ่นเริ่มต้น"
csCZ = "Aplikujte tuto šablonu na zátarasy, které se mají otevřít o 0,5 m jejich maximální výšky, když začne mírné roční období."
viVN = "Áp dụng mẫu này cho các cổng xả nước cần mở ra 0,5 mét so với chiều cao tối đa của chúng khi mùa ôn hòa bắt đầu."
caES = "Apliqueu aquesta plantilla a les comportes que s'han d'obrir fins a 0,5 m de la seva alçada màxima quan comenci l'estació temperada."
beBY = "Прымяніць гэты шаблон да шлюзаў, якія павінны адчыняцца на 0,5 м ад іх максімальнай вышыні, калі пачынаецца ўмераны сезон."
roRO = "Aplicați acest șablon porților de inundare care ar trebui să se deschidă cu 0,5 m din înălțimea lor maximă când începe sezonul temperat."
huHU = "Alkalmazd ezt a sablont azokra a zsilipekre, amelyeknek a mérsékelt évszak kezdetekor a maximális magasságuk 0,5 m-ével kell nyitniuk."
arSA = "طبّق هذا القالب على بوابات الفيضان التي ينبغي أن تفتح بمقدار 0.5 متر من أقصى ارتفاع لها عند بدء الموسم المعتدل."

