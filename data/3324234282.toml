["IgorZ.Automation.Tool.tmpl.EmitSelectedGood.Description"]
raw = "Apply this template to buildings that should emit a signal of the selected good amount in the storage. The signal can be used in conditions on the other buildings."
status = "normal"
enUS = "Apply this template to buildings that should emit a signal of the selected good amount in the storage. The signal can be used in conditions on the other buildings."
zhCN = "此规则适用于仓储建筑，可以发送仓储物品数量信号，用于其他建筑的自动化规则判断。"
zhTW = "將此模板應用於應該發出存儲中所選商品數量信號的建築物。該信號可用於其他建築物的條件中。"
ruRU = "Примените этот шаблон к зданиям, которые должны излучать сигнал о выбранном количестве товаров в хранилище. Сигнал может использоваться в условиях других зданий."
jaJP = "このテンプレートを、ストレージ内の選択した商品の量の信号を発信すべき建物に適用します。この信号は、他の建物の条件で使用できます。"
frFR = "Appliquez ce modèle aux bâtiments qui devraient émettre un signal de la quantité de produit sélectionnée dans le stockage. Le signal peut être utilisé dans les conditions des autres bâtiments."
deDE = "Wenden Sie diese Vorlage auf Gebäude an, die ein Signal der ausgewählten Menge an Gütern im Lager senden sollen. Das Signal kann in Bedingungen für andere Gebäude verwendet werden."
plPL = "Zastosuj ten szablon do budynków, które powinny emitować sygnał o wybranej ilości towaru w magazynie. Sygnał można wykorzystać w warunkach innych budynków."
ptBR = "Aplique este modelo em edifícios que devem emitir um sinal da quantidade do bem selecionado no armazenamento. O sinal pode ser usado em condições em outros edifícios."
koKR = "이 템플릿을 사용하여 선택한 상품의 양을 저장고에서 방출해야 하는 건물에 적용하십시오. 신호는 다른 건물의 조건에서 사용될 수 있습니다."
trTR = "Bu şablonu, depodaki seçilen malzeme miktarının sinyalini yayması gereken binalara uygulayın. Sinyal, diğer binalardaki koşullarda kullanılabilir."
esES = "Aplica esta plantilla a los edificios que deben emitir una señal con la cantidad del bien seleccionado en el almacenamiento. La señal puede usarse en las condiciones de otros edificios."
itIT = "Applica questo modello agli edifici che devono emettere un segnale con la quantità del bene selezionato presente nel magazzino. Il segnale può essere usato nelle condizioni degli altri edifici."
ukUA = "Застосуйте цей шаблон до будівель, які мають видавати сигнал про кількість обраного товару в сховищі. Сигнал можна використовувати в умовах для інших будівель."
thTH = "ใช้เทมเพลตนี้กับอาคารที่ควรส่งสัญญาณเป็นปริมาณของสินค้าที่เลือกไว้ในคลังสินค้า สัญญาณดังกล่าวสามารถนำไปใช้ในเงื่อนไขของอาคารอื่นได้"
csCZ = "Aplikujte tuto šablonu na budovy, které by měly vysílat signál o vybraném množství zboží ve skladu. Signál může být použit v podmínkách na jiných budovách."
viVN = "Áp dụng mẫu này cho các tòa nhà cần phát tín hiệu về số lượng hàng hóa được chọn trong kho. Tín hiệu này có thể được sử dụng trong các điều kiện cho các tòa nhà khác."
caES = "Aplica aquesta plantilla als edificis que han d'emetre un senyal de la quantitat del bé seleccionat a l'emmagatzematge. El senyal es pot fer servir en condicions d'altres edificis."
beBY = "Выкарыстоўвайце гэты шablon для будынкаў, якія павінны выдаваць сігнал пра колькасць выбранага тавару ў сховішчы. Сігнал можна выкарыстоўваць у ўмовах для іншых будынкаў."
roRO = "Aplicați acest șablon clădirilor care ar trebui să emită un semnal cu cantitatea bunului selectat din depozit. Semnalul poate fi folosit în condiții aplicate celorlalte clădiri."
huHU = "Alkalmazd ezt a sablont azokra az épületekre, amelyeknek a tárolóban lévő kiválasztott áru mennyiségéről jelet kell kibocsátaniuk. A jel más épületek feltételeiben is felhasználható."
arSA = "تطبيق هذا القالب على المباني التي ينبغي أن تُصدر إشارةً بكمية السلعة المحددة في المخزن. يمكن استخدام الإشارة في الشروط المتعلقة بالمباني الأخرى."

