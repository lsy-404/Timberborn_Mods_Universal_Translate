["IgorZ.Automation.Tool.tmpl.XLevelsDynamite.Description"]
raw = "This template can be applied to dynamites, whether it is finished or still being built. Upon completion, the dynamite will detonate automatically, and a new dynamite blueprint will be placed to dig deeper."
status = "normal"
enUS = "This template can be applied to dynamites, whether it is finished or still being built. Upon completion, the dynamite will detonate automatically, and a new dynamite blueprint will be placed to dig deeper."
zhCN = "此规则适用于炸弹，建造完成后会自动引爆，随后放置新的炸弹并再次引爆，直至达到预定次数。"
zhTW = "這個模板可以應用於炸藥，無論它是已完成還是仍在建造中。完成後，炸藥將自動引爆，並會放置新的炸藥藍圖以進一步挖掘。"
ruRU = "Этот шаблон можно использовать для динамита, независимо от того, законченный он или все еще строится. После завершения динамит сработает автоматически, и будет размещен новый чертеж динамита для более глубокого копания."
jaJP = "このテンプレートは、完成したダイナマイトやまだ建設中のダイナマイトに適用できます。完成すると、ダイナマイトは自動的に爆発し、新しいダイナマイトの設計図が配置されてさらに深く掘ることができます。"
frFR = "Ce modèle peut être appliqué aux dynamites, qu'elles soient terminées ou en cours de construction. Une fois terminée, la dynamite se déclenchera automatiquement et un nouveau plan de dynamite sera placé pour creuser plus profondément."
deDE = "Diese Vorlage kann auf Dynamiten angewendet werden, egal ob sie fertiggestellt oder noch im Bau sind. Nach der Fertigstellung wird das Dynamit automatisch zünden, und ein neuer Dynamit-Plan wird platziert, um tiefer zu graben."
plPL = "Ten szablon można zastosować do dynamitów, niezależnie od tego, czy są one ukończone, czy wciąż w budowie. Po zakończeniu, dynamit eksploduje automatycznie, a nowy projekt dynamitu zostanie umieszczony, aby wykopać głębiej."
ptBR = "Este modelo pode ser aplicado a dinamites, estejam elas finalizadas ou ainda em construção. Após a conclusão, a dinamite detonará automaticamente e um novo projeto de dinamite será colocado para cavar mais profundo."
koKR = "이 템플릿은 완공 여부에 관계없이 다이너마이트에 적용될 수 있습니다. 완공 시 다이너마이트는 자동으로 폭발하며, 더 깊이 파기 위한 새로운 다이너마이트 설계도가 배치됩니다."
trTR = "Bu şablon, dinamitlere uygulanabilir, tamamlanmış veya hâlâ inşa edilen dinamitler için geçerlidir. Tamamlandığında, dinamit otomatik olarak patlayacak ve daha derin kazmak için yeni bir dinamit planı yerleştirilecektir."
esES = "Esta plantilla se puede aplicar a dinamitas, tanto si están terminadas como si aún se están construyendo. Al completarse, la dinamita detonará automáticamente y se colocará un nuevo plano de dinamita para excavar más profundo."
itIT = "Questo modello può essere applicato alla dinamite, sia che sia già completata sia che sia ancora in costruzione. Al termine, la dinamite esploderà automaticamente e verrà posizionato un nuovo progetto di dinamite per scavare più in profondità."
ukUA = "Цей шаблон можна застосувати до динамітів, як готових, так і тих, що ще будуються. Після завершення динаміт автоматично детонує, а на його місці буде розміщено новий креслення динаміту, щоб копати глибше."
thTH = "นำเทมเพลตนี้ไปใช้กับระเบิดไดนาไมต์ได้ ไม่ว่าจะสร้างเสร็จแล้วหรือยังสร้างอยู่ เมื่อสร้างเสร็จ ไดนาไมต์จะระเบิดโดยอัตโนมัติ และจะวางพิมพ์เขียวไดนาไมต์ใหม่เพื่อขุดลึกลงไปอีก"
csCZ = "Tato šablona může být aplikována na dynamity, ať už jsou dokončeny nebo stále ve výstavbě. Po dokončení se dynamit automaticky odpálí a bude umístěn nový plán dynamitu pro hloubení."
viVN = "Mẫu này có thể áp dụng cho thuốc nổ, cho dù thuốc nổ đã hoàn thành hay vẫn đang được chế tạo. Khi hoàn thành, thuốc nổ sẽ tự động nổ, và một bản thiết kế thuốc nổ mới sẽ được đặt để đào sâu hơn."
caES = "Aquesta plantilla es pot aplicar a dinamites, tant si ja estan acabades com si encara s'estan construint. Un cop completada, la dinamita detonarà automàticament i es col·locarà un nou plànol de dinamita per excavar més profund."
beBY = "Гэты шаблон можна ўжываць да дынамітаў, незалежна ад таго, гатовыя яны ці яшчэ будуюцца. Пасля завяршэння дынаміт выбухне аўтаматычна, а на месцы будзе размешчаны новы чарцёж дынаміту для далейшага капання."
roRO = "Acest șablon poate fi aplicat dinamitei, indiferent dacă este finalizată sau încă în construcție. La finalizare, dinamita va detona automat, iar un nou plan de dinamită va fi plasat pentru a săpa mai adânc."
huHU = "Ez a sablon dinamitra is alkalmazható, akár kész, akár még épülő állapotban van. Befejezéskor a dinamit automatikusan felrobban, és egy új dinamit-tervrajz kerül elhelyezésre, hogy tovább ássa a mélyebbre."
arSA = "هذا القالب يمكن تطبيقه على المتفجرات، سواء كانت مكتملة أو لا تزال قيد البناء. عند الاكتمال، ستنفجر المتفجرة تلقائياً، وسيتم وضع مخطط متفجرة جديد للحفر أعمق."

