arSA = "جسر زخرفي بممرات مشي قياسية على غرار الجسور المعلّقة."

["Bridgeworks.Supported.Description"]
raw = "Deck is one level above the base. Connect paths or stairs at deck height. Ground or platforms must support the marked legs or abutments."
status = "normal"
enUS = "Deck is one level above the base. Connect paths or stairs at deck height. Ground or platforms must support the marked legs or abutments."
zhCN = "甲板位于基础上方一层。在甲板高度连接道路或楼梯。地面或平台必须支撑标记的支腿或桥台。"
zhTW = "甲板位於基座上方一層。請在甲板高度連接道路或階梯。地面或平台必須能支撐標記的支腳或橋台。"
ruRU = "Настил находится на один уровень выше основания. Подключайте тропы или лестницы на высоте настила. Опоры или платформы под отмеченными ножками или упорами должны выдерживать нагрузку."
jaJP = "デッキは基礎より一段高い位置にあります。デッキの高さで道や階段を接続してください。マークされた脚や橋台は、地面または足場で支えられている必要があります。"
frFR = "Le tablier se situe à un niveau au-dessus de la base. Reliez les chemins ou les escaliers à la hauteur du tablier. Le sol ou les plateformes doivent supporter les pieds ou les culées marqués."
deDE = "Das Deck liegt eine Ebene über dem Fundament. Verbinde Pfade oder Treppen auf Deckhöhe. Boden oder Plattformen müssen die markierten Beine oder Widerlager tragen."
plPL = "Pomost znajduje się o jeden poziom wyżej niż podstawa. Łącz ścieżki lub schody na wysokości pomostu. Grunt lub platformy muszą podpierać oznaczone nogi lub przyczółki."
ptBR = "Plataforma fica um nível acima da base. Conecte caminhos ou escadas na altura da plataforma. O solo ou as plataformas devem sustentar os pilares ou apoios marcados."
koKR = "데크는 기본 층보다 한 단계 높습니다. 경로나 계단은 데크 높이에서 연결하세요. 지면이나 플랫폼은 표시된 다리 기둥이나 받침대를 지지해야 합니다."
trTR = "Güverte, tabanın bir kat üzerindedir. Yollar veya merdivenler güverte yüksekliğinde bağlanmalıdır. Zemin veya platformlar, işaretli ayakları veya dayanakları taşıyabilecek şekilde olmalıdır."
esES = "El tablero está un nivel por encima de la base. Conecta los caminos o las escaleras a la altura del tablero. El suelo o las plataformas deben sostener las patas o los estribos marcados."
itIT = "Il ponte si trova a un livello sopra la base. Collega sentieri o scale all'altezza del ponte. Il terreno o le piattaforme devono sostenere le gambe o le spalle contrassegnate."
ukUA = "Настил знаходиться на один рівень вище основи. Під'єднуйте шляхи або сходи на висоті настилу. Земля або платформи мають витримувати позначені опори чи упори."
thTH = "เดคอยู่สูงกว่าฐานหนึ่งระดับ เชื่อมทางเดินหรือบันไดที่ความสูงระดับเดค พื้นดินหรือแท่นต้องรองรับขาหรือตอม่อที่ทำเครื่องหมายไว้"
csCZ = "Plošina je o jednu úroveň výš než základna. Cesty nebo schody připojujte na výšku plošiny. Země nebo platformy musí podpírat označené nohy nebo opěry."
viVN = "Sàn nằm cao hơn nền một tầng. Kết nối lối đi hoặc cầu thang ở ngang độ cao của sàn. Mặt đất hoặc nền tảng phải đỡ được các chân trụ hoặc mố được đánh dấu."
caES = "La coberta és un nivell per sobre de la base. Connecteu camins o escales a l'alçada de la coberta. El terreny o les plataformes han de subjectar les cames o els estribs marcats."
beBY = "Палуба знаходзіцца на адзін узровень вышэй за аснову. Злучайце сцежкі або лесвіцы на ўзроўні палубы. Зямля або платформы павінны падтрымліваць пазначаныя ногі або апоры."
roRO = "Punțea este cu un nivel mai sus decât baza. Conectați drumurile sau scările la înălțimea punții. Solul sau platformele trebuie să susțină picioarele sau culeele marcate."
huHU = "A fedélzet egy szinttel a alap felett van. Az ösvényeket vagy lépcsőket fedélzet magasságában csatlakoztasd. A talajnak vagy a platformoknak meg kell tartaniuk a megjelölt lábakat vagy támaszokat."
arSA = "السطح يقع على مستوى واحد أعلى من القاعدة. وصّل الممرات أو الدرج عند ارتفاع السطح. يجب أن تدعم الأرض أو المنصات الأرجل أو الدعامات المحددة."

["Bridgeworks.Covered.Description"]
raw = "A roofed timber bridge. Reserves two levels for the deck, posts and roof."
status = "normal"
enUS = "A roofed timber bridge. Reserves two levels for the deck, posts and roof."
zhCN = "有顶木桥。占用两层空间，分别用于桥面、桥柱和屋顶。"
zhTW = "有頂木橋。為橋面、支柱與屋頂保留兩層空間。"
ruRU = "Крытый деревянный мост. Занимает два уровня под настил, опоры и крышу."
jaJP = "屋根付きの木製の橋。床板、支柱、屋根のために2段分の高さを確保します。"
frFR = "Un pont en bois couvert. Réserve deux niveaux pour le tablier, les poteaux et le toit."
deDE = "Eine überdachte Holzbrücke. Reserviert zwei Ebenen für die Fahrbahn, die Pfosten und das Dach."
plPL = "Kryty drewniany most. Zarezerwowano dwa poziomy na pomost, słupy i dach."
ptBR = "Uma ponte de madeira coberta. Reserva dois níveis para o tabuleiro, os pilares e o telhado."
koKR = "지붕이 있는 목재 다리입니다. 바닥, 기둥, 지붕을 위해 두 개의 층을 차지합니다."
trTR = "Çatılı bir kereste köprü. Güverte, direkler ve çatı için iki kat ayrılır."
esES = "Un puente de madera con techo. Reserva dos niveles para la plataforma, los postes y el techo."
itIT = "Un ponte di legno coperto. Occupa due livelli per il piano di calpestio, i pali e il tetto."
ukUA = "Криті дерев'яні містки. Займає два рівні для настилу, опор і даху."
thTH = "สะพานไม้มีหลังคา สงวนพื้นที่สองระดับสำหรับพื้น เสาค้ำ และหลังคา"
csCZ = "Krytý dřevěný most. Vyhrazuje dvě úrovně pro mostovku, sloupy a střechu."
viVN = "Một cầu gỗ có mái che. Dành hai tầng cho mặt cầu, cột trụ và mái."
caES = "Un pont de fusta cobert. Reserva dos nivells per a la coberta, els pilars i el sostre."
beBY = "Драўляны мост з дахам. Займае два ўзроўні для настылу, апор і даху."
roRO = "Un pod din lemn cu acoperiș. Rezervă două niveluri pentru tablier, stâlpi și acoperiș."
huHU = "Egy fedett fahíd. Két szintet foglal le a pályának, a támasztékoknak és a tetőnek."
arSA = "جسر خشبي مسقوف. يحجز مستويين للسطح والأعمدة والسقف."

