viVN = "Một cây cầu trang trí với các lối đi kết nối kiểu cầu treo tiêu chuẩn."
caES = "Un pont decoratiu amb connexions per caminar d'un pont penjant estàndard."
beBY = "Дэкаратыўны мост са стандартнымі пешаходнымі праходамі, як у падвесных мостах."
roRO = "Un pod decorativ cu conexiuni standard pentru mers pe jos, specifice podurilor suspendate."
