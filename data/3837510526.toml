["Bridgeworks.Description"]
new = "A decorative bridge with standard suspension-bridge walking connections."
status = "normal"

["Bridgeworks.Supported.Description"]
new = "Deck is one level above the base. Connect paths or stairs at deck height. Ground or platforms must support the marked legs or abutments."
status = "normal"

