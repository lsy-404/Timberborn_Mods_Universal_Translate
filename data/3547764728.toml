plPL = "Naciśnij Alternatywną Akcję (domyślnie Shift) podczas wybierania narzędzia budowlanego, aby zamiast tego usunąć ten rodzaj budynku."
ptBR = "Segure a Ação Alternativa (Shift por padrão) enquanto escolhe a ferramenta de construção para deletar esse tipo de construção."
koKR = "이 종류의 건물을 삭제하려면 건축 도구를 선택하는 동안 대체 작업(기본 Shift)을 누르고 있어야 합니다."
trTR = "Bu tür bir binayı silmek için bina aracını seçerken Alternatif Eylemi (varsayılan Shift) basılı tutun."
esES = "Mantén pulsada la acción alternativa (Mayús de forma predeterminada) mientras seleccionas la herramienta de construcción\npara eliminar este tipo de edificio en su lugar"
itIT = "Tieni premuta l’Azione alternativa (Maiusc per impostazione predefinita) mentre selezioni lo strumento di costruzione\nper eliminare invece questo tipo di edificio"
ukUA = "Утримуйте клавішу альтернативної дії (за замовчуванням — Shift), вибираючи інструмент будівництва,\nщоб натомість видалити цей тип будівлі"
thTH = "กดปุ่มการกระทำรองค้างไว้ (ค่าเริ่มต้นคือ Shift) ขณะเลือกเครื่องมือก่อสร้าง\nเพื่อลบสิ่งปลูกสร้างประเภทนี้แทน"
csCZ = "Podržte alternativní akci (výchozí Shift) při výběru nástroje na stavění, \nabyste místo toho odstranili tento typ budovy."
viVN = "Giữ hành động thay thế (mặc định là Shift) khi chọn công cụ xây dựng\nđể xóa loại công trình này thay vì loại khác"
caES = "Mantén premuda l’acció alternativa (Maj per defecte) mentre selecciones una eina de construcció\nper eliminar aquest tipus d’edifici en comptes de construir-lo"
beBY = "Утрымлівайце клавішу альтэрнатыўнага дзеяння (па змаўчанні Shift) пры выбары інструмента будынка,\nкаб замест гэтага выдаліць будынкі гэтага тыпу"
roRO = "Ține apăsată Acțiunea alternativă (implicit, Shift) în timp ce selectezi unealta de construcție\npentru a șterge în schimb acest tip de clădire"
huHU = "Tartsd lenyomva a Másodlagos műveletet (alapértelmezés szerint Shift), miközben kiválasztod az építési eszközt\nha inkább ilyen típusú épületet szeretnél törölni"
