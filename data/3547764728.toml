["LV.T4UX.UpdateText740"]
raw = "- Added 'Copy building' feature. While in the default (Cursor) tool, middle click (mouse 3, rebindable) on a building to quickly switch to that building tool. You can also then hold Shift to delete matching buildings with 'Shift to Delete' function.\n- The following features now work in the Map Editor: Recent tool, Collapsible entity panels and the recently added Copy building.\n- Fixed disabling idle worker warning from the Mod Settings not working.\n- Fixed recent tool hotkey not working."
status = "abandoned"
enUS = "- Added 'Copy building' feature. While in the default (Cursor) tool, middle click (mouse 3, rebindable) on a building to quickly switch to that building tool. You can also then hold Shift to delete matching buildings with 'Shift to Delete' function.\n- The following features now work in the Map Editor: Recent tool, Collapsible entity panels and the recently added Copy building.\n- Fixed disabling idle worker warning from the Mod Settings not working.\n- Fixed recent tool hotkey not working."
zhCN = "- 新增'复制建筑'功能。在使用默认（光标）工具时，中键点击（鼠标3键，可重新绑定）建筑可快速切换到该建筑工具。随后还可按住Shift键使用'Shift键删除'功能删除匹配的建筑。<br>- 以下功能现可在地图编辑器中工作：最近使用的工具、可折叠实体面板以及新增的复制建筑功能。<br>- 修复了在模组设置中禁用闲置工人警告无效的问题。<br>- 修复了最近使用工具快捷键无效的问题。"
zhTW = "- 新增「複製建築」功能。在默認（游標）工具下，使用中鍵點擊（滑鼠 3，可重新綁定）建築，以快速切換到該建築工具。然後您也可以按住 Shift 來使用「Shift 刪除」功能刪除匹配的建築。\n- 以下功能現在在地圖編輯器中可用：最近工具、可摺疊的實體面板和最近新增的複製建築。\n- 修正了來自模組設置的閒置工作者警告無法關閉的問題。\n- 修正了最近工具熱鍵無法使用的問題。"
ruRU = "- Добавлена функция 'Копировать здание'. Находясь в стандартном (Курсор) инструменте, нажмите среднюю кнопку мыши (кнопка 3, переназначаемая) на здании, чтобы быстро переключиться на инструмент этого здания. Также вы можете удерживать Shift, чтобы удалить совпадающие здания с функцией 'Shift для удаления'.\n- Следующие функции теперь работают в редакторе карт: Последний инструмент, С collapsing entity panels и недавно добавленная функция Копировать здание.\n- Исправлено, что предупреждение о неактивных работниках из настроек мода не работает.\n- Исправлена проблема с горячей клавишей для последнего инструмента, которая тоже не работала."
jaJP = "- 「建物をコピー」機能を追加しました。デフォルトの（カーソル）ツールで、建物を中クリック（マウス3、リバインド可能）すると、その建物のツールにすぐに切り替えることができます。その後、Shiftキーを押し続けることで、「Shiftで削除」機能を使って一致する建物を削除することもできます。\n- 次の機能がマップエディタで動作するようになりました：最近使ったツール、折りたたみ可能なエンティティパネル、および最近追加された「建物をコピー」機能。\n- モッド設定からのアイドル作業者警告が無効にならない不具合を修正しました。\n- 最近使ったツールのホットキーが機能しない不具合を修正しました。"
frFR = "- Ajout de la fonctionnalité 'Copier bâtiment'. En utilisant l'outil par défaut (Curseur), cliquez avec le bouton du milieu (souris 3, reconfigurable) sur un bâtiment pour basculer rapidement vers cet outil de bâtiment. Vous pouvez également maintenir la touche Maj enfoncée pour supprimer les bâtiments correspondants avec la fonction 'Supprimer avec Maj'.\n- Les fonctionnalités suivantes fonctionnent désormais dans l'Éditeur de carte : outil récent, panneaux d'entités réductibles et la fonction 'Copier bâtiment' récemment ajoutée.\n- Correction de l'avertissement de travailleur inactif désactivé dans les Paramètres du Mod qui ne fonctionnait pas.\n- Correction de la touche de raccourci de l'outil récent qui ne fonctionnait pas."
deDE = "- Neue 'Gebäude kopieren'-Funktion hinzugefügt. Während du im Standardwerkzeug (Cursor) bist, klicke mit der mittleren Maustaste (Maus 3, neu belegbar) auf ein Gebäude, um schnell zu diesem Gebäude-Werkzeug zu wechseln. Du kannst dann auch die Shift-Taste gedrückt halten, um entsprechende Gebäude mit der Funktion 'Shift zum Löschen' zu entfernen.\n- Die folgenden Funktionen funktionieren jetzt im Karteneditor: Aktuelles Werkzeug, zusammenklappbare Entitätspanels und das kürzlich hinzugefügte Gebäude kopieren.\n- Das Deaktivieren der Warnung für inaktive Arbeiter in den Mod-Einstellungen funktioniert nicht.\n- Hotkey für aktuelles Werkzeug funktioniert nicht."
plPL = "- Dodano funkcję 'Kopiuj budynek'. Będąc w domyślnym narzędziu (Kursor), kliknij środkowym przyciskiem myszy (mysz 3, można zmienić przypisanie) na budynku, aby szybko przełączyć się na to narzędzie budowlane. Możesz również przytrzymać Shift, aby usunąć pasujące budynki z funkcją 'Shift do usunięcia'.\n- Następujące funkcje są teraz aktywne w Edytorze Map: Ostatnie narzędzie, Złożone panele obiektów oraz niedawno dodany Kopiuj budynek.\n- Naprawiono problem z brakiem działania ostrzeżenia o bezczynnym robotniku z Ustawień Moda.\n- Naprawiono nie działający skrót klawiszowy dla ostatniego narzędzia."
ptBR = "- Adicionada a função 'Copiar edifício'. Enquanto estiver na ferramenta padrão (Cursor), clique com o botão do meio do mouse (mouse 3, reatributível) em um edifício para mudar rapidamente para a ferramenta desse edifício. Você também pode segurar Shift para deletar edifícios correspondentes com a função 'Shift para Deletar'.\n- As seguintes funções agora funcionam no Editor de Mapas: Ferramenta recente, painéis de entidades recolhíveis e a função 'Copiar edifício' recém-adicionada.\n- Corrigido o aviso de trabalhador ocioso desativado nas Configurações do Mod que não estava funcionando.\n- Corrigido a tecla de atalho da ferramenta recente que não estava funcionando."
koKR = "- '건물 복사' 기능이 추가 되었습니다. 기본(커서) 도구에서 건물 위에 마우스 중간 클릭(마우스 3, 다시 바인딩 가능)을 통해 해당 건물 도구로 빠르게 전환할 수 있습니다. 또한 Shift 키를 누른 채로 '삭제를 위한 Shift' 기능을 사용하여 일치하는 건물을 삭제할 수 있습니다.\n- 다음 기능이 이제 맵 편집기에서 작동합니다: 최근 도구, 접을 수 있는 개체 패널 및 최근에 추가된 건물 복사.\n- 모드 설정에서 유휴 작업자 경고 비활성화가 작동하지 않는 문제를 수정했습니다.\n- 최근 도구의 핫키가 작동하지 않는 문제를 수정했습니다."
trTR = "- 'Binasını kopyala' özelliği eklendi. Varsayılan (İmleç) aracında, bir binaya ortalı tıklayarak (fare 3, yeniden atama yapılabilir) hızla o bina aracına geçebilirsiniz. Ayrıca, 'Silmek için Shift' fonksiyonu ile eşleşen binaları silmek için Shift tuşunu basılı tutabilirsiniz.  \n- Aşağıdaki özellikler şimdi Harita Editörü'nde çalışıyor: Son araç, Katlanabilir varlık panelleri ve yeni eklenen Bina Kopyalama.  \n- Mod Ayarları'ndan boşta bekleyen işçi uyarısının devre dışı bırakılmasının çalışmaması düzeltildi.  \n- Son araç kısayolunun çalışmaması düzeltildi."
esES = "- Se añadió la función «Copiar edificio». Mientras usas la herramienta predeterminada (Cursor), haz clic con el botón central (botón 3, reasignable) en un edificio para cambiar rápidamente a esa herramienta de construcción. Después, también puedes mantener pulsada la tecla Mayús para eliminar edificios del mismo tipo con la función «Mayús para eliminar».\n- Las siguientes funciones ahora funcionan en el Editor de mapas: herramienta reciente, paneles de entidades plegables y la función Copiar edificio, añadida recientemente.\n- Se corrigió el problema que impedía desactivar la advertencia de trabajadores inactivos desde la Configuración de mods.\n- Se corrigió el problema que impedía usar el atajo de la herramienta reciente."
itIT = "- Aggiunta la funzione «Copia edificio». Con lo strumento predefinito (Cursore), fai clic con il tasto centrale (tasto 3, rimappabile) su un edificio per passare rapidamente allo strumento corrispondente. Puoi anche tenere premuto Maiusc per eliminare gli edifici corrispondenti con la funzione «Maiusc per eliminare».\n- Le seguenti funzioni ora sono disponibili nell'Editor mappe: Strumento recente, Pannelli delle entità comprimibili e la funzione Copia edificio aggiunta di recente.\n- Risolto il problema per cui la disattivazione dell'avviso sui lavoratori inattivi nelle Impostazioni mod non funzionava.\n- Risolto il problema per cui il tasto di scelta rapida dello strumento recente non funzionava."
ukUA = "- Додано функцію «Копіювати будівлю». Коли вибрано інструмент за замовчуванням («Курсор»), клацніть середньою кнопкою миші (кнопка 3, можна переналаштувати) по будівлі, щоб швидко перейти до інструмента цієї будівлі. Потім можна також утримувати Shift, щоб видаляти відповідні будівлі за допомогою функції «Shift для видалення».\n- Тепер у редакторі мап працюють такі функції: останній інструмент, згортання панелей об’єктів і нещодавно додана функція копіювання будівель.\n- Виправлено проблему, через яку вимкнення попередження про бездіяльних працівників у налаштуваннях модів не працювало.\n- Виправлено проблему, через яку гаряча клавіша останнього інструмента не працювала."
thTH = "- เพิ่มฟีเจอร์ 'คัดลอกสิ่งปลูกสร้าง' ขณะใช้เครื่องมือเริ่มต้น (เคอร์เซอร์) คลิกกลาง (ปุ่มเมาส์ 3 ซึ่งเปลี่ยนปุ่มได้) ที่สิ่งปลูกสร้างเพื่อสลับไปใช้เครื่องมือของสิ่งปลูกสร้างนั้นอย่างรวดเร็ว จากนั้นคุณยังสามารถกด Shift ค้างไว้เพื่อลบสิ่งปลูกสร้างที่ตรงกันด้วยฟังก์ชัน 'กด Shift เพื่อลบ' ได้\n- ฟีเจอร์ต่อไปนี้ใช้งานได้แล้วในตัวแก้ไขแผนที่: เครื่องมือล่าสุด แผงเอนทิตีที่ยุบได้ และฟีเจอร์คัดลอกสิ่งปลูกสร้างที่เพิ่งเพิ่มเข้ามา\n- แก้ไขปัญหาการปิดคำเตือนคนงานว่างงานจากการตั้งค่าม็อดแล้วไม่ทำงาน\n- แก้ไขปัญหาปุ่มลัดเครื่องมือล่าสุดไม่ทำงาน"
csCZ = "- Přidána funkce 'Kopírovat budovu'. Při použití výchozího nástroje (kurzor) klikněte středním tlačítkem myši (myš 3, přemapovatelné) na budovu pro rychlé přepnutí na nástroj této budovy. Můžete také držet Shift, abyste s funkcí 'Shift k odstranění' smazali odpovídající budovy.\n- Následující funkce nyní fungují v editoru map: Nedávný nástroj, skládací panely entit a nedávno přidaná funkce Kopírovat budovu.\n- Opraveno nefungování varování o nečinném pracovníkovi z nastavení modu.\n- Opraveno nefungování klávesové zkratky pro nedávný nástroj."
viVN = "- Thêm tính năng 'Sao chép công trình'. Trong công cụ mặc định (công cụ con trỏ), nhấp giữa chuột (chuột 3, có thể gán lại) trên một tòa nhà để nhanh chóng chuyển sang công cụ xây dựng tương ứng. Bạn cũng có thể giữ phím Shift để xóa các tòa nhà tương ứng với chức năng 'Shift to Delete'.\n- Các tính năng sau đây nay đã hoạt động trong Trình chỉnh sửa bản đồ: Công cụ gần đây, Các bảng điều khiển thực thể có thể thu gọn và tính năng Sao chép công trình vừa được thêm.\n- Đã sửa lỗi vô hiệu hóa cảnh báo công nhân nhàn rỗi từ Cài đặt Mod không hoạt động.\n- Đã sửa lỗi phím tắt của công cụ gần đây không hoạt động."
caES = "- S'ha afegit la funció «Copia l'edifici». Amb l'eina predeterminada (Cursor) activa, fes clic amb el botó del mig (ratolí 3, reassignable) sobre un edifici per canviar ràpidament a l'eina d'aquell edifici. Després també pots mantenir premuda la tecla Majús. per suprimir els edificis coincidents amb la funció «Majús. per suprimir».\n- Les funcions següents ja funcionen a l'editor de mapes: Eina recent, Panells d'entitats plegables i la funció «Copia l'edifici», afegida recentment.\n- S'ha corregit el problema que impedia desactivar l'avís de treballadors inactius des de la configuració del mod.\n- S'ha corregit el problema que impedia que funcionés la drecera de teclat de l'eina recent."
beBY = "- Дададзена функцыя «Капіяваць будынак». Калі выбраны стандартны інструмент (курсор), пстрыкніце сярэдняй кнопкай мышы (кнопка 3, можна перапрызначыць) па будынку, каб хутка пераключыцца на інструмент гэтага будынка. Пасля гэтага можна таксама ўтрымліваць Shift, каб выдаляць адпаведныя будынкі з дапамогай функцыі «Shift для выдалення».\n- Наступныя функцыі цяпер працуюць у рэдактары мапы: апошні інструмент, згортвальныя панэлі аб’ектаў і нядаўна дададзеная функцыя «Капіяваць будынак».\n- Выпраўлена праблема, праз якую не працавала магчымасць адключыць папярэджанне пра бяздзейных работнікаў у наладах мода.\n- Выпраўлена праблема, праз якую гарачая клавіша апошняга інструмента не працавала."
roRO = "- S-a adăugat funcția „Copierea clădirii”. Când folosiți unealta implicită (Cursor), faceți clic cu butonul din mijloc (butonul 3 al mouse-ului, reconfigurabil) pe o clădire pentru a comuta rapid la unealta acelei clădiri. Apoi puteți ține apăsată tasta Shift pentru a șterge clădirile corespunzătoare cu funcția „Shift pentru ștergere”.\n- Următoarele funcții funcționează acum în Editorul de hărți: unealta recentă, panourile de entități pliabile și funcția de copiere a clădirii adăugată recent.\n- S-a remediat problema care făcea ca dezactivarea avertizării privind muncitorii inactivi din Setările modului să nu funcționeze.\n- S-a remediat problema care făcea ca tasta rapidă pentru unealta recentă să nu funcționeze."
huHU = "- Hozzáadtuk az „Épület másolása” funkciót. Az alapértelmezett (Kurzor) eszköz használatakor kattints egy épületre a középső egérgombbal (3. egérgomb, átállítható), hogy gyorsan átválts az adott épület eszközére. Ezután a Shift nyomva tartásával törölheted az azonos épületeket a „Shift a törléshez” funkcióval.\n- A következő funkciók mostantól működnek a Térképszerkesztőben: Legutóbbi eszköz, összecsukható entitáspanelek és a nemrég hozzáadott Épület másolása.\n- Javítva, hogy a Modbeállításokban nem működött az inaktív dolgozókra vonatkozó figyelmeztetés letiltása.\n- Javítva a Legutóbbi eszköz gyorsbillentyűjének hibás működése."
arSA = "- أُضيفت ميزة «نسخ المبنى». أثناء استخدام الأداة الافتراضية (المؤشر)، انقر بزر الفأرة الأوسط (الزر 3، ويمكن إعادة تعيينه) على مبنى للتبديل سريعًا إلى أداة ذلك المبنى. يمكنك بعد ذلك أيضًا الضغط باستمرار على Shift لحذف المباني المطابقة باستخدام وظيفة «Shift للحذف».\n- أصبحت الميزات التالية تعمل الآن في محرر الخرائط: الأداة الأخيرة، ولوحات الكيانات القابلة للطي، وميزة نسخ المبنى المضافة حديثًا.\n- أُصلح عدم عمل تعطيل تحذير العامل العاطل من إعدادات التعديل.\n- أُصلح عدم عمل مفتاح اختصار الأداة الأخيرة."
