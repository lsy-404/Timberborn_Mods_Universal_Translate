["LV.T4UX.ShowDynamiteDestructionDesc"]
raw = "Show the terrain and buildings that would be destroyed when selecting a Dynamite.\nIf you have Multi-directional Dynamite mod enabled, this option is not needed and that mod would enable this option always."
status = "normal"
enUS = "Show the terrain and buildings that would be destroyed when selecting a Dynamite.\nIf you have Multi-directional Dynamite mod enabled, this option is not needed and that mod would enable this option always."
zhCN = "勾选后，选择炸弹时，高亮将被此炸弹破坏或崩塌的地形和建筑。<br>注意，如果是大量炸弹依次引爆，则需要使用模组“Macro Management”选择所有待引爆炸弹，才会显示最终将被破坏的范围。<br>注意，如果启用了模组“Multi-directional Dynamite”，则此功能始终生效，无需勾选此选项。"
zhTW = "顯示選擇炸藥時會被摧毀的地形和建築。如果您啟用了多方向炸藥模塊，則不需要此選項，該模塊將始終啟用此選項。"
ruRU = "Показать местность и здания, которые будут разрушены при выборе Динамита. Если у вас включен мод на Многонаправленный Динамит, эта опция не нужна, и этот мод всегда будет включать эту опцию."
jaJP = "ダイナマイトを選択した際に破壊される地形や建物を表示します。このオプションは、マルチ方向ダイナマイトモッドが有効になっている場合は必要ありません。そのモッドはこのオプションを常に有効にします。"
frFR = "Afficher le terrain et les bâtiments qui seraient détruits lors de la sélection d'une dynamite. Si vous avez le mod Dynamite multidirectionnelle activé, cette option n'est pas nécessaire et ce mod activera toujours cette option."
deDE = "Zeige das Terrain und die Gebäude, die zerstört werden würden, wenn man Dynamit auswählt. Wenn das Multi-Direktionale Dynamit-Mod aktiviert ist, wird diese Option nicht benötigt und das Mod aktiviert diese Option immer."
plPL = "Pokaż teren i budynki, które zostaną zniszczone po wybraniu dynamitu. Jeśli masz włączony mod Multi-directional Dynamite, ta opcja nie jest potrzebna, a ten mod zawsze włączy tę opcję."
ptBR = "Mostre o terreno e os edifícios que seriam destruídos ao selecionar uma Dinamite. Se você tiver o mod Dinamite Multidirecional ativado, esta opção não é necessária, e esse mod sempre irá habilitar esta opção."
koKR = "다이너마이트를 선택할 때 파괴될 지형과 건물을 표시합니다. \n다방향 다이너마이트 모드가 활성화되어 있으면 이 옵션은 필요하지 않으며, 해당 모드가 항상 이 옵션을 활성화합니다."
trTR = "Dinamiti seçtiğinizde yok edilecek arazi ve binaları gösterin. Eğer Çok Yönlü Dinamit modunu etkinleştirdiyseniz, bu seçenek gerekli değildir ve o mod bu seçeneği her zaman etkinleştirir."
esES = "Muestra el terreno y los edificios que serían destruidos al seleccionar dinamita.\nSi tienes activado el mod Multi-directional Dynamite, esta opción no es necesaria, ya que ese mod la activa siempre."
itIT = "Mostra il terreno e gli edifici che verrebbero distrutti selezionando una carica di dinamite.\nSe hai attiva la mod Multi-directional Dynamite, questa opzione non è necessaria: la mod la attiverà sempre."
ukUA = "Показувати місцевість і будівлі, які буде знищено під час вибору динаміту.\nЯкщо у вас увімкнено мод Multi-directional Dynamite, ця опція не потрібна, адже цей мод завжди вмикатиме її."
thTH = "แสดงภูมิประเทศและสิ่งปลูกสร้างที่จะถูกทำลายเมื่อเลือกไดนาไมต์\nหากเปิดใช้ม็อด Multi-directional Dynamite ตัวเลือกนี้ก็ไม่จำเป็น เพราะม็อดดังกล่าวจะเปิดใช้ตัวเลือกนี้ไว้ตลอด"
csCZ = "Zobrazit terén a budovy, které by byly zničeny při výběru Dynamitu. Pokud máte povolený modul Multi-directional Dynamite, tato možnost není potřebná a tento modul tuto možnost vždy aktivuje."
viVN = "Hiển thị địa hình và các công trình sẽ bị phá hủy khi chọn thuốc nổ.\nNếu bạn đã kích hoạt mod Thuốc nổ đa hướng, tùy chọn này sẽ không cần thiết và mod đó sẽ luôn bật tùy chọn này."
caES = "Mostra el terreny i els edificis que serien destruïts en seleccionar un explosiu de dinamita.\nSi tens activat el mod Multi-directional Dynamite, aquesta opció no és necessària, ja que aquest mod l’activarà sempre."
beBY = "Паказваць рэльеф і будынкі, якія будуць знішчаны пры выбары дынаміту.\nКалі ў вас уключаны мод Multi-directional Dynamite, гэтая опцыя не патрэбная: гэты мод заўсёды яе ўключае."
roRO = "Afișează terenul și clădirile care ar fi distruse la selectarea dinamitei.\nDacă ai activat modul Multi-directional Dynamite, această opțiune nu este necesară, iar acel mod ar activa-o întotdeauna."
huHU = "Dynamit kiválasztásakor mutassa meg a megsemmisülő terepet és épületeket.\nHa engedélyezve van a Multi-directional Dynamite mod, erre a beállításra nincs szükség, és az a mod mindig engedélyezi ezt a beállítást."
arSA = "اعرض التضاريس والمباني التي ستُدمَّر عند تحديد الديناميت.\nإذا كان تعديل الديناميت متعدد الاتجاهات مفعّلًا، فهذا الخيار غير مطلوب، إذ سيُفعّل ذلك التعديل هذا الخيار دائمًا."

