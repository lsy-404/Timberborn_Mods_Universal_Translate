ruRU = "Удерживайте альтернативное действие (по умолчанию Shift) во время выбора инструмента постройки, чтобы удалить этот тип здания вместо этого."
jaJP = "建築ツールを選択している間、代替アクション（デフォルトはShift）を押し続けると、この種類の建物を削除できます。"
frFR = "Maintenez l'Action Alternative (Shift par défaut) tout en choisissant l'outil de construction pour supprimer ce type de bâtiment à la place."
