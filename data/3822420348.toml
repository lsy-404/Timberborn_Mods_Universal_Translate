koKR = "세금 날짜가 사용자 지정이거나, 난이도 설정이 사용자 지정 프리셋과 일치할 때 사용됩니다. 세금 날짜에 과학 점수에서 가져갈 수 있는 최소 비율입니다."
trTR = "Vergi günleri Özel olarak ayarlandığında veya zorluk Özel ayarıyla Eşleştirildiğinde kullanılır. Vergi gününün bilim puanlarınızdan alabileceği en küçük pay."
