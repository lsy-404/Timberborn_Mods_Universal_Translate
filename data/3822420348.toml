esES = "Mostrar la ventana emergente de bienvenida del Dr. Gnawstein una sola vez, cuando una colonia comience por primera vez con este mod."
itIT = "Mostra il pop-up di benvenuto del Dr. Gnawstein una sola volta, quando una colonia inizia per la prima volta con questa mod."
