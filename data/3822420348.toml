esES = "Qué tan barato puede llegar a ser un edificio, como porcentaje de su costo normal de ciencia.\\nSe usa cuando el preajuste es Personalizado. Se aplica a las nuevas colonias."
itIT = "Quanto può costare al minimo un edificio, come percentuale del suo costo normale in scienza.\\nUsato quando la preimpostazione è Personalizzata. Si applica alle nuove colonie."
ukUA = "Наскільки дешевою може стати будівля, у відсотках від її звичайної вартості в науці.\\nВикористовується, коли пресет має значення «Власний». Застосовується до нових колоній."
thTH = "ระดับต่ำสุดที่อาคารจะลดค่าใช้จ่ายด้านวิทยาศาสตร์ได้ คิดเป็นเปอร์เซ็นต์ของต้นทุนวิทยาศาสตร์ปกติ\\nใช้เมื่อค่าตั้งล่วงหน้าเป็นแบบกำหนดเอง มีผลกับอาณานิคมใหม่"
csCZ = "Jak nízká může být cena budovy v procentech její běžné ceny ve vědě.\\nPoužije se při předvolbě Vlastní. Platí pro nové kolonie."
viVN = "Mức chi phí khoa học của một công trình có thể giảm tối đa bao nhiêu, tính theo phần trăm chi phí khoa học thông thường của nó.\\nĐược dùng khi thiết lập sẵn là Tùy chỉnh. Áp dụng cho các thuộc địa mới."
caES = "Quant pot arribar a costar un edifici, com a percentatge del seu cost normal en ciència.\\nS'utilitza quan el valor predefinit és Personalitzat. S'aplica a les colònies noves."
beBY = "Наколькі танна можа каштаваць будынак, у працэнтах ад яго звычайнага кошту навукі.\\nВыкарыстоўваецца, калі пасляпрыстасаванне мае значэнне Custom. Ужываецца да новых калоній."
roRO = "Cât de ieftin poate deveni o clădire, ca procent din costul normal de știință.\\nFolosit când presetarea este Personalizată. Se aplică coloniilor noi."
huHU = "Milyen olcsóvá válhat egy épület, a normál tudományos költségének százalékában.\\nAkkor használatos, ha az előbeállítás Egyéni. Új kolóniákra vonatkozik."
arSA = "ما مدى انخفاض تكلفة المبنى الممكن، كنسبة مئوية من تكلفة العلوم العادية له.\\nيُستخدم عندما تكون الإعداد المسبق \"مخصص\". ينطبق على المستعمرات الجديدة."

