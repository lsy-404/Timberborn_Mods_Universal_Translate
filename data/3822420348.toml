["DamScience.TaxThr.Tooltip"]
raw = "Used when Tax days is Custom, or Match difficulty with the Custom preset. Taxes start once your science first reaches this amount."
status = "normal"
enUS = "Used when Tax days is set to Custom, or when Match difficulty uses the Custom preset. Taxes start once your science first reaches this amount."
zhCN = "当纳税日设置为“自定义”，或在“难度匹配”中使用“自定义”预设时使用。科学值首次达到此数值时开始征税。"
zhTW = "當稅收日設為「自訂」或難度設為「自訂」預設值時使用。科學點數首次達到此數量時開始徵稅。"
ruRU = "Используется, если для налоговых дней выбрано значение «Настраиваемый» или для сложности выбрана настройка «Как в игре» с пресетом «Настраиваемый». Налоги начнут взиматься, когда ваши очки науки впервые достигнут этого значения."
jaJP = "「税の日数」が「カスタム」の場合、または難易度が「カスタム」プリセットと一致する場合に使用します。科学力がこの値に初めて達すると、税の徴収が始まります。"
frFR = "Utilisé lorsque les jours de taxes sont définis sur Personnalisé, ou lorsque la difficulté est définie sur Correspondre à la difficulté avec le préréglage Personnalisé. Les taxes commencent lorsque vos points de science atteignent cette valeur pour la première fois."
deDE = "Wird verwendet, wenn die Steuertage auf „Benutzerdefiniert“ oder die Schwierigkeit mit der Vorgabe „Benutzerdefiniert“ abgeglichen wird. Die Steuern beginnen, sobald deine Wissenschaft diesen Wert erstmals erreicht."
plPL = "Używane, gdy dni podatkowe są ustawione na „Niestandardowe” lub gdy wybrano dopasowanie poziomu trudności z niestandardowym presetem. Podatki zaczynają obowiązywać, gdy liczba punktów nauki po raz pierwszy osiągnie tę wartość."
ptBR = "Usado quando os dias de cobrança estão definidos como Personalizado ou quando a dificuldade está definida como Igualar, com a predefinição Personalizado. A cobrança começa quando sua ciência atinge esse valor pela primeira vez."
koKR = "세금 주기가 사용자 지정이거나, 난이도 일치에서 사용자 지정 프리셋을 사용할 때 적용됩니다. 과학 점수가 이 수치에 처음 도달하면 세금이 시작됩니다."
trTR = "Vergi günleri Özel olarak ayarlandığında veya Zorlukla eşleştir seçeneğinde Özel ön ayarı kullanıldığında geçerlidir. Bilim puanınız ilk kez bu miktara ulaştığında vergiler başlar."
esES = "Se usa cuando los Días de impuestos está en Personalizado, o cuando Igualar dificultad se establece con el preajuste Personalizado. Los impuestos comienzan una vez que tu ciencia alcance por primera vez esta cantidad."
itIT = "Usato quando i giorni di tassazione sono impostati su Personalizzato, oppure quando la difficoltà è allineata al preset Personalizzato. Le tasse iniziano non appena la tua scienza raggiunge per la prima volta questa quantità."
ukUA = "Використовується, коли «Дні податків» має значення «Власні» або коли «Складність» відповідає власному пресету. Податки починають діяти, щойно ваша наука вперше досягне цього значення."
thTH = "ใช้เมื่อ \"วันเก็บภาษี\" ถูกตั้งเป็น \"กำหนดเอง\" หรือเมื่อ \"จับคู่ระดับความยาก\" กับค่าตั้งล่วงหน้า \"กำหนดเอง\" ภาษีจะเริ่มเก็บเมื่อค่าวิทยาศาสตร์ของคุณถึงจำนวนนี้เป็นครั้งแรก"
csCZ = "Používá se, když jsou dny výběru daní nastaveny na Vlastní, nebo když obtížnost odpovídá vlastnímu přednastavení. Daně se začnou vybírat, jakmile vaše věda poprvé dosáhne této hodnoty."
viVN = "Được dùng khi Ngày thu thuế là Tùy chỉnh hoặc khi Độ khó khớp với thiết lập Tùy chỉnh. Thuế bắt đầu khi khoa học của bạn lần đầu đạt đến mức này."
caES = "S'utilitza quan els Dies d'impost estan en Personalitzat, o quan la Dificultat de coincidència està amb el preajust Personalitzat. Els impostos comencen quan la ciència arriba per primera vegada a aquesta quantitat."
beBY = "Выкарыстоўваецца, калі «Дні падатку» мае значэнне «Карыстальніцкі» або «Адпаведнасць складанасці» з карыстальніцкім пресетам. Падаткі пачынаюць дзейнічаць, як толькі ваша навука ўпершыню дасягае гэтага значэння."
roRO = "Folosit atunci când Zilele de taxare este setat pe Personalizat sau când Potrivește dificultatea cu presetarea Personalizat. Taxele încep odată ce știința ta atinge prima dată această valoare."
huHU = "Egyéni adóztatási napok esetén, vagy a nehézség beállításakor az Egyéni előbeállítás használata esetén alkalmazandó. Az adók akkor kezdenek el érvényesülni, amikor a tudomány először eléri ezt a mennyiséget."
arSA = "يُستخدم عندما يكون \"أيام الضرائب\" مضبوطًا على \"مخصص\"، أو عند مطابقة الصعوبة مع الإعداد المسبق \"مخصص\". تبدأ الضرائب بمجرد أن يصل العلم إلى هذا المقدار لأول مرة."

