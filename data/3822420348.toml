["DamScience.Inv.Tooltip"]
raw = "On: the Inventor stays locked and its price is almost all the science you have when you unlock it (nothing if you have none). Pay more, get taxed less often.\\nOff: the Inventor is free and tax days are off.\\nApplies to new colonies. A colony that already has the Inventor is never taxed."
status = "normal"
enUS = "On: The Inventor stays locked, and its price is almost all the science you have when you unlock it (nothing if you have none). Pay more, get taxed less often.\\nOff: The Inventor is free, and tax days are off.\\nApplies to new colonies. A colony that already has the Inventor is never taxed."
zhCN = "开启：发明家仍处于锁定状态，解锁时的价格几乎会耗尽你所有的科学点数（如果没有科学点数，则免费）。支付越多，征税频率越低。\\\\n关闭：发明家免费，且不会征税。\\\\n仅适用于新殖民地。已经拥有发明家的殖民地永远不会被征税。"
zhTW = "開啟：發明家會保持鎖定，解鎖時的價格幾乎會耗盡你所有的科學點數（若沒有科學點數則不花費）。付得越多，課稅頻率越低。\\n關閉：發明家免費，且不會有課稅日。\\n僅適用於新殖民地。已經擁有發明家的殖民地永遠不會被課稅。"
ruRU = "Вкл.: Изобретатель остаётся заблокированным, а его стоимость составляет почти все имеющиеся у вас очки науки на момент разблокировки (ничего, если у вас их нет). Заплатите больше — налоги будут взиматься реже.\\nВыкл.: Изобретатель бесплатен, дни уплаты налогов отключены.\\nПрименяется к новым колониям. С колонии, в которой уже есть Изобретатель, налог никогда не взимается."
jaJP = "オン：発明家はロックされたままになり、アンロック時の価格は、手持ちのサイエンスのほぼすべてになります（サイエンスがなければ無料）。多く支払うほど、課税の頻度が下がります。\\nオフ：発明家は無料になり、課税日もなくなります。\\n新しいコロニーに適用されます。すでに発明家を持っているコロニーが課税されることはありません。"
frFR = "Activé : l’Inventeur reste verrouillé et son prix correspond à presque tous les points de science que vous possédez au moment où vous le débloquez (rien si vous n’en avez aucun). Payez plus, et les taxes seront moins fréquentes.\\nDésactivé : l’Inventeur est gratuit et les jours de taxe sont supprimés.\\nS’applique aux nouvelles colonies. Une colonie qui possède déjà l’Inventeur n’est jamais taxée."
deDE = "Ein: Der Erfinder bleibt gesperrt und kostet beim Freischalten fast alle Wissenschaftspunkte, die du hast (nichts, wenn du keine hast). Zahle mehr, werde seltener besteuert.\\nAus: Der Erfinder ist kostenlos und Steuertage sind deaktiviert.\\nGilt für neue Kolonien. Eine Kolonie, die den Erfinder bereits hat, wird niemals besteuert."
plPL = "Wł.: Wynalazca pozostaje zablokowany, a jego cena pochłania niemal całą posiadaną naukę w chwili odblokowania (nic, jeśli nie masz jej wcale). Zapłać więcej, a podatek będzie naliczany rzadziej.\\nWył.: Wynalazca jest darmowy, a dni podatkowe są wyłączone.\\nDotyczy nowych kolonii. Kolonia, która już ma Wynalazcę, nigdy nie płaci podatku."
ptBR = "Ligado: o Inventor permanece bloqueado, e seu preço é quase toda a ciência que você tem quando o desbloqueia (nada, se você não tiver nenhuma). Pague mais, seja tributado com menos frequência.\\nDesligado: o Inventor é grátis e os dias de tributação são desativados.\\nAplica-se a novas colônias. Uma colônia que já tenha o Inventor nunca é tributada."
koKR = "켜짐: 발명가가 잠금 상태로 유지되며, 잠금 해제 시 비용은 보유한 과학 점수의 거의 전부입니다(보유한 점수가 없으면 비용도 없습니다). 더 많이 지불할수록 세금 부과 간격이 길어집니다.\\n꺼짐: 발명가는 무료이며 세금 부과일이 없습니다.\\n새로운 식민지에 적용됩니다. 이미 발명가를 보유한 식민지에는 세금이 부과되지 않습니다."
trTR = "Açık: Mucit kilitli kalır ve fiyatı, kilidini açtığınızda sahip olduğunuz bilimin neredeyse tamamıdır (hiç biliminiz yoksa ücretsizdir). Daha fazla ödeyin, daha seyrek vergi ödeyin.\\\\nKapalı: Mucit ücretsizdir ve vergi günleri yoktur.\\\\nYeni koloniler için geçerlidir. Mucit'e zaten sahip olan bir koloniden asla vergi alınmaz."
esES = "On: el Inventor permanece bloqueado y su precio es casi todo la ciencia que tienes al desbloquearlo (nada si no tienes ninguna). Pagar más reduce la frecuencia de los impuestos.\\nOff: el Inventor es gratuito y los días de impuestos están desactivados.\\nSe aplica a las colonias nuevas. Una colonia que ya tiene el Inventor nunca paga impuestos."
itIT = "On: l'Inventore resta bloccato e il suo prezzo è quasi tutta la scienza che hai al momento dello sblocco (nulla se non ne hai). Paga di più, verrai tassato meno spesso.\\nOff: l'Inventore è gratuito e i giorni di tassa sono disattivati.\\nSi applica alle nuove colonie. Una colonia che possiede già l'Inventore non viene mai tassata."
ukUA = "On: Винахідник залишається заблокованим, а його ціна майже повністю дорівнює науці, яку ви маєте на момент розблокування (нічого, якщо її немає). Заплатите більше — податкові дні будуть рідшими.\\nOff: Винахідник безкоштовний, і податкових днів немає.\\nЗастосовується до нових колоній. Колонія, у якій уже є Винахідник, ніколи не платить податків."
thTH = "เปิด: ผู้ประดิษฐ์จะยังคงถูกล็อก และราคาของมันเกือบทั้งหมดคือวิทยาศาสตร์ที่คุณมีเมื่อปลดล็อก (ไม่มีค่าใช้จ่ายเลยหากคุณไม่มีวิทยาศาสตร์) จ่ายเพิ่ม จะถูกเก็บภาษีน้อยครั้งลง\\nปิด: ผู้ประดิษฐ์ไม่มีค่าใช้จ่ายและวันเก็บภาษีถูกปิด\\nใช้กับอาณานิคมใหม่ อาณานิคมที่มีผู้ประดิษฐ์อยู่แล้วจะไม่ถูกเก็บภาษีเลย"
csCZ = "Zapnuto: Vynálezce zůstává uzamčený a jeho cena činí téměř veškerou vědu, kterou máte při jeho odemčení (pokud žádnou nemáte, nestojí nic). Zaplaťte více a daňové dny budou méně časté.\\nVypnuto: Vynálezce je zdarma a daňové dny jsou vypnuté.\\nPlatí pro nové kolonie. Kolonie, která už Vynálezce má, nikdy neplatí daně."
viVN = "Bật: Nhà phát minh vẫn bị khóa và giá của nó gần như bằng toàn bộ khoa học bạn có khi mở khóa (nếu không có thì giá bằng 0). Trả nhiều hơn, ít bị đánh thuế hơn.\\\\nTắt: Nhà phát minh miễn phí và không có ngày thu thuế.\\\\nÁp dụng cho các thuộc địa mới. Thuộc địa đã có Nhà phát minh sẽ không bao giờ bị đánh thuế."
caES = "On: l'Inventor es manté bloquejat i el seu preu és gairebé tota la ciència que tens quan el desbloqueges (res si no en tens cap). Si pagues més, t'aplicaran impostos amb menys freqüència.\\nOff: l'Inventor és gratuït i els dies d'impostos queden desactivats.\\nS'aplica a les colònies noves. Una colònia que ja té l'Inventor mai no paga impostos."
beBY = "Уключана: Вынаходнік застаецца заблакаваным, а яго кошт амаль цалкам складаецца з навукі, якая ў вас ёсць на момант разблакоўкі (нічога, калі навукі няма). Заплаціце больш — і падатковыя дні будуць рэдзейшымі.\\nВыключана: Вынаходнік бясплатны, а падатковыя дні адключаны.\\nПрымяняецца да новых калоній. Калонія, у якой ужо ёсць Вынаходнік, ніколі не аплачвае падаткі."
roRO = "Pornit: Inventatorul rămâne blocat, iar prețul său este aproape în întregime știința pe care o ai când îl deblochezi (nimic, dacă nu ai niciuna). Plătești mai mult, ești taxat mai rar.\\nOprit: Inventatorul este gratuit, iar zilele de taxare sunt dezactivate.\\nSe aplică coloniilor noi. O colonie care deja are Inventatorul nu este niciodată taxată."
huHU = "On: a Feltaláló zárva marad, ára pedig szinte teljes egészében az a tudomány, amivel rendelkezel a feloldásakor (ha nincs tudományod, akkor semmi). Ha többet fizetsz, ritkábban adóztatnak.\\nKi: a Feltaláló ingyenes, és az adónapok ki vannak kapcsolva.\\nÚj kolóniákra vonatkozik. Az a kolónia, amelyben már van Feltaláló, soha nem fizet adót."
arSA = "تشغيل: يبقى المخترع مقفلاً، وسعره هو تقريباً كل العلم الذي تملكه عند فتحه (لا شيء إن لم تملك أي علم). ادفع أكثر لتُفرض عليك الضرائب بوتيرة أقل.\\nإيقاف: المخترع مجاني وأيام الضرائب معطلة.\\nينطبق على المستعمرات الجديدة. المستعمرة التي تملك المخترع بالفعل لا تُفرض عليها الضرائب أبداً."

