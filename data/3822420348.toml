["DamScience.Total.Tooltip"]
raw = "What the whole tech tree should cost in total, as a percent of its normal cost. Used when the preset is Custom.\\nApplies to new colonies."
status = "normal"
enUS = "What the entire tech tree should cost as a percentage of its normal cost. Used when the preset is Custom.\\nApplies to new colonies."
zhCN = "整个科技树的总费用占正常费用的百分比。预设为“自定义”时使用。\\\\n适用于新殖民地。"
zhTW = "整棵科技樹的總成本應為正常成本的百分比。僅於預設值為「自訂」時使用。\\n適用於新殖民地。"
ruRU = "Сколько должно стоить всё дерево технологий в процентах от обычной стоимости. Используется, если выбран пользовательский набор настроек.\\nПрименяется к новым колониям."
jaJP = "プリセットが「カスタム」の場合に使用される、技術ツリー全体の通常コストに対する合計コストの割合。\\\\n新しいコロニーに適用されます。"
frFR = "Coût total de l'arbre technologique complet, en pourcentage de son coût normal. Utilisé lorsque le préréglage est Personnalisé.\\\\nS'applique aux nouvelles colonies."
deDE = "Was der gesamte Technologiebaum insgesamt kosten soll, als Prozentsatz der normalen Kosten. Wird verwendet, wenn das Preset „Benutzerdefiniert“ ist.\\nGilt für neue Kolonien."
plPL = "Łączny koszt całego drzewa technologii jako procent jego normalnego kosztu. Używane, gdy wybrano ustawienie Niestandardowe.\\nDotyczy nowych kolonii."
ptBR = "Quanto a árvore tecnológica inteira deve custar no total, como porcentagem do custo normal. Usado quando a predefinição é Personalizada.\\nAplica-se a novas colônias."
koKR = "전체 기술 트리의 총 비용을 기본 비용의 몇 퍼센트로 할지 설정합니다. 프리셋이 사용자 지정일 때 사용됩니다.\\n새 정착지에 적용됩니다."
trTR = "Özel ön ayarı kullanırken tüm teknoloji ağacının normal maliyetinin yüzde kaçı olması gerektiği.\\nYeni kolonilere uygulanır."
esES = "Lo que debe costar en total todo el árbol tecnológico, como porcentaje de su coste normal. Se usa cuando el preajuste es Personalizado.\\nSe aplica a las colonias nuevas."
itIT = "Quanto dovrebbe costare in totale l'intero albero tecnologico, come percentuale del suo costo normale. Usato quando il preset è Personalizzato.\\nSi applica alle nuove colonie."
ukUA = "Загальна вартість усього дерева технологій у відсотках від її звичайної вартості. Використовується, коли обрано пресет «Власний».\\nЗастосовується до нових колоній."
thTH = "ค่ารวมของต้นไม้เทคโนโลยีทั้งหมดที่ต้องใช้ทรัพยากร คิดเป็นเปอร์เซ็นต์ของค่าปกติ ใช้เมื่อตั้งค่าล่วงหน้าเป็น กำหนดเอง\\nมีผลกับอาณานิคมใหม่เท่านั้น"
csCZ = "Kolik procent běžné ceny má celá technologie stát. Použije se, když je předvolba nastavena na Vlastní.\\nPlatí pro nové kolonie."
viVN = "Tổng chi phí của toàn bộ cây công nghệ, tính theo phần trăm so với chi phí thông thường. Dùng khi cài đặt trước là Tùy chỉnh.\\nÁp dụng cho các thuộc địa mới."
caES = "Quant hauria de costar en total tot l'arbre tecnològic, com a percentatge del seu cost normal. S'utilitza quan el valor predefinit és Personalitzat.\\nS'aplica a les colònies noves."
beBY = "Агульная кошт усяго дрэва тэхналогій у адсотках ад яго звычайнага кошту. Выкарыстоўваецца, калі абрана пярэдзадача «Уласная».\\nПрымяняецца да новых калоній."
roRO = "Costul total al întregului arbore tehnologic, exprimat ca procent din costul său normal. Se folosește când presetarea este Custom.\\nSe aplică la coloniile noi."
huHU = "A teljes technológiafa összes költsége a normál költség százalékában, ha a előre beállítás Egyéni. Új kolóniákra vonatkozik.\\nA teljes technológiafa összes költsége a normál költség százalékában, ha az előbeállítás Egyéni. Új kolóniákra vonatkozik."
arSA = "ما تكلفة شجرة التكنولوجيا الكاملة إجمالاً، كنسبة مئوية من تكلفتها العادية. تُستخدم عند ضبط الإعداد المسبق على \"مخصص\".\\nتنطبق على المستعمرات الجديدة."

