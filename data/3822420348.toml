["DamScience.TaxMode.Tooltip"]
status = "normal"
raw = "Off: no tax days.\\nMatch difficulty: the tax follows the difficulty preset above.\\nMild / Mad / Mayhem: pick a tax style of your own.\\nCustom: use the numbers below.\\nOnce your science reaches a set amount, the tax man comes every few cycles and takes a random percent of the science you hold. Pay more for the Inventor and he comes less often.\\nApplies to new colonies."
enUS = "Off: no tax days.\\nMatch difficulty: the tax follows the difficulty preset above.\\nMild / Mad / Mayhem: pick a tax style of your own.\\nCustom: use the numbers below.\\nOnce your science reaches a set amount, the tax man comes every few cycles and takes a random percent of the science you hold. Pay more for the Inventor and he comes less often.\\nApplies to new colonies."
zhCN = "关闭：不收税。\\n匹配难度：税收遵循上方的难度预设。\\n温和 / 疯狂 / 大混乱：自行选择税收风格。\\n自定义：使用下方的数值。\\n达到指定科学点数后，税吏每隔几轮就会来一次，随机收走你持有的部分科学点数。多付钱给发明家，税吏就会少来一些。\\n仅适用于新殖民地。"
zhTW = "關閉：不會有徵稅日。\\n符合難度：稅收依照上方的難度預設。\\n溫和／瘋狂／大亂鬥：自行選擇稅收風格。\\n自訂：使用下方的數值。\\n你的科學值達到指定數量後，稅吏每隔幾個週期就會來一次，隨機收取你持有的部分科學值。多付些錢給發明家，他就會減少來訪次數。\\n只適用於新殖民地。"
ruRU = "Выкл.: налоговых дней нет.\\nКак на сложности: налог соответствует выбранному выше уровню сложности.\\nЛёгкий / Безумный / Хаос: выберите собственный вариант налога.\\nНастраиваемый: используйте числа ниже.\\nКогда запас науки достигнет заданного значения, сборщик налогов будет приходить раз в несколько циклов и забирать случайный процент имеющейся у вас науки. Заплатите больше за Изобретателя — и он будет приходить реже.\\nПрименяется к новым колониям."
jaJP = "オフ：税の徴収なし。\\\\n難易度に合わせる：税は上記の難易度プリセットに従います。\\\\nマイルド／マッド／メイヘム：税のスタイルを自分で選びます。\\\\nカスタム：以下の数値を使用します。\\\\n科学力が一定量に達すると、税務官が数サイクルごとにやって来て、所持している科学力のランダムな割合を徴収します。発明家に多く支払うと、税務官が来る頻度は下がります。\\\\n新しいコロニーに適用されます。"
frFR = "Désactivé : aucun jour de taxe.\\nIdentique à la difficulté : la taxe suit le préréglage de difficulté ci-dessus.\\nClément / Fou / Chaos : choisissez votre propre style de taxe.\\nPersonnalisé : utilisez les chiffres ci-dessous.\\nUne fois que votre science atteint un certain montant, le collecteur d’impôts passe tous les quelques cycles et prélève un pourcentage aléatoire de la science que vous détenez. Payez davantage pour l’Inventeur et il passera moins souvent.\\nS’applique aux nouvelles colonies."
deDE = "Aus: keine Steuertage.\\\\nSchwierigkeitsgrad übernehmen: Die Steuer richtet sich nach dem obigen Schwierigkeitsgrad.\\\\nMild / Verrückt / Chaos: Wähle deinen eigenen Steuertyp.\\\\nBenutzerdefiniert: Verwende die Zahlen unten.\\\\nSobald deine Wissenschaft einen festgelegten Wert erreicht, kommt der Steuereintreiber alle paar Zyklen und nimmt einen zufälligen Prozentsatz deiner vorhandenen Wissenschaft. Zahle mehr für den Erfinder, dann kommt er seltener.\\\\nGilt für neue Kolonien."
plPL = "Wył.: żadnych dni podatkowych.\\nDopasuj trudność: podatek zależy od powyższego ustawienia trudności.\\nŁagodny / Szalony / Chaos: wybierz własny styl podatków.\\nNiestandardowe: użyj poniższych wartości.\\nGdy zgromadzisz określoną ilość punktów nauki, poborca podatkowy będzie przychodził co kilka cykli i zabierał losowy procent zgromadzonych punktów. Zapłać więcej za Wynalazcę, a będzie przychodził rzadziej.\\nDotyczy nowych kolonii."
ptBR = "Desativado: sem dias de imposto.\\nCorrespondência de dificuldade: o imposto segue a predefinição de dificuldade acima.\\nSuave / Louco / Caos: escolha seu próprio estilo de imposto.\\nPersonalizado: use os números abaixo.\\nQuando sua ciência atingir um determinado valor, o cobrador de impostos virá a cada poucos ciclos e levará uma porcentagem aleatória da ciência que você tiver. Pague mais pelo Inventor e ele virá com menos frequência.\\nAplica-se a novas colônias."
koKR = "끔: 세금을 내는 날이 없습니다.\\n난이도에 맞춤: 세금은 위의 난이도 프리셋을 따릅니다.\\n온화 / 광기 / 대혼란: 원하는 세금 방식을 선택하세요.\\n사용자 지정: 아래의 숫자를 사용합니다.\\n연구 점수가 일정량에 도달하면, 세금 징수원이 몇 주기마다 찾아와 보유한 연구 점수의 일정 비율을 무작위로 가져갑니다. 발명가에게 더 많이 지급하면 징수원이 덜 자주 찾아옵니다.\\n새로운 정착지에 적용됩니다."
csCZ = "Vypnuto: žádné dny placení daně.\\nObtížnost: daň se řídí výše nastavenou obtížností.\\nMírná / Šílená / Zběsilá: vyberte si vlastní styl daně.\\nVlastní: použijte níže uvedená čísla.\\nJakmile vaše věda dosáhne stanovené hodnoty, výběrčí daní přichází každých několik cyklů a vezme si náhodné procento vědy, kterou máte. Zaplaťte víc za Vynálezce a bude chodit méně často.\\nPlatí pro nové kolonie."
viVN = "Tắt: không có ngày thu thuế.\\nĐộ khó trùng khớp: thuế tuân theo thiết lập độ khó ở trên.\\nNhẹ / Điên cuồng / Hỗn loạn: tự chọn kiểu thuế.\\nTùy chỉnh: dùng các con số bên dưới.\\nKhi lượng khoa học của bạn đạt đến một mức nhất định, người thu thuế sẽ đến vài chu kỳ một lần và lấy ngẫu nhiên một phần trăm lượng khoa học bạn đang có. Trả nhiều hơn cho Nhà phát minh để ông ta đến ít thường xuyên hơn.\\nÁp dụng cho các thuộc địa mới."
trTR = "Kapalı: Vergi günü yok.\\\\nZorlukla eşleştir: Vergi, yukarıdaki zorluk ön ayarını izler.\\\\nIlımlı / Çılgın / Kaos: Kendi vergi tarzını seç.\\\\nÖzel: Aşağıdaki sayıları kullan.\\\\nBilimin belirli bir miktara ulaştığında, vergi memuru birkaç döngüde bir gelir ve elindeki bilimin rastgele bir yüzdesini alır. Mucit için daha fazla öde, böylece daha seyrek gelir.\\\\nYeni koloniler için geçerlidir."

