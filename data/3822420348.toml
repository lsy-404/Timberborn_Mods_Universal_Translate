["DamScience.Keep.Tooltip"]
new = "For the Mild, Mad and Mayhem presets. On: the whole tech tree costs a fair total (100% / 110% / 130% of normal).\\nOff: a harder total (115% / 135% / 170%). Custom ignores this and uses Total science (%) instead."
status = "normal"

["DamScience.Grants.Name"]
new = "Surprise buildings"
status = "normal"

["DamScience.Grants.Tooltip"]
new = "How many normally-free buildings Dr. Gnawstein turns into a surprise.\\nEach one is locked at the start. Unlocking it gives you science, or sometimes takes some. 0 turns this off. Used when the preset is Custom."
