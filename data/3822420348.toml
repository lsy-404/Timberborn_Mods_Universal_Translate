["DamScience.Grants.Tooltip"]
raw = "How many normally-free buildings Dr. Gnawstein turns into a surprise.\\nEach one is locked at the start. Unlocking it gives you science, or sometimes takes some. 0 turns this off. Used when the preset is Custom."
status = "normal"
enUS = "How many normally free buildings Dr. Gnawstein turns into a surprise.\\nEach one is locked at the start. Unlocking it gives you science, or sometimes takes some. 0 turns this off. Used when the preset is Custom."
zhCN = "Dr. Gnawstein 会把多少种通常免费的建筑变成惊喜。\\\\n每种建筑在游戏开始时都会被锁定。解锁后会获得科学点数，有时也会扣除一些。设为 0 可关闭此功能。仅在预设为“自定义”时使用。"
zhTW = "Dr. Gnawstein 會把多少座原本免費的建築變成驚喜。\\\\n每座建築在開始時都會鎖定。解鎖後會獲得科學點數，有時也會扣除一些。設為 0 可停用此功能。預設值為「自訂」時使用。"
ruRU = "Количество обычно бесплатных построек, которые доктор Гнавштейн превращает в сюрприз.\\\\nВ начале каждая из них заблокирована. Разблокировка приносит вам очки науки, а иногда отнимает их. Значение 0 отключает эту функцию. Используется, когда выбран пользовательский набор настроек."
jaJP = "Dr. Gnawsteinが通常は無料の建物をサプライズに変える数。\\\\nそれぞれ最初はロックされています。アンロックするとサイエンスを獲得できますが、場合によっては消費します。0にすると無効になります。プリセットが「カスタム」の場合に使用されます。"
frFR = "Nombre de bâtiments normalement gratuits que le Dr Gnawstein transforme en surprise.\\nChacun est verrouillé au départ. Le débloquer vous rapporte des points de science, ou parfois vous en coûte. 0 désactive cette option. Utilisé lorsque le préréglage est personnalisé."
deDE = "Wie viele normalerweise kostenlose Gebäude Dr. Gnawstein in eine Überraschung verwandelt.\\nJedes ist zu Beginn gesperrt. Beim Freischalten erhältst du Wissenschaftspunkte oder verlierst manchmal welche. 0 deaktiviert diese Funktion. Wird verwendet, wenn die Voreinstellung „Benutzerdefiniert“ ist."
plPL = "Ile zwykle darmowych budynków dr. Gnawstein zmienia w niespodzianki.\\nKażdy z nich jest na początku zablokowany. Odblokowanie zapewnia punkty nauki albo czasem je odbiera. 0 wyłącza tę opcję. Używane, gdy wybrano ustawienie „Niestandardowe”."
ptBR = "Quantas construções normalmente gratuitas o Dr. Gnawstein transforma em uma surpresa.\\nCada uma começa bloqueada. Desbloqueá-la concede ciência ou, às vezes, consome um pouco. 0 desativa isso. Usado quando a predefinição é Personalizada."
koKR = "Dr. Gnawstein이 깜짝 요소로 바꾸는 원래 무료인 건물의 수.\\n각 건물은 처음에 잠겨 있습니다. 잠금을 해제하면 과학 점수를 얻거나, 때로는 잃습니다. 0으로 설정하면 이 기능이 꺼집니다. 사전 설정이 사용자 지정일 때 사용됩니다."
trTR = "Dr. Gnawstein’ın normalde ücretsiz olan binalardan kaç tanesini sürprize dönüştüreceği.\\nHer bina başlangıçta kilitlidir. Kilidi açmak size bilim puanı kazandırır, bazen de bilim puanı alır. 0, bu özelliği kapatır. Ön ayar Özel olduğunda kullanılır."
esES = "¿Cuántos edificios normalmente gratuitos convierte el Dr. Gnawstein en una sorpresa.\\nCada uno está bloqueado al inicio. Desbloquearlo te da ciencia o, a veces, te quita algo. 0 desactiva esto. Se usa cuando el ajuste preestablecido es Personalizado."
itIT = "Quanti edifici normalmente gratuiti il Dr. Gnawstein trasforma in una sorpresa.\\nOgnuno è bloccato all'inizio. Sbloccarlo fornisce scienza, o a volte ne sottrae. 0 disattiva questa opzione. Usata quando il preset è Personalizzato."
ukUA = "Скільки зазвичай безкоштовних будівель доктор Гнавстейн перетворює на сюрприз.\\nКожна з них заблокована на початку. Її розблокування дає вам науку або інколи забирає її. 0 вимикає це. Використовується, коли пресет — «Користувацький»."
thTH = "ตัวเลขนี้กำหนดจำนวนอาคารที่ปกติสร้างได้โดยไม่ต้องใช้ทรัพยากรพิเศษ ซึ่งดร. Gnawstein จะเปลี่ยนให้กลายเป็นเซอร์ไพรส์\\nอาคารแต่ละหลังจะถูกล็อกตั้งแต่เริ่มต้น การปลดล็อกอาคารจะให้วิทยาศาสตร์ หรือบางครั้งก็ใช้วิทยาศาสตร์ไป 0 จะปิดการทำงานนี้ ใช้เมื่อค่าที่ตั้งไว้เป็น Custom"
csCZ = "Kolik běžně bezplatných budov Dr. Gnawstein promění v překvapení.\\nKaždá je na začátku zamčená. Odemknutí vám přidá vědu, nebo vám ji někdy naopak ubere. 0 tuto možnost vypíná. Používá se, když je předvolba Vlastní."
viVN = "Số lượng công trình vốn thường miễn phí mà Dr. Gnawstein biến thành bất ngờ.\\nMỗi công trình đều bị khóa lúc bắt đầu. Mở khóa sẽ cho bạn điểm khoa học, hoặc đôi khi lấy đi một ít. 0 sẽ tắt tính năng này. Dùng khi bộ cài đặt là Tùy chỉnh."
caES = "Quants edificis normalment gratuïts el Dr. Gnawstein transformarà en una sorpresa.\\nCadascun es bloqueja a l'inici. Desbloquejar-ne un us dona ciència o, de vegades, en pren una mica. 0 desactiva això. S'utilitza quan el preajust és Personalitzat."
beBY = "Колькі звычайна бясплатных будынкаў доктар Гнаўштэйн ператварае ў сюрпрыз.\\nКожны з іх спачатку заблакаваны. Разблакаванне даюць навуку або іншы раз забірае яе. 0 адключае гэта. Выкарыстоўваецца, калі пярэдусталёўка — Custom."
roRO = "Câte clădiri de obicei gratuite transformă Dr. Gnawstein într-o surpriză.\\nFiecare dintre ele este blocată la început. Deblocarea ei îți oferă știință sau uneori îți consumă din știință. 0 dezactivează această opțiune. Folosit când presetarea este Personalizată."
huHU = "Hány, normál esetben ingyenes épületet változtat meglepetéssé Dr. Gnawstein.\\nMindegyik kezdetben zárva van. Feloldása tudományt ad, vagy időnként von el. A 0 kikapcsolja ezt. Akkor használatos, ha az előbeállítás Egyéni."
arSA = "كم عدد المباني العادية المجانية التي يحوّلها الدكتور غنوستاين إلى مفاجأة.\\nكل واحد منها مقفل في البداية. فتحه يمنحك علماً، أو يأخذ منه أحياناً. القيمة 0 تُعطّل هذا الخيار. تُستخدم عندما تكون الإعدادات المسبقة \"مخصص\"."

