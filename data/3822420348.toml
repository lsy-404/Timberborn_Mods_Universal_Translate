["DamScience.Keep.Tooltip"]
status = "normal"
raw = "For the Mild, Mad and Mayhem presets. On: the whole tech tree costs a fair total (100% / 110% / 130% of normal).\\nOff: a harder total (115% / 135% / 170%). Custom ignores this and uses Total science (%) instead."
enUS = "For the Mild, Mad, and Mayhem presets. On: the whole tech tree costs a fair total (100% / 110% / 130% of normal).\\nOff: a harder total (115% / 135% / 170%). Custom ignores this and uses Total science (%) instead."
zhCN = "适用于温和、疯狂和混乱预设。开启：整个科技树的总花费适中（正常值的 100% / 110% / 130%）。\\\\n关闭：总花费更高（115% / 135% / 170%）。自定义模式不受此项影响，而是使用“总科学点数（%）”。"
zhTW = "適用於「溫和」、「瘋狂」和「大亂鬥」預設。開啟：整個科技樹的總花費合理（正常值的 100% / 110% / 130%）。\\\\n關閉：總花費較高（115% / 135% / 170%）。自訂模式不受此設定影響，改用「總科研（%）」。"
ruRU = "Для предустановок «Умеренная», «Безумная» и «Хаос». Вкл.: общая стоимость всего дерева технологий будет умеренной (100% / 110% / 130% от обычной).\\\\nВыкл.: общая стоимость будет выше (115% / 135% / 170%). В пользовательском режиме эта настройка не действует — используйте параметр «Общий объём исследований (%)»."
jaJP = "「マイルド」「マッド」「メイヘム」プリセット用。オン：テックツリー全体のコストが標準の妥当な割合（100% / 110% / 130%）になります。\\nオフ：より高い割合（115% / 135% / 170%）になります。カスタムではこの設定は無視され、「科学の合計（%）」が使われます。"
frFR = "Pour les préréglages Mild, Mad et Mayhem. Activé : l’arbre technologique entier a un coût raisonnable (100 % / 110 % / 130 % du coût normal).\\\\nDésactivé : le coût total est plus élevé (115 % / 135 % / 170 %). Le mode Personnalisé ignore ce réglage et utilise plutôt « Science totale (%) »."
deDE = "Für die Voreinstellungen Mild, Mad und Mayhem. Ein: Der gesamte Technologiebaum kostet insgesamt angemessen viel (100% / 110% / 130% des Normalwerts).\\nAus: Insgesamt sind die Kosten höher (115% / 135% / 170%). Bei Benutzerdefiniert wird diese Einstellung ignoriert und stattdessen „Gesamtwissenschaft (%)“ verwendet."
plPL = "Dla ustawień Łagodny, Szalony i Chaos. Włączone: całe drzewko technologii kosztuje rozsądną łączną liczbę punktów (100% / 110% / 130% normy).\\nWyłączone: wyższy łączny koszt (115% / 135% / 170%). Własne ignoruje tę opcję i używa ustawienia Łączna liczba punktów nauki (%)."
ptBR = "Para as predefinições Suave, Insano e Caos. Ligado: a árvore tecnológica inteira tem um custo razoável (100% / 110% / 130% do normal).\\nDesligado: um custo maior (115% / 135% / 170%). Personalizado ignora isso e usa Ciência total (%) em vez disso."
koKR = "순한맛, 광기, 대혼란 프리셋에 적용됩니다. 켬: 전체 기술 트리의 총 비용이 적정 수준입니다 (일반 비용의 100% / 110% / 130%).\\\\n끔: 총 비용이 더 높아집니다 (115% / 135% / 170%). 사용자 지정에서는 이 설정을 무시하고 총 과학 비용(%)을 사용합니다."
csCZ = "Pro přednastavení Mírné, Šílené a Naprosté šílenství. Zapnuto: celý technologický strom má přiměřené celkové náklady (100% / 110% / 130% běžných nákladů).\\nVypnuto: vyšší celkové náklady (115% / 135% / 170%). Vlastní nastavení toto ignoruje a používá místo toho Celkové množství vědy (%)."
viVN = "Dành cho các thiết lập trước Mild, Mad và Mayhem. Bật: toàn bộ cây công nghệ có tổng chi phí hợp lý (100% / 110% / 130% so với bình thường).\\nTắt: tổng chi phí cao hơn (115% / 135% / 170%). Tùy chỉnh bỏ qua thiết lập này và dùng Tổng khoa học (%) thay thế."
trTR = "Ilıman, Çılgın ve Kaos ön ayarları için. Açık: tüm teknoloji ağacının toplam maliyeti makul olur (normalin %100 / %110 / %130'u).\\\\nKapalı: toplam maliyet daha yüksek olur (%115 / %135 / %170). Özel, bunu yok sayar ve bunun yerine Toplam bilim (%) değerini kullanır."

