["DamScience.Grants.Tooltip"]
status = "normal"
raw = "How many normally-free buildings Dr. Gnawstein turns into a surprise.\\nEach one is locked at the start. Unlocking it gives you science, or sometimes takes some. 0 turns this off. Used when the preset is Custom."
enUS = "How many normally free buildings Dr. Gnawstein turns into a surprise.\\nEach one is locked at the start. Unlocking it gives you science, or sometimes takes some. 0 turns this off. Used when the preset is Custom."
zhCN = "Dr. Gnawstein 会把多少种通常免费的建筑变成惊喜。\\\\n每种建筑在游戏开始时都会被锁定。解锁后会获得科学点数，有时也会扣除一些。设为 0 可关闭此功能。仅在预设为“自定义”时使用。"
zhTW = "Dr. Gnawstein 會把多少座原本免費的建築變成驚喜。\\\\n每座建築在開始時都會鎖定。解鎖後會獲得科學點數，有時也會扣除一些。設為 0 可停用此功能。預設值為「自訂」時使用。"
ruRU = "Количество обычно бесплатных построек, которые доктор Гнавштейн превращает в сюрприз.\\\\nВ начале каждая из них заблокирована. Разблокировка приносит вам очки науки, а иногда отнимает их. Значение 0 отключает эту функцию. Используется, когда выбран пользовательский набор настроек."
jaJP = "Dr. Gnawsteinが通常は無料の建物をサプライズに変える数。\\\\nそれぞれ最初はロックされています。アンロックするとサイエンスを獲得できますが、場合によっては消費します。0にすると無効になります。プリセットが「カスタム」の場合に使用されます。"
frFR = "Nombre de bâtiments normalement gratuits que le Dr Gnawstein transforme en surprise.\\nChacun est verrouillé au départ. Le débloquer vous rapporte des points de science, ou parfois vous en coûte. 0 désactive cette option. Utilisé lorsque le préréglage est personnalisé."
deDE = "Wie viele normalerweise kostenlose Gebäude Dr. Gnawstein in eine Überraschung verwandelt.\\nJedes ist zu Beginn gesperrt. Beim Freischalten erhältst du Wissenschaftspunkte oder verlierst manchmal welche. 0 deaktiviert diese Funktion. Wird verwendet, wenn die Voreinstellung „Benutzerdefiniert“ ist."
plPL = "Ile zwykle darmowych budynków dr. Gnawstein zmienia w niespodzianki.\\nKażdy z nich jest na początku zablokowany. Odblokowanie zapewnia punkty nauki albo czasem je odbiera. 0 wyłącza tę opcję. Używane, gdy wybrano ustawienie „Niestandardowe”."
ptBR = "Quantas construções normalmente gratuitas o Dr. Gnawstein transforma em uma surpresa.\\nCada uma começa bloqueada. Desbloqueá-la concede ciência ou, às vezes, consome um pouco. 0 desativa isso. Usado quando a predefinição é Personalizada."
koKR = "Dr. Gnawstein이 깜짝 요소로 바꾸는 원래 무료인 건물의 수.\\n각 건물은 처음에 잠겨 있습니다. 잠금을 해제하면 과학 점수를 얻거나, 때로는 잃습니다. 0으로 설정하면 이 기능이 꺼집니다. 사전 설정이 사용자 지정일 때 사용됩니다."
