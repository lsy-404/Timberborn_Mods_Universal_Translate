zhTW = "當「課稅天數」設為「自訂」，或難度設為「符合預設值」時使用。課稅日可徵收的科學點數最低比例。"
ruRU = "Используется, когда для налоговых дней выбрано значение «Настраиваемые» или при совпадении сложности с пресетом «Настраиваемый». Минимальная доля ваших очков науки, которую может забрать налоговый день."
jaJP = "「納税日」が「カスタム」の場合、または難易度を「カスタム」プリセットに合わせる場合に使用します。納税日が徴収できる研究ポイントの最小割合です。"
frFR = "Utilisé lorsque les jours de taxe sont réglés sur « Personnalisés » ou lorsque la difficulté est réglée sur « Personnalisée ». La plus petite part de votre science qu’un jour de taxe peut prélever."
deDE = "Wird verwendet, wenn die Steuertage auf „Benutzerdefiniert“ eingestellt sind oder der Schwierigkeitsgrad mit der benutzerdefinierten Voreinstellung übereinstimmt. Der geringste Anteil deiner Forschung, den ein Steuertag einfordern kann."
plPL = "Używane, gdy Dni podatkowe mają ustawienie Niestandardowe lub gdy trudność jest dopasowana za pomocą niestandardowego profilu. Najmniejsza część twoich punktów nauki, jaką może zabrać dzień podatkowy."
