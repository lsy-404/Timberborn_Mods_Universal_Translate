csCZ = "Mírná: ceny 75–150 %, celkový počet stromů 100 %, 2 překvapení, 25 % triků.\\nŠílená: ceny 50–200 %, celkový počet 110 %, 3 překvapení, 33 % triků.\\nChaos: ceny 25–400 %, celkový počet 130 %, 6 překvapení, 50 % triků.\\nVlastní: použijte posuvníky v části Vlastní.\\nPlatí pro nové kolonie."
viVN = "Nhẹ: giá 75-150%, tổng số cây 100%, 2 điều bất ngờ, 25% trò đánh lừa.\\nĐiên cuồng: giá 50-200%, tổng số cây 110%, 3 điều bất ngờ, 33% trò đánh lừa.\\nHỗn loạn: giá 25-400%, tổng số cây 130%, 6 điều bất ngờ, 50% trò đánh lừa.\\nTùy chỉnh: dùng các thanh trượt trong mục Tùy chỉnh.\\nÁp dụng cho các thuộc địa mới."
caES = "Suau: preus 75-150%, total d'arbres 100%, 2 sorpreses, 25% trucs.\\nBoig: preus 50-200%, total 110%, 3 sorpreses, 33% trucs.\\nCaos: preus 25-400%, total 130%, 6 sorpreses, 50% trucs.\\nPersonalitzat: utilitza els controls lliscants de la secció Personalitzat.\\nS'aplica a colònies noves."
beBY = "Мяккі: цэны 75-150%, дрэвы разам 100%, 2 сюрпрызы, 25% падступаў.\\nШалёны: цэны 50-200%, разам 110%, 3 сюрпрызы, 33% падступаў.\\nХаос: цэны 25-400%, разам 130%, 6 сюрпрызаў, 50% падступаў.\\nУласны: выкарыстоўвайце паўзункі ў раздзеле «Уласны».\\nДзейнічае для новых калоній."
roRO = "Ușor: prețuri 75-150%, total copaci 100%, 2 surprize, 25% trucuri.\\nNebun: prețuri 50-200%, total 110%, 3 surprize, 33% trucuri.\\nHaos: prețuri 25-400%, total 130%, 6 surprize, 50% trucuri.\\nPersonalizat: folosiți glisoarele din secțiunea Personalizat.\\nSe aplică coloniilor noi."
huHU = "Mild: árak 75–150%, fa összesen 100%, 2 meglepetés, 25% trükk.\\nMad: árak 50–200%, összesen 110%, 3 meglepetés, 33% trükk.\\nMayhem: árak 25–400%, összesen 130%, 6 meglepetés, 50% trükk.\\nCustom: használd a csúszkákat az Egyéni részben.\\nÚj kolóniákra vonatkozik."
arSA = "معتدل: الأسعار 75-150%، إجمالي الأشجار 100%، 2 مفاجآت، 25% حيل.\\nجنوني: الأسعار 50-200%، إجمالي الأشجار 110%، 3 مفاجآت، 33% حيل.\\nالفوضى: الأسعار 25-400%، إجمالي الأشجار 130%، 6 مفاجآت، 50% حيل.\\nمخصص: استخدم المنزلقات في القسم المخصص.\\nتنطبق على المستعمرات الجديدة."

