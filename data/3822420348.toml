["DamScience.Trick.Tooltip"]
status = "normal"
raw = "Chance that a surprise building is a trick (it costs science) instead of a treat (it pays you). Used when the preset is Custom. Only some free buildings can be tricks, so you may get fewer tricks than this if you ask for many surprises."
enUS = "Chance that a surprise building is a trick (it costs science) instead of a treat (it pays you). Used when the preset is Custom. Only some free buildings can be tricks, so you may get fewer tricks than this if you ask for many surprises."
zhCN = "惊喜建筑是陷阱（会消耗科学点数）而非奖励（会给你带来收益）的概率。仅在预设为“自定义”时使用。只有部分免费建筑可能是陷阱，因此如果你要求很多惊喜建筑，陷阱数量可能会少于此概率所指的数量。"
zhTW = "驚喜建築是惡作劇（會消耗科學點數）而非驚喜（會給你獎勵）的機率。僅在預設為「自訂」時使用。只有部分免費建築可能是惡作劇，因此如果你要求很多驚喜，惡作劇的數量可能會少於此機率所示。"
ruRU = "Вероятность того, что случайная постройка окажется подвохом (за неё придётся заплатить очками науки), а не подарком (она принесёт вам очки). Используется, если выбран пользовательский пресет. Подвохом могут быть только некоторые бесплатные постройки, поэтому подвохов может оказаться меньше, чем вы запросили случайных построек."
jaJP = "サプライズ建築物が、おごり（報酬を受け取れる）ではなくいたずら（科学ポイントを消費する）になる確率。プリセットが「カスタム」のときに使用されます。いたずらになるのは一部の無料建築物だけなので、サプライズを多く求めても、いたずらの数はこの確率から予想される数より少なくなる場合があります。"
frFR = "Probabilité qu’un bâtiment surprise soit un mauvais tour (il coûte des points de science) plutôt qu’une bonne surprise (il vous rapporte quelque chose). Utilisée lorsque le préréglage est « Personnalisé ». Seuls certains bâtiments gratuits peuvent être des mauvais tours ; vous pourriez donc en obtenir moins que prévu si vous demandez beaucoup de surprises."
deDE = "Wahrscheinlichkeit, dass ein Überraschungsgebäude ein Streich ist (es kostet Wissenschaftspunkte) statt einer Belohnung (es bringt dir welche ein). Wird verwendet, wenn die Voreinstellung „Benutzerdefiniert“ ist. Nur einige kostenlose Gebäude können Streiche sein. Wenn du also viele Überraschungen auswählst, erhältst du möglicherweise weniger Streiche als angegeben."
plPL = "Szansa, że niespodziewany budynek okaże się podstępem (kosztuje punkty nauki), zamiast prezentem (dostajesz za niego punkty). Używane, gdy wybrano ustawienie Własne. Tylko niektóre darmowe budynki mogą być podstępami, więc jeśli zażyczysz sobie wielu niespodzianek, możesz dostać ich mniej."
ptBR = "Chance de uma construção surpresa ser uma pegadinha (custa ciência) em vez de um presente (paga você). Usada quando a predefinição é Personalizada. Apenas algumas construções gratuitas podem ser pegadinhas, então você pode receber menos pegadinhas do que pediu se solicitar muitas surpresas."
koKR = "깜짝 건물이 선물(과학 점수를 지급함)이 아니라 함정(과학 점수가 소모됨)일 확률입니다. 프리셋이 사용자 지정일 때 사용됩니다. 일부 무료 건물만 함정이 될 수 있으므로, 깜짝 건물을 많이 요청하면 이 수치보다 함정이 적게 나올 수 있습니다."
csCZ = "Šance, že překvapivá budova bude trik (stojí vědu), a ne odměna (přinese vám vědu). Používá se, když je předvolba nastavena na Vlastní. Trikem může být jen některá z budov zdarma, takže pokud si přejete mnoho překvapení, můžete jich dostat méně."
viVN = "Khả năng một công trình bất ngờ là trò lừa (tốn điểm khoa học) thay vì món quà (đem lại cho bạn phần thưởng). Được dùng khi cài đặt sẵn là Tùy chỉnh. Chỉ một số công trình miễn phí có thể là trò lừa, nên nếu yêu cầu nhiều bất ngờ, bạn có thể nhận được ít trò lừa hơn số này."
trTR = "Sürpriz bir binanın ikram (size kazanç sağlar) yerine bir tuzak (bilim puanı harcatır) olma olasılığı. Özel hazır ayar kullanıldığında geçerlidir. Yalnızca bazı ücretsiz binalar tuzak olabilir; bu yüzden çok sayıda sürpriz isterseniz bundan daha az tuzak çıkabilir."

