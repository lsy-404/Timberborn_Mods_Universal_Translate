new = "Trick chance (%)"
status = "normal"

["DamScience.Trick.Tooltip"]
new = "Chance that a surprise building is a trick (it costs science) instead of a treat (it pays you). Used when the preset is Custom. Only some free buildings can be tricks, so you may get fewer tricks than this if you ask for many surprises."
status = "normal"

