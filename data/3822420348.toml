["DamScience.Welcome.Text"]
status = "normal"
raw = "Dr. Gnawstein's lab has been at the science controls. Every building's science price in this colony has been scrambled, and a few free buildings are now surprises. Trick or treat?"
enUS = "Dr. Gnawstein's lab has been at the science controls. Every building's science price in this colony has been scrambled, and a few free buildings are now surprises. Trick or treat?"
zhCN = "格纳斯坦博士的实验室动过了科技设置。这片殖民地中所有建筑的科技点数价格都被打乱了，还有几种原本免费的建筑现在会给你惊喜。不给糖就捣蛋？"
zhTW = "Gnawstein 博士的實驗室動了科學點數的手腳。這個殖民地每棟建築所需的科學點數都被打亂了，還有幾棟原本免費的建築現在成了驚喜。要糖還是搗蛋？"
ruRU = "Лаборатория доктора Гноуштейна добралась до настроек науки. Стоимость науки для каждой постройки в этой колонии перемешалась, а некоторые бесплатные постройки теперь таят сюрпризы. Сладость или гадость?"
jaJP = "ノグステイン博士の研究室が科学関連の設定をいじったようです。このコロニーにあるすべての建物の科学コストがめちゃくちゃになり、無料で建てられる建物の一部もサプライズに変わりました。トリック・オア・トリート？"
frFR = "Le labo du Dr Gnawstein a joué avec les commandes de la science. Le coût en science de chaque bâtiment de cette colonie a été mélangé, et quelques bâtiments gratuits réservent désormais des surprises. Des bonbons ou un sort ?"
deDE = "Dr. Gnawsteins Labor hat an den Wissenschaftsreglern herumgespielt. Die Wissenschaftskosten jedes Gebäudes in dieser Kolonie wurden durcheinandergewürfelt, und ein paar kostenlose Gebäude halten jetzt Überraschungen bereit. Süßes oder Saures?"
plPL = "Laboratorium doktora Ogryza namieszało w cenach nauki. Koszt nauki każdego budynku w tej kolonii został pomieszany, a kilka darmowych budynków to teraz niespodzianki. Cukierek albo psikus?"
ptBR = "O laboratório do Dr. Gnawstein mexeu nos controles de ciência. O custo em ciência de cada edifício desta colônia foi embaralhado, e alguns edifícios gratuitos agora são surpresas. Doces ou travessuras?"
koKR = "그노슈타인 박사가 과학 설정을 건드렸습니다. 이 정착지에서는 모든 건물의 과학 비용이 뒤죽박죽이 되었고, 공짜 건물 몇 개도 뜻밖의 물건이 되어버렸습니다. 사탕을 받을까요, 장난을 당할까요?"
csCZ = "Laboratoř doktora Gnawsteina zasáhla do vědeckého výzkumu. Cena ve vědeckých bodech za každou budovu v této kolonii je pomíchaná a pár budov, které jsou zdarma, teď přináší překvapení. Koledu, nebo něco provedu?"
viVN = "Phòng thí nghiệm của Tiến sĩ Gnawstein đã động tay vào các quy tắc khoa học. Giá khoa học của mọi công trình trong khu thuộc địa này đã bị xáo trộn, và một vài công trình miễn phí giờ đây lại là những bất ngờ. Cho kẹo hay bị ghẹo?"
