plPL = "Pokaż okienko powitalne dr. Gnawsteina raz, gdy kolonia uruchomi się po raz pierwszy z tym modem."
ptBR = "Exibe o pop-up de boas-vindas do Dr. Gnawstein uma única vez, quando uma colônia é iniciada pela primeira vez com este mod."
