["DamScience.Shuffle.Tooltip"]
status = "normal"
raw = "On: the game's own prices are dealt to different buildings (a cheap one may get an expensive price). The total stays at the game's normal total; the total settings do not apply.\\nOff: every price is rolled from a percent range.\\nApplies to new colonies."
enUS = "On: The game's own prices are assigned to different buildings (a cheap one may get an expensive price). The total stays at the game's normal total; the total settings do not apply.\\nOff: Every price is rolled from a percent range.\\nApplies to new colonies."
zhCN = "开启：游戏原本设定的价格会分配给不同建筑（原本便宜的建筑可能会被分配到昂贵的价格）。总价仍与游戏原本的总价一致；总价设置不适用。\\\\n关闭：每个价格都按百分比范围随机生成。\\\\n仅适用于新殖民地。"
zhTW = "開啟：遊戲原有的價格會分配給不同建築（便宜的建築可能會分到昂貴的價格）。總價維持遊戲的正常總額；總額設定不適用。\\\\n關閉：每個價格都會從百分比範圍內隨機產生。\\\\n適用於新殖民地。"
ruRU = "Вкл.: собственные цены игры распределяются между разными зданиями (дешёвому зданию может достаться высокая цена). Общая сумма остаётся такой же, как обычно в игре; настройки общей суммы не применяются.\\nВыкл.: цена каждого здания случайно выбирается в пределах процентного диапазона.\\nПрименяется к новым колониям."
jaJP = "オン：ゲーム本来の価格が別々の建物に割り当てられます（安い建物に高い価格が割り当てられることもあります）。合計はゲーム本来の合計のままで、合計の設定は適用されません。\\nオフ：すべての価格がパーセンテージの範囲からランダムに決まります。\\n新しいコロニーに適用されます。"
frFR = "Activé : les prix propres au jeu sont attribués à différents bâtiments (un bâtiment bon marché peut se voir attribuer un prix élevé). Le total reste celui normalement prévu par le jeu ; les paramètres du total ne s’appliquent pas.\\\\nDésactivé : chaque prix est tiré dans une fourchette de pourcentage.\\\\nS’applique aux nouvelles colonies."
deDE = "Ein: Die Preise des Spiels selbst werden verschiedenen Gebäuden zugewiesen (ein günstiges Gebäude kann einen hohen Preis erhalten). Die Gesamtsumme bleibt auf dem normalen Wert des Spiels; die Einstellungen für die Gesamtsumme werden nicht angewendet.\\nAus: Jeder Preis wird aus einem Prozentbereich ausgewürfelt.\\nGilt für neue Kolonien."
plPL = "Włączone: ceny ustalone przez grę są przypisywane różnym budynkom (tani budynek może dostać wysoką cenę). Łączna suma pozostaje taka jak zwykle w grze; ustawienia sumy nie mają zastosowania.\\nWyłączone: każda cena jest losowana z zakresu procentowego.\\nDotyczy nowych kolonii."
ptBR = "Ativado: os preços definidos pelo próprio jogo são distribuídos entre diferentes edifícios (um edifício barato pode receber um preço alto). O total permanece igual ao total padrão do jogo; as configurações de total não se aplicam.\\\\nDesativado: cada preço é sorteado dentro de um intervalo percentual.\\\\nAplica-se a novas colônias."
koKR = "켜짐: 게임 자체 가격이 각 건물에 무작위로 배정됩니다(저렴한 건물에 비싼 가격이 책정될 수도 있습니다). 총액은 게임의 기본 총액으로 유지되며, 총액 설정은 적용되지 않습니다.\\n꺼짐: 모든 가격이 백분율 범위에서 무작위로 정해집니다.\\n새 식민지에 적용됩니다."
csCZ = "Zapnuto: Ceny stanovené samotnou hrou se přiřadí různým budovám (levná budova může dostat vysokou cenu). Celková cena zůstane stejná jako obvykle ve hře; nastavení celkové ceny se nepoužijí.\\nVypnuto: Každá cena se náhodně vylosuje z procentního rozpětí.\\nPlatí pro nové kolonie."
viVN = "Bật: giá gốc của trò chơi được gán cho các công trình khác nhau (công trình rẻ có thể nhận giá đắt). Tổng cộng vẫn bằng tổng thông thường của trò chơi; các thiết lập tổng cộng không áp dụng.\\nTắt: mỗi mức giá được chọn ngẫu nhiên trong một khoảng phần trăm.\\nÁp dụng cho các khu thuộc địa mới."
trTR = "Açık: Oyunun kendi fiyatları farklı binalara dağıtılır (ucuz bir binaya pahalı bir fiyat verilebilir). Toplam, oyunun normal toplamı olarak kalır; toplam ayarları uygulanmaz.\\nKapalı: Her fiyat bir yüzde aralığından rastgele belirlenir.\\nYeni koloniler için geçerlidir."

