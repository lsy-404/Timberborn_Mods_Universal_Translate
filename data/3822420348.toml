["DamScience.Doctor.Tooltip"]
status = "normal"
raw = "Shows Dr. Gnawstein's name and picture on one beaver of each Inventor hut (the first one assigned) in the building panel. Display only: no beaver is renamed."
enUS = "Shows Dr. Gnawstein's name and picture on one beaver from each Inventor hut (the first one assigned) in the building panel. Display only: no beaver is renamed."
zhCN = "在建筑面板中显示每座发明家小屋中一只海狸（最先分配的那只）的名字和头像，名称为诺博士。仅供显示：不会重命名任何海狸。"
zhTW = "在建築面板中，於每座發明家小屋的一隻海狸（第一位指派的海狸）旁顯示 Gnawstein 博士的名字和圖片。僅供顯示：不會替任何海狸改名。"
ruRU = "Отображает имя и изображение доктора Гнавштейна у одного бобра в каждой хижине изобретателей (у первого назначенного) на панели здания. Только отображение: имя бобра не меняется."
jaJP = "建物パネルで、各発明小屋のビーバー1匹（最初に割り当てられたビーバー）の名前と画像を、Dr. Gnawsteinのものとして表示します。表示のみで、ビーバーの名前は変更されません。"
frFR = "Affiche le nom et l’image du Dr Gnawstein sur un castor de chaque hutte d’inventeur (le premier qui y est affecté), dans le panneau du bâtiment. Affichage uniquement : aucun castor n’est renommé."
deDE = "Zeigt den Namen und das Bild von Dr. Gnawstein bei jeweils einem Biber in jeder Erfinderhütte an (dem zuerst zugewiesenen). Nur Anzeige: Kein Biber wird umbenannt."
plPL = "Wyświetla imię, nazwisko i portret dr. Gnawsteina przy jednym bobrze w każdej chacie wynalazcy (pierwszym przydzielonym) w panelu budynku. Tylko wyświetla: żaden bóbr nie zmienia imienia."
ptBR = "Exibe o nome e a imagem do Dr. Gnawstein em um castor de cada cabana de Inventor (o primeiro designado) no painel do edifício. Apenas exibição: nenhum castor é renomeado."
koKR = "건물 패널에서 각 발명가 오두막의 비버 한 마리(처음 배정된 비버)의 이름과 사진을 닥터 노우스타인의 것으로 표시합니다. 표시만 변경되며, 비버의 이름은 바뀌지 않습니다."
csCZ = "V panelu budovy zobrazuje jméno a obrázek doktora Gnawsteina u jednoho bobra z každého vynálezcovského domku (u prvního přiřazeného). Pouze zobrazení: žádnému bobrovi se nezmění jméno."
viVN = "Hiển thị tên và ảnh của Tiến sĩ Gnawstein trên một hải ly ở mỗi túp lều Nhà phát minh (hải ly đầu tiên được phân công) trong bảng của công trình. Chỉ hiển thị: không có hải ly nào bị đổi tên."
trTR = "Her Mucit kulübesindeki bir kunduzun (atarlanan ilk kunduzun) adı ve resmi bina panelinde Dr. Gnawstein olarak gösterilir. Yalnızca görüntülenir: hiçbir kunduzun adı değiştirilmez."

