deDE = "Wie günstig ein Gebäude werden kann, als Prozentsatz seiner normalen Wissenschaftskosten.\\nWird verwendet, wenn das Preset „Benutzerdefiniert“ ist. Gilt für neue Kolonien."
plPL = "Jak bardzo może potanieć budynek w stosunku do jego zwykłego kosztu nauki, wyrażonego w procentach.\\nUżywane, gdy wybrano preset „Niestandardowy”. Dotyczy nowych kolonii."
ptBR = "Até que ponto o custo de ciência de uma construção pode ser reduzido, como porcentagem do custo normal.\\\\nUsado quando a predefinição é Personalizada. Aplica-se a novas colônias."
koKR = "건물의 과학 비용이 기본 비용의 몇 퍼센트까지 낮아질 수 있는지 설정합니다.\\n프리셋이 사용자 지정일 때 사용됩니다. 새 정착지에 적용됩니다."
