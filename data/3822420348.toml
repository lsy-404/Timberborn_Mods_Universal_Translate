["DamScience.Preset.Tooltip"]
status = "normal"
raw = "Mild: prices 75-150%, tree total 100%, 2 surprises, 25% tricks.\\nMad: prices 50-200%, total 110%, 3 surprises, 33% tricks.\\nMayhem: prices 25-400%, total 130%, 6 surprises, 50% tricks.\\nCustom: use the sliders in the Custom section.\\nApplies to new colonies."
enUS = "Mild: prices 75-150%, tree total 100%, 2 surprises, 25% tricks.\\nMad: prices 50-200%, total 110%, 3 surprises, 33% tricks.\\nMayhem: prices 25-400%, total 130%, 6 surprises, 50% tricks.\\nCustom: use the sliders in the Custom section.\\nApplies to new colonies."
zhCN = "轻度：价格 75-150%，树木总量 100%，2 个惊喜，25% 的诡计。\\\\n疯狂：价格 50-200%，总量 110%，3 个惊喜，33% 的诡计。\\\\n混乱：价格 25-400%，总量 130%，6 个惊喜，50% 的诡计。\\\\n自定义：使用“自定义”部分中的滑块。\\\\n对新殖民地生效。"
zhTW = "溫和：價格 75-150%，樹木總量 100%，2 個驚喜，25% 詭計。\\\\n瘋狂：價格 50-200%，總量 110%，3 個驚喜，33% 詭計。\\\\n混亂：價格 25-400%，總量 130%，6 個驚喜，50% 詭計。\\\\n自訂：使用「自訂」區段中的滑桿。\\\\n適用於新殖民地。"
ruRU = "Лёгкий: цены 75-150%, всего деревьев 100%, 2 сюрприза, 25% уловок.\\nБезумие: цены 50-200%, всего деревьев 110%, 3 сюрприза, 33% уловок.\\nХаос: цены 25-400%, всего деревьев 130%, 6 сюрпризов, 50% уловок.\\nНастраиваемый: используйте ползунки в разделе «Настраиваемый».\\nПрименяется к новым колониям."
jaJP = "マイルド：価格75-150%、樹木の合計100%、サプライズ2回、トリック25%。\\nマッド：価格50-200%、合計110%、サプライズ3回、トリック33%。\\nメイヘム：価格25-400%、合計130%、サプライズ6回、トリック50%。\\nカスタム：カスタムセクションのスライダーを使用します。\\n新しいコロニーに適用されます。"
frFR = "Doux : prix de 75-150 %, total d’arbres de 100 %, 2 surprises, 25 % de coups tordus.\\nFou : prix de 50-200 %, total de 110 %, 3 surprises, 33 % de coups tordus.\\nChaos : prix de 25-400 %, total de 130 %, 6 surprises, 50 % de coups tordus.\\nPersonnalisé : utilisez les curseurs de la section Personnalisé.\\nS’applique aux nouvelles colonies."
deDE = "Mild: Preise 75-150 %, Baumgesamtmenge 100 %, 2 Überraschungen, 25 % Tricks.\\nVerrückt: Preise 50-200 %, Gesamtmenge 110 %, 3 Überraschungen, 33 % Tricks.\\nChaos: Preise 25-400 %, Gesamtmenge 130 %, 6 Überraschungen, 50 % Tricks.\\nBenutzerdefiniert: Verwende die Schieberegler im Abschnitt „Benutzerdefiniert“.\\nGilt für neue Kolonien."
plPL = "Łagodny: ceny 75-150%, łączna liczba drzew 100%, 2 niespodzianki, 25% sztuczek.\\nSzaleństwo: ceny 50-200%, łączna liczba drzew 110%, 3 niespodzianki, 33% sztuczek.\\nChaos: ceny 25-400%, łączna liczba drzew 130%, 6 niespodzianek, 50% sztuczek.\\nNiestandardowy: użyj suwaków w sekcji „Niestandardowe”.\\nDotyczy nowych kolonii."
ptBR = "Suave: preços de 75-150%, total de árvores de 100%, 2 surpresas, 25% de truques.\\nLouco: preços de 50-200%, total de 110%, 3 surpresas, 33% de truques.\\nCaos: preços de 25-400%, total de 130%, 6 surpresas, 50% de truques.\\nPersonalizado: use os controles deslizantes na seção Personalizado.\\nAplica-se a novas colônias."
koKR = "약함: 가격 75-150%, 나무 총량 100%, 깜짝 요소 2개, 속임수 25%.\\n광기: 가격 50-200%, 총량 110%, 깜짝 요소 3개, 속임수 33%.\\n아수라장: 가격 25-400%, 총량 130%, 깜짝 요소 6개, 속임수 50%.\\n사용자 지정: 사용자 지정 섹션의 슬라이더를 사용하세요.\\n새로운 거주지에 적용됩니다."
csCZ = "Mírná: ceny 75–150 %, celkový počet stromů 100 %, 2 překvapení, 25 % triků.\\nŠílená: ceny 50–200 %, celkový počet 110 %, 3 překvapení, 33 % triků.\\nChaos: ceny 25–400 %, celkový počet 130 %, 6 překvapení, 50 % triků.\\nVlastní: použijte posuvníky v části Vlastní.\\nPlatí pro nové kolonie."
viVN = "Nhẹ: giá 75-150%, tổng số cây 100%, 2 điều bất ngờ, 25% trò đánh lừa.\\nĐiên cuồng: giá 50-200%, tổng số cây 110%, 3 điều bất ngờ, 33% trò đánh lừa.\\nHỗn loạn: giá 25-400%, tổng số cây 130%, 6 điều bất ngờ, 50% trò đánh lừa.\\nTùy chỉnh: dùng các thanh trượt trong mục Tùy chỉnh.\\nÁp dụng cho các thuộc địa mới."
trTR = "Hafif: fiyatlar %75-150, toplam ağaç %100, 2 sürpriz, %25 numara.\\nÇılgın: fiyatlar %50-200, toplam %110, 3 sürpriz, %33 numara.\\nKargaşa: fiyatlar %25-400, toplam %130, 6 sürpriz, %50 numara.\\nÖzel: Özel bölümündeki kaydırıcıları kullanın.\\nYeni koloniler için geçerlidir."

