koKR = "세금 납부일이 사용자 지정이거나, 난이도가 사용자 지정 설정으로 되어 있을 때 사용됩니다. 발명가에게 150 이상을 지불한 경우 세금 납부일 사이의 주기는 몇 사이클인가요? 더 적게 지불하면 그 중간값이 적용됩니다."
trTR = "Vergi günleri Özel olarak ayarlandığında veya Zorluk eşleştirme seçeneği Özel ön ayarıyla kullanıldığında geçerlidir. Mucit için 150 veya daha fazla ödediyseniz, vergi günleri arasında kaç döngü olur? Daha az ödemek arada bir sonuca yol açar."
esES = "Se usa cuando Días de impuestos está en Personalizado, o cuando Igualar dificultad usa el preajuste Personalizado. Indica cuántos ciclos hay entre días de impuestos si pagaste 150 o más por el Inventor. Pagar menos da un valor intermedio."
itIT = "Usato quando \"Giorni di tassazione\" è impostato su Personalizzato, oppure quando \"Adegua la difficoltà\" usa il preset Personalizzato. Indica quanti cicli devono trascorrere tra un giorno di tassazione e l'altro se hai pagato 150 o più all'Inventore. Pagare meno ti porta a un valore intermedio."
ukUA = "Використовується, коли «Дні податків» має значення «Власні» або коли «Підібрати складність» з пресетом «Власний». Скільки циклів між днями податків, якщо ви заплатили 150 або більше за Винахідника. Якщо заплатити менше, значення буде між ними."
thTH = "ใช้เมื่อ Tax days ตั้งเป็น Custom หรือเมื่อ Match difficulty ใช้ค่าตั้งล่วงหน้า Custom จำนวนรอบระหว่างวันเก็บภาษีหากจ่ายให้ Inventor 150 หรือมากกว่า หากจ่ายน้อยกว่านั้น ค่าจะอยู่ระหว่างนั้น"
csCZ = "Používá se, když jsou daňové dny nastavené na vlastní, nebo když se obtížnost přizpůsobuje vlastní předvolbě. Kolik cyklů uplyne mezi daňovými dny, pokud jste vynálezci zaplatili 150 nebo více. Při nižší platbě se interval nachází někde mezi tím."
viVN = "Dùng khi Ngày thu thuế được đặt thành Tùy chỉnh hoặc khi khớp độ khó với thiết lập Tùy chỉnh. Có bao nhiêu chu kỳ giữa các ngày thu thuế nếu bạn đã trả từ 150 trở lên cho Nhà phát minh. Trả ít hơn sẽ nằm ở khoảng giữa."
caES = "S'utilitza quan els Dies d'impostos està en Personalitzat, o quan s'ajusta la dificultat amb el preajust Personalitzat. Quants cicles hi ha entre dies d'impostos si vas pagar 150 o més per l'Inventor. Si pagues menys, el resultat queda entremig."
beBY = "Выкарыстоўваецца, калі параметр Дні падаткаў мае значэнне Карыстальніцкі або Адпаведнасць складанасці з карыстальніцкім пресетам. Колькі цыклаў паміж днямі падаткаў, калі вы заплацілі 150 або больш for Inventor. Калі заплацілі менш, значэнне будзе прамежкавым."
roRO = "Folosit când Zilele de impozitare este setat pe Personalizat sau când Potrivirea dificultății folosește presetarea Personalizat. Numărul de cicluri între zilele de impozitare dacă ai plătit 150 sau mai mult pentru Inventator. Dacă plătești mai puțin, valoarea se află între acestea."
huHU = "Akkor használatos, ha az Adónapok beállítása Egyéni, vagy ha a Nehézség illesztése az Egyéni előbeállítással történik. Ennyi ciklus telik el az adónapok között, ha a Feltalálónak 150 vagy több adót fizettél. Ennél kevesebb fizetése ezek közé esik."
arSA = "ُيُستخدم عندما تكون أيام الضرائب مخصصة (Custom)، أو عند ضبط الصعوبة وفق الإعداد المسبق Custom. هذا هو عدد الدورات بين أيام الضرائب إذا دفعت 150 أو أكثر للمخترع. أما إذا دفعت أقل من ذلك، فتقع القيمة بين الحدين."

