["IgorZ.TimberCommons.Settings.ModUIPatches.EnhanceSaveModsIncompatibilityDialogTooltip"]
raw = "Adds controls for enabling missing mods directly from the save-load warning.\nThis option is disabled automatically when another mod also patches this game dialog."
status = "normal"
enUS = "Adds controls for enabling missing mods directly from the save-load warning. This option is disabled automatically when another mod also patches this game dialog."
zhCN = "“从保存加载警告中直接启用缺失模组的控件。 当另一个模组也修补此游戏对话框时，此选项会自动禁用。”"
zhTW = "從存檔加載警告直接添加啟用缺失模組的控制選項。當另一個模組也修補此遊戲對話框時，該選項將自動禁用。"
ruRU = "Добавляет элементы управления для включения отсутствующих модов прямо из предупреждения при загрузке сохранения. Эта опция автоматически отключается, когда другой мод также изменяет этот игровой диалог."
jaJP = "セーブ・ロード警告から欠落しているモッドを直接有効にするためのコントロールを追加します。このオプションは、他のモッドがこのゲームダイアログをパッチする場合、自動的に無効になります。"
frFR = "Ajoute des contrôles pour activer les mods manquants directement depuis l'avertissement de chargement de sauvegarde. Cette option est désactivée automatiquement lorsqu'un autre mod patch également cette boîte de dialogue du jeu."
deDE = "Fügt Steuerelemente hinzu, um fehlende Mods direkt aus der Warnmeldung beim Speichern und Laden zu aktivieren. Diese Option wird automatisch deaktiviert, wenn ein anderer Mod ebenfalls diesen Spieldialog patcht."
plPL = "Dodaje opcje włączania brakujących modów bezpośrednio z powiadomienia o ładowaniu zapisu. Ta opcja jest automatycznie wyłączana, gdy inny mod także modyfikuje ten dialog w grze."
ptBR = "Adiciona controles para habilitar mods ausentes diretamente a partir do aviso de carregamento da salva. Esta opção é desabilitada automaticamente quando outro mod também altera esta caixa de diálogo do jogo."
koKR = "저장-불러오기 경고에서 누락된 모드를 직접 활성화할 수 있는 제어 장치를 추가합니다. 이 옵션은 다른 모드가 이 게임 대화를 패치할 경우 자동으로 비활성화됩니다."
trTR = "Kaydetme-yükleme uyarısından eksik modları doğrudan etkinleştirmek için kontroller ekler. Bu seçenek, başka bir mod da bu oyun iletişim kutusunu yamanınca otomatik olarak devre dışı bırakılır."
esES = "Añade controles para activar mods faltantes directamente desde la advertencia de carga de partidas guardadas.\nEsta opción se desactiva automáticamente cuando otro mod también modifica este diálogo del juego."
itIT = "Aggiunge controlli per abilitare direttamente i mod mancanti dall'avviso di caricamento del salvataggio.\nQuesta opzione viene disattivata automaticamente quando un altro mod modifica anche questa finestra di dialogo di gioco."
ukUA = "Додає елементи керування для ввімкнення відсутніх модів безпосередньо з попередження під час завантаження збереження.\nЦей параметр автоматично вимикається, якщо інший мод також змінює цей ігровий діалог."
thTH = "เพิ่มตัวควบคุมสำหรับเปิดใช้งานม็อดที่ขาดหายไปโดยตรงจากคำเตือนตอนโหลดเซฟ\nตัวเลือกนี้จะถูกปิดใช้งานโดยอัตโนมัติเมื่อมีม็อดอื่นแก้ไขหน้าต่างไดอะล็อกของเกมนี้ด้วย"
csCZ = "Přidává ovládací prvky pro povolení chybějících modů přímo z varování při načítání uložené hry. Tato možnost je automaticky deaktivována, když jiný mod také mění tento herní dialog."
viVN = "Thêm các điều khiển để kích hoạt các mod bị thiếu trực tiếp từ cảnh báo tải lưu.\nTùy chọn này sẽ tự động bị vô hiệu hóa khi một mod khác cũng chỉnh sửa hộp thoại trò chơi này."
caES = "Afegeix controls per activar mods que falten directament des de l'avís de càrrega de partida.\nAquesta opció es desactiva automàticament quan un altre mod també modifica aquest diàleg del joc."
beBY = "Дадае элементы кіравання для ўключэння адсутных модаў непасрэдна з папярэджання пры загрузцы захаванай гульні.\nГэты параметр аўтаматычна адключаецца, калі іншы мод таксама змяняе гэты дыялог гульні."
roRO = "Adaugă controale pentru activarea modurilor lipsă direct din avertismentul de încărcare a salvării.\nAceastă opțiune este dezactivată automat atunci când un alt mod modifică și această fereastră de dialog a jocului."
huHU = "Hozzáadja a vezérlőket, amelyekkel a hiányzó modok közvetlenül a mentés betöltésekor megjelenő figyelmeztetésből engedélyezhetők.\nEz a beállítás automatikusan letiltásra kerül, ha egy másik mod is módosítja ezt a játékbeli párbeszédablakot."
arSA = "أيضاً الإضافة عناصر تحكم لتفعيل المودات المفقودة مباشرة من تحذير تحميل الحفظ.\nيتم تعطيل هذا الخيار تلقائياً عندما يقوم مود آخر بتعديل نافذة اللعبة هذه أيضاً."

