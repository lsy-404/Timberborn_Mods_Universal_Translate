["LV.VF.WithoutGroundDesc"]
raw = "Allow placement on roofs and platforms directly without soil. Those plants get irrigation (moisture) and contamination from the land under it."
status = "normal"
enUS = "Allow placement on roofs and platforms directly without soil. Those plants receive irrigation (moisture) and contaminants from the land beneath them."
zhCN = "勾选后，可以直接在屋顶和平台上种植，无需泥土；植物的灌溉或污染受正下方的土地影响。"
zhTW = "允許直接在屋頂和平台上放置，而不需要土壤。這些植物會從其下方的土地獲得灌溉（濕氣）和污染。"
ruRU = "Разрешить размещение на крышах и платформах напрямую без почвы. Эти растения получают полив (влажность) и загрязнение с земли под ними."
jaJP = "土壌なしで直接屋根やプラットフォームに設置を許可します。これらの植物は、その下の土地から潅水（湿気）と汚染を受けます。"
frFR = "Autoriser la mise en place sur des toits et des plateformes directement sans sol. Ces plantes reçoivent de l'irrigation (humidité) et de la contamination provenant du sol sous elles."
deDE = "Erlauben Sie die Platzierung auf Dächern und Plattformen direkt ohne Erde. Diese Pflanzen erhalten Bewässerung (Feuchtigkeit) und Kontamination von dem Land darunter."
plPL = "Zezwól na umieszczanie na dachach i platformach bezpośrednio, bez gleby. Rośliny te otrzymują nawadnianie (wilgoć) oraz zanieczyszczenia z gruntu pod nimi."
ptBR = "Permita a colocação em telhados e plataformas diretamente sem solo. Essas plantas recebem irrigação (umidade) e contaminação do solo embaixo."
koKR = "토양 없이 지붕과 플랫폼에 직접 배치할 수 있습니다. 이러한 식물은 아래 토양에서 물(수분)과 오염을 받습니다."
trTR = "Zemin olmadan çatı ve platformlara doğrudan yerleştirmeye izin verir. Bu bitkiler, altında bulunan topraktan sulama (nem) ve kirlenme alır."
esES = "Permitir colocarlas directamente sobre tejados y plataformas, sin suelo. Esas plantas reciben riego (humedad) y contaminación del terreno que hay debajo."
itIT = "Consenti la collocazione diretta su tetti e piattaforme, senza terreno. Tali piante ricevono irrigazione (umidità) e contaminazione dal suolo sottostante."
ukUA = "Дозволити розміщення безпосередньо на дахах і платформах без ґрунту. Ці рослини отримують зрошення (вологу) та забруднення від поверхні, на якій стоять."
thTH = "อนุญาตให้วางพืชบนหลังคาและแพลตฟอร์มได้โดยตรงโดยไม่ต้องใช้ดิน พืชเหล่านั้นจะได้รับการชลประทาน (ความชื้น) และการปนเปื้อนจากพื้นดินที่อยู่ด้านล่าง"
csCZ = "Povolte umístění na střechách a platformách přímo bez půdy. Tyto rostliny získávají zavlažování (vlhkost) a kontaminaci ze země pod nimi."
viVN = "Cho phép đặt trên mái nhà và các nền tảng trực tiếp mà không cần đất. Những cây trồng đó nhận được nước tưới (độ ẩm) và ô nhiễm từ đất ở phía dưới chúng."
caES = "Permet la col·locació directament sobre teulades i plataformes, sense sòl. Aquestes plantes reben reg (humitat) i contaminació del terreny que hi ha sota."
beBY = "Дазваляе размяшчаць расліны непасрэдна на дахах і платформах без глебы. Такія расліны атрымліваюць арашэнне (вільготнасць) і забруджванне ад паверхні, на якой стаяць."
roRO = "Permite plasarea direct pe acoperișuri și platforme, fără sol. Aceste plante primesc irigare (umiditate) și contaminare din terenul de sub ele."
huHU = "Lehetővé teszi, hogy a növények talaj nélkül, közvetlenül tetőkre és platformokra kerüljenek. Ezek a növények a alatta lévő talajból kapnak öntözést (nedvességet) és szennyeződést."
arSA = "السماح بالزراعة مباشرة على الأسطح والمنصات دون تربة. تحصل هذه النباتات على الري (الرطوبة) والتلوث من الأرض التي تقع تحتها."

