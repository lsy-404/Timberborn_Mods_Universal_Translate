["LV.VF.NoConUpDesc"]
raw = "Do not bring land contamination up, which means you can plant trees or crops on platforms while you can not on the land below"
status = "normal"
enUS = "Do not mention land contamination, which means you can plant trees or crops on platforms while you cannot on the land below."
zhCN = "勾选后，屋顶和平台上种植的植物默认被灌溉，不再受正下方土地影响。"
zhTW = "不要提到土地污染，這意味著你可以在平台上種植樹木或作物，而不能在下面的土地上種植。"
ruRU = "Не поднимайте вопрос о заражении земли, что означает, что вы можете сажать деревья или культуры на платформах, в то время как на земле внизу вы этого сделать не можете."
jaJP = "土地汚染の問題を持ち出さないでください。これは、地面の下では植えることができないが、プラットフォーム上では木や作物を植えることができることを意味します。"
frFR = "Ne parlez pas de contamination des sols, ce qui signifie que vous pouvez planter des arbres ou des cultures sur des plateformes alors que vous ne le pouvez pas sur le sol en dessous."
deDE = "Bringen Sie die Bodenverunreinigung nicht zur Sprache, was bedeutet, dass Sie Bäume oder Pflanzen auf Plattformen pflanzen können, während Sie dies auf dem darunter liegenden Land nicht können."
plPL = "Nie podnoś kwestii zanieczyszczenia gleby, co oznacza, że możesz sadzić drzewa lub uprawy na platformach, podczas gdy nie możesz robić tego na ziemi poniżej."
ptBR = "Não traga à tona a contaminação do solo, o que significa que você pode plantar árvores ou culturas em plataformas, enquanto não pode no solo abaixo."
koKR = "토양 오염을 증가시키지 않도록 하세요. 즉, 아래 토지에 심을 수 없는 동안 플랫폼에서 나무나 농작물을 심을 수 있습니다."
trTR = "Toprak kirliliğini artırmayın, bu da aşağıdaki arazide ekim yapamazken platformlarda ağaç veya ürün dikebileceğiniz anlamına geliyor."
esES = "No eleves la contaminación del terreno, lo que significa que puedes plantar árboles o cultivos sobre las plataformas, pero no sobre el terreno de abajo."
itIT = "Non alzare la contaminazione del terreno, il che significa che puoi piantare alberi o colture sulle piattaforme, mentre non puoi farlo sul terreno sottostante."
ukUA = "Не підвищуйте рівень забруднення ґрунту, адже це означає, що ви можете саджати дерева або культури на платформах, тоді як на ґрунті під ними це зробити не можна."
thTH = "ห้ามยกระดับการปนเปื้อนของดิน ซึ่งหมายความว่าคุณสามารถปลูกต้นไม้หรือพืชบนแพลตฟอร์มได้ ขณะที่บนพื้นดินด้านล่างไม่สามารถทำได้"
csCZ = "Nesnažte se zvyšovat kontaminaci půdy, což znamená, že můžete sázet stromy nebo plodiny na platformách, zatímco na půdě níže to možné není."
viVN = "Không để ô nhiễm đất lan lên, có nghĩa là bạn có thể trồng cây trên các nền tảng trong khi bạn không thể trồng trên đất phía dưới"
caES = "No augmentis la contaminació del terreny, cosa que vol dir que pots plantar arbres o cultius sobre les plataformes, mentre que no pots fer-ho sobre el terreny de sota."
beBY = "Не павышайце забруджванне зямлі, таму на платформах можна садзіць дрэвы або культуры, а на зямлі пад імі — не."
roRO = "Nu ridicați contaminarea terenului, ceea ce înseamnă că puteți planta copaci sau culturi pe platforme, dar nu și pe terenul de dedesubt."
huHU = "Ne növeld a földterület szennyeződését, ami azt jelenti, hogy platformokon fákat vagy növényeket ültethetsz, de a alatta lévő földön nem."
arSA = "لا ترفع تلوث الأرض، وهذا يعني أنه يمكنك زراعة الأشجار أو المحاصيل على المنصات، بينما لا يمكنك ذلك على الأرض الموجودة أسفلها."
