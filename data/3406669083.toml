["HB.BadwaterContaminationDesc"]
raw = "Disable Badwater Contamination, beavers still get unwell when contacted with Badwater but it won't get contaminated."
status = "normal"
enUS = "Disable Badwater Contamination; beavers still become unwell when exposed to Badwater, but it will not become contaminated."
zhCN = "勾选后，海狸不会被恶水污染，但仍会感到不舒服。"
zhTW = "禁用壞水污染，當接觸到壞水時，海狸仍然會感到不適，但不會被污染。"
ruRU = "Отключить загрязнение Бэдвотером, бобры все равно заболевают при контакте с Бэдвотером, но он не будет загрязнен."
jaJP = "バッドウォーターの汚染を無効にします。ビーバーはバッドウォーターに接触するとまだ具合が悪くなりますが、汚染されることはありません。"
frFR = "Désactiver la contamination des eaux usées, les castors tombent toujours malades lorsqu'ils sont en contact avec les eaux usées, mais elles ne seront pas contaminées."
deDE = "Deaktivieren Sie die Badwater-Verschmutzung, Biber werden immer noch unwohl, wenn sie mit Badwater in Kontakt kommen, aber es wird nicht kontaminiert."
plPL = "Wyłącz zanieczyszczenie wody z Badwater, bobry wciąż cierpią, gdy mają kontakt z Badwater, ale woda ta nie będzie zanieczyszczona."
ptBR = "Desative a Contaminação de Águas Ruins, os castores ainda ficam doentes quando entram em contato com Águas Ruins, mas não ficarão contaminados."
koKR = "불량 수역 오염 비활성화, 비버는 여전히 불량 수역과 접촉할 때 아프지만 오염되지는 않습니다."
trTR = "Kötü Su Kirlenmesini devre dışı bırak, mibzerler kötü su ile temas ettiklerinde hala hastalanacaklar ama kirlenmeyecek."
esES = "Desactiva la contaminación por aguamala: los castores siguen enfermando al entrar en contacto con aguamala, pero esta no se contaminará."
itIT = "Disattiva la contaminazione da acqua cattiva: i castori si ammalano ancora se entrano in contatto con l'acqua cattiva, ma l'acqua non si contamina."
ukUA = "Вимикає забруднення відходною водою: бобри все ще хворіють після контакту з відходною водою, але вона не забруднюється."
thTH = "ปิดการปนเปื้อนน้ำเสีย บีเวอร์ยังคงป่วยเมื่อสัมผัสกับน้ำเสีย แต่น้ำนั้นจะไม่ปนเปื้อน"
csCZ = "Deaktivovat kontaminaci špatnou vodou, bobři se stále mohou cítit špatně při kontaktu se špatnou vodou, ale voda nebude kontaminována."
viVN = "Vô hiệu hóa ô nhiễm Badwater, hải ly vẫn bị ốm khi tiếp xúc với nước Badwater nhưng nước sẽ không bị ô nhiễm."
caES = "Desactiva la contaminació per aigua brutal; els castors encara emmalalteixen en entrar en contacte amb l'aigua brutal, però no es contaminarà."
beBY = "Адключыць забруджванне бруднай вадой: бобры ўсё роўна будуць захварэваць пры кантакце з брудной вадой, але сама яна не забруджвацца."
roRO = "Dezactivează contaminarea cu apă otrăvită, castorii se îmbolnăvesc în continuare la contactul cu apa otrăvită, dar aceasta nu se contaminează."
huHU = "Kikapcsolja a Badwater-szennyeződést: a bobrok továbbra is megbetegszenek, ha érintkeznek a Badwaterrel, de a víz nem szennyeződik el."
arSA = "تعطيل تلوث المياه السامة. ما زال البيفر يمرض عند ملامسة المياه السامة، لكنها لن تتلوث."

