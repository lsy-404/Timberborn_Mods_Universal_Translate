["Building.CargoTubeStation.Description"]
status = "normal"
raw = "Join tubeways to its left, right or back, or from below. Haulers on long trips drop goods here (boxes, logs, liquids) and capsules carry up to 50 at a time through the tubes to the cargo station nearest their goal, where haulers take them on. Both stations must touch the same tube line. No power needed."
enUS = "Connect tubeways on the left, right, or back, or from below. Haulers on long trips drop goods here (boxes, logs, liquids), and capsules carry up to 50 at a time through the tubes to the cargo station nearest their goal, where haulers pick them up. Both stations must touch the same tube line. No power needed."
zhCN = "将管道连接到其左侧、右侧或后侧，也可以从下方连接。长途运输的搬运工会把货物（箱子、原木、液体）放在这里，运输舱每次最多可通过管道运送50件货物，送至离目的地最近的货运站，再由搬运工接手。两座货运站必须连接到同一条管道线路。无需动力。"
zhTW = "管道可連接至其左側、右側或後方，也可從下方連接。長途運輸的搬運工會將貨物（箱子、原木、液體）放在此處，膠囊每次最多可運送 50 件貨物，經由管道送往最接近目的地的貨運站，再由搬運工接手運送。兩座貨運站都必須連接至同一條管線。無需動力。"
ruRU = "Подключайте трубопути слева, справа, сзади или снизу. Носильщики, отправляющиеся в долгий путь, оставляют здесь товары (ящики, брёвна, жидкости), а капсулы перевозят по трубам до 50 единиц за раз до грузовой станции, ближайшей к месту назначения, где их забирают носильщики. Обе станции должны быть подключены к одной линии трубопути. Энергия не требуется."
jaJP = "左側、右側、背面、または下側からチューブウェイを接続できます。長距離移動する運搬人はここに荷物（箱、丸太、液体）を預け、カプセルが一度に最大50個をチューブ内を通って目的地に最も近い貨物駅まで運びます。そこで運搬人が荷物を引き継ぎます。両方の駅が同じチューブ路線に接続されている必要があります。電力は不要です。"
frFR = "Raccordez les tubes à sa gauche, à sa droite, à l’arrière ou par-dessous. Les transporteurs effectuant de longs trajets y déposent des marchandises (caisses, rondins, liquides), que des capsules acheminent dans les tubes, jusqu’à 50 à la fois, vers la station de fret la plus proche de leur destination. Les transporteurs les y prennent en charge. Les deux stations doivent être reliées à la même ligne de tubes. Aucune alimentation électrique n’est nécessaire."
deDE = "Verbinde Röhrenwege links, rechts, hinten oder von unten mit der Station. Träger auf langen Wegen geben hier Waren (Kisten, Baumstämme, Flüssigkeiten) ab. Kapseln transportieren jeweils bis zu 50 davon durch die Röhren zur Frachtstation, die ihrem Ziel am nächsten liegt. Dort übernehmen Träger die Waren. Beide Stationen müssen an dieselbe Röhrenlinie angeschlossen sein. Keine Energie erforderlich."
plPL = "Podłącz rury transportowe z lewej, prawej lub z tyłu, albo od dołu. Tragarze podczas długich tras zostawiają tutaj towary (skrzynie, kłody, płyny), a kapsuły przewożą je rurami, do 50 naraz, do stacji ładunkowej najbliższej ich celu, skąd tragarze przejmują transport. Obie stacje muszą być podłączone do tej samej linii rur. Nie wymaga zasilania."
ptBR = "Conecte tubos à esquerda, à direita ou atrás da estação, ou por baixo. Carregadores em viagens longas deixam mercadorias aqui (caixas, toras, líquidos), e cápsulas transportam até 50 por vez pelos tubos até a estação de carga mais próxima do destino, onde os carregadores continuam o transporte. Ambas as estações devem estar conectadas à mesma linha de tubos. Não precisa de energia."
koKR = "왼쪽, 오른쪽, 뒤쪽 또는 아래쪽에서 튜브웨이를 연결하세요. 장거리 이동 중인 운반꾼은 이곳에 물품(상자, 통나무, 액체)을 내려놓고, 캡슐은 한 번에 최대 50개를 튜브를 통해 목적지에 가장 가까운 화물역으로 운반합니다. 그곳에서 운반꾼이 이어서 운반합니다. 두 역은 모두 같은 튜브 선로에 접해 있어야 합니다. 동력은 필요하지 않습니다."
trTR = "Tüp yollarını soluna, sağına veya arkasına ya da altından bağlayın. Taşıyıcılar uzun yolculuklarda malları burada bırakır (kutular, kütükler, sıvılar); kapsüller tüplerden tek seferde 50'ye kadarını hedeflerine en yakın kargo istasyonuna taşır ve buradaki taşıyıcılar malları taşımaya devam eder. Her iki istasyon da aynı tüp hattına bağlı olmalıdır. Güç gerekmez."
esES = "Conecta los tubos por la izquierda, la derecha, la parte trasera o desde abajo. Los transportistas que recorren largas distancias dejan aquí sus mercancías (cajas, troncos, líquidos), y las cápsulas transportan hasta 50 a la vez por los tubos hasta la estación de carga más cercana a su destino, donde otros transportistas las recogen. Ambas estaciones deben estar conectadas a la misma línea de tubos. No necesita energía."
itIT = "Collega i tubi di trasporto a sinistra, a destra o sul retro, oppure dal basso. I trasportatori che compiono tragitti lunghi depositano qui le merci (scatole, tronchi, liquidi) e le capsule ne trasportano fino a 50 alla volta attraverso i tubi fino alla stazione di carico più vicina alla loro destinazione, dove i trasportatori le prendono in carico. Entrambe le stazioni devono essere collegate alla stessa linea di tubi. Non richiede energia."
ukUA = "Під’єднуйте трубопроводи зліва, справа, ззаду або знизу. Під час довгих маршрутів вантажники залишають тут товари (ящики, колоди, рідини), а капсули перевозять трубами до 50 одиниць за раз до вантажної станції, найближчої до їхньої цілі, де вантажники забирають їх. Обидві станції мають бути з’єднані з тією самою лінією труб. Живлення не потрібне."
thTH = "เชื่อมต่อท่อขนส่งทางซ้าย ขวา หรือด้านหลัง หรือเชื่อมจากด้านล่าง ผู้ขนส่งที่เดินทางไกลจะนำสินค้ามาวางไว้ที่นี่ (กล่อง ท่อนซุง ของเหลว) แล้วแคปซูลจะขนสินค้าได้สูงสุด 50 ชิ้นต่อครั้งผ่านท่อไปยังสถานีขนส่งสินค้าที่ใกล้เป้าหมายที่สุด ซึ่งผู้ขนส่งจะรับช่วงต่อ สถานีทั้งสองแห่งต้องเชื่อมต่อกับแนวท่อเดียวกัน ไม่ต้องใช้พลังงาน"
csCZ = "Připojte tubusy zleva, zprava nebo zezadu, případně zespodu. Nosiči na dlouhých cestách zde odloží zboží (bedny, klády, kapaliny) a kapsle ho tubusy přepraví až 50 najednou do nákladní stanice nejblíže jejich cíli, kde ho nosiči převezmou. Obě stanice se musí dotýkat stejné tubusové linky. Není potřeba energie."
viVN = "Kết nối các ống vận chuyển ở bên trái, bên phải, phía sau hoặc từ bên dưới. Người vận chuyển trên những chuyến đi dài sẽ gửi hàng ở đây (thùng, khúc gỗ, chất lỏng), rồi các viên nang chở tối đa 50 món mỗi lượt qua các ống đến trạm hàng hóa gần điểm đến nhất, nơi người vận chuyển sẽ nhận hàng. Cả hai trạm phải tiếp giáp với cùng một tuyến ống. Không cần điện."
caES = "Connecta-hi tubs per l'esquerra, la dreta o la part posterior, o bé des de sota. Els transportistes que facin trajectes llargs hi deixen els béns (caixes, troncs, líquids), i les càpsules en transporten fins a 50 cada vegada pels tubs fins a l'estació de càrrega més propera al seu destí, on els transportistes els recullen. Les dues estacions han de tocar la mateixa línia de tubs. No necessita energia."
beBY = "Злучайце з трубаправодамі злева, справа, ззаду або знізу. Грузчыкі, якія ідуць далёка, пакідаюць тут тавары (скрыні, бярвёны, вадкасці), а капсулы вязуць іх па трубах — да 50 за раз — да грузавой станцыі, найбліжэйшай да месца прызначэння, дзе грузчыкі забіраюць іх і нясуць далей. Абедзве станцыі павінны злучацца з адной і той жа лініяй труб. Энергія не патрэбна."
roRO = "Conectați tuburile în stânga, în dreapta sau în spate, ori de dedesubt. Transportatorii care parcurg distanțe lungi lasă aici bunurile (cutii, bușteni, lichide), iar capsulele transportă până la 50 odată prin tuburi până la stația de marfă cea mai apropiată de destinația lor, de unde transportatorii le preiau pentru a le duce mai departe. Ambele stații trebuie să fie conectate la aceeași linie de tuburi. Nu necesită putere."
huHU = "Csatlakoztass hozzá csőutakat balról, jobbról, hátulról vagy alulról. A hosszú útra induló szállítók itt rakják le az árukat (ládákat, rönköket, folyadékokat), a kapszulák pedig egyszerre legfeljebb 50-et szállítanak a csöveken át a céljukhoz legközelebbi teherszállító állomásra, ahonnan a szállítók továbbviszik őket. Mindkét állomásnak ugyanahhoz a csővezetékhez kell csatlakoznia. Nem igényel energiát."
arSA = "وصّل أنابيب النقل من يسارها أو يمينها أو خلفها، أو من أسفلها. يترك عمال النقل في الرحلات الطويلة البضائع هنا (الصناديق وجذوع الأشجار والسوائل)، وتحملها الكبسولات عبر الأنابيب إلى أقرب محطة شحن من وجهتها، بحد أقصى 50 في المرة الواحدة، حيث يتولى عمال النقل نقلها إلى وجهتها. يجب أن تلامس المحطتان خط الأنابيب نفسه. لا حاجة إلى طاقة."

