["Building.CargoStation.Description"]
status = "abandoned"
raw = "Link it to other stations and pylons, up to four cables in any direction. Haulers on long trips drop goods here (boxes, logs, liquids) and crates carry them to the station nearest their goal, where haulers take them on. No power needed. Beavers cannot ride the cable."
enUS = "Link it to other stations and pylons, up to four cables in any direction. Haulers on long trips drop goods here (boxes, logs, liquids) and crates carry them to the station nearest their goal, where haulers take them on. No power needed. Beavers cannot ride the cable."
zhCN = "将其连接到其他站点和塔架，任意方向最多可连接四条缆线。长途运输的搬运工会把货物（箱子、原木、液体）放在这里，再由货箱运送到最靠近目的地的站点，搬运工会在那里继续接运。无需电力。海狸不能乘坐缆线。"
zhTW = "將它連接到其他站點和支柱，最多可朝任意方向連接四條纜線。長途運輸的搬運工會將貨物（箱子、原木、液體）放在這裡，再由貨箱運送到最接近目的地的站點，讓搬運工接手。無需動力。海狸無法乘坐纜線。"
ruRU = "Подключите станцию к другим станциям и пилонам, проложив до четырёх тросов в любом направлении. Грузчики в дальних поездках оставляют здесь товары (ящики, брёвна, жидкости), а ящики доставляют их до станции, ближайшей к месту назначения, где грузчики забирают их. Энергия не нужна. Бобры не могут ездить по тросу."
jaJP = "他のステーションやパイロンと接続でき、任意の方向に最大4本のケーブルを張れます。長距離移動中の運搬係はここに品物（箱、丸太、液体）を降ろし、木箱が目的地に最も近いステーションまで運び、そこで運搬係が引き継ぎます。電力は必要ありません。ビーバーはケーブルに乗れません。"
frFR = "Reliez-la à d'autres stations et pylônes, avec jusqu'à quatre câbles dans n'importe quelle direction. Les transporteurs qui font de longs trajets déposent ici les marchandises (boîtes, bûches, liquides), puis des caisses les acheminent jusqu'à la station la plus proche de leur destination, où les transporteurs les prennent en charge. Aucune énergie nécessaire. Les castors ne peuvent pas emprunter le câble."
deDE = "Verbinde sie mit anderen Stationen und Masten, mit bis zu vier Kabeln in jede beliebige Richtung. Träger auf langen Wegen legen Waren hier ab (Kisten, Baumstämme, Flüssigkeiten), und Kisten bringen sie zur Station, die ihrem Ziel am nächsten liegt. Dort nehmen Träger sie wieder auf. Keine Energie erforderlich. Biber können nicht auf dem Kabel fahren."
plPL = "Połącz ją z innymi stacjami i pylonami za pomocą maksymalnie czterech kabli w dowolnym kierunku. Tragarze pokonujący długie trasy zostawiają tu towary (skrzynie, kłody, ciecze), a skrzynie przewożą je do stacji najbliższej ich celu, skąd tragarze zabierają je dalej. Nie wymaga zasilania. Bobry nie mogą jeździć po kablu."
ptBR = "Conecte-a a outras estações e postes, com até quatro cabos em qualquer direção. Carregadores em viagens longas deixam mercadorias aqui (caixas, toras, líquidos), e caixotes as levam até a estação mais próxima do destino, onde os carregadores continuam o transporte. Não requer energia. Castores não podem viajar pelo cabo."
koKR = "다른 정거장 및 철탑에 어느 방향으로든 케이블을 최대 4개까지 연결할 수 있습니다. 장거리 운송 중인 운반꾼은 이곳에 물품(상자, 통나무, 액체)을 내려놓고, 상자가 물품을 목적지에서 가장 가까운 정거장까지 운반하면 그곳에서 운반꾼이 다시 가져갑니다. 동력이 필요하지 않습니다. 비버는 케이블을 탈 수 없습니다."
trTR = "Diğer istasyonlara ve direklere bağlayın; her yönde en fazla dört kablo. Uzun yolculuk yapan taşıyıcılar malları (kutular, kütükler, sıvılar) buraya bırakır; kasalar bunları hedeflerine en yakın istasyona taşır ve taşıyıcılar oradan alıp yollarına devam eder. Güç gerekmez. Kunduzlar kabloda yolculuk edemez."
esES = "Conéctala con otras estaciones y pilones, con hasta cuatro cables en cualquier dirección. Los transportistas que hacen trayectos largos dejan aquí mercancías (cajas, troncos, líquidos), y los cajones las llevan hasta la estación más cercana a su destino, donde los transportistas las recogen. No requiere energía. Los castores no pueden viajar por el cable."
itIT = "Collega questa stazione ad altre stazioni e piloni, fino a quattro cavi in qualsiasi direzione. Durante i viaggi lunghi, i trasportatori lasciano qui le merci (scatole, tronchi, liquidi) e le casse le portano alla stazione più vicina alla loro destinazione, dove i trasportatori le riprendono. Non serve energia. I castori non possono viaggiare sul cavo."
ukUA = "Під'єднайте станцію до інших станцій і пілонів — до чотирьох тросів у будь-якому напрямку. Перевізники під час довгих маршрутів залишають тут товари (ящики, колоди, рідини), а контейнери доставляють їх до станції, найближчої до пункту призначення, де перевізники забирають їх далі. Живлення не потрібне. Бобри не можуть пересуватися тросом."
thTH = "เชื่อมต่อกับสถานีและเสาอื่น ๆ ได้สูงสุดสี่สาย ในทิศทางใดก็ได้ ผู้ขนส่งที่เดินทางไกลจะนำสินค้ามาวางไว้ที่นี่ (กล่อง ท่อนซุง ของเหลว) แล้วลังจะขนส่งสินค้าไปยังสถานีที่ใกล้เป้าหมายที่สุด ซึ่งผู้ขนส่งจะรับช่วงต่อ ไม่ต้องใช้พลังงาน บีเวอร์ไม่สามารถโดยสารสายเคเบิลได้"
csCZ = "Propojte ji s dalšími stanicemi a pylony až čtyřmi kabely v libovolném směru. Nosiči při dlouhých cestách odkládají zboží (bedny, klády, kapaliny) zde a přepravky je dopraví ke stanici nejblíže jejich cíli, kde je nosiči převezmou. Není potřeba žádná energie. Bobři po kabelu jezdit nemohou."
viVN = "Kết nối nó với các trạm và cột khác, tối đa bốn dây cáp theo bất kỳ hướng nào. Người vận chuyển trong những chuyến đi dài sẽ thả hàng ở đây (thùng, khúc gỗ, chất lỏng), rồi các kiện hàng sẽ đưa chúng đến trạm gần đích nhất, nơi người vận chuyển tiếp tục mang đi. Không cần năng lượng. Hải ly không thể đi trên cáp."
caES = "Connecta-la amb altres estacions i pilones, amb fins a quatre cables en qualsevol direcció. Els transportistes que fan trajectes llargs hi deixen mercaderies (caixes, troncs, líquids), i els caixons les transporten fins a l’estació més propera a la seva destinació, on els transportistes les recullen per continuar el trajecte. No cal energia. Els castors no poden anar pel cable."
beBY = "Злучыце яе з іншымі станцыямі і слупамі — можна пракласці да чатырох тросаў у любым кірунку. Грузчыкі, якія адпраўляюцца ў далёкія паездкі, пакідаюць тут тавары (скрыні, бярвенне, вадкасці), а скрыні дастаўляюць іх да станцыі, бліжэйшай да месца прызначэння, дзе грузчыкі забіраюць іх далей. Электраэнергія не патрэбная. Бабры не могуць ездзіць па тросе."
roRO = "Conecteaz-o la alte stații și piloni, cu până la patru cabluri în orice direcție. Cărăușii aflați în călătorii lungi lasă aici bunurile (lăzi, bușteni, lichide), iar lăzile le transportă la stația cea mai apropiată de destinația lor, unde le preiau alți cărăuși. Nu este nevoie de energie. Castorii nu pot călători cu cablul."
huHU = "Kösd össze más állomásokkal és oszlopokkal, bármely irányban legfeljebb négy kábellel. A hosszú úton járó szállítók itt rakják le az árukat (dobozokat, rönköket, folyadékokat), a ládák pedig a céljukhoz legközelebbi állomásra viszik őket, ahol a szállítók továbbviszik. Nincs szükség energiára. A hódok nem utazhatnak a kábelen."
arSA = "يمكن ربطها بمحطات وأبراج أخرى عبر ما يصل إلى أربعة كابلات في أي اتجاه. يودع الناقلون البضائع هنا خلال الرحلات الطويلة (الصناديق، وجذوع الأشجار، والسوائل)، وتنقلها صناديق الشحن إلى المحطة الأقرب إلى وجهتها، حيث يتسلمها الناقلون لمواصلة نقلها. لا تحتاج إلى طاقة. لا يمكن للقنادس ركوب الكابل."

