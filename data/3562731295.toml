["LV.EQ.EqDurabilityDesc"]
raw = "When the next earthquake hits, permanently increase this building Durability by {0:+0%}. Can only be applied once. Also provide immunity to that hit."
status = "normal"
enUS = "When the next earthquake hits, permanently increase this building Durability by {0:+0%}. Can only be applied once. Also provide immunity to that hit."
zhCN = "下一次地震发生时，使建筑免疫地震伤害，并增加建筑生命值上限 {0:+0%}。此项目仅能生效一次。"
zhTW = "當下一次地震發生時，將永久提升此建築的耐久度 {0:+0%}。此效果只能應用一次。並且提供對此次撞擊的免疫。"
ruRU = "Когда произойдёт следующая землятресение, навсегда увеличивает прочность этого здания на {0:+0%}. Может быть применено только один раз. Также обеспечивает иммунитет к этому удару."
jaJP = "次の地震が発生したとき、この建物の耐久性を{0:+0%}恒久的に増加させます。適用は一度きりです。また、その攻撃に対する免疫も提供します。"
frFR = "Lorsque le prochain tremblement de terre frappe, augmentez définitivement la Durabilité de ce bâtiment de {0:+0%}. Ne peut être appliqué qu'une seule fois. Offre également une immunité à ce choc."
deDE = "Wenn das nächste Erdbeben eintritt, erhöht sich die Haltbarkeit dieses Gebäudes dauerhaft um {0:+0%}. Kann nur einmal angewendet werden. Gewährt außerdem Immunität gegen diesen Schlag."
plPL = "Podczas następnego trzęsienia ziemi, na stałe zwiększa wytrzymałość tego budynku o {0:+0%}. Może być zastosowane tylko raz. Zapewnia również odporność na ten wstrząs."
ptBR = "Quando o próximo terremoto ocorrer, aumente permanentemente a Durabilidade deste edifício em {0:+0%}. Pode ser aplicado apenas uma vez. Também fornece imunidade a esse impacto."
koKR = "다음 지진이 발생할 때, 이 건물의 내구성을 영구적으로 {0:+0%} 증가시킵니다. 한 번만 적용될 수 있습니다. 또한 그 타격에 대한 면역을 제공합니다."
trTR = "Bir sonraki deprem meydana geldiğinde, bu binanın Dayanıklılığını kalıcı olarak {0:+0%} artırır. Sadece bir kez uygulanabilir. Ayrıca o darbeye karşı bağışıklık sağlar."
esES = "Cuando golpee el próximo terremoto, aumenta permanentemente la Durabilidad de este edificio en {0:+0%}. Solo puede aplicarse una vez. Además, proporciona inmunidad a ese golpe."
itIT = "Al prossimo terremoto, aumenta permanentemente la Durabilità di questo edificio di {0:+0%}. Può essere applicato solo una volta. Fornisce inoltre immunità a quel colpo."
ukUA = "Коли настане наступний землетрус, назавжди збільшує Міцність цієї будівлі на {0:+0%}. Можна застосувати лише один раз. Також забезпечує імунітет до цього удару."
thTH = "เมื่อแผ่นดินไหวครั้งต่อไปเกิดขึ้น จะเพิ่มความทนทานของอาคารนี้อย่างถาวรอีก {0:+0%} ใช้ได้เพียงครั้งเดียวเท่านั้น และยังให้ภูมิคุ้มกันต่อการสั่นสะเทือนครั้งนั้นด้วย"
csCZ = "Když nastane další zemětřesení, trvale zvýší odolnost této budovy o {0:+0%}. Může být použito pouze jednou. Také poskytuje imunitu vůči danému zásahu."
viVN = "Khi trận động đất tiếp theo xảy ra, tăng vĩnh viễn độ bền của tòa nhà này lên {0:+0%}. Chỉ có thể được áp dụng một lần. Cũng được miễn nhiễm với trận động đất đó."
caES = "Quan arribi el següent terratrèmol, augmenta permanentment la durabilitat d'aquest edifici en {0:+0%}. Només es pot aplicar una vegada. A més, proporciona immunitat a aquell impacte."
beBY = "Пры наступным землетрусе назаўсёды павысіць трываласць гэтай пабудовы на {0:+0%}. Можа быць ужыта толькі адзін раз. Таксама забяспечвае імунітэт да гэтага штуршка."
roRO = "Când lovește următorul cutremur, crește permanent Durabilitatea acestei clădiri cu {0:+0%}. Poate fi aplicat doar o singură dată. De asemenea, oferă imunitate la acea lovitură."
huHU = "Amikor legközelebb földrengés éri, ennek az épületnek a tartósságát véglegesen {0:+0%}-kal növeli. Csak egyszer alkalmazható. Emellett immunitást biztosít az adott rengés ellen."
arSA = "عند حدوث الزلزال التالي، ستزيد متانة هذا المبنى بشكل دائم بمقدار {0:+0%}. لا يمكن تطبيق ذلك إلا مرة واحدة. كما يمنح حصانة من تلك الهزة."

