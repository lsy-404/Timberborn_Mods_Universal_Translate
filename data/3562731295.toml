["LV.EQ.EqImmunityFlavor"]
raw = "Logs wedged like springs make the whole place bounce when the ground rumbles. Fun, but safe!"
status = "normal"
enUS = "Logs wedged like springs make the whole place bounce when the ground rumbles. Fun, but safe!"
zhCN = "楔入房屋的原木组成弹簧缓冲系统，使地震时的震动降至可承受范围。此项目仅能生效一次。"
zhTW = "被壓緊的木頭如彈簧般，當地面震動時整個地方都會彈起來。好玩，但安全！"
ruRU = "Бревна, застрявшие как пружины, заставляют всё место подпрыгивать, когда земля гремит. Весело, но безопасно!"
jaJP = "「ばねのように挟まった丸太が、地面が揺れると一面をバウンスさせる。楽しいけれど、安全だ！」"
frFR = "Les bûches coincées comme des ressorts font vibrer tout l'endroit lorsque le sol gronde. Amusant, mais sûr !"
deDE = "Wie Federn verkeilte Stämme lassen den ganzen Ort wackeln, wenn der Boden bebt. Spaßig, aber sicher!"
plPL = "Kłody wciśnięte jak sprężyny sprawiają, że całe miejsce podskakuje, gdy ziemia drży. Fajnie, ale bezpiecznie!"
ptBR = "Registros presos como molas fazem o lugar todo saltar quando o chão treme. Divertido, mas seguro!"
koKR = "스프링처럼 끼인 통나무들이 땅이 흔들릴 때 전체가 튕겨 오르게 만듭니다. 재미있지만 안전해요!"
trTR = "Yükseltilmiş gibi sıkışmış odunlar, yer sarsıldığında her yeri zıplatır. Eğlenceli, ama güvenli!"
esES = "Los troncos encajados como resortes hacen que todo el lugar rebote cuando el suelo retumba. ¡Divertido, pero seguro!"
itIT = "Dei tronchi incastrati come molle fanno rimbalzare tutto il posto quando il terreno trema. Divertente, ma sicuro!"
ukUA = "Колоди, затиснуті, наче пружини, змушують усе навколо підскакувати, коли земля гуркоче. Весело, але безпечно!"
thTH = "ท่อนไม้ที่ถูกอัดไว้เหมือนสปริงทำให้ทั้งพื้นที่กระดอนขึ้นลงเมื่อพื้นดินสั่นสะเทือน สนุกดี แต่ปลอดภัย!"
csCZ = "Kmeny zaklíněné jako pružiny způsobují, že se celé místo otřásá, když se země otřese. Zábava, ale bezpečné!"
