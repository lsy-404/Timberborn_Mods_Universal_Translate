["LV.EQ.EqDamageReductionFlavor"]
raw = "The floor beams are interlocked and cross-braced, distributing seismic stress throughout the structure."
status = "normal"
enUS = "The floor beams are interlocked and cross-braced, distributing seismic stress throughout the structure."
zhCN = "地板横梁相互锁扣并交叉支撑，将地震应力分散到整个地基结构。"
zhTW = "地板梁交錯並相互支撐，將地震壓力分散到整個結構中。"
ruRU = "Половые балки взаимозастрачены и перекрещены, распределяя сейсмическое напряжение по всей конструкции."
jaJP = "床梁は相互に組み合わされ、交差して補強されており、構造全体にわたって地震の力を分散します。"
frFR = "Les poutres de sol sont entrelacées et croisées, répartissant le stress sismique dans toute la structure."
deDE = "Die Fußbodenbalken sind verzahnt und kreuzweise abgestützt, wodurch seismische Belastungen gleichmäßig auf die Struktur verteilt werden."
plPL = "Belki stropowe są ze sobą połączone i wzmocnione krzyżowo, rozkładając stres sejsmiczny w całej strukturze."
ptBR = "As vigas do piso estão entrelaçadas e reforçadas, distribuindo o estresse sísmico por toda a estrutura."
koKR = "바닥 빔이 서로 연결되고 교차 보강되어, 구조 전체에 걸쳐 지진에 대한 스트레스를 분산시킵니다."
trTR = "Zemin kirişleri birbirine kenetlenmiş ve çapraz desteklenmiştir, sismik stresi yapının her yerine dağıtarak etkili bir dağılım sağlar."
esES = "Las vigas del suelo están entrelazadas y arriostradas en cruz, distribuyendo el estrés sísmico por toda la estructura."
itIT = "Le travi del pavimento sono incastrate e controventate in croce, distribuendo le sollecitazioni sismiche su tutta la struttura."
ukUA = "Балки перекриттів з'єднані між собою та розкріплені діагональними зв'язками, розподіляючи сейсмічне навантаження по всій конструкції."
thTH = "คานพื้นถูกประกบกันและค้ำยันแบบไขว้ กระจายแรงสั่นสะเทือนจากแผ่นดินไหวไปทั่วทั้งโครงสร้าง"
csCZ = "Podlahové nosníky jsou spojeny a křížově vyztuženy, což rozděluje seismický stres po celé konstrukci."
viVN = "Các dầm sàn được liên kết chặt chẽ và đan chéo, phân tán lực địa chấn khắp công trình."
caES = "Les bigues del pis estan entrellaçades i reforçades amb creuaments, cosa que distribueix l'esforç sísmic per tota l'estructura."
beBY = "Перакрыцці падлогі злучаны і ўзмоцнены крыжавымі распоркамі, якія размяркоўваюць сейсмічную нагрузку па ўсёй канструкцыі."
roRO = "Grinzile de podea sunt îmbinate și contravântuite încrucișat, distribuind tensiunile seismice în întreaga structură."
huHU = "A padlógerendák egymásba záródnak és keresztirányú merevítést kapnak, így a szerkezetben a földrengési feszültség egyenletesen oszlik el."
