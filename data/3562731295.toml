status = "normal"
enUS = "The maximum strength of the Earthquake. The amount of HP it can deal to buildings.\nAffected by Handicap."
zhCN = "地震造成震动时，范围内建筑生命值受到地震伤害的最大值。<br>注意，此数值受天气初始强度值、适应周期数影响。"
