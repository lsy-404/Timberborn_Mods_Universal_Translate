["LV.EQ.EqBlockedDesc"]
raw = "What a mess! This building was recently damaged by earthquake and need to be cleaned up. Certain function may be blocked until then."
status = "normal"
enUS = "What a mess! This building was recently damaged by earthquake and need to be cleaned up. Certain function may be blocked until then."
zhCN = "此建筑受到地震影响，正在紧急检查。检查完成前某些功能可能会被封锁。"
zhTW = "真是一團糟！這棟建築最近受到了地震的損壞，需要進行清理。在此之前，某些功能可能會被阻止使用。"
ruRU = "Какой беспорядок! Это здание недавно было повреждено землетрясением и нуждается в уборке. Некоторые функции могут быть заблокированы до тех пор."
jaJP = "何てこった！この建物は最近地震で損傷を受けており、清掃が必要です。それまでは特定の機能が制限される場合があります。"
frFR = "Quel désordre ! Ce bâtiment a été récemment endommagé par un tremblement de terre et doit être nettoyé. Certaines fonctions peuvent être bloquées d'ici là."
deDE = "Was für ein Durcheinander! Dieses Gebäude wurde kürzlich durch ein Erdbeben beschädigt und muss gereinigt werden. Bestimmte Funktionen könnten bis dahin blockiert sein."
plPL = "Co za bałagan! Ten budynek został niedawno uszkodzony przez trzęsienie ziemi i musi zostać posprzątany. Niektóre funkcje mogą być zablokowane do tego czasu."
ptBR = "Que bagunça! Este edifício foi recentemente danificado por um terremoto e precisa ser limpo. Certas funções podem estar bloqueadas até lá."
koKR = "무슨 난리야! 이 건물은 최근 지진으로 피해를 입었고, 청소가 필요하다. 그때까지는 특정 기능이 차단될 수 있다."
trTR = "Ne berbat bir durum! Bu bina yakın zamanda bir depremden zarar gördü ve temizlenmesi gerekiyor. Belirli işlevler o zamana kadar engellenebilir."
esES = "¡Qué desastre! Este edificio fue dañado recientemente por un terremoto y necesita ser limpiado. Algunas funciones pueden estar bloqueadas hasta entonces."
itIT = "Che disastro! Questo edificio è stato danneggiato di recente da un terremoto e deve essere ripulito. Alcune funzioni potrebbero essere bloccate fino ad allora."
ukUA = "Який безлад! Ця будівля нещодавно зазнала пошкоджень від землетрусу і потребує прибирання. До того часу деякі функції можуть бути заблоковані."
thTH = "ช่างวุ่นวายจริง! อาคารนี้เพิ่งได้รับความเสียหายจากแผ่นดินไหวและต้องได้รับการทำความสะอาด ฟังก์ชันบางอย่างอาจถูกระงับจนกว่าจะดำเนินการเสร็จ"
csCZ = "Co za chaos! Tato budova byla nedávno poškozena zemětřesením a je potřeba ji uklidit. Některé funkce mohou být do té doby zablokovány."
viVN = "Thật là một mớ hỗn độn! Tòa nhà này gần đây bị động đất làm hỏng và cần được dọn dẹp. Một số chức năng có thể bị khóa cho đến khi đó."
caES = "Quina manera de desordre! Aquest edifici va ser danyat fa poc per un terratrémol i cal netejar-lo. Fins llavors, és possible que algunes funcions estiguin bloquejades."
beBY = "Ой, які выдатак! Гэты будынак нядаўна пацярпеў ад землетрасення і яго трэба прыбраць. Да таго часу некаторыя функцыі могуць быць заблакаваны."
roRO = "Ce dezastru! Această clădire a fost recent avariată de un cutremur și trebuie curățată. Anumite funcții pot fi blocate până atunci."
huHU = "Micsoda rendetlenség! Ezt az épületet nemrégiben megrongálta egy földrengés, takarítani kell utána. Bizonyos funkciók addig blokkolva lehetnek."
arSA = "يا لها من فوضى! تضرر هذا المبنى مؤخرًا بسبب زلزال ويحتاج إلى تنظيف. قد تكون بعض الوظائف معطلة إلى أن يتم ذلك."
