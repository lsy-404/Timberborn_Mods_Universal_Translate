["LV.EQ.EarthquakeDesc"]
raw = "Hazardous weather: during this weather, quakes strike every now and then. Each quake strikes:\nA random area and causes:\n- Damage to buildings and may block certain functions for a while\n- Constructions are reset (materials are not lost)\n- Explosives detonate\n- Items may spill from storage buildings. If the building contains explosives, the whole content is lost and the building is destroyed.\n- Beavers and bots inside the hit area may get injured/damaged.\nAcross the map:\n- All water expands by a certain percentage"
status = "normal"
enUS = "Hazardous weather: during this weather, quakes strike every now and then. Each quake strikes:\nA random area and causes:\n- Damage to buildings and may block certain functions for a while\n- Constructions are reset (materials are not lost)\n- Explosives detonate\n- Items may spill from storage buildings. If the building contains explosives, the whole content is lost and the building is destroyed.\n- Beavers and bots inside the hit area may get injured/damaged.\nAcross the map:\n- All water expands by a certain percentage."
zhCN = "危险天气：在这种天气中，地震时不时发生。每次地震会随机轰击一个区域，并造成以下影响：  \n- 建筑受损，可能会暂时阻碍某些功能  \n- 工程被重置（材料不会丢失）  \n- 爆炸物引爆  \n- 物品可能会从仓储建筑中溢出。如果建筑内含有爆炸物，则所有内容物都会丢失，建筑会被摧毁。  \n- 在受影响区域内的海狸和机器人可能会受伤或受损。  \n在全图范围内：  \n- 所有水域的面积扩大一定百分比"
zhTW = "危險天氣：在這種天氣下，地震時常發生。每次地震影響到：\n隨機區域並造成：\n- 損壞建築物，並可能暫時阻礙某些功能\n- 建設重置（材料不會損失）\n- 爆炸物引爆\n- 物品可能從儲存建築中spill出來。如果該建築內含有爆炸物，整個內容物會損失，並且建築會被摧毀。\n- 在受影響區域內的海狸和機器人可能會受傷/受損。\n在整個地圖上：\n- 所有水域擴展一定百分比。"
ruRU = "Опасная погода: в течение этой погоды время от времени происходят землетрясения. Каждое землетрясение происходит в:\nСлучайной области и вызывает:\n- Ущерб зданиям и может временно заблокировать определенные функции\n- Строительства сбрасываются (материалы не теряются)\n- Взрывчатые вещества детонируют\n- Предметы могут вывалиться из складов. Если в здании есть взрывчатые вещества, весь содержимое теряется, и здание разрушается.\n- Бобры и роботы внутри зоны удара могут получить травмы/повреждения.\nПо всей карте:\n- Вода расширяется на определенный процент"
jaJP = "危険な天候：この天候の間、地震が時々発生します。各地震は次のことを引き起こします：\nランダムなエリアで、以下の損害をもたらします：\n- 建物にダメージを与え、一定期間機能が制限される場合があります\n- 建設がリセットされます（材料は失われません）\n- 爆発物が起爆します\n- 物品が保管建物からこぼれることがあります。建物に爆発物が含まれている場合、全ての内容物が失われ、建物が破壊されます。\n- ヒットエリア内のビーバーやボットが怪我をする可能性があります。\nマップ全体では：\n- 全ての水が一定の割合で拡大します。"
frFR = "Météo dangereuse : pendant ce temps, des tremblements de terre se produisent de temps en temps. Chaque tremblement de terre frappe :\nUne zone aléatoire et cause :\n- Des dégâts aux bâtiments et peut bloquer certaines fonctions pendant un certain temps\n- Les constructions sont réinitialisées (les matériaux ne sont pas perdus)\n- Les explosifs détonent\n- Des objets peuvent se renverser des bâtiments de stockage. Si le bâtiment contient des explosifs, tout son contenu est perdu et le bâtiment est détruit.\n- Les castors et les robots à l'intérieur de la zone touchée peuvent être blessés/endommagés.\nSur toute la carte :\n- Toute l'eau s'étend d'un certain pourcentage."
deDE = "Gefährliches Wetter: Während dieses Wetters treten gelegentlich Erdbeben auf. Jedes Beben trifft:\nEin zufälliges Gebiet und verursacht:\n- Schäden an Gebäuden und kann bestimmte Funktionen für eine Weile blockieren\n- Der Bau wird zurückgesetzt (Materialien gehen nicht verloren)\n- Explosive Stoffe detonieren\n- Gegenstände können aus Lagergebäuden herausfallen. Wenn das Gebäude explosive Stoffe enthält, geht der gesamte Inhalt verloren und das Gebäude wird zerstört.\n- Biber und Bots im betroffenen Bereich können verletzt/geschädigt werden.\nAuf der Karte:\n- Alle Wasserflächen erweitern sich um einen bestimmten Prozentsatz."
plPL = "Niebezpieczna pogoda: w czasie tej pogody trzęsienia ziemi zdarzają się co jakiś czas. Każde trzęsienie ziemi uderza w:\nLosowy obszar i powoduje:\n- Uszkodzenia budynków, które mogą zablokować niektóre funkcje na pewien czas\n- Konstrukcje są resetowane (materiały nie są tracone)\n- Materiały wybuchowe detonują\n- Przedmioty mogą wylewać się z magazynów. Jeśli budynek zawiera materiały wybuchowe, cała zawartość jest tracona, a budynek jest zniszczony.\n- Bobry i roboty znajdujące się w obszarze uderzenia mogą odnieść obrażenia/uszkodzenia.\nNa całej mapie:\n- Cała woda rozszerza się o pewien procent"
ptBR = "Clima perigoso: durante este clima, terremotos ocorrem de vez em quando. Cada terremoto atinge:\nUma área aleatória e causa:\n- Danos a edifícios e pode bloquear certas funções por um tempo\n- Construções são reiniciadas (materiais não são perdidos)\n- Explosivos detonam\n- Itens podem se espalhar de edifícios de armazenamento. Se o edifício contiver explosivos, todo o conteúdo é perdido e o edifício é destruído.\n- Castores e robôs dentro da área atingida podem se ferir/danificar.\nPelo mapa:\n- Toda água se expande por uma certa porcentagem."
koKR = "위험한 날씨: 이 날씨 동안 지진이 때때로 발생합니다. 각 지진은:\n무작위 지역을 강타하며 다음과 같은 피해를 줍니다:\n- 건물에 피해를 주고 특정 기능이 잠시 중단될 수 있습니다.\n- 건설이 초기화됩니다 (자재는 손실되지 않습니다).\n- 폭탄이 폭발합니다.\n- 저장 건물에서 아이템이 쏟아질 수 있습니다. 건물에 폭발물이 포함된 경우, 모든 내용물이 손실되고 건물이 파괴됩니다.\n- 피해를 입은 지역에 있는 비버와 로봇이 상처를 입거나 손상을 받을 수 있습니다.\n지도 전역에서:\n- 모든 물이 일정 비율만큼 확장됩니다."
trTR = "Tehlikeli hava durumu: Bu hava koşullarında, zaman zaman depremler meydana gelir. Her deprem:\nRastgele bir alanı vurur ve şu etkilere neden olur:\n- Binalara zarar verir ve belirli işlevlerin bir süre engellenmesine neden olabilir\n- İnşaatlar sıfırlanır (malzemeler kaybolmaz)\n- Patlayıcılar patlar\n- Depo binalarından eşyalar dökülebilir. Eğer bina patlayıcı içeriyorsa, tüm içeriği kaybolur ve bina yok olur.\n- Vurulan alandaki bobrular ve robotlar yaralanabilir/zarar görebilir.\nHarita genelinde:\n- Tüm su belirli bir yüzdeyle genişler."
esES = "Clima peligroso: durante este clima, los terremotos golpean de vez en cuando. Cada terremoto golpea:\nUn área aleatoria y causa:\n- Daños a los edificios y puede bloquear ciertas funciones durante un tiempo\n- Las construcciones se reinician (los materiales no se pierden)\n- Los explosivos detonan\n- Los objetos pueden derramarse de los edificios de almacenamiento. Si el edificio contiene explosivos, todo el contenido se pierde y el edificio queda destruido.\n- Los castores y los bots dentro del área afectada pueden resultar heridos o dañados.\nEn todo el mapa:\n- Toda el agua se expande un determinado porcentaje"
itIT = "Meteo pericoloso: durante questo meteo si verificano di tanto in tanto terremoti. Ogni terremoto colpisce:\nUn'area casuale e causa:\n- Danni agli edifici e può bloccare alcune funzioni per un certo periodo\n- Le costruzioni vengono reimpostate (i materiali non vanno persi)\n- Gli esplosivi detonano\n- Gli oggetti possono fuoriuscire dagli edifici di stoccaggio. Se l'edificio contiene esplosivi, l'intero contenuto va perso e l'edificio viene distrutto.\n- I castori e i robot all'interno dell'area colpita possono subire ferite/danni.\nSu tutta la mappa:\n- Tutta l'acqua si espande di una certa percentuale"
ukUA = "Небезпечна погода: під час цієї погоди час від часу відбуваються землетруси. Кожен землетрус вражає:\nВипадкову ділянку та спричиняє:\n- Пошкодження будівель, що може на деякий час блокувати певні функції\n- Незавершене будівництво скидається (матеріали не втрачаються)\n- Вибухівка детонує\n- Предмети можуть висипатися зі складів. Якщо в будівлі є вибухівка, весь її вміст втрачається, а сама будівля руйнується.\n- Бобри та роботи в зоні ураження можуть отримати поранення або пошкодження.\nПо всій карті:\n- Уся вода розширюється на певний відсоток"
csCZ = "Nebezpečné počasí: během tohoto počasí se času od času vyskytnou zemětřesení. Každé zemětřesení zasáhne:\nNáhodnou oblast a způsobí:\n- Poškození budov a může na chvíli blokovat určité funkce\n- Stavby se resetují (materiály nejsou ztraceny)\n- Výbuchy se aktivují\n- Předměty mohou vypadnout ze skladovacích budov. Pokud budova obsahuje výbušniny, veškerý obsah je ztracen a budova je zničena.\n- Bobři a roboty uvnitř postižené oblasti mohou být zraněni/poškozeni.\nPo celé mapě:\n- Voda se rozšíří o určité procento"
viVN = "Thời tiết nguy hiểm: trong thời tiết này, động đất xảy ra thỉnh thoảng. Mỗi trận động đất đánh vào:\nMột khu vực ngẫu nhiên và gây ra:\n- Gây hư hại cho các công trình và có thể làm gián đoạn một số chức năng trong một thời gian\n- Các công trình được đặt lại (nguyên vật liệu không bị mất)\n- Chất nổ phát nổ\n- Các vật phẩm có thể bị tràn từ các kho chứa. Nếu kho chứa có chất nổ, toàn bộ nội dung bị mất và tòa nhà bị phá hủy\n- Hải ly và rô-bốt ở khu vực bị ảnh hưởng có thể bị thương\nKhắp bản đồ:\n- Tất cả nước mở rộng theo một tỷ lệ nhất định"
caES = "Clima perillós: durant aquest clima, es produeixen terratrèmols de tant en tant. Cada terratrèmol afecta:\nUna zona aleatòria i provoca:\n- Danys als edificis i pot bloquejar certes funcions durant un temps\n- Les construccions es reinicien (els materials no es perden)\n- Els explosius detonen\n- Els articles poden vessar-se dels edificis d'emmagatzematge. Si l'edifici conté explosius, tot el contingut es perd i l'edifici és destruït.\n- Els castors i els robots que es troben dins de la zona afectada poden resultar ferits o danyats.\nEn tot el mapa:\n- Tota l'aigua s'expandeix un percentatge determinat"
roRO = "Vreme periculoasă: în timpul acestui vreme, cutremure lovesc din când în când. Fiecare cutremur lovește:\nO zonă aleatorie și cauzează:\n- Daune clădirilor și poate bloca temporar anumite funcții\n- Construcțiile sunt resetate (materialele nu se pierd)\n- Explozivii detonează\n- Bunurile pot cădea din clădirile de depozitare. Dacă clădirea conține explozivi, întregul conținut se pierde, iar clădirea este distrusă.\n- Castorii și roboții aflați în zona lovită pot fi răniți/avariați.\nPe toată harta:\n- Toată apa se extinde cu un anumit procentaj"
huHU = "Veszélyes időjárás: ezalatt az időjárás alatt időnként földrengések csapnak le. Minden földrengés:\nEgy véletlenszerű területet ér, és a következőket okozza:\n- Károkat okoz az épületekben, és egy ideig bizonyos funkciókat blokkolhat\n- Az építkezések visszaállnak (az anyagok nem vesznek el)\n- A robbanóanyagok felrobbannak\n- Az áruk kiszóródhatnak a tárolóépületekből. Ha az épület robbanóanyagot tartalmaz, a teljes tartalom elvész, és az épület megsemmisül.\n- A találati területen tartózkodó hódok és botok megsérülhetnek vagy károsodhatnak.\nAz egész térképen:\n- Az összes víz egy bizonyos százalékkal megnő"
arSA = "خطر طقس: خلال هذا الطقس، تضرب الزلازل بين حين وآخر. تضرب كل هزة:\nمنطقة عشوائية وتسبب:\n- ضررًا بالمباني وقد تعطّل وظائف معينة لفترة\n- إعادة ضبط الإنشاءات (لا تُفقد المواد)\n- انفجار المتفجرات\n- قد تتناثر العناصر من مباني التخزين. إذا احتوى المبنى على متفجرات، تُفقد المحتويات كلها ويُدمَّر المبنى.\n- قد يصاب القنادس والروبوتات الموجودون داخل منطقة الضربة أو يتضررون.\nفي جميع أنحاء الخريطة:\n- تتمدد كل المياه بنسبة معينة"

