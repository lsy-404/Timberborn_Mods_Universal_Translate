["LV.EQ.MinStrDesc"]
raw = "The minimum strength of the Earthquake. The amount of HP it can deal to buildings.\nAffected by Handicap."
status = "normal"
enUS = "The minimum strength of the Earthquake. The amount of HP it can deal to buildings.\nAffected by Handicap."
zhCN = "地震造成震动时，范围内建筑生命值受到地震伤害的最小值。<br>注意，此数值受天气初始强度值、适应周期数影响。"
zhTW = "地震的最小強度。它對建築物造成的傷害點數。受到障礙的影響。"
ruRU = "Минимальная сила землетрясения. Количество HP, которое оно может нанести зданиям. Зависит от недостатков."
jaJP = "地震の最小強度。建物に与えることができるHPの量。\n障害によって影響を受ける。"
frFR = "La force minimale du tremblement de terre. Le montant de PV qu'il peut infliger aux bâtiments. Affecté par le handicap."
deDE = "Der Mindeststärke des Erdbebens. Die Menge an HP, die es Gebäuden zufügen kann. Beeinflusst durch Handicap."
plPL = "Minimalna siła trzęsienia ziemi. Ilość punktów życia, które może zadać budynkom. Podlega handicapowi."
ptBR = "A força mínima do Terremoto. A quantidade de HP que pode causar aos edifícios. Afetado por Desvantagem."
koKR = "지진의 최소 강도. 건물에 줄 수 있는 HP의 양. 핸디캡의 영향을 받습니다."
trTR = "Depremin minimum gücü. Binalara verebileceği HP miktarı. Engel durumundan etkilenir."
esES = "La fuerza mínima del terremoto. La cantidad de PV que puede causar a los edificios.\nAfectado por Desafío."
itIT = "La forza minima del terremoto. La quantità di PS che può infliggere agli edifici.\nInfluenzato dalla difficoltà."
ukUA = "Мінімальна сила землетрусу. Кількість HP, яку він може завдати будівлям.\nЗалежить від складності гри."
thTH = "ความแรงขั้นต่ำของแผ่นดินไหว จำนวนพลังชีวิต (HP) ที่สามารถสร้างความเสียหายให้แก่อาคารได้\nได้รับผลกระทบจากระดับความยาก (Handicap)"
csCZ = "Minimální síla zemětřesení. Množství HP, které může způsobit budovám.\nOvlivněno handicapem."
viVN = "Độ mạnh tối thiểu của động đất. Lượng HP mà nó có thể gây sát thương cho các công trình.\nBị ảnh hưởng bởi Handicap."
caES = "La resistència mínima del terratrèmol. La quantitat de HP que pot infligir als edificis.\nAfectat per Handicap."
beBY = "Мінімальная сіла землетрасення. Колькасць HP, якую яно можа нанесці будынкам.\nЗалежыць ад складанасці гульні (Handicap)."
roRO = "Forța minimă a cutremurului. Cantitatea de HP pe care o poate provoca clădirilor.\nEste afectată de Handicap."
huHU = "A földrengés minimális erőssége. Az a HP-mennyiség, amelyet épületeknek okozni tud.\nA Nehezítés befolyásolja."
arSA = "الحد الأدنى لقوة الزلزال. كمية القوة (HP) التي يمكن أن يُلحقها بالمباني.\nيتأثر بالإعاقة."

