["ElevatorWorks.Entrance.Cedar.Description"]
status = "normal"
raw = "Connect a path in front; the shaft must be directly behind. Add at least two entrances on different floors. Requires ground or platform support."
enUS = "Connect a path in front; the shaft must be directly behind. Add at least two entrances on different floors. Requires ground or platform support."
