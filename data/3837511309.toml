["ElevatorWorks.PoweredHouse.BrushedMetal.Description"]
status = "normal"
raw = "Connect colony power here. Capacity 4; target 4x walking speed; maximum 24 levels of travel. Draws 50 power plus 10 per shaft section."
enUS = "Connect colony power here. Capacity 4; target 4x walking speed; maximum 24 levels of travel. Draws 50 power plus 10 per shaft section."
zhCN = "连接殖民地电力于此。容量4；目标步行速度为4倍；最大运行层数为24层。耗电50，每段轴再增加10。"
zhTW = "連接殖民地動能於此。容量 4；目標為 4 倍步行速度；最多可移動 24 層。耗用 50 動力，另每個軸段額外耗用 10 動力。"
ruRU = "Подключите здесь энергосистему колонии. Вместимость 4; целевая скорость 4x от скорости ходьбы; максимум 24 уровня подъёма. Потребляет 50 энергии плюс 10 на каждую секцию вала."
jaJP = "コロニーの動力をここに接続します。容量は4、目標移動速度は徒歩の4倍、最大移動距離は24階層です。動力50に加え、シャフト区間ごとに10の動力を消費します。"
frFR = "Connectez l'énergie du réseau de la colonie ici. Capacité : 4 ; vitesse de marche cible : 4x ; maximum de 24 niveaux de déplacement. Consomme 50 de puissance, plus 10 par section d'arbre."
deDE = "Hier das Stromnetz der Kolonie anschließen. Kapazität 4; Ziel: 4-fache Gehgeschwindigkeit; maximal 24 Ebenen Fahrstrecke. Verbraucht 50 Leistung plus 10 pro Wellenabschnitt."
plPL = "Połącz tutaj energię kolonii. Pojemność 4; docelowa prędkość 4x większa niż prędkość chodzenia; maksymalnie 24 poziomy podróży. Pobiera 50 energii plus 10 na każdy odcinek wału."
ptBR = "Conecte a energia da colônia aqui. Capacidade 4; velocidade de caminhada alvo 4x; máximo de 24 níveis de viagem. Consome 50 de energia mais 10 por seção de eixo."
koKR = "콜로니 동력을 여기에 연결하세요. 용량 4; 목표 이동 속도 4배; 최대 이동 범위 24층. 기본 소모 50 동력, 축 구간당 추가 10 동력 소모."
trTR = "Koloni gücünü buraya bağlayın. Kapasite 4; hedef yürüme hızı 4 kat; en fazla 24 kat seyahat. 50 güç ile çekilir, her mil bölümü için 10 ek güç."
esES = "Conecta aquí la energía de la colonia. Capacidad 4; velocidad de caminata objetivo 4x; máximo 24 niveles de recorrido. Consume 50 de energía más 10 por cada sección de eje."
itIT = "Collega qui l'energia della colonia. Capacità 4; velocità di movimento target 4x; massimo 24 livelli di percorrenza. Consuma 50 di energia più 10 per sezione di albero di trasmissione."
ukUA = "Підключіть тут енергію колонії. Місткість 4; цільова швидкість ходьби 4x; максимум 24 рівні подорожі. Споживає 50 енергії плюс 10 на кожну секцію валу."
thTH = "เชื่อมต่อพลังงานของอาณานิคมที่นี่ ความจุ 4; ความเร็วเดินเป้าหมาย 4 เท่า; ระยะเดินทางสูงสุด 24 ชั้น ใช้พลังงาน 50 บวก 10 ต่อหนึ่งส่วนของเพลา"
csCZ = "Připojte zde kolonii k energii. Kapacita 4; cílová rychlost 4násobek rychlosti chůze; maximálně 24 úrovní cesty. Spotřebuje 50 energie plus 10 na každý úsek hřídele."
viVN = "Kết nối năng lượng của thuộc địa tại đây. Sức chứa 4; tốc độ di chuyển mục tiêu gấp 4 lần tốc độ đi bộ; tối đa 24 tầng di chuyển. Tiêu thụ 50 năng lượng cộng thêm 10 cho mỗi đoạn trục."
caES = "Connecteu aquí l'energia de la colònia. Capacitat 4; velocitat de desplaçament objectiu 4 vegades la velocitat a peu; màxim 24 nivells de recorregut. Consumeix 50 d'energia més 10 per cada secció d'eix."
beBY = "Падключыце энергію калоніі тут. Ёмкасць 4; мэтавая хуткасць ходу 4x; максімум 24 узроўні перамяшчэння. Спажывае 50 энергіі плюс 10 на кожны ўчастак вала."
roRO = "Conectați aici energia coloniei. Capacitate 4; viteză de deplasare țintă 4x față de mersul pe jos; maximum 24 de niveluri de deplasare. Consumă 50 de energie plus 10 pentru fiecare secțiune de arbore."
huHU = "Csatlakoztassa ide a kolónia energiáját. Kapacitás: 4; cél: 4-szeres gyaloglási sebesség; maximum 24 szint utazás. 50 energiát fogyaszt, plusz 10 tengelyszakaszonként."
arSA = "اربط طاقة المستعمرة هنا. السعة 4؛ السرعة المستهدفة 4 أضعاف سرعة المشي؛ الحد الأقصى 24 مستوى من التنقل. يستهلك 50 من الطاقة بالإضافة إلى 10 لكل جزء من العمود."

