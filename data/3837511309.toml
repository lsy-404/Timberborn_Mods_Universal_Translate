["ElevatorWorks.ManualHouse.Boardwalk.Description"]
status = "normal"
raw = "One beaver or bot operator. Capacity 2; target 2x walking speed; maximum 6 levels of travel. Operator needs an external path to this top workplace."
enUS = "One beaver or bot operator. Capacity 2; target 2x walking speed; maximum 6 levels of travel. Operator needs an external path to this top workplace."
zhCN = "一名海狸或机器人操作员。容量2；目标为2倍步行速度；最多可上下6层。操作员需要一条通往这个最高工作站的外部通道。"
zhTW = "一名海狸或機器人操作員。容量 2；目標為 2 倍步行速度；最多可跨越 6 層移動。操作員需要通往此最高工作場所的外部路徑。"
ruRU = "Один бобр или оператор-робот. Вместимость 2; целевая скорость передвижения в 2 раза выше пешей; максимум 6 уровней перемещения. Оператору нужен внешний путь к этому верхнему рабочему месту."
jaJP = "ビーバーまたはボットのオペレーター1名。収容人数2、移動速度は通常の2倍を目標、最大6段階の移動。オペレーターはこの最上部の作業場所へ外部の通路で到達する必要がある。"
frFR = "Un castor ou un opérateur de robot. Capacité : 2 ; cible : 2 fois la vitesse de marche ; maximum 6 niveaux de déplacement. L'opérateur a besoin d'un chemin extérieur menant à ce lieu de travail supérieur."
deDE = "Ein Biber oder Bot-Bediener. Kapazität 2; Ziel: doppelte Gehgeschwindigkeit; maximal 6 Ebenen Fahrstrecke. Der Bediener benötigt einen externen Weg zu diesem obersten Arbeitsplatz."
plPL = "Jeden operator: bóbr lub bot. Pojemność 2; cel: 2x prędkość chodzenia; maksymalnie 6 poziomów podróży. Operator potrzebuje zewnętrznej ścieżki do tego najwyższego miejsca pracy."
ptBR = "Um operador, castor ou robô. Capacidade 2; velocidade de caminhada alvo 2x; máximo de 6 níveis de viagem. O operador precisa de um caminho externo até este local de trabalho no topo."
koKR = "한 명의 비버 또는 봇 조작자. 수용량 2명; 목표 이동 속도 2배; 최대 6단계 이동. 조작자가 이 최상단 작업장까지 가는 외부 경로가 필요합니다."
trTR = "Bir kunduz ya da bot operatörü. Kapasite 2; hedef yürüme hızının 2 katı; en fazla 6 kat seviye yolculuk. Operatör, bu en üst çalışma alanına dış bir yol gerektirir."
esES = "Un operador, castor o bot. Capacidad 2; velocidad objetivo 2 veces la velocidad al caminar; máximo 6 niveles de recorrido. El operador necesita un camino externo hasta este lugar de trabajo superior."
itIT = "Un castoro o un operatore di bot. Capacità 2; velocità di camminata target 2x; massimo 6 livelli di spostamento. L'operatore necessita di un percorso esterno per raggiungere questo posto di lavoro in cima."
ukUA = "Один бобер або оператор-бот. Місткість 2; цільова швидкість ходьби — 2x; максимум 6 рівнів переміщення. Оператору потрібен зовнішній шлях до цього верхнього робочого місця."
thTH = "ผู้ควบคุมได้หนึ่งตัวจากบีเวอร์หรือหุ่นยนต์ ความจุ 2; เป้าหมายความเร็วเดินเป็น 2 เท่า; ระดับการเดินทางสูงสุด 6 ระดับ ผู้ควบคุมต้องมีเส้นทางภายนอกไปยังสถานที่ทำงานชั้นบนสุดนี้"
csCZ = "Jeden bobr nebo obsluha robota. Kapacita 2; cílová rychlost 2x rychlost chůze; maximálně 6 úrovní přepravy. Obsluha potřebuje vnější cestu k tomuto nejvyššímu pracovišti."
viVN = "Một thợ vận hành hoặc robot. Sức chứa 2; tốc độ đi bộ mục tiêu gấp 2 lần; tối đa 6 tầng di chuyển. Người vận hành cần có đường dẫn bên ngoài tới nơi làm việc trên cùng này."
caES = "Un operador, castor o bot. Capacitat 2; velocitat de desplaçament objectiu 2 vegades la velocitat a peu; màxim 6 nivells de desplaçament. L'operador necessita un camí extern fins a aquest lloc de treball superior."
beBY = "Адзін бабёр або аператар робата. Ёмкасць 2; мэтавая хуткасць пешшу ў 2 разы большая; максімум 6 узроўняў перасоўвання. Аператару патрэбны знешні шлях да гэтага верхняга працоўнага месца."
roRO = "Un castor sau un operator de robot. Capacitate 2; viteza de deplasare țintă de 2 ori mai mare decât viteza de mers; maximum 6 niveluri de deplasare. Operatorul are nevoie de un traseu extern până la acest loc de muncă de la etaj."
huHU = "Egy béka vagy bot kezelő. Kapacitás: 2; cél: a gyaloglási sebesség 2-szerese; legfeljebb 6 szintnyi utazás. A kezelőnek külső útvonalra van szüksége ehhez a legfelső munkahelyhez."
arSA = "لمشغّل واحد من البيفر أو الروبوت. السعة 2؛ الهدف ضعف سرعة المشي؛ الحد الأقصى 6 مستويات من التنقل. يحتاج المشغّل إلى مسار خارجي يصل إلى مكان العمل العلوي هذا."

