zhTW = "連接前方的路徑；軸必須位於正後方。至少需要在不同樓層加入兩個入口。需要有地面或平台支撐。"
ruRU = "Подключите путь спереди; вал должен находиться строго позади. Добавьте как минимум два входа на разных этажах. Требуется опора на землю или платформу."
jaJP = "前方に通路を接続してください。シャフトは必ず真後ろに配置する必要があります。異なる階に少なくとも2つの出入口を追加してください。地面またはプラットフォームの上に設置が必要です。"
frFR = "Reliez un chemin devant ; l'arbre doit se trouver directement derrière. Ajoutez au moins deux entrées sur des étages différents. Nécessite un appui sur le sol ou sur une plateforme."
deDE = "Verbinde vorne einen Pfad; die Welle muss direkt dahinter liegen. Füge mindestens zwei Eingänge auf unterschiedlichen Ebenen hinzu. Benötigt Boden- oder Plattformunterstützung."
plPL = "Podłącz ścieżkę z przodu; wał musi znajdować się bezpośrednio z tyłu. Dodaj co najmniej dwa wejścia na różnych piętrach. Wymaga podparcia z ziemi lub platformy."
ptBR = "Conecte um caminho à frente; o eixo deve estar diretamente atrás. Adicione pelo menos duas entradas em andares diferentes. Requer suporte do solo ou de uma plataforma."
koKR = "앞쪽에 경로를 연결하고, 샤프트는 바로 뒤에 있어야 합니다. 서로 다른 층에 최소 두 개의 출입구를 추가하세요. 지면 또는 플랫폼 지지대가 필요합니다."
trTR = "Önünde bir yol bağlayın; şaft tam arkasında olmalıdır. Farklı katlarda en az iki giriş ekleyin. Zemin veya platform desteği gereklidir."
esES = "Conecta un camino delante; el eje debe estar directamente detrás. Añade al menos dos entradas en pisos distintos. Requiere soporte de suelo o de plataforma."
itIT = "Collega un percorso davanti; l'albero di trasmissione deve trovarsi direttamente dietro. Aggiungi almeno due ingressi su piani diversi. Richiede il supporto del terreno o di una piattaforma."
ukUA = "Під'єднайте шлях спереду; вал має бути безпосередньо позаду. Додайте щонайменше два входи на різних поверхах. Потрібна опора у вигляді землі або платформи."
thTH = "เชื่อมต่อเส้นทางไว้ด้านหน้า โดยเพลาต้องอยู่ด้านหลังโดยตรง เพิ่มทางเข้าอย่างน้อยสองแห่งบนชั้นที่ต่างกัน ต้องมีพื้นดินหรือแท่นรองรับ"
csCZ = "Připojte cestu vpředu; hřídel musí být přímo vzadu. Přidejte alespoň dva vstupy na různých patrech. Vyžaduje podporu terénu nebo plošiny."
viVN = "Kết nối một lối đi ở phía trước; trục phải nằm ngay phía sau. Thêm ít nhất hai lối vào ở các tầng khác nhau. Yêu cầu có nền đất hoặc bệ đỡ."
caES = "Connecteu un camí davant; l'eix ha d'estar directament darrere. Afegiu almenys dues entrades en plantes diferents. Requereix suport de terreny o de plataforma."
beBY = "Падключыце шлях спераду; вал павінен быць строга ззаду. Дадайце не менш за два ўваходы на розных паверхах. Патрабуецца апора на зямлю або платформу."
roRO = "Conectați un drum în față; axul trebuie să fie direct în spate. Adăugați cel puțin două intrări pe etaje diferite. Necesită sprijin de la sol sau de la o platformă."
huHU = "Csatlakoztass egy utat elöl; a tengelynek közvetlenül mögötte kell lennie. Adj hozzá legalább két bejáratot különböző szinteken. Talajt vagy platformot igényel alátámasztásként."
arSA = "ربط مسار في الأمام؛ يجب أن يكون العمود مباشرة خلفه. أضف مدخلين على الأقل في طوابق مختلفة. يتطلب دعمًا من الأرض أو من منصة."

