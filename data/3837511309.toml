["ElevatorWorks.Shaft.Boardwalk.Description"]
status = "normal"
raw = "Stack above a door shaft or another shaft. Alternate plain and door sections at chosen floors, then cap with a pulley house."
enUS = "Stack above a door shaft or another shaft. Alternate plain and door sections at chosen floors, then cap with a pulley house."
zhCN = "在门轴或其他轴之上堆叠。在选定的楼层交替放置普通轴段与门轴段，最后用滑轮房封顶。"
zhTW = "在門軸或其他軸的上方疊放。於指定樓層交替放置普通段與門段，最後以滑輪屋收頂。"
ruRU = "Установите над дверной шахтой или другой шахтой. Чередуйте обычные и дверные секции на выбранных этажах, затем завершите шкивным домиком."
jaJP = "ドアシャフトまたは別のシャフトの上に積み重ねます。選んだ階に通常のセクションとドアのセクションを交互に配置し、最後にプーリーハウスで覆います。"
frFR = "Empilez au-dessus d'un arbre d'ascenseur à porte ou d'un autre arbre. Alternez les sections pleines et les sections à porte aux étages choisis, puis terminez par une maison de poulie."
deDE = "Über einem Türschacht oder einem anderen Schacht stapeln. Auf gewählten Etagen abwechselnd einfache und Tür-Abschnitte setzen und anschließend mit einem Flaschenzughaus abschließen."
plPL = "Układaj go nad szybem drzwiowym lub innym szybem. Na wybranych piętrach naprzemiennie wstawiaj zwykłe i drzwiowe sekcje, a na końcu zamknij konstrukcją z kołowrotem."
ptBR = "Empilhe acima de um eixo de porta ou de outro eixo. Alterne seções simples e de porta nos andares escolhidos e, em seguida, finalize com uma casa de polia."
koKR = "문 샤프트 또는 다른 샤프트 위에 쌓으세요. 원하는 층에서 일반 구간과 문 구간을 번갈아 배치한 다음, 도르래 하우스로 마무리하세요."
trTR = "Kapı mili veya başka bir mil üzerine yığın. Seçilen katlarda düz ve kapılı bölümleri dönüşümlü yerleştirin, ardından en üstü bir makara evi ile kapatın."
esES = "Apílalo encima de un eje de puerta u otro eje. Alterne secciones normales y de puerta en los pisos elegidos, y luego remate con una casa de polea."
itIT = "Sovrapponi sopra un albero di porta o un altro albero. Alterna sezioni normali e sezioni porta ai piani scelti, poi chiudi con una casa della puleggia."
ukUA = "Складайте над дверною шахтою або іншою шахтою. Чергуйте звичайні та дверні секції на потрібних поверхах, а потім завершуйте блоком шківа."
thTH = "วางซ้อนขึ้นไปเหนือเพลาประตูหรือเพลาอื่น สลับส่วนธรรมดากับส่วนประตูที่ชั้นที่เลือก แล้วปิดด้านบนด้วยบ้านรอก"
csCZ = "Naskládejte nad dveřní šachtu nebo jinou šachtu. Ve zvolených patrech střídejte obyčejné a dveřní úseky a na závěr přikryjte domkem s kladkou."
viVN = "Xếp chồng phía trên một trục cửa hoặc trục khác. Xen kẽ các đoạn trục thường và đoạn trục cửa ở các tầng đã chọn, sau đó đóng đầu bằng một nhà ròng rọc."
caES = "Apila sobre un eix de porta o un altre eix. Alterna seccions simples i de porta a les plantes escollides, i després tanca amb una casa de politja."
beBY = "Складайце над дзверным валам або іншым валам. Чаргуйце звычайныя і дзверныя секцыі на выбраных паверхах, затым завяршыце блокам-шківам."
roRO = "Suprapuneți deasupra unui arbore cu ușă sau al unui alt arbore. Alternați secțiunile simple și cele cu uși la etajele alese, apoi încheiați cu o casă cu scripete."
huHU = "Egy ajtós tengely vagy másik tengely fölé építsd. Váltogasd a sima és az ajtós szakaszokat a kiválasztott szinteken, majd zárd le egy csigaházzal."
arSA = "ضع فوق عمود باب أو عمود آخر. بدّل بين أقسام عادية وأقسام باب عند الطوابق التي تختارها، ثم أنهِ البناء ببيت البكرة."

