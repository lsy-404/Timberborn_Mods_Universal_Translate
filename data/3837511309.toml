ruRU = "Ступенчатый вал с встроенными раздвижными воротами. Подключите путь с передней стороны. Чередуйте секции с дверями и обычные секции вала, затем завершите шкивным домиком. Требуется минимум два этажа с дверями."
jaJP = "スライド式ゲートが一体化した積み重ね可能なシャフトです。前面に通路を接続してください。扉付きのシャフト区画と通常のシャフト区画を交互に配置し、最上部をプーリーハウスで締めくくります。扉の階は少なくとも2つ必要です。"
frFR = "Gaine à porte coulissante intégrée et empilable. Reliez un chemin à l'avant. Alternez les sections de porte et les sections de gaine simples, puis terminez par une maison de poulie. Nécessite au moins deux étages de porte."
deDE = "Schachtelbare Welle mit integriertem Schiebetor. Verbinde vorne einen Pfad. Wechsle Tür- und einfache Schachtabschnitte ab und schließe mit einem Rollenhaus ab. Benötigt mindestens zwei Türebenen."
plPL = "Przesuwalny szyb piętrowy ze zintegrowaną bramą. Podłącz ścieżkę z przodu. Na przemian ustawiaj sekcje z drzwiami i zwykłe sekcje szybu, a na końcu zamknij konstrukcją z kołowrotem. Wymaga co najmniej dwóch pięter z drzwiami."
ptBR = "Eixo empilhável com portão deslizante integrado. Conecte um caminho na frente. Alterne seções de porta e de eixo simples, depois feche com uma casa de polia. Requer pelo menos dois andares de porta."
koKR = "스택 가능한 샤프트이며 통합 슬라이딩 게이트가 있습니다. 앞쪽에 길을 연결하세요. 문 구간과 일반 샤프트 구간을 번갈아 배치한 뒤 도르래 하우스로 마무리하세요. 문 층이 최소 두 개 필요합니다."
trTR = "Entegre kayar kapılı, üst üste yerleştirilebilen şaft. Ön tarafa bir yol bağlayın. Kapılı ve düz şaft bölümlerini sırayla dizin, ardından bir makara evi ile kapatın. En az iki kapı katı gereklidir."
esES = "Eje apilable con una compuerta corrediza integrada. Conecta un camino por la parte delantera. Alterna secciones de puerta y de eje simple, y remata con una casa de polea. Requiere al menos dos pisos de puerta."
itIT = "Albero impilabile con cancello scorrevole integrato. Collega un percorso sul lato anteriore. Alterna sezioni con porta e sezioni semplici di albero, quindi chiudi con una casa della puleggia. Richiede almeno due piani con porta."
ukUA = "Стекувальна шахта з вбудованими розсувними воротами. Під'єднайте шлях спереду. Чергуйте секції з дверима та звичайні секції шахти, а зверху завершіть будинком шківа. Потрібно щонайменше два поверхи з дверима."
thTH = "Shaft ที่ซ้อนกันได้พร้อมประตูบานเลื่อนในตัว เชื่อมทางเดินที่ด้านหน้า สลับส่วนประตูกับส่วนเพลาธรรมดา แล้วปิดท้ายด้วยบ้านรอก ต้องมีชั้นประตูอย่างน้อยสองชั้น"
csCZ = "Skládatelná šachta s integrovanou posuvnou bránou. Vpředu připojte cestu. Střídejte sekce s dveřmi a prostými sekcemi šachty a nahoře ukončete domkem s kladkou. Vyžaduje alespoň dvě patra s dveřmi."
viVN = "Trục có cửa trượt tích hợp, có thể xếp chồng. Kết nối một lối đi ở phía trước. Xen kẽ các đoạn trục có cửa và trục trơn, sau đó đậy trên cùng bằng nhà ròng rọc. Yêu cầu có ít nhất hai tầng cửa."
caES = "Eix apilable amb una porta lliscant integrada. Connecteu un camí a la part frontal. Alterneu seccions de porta i d'eix simple, i després tanqueu amb una casa de politja. Cal almenys dos pisos amb porta."
beBY = "Укладны шахтны ствол з убудаванай слізгальнай брамай. Падключыце шлях спераду. Чаргуйце секцыі з дзвярыма і звычайныя секцыі шахты, затым завершыце дом блока. Патрабуецца не менш за два паверхі з дзвярыма."
roRO = "Ax cu încorporată, cu poartă glisantă, care poate fi stivuită. Conectați un drum în față. Alternați secțiuni de ușă și de ax simplu, apoi încheiați cu o casă de scripete. Necesită cel puțin două etaje cu uși."
huHU = "Egybeépített csúszókapus tengely, egymásra rakható. Az elején csatlakoztasd az ösvényt. Váltakozva helyezz el ajtós és sima tengelyszakaszokat, majd zárd le csigaházzal. Legalább két ajtós szint szükséges."
arSA = "ممر رأسي متراص مع بوابة انزلاقية مدمجة. وصّل مسارًا من الأمام. بدّل بين أقسام الأبواب والأعمدة العادية، ثم أنهِ البناء ببيت البكرة. يتطلب طابقي أبواب على الأقل."

