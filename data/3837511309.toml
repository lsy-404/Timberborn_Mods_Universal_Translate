["ElevatorWorks.DoorShaft.BrushedMetal.Description"]
status = "normal"
raw = "Stackable shaft with an integrated sliding gate. Connect a path at the front. Alternate door and plain shaft sections, then cap with a pulley house. Requires at least two door floors."
enUS = "Stackable shaft with an integrated sliding gate. Connect a path at the front. Alternate door and plain shaft sections, then cap with a pulley house. Requires at least two door floors."
zhCN = "可堆叠的轴井，内置滑动闸门。前端连接一条路径。交替放置闸门段与普通轴井段，顶部以滑轮屋封顶。至少需要两层闸门。"
zhTW = "可堆疊的軸井，內建滑動閘門。在前方連接一條路徑。交替設置閘門區段與普通軸井區段，最後以滑輪屋封頂。至少需要兩層閘門區段。"
ruRU = "Наборный вал с встроенными раздвижными воротами. Подключите путь с передней стороны. Чередуйте секции с дверями и обычные секции вала, затем завершите блоком с шкивом. Требуется минимум два этажа с дверями."
jaJP = "積み重ね可能なシャフトで、スライド式のゲートが組み込まれている。正面に通路を接続すること。ドア付きの区画と通常のシャフト区画を交互に配置し、最上部をプーリーハウスでふさぐこと。ドアの階は最低2つ必要。"
frFR = "Gaine stackable avec une porte coulissante intégrée. Reliez un chemin à l'avant. Alternez les sections de porte et les sections de gaine simple, puis fermez le haut avec une maison de poulie. Nécessite au moins deux étages de porte."
deDE = "Stapelbarer Schacht mit integriertem Schiebetor. Verbinde einen Pfad an der Vorderseite. Wechsle Tür- und einfache Schachtabschnitte ab und schließe mit einem Flaschenzughaus ab. Benötigt mindestens zwei Türebenen."
plPL = "Przesuwalny szyb z wbudowaną przesuwaną bramą. Podłącz ścieżkę od przodu. Naprzemiennie układaj sekcje z drzwiami i zwykłe sekcje szybu, a na szczycie umieść dom z kołem pasowym. Wymaga co najmniej dwóch pięter z drzwiami."
ptBR = "Eixo empilhável com portão deslizante integrado. Conecte um caminho na frente. Alterne seções de porta e eixo simples, depois feche com uma casa de polia. Requer pelo menos dois andares de porta."
koKR = "통합된 슬라이딩 게이트가 있는 적층형 샤프트입니다. 앞쪽에 경로를 연결하세요. 문 구간과 일반 샤프트 구간을 번갈아 배치한 뒤, 도르래 하우스로 마무리하세요. 최소 두 개 층 이상의 문 구간이 필요합니다."
trTR = "Entegre kayar kapılı, üst üste yerleştirilebilir mil. Ön tarafa bir yol bağlayın. Kapılı ve düz mil bölümlerini sırayla dizin, ardından bir makara evi ile kapatın. En az iki kapı katı gerekir."
esES = "Eje apilable con una compuerta corredera integrada. Conecte un camino en la parte frontal. Alterne secciones de puerta y de eje simple, y remate con una casa de polea. Requiere al menos dos pisos de puerta."
itIT = "Pozzo impilabile con una saracinesca scorrevole integrata. Collega un percorso sul lato anteriore. Alterna sezioni con porta e sezioni di pozzo semplici, quindi chiudi con una casa della puleggia. Richiede almeno due piani con porta."
ukUA = "Складний вал із вбудованими розсувними воротами. Під'єднайте шлях з передньої сторони. Чергуйте секції з дверима та звичайні секції валу, а завершіть будинком шківа. Потрібно щонайменше два поверхи з дверима."
thTH = "เพลาซ้อนได้ที่มีประตูบานเลื่อนในตัว เชื่อมทางเดินที่ด้านหน้า สลับระหว่างส่วนประตูและส่วนเพลาธรรมดา จากนั้นปิดด้านบนด้วยบ้านรอก ต้องมีชั้นประตูอย่างน้อยสองชั้น"
csCZ = "Skládatelná šachta s integrovanou posuvnou bránou. Na přední straně připojte cestu. Střídejte sekce s dveřmi a prosté sekce šachty, poté ukončete kladkovým domkem. Vyžaduje alespoň dvě patra s dveřmi."
viVN = "Trục có cổng trượt tích hợp, có thể xếp chồng. Kết nối một lối đi ở phía trước. Xen kẽ các đoạn trục có cửa và trục thường, sau đó đặt nhà ròng rọc ở trên cùng. Yêu cầu có ít nhất hai tầng cửa."
caES = "Eix apilable amb una porta lliscant integrada. Connecteu un camí a la part frontal. Alterneu seccions de porta i d'eix simple, i després tanqueu-ho amb una casa de politja. Cal almenys dos pisos de porta."
beBY = "Засоўны шып з убудаванай слізгальнай брамай. Падключыце шлях спераду. Чаргуйце секцыі з дзвярыма і звычайнага шыпа, затым завяршыце дом блока. Патрабуецца не менш за два паверхі з дзвярыма."
roRO = "Ax cu poartă glisantă integrată, care se poate stivui. Conectați un drum în față. Alternați secțiuni cu ușă și secțiuni simple de ax, apoi încheiați cu o casă de scripete. Necesită cel puțin două etaje cu ușă."
huHU = "Egybeépített tolóajtóval ellátott, egymásra építhető akna. Az elejénél csatlakoztasson egy utat. Váltogassa az ajtós és a sima aknaszakaszokat, majd zárja le egy csigaházzal. Legalább két ajtós emelet szükséges."
arSA = "ممر مصعد عمودي قابل للتكديس مع بوابة منزلقة مدمجة. صل مسارًا من الأمام. تناوب بين أقسام الباب والممر العادي، ثم أغلق الأعلى ببيت البكرة. يتطلب طابقي باب على الأقل."

