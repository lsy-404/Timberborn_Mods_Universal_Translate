["ElevatorWorks.PoweredHouse.IvoryTimber.Description"]
status = "normal"
raw = "Connect colony power here. Capacity 4; target 4x walking speed; maximum 24 levels of travel. Draws 50 power plus 10 per shaft section."
enUS = "Connect colony power here. Capacity 4; target 4x walking speed; maximum 24 levels of travel. Draws 50 power plus 10 per shaft section."
zhCN = "在此连接殖民地能源。容量 4；目标步行速度为 4 倍；最大运行楼层为 24 层。每个轴段额外耗电 10，基础耗电 50。"
zhTW = "在此連接殖民地動能。容量 4；目標步行速度 4 倍；最多可行駛 24 層。耗用 50 動力，另每節軸段額外耗用 10 動力。"
ruRU = "Подключите энергосистему колонии здесь. Вместимость 4; целевая скорость ходьбы 4x; максимум 24 уровня перемещения. Потребляет 50 энергии плюс 10 на каждую секцию вала."
jaJP = "ここで植民地の電力網に接続します。容量4、目標移動速度は歩行速度の4倍、最大移動距離は24階層です。動力として50に加え、シャフト区画ごとに10の電力を消費します。"
frFR = "Connectez l'énergie du réseau de la colonie ici. Capacité 4 ; vitesse de marche cible 4x ; maximum 24 niveaux de déplacement. Consomme 50 de puissance, plus 10 par section d'arbre de transmission."
deDE = "Hier das Stromnetz der Kolonie anschließen. Kapazität 4; Ziel: 4-fache Gehgeschwindigkeit; maximal 24 Ebenen Fahrweg. Verbraucht 50 Energie plus 10 pro Wellenabschnitt."
plPL = "Podłącz tutaj energię kolonii. Pojemność 4; docelowa prędkość 4x większa od prędkości chodzenia; maksymalnie 24 poziomy podróży. Pobiera 50 energii plus 10 na sekcję wału."
ptBR = "Conecte a energia da colônia aqui. Capacidade 4; velocidade de caminhada alvo 4x; máximo de 24 níveis de deslocamento. Consome 50 de energia mais 10 por seção de eixo."
koKR = "콜로니 동력을 여기에 연결하세요. 수용량 4, 목표 걷기 속도 4배, 최대 이동 24층. 기본 50 동력에 샤프트 구간당 10 동력이 추가로 소모됩니다."
trTR = "Koloninin gücünü buraya bağlayın. Kapasite 4; hedef yürüme hızı 4 kat; en fazla 24 kat seyahat. 50 güç çeker, ayrıca her şaft bölümü için 10 güç."
esES = "Conecta aquí la energía de la colonia. Capacidad 4; velocidad de caminata objetivo 4x; máximo 24 niveles de recorrido. Consume 50 de energía más 10 por cada sección de eje."
itIT = "Collega qui l'energia della colonia. Capacità 4; velocità di movimento a piedi 4x; massimo 24 livelli di viaggio. Assorbe 50 di energia più 10 per ogni sezione dell'albero di trasmissione."
ukUA = "Підключіть тут енергію колонії. Місткість 4; цільова швидкість ходьби 4x; максимум 24 рівні подорожі. Споживає 50 енергії плюс 10 на секцію валу."
thTH = "เชื่อมต่อพลังงานของอาณานิคมที่นี่ ความจุ 4; ความเร็วเดินเป้าหมาย 4 เท่า; การเดินทางสูงสุด 24 ระดับ ใช้พลังงาน 50 บวก 10 ต่อส่วนเพลา"
csCZ = "Připojte zde kolonii k energii. Kapacita 4; cílová rychlost 4násobek rychlosti chůze; maximálně 24 úrovní přepravy. Spotřebuje 50 energie plus 10 na každý úsek hřídele."
viVN = "Kết nối nguồn điện của thuộc địa tại đây. Sức chứa 4; tốc độ di chuyển bộ mục tiêu gấp 4 lần; tối đa 24 tầng di chuyển. Tiêu thụ 50 điện cộng thêm 10 cho mỗi đoạn trục."
caES = "Connecta aquí l'energia de la colònia. Capacitat 4; velocitat de desplaçament objectiu 4x; màxim 24 nivells de recorregut. Consumeix 50 d'energia més 10 per cada secció d'eix."
beBY = "Падключыце сілкаванне калоніі тут. Ёмістасць 4; мэтавая хуткасць пешшу ў 4 разы большая; максімум 24 узроўні праезду. Спажывае 50 адзінак сілкавання плюс 10 на кожную секцыю вала."
roRO = "Conectați aici energia coloniei. Capacitate 4; viteză de mers ţintă 4x; maximum 24 de niveluri de călătorie. Consumă 50 de energie plus 10 pe secțiune de arbore."
huHU = "Csatlakoztasd ide a kolónia energiáját. Kapacitás: 4; cél: 4-szeres gyaloglási sebesség; maximum 24 szint utazás. 50 energiát fogyaszt, plusz 10-et tengelyszakaszonként."
arSA = "تربط هذه النقطة طاقة المستعمرة هنا. السعة 4؛ السرعة المستهدفة للمشي 4 أضعاف؛ الحد الأقصى 24 مستوى من الانتقال. يستهلك 50 وحدة طاقة بالإضافة إلى 10 لكل قسم من العمود."

