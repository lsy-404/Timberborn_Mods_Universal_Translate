thTH = "ปล่องแบบซ้อนได้พร้อมประตูเลื่อนในตัว เชื่อมทางเดินที่ด้านหน้า สลับส่วนประตูกับส่วนปล่องธรรมดา แล้วปิดด้านบนด้วยบ้านรอก ต้องมีชั้นประตูอย่างน้อยสองชั้น"
