["ElevatorWorks.DoorShaft.IvoryTimber.Description"]
status = "normal"
raw = "Stackable shaft with an integrated sliding gate. Connect a path at the front. Alternate door and plain shaft sections, then cap with a pulley house. Requires at least two door floors."
enUS = "Stackable shaft with an integrated sliding gate. Connect a path at the front. Alternate door and plain shaft sections, then cap with a pulley house. Requires at least two door floors."
zhCN = "可堆叠的竖井，内置滑动闸门。在前方连接一条路径。交替放置闸门段和普通竖井段，最后以滑轮房封顶。至少需要两层闸门。"
zhTW = "可堆疊的軸井，內建滑動閘門。在正面連接一條路徑。交替設置閘門區段與普通軸井區段，最後以滑輪屋收頂。至少需要兩層閘門。"
ruRU = "Ш��хтный ствол с встроенной раздвижной дверью. Подключите путь с передней стороны. Чередуйте секции с дверью и обычные секции ствола, затем завершите надстройкой с блочным шкивом. Требуется не менее двух дверных этажей."
jaJP = "スライド式のゲートを内蔵した積み重ね可能なシャフトです。前面に通路を接続してください。ドアの階と通常のシャフトの区間を交互に配置し、最上部はプーリーハウスで締めくくります。ドアの階は少なくとも2つ必要です。"
frFR = "Gaine empilable avec une porte coulissante intégrée. Reliez un chemin à l'avant. Alternez les sections de porte et les sections de gaine simples, puis terminez par une maison de poulie. Nécessite au moins deux étages de porte."
deDE = "Stapelbarer Schacht mit integriertem Schiebetor. Verbinde vorne einen Pfad. Wechsle Tür- und einfache Schachtabschnitte ab und schließe oben mit einem Rollenhaus ab. Benötigt mindestens zwei Türebenen."
plPL = "Szyb ze zintegrowaną przesuwaną bramą, który można układać piętrowo. Podłącz ścieżkę z przodu. Naprzemiennie ustawiaj sekcje z drzwiami i zwykłe sekcje szybu, a na końcu zamknij je domem z kołowrotem. Wymaga co najmniej dwóch pięter z drzwiami."
ptBR = "Eixo empilhável com portão deslizante integrado. Conecte um caminho na frente. Alterne seções de porta e de eixo simples, depois finalize com uma casa de polia. Requer pelo menos dois andares de porta."
koKR = "스태킹 가능한 샤프트로, 통합된 미닫이 문이 있습니다. 앞쪽에 경로를 연결하세요. 문 구간과 일반 샤프트 구간을 번갈아 쌓은 뒤, 도르래 하우스로 마무리하세요. 문 층이 최소 두 개 필요합니다."
trTR = "Entegre kayar kapılı, üst üste yerleştirilebilen şaft. Ön tarafa bir yol bağlayın. Kapılı ve düz şaft bölümlerini sırayla dizin, ardından bir makara evi ile kapatın. En az iki kapı katı gereklidir."
esES = "Eje apilable con una compuerta corredera integrada. Conecta un camino en la parte frontal. Alterna secciones de puerta y de eje simple, y remata con una casa de polea. Requiere al menos dos pisos de puerta."
itIT = "Albero stackabile con cancello scorrevole integrato. Collega un percorso sulla parte anteriore. Alterna sezioni con porta e sezioni di albero semplice, quindi chiudi con una casa della carrucola. Richiede almeno due piani con porta."
ukUA = "Пристроюваний вал з вбудованою розсувною заслінкою. Підключіть шлях спереду. Чергуйте секції з дверима та звичайні секції валу, а зверху завершіть будинком блока. Потрібно щонайменше два поверхи з дверима."
thTH = "เพลาซ้อนกันได้ที่มีประตูบานเลื่อนในตัว เชื่อมทางเดินที่ด้านหน้า สลับส่วนที่เป็นประตูกับส่วนเพลาธรรมดา แล้วปิดท้ายด้วยบ้านรอก ต้องมีชั้นประตูอย่างน้อยสองชั้น"
csCZ = "Skládatelná šachta s integrovanou posuvnou bránou. Vepředu připojte cestu. Střídejte sekce s dveřmi a prosté sekce šachty a nahoru zakončete domkem kladky. Vyžaduje alespoň dvě patra s dveřmi."
viVN = "Trục có cổng trượt tích hợp, có thể xếp chồng. Kết nối một đường đi ở phía trước. Xen kẽ các đoạn trục có cửa và các đoạn trục thường, sau đó đặt nhà ròng rọc ở trên cùng. Yêu cầu có ít nhất hai tầng cửa."
caES = "Eix apilable amb una porta corredissa integrada. Connecteu un camí a la part frontal. Alterneu seccions de porta i d'eix simple, i després tanqueu-ho amb una casa de politja. Cal un mínim de dues plantes de porta."
beBY = "Ствол са інтэграваным слізгальным шлюзам. Падключыце шлях спераду. Чаргуйце секцыі з дзвярыма і звычайныя секцыі ствала, затым завершыце дахам з блокам шківа. Патрабуецца не менш за два паверхі з дзвярыма."
roRO = "Ax de tip coloană cu poartă glisantă integrată. Conectați un drum în față. Alternați secțiuni cu ușă și secțiuni simple de coloană, apoi încheiați cu o casă de scripete. Necesită cel puțin două etaje cu ușă."
huHU = "Egybeépített csúszókapus, rakható akna. Az elejénél csatlakoztasson egy utat. Váltogassa az ajtós és a sima aknaszakaszokat, majd zárja le egy csigaházzal. Legalább két ajtós szint szükséges."
arSA = "هذا عمود مصعد قابل للتكديس مع بوابة منزلقة مدمجة. صِل مسارًا من الأمام. بدّل بين أقسام الباب وأقسام العمود العادية، ثم أنهِ البناء بمنزل بكرة. يتطلب طابقي باب على الأقل."

