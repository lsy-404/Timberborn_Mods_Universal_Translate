deDE = "Für eine Erfindung der Eisenzähne ist sie erstaunlich <i>aufmunternd</i>."
plPL = "Jak na wynalazek Żelazozębnych, jest zaskakująco <i>podnoszący na duchu</i>."
ptBR = "Para uma invenção dos Dentes de Ferro, é surpreendentemente <i>edificante</i>."
koKR = "강철 이빨 발명품치고는 놀라울 정도로 <i>기분을 북돋워 주네요</i>."
