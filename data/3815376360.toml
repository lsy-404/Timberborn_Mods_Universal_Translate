["LV.CBlt.ModUpdate114000"]
raw = "v11.4.0:\n- Added 4 vertical belt pieces for each speed that can transfer goods in and out of buildings.\n- Remodeled Lift in and Lift out."
status = "normal"
enUS = "v11.4.0:\n- Added 4 vertical belt pieces for each speed that can transfer goods into and out of buildings.\n- Remodeled Lift In and Lift Out."
zhCN = "v11.4.0：\n- 新增了每种速度的 4 种垂直传送带部件，可用于向建筑内输送货物和从建筑内运出货物。\n- 重制了输入提升机和输出提升机。"
zhTW = "v11.4.0：\n- 每種速度新增 4 種垂直輸送帶零件，可將貨物送入或送出建築。\n- 重新設計了輸送帶升降入口和輸送帶升降出口。"
ruRU = "v11.4.0:\n- Добавлено 4 вертикальных участка ленты для каждой скорости, которые могут перемещать товары в здания и из них.\n- Переделаны «Подъём внутрь» и «Подъём наружу»."
jaJP = "v11.4.0：\n- 各速度に、建物への搬入・建物からの搬出ができる垂直ベルトパーツを4種類追加。\n- 搬入用リフトと搬出用リフトを改修。"
frFR = "v11.4.0 :\n- Ajout de 4 éléments de convoyeur verticaux pour chaque vitesse, capables de transférer des marchandises vers les bâtiments et depuis ceux-ci.\n- Remaniement de la montée et de la descente."
deDE = "v11.4.0:\n- 4 vertikale Förderbandteile für jede Geschwindigkeit hinzugefügt, die Güter in Gebäude hinein und aus ihnen heraus transportieren können.\n- Hebeeinlass und Hebeauslass überarbeitet."
plPL = "v11.4.0:\n- Dodano 4 pionowe elementy taśmociągu o każdej prędkości, które mogą transportować towary do budynków i z nich.\n- Przebudowano taśmociągi Lift in i Lift out."
ptBR = "v11.4.0:\n- Adicionadas 4 peças verticais de esteira para cada velocidade, capazes de transportar mercadorias para dentro e para fora dos edifícios.\n- Remodeladas as peças de elevação para dentro e para fora."
koKR = "v11.4.0:\n- 각 속도별로 건물 안팎으로 물자를 운송할 수 있는 수직 벨트 부품 4개를 추가했습니다.\n- 투입 리프트와 배출 리프트를 리모델링했습니다."
csCZ = "v11.4.0:\n- Přidány 4 svislé části dopravníku pro každou rychlost, které mohou přepravovat zboží do budov i z nich.\n- Přepracovány výtah dovnitř a výtah ven."
viVN = "v11.4.0:\n- Đã thêm 4 đoạn băng chuyền thẳng đứng cho mỗi tốc độ, có thể vận chuyển hàng hóa vào và ra khỏi các tòa nhà.\n- Đã làm lại Băng chuyền nâng vào và Băng chuyền nâng ra."
trTR = "v11.4.0:\n- Her hız için, binalara mal taşıyabilen 4 dikey taşıyıcı bant parçası eklendi.\n- Giriş Asansörü ve Çıkış Asansörü yeniden düzenlendi."

