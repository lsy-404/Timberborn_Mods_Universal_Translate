frFR = "Déplacer les surfaces des tapis roulants.\nDésactivez cette option si un grand réseau de tapis roulants consomme trop de temps de calcul par image."
deDE = "Bewegt die Förderbandoberflächen.\nSchalte diese Option aus, wenn ein großes Förderbandnetz zu viel Bildrate kostet."
plPL = "Przesuwaj powierzchnie taśmociągów.\nWyłącz tę opcję, jeśli duża sieć taśmociągów zbytnio obciąża wydajność gry."
ptBR = "Move as superfícies das esteiras.\nDesative esta opção se uma rede grande de esteiras consumir muito tempo de processamento por quadro."
koKR = "벨트 표면을 움직입니다.\n대규모 벨트 네트워크가 프레임 시간을 너무 많이 소모한다면 이 기능을 끄세요."
csCZ = "Pohyb povrchů pásů.\nVypněte tuto možnost, pokud rozsáhlá síť pásů příliš zatěžuje výkon hry."
viVN = "Di chuyển các băng chuyền.\nTắt tùy chọn này nếu mạng lưới băng chuyền lớn làm giảm tốc độ khung hình quá nhiều."
