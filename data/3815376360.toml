["LV.CBlt.CornerFlavor"]
new = "Every good plan meets a wall. This is how you keep the plan."
status = "normal"
enUS = "Every good plan meets a wall. This is how you keep the plan."
zhCN = "再好的计划也会碰壁。这就是你坚守计划的方式。"
zhTW = "再好的計畫也會碰壁。這就是你堅持計畫的方法。"
ruRU = "Любой хороший план рано или поздно упирается в стену. Так его и придерживаются."
jaJP = "どんな優れた計画も壁にぶつかる。これが計画を守る方法だ。"
frFR = "Tout bon plan se heurte à un mur. C’est ainsi qu’on le préserve."
deDE = "Jeder gute Plan stößt auf eine Wand. So hält man am Plan fest."
ptBR = "Todo bom plano encontra um obstáculo. É assim que você mantém o plano."
koKR = "아무리 좋은 계획도 벽에 부딪히기 마련. 계획을 지키는 방법은 바로 이것."
csCZ = "Každý dobrý plán narazí na zeď. Takto si plán udržíte."
viVN = "Kế hoạch hay nào rồi cũng gặp phải bức tường. Đây là cách để giữ vững kế hoạch ấy."
trTR = "Her iyi plan bir duvara çarpar. Planı böyle korursun."

