["LV.CBlt.ImpermeableFlavor"]
status = "normal"
raw = "The boxes come off a bit sticky. Everyone agrees this is fine."
enUS = "The boxes come off a bit sticky. Everyone agrees this is fine."
zhCN = "这些箱子拆下来时有点黏。大家都觉得这没问题。"
zhTW = "箱子拆下來時會有點黏。大家都覺得這樣沒問題。"
ruRU = "Коробки сходят немного липкими. Все согласны, что это нормально."
jaJP = "箱が少しベタついた状態で出てくる。これで問題ないと、みんなが認めている。"
frFR = "Les caisses sortent un peu collantes. Tout le monde s’accorde à dire que ce n’est pas grave."
deDE = "Die Kisten sind beim Auspacken etwas klebrig. Alle sind sich einig, dass das in Ordnung ist."
plPL = "Skrzynie schodzą trochę lepkie. Wszyscy zgodnie uznają, że to w porządku."
ptBR = "As caixas saem meio pegajosas. Todo mundo concorda que não tem problema."
koKR = "상자들이 조금 끈적한 채로 나옵니다. 다들 괜찮다고 합니다."
csCZ = "Krabice jsou trochu lepkavé. Všichni se shodují, že je to v pořádku."
viVN = "Những chiếc hộp hơi dính khi lấy ra. Mọi người đều đồng ý rằng như vậy cũng ổn."
trTR = "Kutular biraz yapış yapış çıkıyor. Herkes bunun sorun olmadığı konusunda hemfikir."

