["LV.CBlt.AnimationDesc"]
raw = "Move belt surfaces.\nTurn this off if a large belt network costs too much frame time."
status = "normal"
enUS = "Move belt surfaces.\nTurn this off if a large belt network costs too much frame time."
zhCN = "移动传送带表面。\n如果大型传送带网络占用过多帧时间，请关闭此选项。"
zhTW = "移動輸送帶表面。\n如果大型輸送帶網路太耗效能，請關閉此選項。"
ruRU = "Перемещает ленты.\nОтключите эту функцию, если большая сеть лент слишком сильно снижает частоту кадров."
jaJP = "ベルトの表面を動かします。\n大規模なベルト網によってフレームレートが低下する場合は、これをオフにしてください。"
frFR = "Déplacer les surfaces des tapis roulants.\nDésactivez cette option si un grand réseau de tapis roulants consomme trop de temps de calcul par image."
deDE = "Bewegt die Förderbandoberflächen.\nSchalte diese Option aus, wenn ein großes Förderbandnetz zu viel Bildrate kostet."
plPL = "Przesuwaj powierzchnie taśmociągów.\nWyłącz tę opcję, jeśli duża sieć taśmociągów zbytnio obciąża wydajność gry."
ptBR = "Move as superfícies das esteiras.\nDesative esta opção se uma rede grande de esteiras consumir muito tempo de processamento por quadro."
koKR = "벨트 표면을 움직입니다.\n대규모 벨트 네트워크가 프레임 시간을 너무 많이 소모한다면 이 기능을 끄세요."
trTR = "Bant yüzeylerini hareket ettirir.\nBüyük bir bant ağı kare hızını fazla düşürüyorsa bunu kapatın."
esES = "Mueve las superficies de las cintas.\nDesactiva esto si una red grande de cintas consume demasiado tiempo de fotograma."
itIT = "Muove le superfici dei nastri.\nDisattiva questa opzione se una grande rete di nastri costa troppo tempo di frame."
ukUA = "Рухає поверхні стрічок.\nВимкніть це, якщо велика мережа стрічок займає надто багато часу кадру."
thTH = "ขยับพื้นผิวของสายพาน\nปิดตัวเลือกนี้หากเครือข่ายสายพานขนาดใหญ่ใช้เวลาเฟรมมากเกินไป"
csCZ = "Pohyb povrchů pásů.\nVypněte tuto možnost, pokud rozsáhlá síť pásů příliš zatěžuje výkon hry."
viVN = "Di chuyển các băng chuyền.\nTắt tùy chọn này nếu mạng lưới băng chuyền lớn làm giảm tốc độ khung hình quá nhiều."
caES = "Mou les superfícies de les cintes.\nDesactiva-ho si una xarxa gran de cintes costa massa temps de fotograma."
beBY = "Рухаць паверхні стужак.\nВыключыце гэта, калі вялікая сетка стужак занадта шмат выдаткоўвае часу кадра."
roRO = "Mută suprafețele benzilor.\nDezactivează această opțiune dacă o rețea mare de benzi consumă prea mult timp de cadru."
huHU = "Szállítószalag-felületek mozgatása.\nKapcsold ki, ha a nagy szalaghálózat túl sok képkockaidőt emészt fel."
arSA = "حرّك أسطح الأحزمة.\nأوقف هذا الخيار إذا كانت شبكة الأحزمة الكبيرة تستهلك وقتاً زائداً من الإطار."

