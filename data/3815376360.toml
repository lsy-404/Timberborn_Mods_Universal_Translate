["LV.CBlt.CornerFlavor"]
raw = "Every good plan meets a wall. This is how you keep the plan."
status = "normal"
enUS = "Every good plan meets a wall. This is how you keep the plan."
zhCN = "再好的计划也会碰壁。这就是你坚持计划的方式。"
zhTW = "再好的計畫都會碰壁。這就是讓計畫得以延續的方法。"
ruRU = "Любой хороший план упирается в стену. Так его и придерживаются."
jaJP = "どんな良い計画も壁にぶつかる。計画を守るには、こうするのだ。"
frFR = "Tout bon plan finit par se heurter à un mur. C’est ainsi qu’on s’en tient au plan."
deDE = "Jeder gute Plan stößt auf eine Wand. So hältst du am Plan fest."
plPL = "Każdy dobry plan napotyka mur. Tak właśnie się go trzyma."
ptBR = "Todo bom plano encontra uma parede. É assim que você mantém o plano."
koKR = "아무리 좋은 계획도 벽에 부딪히기 마련이다. 이렇게 하면 계획을 지킬 수 있다."
csCZ = "Každý dobrý plán narazí na zeď. Takhle si ho udržíte."
viVN = "Kế hoạch hay nào rồi cũng gặp phải một bức tường. Đây là cách bạn giữ vững kế hoạch ấy."
trTR = "Her iyi plan bir duvara çarpar. Planı böyle korursun."

