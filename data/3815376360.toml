raw = "A vertical belt that carries goods upward. Place it on a building, a lift, or another riser."
status = "normal"
enUS = "A vertical belt that carries goods upward. Place it on a building, a lift, or another riser."
zhCN = "一种向上运输货物的垂直传送带。将其放置在建筑、升降机或其他升运器上。"
zhTW = "一種垂直輸送帶，可將貨物向上運送。將它放置在建築物、升降機或其他上升輸送帶上。"
ruRU = "Вертикальная лента, которая перемещает товары вверх. Установите её на здание, подъёмник или другой вертикальный конвейер."
jaJP = "物資を上方へ運ぶ垂直ベルト。建物、リフト、または別のライザーの上に設置します。"
frFR = "Un convoyeur vertical qui transporte des marchandises vers le haut. Placez-le sur un bâtiment, un élévateur ou un autre convoyeur vertical."
deDE = "Ein vertikales Förderband, das Waren nach oben transportiert. Platziere es auf einem Gebäude, einem Aufzug oder einem anderen Steigförderer."
plPL = "Pionowy przenośnik taśmowy, który transportuje towary w górę. Umieść go na budynku, podnośniku lub innym elemencie podnoszącym."
ptBR = "Uma esteira vertical que transporta mercadorias para cima. Coloque-a sobre um edifício, um elevador ou outro elevador de carga."
koKR = "물자를 위로 운반하는 수직 벨트입니다. 건물, 리프트 또는 다른 상승 장치 위에 배치하세요."
csCZ = "Svislý pás, který přepravuje zboží vzhůru. Umístěte ho na budovu, výtah nebo jiný zvedací pás."
viVN = "Băng chuyền thẳng đứng vận chuyển hàng hóa lên trên. Đặt băng chuyền lên một công trình, thang nâng hoặc bộ nâng khác."
