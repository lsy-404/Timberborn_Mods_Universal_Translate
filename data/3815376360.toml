["LV.CBlt.BeltFlavor"]
status = "normal"
raw = "Folktail engineers say it was inspired by watching logs roll downhill."
enUS = "Folktails engineers say it was inspired by watching logs roll downhill."
zhCN = "神尾工程师说，这个设计的灵感来自观察原木滚下山坡。"
zhTW = "神尾工程師說，這是他們觀察木頭滾下山坡後得到的靈感。"
ruRU = "Инженеры Хвостов мира говорят, что на эту идею их натолкнуло наблюдение за тем, как брёвна катятся под уклон."
jaJP = "フォークテイルの技術者たちは、丸太が坂を転がり落ちるのを見て着想を得たと言っている。"
frFR = "Les ingénieurs Rustiqueues affirment que cette idée leur est venue en regardant des rondins dévaler la pente."
deDE = "Die Ingenieure der Rustikalruten sagen, die Idee sei ihnen gekommen, als sie Baumstämme bergab rollen sahen."
plPL = "Inżynierowie Folkogonów twierdzą, że inspiracją było obserwowanie kłód staczających się ze zbocza."
ptBR = "Os engenheiros Caudas-do-mato dizem que se inspiraram ao ver troncos rolando ladeira abaixo."
koKR = "나무꼬리 기술자들은 통나무가 언덕 아래로 굴러가는 모습을 보고 영감을 얻었다고 합니다."
csCZ = "Folktailští inženýři říkají, že je inspirovalo pozorování klád kutálejících se z kopce."
viVN = "Các kỹ sư Folktails nói rằng ý tưởng này bắt nguồn từ việc quan sát những khúc gỗ lăn xuống dốc."
trTR = "Köykuyruk mühendisleri, buna ilham veren şeyin kütüklerin yokuş aşağı yuvarlanışını izlemek olduğunu söylüyor."

