["LV.CBlt.BeltFlavor"]
raw = "Folktail engineers say it was inspired by watching logs roll downhill."
status = "normal"
enUS = "Folktail engineers say it was inspired by watching logs roll downhill."
zhCN = "神尾工程师说，这个设计的灵感来自观察原木滚下山坡。"
zhTW = "神尾工程師說，這是受到觀察木頭滾下坡的啟發。"
ruRU = "Инженеры Хвостов мира говорят, что идею подсмотрели, наблюдая, как брёвна катятся вниз по склону."
jaJP = "フォークテイルの技術者たちは、丸太が坂を転がり落ちるのを見て着想を得たと言っている。"
frFR = "Les ingénieurs Rustiqueues disent que l’idée leur est venue en regardant des rondins dévaler la pente."
deDE = "Rustikalruten-Ingenieure sagen, die Idee sei ihnen beim Beobachten von Baumstämmen gekommen, die bergab rollten."
plPL = "Inżynierowie Folkogonów twierdzą, że inspiracją do jego stworzenia było obserwowanie kłód staczających się ze wzgórza."
ptBR = "Os engenheiros Caudas-do-mato dizem que a inspiração veio de observar troncos rolando morro abaixo."
koKR = "나무꼬리 기술자들은 통나무가 언덕 아래로 굴러가는 모습을 보고 영감을 얻었다고 합니다."
csCZ = "Inženýři Folktails říkají, že je inspirovalo pozorování klád kutálejících se z kopce."
viVN = "Các kỹ sư Folktails nói rằng họ lấy cảm hứng từ việc quan sát những khúc gỗ lăn xuống dốc."
trTR = "Köykuyruk mühendisler, bu fikrin kütüklerin yokuş aşağı yuvarlanmasını izlemekten geldiğini söylüyor."

