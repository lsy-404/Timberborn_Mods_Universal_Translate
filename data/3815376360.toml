["LV.CBlt.AnimationDesc"]
status = "normal"
raw = "Move belt surfaces.\nTurn this off if a large belt network costs too much frame time."
enUS = "Move belt surfaces.\nTurn this off if a large belt network costs too much frame time."
zhCN = "移动传送带表面。\n如果大型传送带网络占用过多帧时间，请关闭此选项。"
zhTW = "移動輸送帶表面。\n如果大型輸送帶網絡太耗費影格時間，請關閉此選項。"
ruRU = "Перемещает поверхности конвейерных лент.\nОтключите эту функцию, если большая сеть конвейерных лент слишком сильно снижает частоту кадров."
jaJP = "ベルトの表面を動かします。\n大規模なベルト網によってフレーム処理に時間がかかりすぎる場合は、これをオフにしてください。"
frFR = "Déplace les surfaces des convoyeurs.\nDésactivez cette option si un grand réseau de convoyeurs consomme trop de temps de calcul par image."
deDE = "Beltoberflächen bewegen.\nSchalte dies aus, wenn ein großes Förderbandnetz zu viel Bildrate kostet."
plPL = "Animuj powierzchnie taśmociągów.\nWyłącz tę opcję, jeśli duża sieć taśmociągów zbytnio obciąża procesor."
ptBR = "Move as superfícies das esteiras.\nDesative isto se uma grande rede de esteiras consumir muito tempo de processamento por quadro."
koKR = "벨트 표면을 움직입니다.\n벨트 네트워크가 커서 프레임 처리 시간이 너무 많이 든다면 이 기능을 끄세요."
csCZ = "Pohyb povrchů pásů.\nVypněte tuto možnost, pokud rozsáhlá síť pásů příliš zatěžuje snímkovou frekvenci."
viVN = "Di chuyển bề mặt băng chuyền.\nTắt tùy chọn này nếu mạng lưới băng chuyền lớn tiêu tốn quá nhiều thời gian khung hình."
trTR = "Bant yüzeylerini hareket ettirir.\nBüyük bir bant ağı kare hızını fazla düşürüyorsa bunu kapatın."

