["LV.CBlt.RiserDownFlavor"]
raw = "'Shouldn't this thing produce power instead of consuming it?'"
status = "normal"
enUS = "'Shouldn't this thing produce power instead of consuming it?'"
zhCN = "“这东西不是应该产生动力，而不是消耗动力吗？”"
zhTW = "「這玩意兒不是應該產生動力，而不是消耗動力嗎？」"
ruRU = "«Разве эта штука не должна вырабатывать энергию, а не потреблять её?»"
jaJP = "「これは電力を消費するんじゃなくて、発電するものじゃないの？」"
frFR = "« Cet engin ne devrait-il pas produire de l’énergie au lieu d’en consommer ? »"
deDE = "„Sollte dieses Ding nicht Strom erzeugen, statt ihn zu verbrauchen?“"
plPL = "„Czy to coś nie powinno wytwarzać energii, zamiast ją zużywać?”"
ptBR = "“Esta coisa não deveria produzir energia em vez de consumi-la?”"
