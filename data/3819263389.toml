["LV.WTB.WindmillBatteryDesc"]
status = "normal"
raw = "Generates power proportional to wind speed and direction. Also stores power surplus and gives it back when its network is underpowered"
enUS = "Generates power proportional to wind speed and direction. Also stores excess power and supplies it when its network is underpowered."
zhCN = "根据风速和风向按比例发电。还能储存多余的动力，并在能量网动力不足时释放出来。"
zhTW = "依照風速和風向產生相應的動力。也會儲存多餘的動力，並在其動能網動力不足時釋出。"
ruRU = "Вырабатывает энергию в зависимости от скорости и направления ветра. Также накапливает излишки энергии и отдаёт их, когда в системе не хватает мощности."
jaJP = "風速と風向に応じて電力を生成します。また、余剰電力を蓄え、電力網の供給が不足したときに放出します。"
frFR = "Génère de l’énergie proportionnellement à la vitesse et à la direction du vent. Stocke également le surplus d’énergie et le restitue lorsque son réseau manque de puissance."
deDE = "Erzeugt Leistung proportional zu Windgeschwindigkeit und -richtung. Speichert außerdem überschüssige Leistung und gibt sie zurück, wenn das Stromnetz unterversorgt ist."
plPL = "Wytwarza moc proporcjonalną do prędkości i kierunku wiatru. Magazynuje też nadwyżkę mocy i oddaje ją, gdy w sieci brakuje mocy."
ptBR = "Gera energia proporcional à velocidade e à direção do vento. Também armazena o excedente de energia e o devolve quando sua rede está com pouca energia."
koKR = "풍속과 풍향에 비례해 동력을 생산합니다. 동력이 남으면 저장하고, 동력망에 동력이 부족할 때 저장한 동력을 공급합니다."
csCZ = "Vyrábí energii úměrně rychlosti a směru větru. Také ukládá přebytečnou energii a vrací ji, když síť nemá dostatek energie."
viVN = "Tạo ra năng lượng tỷ lệ thuận với tốc độ và hướng gió. Đồng thời tích trữ năng lượng dư thừa và cung cấp lại khi mạng lưới thiếu năng lượng."
trTR = "Rüzgâr hızına ve yönüne bağlı olarak güç üretir. Ayrıca fazla gücü depolar ve şebekesinin gücü yetersiz kaldığında geri verir."

