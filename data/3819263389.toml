["LV.WTB.WindmillBatteryDesc"]
new = "Generates power proportional to wind speed and direction. Also stores power surplus and gives it back when its network is underpowered"
status = "normal"
enUS = "Generates power proportional to wind speed and direction. Also stores surplus power and returns it when its network is underpowered."
zhCN = "根据风速和风向按比例发电。还可储存多余的动力，并在其能量网动力不足时释放出来。"
ruRU = "Вырабатывает мощность в зависимости от скорости и направления ветра. Также накапливает излишки энергии и отдаёт их, когда мощности в системе энергоснабжения не хватает."
jaJP = "風速と風向に応じて電力を生み出します。また、余剰電力を蓄え、電力網の電力が不足したときに供給します。"
frFR = "Génère de l’énergie proportionnelle à la vitesse et à la direction du vent. Stocke également le surplus d’énergie et le restitue lorsque son réseau manque de puissance."
deDE = "Erzeugt Strom proportional zu Windgeschwindigkeit und -richtung. Speichert außerdem überschüssigen Strom und gibt ihn zurück, wenn in seinem Stromnetz zu wenig Strom verfügbar ist."
plPL = "Generuje moc proporcjonalnie do prędkości i kierunku wiatru. Magazynuje też nadwyżkę mocy i oddaje ją, gdy w sieci brakuje mocy."
ptBR = "Gera energia proporcional à velocidade e à direção do vento. Também armazena o excedente de energia e o devolve quando sua rede está com pouca energia."
koKR = "풍속과 풍향에 비례해 동력을 생산합니다. 또한 남는 동력을 저장했다가 연결된 동력망의 동력이 부족할 때 돌려줍니다."
csCZ = "Vyrábí energii úměrně rychlosti a směru větru. Také ukládá přebytečnou energii a vrací ji, když má její síť nedostatek energie."
viVN = "Tạo ra năng lượng tỷ lệ thuận với tốc độ và hướng gió. Đồng thời lưu trữ năng lượng dư thừa và cung cấp lại khi mạng lưới thiếu năng lượng."
trTR = "Rüzgârın hızına ve yönüne orantılı güç üretir. Ayrıca fazla gücü depolar ve şebekesi yetersiz güç aldığında bu gücü geri verir."

