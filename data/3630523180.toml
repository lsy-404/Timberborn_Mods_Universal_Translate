zhTW = "遊戲預設的危險壞潮天氣。所有水源都會產生壞水。"
ruRU = "Стандартная опасная погода с плохим приливом в игре. Все источники воды производят плохую воду."
jaJP = "ゲームのデフォルトの危険な悪潮の天候。すべての水源が悪水を生成します。"
frFR = "Le phénomène de marée nocive par défaut du jeu. Toutes les sources d'eau produisent de l'eau contaminée."
deDE = "Der Standard gefährliche schlechte Flutwetter des Spiels. Alle Wasserquellen produzieren schlechtes Wasser."
plPL = "Domyślna niebezpieczna pogoda związana z złym przypływem w grze. Wszystkie źródła wody produkują złą wodę."
ptBR = "A condição climática de maré ruim perigosa padrão do jogo. Todas as fontes de água produzem água poluída."
koKR = "게임의 기본 유해한 나쁜 조수 날씨. 모든 수원에서 나쁜 물이 생성됩니다."
trTR = "Oyunun varsayılan tehlikeli kötü gelgit hava durumu. Tüm su kaynakları kötü su üretir."
esES = "El clima peligroso predeterminado del juego: la marea de aguas tóxicas. Todas las fuentes de agua producen aguas tóxicas."
itIT = "Il maltempo pericoloso predefinito del gioco: la marea cattiva. Tutte le sorgenti d'acqua producono acqua cattiva."
ukUA = "Стандартна небезпечна погода «поганий приплив» у грі. Усі джерела води виробляють поганьку воду."
thTH = "สภาพอากาศอันตรายแบบน้ำเสียเริ่มต้นของเกม แหล่งน้ำทั้งหมดจะผลิตน้ำเสีย"
csCZ = "Výchozí nebezpečné počasí špatného přílivu ve hře. Všechny zdroje vody produkují špatnou vodu."
viVN = "Thời tiết thủy triều xấu, nguy hiểm, mặc định của trò chơi. Tất cả nguồn nước đều sản sinh nước ô nhiễm."
caES = "El clima perillós de marea negra predeterminat del joc. Totes les fonts d'aigua produeixen aigua tòxica."
beBY = "Стандартнае небяспечнае надвор'е «кепская плыня» ў гульні. Усе крыніцы вады выпрацоўваюць кепскую ваду."
roRO = "Vremea implicită periculoasă a jocului, valul de ape rele. Toate sursele de apă produc apă rea."
huHU = "A játék alapértelmezett veszélyes rossz árapály időjárása. Minden vízforrás rossz vizet termel."
arSA = "الطقس الخطر الافتراضي للعبة المتمثل في المد السام. تنتج جميع مصادر المياه المياه السامة."

["LV.MW.RainDesc"]
raw = "Benign weather. Effects:\n- All tiles are watered and no land contamination occurs.\n- Applies Wet Fur when Beavers are not in the buildings.\n- 25% shorter than the usual temperate season (default settings)"
status = "abandoned"
enUS = "Benign weather. Effects:\n- All tiles are watered and no land contamination occurs.\n- Applies Wet Fur when Beavers are not in the buildings.\n- 25% shorter than the usual temperate season (default settings)"
zhCN = "模组扩展的舒适类天气，清澈的雨水带来希望，也带来欢乐。<br>- 所有土地都被灌溉，而且不会受到恶水污染。<br>- 海狸在室外时会增加“湿润的毛发”康乐值。<br>- 持续时间比温和天气短25%（模组默认，可更改）。"
zhTW = "友善的天氣。效果：\n- 所有區域都被澆水，且不會發生土地污染。\n- 在河狸不在建築物內時，會施加濕毛效果。\n- 比通常的溫帶季節短25%（默認設置）。"
ruRU = "Ключ: LV.MW.RainDesc - Новый текст для перевода: \"Благоприятная погода. Эффекты:\n- Все клетки насыщены водой, и загрязнение земли не происходит.\n- Применяется Влажная Шерсть, когда Бобры не находятся в зданиях.\n- На 25% короче, чем обычный умеренный сезон (по умолчанию)\""
jaJP = "優しい天候。効果：\n- すべてのタイルが水やりされ、土地の汚染は発生しません。\n- ビーバーが建物にいない場合、湿った毛皮が適用されます。\n- 通常の温帯季節より25％短い（デフォルト設定）。"
frFR = "Météo bénigne. Effets :\n- Tous les carreaux sont arrosés et aucune contamination des terres ne se produit.\n- Applique Fourrure Humide lorsque les Castors ne sont pas dans les bâtiments.\n- 25 % plus court que la saison tempérée habituelle (paramètres par défaut)"
deDE = "Günstiges Wetter. Effekte:\n- Alle Felder sind bewässert und es gibt keine Bodenverunreinigung.\n- Verleiht nasses Fell, wenn Biber sich nicht in den Gebäuden aufhalten.\n- 25% kürzer als die übliche gemäßigte Saison (Standardeinstellungen)"
plPL = "Łagodna pogoda. Efekty:\n- Wszystkie płytki są nawodnione, a zanieczyszczenie gleby nie występuje.\n- Nakłada mokre futro, gdy bobry nie są w budynkach.\n- O 25% krótsza niż zwykła pora umiarkowana (domyślne ustawienia)"
ptBR = "Nome da chave: LV.MW.RainDesc - Novo texto para traduzir: \"Clima benigno. Efeitos:\n- Todos os tiles estão regados e não há contaminação do solo.\n- Aplica Pelo Molhado quando os Castores não estão nos edifícios.\n- 25% mais curto que a estação temperada usual (configurações padrão)\""
koKR = "온화한 날씨. 효과:\n- 모든 타일이 물을 받고 토양 오염이 발생하지 않습니다.\n- 비버가 건물에 없을 때 젖은 털이 적용됩니다.\n- 일반 온대 계절보다 25% 짧습니다 (기본 설정)"
trTR = "Zarif hava. Etkileri:\n- Tüm karolar sulanır ve arazi kontaminasyonu gerçekleşmez.\n- Süreklerden çıkmadıklarında Kunduzlarda Islak Kürk uygulanır.\n- Alışılagelmiş ılıman sezondan %25 daha kısadır (varsayılan ayarlar)."
esES = "Clima benigno. Efectos:\n- Todas las casillas reciben agua y no se produce contaminación del terreno.\n- Aplica Pelaje Húmedo cuando los castores no están en los edificios.\n- 25 % más corta que la temporada templada habitual (configuración predeterminada)"
itIT = "Clima mite. Effetti:\n- Tutti i blocchi di terreno sono irrigati e non si verifica alcuna contaminazione del suolo.\n- Applica Pelliccia Bagnata quando i Castori non si trovano negli edifici.\n- 25% più breve della consueta stagione temperata (impostazioni predefinite)"
ukUA = "Сприятлива погода. Ефекти:\n- Усі плитки зрошуються, і забруднення ґрунту не відбувається.\n- Застосовує «Мокру шерсть», коли бобри не перебувають у будівлях.\n- На 25% коротше, ніж звичайний помірний сезон (стандартні налаштування)"
thTH = "สภาพอากาศอ่อนโยน ผลกระทบ:\n- กระเบื้องทั้งหมดได้รับน้ำและไม่มีการปนเปื้อนดินเกิดขึ้น\n- ใช้ Wet Fur เมื่อบีเวอร์ไม่อยู่ในอาคาร\n- ฤดูกาลสั้นกว่าฤดูกาลอบอุ่นปกติ 25% (การตั้งค่าเริ่มต้น)"
csCZ = "Pokojné počasí. Účinky:\n- Všechny dlaždice jsou zavlažovány a nedochází k žádné kontaminaci půdy.\n- Aplikuje Mokré chlupy, když bobři nejsou v budovách.\n- O 25 % kratší než obvyklé mírné období (výchozí nastavení)"
viVN = "Thời tiết ôn hòa. Hiệu ứng:\n- Tất cả các ô đất được tưới nước và không xảy ra ô nhiễm đất.\n- Áp dụng Lông ướt khi hà mã không ở trong các công trình.\n- Ngắn hơn 25% so với mùa ôn đới thông thường (cài đặt mặc định)"
caES = "Clima benigne. Efectes:\n- Totes les rajoles es reguen i no es produeix cap contaminació del terreny.\n- Aplica Pelatge humit quan els castors no són als edificis.\n- 25% més curta que l'estació temperada habitual (configuració per defecte)"
beBY = "Спрыяльнае надвор'е. Эфекты:\n- Усе клеткі палітыя вадой, і забруджвання зямлі не адбываецца.\n- Дзейнічае «Мокрая поўсць», калі бабры не знаходзяцца ў будынках.\n- На 25% карацейшы за звычайны ўмераны сезон (стандартныя налады)"
roRO = "Vreme blândă. Efecte:\n- Toate dalele sunt udate și nu apare contaminare a terenului.\n- Aplică Blană udă când castorii nu se află în clădiri.\n- Cu 25% mai scurt decât sezonul temperat obișnuit (setări implicite)"
huHU = "Jóindulatú időjárás. Hatások:\n- Minden csempe be van öntözve, és nem alakul ki földszennyeződés.\n- Nedves szőrt alkalmaz, ha a bódorok nincsenek az épületekben.\n- 25%-kal rövidebb, mint a szokásos mérsékelt évszak (alapértelmezett beállítások)"
arSA = "طقس معتدل. التأثيرات:\n- تُروى جميع البلاطات ولا يحدث أي تلوث للأرض.\n- يُطبّق \"فرو مبلل\" عندما لا تكون القنادس داخل المباني.\n- أقصر بنسبة 25% من الموسم المعتدل المعتاد (الإعدادات الافتراضية)"

["LV.MW.MonsoonDesc"]
raw = "Hazardous weather. All water sources increase their output, at 350% maximum with handicap applied. Configurable via the Monsoon modifier."
status = "abandoned"
enUS = "Hazardous weather. All water sources increase their output, at 350% maximum with handicap applied. Configurable via the Monsoon modifier."
zhCN = "模组扩展的恶劣类天气，洪水自河流上游奔涌而来，四处泛滥。<br>- 所有水源的水力都会增加至350%（模组默认，可更改），但不超过游戏限制。"
zhTW = "危險天氣。所有水源的產出增加，最高可達350%，並應用障礙。可通過季風修飾符進行配置。"
ruRU = "Опасная погода. Все источники воды увеличивают свою продуктивность до 350% с учетом наложенного штрафа. Настраивается через модификатор Муссона."
jaJP = "危険な天候。すべての水源は出力を増加させ、最大350%まで制限が適用されます。モンスーン修飾子を介して設定可能です。"
frFR = "Météo dangereuse. Toutes les sources d'eau augmentent leur production, jusqu'à un maximum de 350 % avec handicap appliqué. Configurable via le modificateur de mousson."
deDE = "Gefährliches Wetter. Alle Wasserquellen erhöhen ihre Ausgabe, maximal 350% mit angewendetem Handicap. Konfigurierbar über den Monsun-Modifikator."
plPL = "Niekorzystna pogoda. Wszystkie źródła wody zwiększają swoją wydajność do 350% maksymalnie, z zastosowaniem handicapu. Możliwość konfiguracji za pomocą modyfikatora Monsoon."
ptBR = "Clima perigoso. Todas as fontes de água aumentam sua produção, com um máximo de 350% com o handicap aplicado. Configurável através do modificador Monsoon."
koKR = "위험한 날씨. 모든 물 공급원이 최대 350%로 출력이 증가하며, 패널티가 적용됩니다. 몬순 수정자를 통해 구성할 수 있습니다."
trTR = "Tehlikeli hava durumu. Tüm su kaynakları, engel uygulandığında maksimum %350 ile üretimlerini artırır. Muson modifikörü aracılığıyla yapılandırılabilir."
esES = "Clima peligroso. Todas las fuentes de agua aumentan su caudal, hasta un 350 % como máximo con la penalización aplicada. Configurable mediante el modificador Monzón."
itIT = "Condizioni meteorologiche pericolose. Tutte le fonti d'acqua aumentano la loro portata, fino al 350% del massimo con l'handicap applicato. Configurabile tramite il modificatore Monsone."
ukUA = "Небезпечна погода. Усі джерела води збільшують свій видобуток до 350% від максимуму з урахуванням обмеження. Налаштовується через модифікатор «Мусон»."
thTH = "สภาพอากาศอันตราย แหล่งน้ำทั้งหมดจะเพิ่มผลผลิต สูงสุดถึง 350% เมื่อมีการใช้ค่าความยากลำบาก สามารถปรับแต่งได้ผ่านตัวปรับแต่ง Monsoon"
csCZ = "Nebezpečné počasí. Všechny vodní zdroje zvýší svůj výkon, maximálně na 350 % s uplatněným handicapem. Konfigurovatelné pomocí modifikátoru Monzun."
viVN = "Thời tiết nguy hiểm. Tất cả nguồn nước tăng sản lượng lên tối đa 350% khi có handicap được áp dụng. Có thể cấu hình thông qua trình chỉnh Monsoon."
caES = "Meteorologia perillosa. Totes les fonts d'aigua augmenten la seva producció, fins a un màxim del 350% amb el maneig aplicat. Es pot configurar mitjançant el modificador Monsoon."
beBY = "Небяспечнае надвор'е. Усе крыніцы вады павялічваюць сваю вытворчасць, максімум да 350% з улікам складанасці. Налічваецца праз модыфікатар Monsoon."
roRO = "Vreme periculos. Toate sursele de apă își cresc producția, până la 350% maximum, cu handicapul aplicat. Poate fi configurat prin modificatorul Monsoon."
huHU = "Veszélyes időjárás. Minden vízforrás kimenete megnő, legfeljebb 350%-ig, a nehezítés alkalmazásával. A Monszun módosítóval állítható."
arSA = "الطقس الخطير. تزيد جميع مصادر المياه إنتاجها، بحد أقصى 350% مع تطبيق الإعاقة. قابل للتهيئة عبر معدِّل الموسم الممطر."

["LV.MW.SurprisinglyRefreshingDesc"]
raw = "'Hazardous' weather with no negative effect. All water sources produce fresh water. Very short."
status = "abandoned"
enUS = "'Hazardous' weather with no negative effect. All water sources produce fresh water. Very short."
zhCN = "模组扩展的“恶劣类”天气，清水从恶水源流出，仿佛是一个恶劣的玩笑。<br>- 所有水源都会流出净水。<br>- 持续时间极短，只有1~2天（模组默认，可更改）。"
zhTW = "「‘危險’的天氣但沒有負面影響。所有水源產生淡水。非常簡短。」"
ruRU = "«Опасная» погода без негативного воздействия. Все водные источники производят пресную воду. Очень коротко."
jaJP = "「'危険な'天候で悪影響なし。すべての水源が淡水を生産します。非常に短い。」"
frFR = "Desciption: \"'Météo 'hazardueuse' sans effet négatif. Toutes les sources d'eau produisent de l'eau douce. Très court.\""
deDE = "'Gefährliches' Wetter ohne negative Auswirkungen. Alle Wasserquellen produzieren frisches Wasser. Sehr kurz."
plPL = "'Niebezpieczna' pogoda bez negatywnych skutków. Wszystkie źródła wody produkują świeżą wodę. Bardzo krótka."
ptBR = "“Clima 'Perigoso' sem efeito negativo. Todas as fontes de água produzem água limpa. Muito curto.”"
koKR = "부정적인 영향이 없는 '위험한' 날씨. 모든 수원에서 담수가 생산됩니다. 매우 짧음."
trTR = "'Tehlikeli' hava durumu, hiçbir olumsuz etkisi yok. Tüm su kaynakları taze su üretir. Çok kısa."
esES = "'Peligroso' clima sin efecto negativo. Todas las fuentes de agua producen agua dulce. Muy breve."
itIT = "\"Maltempo\" pericoloso senza effetti negativi. Tutte le fonti d'acqua producono acqua dolce. Molto breve."
ukUA = "«Небезпечна» погода без негативного впливу. Усі джерела води виробляють прісну воду. Дуже коротко."
thTH = "\"อากาศอันตราย\" แต่ไม่มีผลเสียใดๆ แหล่งน้ำทุกแห่งผลิตน้ำจืด สั้นมาก"
csCZ = "'Nebezpečné' počasí bez negativního efektu. Všechny vodní zdroje produkují čerstvou vodu. Velmi krátké."
viVN = "'Nguy hiểm' thời tiết không có tác động tiêu cực. Tất cả nguồn nước đều cho nước ngọt. Rất ngắn."
caES = "\"Clima perillós\" sense cap efecte negatiu. Totes les fonts d'aigua produeixen aigua dolça. Molt curt."
beBY = "«Небяспечнае» надвор'е без негатыўнага ўплыву. Усе крыніцы вады вырабляюць прэсную ваду. Вельмі коратка."
roRO = "„Vreme periculoasă” fără efect negativ. Toate sursele de apă produc apă dulce. Foarte scurt."
huHU = "\"Veszélyes\" időjárás, amely nem okoz negatív hatást. Minden vízforrás édesvizet termel. Nagyon rövid."
arSA = "ً\"طقس خطير\" بلا أي تأثير سلبي. جميع مصادر المياه تنتج مياهاً عذبة. قصير جداً."

