csCZ = "Výchozí nebezpečné suché počasí ve hře. Vodní zdroje přestanou produkovat vodu."
viVN = "Thời tiết hạn hán nguy hiểm mặc định của trò chơi. Các nguồn nước ngừng sản xuất nước."
