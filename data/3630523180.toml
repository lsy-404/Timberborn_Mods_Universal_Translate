["LV.MW.AlwaysShowHazDurDesc"]
raw = "If enabled, the hazardous weather duration will always be shown in the weather panel (the game's default behavior). If disabled, you only know 3 days in advance before the next weather starts."
status = "abandoned"
enUS = "If enabled, the hazardous weather duration will always be shown in the weather panel (the game's default behavior). If disabled, you only know 3 days in advance before the next weather starts."
zhCN = "勾选后，恶劣类天气的持续时间将始终显示在天气面板中（游戏默认：是）。<br>如果取消勾选，则只能在天气结束前3天得知。"
zhTW = "如果啟用，有害天氣的持續時間將始終顯示在天氣面板中（遊戲的預設行為）。如果禁用，您只能提前3天知道下一個天氣開始的時間。"
ruRU = "Если включено, продолжительность опасной погоды всегда будет отображаться в панели погоды (это поведение по умолчанию в игре). Если выключено, вы будете знать только за 3 дня до начала следующей погоды."
jaJP = "有効にすると、危険な天候の持続時間が常に天候パネルに表示されます（ゲームのデフォルトの動作）。無効にすると、次の天候が始まる3日前までしかわかりません。"
frFR = "Si activé, la durée des conditions météorologiques dangereuses sera toujours affichée dans le panneau météo (le comportement par défaut du jeu). Si désactivé, vous ne saurez que 3 jours à l'avance avant le début de la prochaine météo."
deDE = "Wenn aktiviert, wird die Dauer des gefährlichen Wetters immer im Wetterpanel angezeigt (das Standardverhalten des Spiels). Wenn deaktiviert, weiß man nur 3 Tage im Voraus, bevor das nächste Wetter beginnt."
plPL = "Jeśli włączone, czas trwania niebezpiecznych warunków pogodowych będzie zawsze wyświetlany w panelu pogodowym (domyślne zachowanie w grze). Jeśli wyłączone, będziesz wiedział tylko 3 dni wcześniej przed rozpoczęciem następnej pogody."
ptBR = "Se ativado, a duração do tempo perigoso sempre será exibida no painel do clima (comportamento padrão do jogo). Se desativado, você só saberá 3 dias antes quando o próximo clima começar."
koKR = "활성화하면, 위험한 날씨의 지속 시간이 날씨 패널에 항상 표시됩니다(게임의 기본 동작). 비활성화하면, 다음 날씨가 시작되기 3일 전에만 알 수 있습니다."
trTR = "Etkinleştirildiğinde, tehlikeli hava durumunun süresi hava durumu panelinde her zaman gösterilecektir (oyunun varsayılan davranışı). Devre dışı bırakıldığında, bir sonraki hava durumunun başlamasından yalnızca 3 gün önce haberdar olursunuz."
esES = "Si está activado, la duración del clima peligroso siempre se mostrará en el panel del clima (el comportamiento predeterminado del juego). Si está desactivado, solo sabrás con 3 días de antelación cuándo comenzará el siguiente clima."
itIT = "Se abilitato, la durata del clima pericoloso sarà sempre mostrata nel pannello del meteo (il comportamento predefinito del gioco). Se disabilitato, saprai solo 3 giorni in anticipo quando inizierà il prossimo clima."
ukUA = "Якщо увімкнено, тривалість небезпечної погоди завжди відображатиметься на панелі погоди (типова поведінка гри). Якщо вимкнено, ви знаєте лише за 3 дні до початку наступної погоди."
thTH = "หากเปิดใช้งาน ระยะเวลาของสภาพอากาศอันตรายจะแสดงในแผงสภาพอากาศเสมอ (พฤติกรรมเริ่มต้นของเกม) หากปิดใช้งาน คุณจะทราบล่วงหน้าเพียง 3 วันก่อนสภาพอากาศถัดไปจะเริ่มต้น"
csCZ = "Pokud je povoleno, doba trvání nebezpečného počasí bude vždy zobrazena na panelu počasí (výchozí chování hry). Pokud je zakázáno, budete mít informace pouze 3 dny předem o tom, než začne následující počasí."
viVN = " Nếu được bật, thời lượng của thời tiết nguy hiểm sẽ luôn được hiển thị trên bảng thời tiết (hoạt động mặc định của trò chơi). Nếu được tắt, bạn sẽ chỉ biết trước 3 ngày trước khi thời tiết tiếp theo bắt đầu."
caES = "Si està activat, la durada del clima perillós sempre es mostrarà al panell del clima (el comportament predeterminat del joc). Si està desactivat, només coneixeràs el clima perillós amb 3 dies d'antelació abans que comenci el següent."
beBY = "Калі ўключана, тэрмін надзвычайнага надвор'я заўсёды будзе паказвацца ў панэлі надвор'я (стандартная паводзіны гульні). Калі выключана, вы ведаеце толькі за 3 дні да пачатку наступнага надвор'я."
roRO = "Dacă este activată, durata vremii periculoase va fi întotdeauna afișată în panoul meteo (comportamentul implicit al jocului). Dacă este dezactivată, veți ști doar cu 3 zile în avans când începe următoarea vreme periculoasă."
huHU = "Ha engedélyezve van, a veszélyes időjárás időtartama mindig megjelenik az időjárási panelen (a játék alapértelmezett működése). Ha letiltva van, csak 3 nappal a következő időjárás kezdete előtt tudhatod meg."
arSA = "إذا كان هذا الخيار مفعّلاً، فستظهر مدة الطقس الخطير دائماً في لوحة الطقس (وهو السلوك الافتراضي للعبة). وإذا كان معطّلاً، فلن تعرف إلا قبل 3 أيام فقط من بدء الطقس التالي."

