["LV.MW.SettingsNote"]
raw = "Settings changes will not take effect until the next weather cycle.\n<YellowHighlight>- You should make a save before editing.\n- You should make a save and reload that save after editing.</YellowHighlight>"
status = "abandoned"
enUS = "Settings changes will not take effect until the next weather cycle.\n<YellowHighlight>- You should make a save before editing.\n- You should make a save and reload that save after editing.</YellowHighlight>"
zhCN = "参数配置更改后，将在下一个天气周期生效。<br><color=#FFFF1A>更改配置前建议保存游戏。<br>更改配置后建议保存并重新加载存档。</color>"
zhTW = "設定變更在下個天氣週期之前不會生效。\n<YellowHighlight>- 編輯之前應該先保存遊戲。\n- 編輯之後應該保存並重新加載該存檔。</YellowHighlight>"
ruRU = "Изменения в настройках вступят в силу только после следующего погодного цикла.\n<YellowHighlight>- Вам следует сохранить игру перед редактированием.\n- Вам следует сохранить игру и перезагрузить сохранение после редактирования.</YellowHighlight>"
jaJP = "設定の変更は次の天候サイクルまで適用されません。\n<YellowHighlight>- 編集する前にセーブを作成するべきです。\n- 編集後にそのセーブを読み込むべきです。</YellowHighlight>"
frFR = "Les modifications des paramètres ne prendront effet qu'au prochain cycle météorologique.\n<YellowHighlight>- Vous devriez faire une sauvegarde avant de modifier.\n- Vous devriez faire une sauvegarde et recharger cette sauvegarde après modification.</YellowHighlight>"
deDE = "Änderungen an den Einstellungen treten erst im nächsten Wetterzyklus in Kraft.\n<YellowHighlight>- Du solltest ein Save erstellen, bevor du bearbeitest.\n- Du solltest ein Save erstellen und dieses nach der Bearbeitung neu laden.</YellowHighlight>"
plPL = "Zmiany w ustawieniach nie wejdą w życie do następnego cyklu pogodowego.\n<YellowHighlight>- Powinieneś wykonać zapis przed edytowaniem.\n- Powinieneś wykonać zapis i załadować ten zapis po edytowaniu.</YellowHighlight>"
ptBR = "As mudanças nas configurações não terão efeito até o próximo ciclo de clima.  \n<YellowHighlight>- Você deve fazer um salvamento antes de editar.  \n- Você deve fazer um salvamento e recarregar esse salvamento após editar.</YellowHighlight>"
koKR = "설정 변경은 다음 날씨 주기가 끝날 때까지 적용되지 않습니다.  \n<YellowHighlight>- 편집하기 전에 저장해야 합니다.  \n- 편집 후 저장하고 해당 저장 파일을 다시 로드해야 합니다.</YellowHighlight>"
trTR = "Ayarlardaki değişiklikler, bir sonraki hava döngüsüne kadar geçerli olmayacaktır. \n<YellowHighlight>- Düzenlemeden önce bir kaydetmelisiniz. \n- Düzenlemeden sonra bir kaydedin ve o kaydı yeniden yükleyin.</YellowHighlight>"
esES = "Los cambios en la configuración no surtirán efecto hasta el próximo ciclo meteorológico.\n<YellowHighlight>- Debes guardar la partida antes de editar.\n- Debes guardar la partida y, después de editar, cargar esa partida guardada.</YellowHighlight>"
itIT = "Le modifiche alle impostazioni non avranno effetto fino al prossimo ciclo meteorologico.\n<YellowHighlight>- Dovresti salvare prima di modificare.\n- Dovresti salvare e poi ricaricare quel salvataggio dopo la modifica.</YellowHighlight>"
ukUA = "Зміни налаштувань не набудуть чинності до наступного погодного циклу.\n<YellowHighlight>- Перед редагуванням варто зберегти гру.\n- Перед редагуванням варто зберегти гру, а після редагування перезавантажити це збереження.</YellowHighlight>"
thTH = "การเปลี่ยนแปลงการตั้งค่าจะยังไม่มีผลจนกว่าวงจรสภาพอากาศถัดไปจะเริ่มขึ้น\n<YellowHighlight>- คุณควรบันทึกเกมก่อนแก้ไข\n- คุณควรบันทึกเกมและโหลดไฟล์บันทึกนั้นใหม่หลังแก้ไข</YellowHighlight>"
csCZ = "Změny nastavení se projeví až po dalším cyklu počasí.\n<YellowHighlight>- Před úpravou byste si měli udělat zálohu.\n- Po úpravě byste si měli udělat zálohu a tuto zálohu načíst.</YellowHighlight>"
viVN = "Các thay đổi cài đặt sẽ không có hiệu lực cho đến chu kỳ thời tiết tiếp theo.\n<YellowHighlight>- Bạn nên sao lưu trước khi chỉnh sửa.\n- Bạn nên sao lưu và tải lại save đó sau khi chỉnh sửa.</YellowHighlight>"
caES = "Els canvis de configuració no tindran efecte fins al proper cicle meteorològic.\n<YellowHighlight>- Hauríeu de fer una partida guardada abans d'editar.\n- Hauríeu de fer una partida guardada i carregar-la de nou després d'editar.</YellowHighlight>"
beBY = "Змены налад не набудуць сілы да наступнага цыкла надвор'я.\n<YellowHighlight>- Перад рэдагаваннем вам варта захаваць гульню.\n- Пасля рэдагавання вам варта захаваць гульню і перазагрузіць гэтае захаванне.</YellowHighlight>"
roRO = "Modificările setărilor nu vor avea efect până la următorul ciclu meteo.\n<YellowHighlight>- Ar trebui să faci o salvare înainte de a edita.\n- Ar trebui să faci o salvare și să reîncarci acea salvare după ce editezi.</YellowHighlight>"
huHU = "A beállítások módosításai csak a következő időjárási ciklusban lépnek életbe.\n<YellowHighlight>- Szerkesztés előtt érdemes mentést készíteni.\n- Szerkesztés után érdemes mentést készíteni, majd azt a mentést újra betölteni.</YellowHighlight>"
arSA = "تطبيق تغييرات الإعدادات لن يسري حتى دورة الطقس التالية.\n<YellowHighlight>- يُنصح بحفظ اللعبة قبل إجراء أي تعديل.\n- يُنصح بحفظ اللعبة ثم إعادة تحميل هذا الحفظ بعد إجراء التعديل.</YellowHighlight>"

