["LV.MW.DefaultSettingsDesc"]
raw = "New saves will use these settings. Click 'Use current' to set the default settings to your current settings. Click 'Reset' to reset the default settings to the original values."
status = "normal"
enUS = "New saves will use these settings. Click 'Use current' to set the default settings to your current settings. Click 'Reset' to reset the default settings to the original values."
zhCN = "新保存将使用这些设置。点击“使用当前”将默认设置设为您的当前设置。点击“重置”将默认设置恢复为原始值。"
zhTW = "新的存檔將使用這些設置。點擊「使用當前」將默認設置設置為您當前的設置。點擊「重置」將默認設置重置為原始值。"
ruRU = "Новыми сохранениями будут использоваться эти настройки. Нажмите 'Использовать текущие', чтобы установить настройки по умолчанию на ваши текущие настройки. Нажмите 'Сбросить', чтобы вернуть настройки по умолчанию к исходным значениям."
jaJP = "新しいセーブはこれらの設定を使用します。「現在の設定を使用する」をクリックしてデフォルト設定を現在の設定に設定します。「リセット」をクリックするとデフォルトの設定を元の値にリセットします。"
frFR = "Les nouvelles sauvegardes utiliseront ces paramètres. Cliquez sur 'Utiliser actuel' pour définir les paramètres par défaut sur vos paramètres actuels. Cliquez sur 'Réinitialiser' pour rétablir les paramètres par défaut aux valeurs d'origine."
deDE = "Neue Speicherstände verwenden diese Einstellungen. Klicken Sie auf 'Aktuelle verwenden', um die Standardeinstellungen auf Ihre aktuellen Einstellungen festzulegen. Klicken Sie auf 'Zurücksetzen', um die Standardeinstellungen auf die ursprünglichen Werte zurückzusetzen."
plPL = "Nowe zapisy będą używać tych ustawień. Kliknij 'Użyj bieżących', aby ustawić domyślne ustawienia na swoje bieżące ustawienia. Kliknij 'Resetuj', aby przywrócić domyślne ustawienia do pierwotnych wartości."
ptBR = "Novos saves usarão estas configurações. Clique em 'Usar atual' para definir as configurações padrão de acordo com suas configurações atuais. Clique em 'Redefinir' para restaurar as configurações padrão aos valores originais."
koKR = "새로운 저장은 이러한 설정을 사용합니다. '현재 사용'을 클릭하여 기본 설정을 현재 설정으로 설정합니다. '재설정'을 클릭하여 기본 설정을 원래 값으로 재설정합니다."
trTR = "Yeni kayıtlar bu ayarları kullanacaktır. Varsayılan ayarları mevcut ayarlarınızla ayarlamak için 'Mevcut kullan' seçeneğine tıklayın. Varsayılan ayarları orijinal değerlere sıfırlamak için 'Sıfırla' seçeneğine tıklayın."
esES = "Las nuevas partidas usarán estos ajustes. Haz clic en \"Usar actuales\" para establecer los ajustes predeterminados como tus ajustes actuales. Haz clic en \"Restablecer\" para restaurar los ajustes predeterminados a los valores originales."
itIT = "I nuovi salvataggi utilizzeranno queste impostazioni. Clicca su \"Usa attuali\" per impostare le impostazioni predefinite con le tue impostazioni attuali. Clicca su \"Reimposta\" per ripristinare le impostazioni predefinite ai valori originali."
ukUA = "Нові збереження використовуватимуть ці налаштування. Натисніть «Use current», щоб встановити налаштування за замовчуванням відповідно до поточних налаштувань. Натисніть «Reset», щоб скинути налаштування за замовчуванням до початкових значень."
thTH = "บันทึกใหม่จะใช้การตั้งค่าเหล่านี้ คลิก 'ใช้ค่าปัจจุบัน' เพื่อกำหนดการตั้งค่าเริ่มต้นให้เป็นการตั้งค่าปัจจุบันของคุณ คลิก 'รีเซ็ต' เพื่อรีเซ็ตการตั้งค่าเริ่มต้นกลับเป็นค่าดั้งเดิม"
csCZ = "Nové uložené hry budou používat tato nastavení. Klikněte na 'Použít aktuální', abyste nastavili výchozí nastavení na vaše aktuální nastavení. Klikněte na 'Obnovit', abyste vrátili výchozí nastavení na původní hodnoty."
viVN = "Các bản lưu mới sẽ sử dụng các cài đặt này. Nhấn 'Sử dụng hiện tại' để đặt cài đặt mặc định thành cài đặt hiện tại của bạn. Nhấn 'Đặt lại' để đặt cài đặt mặc định về giá trị ban đầu."
caES = "Els nous desats utilitzaran aquesta configuració. Feu clic a \"Utilitza l'actual\" per establir la configuració predeterminada com a configuració actual. Feu clic a \"Restableix\" per restablir la configuració predeterminada als valors originals."
beBY = "Новыя захаванні будуць выкарыстоўваць гэтыя налады. Націсніце «Use current», каб усталяваць налады па змаўчанні як бягучыя налады. Націсніце «Reset», каб вярнуць налады па змаўчанні да першапачатковых значэнняў."
roRO = "Noile salvări vor folosi aceste setări. Apasă „Folosește cele curente” pentru a seta setările implicite la setările tale curente. Apasă „Resetează” pentru a reseta setările implicite la valorile originale."
huHU = "Az új mentések ezeket a beállításokat fogják használni. Kattintson a „Jelenlegi használata” gombra, hogy az alapértelmezett beállításokat a jelenlegi beállításaira állítsa. Kattintson a „Visszaállítás” gombra, hogy az alapértelmezett beállításokat az eredeti értékekre állítsa vissza."
arSA = "ستستخدم الحفظات الجديدة هذه الإعدادات. انقر على \"استخدام الحالي\" لتعيين الإعدادات الافتراضية إلى إعداداتك الحالية. انقر على \"إعادة تعيين\" لإعادة الإعدادات الافتراضية إلى قيمها الأصلية."

