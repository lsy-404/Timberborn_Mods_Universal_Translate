["LV.MW.MonsoonMultiplierDesc"]
raw = "The maximum additional multiplier for the monsoon weather at maximum. This value is affected by handicap like Duration.\nDefault value: 350(%) meaning when no handicap is applied (default cycle 5), all water sources strength is at 350%."
status = "abandoned"
enUS = "The maximum additional multiplier for the monsoon weather at maximum. This value is affected by handicap like Duration.\nDefault value: 350(%) meaning when no handicap is applied (default cycle 5), all water sources strength is at 350%."
zhCN = "洪涝期时水源的水力倍率，即水源的水力会变为“默认水力×倍率”。<br><color=#FFFF1A>此倍率与持续时间类似，受初始强度值、适应频次数影响。</color>"
zhTW = "\"潮濤天氣的最大額外乘數。此數值會受到如持續時間等懲罰的影響。預設值：350(%)，意即在不施加懲罰的情況下（預設循環5），所有水源的強度為350%。”"
ruRU = "Максимальный дополнительный множитель для монсунной погоды на максимуме. Это значение зависит от уровня сложности, как, например, Продолжительность.  \nЗначение по умолчанию: 350(%), что означает, что при отсутствии наложенных ограничений (цикл по умолчанию 5) вся сила водных источников составляет 350%."
jaJP = "モンスーン天候の最大追加乗数の最大値。この値は、期間のようなハンディキャップに影響されます。  \nデフォルト値：350（％）は、ハンディキャップが適用されない場合（デフォルトサイクル5）、すべての水源の強度が350％であることを意味します。"
frFR = "Description du multiplicateur de mousson : \"Le multiplicateur additionnel maximum pour le temps de mousson au maximum. Cette valeur est affectée par des handicaps comme la Durée. Valeur par défaut : 350(%) ce qui signifie que lorsqu'aucun handicap n'est appliqué (cycle par défaut 5), la force de toutes les sources d'eau est à 350%.\""
deDE = "Der maximale zusätzliche Multiplikator für das Monsunwetter in seiner höchsten Ausprägung. Dieser Wert wird von Handicap wie der Dauer beeinflusst. \nStandardwert: 350(%), was bedeutet, dass bei Anwendung kein Handicaps (Standardzyklus 5) die Stärke aller Wasserquellen bei 350% liegt."
plPL = "Maksymalny dodatkowy mnożnik dla pogody monsunu na maksymalnym poziomie. Ta wartość jest wpływana przez handicap, taki jak Czas trwania.  \nWartość domyślna: 350(%), co oznacza, że gdy żaden handicap nie jest stosowany (domyślny cykl 5), siła wszystkich źródeł wody wynosi 350%."
ptBR = "O multiplicador adicional máximo para o tempo de monção no máximo. Este valor é afetado por desvantagens como Duração. Valor padrão: 350(%) significando que quando nenhuma desvantagem é aplicada (ciclo padrão 5), toda a força das fontes de água está em 350%."
koKR = "최대 추가 멀티플라이어는 최대의 몬순 날씨에 대한 것입니다. 이 값은 지속 시간과 같은 핸디캡의 영향을 받습니다. 기본 값: 350(%)는 핸디캡이 적용되지 않았을 때(기본 사이클 5), 모든 수원 강도가 350%임을 의미합니다."
trTR = "Muson havanın maksimumda ek kat sayısı için maksimum. Bu değer Süre gibi dezavantajlardan etkilenir. \nVarsayılan değer: 350(%) yani herhangi bir dezavantaj uygulanmadığında (varsayılan döngü 5) tüm su kaynaklarının gücü %350'dir."
esES = "El multiplicador adicional máximo para el clima de monzón en su valor máximo. Este valor se ve afectado por los ajustes de dificultad, como la duración.\nValor predeterminado: 350 (%), lo que significa que, cuando no se aplica ningún ajuste de dificultad (ciclo predeterminado 5), la intensidad de todas las fuentes de agua es del 350 %."
itIT = "Il moltiplicatore aggiuntivo massimo per il clima monsonico al massimo. Questo valore è influenzato dalle difficoltà come la Durata.\nValore predefinito: 350(%), cioè quando non viene applicata alcuna difficoltà (ciclo predefinito 5), la forza di tutte le fonti d'acqua è al 350%."
ukUA = "Максимальний додатковий множник для мусонної погоди на піку. На це значення впливає складність, як-от тривалість.\nЗначення за замовчуванням: 350(%), тобто коли складність не застосовано (стандартний цикл 5), сила всіх джерел води становить 350%."
thTH = "ค่าตัวคูณเพิ่มเติมสูงสุดสำหรับสภาพอากาศแบบมรสุมที่ระดับสูงสุด ค่านี้ได้รับผลกระทบจากตัวปรับความยากเช่นเดียวกับระยะเวลา\nค่าเริ่มต้น: 350(%) หมายความว่าเมื่อไม่มีการใช้ตัวปรับความยาก (รอบเริ่มต้น 5) ความแรงของแหล่งน้ำทั้งหมดอยู่ที่ 350%"
csCZ = "Maximální další multiplikátor pro monzunové počasí na maximum. Tato hodnota je ovlivněna handicapem jako Délka. \nVýchozí hodnota: 350(%), což znamená, že když není aplikován žádný handicap (výchozí cyklus 5), je síla všech zdrojů vody na 350%."
viVN = "Hệ số nhân bổ sung tối đa cho thời tiết mùa mưa ở mức cao nhất.\nGiá trị này bị ảnh hưởng bởi những hạn chế như Thời lượng.\nGiá trị mặc định: 350(%) có nghĩa là khi không áp dụng bất kỳ handicap nào (chu kỳ mặc định 5), sức mạnh của tất cả nguồn nước ở mức 350(%)."
caES = "La multiplicador addicional màxim per al clima de monsó en el seu punt màxim. Aquest valor es veu afectat per l'handicap, igual que la durada.\nValor per defecte: 350(%), la qual cosa significa que, quan no s'aplica cap handicap (cicle per defecte 5), la força de totes les fonts d'aigua és del 350%."
beBY = "Максімальны дадатковы множнік для надвор'я мусону на піку. На гэта значэнне ўплывае складанасць (handicap), як і на працяглasць.\nСтандартнае значэнне: 350(%), што азначае: калі складанасць не прымяняецца (стандартны цыкл 5), сіла ўсіх крыніц вады складае 350%."
roRO = "Multiplicatorul maxim suplimentar pentru vremea de musonă la intensitate maximă. Această valoare este afectată de handicap, la fel ca Durata.\nValoare implicită: 350(%), ceea ce înseamnă că, atunci când nu se aplică niciun handicap (ciclul implicit 5), puterea tuturor surselor de apă este de 350%."
huHU = "A monszun időjárás maximális további szorzója. Ezt az értéket a nehézségi beállítások, például az időtartam is befolyásolják.\nAlapértelmezett érték: 350(%), ami azt jelenti, hogy nehézségi korlátozás nélkül (alapértelmezett ciklus: 5) minden vízforrás erőssége 350%."
arSA = "أقصى مضاعف إضافي لطقس الرياح الموسمية عند بلوغه الحد الأقصى. تتأثر هذه القيمة بالعوامل المعيقة مثل المدة.\nالقيمة الافتراضية: 350 (%)، أي أنه عند عدم تطبيق أي عامل معيق (الدورة الافتراضية 5)، تكون قوة جميع مصادر المياه 350%."

