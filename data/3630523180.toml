["LV.MW.RainModifierDesc"]
raw = "All tiles are watered, no land contamination occurs, and applies Wet Fur when Beavers are not in buildings."
status = "abandoned"
enUS = "All tiles are watered, no land contamination occurs, and applies Wet Fur when Beavers are not in buildings."
zhCN = "所有土地都被灌溉，不会受到恶水污染，海狸在室外时会增加“湿润的毛发”康乐值。"
zhTW = "所有瓦片都被澆水，不會發生土地污染，並且當海狸不在建築物內時會施加濕毛皮效果。"
ruRU = "Все клетки поливаются, загрязнения земли не происходит, и применяется Влажный мех, когда бобры находятся не в зданиях."
jaJP = "すべてのタイルが水やりされ、土地の汚染は発生せず、ビーバーが建物にいないときに湿った毛皮が適用されます。"
frFR = "Tous les tuiles sont arrosées, aucune contamination du sol ne se produit, et applique Fourrure Humide lorsque les Castors ne sont pas dans des bâtiments."
deDE = "Alle Felder sind bewässert, es tritt keine Bodenverschmutzung auf, und Wet Fur wird angewendet, wenn Biber sich nicht in Gebäuden befinden."
plPL = "Wszystkie płytki są nawadniane, nie występuje zanieczyszczenie terenu, a efekty Mokrej Futryny są stosowane, gdy Bobry nie przebywają w budynkach."
ptBR = "Todos os tiles são regados, não ocorre contaminação do solo e aplica Pelagem Molhada quando as Castores não estão em edifícios."
koKR = "모든 타일에 물이 공급되며, 토양 오염이 발생하지 않고, 비버가 건물에 없을 때 젖은 털 효과가 적용됩니다."
trTR = "Tüm kareler sulanır, arazi kirlenmesi olmaz ve Kupaklar binaların içinde olmadığında Islak Kürk uygulanır."
esES = "Todas las casillas están regadas, no se produce contaminación del terreno y se aplica Pelaje Húmedo cuando los castores no están en edificios."
itIT = "Tutte le piastrelle sono irrigate, non si verifica alcuna contaminazione del terreno e viene applicato il Pelo Bagnato quando i Castori non si trovano negli edifici."
ukUA = "Усі плитки зрошуються, забруднення ґрунту не відбувається, а бобри отримують мокру шерсть, коли перебувають поза будівлями."
thTH = "ทุกไทล์ได้รับน้ำ ไม่มีการปนเปื้อนดินเกิดขึ้น และให้ผลขนสุนัขเปียกเมื่อบีเวอร์ไม่อยู่ในอาคาร"
csCZ = "Všechny dlaždice jsou zavlažovány, nedochází k žádné kontaminaci půdy a při nezabydlených bobrech se používá Mokrá srst."
viVN = "Tất cả các ô đất được tưới nước, không có ô nhiễm đất, và được kích hoạt Lông ướt khi hải ly không ở trong các công trình."
caES = "Totes les caselles reben aigua, no es produeix contaminació del terreny, i s'aplica Pelatge Humit quan els castors no són dins d'edificis."
beBY = "Усе плоскі палівы зрошаны, забруджванне зямлі не адбываецца, і прымяняецца Мокрая поўсць, калі бабры не знаходзяцца ў будынках."
roRO = "Toate plăcile sunt udate, nu apare contaminare a terenului, iar Blana Umedă se aplică atunci când castorii nu se află în clădiri."
huHU = "Minden csempe öntözött, nem keletkezik földszennyeződés, és a Nedves bunda hatása érvényesül, ha a béverek nincsenek épületekben."
arSA = "كل البلاط مروي، ولا يحدث تلوث للأرض، ويُطبّق \"فرو مبلل\" عندما لا يكون القنادس داخل المباني."

