["LV.MW.ProfilesDesc"]
raw = "Export and import settings. It's recommended to make a save then reload it after importing settings to ensure everything is applied correctly."
status = "abandoned"
enUS = "Export and import settings. It's recommended to make a save then reload it after importing settings to ensure everything is applied correctly."
zhCN = "导入/导出模组的天气参数配置。<br><color=#FFFF1A>导入配置后建议保存游戏并重新加载，以确保所有参数配置正确生效。</color>"
zhTW = "導出和導入設置。建議先保存遊戲，然後在導入設置後重新加載，以確保所有設置正確應用。"
ruRU = "Экспорт и импорт настроек. Рекомендуется сделать сохранение, а затем перезагрузить его после импорта настроек, чтобы гарантировать правильное применение всех изменений."
jaJP = "設定のエクスポートとインポート。設定をインポートした後にすべてが正しく適用されることを確認するために、セーブを行い、その後に再読み込みすることをお勧めします。"
frFR = "Exporter et importer les paramètres. Il est recommandé de faire une sauvegarde puis de la recharger après l'importation des paramètres pour s'assurer que tout est appliqué correctement."
deDE = "Exportieren und Importieren von Einstellungen. Es wird empfohlen, ein Speicherstand zu erstellen und ihn nach dem Importieren der Einstellungen neu zu laden, um sicherzustellen, dass alles korrekt angewendet wird."
plPL = "Exportuj i importuj ustawienia. Rekomenduje się wykonanie zapisania, a następnie załadowanie go po imporcie ustawień, aby upewnić się, że wszystko zostało poprawnie zastosowane."
ptBR = "Exporte e importe configurações. É recomendável fazer um salvamento e depois recarregá-lo após importar as configurações para garantir que tudo seja aplicado corretamente."
koKR = "설정 내보내기 및 가져오기. 설정을 가져온 후 모든 것이 올바르게 적용되었는지 확인하기 위해 저장한 후 다시 로드하는 것이 좋습니다."
trTR = "Ayarları dışa ve içe aktar. Ayarları içe aktardıktan sonra her şeyin doğru bir şekilde uygulandığından emin olmak için bir kayıt yapmanız ve ardından bunu yeniden yüklemeniz önerilir."
esES = "Exportar e importar ajustes. Se recomienda guardar la partida y luego recargarla tras importar los ajustes para asegurarse de que todo se aplica correctamente."
itIT = "Esporta e importa le impostazioni. Si consiglia di creare un salvataggio e poi ricaricarlo dopo aver importato le impostazioni, così da assicurarsi che tutto venga applicato correttamente."
ukUA = "Експорт і імпорт налаштувань. Рекомендується зробити збереження, а потім перезавантажити його після імпорту налаштувань, щоб переконатися, що всі зміни застосовані правильно."
thTH = "การส่งออกและนำเข้าการตั้งค่า แนะนำให้บันทึกเกมก่อน แล้วโหลดเกมใหม่หลังนำเข้าการตั้งค่า เพื่อให้มั่นใจว่าทุกอย่างถูกนำไปใช้อย่างถูกต้อง"
csCZ = "Exportovat a importovat nastavení. Je doporučeno provést uložení a pak jej znovu načíst po importu nastavení, aby se zajistilo, že bylo vše správně aplikováno."
viVN = "Xuất và nhập cài đặt. Nên lưu lại trò chơi và tải lại sau khi nhập cài đặt để đảm bảo mọi thứ được áp dụng đúng."
caES = "Exporta i importa la configuració. Es recomana desar una partida i després tornar-la a carregar després d'importar la configuració, per assegurar que tot s'aplica correctament."
beBY = "Экспарт і імпарт налад. Рэкамендуецца стварыць захаванне, а затым перазагрузіць яго пасля імпарту налад, каб пераканацца, што ўсё прымянілася правільна."
roRO = "Exportă și importă setările. Se recomandă să salvezi jocul și apoi să îl reîncarci după importarea setărilor, pentru a te asigura că totul este aplicat corect."
huHU = "Beállítások exportálása és importálása. Javasolt a mentés készítése, majd az importálás után a mentés újratöltése, hogy minden beállítás helyesen érvényesüljön."
arSA = "تصدير الإعدادات واستيرادها. يُنصح بإنشاء حفظ ثم إعادة تحميله بعد استيراد الإعدادات للتأكد من تطبيق كل شيء بشكل صحيح."

