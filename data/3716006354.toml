["BuildQueue.Settings.Description"]
raw = "Show or hide the build queue panel from the top bar or hotkey. The toggle hotkey now lives in Settings -> Keybindings (default: B)."
status = "normal"
enUS = "Show or hide the build queue panel from the top bar or hotkey. The toggle hotkey now lives in Settings -> Keybindings (default: B)."
zhCN = "从顶部栏或快捷键中显示或隐藏建筑队列面板。切换快捷键现在位于设置 -> 键位绑定中（默认：B）。"
zhTW = "在頂部工具欄或使用快捷鍵顯示或隱藏建造隊列面板。切換快捷鍵現在位於設置 -> 鍵位綁定中（默認：B）。"
ruRU = "Показать или скрыть панель очереди строительства в верхней части экрана или с помощью горячей клавиши. Теперь переключатель горячей клавиши находится в Настройки -> Привязки клавиш (по умолчанию: B)."
jaJP = "ビルドキューパネルをトップバーまたはホットキーから表示または非表示にします。トグルホットキーは現在、設定 -> キーバインディングにあります（デフォルト: B）。"
frFR = "Affichez ou masquez le panneau de la file d'attente de construction à partir de la barre supérieure ou avec une touche de raccourci. La touche de raccourci pour activer/désactiver se trouve maintenant dans Paramètres -> Raccourcis clavier (par défaut : B)."
deDE = "Zeigen Sie das Bauauftragsfenster in der oberen Leiste oder per Hotkey an oder verbergen Sie es. Der Umschalt-Hotkey befindet sich jetzt unter Einstellungen -> Tastenbelegungen (standardmäßig: B)."
plPL = "Pokaż lub ukryj panel kolejki budowy z górnego paska lub za pomocą skrótu klawiszowego. Skrót przełączania jest teraz dostępny w Ustawieniach -> Przypisania klawiszy (domyślnie: B)."
ptBR = "Mostre ou oculte o painel da fila de construção na barra superior ou por atalho. O atalho de alternância agora está em Configurações -> Atalhos (padrão: B)."
koKR = "상단 바 또는 바로 가기에서 건설 대기열 패널을 표시하거나 숨깁니다. 토글 바로 가기는 이제 설정 -> 키 바인딩에 있습니다 (기본값: B)."
csCZ = "Zobrazit nebo skrýt panel fronty stavby z horního panelu nebo pomocí klávesové zkratky. Klávesová zkratka pro přepínání je nyní v Nastavení -> Klávesová zkratka (výchozí: B)."
viVN = "Hiển thị hoặc ẩn bảng hàng đợi xây dựng từ thanh công cụ hoặc phím tắt. Phím tắt chuyển đổi hiện nằm trong Cài đặt -> Phím tắt (mặc định: B)."
trTR = "Yapı sırası panelini üst çubuktan veya kısayoldan göster veya gizle. Anahtar ayarı şimdi Ayarlar -> Tuş Atamaları altında bulunmaktadır (varsayılan: B)."
esES = "Muestra u oculta el panel de la cola de construcción desde la barra superior o con una tecla de acceso rápido. La tecla de acceso rápido para alternar ahora está en Ajustes -> Asignación de teclas (predeterminada: B)."
itIT = "Mostra o nascondi il pannello della coda di costruzione dalla barra superiore o con un tasto di scelta rapida. Il tasto di scelta rapida per attivare o disattivare la coda ora si trova in Impostazioni -> Associazione tasti (predefinito: B)."
ukUA = "Показуйте або приховуйте панель черги будівництва через верхню панель або гарячу клавішу. Перемикач гарячої клавіші тепер знаходиться в меню Налаштування -> Прив’язки клавіш (за замовчуванням: B)."
thTH = "แสดงหรือซ่อนแผงคิวก่อสร้างจากแถบด้านบนหรือปุ่มลัด ขณะนี้ปุ่มลัดสำหรับสลับอยู่ใน การตั้งค่า -> การกำหนดปุ่ม (ค่าเริ่มต้น: B)"
caES = "Mostra o amaga el panell de la cua de construcció des de la barra superior o amb una drecera de teclat. Ara la drecera per alternar-ho és a Configuració -> Assignació de tecles (per defecte: B)."
beBY = "Паказваць або хаваць панэль чаргі будаўніцтва з верхняй панэлі або гарачай клавішай. Цяпер гарачая клавіша пераключэння знаходзіцца ў Налады -> Прывязкі клавіш (па змаўчанні: B)."
roRO = "Afișează sau ascunde panoul cozii de construcție din bara de sus sau folosind tasta rapidă. Tasta rapidă de comutare se află acum în Setări -> Asociere taste (implicit: B)."
huHU = "A felső sávból vagy gyorsbillentyűvel jelenítheted meg, illetve rejtheted el az építési sor paneljét. A váltó gyorsbillentyű mostantól a Beállítások -> Billentyűkiosztás menüpontban található (alapértelmezés: B)."
arSA = "أظهر لوحة قائمة البناء أو أخفِها من الشريط العلوي أو باستخدام مفتاح الاختصار. يوجد مفتاح الاختصار للتبديل الآن في الإعدادات -> تعيينات المفاتيح (الافتراضي: B)."

