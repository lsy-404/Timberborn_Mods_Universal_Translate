["Resource.TWIronOre.Description"]
raw = "Source of Iron Ore (25). Use dynamite or build a tunnel here to collect it."
status = "normal"
enUS = "Source of Iron Ore (25). Use dynamite or build a tunnel here to collect it."
zhCN = "“铁矿石来源（25）。使用炸药或在此处建造隧道以进行采集。”"
zhTW = "鐵礦的來源 (25)。在這裡使用炸藥或建造隧道來收集它。"
ruRU = "Источник железной руды (25). Используйте динамит или постройте туннель здесь, чтобы собрать её."
jaJP = "鉄鉱石の源（25）。ここでダイナマイトを使うか、トンネルを建設して収集してください。"
frFR = "Source de minerai de fer (25). Utilisez de la dynamite ou construisez un tunnel ici pour le collecter."
deDE = "Eisenlager (25). Verwenden Sie Dynamit oder bauen Sie hier einen Tunnel, um es abzubauen."
plPL = "Źródło rudy żelaza (25). Użyj dynamitu lub zbuduj tunel tutaj, aby ją zdobyć."
ptBR = "Fonte de Minério de Ferro (25). Use dinamite ou construa um túnel aqui para coletá-lo."
koKR = "철광석의 원천 (25). 여기서 다이너마이트를 사용하거나 터널을 건설하여 채집하세요."
trTR = "Demir Oyuğun Kaynağı (25). Burada dinamit kullanın veya bir tünel inşa edin ve toplayın."
esES = "Fuente de mineral de hierro (25). Usa dinamita o construye un túnel aquí para extraerlo."
itIT = "Fonte di minerale di ferro (25). Usa la dinamite o costruisci un tunnel qui per raccoglierlo."
ukUA = "Джерело залізної руди (25). Використовуйте динаміт або прокладіть тунель тут, щоб її добути."
thTH = "แหล่งแร่เหล็ก (25) ใช้ระเบิดไดนาไมต์หรือสร้างอุโมงค์ที่นี่เพื่อเก็บเกี่ยวแร่"
csCZ = "Zdroj železné rudy (25). Použijte dynamit nebo zde postavte tunel, abyste ji získali."
viVN = "Nguồn khoáng sắt (25). Sử dụng thuốc nổ hoặc xây dựng một đường hầm ở đây để thu thập."
caES = "Font de mineral de ferro (25). Utilitza dinamita o construeix un túnel aquí per recollir-lo."
beBY = "Крыніца жалезнай руды (25). Выкарыстайце дынаміт або пракапайце тунэль тут, каб здабыць яе."
roRO = "Sursă de minereu de fier (25). Folosiți dinamită sau construiți un tunel aici pentru a-l extrage."
huHU = "Vasérc forrása (25). Használj dinamitot, vagy építs ide alagutat a begyűjtéséhez."
arSA = "مصدر لخام الحديد (25). استخدم الديناميت أو ابنِ نفقاً هنا لجمعه."

["Resource.TWIronOre.FlavorDescription"]
raw = "Many a tooth was broken before beavers learned not to taste the ore"
status = "normal"
