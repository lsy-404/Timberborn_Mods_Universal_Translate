["ModSetting.TWMoreMines.PayScaleDesc"]
raw = "Pays beavers more as population increases. This is multiplied by the number of adults in excess of Min Population, then added to Pay."
status = "normal"
enUS = "Pays beavers more as population increases. This is multiplied by the number of adults above the Minimum Population, then added to Pay."
zhCN = "“随着人口增加，支付给海狸的工资也会增加。这一金额将乘以超过最低人口的成年海狸数量，然后加到工资中。”"
zhTW = "隨著人口增加，支付給海狸的工資也會增加。這會根據超過最小人口的成年海狸數量進行乘法計算，然後加到工資上。"
ruRU = "Платит бобрам больше по мере увеличения населения. Это умножается на количество взрослых особей сверх минимального населения, затем добавляется к зарплате."
jaJP = "人口が増えるにつれてビーバーに支払う金額が増加します。これは最小人口を超える大人の数に掛け算され、その後支給額に加算されます。"
frFR = "Rémunère les castors davantage à mesure que la population augmente. Ceci est multiplié par le nombre d'adultes en excès par rapport à la population minimale, puis ajouté à la rémunération."
deDE = "Bezahlen Sie Biber mehr, wenn die Bevölkerung wächst. Dies wird mit der Anzahl der Erwachsenen über der Mindestbevölkerung multipliziert und dann zum Gehalt hinzugefügt."
plPL = "Podnosi płace bobrom w miarę wzrostu populacji. Jest to pomnożone przez liczbę dorosłych ponad minimalną populację, a następnie dodawane do wynagrodzenia."
ptBR = "Paga aos castores mais à medida que a população aumenta. Isso é multiplicado pelo número de adultos acima da População Mínima, então adicionado ao Salário."
koKR = "인구가 증가함에 따라 비버에게 더 많은 급여를 지급합니다. 이는 최소 인구를 초과하는 성인 수에 의해 곱해진 후 급여에 추가됩니다."
trTR = "Popülasyon arttıkça kunduzlara daha fazla ödeme yapar. Bu, Min Popülasyondaki yetişkin sayısından fazlası için olan yetişkin sayısı ile çarpılır, ardından Ödeme'ye eklenir."
esES = "Paga más a los castores a medida que aumenta la población. Esto se multiplica por el número de adultos que superan la población mínima y luego se suma al salario."
itIT = "Paga di più i castori man mano che la popolazione aumenta. Questo importo viene moltiplicato per il numero di adulti in eccesso rispetto alla Popolazione minima, poi aggiunto alla Paga."
ukUA = "Що більше населення, то більше платить бобрам. Це значення множиться на кількість дорослих понад мінімальну чисельність населення, а потім додається до оплати."
thTH = "จ่ายค่าจ้างให้ชาวบีเวอร์มากขึ้นเมื่อประชากรเพิ่มขึ้น ค่านี้จะคูณด้วยจำนวนผู้ใหญ่ที่เกินประชากรขั้นต่ำ แล้วนำไปบวกกับค่าจ้าง"
csCZ = "Vyplácí bobrům více peněz, jak roste populace. To se násobí počtem dospělých nad minimální populaci a poté se přičítá k výplatě."
viVN = "Trả lương cho loài rái cá nhiều hơn khi dân số tăng. Điều này được nhân với số lượng người lớn vượt quá Dân Số Tối Thiểu, sau đó được cộng vào Lương."
caES = "Paga més als castors a mesura que augmenta la població. Això es multiplica pel nombre d'adults que supera la població mínima i després s'afegeix a la paga."
beBY = "Па меры росту насельніцтва бабры атрымліваюць больш аплаты. Гэта значэнне памнажаецца на колькасць дарослых асобін звыш мінімальнага насельніцтва, а затым дадаецца да аплаты."
roRO = "Plătește castorii mai mult pe măsură ce populația crește. Această sumă se înmulțește cu numărul de adulți peste Populația minimă, apoi se adaugă la plată."
huHU = "A hódoknak nagyobb fizetést ad, ahogy nő a népesség. Ezt meg kell szorozni a minimális népességet meghaladó felnőttek számával, majd hozzá kell adni az alapfizetéshez."
arSA = "يزيد أجور القنادس مع زيادة عدد السكان. يُضرب هذا المبلغ في عدد البالغين الذين يتجاوزون الحد الأدنى للسكان، ثم يُضاف إلى الأجر."

