["Building.TWStampMill.Description"]
raw = "Faster and more efficient than an arrastra.\n● <b><YellowHighlight>Tip:</YellowHighlight></b> Area under the rear platform requires supports or to be built on hillside."
status = "normal"
enUS = "Faster and more efficient than an arrastra.  \n● <b><YellowHighlight>Tip:</YellowHighlight></b> Area under the rear platform requires supports or must be built on a hillside."
zhCN = "比磨坊更快、更高效。\n● <b><YellowHighlight>提示：</YellowHighlight></b> 后平台下方区域需要支撑或在山坡上建造。"
zhTW = "比水磨更快速且效率更高。\n● <b><YellowHighlight>提示：</YellowHighlight></b> 後平台下方區域需要支撐或建造在山坡上。"
ruRU = "Быстрее и эффективнее, чем аррастра.  \n● <b><YellowHighlight>Совет:</YellowHighlight></b> Площадь под задней платформой требует опор или должна быть построена на склоне."
jaJP = "「アラスターよりも速く、効率的です。\n● <b><YellowHighlight>ヒント：</YellowHighlight></b> 後部プラットフォームの下のエリアにはサポートが必要です、または山の斜面に建設する必要があります。」"
frFR = "Plus rapide et plus efficace qu'un arrastra.\n● <b><YellowHighlight>Astuce :</YellowHighlight></b> La zone sous la plateforme arrière nécessite des supports ou doit être construite sur une colline."
deDE = "Schneller und effizienter als eine Arrastra.  \n● <b><YellowHighlight>Hinweis:</YellowHighlight></b> Der Bereich unter der hinteren Plattform benötigt Stütze oder muss am Hang gebaut werden."
plPL = "Szybszy i bardziej wydajny niż arrastra.  \n● <b><YellowHighlight>Wskazówka:</YellowHighlight></b> Obszar pod tylną platformą wymaga podpór lub musi być zbudowany na zboczu."
ptBR = "Mais rápido e mais eficiente do que uma arrastra.  \n● <b><YellowHighlight>Dica:</YellowHighlight></b> A área sob a plataforma traseira requer suportes ou deve ser construída em uma ladeira."
koKR = "아라스트라보다 더 빠르고 효율적입니다.\n● <b><YellowHighlight>팁:</YellowHighlight></b> 뒷 플랫폼 아래 지역은 지지대가 필요하거나 경사면에 건설해야 합니다."
trTR = "Bir arrastradan daha hızlı ve daha verimlidir.  \n● <b><YellowHighlight>İpucu:</YellowHighlight></b> Arka platformun altındaki alan destek gerektirir veya yamaçta inşa edilmelidir."
esES = "Más rápida y eficiente que una arrastra.\n● <b><YellowHighlight>Consejo:</YellowHighlight></b> El área bajo la plataforma trasera requiere soportes o debe estar construida en una ladera."
itIT = "Più veloce ed efficiente di un’arrastra.\n● <b><YellowHighlight>Consiglio:</YellowHighlight></b> L’area sotto la piattaforma posteriore richiede supporti oppure deve essere costruita su un pendio."
ukUA = "Швидший і ефективніший за аррастру.\n● <b><YellowHighlight>Порада:</YellowHighlight></b> Для ділянки під задньою платформою потрібні опори або будівлю слід звести на схилі."
thTH = "ทำงานได้เร็วกว่าและมีประสิทธิภาพมากกว่าเครื่องโม่แร่แบบอาร์รัสตรา\n● <b><YellowHighlight>เคล็ดลับ:</YellowHighlight></b> พื้นที่ใต้แท่นด้านหลังต้องมีเสาค้ำ หรือสร้างบนไหล่เขา"
csCZ = "Rychlejší a efektivnější než arrastra.  \n● <b><YellowHighlight>Tip:</YellowHighlight></b> Oblast pod zadní platformou vyžaduje podpěry nebo musí být postavena na svahu."
viVN = "Nhan đề: Building.TWStampMill.Description - Văn bản mới để dịch: \"Nhanh hơn và hiệu quả hơn so với arrastra. ● <b><YellowHighlight>Mẹo:</YellowHighlight></b> Khu vực dưới nền tảng sau cần có hỗ trợ hoặc phải xây dựng trên sườn đồi.\""
caES = "Més ràpid i eficient que una arrastra.\n● <b><YellowHighlight>Consell:</YellowHighlight></b> L'àrea sota la plataforma posterior requereix suports o bé que es construeixi en un vessant."
beBY = "Хутчэйшы і больш эфектыўны за арастру.\n● <b><YellowHighlight>Парада:</YellowHighlight></b> Для ўчастка пад задняй платформай патрэбныя апоры або размяшчэнне будынка на схіле."
roRO = "Mai rapidă și mai eficientă decât o arrastra.\n● <b><YellowHighlight>Sfat:</YellowHighlight></b> Zona de sub platforma din spate necesită suporturi sau trebuie construită pe un versant."
huHU = "Gyorsabb és hatékonyabb, mint egy arrasztra.\n● <b><YellowHighlight>Tipp:</YellowHighlight></b> A hátsó platform alatti területet alá kell támasztani, vagy domboldalra kell építeni."
arSA = "أسرع وأكثر كفاءة من الأراسترا.\n● <b><YellowHighlight>نصيحة:</YellowHighlight></b> تتطلب المنطقة أسفل المنصة الخلفية دعامات، أو يجب بناء المبنى على سفح تل."

