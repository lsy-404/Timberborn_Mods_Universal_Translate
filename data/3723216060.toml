["Building.TWMineEngineerOffice.Description"]
raw = "Marks nearby accessible ore for mining. The player can usually do a better job, but this reduces micro-management"
status = "normal"
enUS = "Marks nearby accessible ore for mining. The player can usually do a better job, but this reduces micro-management."
zhCN = "“标记附近可开采的矿石。玩家通常能做得更好，但这减轻了微观管理的压力。”"
zhTW = "標示附近可開採的礦石。玩家通常能做得更好，但這減少了微觀管理。"
ruRU = "ОтмечаетNearby доступные руды для добычи. Игрок обычно может сделать это лучше, но это уменьшает микро-менеджмент."
jaJP = "近くのアクセス可能な鉱石を採掘のためにマークします。プレイヤーが通常はより良い作業を行えますが、これによりマイクロマネジメントが減少します。"
frFR = "Marque les minerais accessibles à proximité pour l'exploitation. Le joueur peut généralement faire un meilleur travail, mais cela réduit la micro-gestion."
deDE = "Markiert in der Nähe zugängliche Erze zum Abbau. Der Spieler kann normalerweise einen besseren Job machen, aber das reduziert das Mikromanagement."
plPL = "Zaznacza pobliskie dostępne rudy do wydobycia. Gracz zazwyczaj może wykonać to lepiej, ale to zmniejsza mikrozarządzanie."
ptBR = "Marca minério acessível próximo para mineração. O jogador geralmente pode fazer um trabalho melhor, mas isso reduz a microgestão."
koKR = "근처의 접근 가능한 광석을 채굴을 위해 표시합니다. 플레이어가 보통 더 잘 수행할 수 있지만, 이는 세부 관리의 필요성을 줄여줍니다."
trTR = "Yakındaki erişilebilir madenleri madencilik için işaretler. Oyuncu genellikle daha iyi bir iş çıkarabilir, ancak bu mikro yönetime gerek duyulmasını azaltır."
csCZ = "Označuje blízké dostupné rudy k těžbě. Hráč obvykle udělá lepší práci, ale to snižuje mikro management."
viVN = "Đánh dấu quặng gần đó có thể khai thác. Người chơi thường có thể làm tốt hơn, nhưng điều này giảm thiểu việc quản lý vi mô."

