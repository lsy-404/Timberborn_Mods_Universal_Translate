["Building.TWTailingsDump.Description"]
raw = "A place to dump mill pulp or tailings. Mill pulp can be recovered for later processing.\n● <b><YellowHighlight>Tip:</YellowHighlight></b> Must overhang an edge, the same as a water discharge building.\n● <b><RedHighlight>Caution!</RedHighlight></b> Tailings flows will destroy most buildings. Use levees to contain it."
status = "normal"
enUS = "A place to dump mill pulp or tailings. Mill pulp can be recovered for later processing.  \n● <b><YellowHighlight>Tip:</YellowHighlight></b> Must overhang an edge, the same as a water discharge building.  \n● <b><RedHighlight>Caution!</RedHighlight></b> Tailings flows will destroy most buildings. Use levees to contain it."
zhCN = "一个倾倒磨坊浆料或尾矿的地方。磨坊浆料可以回收以便后续处理。\n● <b><YellowHighlight>提示：</YellowHighlight></b> 必须悬挂在边缘上，与水排放建筑相同。\n● <b><RedHighlight>注意！</RedHighlight></b> 尾矿流将摧毁大多数建筑物。使用堤坝来控制它。"
zhTW = "用來傾倒磨粉或尾礦的地方。磨粉可以被回收以供後續處理。\n● <b><YellowHighlight>提示：</YellowHighlight></b> 必須懸空於邊緣，與水排放建築一樣。\n● <b><RedHighlight>注意！</RedHighlight></b> 尾礦流會摧毀大多數建築物。使用堤壩來控制。"
ruRU = "Место для сброса пульпы или хвостов. Пульпу можно récupérer для последующей переработки.\n● <b><YellowHighlight>Совет:</YellowHighlight></b> Должен свисать с края, как и здание для сброса воды.\n● <b><RedHighlight>Предупреждение!</RedHighlight></b> Хвосты могут уничтожить большинство зданий. Используйте плотины для их сдерживания."
jaJP = "ミルパルプや鉱滓を捨てる場所です。ミルパルプは後で処理するために回収できます。\n● <b><YellowHighlight>ヒント：</YellowHighlight></b> 流体捨て場と同様に、端にオーバーハングする必要があります。\n● <b><RedHighlight>注意！</RedHighlight></b> 鉱滓の流れはほとんどの建物を破壊します。堤防を使って抑制してください。"
frFR = "Un endroit pour déverser la pulpe de moulin ou les résidus. La pulpe de moulin peut être récupérée pour un traitement ultérieur.\n● <b><YellowHighlight>Conseil :</YellowHighlight></b> Doit dépasser un bord, tout comme un bâtiment de décharge d'eau.\n● <b><RedHighlight>Attention !</RedHighlight></b> Les débits de résidus détruiront la plupart des bâtiments. Utilisez des digues pour les contenir."
deDE = "Ein Ort, um Mühlenschlamm oder Abfälle abzuladen. Mühlenschlamm kann zur späteren Verarbeitung zurückgewonnen werden.  \n● <b><YellowHighlight>Hinweis:</YellowHighlight></b> Muss über einen Rand hinausragen, wie ein Gebäude zur Wasserableitung.  \n● <b><RedHighlight>Vorsicht!</RedHighlight></b> Abwässer zerstören die meisten Gebäude. Verwenden Sie Deiche, um sie einzudämmen."
plPL = "Miejsce do składowania pulpy młynarskiej lub odpadów. Pulpę młynarską można odzyskać do późniejszego przetworzenia.\n● <b><YellowHighlight>Wskazówka:</YellowHighlight></b> Musi wystawać poza krawędź, tak samo jak budynek do zrzutu wody.\n● <b><RedHighlight>Ostrzeżenie!</RedHighlight></b> Przepływy odpadów zniszczą większość budynków. Użyj wałów, aby je ograniczyć."
ptBR = "Um lugar para despejar polpa de moinho ou rejeitos. A polpa de moinho pode ser recuperada para processamento posterior.  \n● <b><YellowHighlight>Dica:</YellowHighlight></b> Deve se projetar para uma borda, assim como um prédio de descarga de água.  \n● <b><RedHighlight>Atenção!</RedHighlight></b> Fluxos de rejeitos destruirão a maioria dos edifícios. Use diques para contê-los."
koKR = "밀 펄프나 폐기물을 버리는 장소입니다. 밀 펄프는 나중에 가공하기 위해 회수할 수 있습니다.\n● <b><YellowHighlight>팁:</YellowHighlight></b> 수질 배출 건물과 마찬가지로 가장자리를 넘겨야 합니다.\n● <b><RedHighlight>경고!</RedHighlight></b> 폐기물이 흐르면 대부분의 건물이 파괴됩니다. 제방을 사용하여 방수하십시오."
trTR = "Değirmen hamurunu veya atıkları boşaltmak için bir yer. Değirmen hamuru daha sonra işlenmek üzere geri kazanılabilir.\n● <b><YellowHighlight>İpucu:</YellowHighlight></b> Bir kenardan sarkması gerekir, bir su boşaltma binası gibi.\n● <b><RedHighlight>Dikkat!</RedHighlight></b> Atık akışları çoğu bina yok edebilir. Kontrolü sağlamak için setler kullanın."
esES = "Un lugar para descargar pulpa de molino o relaves. La pulpa de molino puede recuperarse para procesarla más adelante.\n● <b><YellowHighlight>Consejo:</YellowHighlight></b> Debe sobresalir por encima de un borde, igual que un edificio de descarga de agua.\n● <b><RedHighlight>¡Precaución!</RedHighlight></b> Los flujos de relaves destruirán la mayoría de los edificios. Usa diques para contenerlos."
itIT = "Un luogo in cui scaricare polpa di macinazione o sterili. La polpa di macinazione può essere recuperata per una lavorazione successiva.\n● <b><YellowHighlight>Consiglio:</YellowHighlight></b> Deve sporgere oltre un bordo, come un edificio di scarico dell'acqua.\n● <b><RedHighlight>Attenzione!</RedHighlight></b> I flussi di sterili distruggeranno la maggior parte degli edifici. Usa argini per contenerli."
ukUA = "Місце для скидання пульпи з млина або хвостів. Пульпу з млина можна зібрати для подальшої обробки.\n● <b><YellowHighlight>Порада:</YellowHighlight></b> Має нависати над краєм, так само як споруда для скидання води.\n● <b><RedHighlight>Увага!</RedHighlight></b> Потоки хвостів знищать більшість споруд. Стримуйте їх за допомогою валів."
thTH = "สถานที่สำหรับทิ้งเยื่อจากโรงสีหรือกากแร่ เยื่อจากโรงสีสามารถเก็บกลับมาเพื่อแปรรูปภายหลังได้\n● <b><YellowHighlight>เคล็ดลับ:</YellowHighlight></b> ต้องยื่นพ้นขอบ เช่นเดียวกับอาคารระบายน้ำ\n● <b><RedHighlight>ระวัง!</RedHighlight></b> กระแสกากแร่จะทำลายอาคารส่วนใหญ่ ใช้คันกั้นน้ำเพื่อกักมันไว้"
csCZ = "Místo pro vykládku mlýnského kaše nebo odpadu. Mlýnskou kaši lze znovu využít pro pozdější zpracování.  \n● <b><YellowHighlight>Tip:</YellowHighlight></b> Musí být přes okraj, stejně jako budova na vypouštění vody.  \n● <b><RedHighlight>Varování!</RedHighlight></b> Odpady zničí většinu budov. Použijte hráze pro její zadržení."
viVN = "Nơi để đổ bã xay hoặc chất thải. Bã xay có thể được thu hồi để xử lý sau.\n● <b><YellowHighlight>Mẹo:</YellowHighlight></b> Phải vượt qua một cạnh, giống như một tòa nhà xả nước.\n● <b><RedHighlight>Cảnh báo!</RedHighlight></b> Dòng chất thải sẽ phá hủy hầu hết các tòa nhà. Sử dụng đê để kiềm chế nó."
caES = "Un lloc on abocar la polpa del molí o els residus miners. La polpa del molí es pot recuperar per processar-la més endavant.\n● <b><YellowHighlight>Consell:</YellowHighlight></b> Ha de sobresortir per damunt d'una vora, igual que un edifici de descàrrega d'aigua.\n● <b><RedHighlight>Precaució!</RedHighlight></b> Els fluxos de residus destruiran la majoria dels edificis. Feu servir motes per contenir-los."
beBY = "Месца для скіду млынавай пульпы або хвастоў. Млынавую пульпу можна сабраць для далейшай перапрацоўкі.\n● <b><YellowHighlight>Парада:</YellowHighlight></b> Павінна навісаць над краем, як і будынак для скіду вады.\n● <b><RedHighlight>Увага!</RedHighlight></b> Патокі хвастоў знішчаць большасць будынкаў. Стрымлівайце іх дамбамі."
roRO = "Un loc unde să deversați pulpa de la moară sau sterilul. Pulpa de la moară poate fi recuperată pentru procesare ulterioară.\n● <b><YellowHighlight>Sfat:</YellowHighlight></b> Trebuie să iasă peste o margine, la fel ca o clădire de evacuare a apei.\n● <b><RedHighlight>Atenție!</RedHighlight></b> Fluxurile de steril vor distruge majoritatea clădirilor. Folosiți diguri pentru a-l reține."
huHU = "Hely az őrlési zagy vagy meddő lerakására. Az őrlési zagy későbbi feldolgozás céljából visszanyerhető.\n● <b><YellowHighlight>Tipp:</YellowHighlight></b> Egy perem fölé kell nyúlnia, akárcsak a vízkivezető épületnek.\n● <b><RedHighlight>Figyelem!</RedHighlight></b> A meddőanyag-áramlások elpusztítják a legtöbb épületet. Töltésekkel tartsd kordában."
arSA = "مكان لإلقاء لبّ الطاحونة أو المخلفات. يمكن استعادة لبّ الطاحونة لمعالجته لاحقًا.\n● <b><YellowHighlight>نصيحة:</YellowHighlight></b> يجب أن يتدلى فوق حافة، مثل مبنى تصريف المياه.\n● <b><RedHighlight>تحذير!</RedHighlight></b> ستدمّر تدفقات المخلفات معظم المباني. استخدم السدود الترابية لاحتوائها."

