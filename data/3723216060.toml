["ModSetting.TWMoreMines.ExtraFactionIDsDesc"]
raw = "Add new factions to the list of More Mines supported factions. This is NOT officially supported, but may help people using faction mixer mods. Type the exact faction ID here. Case-sensitive. No spaces unless they are part of the ID. Multiple IDs can be separated with a semicolon."
status = "normal"
enUS = "Add new factions to the list of More Mines supported factions. This is NOT officially supported, but may help people using faction mixer mods. Type the exact faction ID here. Case-sensitive. No spaces unless they are part of the ID. Multiple IDs can be separated with a semicolon."
zhCN = "“将新派系添加到更多矿井支持的派系列表中。这不是正式支持，但可能对使用派系混合器模组的人有帮助。在此输入确切的派系ID。区分大小写。不得包含空格，除非它们是ID的一部分。多个ID可以用分号分隔。”"
zhTW = "新增派系至「更多礦坑」支援的派系清單。這並不是官方支援，但可能對使用派系混合模組的玩家有幫助。在這裡輸入確切的派系ID。大小寫敏感。如非ID的一部分，請勿使用空格。多個ID可以用分號分隔。"
ruRU = "Добавьте новые фракции в список поддерживаемых фракций More Mines. Это НЕофициально поддерживается, но может помочь людям, использующим моды для смешивания фракций. Введите точный идентификатор фракции здесь. Учитывается регистр. Без пробелов, если они не являются частью идентификатора. Несколько идентификаторов можно разделить с помощью точки с запятой."
jaJP = "「More Minesがサポートする派閥のリストに新しい派閥を追加します。これは公式にはサポートされていませんが、派閥ミキサーモッドを使用している人々に役立つかもしれません。正確な派閥IDをここに入力してください。大文字と小文字が区別されます。IDの一部でない限り、スペースを含めないでください。複数のIDはセミコロンで区切ることができます。」"
frFR = "Ajoutez de nouvelles factions à la liste des factions supportées par More Mines. Cela n'est PAS pris en charge officiellement, mais peut aider les personnes utilisant des mods de mélange de factions. Tapez l'ID de faction exact ici. Sensible à la casse. Pas d'espaces à moins qu'ils ne fassent partie de l'ID. Plusieurs IDs peuvent être séparés par un point-virgule."
deDE = "Fügen Sie neue Fraktionen zur Liste der von More Mines unterstützten Fraktionen hinzu. Dies wird NICHT offiziell unterstützt, könnte jedoch Personen helfen, die Faction-Mixer-Mods verwenden. Geben Sie die genaue Fraktions-ID hier ein. Groß- und Kleinschreibung beachten. Keine Leerzeichen, es sei denn, sie sind Teil der ID. Mehrere IDs können mit einem Semikolon getrennt werden."
plPL = "Dodaj nowe frakcje do listy obsługiwanych frakcji w More Mines. To NIE jest oficjalnie wspierane, ale może pomóc osobom korzystającym z modów mieszających frakcje. Wpisz dokładny identyfikator frakcji tutaj. Wrażliwe na wielkość liter. Bez spacji, chyba że są częścią identyfikatora. Wiele identyfikatorów można oddzielić średnikiem."
ptBR = "Adicione novas facções à lista de facções suportadas por More Mines. Isso NÃO é oficialmente suportado, mas pode ajudar pessoas que usam mods de mistura de facções. Digite o ID exato da facção aqui. Sensível a maiúsculas e minúsculas. Sem espaços, a menos que façam parte do ID. IDs múltiplos podem ser separados por um ponto e vírgula."
koKR = "More Mines에서 지원되는 진영 목록에 새로운 진영을 추가합니다. 이는 공식적으로 지원되지 않지만, 진영 믹서 모드를 사용하는 데 도움이 될 수 있습니다. 여기에서 정확한 진영 ID를 입력하세요. 대소문자를 구분합니다. ID의 일부가 아닌 한 공백을 사용하지 마세요. 여러 ID는 세미콜론으로 구분할 수 있습니다."
trTR = "More Mines tarafından desteklenen fraksiyonlar listesine yeni fraksiyonlar ekleyin. Bu resmi olarak desteklenmemektedir, ancak fraksiyon karıştırıcı modları kullananlara yardımcı olabilir. Buraya tam fraksiyon kimliğini yazın. Büyük/küçük harf duyarlıdır. ID'nin bir parçası olmadığı sürece boşluk bırakmayın. Birden fazla ID, bir noktalı virgül ile ayrılabilir."
esES = "Añade nuevas facciones a la lista de facciones compatibles con More Mines. Esto NO cuenta con soporte oficial, pero puede ayudar a quienes usan mods de mezcla de facciones. Escribe aquí el ID exacto de la facción. Distingue entre mayúsculas y minúsculas. No uses espacios, salvo que formen parte del ID. Puedes separar varios ID con punto y coma."
itIT = "Aggiungi nuove fazioni all'elenco delle fazioni supportate da More Mines. Questa funzionalità NON è supportata ufficialmente, ma può essere utile a chi usa mod per mescolare le fazioni. Inserisci qui l'ID esatto della fazione. Distingue tra maiuscole e minuscole. Non usare spazi, a meno che non facciano parte dell'ID. Puoi separare più ID con un punto e virgola."
ukUA = "Додає нові фракції до списку фракцій, підтримуваних More Mines. Це НЕ підтримується офіційно, але може допомогти тим, хто користується модами для змішування фракцій. Введіть тут точний ID фракції. З урахуванням регістру. Пробіли заборонені, якщо вони не є частиною ID. Кілька ID можна розділити крапкою з комою."
thTH = "เพิ่มฝ่ายใหม่ลงในรายการฝ่ายที่ More Mines รองรับ ฟีเจอร์นี้ไม่ได้รับการรองรับอย่างเป็นทางการ แต่อาจช่วยผู้ที่ใช้ม็อดผสมฝ่ายได้ ป้อน ID ฝ่ายให้ตรงทุกตัวอักษรที่นี่ โดยคำนึงถึงตัวพิมพ์เล็ก-ใหญ่ ห้ามเว้นวรรค เว้นแต่ ID จะมีช่องว่างอยู่ด้วย สามารถคั่น ID หลายรายการด้วยอัฒภาคได้"
csCZ = "Přidejte nové frakce do seznamu podporovaných frakcí pro More Mines. Toto NENÍ oficiálně podporováno, ale může pomoci lidem používajícím míchací modifikace frakcí. Zadejte zde přesné ID frakce. Citlivé na velikost písmen. Žádné mezery, pokud nejsou součástí ID. Více ID může být odděleno středníkem."
viVN = "Thêm các phe mới vào danh sách các phe được hỗ trợ bởi More Mines. Đây KHÔNG được hỗ trợ chính thức, nhưng có thể giúp người dùng các mod pha trộn phe. Nhập chính xác ID phe ở đây. Phân biệt chữ hoa chữ thường. Không có khoảng trắng trừ khi nó là một phần của ID. Nhiều ID có thể được phân tách bằng dấu chấm phẩy."
caES = "Afegeix faccions noves a la llista de faccions compatibles amb More Mines. Això NO té suport oficial, però pot ajudar les persones que utilitzen mods de barreja de faccions. Escriu aquí l’ID exacte de la facció. Distingeix entre majúscules i minúscules. No hi posis espais, tret que formin part de l’ID. Pots separar diversos ID amb un punt i coma."
beBY = "Дадайце новыя фракцыі ў спіс фракцый, якія падтрымлівае мод More Mines. Гэта НЕ афіцыйна падтрымліваецца, але можа дапамагчы карыстальнікам модаў-міксараў фракцый. Упісвайце сюды дакладны ідэнтыфікатар фракцыі. Рэгістр улічваецца. Прабелы не ставіце, за выключэннем выпадкаў, калі яны з'яўляюцца часткай ідэнтыфікатара. Некалькі ідэнтыфікатараў можна аддзяляць кропкай з коскай."
roRO = "Adaugă noi facțiuni în lista facțiunilor suportate de More Mines. Acest lucru NU este suportat oficial, dar poate ajuta persoanele care folosesc mod-uri de amestecare a facțiunilor. Scrie aici ID-ul exact al facțiunii. Este sensibil la majuscule și minuscule. Fără spații, cu excepția cazului în care fac parte din ID. ID-urile multiple pot fi separate prin punct și virgulă."
huHU = "Adj hozzá új frakciókat a More Mines által támogatott frakciók listájához. Ez NEM hivatalosan támogatott, de segíthet azoknak, akik frakciókeverő modokat használnak. Ide írd be a pontos frakcióazonosítót. Kis- és nagybetű-érzékeny. Szóközt csak akkor használj, ha az a azonosító része. Több azonosító pontosvesszővel választható el egymástól."
arSA = "أضف فصائل جديدة إلى قائمة الفصائل المدعومة في More Mines. هذا غير مدعوم رسميًا، لكنه قد يساعد الأشخاص الذين يستخدمون تعديلات خلط الفصائل. اكتب معرّف الفصيل بالضبط هنا. حساس لحالة الأحرف. لا تضع مسافات إلا إذا كانت جزءًا من المعرّف. يمكن فصل معرّفات متعددة بفاصلة منقوطة."

["Building.PathPlatformTunnel.Description"]
raw = "Tunnel through terrain, replacing it with mine timbers and a Path. Use the layer tool to see under terrain or structures."
status = "normal"
enUS = "Tunnel through terrain, replacing it with mine timbers and a Path. Use the layer tool to see under terrain or structures."
zhCN = "在地形中挖掘隧道，用矿木和道路替代它。使用层级工具查看地形或结构下方。"
zhTW = "穿越地形的隧道，將其替換為礦木和小路。使用圖層工具查看地形或建築物下方。"
ruRU = "Tуннель через местность, заменяющий её горными брусьями и путём. Используйте инструмент слоя, чтобы видеть под поверхностью земли или под конструкциями."
jaJP = "地形をトンネルで貫通し、鉱山の木材と道に置き換えます。レイヤーツールを使用して、地形や構造物の下を確認してください。"
frFR = "Tunnel à travers le terrain, le remplaçant par des poutres de mine et un chemin. Utilisez l'outil de couche pour voir sous le terrain ou les structures."
deDE = "Tunnel durch das Terrain und ersetze es durch Minenholz und einen Weg. Verwende das Ebenenwerkzeug, um unter das Terrain oder Strukturen zu sehen."
plPL = "Tunel przez teren, zastępując go drewnami górniczymi i Ścieżką. Użyj narzędzia warstw, aby zobaczyć pod terenem lub strukturami."
ptBR = "Túnel através do terreno, substituindo-o por madeira de mina e um Caminho. Use a ferramenta de camada para ver sob o terreno ou estruturas."
koKR = "지형을 관통하여 광산 목재와 경로로 대체하는 터널을 만듭니다. 층 도구를 사용하여 지형이나 구조물 아래를 확인하세요."
trTR = "Yer altından tünel açarak onu maden kirişleri ve bir Patika ile değiştirir. Arazi veya yapıların altını görmek için katman aracını kullanın."
esES = "Excava a través del terreno, reemplazándolo con vigas de mina y un sendero. Usa la herramienta de capas para ver debajo del terreno o de las estructuras."
itIT = "Scava gallerie attraverso il terreno, sostituendolo con travi di puntellatura da miniera e un sentiero. Usa lo strumento a strati per vedere sotto il terreno o le strutture."
ukUA = "Прокладайте тунелі крізь ґрунт, замінюючи його шахтними кріпленнями та стежкою. Використовуйте інструмент шарів, щоб бачити під ґрунтом або спорудами."
thTH = "เจาะอุโมงค์ผ่านพื้นดิน โดยแทนที่ด้วยไม้ค้ำเหมืองและทางเดิน ใช้เครื่องมือเลเยอร์เพื่อดูใต้พื้นดินหรือโครงสร้าง"
csCZ = "Tunel skrze terén, nahrazující ho důlními trámy a cestou. Použijte nástroj pro vrstvy, abyste viděli pod terénem nebo strukturami."
viVN = "Kết nối qua địa hình, thay thế nó bằng các thanh gỗ mỏ và một Đường. Sử dụng công cụ lớp để xem bên dưới địa hình hoặc cấu trúc."
caES = "Excaveu a través del terreny, substituint-lo per fustes de mina i un camí. Useu l'eina de capes per veure sota el terreny o les estructures."
beBY = "Пракопвайце рэльеф, замяняючы яго шахтнымі крапамі і сцежкай. Выкарыстоўвайце інструмент слаёў, каб бачыць пад рэльефам або пабудовамі."
roRO = "Săpați un tunel prin teren, înlocuind terenul cu grinzi de mină și o cale. Folosiți instrumentul de straturi pentru a vedea sub teren sau sub construcții."
huHU = "Alagútfúrás a terepen át, amelyet bányatartó gerendákra és ösvényre cserél. A rétegnézet eszközzel láthatod a terep vagy a építmények alatti részt."
arSA = "احفر نفقًا عبر التضاريس، مستبدلًا إياها بدعامات خشبية للمناجم ومسار. استخدم أداة الطبقات لرؤية ما تحت التضاريس أو المنشآت."

