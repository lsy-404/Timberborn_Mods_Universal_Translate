deDE = "Ein Tunnel mit einem Weg, aber ohne Bodenunterstützung.  \n● <RedHighlight>Vorsicht!</RedHighlight> Kann zum Einsturz von nicht gestütztem Gelände oder Gebäuden führen. Mit Vorsicht verwenden."
plPL = "Tunel z drogą, ale bez wsparcia gruntowego.  \n● <RedHighlight>Uwaga!</RedHighlight> Może spowodować zapaść niepodpartych terenów lub budynków. Używaj ostrożnie."
ptBR = "Um túnel com um caminho, mas sem suporte no solo.  \n● <RedHighlight>Cuidado!</RedHighlight> Pode causar colapso do terreno ou edifícios sem suporte. Use com cautela."
koKR = "지하철은 경로가 있지만 지지대가 없습니다.  \n● <RedHighlight>주의!</RedHighlight> 지지되지 않는 지형이나 건물의 붕괴를 초래할 수 있습니다. 주의해서 사용하세요."
