ruRU = "Отметьте зоны, которые не хотите добывать автоматически. Должен использоваться на поверхности и запрещает все блоки ниже (или выше, если есть свисания)."
jaJP = "自動採掘を希望しないエリアを指定します。地表レベルで使用する必要があり、下（またはオーバーハングの場合は上）のすべてのブロックを禁止します。"
frFR = "Marquez les zones que vous ne souhaitez pas faire auto-extraire. Doit être utilisé au niveau de la surface et interdit tous les blocs en dessous (ou au-dessus, en cas de surplombs)."
