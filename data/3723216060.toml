["Building.TWPastryOven.FlavorDescription"]
raw = "There are two kinds of beavers: those who prefer the filling, and those who prefer the wooden pie pans."
status = "normal"
enUS = "There are two kinds of beavers: those who prefer the filling and those who prefer the wooden pie pans."
zhCN = "有两种海狸：一种喜欢馅料，另一种喜欢木制派盘。"
zhTW = "有兩種河狸：一種喜歡餡料，而另一種則喜歡木製派盤。"
ruRU = "Существует два вида бобров: те, кто предпочитает начинку, и те, кто предпочитает деревянные формы для пирогов."
jaJP = "ビーバーには二種類います：フィリングを好むビーバーと、木製のパイ皿を好むビーバーです。"
frFR = "Il existe deux sortes de castors : ceux qui préfèrent la garniture et ceux qui préfèrent les moules à tarte en bois."
deDE = "„Es gibt zwei Arten von Bibern: solche, die die Füllung bevorzugen, und solche, die die Holztortenschalen bevorzugen.“"
plPL = "Są dwa rodzaje bobrów: ci, którzy wolą nadzienie, i ci, którzy wolą drewniane formy do ciast."
ptBR = "Existem dois tipos de castores: aqueles que preferem o recheio e aqueles que preferem as formas de torta de madeira."
koKR = "𐰴𐰉𐰚𐰛𐰯𐰢𐰲 𐰈𐰍𐰴𐰉𐰌𐰈𐰢𐰲 𐰑𐰍𐰖𐰉𐰊: 𐰋𐰉𐰗𐰯𐰋𐰎𐰙𐰭𐰢𐰲 𐰁𐰩𐰛𐰨𐰡𐰉𐰯𐰍𐰬𐰁𐰳𐰯, 𐰁𐰩𐰛𐰗𐰉𐰋𐰩𐰚 𐰈𐰓𐰔𐰬𐰢𐰦 𐰃𐰱𐰤𐰔𐰓𐰯𐰉𐰛𐰣𐰟."
trTR = "İki tür kunduz vardır: dolguyu tercih edenler ve ahşap turta tepsilerini tercih edenler."
esES = "Hay dos tipos de castores: los que prefieren el relleno y los que prefieren los moldes de tarta de madera."
itIT = "Esistono due tipi di castori: quelli che preferiscono il ripieno e quelli che preferiscono le teglie di legno per le torte."
ukUA = "Є два типи бобрів: ті, хто віддає перевагу начинці, і ті, хто віддає перевагу дерев'яним формам для пирога."
thTH = "มีบีเวอร์อยู่สองประเภท: พวกที่ชอบไส้ในมากกว่า และพวกที่ชอบจานพายไม้มากกว่า"
csCZ = "Existují dva druhy bobrů: ti, kteří upřednostňují náplň, a ti, kteří dávají přednost dřevěným koláčovým pánvím."
viVN = "Có hai loại hải ly: những con thích nhân bánh và những con thích chén bánh bằng gỗ."
caES = "Hi ha dos tipus de castors: els que prefereixen el farcit i els que prefereixen els motlles de pastís de fusta."
beBY = "Ёсць два тыпы бабрoў: тыя, хто аддае перавагу начынцы, і тыя, хто аддае перавагу драўляным формам для пірага."
roRO = "Există două feluri de castori: cei care preferă umplutura și cei care preferă tavile de plăcintă din lemn."
huHU = "Kétfajta hód létezik: az egyik a tölteléket szereti, a másik a fa pitetálakat."
arSA = "هناك نوعان من القنادس: قنادس تفضل الحشوة، وقنادس تفضل صواني الفطائر الخشبية."

