["ModSetting.TWMoreMines.DirtclawsSectionHeaderPaySub"]
raw = "Once adult population is greater than the minimum, beavers will receive pay.\nBase pay is a flat amount, set here. Three bonus are added to it:\nPopulation bonus increases as population climbs.\nTime bonus increases each day.\nProfit-share is based on total credits in your account."
status = "normal"
enUS = "Once the adult population exceeds the minimum, beavers will receive pay.\nBase pay is a flat amount set here. Three bonuses are added to it:\nPopulation bonus increases as the population grows.\nTime bonus increases each day.\nProfit share is based on the total credits in your account."
zhCN = "成年海狸人口超过最低要求后，海狸便会获得报酬。\n基本工资为固定金额，可在此设置。另有三项奖金：\n人口奖金随人口增长而增加。\n时间奖金每天都会增加。\n利润分成根据账户中的总积分计算。"
zhTW = "成年海狸人口超過最低人數後，海狸便會領取薪資。\n基本薪資是固定金額，可在此設定。另會加上三種獎金：\n人口獎金會隨人口增加而提高。\n時間獎金每天都會增加。\n利潤分紅則依據你帳戶中的總信用點數計算。"
ruRU = "Когда численность взрослых бобров превысит минимальный порог, бобры начнут получать зарплату.\nБазовая зарплата — фиксированная сумма, которую можно задать здесь. К ней добавляются три бонуса:\nБонус за численность увеличивается по мере роста населения.\nБонус за стаж увеличивается каждый день.\nДоля от прибыли зависит от общего количества кредитов на вашем счёте."
jaJP = "成体の人口が最低人数を上回ると、ビーバーは給与を受け取ります。\n基本給はここで設定する固定額です。これに3つのボーナスが加算されます：\n人口ボーナスは人口が増えるほど大きくなります。\n勤続ボーナスは日ごとに増加します。\n利益分配は、アカウント内のクレジット総額に基づきます。"
frFR = "Dès que la population adulte dépasse le minimum, les castors reçoivent un salaire.\nLe salaire de base est un montant fixe, défini ici. Trois primes s’y ajoutent :\nLa prime de population augmente avec la population.\nLa prime d’ancienneté augmente chaque jour.\nLa participation aux bénéfices est calculée en fonction du nombre total de crédits sur votre compte."
deDE = "Sobald die erwachsene Bevölkerung über dem Minimum liegt, erhalten die Biber Lohn.\nDer Grundlohn ist ein fester Betrag, der hier festgelegt wird. Dazu kommen drei Boni:\nDer Bevölkerungsbonus steigt mit der Bevölkerungszahl.\nDer Zeitbonus steigt mit jedem Tag.\nDie Gewinnbeteiligung richtet sich nach dem Gesamtguthaben auf deinem Konto."
plPL = "Gdy populacja dorosłych przekroczy minimum, bobry będą otrzymywać wynagrodzenie.\nPodstawa wynagrodzenia to stała kwota ustalana tutaj. Dodawane są do niej trzy premie:\nPremia za populację rośnie wraz z jej wzrostem.\nPremia za czas rośnie każdego dnia.\nUdział w zyskach zależy od łącznej liczby kredytów na koncie."
ptBR = "Quando a população adulta ultrapassar o mínimo, os castores receberão pagamento.\nO pagamento-base é um valor fixo, definido aqui. Três bônus são adicionados a ele:\nO bônus populacional aumenta conforme a população cresce.\nO bônus por tempo aumenta a cada dia.\nA participação nos lucros é baseada no total de créditos na sua conta."
koKR = "성체 인구가 최소 인원보다 많아지면 비버가 급여를 받습니다.\n기본급은 여기서 설정하는 고정 금액입니다. 여기에 세 가지 보너스가 추가됩니다.\n인구 보너스는 인구가 늘어날수록 증가합니다.\n시간 보너스는 날이 지날수록 증가합니다.\n이익 분배금은 계정의 총 크레딧을 기준으로 합니다."
trTR = "Yetişkin nüfus minimumu aştığında kunduzlar ücret alır.\nTemel ücret burada belirlenen sabit bir miktardır. Buna üç bonus eklenir:\nNüfus bonusu, nüfus arttıkça yükselir.\nZaman bonusu her gün artar.\nKâr payı, hesabınızdaki toplam kredi miktarına bağlıdır."
esES = "Una vez que la población adulta sea mayor que el mínimo, los castores recibirán paga.\nEl pago base es una cantidad fija, establecida aquí. Se le suman tres bonificaciones:\nLa bonificación por población aumenta a medida que la población crece.\nLa bonificación por tiempo aumenta cada día.\nEl reparto de beneficios se basa en el total de créditos de tu cuenta."
itIT = "Una volta che la popolazione adulta supera il minimo, i castori riceveranno una paga.\nLa paga base è un importo fisso, impostato qui. A essa vengono aggiunti tre bonus:\nIl bonus di popolazione aumenta man mano che la popolazione cresce.\nIl bonus di tempo aumenta ogni giorno.\nLa quota di profitto si basa sul totale dei crediti nel tuo conto."
ukUA = "Коли доросла чисельність популяції перевищує мінімум, бобри отримуватимуть оплату.\nБазова оплата — це фіксована сума, яку задано тут. До неї додаються три бонуси:\nБонус за чисельність зростає разом із зростанням популяції.\nБонус за час зростає щодня.\nЧастка прибутку залежить від загальної кількості кредитів на вашому рахунку."
thTH = "เมื่อประชากรผู้ใหญ่มากกว่าจำนวนขั้นต่ำ บีเวอร์จะได้รับค่าจ้าง\nค่าจ้างพื้นฐานเป็นจำนวนคงที่ ซึ่งตั้งค่าได้ที่นี่ มีโบนัสสามอย่างเพิ่มเข้ามา:\nโบนัสประชากรจะเพิ่มขึ้นเมื่อประชากรเพิ่มขึ้น\nโบนัสเวลาจะเพิ่มขึ้นทุกวัน\nส่วนแบ่งกำไรขึ้นอยู่กับเครดิตรวมในบัญชีของคุณ"
csCZ = "Jakmile počet dospělých obyvatel překročí minimum, bobři dostanou výplatu.\nZákladní výplata je pevná částka nastavená zde. Přičítají se k ní tři bonusy:\nPopulační bonus se zvyšuje s růstem populace.\nČasový bonus se zvyšuje každý den.\nPodíl na zisku se odvíjí od celkového počtu kreditů na vašem účtu."
viVN = "Khi dân số trưởng thành vượt quá mức tối thiểu, hải ly sẽ được trả lương.\nLương cơ bản là một khoản cố định, được thiết lập tại đây. Có thêm ba khoản thưởng:\nThưởng dân số tăng lên khi dân số tăng.\nThưởng thời gian tăng lên mỗi ngày.\nChia sẻ lợi nhuận dựa trên tổng số tín dụng trong tài khoản của bạn."
caES = "Un cop la població adulta sigui superior al mínim, els castors rebran un salari.\nEl salari base és una quantitat fixa, establerta aquí. S'hi afegeixen tres bonificacions:\nLa bonificació de població augmenta a mesura que la població creix.\nLa bonificació de temps augmenta cada dia.\nLa participació en beneficis es basa en el total de crèdits del vostre compte."
beBY = "Пасля таго як колькасць дарослага насельніцтва перавысіць мінімум, бабры пачнуць атрымліваць аплату.\nБазавая аплата — гэта фіксаваная сума, якая задаецца тут. Да яе дадаюцца тры бонусы:\nБонус за насельніцтва павялічваецца па меры росту колькасці насельніцтва.\nБонус за час павялічваецца кожны дзень.\nДоля прыбытку разлічваецца на аснове агульнай колькасці крэдытаў на вашым рахунку."
roRO = "Odată ce populația adultă depășește minimul, castorii vor primi salariu.\nSalariul de bază este o sumă fixă, stabilită aici. La acesta se adaugă trei bonusuri:\nBonusul pentru populație crește pe măsură ce populația crește.\nBonusul pentru timp crește în fiecare zi.\nPartea din profit se bazează pe totalul creditelor din contul tău."
huHU = "Miután a felnőtt lakosság meghaladja a minimumot, a búvárok fizetést kapnak.\nAz alapfizetés egy fix összeg, amelyet itt állíthatsz be. Ehhez három bónusz adódik hozzá:\nA lakossági bónusz nő, ahogy a népesség gyarapodik.\nAz időbónusz minden nappal nő.\nA nyereségrészesedés a számládon lévő összes kredit mennyiségén alapul."
arSA = "عندما يتجاوز عدد البالغين من السكان الحد الأدنى، سيتقاضى الـبيفر أجورًا.\nالأجر الأساسي مبلغ ثابت يُحدَّد هنا. وتُضاف إليه ثلاث مكافآت:\nتزداد مكافأة السكان كلما ارتفع عدد السكان.\nتزداد مكافأة الوقت كل يوم.\nتُحسب حصة الأرباح بناءً على إجمالي الكريدت في حسابك."

