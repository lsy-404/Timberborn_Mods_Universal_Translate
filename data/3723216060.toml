["ModSetting.TWMoreMines.IgnoreAutoMineFailuresDesc"]
raw = "This option will log construction site placement errors rather than letting them cause a crash. But ignoring the error may cause other unexpected problems (cpu lag or floating objects that are deleted when the map is next loaded are most likely)."
status = "normal"
enUS = "This option will log construction site placement errors rather than allowing them to cause a crash. However, ignoring the error may lead to other unexpected issues (CPU lag or floating objects that are deleted when the map is next loaded are the most likely)."
zhCN = "此选项将记录建筑工地放置错误，而不是让它们导致崩溃。但忽略错误可能会导致其他意想不到的问题（CPU延迟或浮动物体在下次加载地图时被删除的可能性很高）。"
zhTW = "此選項將記錄建設位置錯誤，而不是讓它們造成崩潰。但忽略錯誤可能會導致其他意外問題（CPU延遲或在下次加載地圖時被刪除的漂浮物體最有可能發生）。"
ruRU = "Эта опция будет записывать ошибки размещения строительных объектов, а не позволять им вызывать сбой. Однако игнорирование ошибки может привести к другим неожиданным проблемам (задержка процессора или плавающие объекты, которые будут удалены при следующей загрузке карты, наиболее вероятны)."
jaJP = "このオプションは、建設現場の配置エラーをログに記録し、クラッシュを引き起こさないようにします。しかし、エラーを無視すると、他の予期しない問題（CPUの遅延や、次回マップを読み込んだときに削除される浮遊オブジェクトなど）が発生する可能性があります。"
frFR = "Cette option enregistrera les erreurs de placement des chantiers plutôt que de les laisser provoquer un plantage. Mais ignorer l'erreur peut causer d'autres problèmes inattendus (ralentissement du processeur ou objets flottants qui sont supprimés lors du prochain chargement de la carte, ce qui est très probable)."
deDE = "Diese Option protokolliert Fehler beim Platzieren von Baustellen, anstatt sie einen Absturz verursachen zu lassen. Das Ignorieren des Fehlers kann jedoch andere unerwartete Probleme verursachen (CPU-Verzögerungen oder schwebende Objekte, die beim nächsten Laden der Karte gelöscht werden, sind am wahrscheinlichsten)."
plPL = "Ta opcja będzie rejestrować błędy umieszczania miejsc budowy, zamiast pozwalać im na wywołanie awarii. Jednak zignorowanie błędu może spowodować inne nieoczekiwane problemy (opóźnienia CPU lub unoszące się obiekty, które są usuwane przy następnym załadowaniu mapy, są najbardziej prawdopodobne)."
ptBR = "Esta opção registrará erros de colocação de canteiros de construção em vez de permitir que eles causem uma falha. Mas ignorar o erro pode causar outros problemas inesperados (lags na CPU ou objetos flutuantes que são deletados quando o mapa é carregado novamente são os mais prováveis)."
koKR = "이 옵션은 건설 현장 배치 오류를 기록하여 충돌을 발생시키지 않도록 합니다. 그러나 오류를 무시하면 다른 예상치 못한 문제가 발생할 수 있습니다(중앙 처리 장치 지연 또는 다음 맵 로드 시 삭제되는 떠 있는 물체가 가장 흔합니다)."
trTR = "Bu seçenek, inşaat alanı yerleştirme hatalarını günlüğe kaydedecek ve çökmesine neden olmaktan kaçınacaktır. Ancak hatayı yok saymak, diğer beklenmedik sorunlara (cpu gecikmesi veya harita bir sonraki yüklendiğinde silinen yüzeydeki nesneler gibi) neden olabilir."
csCZ = "Tato volba bude zaznamenávat chyby umístění stavebních míst místo toho, aby způsobovala pád. Ignorování chyby však může způsobit další neočekávané problémy (lag v CPU nebo plovoucí objekty, které jsou s vysokou pravděpodobností smazány při příštím načtení mapy)."
viVN = "Tùy chọn này sẽ ghi lại các lỗi khi đặt công trường thay vì để chúng gây ra sự cố. Tuy nhiên, việc bỏ qua lỗi có thể gây ra các vấn đề không mong muốn khác (độ trễ CPU hoặc các vật thể nổi bị xóa khi bản đồ được tải lại lần tiếp theo là điều có khả năng xảy ra nhất)."

