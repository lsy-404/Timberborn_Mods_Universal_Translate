["UI.TW.MoreMines.PreviewSeed.TT"]
raw = "If non-zero, this seed overrides the main seed for all the settings randomization. It allows previewing the effects of different randomization levels. It only affects the preview, not the actual ore placement."
status = "normal"
enUS = "If non-zero, this seed overrides the main seed for all the settings randomization. It allows previewing the effects of different randomization levels. It only affects the preview, not the actual ore placement."
zhCN = "“如果非零，则此种子将覆盖所有设置随机化的主种子。它允许预览不同随机化水平的效果。它仅影响预览，而不影响实际的矿石放置。”"
zhTW = "如果不為零，此種子將覆蓋所有設置隨機化的主要種子。它允許預覽不同隨機化等級的效果。它僅影響預覽，而不影響實際礦石的放置。"
ruRU = "Если не нулевое, это семя переопределяет основное семя для всей рандомизации настроек. Это позволяет предварительно просмотреть эффекты различных уровней рандомизации. Это влияет только на предварительный просмотр, но не на фактическое размещение руды."
jaJP = "ゼロ以外の場合、このシードは全ての設定のランダム化に対してメインシードを上書きします。異なるランダム化レベルの影響をプレビューすることができます。これはプレビューのみに影響し、実際の鉱石配置には影響しません。"
frFR = "Si non nul, cette graine remplace la graine principale pour toute la randomisation des paramètres. Elle permet d'apercevoir les effets de différents niveaux de randomisation. Elle n'affecte que l'aperçu, pas le placement réel du minerai."
deDE = "Wenn ungleich Null, überschreibt dieser Seed den Hauptseed für die gesamte Zufallsgenerierung der Einstellungen. Er ermöglicht die Vorschau der Effekte verschiedener Zufallslevel. Er betrifft nur die Vorschau, nicht die tatsächliche Platzierung der Erze."
plPL = "Jeśli niezerowe, to ziarno zastępuje główne ziarno dla całej losowości ustawień. Umożliwia podgląd efektów różnych poziomów losowości. Dotyczy to tylko podglądu, a nie rzeczywistego rozmieszczenia rud."
ptBR = "Se diferente de zero, esta semente substitui a semente principal para toda a aleatorização das configurações. Ela permite visualizar os efeitos de diferentes níveis de aleatorização. Ela afeta apenas a prévia, não a colocação real do minério."
koKR = "0이 아닌 경우, 이 시드는 모든 설정 무작위화를 위한 기본 시드를 덮어씁니다. 이는 다양한 무작위화 수준의 효과를 미리 볼 수 있게 해줍니다. 미리 보기만 영향을 미치고 실제 광석 배치에는 영향을 주지 않습니다."
trTR = "Sıfırdan farklıysa, bu tohum tüm ayarların rastgeleleştirilmesi için ana tohumu geçersiz kılar. Farklı rastgeleleştirme seviyelerinin etkilerini önizlemeye olanak tanır. Sadece önizlemeyi etkiler, gerçek maden yerleşimini değil."
esES = "Si no es cero, esta semilla sustituye a la semilla principal para aleatorizar todos los ajustes. Permite previsualizar los efectos de distintos niveles de aleatorización. Solo afecta a la vista previa, no a la ubicación real del mineral."
itIT = "Se diverso da zero, questo seme sostituisce il seme principale per la randomizzazione di tutte le impostazioni. Consente di visualizzare in anteprima gli effetti di diversi livelli di randomizzazione. Influisce solo sull’anteprima, non sulla collocazione effettiva del minerale."
ukUA = "Якщо це зерно не дорівнює нулю, воно перевизначає основне зерно для рандомізації всіх налаштувань. Це дає змогу попередньо переглянути ефекти різних рівнів рандомізації. Воно впливає лише на попередній перегляд, а не на фактичне розміщення руди."
thTH = "หากไม่ใช่ 0 เมล็ดนี้จะใช้แทนเมล็ดหลักสำหรับการสุ่มการตั้งค่าทั้งหมด ทำให้สามารถดูตัวอย่างผลของระดับการสุ่มที่แตกต่างกันได้ โดยมีผลเฉพาะกับการแสดงตัวอย่างเท่านั้น ไม่ส่งผลต่อตำแหน่งแร่ที่วางจริง"
csCZ = "Pokud není nulový, tento seed přepíše hlavní seed pro veškerou randomizaci nastavení. Umožňuje náhled na efekty různých úrovní randomizace. Ovlivňuje pouze náhled, nikoli skutečné umístění rudy."
viVN = "Nếu khác không, hạt giống này sẽ ghi đè lên hạt giống chính cho tất cả các cài đặt ngẫu nhiên. Nó cho phép xem trước các ảnh hưởng của các mức độ ngẫu nhiên khác nhau. Nó chỉ ảnh hưởng đến việc xem trước, không phải vị trí thực tế của quặng."
caES = "Si no és zero, aquesta llavor substitueix la llavor principal per a l'aleatorització de tots els paràmetres. Permet previsualitzar els efectes de diferents nivells d'aleatorització. Només afecta la previsualització, no la distribució real del mineral."
beBY = "Калі яно не роўнае нулю, гэтае зерне замяняе асноўнае зерне для рандомізацыі ўсіх налад. Гэта дазваляе папярэдне праглядаць вынікі розных узроўняў рандомізацыі. Яно ўплывае толькі на папярэдні прагляд, а не на фактычнае размяшчэнне руды."
roRO = "Dacă este diferită de zero, această sămânță o înlocuiește pe cea principală pentru randomizarea tuturor setărilor. Permite previzualizarea efectelor diferitelor niveluri de randomizare. Afectează doar previzualizarea, nu și amplasarea efectivă a zăcămintelor de minereu."
huHU = "Ha nem nulla, ez a mag felülírja a fő magot az összes beállítás véletlenszerűsítésénél. Lehetővé teszi a különböző véletlenszerűsítési szintek hatásainak előnézetét. Csak az előnézetre van hatással, a tényleges ércelhelyezésre nincs."
arSA = "إذا كانت هذه البذرة غير صفرية، فإنها تحل محل البذرة الرئيسية في جميع إعدادات العشوائية. وتتيح معاينة تأثيرات مستويات العشوائية المختلفة. وهي تؤثر في المعاينة فقط، لا في مواضع الخام الفعلية."

