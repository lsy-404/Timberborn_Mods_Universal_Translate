["UI.TW.MoreMines.AutoOrePlacementDialog"]
raw = "This will place veins and Deep Deposits for required ores (like iron), and a random selection of optional ores (coal, salt, precious metals).\n\nIt works best on maps from 100 to 256 in size. For more control or small maps, use the manual placement functions.\n\nIt is also not guaranteed to produce perfect results each time. You may want to inspect the ore that was placed, and if you are not happy, use the 'undo last ore action' button to remove it and try again.\n\nAutomatic placement may remove ground-only objects near edge of map (undo will not replace these).\n\n<b><YellowHighlight>NOTE:</YellowHighlight></b> Ore placement may take several minutes, especially on large maps or slow computers."
status = "normal"
enUS = "This will place veins and Deep Deposits for required ores (like iron), and a random selection of optional ores (coal, salt, precious metals).\n\nIt works best on maps from 100 to 256 in size. For more control or small maps, use the manual placement functions.\n\nIt is also not guaranteed to produce perfect results each time. You may want to inspect the ore that was placed, and if you are not happy, use the 'undo last ore action' button to remove it and try again.\n\nAutomatic placement may remove ground-only objects near the edge of the map (undo will not replace these).\n\n<b><YellowHighlight>NOTE:</YellowHighlight></b> Ore placement may take several minutes, especially on large maps or slow computers."
zhCN = "这将为所需的矿石（如铁）放置矿脉和深层矿石，以及随机选择的可选矿石（煤、盐、贵金属）。\n\n在100到256大小的地图上效果最佳。对于更精确的控制或小地图，请使用手动放置功能。\n\n每次也不能保证产生完美的结果。您可能希望检查已放置的矿石，如果不满意，请使用“撤销上一个矿石操作”按钮将其移除并重试。\n\n自动放置可能会移除接近地图边缘的仅地面物体（撤销不会替换这些物体）。\n\n<b><YellowHighlight>注意：</YellowHighlight></b> 矿石放置可能需要几分钟，尤其是在大地图或慢速计算机上。"
zhTW = "這將放置所需礦石（如鐵）的礦脈和深層沉積物，以及隨機選擇的可選礦石（煤、鹽、貴金屬）。\n\n它在100到256大小的地圖上效果最佳。對於需要更多控制或小地圖的情況，請使用手動放置功能。\n\n這也不保證每次都能產生完美的結果。您可能想檢查已放置的礦石，如果不滿意，請使用「撤銷最後一次礦石行動」按鈕將其移除並重新嘗試。\n\n自動放置可能會移除靠近地圖邊緣的僅限地面物體（撤銷不會替換這些物體）。\n\n<b><YellowHighlight>注意：</YellowHighlight></b> 礦石放置可能需要幾分鐘，特別是在大型地圖或運行緩慢的電腦上。"
ruRU = "Это разместит жилы и глубокие месторождения для необходимых руд (таких как железо) и случайный набор дополнительных руд (уголь, соль, драгоценные металлы).\n\nЛучшие результаты достигаются на картах размером от 100 до 256. Для большей точности или на малых картах используйте функции ручного размещения.\n\nТакже не гарантируется, что каждый раз будут получены идеальные результаты. Вы можете осмотреть размещённую руду, и если вас не устраивает результат, используйте кнопку 'отменить последнее действие с рудой', чтобы удалить её и попробовать снова.\n\nАвтоматическое размещение может удалить объекты, находящиеся только на земле, рядом с краем карты (отмена не заменит их).\n\n<b><YellowHighlight>ПРИМЕЧАНИЕ:</YellowHighlight></b> Размещение руды может занять несколько минут, особенно на больших картах или медленных компьютерах."
jaJP = "これは必要な鉱石（鉄など）の鉱脈と深い鉱床を配置し、オプションの鉱石（石炭、塩、貴金属）のランダムな選択を行います。\n\n100から256のサイズのマップで最も効果的に機能します。より細かい制御や小さなマップには、手動配置機能を使用してください。\n\n毎回完璧な結果が得られるわけではありません。配置された鉱石を確認し、不満があれば「最後の鉱石アクションを元に戻す」ボタンを使用して削除し、再試行してください。\n\n自動配置はマップの端近くにある地面専用のオブジェクトを削除する場合があります（元に戻すではこれらは復元されません）。\n\n<b><YellowHighlight>注意:</YellowHighlight></b> 鉱石の配置には数分かかる場合があります。特に大きなマップや遅いコンピュータでは時間がかかることがあります。"
frFR = "Ceci placera des veines et des dépôts profonds pour les minerais requis (comme le fer), et une sélection aléatoire de minerais optionnels (charbon, sel, métaux précieux).\n\nCela fonctionne mieux sur des cartes de taille comprise entre 100 et 256. Pour plus de contrôle ou des petites cartes, utilisez les fonctions de placement manuel.\n\nIl n'est également pas garanti de produire des résultats parfaits à chaque fois. Vous voudrez peut-être inspecter le minerai qui a été placé, et si vous n'êtes pas satisfait, utilisez le bouton 'annuler la dernière action de minerai' pour le retirer et réessayer.\n\nLe placement automatique peut supprimer des objets au sol près du bord de la carte (l'annulation ne replacera pas ces objets).\n\n<b><YellowHighlight>REMARQUE :</YellowHighlight></b> Le placement des minerais peut prendre plusieurs minutes, surtout sur de grandes cartes ou sur des ordinateurs lents."
deDE = "Dies platziert Erzgänge und tiefe Ablagerungen für benötigte Erze (wie Eisen) sowie eine zufällige Auswahl an optionalen Erzen (Kohle, Salz, Edelmetalle).\n\nEs funktioniert am besten auf Karten von 100 bis 256 in der Größe. Für mehr Kontrolle oder kleinere Karten verwenden Sie die manuellen Platzierungsfunktionen.\n\nEs ist auch nicht garantiert, dass jedes Mal perfekte Ergebnisse erzielt werden. Sie sollten das platzierte Erz überprüfen, und wenn Sie nicht zufrieden sind, verwenden Sie die Schaltfläche 'letzte Erzhandlung rückgängig machen', um es zu entfernen und es erneut zu versuchen.\n\nDie automatische Platzierung kann objektspezifische Erdobjekte in der Nähe des Kartenrandes entfernen (rückgängig machen wird diese nicht ersetzen).\n\n<b><YellowHighlight>HINWEIS:</YellowHighlight></b> Die Platzierung von Erz kann mehrere Minuten in Anspruch nehmen, insbesondere auf großen Karten oder langsamen Computern."
plPL = "To umieści złoża i głębokie złoża dla wymaganych rud (takich jak żelazo) oraz losową selekcję opcjonalnych rud (węgiel, sól, metale szlachetne).\n\nNajlepiej działa na mapach o rozmiarach od 100 do 256. W celu uzyskania większej kontroli lub na małych mapach, użyj funkcji ręcznego umieszczania.\n\nNie ma także gwarancji, że za każdym razem uzyskasz doskonałe wyniki. Może być konieczne sprawdzenie umieszczonej rudy, a jeśli nie jesteś zadowolony, użyj przycisku 'cofnij ostatnią akcję z rudy', aby usunąć ją i spróbować ponownie.\n\nAutomatyczne umieszczanie może usunąć obiekty tylko na ziemi w pobliżu krawędzi mapy (cofnięcie nie przywróci ich).\n\n<b><YellowHighlight>UWAGA:</YellowHighlight></b> Umieszczanie rudy może zająć kilka minut, zwłaszcza na dużych mapach lub wolnych komputerach."
ptBR = "Isto irá colocar veios e Depósitos Profundos para os minérios necessários (como ferro) e uma seleção aleatória de minérios opcionais (carvão, sal, metais preciosos).\n\nFunciona melhor em mapas de tamanho entre 100 e 256. Para maior controle ou mapas pequenos, use as funções de colocação manual.\n\nNão é garantido que produza resultados perfeitos a cada vez. Você pode querer inspecionar o minério que foi colocado e, se não estiver satisfeito, use o botão 'desfazer última ação de minério' para removê-lo e tentar novamente.\n\nA colocação automática pode remover objetos que estão apenas no chão perto da borda do mapa (desfazer não substituirá estes).\n\n<b><YellowHighlight>NOTA:</YellowHighlight></b> A colocação de minério pode levar vários minutos, especialmente em mapas grandes ou em computadores lentos."
koKR = "이 기능은 필요한 광물(예: 철)에 대해 광맥과 깊은 매장지를 배치하고, 선택적으로 석탄, 소금, 귀금속과 같은 임의의 광물을 배치합니다.\n\n100에서 256 크기의 맵에서 가장 잘 작동합니다. 더 많은 제어가 필요하거나 작은 맵의 경우 수동 배치 기능을 사용하십시오.\n\n매번 완벽한 결과를 보장하지는 않습니다. 배치된 광물을 확인하고 만족하지 않으면 '마지막 광물 작업 실행 취소' 버튼을 사용하여 제거하고 다시 시도하십시오.\n\n자동 배치가 맵 가장자리에 있는 바닥 전용 객체를 제거할 수 있으며(실행 취소는 이들을 대체하지 않습니다).\n\n<b><YellowHighlight>참고:</YellowHighlight></b> 광물 배치에는 특히 대형 맵이나 느린 컴퓨터에서 몇 분이 걸릴 수 있습니다."
trTR = "Bu, gerekli madenler (demir gibi) için damarlar ve Derin Yataklar yerleştirecek, ayrıca isteğe bağlı madenler (kömür, tuz, değerli metaller) için rastgele bir seçim yapacaktır.\n\n100 ile 256 boyutundaki haritalarda en iyi şekilde çalışır. Daha fazla kontrol veya küçük haritalar için manuel yerleştirme işlevlerini kullanın.\n\nHer seferinde mükemmel sonuçlar vermesi garanti değildir. Yerleştirilen madeni incelemek isteyebilirsiniz, eğer memnun kalmazsanız, 'son maden eylemini geri al' düğmesini kullanarak kaldırabilir ve yeniden deneyebilirsiniz.\n\nOtomatik yerleştirme, haritanın kenarındaki sadece yer nesnelerini kaldırabilir (geri alma bunları değiştirmeyecektir).\n\n<b><YellowHighlight>DİKKAT:</YellowHighlight></b> Maden yerleştirme birkaç dakika sürebilir, özellikle büyük haritalarda veya yavaş bilgisayarlarda."
esES = "Esto colocará vetas y depósitos profundos de los minerales necesarios (como hierro), además de una selección aleatoria de minerales opcionales (carbón, sal y metales preciosos).\n\nFunciona mejor en mapas de entre 100 y 256 unidades de tamaño. Para tener más control o en mapas pequeños, usa las funciones de colocación manual.\n\nTampoco garantiza resultados perfectos cada vez. Quizá quieras revisar el mineral colocado y, si no te convence, usar el botón «deshacer la última acción de mineral» para quitarlo e intentarlo de nuevo.\n\nLa colocación automática puede eliminar objetos que solo aparecen en el suelo cerca del borde del mapa (deshacer no los restaurará).\n\n<b><YellowHighlight>NOTA:</YellowHighlight></b> La colocación de minerales puede tardar varios minutos, sobre todo en mapas grandes o en equipos lentos."
itIT = "Questo posizionerà filoni e Depositi Profondi per i minerali richiesti (come il ferro) e una selezione casuale di minerali opzionali (carbone, sale, metalli preziosi).\n\nFunziona al meglio sulle mappe di dimensioni comprese tra 100 e 256. Per avere più controllo o per le mappe piccole, usa le funzioni di posizionamento manuale.\n\nInoltre, non è garantito che produca risultati perfetti ogni volta. Potresti voler controllare il minerale posizionato e, se non sei soddisfatto, usare il pulsante 'annulla ultima azione sul minerale' per rimuoverlo e riprovare.\n\nIl posizionamento automatico potrebbe rimuovere gli oggetti collocati solo sul terreno vicino al bordo della mappa (annullando l'azione non verranno ripristinati).\n\n<b><YellowHighlight>NOTA:</YellowHighlight></b> Il posizionamento dei minerali potrebbe richiedere diversi minuti, soprattutto sulle mappe grandi o sui computer lenti."
ukUA = "Тут буде розміщено жили та глибокі поклади обов’язкових руд (наприклад, заліза), а також випадковий набір необов’язкових руд (вугілля, сіль, дорогоцінні метали).\n\nНайкраще працює на мапах розміром від 100 до 256. Щоб мати більше контролю або розміщувати руди на малих мапах, скористайтеся функціями ручного розміщення.\n\nТакож немає гарантії, що щоразу результат буде ідеальним. Ви можете перевірити розміщену руду, а якщо результат вас не влаштує, натисніть кнопку «скасувати останню дію з рудою», щоб видалити її та спробувати ще раз.\n\nАвтоматичне розміщення може видалити об’єкти, які розташовані лише на землі біля краю мапи (скасування не відновить їх).\n\n<b><YellowHighlight>ПРИМІТКА:</YellowHighlight></b> Розміщення руди може тривати кілька хвилин, особливо на великих мапах або повільних комп’ютерах."
thTH = "การดำเนินการนี้จะวางสายแร่และแหล่งแร่ลึกสำหรับแร่ที่จำเป็น (เช่น เหล็ก) รวมถึงสุ่มเลือกแร่เสริม (ถ่านหิน เกลือ โลหะมีค่า)\n\nเหมาะที่สุดกับแผนที่ที่มีขนาดตั้งแต่ 100 ถึง 256 หากต้องการควบคุมมากขึ้นหรือใช้กับแผนที่ขนาดเล็ก ให้ใช้ฟังก์ชันวางด้วยตนเอง\n\nนอกจากนี้ ยังไม่รับประกันว่าจะได้ผลลัพธ์ที่สมบูรณ์แบบทุกครั้ง คุณอาจต้องตรวจสอบแร่ที่วางไว้ และหากไม่พอใจ ให้ใช้ปุ่ม 'เลิกทำการวางแร่ครั้งล่าสุด' เพื่อนำแร่ออกแล้วลองอีกครั้ง\n\nการวางอัตโนมัติอาจลบวัตถุที่อยู่บนพื้นเท่านั้นซึ่งอยู่ใกล้ขอบแผนที่ (การเลิกทำจะไม่ทำให้วัตถุเหล่านี้กลับคืนมา)\n\n<b><YellowHighlight>หมายเหตุ:</YellowHighlight></b> การวางแร่อาจใช้เวลาหลายนาที โดยเฉพาะบนแผนที่ขนาดใหญ่หรือคอมพิวเตอร์ที่ทำงานช้า"
csCZ = "Toto umístí žíly a hluboké ložiska pro požadované nerosty (jako je železo) a náhodný výběr volitelných nerostů (uhlí, sůl, cenné kovy).\n\nNejlépe funguje na mapách o velikosti od 100 do 256. Pro větší kontrolu nebo malé mapy použijte manuální umístění.\n\nTaké není zaručeno, že výsledky budou pokaždé dokonalé. Můžete chtít zkontrolovat umístěné nerosty, a pokud nejste spokojeni, použijte tlačítko 'vrátit poslední akci s nerostem', abyste je odstranili a pokusili se o to znovu.\n\nAutomatické umístění může odstranit objekty pouze na zemi poblíž okraje mapy (vrátit je nebude nahrazovat).\n\n<b><YellowHighlight>POZNÁMKA:</YellowHighlight></b> Umístění nerostů může trvat několik minut, zejména na velkých mapách nebo na pomalých počítačích."
viVN = "Điều này sẽ đặt các mạch và Khoáng sản sâu cho những quặng cần thiết (như sắt), và một lựa chọn ngẫu nhiên của các quặng tùy chọn (than, muối, kim loại quý).\n\nNó hoạt động tốt nhất trên các bản đồ có kích thước từ 100 đến 256. Để kiểm soát nhiều hơn hoặc trên các bản đồ nhỏ, hãy sử dụng các chức năng đặt thủ công.\n\nNó cũng không đảm bảo sẽ sản xuất kết quả hoàn hảo mỗi lần. Bạn có thể muốn kiểm tra quặng đã được đặt, và nếu bạn không hài lòng, hãy sử dụng nút 'hoàn tác hành động quặng cuối cùng' để xóa nó và thử lại.\n\nViệc đặt tự động có thể xóa các đối tượng chỉ nằm trên mặt đất gần rìa bản đồ (hoàn tác sẽ không thay thế những đối tượng này).\n\n<b><YellowHighlight>CHÚ Ý:</YellowHighlight></b> Việc đặt quặng có thể mất vài phút, đặc biệt là trên các bản đồ lớn hoặc máy tính chậm."
caES = "Això col·locarà vetes i jaciments profunds dels minerals necessaris (com ara el ferro), i una selecció aleatòria de minerals opcionals (carbó, sal i metalls preciosos).\n\nFunciona millor en mapes d'entre 100 i 256 de mida. Per tenir més control o en mapes petits, fes servir les funcions de col·locació manual.\n\nTampoc es garanteix que els resultats siguin perfectes cada vegada. Potser voldràs inspeccionar el mineral col·locat i, si no n'estàs satisfet, fes servir el botó «desfés l'última acció de mineral» per eliminar-lo i tornar-ho a provar.\n\nLa col·locació automàtica pot eliminar objectes que només es troben a terra prop de la vora del mapa (desfer l'acció no els restaurarà).\n\n<b><YellowHighlight>NOTA:</YellowHighlight></b> La col·locació de minerals pot trigar diversos minuts, sobretot en mapes grans o en ordinadors lents."
beBY = "Гэта размесціць жылы і глыбокія радовішчы неабходных руд (напрыклад, жалеза), а таксама выпадковы набор дадатковых руд (вугаль, соль, каштоўныя металы).\n\nНайлепш працуе на картах памерам ад 100 да 256. Каб атрымаць большы кантроль або працаваць з маленькімі картамі, выкарыстоўвайце функцыі ручнога размяшчэння.\n\nТаксама няма гарантыі, што кожны раз атрымаецца ідэальны вынік. Магчыма, варта праверыць размешчаную руду; калі вынік вас не задавальняе, націсніце кнопку «адмяніць апошняе дзеянне з рудай», каб выдаліць яе і паспрабаваць зноў.\n\nАўтаматычнае размяшчэнне можа выдаліць аб'екты, якія знаходзяцца толькі на паверхні зямлі каля краю карты (адмена не верне іх).\n\n<b><YellowHighlight>УВАГА:</YellowHighlight></b> Размяшчэнне руды можа заняць некалькі хвілін, асабліва на вялікіх картах або павольных камп'ютарах."
roRO = "Acest lucru va amplasa filoane și Zăcăminte adânci pentru minereurile necesare (precum fierul) și o selecție aleatorie de minereuri opționale (cărbune, sare, metale prețioase).\n\nFuncționează cel mai bine pe hărți cu dimensiuni între 100 și 256. Pentru mai mult control sau pe hărți mici, folosiți funcțiile de amplasare manuală.\n\nDe asemenea, nu este garantat că va oferi rezultate perfecte de fiecare dată. Poate doriți să inspectați minereul amplasat, iar dacă nu sunteți mulțumit, folosiți butonul „anulează ultima acțiune de plasare a minereului” pentru a-l elimina și a încerca din nou.\n\nAmplasarea automată poate elimina obiectele aflate doar la sol din apropierea marginii hărții (anularea nu le va restaura).\n\n<b><YellowHighlight>NOTĂ:</YellowHighlight></b> Amplasarea minereului poate dura câteva minute, mai ales pe hărți mari sau pe computere lente."
huHU = "Ez ereket és Mélylelőhelyeket helyez el a szükséges ércekhez (például vashoz), valamint véletlenszerűen kiválasztott opcionális ércekhez (szénhez, sóhoz, nemesfémekhez).\n\n100 és 256 közötti méretű térképeken működik a legjobban. Nagyobb irányítási lehetőségért vagy kis térképeken használd a kézi elhelyezési funkciókat.\n\nAz eredmény nem feltétlenül lesz minden alkalommal tökéletes. Érdemes ellenőrizned az elhelyezett ércet, és ha nem vagy elégedett, az „utolsó ércművelet visszavonása” gombbal eltávolíthatod, majd újra próbálkozhatsz.\n\nAz automatikus elhelyezés eltávolíthatja a térkép szélén lévő, csak a talajon található objektumokat (a visszavonás ezeket nem állítja vissza).\n\n<b><YellowHighlight>MEGJEGYZÉS:</YellowHighlight></b> Az érc elhelyezése több percig is eltarthat, különösen nagy térképeken vagy lassú számítógépeken."
arSA = "سيضع عروقًا ورواسب عميقة للخامات المطلوبة (مثل الحديد)، ومجموعة عشوائية من الخامات الاختيارية (الفحم والملح والمعادن الثمينة).\n\nيعمل بأفضل شكل على الخرائط التي يتراوح حجمها بين 100 و256. لمزيد من التحكم أو للخرائط الصغيرة، استخدم وظائف الوضع اليدوي.\n\nكما أنه لا يضمن نتائج مثالية في كل مرة. قد ترغب في فحص الخام الذي تم وضعه، وإذا لم تكن راضيًا، فاستخدم زر «التراجع عن آخر إجراء للخام» لإزالته والمحاولة مجددًا.\n\nقد يؤدي الوضع التلقائي إلى إزالة الأجسام الموجودة على الأرض فقط قرب حافة الخريطة (لن يعيد التراجع هذه الأجسام).\n\n<b><YellowHighlight>ملاحظة:</YellowHighlight></b> قد يستغرق وضع الخام عدة دقائق، خاصةً على الخرائط الكبيرة أو أجهزة الكمبيوتر البطيئة."

