["UI.TW.AutoMiningAreaSelectionTool.Description"]
raw = "Mark areas you don't want auto-mined. Must be used on surface level, and forbids all blocks below (or above, if overhangs)."
status = "normal"
enUS = "Mark areas you do not want to be auto-mined. Must be used at the surface level, and prohibits all blocks below (or above, if there are overhangs)."
zhCN = "标记您不希望自动挖掘的区域。必须在地表使用，并禁止所有下面的方块（如果悬垂，则禁止上面的方块）。"
