csCZ = "Tunel s cestou, ale bez podpory v zemi.  \n● <RedHighlight>Upozornění!</RedHighlight> Může způsobit zhroucení nepodloženého terénu nebo budov. Používejte opatrně."
viVN = "Một đường hầm có lối đi nhưng không có hỗ trợ mặt đất.  \n● <RedHighlight>Cảnh giác!</RedHighlight> Có thể gây sập địa hình hoặc các công trình không được hỗ trợ. Sử dụng cẩn thận."
caES = "A túnel amb camí però sense suport del terreny.\n● <RedHighlight>Compte!</RedHighlight> Pot provocar el col·lapse del terreny o dels edificis sense suport. Useu-lo amb cura."
beBY = "A tunnel with a path but no ground support.\n● <RedHighlight>Увага!</RedHighlight> Можа выклікаць абрушэнне неабаронены грунт або будынкі. Выкарыстоўвайце з асцярожнасцю."
roRO = "A un tunel cu o cale, dar fără suport de teren.\n● <RedHighlight>Atenție!</RedHighlight> Poate provoca prăbușirea terenului sau a clădirilor nesprijinite. Folosiți-l cu grijă."
huHU = "A járdával rendelkező, de talajtámasz nélküli alagút.\n● <RedHighlight>Figyelem!</RedHighlight> A nem megtámasztott talaj vagy épületek beomlását okozhatja. Óvatosan használd."
arSA = "تنفق نفق بمسار ولكن دون دعم أرضي.\n● <RedHighlight>تحذير!</RedHighlight> قد يؤدي إلى انهيار الأرض أو المباني غير المدعومة. استخدمه بحذر."

