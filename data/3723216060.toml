roRO = "Sursă de minereu de aur sulfurat (1). Folosiți dinamită sau construiți un tunel aici pentru a-l colecta.\n<b><YellowHighlight>Sfat:</YellowHighlight></b> Prăjiți minereurile sulfurate într-un cuptor înainte de măcinare."
huHU = "Kénsavas aranyérc forrása (1). Használj dinamitot vagy építs ide alagutat a gyűjtéséhez.\n<b><YellowHighlight>Tipp:</YellowHighlight></b> A kénszulfid ércek őrlése előtt pörköld őket kemencében."
