["ModSetting.TWMoreMines.TailingsErosionFactorDesc"]
raw = "When active erosion is checked, the amount of erosion is multiplied by this factor. Valid range 0-10, default is 1"
status = "normal"
enUS = "When active erosion is checked, the amount of erosion is multiplied by this factor. Valid range 0-10, default is 1."
zhCN = "当激活侵蚀被检查时，侵蚀量将乘以该因子。有效范围为0-10，默认为1。"
zhTW = "當啟用侵蝕檢查時，侵蝕的量將乘以此因子。有效範圍為 0-10，預設為 1。"
ruRU = "Когда активна проверка эрозии, количество эрозии умножается на этот коэффициент. Допустимый диапазон 0-10, по умолчанию 1"
jaJP = "「アクティブな浸食がチェックされている場合、浸食量はこの係数によって掛け算されます。有効範囲は0-10で、デフォルトは1です。」"
frFR = "Lorsque l'érosion active est vérifiée, la quantité d'érosion est multipliée par ce facteur. Plage valide 0-10, par défaut 1."
deDE = "Wenn die aktive Erosion überprüft wird, wird die Menge der Erosion mit diesem Faktor multipliziert. Gültiger Bereich 0-10, Standardwert ist 1."
plPL = "Gdy aktywna erozja jest zaznaczona, ilość erozji jest mnożona przez ten współczynnik. Dozwolony zakres 0-10, domyślnie 1."
ptBR = "Quando a erosão ativa está verificada, a quantidade de erosão é multiplicada por esse fator. Faixa válida de 0 a 10, o padrão é 1"
koKR = "활성화된 침식이 확인되면, 침식량이 이 계수로 곱해집니다. 유효 범위는 0-10이며, 기본 값은 1입니다."
trTR = "Etkin erozyon kontrol edildiğinde, erozyon miktarı bu faktörle çarpılır. Geçerli aralık 0-10, varsayılan 1'dir."
esES = "Cuando se activa la erosión activa, la cantidad de erosión se multiplica por este factor. Rango válido de 0 a 10; el valor predeterminado es 1"
itIT = "Quando l'erosione attiva è selezionata, la quantità di erosione viene moltiplicata per questo fattore. Intervallo valido: 0-10, valore predefinito: 1"
ukUA = "Під час перевірки активної ерозії її рівень множиться на цей коефіцієнт. Допустимий діапазон: 0–10, типове значення — 1."
thTH = "เมื่อเปิดใช้การกัดเซาะ ปริมาณการกัดเซาะจะถูกคูณด้วยตัวคูณนี้ ช่วงค่าที่ใช้ได้ 0-10 ค่าเริ่มต้นคือ 1"
csCZ = "Pokud je aktivováno kontrola eroze, množství eroze je vynásobeno tímto faktorem. Platný rozsah 0-10, výchozí hodnota je 1."
viVN = "Khi lượng xói mòn đang hoạt động được kiểm tra, lượng xói mòn sẽ được nhân với hệ số này. Phạm vi hợp lệ từ 0-10, mặc định là 1."
caES = "Quan l'erosió activa està marcada, la quantitat d'erosió es multiplica per aquest factor. Interval vàlid: 0-10, el valor predeterminat és 1"
beBY = "Калі ўключана актыўная эрозія, колькасць эрозіі памнажаецца на гэты каэфіцыент. Дапушчальны дыяпазон 0–10, стандартнае значэнне 1"
roRO = "Când este verificată eroziunea activă, cantitatea de eroziune se înmulțește cu acest factor. Interval valid 0-10, valoarea implicită este 1"
huHU = "Ha az aktív erózió be van kapcsolva, az erózió mértékét megszorozza ez a szorzó. Érvényes tartomány: 0–10, alapértelmezett érték: 1"
arSA = "عند تفعيل التآكل النشط، يُضرب مقدار التآكل في هذا المعامل. النطاق المسموح به 0 إلى 10، والقيمة الافتراضية 1"

