["Building.Tunnel.Description"]
raw = "Tunnels through terrain, replacing it with mine timbers. Use the layer tool to see under terrain or structures."
status = "normal"
enUS = "Tunnels through terrain, replacing it with mine timbers. Use the layer tool to see under terrain or structures."
zhCN = "“在地形中挖隧道，用矿木替代地形。使用图层工具查看地形或结构下方。”"
zhTW = "透過地形的隧道，用礦材替代它。使用圖層工具查看地形或結構下方的情況。"
ruRU = "Tоннели, проходящие сквозь местность, заменяя её шахтными бревнами. Используйте инструмент слоя, чтобы увидеть под землёй или конструкциями."
jaJP = "地形を貫通するトンネルで、坑道用の木材に置き換えます。層工具を使用して、地形や構造物の下を確認してください。"
frFR = "Creuse des tunnels à travers le terrain, le remplaçant par des structures de mine. Utilisez l'outil de couche pour voir sous le terrain ou les structures."
deDE = "Tunnels durch das Terrain, ersetzt es durch Bergbauholz. Verwenden Sie das Schichtwerkzeug, um unter Terrain oder Strukturen zu sehen."
plPL = "Tunele przez teren, zastępując go drewnem kopalnianym. Użyj narzędzia warstwy, aby zobaczyć pod terenem lub strukturami."
ptBR = "Túneis através do terreno, substituindo-o por madeiras de mina. Use a ferramenta de camada para ver abaixo do terreno ou das estruturas."
koKR = "지형을 통과하는 터널, 광산 목재로 대체됩니다. 지형이나 구조물 아래를 보려면 레이어 도구를 사용하세요."
trTR = "Zemin boyunca tüneller açar ve bunu maden kütükleriyle doldurur. Zemin veya yapılar altındakileri görmek için katman aracını kullanın."
esES = "Atraviesa el terreno y lo reemplaza con maderos de mina. Usa la herramienta de capas para ver por debajo del terreno o de las construcciones."
itIT = "Scava gallerie attraverso il terreno, sostituendolo con travi di sostegno per miniere. Usa lo strumento dei livelli per vedere sotto il terreno o le strutture."
ukUA = "Прокладає тунелі крізь ґрунт, замінюючи його шахтними кріпленнями. Використовуйте інструмент шарів, щоб бачити під ґрунтом або спорудами."
thTH = "เจาะอุโมงค์ผ่านพื้นที่ โดยแทนที่ดินด้วยไม้ค้ำเหมือง ใช้เครื่องมือเลเยอร์เพื่อมองดูใต้พื้นดินหรือโครงสร้าง"
csCZ = "Tunely skrze terén, nahrazující ho hornickými trámy. Použijte nástroj vrstvy, abyste viděli pod terénem nebo konstrukcemi."
viVN = "Các đường hầm xuyên qua địa hình, thay thế nó bằng gỗ của mỏ. Sử dụng công cụ lớp để xem dưới địa hình hoặc cấu trúc."
caES = "Excava túnels pel terreny, substituint-lo per fustes de mina. Utilitza l'eina de capes per veure sota el terreny o les estructures."
beBY = "Прабівае тунэль праз рэльеф, замяняючы яго шахтнай крапёй. Выкарыстоўвайце інструмент слаёў, каб бачыць пад рэльефам або пабудовамі."
roRO = "Străpunge terenul, înlocuindu-l cu grinzi de mină. Folosiți instrumentul de straturi pentru a vedea sub teren sau sub construcții."
huHU = "Alagútot köt a terepen át, a helyét bányafagerendákkal pótolva. A réteg eszközzel a terep vagy az épületek alatt is láthatsz."
arSA = "يحفر أنفاقًا عبر التضاريس، ويستبدلها بدعامات تعدين خشبية. استخدم أداة الطبقات لرؤية ما تحت التضاريس أو المنشآت."

["LV.CPl.GrowthSect"]
raw = "<b>Growth options:</b> Set below default ×1 to decrease difficulty except for Output Multiplier. Examples:\n- Planting Time Multiplier ×0.5: Planting Oak 1 hours → 0.5 hours.\n- Growth Rate ×0.5: Potato grows in 5 days → 2.5 days.\n- Output Multiplier ×1.5: Carrot yields 3 → 4.\n- Harvest Time Multiplier ×0.5: Oak cutting 2 hours → 1 hour.\n- Demolishing Time Multiplier ×0.5: demolishing Pine 1.2 hours → 0.6 hours."
status = "normal"
enUS = "<b>Growth options:</b> Set below default ×1 to decrease difficulty except for Output Multiplier. Examples:\n- Planting Time Multiplier ×0.5: Planting Oak 1 hour → 0.5 hours.\n- Growth Rate ×0.5: Potato grows in 5 days → 2.5 days.\n- Output Multiplier ×1.5: Carrot yields 3 → 4.\n- Harvest Time Multiplier ×0.5: Oak cutting 2 hours → 1 hour.\n- Demolishing Time Multiplier ×0.5: demolishing Pine 1.2 hours → 0.6 hours."
zhCN = "<b>生长选项：</b> 将默认值×1设置以下，以降低难度，输出倍率除外。示例：\n- 种植时间倍率×0.5：种植橡树1小时 → 0.5小时。\n- 生长速度×0.5：马铃薯5天生长 → 2.5天。\n- 输出倍率×1.5：胡萝卜产量3 → 4。\n- 收割时间倍率×0.5：砍伐橡树2小时 → 1小时。\n- 拆除时间倍率×0.5：拆除松树1.2小时 → 0.6小时。"
zhTW = "<b>成長選項：</b> 設定低於預設值 ×1 以減少難度，但輸出增益除外。例子：\n- 種植時間增益 ×0.5：種植橡樹 1 小時 → 0.5 小時。\n- 成長速度 ×0.5：馬鈴薯生長 5 天 → 2.5 天。\n- 輸出增益 ×1.5：胡蘿蔔產量 3 → 4。\n- 收穫時間增益 ×0.5：砍伐橡樹 2 小時 → 1 小時。\n- 拆除時間增益 ×0.5：拆除松樹 1.2 小時 → 0.6 小時。"
ruRU = "<b>Опции роста:</b> Установите ниже по умолчанию ×1, чтобы уменьшить сложность, кроме Множителя выработки. Примеры:\n- Множитель времени посадки ×0.5: Посадка дуба 1 час → 0.5 часа.\n- Скорость роста ×0.5: Картофель растет за 5 дней → 2.5 дня.\n- Множитель выработки ×1.5: Урожай моркови 3 → 4.\n- Множитель времени сбора ×0.5: Повалка дуба 2 часа → 1 час.\n- Множитель времени сноса ×0.5: снос сосны 1.2 часа → 0.6 часа."
jaJP = "<b>成長オプション:</b> デフォルトの×1未満に設定すると、出力倍率を除いて難易度が下がります。例:\n- 植え付け時間倍率 ×0.5: オークの植え付け 1時間 → 0.5時間。\n- 成長速度 ×0.5: ジャガイモが5日で成長 → 2.5日。\n- 出力倍率 ×1.5: ニンジンの収穫量 3 → 4。\n- 収穫時間倍率 ×0.5: オークの伐採 2時間 → 1時間。\n- 解体時間倍率 ×0.5: マツの解体 1.2時間 → 0.6時間。"
frFR = "<b>Options de croissance :</b> Réglez en dessous de la valeur par défaut ×1 pour réduire la difficulté sauf pour le multiplicateur de rendement. Exemples :\n- Multiplicateur de temps de plantation ×0.5 : Planter du chêne 1 heure → 0.5 heure.\n- Taux de croissance ×0.5 : La pomme de terre pousse en 5 jours → 2.5 jours.\n- Multiplicateur de rendement ×1.5 : La carotte produit 3 → 4.\n- Multiplicateur de temps de récolte ×0.5 : Abattage de chêne 2 heures → 1 heure.\n- Multiplicateur de temps de démolition ×0.5 : démolition de pin 1.2 heures → 0.6 heures."
deDE = "<b>Wachstumsoptionen:</b> Setzen Sie unter dem Standard ×1, um die Schwierigkeit zu verringern, mit Ausnahme des Ertragsmultiplikators. Beispiele:\n- Pflanzenzeit-Multiplikator ×0.5: Eiche pflanzen 1 Stunde → 0,5 Stunden.\n- Wachstumsrate ×0.5: Kartoffel wächst in 5 Tagen → 2,5 Tage.\n- Ertragsmultiplikator ×1.5: Karotte bringt 3 → 4 ein.\n- Erntezeit-Multiplikator ×0.5: Eiche fällen 2 Stunden → 1 Stunde.\n- Abreißzeit-Multiplikator ×0.5: Abreißen von Fichte 1,2 Stunden → 0,6 Stunden."
plPL = "<b>Opcje wzrostu:</b> Ustaw poniżej domyślnego ×1, aby zmniejszyć trudność, z wyjątkiem mnożnika wydajności. Przykłady:\n- Mnożnik czasu sadzenia ×0.5: Sadzenie dębu 1 godzina → 0,5 godziny.\n- Wskaźnik wzrostu ×0.5: Ziemniak rośnie w 5 dni → 2,5 dnia.\n- Mnożnik wydajności ×1.5: Marchewka daje 3 → 4.\n- Mnożnik czasu zbioru ×0.5: Ścinanie dębu 2 godziny → 1 godzina.\n- Mnożnik czasu burzenia ×0.5: Burzenie sosny 1,2 godziny → 0,6 godziny."
ptBR = "<b>Opções de crescimento:</b> Defina abaixo do padrão ×1 para diminuir a dificuldade, exceto para o multiplicador de saída. Exemplos:\n- Multiplicador de Tempo de Plantio ×0.5: Plantar Carvalho 1 hora → 0.5 horas.\n- Taxa de Crescimento ×0.5: Batata cresce em 5 dias → 2.5 dias.\n- Multiplicador de Saída ×1.5: Cenoura rende 3 → 4.\n- Multiplicador de Tempo de Colheita ×0.5: Corte de Carvalho 2 horas → 1 hora.\n- Multiplicador de Tempo de Demolição ×0.5: demolição de Pinheiro 1.2 horas → 0.6 horas."
koKR = "<b>성장 옵션:</b> 기본값 ×1 이하로 설정하여 출력 배수를 제외하고 난이도를 줄일 수 있습니다. 예시:\n- 심기 시간 배수 ×0.5: 오크 나무 심기 1시간 → 0.5시간.\n- 성장 속도 ×0.5: 감자가 5일에 성장 → 2.5일.\n- 출력 배수 ×1.5: 당근 수확량 3 → 4.\n- 수확 시간 배수 ×0.5: 오크 나무 베기 2시간 → 1시간.\n- 철거 시간 배수 ×0.5: 소나무 철거 1.2시간 → 0.6시간."
trTR = "<b>Gelişim seçenekleri:</b> Varsayılanın altında ×1 ayarlayarak zorluğu azaltın, Çıktı Çarpanı hariç. Örnekler:\n- Dikim Süresi Çarpanı ×0.5: Meşe dikimi 1 saat → 0.5 saat.\n- Büyüme Hızı ×0.5: Patates 5 günde büyür → 2.5 günde.\n- Çıktı Çarpanı ×1.5: Havuç 3 verir → 4.\n- Hasat Süresi Çarpanı ×0.5: Meşe kesimi 2 saat → 1 saat.\n- Yıkım Süresi Çarpanı ×0.5: Çamı yıkmak 1.2 saat → 0.6 saat."
esES = "<b>Opciones de crecimiento:</b> Ajuste por debajo del valor predeterminado ×1 para reducir la dificultad, excepto en el Multiplicador de producción. Ejemplos:\n- Multiplicador de tiempo de plantación ×0.5: plantar roble tarda 1 hora → 0.5 horas.\n- Multiplicador de velocidad de crecimiento ×0.5: la patata crece en 5 días → 2.5 días.\n- Multiplicador de producción ×1.5: la zanahoria rinde 3 → 4.\n- Multiplicador de tiempo de cosecha ×0.5: cosechar esqueje de roble tarda 2 horas → 1 hora.\n- Multiplicador de tiempo de demolición ×0.5: demoler pino tarda 1.2 horas → 0.6 horas."
itIT = "<b>Opzioni di crescita:</b> Imposta sotto il valore predefinito ×1 per ridurre la difficoltà, eccetto per il Moltiplicatore di resa. Esempi:\n- Moltiplicatore del tempo di semina ×0.5: semina di una quercia 1 ora → 0.5 ore.\n- Velocità di crescita ×0.5: la patata cresce in 5 giorni → 2.5 giorni.\n- Moltiplicatore di resa ×1.5: la carota produce 3 → 4.\n- Moltiplicatore del tempo di raccolta ×0.5: taglio di una quercia 2 ore → 1 ora.\n- Moltiplicatore del tempo di demolizione ×0.5: demolizione di un pino 1.2 ore → 0.6 ore."
ukUA = "<b>Параметри росту:</b> Установіть значення нижче стандартного ×1, щоб зменшити складність, крім множника виходу. Приклади:\n- Множник часу посадки ×0.5: посадка дуба 1 година → 0.5 години.\n- Швидкість росту ×0.5: картопля росте 5 днів → 2.5 дня.\n- Множник виходу ×1.5: морква дає 3 → 4.\n- Множник часу збирання ×0.5: зрізання дуба 2 години → 1 година.\n- Множник часу зносу ×0.5: знесення сосни 1.2 години → 0.6 години."
thTH = "<b>ตัวเลือกการเติบโต:</b> ตั้งค่าต่ำกว่าค่าเริ่มต้น ×1 เพื่อลดความยาก ยกเว้นตัวคูณผลผลิต ตัวอย่าง:\n- ตัวคูณเวลาปลูก ×0.5: การปลูกต้นโอ๊ก 1 ชั่วโมง → 0.5 ชั่วโมง\n- อัตราการเติบโต ×0.5: มันฝรั่งเติบโตใน 5 วัน → 2.5 วัน\n- ตัวคูณผลผลิต ×1.5: แครอทให้ผลผลิต 3 → 4\n- ตัวคูณเวลาเก็บเกี่ยว ×0.5: การตัดกิ่งโอ๊ก 2 ชั่วโมง → 1 ชั่วโมง\n- ตัวคูณเวลารื้อถอน ×0.5: การรื้อถอนต้นสน 1.2 ชั่วโมง → 0.6 ชั่วโมง"
csCZ = "<b>Možnosti růstu:</b> Nastavte níže výchozí ×1 pro snížení obtížnosti s výjimkou multiplikátoru výstupu. Příklady: \n- Multiplikátor doby sázení ×0,5: Sázení dubu 1 hodina → 0,5 hodiny.\n- Rychlost růstu ×0,5: Brambora roste za 5 dní → 2,5 dne.\n- Multiplikátor výstupu ×1,5: Mrkev přináší 3 → 4.\n- Multiplikátor doby sklizně ×0,5: Kácení dubu 2 hodiny → 1 hodina.\n- Multiplikátor doby demolice ×0,5: demolice borovice 1,2 hodiny → 0,6 hodiny."
viVN = "<b>Các tùy chọn phát triển:</b> Đặt dưới mặc định ×1 để giảm độ khó ngoại trừ Hệ số Đầu ra. Ví dụ:\n- Hệ số Thời gian Trồng ×0.5: Trồng Sồi 1 giờ → 0.5 giờ.\n- Hệ số Tăng trưởng ×0.5: Khoai tây phát triển trong 5 ngày → 2.5 ngày.\n- Hệ số Đầu ra ×1.5: Cà rốt thu hoạch 3 → 4.\n- Hệ số Thời gian Thu hoạch ×0.5: Chặt Sồi 2 giờ → 1 giờ.\n- Hệ số Thời gian Phá hủy ×0.5: phá hủy Thông 1.2 giờ → 0.6 giờ."
caES = "<b>Opcions de creixement:</b> Estableix per sota del valor predeterminat ×1 per reduir la dificultat, excepte per al Multiplicador de producció. Exemples:\n- Multiplicador de temps de plantació ×0.5: plantar una alzina triga 1 hora → 0.5 hores.\n- Taxa de creixement ×0.5: la patata creix en 5 dies → 2.5 dies.\n- Multiplicador de producció ×1.5: la pastanaga produeix 3 → 4.\n- Multiplicador de temps de collita ×0.5: collir un esqueix d'alzina triga 2 hores → 1 hora.\n- Multiplicador de temps d'enderrocament ×0.5: enderrocar un pi triga 1.2 hores → 0.6 hores."
beBY = "<b>Параметры роста:</b> Установите значение ниже стандартного ×1, чтобы снизить сложность, кроме Множителя выхода. Примеры:\n- Множитель времени посадки ×0.5: посадка дуба 1 час → 0.5 часа.\n- Скорость роста ×0.5: картофель растёт за 5 дней → 2.5 дня.\n- Множитель выхода ×1.5: морковь даёт 3 → 4.\n- Множитель времени сбора урожая ×0.5: сбор черенка дуба 2 часа → 1 час.\n- Множитель времени сноса ×0.5: снос сосны 1.2 часа → 0.6 часа."
roRO = "<b>Opțiuni de creștere:</b> Setați sub valoarea implicită ×1 pentru a reduce dificultatea, cu excepția Multiplicatorului de producție. Exemple:\n- Multiplicator al timpului de plantare ×0.5: plantarea unui stejar durează 1 oră → 0.5 ore.\n- Rata de creștere ×0.5: cartoful crește în 5 zile → 2.5 zile.\n- Multiplicator de producție ×1.5: morcovul produce 3 → 4.\n- Multiplicator al timpului de recoltare ×0.5: recoltarea unui butaș de stejar durează 2 ore → 1 oră.\n- Multiplicator al timpului de demolare ×0.5: demolarea unui pin durează 1.2 ore → 0.6 ore."
huHU = "<b>Növekedési beállítások:</b> Állítsa az alapértelmezett ×1 alá a nehézség csökkentéséhez, kivéve a Kimenet szorzót. Példák:\n- Ültetési idő szorzó ×0,5: Tölgy ültetése 1 óra → 0,5 óra.\n- Növekedési sebesség ×0,5: a Burgonya 5 nap alatt nő → 2,5 nap.\n- Kimenet szorzó ×1,5: a Sárgarépa 3-at terem → 4-et terem.\n- Betakarítási idő szorzó ×0,5: Tölgyvágvány 2 óra → 1 óra.\n- Lebontási idő szorzó ×0,5: Fenyő lebontása 1,2 óra → 0,6 óra."
arSA = "<b>خيارات النمو:</b> اضبط القيمة أدنى من الافتراضي ×1 لتقليل الصعوبة، باستثناء مضاعف الإنتاج. أمثلة:\n- مضاعف وقت الزراعة ×0.5: زراعة بلوط تستغرق ساعة واحدة ← 0.5 ساعة.\n- معدل النمو ×0.5: البطاطس تنمو في 5 أيام ← 2.5 يوم.\n- مضاعف الإنتاج ×1.5: الجزر ينتج 3 ← 4.\n- مضاعف وقت الحصاد ×0.5: قطع البلوط التي تستغرق ساعتين ← ساعة واحدة.\n- مضاعف وقت الهدم ×0.5: هدم الصنوبر الذي يستغرق 1.2 ساعة ← 0.6 ساعة."

