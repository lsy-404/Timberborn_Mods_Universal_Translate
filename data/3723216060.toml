["UI.TW.MoreMines.AutoOrePlacementFailure"]
raw = "Not all ore was placed successfully. Some ore types may be missing or rare.\n\nThis is not unusual, and the map is probably still playable. You can inspect the ore placement numbers on the next screen and decide if they are enough for your needs.\n\nIf you are unhappy with the ore amounts, you can undo the last ore action and re-roll the automatic placement.\n\nYou can also add ore of specific types using the manual placement tools.\n\nAdding ore is possible at any time, so you can add more later if you run out.\n\nFailed ores:\n{0}"
status = "normal"
enUS = "Not all ore was placed successfully. Some ore types may be missing or rare.\n\nThis is not unusual, and the map is probably still playable. You can inspect the ore placement numbers on the next screen and decide if they are enough for your needs.\n\nIf you are unhappy with the ore amounts, you can undo the last ore action and re-roll the automatic placement.\n\nYou can also add ore of specific types using the manual placement tools.\n\nAdding ore is possible at any time, so you can add more later if you run out.\n\nFailed ores:\n{0}"
zhCN = "并非所有矿石都已成功放置。某些矿石类型可能缺失或稀有。这并不罕见，地图可能仍然可以游戏。您可以在下一个屏幕上查看矿石放置数量，决定它们是否满足您的需求。如果您对矿石量不满意，可以撤销最后的矿石操作，并重新进行自动放置。您还可以使用手动放置工具添加特定类型的矿石。任何时候都可以添加矿石，因此如果您用完了，可以稍后再添加。失败的矿石：{0}"
zhTW = "並非所有礦石都成功放置。一些礦石類型可能缺失或稀有。\n\n這並不罕見，地圖可能仍然可玩。您可以在下一個畫面檢查礦石放置的數量，並決定是否足夠滿足您的需求。\n\n如果您對礦石數量不滿意，可以撤銷最後的礦石操作，並重新滾動自動放置。\n\n您也可以使用手動放置工具添加特定類型的礦石。\n\n在任何時候都可以添加礦石，因此如果您用完了，可以稍後再添加。\n\n失敗的礦石：\n{0}"
ruRU = "Не все руды были успешно размещены. Некоторые типы руд могут отсутствовать или быть редкими.\n\nЭто не необычно, и карта, вероятно, все еще играбельна. Вы можете проверить количества размещенной руды на следующем экране и решить, достаточно ли их для ваших нужд.\n\nЕсли вас не устраивают количество руды, вы можете отменить последнее действие с рудой и повторно выполнить автоматическое размещение.\n\nВы также можете добавить руду определенных типов с помощью инструментов ручного размещения.\n\nДобавление руды возможно в любое время, поэтому вы можете добавить больше позже, если она закончится.\n\nНеудачные руды:\n{0}"
jaJP = "すべての鉱石が正常に配置されませんでした。一部の鉱石タイプが欠落していたり、希少である可能性があります。これは珍しいことではなく、マップはおそらくまだプレイ可能です。次の画面で鉱石配置の数を確認し、必要に応じて十分かどうか判断できます。\n\n鉱石の量に満足していない場合、最後の鉱石アクションを元に戻し、自動配置を再実行できます。\n\n手動配置ツールを使用して特定のタイプの鉱石を追加することもできます。\n\n鉱石の追加はいつでも可能なので、足りなくなった場合は後でさらに追加できます。\n\n失敗した鉱石：\n{0}"
frFR = "Tous les minerais n'ont pas été placés avec succès. Certains types de minerai peuvent manquer ou être rares.\n\nCela n'est pas inhabituel, et la carte est probablement toujours jouable. Vous pouvez vérifier les chiffres de placement des minerais sur l'écran suivant et décider s'ils sont suffisants pour vos besoins.\n\nSi vous n'êtes pas satisfait des quantités de minerai, vous pouvez annuler la dernière action de minerai et relancer le placement automatique.\n\nVous pouvez également ajouter des minerais de types spécifiques en utilisant les outils de placement manuel.\n\nAjouter des minerais est possible à tout moment, donc vous pouvez en ajouter davantage plus tard si vous en manquez.\n\nMinerais échoués : \n{0}"
deDE = "Nicht alle Erze wurden erfolgreich platziert. Einige Erztypen könnten fehlen oder selten sein.\n\nDies ist nicht ungewöhnlich, und die Karte ist wahrscheinlich immer noch spielbar. Sie können die Erzplatzierungszahlen auf dem nächsten Bildschirm überprüfen und entscheiden, ob sie für Ihre Bedürfnisse ausreichen.\n\nWenn Sie mit den Erzmenge unzufrieden sind, können Sie die letzte Erzaktion rückgängig machen und die automatische Platzierung neu ausführen.\n\nSie können auch Erze bestimmter Typen mit den manuellen Platzierungswerkzeugen hinzufügen.\n\nDas Hinzufügen von Erzen ist jederzeit möglich, sodass Sie später mehr hinzufügen können, wenn Ihnen die Erze ausgehen.\n\nFehlende Erze:\n{0}"
plPL = "Nie wszystkie rudy zostały pomyślnie umieszczone. Niektóre rodzaje rud mogą być brakujące lub rzadkie.\n\nNie jest to nic niezwykłego i mapa prawdopodobnie wciąż jest grywalna. Możesz sprawdzić liczby umieszczenia rud na następnym ekranie i zdecydować, czy są wystarczające dla Twoich potrzeb.\n\nJeśli nie jesteś zadowolony z ilości rud, możesz cofnąć ostatnią akcję umieszczania rud i ponownie losować automatyczne umieszczenie.\n\nMożesz również dodać rudy określonych typów, korzystając z narzędzi ręcznego umieszczania.\n\nDodawanie rud jest możliwe w dowolnym momencie, więc możesz dodać więcej później, jeśli się skończą.\n\nNieudane rudy:\n{0}"
ptBR = "Nem todo o minério foi colocado com sucesso. Alguns tipos de minério podem estar ausentes ou serem raros.\n\nIsso não é incomum, e o mapa provavelmente ainda é jogável. Você pode inspecionar os números de colocação de minério na próxima tela e decidir se são suficientes para suas necessidades.\n\nSe você não está satisfeito com as quantidades de minério, pode desfazer a última ação de minério e re-rolar a colocação automática.\n\nVocê também pode adicionar minério de tipos específicos usando as ferramentas de colocação manual.\n\nAdicionar minério é possível a qualquer momento, então você pode adicionar mais depois se ficar sem.\n\nMinérios falhados:\n{0}"
koKR = "모든 광석이 성공적으로 배치되지 않았습니다. 일부 광석 유형이 누락되었거나 희귀할 수 있습니다.\n\n이는 드문 일이 아니며, 맵은 여전히 플레이할 수 있을 것입니다. 다음 화면에서 광석 배치 수치를 확인하고, 그 수치가 필요에 충분한지 결정할 수 있습니다.\n\n광석 양에 불만이 있으시면 마지막 광석 작업을 취소하고 자동 배치를 다시 재설정할 수 있습니다.\n\n수동 배치 도구를 사용하여 특정 유형의 광석을 추가할 수도 있습니다.\n\n광석 추가는 언제든지 가능하므로, 나중에 더 필요할 경우 추가할 수 있습니다.\n\n실패한 광석:\n{0}"
trTR = "Tüm madenler başarılı bir şekilde yerleştirilemedi. Bazı maden türleri eksik veya nadir olabilir. Bu durum olağan değildir ve harita muhtemelen hala oynanabilir. Maden yerleştirme sayısını bir sonraki ekranda inceleyebilir ve ihtiyaçlarınız için yeterli olup olmadığına karar verebilirsiniz. Maden miktarlarından memnun değilseniz, son maden eylemini geri alabilir ve otomatik yerleştirmeyi tekrar yapabilirsiniz. Belirli türlerde maden eklemek için manuel yerleştirme araçlarını da kullanabilirsiniz. Maden eklemek her zaman mümkündür, bu yüzden bitirirseniz daha sonra daha fazlasını ekleyebilirsiniz. Başarısız madenler: {0}"
esES = "No se pudo colocar todo el mineral. Puede que falten algunos tipos de mineral o que sean escasos.\n\nEsto no es inusual, y probablemente el mapa siga siendo jugable. Puedes consultar las cantidades de mineral colocadas en la siguiente pantalla y decidir si son suficientes para tus necesidades.\n\nSi no estás conforme con las cantidades de mineral, puedes deshacer la última acción de colocación de mineral y volver a sortear la colocación automática.\n\nTambién puedes añadir tipos específicos de mineral con las herramientas de colocación manual.\n\nEs posible añadir mineral en cualquier momento, así que puedes añadir más adelante si se te acaba.\n\nMinerales no colocados:\n{0}"
itIT = "Non tutti i minerali sono stati posizionati correttamente. Alcuni tipi di minerale potrebbero mancare o essere rari.\n\nNon è insolito, e probabilmente la mappa è comunque giocabile. Nella schermata successiva puoi controllare le quantità di minerale posizionate e decidere se sono sufficienti per le tue esigenze.\n\nSe non sei soddisfatto delle quantità di minerale, puoi annullare l’ultima operazione sui minerali e ripetere il posizionamento automatico.\n\nPuoi anche aggiungere minerali di tipi specifici usando gli strumenti di posizionamento manuale.\n\nPuoi aggiungere minerali in qualsiasi momento, quindi puoi aggiungerne altri in seguito se li esaurisci.\n\nMinerali non posizionati:\n{0}"
ukUA = "Не всю руду вдалося розмістити. Деякі типи руди можуть бути відсутні або траплятися рідко.\n\nЦе не є чимось незвичним, і на цій мапі, ймовірно, усе ще можна грати. На наступному екрані можна переглянути показники розміщення руди й вирішити, чи вистачить її для ваших потреб.\n\nЯкщо вас не влаштовує кількість руди, можна скасувати останню дію з розміщення руди й повторно запустити автоматичне розміщення.\n\nТакож можна додати руду певних типів за допомогою інструментів ручного розміщення.\n\nДодавати руду можна будь-коли, тож ви зможете додати ще, якщо вона закінчиться.\n\nРуди, які не вдалося розмістити:\n{0}"
thTH = "วางแร่บางส่วนไม่สำเร็จ แร่บางชนิดอาจไม่มีหรือมีอยู่น้อย\n\nเรื่องนี้ไม่ใช่เรื่องผิดปกติ และแผนที่นี้น่าจะยังเล่นได้ คุณสามารถตรวจสอบตัวเลขการวางแร่ได้ในหน้าถัดไป แล้วตัดสินใจว่ามีเพียงพอต่อความต้องการหรือไม่\n\nหากคุณไม่พอใจกับปริมาณแร่ คุณสามารถยกเลิกการวางแร่ครั้งล่าสุด แล้วสุ่มวางใหม่โดยอัตโนมัติได้\n\nคุณยังสามารถเพิ่มแร่บางชนิดได้เองโดยใช้เครื่องมือวางแร่ด้วยตนเอง\n\nคุณสามารถเพิ่มแร่ได้ทุกเมื่อ ดังนั้นหากแร่หมด คุณก็เพิ่มได้ในภายหลัง\n\nแร่ที่วางไม่สำเร็จ:\n{0}"
csCZ = "Některé rudy nebyly úspěšně umístěny. Některé typy rud mohou chybět nebo být vzácné. To není neobvyklé a mapa je pravděpodobně stále hratelná. Můžete zkontrolovat čísla umístění rud na další obrazovce a rozhodnout se, zda jsou dostatečná pro vaše potřeby. Pokud nejste spokojeni s množstvím rud, můžete zrušit poslední akci s rudou a znovu provést automatické umístění. Přidávání rud je možné kdykoli, takže můžete přidat více později, pokud dojdou. Neúspěšné rudy: {0}"
viVN = "Không phải tất cả quặng đều được đặt thành công. Một số loại quặng có thể bị thiếu hoặc hiếm.\n\nĐiều này không phải là điều bất thường, và bản đồ có thể vẫn chơi được. Bạn có thể kiểm tra số lượng quặng đã đặt ở màn hình tiếp theo và quyết định xem chúng có đủ cho nhu cầu của bạn không.\n\nNếu bạn không hài lòng với số lượng quặng, bạn có thể hoàn tác hành động quặng cuối cùng và đặt lại tự động.\n\nBạn cũng có thể thêm quặng của các loại cụ thể bằng cách sử dụng các công cụ đặt thủ công.\n\nViệc thêm quặng có thể thực hiện bất kỳ lúc nào, vì vậy bạn có thể thêm nhiều hơn sau này nếu bạn hết quặng.\n\nQuặng thất bại:\n{0}"
caES = "No s'ha pogut col·locar tota la mena correctament. És possible que faltin alguns tipus de mena o que n'hi hagi poca.\n\nAixò no és estrany, i probablement el mapa encara es pot jugar. Pots inspeccionar les xifres de col·locació de la mena a la pantalla següent i decidir si són suficients per a les teves necessitats.\n\nSi no estàs satisfet amb les quantitats de mena, pots desfer l'última acció de col·locació de mena i tornar a fer el sorteig de la col·locació automàtica.\n\nTambé pots afegir mena de tipus específics amb les eines de col·locació manual.\n\nÉs possible afegir mena en qualsevol moment, així que en pots afegir més més endavant si se t'acaba.\n\nMena no col·locada:\n{0}"
beBY = "Не ўсе руды ўдалося размясціць. Некаторыя віды руды могуць адсутнічаць або сустракацца рэдка.\n\nГэта не рэдкасць, і мапа, верагодна, усё яшчэ прыдатная для гульні. На наступным экране можна праверыць колькасць размешчанай руды і вырашыць, ці дастаткова яе для вашых патрэб.\n\nКалі вас не задавальняе колькасць руды, можна адмяніць апошняе дзеянне з рудамі і паўторна запусціць аўтаматычнае размяшчэнне.\n\nВы таксама можаце дадаць руды пэўных тыпаў з дапамогай інструментаў ручнога размяшчэння.\n\nРуду можна дадаваць у любы час, таму вы зможаце дадаць яшчэ, калі яна скончыцца.\n\nРуды, якія не ўдалося размясціць:\n{0}"
roRO = "Nu tot minereul a fost plasat cu succes. Unele tipuri de minereu pot lipsi sau pot fi rare.\n\nAcest lucru nu este neobișnuit, iar harta probabil poate fi jucată în continuare. Puteți verifica numerele privind plasarea minereului pe ecranul următor și puteți decide dacă sunt suficiente pentru nevoile dvs.\n\nDacă nu sunteți mulțumit de cantitățile de minereu, puteți anula ultima acțiune de plasare a minereului și puteți relansa plasarea automată.\n\nDe asemenea, puteți adăuga anumite tipuri de minereu folosind uneltele de plasare manuală.\n\nPuteți adăuga minereu oricând, așa că puteți adăuga mai mult mai târziu dacă rămâneți fără.\n\nMinereuri plasate nereușit:\n{0}"
huHU = "Nem minden ércet sikerült elhelyezni. Egyes érctípusok hiányozhatnak vagy ritkák lehetnek.\n\nEz nem szokatlan, és a térkép valószínűleg továbbra is játszható. A következő képernyőn megtekintheted az ércek elhelyezési adatait, és eldöntheted, hogy elegendőek-e az igényeidhez.\n\nHa nem vagy elégedett az ércek mennyiségével, visszavonhatod az utolsó ércelhelyezési műveletet, és újragenerálhatod az automatikus elhelyezést.\n\nA kézi elhelyezési eszközökkel meghatározott típusú érceket is hozzáadhatsz.\n\nÉrceket bármikor hozzáadhatsz, így később is tehetsz le többet, ha kifogynak.\n\nSikertelenül elhelyezett ércek:\n{0}"
arSA = "لم يتم وضع جميع الخامات بنجاح. قد تكون بعض أنواع الخام مفقودة أو نادرة.\n\nهذا ليس أمرًا غير معتاد، ومن المرجح أن الخريطة لا تزال قابلة للعب. يمكنك الاطلاع على أرقام توزيع الخام في الشاشة التالية وتحديد ما إذا كانت كافية لاحتياجاتك.\n\nإذا لم تكن راضيًا عن كميات الخام، يمكنك التراجع عن آخر إجراء لوضع الخام وإعادة التوزيع التلقائي عشوائيًا.\n\nيمكنك أيضًا إضافة خامات من أنواع محددة باستخدام أدوات الوضع اليدوي.\n\nيمكن إضافة الخام في أي وقت، لذا يمكنك إضافة المزيد لاحقًا إذا نفد.\n\nالخامات التي تعذر وضعها:\n{0}"

