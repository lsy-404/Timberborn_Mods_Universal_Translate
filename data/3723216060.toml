["Building.TWEmptyTunnel.Description"]
raw = "A tunnel with no ground support.\n● <RedHighlight>Caution!</RedHighlight> May cause collapse of unsupported terrain or buildings. Use with care."
status = "normal"
enUS = "A tunnel with no ground support.  \n● <RedHighlight>Caution!</RedHighlight> May cause collapse of unsupported terrain or buildings. Use with care."
zhCN = "一个没有地面支撑的隧道。\n● <RedHighlight>注意!</RedHighlight> 可能会导致无支撑地形或建筑物的坍塌。请小心使用。"
zhTW = "一條沒有地面支撐的隧道。\n● <RedHighlight>小心！</RedHighlight> 可能會導致不受支撐的地形或建築物倒塌。請小心使用。"
ruRU = "Туннель без наземной опоры.  \n● <RedHighlight>Внимание!</RedHighlight> Может привести к обрушению неподдерживаемой территории или зданий. Используйте с осторожностью."
jaJP = "「地面の支えがないトンネルです。  \n● <RedHighlight>注意!</RedHighlight> 支えのない地形や建物が崩れる可能性があります。使用時は注意してください。」"
frFR = "Un tunnel sans support au sol.  \n● <RedHighlight>Attention !</RedHighlight> Peut provoquer l'effondrement de terrains ou de bâtiments non supportés. À utiliser avec précaution."
deDE = "Ein Tunnel ohne Bodenunterstützung.  \n● <RedHighlight>Vorsicht!</RedHighlight> Kann den Zusammenbruch von nicht unterstütztem Terrain oder Gebäuden verursachen. Mit Vorsicht verwenden."
plPL = "Tunel bez wsparcia gruntowego.  \n● <RedHighlight>Uwaga!</RedHighlight> Może spowodować zawalenie się niepodpartego terenu lub budynków. Używaj ostrożnie."
ptBR = "Um túnel sem suporte no solo.  \n● <RedHighlight>Cuidado!</RedHighlight> Pode causar o colapso do terreno ou de construções sem suporte. Use com cautela."
koKR = "지하에는 지면 지지대가 없는 터널입니다.  \n● <RedHighlight>주의!</RedHighlight> 지지대가 없는 지형이나 건물이 무너지게 할 수 있습니다. 주의해서 사용하세요."
trTR = "Zemin desteği olmayan bir tünel.\n● <RedHighlight>Dikkat!</RedHighlight> Desteksiz arazi veya binaların çökmesine neden olabilir. Dikkatli kullanın."
esES = "A túnel sin soporte en el terreno.\n● <RedHighlight>¡Precaución!</RedHighlight> Puede provocar el colapso del terreno o de los edificios sin soporte. Úsalo con cuidado."
itIT = "A galleria senza supporto del terreno.\n● <RedHighlight>Attenzione!</RedHighlight> Può causare il crollo di terreno o edifici non sostenuti. Usare con cautela."
ukUA = "A tunnel with no ground support.\n● <RedHighlight>Обережно!</RedHighlight> Може спричинити обвал незакріпленого ґрунту або будівель. Використовуйте з обережністю."
thTH = "A tunnel with no ground support.\n● <RedHighlight>คำเตือน!</RedHighlight> อาจทำให้พื้นดินหรือสิ่งก่อสร้างที่ไม่มีการค้ำยันพังทลาย โปรดใช้งานด้วยความระมัดระวัง"
csCZ = "Tunel bez podpory ze země.  \n● <RedHighlight>Opatrnost!</RedHighlight> Může způsobit kolaps nepodloženého terénu nebo budov. Používejte opatrně."
viVN = "Một đường hầm không có hỗ trợ mặt đất.  \n● <RedHighlight>Cảnh báo!</RedHighlight> Có thể gây sập địa hình hoặc tòa nhà không được hỗ trợ. Sử dụng cẩn thận."
caES = "Un túnel sense suport del terreny.\n● <RedHighlight>Atenció!</RedHighlight> Pot provocar el col·lapse del terreny o dels edificis sense suport. Useu-lo amb cura."
beBY = "A tunnel with no ground support.\n● <RedHighlight>Увага!</RedHighlight> Можа выклікаць абвал незакрепленага грунту або будынкаў. Выкарыстоўвайце з асцярожнасцю."
roRO = "A tunel fără suport la nivelul solului.\n● <RedHighlight>Atenție!</RedHighlight> Poate provoca prăbușirea terenului sau a clădirilor nesusținute. Folosiți-l cu grijă."
huHU = "A támogatás nélküli alagút.\n● <RedHighlight>Figyelem!</RedHighlight> Támogatás nélküli talajt vagy épületeket összeomolhat. Óvatosan használja."
arSA = "A tunnel with no ground support.\n● <RedHighlight>تحذير!</RedHighlight> قد يتسبب في انهيار التضاريس أو المباني غير المدعومة. استخدمه بحذر."

