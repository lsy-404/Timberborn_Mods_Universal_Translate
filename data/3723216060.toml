plPL = "Źródło rudy złota (0,4) i rudy srebra (0,7). Użyj dynamitu lub zbuduj tunel, aby ją zebrać.  \n<b><YellowHighlight>Uwaga:</YellowHighlight></b> Ułamkowa ruda jest rejestrowana, a przedmiot pojawi się po wykopaniu wystarczającej liczby bloków."
ptBR = "Fonte de Minério de Ouro (0,4) e Minério de Prata (0,7). Use dinamite ou construa um túnel aqui para coletá-lo. <b><YellowHighlight>Nota:</YellowHighlight></b> O minério fracionado é registrado e um item aparecerá após cavar blocos suficientes."
koKR = "금광(0.4)과 은광(0.7)의 출처입니다. 여기서 다이너마이트를 사용하거나 터널을 건설하여 자원을 수집하십시오.  \n<b><YellowHighlight>참고:</YellowHighlight></b> 소수의 광물은 기록되며, 충분한 블록이 파헤쳐지면 아이템이 생성됩니다."
trTR = "Altın Oru (0.4) ve Gümüş Oru (0.7) kaynağı. Bunu toplamak için burada dinamit kullanın veya bir tünel inşa edin.\n<b><YellowHighlight>Açıklama:</YellowHighlight></b> Kesirli maden kaydedilir ve yeterli blok kazıldığında bir eşya belirecektir."
esES = "Yacimiento de mena de oro (0,4) y mena de plata (0,7). Usa dinamita o construye un túnel aquí para extraerla.\n<b><YellowHighlight>Nota:</YellowHighlight></b> La mena fraccionaria se registra y aparecerá un objeto después de excavar suficientes bloques."
itIT = "Fonte di minerale d'oro (0.4) e minerale d'argento (0.7). Usa la dinamite o costruisci un tunnel qui per raccoglierlo.\n<b><YellowHighlight>Nota:</YellowHighlight></b> Le frazioni di minerale vengono registrate e un oggetto apparirà dopo aver scavato abbastanza blocchi."
ukUA = "Джерело золотої руди (0.4) та срібної руди (0.7). Використовуйте динаміт або побудуйте тут тунель, щоб видобувати її.\n<b><YellowHighlight>Примітка:</YellowHighlight></b> Дробова кількість руди враховується, і предмет з’явиться після того, як буде викопано достатньо блоків."
thTH = "แหล่งแร่ทองคำ (0.4) และแร่เงิน (0.7) ใช้ไดนาไมต์หรือสร้างอุโมงค์ที่นี่เพื่อขุดเก็บแร่\n<b><YellowHighlight>หมายเหตุ:</YellowHighlight></b> ระบบจะบันทึกเศษส่วนของแร่ไว้ และไอเท็มจะเกิดขึ้นหลังจากขุดบล็อกได้มากพอ"
csCZ = "Zdroj zlaté rudy (0,4) a stříbrné rudy (0,7). Použijte dynamit nebo zde postavte tunel, abyste ji získali. \n<b><YellowHighlight>Poznámka:</YellowHighlight></b> Frakční ruda je zaznamenávána a položka se objeví poté, co bude vykopáno dostatek bloků."
viVN = "Các nguồn khoáng sản Vàng (0.4) và Bạc (0.7). Sử dụng thuốc nổ hoặc xây dựng một đường hầm tại đây để thu thập.\n<b><YellowHighlight>Ghi chú:</YellowHighlight></b> Khoáng sản phân đoạn sẽ được ghi lại và một vật phẩm sẽ xuất hiện sau khi đủ khối được đào."
caES = "Jaciment de mineral d’or (0.4) i mineral de plata (0.7). Fes servir dinamita o construeix-hi un túnel per extreure’n el mineral.\n<b><YellowHighlight>Nota:</YellowHighlight></b> El mineral fraccionari queda registrat i apareixerà un objecte quan s’hagin excavat prou blocs."
beBY = "Крыніца залатой руды (0.4) і срэбнай руды (0.7). Выкарыстайце дынаміт або пабудуйце тут тунэль, каб здабываць яе.\n<b><YellowHighlight>Заўвага:</YellowHighlight></b> Дробная колькасць руды ўлічваецца, і прадмет з'явіцца пасля таго, як будзе выкапана дастаткова блокаў."
roRO = "Sursă de minereu de aur (0.4) și minereu de argint (0.7). Folosește dinamită sau construiește un tunel aici pentru a-l colecta.\n<b><YellowHighlight>Notă:</YellowHighlight></b> Minereul fracționar este înregistrat, iar un obiect va apărea după ce sunt săpate suficiente blocuri."
huHU = "Aranyérc (0,4) és ezüstérc (0,7) forrása. Használj dinamitot vagy építs ide alagutat a kitermeléséhez.\n<b><YellowHighlight>Megjegyzés:</YellowHighlight></b> A töredékes ércmennyiség nyilvántartásba kerül, és egy tárgy jelenik meg, miután elegendő blokkot kiástál."
arSA = "مصدر لخام الذهب (0.4) وخام الفضة (0.7). استخدم الديناميت أو أنشئ نفقًا هنا لجمعه.\n<b><YellowHighlight>ملاحظة:</YellowHighlight></b> تُسجَّل كميات الخام الكسرية، وستظهر قطعة بعد حفر عدد كافٍ من الكتل."

