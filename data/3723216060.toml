["Faction.TWDirtclaws.Description"]
raw = "These ex-Folktails were more interested in the rocks under their farm than in planting.\nGreat diggers, but awful farmers.\nTheir motto: <i>Deep hole, deeper contentment.</i>"
status = "normal"
enUS = "These ex-Folktails were more interested in the rocks under their farm than in planting. Great diggers, but awful farmers. Their motto: <i>Deep hole, deeper contentment.</i>"
zhCN = "这些前Folktails对他们农场下的岩石更感兴趣，而不是种植。  \n伟大的挖掘者，却是糟糕的农民。  \n他们的座右铭：<i>深洞，深满足。</i>"
zhTW = "這些前田園派對於他們農場下的岩石更感興趣，而非種植。  \n偉大的挖掘者，但糟糕的農民。  \n他們的座右銘：<i>深穴，深層的滿足。</i>"
ruRU = "Эти бывшие жители Фолктейлов были больше заинтересованы в камнях под своей фермой, чем в посадке.\nОтличные копатели, но ужасные фермеры.\nИх девиз: <i>Глубокая яма, большее удовлетворение.</i>"
jaJP = "この元フォークテイルの一団は、農場の下の岩に興味を持っていて、植えることには関心がありませんでした。  \n素晴らしい掘削者ですが、ひどい農夫です。  \n彼らのモットー：<i>深い穴、より深い満足。</i>"
frFR = "Ces ex-Folktails étaient plus intéressés par les roches sous leur ferme que par la plantation.  \nGrands creuseurs, mais mauvais agriculteurs.  \nLeur devise : <i>Un trou profond, un contentement plus profond.</i>"
deDE = "Diese ehemaligen Folktails waren mehr an den Steinen unter ihrem Bauernhof interessiert als am Pflanzen.  \nGroße Gräber, aber furchtbare Bauern.  \nIhr Motto: <i>Tiefes Loch, tiefere Zufriedenheit.</i>"
plPL = "Ci byli Folktails byli bardziej zainteresowani kamieniami pod swoją farmą niż sadzeniem.\nŚwietni kopacze, ale okropni rolnicy.\nIch motto: <i>Głębokie dziury, głębsza satysfakcja.</i>"
ptBR = "Esses ex-Folktails estavam mais interessados nas pedras sob sua fazenda do que em plantar.\nExcelentes escavadores, mas péssimos agricultores.\nSeu lema: <i>Buraco profundo, contentamento mais profundo.</i>"
koKR = "이 전직 포크테일들은 농사를 짓는 것보다 자신의 농장 아래의 바위에 더 관심이 많았습니다.  \n훌륭한 발굴가들이지만 끔찍한 농부들입니다.  \n그들의 모토: <i>깊은 구덩이, 더 깊은 만족.</i>"
trTR = "Bu eski Folktail'ler, çiftliklerinin altındaki taşlarla daha çok ilgileniyorlardı, bitki ekmektense.\nHarika kazıcılar, ama berbat çiftçiler.\nMottoları: <i>Derin çukur, daha derin memnuniyet.</i>"
esES = "Estos exbucólicos estaban más interesados en las rocas bajo su granja que en plantar.\nExcelentes excavadores, pero pésimos agricultores.\nSu lema: <i>Hoyo profundo, contento más profundo.</i>"
itIT = "Questi ex Codalesta erano più interessati alle rocce sotto la loro fattoria che alla semina.\nOttimi scavatori, ma pessimi agricoltori.\nIl loro motto: <i>Buca profonda, contentezza più profonda.</i>"
ukUA = "Ці колишні Хвостонародці більше цікавилися скелями під своєю фермою, ніж посадками.\nЧудові копачі, але жахливі фермери.\nЇхнє гасло: <i>Глибока яма, глибше задоволення.</i>"
thTH = "อดีตหางไม้เหล่านี้สนใจหินใต้ฟาร์มของตัวเองมากกว่าการปลูกพืช\nขุดเก่งจริง แต่ทำฟาร์มแย่มาก\nคติประจำใจของพวกเขาคือ: <i>หลุมยิ่งลึก ความพึงพอใจยิ่งมาก</i>"
csCZ = "Tito bývalí Folktails byli více zaujatí kameny pod jejich farmou než sazením. Skvělí kopáči, ale hrozní farmáři. Jejich motto: <i>Hluboká díra, hlubší spokojenost.</i>"
viVN = "Những cựu Folktails này quan tâm nhiều hơn đến những viên đá dưới trang trại của họ hơn là việc trồng trọt.  \nKẻ đào giỏi, nhưng nông dân tệ hại.  \nKhẩu hiệu của họ: <i>Hố sâu, sự hài lòng sâu sắc hơn.</i>"
caES = "Aquests antics Folktails estaven més interessats en les roques sota la seva granja que en plantar.\nExcelents excavadors, però pèssims agricultors.\nEl seu lema: <i>Forat profund, contentament més profund.</i>"
beBY = "Гэтыя колішнія фолктэлы больш цікавіліся скаламі пад сваёй фермай, чым пасадкай.\nВыдатныя капальнікі, але жахлівыя фермеры.\nІх девіз: <i>Глыбокая яма — глыбокае задавальненне.</i>"
roRO = "Acești ex-Folktails erau mai interesați de stâncile de sub fermele lor decât de plantat.\nExcelenți săpători, dar agricultori groaznici.\nMotto-ul lor: <i>Gaură adâncă, mulțumire și mai adâncă.</i>"
huHU = "Ezeket a volt Folktaileket jobban érdekelték a farmjuk alatti kövek, mint a vetésben.\nNagyszerű ásók, de borzasztó gazdák.\nMottójuk: <i>Mély gödör, mélyebb elégedettség.</i>"
arSA = "هؤلاء الفولتيلز السابقون كانوا أكثر اهتماماً بالصخور تحت مزرعتهم منه بالزراعة.\nحفارون عظماء، لكنهم مزارعون سيئون للغاية.\nشعارهم: <i>حفرة أعمق، رضا أعمق.</i>"

["Faction.TWDirtclaws.GameOver.Message"]
raw = "Your Dirtclaws struck out instead of striking it rich. This is the end."
status = "normal"
enUS = "Your Dirtclaws struck out instead of striking it rich. This is the end."
zhCN = "你的泥爪族未能致富，而是失败了。这就是结局。"
zhTW = "你的土爪族未能發財，反而失敗了。這就是結局。"
ruRU = "Ваши Земляные Когти не смогли разбогатеть. Это конец."
jaJP = "あなたのダートクローズは豊かになる代わりに失敗しました。これが終わりです。"
frFR = "Vos Griffe-Terre ont échoué au lieu de devenir riches. C'est la fin."
deDE = "„Ihre Dreckkrallen haben versagt, anstatt reich zu werden. Das ist das Ende.“"
plPL = "Twoje Szponowce nie znalazły bogactwa, zamiast tego poniosły porażkę. To koniec."
ptBR = "Seus Garra de Terra falharam em vez de enriquecer. Este é o fim."
koKR = "당신의 더스트클로가 부자가 되기는커녕 실패했습니다. 이것이 끝입니다."
trTR = "Dirtclaws'larınız zengin olmak yerine başarısız oldu. Bu son."
esES = "Tus Garrasucias fracasaron en lugar de hacerse ricos. Este es el fin."
itIT = "I Dirtclaw non hanno fatto fortuna: sono andati in bancarotta. Questa è la fine."
ukUA = "Ваші Копальники програли замість того, щоб розбагатіти. Це кінець."
thTH = "ดินกรงเล็บของคุณพลาดเป้าแทนที่จะร่ำรวย นี่คือจุดจบ"
csCZ = "Vaši Hliněné drápy neuspěli a místo bohatství selhali. Tohle je konec."
viVN = "Dirtclaws của bạn đã thất bại thay vì làm giàu. Đây là điểm kết thúc."
caES = "Els teus Dirtclaws van fracassar en lloc de fer fortuna. Aquest és el final."
beBY = "Вашы Dirtclaws не змаглі збагацецца, а толькі пацярпелі паражэнне. Гэта канец."
roRO = "Dirtclaw-ii tăi au dat greș în loc să facă avere. Acesta este sfârșitul."
huHU = "A Dirtclaws kudarcot vallott, nem a gazdagságot találták meg. Ez a vég."
arSA = "ابتعد فريق Dirtclaws عن الثراء المنشود وخرج خاسراً. هذه هي النهاية."

["Faction.TWDirtclaws.GameOver.Flavor"]
raw = "The hardest stone will crumble in time."
status = "normal"
enUS = "The hardest stone will crumble in time."
zhCN = "最坚硬的岩石终会随时间崩溃。"
zhTW = "最硬的石頭終究會隨著時間崩解。"
ruRU = "Самый твердый камень со временем разрушится."
jaJP = "「最も硬い石も、時とともに崩れ去る。」"
frFR = "La pierre la plus dure finira par se fissurer avec le temps."
deDE = "Der härteste Stein wird mit der Zeit zerbrechen."
plPL = "Najtwardsza skała z czasem się kruszy."
ptBR = "A pedra mais dura se desmanchará com o tempo."
