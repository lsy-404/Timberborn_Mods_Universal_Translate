["ModSetting.TWMoreMines.PayTimeCountAllDesc"]
raw = "When checked, time-driven bonus will increase each day. When unchecked, it only increases on days when adult population is above the pay minimum."
status = "normal"
enUS = "When checked, the time-driven bonus will increase each day. When unchecked, it will increase only on days when the adult population is above the pay minimum."
zhCN = "勾选后，随时间增长的奖金每天都会增加。取消勾选后，只有成年人口高于最低支付人数的日子，奖金才会增加。"
zhTW = "勾選時，按時間計算的獎勵每天都會增加。未勾選時，只有成年人口超過最低薪資門檻的日子才會增加。"
ruRU = "Если включено, бонус, зависящий от времени, будет увеличиваться каждый день. Если отключено, он будет увеличиваться только в те дни, когда численность взрослого населения превышает минимальный порог оплаты."
jaJP = "チェックすると、時間経過によるボーナスは毎日増加します。チェックを外すと、成人人口が最低支給人数を上回る日のみ増加します。"
frFR = "Lorsque cette option est cochée, le bonus lié au temps augmente chaque jour. Lorsqu’elle ne l’est pas, il n’augmente que les jours où la population adulte dépasse le minimum requis pour le salaire."
deDE = "Wenn aktiviert, steigt der zeitabhängige Bonus jeden Tag. Wenn deaktiviert, steigt er nur an Tagen, an denen die erwachsene Bevölkerung über der Mindestzahl für die Bezahlung liegt."
plPL = "Po zaznaczeniu premia zależna od czasu będzie wzrastać każdego dnia. Po odznaczeniu wzrasta tylko w dniach, w których populacja dorosłych przekracza minimalną liczbę uprawniającą do wypłaty."
ptBR = "Quando marcado, o bônus baseado no tempo aumentará a cada dia. Quando desmarcado, ele só aumenta nos dias em que a população adulta está acima do mínimo exigido para o pagamento."
koKR = "체크하면 시간에 따라 증가하는 보너스가 매일 증가합니다. 체크하지 않으면 성체 인구가 최소 지급 인원보다 많은 날에만 증가합니다."
trTR = "İşaretlendiğinde, zamana bağlı bonus her gün artar. İşaretlenmediğinde ise yalnızca yetişkin nüfus ödeme alt sınırının üzerindeyken artar."
esES = "Si está marcada, la bonificación por tiempo aumentará cada día. Si no está marcada, solo aumentará los días en que la población adulta supere el mínimo de pago."
itIT = "Se selezionata, il bonus basato sul tempo aumenterà ogni giorno. Se deselezionata, aumenterà solo nei giorni in cui la popolazione adulta supera il minimo richiesto per la paga."
ukUA = "Якщо позначено, бонус, що залежить від часу, зростатиме щодня. Якщо не позначено, він зростатиме лише в ті дні, коли кількість дорослих перевищує мінімум для оплати."
thTH = "เมื่อเลือก โบนัสตามเวลาจะเพิ่มขึ้นทุกวัน เมื่อไม่เลือก โบนัสจะเพิ่มขึ้นเฉพาะวันที่ประชากรวัยผู้ใหญ่มีจำนวนมากกว่าเกณฑ์ขั้นต่ำสำหรับการจ่ายค่าจ้างเท่านั้น."
csCZ = "Je-li zaškrtnuto, bonus závislý na čase se bude každý den zvyšovat. Není-li zaškrtnuto, zvýší se pouze ve dnech, kdy počet dospělých obyvatel překročí minimální počet pro výplatu."
viVN = "Khi được chọn, tiền thưởng dựa trên thời gian sẽ tăng mỗi ngày. Khi bỏ chọn, tiền thưởng chỉ tăng vào những ngày dân số trưởng thành vượt mức tối thiểu để được trả tiền."
caES = "Si està marcada, la bonificació basada en el temps augmentarà cada dia. Si no està marcada, només augmentarà els dies en què la població adulta superi el mínim requerit per al pagament."
beBY = "Калі пазначана, бонус, які залежыць ад часу, будзе павялічвацца кожны дзень. Калі не пазначана, ён павялічваецца толькі ў тыя дні, калі колькасць дарослых жыхароў перавышае мінімальную колькасць для выплаты."
roRO = "Când este bifată, bonusul bazat pe timp va crește în fiecare zi. Când nu este bifată, acesta crește doar în zilele în care populația adultă depășește minimul necesar pentru plată."
huHU = "Ha be van jelölve, az időalapú bónusz minden nap növekszik. Ha nincs bejelölve, csak azokon a napokon növekszik, amikor a felnőtt népesség meghaladja a fizetési minimumot."
arSA = "عند تحديد هذا الخيار، ستزداد المكافأة المرتبطة بالوقت كل يوم. وعند إلغاء تحديده، لن تزداد إلا في الأيام التي يتجاوز فيها عدد السكان البالغين الحد الأدنى المطلوب لصرف الأجر."

