["Building.TWGroundSupport.FlavorDescription"]
raw = "“It’s not a platform, you pine cone muncher! Platforms don’t use logs.” — Dusty"
status = "normal"
enUS = "\"It’s not a platform, you pine cone muncher! Platforms don’t use logs.\" — Dusty"
zhCN = "“这不是个平台，松果吃货！平台可不使用原木。” — 达斯提"
zhTW = "“這不是平台，你這個松果吃貨！平台不需要原木。” — 達斯提"
ruRU = "«Это не платформа, любитель шишек! Платформы не используют бревна.» — Дасти"
jaJP = "「それはプラットフォームじゃないぞ、松ぼっくりを食べるヤツ！プラットフォームは丸太を使わないんだから。」— ダスティ"
frFR = "“Ce n'est pas une plateforme, espèce de mangeur de pommes de pin ! Les plateformes n'utilisent pas de rondins.” — Dusty"
deDE = "„Es ist keine Plattform, du Tannenzapfenvertilger! Plattformen verwenden keine Stämme.“ — Dusty"
plPL = "„To nie jest platforma, żarłoku sosnowych szyszek! Platformy nie używają kłód.” — Dusty"
ptBR = "“Não é uma plataforma, comedor de pinha! Plataformas não usam toras.” — Dusty"
koKR = "“플랫폼이 아니라니까, 소나무 씨앗 먹는 놈아! 플랫폼은 통나무를 사용하지 않아.” — 더스티"
trTR = "\"Bu bir platform değil, çam kozalaklarıyla beslenen! Platformlar odun kullanmaz.\" — Dusty"
esES = "“¡No es una plataforma, tragapiñas! Las plataformas no usan troncos.” — Dusty"
itIT = "«Non è una piattaforma, mangiapigne! Le piattaforme non usano tronchi.» — Dusty"
ukUA = "“Це не платформа, ти, жувачу соснових шишок! Платформи не використовують колоди.” — Дасті"
thTH = "“นี่มันไม่ใช่แท่นนะ ไอ้ตัวกินลูกสน! แท่นไม่ใช้ท่อนไม้หรอก” — Dusty"
csCZ = "„Není to plošina, ty požírači šišek! Plošiny nepoužívají klády.“ — Dusty"
viVN = "“Đó không phải là một nền tảng, kẻ ăn chóp cây thông! Nền tảng không sử dụng gỗ.” — Dusty"
caES = "“No és una plataforma, tu, menjador de pinyes! Les plataformes no fan servir troncs.” — Dusty"
beBY = "«Гэта не платформа, шышкаед! Для платформаў бярвёны не патрэбныя». — Дасці"
roRO = "„Nu e o platformă, mâncătorule de conuri de pin! Platformele nu folosesc bușteni.” — Dusty"
huHU = "„Ez nem platform, te fenyőtobozzabáló! A platformokhoz nem kellenek rönkök.” — Dusty"
arSA = "«إنها ليست منصة، يا ملتهم مخاريط الصنوبر! المنصات لا تستخدم جذوع الأشجار.» — داستي"

