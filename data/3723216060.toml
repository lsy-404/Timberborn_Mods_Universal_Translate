esES = "Fabrica bloques, piezas y brillantes a partir de metales en bruto."
itIT = "Produci blocchi, componenti e oggetti lucidi a partire da metalli grezzi."
ukUA = "Виготовляйте блоки, деталі та блискучі предмети з сирих металів."
