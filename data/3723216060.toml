["ModSetting.TWMoreMines.DifficultyDesc"]
raw = "Shortcut to set Dirtclaw mod settings for different difficulty levels. This will overwrite any changes you have made to the mod settings."
status = "normal"
enUS = "Shortcut to set Dirtclaw mod settings for different difficulty levels. This will overwrite any changes you have made to the mod settings."
zhCN = "“设置土爪模组不同难度级别的快捷方式。这将覆盖您对模组设置所做的任何更改。”"
zhTW = "“快速設置 Dirtclaw 模組設定以適應不同的難度級別。這將覆蓋您對模組設置所做的任何更改。”"
ruRU = "Язык для настройки параметров мода Dirtclaw для разных уровней сложности. Это перезапишет любые изменения, которые вы внесли в настройки мода."
jaJP = "異なる難易度レベルに対するダートクロー мод 設定を設定するためのショートカットです。これにより、あなたが行った мод 設定の変更は上書きされます。"
frFR = "Raccourci pour définir les paramètres du mod Dirtclaw pour différents niveaux de difficulté. Cela écrasera toutes les modifications que vous avez apportées aux paramètres du mod."
deDE = "„Verknüpfung zum Festlegen der Dirtclaw-Mod-Einstellungen für verschiedene Schwierigkeitsgrade. Dies überschreibt alle Änderungen, die Sie an den Mod-Einstellungen vorgenommen haben.“"
plPL = "Skrót do ustawienia ustawień modów Dirtclaw dla różnych poziomów trudności. To nadpisze wszelkie zmiany, które wprowadziłeś w ustawieniach modów."
ptBR = "Atalho para definir as configurações do mod Dirtclaw para diferentes níveis de dificuldade. Isso substituirá quaisquer alterações que você tenha feito nas configurações do mod."
koKR = "다양한 난이도에 대한 Dirtclaw 모드 설정을 빠르게 설정하는 단축키입니다. 이로 인해 모드 설정에 대해 수정한 내용이 덮어써집니다."
trTR = "Farklı zorluk seviyeleri için Dirtclaw mod ayarlarını belirlemek için kısayol. Bu, mod ayarlarında yaptığınız tüm değişiklikleri geçersiz kılacaktır."
esES = "Atajo para establecer la configuración del mod Dirtclaw para distintos niveles de dificultad. Esto sobrescribirá cualquier cambio que hayas realizado en la configuración del mod."
itIT = "Scorciatoia per impostare le opzioni della mod Dirtclaw per i diversi livelli di difficoltà. Questo sovrascriverà tutte le modifiche che hai apportato alle opzioni della mod."
ukUA = "Ярлик для встановлення налаштувань моду Dirtclaw для різних рівнів складності. Це перезапише всі зміни, які ви внесли в налаштування моду."
thTH = "ทางลัดสำหรับตั้งค่าโมด Dirtclaw ตามระดับความยากต่างๆ การดำเนินการนี้จะเขียนทับการเปลี่ยนแปลงใดๆ ที่คุณเคยทำกับการตั้งค่าโมด"
csCZ = "Zkratka pro nastavení možností modulu Dirtclaw pro různé úrovně obtížnosti. To přepíše jakékoli změny, které jste provedli v nastavení modulu."
viVN = "Phím tắt để thiết lập cài đặt mod Dirtclaw cho các cấp độ khó khác nhau. Điều này sẽ ghi đè lên bất kỳ thay đổi nào bạn đã thực hiện đối với cài đặt mod."
caES = "Dreceres per configurar la configuració del mod Dirtclaw per a diferents nivells de dificultat. Això sobreescriurà qualsevol canvi que hagis fet a la configuració del mod."
beBY = "Ярлык для налады мода Dirtclaw для розных узроўняў складанасці. Гэта перазапіша любыя змены, якія вы ўнеслі ў налады мода."
roRO = "Comandă rapidă pentru a aplica setările modului Dirtclaw pentru diferite niveluri de dificultate. Acest lucru va suprascrie orice modificări pe care le-ai făcut la setările modului."
huHU = "Gyorsparancs a Dirtclaw mod beállításainak beállítására a különböző nehézségi szinteken. Ez felülírja a mod beállításaiban végzett összes módosítást."
arSA = "اختصار لضبط إعدادات مود Dirtclaw لمستويات الصعوبة المختلفة. سيؤدي هذا إلى الكتابة فوق أي تغييرات أجريتها على إعدادات المود."

