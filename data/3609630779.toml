["KyP.Use.IndividualPumpSettingsTooltip"]
raw = "Enabling this will give settings for all pumps on next reload. It can slowdown loading the game by few seconds."
status = "normal"
enUS = "Enabling this will provide settings for all pumps on the next reload. It may slow down game loading by a few seconds."
zhCN = "启用此选项将在下次加载时为所有泵提供设置。这可能会使游戏加载速度减慢几秒钟。"
zhTW = "啟用此選項將在下次重新加載時為所有泵提供設置。這可能會使遊戲加載速度減慢幾秒鐘。"
ruRU = "Включение этой опции позволит задать настройки для всех насосов при следующей перезагрузке. Это может замедлить загрузку игры на несколько секунд."
jaJP = "この設定を有効にすると、次回のリロード時にすべてのポンプに設定を適用できます。ゲームの読み込みが数秒遅くなる可能性があります。"
frFR = "Activer cela donnera des paramètres pour toutes les pompes au prochain chargement. Cela peut ralentir le chargement du jeu de quelques secondes."
deDE = "Durch Aktivieren dieser Option erhalten Sie Einstellungen für alle Pumpen beim nächsten Laden. Dies kann das Laden des Spiels um einige Sekunden verlangsamen."
plPL = "Włączenie tego spowoduje ustawienie opcji dla wszystkich pomp przy następnym załadunku. Może spowolnić ładowanie gry o kilka sekund."
ptBR = "Ativar isso fornecerá configurações para todas as bombas na próxima recarga. Isso pode atrasar o carregamento do jogo por alguns segundos."
koKR = "이 설정을 활성화하면 다음 로드 시 모든 펌프에 대한 설정을 제공합니다. 게임 로딩 속도가 몇 초 느려질 수 있습니다."
csCZ = "Povolením toho se nastaví možnosti pro všechny čerpadla při dalším načtení. Může to zpomalit načítání hry o několik sekund."
viVN = "Kích hoạt tính năng này sẽ áp dụng các cài đặt cho tất cả máy bơm ở lần tải lại tiếp theo. Điều này có thể làm chậm quá trình tải trò chơi thêm vài giây."
trTR = "Bunu etkinleştirmek, bir sonraki yüklemede tüm pompalar için ayarlar verecektir. Oyun yükleme süresini birkaç saniye yavaşlatabilir."
esES = "Habilitar esta opción mostrará ajustes para todas las bombas tras el próximo reinicio. Puede ralentizar la carga del juego durante unos segundos."
itIT = "Attivando questa opzione verranno mostrate le impostazioni per tutte le pompe al successivo riavvio. Il caricamento del gioco potrebbe rallentare di alcuni secondi."
ukUA = "Увімкнення цього параметра додасть налаштування для всіх насосів після наступного перезавантаження. Це може уповільнити завантаження гри на кілька секунд."
thTH = "เมื่อเปิดใช้งานการตั้งค่านี้ จะมีการตั้งค่าสำหรับปั๊มทั้งหมดหลังจากโหลดใหม่ครั้งถัดไป อาจทำให้การโหลดเกมช้าลงไปหลายวินาที"
caES = "Activar aquesta opció mostrarà la configuració de totes les bombes en la propera recàrrega. Pot alentir la càrrega del joc durant uns quants segons."
beBY = "Уключэнне гэтай опцыі дасць магчымасць наладжваць усе помпы пасля наступнай перазагрузкі. Гульня можа загружацца на некалькі секунд даўжэй."
roRO = "Activarea acestei opțiuni va oferi setări pentru toate pompele la următoarea reîncărcare. Poate încetini încărcarea jocului cu câteva secunde."
huHU = "Ennek engedélyezése a következő újratöltéskor beállításokat ad minden szivattyúhoz. A játék betöltése néhány másodperccel lassabb lehet."
arSA = "يؤدي تفعيل هذا الخيار إلى إتاحة إعدادات لجميع المضخات عند إعادة التحميل التالية. وقد يؤدي ذلك إلى إبطاء تحميل اللعبة لبضع ثوانٍ."
