["LV.MRe.OfferToLoad"]
raw = "Resized map saved. Do you want to load that save? Note: continuing this session will likely crash the game anyway."
status = "normal"
enUS = "Resized map saved. Do you want to load that save? Note: continuing this session will likely crash the game anyway."
zhCN = "已将调整大小后的地图保存为新存档，是否需要加载此存档？注意，如果继续当前游戏进程，可能会导致游戏崩溃。"
zhTW = "已儲存調整大小的地圖。您想加載該儲檔嗎？注意：繼續此會話可能仍會導致遊戲崩潰。"
ruRU = "Сохранён изменённый карта. Вы хотите загрузить это сохранение? Обратите внимание: продолжение этой сессии, вероятно, приведёт к сбою игры."
jaJP = "リサイズされたマップが保存されました。保存を読み込みますか？注意：このセッションを続けると、ゲームがクラッシュする可能性が高いです。"
frFR = "Carte redimensionnée enregistrée. Voulez-vous charger cette sauvegarde ? Remarque : continuer cette session entraînera probablement un crash du jeu de toute façon."
deDE = "Die verkleinerte Karte wurde gespeichert. Möchtest du dieses Speicherstand laden? Hinweis: Das Fortsetzen dieser Sitzung könnte das Spiel ohnehin zum Absturz bringen."
plPL = "Zmieniona mapa zapisana. Czy chcesz załadować tę zapisaną wersję? Uwaga: kontynuowanie tej sesji prawdopodobnie i tak spowoduje awarię gry."
ptBR = "Mapa redimensionado salvo. Você deseja carregar essa gravação? Nota: continuar esta sessão provavelmente fará o jogo travar de qualquer maneira."
koKR = "크기가 조정된 맵이 저장되었습니다. 해당 저장을 로드하시겠습니까? 참고: 이 세션을 계속하면 게임이 충돌할 가능성이 높습니다."
trTR = "Boyutlandırılmış harita kaydedildi. O kaydı yüklemek ister misin? Not: Bu oturuma devam etmek oyunun çökmesine neden olabilir."
esES = "Mapa redimensionado guardado. ¿Quieres cargar esa partida guardada? Nota: continuar con esta sesión probablemente bloqueará el juego de todos modos."
itIT = "Mappa ridimensionata salvata. Vuoi caricare quel salvataggio? Nota: continuare con questa sessione probabilmente farà crashare il gioco comunque."
ukUA = "Карту змінено за розміром і збережено. Бажаєте завантажити це збереження? Примітка: продовження цього сеансу, імовірно, однаково призведе до збою гри."
thTH = "แผนที่ที่ปรับขนาดแล้วถูกบันทึกไว้ คุณต้องการโหลดเซฟนั้นหรือไม่ หมายเหตุ: หากดำเนินเซสชันนี้ต่อ เกมน่าจะขัดข้องอยู่ดี"
csCZ = "Mapu přizpůsobenou na velikost je uložena. Chcete načíst toto uložení? Poznámka: pokračování v této relaci pravděpodobně hru stejně způsobí pád."
viVN = "Bản đồ đã được lưu sau khi thay đổi kích thước. Bạn có muốn tải bản lưu đó không? Lưu ý: tiếp tục phiên này có thể khiến trò chơi bị treo hoặc gặp sự cố."
caES = "Mapa redimensionat desat. Voleu carregar aquest desat? Nota: continuar amb aquesta sessió probablement farà que el joc es bloquegi de totes maneres."
beBY = "Карта са зменшаным памерам захавана. Вы хочаце загрузіць гэты захаваны стан? Заўвага: працягванне гэтай сесіі, хутчэй за ўсё, усё роўна выкліча збой гульні."
roRO = "Harta redimensionată a fost salvată. Dorești să încarci acel salvat? Notă: continuarea acestei sesiuni va duce probabil oricum la prăbușirea jocului."
huHU = "Az átméretezett térkép mentése megtörtént. Szeretnéd betölteni ezt a mentést? Megjegyzés: a játék ebben a munkamenetben valószínűleg így is összeomlik."
arSA = "تم حفظ الخريطة بعد تغيير حجمها. هل تريد تحميل هذا الحفظ؟ ملاحظة: متابعة هذه الجلسة على أي حال ستؤدي على الأرجح إلى تعطل اللعبة."

["LV.MRe.ResizeInvalidObj"]
raw = "There are objects outside of the map after you shrink it. Remove all those objects before shrinking to prevent crashing? (This action will only remove the objects, you need to come back here to resize again)"
status = "normal"
enUS = "There are objects outside of the map after you shrink it. Remove all those objects before shrinking to prevent crashing? (This action will only remove the objects; you need to come back here to resize again.)"
zhCN = "检测到将被缩减的地图部分上存在物体，是否需要先删除物体？注意，如果不删除，后续调整地图大小时可能会导致游戏崩溃。"
zhTW = "在縮小地圖之前，請刪除所有地圖外的物體，以防止崩潰。（此操作僅會刪除物體，您需要返回此處再次調整大小）"
ruRU = "Есть объекты за пределами карты после ее уменьшения. Удалите все эти объекты перед уменьшением, чтобы избежать сбоев? (Это действие только удалит объекты, вам нужно вернуться сюда, чтобы изменить размер снова)"
jaJP = "マップを縮小した後に外にあるオブジェクトがあります。クラッシュを防ぐために、縮小する前にそれらのオブジェクトをすべて削除してください。このアクションはオブジェクトを削除するだけで、再度サイズ変更するためにはここに戻る必要があります。"
frFR = "Il y a des objets en dehors de la carte après l'avoir réduite. Supprimez tous ces objets avant de réduire pour éviter un crash ? (Cette action ne fera que supprimer les objets, vous devrez revenir ici pour redimensionner à nouveau)"
deDE = "Es gibt Objekte außerhalb der Karte, nachdem du sie verkleinert hast. Entferne alle diese Objekte, bevor du sie verkleinerst, um Abstürze zu vermeiden? (Diese Aktion entfernt nur die Objekte, du musst hierher zurückkommen, um erneut zu skalieren.)"
plPL = "Są obiekty poza mapą po jej pomniejszeniu. Usuń wszystkie te obiekty przed pomniejszeniem, aby zapobiec awarii. (Ta czynność usunie tylko obiekty, musisz wrócić tutaj, aby ponownie zmienić rozmiar.)"
ptBR = "Existem objetos fora do mapa depois que você o reduz. Remova todos esses objetos antes de reduzir para evitar uma falha? (Esta ação só removerá os objetos, você precisará voltar aqui para redimensionar novamente)"
koKR = "크기 조정 후 맵 밖에 객체가 있습니다. 충돌을 방지하기 위해 크기를 줄이기 전에 해당 객체를 모두 제거하시겠습니까? (이 작업은 객체만 제거하며, 다시 크기를 조정하려면 이곳으로 돌아와야 합니다)"
trTR = "Haritayı küçülttükten sonra haritanın dışındaki nesneler var. Çöküşü önlemek için bunları küçültmeden önce kaldırın? (Bu eylem yalnızca nesneleri kaldırır, tekrar boyutlandırmak için buraya geri dönmeniz gerekiyor)"
esES = "Hay objetos fuera del mapa después de reducirlo. ¿Eliminar todos esos objetos antes de reducirlo para evitar que el juego se bloquee? (Esta acción solo eliminará los objetos; tendrás que volver aquí para volver a cambiar el tamaño)."
itIT = "Ci sono oggetti al di fuori della mappa dopo che la riduci. Rimuovere tutti questi oggetti prima di ridurla per evitare arresti anomali? (Questa azione rimuoverà solo gli oggetti; dovrai tornare qui per ridimensionare di nuovo)"
ukUA = "Після зменшення карти за її межами залишаються об'єкти. Видаліть усі ці об'єкти перед зменшенням, щоб уникнути збою? (Ця дія лише видалить об'єкти, щоб змінити розмір, вам знову потрібно буде повернутися сюди.)"
thTH = "มีวัตถุอยู่นอกแผนที่หลังจากที่คุณย่อขนาดแผนที่ ลบวัตถุทั้งหมดเหล่านั้นก่อนย่อขนาดเพื่อป้องกันการแครชใช่หรือไม่ (การกระทำนี้จะลบเฉพาะวัตถุเท่านั้น คุณต้องกลับมาที่นี่อีกครั้งเพื่อปรับขนาดใหม่)"
csCZ = "Na mapě zůstaly objekty po jejím zmenšení. Odstraňte všechny tyto objekty před zmenšením, abyste předešli pádu hry? (Tato akce pouze odstraní objekty, musíte se sem vrátit, abyste mohli znovu změnit velikost)"
viVN = "Có các đối tượng ở ngoài bản đồ sau khi bạn thu nhỏ nó. Xóa tất cả những đối tượng đó trước khi thu nhỏ để tránh bị treo? (Hành động này chỉ xóa các đối tượng, bạn cần quay lại đây để thay đổi kích thước lần nữa)"
caES = "Hi ha objectes fora del mapa després de reduir-lo. Vols eliminar tots aquests objectes abans de reduir-lo per evitar que el joc es bloquegi? (Aquesta acció només eliminarà els objectes; hauràs de tornar aquí per tornar a redimensionar el mapa.)"
beBY = "Пасля памяншэння карты некаторыя аб'екты апынуліся за межамі карты. Выдаліць усе гэтыя аб'екты перад памяншэннем, каб пазбегнуць збою? (Гэта дзеянне выдаліць толькі аб'екты; каб змяніць памер, вам трэба будзе вярнуцца сюды.)"
roRO = "Există obiecte în afara hărții după ce o micșorezi. Îndepărtează toate aceste obiecte înainte de micșorare pentru a preveni blocarea jocului? (Această acțiune va elimina doar obiectele, va trebui să revii aici pentru a redimensiona din nou.)"
huHU = "A térkép méretének csökkentése után vannak a térképen kívül eső objektumok. Távolítsd el ezeket az objektumokat a méretezés előtt, hogy elkerüld az összeomlást? (Ez a művelet csak az objektumokat távolítja el, a méretezéshez újra ide kell visszajönnöd.)"
arSA = "هناك كائنات خارج الخريطة بعد تصغيرها. هل تريد إزالة كل هذه الكائنات قبل التصغير لتجنب الانهيار؟ (سيقتصر هذا الإجراء على إزالة الكائنات فقط، وستحتاج إلى العودة إلى هنا لإعادة تغيير الحجم)"

