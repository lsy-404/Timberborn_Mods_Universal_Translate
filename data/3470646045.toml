["LV.MRe.SaveWarning"]
raw = "<RedHighlight>Remember to save your game before resizing the map! This game session will likely not work anymore after resizing. You should also pause the game before using this.</RedHighlight>"
status = "normal"
enUS = "Remember to save your game before resizing the map! This game session will likely not work anymore after resizing. You should also pause the game before using this."
zhCN = "<color=#FF4C4C>注意，调整地图大小前，请暂停并保存游戏。调整地图大小后，可能无法继续当前游戏进程。</color>"
zhTW = "<RedHighlight>記得在調整地圖大小之前保存遊戲！這個遊戲會話在調整後可能不再正常運作。在使用這個功能之前，你也應該暫停遊戲。</RedHighlight>"
ruRU = "<RedHighlight>Не забудьте сохранить вашу игру перед изменением размера карты! Эта игровая сессия, вероятно, больше не будет работать после изменения размера. Также следует приостановить игру перед использованием этого.</RedHighlight>"
jaJP = "<RedHighlight>マップをサイズ変更する前に、ゲームを保存するのを忘れないでください！ サイズ変更後、このゲームセッションはおそらく機能しなくなります。使用する前にゲームを一時停止することもお勧めします。</RedHighlight>"
frFR = "<RedHighlight>Souvenez-vous de sauvegarder votre partie avant de redimensionner la carte ! Cette session de jeu risque de ne plus fonctionner après le redimensionnement. Vous devriez également mettre le jeu en pause avant d'utiliser cela.</RedHighlight>"
deDE = "<RedHighlight>Denken Sie daran, Ihr Spiel zu speichern, bevor Sie die Karte ändern! Diese Spielsitzung funktioniert wahrscheinlich nicht mehr nach der Größenänderung. Sie sollten das Spiel auch pausieren, bevor Sie dies verwenden.</RedHighlight>"
plPL = "<RedHighlight>Pamiętaj, aby zapisać grę przed zmianą rozmiaru mapy! Ta sesja gry prawdopodobnie nie będzie działać po zmianie rozmiaru. Powinieneś również wstrzymać grę przed użyciem tego.</RedHighlight>"
ptBR = "<RedHighlight>Lembre-se de salvar seu jogo antes de redimensionar o mapa! Esta sessão de jogo provavelmente não funcionará mais após o redimensionamento. Você também deve pausar o jogo antes de usar isso.</RedHighlight>"
koKR = "<RedHighlight>지도를 크기 변경하기 전에 게임을 저장하는 것을 잊지 마세요! 크기 변경 후 이 게임 세션은 더 이상 작동하지 않을 가능성이 높습니다. 사용하기 전에 게임을 일시 정지하는 것이 좋습니다.</RedHighlight>"
trTR = "<RedHighlight>Haritayı yeniden boyutlandırmadan önce oyununuzu kaydetmeyi unutmayın! Bu oyun oturumu yeniden boyutlandırdıktan sonra muhtemelen çalışmayacaktır. Ayrıca bunu kullanmadan önce oyunu duraklatmalısınız.</RedHighlight>"
esES = "<RedHighlight>¡Recuerda guardar la partida antes de cambiar el tamaño del mapa! Es probable que esta sesión de juego deje de funcionar después de cambiar el tamaño. También deberías pausar el juego antes de usar esto.</RedHighlight>"
itIT = "<RedHighlight>Ricordati di salvare la partita prima di ridimensionare la mappa! Dopo il ridimensionamento, questa sessione di gioco probabilmente non funzionerà più. Dovresti anche mettere in pausa il gioco prima di usarlo.</RedHighlight>"
ukUA = "<RedHighlight>Не забудьте зберегти гру перед зміною розміру карти! Після зміни розміру ця ігрова сесія, імовірно, більше не працюватиме. Перед використанням цього також слід призупинити гру.</RedHighlight>"
thTH = "<RedHighlight>อย่าลืมบันทึกเกมก่อนปรับขนาดแผนที่! เซสชันเกมนี้อาจใช้งานไม่ได้อีกหลังจากปรับขนาดแล้ว นอกจากนี้ควรหยุดเกมชั่วคราวก่อนใช้งานฟีเจอร์นี้</RedHighlight>"
csCZ = "<RoseHighlight>Nezapomeňte si uložit hru před změnou velikosti mapy! Tato herní relace pravděpodobně po změně velikosti nebude fungovat. Měli byste také hru pozastavit před jejím použitím.</RoseHighlight>"
viVN = "<RedHighlight>Hãy lưu trò chơi của bạn trước khi điều chỉnh kích thước bản đồ! Phiên chơi này có thể sẽ không còn hoạt động nữa sau khi thay đổi kích thước bản đồ. Bạn cũng nên tạm dừng trò chơi trước khi sử dụng thao tác này.</RedHighlight>"
caES = "<RedHighlight>Recorda desar la partida abans de canviar la mida del mapa! Aquesta sessió de joc probablement deixarà de funcionar després de canviar la mida. També hauries de pausar el joc abans d'utilitzar-ho.</RedHighlight>"
beBY = "<RedHighlight>Не забудзьцеся захаваць гульню перад змяненнем памеру карты! Пасля змянення памеру гэты гульнявы сеанс, хутчэй за ўсё, больш не будзе працаваць. Таксама перад выкарыстаннем гэтага варта прыпыніць гульню.</RedHighlight>"
roRO = "<RedHighlight>Nu uita să salvezi jocul înainte de a redimensiona harta! Această sesiune de joc probabil nu va mai funcționa după redimensionare. Ar trebui să pui jocul pe pauză și înainte de a folosi aceasta.</RedHighlight>"
huHU = "<RedHighlight>Ne felejtsd el elmenteni a játékot a térkép átméretezése előtt! Az átméretezés után valószínűleg ez a játékmenet már nem fog működni. Ezt a funkciót szintén érdemes szüneteltetett játék mellett használni.</RedHighlight>"
arSA = "<RedHighlight>تذكّر حفظ لعبتك قبل تغيير حجم الخريطة! من المرجّح ألا تعمل جلسة اللعب هذه بعد تغيير الحجم. يجب عليك أيضًا إيقاف اللعبة مؤقتًا قبل استخدام هذه الميزة.</RedHighlight>"
