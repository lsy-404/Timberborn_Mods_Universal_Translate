["Building.Floodgate.Flat.Description"]
raw = "Blocks water up to an adjustable height. A new more compact design to allow you to build on top of them."
status = "normal"
enUS = "Blocks water up to an adjustable height. A new more compact design to allow you to build on top of them."
zhCN = "阻挡水流至可调节的高度。采用全新更紧凑的设计，允许您在其上方建造。"
zhTW = "阻擋水位至可調整的高度。全新的緊湊設計，讓你可以在其上建造。"
ruRU = "Блокирует воду до регулируемой высоты. Новый более компактный дизайн, который позволяет строить поверх них."
jaJP = "水を調整可能な高さまでブロックします。よりコンパクトな新しいデザインにより、その上に建設することができます。"
frFR = "Bloque l'eau jusqu'à une hauteur réglable. Un nouveau design plus compact pour vous permettre de construire au-dessus."
deDE = "Blockiert Wasser bis zu einer verstellbaren Höhe. Ein neues, kompakteres Design, das es Ihnen ermöglicht, auf ihnen zu bauen."
plPL = "Blokuje wodę do regulowanej wysokości. Nowa, bardziej kompaktowa konstrukcja umożliwia budowę na ich szczycie."
ptBR = "Bloqueia a água até uma altura ajustável. Um novo design mais compacto para permitir que você construa em cima deles."
koKR = "수위를 조절할 수 있는 높이까지 물을 차단합니다. 위에 건설할 수 있도록 보다 간결한 새 디자인입니다."
trTR = "Su düzeyini ayarlanabilir bir yükseklikten engeller. Üzerinde inşa etmenize olanak tanıyan daha kompakt bir tasarım."
esES = "Bloquea el agua hasta una altura ajustable. Un diseño nuevo y más compacto que permite construir sobre ellas."
itIT = "Blocca l’acqua fino a un’altezza regolabile. Un nuovo design più compatto che consente di costruirci sopra."
ukUA = "Перекриває воду на регульованій висоті. Нова, компактніша конструкція дає змогу будувати поверх неї."
thTH = "กั้นน้ำได้สูงสุดตามระดับที่ปรับได้ ดีไซน์ใหม่ที่กะทัดรัดยิ่งขึ้น ช่วยให้สร้างสิ่งปลูกสร้างไว้ด้านบนได้"
csCZ = "Zabraňuje proudu vody až do nastavené výšky. Nový kompaktnější design umožňuje stavět na jejich vrchu."
viVN = "Chặn nước lên đến một chiều cao điều chỉnh. Thiết kế mới nhỏ gọn hơn cho phép bạn xây dựng bên trên chúng."
caES = "Bloqueja l'aigua fins a una alçada ajustable. Un disseny nou i més compacte que permet construir-hi al damunt."
beBY = "Затрымлівае ваду да рэгуляванай вышыні. Новая, больш кампактная канструкцыя дазваляе будаваць на ёй."
roRO = "Blochează apa până la o înălțime reglabilă. Un design nou, mai compact, care permite construirea deasupra lor."
huHU = "Állítható magasságig tartja vissza a vizet. Új, kompaktabb kialakításának köszönhetően építhetsz rá."
arSA = "تحجب المياه حتى ارتفاع قابل للتعديل. تصميم جديد وأكثر إحكامًا يتيح لك البناء فوقها."

