["Building.Wonder.Emberpelts.Description"]
raw = "Distributes resources across the Earth. When launched, makes the beavers in the area extra happy."
status = "normal"
enUS = "Distributes resources across the Earth. When activated, makes the beavers in the area extra happy."
zhCN = "“在地球上分配资源。发射时，会让该地区的海狸们特别开心。”"
zhTW = "在地面上分配資源。啟動時，會讓該區域的海狸特別快樂。"
ruRU = "Распределяет ресурсы по всей Земле. При запуске делает бобров в округе особенно счастливыми."
jaJP = "地球全体に資源を分配します。発射されると、そのエリアのビーバーたちを特に幸せにします。"
frFR = "Distribue des ressources à travers la Terre. Lorsqu'il est lancé, rend les castors de la zone particulièrement heureux."
deDE = "„Verteilt Ressourcen über die Erde. Wenn gestartet, macht es die Biber in der Umgebung besonders glücklich.“"
plPL = "Rozprowadza zasoby po Ziemi. Po uruchomieniu sprawia, że bobry w okolicy są wyjątkowo szczęśliwe."
ptBR = "Distribui recursos pela Terra. Quando lançado, torna os castores na área extra felizes."
koKR = "지구 전역에 자원을 분배합니다. 발사될 때, 해당 지역의 비버들을 더욱 행복하게 만듭니다."
trTR = "Kaynakları Dünya genelinde dağıtır. Başlatıldığında, alandaki kunduzları ekstra mutlu eder."
esES = "Distribuye recursos por toda la Tierra. Al lanzarlo, hace que los castores de la zona estén aún más felices."
itIT = "Distribuisce risorse in tutto il mondo. Quando viene lanciata, rende i castori della zona ancora più felici."
ukUA = "Розподіляє ресурси по всій Землі. Після запуску робить бобрів у цій місцевості ще щасливішими."
thTH = "กระจายทรัพยากรไปทั่วโลก เมื่อปล่อยขึ้นแล้ว จะทำให้บีเวอร์ในพื้นที่มีความสุขเป็นพิเศษ"
csCZ = "Distribuuje zdroje po Zemi. Po spuštění činí bobry v oblasti extra šťastné."
viVN = "Phân phối tài nguyên trên toàn trái đất. Khi được khởi động, làm cho những con nhím trong khu vực trở nên hạnh phúc hơn."
caES = "Distribueix recursos per tota la Terra. Quan es llança, fa que els castors de la zona siguin encara més feliços."
beBY = "Размеркоўвае рэсурсы па ўсёй Зямлі. Пасля запуску робіць баброў у наваколлі яшчэ больш шчаслівымі."
roRO = "Distribuie resurse pe tot Pământul. La lansare, îi face pe castorii din zonă foarte fericiți."
huHU = "Szétosztja az erőforrásokat szerte a Földön. Elindításakor még boldogabbá teszi a környéken élő hódokat."
arSA = "يوزّع الموارد في أنحاء الأرض. عند إطلاقه، يجعل القنادس في المنطقة أكثر سعادة."

["Building.Wonder.Emberpelts.FlavorDescription"]
raw = "It looks like a big fire pit to me."
status = "normal"
enUS = "It looks like a big fire pit to me."
zhCN = "对我来说，这看起来像一个大篝火坑。"
zhTW = "在我看來這像是一個大火坑。"
ruRU = "Выглядит как большая костровая яма."
jaJP = "私には大きな火の焚き火のように見えます。"
frFR = "Ça ressemble à un grand foyer pour moi."
deDE = "Das sieht für mich wie ein großes Feuerloch aus."
plPL = "Wydaje mi się, że to duży ognisko."
ptBR = "Me parece uma grande fogueira."
koKR = "저에게는 큰 화로처럼 보입니다."
trTR = "Bana büyük bir ateş çukuru gibi görünüyor."
esES = "A mí me parece un gran brasero."
itIT = "A me sembra un grande braciere."
ukUA = "Мені це схоже на велику ватру."
thTH = "สำหรับฉัน มันดูเหมือนหลุมกองไฟขนาดใหญ่เลย"
csCZ = "Vypadá to jako velký ohniště pro mě."
viVN = "Đối với tôi, nó trông giống như một cái hố lửa lớn."
caES = "A mi em sembla una gran foguera."
beBY = "На мой погляд, гэта вялікая вогнішча."
roRO = "Mie mi se pare un foc de tabără mare."
huHU = "Nekem egy nagy tűzrakóhelynek tűnik."
arSA = "يبدو لي وكأنه موقد نار كبير."

["Faction.Emberpelts.WonderCompletionFlavor"]
raw = "Having collected great wealth and knowledge, your beavers attempted to share the fruits of their labour with the suffering planet. Unfortunately it all went up in flames. At least your beavers got to see things burn!"
status = "normal"
enUS = "Having collected great wealth and knowledge, your beavers attempted to share the fruits of their labor with the suffering planet. Unfortunately, it all went up in flames. At least your beavers got to see things burn!"
zhCN = "在获得了丰富的财富和知识后，你的海狸们试图将他们劳动的果实与受苦的星球分享。不幸的是，这一切都化为灰烬。至少你的海狸们得以目睹这一切燃烧！"
zhTW = "在收集了巨大的財富和知識之後，你的海狸試圖將他們勞動的成果分享給痛苦的星球。不幸的是，一切都燒成了灰燼。至少你的海狸看到了火焰！"
ruRU = "Собрав большое количество богатства и знаний, ваши бобры попытались поделиться плодами своего труда с страдающей планетой. К сожалению, всё это сгорело дотла. По крайней мере, ваши бобры смогли увидеть, как всё горит!"
jaJP = "「大きな富と知識を集めたあなたのビーバーたちは、苦しむ地球とその労働の成果を共有しようとしました。しかし、残念ながらすべてが炎に包まれてしまいました。少なくともあなたのビーバーたちは燃える様子を見ることができました！」"
frFR = "Ayant acquis une grande richesse et des connaissances, vos castors ont tenté de partager les fruits de leur travail avec la planète en souffrance. Malheureusement, tout a pris feu. Au moins, vos castors ont pu voir les choses brûler !"
deDE = "Nachdem sie großen Reichtum und Wissen gesammelt hatten, versuchten deine Biber, die Früchte ihrer Arbeit mit dem leidenden Planeten zu teilen. Leider ging alles in Flammen auf. Zumindest konnten deine Biber sehen, wie alles brannte!"
plPL = "Zbierając ogromne bogactwo i wiedzę, twoje bobry próbowały podzielić się owocami swojej pracy z cierpiącą planetą. Niestety, wszystko poszło z dymem. Przynajmniej twoje bobry mogły zobaczyć, jak wszystko płonie!"
ptBR = "Tendo coletado grande riqueza e conhecimento, seus castores tentaram compartilhar os frutos de seu trabalho com o planeta que sofre. Infelizmente, tudo foi consumido pelas chamas. Pelo menos seus castores puderam ver as coisas pegarem fogo!"
koKR = "막대한 부와 지식을 모은 당신의 비버들은 고통받는 지구와 그들의 노동의 결실을 나누려 했습니다. 불행히도 모든 것이 불타 없어졌습니다. 적어도 당신의 비버들은 불타는 것을 목격할 수 있었습니다!"
trTR = " Büyük servet ve bilgi toplayan kunduzlarınız, çalışmalarının meyvelerini acı çeken gezegenle paylaşmaya çalıştılar. Ne yazık ki her şey alev aldı. En azından kunduzlarınız her şeyin yanışını görebildi!"
esES = "Tras acumular grandes riquezas y conocimientos, tus castores intentaron compartir los frutos de su trabajo con el planeta sufriente. Por desgracia, todo acabó pasto de las llamas. ¡Al menos tus castores pudieron ver cómo ardía todo!"
itIT = "Dopo aver accumulato grandi ricchezze e conoscenze, i tuoi castori hanno tentato di condividere i frutti del loro lavoro con il pianeta sofferente. Purtroppo è andato tutto in fiamme. Almeno i tuoi castori hanno potuto vedere tutto bruciare!"
ukUA = "Зібравши великі багатства й знання, ваші бобри спробували поділитися плодами своєї праці зі стражденною планетою. На жаль, усе згоріло дотла. Принаймні ваші бобри встигли побачити, як усе горить!"
thTH = "หลังจากสะสมความมั่งคั่งและความรู้ไว้มากมาย บีเวอร์ของคุณก็พยายามแบ่งปันผลจากหยาดเหงื่อแรงงานกับดาวเคราะห์ที่กำลังทุกข์ระทม แต่น่าเสียดายที่ทุกอย่างกลับมอดไหม้ไปกับกองเพลิง อย่างน้อยบีเวอร์ของคุณก็ได้เห็นทุกอย่างถูกเผาวอด!"
csCZ = "Poté, co nashromáždili velké bohatství a znalosti, se vaši bobři pokusili sdílet plody své práce s trpící planetou. Bohužel vše lehlo popelem. Aspoň vaši bobři viděli, jak se věci pálí!"
viVN = "Với việc tích lũy được phong phú tài sản và kiến thức, những con hải ly của bạn đã cố gắng chia sẻ thành quả lao động của họ với hành tinh đang chịu đựng. Thật không may, mọi thứ đều bốc cháy. Ít nhất thì những con hải ly của bạn cũng đã được chứng kiến mọi thứ bùng cháy!"
caES = "Després d'haver acumulat grans riqueses i coneixements, els teus castors van intentar compartir els fruits de la seva feina amb el planeta, que tant patia. Malauradament, tot va acabar en flames. Si més no, els teus castors van poder veure com tot cremava!"
beBY = "Назапасіўшы вялікія багацці і веды, вашы бабры паспрабавалі падзяліцца пладамі сваёй працы з планетай, якая пакутавала. На жаль, усё згарэла. Прынамсі, вашы бабры паспелі пабачыць, як усё гарыць!"
roRO = "După ce au strâns o mare avere și multă cunoaștere, castorii tăi au încercat să împartă roadele muncii lor cu planeta aflată în suferință. Din păcate, totul a luat foc. Măcar castorii tăi au apucat să vadă cum arde totul!"
huHU = "A hatalmas vagyon és tudás birtokában hódjaid megpróbálták megosztani munkájuk gyümölcsét a szenvedő bolygóval. Sajnos minden lángba borult. Legalább a hódjaid láthatták, ahogy minden leég!"
arSA = "بعد أن جمعت قنادسك ثروةً ومعرفةً عظيمتين، حاولت مشاركة ثمار عملها مع الكوكب المعذّب. لكن لسوء الحظ، التهمت النيران كل شيء. على الأقل، أتيحت لقنادسك فرصة مشاهدة الأشياء وهي تحترق!"

["Faction.Emberpelts.WonderCompletionMessage"]
raw = "Congratulations! You mastered Emberpelts and used this map's resources to build the faction's wonder."
status = "normal"
enUS = "Congratulations! You mastered Emberpelts and used this map's resources to build the faction's wonder."
zhCN = "恭喜！您掌握了 Emberpelts，并利用此地图的资源建造了该派系的奇迹。"
zhTW = "恭喜！您掌握了 Emberpelts，並利用這張地圖的資源建造了該派系的奇觀。"
ruRU = "Поздравляем! Вы освоили Emberpelts и использовали ресурсы этой карты для постройки чуда фракции."
jaJP = "おめでとうございます！あなたはエンバーペルツを習得し、このマップの資源を使って派閥のワンダーを建設しました。"
frFR = "Félicitations ! Vous avez maîtrisé Emberpelts et utilisé les ressources de cette carte pour construire la merveille de la faction."
deDE = "Herzlichen Glückwunsch! Du hast die Emberpelts gemeistert und die Ressourcen dieser Karte genutzt, um das Wunder der Fraktion zu bauen."
plPL = "Gratulacje! Opanowałeś Emberpelts i wykorzystałeś zasoby tej mapy do zbudowania cudu frakcji."
ptBR = "Parabéns! Você dominou os Emberpelts e usou os recursos deste mapa para construir a maravilha da facção."
koKR = "축하합니다! 당신은 Emberpelts를 마스터하고 이 맵의 자원을 사용하여 파벌의 경이로운 건축물을 세웠습니다."
trTR = "Tebrikler! Emberpelts'i ustaca yönettiniz ve bu haritanın kaynaklarını kullanarak fraksiyonun harikasını inşa ettiniz."
esES = "¡Enhorabuena! Has dominado a los Pieles de Ascua y has usado los recursos de este mapa para construir la maravilla de la facción."
itIT = "Congratulazioni! Hai padroneggiato gli Emberpelts e hai usato le risorse di questa mappa per costruire la meraviglia della fazione."
ukUA = "Вітаємо! Ви опанували Попелястошкурих і використали ресурси цієї мапи, щоб збудувати диво фракції."
thTH = "ยินดีด้วย! คุณเชี่ยวชาญฝ่าย Emberpelts และใช้ทรัพยากรบนแผนที่นี้สร้างสิ่งมหัศจรรย์ของฝ่ายได้สำเร็จ."
csCZ = "Gratulujeme! Ovládl jsi Emberpelty a využil jsi zdroje z této mapy k postavení divu frakce."
viVN = "Chúc mừng! Bạn đã thành thạo Emberpelts và sử dụng tài nguyên của bản đồ này để xây dựng kỳ quan của phe."
caES = "Enhorabona! Has dominat la facció Emberpelts i has fet servir els recursos d'aquest mapa per construir-ne la meravella."
beBY = "Віншуем! Вы асвоілі Emberpelts і выкарысталі рэсурсы гэтай карты, каб пабудаваць цуд фракцыі."
roRO = "Felicitări! Ai stăpânit Emberpelts și ai folosit resursele acestei hărți pentru a construi minunea facțiunii."
huHU = "Gratulálunk! Tökéletesen elsajátítottad az Emberpelts frakciót, és a térkép erőforrásait felhasználva felépítetted a frakció csodáját."
arSA = "تهانينا! لقد أتقنت إمبربلتس واستخدمت موارد هذه الخريطة لبناء أعجوبة الفصيل."

