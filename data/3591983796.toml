["Lapantouflemagic.Carrotboard.Description"]
raw = "Makes nearby beavers more likely to eat carrots\n<color=red>This REDUCES the carrot need</color>\nwhich means beavers will eat more carrots to fill it up"
status = "normal"
enUS = "Makes nearby beavers more likely to eat carrots\n<color=red>This REDUCES the carrot need</color>\nwhich means beavers will eat more carrots to fill it up"
zhCN = "让周围的海狸更想吃胡萝卜。<br><color=#FF66FF>胡萝卜消耗增加。</color>"
zhTW = "使附近的海狸更有可能吃胡蘿蔔  \n<color=red>這會減少對胡蘿蔔的需求</color>  \n這意味著海狸會吃更多的胡蘿蔔來填補需求"
ruRU = "Увеличивает вероятность того, чтоNearby бобры будут есть морковку\n<color=red>ЭТО УМЕНЬШАЕТ потребность в моркови</color>\nчто означает, что бобры будут есть больше моркови, чтобы восполнить ее"
jaJP = "近くのビーバーがニンジンを食べる可能性を高めます\n<color=red>これによりニンジンの必要量が減少します</color>\nつまり、ビーバーはそれを満たすためにより多くのニンジンを食べるようになります。"
frFR = "Rend les castors à proximité plus susceptibles de manger des carottes  \n<color=red>CECI RÉDUIT le besoin en carottes</color>  \nce qui signifie que les castors mangeront plus de carottes pour le combler."
deDE = "Erhöht die Wahrscheinlichkeit, dass benachbarte Biber Karotten essen.  \n<color=red>Dies VERRINGERT den Karottenbedarf</color>  \nwas bedeutet, dass Biber mehr Karotten essen, um ihren Bedarf zu decken."
plPL = "Sprawia, że pobliskie bobry chętniej jedzą marchewki  \n<color=red>TO ZMNIEJSZA potrzebę marchewek</color>  \nco oznacza, że bobry będą zjadać więcej marchewek, aby ją zaspokoić."
ptBR = "Faz com que os castores próximos tenham mais chances de comer cenouras\n<color=red>ISSO REDUZ a necessidade de cenouras</color>\no que significa que os castores comerão mais cenouras para saciá-la"
koKR = "주변 비버들이 당근을 먹을 확률을 높입니다\n<color=red>이것은 당근 필요를 줄입니다</color>\n즉, 비버들이 이를 채우기 위해 더 많은 당근을 먹게 됩니다."
trTR = "Yakındaki kunduzların havuç yeme olasılığını artırır\n<color=red>Bu, havuç ihtiyacını AZALTIR</color>\nbu da kunduzların ihtiyacı karşılamak için daha fazla havuç yiyeceği anlamına gelir"
esES = "Hace que los castores cercanos tengan más probabilidad de comer zanahorias\n<color=red>Esto REDUCE la necesidad de zanahorias</color>\nlo que significa que los castores comerán más zanahorias para llenarla"
itIT = "Rende i castori vicini più propensi a mangiare carote\n<color=red>Questo RIDUCE il bisogno di carote</color>\nil che significa che i castori mangeranno più carote per soddisfarlo"
ukUA = "Робить сусідніх бобрів більш схильними їсти моркву\n<color=red>Це ЗНИЖУЄ потребу в моркві</color>\nтож бобри з'їдатимуть більше моркви, щоб її задовольнити"
thTH = "ทำให้บีเวอร์ใกล้เคียงมีแนวโน้มกินแครอทมากขึ้น\n<color=red>สิ่งนี้ลดความต้องการแครอท</color>\nซึ่งหมายความว่าบีเวอร์จะกินแครอทมากขึ้นเพื่อให้ความต้องการนั้นเต็ม"
csCZ = "Zvyšuje pravděpodobnost, že poblíž se nacházející bobři budou jíst mrkve\n<color=red>TO ZMĚNUJE potřebu mrkve</color>\ncož znamená, že bobři snědí více mrkve, aby ji naplnili"
viVN = "Khiến các hải ly ở khu vực lân cận có xu hướng ăn cà rốt nhiều hơn\n<color=red>Điều này làm giảm nhu cầu cà rốt</color>\nĐiều này có nghĩa là các hải ly sẽ ăn nhiều cà rốt hơn để đáp ứng nhu cầu đó"
caES = "Fa que els castors propers tinguin més probabilitat de menjar pastanagues\n<color=red>Això REDUEIX la necessitat de pastanagues</color>\ncosa que vol dir que els castors menjaran més pastanagues per omplir-la"
beBY = "Робіць баброў каля яго больш схільнымі да ёсць моркву\n<color=red>Гэта ЗНІЖАЕ патрэбу ў моркве</color>\nшто азначае, што бабры будуць есці больш моркве, каб яе запоўніць"
