raw = "To everyone's surprise, your refusal to choose sides works. The two groups argue a little longer, then begin laughing at how foolish the quarrel has become.\nBoth return to work determined to prove their worth without tearing the colony apart.\n[[C]][[+]]Lumberjack Flags' workers gain +{%3} Working Speed for [[time:{F1}d]]\n[[C]][[+]]Farmhouses' workers gain +{%3} Working Speed for [[time:{F1}d]]"
status = "normal"
enUS = "To everyone's surprise, your refusal to choose sides works. The two groups argue a little longer, then begin laughing at how foolish the quarrel has become. Both return to work determined to prove their worth without tearing the colony apart. [[C]][[+]]Lumberjack Flags' workers gain +{%3} Working Speed for [[time:{F1}d]] [[C]][[+]]Farmhouses' workers gain +{%3} Working Speed for [[time:{F1}d]]"
zhCN = "令所有人感到惊讶的是，您拒绝站队的做法奏效了。这两个团体争论了稍长一段时间，然后开始嘲笑这场争吵是多么愚蠢。\n他们都回到工作中，决心在不撕裂殖民地的情况下证明自己的价值。\n[[C]][[+]]伐木工会的工人获得 +{%3} 的工作速度，持续 [[time:{F1}d]]\n[[C]][[+]]农舍的工人获得 +{%3} 的工作速度，持续 [[time:{F1}d]]"
zhTW = "出乎所有人意料的是，你拒絕選邊站的做法奏效了。兩個團體再爭論了一會兒，然後開始嘲笑這場爭吵是多麼愚蠢。  \n雙方都重返工作，決心在不撕裂殖民地的情況下證明自己的價值。  \n[[C]][[+]]伐木工的工人工作速度提升 +{%3}，持續 [[time:{F1}d]]  \n[[C]][[+]]農舍的工人工作速度提升 +{%3}，持續 [[time:{F1}d]]"
ruRU = "К всеобщему удивлению, ваш отказ выбирать сторону срабатывает. Две группы немного спорят, а затем начинают смеяться над тем, насколько глупым стал их конфликт. Обе команды возвращаются к работе, полны решимости доказать свою ценность, не разрывая колонию на части.\n[[C]][[+]]Рабочие Лесозаготовительной Компании получают +{%3} Скорость Работы на [[time:{F1}d]]\n[[C]][[+]]Рабочие Фермерских Дома получают +{%3} Скорость Работы на [[time:{F1}d]]"
jaJP = "皆の驚きながらも、あなたがどちらの側にも立たないという拒否が効果を発揮しました。二つのグループはもう少し言い争いを続け、その後、争いがどれほど愚かであるかを笑い合い始めます。\n双方は、植民地を引き裂くことなく、自らの価値を証明する決意を持って仕事に戻ります。\n[[C]][[+]]製材所の労働者は、[[time:{F1}d]]の間、+{%3}の作業速度を得ます。\n[[C]][[+]]農家の労働者は、[[time:{F1}d]]の間、+{%3}の作業速度を得ます。"
frFR = "À la surprise de tous, votre refus de prendre parti porte ses fruits. Les deux groupes se disputent encore un peu, puis commencent à rire de la folie de leur querelle.  \nTous deux retournent au travail, déterminés à prouver leur valeur sans déchirer la colonie.  \n[[C]][[+]]Les travailleurs des drapeaux de bûcherons gagnent +{%3} de vitesse de travail pendant [[time:{F1}d]]  \n[[C]][[+]]Les travailleurs des fermes gagnent +{%3} de vitesse de travail pendant [[time:{F1}d]]"
deDE = "Zu jedermanns Überraschung funktioniert es, dass du dich weigerst, Partei zu ergreifen. Die beiden Gruppen streiten noch ein wenig länger, dann beginnen sie darüber zu lachen, wie töricht der Streit geworden ist. Beide kehren entschlossen zur Arbeit zurück, um ihren Wert zu beweisen, ohne die Kolonie auseinanderzureißen.  \n[[C]][[+]]Die Arbeiter der Holzfällerflaggen erhalten +{%3} Arbeitsgeschwindigkeit für [[time:{F1}d]]  \n[[C]][[+]]Die Arbeiter der Bauernhäuser erhalten +{%3} Arbeitsgeschwindigkeit für [[time:{F1}d]]"
plPL = "Ku zdziwieniu wszystkich, twoja odmowa zajęcia strony przynosi efekty. Obie grupy jeszcze przez chwilę się kłócą, a potem zaczynają się śmiać z tego, jak głupia stała się ich sprzeczka.  \nObie wracają do pracy, zdeterminowane, by udowodnić swoją wartość, nie rozdzierając kolonii.  \n[[C]][[+]]Pracownicy Leśników zyskują +{%3} Prędkości Pracy na [[time:{F1}d]]  \n[[C]][[+]]Pracownicy Gospodarstw zyskują +{%3} Prędkości Pracy na [[time:{F1}d]]"
ptBR = "Para a surpresa de todos, sua recusa em escolher um lado funciona. Os dois grupos discutem um pouco mais e depois começam a rir de quão tola a disputa se tornou. Ambos voltam ao trabalho determinados a provar seu valor sem despedaçar a colônia.  \n[[C]][[+]]Os trabalhadores das Bandeiras de Lenhador ganham +{%3} de Velocidade de Trabalho por [[time:{F1}d]]  \n[[C]][[+]]Os trabalhadores das Casas de Fazenda ganham +{%3} de Velocidade de Trabalho por [[time:{F1}d]]"
koKR = "모두의 놀라움 속에서, 당신이 편을 고르지 않겠다는 선택이 통했습니다. 두 그룹은 조금 더 논쟁하다가, 결국 이 다툼이 얼마나 어리석었는지에 대해 웃기 시작합니다.  \n둘 다 식민지를 찢어놓지 않고 자신의 가치를 증명하기 위해 다시 일에 몰두합니다.  \n[[C]][[+]]엘리베이터 작업자들은 [[시간:{F1}일]] 동안 +{%3} 작업 속도를 얻습니다.  \n[[C]][[+]]농가 작업자들은 [[시간:{F1}일]] 동안 +{%3} 작업 속도를 얻습니다."
trTR = "Herkesin şaşkınlığına, taraf seçmeyi reddetmeniz işe yarıyor. İki grup biraz daha tartışıyor, sonra kavganın ne kadar saçma hale geldiğine gülmeye başlıyor.  \nİkisi de koloniyi parçalamadan değerlerini kanıtlamak için çalışmaya geri dönüyor.  \n[[C]][[+]]Kereste İşçileri %{3} Verim Hızı kazanıyor [[time:{F1}g]]  \n[[C]][[+]]Çiftlik Evleri'ndeki işçiler %{3} Verim Hızı kazanıyor [[time:{F1}g]]"
esES = "Para sorpresa de todos, tu negativa a elegir bando funciona. Los dos grupos discuten un poco más, y luego empiezan a reírse de lo absurdo que se ha vuelto la disputa.\nAmbos regresan al trabajo decididos a demostrar su valía sin destrozar la colonia.\n[[C]][[+]]Los trabajadores de los Aserraderos Banderola ganan +{%3} de Velocidad de Trabajo durante [[time:{F1}d]]\n[[C]][[+]]Los trabajadores de las Granjas ganan +{%3} de Velocidad de Trabajo durante [[time:{F1}d]]"
