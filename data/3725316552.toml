["LV.BCEv.FirstDeath.Content"]
raw = "{CP_TriggerCharacterName} has passed away.\n\nThe colony grows quiet. For the first time, the beavers are not only thinking about survival, but about memory. A few gather nearby, unsure what to do next. Work still needs doing, but so does grief."
status = "normal"
enUS = "{CP_TriggerCharacterName} has passed away.\n\nThe colony grows quiet. For the first time, the beavers are not only thinking about survival, but about memory. A few gather nearby, unsure what to do next. Work still needs doing, but so does grief."
zhCN = "{CP_TriggerCharacterName} 去世了。\n\n聚落变得安静。比起生存，海狸们第一次开始思考记忆。一些海狸聚集在附近，不知下一步该做什么。工作仍需继续，但是悲伤也同样需要被面对。"
zhTW = "{CP_TriggerCharacterName} 已經過世了。\n\n殖民地變得寂靜。這是首度，海狸們不僅在思考生存，還在思考記憶。幾隻聚集在附近，不知道接下來該怎麼辦。工作仍然需要進行，但悲傷同樣需要面對。"
ruRU = "{CP_TriggerCharacterName} ушел.\n\nКолония замерла в тишине. Впервые бобры думают не только о выживании, но и о памяти. Несколько из них собрались неподалеку, не зная, что делать дальше. Работы еще много, но горе тоже требует внимания."
jaJP = "{CP_TriggerCharacterName}が亡くなりました。\n\n植民地は静まり返ります。ビーバーたちは初めて、生存だけでなく記憶について考えています。数匹が近くに集まり、次に何をすべきか分からずにいます。仕事はまだ残っていますが、悲しみも必要です。"
frFR = "{CP_TriggerCharacterName} est décédé.\n\nLa colonie devient silencieuse. Pour la première fois, les castors ne pensent pas seulement à la survie, mais aussi à la mémoire. Quelques-uns se rassemblent à proximité, incertains de la marche à suivre. Du travail reste à faire, mais le deuil aussi."
deDE = "{CP_TriggerCharacterName} ist verstorben.\n\nDie Kolonie wird still. Zum ersten Mal denken die Biber nicht nur an das Überleben, sondern auch an die Erinnerung. Einige versammeln sich in der Nähe, unsicher, was zu tun ist. Es gibt immer noch Arbeit zu erledigen, aber auch die Trauer muss ihren Platz finden."
plPL = "{CP_TriggerCharacterName} odszedł.\n\nKolonia cichnie. Po raz pierwszy bobry myślą nie tylko o przetrwaniu, ale i o pamięci. Kilka z nich zbiera się w pobliżu, niepewne, co robić dalej. Praca wciąż czeka, ale także smutek."
ptBR = "{CP_TriggerCharacterName} faleceu.\n\nA colônia fica silenciosa. Pela primeira vez, os castores não estão pensando apenas na sobrevivência, mas na memória. Alguns se reúnem nas proximidades, incertos sobre o que fazer a seguir. O trabalho ainda precisa ser feito, mas a dor também."
koKR = "{CP_TriggerCharacterName}가 세상을 떠났습니다.\n\n식민지는 조용해집니다. 비버들이 생존뿐만 아니라 기억에 대해서도 생각하는 것은 처음입니다. 몇몇이 근처에 모여서 다음에 무엇을 해야 할지 몰라 망설이고 있습니다. 아직도 해야 할 일이 있지만, 슬픔도 함께합니다."
trTR = "{CP_TriggerCharacterName} vefat etti.\n\nKoloni sessizleşiyor. İlk kez, kunduzlar yalnızca hayatta kalmayı düşünmekle kalmayıp, aynı zamanda anılar üzerine de düşünüyorlar. Bazıları ne yapacaklarından emin olmadan yakında toplanıyor. Hala yapılması gereken işler var, ama yas da var."
esES = "{CP_TriggerCharacterName} ha fallecido.\n\nLa colonia se queda en silencio. Por primera vez, los castores no solo piensan en sobrevivir, sino también en el recuerdo. Algunos se reúnen cerca, sin saber qué hacer a continuación. El trabajo sigue pendiente, pero también lo está el duelo."
itIT = "{CP_TriggerCharacterName} è morto.\n\nLa colonia si fa silenziosa. Per la prima volta, i castori non pensano solo alla sopravvivenza, ma anche alla memoria. Alcuni si radunano nelle vicinanze, incerti su cosa fare. Il lavoro va ancora portato avanti, ma anche il lutto richiede attenzione."
ukUA = "{CP_TriggerCharacterName} помер.\n\nКолонія притихла. Уперше бобри думають не лише про виживання, а й про пам'ять. Кілька з них збираються поруч, не знаючи, що робити далі. Робота все ще чекає, але є й горе."
thTH = "{CP_TriggerCharacterName} เสียชีวิตแล้ว\n\nอาณานิคมเงียบลง เป็นครั้งแรกที่บีเวอร์ไม่ได้คิดแค่เรื่องการเอาชีวิตรอด แต่เริ่มคิดถึงความทรงจำด้วย บีเวอร์บางตัวรวมตัวกันอยู่ใกล้ ๆ ไม่แน่ใจว่าควรทำอะไรต่อไป งานยังต้องทำต่อ แต่ความโศกเศร้าก็ต้องได้รับการใส่ใจเช่นกัน"
csCZ = "{CP_TriggerCharacterName} zemřel.\n\nKolonie ztichla. Poprvé si bobři nejen že myslí na přežití, ale také na vzpomínku. Někteří se shromáždili poblíž, nejistí co dělat dál. Práce je stále potřeba, ale také se musí projevovat zármutek."
viVN = "{CP_TriggerCharacterName} đã qua đời.\n\nK колония trở nên yên tĩnh. Lần đầu tiên, những con bồ nông không chỉ nghĩ về sự sinh tồn, mà còn về ký ức. Một vài con tập trung lại gần, không chắc chắn phải làm gì tiếp theo. Công việc vẫn cần phải làm, nhưng nỗi buồn cũng vậy."
caES = "{CP_TriggerCharacterName} ha mort.\n\nLa colònia es queda en silenci. Per primer cop, els castors no només pensen en la supervivència, sinó també en el record. Alguns es reuneixen a prop, sense saber què fer a continuació. La feina encara s'ha de fer, però també hi ha el dol."
beBY = "{CP_TriggerCharacterName} памёр.\n\nКалонія сціхла. Упершыню бабры думаюць не толькі пра выжыванне, але і пра памяць. Некаторыя збіраюцца побач, не ведаючы, што рабіць далей. Работа ўсё яшчэ чакае, але і смутак таксама."
roRO = "{CP_TriggerCharacterName} a murit.\n\nColoniei se face liniște. Pentru prima dată, castorii nu se mai gândesc doar la supraviețuire, ci și la amintire. Câțiva se adună prin apropiere, neștiind ce să facă mai departe. Munca mai trebuie făcută, dar la fel și jelirea."
huHU = "{CP_TriggerCharacterName} elhunyt.\n\nA kolónia elcsendesedik. Első alkalommal a bobrok nem csupán a túlélésen gondolkodnak, hanem az emlékezésen is. Néhányan a közelben gyülekeznek, nem tudva, mit tegyenek ezután. A munkát még el kell végezni, de a gyásszal is foglalkozni kell."
arSA = "{CP_TriggerCharacterName} قد توفي.\n\nيصبح المستوطنة هادئة. للمرة الأولى، لا يفكر القنادس في البقاء فقط، بل في الذاكرة أيضاً. يتجمع عدد قليل منهم قريباً، غير متأكدين مما يجب فعله بعد. ما زال العمل ينتظر، لكن الحزن ينتظر أيضاً."

