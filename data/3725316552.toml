koKR = "[[C]][[time:{F3}d]]에 [[good:{S1}:{I1}]], [[good:{S2}:{I2}]], 그리고 [[good:{S5}:{I3}]]를 지불하십시오. <YellowHighlight>알 수 없는 결과.</YellowHighlight>"
trTR = "[[C]]Öde [[good:{S1}:{I1}]], [[good:{S2}:{I2}]], ve [[good:{S5}:{I3}]] için [[time:{F3}d]]. <YellowHighlight>Bilinmeyen sonuçlar.</YellowHighlight>"
esES = "[[C]]Paga [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] y [[good:{S5}:{I3}]] en [[time:{F3}d]]. <YellowHighlight>Consecuencias desconocidas.</YellowHighlight>"
itIT = "[[C]]Paga [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] e [[good:{S5}:{I3}]] entro [[time:{F3}d]]. <YellowHighlight>Conseguenze sconosciute.</YellowHighlight>"
ukUA = "[[C]]Сплатіть [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] та [[good:{S5}:{I3}]] протягом [[time:{F3}d]]. <YellowHighlight>Наслідки невідомі.</YellowHighlight>"
thTH = "[[C]]จ่าย [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] และ [[good:{S5}:{I3}]] ภายใน [[time:{F3}d]]. <YellowHighlight>ผลที่ตามมายังไม่ทราบแน่ชัด.</YellowHighlight>"
csCZ = "[[C]]Zaplaťte [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] a [[good:{S5}:{I3}]] za [[time:{F3}d]]. <YellowHighlight>Neznámé důsledky.</YellowHighlight>"
viVN = "[[C]]Trả [[good:{S1}:{I1}]], [[good:{S2}:{I2}]], và [[good:{S5}:{I3}]] trong [[time:{F3}d]]. <YellowHighlight>Hệ quả không rõ.</YellowHighlight>"
caES = "[[C]]Pagueu [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] i [[good:{S5}:{I3}]] en [[time:{F3}d]]. <YellowHighlight>Conseqüències desconegudes.</YellowHighlight>"
beBY = "[[C]]Заплаціце [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] і [[good:{S5}:{I3}]] за [[time:{F3}d]]. <YellowHighlight>Невядомыя наступствы.</YellowHighlight>"
roRO = "[[C]]Plătiți [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] și [[good:{S5}:{I3}]] în [[time:{F3}d]]. <YellowHighlight>Consecințe necunoscute.</YellowHighlight>"
huHU = "[[C]]Fizess [[good:{S1}:{I1}]], [[good:{S2}:{I2}]] és [[good:{S5}:{I3}]] mennyiséget [[time:{F3}d]] alatt. <YellowHighlight>Ismeretlen következmények.</YellowHighlight>"
arSA = "[[C]]ادفع [[good:{S1}:{I1}]]، و[[good:{S2}:{I2}]]، و[[good:{S5}:{I3}]] خلال [[time:{F3}d]]. <YellowHighlight>عواقب غير معروفة.</YellowHighlight>"

