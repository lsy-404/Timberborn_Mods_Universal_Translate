["LV.BCEv.FoodWoodDispute1.O1"]
raw = "The farmers cheer your judgment and return to the fields with renewed pride. If food is the heart of the colony, they intend to keep it beating.\nThe lumberjacks return to the forest in bitter silence.\n[[C]][[-]]Lumberjack Flags' workers lose {%4} Working Speed for [[time:{F1}d]]\n[[C]][[+]]Farmhouses' workers gain +{%3} Working Speed for [[time:{F1}d]]"
status = "normal"
enUS = "The farmers cheer your judgment and return to the fields with renewed pride. If food is the heart of the colony, they intend to keep it beating. The lumberjacks return to the forest in bitter silence. [[C]][[-]]Lumberjack Flags' workers lose {%4} Working Speed for [[time:{F1}d]] [[C]][[+]]Farmhouses' workers gain +{%3} Working Speed for [[time:{F1}d]]"
zhCN = "农民们欢呼你的裁决，带着重燃的自豪感回到田野。如果食物是殖民地的心脏，他们打算让它保持跳动。  \n伐木工人则默默地回到森林。  \n[[C]][[-]]伐木工坊的工人失去 {%4} 工作速度，持续 [[time:{F1}d]]  \n[[C]][[+]]农舍的工人获得 +{%3} 工作速度，持续 [[time:{F1}d]]"
zhTW = "農民們對你的判決歡呼，並帶著重新燃起的自豪感回到田野。如果食物是殖民地的心臟，他們打算讓它繼續跳動。\n伐木工人們則沉默地回到森林中。\n[[C]][[-]]樵夫旗幟的工人工作速度下降 {%4}，持續時間為 [[time:{F1}d]]\n[[C]][[+]]農舍的工人工作速度提升 +{%3}，持續時間為 [[time:{F1}d]]"
ruRU = "Фермеры радуются вашему решению и возвращаются на поля с обновленной гордостью. Если еда — это сердце колонии, они намерены держать его в битве.  \nЛесорубы возвращаются в лес в горьком молчании.  \n[[C]][[-]]Работники лесорубов теряют {%4} Скорость Работы на [[time:{F1}d]]  \n[[C]][[+]]Работники фермерских домов получают +{%3} Скорость Работы на [[time:{F1}d]]"
jaJP = "農民たちはあなたの判断を称賛し、誇りを持って畑へ戻ります。もし食料がコロニーの心臓であるなら、彼らはその鼓動を保つつもりです。  \n伐採者たちは苦渋の沈黙の中、森へ戻ります。  \n[[C]][[-]]伐採者の旗の労働者は、[[time:{F1}d]]の間、{%4}の作業速度を失います。  \n[[C]][[+]]農家の労働者は、[[time:{F1}d]]の間、+{%3}の作業速度を得ます。"
frFR = "Les agriculteurs acclament votre jugement et retournent aux champs avec une fierté renouvelée. Si la nourriture est le cœur de la colonie, ils ont l'intention de le maintenir en vie.  \nLes bûcherons retournent à la forêt dans un silence amer.  \n[[C]][[-]]Les travailleurs des drapeaux de bûcherons perdent {%4} de vitesse de travail pendant [[time:{F1}d]]  \n[[C]][[+]]Les travailleurs des maisons de ferme gagnent +{%3} de vitesse de travail pendant [[time:{F1}d]]"
deDE = "Die Bauern jubeln deinem Urteil zu und kehren mit neuem Stolz auf die Felder zurück. Wenn Essen das Herz der Kolonie ist, wollen sie es am Schlagen halten.  \nDie Holzfäller kehren in bitterem Schweigen in den Wald zurück.  \n[[C]][[-]]Die Arbeiter der Holzfällerflaggen verlieren {%4} Arbeitsgeschwindigkeit für [[time:{F1}d]]  \n[[C]][[+]]Die Arbeiter der Bauernhäuser gewinnen +{%3} Arbeitsgeschwindigkeit für [[time:{F1}d]]"
plPL = "Rolnicy wiwatują na cześć twojego osądu i wracają na pola z odnowioną dumą. Jeśli jedzenie jest sercem kolonii, zamierzają je utrzymać w rytmie.  \nDrewnojady wracają do lasu w gorzkiej ciszy.  \n[[C]][[-]]Pracownicy flag drwala tracą {%4} Prędkości Pracy przez [[czas:{F1}d]]  \n[[C]][[+]]Pracownicy domów wiejskich zyskują +{%3} Prędkości Pracy przez [[czas:{F1}d]]"
ptBR = "Os agricultores aplaudem seu julgamento e retornam aos campos com orgulho renovado. Se a comida é o coração da colônia, eles pretendem mantê-lo pulsando.  \nOs lenhadores retornam à floresta em silêncio amargo.  \n[[C]][[-]]Os trabalhadores das bandeiras de lenhador perdem {%4} de Velocidade de Trabalho por [[time:{F1}d]]  \n[[C]][[+]]Os trabalhadores das casas de fazenda ganham +{%3} de Velocidade de Trabalho por [[time:{F1}d]]"
koKR = "농부들은 당신의 판단에 환호하며 renewed pride와 함께 들로 돌아갑니다. 음식이 식민지의 심장이라면, 그들은 그것이 계속 뛰도록 하려 합니다.\n벌목자들은 씁쓸한 침묵 속에 숲으로 돌아갑니다.\n[[C]][[-]]벌목기 깃발의 노동자는 [[time:{F1}d]] 동안 {%4} 작업 속도를 잃습니다.\n[[C]][[+]]농가의 노동자는 [[time:{F1}d]] 동안 +{%3} 작업 속도를 얻습니다."
trTR = "Çiftçiler kararınıza sevinir ve tarlalara yenilenmiş bir gururla dönerler. Eğer yiyecek koloninin kalbiyse, onu atar halde tutmaya kararlıdırlar. Ağaç kesenler, acı bir sessizlik içinde ormana dönerler. [[C]][[-]]Kereste işçilerinin Çalışma Hızı {%4} azalır [[time:{F1}g]] için [[C]][[+]]Çiftlik evlerinin işçileri, Çalışma Hızı +{%3} kazanır [[time:{F1}g]] için"
esES = "Los granjeros aclaman tu decisión y regresan a los campos con renovado orgullo. Si la comida es el corazón de la colonia, pretenden mantenerlo latiendo.\nLos leñadores regresan al bosque en amargo silencio.\n[[C]][[-]]Los trabajadores de los Puestos de leñadores pierden {%4} de Velocidad de trabajo durante [[time:{F1}d]]\n[[C]][[+]]Los trabajadores de las Casas de granjeros ganan +{%3} de Velocidad de trabajo durante [[time:{F1}d]]"
itIT = "I contadini acclamano la tua decisione e tornano nei campi con rinnovato orgoglio. Se il cibo è il cuore della colonia, intendono farlo battere ancora.\nI taglialegna tornano nella foresta in amaro silenzio.\n[[C]][[-]]I lavoratori delle Bandiere dei Taglialegna perdono {%4} di Velocità di Lavoro per [[time:{F1}d]]\n[[C]][[+]]I lavoratori delle Case Contadine guadagnano +{%3} di Velocità di Lavoro per [[time:{F1}d]]"
ukUA = "Фермери вітають твоє рішення і з новою гордістю повертаються на поля. Якщо їжа — серце колонії, вони мають намір і далі тримати його в русі.\nЛісоруби мовчки, з гірким смутком повертаються до лісу.\n[[C]][[-]]Працівники Лісорубних прапорів втрачають {%4} швидкості роботи на [[time:{F1}d]]\n[[C]][[+]]Працівники Фермерських будинків отримують +{%3} швидкості роботи на [[time:{F1}d]]"
thTH = "ชาวไร่ชื่นชมการตัดสินใจของคุณ แล้วกลับไปยังทุ่งนาด้วยความภาคภูมิใจที่ฟื้นคืนมา หากอาหารคือหัวใจของอาณานิคม พวกเขาก็ตั้งใจจะทำให้มันเต้นต่อไป\nคนตัดไม้กลับไปยังป่าด้วยความเงียบงันอันขมขื่น\n[[C]][[-]]คนงานของธงคนตัดไม้มีความเร็วในการทำงานลดลง {%4} เป็นเวลา [[time:{F1}d]]\n[[C]][[+]]คนงานของโรงเรือนเกษตรมีความเร็วในการทำงานเพิ่มขึ้น +{%3} เป็นเวลา [[time:{F1}d]]"
csCZ = "Farmáři oslavují váš verdikt a vracejí se na pole s obnovenou hrdostí. Pokud je jídlo srdcem kolonie, mají v úmyslu udržet ho v chodu. Dělníci v lese se vracejí do lesa v hořkém tichu. [[C]][[-]]Dělníci ze dřevařských vlajek ztrácí {%4} rychlost práce na [[time:{F1}d]] [[C]][[+]]Dělníci z farem získávají +{%3} rychlost práce na [[time:{F1}d]]"
viVN = "Những người nông dân hoan hô phán quyết của bạn và quay trở lại cánh đồng với niềm tự hào mới. Nếu thực phẩm là trái tim của thuộc địa, họ có ý định giữ cho nó đập.\nNhững người cưa gỗ trở lại rừng trong im lặng chua chát.\n[[C]][[-]]Công nhân tại Các Lá Cờ Thợ Cưa mất {%4} Tốc độ Làm Việc trong [[time:{F1}d]]\n[[C]][[+]]Công nhân tại Các Nhà Nông được tăng +{%3} Tốc độ Làm Việc trong [[time:{F1}d]]"
caES = "Els granjers aclamen el teu judici i tornen als camps amb un orgull renovat. Si el menjar és el cor de la colònia, pretenen mantenir-lo bategant.\nEls llenyataires tornen al bosc en un silenci amarg.\n[[C]][[-]]Els treballadors de les Cases de llenyataires perden {%4} de Velocitat de treball durant [[time:{F1}d]]\n[[C]][[+]]Els treballadors de les Granges guanyen +{%3} de Velocitat de treball durant [[time:{F1}d]]"
beBY = "Фермеры воздаюць вам хвалу за ваша рашэнне і вяртаюцца на палеткі з новай гордасцю. Калі ежа — сэрца калоніі, яны намерыліся не даць яму спыніцца.\nЛесарубы вяртаюцца ў лес у горкім маўчанні.\n[[C]][[-]]Працаўнікі Лесарубных сцягоў губляюць {%4} хуткасці працы на [[time:{F1}d]]\n[[C]][[+]]Працаўнікі Фермерскіх дамоў атрымліваюць +{%3} хуткасці працы на [[time:{F1}d]]"
roRO = "Fermierii aclamă decizia ta și se întorc pe câmpuri cu mândrie reînnoită. Dacă hrana este inima coloniei, intenționează să o țină în viață.\nTăietorii de lemne se întorc în pădure în tăcere amară.\n[[C]][[-]]Lucrătorii din Lumberjack Flags pierd {%4} din Viteza de lucru timp de [[time:{F1}d]]\n[[C]][[+]]Lucrătorii din Farmhouses câștigă +{%3} Viteză de lucru timp de [[time:{F1}d]]"
huHU = "A farmerek tetszéssel fogadják az ítéletedet, és megújult büszkeséggel térnek vissza a földekre. Ha az étel a kolónia szíve, akkor a farmerek azon lesznek, hogy ez a szív tovább dobogjon.\nA favágók keserű csendben térnek vissza az erdőbe.\n[[C]][[-]]A Favágó zászlók dolgozói {%4} munkasebesség-csökkenést szenvednek el [[time:{F1}d]] ideig\n[[C]][[+]]A Farmházak dolgozói +{%3} munkasebesség-növekedést kapnak [[time:{F1}d]] ideig"
arSA = "يهتف المزارعون استحسانًا لحكمك ويعودون إلى الحقول بفخر متجدد. فإذا كان الطعام قلب المستعمرة، فإنهم عازمون على إبقائه ينبض.\nيعود قاطعو الأشجار إلى الغابة في صمت مرير.\n[[C]][[-]]يفقد عمال أعلام قاطعي الأشجار {%4} من سرعة العمل لمدة [[time:{F1}d]]\n[[C]][[+]]يكتسب عمال بيوت المزارعين +{%3} من سرعة العمل لمدة [[time:{F1}d]]"

["LV.BCEv.FoodWoodDispute1.O2"]
raw = "The lumberjacks thump their tails in approval and march back toward the trees. Every raised roof and sturdy dam will prove their worth.\nThe farmers return to their fields with sour looks and sharper words.\n[[C]][[+]]Lumberjack Flags' workers gain +{%3} Working Speed for [[time:{F1}d]]\n[[C]][[-]]Farmhouses' workers lose {%4} Working Speed for [[time:{F1}d]]"
status = "normal"
enUS = "The lumberjacks thump their tails in approval and march back toward the trees. Every raised roof and sturdy dam will prove their worth. The farmers return to their fields with sour looks and sharper words. [[C]][[+]]Lumberjack Flags' workers gain +{%3} Working Speed for [[time:{F1}d]] [[C]][[-]]Farmhouses' workers lose {%4} Working Speed for [[time:{F1}d]]"
zhCN = "伐木工人们兴奋地拍打着尾巴，朝着树林走去。每一个高耸的屋顶和坚固的大坝都将证明他们的价值。\n农民们面带不悦，带着尖刻的言辞回到田间。\n[[C]][[+]]伐木工旗的工人获得 +{%3} 的工作速度，持续 [[time:{F1}d]]\n[[C]][[-]]农舍的工人失去 {%4} 的工作速度，持续 [[time:{F1}d]]"
zhTW = "伐木工們拍打著尾巴以示讚同，然後朝樹木走去。每一個抬高的屋頂和堅固的壩堤都將證明他們的價值。\n農民們面帶不悅走回他們的田地，嘴上更是尖酸刻薄。\n[[C]][[+]]伐木工旗幟的工人工作速度提升 +{%3}，持續 [[time:{F1}d]]\n[[C]][[-]]農舍的工人工作速度降低 {%4}，持續 [[time:{F1}d]]"
ruRU = "Древосеки хлещут хвостами в знак одобрения и возвращаются к деревьям. Каждый поднятый фрагмент крыши и прочная плотина докажут свою ценность.  \nФермеры возвращаются на свои поля с кислым выражением лиц и резкими словами.  \n[[C]][[+]]Рабочие лесозаготовителей получают +{%3} Скорость Работы на [[time:{F1}d]]  \n[[C]][[-]]Рабочие фермерских домов теряют {%4} Скорость Работы на [[time:{F1}d]]"
jaJP = "伐採者たちは、賛同の意を示して尻尾を叩き、木々の方へと戻って行く。高く持ち上げられた屋根と頑丈なダムは、その価値を証明するだろう。  \n農民たちは、険しい表情と鋭い言葉を持って畑に戻る。  \n[[C]][[+]]伐採者の旗の作業者は、[[time:{F1}d]]の間、作業速度が+{%3}増加する。  \n[[C]][[-]]農家の作業者は、[[time:{F1}d]]の間、作業速度が{%4}減少する。"
frFR = "Les bûcherons frappent leur queue en signe d'approbation et marchent de nouveau vers les arbres. Chaque toit élevé et chaque barrage solide prouvera leur valeur.  \nLes agriculteurs retournent à leurs champs avec des mines amères et des paroles plus acérées.  \n[[C]][[+]]Les travailleurs des Drapeaux de Bûcheron gagnent +{%3} de Vitesse de Travail pendant [[time:{F1}j]]  \n[[C]][[-]]Les travailleurs des Fermes perdent {%4} de Vitesse de Travail pendant [[time:{F1}j]]"
deDE = "Die Holzfäller schlagen mit den Schwänzen vor Freude und marschieren zurück zu den Bäumen. Jedes angehobene Dach und jeder stabile Damm wird ihren Wert beweisen. Die Bauern kehren mit verkniffenen Mienen und scharferen Worten auf ihre Felder zurück. [[C]][[+]]Die Arbeiter der Holzfäller-Fahnen gewinnen +{%3} Arbeitstempo für [[time:{F1}d]] [[C]][[-]]Die Arbeiter der Bauernhöfe verlieren {%4} Arbeitstempo für [[time:{F1}d]]"
plPL = "Drwale uderzają ogonami w aprobacie i wracają w kierunku drzew. Każdy podniesiony dach i solidna tama udowodnią swoją wartość. \nRolnicy wracają na swoje pola z kwasnymi minami i ostrzejszymi słowami. \n[[C]][[+]]Pracownicy Flagi Drwali zyskują +{%3} Prędkości Pracy przez [[time:{F1}d]] \n[[C]][[-]]Pracownicy Gospodarstw tracą {%4} Prędkości Pracy przez [[time:{F1}d]]"
ptBR = "Os lenhadores batem suas caudas em aprovação e marcham de volta para as árvores. Cada telhado erguido e represa robusta provará seu valor.  \nOs fazendeiros retornam aos seus campos com expressões azedas e palavras mais cortantes.  \n[[C]][[+]]Os trabalhadores das Bandeiras dos Lenhadores ganham +{%3} de Velocidade de Trabalho por [[time:{F1}d]]  \n[[C]][[-]]Os trabalhadores das Casas de Fazenda perdem {%4} de Velocidade de Trabalho por [[time:{F1}d]]"
koKR = "벌목자들은 승인하는 듯 꼬리를 쳐대며 나무 쪽으로 다시 행진합니다. 높아진 지붕과 튼튼한 댐은 그들의 가치를 증명할 것입니다. 농부들은 찡그린 표정과 날카로운 언사로 밭으로 돌아갑니다. [[C]][[+]]벌목자 깃발의 일꾼들은 [[time:{F1}d]] 동안 +{%3} 작업 속도를 얻습니다. [[C]][[-]]농가의 일꾼들은 [[time:{F1}d]] 동안 {%4} 작업 속도를 잃습니다."
trTR = "Ağaççıların onayla kuyruklarını yere vurup ağaçlara doğru ilerliyorlar. Her yükseltilmiş çatı ve sağlam baraj, onların değerini kanıtlayacak. Çiftçiler ekinlerine ekşi ifadelerle ve keskin kelimelerle geri dönüyor.  \n[[C]][[+]]Ağaççı Bayrakları'nın işçileri için +{%3} Çalışma Hızı kazanılır [[time:{F1}g]]  \n[[C]][[-]]Çiftlik Evleri'nin işçileri için {%4} Çalışma Hızı kaybedilir [[time:{F1}g]]"
esES = "Los leñadores golpean el suelo con sus colas en señal de aprobación y regresan marchando hacia los árboles. Cada tejado levantado y cada presa resistente demostrarán su valía.\nLos granjeros regresan a sus campos con miradas agrias y palabras más hirientes.\n[[C]][[+]]Los trabajadores de los Campamentos de leñadores ganan +{%3} de velocidad de trabajo durante [[time:{F1}d]]\n[[C]][[-]]Los trabajadores de las Casas de granjeros pierden {%4} de velocidad de trabajo durante [[time:{F1}d]]"
itIT = "I boscaioli battono la coda in segno di approvazione e tornano verso gli alberi. Ogni tetto innalzato e ogni diga solida dimostreranno il loro valore.\nI contadini tornano ai loro campi con sguardi acidi e parole più taglienti.\n[[C]][[+]]I lavoratori delle Bandiere dei Boscaioli guadagnano +{%3} di Velocità di Lavoro per [[time:{F1}d]]\n[[C]][[-]]I lavoratori delle Case Contadine perdono {%4} di Velocità di Lavoro per [[time:{F1}d]]"
ukUA = "Лісоруби вдарили хвостами на знак схвалення й рушили назад до дерев. Кожен піднятий дах і міцна гребля доведуть їхню цінність.\nФермери повертаються до своїх полів із кислими виразами облич і ще гострішими словами.\n[[C]][[+]]Працівники Прапорів лісорубів отримують +{%3} до швидкості роботи на [[time:{F1}d]]\n[[C]][[-]]Працівники Фермерських будинків втрачають {%4} швидкості роботи на [[time:{F1}d]]"
thTH = "คนตัดไม้ตบหางอย่างเห็นชอบ แล้วเดินกลับไปยังต้นไม้ หลังคาที่สร้างขึ้นและเขื่อนที่แข็งแรงทุกแห่งจะพิสูจน์คุณค่าของพวกเขา\nชาวนากลับไปยังไร่นาพร้อมสีหน้าบูดบึ้งและถ้อยคำที่เผ็ดร้อนกว่าเดิม\n[[C]][[+]]คนงานของธงคนตัดไม้ได้รับความเร็วในการทำงาน +{%3} เป็นเวลา [[time:{F1}d]]\n[[C]][[-]]คนงานของโรงเรือนเพาะปลูกสูญเสียความเร็วในการทำงาน {%4} เป็นเวลา [[time:{F1}d]]"
csCZ = "Dřevorubci tleskají svými ocasy na souhlas a vracejí se zpět k stromům. Každá zvýšená střecha a pevná hráz prokáže jejich hodnotu. Zemědělci se vracejí na svá pole s kyselými výrazy a ostřejšími slovy. [[C]][[+]]Pracovníci Dřevorubeckých vlajek získávají +{%3} rychlost práce na [[time:{F1}d]] [[C]][[-]]Pracovníci Farmářských domů ztrácejí {%4} rychlost práce na [[time:{F1}d]]"
viVN = "Các thợ xẻ gỗ vỗ đuôi đồng tình và quay trở lại hướng cây cối. Mỗi mái nhà đã dựng lên và con đập vững chãi sẽ chứng tỏ giá trị của chúng.  \nCác nông dân trở lại cánh đồng với vẻ mặt khó chịu và lời nói sắc nhọn.  \n[[C]][[+]]Công nhân Cờ Thợ Xẻ Gỗ tăng +{%3} Tốc độ Làm Việc trong [[time:{F1}d]]  \n[[C]][[-]]Công nhân Nhà Nông mất {%4} Tốc độ Làm Việc trong [[time:{F1}d]]"
caES = "Els lenyataires fan petar la cua en senyal d'aprovació i tornen cap als arbres. Cada teulada aixecada i cada dic resistent demostraran el seu valor.\nEls pagesos tornen als seus camps amb cara de pocs amics i paraules més afilades.\n[[C]][[+]]Els treballadors de les Banderes de Lenyataires guanyen +{%3} de velocitat de treball durant [[time:{F1}d]]\n[[C]][[-]]Els treballadors de les cases de pagès perden {%4} de velocitat de treball durant [[time:{F1}d]]"
beBY = "Лесарубы весела б'юць хвастамі ў знак згоды і крочаць назад да дрэў. Кожны пабудаваны дах і трывалая дамба давядуць іх карысць.\nФермеры вяртаюцца да сваіх палёў з панурымі тварамі і яшчэ вастрэйшымі словамі.\n[[C]][[+]]Работнікі Лясных сцягоў набываюць +{%3} да хуткасці працы на [[time:{F1}d]]\n[[C]][[-]]Работнікі фермерскіх дамоў губляюць {%4} хуткасці працы на [[time:{F1}d]]"
roRO = "Dăcărașii își bat din coadă în semn de aprobare și pornesc din nou spre copaci. Fiecare acoperiș ridicat și fiecare baraj solid le vor dovedi valoarea.\nFermierii se întorc la câmpurile lor cu priviri acre și cuvinte mai ascuțite.\n[[C]][[+]]Muncitorii din Steagurile Dăcarilor câștigă +{%3} Viteză de lucru timp de [[time:{F1}d]]\n[[C]][[-]]Muncitorii din Casele fermierilor pierd {%4} Viteză de lucru timp de [[time:{F1}d]]"
huHU = "A favágók helyeslően csapkodnak a farkukkal, és visszaindulnak a fák felé. Minden felhúzott tető és erős gát bebizonyítja majd az értéküket.\nA földművesek savanyú arccal és élesebb szavakkal térnek vissza a földjeikre.\n[[C]][[+]]A Favágó-zászlók munkásainak munkasebessége +{%3} [[time:{F1}d]] ideig.\n[[C]][[-]]A Farmházak munkásainak munkasebessége {%4}-del csökken [[time:{F1}d]] ideig."
arSA = "يُلوّح الحطابون بذيولهم موافقةً ويتجهون مسرعين نحو الأشجار. كل سقف يُرفع وكل سد متين سيثبت قيمتهم.\nيعود المزارعون إلى حقولهم بنظرات متجهّمة وكلمات أشد لذعًا.\n[[C]][[+]]يكتسب عمال أعلام الحطابين +{%3} من سرعة العمل لمدة [[time:{F1}d]]\n[[C]][[-]]يفقد عمال بيوت المزارعين {%4} من سرعة العمل لمدة [[time:{F1}d]]"

