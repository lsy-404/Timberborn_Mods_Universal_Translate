ukUA = "Ваша постійна підтримка не залишає сумнівів щодо того, на чиєму боці керівництво колонії. Улюблені працівники сповнюються гордості й енергії, а решта повністю втрачає бадьорість.\n[[C]][[+]]{S5} працівники отримують +{%2} до швидкості роботи на [[time:{F1}d]]\n[[C]][[-]]{S6} працівники втрачають {%3} швидкості роботи на [[time:{F1}d]]"
