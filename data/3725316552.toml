roRO = "Schimbarea bruscă ia colonia prin surprindere, dar cu timpul muncitorii încep să accepte noul echilibru. Tensiunile se domolesc, deși mai rămâne o oarecare resentiment.\n[[C]][[+]]{S6} muncitori câștigă +{%5} Viteză de lucru timp de [[time:{F1}d]]\n[[C]][[-]]{S5} muncitori pierd {%6} Viteză de lucru timp de [[time:{F1}d]]"
huHU = "A hirtelen változás váratlanul éri a kolóniát, de idővel a munkások elkezdik elfogadni az új egyensúlyt. A kedélyek lecsillapodnak, bár némi neheztelés marad.\n[[C]][[+]]{S6} munkás +{%5} munkasebességet nyer [[time:{F1}d]] ideig\n[[C]][[-]]{S5} munkás {%6} munkasebességet veszít [[time:{F1}d]] ideig"
arSA = "يفاجئ هذا التحوّل المفاجئ المستعمرة على حين غرة، لكن مع مرور الوقت يبدأ العمال بتقبّل التوازن الجديد. تهدأ الخواطر، وإن بقي بعض الاستياء.\n[[C]][[+]]يكتسب {S6} من العمال +{%5} إلى سرعة العمل لمدة [[time:{F1}d]]\n[[C]][[-]]يفقد {S5} من العمال {%6} من سرعة العمل لمدة [[time:{F1}d]]"

["LV.BCEv.FoodWoodDispute2.O3"]
raw = "Your attempt to reverse course pleases nobody. One side feels abandoned while the other doubts your sincerity. The arguments only grow louder.\n[[C]][[-]]Both {S6} and {S5} workers lose {%7} Working Speed for [[time:{F1}d]]"
status = "normal"
enUS = "Your attempt to reverse course pleases nobody. One side feels abandoned while the other doubts your sincerity. The arguments only grow louder.  \n[[C]][[-]]Both {S6} and {S5} workers lose {%7} Working Speed for [[time:{F1}d]]"
zhCN = "你试图改变方向令人失望。一方感到被抛弃，而另一方怀疑你的真诚。争论声愈发激烈。[[C]][[-]]{S6}和{S5}名工人的工作速度下降{%7}，持续时间[[time:{F1}d]]"
zhTW = "你的改變方針讓誰都不高興。一方感到被拋棄，而另一方懷疑你的誠意。雙方的論點愈發激烈。  \n[[C]][[-]]{S6}和{S5}的工人失去{%7}的工作速度，持續[[time:{F1}d]]。"
ruRU = "Ваше желание изменить курс никого не радует. Одна сторона чувствует себя покинутой, в то время как другая сомневается в вашей искренности. Аргументы становятся только громче.  \n[[C]][[-]]Оба {S6} и {S5} работника теряют {%7} Скорости Работы на [[time:{F1}d]]"
jaJP = "あなたの方針転換の試みは誰も喜ばせません。一方は見捨てられたと感じ、もう一方はあなたの誠意を疑っています。議論はますます激化するばかりです。\n[[C]][[-]]{S6}と{S5}の労働者は、[[time:{F1}d]]の間、{%7}の作業速度を失います。"
frFR = "Votre tentative de faire demi-tour ne plaît à personne. Un côté se sent abandonné tandis que l'autre doute de votre sincérité. Les arguments ne font que s'intensifier.  \n[[C]][[-]]Les travailleurs {S6} et {S5} perdent {%7} de Vitesse de Travail pendant [[time:{F1}j]]"
deDE = "Dein Versuch, die Richtung zu ändern, erfreut niemanden. Die eine Seite fühlt sich verlassen, während die andere an deiner Aufrichtigkeit zweifelt. Die Argumente werden nur lauter. \n[[C]][[-]] Sowohl {S6} als auch {S5} Arbeiter verlieren {%7} Arbeitsgeschwindigkeit für [[time:{F1}d]]"
plPL = "Twoja próba zmiany zdania nie cieszy nikogo. Jedna strona czuje się porzucona, podczas gdy druga wątpi w twoją szczerość. Argumenty stają się coraz głośniejsze.  \n[[C]][[-]]Obaj {S6} i {S5} pracownicy tracą {%7} Prędkości Pracy przez [[czas:{F1}d]]"
ptBR = "Sua tentativa de voltar atrás não agrada ninguém. Um lado se sente abandonado enquanto o outro duvida da sua sinceridade. Os argumentos só se tornam mais altos. [[C]][[-]] Tanto {S6} quanto {S5} trabalhadores perdem {%7} de Velocidade de Trabalho por [[tempo:{F1}d]]"
koKR = "당신의 방향 전환 시도가 아무도 기쁘게 하지 않습니다. 한 쪽은 버림받았다고 느끼고 다른 쪽은 당신의 진정성을 의심합니다. 논쟁은 점점 더 커져만 갑니다.\n[[C]][[-]]{S6}과 {S5}의 노동자 모두 {%7} 작업 속도를 [[time:{F1}일]] 잃습니다."
trTR = "Yolunuzu değiştirme çabanız kimseyi memnun etmiyor. Bir taraf terk edilmiş hissederken diğer taraf sizin samimiyetinizden şüphe ediyor. Tartışmalar sadece daha da gürleşiyor. \n[[C]][[-]] Hem {S6} hem de {S5} işçi, [[time:{F1}d]] boyunca {%7} Çalışma Hızı kaybediyor."
esES = "Tu intento de dar marcha atrás no complace a nadie. Un bando se siente abandonado, mientras que el otro duda de tu sinceridad. Las discusiones solo se hacen más ruidosas.\n[[C]][[-]]Tanto los trabajadores {S6} como los {S5} pierden {%7} de Velocidad de trabajo durante [[time:{F1}d]]"
itIT = "Il tuo tentativo di cambiare rotta non piace a nessuno. Una parte si sente abbandonata, mentre l'altra dubita della tua sincerità. Le discussioni diventano solo più accese.\n[[C]][[-]]Sia i lavoratori {S6} che {S5} perdono {%7} di Velocità di lavoro per [[time:{F1}d]]"
ukUA = "Ваша спроба змінити курс нікого не тішить. Одна сторона почувається покинутою, а інша сумнівається у вашій щирості. Суперечки лише стають гучнішими.\n[[C]][[-]]Обидва типи працівників ({S6} і {S5}) втрачають {%7} швидкості роботи протягом [[time:{F1}d]]"
thTH = "การพยายามกลับลำของคุณไม่ทำให้ใครพอใจเลย ฝ่ายหนึ่งรู้สึกว่าถูกทอดทิ้ง ส่วนอีกฝ่ายก็สงสัยในความจริงใจของคุณ ข้อโต้แย้งยิ่งดังขึ้นเรื่อย ๆ\n[[C]][[-]]ทั้ง{S6}และ{S5}ต่างสูญเสีย{%7}ความเร็วในการทำงานเป็นเวลา [[time:{F1}d]]"
csCZ = "Vaše pokusy o změnu kurzu nikoho netěší. Jedna strana se cítí opuštěná, zatímco druhá zpochybňuje vaši upřímnost. Argumenty jen sílí.\n[[C]][[-]]Jak {S6}, tak {S5} dělníci ztrácí {%7} pracovní rychlosti na [[čas:{F1}d]]"
viVN = "Nỗ lực đảo ngược của bạn không làm ai hài lòng. Một bên cảm thấy bị bỏ rơi trong khi bên kia nghi ngờ về sự chân thành của bạn. Các tranh luận chỉ ngày càng trở nên ồn ào.  \n[[C]][[-]]Cả {S6} và {S5} công nhân đều mất {%7} Tốc độ Làm việc trong [[thời gian:{F1}d]]"
caES = "El teu intent de canviar de rumb no satisfà ningú. Un bàndol se sent abandonat mentre l'altre dubta de la teva sinceritat. Els arguments només es fan més forts.\n[[C]][[-]]Tant els treballadors de {S6} com els de {S5} perden {%7} de velocitat de treball durant [[time:{F1}d]]"
beBY = "Ваша спроба змяніць курс нікому не падабаецца. Адна група адчувае сябе кінутай, а другая сумняваецца ў вашай шчырасці. Спрэчкі толькі гучаюць усё гучней.\n[[C]][[-]]І {S6}, і {S5} працаўнікі губляюць {%7} хуткасці працы на [[time:{F1}d]]"
roRO = "Încercarea ta de a da înapoi nu mulțumește pe nimeni. Una dintre tabere se simte abandonată, iar cealaltă se îndoiește de sinceritatea ta. Argumentele doar se întețesc.\n[[C]][[-]]Atât muncitorii {S6}, cât și cei {S5} pierd {%7} din Viteza de lucru timp de [[time:{F1}d]]"
huHU = "Az Ön kísérlete a döntés megfordítására senkinek sem tetszik. Az egyik oldal elhagyottnak érzi magát, a másik pedig kételkedik őszinteségében. Az érvek csak egyre hangosabbak.\n[[C]][[-]]Mind a {S6}, mind a {S5} munkásai {%7} munkasebességet veszítenek ennyi ideig: [[time:{F1}d]]"
arSA = "محاولتك للتراجع عن قرارك لا ترضي أحداً. يشعر طرف بأنه متروك بينما يشكك الطرف الآخر في صدق نواياك. الجدالات لا تزداد إلا حدةً.\n[[C]][[-]]يخسر عمال {S6} و{S5} كلاهما {%7} من سرعة العمل لمدة [[time:{F1}d]]"

["LV.BCEv.FoodWoodDispute2.O4"]
raw = "At last, exhaustion overcomes anger. The workers slowly realize the quarrel is hurting the colony more than helping it, and cooperation gradually returns.\n[[C]][[+]]Both groups' workers gain +{%9} Working Speed for [[time:{F1}d]]"
status = "normal"
enUS = "At last, exhaustion overcomes anger. The workers slowly realize the quarrel is hurting the colony more than helping it, and cooperation gradually returns.  \n[[C]][[+]]Both groups' workers gain +{%9} Working Speed for [[time:{F1}d]]"
zhCN = "最终，疲惫战胜了愤怒。工人们慢慢意识到争吵对殖民地的伤害大于帮助，合作逐渐恢复。\n[[C]][[+]]双方工人的工作速度提升 +{%9}，持续时间为 [[time:{F1}d]]"
zhTW = "最終，疲憊戰勝了怒火。工人們慢慢意識到爭吵對殖民地的傷害大於幫助，合作逐漸恢復。\n[[C]][[+]]兩組工人的工作速度增加 +{%9} 持續 [[time:{F1}d]]"
ruRU = "Наконец, усталость берет верх над гневом. Рабочие медленно осознают, что ссора вредит колонии больше, чем помогает, и сотрудничество постепенно восстанавливается.  \n[[C]][[+]]Рабочие обеих групп получают +{%9} Скорость Работы на [[time:{F1}д]]"
jaJP = "「ついに、疲労が怒りを打ち負かします。労働者たちは徐々に、この争いがコロニーにとって助けにならず、むしろ害を及ぼしていることに気づき始め、協力が徐々に戻ります。\n[[C]][[+]]両グループの労働者は[[time:{F1}d]]の間、+{%9}の作業速度を得ます。」"
frFR = "Enfin, l'épuisement l'emporte sur la colère. Les travailleurs réalisent lentement que la querelle nuit à la colonie plus qu'elle ne l'aide, et la coopération revient progressivement.  \n[[C]][[+]]Les travailleurs des deux groupes gagnent +{%9} de Vitesse de Travail pour [[time:{F1}d]]"
deDE = "Endlich überwältigt die Erschöpfung die Wut. Die Arbeiter erkennen langsam, dass der Streit der Kolonie mehr schadet als nützt, und die Zusammenarbeit kehrt allmählich zurück.  \n[[C]][[+]]Die Arbeiter beider Gruppen erhalten +{%9} Arbeitsgeschwindigkeit für [[time:{F1}d]]"
plPL = "W końcu wyczerpanie pokonuje gniew. Pracownicy powoli uświadamiają sobie, że kłótnia bardziej szkodzi kolonii niż jej pomaga, a współpraca stopniowo wraca.  \n[[C]][[+]]Pracownicy obu grup zyskują +{%9} Prędkości Pracy przez [[time:{F1}d]]"
ptBR = "Por fim, a exaustão supera a raiva. Os trabalhadores percebem lentamente que a disputa está ferindo a colônia mais do que ajudando, e a cooperação gradualmente retorna.  \n[[C]][[+]]Os trabalhadores de ambos os grupos ganham +{%9} de Velocidade de Trabalho por [[time:{F1}d]]"
koKR = "마침내, 피로가 분노를 이깁니다. 노동자들은 갈등이 식민지에 더 해를 끼치고 도움을 주지 않는다는 것을 천천히 깨닫고, 협력이 점차 회복됩니다.  \n[[C]][[+]]양쪽 그룹의 노동자들은 [[time:{F1}d]] 동안 +{%9} 작업 속도를 얻습니다."
trTR = "Sonunda, yorgunluk öfkeyi yeniyor. İşçiler yavaş yavaş tartışmanın koloniyi yardımdan çok zarara uğrattığını fark ediyor ve iş birliği yavaş yavaş geri dönüyor.  \n[[C]][[+]]Her iki grubun işçileri için [[time:{F1}g]] boyunca +{%9} Çalışma Hızı kazanır."
esES = "Por fin, el enfado cede ante el agotamiento. Los trabajadores se dan cuenta poco a poco de que la disputa perjudica más a la colonia de lo que la ayuda, y la cooperación regresa gradualmente.\n[[C]][[+]]Los trabajadores de ambos grupos obtienen +{%9} de Velocidad de trabajo durante [[time:{F1}d]]"
itIT = "Alla fine, l'esasperazione prevale sulla rabbia. Gli operai capiscono lentamente che il litigio danneggia la colonia più di quanto l'aiuti, e la cooperazione torna gradualmente.\n[[C]][[+]]Gli operai di entrambi i gruppi ottengono +{%9} di Velocità di Lavoro per [[time:{F1}d]]"
ukUA = "Врешті-решт виснаження долає гнів. Робітники поступово усвідомлюють, що сварка шкодить колонії більше, ніж допомагає, і співпраця повільно повертається.\n[[C]][[+]]Робітники обох груп отримують +{%9} до швидкості роботи протягом [[time:{F1}d]]"
thTH = "ในที่สุด ความเหนื่อยล้าก็เข้าครอบงำความโกรธ คนงานค่อย ๆ ตระหนักว่าการทะเลาะกันกำลังทำร้ายอาณานิคมมากกว่าจะช่วย และความร่วมมือก็ค่อย ๆ กลับคืนมา\n[[C]][[+]]คนงานของทั้งสองกลุ่มได้รับ ความเร็วในการทำงาน +{%9} เป็นเวลา [[time:{F1}d]]"
csCZ = "Konečně vyčerpání přemáhá hněv. Pracovníci si pomalu uvědomují, že hádka více škodí kolonii, než jí pomáhá, a spolupráce se postupně vrací.  \n[[C]][[+]]Pracovníci obou skupin získávají +{%9} Rychlost práce na [[čas:{F1}d]]"
viVN = "Cuối cùng, sự kiệt sức vượt qua cơn tức giận. Những người lao động từ từ nhận ra rằng cuộc tranh cãi đang làm tổn hại đến thuộc địa nhiều hơn là giúp đỡ nó, và sự hợp tác dần trở lại.  \n[[C]][[+]]Công nhân của cả hai nhóm có được +{%9} Tốc độ Làm việc trong [[time:{F1}d]]"
caES = "Al final, l'esgotament vença la ira. Els treballadors s'adonen a poc a poc que la disputa perjudica la colònia més que no l'ajuda, i la cooperació torna gradualment.\n[[C]][[+]]Els treballadors de tots dos grups guanyen +{%9} de Velocitat de treball durant [[time:{F1}d]]"
beBY = "Нарэшце стомленасць перамагае злосць. Працаўнікі паступова разумеюць, што сварка шкодзіць калоніі больш, чым дапамагае, і супрацоўніцтва паступова вяртаецца.\n[[C]][[+]]Працаўнікі абедзвюх груп атрымліваюць +{%9} да хуткасці працы на [[time:{F1}d]]"
roRO = "În sfârșit, epuizarea învinge furia. Muncitorii realizează treptat că disputa le face mai mult rău coloniei decât bine, iar cooperarea revine încet.\n[[C]][[+]]Muncitorii din ambele grupuri câștigă +{%9} Viteză de lucru timp de [[time:{F1}d]]"
huHU = "Végül a kimerültség legyőzi a haragot. A munkások lassan rájönnek, hogy a viszály inkább árt a kolóniának, mint segít, és fokozatosan visszatér az együttműködés.\n[[C]][[+]]Mindkét csoport munkásai +{%9} munkasebességet kapnak [[time:{F1}d]] ideig"
arSA = "أخيرًا، يتغلب الإرهاق على الغضب. يدرك العمال ببطء أن الشجار يضر بالمستعمرة أكثر مما ينفعها، وتعود روح التعاون تدريجيًا.\n[[C]][[+]]يكتسب عمال كلتا المجموعتين +{%9} إلى سرعة العمل لمدة [[time:{F1}d]]"

["LV.BCEv.FoodWoodDispute2.O5"]
raw = "Without guidance, resentment festers unchecked. Workers from both sides leave the meeting more frustrated than before, blaming the colony leadership for failing to settle the matter.\n[[C]][[-]]Both groups' workers lose {%10} Working Speed for [[time:{F1}d]]"
status = "normal"
enUS = "Without guidance, resentment festers unchecked. Workers from both sides leave the meeting more frustrated than before, blaming the colony leadership for failing to settle the matter.  \n[[C]][[-]]Both groups' workers lose {1:10%} Working Speed for [[time:{F1}d]]"
zhCN = "在没有指导的情况下，怨恨滋生并失控。双方的工人在会议结束时比之前更加沮丧，责怪殖民地领导未能解决此事。  \n[[C]][[-]]两个团体的工人失去 {%10} 工作速度，持续 [[time:{F1}d]]"
zhTW = "在沒有指導的情況下，怨恨無法得到控制。雙方的工人在會議結束後比之前更感沮喪，指責殖民地的領導層無法解決問題。  \n[[C]][[-]]雙方工人的工作速度降低 {%10}，持續 [[time:{F1}d]]"
ruRU = "Без руководства недовольство разрастается бесконтрольно. Работники с обеих сторон покидают встречу более разочарованными, чем прежде, обвиняя руководство колонии в том, что оно не смогло разрешить данный вопрос.  \n[[C]][[-]]Работники обеих групп теряют {10%} скорость работы на [[time:{F1}д]]"
jaJP = "指標名: LV.BCEv.FoodWoodDispute2.O5 - 翻訳テキスト: \"指導なしでは、恨みが抑えられずに膨れ上がります。両側の労働者は会議を終えて以前よりも苛立ちを募らせ、問題を解決できなかった植民地の指導部を非難します。  \n[[C]][[-]]両グループの労働者は、[[time:{F1}d]]の間{10%}の作業速度を失います。\""
frFR = "Sans orientation, le ressentiment grandit sans contrôle. Les travailleurs des deux côtés quittent la réunion plus frustrés qu'auparavant, blâmant la direction de la colonie pour n'avoir pas réglé le problème.  \n[[C]][[-]]Les travailleurs des deux groupes perdent {%10} de Vitesse de Travail pendant [[time:{F1}j]]"
deDE = "Ohne Anleitung gärtnert Missmut ungehindert. Die Arbeiter beider Seiten verlassen das Treffen frustrierter als zuvor und machen die Kolonieführung dafür verantwortlich, die Angelegenheit nicht geklärt zu haben.  \n[[C]][[-]]Die Arbeiter beider Gruppen verlieren {%10} Arbeitsgeschwindigkeit für [[time:{F1}d]]"
plPL = "Bez prowadzenia, uraza narasta w niekontrolowany sposób. Pracownicy z obu stron wychodzą z spotkania bardziej sfrustrowani niż przedtem, obwiniając kierownictwo kolonii za niezdolność do załatwienia sprawy.\n[[C]][[-]]Pracownicy obu grup tracą {%10} Prędkości Pracy przez [[czas:{F1}d]]"
ptBR = "Sem orientação, o ressentimento fermenta sem controle. Trabalhadores de ambos os lados saem da reunião mais frustrados do que antes, culpando a liderança da colônia por não conseguir resolver a questão.  \n[[C]][[-]]Os trabalhadores de ambos os grupos perdem {10:0%} de Velocidade de Trabalho por [[tempo:{F1}d]]"
koKR = "지도 없이 불만은 억누르지 못하고 자라난다. 양측의 근로자들은 문제를 해결하지 못한 식민지 리더십을 비난하며 이전보다 더 불만을 안고 회의를 떠난다.  \n[[C]][[-]] 두 그룹의 근로자들은 [[time:{F1}d]] 동안 {%10} 작업 속도를 잃습니다."
trTR = "Rehberlik olmadan, içeridekinin öfkesi kontrolsüz bir şekilde büyür. Her iki tarafın işçileri toplantıdan daha da hayal kırıklığına uğrayarak ayrılır ve koloninin liderliğini meseleyi çözememekle suçlar.\n[[C]][[-]]Her iki grubun işçileri {%10} Çalışma Hızı kaybeder [[time:{F1}g]]"
esES = "Sin orientación, el resentimiento se enconа sin control. Los trabajadores de ambos bandos salen de la reunión más frustrados que antes, culpando a los líderes de la colonia por no resolver el asunto.\n[[C]][[-]]Los trabajadores de ambos grupos pierden {%10} de Velocidad de trabajo durante [[time:{F1}d]]"
itIT = "Senza una guida, il risentimento si fa strada senza freni. I lavoratori di entrambe le parti lasciano la riunione più frustrati di prima, accusando la leadership della colonia di non essere riuscita a risolvere la questione.\n[[C]][[-]]I lavoratori di entrambi i gruppi perdono {%10} di Velocità di Lavoro per [[time:{F1}d]]"
ukUA = "Без керівництва образи накопичуються без жодного контролю. Працівники обох сторін виходять зі зборів ще більш розлюченими, ніж були, і звинувачують керівництво колонії в тому, що воно не змогло врегулювати питання.\n[[C]][[-]]Працівники обох груп втрачають {%10} швидкості роботи на [[time:{F1}d]]"
thTH = "หากไม่มีการชี้แนะ ความขุ่นเคืองจะลุกลามโดยไม่มีใครควบคุม คนงานจากทั้งสองฝ่ายออกจากการประชุมด้วยความหงุดหงิดมากกว่าเดิม และโทษผู้นำอาณานิคมที่ไม่สามารถยุติเรื่องนี้ได้\n[[C]][[-]]คนงานของทั้งสองกลุ่มลดความเร็วในการทำงานลง {%10} เป็นเวลา [[time:{F1}d]]"
csCZ = "Bez vedení se zášť neomezeně prohlubuje. Pracovníci z obou stran odcházejí z jednání frustrovanější než předtím a obviňují vedení kolonie z neschopnosti vyřešit tuto záležitost.  \n[[C]][[-]]Pracovníci obou skupin ztrácejí {%10} pracovní rychlost na [[čas:{F1}d]]"
viVN = "Thiếu sự hướng dẫn, sự oán giận tích tụ không kiểm soát. Công nhân từ cả hai bên rời cuộc họp với sự thất vọng hơn trước, đổ lỗi cho lãnh đạo thuộc địa vì đã không giải quyết được vấn đề.\n[[C]][[-]]Công nhân của cả hai nhóm giảm {%10} Tốc độ làm việc trong [[thời gian:{F1}d]]"
caES = "Sense una orientació, el ressentiment s'enquista sense control. Els treballadors d'ambdues parts abandonen la reunió més frustrats que abans, culpant la direcció de la colònia per no haver resolt l'assumpte.\n[[C]][[-]]Els treballadors de tots dos grups perden {%10} de Velocitat de treball durant [[time:{F1}d]]"
beBY = "Без кіравання незадаволенасць разрастаецца без перашкод. Работнікі з абодвух бакоў выходзяць з сустрэчы больш расчараванымі, чым раней, і вінавацяць кіраўніцтва калоніі ў тым, што яно не змагло ўрэгуляваць спрэчку.\n[[C]][[-]]Работнікі абодвух груп страчваюць {%10} хуткасці працы на [[time:{F1}d]]"
roRO = "Fără îndrumare, resentimentul se înrăutățește nestingherit. Muncitorii din ambele tabere pleacă de la întâlnire mai frustrați decât înainte, dând vina pe conducerea coloniei că nu a reușit să rezolve problema.\n[[C]][[-]]Muncitorii din ambele grupuri pierd {%10} din Viteza de lucru timp de [[time:{F1}d]]"
huHU = "Irányítás nélkül a harag elmérgesedik. Mindkét oldal munkásai a találkozóról dühösebben távoznak, mint ahogy érkeztek, és a kolónia vezetését hibáztatják, amiért nem rendezte az ügyet.\n[[C]][[-]]Mindkét csoport munkásai {%10} Munkasebességet veszítenek [[time:{F1}d]] ideig"
arSA = "من دون توجيه، يتفاقم الاستياء دون رادع. يغادر عمال الطرفين الاجتماع أشد إحباطًا مما كانوا عليه، ملقين اللوم على قيادة المستعمرة لفشلها في تسوية الأمر.\n[[C]][[-]]يفقد عمال المجموعتين {%10} من سرعة العمل لمدة [[time:{F1}d]]"

