["LV.BCEv.ContaminationCure.O1"]
raw = "Against every doubtful stare, the treatment works. {CP_TriggerCharacterName}'s breathing steadies, their eyes clear, and before long they are sitting upright again.\nBetter still, the remaining mixture proves stable enough to store. Pasteur's Gamble may be crude, but it has given the colony something useful.\n[[C]][[+]]{CP_TriggerCharacterName} is cured.\n[[C]][[+]]Gain [[good:{S3}:{I4}]]."
status = "normal"
enUS = "Against every doubtful stare, the treatment works. {CP_TriggerCharacterName}'s breathing steadies, their eyes clear, and before long they are sitting upright again. Better still, the remaining mixture proves stable enough to store. Pasteur's Gamble may be crude, but it has given the colony something useful. [[C]][[+]]{CP_TriggerCharacterName} is cured. [[C]][[+]]Gain [[good:{S3}:{I4}]]."
zhCN = "面对每一个怀疑的目光，治疗效果显著。{CP_TriggerCharacterName}的呼吸平稳，眼睛清晰，不久后他们又坐了起来。\n更好的是，剩余的混合物证明足够稳定，可以储存。巴斯德的赌注或许粗糙，但它给了殖民地一些有用的东西。\n[[C]][[+]]{CP_TriggerCharacterName} 已经治愈。\n[[C]][[+]]获得 [[good:{S3}:{I4}]]."
zhTW = "面對每一個懷疑的目光，療法奏效了。{CP_TriggerCharacterName}的呼吸穩定下來，眼神清晰，沒過多久他們又坐起來了。  \n更好的是，剩下的藥劑穩定到可以儲存。巴斯德的賭注可能粗糙，但它給了殖民地一些有用的東西。  \n[[C]][[+]]{CP_TriggerCharacterName}康復了。  \n[[C]][[+]]獲得[[good:{S3}:{I4}]。"
ruRU = "Несмотря на все сомнительные взгляды, лечение срабатывает. Дыхание {CP_TriggerCharacterName} успокаивается, глаза проясняются, и вскоре они снова сидят прямо. Что еще лучше, оставшаяся смесь оказывается достаточно стабильной для хранения. Эксперимент Пастера может быть грубоват, но он дал колонии что-то полезное. [[C]][[+]]{CP_TriggerCharacterName} излечен. [[C]][[+]]Получите [[good:{S3}:{I4}]]."
jaJP = "疑念の視線に逆らって、治療は効果を発揮します。{CP_TriggerCharacterName}の呼吸は安定し、目は輝きを取り戻し、やがて彼らは再び直立して座っています。  \nさらに良いことに、残った混合物は保存するのに十分な安定性を示します。パスツールの賭けは粗雑かもしれませんが、コロニーに何か有用なものを与えました。  \n[[C]][[+]]{CP_TriggerCharacterName}は治癒しました。  \n[[C]][[+]]獲得 [[good:{S3}:{I4}]]."
frFR = "Contre chaque regard sceptique, le traitement fonctionne. La respiration de {CP_TriggerCharacterName} se stabilise, ses yeux s'éclaircissent, et avant longtemps, ils sont de nouveau assis droit.\nMieux encore, le mélange restant s'avère suffisamment stable pour être conservé. Le Pari de Pasteur peut être grossier, mais il a donné à la colonie quelque chose d'utile.\n[[C]][[+]]{CP_TriggerCharacterName} est guéri.\n[[C]][[+]]Gagnez [[bon:{S3}:{I4}]]."
deDE = "Gegen jeden zweifelnden Blick wirkt die Behandlung. {CP_TriggerCharacterName}s Atmung wird ruhiger, ihre Augen klar, und bald sitzen sie wieder aufrecht. \nNoch besser, die verbleibende Mischung erweist sich als stabil genug zur Lagerung. Pasteurs Glücksspiel mag grob sein, aber es hat der Kolonie etwas Nützliches gegeben. \n[[C]][[+]]{CP_TriggerCharacterName} ist geheilt.\n[[C]][[+]]Erhalte [[good:{S3}:{I4}]]."
plPL = "Przeciwko każdemu wątpliwemu spojrzeniu, leczenie działa. Oddech {CP_TriggerCharacterName} się stabilizuje, ich oczy stają się jasne, a wkrótce znów siedzą wyprostowani. Co więcej, pozostała mikstura okazuje się wystarczająco stabilna do przechowywania. Zakład Pasteura może być prymitywny, ale dał kolonii coś użytecznego. [[C]][[+]]{CP_TriggerCharacterName} jest wyleczony. [[C]][[+]]Zyskaj [[dobry:{S3}:{I4}]]."
ptBR = "Contra cada olhar duvidoso, o tratamento funciona. A respiração de {CP_TriggerCharacterName} se estabiliza, seus olhos ficam claros e, antes que percebam, estão sentados novamente. Melhor ainda, a mistura restante se prova estável o suficiente para armazenar. A Aposta de Pasteur pode ser rudimentar, mas deu à colônia algo útil. [[C]][[+]]{CP_TriggerCharacterName} está curado. [[C]][[+]]Ganhe [[good:{S3}:{I4}]]."
koKR = "의심스러운 시선에 맞서, 치료는 효과가 있다. {CP_TriggerCharacterName}의 호흡이 안정되고, 그들의 눈이 맑아지며, 곧 다시 똑바로 앉게 된다. 더 좋은 것은, 남은 혼합물이 저장하기에 충분히 안정적이라는 것이다. 파스퇴르의 도박은 거칠 수 있지만, 식민지에 유용한 것을 제공했다. [[C]][[+]]{CP_TriggerCharacterName}은 치료되었다. [[C]][[+]]획득 [[좋음:{S3}:{I4}]]."
trTR = "Şüpheli bakışlara karşı tedavi işe yarıyor. {CP_TriggerCharacterName}'ın nefesi düzeliyor, gözleri berraklaşıyor ve kısa süre içinde yeniden dik oturuyor. Daha da önemlisi, kalan karışım depolamak için yeterince stabil çıkıyor. Pasteur'un İkilemi kaba olabilir, ancak koloniye faydalı bir şey kazandırdı. [[C]][[+]]{CP_TriggerCharacterName} iyileşti. [[C]][[+]]Kazanç [[good:{S3}:{I4}]]."
esES = "Frente a todas las miradas dudosas, el tratamiento funciona. La respiración de {CP_TriggerCharacterName} se estabiliza, sus ojos se aclaran y, poco después, vuelve a estar sentado erguido.\nMejor aún, la mezcla restante resulta lo bastante estable como para almacenarla. La Apuesta de Pasteur puede ser rudimentaria, pero le ha dado a la colonia algo útil.\n[[C]][[+]]{CP_TriggerCharacterName} está curado.\n[[C]][[+]]Obtienes [[good:{S3}:{I4}]]."
itIT = "Contro ogni sguardo dubbioso, la cura funziona. Il respiro di {CP_TriggerCharacterName} si fa regolare, gli occhi tornano limpidi e, ben presto, torna a sedersi composto.\nMeglio ancora, la miscela rimasta si rivela abbastanza stabile da poter essere conservata. La Scommessa di Pasteur sarà pure grezza, ma ha dato alla colonia qualcosa di utile.\n[[C]][[+]]{CP_TriggerCharacterName} è guarito/a.\n[[C]][[+]]Ottieni [[good:{S3}:{I4}]]."
ukUA = "Попри всі сумніви, лікування діє. Дихання {CP_TriggerCharacterName} вирівнюється, погляд прояснюється, і незабаром він знову сидить прямо.\nЩе краще, залишена суміш виявляється достатньо стабільною, щоб її можна було зберегти. Ризик Пастера може бути грубим, але він дав колонії щось корисне.\n[[C]][[+]]{CP_TriggerCharacterName} вилікувано.\n[[C]][[+]]Отримати [[good:{S3}:{I4}]]."
thTH = "แม้จะถูกมองอย่างเคลือบแคลง การรักษาก็ได้ผล ลมหายใจของ {CP_TriggerCharacterName} กลับมาสม่ำเสมอ ดวงตาแจ่มใสขึ้น และไม่นานก็กลับมานั่งตัวตรงได้อีกครั้ง\nที่ดียิ่งกว่านั้นคือ ส่วนผสมที่เหลือมีความเสถียรพอที่จะเก็บรักษาไว้ได้ แม้ Pasteur's Gamble จะเป็นวิธีการที่หยาบกระด้าง แต่มันก็ทำให้โคโลนีได้รับสิ่งที่เป็นประโยชน์\n[[C]][[+]]{CP_TriggerCharacterName} หายจากอาการแล้ว\n[[C]][[+]]ได้รับ [[good:{S3}:{I4}]]."
csCZ = "Proti každému pochybovačnému pohledu léčba funguje. {CP_TriggerCharacterName} dýchá stabilně, jejich oči se vyjasňují a dříve než se nadějí, sedí opět vzpřímeně. Ještě lépe, zbývající směs se ukazuje jako dostatečně stabilní k uskladnění. Pasteurovo sázení může být hrubé, ale dalo kolonii něco užitečného. [[C]][[+]]{CP_TriggerCharacterName} je vyléčen. [[C]][[+]]Získat [[good:{S3}:{I4}]]."
viVN = "Trước mỗi ánh nhìn nghi ngờ, phương pháp điều trị có hiệu quả. Hơi thở của {CP_TriggerCharacterName} trở nên đều đặn, mắt họ sáng rõ, và chẳng bao lâu sau họ đã ngồi thẳng dậy.\nTốt hơn nữa, phần hỗn hợp còn lại chứng tỏ đủ ổn định để lưu trữ. Canh bạc của Pasteur có thể thô sơ, nhưng nó đã mang lại cho thuộc địa điều gì đó hữu ích.\n[[C]][[+]]{CP_TriggerCharacterName} đã được chữa khỏi.\n[[C]][[+]]Nhận [[good:{S3}:{I4}]]."
caES = "Davant de cada mirada dubtosa, el tractament funciona. La respiració de {CP_TriggerCharacterName} es regularitza, els seus ulls s'aclareixen i, al cap de poc, tornen a seure drets.\nEncara millor, la barreja restant resulta prou estable per emmagatzemar-la. L'Aposta de Pasteur pot ser rudimentària, però ha donat a la colònia alguna cosa útil.\n[[C]][[+]]{CP_TriggerCharacterName} està curat.\n[[C]][[+]]Guanya [[good:{S3}:{I4}]]."
beBY = "Супраць усіх сумнеўных поглядаў метад лячэння працуе. Дыханне {CP_TriggerCharacterName} выроўнілася, вочы прачысцеліся, і неўзабаве ён/яна зноў сядзіць прама.\nЯшчэ лепей тое, што засталася сумесь аказалася дастаткова стабільнай, каб яе можна было захоўваць. «Азартная гульня Пастэра» можа быць грубай, але яна дала калоніі нешта карыснае.\n[[C]][[+]]{CP_TriggerCharacterName} вылечаны.\n[[C]][[+]]Атрымаць [[good:{S3}:{I4}]]."
roRO = "Împotriva tuturor privirilor îndoielnice, tratamentul funcționează. Respirația lui {CP_TriggerCharacterName} se liniștește, privirea i se limpezește, iar curând stă din nou drept.\nMai bine încă, amestecul rămas se dovedește suficient de stabil pentru a fi depozitat. Pasteur's Gamble poate fi rudimentar, dar i-a oferit coloniei ceva util.\n[[C]][[+]]{CP_TriggerCharacterName} este vindecat.\n[[C]][[+]]Câștigă [[good:{S3}:{I4}]]."
huHU = "Minden kétkedő tekintet ellenére a kezelés bevált. {CP_TriggerCharacterName} légzése megnyugszik, tekintete kitisztul, és nemsokára már ismét egyenesen ül.\nAmi még jobb, a megmaradt keverék elég stabilnak bizonyult ahhoz, hogy eltárolják. Pasteur kockázatos fogadása lehet nyers, de a kolóniának így is hasznos dolgot adott.\n[[C]][[+]]{CP_TriggerCharacterName} meggyógyult.\n[[C]][[+]][[good:{S3}:{I4}]] nyersz."
arSA = "ضد كل نظرة شكّ، تنجح المعالجة. يهدأ تنفس {CP_TriggerCharacterName}، وتصفو عيناه، وبعد وقت قصير يعود إلى الجلوس منتصبًا.\nوالأفضل من ذلك أن الخليط المتبقي ثابت بما يكفي للتخزين. قد تكون مغامرة باستور خشنة، لكنها منحت المستعمرة شيئًا مفيدًا.\n[[C]][[+]]تم شفاء {CP_TriggerCharacterName}.\n[[C]][[+]]اكسب [[good:{S3}:{I4}]]."

["LV.BCEv.ContaminationCure.O2"]
raw = "The treatment fails. {CP_TriggerCharacterName} remains weak, and the hopeful mixture turns bitter and useless. By morning, several helpers begin showing the same signs of contamination.\n[[C]][[-]]{I5} random beavers become contaminated."
status = "normal"
enUS = "The treatment fails. {CP_TriggerCharacterName} remains weak, and the hopeful mixture turns bitter and useless. By morning, several helpers begin showing the same signs of contamination. [[C]][[-]]{I5} random beavers become contaminated."
zhCN = "“治疗失败。{CP_TriggerCharacterName}依然虚弱，而充满希望的混合物变得苦涩无用。到早晨，几名助手开始出现同样的污染迹象。  \n[[C]][[-]]{I5}只随机的海狸受到污染。”"
zhTW = "治療失敗。{CP_TriggerCharacterName} 仍然虛弱，滿懷希望的混合物變得苦澀且毫無用處。到早晨，幾名幫手開始出現相同的污染跡象。[[C]][[-]]{I5} 隨機的海狸變得受到污染。"
ruRU = "Лечение терпит неудачу. {CP_TriggerCharacterName} остается слабым, а надежная смесь становится горькой и бесполезной. К утру несколько помощников начинают показывать те же признаки загрязнения. [[C]][[-]]{I5} случайные бобры заражаются."
jaJP = "治療に失敗しました。{CP_TriggerCharacterName}は依然として弱く、期待に満ちた混合物は苦く無用なものとなります。朝になると、数人の助っ人が同様の汚染の兆候を示し始めます。  \n[[C]][[-]]{I5}匹のランダムなビーバーが汚染されます。"
frFR = "Le traitement échoue. {CP_TriggerCharacterName} reste faible, et le mélange plein d'espoir devient amer et inutile. Au matin, plusieurs assistants commencent à montrer les mêmes signes de contamination. [[C]][[-]]{I5} castors aléatoires deviennent contaminés."
deDE = "Die Behandlung schlägt fehl. {CP_TriggerCharacterName} bleibt schwach, und die hoffnungsvolle Mischung wird bitter und nutzlos. Bis zum Morgen zeigen mehrere Helfer die gleichen Anzeichen einer Kontamination. [[C]][[-]]{I5} zufällige Biber werden kontaminiert."
plPL = "Kuracja nie udaje się. {CP_TriggerCharacterName} pozostaje słaby, a obiecująca mieszanka staje się gorzka i bezużyteczna. Do rana kilku pomocników zaczyna wykazywać te same objawy zanieczyszczenia. \n[[C]][[-]]{I5} losowych bobrów zostaje skażonych."
ptBR = "O tratamento falha. {CP_TriggerCharacterName} continua fraco, e a mistura esperançosa se torna amarga e inútil. Pela manhã, vários ajudantes começam a mostrar os mesmos sinais de contaminação. [[C]][[-]]{I5} castores aleatórios ficam contaminados."
koKR = "치료에 실패합니다. {CP_TriggerCharacterName}는 여전히 약해 있으며, 희망적인 혼합물은 씁쓸하고 쓸모없게 변합니다. 아침이 되면 여러 도우미들이 동일한 오염 징후를 보이기 시작합니다. [[C]][[-]]{I5} 마리의 무작위 비버가 오염됩니다."
trTR = "Tedavi başarısız oldu. {CP_TriggerCharacterName} zayıf kalıyor ve umut verici karışım acı ve işe yaramaz hale geliyor. Sabah olunca, birkaç yardımcı aynı kirlenme belirtilerini göstermeye başlıyor. [[C]][[-]]{I5} rastgele kunduz kirleniyor."
esES = "El tratamiento fracasa. {CP_TriggerCharacterName} sigue débil, y la mezcla llena de esperanza se vuelve amarga e inútil. Al amanecer, varios ayudantes empiezan a mostrar los mismos signos de contaminación.\n[[C]][[-]]{I5} castores aleatorios se contaminan."
itIT = "La cura fallisce. {CP_TriggerCharacterName} resta debole, e la miscela speranzosa diventa amara e inutile. Al mattino, diversi aiutanti iniziano a mostrare gli stessi segni di contaminazione.\n[[C]][[-]]{I5} castori casuali si contaminano."
ukUA = "Лікування не спрацювало. {CP_TriggerCharacterName} залишається слабким, а надія, що вселялася в суміш, стає гіркою й марною. До ранку кілька помічників починають демонструвати ті самі ознаки зараження.\n[[C]][[-]]{I5} випадкових бобрів заражаються."
thTH = "การรักษาล้มเหลว {CP_TriggerCharacterName} ยังคงอ่อนแรง และส่วนผสมที่เคยหวังว่าจะได้ผลกลับขมและใช้การไม่ได้ เมื่อรุ่งเช้า ผู้ช่วยหลายตัวเริ่มแสดงอาการปนเปื้อนแบบเดียวกัน\n[[C]][[-]]{I5} บีเวอร์แบบสุ่มจะปนเปื้อน"
csCZ = "Léčba selhává. {CP_TriggerCharacterName} zůstává slabý a nadějná směs se mění v hořkou a k ničemu. Do rána se u několika pomocníků začínají objevovat stejné příznaky kontaminace. [[C]][[-]]{I5} náhodní bobři se kontaminují."
viVN = "Cuộc điều trị thất bại. {CP_TriggerCharacterName} vẫn yếu, và hỗn hợp đầy hy vọng trở nên đắng và vô dụng. Đến sáng, một vài người trợ giúp bắt đầu có dấu hiệu bị ô nhiễm.\n[[C]][[-]]{I5} con hải ly ngẫu nhiên bị ô nhiễm."
caES = "La recuperació fracassa. {CP_TriggerCharacterName} continua debilitat, i la mescla plena d'esperança es torna amarga i inútil. Al matí, diversos ajudants comencen a mostrar els mateixos signes de contaminació.\n[[C]][[-]]{I5} castors aleatoris es contaminen."
beBY = "Лячэнне не спрацавала. {CP_TriggerCharacterName} застаецца слабым, а абнадзейваючая сумесь робіцца горкай і непрыдатнай. Раніцай некалькі памочнікаў пачынаюць паказваць тыя ж прыкметы заражэння.\n[[C]][[-]]{I5} выпадковых бабраў заражаюцца."
roRO = "Tratamentul eșuează. {CP_TriggerCharacterName} rămâne slăbit, iar amestecul plin de speranță devine amar și inutil. Până dimineață, mai mulți ajutoare încep să arate aceleași semne de contaminare.\n[[C]][[-]]{I5} castori aleatori devin contaminați."
huHU = "A kezelés kudarcot vall. {CP_TriggerCharacterName} gyenge marad, a reményteli keverék pedig keserű és használhatatlan lesz. Reggelre több segítő is ugyanazokat a szennyeződési jeleket mutatja.\n[[C]][[-]]{I5} véletlenszerű róka szennyeződik meg."
arSA = "يفشل العلاج. يبقى {CP_TriggerCharacterName} ضعيفاً، ويتحول المزيج المفعم بالأمل إلى مرارة وعديم الفائدة. وبحلول الصباح، يبدأ عدد من المساعدين بإظهار العلامات نفسها للتلوث.\n[[C]][[-]]يصاب {I5} من القنادس العشوائيين بالتلوث."

["LV.BCEv.ContaminationCure.O3"]
raw = "The treatment fails. {CP_TriggerCharacterName} remains weak, and the prepared goods are spent with nothing to show for them.\nThe careful notes, however, prove useful for something else. The doctor cannot save the cure, but the colony recovers the lesson.\n[[C]][[+]]Refund {I3} Science."
status = "normal"
enUS = "The treatment fails. {CP_TriggerCharacterName} remains weak, and the prepared goods are spent with nothing to show for them. The careful notes, however, prove useful for something else. The doctor cannot save the cure, but the colony recovers the lesson. [[C]][[+]]Refund {I3} Science."
zhCN = "“治疗失败了。{CP_TriggerCharacterName} 依然虚弱，准备的物品也被浪费，毫无成果。然而，这些细致的笔记却对其他事情有帮助。医生无法挽救这种疗法，但殖民地吸取了教训。[[C]][[+]]退款 {I3} 科学。”"
zhTW = "治療失敗了。{CP_TriggerCharacterName}仍然虛弱，而準備的物資已耗盡，卻沒有任何成果。然而，仔細的紀錄卻對其他事情有用。醫生無法挽救治療，但殖民地從中汲取了教訓。[[C]][[+]]退還{I3}科學。"
ruRU = "Лечение не удалось. {CP_TriggerCharacterName} остается ослабленным, а подготовленные материалы потрачены безрезультатно.  \nТем не менее, внимательные заметки оказываются полезными для чего-то другого. Доктор не может спасти лечение, но колония усваивает урок.  \n[[C]][[+]]Возврат {I3} Науки."
jaJP = "治療は失敗する。{CP_TriggerCharacterName}は依然として弱く、準備された物資は消耗し、何も得られなかった。しかし、注意深いメモは別の用途に役立つ。医者は治療を救うことができないが、コロニーは教訓を回復する。  \n[[C]][[+]]{I3}科学の返金。"
frFR = "Le traitement échoue. {CP_TriggerCharacterName} reste faible, et les biens préparés sont dépensés sans aucun résultat. Cependant, les notes soigneusement prises s'avèrent utiles pour autre chose. Le docteur ne peut pas sauver le remède, mais la colonie tire une leçon de cette expérience. [[C]][[+]]Rembourser {I3} Science."
deDE = "Die Behandlung schlägt fehl. {CP_TriggerCharacterName} bleibt schwach, und die vorbereiteten Waren sind verbraucht, ohne etwas dafür zu zeigen.  \nDie sorgfältigen Notizen erweisen sich jedoch als nützlich für etwas anderes. Der Doktor kann das Heilmittel nicht retten, aber die Kolonie lernt aus der Lektion.  \n[[C]][[+]]Erstatte {I3} Wissenschaft."
plPL = "Leczenie się nie udaje. {CP_TriggerCharacterName} pozostaje słaby, a przygotowane dobra są wydane bez żadnego rezultatu. Jednak staranne notatki okazują się przydatne do czegoś innego. Doktor nie potrafi uratować leku, ale kolonia wyciąga wnioski. [[C]][[+]]Zwróć {I3} Naukę."
ptBR = "O tratamento falha. {CP_TriggerCharacterName} continua fraco, e os bens preparados são gastos sem nada a mostrar. As anotações cuidadosas, no entanto, se provam úteis para outra coisa. O médico não consegue salvar a cura, mas a colônia recupera a lição. [[C]][[+]]Reembolsar {I3} Ciência."
koKR = "치료에 실패했습니다. {CP_TriggerCharacterName}는 여전히 약하며, 준비된 자원은 쓸모 없이 소모되었습니다. 그러나 신중하게 작성된 노트는 다른 용도로 유용하게 사용됩니다. 의사는 치료법을 구할 수 없지만, 식민지는 교훈을 얻습니다. [[C]][[+]]{I3} 과학을 환불합니다."
trTR = "Tedavi başarısız oldu. {CP_TriggerCharacterName} zayıf kalıyor ve hazırlanan malzemeler harcanmış durumda, elde hiçbir şey yok. Ancak dikkatli notlar başka bir şey için faydalı oluyor. Doktor tedaviyi kurtaramıyor, ancak koloni dersi alıyor. [[C]][[+]] {I3} Bilim iadesi."
esES = "El tratamiento fracasa. {CP_TriggerCharacterName} sigue débil, y los bienes preparados se gastan sin ningún resultado a cambio.\nLas notas cuidadosas, sin embargo, resultan útiles para otra cosa. El médico no puede salvar la cura, pero la colonia recupera la lección.\n[[C]][[+]]Reembolsa {I3} de Ciencia."
itIT = "Il trattamento fallisce. {CP_TriggerCharacterName} resta debole, e i beni preparati vengono sprecati senza alcun risultato.\nLe attente annotazioni, tuttavia, si rivelano utili per qualcos'altro. Il medico non può salvare la cura, ma la colonia fa propria la lezione.\n[[C]][[+]]Rimborsa {I3} Scienza."
ukUA = "Лікування не вдалося. {CP_TriggerCharacterName} залишається слабким, а підготовлені товари витрачено даремно.\nПроте обережні нотатки стануть у пригоді для іншого. Лікар не може врятувати ліки, але колонія засвоює урок.\n[[C]][[+]]Повернути {I3} науки."
thTH = "การรักษาล้มเหลว {CP_TriggerCharacterName} ยังคงอ่อนแอ และของที่เตรียมไว้ก็หมดไปโดยไม่ได้อะไรกลับมา\nอย่างไรก็ตาม บันทึกอย่างระมัดระวังนั้นมีประโยชน์กับเรื่องอื่น หมอไม่สามารถช่วยยาวิเศษไว้ได้ แต่อาณานิคมได้เรียนรู้บทเรียนนั้นไว้\n[[C]][[+]]คืน {I3} วิทยาศาสตร์"
csCZ = "Léčba selhává. {CP_TriggerCharacterName} zůstává slabý a připravené zboží bylo použito bez jakýchkoli výsledků. \nPečlivé poznámky se však ukazují jako užitečné pro něco jiného. Doktor nedokáže zachránit lék, ale kolonie se poučí z této zkušenosti. \n[[C]][[+]]Vrátit {I3} vědy."
viVN = "Phương pháp điều trị thất bại. {CP_TriggerCharacterName} vẫn yếu ớt, và hàng hóa đã chuẩn bị bị lãng phí mà không có gì để thu về. \nTuy nhiên, những ghi chú cẩn thận lại chứng tỏ có ích cho một điều khác. Bác sĩ không thể cứu vãn phương pháp chữa trị, nhưng thuộc địa đã rút ra được bài học. \n[[C]][[+]]Hoàn lại {I3} Khoa học."
caES = "El tractament falla. {CP_TriggerCharacterName} es manté feble, i els béns preparats es gasten sense cap resultat.\nLes notes meticuloses, però, resulten útils per a una altra cosa. El metge no pot salvar la cura, però la colònia en recupera la lliçó.\n[[C]][[+]]Reemborsa {I3} de Ciència."
beBY = "Лячэнне не спрацоўвае. {CP_TriggerCharacterName} застаецца слабым, а падрыхтаваныя прадукты выдаткаваны дарма.\nАднак уважлівыя нататкі спатрэбіліся для іншага. Лекар не можа захаваць лекавы сродак, але калонія пераймае ўрок.\n[[C]][[+]]Вярнуць {I3} навукі."
roRO = "Tratamentul eșuează. {CP_TriggerCharacterName} rămâne slăbit, iar bunurile pregătite sunt consumate fără niciun rezultat.\nNotele atente se dovedesc totuși utile pentru altceva. Doctorul nu poate salva leacul, dar colonia recuperează lecția.\n[[C]][[+]]Restituie {I3} Știință."
huHU = "A kezelés kudarcot vall. {CP_TriggerCharacterName} gyenge marad, a elkészített javak pedig semmit sem érnek.\nA gondos jegyzetek viszont másra hasznosnak bizonyulnak. Az orvos nem tudja megmenteni a gyógymódot, de a kolónia megtanulja a leckét.\n[[C]][[+]]Visszatérít {I3} Tudományt."
arSA = "فشل العلاج. يبقى {CP_TriggerCharacterName} ضعيفًا، وتُستهلك البضائع المُجهّزة دون أن تحقق أي نتيجة.\nلكن الملاحظات الدقيقة تثبت فائدتها في أمر آخر. لا يستطيع الطبيب إنقاذ العلاج، لكن المستعمرة تستعيد الدرس.\n[[C]][[+]]استرداد {I3} من العلوم."

