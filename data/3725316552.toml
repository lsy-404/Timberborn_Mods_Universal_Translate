["LV.BCEv.FirstDeath.C3N"]
raw = "[[C]]There is no time for this. The colony must move on. <YellowHighlight>Unknown consequences.</YellowHighlight>"
status = "normal"
enUS = "[[C]]There is no time for this. The colony must move on. <YellowHighlight>Unknown consequences.</YellowHighlight>"
zhCN = "[[C]]没有时间了。殖民地必须继续前进。<YellowHighlight>未知的后果。</YellowHighlight>"
zhTW = "「[[C]]現在沒有時間了。殖民地必須繼續前進。<YellowHighlight>未知的後果。</YellowHighlight>」"
ruRU = "[C]На это нет времени. Колония должна двигаться дальше. <YellowHighlight>Неизвестные последствия.</YellowHighlight>"
jaJP = "[[C]]こんなことをしている時間はない。コロニーは進まなければならない。<YellowHighlight>未知の結果。</YellowHighlight>"
frFR = "[[C]]Il n'y a pas de temps pour ça. La colonie doit avancer. <YellowHighlight>Conséquences inconnues.</YellowHighlight>"
deDE = "„[[C]]Es gibt keine Zeit dafür. Die Kolonie muss weitermachen. <YellowHighlight>Unbekannte Konsequenzen.</YellowHighlight>“"
plPL = "[[C]]Nie ma na to czasu. Kolonia musi iść dalej. <YellowHighlight>Nieznane konsekwencje.</YellowHighlight>"
ptBR = "[[C]]Não há tempo para isso. A colônia deve seguir em frente. <YellowHighlight>Consequências desconhecidas.</YellowHighlight>"
koKR = "[[C]]이럴 시간이 없다. 식민지는 계속 나아가야 한다. <YellowHighlight>알 수 없는 결과들.</YellowHighlight>"
trTR = "[[C]]Bunun için zaman yok. Koloni ilerlemeli. <YellowHighlight>Bilinmeyen sonuçlar.</YellowHighlight>"
esES = "[[C]]No hay tiempo para esto. La colonia debe seguir adelante. <YellowHighlight>Consecuencias desconocidas.</YellowHighlight>"
itIT = "[[C]]Non c'è tempo per questo. La colonia deve andare avanti. <YellowHighlight>Conseguenze sconosciute.</YellowHighlight>"
ukUA = "[[C]]На це немає часу. Колонія мусить рухатися далі. <YellowHighlight>Невідомі наслідки.</YellowHighlight>"
thTH = "[[C]]ไม่มีเวลาสำหรับเรื่องนี้ อาณานิคมต้องเดินหน้าต่อไป <YellowHighlight>ผลที่ตามมายังไม่ทราบแน่ชัด</YellowHighlight>"
csCZ = "[[C]]Na to není čas. Kolonie musí pokračovat. <YellowHighlight>Neznámé následky.</YellowHighlight>"
viVN = "[[C]]Không có thời gian cho điều này. колони phải tiến về phía trước. <YellowHighlight>Hệ quả không rõ.</YellowHighlight>"
caES = "[[C]]No hi ha temps per a això. La colònia ha de seguir endavant. <YellowHighlight>Conseqüències desconegudes.</YellowHighlight>"
beBY = "[[C]]Часу на гэта няма. Калонія павінна рухацца далей. <YellowHighlight>Невядомыя наступствы.</YellowHighlight>"
roRO = "[[C]]Nu există timp pentru asta. Colonia trebuie să meargă mai departe. <YellowHighlight>Consecințe necunoscute.</YellowHighlight>"
huHU = "[[C]]Nincs időnk erre. A kolóniának tovább kell lépnie. <YellowHighlight>Ismeretlen következmények.</YellowHighlight>"
arSA = "[[C]]لا يوجد وقت لهذا. يجب أن تمضي المستعمرة قدمًا. <YellowHighlight>عواقب غير معروفة.</YellowHighlight>"

["LV.BCEv.FirstDeath.O1"]
raw = "The logs are lashed together into a small raft, just large enough to carry {CP_TriggerCharacterName} downriver.\nThe colony watches in silence as the current takes them away. It is a simple farewell, but it gives the beavers a little peace.\n[[C]][[+]]All beavers gain the <GreenHighlight>+Remembrance</GreenHighlight> Wellbeing bonus for some time."
status = "normal"
enUS = "The logs are lashed together into a small raft, just large enough to carry {CP_TriggerCharacterName} downriver. The colony watches in silence as the current takes them away. It is a simple farewell, but it gives the beavers a little peace. [[C]][[+]]All beavers gain the <GreenHighlight>+Remembrance</GreenHighlight> Wellbeing bonus for some time."
zhCN = "木头被绑在一起，形成一只小木筏，刚好可以让{CP_TriggerCharacterName}顺流而下。  \n殖民地静默地注视着木筏被洪流带走。这是一个简单的告别，但这给了海狸们一点平静。  \n[[C]][[+]]所有海狸在一段时间内获得<GreenHighlight>+纪念</GreenHighlight>福祉加成。"
zhTW = "木材被綁在一起，形成一個小筏子，剛好能帶著{CP_TriggerCharacterName}順流而下。  \n殖民地靜靜地觀看著，當水流把它們帶走。這是一個簡單的告別，但給了海狸們一點平靜。  \n[[C]][[+]]所有海狸在一段時間內獲得<GreenHighlight>+追憶</GreenHighlight>的幸福加成。"
ruRU = "Деревья связаны вместе в небольшой плот, достаточно большой, чтобы унести {CP_TriggerCharacterName} вниз по течению. Колония наблюдает в молчании, как течение уносит их. Это простое прощание, но оно приносит бобрам немного покоя. [[C]][[+]]Все бобры получают <GreenHighlight>+Воспоминание</GreenHighlight> бонус к благосостоянию на некоторое время."
jaJP = "丸太は小さな筏にまとまれ、{CP_TriggerCharacterName}を川下に運ぶのに十分な大きさです。  \nコロニーは静かに見守り、流れに彼らを任せます。シンプルな別れですが、ビーバーたちに少しの安らぎを与えます。  \n[[C]][[+]]すべてのビーバーはしばらくの間、<GreenHighlight>+記憶</GreenHighlight>の幸福ボーナスを得ます。"
frFR = "Les bûches sont ligaturées ensemble en un petit radeau, juste assez grand pour transporter {CP_TriggerCharacterName} en aval.  \nLa colonie regarde en silence alors que le courant les emporte. C'est un simple au revoir, mais cela apporte un peu de paix aux castors.  \n[[C]][[+]]Tous les castors gagnent le bonus de bien-être <GreenHighlight>+Souvenir</GreenHighlight> pendant un certain temps."
deDE = "Die Stämme sind zu einem kleinen Floß zusammengebunden, das gerade genug Platz bietet, um {CP_TriggerCharacterName} flussabwärts zu tragen. \nDie Kolonie beobachtet in Stille, wie die Strömung sie mitnimmt. Es ist ein einfacher Abschied, aber er schenkt den Bibern ein wenig Frieden. \n[[C]][[+]]Alle Biber erhalten für einige Zeit den <GreenHighlight>+Erinnerung</GreenHighlight> Wohlfühlbonus."
plPL = "Kłody są związane razem w małą tratwę, wystarczająco dużą, aby zabrać {CP_TriggerCharacterName} w dół rzeki. Kolonia obserwuje w milczeniu, jak prąd odsuwa ich od brzegu. To proste pożegnanie, ale daje bobrom odrobinę spokoju. [[C]][[+]]Wszystkie bobry zyskują bonus do Samopoczucia <GreenHighlight>+Pamięć</GreenHighlight> na pewien czas."
ptBR = "Os troncos estão amarrados juntos em uma pequena jangada, grande o suficiente para levar {CP_TriggerCharacterName} rio abaixo. A colônia observa em silêncio enquanto a correnteza os leva embora. É uma despedida simples, mas dá aos castores um pouco de paz. [[C]][[+]] Todos os castores ganham o bônus de Bem-Estar <GreenHighlight>+Lembrança</GreenHighlight> por um tempo."
koKR = "나무들이 작은 뗏목으로 묶여, {CP_TriggerCharacterName}을(를) 강 아래로 실어 나를 수 있는 크기입니다.  \n식민지는 그들이 떠나가는 모습을 조용히 지켜봅니다. 간단한 작별이지만, 비버들에게는 약간의 평화를 줍니다.  \n[[C]][[+]]모든 비버는 일정 시간 동안 <GreenHighlight>+기념</GreenHighlight> 웰빙 보너스를 얻습니다."
trTR = "Kütükler, {CP_TriggerCharacterName}’ı nehir boyunca taşımak için yeterince büyük küçük bir sal haline getirilmiş.  \nKoloni, akıntının onları götürüşünü sessizce izliyor. Bu basit bir veda, ama dauzlar için biraz huzur sağlıyor.  \n[[C]][[+]]Tüm dauzlar, bir süreliğine <GreenHighlight>+Anı</GreenHighlight> Refah bonusunu kazanır."
esES = "Los troncos se atan entre sí formando una pequeña balsa, justo lo bastante grande para llevar a {CP_TriggerCharacterName} río abajo.\nLa colonia observa en silencio cómo la corriente se los lleva. Es una despedida sencilla, pero les brinda a los castores un poco de paz.\n[[C]][[+]]Todos los castores obtienen la bonificación de Bienestar <GreenHighlight>+Recuerdo</GreenHighlight> durante un tiempo."
itIT = "I tronchi vengono legati insieme a formare una piccola zattera, appena abbastanza grande da trasportare {CP_TriggerCharacterName} verso valle.\nLa colonia osserva in silenzio mentre la corrente se li porta via. È un addio semplice, ma regala ai castori un po' di pace.\n[[C]][[+]]Tutti i castori ottengono per un certo periodo il bonus di benessere <GreenHighlight>+Ricordo</GreenHighlight>."
ukUA = "Колоди зв'язали разом у невеликий пліт, якраз достатньо великий, щоб перевезти {CP_TriggerCharacterName} вниз за течією.\nКолонія мовчки спостерігає, як течія забирає їх. Це просте прощання, але воно дарує бобрам трохи спокою.\n[[C]][[+]]Усі бобри отримують бонус добробуту <GreenHighlight>+Пам'ять</GreenHighlight> на деякий час."
thTH = "ท่อนไม้ถูกมัดรวมกันเป็นแพเล็ก ๆ ที่พอดีกับการพา {CP_TriggerCharacterName} ล่องตามสายน้ำลงไป\nอาณานิคมเฝ้ามองอย่างเงียบงันขณะที่กระแสน้ำพาพวกเขาจากไป นี่เป็นการอำลาที่เรียบง่าย แต่ก็มอบความสงบเล็ก ๆ น้อย ๆ ให้แก่บีเวอร์\n[[C]][[+]]บีเวอร์ทุกตัวได้รับโบนัสความอยู่ดีมีสุข <GreenHighlight>+Remembrance</GreenHighlight> เป็นเวลาหนึ่ง"
csCZ = "Klády jsou svázány dohromady do malého raftu, který je dostatečně velký na to, aby odvezl {CP_TriggerCharacterName} po proudu. Kolonie tiše sleduje, jak je proud unáší. Je to jednoduché rozloučení, ale dává bobrům trochu klidu. [[C]][[+]]Všichni bobři získávají <GreenHighlight>+Vzpomínku</GreenHighlight> bonus k pohodě na nějakou dobu."
viVN = "Các tấm gỗ được buộc lại với nhau thành một chiếc bè nhỏ, vừa đủ để chở {CP_TriggerCharacterName} xuôi dòng. \nColony đứng im lặng quan sát khi dòng nước cuốn họ đi. Đây là một lời chia tay giản dị, nhưng mang lại cho những con rái cá một chút bình yên. \n[[C]][[+]]Tất cả rái cá nhận được phúc lợi <GreenHighlight>+Kỷ Niệm</GreenHighlight> trong một thời gian."
caES = "La xarxa de troncs s'ha lligat en una balsa petita, just prou gran per portar {CP_TriggerCharacterName} riu avall.\nLa colònia observa en silenci mentre el corrent se'ls enddu. És un comiat senzill, però dona als castors una mica de pau.\n[[C]][[+]]Tots els castors obtenen la millora de benestar <GreenHighlight>+Remembrance</GreenHighlight> durant un temps."
beBY = "Бярвенні звязаны ў невялікі плыт, якраз дастатковы, каб перавезці {CP_TriggerCharacterName} уніз па цячэнні.\nКалонія ў маўчанні глядзіць, як плынь уносіць іх прэч. Гэта простае развітанне, але яно дорыць бабрам трохі спакою.\n[[C]][[+]]Усе бабры на некаторы час атрымліваюць бонус дабрабыту <GreenHighlight>+Remembrance</GreenHighlight>."
roRO = "Buştenii sunt legați împreună într-o plută mică, suficient de mare cât să-l ducă pe {CP_TriggerCharacterName} în josul râului.\nColonia privește în tăcere cum curentul îi duce departe. Este un rămas-bun simplu, dar le oferă castorilor puțină liniște.\n[[C]][[+]]Toți castorii primesc bonusul de bunăstare <GreenHighlight>+Remembrance</GreenHighlight> pentru o perioadă de timp."
huHU = "A faxadtutajt úgy kötözték össze, hogy éppen elég nagy legyen ahhoz, hogy {CP_TriggerCharacterName} lesodródjon vele a folyón.\nA kolónia csendben figyeli, ahogy az áramlat elviszi őket. Egyszerű búcsú ez, mégis egy kis nyugalmat ad a bévéknek.\n[[C]][[+]]Minden bóbita egy ideig a <GreenHighlight>+Emlékezés</GreenHighlight> Jóllét-bónuszt kapja."
arSA = "تُربط الجذوع معًا لتشكيل طوف صغير، يكفي بالكاد لحمل {CP_TriggerCharacterName} في اتجاه مجرى النهر.\nتراقب المستعمرة في صمت التيار وهو يحملهم بعيدًا. إنها وداعٌ بسيط، لكنه يمنح القنادس قدرًا من الطمأنينة.\n[[C]][[+]]يكتسب جميع القنادس مكافأة الرفاهية <GreenHighlight>+الذكرى</GreenHighlight> لفترة من الوقت."

["LV.BCEv.FirstDeath.O2"]
raw = "The planks are shaped into a small cemetery marker for {CP_TriggerCharacterName}.\nIt is not much, but it gives the colony a place to pause, remember, and honor those who came before them.\n[[C]][[+]]All beavers permanently gain the <GreenHighlight>+Remembrance</GreenHighlight> Wellbeing bonus."
status = "normal"
enUS = "The planks are shaped into a small cemetery marker for {CP_TriggerCharacterName}.  \nIt is not much, but it gives the colony a place to pause, remember, and honor those who came before them.  \n[[C]][[+]]All beavers permanently gain the <GreenHighlight>+Remembrance</GreenHighlight> Wellbeing bonus."
zhCN = "“这些木板被制成了一个小墓碑，纪念 {CP_TriggerCharacterName}。\n虽然不算多，但它为殖民地提供了一个停下来、回忆和尊敬先辈的地方。\n[[C]][[+]]所有海狸永久获得 <GreenHighlight>+怀念</GreenHighlight> 幸福加成。”"
zhTW = "木板被塑造成一個小墓碑，紀念{CP_TriggerCharacterName}。\n這不算多，但給了殖民地一個暫停、回憶和尊敬先前者的地方。\n[[C]][[+]]所有海狸永久獲得<GreenHighlight>+紀念</GreenHighlight>的幸福加成。"
ruRU = "Доски сформированы в небольшой памятник на кладбище для {CP_TriggerCharacterName}. Это немного, но это дает колонии место, чтобы остановиться, вспомнить и почтить тех, кто был до них. [[C]][[+]]Все бобры постоянно получают бонус к <GreenHighlight>+Памяти</GreenHighlight> к благополучию."
jaJP = "板は{CP_TriggerCharacterName}のための小さな墓標の形に整えられています。  \nそれほど大したものではありませんが、コロニーにとっては立ち止まり、思い出し、先人を称える場所となります。  \n[[C]][[+]]全てのビーバーは永久に<GreenHighlight>+追悼</GreenHighlight>のウェルビーイングボーナスを得ます。"
frFR = "Les planches sont façonnées en un petit marqueur de cimetière pour {CP_TriggerCharacterName}.  \nCe n'est pas grand-chose, mais cela donne à la colonie un endroit pour faire une pause, se souvenir et honorer ceux qui les ont précédés.  \n[[C]][[+]]Tous les castors gagnent de manière permanente le bonus de bien-être <GreenHighlight>+Souvenir</GreenHighlight>."
deDE = "Die Planken werden zu einem kleinen Grabstein für {CP_TriggerCharacterName} geformt.  \nEs ist nicht viel, aber es gibt der Kolonie einen Ort, um innezuhalten, sich zu erinnern und diejenigen zu ehren, die vor ihnen kamen.  \n[[C]][[+]]Alle Biber erhalten dauerhaft den <GreenHighlight>+Erinnerung</GreenHighlight> Wohlfühlbonus."
plPL = "Deski są uformowane w mały nagrobek dla {CP_TriggerCharacterName}.  \nTo niewiele, ale daje kolonii miejsce na zatrzymanie się, przypomnienie i uhonorowanie tych, którzy byli przed nimi.  \n[[C]][[+]]Wszystkie bobry na stałe zyskują <GreenHighlight>+Pamięć</GreenHighlight> bonus do samopoczucia."
ptBR = "As tábuas são moldadas em um pequeno marcador de cemitério para {CP_TriggerCharacterName}.  \nNão é muito, mas dá à colônia um lugar para parar, lembrar e honrar aqueles que vieram antes deles.  \n[[C]][[+]]Todos os castores ganham permanentemente o bônus de Bem-Estar <GreenHighlight>+Recordação</GreenHighlight>."
koKR = "널빤지는 {CP_TriggerCharacterName}를 위한 작은 묘비로 모양이 새겨져 있다.  \n크지는 않지만, 식민지에 잠시 멈추고 기억하며 그들보다 먼저 온 이들을 기억할 수 있는 장소를 제공한다.  \n[[C]][[+]]모든 비버는 <GreenHighlight>+기억</GreenHighlight> 웰빙 보너스를 영구적으로 얻는다."
trTR = "Kütükler, {CP_TriggerCharacterName} için küçük bir mezar işareti şeklinde şekillendirilmiştir.  \nBu pek bir şey değil, ama koloninin durup, hatırlayıp, onlardan önce gelenleri onurlandırabileceği bir yer sağlar.  \n[[C]][[+]]Tüm kunduzlar kalıcı olarak <GreenHighlight>+Anma</GreenHighlight> Refah bonusunu kazanır."
esES = "Con las tablas se talla un pequeño marcador de cementerio para {CP_TriggerCharacterName}.\nNo es mucho, pero le da a la colonia un lugar para detenerse, recordar y honrar a quienes llegaron antes que ellos.\n[[C]][[+]]Todos los castores obtienen permanentemente la bonificación de bienestar <GreenHighlight>+Remembrance</GreenHighlight>."
itIT = "Le assi vengono sagomate in una piccola lapide commemorativa per {CP_TriggerCharacterName}.\nNon è molto, ma offre alla colonia un luogo dove fermarsi, ricordare e onorare chi è venuto prima di loro.\n[[C]][[+]]Tutti i castori ottengono permanentemente il bonus di benessere <GreenHighlight>+Commemorazione</GreenHighlight>."
ukUA = "З дощок вирізано невеликий надгробний знак для {CP_TriggerCharacterName}.\nЦе небагато, але колонія отримує місце, щоб зупинитися, згадати й вшанувати тих, хто жив до них.\n[[C]][[+]]Усі бобри постійно отримують бонус добробуту <GreenHighlight>+Пам'ять</GreenHighlight>."
thTH = "ไม้กระดานถูกขึ้นรูปเป็นป้ายหลุมศพขนาดเล็กสำหรับ {CP_TriggerCharacterName}\nมันอาจไม่มากนัก แต่ก็ทำให้อาณานิคมมีที่สำหรับหยุดพัก รำลึก และเคารพผู้ที่มาก่อนหน้าพวกเขา\n[[C]][[+]]บีเวอร์ทุกตัวจะได้รับโบนัสความเป็นอยู่ <GreenHighlight>+การรำลึก</GreenHighlight> อย่างถาวร"
csCZ = "Prkna jsou tvarována do malého hrobového znamení pro {CP_TriggerCharacterName}. Není to mnoho, ale dává kolonii místo k zastavení, vzpomínce a uctění těch, kteří přišli před nimi. [[C]][[+]]Všichni bobři trvale získávají bonus k pohodě <GreenHighlight>+Vzpomínka</GreenHighlight>."
viVN = "Các tấm ván được chế tạo thành một bia mộ nhỏ cho {CP_TriggerCharacterName}.\nKhông nhiều lắm, nhưng nó mang lại cho thuộc địa một nơi để dừng lại, nhớ về, và tôn vinh những người đã đến trước họ.\n[[C]][[+]]Tất cả các con rái cá đều được nhận một phần thưởng <GreenHighlight>+Nhớ về</GreenHighlight> cảm giác thoải mái vĩnh viễn."
caES = "La fusta s'ha donat forma de petita làpida per a {CP_TriggerCharacterName}.\nNo és gran cosa, però dona a la colònia un lloc on aturar-se, recordar i honorar els que els van precedir.\n[[C]][[+]]Tots els castors guanyen permanentment la millora de benestar <GreenHighlight>+Record</GreenHighlight>."
beBY = "Дошкі пераўтвораны ў невялікі могільны знак для {CP_TriggerCharacterName}.\nГэта мала, але калонія атрымлівае месца, дзе можна спыніцца, успомніць і ўшанаваць тых, хто жыў да іх.\n[[C]][[+]]Усе бабры назаўсёды атрымліваюць бонус дабрабыту <GreenHighlight>+Памяць</GreenHighlight>."
roRO = "Scândurile sunt modelate într-un mic semn funerar pentru {CP_TriggerCharacterName}.\nNu este mult, dar oferă coloniei un loc în care să facă o pauză, să își amintească și să cinstească pe cei care au venit înaintea lor.\n[[C]][[+]]Toți castorii câștigă permanent bonusul de bunăstare <GreenHighlight>+Comemorare</GreenHighlight>."
huHU = "Deszkákból kis sírjelet faragnak {CP_TriggerCharacterName} számára.\nNem sok, de a kolóniának egy helyet ad, ahol megpihenhet, emlékezhet, és tiszteleghet azok előtt, akik előttük jártak.\n[[C]][[+]]Minden hód állandóan megkapja a <GreenHighlight>+Emlékezés</GreenHighlight> Jóllét-bónuszt."
arSA = "نُحتت الألواح الخشبية لتصبح علامة قبر صغيرة لـ{CP_TriggerCharacterName}.\nليست بالشيء الكثير، لكنها تمنح المستعمرة مكانًا للتوقف والتذكّر وتكريم من سبقوهم.\n[[C]][[+]]يكتسب جميع القنادس بشكل دائم مكافأة الرفاهية <GreenHighlight>+التذكّر</GreenHighlight>."

["LV.BCEv.FirstDeath.O3"]
raw = "No farewell is given for {CP_TriggerCharacterName}. No marker is built. The colony simply returns to work.\nSome beavers try not to think about it, but the silence settles heavily over the settlement. To them, it feels as if {CP_TriggerCharacterName} was simply ignored.\n[[C]][[-]]All beavers suffer Heavy Hearts effect for {F5}d."
status = "normal"
enUS = "No farewell is given for {CP_TriggerCharacterName}. No marker is built. The colony simply returns to work. Some beavers try not to think about it, but the silence settles heavily over the settlement. To them, it feels as if {CP_TriggerCharacterName} was simply ignored. [[C]][[-]]All beavers suffer Heavy Hearts effect for {F5}d."
zhCN = "没有人向{CP_TriggerCharacterName}告别，也没有建立标志。殖民地只是继续工作。  \n一些海狸试图不去想它，但沉默在定居点上沉重地降临。对他们来说，感觉就像{CP_TriggerCharacterName}被简单地忽视了。  \n[[C]][[-]]所有海狸在{F5}天内受到沉重心灵的影响。"
zhTW = "「{CP_TriggerCharacterName} 沒有得到告別，沒有建立紀念碑，殖民地只是繼續工作。有些海狸儘量不去想它，但沉重的寂靜籠罩著這個定居點。在他們看來，{CP_TriggerCharacterName} 就像是被忽視了一樣。\n[[C]][[-]]所有海狸受到沉重的心情影響，持續 {F5} 天。」"
ruRU = "Никто не прощается с {CP_TriggerCharacterName}. Не возводится ни маркер. Колония просто продолжает работу. Некоторые бобры стараются не думать об этом, но тишина тяжело ложится на поселение. Им кажется, что {CP_TriggerCharacterName} просто проигнорировали. [[C]][[-]]Все бобры испытывают эффект Тяжелое Сердце в течение {F5}д."
jaJP = "{CP_TriggerCharacterName}には別れの言葉がなく、目印も建てられない。コロニーはただ仕事に戻る。\n何匹かのビーバーはそれについて考えないようにしようとするが、静けさが集落に重くのしかかっている。彼らにとっては、{CP_TriggerCharacterName}が単に無視されたように感じられる。\n[[C]][[-]]すべてのビーバーは{F5}日間「重い心」の効果を受ける。"
frFR = "Aucun adieu n'est donné à {CP_TriggerCharacterName}. Aucun marqueur n'est construit. La colonie reprend simplement son travail.  \nCertains castors essaient de ne pas y penser, mais le silence pèse lourdement sur la colonie. Pour eux, cela donne l'impression que {CP_TriggerCharacterName} a simplement été ignoré.  \n[[C]][[-]]Tous les castors subissent l'effet Cœurs Lourd pendant {F5}j."
deDE = "Es gibt keinen Abschied für {CP_TriggerCharacterName}. Es wird kein Marker gebaut. Die Kolonie kehrt einfach zur Arbeit zurück. Einige Biber versuchen, nicht darüber nachzudenken, aber die Stille legt sich schwer über die Siedlung. Für sie fühlt es sich an, als würde {CP_TriggerCharacterName} einfach ignoriert. [[C]][[-]]Alle Biber leiden unter dem Effekt der schweren Herzen für {F5} Tage."
plPL = "Nie ma pożegnania dla {CP_TriggerCharacterName}. Nie zostaje zbudowany żaden znacznik. Kolonia po prostu wraca do pracy.\nNiektóre bobry starają się o tym nie myśleć, ale cisza ciężko kładzie się na osadzie. Dla nich wydaje się, że {CP_TriggerCharacterName} po prostu został zignorowany.\n[[C]][[-]]Wszystkie bobry cierpią na efekt Ciężkiego Serca przez {F5}d."
ptBR = "Nenhuma despedida é dada para {CP_TriggerCharacterName}. Nenhum marcador é construído. A colônia simplesmente retorna ao trabalho.  \nAlguns castores tentam não pensar nisso, mas o silêncio recai pesadamente sobre o assentamento. Para eles, parece que {CP_TriggerCharacterName} foi simplesmente ignorado.  \n[[C]][[-]]Todos os castores sofrem o efeito Corações Pesados por {F5}d."
koKR = "{CP_TriggerCharacterName}에 대한 이별 인사는 없다. 기념비도 세워지지 않는다. 식민지는 단순히 일을 재개한다.  \n일부 비버들은 그것에 대해 생각하지 않으려 하지만, 침묵이 정착지 위에 무겁게 드리워진다. 그들에겐 {CP_TriggerCharacterName}이 단순히 무시된 것처럼 느껴진다.  \n[[C]][[-]]모든 비버는 {F5}일 동안 무거운 마음 효과를 겪는다."
trTR = "{CP_TriggerCharacterName} için veda edilmez. Hiçbir işaret yapılmaz. Koloni sadece işe geri döner.  \nBazı kunduzlar bunu düşünmemeye çalışsalar da, sessizlik yerleşim üzerindeki ağır bir yük gibi çöker. Onlara göre, {CP_TriggerCharacterName} sadece göz ardı edilmiş gibi hissediliyor.  \n[[C]][[-]]Tüm kunduzlar {F5} gün boyunca Ağırca Kalp etkisi yaşar."
esES = "No hay despedida para {CP_TriggerCharacterName}. No se construye ningún marcador. La colonia simplemente vuelve al trabajo.\nAlgunos castores intentan no pensar en ello, pero el silencio pesa mucho sobre el asentamiento. Para ellos, es como si {CP_TriggerCharacterName} hubiera sido simplemente ignorado.\n[[C]][[-]]Todos los castores sufren el efecto Corazón Pesado durante {F5}d."
itIT = "No saluto viene dato a {CP_TriggerCharacterName}. Nessun segnaposto viene costruito. La colonia semplicemente torna al lavoro.\nAlcuni castori cercano di non pensarci, ma il silenzio grava pesantemente sull'insediamento. Per loro, sembra che {CP_TriggerCharacterName} sia stato semplicemente ignorato.\n[[C]][[-]]Tutti i castori subiscono l'effetto Cuori Pesanti per {F5}d."
ukUA = "Прощання для {CP_TriggerCharacterName} не звучить. Жодного маркера не споруджують. Колонія просто повертається до роботи.\nДеякі бобри намагаються не думати про це, але тиша важко лягає на поселення. Їм здається,ніби {CP_TriggerCharacterName} просто проігнорували.\nУсі бобри отримують ефект Важких сердець на {F5}д."
thTH = "ไม่มีการกล่าวอำลาให้แก่ {CP_TriggerCharacterName} ไม่มีการสร้างป้ายรำลึกใด ๆ อาณานิคมกลับไปทำงานตามปกติ\nบีเวอร์บางตัวพยายามไม่คิดถึงเรื่องนี้ แต่ความเงียบงันปกคลุมนิคมอย่างหนักอึ้ง สำหรับพวกมันรู้สึกเหมือนว่า {CP_TriggerCharacterName} ถูกมองข้ามไปเฉย ๆ\n[[C]][[-]]บีเวอร์ทุกตัวได้รับผล Heavy Hearts เป็นเวลา {F5} วัน"
csCZ = "Žádné rozloučení se {CP_TriggerCharacterName} nekoná. Nebylo postaveno žádné označení. Kolonie se prostě vrací k práci. \nNěkteří bobři se snaží na to nemyslet, ale ticho těžce spočine nad osadou. Připadá jim, jako by si {CP_TriggerCharacterName} nikdo ani nevšiml. \n[[C]][[-]]Všechny bobry postihuje efekt Těžká srdce na {F5}d."
viVN = "Không có lời tạm biệt nào cho {CP_TriggerCharacterName}. Không có dấu hiệu nào được xây dựng. Khu định cư chỉ đơn giản là trở lại công việc. \nMột số con rái cá cố gắng không nghĩ về điều đó, nhưng sự im lặng đè nặng lên khu định cư. Đối với họ, cảm giác như {CP_TriggerCharacterName} chỉ bị lãng quên. \n[[C]][[-]]Tất cả các con rái cá đều chịu tác động của Trái Tim Nặng Trĩu trong {F5} ngày."
caES = "No s'ofereix cap comiat per a {CP_TriggerCharacterName}. No es construeix cap marcador. La colònia simplement torna al treball.\nAlguns castors intenten no pensar-hi, però el silenci es instal·la pesadament sobre l'assentament. Per a ells, sembla com si {CP_TriggerCharacterName} hagués estat simplement ignorat.\nTots els castors pateixen l'efecte Cors Pesats durant {F5} dies."
beBY = "Развітання з {CP_TriggerCharacterName} не адбываецца. Маркер не ставіцца. Калонія проста вяртаецца да працы.\nНекаторыя бабры стараюцца не думаць пра гэта, але цішыня цяжка асядае над пасяленнем. Для іх падаецца, быццам {CP_TriggerCharacterName} проста праігналі.\n[[C]][[-]]Усе бабры адчуваюць эфект Цяжкага сэрца на працягу {F5}д."
roRO = "Nu se oferă niciun rămas-bun pentru {CP_TriggerCharacterName}. Nu se construiește niciun marker. Colonia pur și simplu revine la muncă.\nUnii castori încearcă să nu se gândească la asta, dar tăcerea se așază greu peste așezare. Pentru ei, pare că {CP_TriggerCharacterName} a fost pur și simplu ignorat.\n[[C]][[-]]Toți castorii suferă efectul Inimi Grele timp de {F5}d."
huHU = "Nem búcsúztunk el {CP_TriggerCharacterName} től. Nem épült emlékjel. A kolónia egyszerűen visszatér a munkához.\nNéhány hód igyekszik nem gondolni rá, de a csend nehezen ülepedik le a település felett. Számukra úgy tűnik, mintha {CP_TriggerCharacterName} figyelmen kívül lett volna hagyva.\n[[C]][[-]]Minden hód {F5} napig a Nehéz szívek hatását szenvedi el."
arSA = "لا يُقام أي وداع لـ{CP_TriggerCharacterName}. لا يُبنى أي نصب تذكاري. تعود المستعمرة ببساطة إلى العمل.\nيحاول بعض القنادس ألا يفكروا في الأمر، لكن الصمت يخيّم بثقل على الاستيطان. بالنسبة إليهم، يبدو وكأن {CP_TriggerCharacterName} قد أُهمل ببساطة.\nيعاني جميع القنادس تأثير القلب المثقل لمدة {F5} يومًا."

["LV.BCEv.FirstDeath.O4"]
raw = "The colony returns to work.\nThere is sadness, but also understanding. Food must be gathered, water must be stored, and the settlement must survive. For now, the beavers carry the loss quietly and move on."
status = "normal"
enUS = "The colony returns to work. There is sadness, but also understanding. Food must be gathered, water must be stored, and the settlement must survive. For now, the beavers carry the loss quietly and move on."
zhCN = "“殖民地恢复了工作。\n有悲伤，也有理解。食物必须被收集，水必须被储存，定居点必须生存。现在，海狸们默默承受着损失，继续前行。”"
zhTW = "殖民地重新開始工作。\n雖然有悲傷，但也有理解。必須收集食物，儲存水源，社區必須生存下去。目前，海狸們默默承受著損失，繼續前行。"
ruRU = "Колония возвращается к работе. Есть грусть, но также и понимание. Еду нужно собрать, воду нужно запастись, и поселение должно выжить. Пока что бобры тихо переносят утрату и двигаются дальше."
jaJP = "コロニーは仕事に戻る。悲しみもあるが、理解もある。食料は集めなければならず、水は貯めなければならず、集落は生き延びなければならない。今のところ、ビーバーたちは静かに喪失を抱え、前に進む。"
frFR = "La colonie reprend le travail. Il y a de la tristesse, mais aussi de la compréhension. La nourriture doit être rassemblée, l'eau doit être stockée et la colonie doit survivre. Pour l'instant, les castors portent la perte en silence et avancent."
deDE = "Die Kolonie kehrt zur Arbeit zurück. Es gibt Traurigkeit, aber auch Verständnis. Nahrung muss gesammelt, Wasser muss gespeichert werden, und die Siedlung muss überleben. Für den Moment tragen die Biber den Verlust still und machen weiter."
plPL = "Kolonia wraca do pracy. Jest smutek, ale także zrozumienie. Jedzenie musi być zbierane, woda musi być przechowywana, a osada musi przetrwać. Na razie bobry cicho niosą stratę i idą dalej."
ptBR = "A colônia volta ao trabalho. Há tristeza, mas também compreensão. A comida deve ser coletada, a água deve ser armazenada e a colônia deve sobreviver. Por enquanto, os castores carregam a perda em silêncio e seguem em frente."
koKR = "식민지는 일로 돌아갑니다. 슬픔이 있지만 이해 또한 있습니다. 식량을 모아야 하고, 물을 저장해야 하며, 정착지가 생존해야 합니다. 지금은 비버들이 조용히 상실감을 안고 나아갑니다."
trTR = "Koloniyi geri dönüyor. Üzüntü var, ama aynı zamanda anlayış da. Yemek toplanmalı, su depolanmalı ve yerleşim hayatta kalmalı. Şimdilik, kunduzlar kaybı sessizce taşıyor ve yoluna devam ediyor."
esES = "La colonia vuelve al trabajo.\nHay tristeza, pero también comprensión. Hay que recolectar comida, almacenar agua y lograr que el asentamiento sobreviva. Por ahora, los castores soportan la pérdida en silencio y siguen adelante."
itIT = "La colonia torna al lavoro.\nC'è tristezza, ma anche comprensione. Il cibo deve essere raccolto, l'acqua deve essere immagazzinata e l'insediamento deve sopravvivere. Per ora, i castori portano il lutto in silenzio e vanno avanti."
ukUA = "Колонія повертається до роботи.\nЄ смуток, але є й розуміння. Їжу треба збирати, воду — зберігати, а поселення — вижити. Поки що бобри тихо переживають втрату і рухаються далі."
thTH = "อาณานิคมกลับไปทำงานอีกครั้ง\nมีความเศร้าโศก แต่ก็มีความเข้าใจด้วย อาหารต้องถูกเก็บเกี่ยว น้ำต้องถูกกักเก็บ และนิคมต้องอยู่รอด ตอนนี้ บีเวอร์ต่างแบกรับการสูญเสียนั้นอย่างเงียบ ๆ และก้าวต่อไป"
csCZ = "Kolonie se vrací k práci. Je tu smutek, ale také pochopení. Jídlo je třeba nasbírat, voda je třeba uskladnit a osada musí přežít. Prozatím bobři tiše nesou ztrátu a pokračují dál."
viVN = "Colony trở lại làm việc. Có sự buồn bã, nhưng cũng có sự hiểu biết. Thức ăn phải được thu hoạch, nước phải được tích trữ, và khu định cư phải tồn tại. Hiện tại, những con hải ly chịu đựng nỗi mất mát một cách âm thầm và tiếp tục tiến về phía trước."
caES = "La colònia torna al treball.\nHi ha tristesa, però també comprensió. Cal recollir menjar, cal emmagatzemar aigua i el poblat ha de sobreviure. De moment, els castors porten la pèrdua en silenci i segueixen endavant."
beBY = "Калонія вяртаецца да працы.\nЁсць смутак, але ёсць і разуменне. Ежу трэба здабыць, ваду трэба захаваць, і паселішча павінна выжыць. Пакуль што бабры моўчкі нясуць страту і рухаюцца далей."
roRO = "Colonia revine la muncă.\nExistă tristețe, dar și înțelegere. Hrana trebuie strânsă, apa trebuie depozitată, iar așezarea trebuie să supraviețuiască. Deocamdată, castorii duc pierderea în tăcere și merg mai departe."
huHU = "A kolónia visszatér a munkához.\nVan szomorúság, de van megértés is. Élelmet kell gyűjteni, vizet kell tárolni, és a telepnek túl kell élnie. Egyelőre a hódok csendben viselik a veszteséget, és továbbmennek."
arSA = "ترجعُ المستعمرةُ إلى العمل.\nهناك حزنٌ، لكن أيضًا تفهّمٌ. يجب جمعُ الطعام، وتخزينُ الماء، وأن تنجو المستوطنةُ. أما الآن، فيحملُ القنادسُ الخسارةَ بصمت ويمضون قدمًا."

