ukUA = "Несподівано для всіх, ваша відмова обирати сторону спрацьовує. Обидві групи ще трохи сперечаються, а потім починають сміятися з того, наскільки безглуздою стала ця суперечка.\nОбидві повертаються до роботи, рішуче налаштовані довести свою цінність, не розриваючи колонію на шматки.\n[[C]][[+]]Працівники Лісорубних прапорів отримують +{%3} до швидкості роботи на [[time:{F1}d]]\n[[C]][[+]]Працівники Фермерських будинків отримують +{%3} до швидкості роботи на [[time:{F1}d]]"
thTH = "To everyone's surprise, your refusal to choose sides works. The two groups argue a little longer, then begin laughing at how foolish the quarrel has become.\nBoth return to work determined to prove their worth without tearing the colony apart.\n[[C]][[+]]Lumberjack Flags' workers gain +{%3} Working Speed for [[time:{F1}d]]\n[[C]][[+]]Farmhouses' workers gain +{%3} Working Speed for [[time:{F1}d]]"
csCZ = "K překvapení všech váš odmítání zaujmout stranu funguje. Obě skupiny se chvíli dál hádají, pak začnou smát tomu, jak hloupý se jejich spor stal.  \nObě se vrátí k práci s odhodláním dokázat svou hodnotu, aniž by roztrhly kolonii.  \n[[C]][[+]]Dělníci ve Dřevorolích získávají +{%3} Rychlost práce na [[time:{F1}d]]  \n[[C]][[+]]Dělníci na Farmách získávají +{%3} Rychlost práce na [[time:{F1}d]]"
