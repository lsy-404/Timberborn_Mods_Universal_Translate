esES = "Tu apoyo reiterado deja claro dónde se sitúa la dirección de la colonia. Los trabajadores favorecidos se llenan de orgullo y energía, mientras que los demás pierden el ánimo por completo.\n[[C]][[+]]{S5} trabajadores ganan +{%2} de Velocidad de trabajo durante [[time:{F1}d]]\n[[C]][[-]]{S6} trabajadores pierden {%3} de Velocidad de trabajo durante [[time:{F1}d]]"
