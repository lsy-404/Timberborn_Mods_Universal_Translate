["LV.BCEv.ContaminationCure.Content"]
raw = "{CP_TriggerCharacterName} has been contaminated, lying still with damp fur, dull eyes, and a tail too weak to slap the ground. Most of the colony keeps a careful distance.\nThen a self-declared doctor steps forward with stained notes and a theory called Pasteur's Gamble. The treatment is untested. Water may flush the poison. Sunflowers may strengthen the body. More careful aid may improve the odds, though no one can say what failure might bring."
status = "normal"
enUS = "{CP_TriggerCharacterName} has been contaminated, lying still with damp fur, dull eyes, and a tail too weak to slap the ground. Most of the colony keeps a careful distance. Then a self-declared doctor steps forward with stained notes and a theory called Pasteur's Gamble. The treatment is untested. Water may flush the poison. Sunflowers may strengthen the body. More careful aid may improve the odds, though no one can say what failure might bring."
zhCN = "{CP_TriggerCharacterName} 已被污染，静静地躺着，湿漉漉的毛发，暗淡的眼睛，尾巴无力地打地。大部分居民都保持着小心的距离。随后，一位自称医生的人走上前，手里拿着沾污的笔记和一个名为巴斯德的冒险的理论。治疗尚未经过测试。水可能冲洗掉毒素。向日葵可能增强身体。更小心的帮助可能会提高成功的几率，尽管没有人能说出失败会带来什么后果。"
zhTW = "{CP_TriggerCharacterName} 已被污染，靜靜躺著，濕漉漉的毛發，微弱的眼神，尾巴無力地無法拍打地面。大多數同伴都保持著小心的距離。\n然後一位自稱的醫生走上前，手中拿著污跡斑斑的筆記和名為巴斯德的賭注理論。這種療法尚未經過測試。水可能會沖刷毒素。向日葵可能會強化身體。更謹慎的援助可能會提高成功的機率，雖然沒有人能確定失敗會帶來什麼後果。"
ruRU = "{CP_TriggerCharacterName} был заражен, лежит неподвижно с влажной шерстью, тусклыми глазами и хвостом слишком слабым, чтобы ударять о землю. Большая часть колонии держится на осторожном расстоянии. \nТогда шаг вперед делает самопровозглашенный доктор с испачканными заметками и теорией, называемой «Грехом Пастера». Лечение не протестировано. Вода может смыть яд. Подсолнухи могут укрепить тело. Более тщательная помощь может улучшить шансы, хотя никто не может сказать, что принесет провал."
jaJP = "{CP_TriggerCharacterName}は汚染されており、湿った毛皮、鈍い目、地面を叩くには弱すぎる尾を引きずって静かに横たわっています。コロニーのほとんどは慎重に距離を保っています。\nそこに自己宣言した医者が汚れたメモを持って前に出て、「パスツールの賭け」と呼ばれる理論を提唱します。治療は未検証です。水が毒を洗い流すかもしれません。ひまわりが体を強化するかもしれません。より慎重な援助が成功の可能性を高めるかもしれませんが、失敗が何をもたらすかは誰にも分かりません。"
frFR = "{CP_TriggerCharacterName} a été contaminé, gisant immobile avec un pelage humide, des yeux ternes et une queue trop faible pour frapper le sol. La plupart de la colonie garde une distance prudente. \nPuis un médecin autoproclamé s'avance avec des notes tachées et une théorie appelée le Pari de Pasteur. Le traitement n'a pas été testé. L'eau pourrait éliminer le poison. Les tournesols pourraient renforcer le corps. Une aide plus consciente pourrait améliorer les chances, bien que personne ne puisse dire ce que l'échec pourrait entraîner."
deDE = "{CP_TriggerCharacterName} wurde kontaminiert, liegt still mit nassem Fell, mattäugig und einem Schwanz, der zu schwach ist, um den Boden zu schlagen. Der Großteil der Kolonie hält einen vorsichtigen Abstand. Dann tritt ein selbsternannter Doktor mit befleckten Notizen und einer Theorie namens Pasteurs Gamble vor. Die Behandlung ist ungetestet. Wasser könnte das Gift ausspülen. Sonnenblumen könnten den Körper stärken. Sorgfältigere Hilfe könnte die Chancen verbessern, obwohl niemand sagen kann, was ein Scheitern mit sich bringen könnte."
plPL = "{CP_TriggerCharacterName} został skażony, leżąc bez ruchu z wilgotnym futrem, matowymi oczami i ogonem zbyt słabym, by uderzyć w ziemię. Większość kolonii trzyma się z daleka. \nWtedy krok do przodu stawia samozwańczy lekarz z poplamionymi notatkami i teorią zwaną Zakładem Pasteura. Leczenie jest nieprzetestowane. Woda może przepłukać truciznę. Słoneczniki mogą wzmocnić ciało. Bardziej staranna pomoc może poprawić szanse, choć nikt nie może powiedzieć, co może przynieść porażka."
ptBR = "{CP_TriggerCharacterName} foi contaminado, deitado imóvel com a pelagem úmida, olhos opacos e uma cauda fraca demais para bater no chão. A maior parte da colônia mantém uma distância cuidadosa. Então, um autoproclamado doutor avança com anotações manchadas e uma teoria chamada A Aposta de Pasteur. O tratamento não foi testado. Água pode eliminar o veneno. Girassóis podem fortalecer o corpo. Um auxílio mais cuidadoso pode melhorar as chances, embora ninguém possa afirmar o que o fracasso pode trazer."
koKR = "{CP_TriggerCharacterName}가 오염되어 눕고, 축축한 털과 흐릿한 눈, 땅을 쳐낼 힘이 없는 약한 꼬리를 가진 채로 누워 있습니다. 대부분의 식민지는 조심스럽게 거리를 두고 있습니다.  \n그때, 자칭 의사 한 명이 얼룩진 노트와 파스퇴르의 도박이라는 이론을 들고 앞으로 나섭니다. 치료법은 테스트되지 않았습니다. 물이 독소를 씻어낼 수 있습니다. 해바라기가 몸을 강화할 수 있습니다. 더 신중한 도움이 성공 확률을 높일 수 있지만, 실패가 가져올 결과는 아무도 알 수 없습니다."
trTR = "{CP_TriggerCharacterName} kontamine oldu, ıslak tüyleri, donuk gözleri ve yere vuracak kadar zayıf bir kuyruğuyla hareketsiz yatıyor. Koloni üyelerinin çoğu dikkatli bir mesafeyi koruyor.   \nSonra lekeli notlarla ve Pasteur'un İhtiyacı adlı bir teoriyle kendini doktor ilan eden biri öne çıkıyor. Tedavi henüz test edilmedi. Su zehiri temizleyebilir. Ayçiçekleri vücudu güçlendirebilir. Daha dikkatli bir yardım şansları artırabilir, ancak kimse başarısızlığın ne getireceğini söyleyemez."
esES = "{CP_TriggerCharacterName} ha sido contaminado; yace inmóvil, con el pelaje húmedo, los ojos apagados y una cola demasiado débil para golpear el suelo. La mayor parte de la colonia mantiene una distancia prudente.\nEntonces, un médico autoproclamado da un paso al frente con notas manchadas y una teoría llamada la Apuesta de Pasteur. El tratamiento no ha sido probado. El agua podría arrastrar el veneno. Los girasoles podrían fortalecer el cuerpo. Una ayuda más cuidadosa podría mejorar las probabilidades, aunque nadie sabe qué podría traer el fracaso."
itIT = "{CP_TriggerCharacterName} è stato contaminato: giace immobile con il pelo umido, gli occhi spenti e una coda troppo debole per battere a terra. Gran parte della colonia mantiene una prudente distanza.\nPoi un medico autoproclamato si fa avanti con appunti macchiati e una teoria chiamata Scommessa di Pasteur. La cura non è stata testata. L'acqua potrebbe far defluire il veleno. I girasoli potrebbero rafforzare il corpo. Un aiuto più accurato potrebbe migliorare le probabilità, anche se nessuno sa dire cosa potrebbe portare un fallimento."
ukUA = "{CP_TriggerCharacterName} заражений: лежить нерухомо з мокрою шерстю, тьмяними очима і хвостом, занадто слабким, щоб ударити по землі. Більшість колонії тримається на обережній відстані.\nТоді вперед виходить лікар, який сам себе так назвав, зі забрудненими записками та теорією під назвою «Ставка Пастера». Лікування не перевірене. Вода, можливо, змиє отруту. Соняшники, можливо, зміцнять організм. Більш обережна допомога може покращити шанси, хоча ніхто не може сказати, до чого може призвести невдача."
thTH = "{CP_TriggerCharacterName} ปนเปื้อนแล้ว นอนนิ่งอยู่ด้วยขนที่ชื้นแฉะ ดวงตาหมองหม่น และหางอ่อนแรงจนตบพื้นไม่ไหว ส่วนใหญ่ของอาณานิคมจึงรักษาระยะห่างอย่างระมัดระวัง\nจากนั้นหมอที่ประกาศตัวเองคนหนึ่งก้าวออกมาพร้อมโน้ตเปื้อนคราบและทฤษฎีที่เรียกว่า \"การพนันของปาสเตอร์\" วิธีรักษานี้ยังไม่ได้ผ่านการทดสอบ น้ำอาจชะล้างพิษออกไปได้ ดอกทานตะวันอาจช่วยให้ร่างกายแข็งแรงขึ้น การช่วยเหลือที่ระมัดระวังมากขึ้นอาจเพิ่มโอกาสดีขึ้น แต่ไม่มีใครบอกได้ว่าความล้มเหลวอาจนำมาซึ่งอะไร"
csCZ = "{CP_TriggerCharacterName} byl kontaminován, leží nehybně s vlhkým kožichem, mdlýma očima a ocasem příliš slabým na to, aby bouchal do země. Většina kolonie si udržuje opatrný odstup.  \nPak vystoupí sebezvaný doktor se znečištěnými poznámkami a teorií zvanou Pasteurův hazard. Léčba není testována. Voda může vyplavit jed. Slunečnice mohou posílit tělo. Pečlivější pomoc může zlepšit šance, i když nikdo nemůže říct, co by neúspěch mohl přinést."
viVN = "{CP_TriggerCharacterName} đã bị ô nhiễm, nằm bất động với bộ lông ướt, đôi mắt mờ đục, và cái đuôi quá yếu để quật xuống đất. Hầu hết thuộc địa giữ khoảng cách cẩn thận.  \nRồi một bác sĩ tự xưng bước lên với những ghi chú bị ố và một lý thuyết gọi là Cược của Pasteur. Phương pháp điều trị chưa được kiểm chứng. Nước có thể rửa trôi chất độc. Hoa hướng dương có thể củng cố cơ thể. Sự trợ giúp cẩn thận hơn có thể cải thiện khả năng, mặc dù không ai có thể nói điều gì sẽ xảy ra nếu thất bại."
caES = "{CP_TriggerCharacterName} ha estat contaminat, i jeu immòbil amb el pelatge humit, els ulls apagats i una cua massa feble per donar cops al terra. La majoria de la colònia es manté a una distància prudent.\nLlavors, un suposat metge s'avança amb notes tacades i una teoria anomenada l'Aposta de Pasteur. El tractament no ha estat provat. L'aigua potser neteja el verí. Els gira-soles potser enforteixen el cos. Una ajuda més acurada pot millorar les probabilitats, tot i que ningú no pot dir què podria portar un fracàs."
beBY = "{CP_TriggerCharacterName} заражаны: ляжыць нерухома, з вільготнай поўсцю, тухлымі вачыма, і хвост занадта слабы, каб ударыць па зямлі. Большасць калоніі трымаецца на бяспечнай адлегласці.\nТады ўперад выходзіць адзін «доктар» з запэцканымі запіскамі і тэорыяй пад назвай «Ставка Пастэра». Лячэнне не выпрабавана. Вада, магчыма, вымые атруту. Сланечнікі, магчыма, умацуюць арганізм. Больш уважная дапамога можа палепшыць шанцы, хоць ніхто не можа сказаць, што можа прынесці няўдача."
roRO = "{CP_TriggerCharacterName} a fost contaminat(ă), stând nemișcat(ă) cu blana umedă, ochii stinși și o coadă prea slăbită ca să mai lovească pământul. Cea mai mare parte a coloniei își păstrează o distanță prudentă.\nApoi, un „doctor” autoproclamat înaintează cu niște notițe pătate și cu o teorie numită Pariul lui Pasteur. Tratamentul nu a fost testat. Apa ar putea spăla otrava. Floarea-soarelui ar putea întări organismul. Un ajutor mai atent ar putea îmbunătăți șansele, deși nimeni nu poate spune ce ar putea aduce un eșec."
huHU = "{CP_TriggerCharacterName} megfertőződött: mozdulatlanul fekszik, nedves szőrrel, fakó szemekkel, a farka pedig túl gyenge ahhoz, hogy a földet csapkodja. A kolónia nagy része óvatosan távol tartja magát tőle.\nEkkor egy magát orvosnak nevező alak lép elő, foltos jegyzetekkel és egy „Pasteur-kockázat” nevű elmélettel. A kezelés nincs kipróbálva. Lehet, hogy a víz kimossa a mérget. Lehet, hogy a napraforgók erősítik a testet. További gondos segítség javíthatja az esélyeket, bár senki sem tudja megmondani, mit hozhat a kudarc."
arSA = "{CP_TriggerCharacterName} تلوّث، يرقد بلا حراك وفرْوه رطب، وعيناه باهتتان، وذيله أضعف من أن يضرب الأرض. معظم أفراد المستعمرة يحافظون على مسافة حذرة.\nثم يتقدّم طبيب ذاتيّ التعيين بأوراق ملطخة ونظرية تُسمّى «رهان باستور». العلاج غير مختبَر. قد يطرد الماء السم. وقد تقوّي عباد الشمس الجسم. وقد تحسّن المساعدة الحذرة الأكثر فرص النجاة، رغم أن أحدًا لا يستطيع القول ما قد يجلبه الفشل."

