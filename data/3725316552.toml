["LV.BCEv.FirstChildGrowth.O1"]
raw = "The feast is simple, but joyful. Food is shared, cups are raised, and {CP_TriggerAdultName} is welcomed into adulthood with cheers, jokes, and proud tail-slaps.\nFor a moment, the colony feels less like a settlement and more like a family.\n[[C]][[+]]All beavers gain +{%3} Working Speed for [[time:{F2}d]]"
status = "normal"
enUS = "The feast is simple, but joyful. Food is shared, cups are raised, and {CP_TriggerAdultName} is welcomed into adulthood with cheers, jokes, and proud tail-slaps. For a moment, the colony feels less like a settlement and more like a family. [[C]][[+]]All beavers gain +{%3} Working Speed for [[time:{F2}d]]"
zhCN = "“盛宴虽然简单，但充满喜悦。食物共享，杯子高举，{CP_TriggerAdultName}在欢呼、笑话和自豪的尾巴拍击中迎接成年。\n瞬间，殖民地的感觉不再像一个定居点，而更像一个大家庭。\n[[C]][[+]]所有海狸获得+{%3}工作速度，持续[[time:{F2}d]]”"
zhTW = "盛宴雖然簡單，但充滿喜悅。食物被分享，杯子被舉起，{CP_TriggerAdultName}在歡呼、玩笑和驕傲的尾巴拍打中迎進成年的行列。\n在這一刻，這個殖民地感覺不再是一個聚落，而更像是一個家庭。\n[[C]][[+]]所有的海狸在[[time:{F2}d]]內獲得+{%3}工作速度。"
ruRU = "Пиршество простое, но радостное. Еда делится,杯ы поднимаются, и {CP_TriggerAdultName} встречается во взрослую жизнь с овациями, шутками и гордыми хлопаниями хвостом. На мгновение колония ощущается не как поселение, а как семья. [[C]][[+]]Все бобры получают +{%3} Скорости Работы на [[time:{F2}д]]"
jaJP = "祭りはシンプルですが、喜びに満ちています。食べ物が分け合われ、杯が掲げられ、{CP_TriggerAdultName}が歓声、ジョーク、そして誇らしいしっぽの叩き合いで大人の仲間入りをします。\n一瞬、コロニーは集落というよりも家族のように感じられます。\n[[C]][[+]]すべてのビーバーは[[time:{F2}d]]の間、+{%3}の作業速度を得ます。"
frFR = "La fête est simple, mais joyeuse. La nourriture est partagée, les coupes sont levées, et {CP_TriggerAdultName} est accueilli dans l'âge adulte avec des acclamations, des blagues et des coups de queue fiers. \nPendant un instant, la colonie ressemble moins à un établissement et plus à une famille. \n[[C]][[+]]Tous les castors gagnent +{%3} Vitesse de Travail pour [[time:{F2}j]]"
deDE = "Das Fest ist einfach, aber fröhlich. Speisen werden geteilt, Becher erhoben und {CP_TriggerAdultName} wird mit Jubel, Witzen und stolzen Schwanzschlägen ins Erwachsenenleben willkommen geheißen. \nFür einen Moment fühlt sich die Kolonie weniger wie eine Siedlung und mehr wie eine Familie an. \n[[C]][[+]]Alle Biber gewinnen +{%3} Arbeitsgeschwindigkeit für [[time:{F2}d]]"
plPL = "Uczta jest prosta, ale radosna. Jedzenie jest dzielone, kubki są uniesione, a {CP_TriggerAdultName} jest witany w dorosłość okrzykami, żartami i dumnymi uderzeniami ogona. \nNa chwilę kolonia wydaje się być mniej osadą, a bardziej rodziną. \n[[C]][[+]]Wszystkie bobry zyskują +{%3} Prędkości Pracy przez [[czas:{F2}d]]"
ptBR = "A festa é simples, mas alegre. A comida é compartilhada, os copos são erguidos e {CP_TriggerAdultName} é recebido na vida adulta com aplausos, piadas e orgulhosas pancadas de cauda. Por um momento, a colônia se sente menos como um assentamento e mais como uma família. [[C]][[+]]Todos os castores ganham +{%3} de Velocidade de Trabalho por [[time:{F2}d]]"
koKR = "축제는 간단하지만 기쁩니다. 음식이 나누어지고, 잔이 들어올려지며, {CP_TriggerAdultName}가 환호, 농담, 그리고 자랑스러운 꼬리치는 소리와 함께 성인이 됩니다.\n잠시 동안, 식민지는 정착지보다 더 가족 같은 느낌을 줍니다.\n[[C]][[+]]모든 비버는 [[time:{F2}d]] 동안 +{%3} 작업 속도를 얻습니다."
trTR = "Şenlik basit ama neşeli. Yemekler paylaşılıyor, kadehler kaldırılıyor ve {CP_TriggerAdultName} yetişkinliğe alkışlar, şakalar ve gururlu kuyruk şaplaklarıyla karşılanıyor.  \nBir an için, koloni bir yerleşim yeri gibi değil, daha çok bir aile gibi hissediliyor.  \n[[C]][[+]]Tüm kunduzlar +{%3} Çalışma Hızı kazanıyor [[time:{F2}g]]"
esES = "The banquete es sencillo, pero alegre. La comida se comparte, las tazas se alzan y {CP_TriggerAdultName} es recibido en la adultez con vítores, bromas y palmadas orgullosas en la cola.\nPor un momento, la colonia se siente menos como un asentamiento y más como una familia.\n[[C]][[+]]Todos los castores ganan +{%3} de velocidad de trabajo durante [[time:{F2}d]]"
itIT = "The feast is simple, but joyful. Food is shared, cups are raised, and {CP_TriggerAdultName} is welcomed into adulthood with cheers, jokes, and proud tail-slaps.\nFor a moment, the colony feels less like a settlement and more like a family.\n[[C]][[+]]All beavers gain +{%3} Working Speed for [[time:{F2}d]]"
ukUA = "Свято просте, але радісне. Їжу ділять, келихи піднімають, а {CP_TriggerAdultName} вітають у дорослому віці оплесками, жартами та гордими ударами хвостами.\nНа мить колонія відчувається не як поселення, а радше як родина.\n[[C]][[+]]Усі бобри отримують +{%3} до швидкості роботи протягом [[time:{F2}d]]"
thTH = "การเฉลิมฉลองเรียบง่ายแต่เต็มไปด้วยความสุข ทุกคนแบ่งปันอาหาร ยกถ้วยขึ้น และ{CP_TriggerAdultName}ได้รับการต้อนรับสู่วัยผู้ใหญ่ด้วยเสียงเชียร์ เสียงหัวเราะ และการตบหางอย่างภาคภูมิใจ\nชั่วขณะหนึ่ง อาณานิคมดูเหมือนครอบครัวมากกว่าชุมชนที่ตั้งถิ่นฐาน\n[[C]][[+]]บีเวอร์ทุกตัวได้รับ +{%3} ความเร็วในการทำงานเป็นเวลา [[time:{F2}d]]"
csCZ = "Hostina je jednoduchá, ale radostná. Jídlo je sdíleno, poháry jsou zvedány a {CP_TriggerAdultName} je vítán do dospělosti s potleskem, vtipy a hrdým máváním ocasu. \nNa chvíli kolonie působí méně jako osídlení a více jako rodina.\n[[C]][[+]]Všichni bobři získávají +{%3} pracovní rychlost za [[time:{F2}d]]"
viVN = "Bữa tiệc thì giản đơn nhưng đầy niềm vui. Thức ăn được chia sẻ, cốc được nâng lên, và {CP_TriggerAdultName} được chào đón vào tuổi trưởng thành với những tiếng hò reo, những câu đùa và những cái vỗ đuôi đầy tự hào.\nTrong một khoảnh khắc, thuộc địa cảm thấy không còn giống như một khu định cư mà trở thành một gia đình.\n[[C]][[+]]Tất cả các con nhím đều nhận được +{%3} Tốc độ Làm Việc trong [[time:{F2}d]]"
caES = "El festí és senzill, però alegre. Es comparteix el menjar, s'alcen les copes i {CP_TriggerAdultName} és rebut a l'edat adulta amb aclamacions, acudits i palmadetes d'orgull a la cua.\nPer un moment, la colònia se sent menys com un assentament i més com una família.\n[[C]][[+]]Tots els castors guanyen +{%3} de Velocitat de treball durant [[time:{F2}d]]"
beBY = "Урачыстасць простая, але вясёлая. Ежу дзеляць, кубкі падымаюць, і {CP_TriggerAdultName} сустракаюць у дарослым жыцці воплескамі, жартамі і горделівымі ўдарамі хваста.\nНа імгненне калонія пачынае адчувацца менш як паселішча і больш як сям'я.\n[[C]][[+]]Усе бабры атрымліваюць +{%3} да хуткасці працы на працягу [[time:{F2}d]]"
roRO = "The festul este simplu, dar vesel. Mâncarea este împărțită, cupele sunt ridicate, iar {CP_TriggerAdultName} este întâmpinat în rândul adulților cu aclamații, glume și pocnituri mândre din coadă.\nPentru o clipă, colonia pare mai puțin o așezare și mai mult o familie.\n[[C]][[+]]Toți castorii câștigă +{%3} Viteză de lucru timp de [[time:{F2}d]]"
huHU = "A lakoma egyszerű, mégis vidám. Az ételt megosztják, a poharakat megemelik, és {CP_TriggerAdultName} felnőtté válását éljenváltásokkal, viccekkel és büszke farokcsapásokkal ünneplik.\nEgy pillanatra a kolónia kevésbé telepnek, inkább családnak tűnik.\n[[C]][[+]]Minden bóbita +{%3} munkasebességet kap a következő időre: [[time:{F2}d]]"
arSA = "الوليمة بسيطة لكنها مبهجة. تُقاسم الأطعمة، وتُرفع الأكواب، ويُستقبل {CP_TriggerAdultName} في مرحلة البلوغ بالهتافات والنكات وضربات الذيل الفخورة.\nللحظة، تبدو المستعمرة أقل كمستوطنة وأشبه بعائلة.\n[[C]][[+]]يكتسب جميع القنادس +{%3} من سرعة العمل لمدة [[time:{F2}d]]"

["LV.BCEv.FirstChildGrowth.O2"]
raw = "The planned celebration never quite comes together. Supplies are needed elsewhere, and the colony quietly returns to its routines."
status = "normal"
enUS = "The planned celebration never quite comes together. Supplies are needed elsewhere, and the colony quietly returns to its routines."
zhCN = "“计划中的庆祝活动始终没有成型。物资在其他地方需要，殖民地悄然恢复了日常生活。”"
zhTW = "預定的慶祝活動從未真正成形。物資需要用於其他地方，殖民地悄然回到日常生活中。"
ruRU = "Запланированное празднование так и не состоялось. Запасы нужны в другом месте, и колония тихо возвращается к своим обычным делам."
jaJP = "計画されていた祝典は結局実現しない。資材は他の場所で必要とされ、植民地は静かに日常生活に戻る。"
frFR = "La célébration prévue ne se déroule jamais comme prévu. Les fournitures sont nécessaires ailleurs, et la colonie reprend discrètement ses routines."
deDE = "Die geplante Feier kommt nie so richtig zustande. Die Vorräte werden an anderer Stelle benötigt, und die Kolonie kehrt leise zu ihren Routinen zurück."
plPL = "Zaplanowana celebracja nigdy do końca się nie udaje. Zasoby są potrzebne gdzie indziej, a kolonia cicho wraca do swoich codziennych rutyn."
ptBR = "A celebração planejada nunca se concretiza. Os suprimentos são necessários em outro lugar, e a colônia volta silenciosamente às suas rotinas."
koKR = "계획된 축제는 결코 잘 이루어지지 않는다. 자원은 다른 곳에서 필요하고, 식민지는 조용히 일상으로 돌아간다."
trTR = "Planlanan kutlama bir türlü bir araya gelmiyor. Malzemelere başka yerlerde ihtiyaç var ve koloninin sessizce rutinlerine dönüyor."
esES = "La celebración planeada nunca llega a materializarse del todo. Los suministros hacen falta en otro lugar, y la colonia vuelve discretamente a sus rutinas."
itIT = "La celebrazione pianificata non riesce mai davvero a concretizzarsi. Le risorse servono altrove, e la colonia torna tranquillamente alle sue consuetudini."
ukUA = "Заплановане святкування так і не відбувається. Припаси потрібні в іншому місці, і колонія тихо повертається до своїх звичних справ."
thTH = "งานเฉลิมฉลองที่วางแผนไว้ไม่เคยเป็นไปได้จริง ๆ เพราะต้องนำเสบียงไปใช้ที่อื่น และอาณานิคมก็ค่อย ๆ กลับไปทำกิจวัตรเดิมอย่างเงียบ ๆ"
csCZ = "Plánovaná oslava se nikdy úplně neuskuteční. Zásoby jsou potřeba jinde a kolonie se tiše vrací ke svým rutinám."
viVN = "Bữa lễ dự kiến không bao giờ diễn ra như mong đợi. Nguồn cung cần thiết ở nơi khác, và thuộc địa lặng lẽ trở lại với thói quen của nó."
caES = "La celebració planificada mai no acaba de quadrar. Els subministraments fan falta en un altre lloc, i la colònia torna discretament a les seves rutines."
beBY = "Запланаванае свята так і не адбываецца. Рэсурсы патрэбныя ў іншым месцы, і калонія ціхенька вяртаецца да сваіх звычайных спраў."
roRO = "Sărbătoarea planificată nu reușește niciodată cu adevărat. Proviziile sunt necesare în altă parte, iar colonia revine discret la rutinele ei."
huHU = "A tervezett ünneplés sosem valósul meg igazán. Az erőforrásokat máshol kell felhasználni, a telep pedig csendben visszatér a megszokott teendőihez."
arSA = "لم تكتمل الاحتفالية المخطط لها أبدًا كما ينبغي. فالإمدادات مطلوبة في مكان آخر، وتعود المستوطنة بهدوء إلى روتينها المعتاد."

