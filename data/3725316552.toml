viVN = "Sự từ chối chọn bên của bạn không làm hài lòng ai cả. Các nông dân cảm thấy bị bỏ rơi, các thợ mộc cảm thấy bị xem thường, và cả hai nhóm quay lại làm việc với cái đuôi rủ xuống và tâm trạng bực bội.\nCuộc cãi vã vẫn chưa chấm dứt.\n[[C]][[-]]Công nhân của Cờ Thợ Mộc mất {%4} Tốc độ Làm việc trong [[time:{F1}d]]\n[[C]][[-]]Công nhân của Nhà Nông mất {%4} Tốc độ Làm việc trong [[time:{F1}d]]"
caES = "La vostra negativa a prendre partit no satisfà ningú. Els agricultors se senten ignorats, els llenyataires se senten menyspreats, i tots dos grups tornen al treball amb la cua baixa i els ànims alts.\nLa disputa no s'ha acabat.\n[[C]][[-]]Els treballadors de les Banderes de llenyataires perden {%4} de Velocitat de treball durant [[time:{F1}d]]\n[[C]][[-]]Els treballadors de les Cases de pagès perden {%4} de Velocitat de treball durant [[time:{F1}d]]"
beBY = "Ваша адмова абраць бок не задавальняе нікога. Фермеры адчуваюць, што іх ігнаруюць, дроваруby адчуваюць сябе адхіленымі, і абедзве групы вяртаюцца да працы з апушчанымі хвастамі і распаленымі нервамі.\nСпрэчка не скончана.\n[[C]][[-]]Работнікі Лесапунктаў губляюць {%4} працоўнай хуткасці на працягу [[time:{F1}d]]\n[[C]][[-]]Работнікі Фермерскіх дамоў губляюць {%4} працоўнай хуткасці на працягу [[time:{F1}d]]"
roRO = "Refuzul tău de a alege o parte nu mulțumește pe nimeni. Fermierii se simt ignorați, tăietorii de lemne se simt respinși, iar ambele grupuri se întorc la muncă cu coada între picioare și cu nervii încordați.\nCearta nu s-a încheiat.\n[[C]][[-]]Muncitorii din Steagurile Tăietorilor pierd {%4} din Viteza de lucru timp de [[time:{F1}d]]\n[[C]][[-]]Muncitorii din Casele fermierilor pierd {%4} din Viteza de lucru timp de [[time:{F1}d]]"
huHU = "Az Ön döntésképtelensége senkinek sem tetszik. A gazdák úgy érzik, figyelmen kívül hagyták őket, a favágók úgy érzik, lesöpörték őket, és mindkét csoport lehajtott farokkal, de annál feszültebb hangulatban tér vissza a munkához.\nA vita még nincs lezárva.\n[[C]][[-]]A Favágó-zászlók munkásai {%4} munkasebességet veszítenek [[time:{F1}d]] ideig\n[[C]][[-]]A Farmházak munkásai {%4} munkasebességet veszítenek [[time:{F1}d]] ideig"
arSA = "رفضك اختيار جانب لا يرضي أحدًا. يشعر المزارعون بالتجاهل، ويشعر قاطعو الأخشاب بالإهمال، ويعود الفريقان إلى العمل وذيولهما منكسة وأمزجتهما متوترة.\nالخلاف لم ينتهِ بعد.\n[[C]][[-]]يفقد عمال أعلام قاطعي الأخشاب {%4} من سرعة العمل لمدة [[time:{F1}d]]\n[[C]][[-]]يفقد عمال منازل المزارعين {%4} من سرعة العمل لمدة [[time:{F1}d]]"

