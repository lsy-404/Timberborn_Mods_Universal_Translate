["LV.BCEv.Unhoused.O1"]
raw = "By the promised day, most of the unhoused beavers have found a place indoors. It is not perfect, but it is enough to prove that the colony remembers those sleeping under the open sky. The mood lifts. Work resumes with steadier paws.\n[[C]][[+]]All beavers gain +{%6} Working Speed for [[time:{F4}d]]"
status = "normal"
enUS = "By the promised day, most of the unhoused beavers have found a place indoors. It is not perfect, but it is enough to prove that the colony remembers those sleeping under the open sky. The mood lifts. Work resumes with steadier paws.  \n[[C]][[+]]All beavers gain +{%6} Working Speed for [[time:{F4}d]]"
zhCN = "在约定的日子前，大多数无家可归的海狸已经找到了一个室内的地方。虽然并不完美，但足以证明这个殖民地记住了那些在露天睡觉的海狸。情绪有所提升。工作恢复，爪子更加稳健。  \n[[C]][[+]]所有海狸获得 +{%6} 工作速度，持续时间 [[time:{F4}d]]"
zhTW = "在承諾的日子到來之前，大多數無家可歸的海狸已經找到了一個室內的地方。雖然不完美，但足以證明這個殖民地記得那些在天空下睡覺的海狸。氣氛有所好轉。工作以穩定的步伐重新開始。\n[[C]][[+]]所有海狸獲得 +{%6} 工作速度，持續 [[time:{F4}d]]"
ruRU = "К обещанному дню большинство бездомных бобров нашли себе место в помещении. Это не идеально, но этого достаточно, чтобы доказать, что колония помнит тех, кто спит под открытым небом. Настроение поднимается. Работа возобновляется с более уверенными лапами.  \n[[C]][[+]]Все бобры получают +{%6} Скорость Работы на [[time:{F4}д]]"
jaJP = "約束の日までに、ほとんどの家のないビーバーたちは屋内の場所を見つけました。完璧ではありませんが、野外で眠る仲間たちをコロニーが忘れていないことを証明するには十分です。雰囲気が和らぎます。作業がより安定した足で再開されます。  \n[[C]][[+]]すべてのビーバーが +{%6} 作業速度を獲得します [[time:{F4}d]]"
frFR = "Avant la date promise, la plupart des castors sans abri ont trouvé un endroit à l'intérieur. Ce n'est pas parfait, mais c'est suffisant pour prouver que la colonie se souvient de ceux qui dorment à la belle étoile. L'ambiance s'améliore. Le travail reprend avec des pattes plus stables.  \n[[C]][[+]]Tous les castors gagnent +{%6} de Vitesse de Travail pour [[time:{F4}j]]"
deDE = "Bis zum versprochenen Tag haben die meisten der obdachlosen Biber einen Platz drinnen gefunden. Es ist nicht perfekt, aber es reicht aus, um zu beweisen, dass die Kolonie die erinnert, die unter freiem Himmel schlafen. Die Stimmung hebt sich. Die Arbeit wird mit stabileren Pfoten fortgesetzt. \n[[C]][[+]]Alle Biber erhalten +{%6} Arbeitstempo für [[time:{F4}d]]"
plPL = "Do obiecanego dnia większość bezdomnych bobrów znalazła miejsce w budynku. To nie jest idealne, ale wystarcza, by udowodnić, że kolonia pamięta o tych śpiących pod gołym niebem. Nastrój się poprawia. Praca wznawia się z bardziej stabilnymi łapkami.  \n[[C]][[+]]Wszystkie bobry zyskują +{%6} szybkości pracy przez [[czas:{F4}d]]"
ptBR = "Até o dia prometido, a maioria dos castores desabrigados encontrou um lugar interno. Não é perfeito, mas é o suficiente para provar que a colônia se lembra daqueles que dormem ao céu aberto. O ânimo melhora. O trabalho recomeça com patas mais firmes. \n[[C]][[+]]Todos os castores ganham +{%6} Velocidade de Trabalho por [[time:{F4}d]]"
koKR = "약속된 날까지, 대부분의 집이 없는 비버들이 실내에서 자리를 찾았습니다. 완벽하지는 않지만, 식민지가 하늘 아래에서 자고 있는 이들을 기억하고 있다는 것을 증명하기에는 충분합니다. 분위기가 밝아집니다. 일은 더욱 안정된 발로 재개됩니다.  \n[[C]][[+]]모든 비버는 [[time:{F4}d]] 동안 +{%6} 작업 속도를 얻습니다."
trTR = "Vaadedilen gün geldiğinde, evsiz misketlerin çoğu kapalı bir yer bulmuş durumda. Mükemmel değil ama açık havada uyuyanları hatırladığını kanıtlamak için yeterli. Ruh hali yükseliyor. İş daha sağlam pençelerle yeniden başlıyor.  \n[[C]][[+]]Tüm misketler {%6} Çalışma Hızı kazanır [[time:{F4}g]]"
esES = "Para el día prometido, la mayoría de los castores sin hogar ya han encontrado un lugar bajo techo. No es perfecto, pero basta para demostrar que la colonia recuerda a quienes dormían bajo el cielo abierto. El ánimo mejora. El trabajo se reanuda con patas más firmes.\n[[C]][[+]]Todos los castores ganan +{%6} de Velocidad de trabajo durante [[time:{F4}d]]"
itIT = "Entro il giorno promesso, la maggior parte dei castori senza casa ha trovato un posto al coperto. Non è perfetto, ma basta a dimostrare che la colonia non dimentica chi dorme sotto il cielo aperto. Il morale si risolleva. Il lavoro riprende con zampe più salde.\n[[C]][[+]]Tutti i castori ottengono +{%6} di Velocità di Lavoro per [[time:{F4}d]]"
ukUA = "До обумовленого дня більшість бездомних бобрів знайшли прихисток у приміщеннях. Це не ідеально, але достатньо, щоб показати: колонія пам'ятає про тих, хто спав просто неба. Настрій покращився. Робота відновлюється з упевненішими лапами.\n[[C]][[+]]Усі бобри отримують +{%6} до швидкості роботи протягом [[time:{F4}d]]"
thTH = "ถึงวันที่สัญญาไว้ บีเวอร์ที่ไร้ที่อยู่ส่วนใหญ่ได้พบที่พักในอาคารแล้ว แม้จะยังไม่สมบูรณ์แบบ แต่ก็เพียงพอที่จะแสดงให้เห็นว่าอาณานิคมยังจำได้ถึงผู้ที่ต้องนอนใต้ท้องฟ้า ขวัญกำลังใจดีขึ้น การทำงานกลับมาเดินหน้าอีกครั้งด้วยอุ้งเท้าที่มั่นคงกว่าเดิม\n[[C]][[+]]บีเวอร์ทุกตัวได้รับ +{%6} ความเร็วในการทำงาน เป็นเวลา [[time:{F4}d]]"
csCZ = "Do slíbeného dne většina bezdomovců našla místo uvnitř. Není to dokonalé, ale stačí to k tomu, aby kolonie vzpomněla na ty, kteří spí pod širým nebem. Atmosféra se zlepšuje. Práce se znovu rozbíhá stabilnějšími tlapkami.  \n[[C]][[+]]Všechny bobříci získávají +{%6} Rychlost Práce za [[time:{F4}d]]"
viVN = "Vào ngày đã hứa, hầu hết các chú hải ly không có nhà đã tìm thấy một chỗ ở trong nhà. Nó không hoàn hảo, nhưng đủ để chứng minh rằng thuộc địa nhớ đến những người ngủ dưới bầu trời rộng mở. Tâm trạng phấn chấn. Công việc trở lại với những chiếc vuốt vững chắc hơn. [[C]][[+]]Tất cả các chú hải ly nhận +{%6} Tốc độ Làm việc cho [[time:{F4}d]]"
caES = "By la data prometuda, la majoria dels castors sense llar ja han trobat un lloc sota sostre. No és perfecte, però és prou per demostrar que la colònia recorda els qui dormen a cel obert. L'ànim millora. El treball es reprèn amb unes potes més segures.\n[[C]][[+]]Tots els castors guanyen +{%6} de Velocitat de treball durant [[time:{F4}d]]"
beBY = "Да абранага дня большасць бяздомных бабраў знайшла прытулак пад дахам. Гэта не ідэальна, але дастаткова, каб паказаць: калонія памятае тых, хто спаў пад адкрытым небам. Настрой палепшыўся. Праца аднавілася з больш цвёрдымі лапамі.\n[[C]][[+]]Усе бабры атрымліваюць +{%6} да працоўнай хуткасці на [[time:{F4}d]]"
roRO = "Până în ziua promisă, majoritatea castorilor fără adăpost și-au găsit un loc în interior. Nu este perfect, dar este suficient ca să dovedească faptul că colonia își amintește de cei care dorm sub cerul liber. Moralul se ridică. Munca se reia cu labe mai ferme.\n[[C]][[+]]Toți castorii câștigă +{%6} Viteză de lucru timp de [[time:{F4}d]]"
huHU = "By a megígért napra a hajléktalan hódok többsége talált fedett helyet. Nem tökéletes, de elég ahhoz, hogy bizonyítsa: a kolónia nem feledkezik meg azokról, akik a szabad ég alatt alszanak. A hangulat javul. A munka nyugodtabb mancsokkal folytatódik.\n[[C]][[+]]Minden hód +{%6} Munkasebességet kap [[time:{F4}d]] ideig"
arSA = "لحلول الموعد الموعود، وجد معظم القنادس الذين كانوا بلا مأوى مكانًا داخل المباني. ليس الوضع مثاليًا، لكنه كافٍ لإثبات أن المستعمرة لم تنسَ أولئك الذين كانوا ينامون تحت السماء المفتوحة. ارتفعت المعنويات، واستأنف العمل بخطى أكثر ثباتًا.\n[[C]][[+]]يكتسب جميع القنادس +{%6} إلى سرعة العمل لمدة [[time:{F4}d]]"

["LV.BCEv.Unhoused.O2"]
raw = "By the promised day, every beaver has a roof overhead. The last bed is claimed before nightfall, and for the first time in days, no one has to choose between sleep and the cold ground. The colony rests easier, and rises stronger.\n[[C]][[+]]All beavers gain +{%7} Working and Movement Speed for [[time:{F4}d]]"
status = "normal"
enUS = "By the promised day, every beaver has a roof overhead. The last bed is claimed before nightfall, and for the first time in days, no one has to choose between sleep and the cold ground. The colony rests easier, and rises stronger.  \n[[C]][[+]]All beavers gain +{0} Working and Movement Speed for [[time:{1}d]]"
zhCN = "在承诺的日子之前，每只海狸都有了栖身之所。最后一张床在夜幕降临之前被占据，几天来第一次，没有人需要在睡眠和冰冷的土地之间做出选择。殖民地更加安宁，变得更加强大。  \n[[C]][[+]]所有海狸获得 +{%7} 工作和移动速度，以换取 [[time:{F4}d]]"
zhTW = "在承諾的日子到來之前，每隻海狸都有了遮蔽的屋頂。最後一張床在夜幕降臨前被佔領，幾天來第一次，沒有誰必須在睡眠和冰冷的地面之間做出選擇。殖民地的心情變得輕鬆，並且更加茁壯成長。\n[[C]][[+]]所有海狸獲得 +{%7} 工作和移動速度，以持續 [[time:{F4}d]]"
ruRU = "К обещанному дню у каждого бобра будет крыша над головой. Последняя кровать занята до наступления ночи, и впервые за несколько дней никому не приходится выбирать между сном и холодной землёй. Колония спит спокойнее и поднимается сильнее.  \n[[C]][[+]]Все бобры получают +{%7} к скорости работы и передвижения за [[time:{F4}д]]"
jaJP = "約束の日までに、すべてのビーバーに屋根がある。最後のベッドは日没前に獲得され、数日間で初めて、誰も睡眠と冷たい地面の間で選択しなければならないことはない。コロニーはより安心し、強く育つ。  \n[[C]][[+]]すべてのビーバーは[[time:{F4}d]]の間、+{%7}の作業および移動速度を獲得します。"
frFR = "Avant le jour promis, chaque castor a un toit au-dessus de sa tête. Le dernier lit est occupé avant la tombée de la nuit, et pour la première fois depuis des jours, personne n'a à choisir entre le sommeil et le sol froid. La colonie repose plus sereinement et se lève plus forte.  \n[[C]][[+]]Tous les castors gagnent +{%7} en vitesse de travail et de déplacement pendant [[time:{F4}d]]"
deDE = "Bis zum versprochenen Tag hat jeder Biber ein Dach über dem Kopf. Das letzte Bett wird vor Einbruch der Nacht beansprucht, und zum ersten Mal seit Tagen muss niemand zwischen Schlaf und dem kalten Boden wählen. Die Kolonie ruht sich leichter aus und steht stärker auf.\n[[C]][[+]]Alle Biber erhalten +{%7} Arbeits- und Bewegungsgeschwindigkeit für [[time:{F4}d]]"
plPL = "Do obiecanego dnia każdy bóbr ma dach nad głową. Ostatnie łóżko jest zajęte przed zmierzchem, a po raz pierwszy od dni nikt nie musi wybierać między snem a zimną ziemią. Kolonia odpoczywa łatwiej i wstaje silniejsza. [[C]][[+]]Wszystkie bobry zyskują +{%7} szybkości pracy i ruchu przez [[czas:{F4}d]]"
ptBR = "Até o dia prometido, cada castor tem um teto sobre a cabeça. A última cama é ocupada antes do anoitecer, e pela primeira vez em dias, ninguém precisa escolher entre dormir e o chão frio. A colônia descansa mais tranquila e se levanta mais forte.  \n[[C]][[+]]Todos os castores ganham +{%7} de Velocidade de Trabalho e Movimento por [[time:{F4}d]]"
koKR = "약속된 날까지 모든 비버가 지붕 아래에 있습니다. 마지막 침대가 해가 지기 전에 차지되고, 며칠 만에 처음으로 아무도 잠과 차가운 땅 사이에서 선택을 해야 하지 않습니다. 식민지는 더 편안하게 휴식을 취하고, 더 강하게 일어납니다.  \n[[C]][[+]]모든 비버는 [[time:{F4}일]] 동안 +{%7} 작업 및 이동 속도를 얻습니다."
trTR = "Söz verilen gün geldiğinde, her kunduzun başının üzerinde bir çatı var. Son yatak gün batımından önce kapılmıştır ve günler sonra ilk kez hiç kimse uyku ile soğuk zemin arasında seçim yapmak zorunda kalmaz. Koloni daha rahat dinlenir ve daha güçlü bir şekilde uyanır. [[C]][[+]]Tüm kunduzlar +{%7} Çalışma ve Hareket Hızı kazanır [[time:{F4}g]]"
esES = "By the promised day, every beaver has a roof overhead. The last bed is claimed before nightfall, and for the first time in days, no one has to choose between sleep and the cold ground. The colony rests easier, and rises stronger.\n[[C]][[+]]All beavers gain +{%7} Working and Movement Speed for [[time:{F4}d]]"
itIT = "By la data promessa, ogni castoro ha un tetto sopra la testa. L'ultimo letto viene assegnato prima del calare della notte e, per la prima volta da giorni, nessuno deve scegliere tra il sonno e il terreno freddo. La colonia riposa più serena e si rialza più forte.\n[[C]][[+]]Tutti i castori ottengono +{%7} di velocità di lavoro e di movimento per [[time:{F4}d]]"
ukUA = "До обіцяного дня кожен бобер має дах над головою. Останнє ліжко займають до настання ночі, і вперше за кілька днів ніхто не мусить вибирати між сном і холодною землею. Колонія відпочиває спокійніше й підводиться сильнішою.\n[[C]][[+]]Усі бобри отримують +{%7} до швидкості роботи та пересування протягом [[time:{F4}d]]"
thTH = "ตามวันที่สัญญาไว้ บีเวอร์ทุกตัวมีหลังคาคุ้มหัว เตียงสุดท้ายถูกจับจองก่อนค่ำ และเป็นครั้งแรกในหลายวัน ไม่มีใครต้องเลือกระหว่างการนอนกับพื้นดินที่หนาวเย็น อาณานิคมจึงพักผ่อนได้สบายใจขึ้น และลุกขึ้นมาแข็งแกร่งกว่าเดิม\n[[C]][[+]]บีเวอร์ทุกตัวได้รับ +{%7} ความเร็วในการทำงานและการเคลื่อนที่เป็นเวลา [[time:{F4}d]]"
csCZ = "Do slibovaného dne má každý bobr střechu nad hlavou. Poslední postel je obsazena před setměním a poprvé po dnech nemusí nikdo vybírat mezi spánkem a studenou zemí. Kolonie odpočívá lépe a vstává silnější.  \n[[C]][[+]]Všichni bobři získávají +{%7} Rychlost práce a pohybu na [[čas:{F4}d]]"
viVN = "Đến ngày hứa hẹn, mỗi con nhím đều có mái che. Chiếc giường cuối cùng được chiếm trước khi hoàng hôn buông xuống, và lần đầu tiên sau nhiều ngày, không ai phải chọn giữa giấc ngủ và mặt đất lạnh. T колони́и cảm thấy nhẹ nhàng hơn, và thức dậy mạnh mẽ hơn.  \n[[C]][[+]]Tất cả các con nhím nhận +{%7} Tốc độ Làm Việc và Di Chuyển cho [[time:{F4}d]]"
caES = "By la data promesa, cada castor té un sostre sobre el cap. L'últim llit és reclamat abans de la nit i, per primera vegada en dies, ningú no ha de triar entre dormir i el terra gelat. La colònia descansa més tranquil·la i s'aixeca més forta.\n[[C]][[+]]Tots els castors guanyen +{%7} de velocitat de treball i de moviment durant [[time:{F4}d]]"
beBY = "Да абяцанага дня кожны бабёр мае дах над галавой. Апошняе ложа займаюць да надыходуночы, і ўпершыню за некалькі дзён нікому не трэба выбіраць паміж сном і халодnext голай зямлёй. Калонія адпачывае спакайней і ўздымаецца моцнейшай.\n[[C]][[+]]Усе бабры атрымліваюць +{%7} да хуткасці працы і перамяшчэння на [[time:{F4}d]]"
roRO = "Până în ziua promisă, fiecare castor are un acoperiș deasupra capului. Ultimul pat este ocupat înainte de căderea nopții, iar pentru prima dată după zile întregi, nimeni nu trebuie să aleagă între somn și pământul rece. Colonia se odihnește mai ușor și se ridică mai puternică.\n[[C]][[+]]Toți castorii câștigă +{%7} viteză de lucru și de deplasare timp de [[time:{F4}d]]"
huHU = "A megígért napra minden békának van fedél a feje felett. Az utolsó ágyat még beköltözés előtt elfoglalják, és első alkalommal napok óta senkinek sem kell választania az alvás és a hideg föld között. A kolónia nyugodtabban pihen, és erősebben kel fel.\n[[C]][[+]]Minden béka +{%7} munka- és mozgássebesség-bónuszt kap ennyi időre: [[time:{F4}d]]"
arSA = "في اليوم الموعود، صار لكل قندس سقف فوق رأسه. انحجز آخر سرير قبل حلول الليل، ولأول مرة منذ أيام، لم يعد أحد مضطرًا للاختيار بين النوم والأرض الباردة. صارت المستعمرة ترتاح بسهولة أكبر، وتنهض أقوى.\n[[C]][[+]]يكتسب جميع القنادس +{%7} في سرعة العمل وسرعة الحركة لمدة [[time:{F4}d]]"

["LV.BCEv.Unhoused.O3"]
raw = "Too many beavers are still sleeping outside. Whatever was said before, the colony has not given them shelter.\nThey rise tired, work slower, and keep their doubts mostly to themselves.\n[[C]][[-]]All beavers suffer {%8} Working and Movement Speed for [[time:{F5}d]]"
status = "normal"
enUS = "Too many beavers are still sleeping outside. Whatever was said before, the colony has not given them shelter. They rise tired, work slower, and keep their doubts mostly to themselves. [[C]][[-]]All beavers suffer {%8} Working and Movement Speed for [[time:{F5}d]]"
zhCN = "“还有太多的海狸在外面睡觉。不管之前说了什么，殖民地并没有给他们提供庇护。\n他们醒来时疲惫不堪，工作效率降低，并且大多数疑虑都压在心里。\n[[C]][[-]]所有海狸都将受到 {%8} 的影响，持续 [[time:{F5}d]]”"
zhTW = "太多的海狸仍然在外面睡覺。無論之前說了什麼，殖民地並沒有給他們提供庇護。\n他們疲憊地起床，工作速度變慢，並將大多數的疑惑隱藏在心中。\n[[C]][[-]]所有海狸在[[time:{F5}d]]內遭受{%8}的痛苦。"
ruRU = "Слишком много бобров все еще спят на улице. Что бы ни говорилось раньше, колония не предоставила им укрытие.  \nОни встают усталыми, работают медленнее и чаще всего при себе оставляют свои сомнения.  \n[[C]][[-]]Все бобры страдают {%8} от скорости Работы и Движения в течение [[time:{F5}d]]"
jaJP = "「外で寝ているビーバーが多すぎる。以前に言われたことは何であれ、このコロニーは彼らに避難所を提供していない。\n彼らは疲れて起き、仕事は遅くなり、ほとんど自分の中に疑念を抱えている。\n[[C]][[-]]すべてのビーバーは{%8}の作業及び移動速度の低下を受ける [[time:{F5}d]]」"
frFR = "Trop de castors dorment encore à l'extérieur. Quoi qu'il en soit, la colonie ne leur a pas offert d'abri.  \nIls se lèvent fatigués, travaillent plus lentement et gardent leurs doutes principalement pour eux.  \n[[C]][[-]]Tous les castors souffrent {%8} de vitesse de travail et de déplacement pendant [[time:{F5}d]]"
deDE = "Zu viele Biber schlafen noch draußen. Was auch immer zuvor gesagt wurde, die Kolonie hat ihnen keinen Schutz gegeben.  \nSie stehen müde auf, arbeiten langsamer und behalten ihre Zweifel größtenteils für sich.  \n[[C]][[-]]Alle Biber leiden {%8} Arbeits- und Bewegungsgeschwindigkeit für [[time:{F5}d]]"
plPL = "Zbyt wiele bobrów wciąż śpi na zewnątrz. Cokolwiek mówiono wcześniej, kolonia nie zapewniła im schronienia.  \nBudzą się zmęczone, pracują wolniej i głównie skrywają swoje wątpliwości.  \n[[C]][[-]]Wszystkie bobry cierpią {%8} na prędkości pracy i ruchu przez [[czas:{F5}d]]"
ptBR = "Muitos castores ainda estão dormindo do lado de fora. O que foi dito antes, a colônia não lhes deu abrigo.  \nEles acordam cansados, trabalham mais devagar e mantêm suas dúvidas principalmente para si mesmos.  \n[[C]][[-]]Todos os castores sofrem {%8} de Velocidade de Trabalho e Movimento por [[time:{F5}d]]"
koKR = "너무 많은 비버들이 여전히 밖에서 자고 있습니다. 이전에 어떤 말이 있었든, 식민지는 그들에게 피난처를 제공하지 않았습니다. 그들은 피곤하게 일어나고, 작업 속도가 느려지며, 대부분의 의심을 스스로 간직합니다. [[C]][[-]]모든 비버들은 [[시간:{F5}일]] 동안 {%8} 작업 및 이동 속도 저하를 겪습니다."
trTR = "Aşırı derecede fazla kunduz hala dışarıda uyuyor. Daha önce ne söylenmiş olursa olsun, koloninin onlara sığınak sağlamadığı kesin. Yorgun kalkıyorlar, daha yavaş çalışıyorlar ve şüphelerini genellikle kendilerine saklıyorlar. [[C]][[-]]Tüm kunduzlar {%8} Çalışma ve Hareket Hızı ile acı çekiyor [[time:{F5}g]]"
esES = "Demasiados castores siguen durmiendo al aire libre. Sea lo que sea lo que se dijo antes, la colonia no les ha dado refugio.\nSe levantan cansados, trabajan más despacio y guardan sus dudas casi para sí mismos.\n[[C]][[-]]Todos los castores sufren {%8} de velocidad de trabajo y de movimiento durante [[time:{F5}d]]"
itIT = "Troppi castori dormono ancora all'aperto. Qualunque cosa sia stata detta in precedenza, la colonia non ha offerto loro un riparo.\nSi svegliano stanchi, lavorano più lentamente e tengono i loro dubbi per lo più per sé.\n[[C]][[-]]Tutti i castori subiscono una riduzione di {%8} alla Velocità di Lavoro e di Movimento per [[time:{F5}d]]"
ukUA = "Занадто багато бобрів досі сплять просто неба. Що б там не говорили раніше, колонія так і не дала їм притулку.\nВони встають втомленими, працюють повільніше й здебільшого тримають свої сумніви при собі.\n[[C]][[-]]Усі бобри зазнають {%8} до швидкості роботи та пересування протягом [[time:{F5}d]]"
thTH = "ยังมีบีเวอร์มากเกินไปที่ต้องนอนอยู่ข้างนอก ไม่ว่าก่อนหน้านี้จะพูดไว้อย่างไร อาณานิคมก็ยังไม่ได้ให้ที่พักพิงแก่พวกมัน\nพวกมันตื่นขึ้นมาอย่างอ่อนล้า ทำงานช้าลง และเก็บความสงสัยไว้กับตัวเองเป็นส่วนใหญ่\n[[C]][[-]]บีเวอร์ทุกตัวได้รับผลกระทบ ลดความเร็วในการทำงานและความเร็วในการเคลื่อนที่ลง {%8} เป็นเวลา [[time:{F5}d]]"
csCZ = "Příliš mnoho bobrů stále spí venku. Ať už bylo řečeno cokoliv, kolonie jim neposkytla přístřeší.  \nProbouzejí se unavení, pracují pomaleji a většinu svých pochybností si nechávají pro sebe.  \n[[C]][[-]]Všichni bobři trpí {%8} za [[time:{F5}d]]"
viVN = "Quá nhiều castor vẫn đang ngủ bên ngoài. Dù đã nói gì trước đó, thuộc địa vẫn chưa cung cấp chỗ ở cho họ.  \nHọ thức dậy mệt mỏi, làm việc chậm hơn, và giữ lại phần lớn những nghi ngờ cho riêng mình.  \n[[C]][[-]]Tất cả castor đều phải chịu {%8} Tốc độ Làm việc và Di chuyển trong [[time:{F5}d]]"
caES = "Massa castors encara dormen a fora. Digui el que es digui abans, la colònia no els ha donat refugi.\nEs lleven cansats, treballen més a poc a poc i guarden els seus dubtes gairebé per a ells mateixos.\n[[C]][[-]]Tots els castors pateixen {%8} de velocitat de treball i de moviment durant [[time:{F5}d]]"
beBY = "Занадта шмат бабраў яшчэ спіць пад адкрытым небам. Што б ні казалі раней, калонія так і не дала ім прытулку.\nЯны прачынаюцца стомленымі, працуюць павольней і свае сумневы ў асноўным трымаюць пры сабе.\n[[C]][[-]]Усе бабры страчваюць {%8} хуткасці працы і перамяшчэння на [[time:{F5}d]]"
roRO = "Prea mulți castori dorm încă afară. Orice s-ar fi spus înainte, colonia nu le-a oferit adăpost.\nSe trezesc obosiți, lucrează mai încet și își țin îndoielile mai mult pentru ei.\n[[C]][[-]]Toți castorii suferă o penalizare de {%8} la viteza de lucru și de deplasare timp de [[time:{F5}d]]"
huHU = "Túl sok hód alszik még mindig kint. Bármit is mondtak korábban, a kolónia nem adott nekik menedéket.\nFáradtan ébrednek, lassabban dolgoznak, és kétségeiket többnyire magukban tartják.\n[[C]][[-]]Minden hód {%8} munkasebesség- és mozgássebesség-csökkenést szenved el [[time:{F5}d]] ideig"
arSA = "ما زال عدد كبير جدًا من القنادس ينامون في العراء. مهما قيل سابقًا، لم تمنحهم المستعمرة مأوى.\nيستيقظون متعبين، ويعملون ببطء أكبر، ويحتفظون بشكوكهم لأنفسهم في الغالب.\n[[C]][[-]]يعاني جميع القنادس من {%8} في سرعة العمل والحركة لمدة [[time:{F5}d]]"

["LV.BCEv.Unhoused.AlreadyHoused.Content"]
raw = "A few beavers begin counting beds and lodges, worried that some among them may still be sleeping outside.\n[[+]]But the count brings good news.\nEvery beaver already has a roof overhead. No one has been forgotten. No one has been left to curl up beside the paths at dusk. The colony is quietly pleased. It is one thing to build shelter after complaints begin. It is another to prepare it before anyone has to ask. The beavers take the news with warm satisfaction. Their homes were ready before hardship forced the issue, and that care is not forgotten. The colony rests easier, trusts deeper, and rises with renewed strength.\n[[C]][[+]]All beavers gain +{%7} Working and Movement Speed for [[time:{F9}d]]"
status = "normal"
enUS = "A few beavers begin counting beds and lodges, worried that some among them may still be sleeping outside.  \n[[+]]But the count brings good news.  \nEvery beaver already has a roof overhead. No one has been forgotten. No one has been left to curl up beside the paths at dusk. The colony is quietly pleased. It is one thing to build shelter after complaints begin. It is another to prepare it before anyone has to ask. The beavers take the news with warm satisfaction. Their homes were ready before hardship forced the issue, and that care is not forgotten. The colony rests easier, trusts deeper, and rises with renewed strength.  \n[[C]][[+]]All beavers gain +{%7} Working and Movement Speed for [[time:{F9}d]]"
zhCN = "几个海狸开始统计床位和小屋，担心其中有些还在外面睡觉。\n[[+]]但这个统计带来了好消息。\n每只海狸的头顶上都有房顶。没有人被遗忘。没有人被丢在黄昏时分蜷缩在小路旁。这个群落轻松而愉快。抱怨开始后建造庇护所是一回事，提前准备好庇护所又是另一回事。海狸们带着温暖的满意接受了这个消息。他们的家在困境逼迫之前就已准备好，这份关心没有被忽视。这个群落更安心，更信任，带着重焕的力量崛起。\n[[C]][[+]]所有海狸获得 +{%7} 工作和移动速度，持续 [[time:{F9}d]]"
zhTW = "一些海狸開始計算床位和小屋，擔心他們當中可能還有一些人仍在戶外睡覺。  \n[[+]]但這次計算帶來了好消息。  \n每隻海狸的頭上都有屋頂。沒有人被遺忘。也沒有人在黃昏時被迫蜷縮在小道旁。殖民地靜靜地感到滿意。在投訴開始後建造庇護所是一回事，而在任何人提出要求之前就做好準備又是另一回事。海狸們帶著溫暖的滿足感接受了這個消息。在困難強迫問題出現之前，他們的家已經準備好了，這份關懷不會被遺忘。殖民地感到更加安心，更加信任，並以全新的力量振作起來。  \n[[C]][[+]]所有海狸獲得 +{%7} 工作和移動速度，持續[[time:{F9}d]]"
ruRU = "Несколько бобров начинают считать кровати и хижины, беспокоясь, что некоторые из них могут все еще спать на улице.  \n[[+]]Но подсчет приносит хорошие новости.  \nКаждый бобер уже имеет крышу над головой. Никто не был забытым. Никто не остался свернувшись у тропинок на закате. Колония тихо радуется. Построить укрытие после жалоб — одно, подготовить его до того, как кто-то должен будет спросить — другое. Бобры воспринимают эту новость с теплым удовлетворением. Их дома были готовы до того, как трудности заставили поднять этот вопрос, и эта забота не забыта. Колония чувствует себя спокойнее, доверяет глубже и восстает с renewed strength.  \n[[C]][[+]]Все бобры получают +{%7} Скорости Работы и Передвижения на [[time:{F9}д]]."
jaJP = "数匹のビーバーがベッドと小屋を数え始め、仲間の中にまだ外で寝ている者がいるのではないかと心配している。  \n[[+]]しかし、数えた結果は嬉しいニュースをもたらす。  \nすべてのビーバーにはすでに屋根がある。誰も忘れ去られてはいない。誰も夕暮れ時に道端で丸くなって寝ることはない。コロニーは静かに満足している。苦情が始まってから避難所を建てるのは一つのことだが、誰も頼む前に準備するのはまた別のことだ。ビーバーたちはそのニュースを温かい満足で受け入れる。彼らの家は困難が問題にする前に準備されており、その配慮は忘れられない。コロニーはより安心し、より深く信頼し、再び力を得て立ち上がる。  \n[[C]][[+]]すべてのビーバーは[[time:{F9}d]]の間、 +{%7} 作業および移動速度を得る。"
frFR = "Quelques castors commencent à compter les lits et les cabanes, inquiets que certains d'entre eux puissent encore dormir dehors.  \n[[+]]Mais le décompte apporte de bonnes nouvelles.  \nChaque castor a déjà un toit au-dessus de sa tête. Personne n'a été oublié. Personne n'a été laissé à se pelotonner à côté des chemins au crépuscule. La colonie est tranquillement satisfaite. C'est une chose de construire un abri après que les plaintes commencent. C'en est une autre de le préparer avant que quiconque ait à demander. Les castors accueillent la nouvelle avec une chaude satisfaction. Leurs maisons étaient prêtes avant que la difficulté ne force la question, et cette attention n'est pas oubliée. La colonie se repose plus sereinement, fait preuve de plus de confiance et se lève avec une force renouvelée.  \n[[C]][[+]]Tous les castors gagnent +{%7} de vitesse de travail et de mouvement pendant [[time:{F9}d]]"
deDE = "Einige Biber beginnen, Betten und Unterkünfte zu zählen, besorgt, dass einige von ihnen möglicherweise immer noch draußen schlafen.  \n[[+]]Aber die Zählung bringt gute Nachrichten.  \nJeder Biber hat bereits ein Dach über dem Kopf. NIemand wurde vergessen. NIemand wurde zurückgelassen, um sich am Dämmerung neben den Wegen zusammenzurollen. Die Kolonie ist still erfreut. Es ist eine Sache, Schutz zu bauen, nachdem die Beschwerden begonnen haben. Es ist etwas anderes, ihn vorzubereiten, bevor jemand fragen muss. Die Biber nehmen die Nachricht mit warmem Wohlgefallen auf. Ihre Häuser waren bereit, bevor die Notwendigkeit die Situation zwang, und diese Fürsorge wird nicht vergessen. Die Kolonie ruht sich leichter, vertraut tiefer und erhebt sich mit neuer Stärke.  \n[[C]][[+]]Alle Biber erhalten +{%7} Arbeits- und Bewegungsgeschwindigkeit für [[time:{F9}d]]"
plPL = "Kilku bobrów zaczyna liczyć łóżka i chatki, martwiąc się, że niektórzy z nich mogą nadal spać na zewnątrz.  \n[[+]]Ale wynik przynosi dobre wiadomości.  \nKażdy bóbr ma już dach nad głową. Nikt nie został zapomniany. Nikt nie został pozostawiony, by zwinąć się obok ścieżek o zmierzchu. Kolonia jest cicho zadowolona. Zbudowanie schronienia po zaczęciu skarg to jedna rzecz. Przygotowanie go, zanim ktokolwiek zdąży poprosić, to inna. Bobry przyjmują te wiadomości z ciepłym zadowoleniem. Ich domy były gotowe, zanim trudności wymusiły tę kwestię, a ta troska nie zostaje zapomniana. Kolonia odpoczywa łatwiej, ufa głębiej i podnosi się z nową siłą.  \n[[C]][[+]]Wszystkie bobry zyskują +{%7} prędkości pracy i ruchu na [[time:{F9}d]]"
ptBR = "Alguns castores começam a contar camas e abrigos, preocupados que alguns entre eles ainda possam estar dormindo ao ar livre. [[+]]Mas a contagem traz boas notícias. Cada castor já tem um teto sobre a cabeça. Ninguém foi esquecido. Ninguém foi deixado para se enroscar ao lado dos caminhos ao crepúsculo. A colônia está silenciosamente satisfeita. É uma coisa construir abrigo depois que as reclamações começam. É outra prepará-lo antes que alguém tenha que pedir. Os castores recebem a notícia com calorosa satisfação. Suas casas estavam prontas antes que as dificuldades forçassem a questão, e esse cuidado não é esquecido. A colônia descansa mais tranquila, confia mais profundamente e se levanta com força renovada. [[C]][[+]]Todos os castores ganham +{%7} de Velocidade de Trabalho e Movimento por [[time:{F9}d]]"
koKR = "몇몇 비버들이 침대와 오두막의 수를 세기 시작하며, 그들 중 일부가 여전히 밖에서 자고 있을까 걱정한다.  \n[[+]]하지만 셈은 좋은 소식을 가져온다.  \n모든 비버가 이미 지붕 아래에 있다. 아무도 잊혀지지 않았다. 아무도 해가 지기 전 길가에 웅크리고 있지 않다. 식민지는 조용히 기뻐한다. 불평이 시작된 후에야 쉼터를 짓는 것은 한 가지 일이지만, 아무도 요청하기 전에 미리 준비하는 것은 또 다른 일이다. 비버들은 그 소식을 따뜻한 만족감으로 받아들인다. 그들의 집은 어려움이 문제를 강제하기 전에 이미 준비되어 있었고, 그 배려는 잊혀지지 않는다. 식민지는 더 편안하게 쉬고, 더 깊이 신뢰하며, 새롭게 힘을 얻어 일어난다.  \n[[C]][[+]]모든 비버는 [[time:{F9}d]] 동안 +{%7} 작업 및 이동 속도가 증가한다."
trTR = "Bir kaç kunduz yatakları ve konakları saymaya başlar, aralarındaki bazılarının hala dışarıda uyumaktan endişe duyarak.  \n[[+]]Ancak sayım iyi haberler getirir.  \nHer kunduzun başının üzerinde bir çatısı var. Hiçbiri unutulmamış. Hiçbiri akşam alacakaranlıkta yolların kenarında kıvrılmaya bırakılmamış. Koloni sessizce memnundur. Şikayetler başladıktan sonra barınak inşa etmek bir şeydir. Herkesin sormadan önce hazırlamak ise bambaşka bir şey. Kunduzlar bu haberi sıcak bir tatminle karşılar. Evleri zorluklar meseleyi gündeme getirmeden önce hazırdı ve bu özen unutulmaz. Koloni daha huzurludur, daha derin bir güvenle hareket eder ve yenilenen bir güçle ayağa kalkar.  \n[[C]][[+]]Tüm kunduzlar [[time:{F9}g]] boyunca +{%7} Çalışma ve Hareket Hızı kazanır."
esES = "A few beavers begin counting beds and lodges, worried that some among them may still be sleeping outside.\n[[+]]But the count brings good news.\nEvery beaver already has a roof overhead. No one has been forgotten. No one has been left to curl up beside the paths at dusk. The colony is quietly pleased. It is one thing to build shelter after complaints begin. It is another to prepare it before anyone has to ask. The beavers take the news with warm satisfaction. Their homes were ready before hardship forced the issue, and that care is not forgotten. The colony rests easier, trusts deeper, and rises with renewed strength.\n[[C]][[+]]All beavers gain +{%7} Working and Movement Speed for [[time:{F9}d]]"
itIT = "A few beavers begin counting beds and lodges, worried that some among them may still be sleeping outside.\n[[+]]But the count brings good news.\nEvery beaver already has a roof overhead. No one has been forgotten. No one has been left to curl up beside the paths at dusk. The colony is quietly pleased. It is one thing to build shelter after complaints begin. It is another to prepare it before anyone has to ask. The beavers take the news with warm satisfaction. Their homes were ready before hardship forced the issue, and that care is not forgotten. The colony rests easier, trusts deeper, and rises with renewed strength.\n[[C]][[+]]All beavers gain +{%7} Working and Movement Speed for [[time:{F9}d]]"
ukUA = "Кілька бобрів починають підраховувати житла й хатки, стурбовані тим, що деякі з них, можливо, досі сплять просто неба.\n[[+]]Але підрахунок приносить добру звістку.\nКожен бобер уже має дах над головою. Про жодного не забули. Ніхто не залишився згорнутися калачиком біля стежок у сутінках. Колонія тихо радіє. Одне справа — будувати укриття після того, як почнуться скарги. Інше — підготувати його до того, як хтось попросить. Бобри сприймають новину з теплим задоволенням. Їхні домівки були готові ще до того, як негаразди змусили діяти, і ця турбота не забута. Колонія почувається спокійніше, довіряє глибше і піднімається з відновленою силою.\n[[C]][[+]]Усі бобри отримують +{%7} до швидкості роботи та пересування протягом [[time:{F9}d]]"
thTH = "บีเวอร์กลุ่มหนึ่งเริ่มนับจำนวนเตียงและบ้านพัก ด้วยความกังวลว่าอาจยังมีบางตัวต้องนอนกลางแจ้ง\n[[+]]แต่เมื่อนับแล้วกลับได้ข่าวดี\nบีเวอร์ทุกตัวมีหลังคาคุ้มหัวอยู่แล้ว ไม่มีใครถูกลืม ไม่มีใครต้องขดตัวนอนข้างทางยามพลบค่ำ อาณานิคมรู้สึกยินดีอย่างเงียบๆ การสร้างที่พักหลังจากเริ่มมีเสียงร้องเรียนเป็นเรื่องหนึ่ง แต่การเตรียมที่พักไว้ก่อนที่ใครจะต้องเอ่ยปากขอเป็นอีกเรื่องหนึ่ง บีเวอร์รับข่าวนี้ด้วยความอิ่มเอมใจ บ้านของพวกเขาพร้อมอยู่ก่อนที่ความยากลำบากจะบีบให้ต้องจัดการ และพวกเขาไม่ลืมความเอาใจใส่นี้ อาณานิคมจึงพักผ่อนได้อย่างสบายใจขึ้น ไว้วางใจกันมากขึ้น และลุกขึ้นมาพร้อมพลังที่ฟื้นคืน\n[[C]][[+]]บีเวอร์ทุกตัวได้รับความเร็วในการทำงานและเคลื่อนที่ +{%7} เป็นเวลา [[time:{F9}d]]"
csCZ = "Několik bobrů začíná počítat postele a dřevěnice, znepokojeni, že někteří z nich mohou stále spát venku.  \n[[+]]Ale počet přináší dobrou zprávu.  \nKaždý bobr už má střechu nad hlavou. Nikdo nebyl zapomenut. Nikdo nebyl ponechán k tomu, aby se stočil vedle cest při soumraku. Kolonie je tiše potěšena. Je jedno postavit úkryt poté, co začnou stížnosti. Je to něco jiného připravit ho dřív, než se někdo zeptá. Bobři přijímají zprávu s vřelým uspokojením. Jejich domovy byly připraveny dříve, než je obtíž donutila k akci, a ta péče není zapomenuta. Kolonie odpočívá klidněji, hlouběji důvěřuje a vstává s obnovenou silou.  \n[[C]][[+]]Všichni bobři získávají +{%7} rychlost práce a pohybu na [[time:{F9}d]]"
viVN = "Một vài chú nhím bắt đầu đếm giường và chòi, lo lắng rằng một số trong số họ có thể vẫn đang ngủ bên ngoài.  \n[[+]]Nhưng việc đếm mang lại tin tốt.  \nMỗi chú nhím đều có một mái nhà trên đầu. Không ai bị lãng quên. Không ai bị bỏ lại để cuộn tròn bên lối đi lúc hoàng hôn. Đàn nhím hài lòng một cách yên tĩnh. Việc xây dựng nơi trú ẩn sau khi có những phàn nàn là một chuyện. Việc chuẩn bị trước khi ai đó phải yêu cầu lại là một chuyện khác. Các chú nhím đón nhận tin tức với sự hài lòng ấm áp. Những ngôi nhà của họ đã sẵn sàng trước khi khó khăn xảy ra, và sự chăm sóc đó không bị lãng quên. Đàn nhím cảm thấy yên tâm hơn, tin tưởng hơn và trỗi dậy với sức mạnh được hồi sinh.  \n[[C]][[+]]Tất cả các chú nhím nhận được +{%7} Tốc độ Làm việc và Di chuyển trong [[time:{F9}d]]"
caES = "Alguns castors comencen a comptar els llits i les cabanes, preocupats perquè alguns d'ells potser encara dormen fora.\n[[+]]Però el recompte porta bones notícies.\nCada castor ja té un sostre sobre el cap. Ningú no ha estat oblidat. Ningú no s'ha quedat acorrucat al costat dels camins al vespre. La colònia està discretament satisfeta. Una cosa és construir refugi després que comencin les queixes. Una altra de ben diferent és preparar-lo abans que ningú hagi de demanar-ho. Els castors reben la notícia amb una satisfacció càlida. Les seves cases estaven llestes abans que l'adversitat obligués a fer-ho, i aquesta cura no s'oblida. La colònia descansa més tranquil·la, confia més profundament i es redreça amb força renovada.\n[[C]][[+]]Tots els castors guanyen +{%7} de velocitat de treball i de moviment durant [[time:{F9}d]]"
beBY = "Некалькі баброў пачынаюць падлічваць ложкі і хаткі, непакоячыся, што некаторым з іх, магчыма, усё яшчэ даводзіцца спаць пад адкрытым небам.\n[[+]]Але падлік прыносіць добрыя навіны.\nУ кожнага бабра ўжо ёсць дах над галавой. Ніхто не забыты. Нікому не давялося скручвацца клубком ля сцежак у прыцемках. Калонія ціха задаволеная. Будаваць прытулак пасля таго, як пачнуцца скаргі, — гэта адно. Падрыхтаваць яго загадзя, перш чым камусьці давядзецца прасіць, — зусім іншае. Бабры сустракаюць гэтую навіну з цёплым задавальненнем. Іхнія дамы былі гатовыя яшчэ да таго, як цяжкія абставіны прымусілі б заняцца гэтым, і такую клопатлівасць не забываюць. Калонія спіць спакайней, давярае мацней і прачынаецца з новымі сіламі.\n[[C]][[+]]Усе бабры атрымліваюць +{%7} да хуткасці працы і перамяшчэння на [[time:{F9}d]]"
roRO = "A câteva castoare încep să numere paturile și colibele, îngrijorate că unii dintre ei ar putea încă să doarmă afară.\n[[+]]Dar numărătoarea aduce vești bune.\nFiecare castor are deja un acoperiș deasupra capului. Nimeni nu a fost uitat. Nimeni nu a fost lăsat să se ghemuiască lângă cărări în amurg. Coloniei îi face plăcere, în liniște. Este un lucru să construiești adăpost după ce încep plângerile. Este cu totul altceva să-l pregătești înainte ca cineva să fie nevoit să ceară. Castorii primesc vestea cu o mulțumire caldă. Locuințele lor erau pregătite înainte ca greutățile să forțeze lucrurile, iar această grijă nu este uitată. Colonia se odihnește mai liniștită, are încredere mai profundă și se ridică cu forță reînnoită.\n[[C]][[+]]Toți castorii câștigă +{%7} viteză de lucru și de deplasare timp de [[time:{F9}d]]"
huHU = "A néhány hód elkezdi számolni a hajlékokat és a lakóházakat, aggódva, hogy közülük néhányan még mindig a szabadban alszanak.\n[[+]]A számlálás azonban jó hírt hoz.\nMinden hódnak már van fedél a feje felett. Senkit sem felejtettek el. Senkinek sem kell alkonyatkor az ösvények mellett összebújnia. A kolónia csendesen elégedett. Más dolog menedéket építeni akkor, amikor a panaszok már megérkeztek, és más dolog előre gondoskodni róla, mielőtt bárkinek kellene kérnie. A hódok meleg elégedettséggel fogadják a hírt. Otthonaik már készen álltak, mielőtt a nehézségek kikényszerítették volna, és ezt a gondoskodást nem felejtik el. A kolónia nyugodtabban pihen, mélyebb bizalommal viseltetik egymás iránt, és megújult erővel talpra áll.\n[[C]][[+]]Minden hód +{%7} munka- és mozgássebességre tesz szert [[time:{F9}d]] ideig"
arSA = "قام بعض القنادس بإحصاء الأسرّة والأكواخ، قلقين من أن بعضهم ما زال ينام في العراء.\n[[+]]لكن الإحصاء يحمل أخباراً سارة.\nلكل قندس سقف فوق رأسه بالفعل. لم يُنسَ أحد. لم يُترك أحد ليتكوّر بجانب الممرات عند الغسق. المستعمرة مسرورة بهدوء. شيء أن تبني مأوى بعد أن تبدأ الشكاوى شيء، وأن تعدّه قبل أن يُطلب من أحد ذلك شيء آخر. تلقّى القنادس الخبر بارتياح دافئ. كانت منازلهم جاهزة قبل أن تفرض الشدة الأمر، وهذه العناية لا تُنسى. تستقر المستعمرة براحة أكبر، وتثق بعمق أكبر، وتنهض بقوة متجددة.\n[[C]][[+]]يحصل جميع القنادس على +{%7} في سرعة العمل والحركة لمدة [[time:{F9}d]]"

