caES = "Per sorpresa de tothom, el vostre refús de prendre partit funciona. Els dos grups discuteixen una mica més, i després comencen a riure's de com de ridícul s'ha tornat el conflicte.\nTots dos tornen a la feina decidits a demostrar el seu valor sense destrossar la colònia.\n[[C]][[+]]Els treballadors de les Cases de Llenyataires guanyen +{%3} de Velocitat de treball durant [[time:{F1}d]]\n[[C]][[+]]Els treballadors de les Granges guanyen +{%3} de Velocitat de treball durant [[time:{F1}d]]"
