ptBR = "O seu apoio repetido não deixa dúvidas sobre a posição da liderança da colônia. Os trabalhadores favorecidos se tornam orgulhosos e energéticos, enquanto os outros perdem completamente o ânimo.  \n[[C]][[+]]{S5} trabalhadores ganham +{%2} de Velocidade de Trabalho por [[time:{F1}d]]  \n[[C]][[-]]{S6} trabalhadores perdem {%3} de Velocidade de Trabalho por [[time:{F1}d]]"
koKR = "당신의 반복적인 지원은 식민지 리더십이 어디에 서 있는지에 대한 의심을 남기지 않습니다. 선호받는 노동자들은 자긍심과 활력을 얻고, 다른 노동자들은 완전히 의욕을 잃습니다.\n[[C]][[+]]{S5} 노동자들은 [[time:{F1}d]] 동안 +{%2} 작업 속도를 얻습니다.\n[[C]][[-]]{S6} 노동자들은 [[time:{F1}d]] 동안 {%3} 작업 속도를 잃습니다."
