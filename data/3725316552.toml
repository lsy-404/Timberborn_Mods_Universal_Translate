["LV.BCEv.ContaminationConspiracy.O1"]
raw = "{CP_TriggerCharacterName} returns clean, living, and loudly welcomed.\nThe rumor does not vanish all at once, but it loses its teeth. A beaver can be contaminated and still be counted among the colony. A beaver can be isolated without being abandoned.\nThat matters.\n[[C]][[+]]All beavers gain Reassured for [[time:{F2}d]]"
status = "normal"
enUS = "{CP_TriggerCharacterName} returns clean, living, and loudly welcomed. The rumor does not vanish all at once, but it loses its teeth. A beaver can be contaminated and still be counted among the colony. A beaver can be isolated without being abandoned. That matters. [[C]][[+]]All beavers gain Reassured for [[time:{F2}d]]"
zhCN = "{CP_TriggerCharacterName} 重新返回，干净、活泼，并受到热烈欢迎。\n谣言不会一下子消失，但它会失去锋芒。一只海狸可能会受到污染，但仍然可以被视为群体的一员。一只海狸可以被隔离而不被遗弃。\n这很重要。\n[[C]][[+]]所有海狸在 [[time:{F2}d]] 内获得 安心感"
zhTW = "{CP_TriggerCharacterName} 返回時清潔、活潑，並受到熱烈歡迎。\n謠言不會一下子消失，但它會失去威力。海狸可以被污染，仍然被算作是這個族群的一員。海狸可以被孤立而不會被拋棄。\n這很重要。\n[[C]][[+]]所有海狸在 [[time:{F2}d]] 獲得 Reassured。"
ruRU = "{CP_TriggerCharacterName} возвращается чистым, живым и громко приветствованным. Слухи не исчезают сразу, но теряют свою остроту. Бобра можно заразить и все еще считать его частью колонии. Бобра можно изолировать, не покинув его. Это имеет значение. [[C]][[+]]Все бобры получают Равнодушие на [[time:{F2}д]]"
jaJP = "{CP_TriggerCharacterName}は清潔で生き生きとしており、大声で歓迎される。\n噂は一度に消えるわけではないが、その影響力を失っていく。ビーバーは汚染されることもあるが、コロニーの一員として数えられることができる。ビーバーは孤立させられることがあっても、見捨てられることはない。\nそれが重要だ。\n[[C]][[+]]すべてのビーバーは[[time:{F2}d]]の間にReassuredを獲得する。"
frFR = "{CP_TriggerCharacterName} revient propre, vivant et accueilli bruyamment. \nLa rumeur ne disparaît pas d'un coup, mais elle perd de sa force. Un castor peut être contaminé et être toujours compté parmi la colonie. Un castor peut être isolé sans être abandonné. \nC'est important. \n[[C]][[+]]Tous les castors gagnent Reassured pour [[time:{F2}j]]"
deDE = "{CP_TriggerCharacterName} kehrt sauber, lebendig und laut begrüßt zurück. \nDas Gerücht verschwindet nicht auf einmal, aber es verliert seine Schärfe. Ein Biber kann kontaminiert sein und dennoch zur Kolonie gezählt werden. Ein Biber kann isoliert werden, ohne verlassen zu werden. \nDas zählt. \n[[C]][[+]]Alle Biber erhalten Reassured für [[time:{F2}d]]"
plPL = "{CP_TriggerCharacterName} wraca czysty, żywy i głośno witany. \nPlotka nie znika od razu, ale traci swój pazur. Bobr może być zainfekowany i nadal być liczony w koloni. Bobr może być odizolowany bez bycia porzuconym. \nTo ma znaczenie. \n[[C]][[+]]Wszystkie bobry zyskują Uspokojony przez [[czas:{F2}d]]"
ptBR = "{CP_TriggerCharacterName} retorna limpo, vivo e calorosamente recebido. O rumor não desaparece de repente, mas perde sua força. Um castor pode estar contaminado e ainda ser contado entre a colônia. Um castor pode ser isolado sem ser abandonado. Isso importa. [[C]][[+]]Todos os castores ganham Reassured por [[time:{F2}d]]"
koKR = "{CP_TriggerCharacterName}이 깨끗하고 살아있으며 크게 환영받으며 돌아옵니다. 소문은 한꺼번에 사라지지 않지만, 그 힘을 잃습니다. 비버는 오염될 수 있지만 여전히 집단에 포함될 수 있습니다. 비버는 버림받지 않고 고립될 수 있습니다. 그게 중요합니다. [[C]][[+]]모든 비버는 [[시간:{F2}일]] 동안 확신을 얻습니다."
trTR = "{CP_TriggerCharacterName} temiz, canlı ve gürültüyle karşılanıyor. \nDedikodu bir anda yok olmuyor, ama dişlerini kaybediyor. Bir kunduz kirlenebilir ve yine de koloninin bir parçası olarak sayılabilir. Bir kunduz terk edilmeden izole edilebilir. \nBu önemlidir. \n[[C]][[+]]Tüm kunduzlar [[time:{F2}g]] için Reassured kazanır."
esES = "{CP_TriggerCharacterName} regresa limpio, vivo y recibido con grandes aclamaciones.\nEl rumor no desaparece de golpe, pero pierde sus dientes. Un castor puede estar contaminado y seguir contando como parte de la colonia. Un castor puede ser aislado sin ser abandonado.\nEso importa.\n[[C]][[+]]Todos los castores obtienen Tranquilizado durante [[time:{F2}d]]"
itIT = "{CP_TriggerCharacterName} torna sano e salvo, e viene accolto con grande entusiasmo.\nLa voce non scompare di colpo, ma perde il suo mordente. Un castoro può essere contaminato e restare comunque nella colonia. Un castoro può essere isolato senza essere abbandonato.\nQuesto fa una differenza.\n[[C]][[+]]Tutti i castori ottengono Rassicurato per [[time:{F2}d]]"
ukUA = "{CP_TriggerCharacterName} повертається чистим, живим і гучно вітаним.\nЧутка зникає не odразу, але втрачає свої ікла. Бобра можна заразити і все одно зараховувати до колонії. Бобра можна ізолювати, не покидаючи його.\nЦе важливо.\n[[C]][[+]]Усі бобри отримують стан «Заспокоєний» на [[time:{F2}d]]"
thTH = "{CP_TriggerCharacterName} กลับมาอย่างปลอดภัย มีชีวิต และได้รับการต้อนรับด้วยเสียงเชียร์ดังลั่น\nข่าวลือไม่ได้หายไปในทันที แต่มันสูญเสียเขี้ยวเล็บไปแล้ว บีเวอร์ที่ติดเชื้อยังคงนับเป็นสมาชิกของอาณานิคมได้ และบีเวอร์อาจถูกแยกตัวออกไปโดยไม่ได้ถูกทอดทิ้ง\nเรื่องนี้สำคัญ\n[[C]][[+]]บีเวอร์ทุกตัวจะได้รับสถานะ Reassured เป็นเวลา [[time:{F2}d]]"
csCZ = "{CP_TriggerCharacterName} se vrací čistý, živý a bouřlivě přivítaný. \nRumor nezmizí hned, ale ztrácí svůj důraz. Bobr může být kontaminován a přesto být počítán mezi kolonii. Bobr může být izolován, aniž by byl opuštěn. \nTo je důležité. \n[[C]][[+]]Všichni bobři získávají Uklidněný na [[čas:{F2}d]]"
viVN = "{CP_TriggerCharacterName} trở về trong sự sạch sẽ, sống động, và được chào đón nồng nhiệt. \nTin đồn không biến mất ngay lập tức, nhưng nó mất đi sức mạnh. Một con kỳ nhông có thể bị ô nhiễm và vẫn được tính vào thuộc địa. Một con kỳ nhông có thể bị cô lập mà không bị bỏ rơi. \nĐiều đó quan trọng. \n[[C]][[+]]Tất cả các con kỳ nhông nhận được Reassured trong [[time:{F2}d]]"
caES = "{CP_TriggerCharacterName} torna net, viu i rebut amb grans aclamacions.\nEl rumor no desapareix de cop, però perd les dents. Un castor pot estar contaminat i continuar comptant com a membre de la colònia. Un castor pot quedar aïllat sense ser abandonat.\nAixò importa.\n[[C]][[+]]Tots els castors obtenen Tranquil·litzat durant [[time:{F2}d]]"
beBY = "{CP_TriggerCharacterName} вяртаецца чысты, жывы і гучна вітаны.\nЧутка знікае не адразу, але губляе сваё жала. Бабёр можа быць заражаны і ўсё роўна лічыцца членам калоніі. Бабёр можа быць ізаляваны, але не пакінуты.\nГэта важна.\n[[C]][[+]]Усе бабры атрымліваюць Супакоены на [[time:{F2}d]]"
roRO = "{CP_TriggerCharacterName} revine curat, viu și întâmpinat cu voce tare.\nZvonul nu dispare dintr-odată, dar își pierde dinții. Un castor poate fi contaminat și totuși rămâne numărat printre membrii coloniei. Un castor poate fi izolat fără a fi abandonat.\nAsta contează.\n[[C]][[+]]Toți castorii primesc Liniștit timp de [[time:{F2}d]]"
huHU = "{CP_TriggerCharacterName} tisztán, élve és hangos üdvrivalgás közepette tér vissza.\nA pletyka nem tűnik el egyszerre, de elveszíti a fogát. Egy hód megfertőződhet, és attól még a kolónia tagja marad. Egy hód elkülöníthető anélkül, hogy elhagynák.\nEz fontos.\n[[C]][[+]]Minden hód Megnyugtatott állapotot kap ennyi időre: [[time:{F2}d]]"
arSA = "{CP_TriggerCharacterName} يعود سليمًا وحيًّا، ويُستقبل بترحيب صاخب.\nالشائعة لا تختفي دفعةً واحدة، لكنها تفقد أنيابها. يمكن أن يكون القندس ملوَّثًا ومع ذلك يبقى محسوبًا ضمن المستعمرة. ويمكن عزل القندس دون التخلي عنه.\nوهذا مهم.\n[[C]][[+]]يكتسب جميع القنادس حالة Reassured لمدة [[time:{F2}d]]"

["LV.BCEv.ContaminationConspiracy.O2"]
raw = "The quiet district remains quiet. There is no sound of {CP_TriggerCharacterName} returning, no sign of recovery, and no end to the whispers.\nWhether by neglect, fear, or cruel necessity, the rumor now has a name and a shape. Beavers lower their voices when a contaminated worker passes. Some glance toward the far paths and wonder who will be sent there next.\nThe colony keeps working, but not without looking over its shoulder.\n[[C]][[-]]All beavers get Quiet Dread for [[time:{F3}d]]"
status = "normal"
enUS = "The quiet district remains quiet. There is no sound of {CP_TriggerCharacterName} returning, no sign of recovery, and no end to the whispers. Whether by neglect, fear, or cruel necessity, the rumor now has a name and a shape. Beavers lower their voices when a contaminated worker passes. Some glance toward the far paths and wonder who will be sent there next. The colony keeps working, but not without looking over its shoulder. [[C]][[-]]All beavers get Quiet Dread for [[time:{F3}d]]"
zhCN = "安静的区域依然安静。没有{CP_TriggerCharacterName}返回的声音，没有恢复的迹象，也没有低语的尽头。  \n无论是由于忽视、恐惧还是残酷的必要，谣言现在有了名称和形状。当一个被污染的工人经过时，海狸们会降低声音。有些人朝远方的道路投去目光，想知道接下来会派谁去那里。  \n栖息地仍在运作，但每个人都不免回头张望。  \n[[C]][[-]]所有海狸在[[time:{F3}d]]内获得安静的恐惧。"
zhTW = "靜謐的區域依然靜謐。沒有 {CP_TriggerCharacterName} 回來的聲音，沒有復甦的跡象，也沒有低語的結束。\n無論是出於疏忽、恐懼還是殘酷的必要，這個謠言如今有了一個名字和形狀。當一位受污染的工人經過時，海狸們降低了聲音。一些人朝遙遠的小路瞥去，心中猜測下一個被派往那裡的是誰。\n殖民地繼續運作，但並不是不時回首。\n[[C]][[-]]所有海狸在 [[time:{F3}d]] 期間獲得 靜默懼慌"
ruRU = "Тихий район остается тихим. Нет звука {CP_TriggerCharacterName}, возвращающегося, нет признаков восстановления и нет конца шепотам. Либо из-за небрежности, страха, либо жестокой необходимости слух теперь имеет имя и форму. Бобры понижают голоса, когда мимо проходит зараженный рабочий. Некоторые бросают взгляды на дальние тропы и задаются вопросом, кто будет отправлен туда следующим. Колония продолжает работать, но не без опасений присмотреться назад. [[C]][[-]]Все бобры получают Quiet Dread на [[time:{F3}d]]"
jaJP = "静かな地区は静かなままです。{CP_TriggerCharacterName}が戻る音はなく、回復の兆しもなく、ささやきが終わることはありません。\n無関心、恐怖、または残酷な必要から、それに名前と形が与えられました。汚染された作業員が通り過ぎると、ビーバーたちは声を低くします。遠くの道をちらりと見て、次に誰がそこに送られるのかを不安に思います。\nコロニーは働き続けますが、常に後ろを気にしています。\n[[C]][[-]]すべてのビーバーは[[time:{F3}d]]の間に静かな恐怖を得ます。"
frFR = "Le quartier calme reste calme. Il n'y a aucun bruit du retour de {CP_TriggerCharacterName}, aucun signe de rétablissement, et pas de fin aux murmures. Que ce soit par négligence, peur, ou nécessité cruelle, la rumeur a maintenant un nom et une forme. Les castors baissent la voix lorsqu'un travailleur contaminé passe. Certains jettent un coup d'œil vers les chemins éloignés et se demandent qui y sera envoyé ensuite. La colonie continue de travailler, mais pas sans regarder par-dessus son épaule. [[C]][[-]]Tous les castors reçoivent Quiet Dread pour [[time:{F3}d]]"
deDE = "Der stille Bezirk bleibt ruhig. Es gibt kein Geräusch von {CP_TriggerCharacterName}, das zurückkehrt, kein Zeichen der Genesung und kein Ende der Flüsterungen. \nOb aus Nachlässigkeit, Angst oder grausamer Notwendigkeit, das Gerücht hat jetzt einen Namen und eine Gestalt. Biber senken ihre Stimmen, wenn ein kontaminierter Arbeiter vorbeigeht. Einige blicken zu den fernen Wegen und fragen sich, wer als Nächstes dorthin geschickt wird. \nDie Kolonie arbeitet weiter, aber nicht ohne sich umzusehen. \n[[C]][[-]]Alle Biber erhalten Quiet Dread für [[time:{F3}d]]"
plPL = "Cicha dzielnica pozostaje cicha. Nie słychać powrotu {CP_TriggerCharacterName}, nie widać oznak regeneracji, ani końca szeptów. \nCzy to przez zaniedbanie, strach, czy okrutną konieczność, plotka ma teraz imię i kształt. Bobry ściszają głosy, gdy przechodzi zanieczyszczony pracownik. Niektóre z nich spoglądają w stronę dalekich ścieżek i zastanawiają się, kto zostanie tam wysłany następny.\nKolonia nadal pracuje, ale nie bez oglądania się za siebie.\n[[C]][[-]]Wszystkie bobry dostają Quiet Dread przez [[time:{F3}d]]"
ptBR = "O distrito quieto continua silencioso. Não há som de {CP_TriggerCharacterName} retornando, nenhum sinal de recuperação e nenhum fim para os sussurros. Seja por negligência, medo ou cruel necessidade, o boato agora tem um nome e uma forma. Os castores abaixam as vozes quando um trabalhador contaminado passa. Alguns olham para os caminhos distantes e se perguntam quem será enviado lá em seguida. A colônia continua trabalhando, mas não sem olhar por cima do ombro. [[C]][[-]]Todos os castores recebem Quiet Dread por [[time:{F3}d]]"
koKR = "조용한 지역은 여전히 조용하다. {CP_TriggerCharacterName}가 돌아오는 소리도, 회복의 징후도, 속삭임의 끝도 없다.  \n방치, 두려움, 혹은 잔인한 필요로 인해 이제 이 소문은 이름과 형태를 갖게 되었다. 오염된 작업자가 지나갈 때 비버들은 목소리를 낮춘다. 일부는 먼 길을 바라보며 다음에 누가 그곳으로 보내질지 궁금해한다.  \n콜로니는 계속 일을 하지만, 뒤를 돌아보지 않고는 아니다.  \n[[C]][[-]]모든 비버는 [[time:{F3}d]] 동안 조용한 두려움을 얻는다."
trTR = "Sakin mahalle sakin kalmaya devam ediyor. {CP_TriggerCharacterName} geri dönüyor, iyileşme belirtisi yok ve fısıldamaların sonu yok. İhmal, korku veya zalim bir zorunlulukla, dedikodu şimdi bir adı ve şekli var. Kirlenmiş bir işçi geçerken kunduzlar seslerini kısıyor. Bazıları uzak yollara bakıyor ve oraya bir sonraki kimin gönderileceğini merak ediyor. Koloni çalışmaya devam ediyor, ancak sürekli arkasını kontrol etmeden değil. [[C]][[-]]Tüm kunduzlar [[time:{F3}g]] için Quiet Dread alır."
esES = "La tranquila zona sigue en silencio. No se oye el regreso de {CP_TriggerCharacterName}, no hay señal de recuperación y los susurros no cesan.\nYa sea por descuido, miedo o una cruel necesidad, el rumor ahora tiene nombre y forma. Los castores bajan la voz cuando pasa un trabajador contaminado. Algunos miran de reojo hacia los senderos lejanos y se preguntan quién será enviado allí a continuación.\nLa colonia sigue trabajando, pero no sin mirar por encima del hombro.\n[[C]][[-]]Todos los castores obtienen Temor silencioso durante [[time:{F3}d]]"
itIT = "The quiet district remains quiet. There is no sound of {CP_TriggerCharacterName} returning, no sign of recovery, and no end to the whispers.\nWhether by neglect, fear, or cruel necessity, the rumor now has a name and a shape. Beavers lower their voices when a contaminated worker passes. Some glance toward the far paths and wonder who will be sent there next.\nThe colony keeps working, but not without looking over its shoulder.\n[[C]][[-]]All beavers get Quiet Dread for [[time:{F3}d]]"
ukUA = "Тихий район залишається тихим. Немає жодного звуку про повернення {CP_TriggerCharacterName}, жодної ознаки відновлення, і шепотіння не стихає.\nЧи то через байдужість, страх чи жорстоку необхідність, чутка тепер має ім'я та форму. Бобри знижують голоси, коли повз проходить заражений робітник. Деякі поглядають у бік далеких стежок і гадають, кого відправлять туди наступним.\nКолонія продовжує працювати, але не без постійного озирання через плече.\n[[C]][[-]]Усі бобри отримують Тихий жах на [[time:{F3}d]]"
thTH = "เขตที่เงียบสงบยังคงเงียบสงบ ไม่มีเสียงของ {CP_TriggerCharacterName} กลับมา ไม่มีวี่แววว่าจะฟื้นตัว และเสียงกระซิบก็ไม่มีทีท่าว่าจะจบลง\nไม่ว่าจะเกิดจากการละเลย ความกลัว หรือความจำเป็นอันโหดร้าย ตอนนี้ข่าวลือก็มีทั้งชื่อและรูปร่างแล้ว บีเวอร์พากันลดเสียงลงเมื่อคนงานที่ปนเปื้อนเดินผ่าน บางตัวเหลือบมองไปทางเส้นทางไกลๆ และสงสัยว่าใครจะถูกส่งไปที่นั่นเป็นรายต่อไป\nอาณานิคมยังคงทำงานต่อไป แต่ก็ไม่วายเหลียวมองข้างหลัง\n[[C]][[-]]บีเวอร์ทุกตัวได้รับความหวาดกลัวเงียบงันเป็นเวลา [[time:{F3}d]]"
csCZ = "Tichá čtvrť zůstává tichá. Není slyšet návrat {CP_TriggerCharacterName}, žádné známky uzdravení a žádný konec šeptání.  \nAť už z nedbalosti, strachu nebo kruté nutnosti, má pomluva nyní jméno a tvar. Bobři hovoří tišeji, když kolem prochází kontaminovaný pracovník. Někteří se podívají směrem k odlehlým cestám a přemýšlejí, kdo bude poslán tam příště.  \nKolonie pokračuje v práci, ale ne bez toho, aby se občas ohlédla přes rameno.  \n[[C]][[-]]Všichni bobři dostanou Tichý strach za [[time:{F3}d]]"
viVN = "Khu vực yên tĩnh vẫn giữ yên tĩnh. Không có âm thanh nào của {CP_TriggerCharacterName} trở về, không có dấu hiệu phục hồi, và không có kết thúc cho những lời thì thầm.  \nDù là do sự lơ là, sợ hãi, hay cần thiết tàn nhẫn, tin đồn giờ đây đã có một cái tên và hình dáng. Những con béo chuyển giọng khi một công nhân bị ô nhiễm đi qua. Một số nhìn về những con đường xa và tự hỏi ai sẽ được gửi đến đó tiếp theo.  \nThuộc địa tiếp tục làm việc, nhưng không quên nhìn lại phía sau.  \n[[C]][[-]]Tất cả các con béo nhận được Quiet Dread cho [[time:{F3}d]]"
caES = "The quiet district remains quiet. There is no sound of {CP_TriggerCharacterName} returning, no sign of recovery, and no end to the whispers.\nWhether by neglect, fear, or cruel necessity, the rumor now has a name and a shape. Beavers lower their voices when a contaminated worker passes. Some glance toward the far paths and wonder who will be sent there next.\nThe colony keeps working, but not without looking over its shoulder.\n[[C]][[-]]All beavers get Quiet Dread for [[time:{F3}d]]"
beBY = "Ціхі раён застаецца ціхім. Не чуваць вяртання {CP_TriggerCharacterName}, няма ні прыкмет выздараўлення, ні канца шэпту.\nЗанядбанасць, страх ці жорсткая неабходнасць — чутка цяпер набыла імя і абрысы. Бабры паніжаюць голас, калі міма праходзіць забруджаны працаўнік. Некаторыя пазіраюць на далёкія сцежкі і думаюць, каго туды адправяць наступным.\nКалонія працягвае працаваць, але ўсе азіраюцца.\n[[C]][[-]]Усе бабры атрымліваюць Ціхі жах на [[time:{F3}d]]"
roRO = "The quiet district remains quiet. There is no sound of {CP_TriggerCharacterName} returning, no sign of recovery, and no end to the whispers.\nWhether by neglect, fear, or cruel necessity, the rumor now has a name and a shape. Beavers lower their voices when a contaminated worker passes. Some glance toward the far paths and wonder who will be sent there next.\nThe colony keeps working, but not without looking over its shoulder.\n[[C]][[-]]All beavers get Quiet Dread for [[time:{F3}d]]"
huHU = "A csendes körzet továbbra is csendes. Nem hallani, hogy {CP_TriggerCharacterName} visszatérne, a felépülésnek semmi jele, és a suttogásnak sincs vége.\nAkár hanyagság, félelem vagy kegyetlen szükségszerűség miatt, a szóbeszédnek most már neve és alakja van. A hódok halkabbra fogják a hangjukat, amikor egy szennyezett dolgozó halad el mellettük. Néhányan a távoli ösvények felé pillantanak, és azon tűnődnek, kit küldenek oda legközelebb.\nA kolónia tovább dolgozik, de közben a válla fölött is hátrapillant.\n[[C]][[-]]Minden hódra rátelepszik a néma rettegés [[time:{F3}d]]-ig"
arSA = "ظلّ الحيّ الهادئ على هدوئه. لا يُسمع أي صوت لعودة {CP_TriggerCharacterName}، ولا أثر لتعافٍ، ولا نهاية للهمسات.\nسواءً بسبب الإهمال أو الخوف أو ضرورة قاسية، بات للشائعة اسم وملامح. يخفض القنادس أصواتهم كلما مرّ عاملٌ ملوَّث. ينظر البعض نحو الممرات البعيدة ويتساءلون من سيُرسل إلى هناك بعد ذلك.\nتواصل المستعمرة عملها، لكن ليس دون أن تلتفت خلفها بحذر.\n[[C]][[-]]يُصاب جميع القنادس بـ Quiet Dread لمدة [[time:{F3}d]]"

