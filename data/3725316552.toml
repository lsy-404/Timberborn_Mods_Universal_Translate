["LV.BCEv.ContaminationConspiracy.Content"]
raw = "{CP_TriggerCharacterName} is contaminated.\nBy dusk, whispers crawl through the colony like mist over badwater. Some say the contaminated are not merely sent away for safety. Some say a far district waits for them, quiet and empty, with no warm beds, no full tanks, and no one to hear the last tail-slap.\nNo one says it loudly. No one admits they believe it. But every beaver has seen how quickly a sick worker can become a problem to solve.\nNow {CP_TriggerCharacterName} watches the others from a distance, and the colony watches itself."
status = "normal"
enUS = "{CP_TriggerCharacterName} is contaminated. By dusk, whispers crawl through the colony like mist over badwater. Some say the contaminated are not merely sent away for safety. Some say a far district waits for them, quiet and empty, with no warm beds, no full tanks, and no one to hear the last tail-slap. No one says it loudly. No one admits they believe it. But every beaver has seen how quickly a sick worker can become a problem to solve. Now {CP_TriggerCharacterName} watches the others from a distance, and the colony watches itself."
zhCN = "{CP_TriggerCharacterName} 被污染了。\n黄昏时，低语如同雾气覆盖在污染的水面，弥漫在殖民地中。有人说，被污染的个体并非只是为了安全而被送走。有人说，有一个遥远的区域在等待他们，静谧而空旷，没有温暖的床，没有充足的水箱，也没有人能听到最后一声尾巴拍打的声音。\n没有人大声说出这些话。没有人承认他们相信这一点。但是每一只海狸都见证了生病的工人是如何迅速成为需要解决的问题。\n现在 {CP_TriggerCharacterName} 从远处观察着其他人，而殖民地也在观察着自己。"
zhTW = "{CP_TriggerCharacterName} 被污染了。\n黃昏時分，低語如霧氣般在殖民地中徘徊，如同污水般令人不安。有些人說，被污染者並不只是為了安全而被送走。有些人說，一個遙遠的區域在等著他們，寧靜而空曠，沒有溫暖的床鋪，沒有充分的糧食，沒有人聆聽最後的尾巴拍打聲。\n沒有人大聲說出來。沒有人承認他們相信這一點。但每一隻海狸都看到了病工如何迅速變成需要解決的問題。\n現在 {CP_TriggerCharacterName} 在遠處觀察著其他人，而殖民地也在注視著自己。"
ruRU = "{CP_TriggerCharacterName} загрязнён.\nК закату шепоты крадутся по колонии, как туман над грязной водой. Некоторые говорят, что заражённых не просто отправляют прочь для безопасности. Некоторые утверждают, что вдали их ждёт район, тихий и пустой, без тёплых кроватей, без полных резервуаров и никого, кто услышит последний удар хвоста.\nНикто не говорит это громко. Никто не признаётся, что верит в это. Но каждый бобёр видел, как быстро больной работник может стать проблемой, которую нужно решить.\nТеперь {CP_TriggerCharacterName} наблюдает за другими издалека, а колония наблюдает за собой."
jaJP = "{CP_TriggerCharacterName}は汚染されています。\n夕方になると、ささやきがコロニー中を霧のように這い回ります。汚染された者たちが安全のためにただ送られるだけではないと言う者もいます。彼らを待つ遠い地区があると、静かで空っぽで、温かいベッドも満タンのタンクもなく、最後の尾での叩き音を聞く者もいないのだと。\n誰も大声では言いません。誰もそれを信じているとは認めません。しかし、すべてのビーバーは、病気の作業者がどれほど早く問題になるかを見たことがあります。\n今、{CP_TriggerCharacterName}は他のビーバーたちを距離を置いて見守り、コロニーは自らを見守っています。"
frFR = "{CP_TriggerCharacterName} est contaminé.  \nÀ la tombée de la nuit, des murmures se glissent à travers la colonie comme une brume sur des eaux souillées. Certains disent que les contaminés ne sont pas seulement envoyés pour leur sécurité. Certains disent qu'un lointain district les attend, calme et vide, sans lits chauds, sans réservoirs pleins, et personne pour entendre le dernier claquement de queue.  \nPersonne ne le dit à voix haute. Personne n’admet croire cela. Mais chaque castor a vu à quelle vitesse un travailleur malade peut devenir un problème à résoudre.  \nMaintenant, {CP_TriggerCharacterName} observe les autres de loin, et la colonie s’observe elle-même."
deDE = "{CP_TriggerCharacterName} ist kontaminiert. \nBei Einbruch der Dämmerung kriechen Flüsterungen durch die Kolonie wie Nebel über schlechtes Wasser. Einige sagen, die Kontaminierten werden nicht nur zur Sicherheit weggeschickt. Einige sagen, ein weit entlegener Bezirk wartet auf sie, still und leer, ohne warme Betten, ohne volle Tanks und ohne jemanden, der den letzten Schwanzschlag hört. \nNiemand spricht es laut aus. Niemand gesteht, dass er daran glaubt. Aber jeder Biber hat gesehen, wie schnell ein kranker Arbeiter zu einem Problem werden kann, das gelöst werden muss. \nJetzt beobachtet {CP_TriggerCharacterName} die anderen aus der Ferne, und die Kolonie beobachtet sich selbst."
plPL = "{CP_TriggerCharacterName} jest skażony.\nPrzed zmierzchem szepty pełzają po kolonii jak mgła nad zatrutą wodą. Niektórzy mówią, że skażeni nie są tylko wysyłani dla bezpieczeństwa. Niektórzy mówią, że czeka na nich daleki okręg, cichy i pusty, bez ciepłych łóżek, bez pełnych zbiorników i bez nikogo, kto usłyszałby ostatnie uderzenie ogona.\nNikt nie mówi tego głośno. Nikt nie przyznaje, że w to wierzy. Ale każdy bóbr widział, jak szybko chory pracownik może stać się problemem do rozwiązania.\nTeraz {CP_TriggerCharacterName} obserwuje innych z daleka, a kolonia obserwuje samą siebie."
ptBR = "{CP_TriggerCharacterName} está contaminado. \nAo anoitecer, sussurros percorrem a colônia como névoa sobre águas poluídas. Alguns dizem que os contaminados não são apenas enviados para longe por segurança. Alguns dizem que um distrito distante os espera, quieto e vazio, sem camas quentes, sem tanques cheios e sem ninguém para ouvir o último estalo de cauda. \nNinguém diz isso em voz alta. Ninguém admite que acredita nisso. Mas todo castor já viu quão rapidamente um trabalhador doente pode se tornar um problema a ser resolvido. \nAgora {CP_TriggerCharacterName} observa os outros à distância, e a colônia se observa."
koKR = "{CP_TriggerCharacterName}는 오염되었습니다.  \n저녁이 되면, 속삭임이 불량수역 위 안개처럼 식민지를 기어 다닙니다. 일부는 오염된 이들이 단순히 안전을 위해 떠나는 것이 아니라고 말합니다. 일부는 먼 지역이 그들을 기다리고 있다고, 조용하고 비어 있으며, 따뜻한 침대도, 가득 찬 연료통도, 마지막으로 хвост이 팡팡이는 소리를 들어줄 사람도 없다고 말합니다.  \n아무도 크게 말하지 않습니다. 아무도 자신이 그것을 믿는다고 인정하지 않습니다. 하지만 모든 비버는 아픈 작업자가 얼마나 빨리 문제로 변할 수 있는지를 보았습니다.  \n이제 {CP_TriggerCharacterName}는 다른 이들을 멀리서 지켜보고, 식민지는 스스로를 지켜봅니다."
trTR = "{CP_TriggerCharacterName} kirlenmiş.\nAlacakaranlıkta, fısıldamalar koloni boyunca kötü suyun üstünde yayılan sis gibi dolaşıyor. Bazıları kirlenenlerin sadece güvenlik için gönderilmediğini söylüyor. Bazıları uzak bir bölgenin onları beklediğini, sessiz ve boş olduğunu, sıcak yataklar olmadığını, dolu tanklar olmadığını ve son kuyruk çırpışını duyan kimsenin olmadığını düşünüyor.\nHiç kimse bunu yüksek sesle söylemiyor. Hiç kimse bunun doğru olduğuna inandığını kabul etmiyor. Ama her kunduz, hasta bir işçinin ne kadar hızlı bir sorun haline gelebileceğini görmüştür.\nŞimdi {CP_TriggerCharacterName}, diğerlerini uzaktan izliyor ve koloni kendini izliyor."
esES = "{CP_TriggerCharacterName} está contaminado.\nAl anochecer, los susurros se arrastran por la colonia como niebla sobre el agua envenenada. Algunos dicen que los contaminados no solo son enviados lejos por seguridad. Algunos dicen que un distrito lejano los espera, tranquilo y vacío, sin camas cálidas, sin depósitos llenos y sin nadie que oiga el último golpe de cola.\nNadie lo dice en voz alta. Nadie admite que lo cree. Pero cada castor ha visto lo rápido que un trabajador enfermo puede convertirse en un problema que hay que resolver.\nAhora {CP_TriggerCharacterName} observa a los demás desde la distancia, y la colonia se observa a sí misma."
itIT = "{CP_TriggerCharacterName} è stato contaminato.\nAl calar della sera, i sussurri strisciano per la colonia come nebbia sull'acqua cattiva. Alcuni dicono che i contaminati non vengano semplicemente allontanati per motivi di sicurezza. Alcuni dicono che un distretto lontano li aspetti, tranquillo e vuoto, senza letti caldi, senza cisterne piene e senza nessuno che senta l'ultimo colpo di coda.\nNessuno lo dice ad alta voce. Nessuno ammette di crederci. Ma ogni castoro ha visto quanto rapidamente un lavoratore malato possa diventare un problema da risolvere.\nOra {CP_TriggerCharacterName} osserva gli altri da lontano, e la colonia osserva se stessa."
ukUA = "{CP_TriggerCharacterName} заражений.\nІз настанням сутінків шепіт повзе колонією, мов туман над отруйною водою. Дехто каже, що заражених відправляють геть не лише для безпеки. Дехто каже, що їх чекає далекий район: тихий і порожній, без теплих ліжок, без повних резервуарів і без жодного бобра, який почує останній удар хвостом.\nНіхто не говорить це голосно. Ніхто не визнає, що в це вірить. Але кожен бобер бачив, як швидко хворий працівник може стати проблемою, яку треба розв'язати.\nТепер {CP_TriggerCharacterName} спостерігає за іншими здалеку, а колонія спостерігає сама за собою."
thTH = "{CP_TriggerCharacterName} ติดเชื้อแล้ว\nเมื่อพลบค่ำ เสียงกระซิบแพร่ไปทั่วอาณานิคมเหมือนหมอกที่ลอยอยู่เหนือน้ำเสียที่เป็นพิษ บางคนว่าผู้ติดเชื้อไม่ได้ถูกส่งไปให้พ้นอันตรายเท่านั้น บางคนว่ามีเขตห่างไกลแห่งหนึ่งรอพวกเขาอยู่ เงียบและว่างเปล่า ไม่มีเตียงอุ่น ไม่มีถังน้ำเต็ม และไม่มีใครได้ยินเสียงตบหางครั้งสุดท้ายเลย\nไม่มีใครพูดเรื่องนี้ดังๆ และไม่มีใครยอมรับว่าตัวเองเชื่อเช่นนั้น แต่ทุกตัวในอาณานิคมเคยเห็นมาแล้วว่าคนงานที่ป่วยอาจกลายเป็นปัญหาที่ต้องจัดการได้เร็วเพียงใด\nตอนนี้ {CP_TriggerCharacterName} มองดูคนอื่นอยู่จากระยะห่าง ส่วนอาณานิคมก็กำลังมองดูตัวเองเช่นกัน"
csCZ = "{CP_TriggerCharacterName} je kontaminovaný. \nPřed soumrakem se mezi kolonií šíří šepoty jako mlha nad špatnou vodou. Někteří říkají, že kontaminované nepovyžujou jen kvůli bezpečnosti. Někteří říkají, že na ně čeká daleký okres, tichý a prázdný, bez teplých postelí, bez plných nádrží a nikdo, kdo by slyšel poslední plesknutí ocasu. \nNikdo to neříká nahlas. Nikdo nepřipouští, že tomu věří. Ale každý bobr viděl, jak rychle se nemocný pracovník může stát problémem, který je třeba vyřešit. \nTeď {CP_TriggerCharacterName} pozoruje ostatní z dálky a kolonie se pozoruje sama."
viVN = "{CP_TriggerCharacterName} bị ô nhiễm.\nKhi trời sẩm tối, những lời thì thầm lén lút lan ra khắp thuộc địa như sương mù trên nước bẩn. Một số người nói rằng những người bị ô nhiễm không chỉ bị gửi đi vì sự an toàn. Một số người nói rằng một khu vực xa xôi đang chờ đợi họ, yên tĩnh và vắng vẻ, không có giường ấm, không có bể đầy, và không ai nghe thấy tiếng đập đuôi cuối cùng.\nKhông ai nói to. Không ai thừa nhận họ tin điều đó. Nhưng mọi con nhím đều thấy rằng một công nhân ốm đau có thể nhanh chóng trở thành một vấn đề cần giải quyết.\nGiờ đây, {CP_TriggerCharacterName} quan sát những người khác từ xa, và thuộc địa tự quan sát chính nó."
caES = "{CP_TriggerCharacterName} està contaminat.\nQuan es fa de nit, els rumors s'arrosseguen per la colònia com la boira sobre l'aigua contaminada. Hi ha qui diu que els contaminats no són només enviats lluny per seguretat. Hi ha qui diu que un districte llunyà els espera, silenciós i buit, sense llits càlids, sense dipòsits plens i sense ningú que sentís el darrer cop de cua.\nNingú ho diu en veu alta. Ningú admet que ho creu. Però cada castor ha vist amb quina rapidesa un treballador malalt pot convertir-se en un problema per resoldre.\nAra {CP_TriggerCharacterName} observa els altres des de lluny, i la colònia s'observa a si mateixa."
beBY = "{CP_TriggerCharacterName} заражаны.\nДа змяркання па калоніі паўзуць шэпты, як туман над таксічнай вадой. Кажуць, заражаных адпраўляюць прэч не толькі дзеля бяспекі. Кажуць, іх чакае далёкі раён — ціхі і пусты, без цёплых ложкаў, поўных рэзервуараў і тых, хто пачуе апошні ўдар хвастом.\nНіхто не кажа гэтага ўголас. Ніхто не прызнаецца, што верыць у гэта. Але кожны бабёр бачыў, як хутка хворы працаўнік можа стаць праблемай, якую трэба вырашыць.\nЦяпер {CP_TriggerCharacterName} назірае за іншымі здалёк, а калонія назірае за сабой."
roRO = "{CP_TriggerCharacterName} este contaminat.\nPână la lăsarea serii, șoaptele se strecoară prin colonie ca ceața peste apa otrăvită. Unii spun că cei contaminați nu sunt doar trimiși departe pentru siguranță. Unii spun că un district îndepărtat îi așteaptă, liniștit și gol, fără paturi calde, fără rezervoare pline și fără nimeni care să audă ultima bătaie de coadă.\nNimeni nu spune asta cu voce tare. Nimeni nu recunoaște că o crede. Dar fiecare castor a văzut cât de repede un lucrător bolnav poate deveni o problemă de rezolvat.\nAcum {CP_TriggerCharacterName} îi privește pe ceilalți de la distanță, iar colonia se privește pe sine."
huHU = "{CP_TriggerCharacterName} megfertőződött.\nEstére suttogások kúsznak végig a kolónián, mint köd a mérgezett vizen. Vannak, akik szerint a megfertőződötteket nem csupán biztonsági okokból küldik el. Mások szerint egy távoli körzet várja őket, csendes és üres, meleg fekhely, tele tartály és senki nincs ott, aki meghallaná az utolsó farokcsapást.\nSenki sem mondja ki hangosan. Senki sem vallja be, hogy hisz benne. De minden hód látta már, milyen gyorsan válhat egy beteg munkás megoldandó problémává.\n{CP_TriggerCharacterName} most távolról figyeli a többieket, a kolónia pedig önmagát figyeli."
arSA = "{CP_TriggerCharacterName} مصاب بالتلوّث.\nمع حلول المساء، تزحف الهمسات عبر المستعمرة كما يزحف الضباب فوق المياه الملوثة. يقول البعض إن المصابين لا يُرسَلون بعيدًا من أجل السلامة فقط. ويقول البعض الآخر إن منطقة نائية تنتظرهم، هادئة وخالية، لا أسرّة دافئة فيها ولا خزانات ممتلئة، ولا أحد يسمع آخر ضربة لذيل.\nلا أحد يقولها بصوت عالٍ. ولا أحد يعترف بأنه يصدّق ذلك. لكن كل قندس رأى مدى سرعة تحوّل العامل المريض إلى مشكلة يجب حلّها.\nوالآن، {CP_TriggerCharacterName} يراقب الآخرين من بعيد، والمستعمرة تراقب نفسها."

