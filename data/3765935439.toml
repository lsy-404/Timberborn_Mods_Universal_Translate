["Tobbert.GoodsStationSiloSmall.Description"]
raw = "A silo placed against a Goods Station to grant it extra goods slots — each slot lets the station stock one more kind of goods. Holds no goods of its own."
status = "normal"
enUS = "A silo placed against a Goods Station to grant it extra goods slots—each slot lets the station stock one more kind of goods. Holds no goods of its own."
zhCN = "放置在货物站旁的筒仓，可为货物站增加货物槽位——每个槽位可让货物站多存放一种货物。筒仓本身不储存任何货物。"
zhTW = "設置在貨物站旁邊，為其增加貨物欄位的小型筒倉——每個欄位都能讓貨物站多儲存一種貨物。筒倉本身不儲存任何貨物。"
ruRU = "Силос, установленный вплотную к товарной станции, добавляет ей ячейки для товаров — каждая ячейка позволяет хранить ещё один вид товаров. Сам по себе ничего не хранит."
jaJP = "商品駅の横に設置すると、商品スロットを追加します。各スロットで、駅に保管できる商品の種類が1つ増えます。このサイロ自体には商品を保管しません。"
frFR = "Un silo placé contre une station de marchandises pour lui ajouter des emplacements de marchandises — chaque emplacement permet à la station de stocker un type de marchandises supplémentaire. Ne stocke aucune marchandise par lui-même."
deDE = "Ein Silo, das an einer Güterstation platziert wird, um ihr zusätzliche Warenplätze zu geben – jeder Platz ermöglicht es der Station, eine weitere Warenart zu lagern. Lagert selbst keine Waren."
plPL = "Silos umieszczany przy Stacji Towarowej, by zapewnić jej dodatkowe miejsca na towary — każde miejsce pozwala stacji składować jeszcze jeden rodzaj towaru. Sam nie przechowuje żadnych towarów."
ptBR = "Um silo colocado junto a uma Estação de Produtos para conceder a ela espaços adicionais para produtos — cada espaço permite que a estação estoque mais um tipo de produto. Não armazena produtos por conta própria."
koKR = "물품 역에 붙여 배치해 물품 슬롯을 추가하는 사일로입니다. 슬롯마다 역이 물품을 한 종류 더 비축할 수 있습니다. 자체적으로는 물품을 저장하지 않습니다."
trTR = "Mal İstasyonu'na bitişik yerleştirilerek ona ek mal yuvaları kazandıran bir silo — her yuva, istasyonun bir tür daha mal stoklamasını sağlar. Kendi içinde mal depolamaz."
esES = "Un silo colocado junto a una Estación de Mercancías para concederle ranuras de mercancías adicionales; cada ranura permite a la estación almacenar un tipo de mercancía más. No almacena mercancías por sí mismo."
itIT = "Un silo posizionato contro una Stazione Merci per concedere alla stazione degli slot merci extra: ogni slot permette alla stazione di immagazzinare un tipo di merce in più. Non contiene merci di per sé."
ukUA = "Силос, розміщений біля Складу товарів, щоб збільшити кількість товарних слотів станції: кожен слот дозволяє станції зберігати ще один вид товарів. Сам товари не зберігає."
thTH = "ไซโลที่วางติดกับสถานีสินค้าเพื่อเพิ่มช่องเก็บสินค้าให้สถานี โดยแต่ละช่องช่วยให้สถานีเก็บสินค้าได้อีกหนึ่งประเภท ไม่สามารถเก็บสินค้าได้ด้วยตัวเอง"
csCZ = "Silo umístěné u Zbožové stanice, které jí poskytuje další sloty pro zboží — každý slot umožňuje stanici skladovat jeden další druh zboží. Samo o sobě žádné zboží neskladuje."
viVN = "Một silo đặt sát Nhà Ga Hàng Hóa để tăng thêm ô chứa hàng cho nhà ga — mỗi ô cho phép nhà ga dự trữ thêm một loại hàng hóa. Bản thân silo không chứa hàng hóa nào."
caES = "Un silo col·locat contra una Estació de Mercaderies per donar-li ranures de mercaderies addicionals; cada ranura permet que l'estació emmagatzemi un tipus més de mercaderies. No conté cap mercaderia pròpia."
beBY = "Сілас, размешчаны каля Стацыі тавараў, дае ёй дадатковыя слоты для тавараў: кожны слот дазваляе станцыі захоўваць яшчэ адзін від тавараў. Сам не змяшчае ніякіх тавараў."
roRO = "Un siloz amplasat lângă o Stație de mărfuri pentru a-i oferi sloturi suplimentare de mărfuri — fiecare slot permite stației să depoziteze încă un tip de marfă. Nu conține mărfuri proprii."
huHU = "Egy silót a Goods Station mellé helyezve extra árutárolási helyeket biztosíthat az állomásnak. Minden hely lehetővé teszi, hogy az állomás még egy féle árut tároljon. Saját árut nem tárol."
arSA = "صومعة توضع بجوار محطة البضائع لمنحها خانات بضائع إضافية، حيث تتيح كل خانة للمحطة تخزين نوع إضافي واحد من البضائع. لا تحتوي على أي بضائع خاصة بها."

