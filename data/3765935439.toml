["Tobbert.TrackOneWay.Description"]
raw = "A Track Piece that goes straight. Can be changed to be a one way signal using the toggle when clicking on it. Creates a track section between one ways that allow a single train to be on it (indicated by the colors)."
status = "normal"
enUS = "A straight track piece. It can be changed to a one-way signal using the toggle when clicked. This creates a track section between one ways that allows a single train to be on it (indicated by the colors)."
zhCN = "“一段直行的轨道部件。可以通过点击时使用切换按钮将其更改为单向信号。在单向轨道之间创建一个轨道段，允许一列火车在上面行驶（通过颜色指示）。”"
zhTW = "一段直行的軌道部件。可以通過點擊它時的切換來更改為單向信號。在單向之間創建一個軌道區段，允許單列火車駛入（由顏色指示）。"
ruRU = "Участок рельсов, который идет прямо. Может быть преобразован в однонаправленный сигнал с помощью переключателя при нажатии на него. Создает участок рельсов между однонаправленными участками, позволяя находиться на нем только одному поезду (что указывается цветами)."
jaJP = "まっすぐな軌道パーツです。クリックしてトグルを使用することで、一方通行信号に変更できます。一方向の間にトラックセクションを作成し、単一の列車がその上にいることを可能にします（色で示されます）。"
frFR = "Un morceau de rail qui va tout droit. Peut être changé en un signal à sens unique en utilisant le commutateur en cliquant dessus. Crée une section de rail entre les voies à sens unique qui permet à un seul train d'y être (indiqué par les couleurs)."
deDE = "Ein Gleisstück, das gerade verläuft. Kann durch das Umschalten beim Klicken darauf in ein Einbahnverkehrssignal umgewandelt werden. Schafft einen Gleisabschnitt zwischen Einbahnstraßen, der es einem einzelnen Zug ermöglicht, darauf zu sein (angezeigt durch die Farben)."
plPL = "Element toru, który biegnie prosto. Można go zmienić na sygnał jednokierunkowy, używając przełącznika po kliknięciu na niego. Tworzy odcinek toru pomiędzy torami jednokierunkowymi, który pozwala na obecność jednego pociągu (wskazywane przez kolory)."
ptBR = "Um trecho de pista que vai reto. Pode ser alterado para ser um sinal de mão única usando a alternância ao clicar nele. Cria uma seção de pista entre as manutenções que permite que apenas um trem esteja nela (indicado pelas cores)."
koKR = "직진하는 트랙 조각입니다. 클릭하여 전환할 때, 일방통행 신호로 변경할 수 있습니다. 하나의 기차가 있는 것을 허용하는 일방통행 사이에 트랙 섹션을 생성합니다(색상으로 표시됨)."
csCZ = "Kus koleje, který jde přímo. Může být změněn na jednosměrný signál pomocí přepínače při kliknutí na něj. Vytváří úsek koleje mezi jednosměrkami, který umožňuje, aby na něm byla pouze jedna lokomotiva (což je indikováno barvami)."
viVN = "Một đoạn đường ray thẳng. Có thể được thay đổi thành tín hiệu một chiều bằng cách sử dụng công tắc khi nhấp vào nó. Tạo ra một đoạn đường giữa các đường một chiều cho phép một chiếc tàu duy nhất có mặt trên đó (được chỉ định bởi các màu sắc)."
trTR = "Doğru giden bir Ray Parçası. Üzerine tıklanarak açma/kapama ile tek yönlü sinyal olarak değiştirilebilir. Tek yönlü raylar arasında tek bir trenin üzerinde bulunabileceği bir ray parçası oluşturur (renklerle belirtilmiştir)."

