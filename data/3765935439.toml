koKR = "여기서는 대기역이나 기차 차고에 도달할 수 없습니다. 연결 선로를 놓거나, 돌아가는 길이 그 뒤에 있다면 회차 루프를 놓으세요."
trTR = "Buradan hiçbir Bekleme İstasyonuna veya Tren Garına ulaşılmıyor — bağlantı rayı döşeyin ya da dönüş yolu geride kalıyorsa bir dönüş döngüsü yapın."
esES = "No se puede llegar desde aquí a ninguna Estación de espera ni a ningún Patio de trenes: tiende una vía de conexión o un bucle de cambio de sentido si el camino de vuelta queda detrás de ella"
itIT = "Da qui non si può raggiungere alcuna stazione di attesa o deposito dei treni: posa un binario di collegamento, oppure un anello di inversione se la strada di ritorno si trova dietro di esso."
ukUA = "Звідси не можна дістатися жодної зупинки чи депо потягів — прокладіть з'єднувальну колію або петлю для розвороту, якщо шлях назад залишився позаду неї"
thTH = "ไม่สามารถเข้าถึงสถานีรอหรือลานจอดรถไฟจากตรงนี้ได้ ให้วางรางเชื่อมต่อ หรือวางวงเลี้ยวกลับหากทางกลับอยู่หลังรางนั้น"
csCZ = "Odtud není dostupná žádná čekací stanice ani vlakové depo — položte spojovací kolej, nebo smyčku pro otočení, pokud je cesta zpět za ní."
viVN = "Không thể đến Ga chờ hoặc Bãi tàu từ đây — hãy đặt đường ray kết nối, hoặc một vòng quay đầu nếu đường quay về nằm phía sau."
caES = "No es pot arribar a cap estació d'espera ni dipòsit de trens des d'aquí. Construeix una via de connexió o un bucle de mitjavolta si el camí de tornada queda darrere seu."
roRO = "Nu se poate ajunge de aici la nicio stație de așteptare sau depou de tren — așezați o linie de legătură sau o buclă de întoarcere, dacă drumul înapoi se află în spatele ei"
huHU = "Innen nem érhető el várakozóállomás vagy vonatudvar. Fektessen le egy összekötő vágányt, vagy egy megfordító hurkot, ha a visszaút mögötte van."
arSA = "لا يمكن الوصول من هنا إلى أي محطة انتظار أو ساحة قطارات. مدّ سكة توصيل، أو حلقة استدارة إن كان الطريق للعودة خلفها."

