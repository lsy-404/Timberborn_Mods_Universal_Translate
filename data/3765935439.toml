["Tobbert.GoodsStation.Description"]
raw = "Loads and unloads goods carried by trains. Set, good by good, what the station sends and what it receives; workers take from and drop off at it directly, while haulers shuttle goods to and from the district's storage."
status = "normal"
enUS = "Loads and unloads goods carried by trains. Set, for each good, what the station sends and receives; workers take goods from and drop them off directly at the station, while haulers shuttle goods to and from the district's storage."
zhCN = "装卸由列车运输的货物。逐项设置车站发送和接收哪些货物；工人会直接从车站取货并将货物放到车站，而搬运工则在车站与区的仓库之间运送货物。"
zhTW = "裝載和卸下火車運送的貨物。逐項設定車站要送出和接收哪些貨物；工人會直接從車站取貨或將貨物送到車站，搬運工則會在車站與區域倉庫之間運送貨物。"
ruRU = "Загружает и разгружает товары, перевозимые поездами. Для каждого товара задайте, что станция отправляет и что принимает. Рабочие напрямую берут товары со станции и оставляют их на ней, а грузчики перевозят товары на склад района и обратно."
jaJP = "列車が運ぶ品物を積み降ろします。品目ごとに駅から送り出すものと受け取るものを設定できます。作業員は駅へ直接品物を運び入れたり、駅から運び出したりします。一方、運搬人は地区の倉庫との間で品物を運びます。"
frFR = "Charge et décharge les marchandises transportées par les trains. Définissez, marchandise par marchandise, ce que la gare expédie et reçoit ; les ouvriers y déposent et y prennent directement les marchandises, tandis que les porteurs les acheminent depuis et vers les entrepôts du district."
deDE = "Lädt und entlädt Waren, die von Zügen transportiert werden. Lege für jede Ware einzeln fest, was der Bahnhof versendet und empfängt. Arbeiter holen Waren direkt dort ab und liefern sie dort ab, während Transportarbeiter Waren zum Lager des Bezirks und von dort hin und her transportieren."
plPL = "Ładuje i rozładowuje towary przewożone przez pociągi. Ustaw osobno dla każdego towaru, co stacja wysyła, a co odbiera. Robotnicy bezpośrednio pobierają towary ze stacji i dostarczają je do niej, a tragarze przewożą towary między stacją a magazynami w dzielnicy."
ptBR = "Carrega e descarrega mercadorias transportadas por trens. Defina, mercadoria por mercadoria, o que a estação envia e recebe; os trabalhadores retiram mercadorias e as depositam diretamente nela, enquanto os carregadores transportam mercadorias de e para o armazenamento do distrito."
koKR = "기차가 운반하는 물품을 싣고 내립니다. 물품별로 역이 보내고 받을 물품을 설정하세요. 일꾼은 물품을 역에 직접 가져오거나 역에서 가져가며, 운반꾼은 물품을 지구의 저장고와 역 사이로 나릅니다."
csCZ = "Nakládá a vykládá zboží přepravované vlaky. U každého zboží zvlášť nastavte, co stanice odesílá a co přijímá; pracovníci zboží odebírají a přímo do ní odkládají, zatímco dopravci přepravují zboží do skladů v okrsku a zpět."
viVN = "Xếp và dỡ hàng hóa được tàu chở. Thiết lập riêng cho từng loại hàng hóa những gì nhà ga gửi đi và nhận về; công nhân trực tiếp lấy hàng từ nhà ga và giao hàng đến nhà ga, trong khi người vận chuyển luân chuyển hàng hóa đến và đi từ kho của khu vực."
trTR = "Trenlerle taşınan malları yükler ve boşaltır. İstasyonun hangi malları gönderip hangilerini alacağını her mal için ayrı ayrı belirleyin; işçiler malları doğrudan istasyondan alıp istasyona bırakırken taşıyıcılar malları bölgenin depolarına götürüp getirir."

["Tobbert.GoodsStation.FlavorDescription"]
raw = "Every great railway needs a place to drop off the cargo."
status = "normal"
enUS = "Every great railway needs a place to drop off the cargo."
zhCN = "“每个伟大的铁路都需要一个卸货的地方。”"
zhTW = "「每個偉大的鐵路都需要一個卸貨的地方。」"
ruRU = "Каждая великая железная дорога нуждается в месте для разгрузки груза."
jaJP = "すべての偉大な鉄道には、貨物を降ろす場所が必要です。"
frFR = "Chaque grande voie ferrée a besoin d'un endroit pour déposer la cargaison."
deDE = "Jede große Eisenbahn braucht einen Ort, um die Fracht abzuladen."
plPL = "Każda wielka kolej potrzebuje miejsca na zrzucenie ładunku."
ptBR = "Todo grande ferrovia precisa de um lugar para descarregar a carga."
