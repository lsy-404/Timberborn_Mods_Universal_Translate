status = "normal"
enUS = "Balances goods between districts connected by rail according to their distribution settings. Beavers also use it to migrate from one district to another."
zhCN = "在通过铁路连接的区之间，按照各区的分配设置平衡物资。海狸也会通过它从一个区迁移到另一个区。"
zhTW = "依照分配設定，在以鐵路相連的區域之間平衡物資。海狸也會利用它從一個區域遷移到另一個區域。"
ruRU = "Распределяет товары между районами, соединёнными железной дорогой, согласно настройкам распределения. Бобры также используют станцию, чтобы переселяться из одного района в другой."
jaJP = "鉄道で接続された地区間で、各地区の分配設定に従って物資のバランスを調整します。ビーバーはこれを使って、ある地区から別の地区へ移住することもできます。"
frFR = "Équilibre les marchandises entre les districts reliés par le rail, en suivant leurs paramètres de distribution. Les castors l’utilisent également pour migrer d’un district à un autre."
deDE = "Gleicht Waren zwischen per Schiene verbundenen Bezirken gemäß deren Verteilungseinstellungen aus. Biber nutzen sie außerdem, um von einem Bezirk in einen anderen umzuziehen."
plPL = "Równoważy ilość towarów między połączonymi koleją dzielnicami zgodnie z ustawieniami ich dystrybucji. Bobry korzystają z niej również, aby migrować między dzielnicami."
ptBR = "Equilibra os bens entre distritos conectados por trilhos, seguindo as configurações de distribuição. Os castores também a usam para migrar de um distrito para outro."
koKR = "철도로 연결된 구역 간에 각 구역의 분배 설정에 따라 물품을 균형 있게 분배합니다. 비버들은 이곳을 이용해 다른 구역으로 이주하기도 합니다."
trTR = "Demiryoluyla birbirine bağlı bölgeler arasında, dağıtım ayarlarına göre malların dengesini sağlar. Kunduzlar ayrıca bir bölgeden diğerine göç etmek için de bunu kullanır."
esES = "Equilibra los bienes entre distritos conectados por ferrocarril, siguiendo sus ajustes de distribución. Los castores también lo usan para migrar de un distrito a otro."
itIT = "Bilancia le merci tra i distretti collegati da ferrovia, seguendo le loro impostazioni di distribuzione. I castori la usano anche per migrare da un distretto all'altro."
ukUA = "Розподіляє товари між округами, з'єднаними залізницею, відповідно до їхніх налаштувань розподілу. Бобри також використовують її, щоб переселятися з одного округу в інший."
thTH = "ปรับสมดุลสินค้าระหว่างเขตที่เชื่อมต่อกันด้วยทางรถไฟ ตามการตั้งค่าการกระจายของแต่ละเขต บีเวอร์ยังใช้สิ่งนี้เพื่อย้ายจากเขตหนึ่งไปอีกเขตหนึ่งด้วย"
csCZ = "Vyrovnává množství zboží mezi okresy propojenými železnicí podle jejich nastavení distribuce. Bobři ji také využívají k migraci z jednoho okresu do druhého."
viVN = "Cân bằng hàng hóa giữa các khu được kết nối bằng đường ray, theo cài đặt phân phối của chúng. Hải ly cũng dùng nơi này để di cư từ khu này sang khu khác."
caES = "Equilibra les mercaderies entre districtes connectats per ferrocarril, segons la seva configuració de distribució. Els castors també l'utilitzen per migrar d'un districte a un altre."
beBY = "Выраўноўвае тавары паміж раёнамі, злучанымі чыгункай, згодна з іх налadамі размеркавання. Бабры таксама выкарыстоўваюць яго для перасялення з аднаго раёна ў другі."
roRO = "Echilibrează bunurile între districtele conectate prin cale ferată, în conformitate cu setările lor de distribuție. Castorii o folosesc și pentru a migra dintr-un district în altul."
huHU = "Áruelosztást végez a vasúttal összekötött körzetek között, a körzetek elosztási beállításait követve. A bükkök ezt arra is használják, hogy átköltözzenek egyik körzetből a másikba."
arSA = "يوازن هذا المبنى البضائع بين المقاطعات المتصلة بالسكك الحديدية، وفقًا لإعدادات التوزيع الخاصة بها. ويستخدمه القنادس أيضًا للانتقال من مقاطعة إلى أخرى."

