["ChooChoo.Superposition.ConversionNotice"]
raw = "<b>Welcome to Choo!Choo! 2.0!</b>\n\n\"Give me a straight and a curve, and I shall connect the world.\" —Ol' Kazko\n\nTwo tracks can now share the same tile. Lay a curve on a straight, and you have built a switch. No more rigid crossings: it's up to you to invent your own junctions.\n\nWhen your save loaded, your old switches were rebuilt with these new pieces. Your signals stayed put and work just as before. The trains didn't notice a thing."
status = "normal"
enUS = "<b>Welcome to Choo!Choo! 2.0!</b>\n\n\"Give me a straight and a curve, and I shall connect the world.\" —Ol' Kazko\n\nTwo tracks can now share the same tile. Lay a curve on a straight, and you have built a switch. No more rigid crossings: it's up to you to invent your own junctions.\n\nWhen your save loaded, your old switches were rebuilt with these new pieces. Your signals stayed put and work just as before. The trains didn't notice a thing."
zhCN = "<b>欢迎来到《Choo!Choo! 2.0》！</b>\n\n“给我一段直轨和一段弯轨，我就能连通世界。”——老卡兹科\n\n现在，两条轨道可以共用同一格。在直轨上铺设弯轨，就能建成一个道岔。不再受死板的交叉轨道限制：由你来设计自己的道岔吧。\n\n载入存档时，旧道岔已用这些新轨道重新建造。信号灯保持原位，运作方式也和以前一样。火车完全没察觉到任何变化。"
zhTW = "<b>歡迎來到 Choo!Choo! 2.0！</b>\n\n「給我一段直軌和一段彎軌，我就能連接整個世界。」——老 Kazko\n\n現在兩條軌道可以共用同一格了。把彎軌疊在直軌上，就能建成轉轍器。不再受制於固定的交叉路口：由你發揮創意，設計自己的交會點。\n\n載入存檔時，舊有的轉轍器已用這些新零件重新建造。訊號燈仍在原位，運作方式也和以前一樣。火車完全沒察覺任何變化。"
ruRU = "<b>Добро пожаловать в Choo!Choo! 2.0!</b>\n\n«Дайте мне прямой участок и поворот — и я соединю весь мир». — Старина Казко\n\nТеперь два пути могут занимать одну и ту же клетку. Проложите поворот поверх прямого участка — и получите стрелку. Больше никаких жёстких пересечений: придумывайте собственные развязки.\n\nПри загрузке сохранения старые стрелки были перестроены с помощью этих новых элементов. Сигналы остались на месте и работают как прежде. Поезда ничего не заметили."
jaJP = "<b>Choo!Choo! 2.0へようこそ！</b>\n\n「直線とカーブをひとつずつくれれば、世界をつないでみせよう。」—オールド・カズコ\n\n同じタイルに2本の線路を敷けるようになりました。直線の上にカーブを敷けば、分岐器の完成です。決まりきった交差点はもう必要ありません。どんな分岐を作るかは、あなた次第です。\n\nセーブデータの読み込み時に、以前の分岐器は新しい線路パーツで作り直されました。信号機はそのまま残り、以前と同じように動作します。列車は何も気づきませんでした。"
frFR = "<b>Bienvenue dans Choo!Choo! 2.0 !</b>\n\n« Donnez-moi une ligne droite et une courbe, et je relierai le monde. » —Vieux Kazko\n\nDeux voies peuvent désormais partager la même case. Posez une courbe sur une ligne droite, et vous avez construit un aiguillage. Fini les croisements rigides : à vous d'inventer vos propres jonctions.\n\nAu chargement de votre sauvegarde, vos anciens aiguillages ont été reconstruits avec ces nouvelles pièces. Vos signaux sont restés en place et fonctionnent comme avant. Les trains n'ont rien remarqué."
deDE = "<b>Willkommen bei Choo!Choo! 2.0!</b>\n\n„Gib mir eine Gerade und eine Kurve, und ich verbinde die Welt.“ —Ol' Kazko\n\nZwei Gleise können jetzt dasselbe Feld belegen. Lege eine Kurve auf ein gerades Gleis, und schon hast du eine Weiche gebaut. Schluss mit starren Kreuzungen: Es liegt an dir, eigene Knotenpunkte zu erfinden.\n\nBeim Laden deines Spielstands wurden deine alten Weichen mit diesen neuen Teilen umgebaut. Deine Signale blieben an Ort und Stelle und funktionieren wie zuvor. Die Züge haben nichts bemerkt."
plPL = "<b>Witajcie w Choo!Choo! 2.0!</b>\n\n„Dajcie mi prosty tor i łuk, a połączę świat.” —Ol' Kazko\n\nDwa tory mogą teraz zajmować to samo pole. Ułóż łuk na prostym torze, a zbudujesz rozjazd. Koniec ze sztywnymi skrzyżowaniami: teraz możesz wymyślać własne węzły kolejowe.\n\nPodczas wczytywania zapisu stare rozjazdy zostały przebudowane z użyciem tych nowych elementów. Sygnały pozostały na swoich miejscach i działają jak wcześniej. Pociągi niczego nie zauważyły."
ptBR = "<b>Boas-vindas a Choo!Choo! 2.0!</b>\n\n\"Dê-me uma reta e uma curva, e conectarei o mundo.\" —Velho Kazko\n\nAgora, dois trilhos podem compartilhar o mesmo ladrilho. Coloque uma curva sobre um trecho reto, e você terá construído um desvio. Chega de cruzamentos rígidos: cabe a você inventar suas próprias junções.\n\nQuando seu jogo salvo foi carregado, seus antigos desvios foram reconstruídos com essas novas peças. Seus sinais continuaram no mesmo lugar e funcionam como antes. Os trens nem perceberam."
koKR = "<b>Choo!Choo! 2.0에 오신 것을 환영합니다!</b>\n\n\"직선 하나와 곡선 하나만 주면, 내가 세상을 연결하겠소.\" —올 카즈코\n\n이제 두 선로가 같은 타일을 공유할 수 있습니다. 직선 위에 곡선을 놓으면 분기기가 완성됩니다. 더는 뻣뻣한 교차로가 없습니다. 이제 여러분이 직접 교차로를 만들어 보세요.\n\n저장 파일을 불러올 때 기존 분기기는 새로운 부품으로 재구성되었습니다. 신호기는 그대로 유지되어 예전과 똑같이 작동합니다. 열차들은 아무것도 눈치채지 못했습니다."
trTR = "<b>Choo!Choo! 2.0'a hoş geldiniz!</b>\n\n“Bana bir düz, bir de kavis verin; dünyayı birbirine bağlayayım.” —Ol' Kazko\n\nArtık iki ray aynı kareyi paylaşabiliyor. Düz rayın üzerine kavisli ray döşeyin, bir makas yapmış olursunuz. Artık katı kavşaklar yok: Kendi kavşaklarınızı tasarlamak size kalmış.\n\nKayıt dosyanız yüklendiğinde eski makaslarınız bu yeni parçalarla yeniden oluşturuldu. Sinyalleriniz yerlerinde kaldı ve eskisi gibi çalışıyor. Trenler hiçbir şey fark etmedi."
esES = "<b>¡Bienvenido a Choo!Choo! 2.0!</b>\n\n\"Dame una recta y una curva, y conectaré el mundo entero.\" —Ol' Kazko\n\nAhora dos vías pueden compartir la misma casilla. Coloca una curva sobre una recta y habrás construido un cambio de vía. Se acabaron los cruces rígidos: depende de ti inventar tus propias bifurcaciones.\n\nAl cargar tu partida, tus antiguos cambios de vía se reconstruyeron con estas nuevas piezas. Tus señales se quedaron en su sitio y siguen funcionando igual que antes. Los trenes no se dieron cuenta de nada."
itIT = "<b>Benvenuti in Choo!Choo! 2.0!</b>\n\n\"Datemi un binario dritto e una curva, e collegherò il mondo.\" —Ol' Kazko\n\nOra due binari possono condividere la stessa casella. Posa una curva su un binario dritto e avrai costruito uno scambio. Niente più incroci rigidi: sta a te inventare i tuoi snodi.\n\nQuando il salvataggio è stato caricato, i tuoi vecchi scambi sono stati ricostruiti con questi nuovi pezzi. I segnali sono rimasti al loro posto e funzionano esattamente come prima. I treni non si sono accorti di nulla."
ukUA = "<b>Ласкаво просимо до Choo!Choo! 2.0!</b>\n\n\"Дайте мені пряму і криву, і я з'єднаю світ.\" —Старий Казко\n\nТепер два колійні шляхи можуть ділити одну клітинку. Покладіть криву на пряму — і ви отримаєте стрілку. Жодних більше жорстких перетинів: вигадуйте власні роз'їзди самі.\n\nКоли ваше збереження завантажилося, ваші старі стрілки були перебудовані з цих нових елементів. Ваші сигнали залишилися на місцях і працюють так само, як і раніше. Потяги нічого не помітили."
thTH = "<b>ยินดีต้อนรับสู่ Choo!Choo! 2.0!</b>\n\n\"ให้ฉันมีทางตรงกับทางโค้งสักเส้น แล้วฉันจะเชื่อมโลกทั้งใบเข้าด้วยกัน\" —ออลคาซโก\n\nตอนนี้รางสองเส้นสามารถใช้ช่องเดียวกันได้ เมื่อวางทางโค้งบนทางตรง คุณก็สร้างสวิตช์ได้แล้ว ไม่มีจุดตัดแบบตายตัวอีกต่อไป จะสร้างทางแยกแบบใดก็ขึ้นอยู่กับคุณ\n\nเมื่อโหลดเซฟของคุณ สวิตช์เก่าจะถูกสร้างใหม่ด้วยชิ้นส่วนใหม่เหล่านี้ สัญญาณของคุณยังคงอยู่ที่เดิมและทำงานเหมือนเดิม ขบวนรถไฟไม่รู้สึกถึงการเปลี่ยนแปลงใดเลย"
csCZ = "<b>Vítejte v Choo!Choo! 2.0!</b>\n\n„Dejte mi rovinku a zatáčku a já propojím svět.“ —Ol' Kazko\n\nDvě koleje teď mohou sdílet stejné políčko. Položte oblouk na rovný úsek a vytvoříte výhybku. Už žádná strnulá křížení: teď je na vás, abyste vymysleli vlastní železniční uzly.\n\nPři načtení uložené hry byly vaše staré výhybky přestavěny pomocí těchto nových dílů. Návěstidla zůstala na svém místě a fungují stejně jako dřív. Vlaky si ničeho nevšimly."
viVN = "<b>Chào mừng đến với Choo!Choo! 2.0!</b>\n\n\"Cho ta một đoạn thẳng và một đoạn cong, ta sẽ nối liền thế giới.\" —Lão Kazko\n\nGiờ đây, hai đường ray có thể dùng chung một ô. Đặt một đoạn cong lên một đoạn thẳng, và bạn đã tạo ra một ghi. Không còn những giao cắt cứng nhắc: giờ đây bạn có thể tự do sáng tạo các nút giao của riêng mình.\n\nKhi bản lưu của bạn được tải, các ghi cũ đã được xây dựng lại bằng những mảnh ghép mới này. Các tín hiệu vẫn ở nguyên chỗ cũ và hoạt động như trước. Những đoàn tàu chẳng hề nhận ra điều gì."
caES = "<b>Benvinguts a Choo!Choo! 2.0!</b>\n\n\"Doneu-me una recta i una corba, i connectaré el món.\" —Ol' Kazko\n\nAra dues vies poden compartir la mateixa casella. Si poseu una corba sobre una recta, heu construït un canvi d'agulla. Se n'han acabat els encreuaments rígids: depèn de vosaltres inventar les vostres pròpies bifurcacions.\n\nQuan es va carregar la vostra partida, els vostres antics canvis d'agulla es van reconstruir amb aquestes peces noves. Els senyals es van mantenir al seu lloc i funcionen igual que abans. Els trens no se'n van adonar de res."
beBY = "<b>Вітаем у Choo!Choo! 2.0!</b>\n\n«Дайце мне прамую і крывую, і я злучу свет.» —Стары Казко\n\nЦяпер два шляхі могуць займаць адну і тую ж клетку. Пакладзіце крывую на прамую — і вы атрымаеце стрэлку. Больш няма жорсткіх перасячэнняў: вырашаць, як выглядаюць вашы развілкі, вам.\n\nКалі ваша захаваная гульня загрузілася, вашыя старыя стрэлкі былі перабудаваны з гэтых новых дэталей. Вашыя сігналы засталіся на месцах і працуюць гэтак жа, як раней. Цягнікі нічога не заўважылі."
roRO = "<b>Bun venit la Choo!Choo! 2.0!</b>\n\n„Dă-mi o linie dreaptă și una curbă, și voi lega lumea.” —Ol' Kazko\n\nDouă șine pot acum să împartă același pătrat. Dacă așezi o curbă peste o linie dreaptă, ai construit o macaz. Nu mai există intersecții rigide: tu decizi cum să-ți inventezi propriile joncțiuni.\n\nCând a fost încărcat salvarea, macazurile vechi au fost reconstruite cu aceste piese noi. Semnalele tale au rămas la locul lor și funcționează exact ca înainte. Trenurile nu au observat nimic."
huHU = "<b>Üdvözlünk a Choo!Choo! 2.0-ban!</b>\n\n„Adj egy egyenes és egy ívet, és összekötöm a világot.\" —Ol' Kazko\n\nKét sín mostantól ugyanazon a mezőn is osztozhat. Ha ívet teszel egyenesre, máris váltót építettél. Nincsenek többé merev kereszteződések: rajtad áll, hogy saját elágazásokat találj ki.\n\nAmikor a mentésed betöltődött, a régi váltóidat újjáépítették ezekkel az új elemekkel. A jelzőid a helyükön maradtak, és ugyanúgy működnek, mint korábban. A vonatok semmit sem vettek észre."
arSA = "<b>مرحبًا بك في Choo!Choo! 2.0!</b>\n\n\"أعطني مسارًا مستقيمًا وآخر منحنيًا، وسأربط العالم بأسره.\" —أول كازكو\n\nيمكن الآن لمسارين أن يشتركا في المربع نفسه. ضع منحنى فوق مسار مستقيم، وستكون قد بنيت تحويلة. لم تعد هناك تقاطعات جامدة: الأمر متروك لك لابتكار تقاطعاتك الخاصة.\n\nعند تحميل حفظك، أُعيد بناء تحويلاتك القديمة بهذه القطع الجديدة. بقيت إشاراتك في مكانها وتعمل كما كانت من قبل. لم يلاحظ القطار أي شيء."

