["Tobbert.TrackRIntersection2x3.Description"]
raw = "A switch that lets trains change from one track to another. Its gentle curve lets trains keep a higher speed."
status = "normal"
enUS = "A switch that lets trains change from one track to another. Its gentle curve allows trains to maintain a higher speed."
zhCN = "“一个让火车从一条轨道切换到另一条轨道的道岔。它的柔和曲线让火车保持更高的速度。”"
zhTW = "「一個讓火車從一條軌道轉換到另一條的轉轍器。它的柔和曲線使火車能夠保持較高的速度。」"
ruRU = "Выключатель, который позволяет поездам переключаться с одного пути на другой. Его плавный изгиб позволяет поездам сохранять более высокую скорость."
jaJP = "「列車が1つの線路から別の線路に切り替えることができるポイントです。その緩やかなカーブにより、列車はより高い速度を維持できます。」"
frFR = "Un aiguillage qui permet aux trains de passer d'une voie à une autre. Sa courbe douce permet aux trains de conserver une vitesse plus élevée."
deDE = "Ein Weiche, die es Zügen ermöglicht, von einem Gleis auf ein anderes zu wechseln. Ihre sanfte Kurve ermöglicht es den Zügen, eine höhere Geschwindigkeit beizubehalten."
plPL = "Przełącznik, który pozwala pociągom zmieniać tor z jednego na drugi. Jego łagodny zakręt pozwala pociągom utrzymać wyższą prędkość."
ptBR = "Uma bifurcação que permite que os trens mudem de uma pista para outra. Sua curva suave permite que os trens mantenham uma velocidade maior."
koKR = "기차가 한 선로에서 다른 선로로 변경할 수 있게 해주는 스위치입니다. 부드러운 곡선 덕분에 기차는 더 높은 속도를 유지할 수 있습니다."
trTR = "Trenlerin bir raydan diğerine geçmesine olanak tanıyan bir anahtar. Yumuşak eğimi, trenlerin daha yüksek bir hızda devam etmesine olanak sağlar."
esES = "Un cambio de vía que permite a los trenes pasar de una vía a otra. Su curva suave permite que los trenes mantengan una velocidad mayor."
itIT = "Uno scambio che permette ai treni di passare da un binario all'altro. La sua curva dolce consente ai treni di mantenere una velocità più elevata."
ukUA = "Стрілка, що дозволяє потягам переходити з однієї колії на іншу. Її плавна крива дає змогу потягам зберігати вищу швидкість."
thTH = "ตัวสลับรางที่ให้รถไฟเปลี่ยนจากรางหนึ่งไปยังอีกรางหนึ่ง ทางโค้งที่ลาดนุ่มช่วยให้รถไฟรักษาความเร็วที่สูงขึ้นได้"
csCZ = "Přepínač, který umožňuje vlakům přecházet z jedné trati na druhou. Jeho mírná křivka umožňuje vlakům udržet vyšší rychlost."
viVN = "Một công tắc cho phép tàu hoả chuyển từ đường ray này sang đường ray khác. Đường cong nhẹ nhàng của nó giúp tàu giữ tốc độ cao hơn."
caES = "Un aiguilla que permet als trens canviar d'una via a una altra. La seva corba suau permet que els trens mantinguin una velocitat més alta."
beBY = "Стрэлка, якая дазваляе цягнікам пераходзіць з аднаго шляху на другі. Яе плаўны выгін дазваляе цягнікам утрымліваць больш высокую хуткасць."
roRO = "Un comutator care permite trenurilor să treacă de pe o linie pe alta. Curba sa lină permite trenurilor să mențină o viteză mai mare."
huHU = "Egy váltó, amely lehetővé teszi a vonatok számára, hogy egyik sínről a másikra térjenek át. Enyhe íve révén a vonatok nagyobb sebességet tarthatnak."
arSA = "تحويلة تتيح للقطارات الانتقال من مسار إلى آخر. انحناؤها اللطيف يسمح للقطارات بالحفاظ على سرعة أعلى."

