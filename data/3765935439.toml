["Tobbert.TrackCorner2x2.Description"]
raw = "A wider track piece that sweeps trains around a gentler corner. Gentler curves let trains keep a higher speed."
status = "normal"
enUS = "A wider track piece that sweeps trains around a gentler corner. Gentler curves let trains keep a higher speed."
zhCN = "一段更宽的轨道，可以使列车缓慢转弯。较为平缓的曲线让列车保持更高的速度。"
zhTW = "一個更寬的軌道部件，可以讓列車在較為緩和的彎道中轉彎。較為平緩的曲線使列車能保持更高的速度。"
ruRU = "Широкий элемент пути, который позволяет поездам проходить более плавные повороты. Более мягкие изгибы позволяют поездам поддерживать большую скорость."
jaJP = "より広いトラック部品で、列車が緩やかなコーナーを曲がることができます。緩やかなカーブは、列車がより高い速度を維持できるようにします。"
frFR = "Un morceau de voie plus large qui permet aux trains de prendre un virage plus doux. Des courbes plus douces permettent aux trains de conserver une vitesse plus élevée."
deDE = "Ein breiteres Gleisstück, das Züge um eine sanftere Kurve führt. Sanftere Kurven ermöglichen es Zügen, eine höhere Geschwindigkeit beizubehalten."
plPL = "Szerszy element toru, który łagodnie prowadzi pociągi wokół mniej stromej zakrętu. Łagodniejsze krzywe pozwalają pociągom utrzymać wyższą prędkość."
ptBR = "Um trecho de trilho mais largo que permite que os trens façam uma curva mais suave. Curvas mais suaves permitem que os trens mantenham uma velocidade maior."
koKR = "더 넓은 트랙 조각으로 기차가 부드러운 코너를 돌 수 있습니다. 부드러운 곡선은 기차가 더 높은 속도를 유지하도록 도와줍니다."
csCZ = "Širší kolejový díl, který ohýbá vlaky kolem jemnější zatáčky. Jemnější zakřivení umožňuje vlakům udržet vyšší rychlost."
viVN = "Một đoạn đường ray rộng hơn giúp tàu chạy quanh một khúc cua nhẹ nhàng hơn. Những đường cong nhẹ nhàng cho phép tàu duy trì tốc độ cao hơn."
trTR = "Trenleri daha hafif bir köşeden geçiren daha geniş bir ray parçası. Daha yumuşak kavisler trenlerin daha yüksek hızda kalmasına olanak tanır."

