["Tobbert.TrackXIntersection3x3.Description"]
raw = "A larger X-shaped intersection where four tracks meet. Its gentler curves let trains keep a higher speed."
status = "normal"
enUS = "A larger X-shaped intersection where four tracks meet. Its gentler curves let trains keep a higher speed."
zhCN = "一个更大的X型交叉口，四条轨道在此交汇。其更加温和的曲线使火车能够保持更高的速度。"
zhTW = "一個較大的 X 形交叉口，四條軌道在此匯聚。其較柔和的曲線使火車能夠保持更高的速度。"
ruRU = "Большее перекресток в форме X, где встречаются четыре пути. Его более плавные повороты позволяют поездам поддерживать более высокую скорость."
jaJP = "「四つの線路が交わる大きなX型交差点。緩やかなカーブにより、列車はより高い速度を維持できます。」"
frFR = "Une plus grande intersection en forme de X où quatre pistes se rencontrent. Ses courbes plus douces permettent aux trains de maintenir une vitesse plus élevée."
deDE = "Eine größere, X-förmige Kreuzung, an der vier Gleise zusammentreffen. Ihre sanfteren Kurven ermöglichen es den Zügen, eine höhere Geschwindigkeit beizubehalten."
plPL = "Większe skrzyżowanie w kształcie X, gdzie spotykają się cztery tory. Jego łagodniejsze zakręty pozwalają pociągom utrzymać wyższą prędkość."
ptBR = "Uma interseção em forma de X maior onde quatro trilhos se encontram. Suas curvas mais suaves permitem que os trens mantenham uma velocidade mais alta."
koKR = "네 개의 선로가 만나는 더 큰 X자형 교차로. 부드러운 곡선 덕분에 기차가 더 높은 속도를 유지할 수 있습니다."
trTR = "Üç yoldağın bir araya geldiği daha büyük bir X şeklindeki kavşak. Daha yumuşak eğimleri, trenlerin daha yüksek hızda gitmesine olanak tanır."
esES = "Una intersección en forma de X más grande, donde se cruzan cuatro vías. Sus curvas más suaves permiten que los trenes mantengan una velocidad mayor."
itIT = "Un incrocio a X più grande, dove quattro binari si incontrano. Le sue curve più dolci permettono ai treni di mantenere una velocità più elevata."
ukUA = "Більший перехрестя у формі X, де з'єднуються чотири колії. Його пологіші криві дозволяють потягам підтримувати вищу швидкість."
thTH = "ทางแยกรูปตัวเอกซ์ขนาดใหญ่กว่า ซึ่งเป็นจุดที่รางทั้งสี่สายมาบรรจบกัน โค้งที่นุ่มนวลกว่าทำให้รถไฟสามารถรักษาความเร็วที่สูงขึ้นได้"
csCZ = "Větší křižovatka ve tvaru X, kde se setkávají čtyři koleje. Její mírnější zatáčky umožňují vlakům udržovat vyšší rychlost."
viVN = "Một giao lộ hình chữ X lớn hơn nơi bốn đường ray gặp nhau. Những đường cong nhẹ nhàng hơn cho phép tàu giữ tốc độ cao hơn."
caES = "Una intersecció en forma de X més gran on es troben quatre vies. Les seves corbes més suaus permeten que els trens mantinguin una velocitat més alta."
beBY = "Большая X-образная развязка, где сходятся четыре пути. Её более пологие повороты позволяют поездам сохранять более высокую скорость."
roRO = "O intersecție în formă de X, mai mare, unde se întâlnesc patru linii de cale ferată. Curbele sale mai line permit trenurilor să mențină o viteză mai mare."
huHU = "Nagyobb, X alakú kereszteződés, ahol négy sín találkozik. Enyhébb ívei lehetővé teszik, hogy a vonatok nagyobb sebességgel haladjanak."
arSA = "تقاطع أكبر على شكل حرف X تلتقي فيه أربعة مسارات. تتيح منحنياته الأكثر انحداراً للقطارات الحفاظ على سرعة أعلى."

