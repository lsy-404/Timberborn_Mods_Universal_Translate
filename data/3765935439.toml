["Tobbert.ExchangeStation.Description"]
status = "normal"
raw = "Balances goods between districts connected by rail, following their distribution settings. Beavers also use it to migrate from one district to another."
enUS = "Balances goods between districts connected by rail according to their distribution settings. Beavers also use it to migrate from one district to another."
zhCN = "根据各区的分配设置，在铁路连接的区域之间平衡物资。海狸也会通过它从一个区域迁移到另一个区域。"
zhTW = "在相連的鐵路區域之間，依照各自的分配設定平衡貨物。海狸也會利用它從一個區域遷移到另一個區域。"
ruRU = "Балансирует товары между районами, соединёнными железной дорогой, согласно настройкам распределения. Бобры также используют станцию, чтобы переселяться из одного района в другой."
jaJP = "鉄道で接続された地区間で、各地区の分配設定に従って物資を調整します。ビーバーは、ある地区から別の地区へ移住する際にもこれを利用します。"
frFR = "Équilibre les marchandises entre les districts reliés par le rail, en suivant leurs paramètres de distribution. Les castors l’utilisent aussi pour migrer d’un district à un autre."
deDE = "Gleicht Waren zwischen per Schiene verbundenen Bezirken gemäß ihren Verteilungseinstellungen aus. Biber nutzen sie außerdem, um von einem Bezirk in einen anderen zu ziehen."
plPL = "Równoważy zapasy towarów między dzielnicami połączonymi koleją, zgodnie z ustawieniami dystrybucji. Bobry korzystają z niego również, by migrować między dzielnicami."
ptBR = "Equilibra os bens entre distritos conectados por trilhos, seguindo as configurações de distribuição. Os castores também a usam para migrar de um distrito para outro."
koKR = "철도로 연결된 지구 간에 각 지구의 분배 설정에 따라 물자를 균형 있게 분배합니다. 비버가 한 지구에서 다른 지구로 이주할 때도 이용합니다."
csCZ = "Vyrovnává zásoby mezi okresy propojenými železnicí podle jejich nastavení distribuce. Bobři ho také využívají k přesunu z jednoho okresu do druhého."
viVN = "Cân bằng hàng hóa giữa các khu được kết nối bằng đường ray, theo cài đặt phân phối của chúng. Hải ly cũng dùng nó để di cư từ khu này sang khu khác."
trTR = "Demiryoluyla birbirine bağlanan bölgeler arasında, dağıtım ayarlarına göre malların dengesini sağlar. Kunduzlar ayrıca bir bölgeden diğerine göç etmek için burayı kullanır."

