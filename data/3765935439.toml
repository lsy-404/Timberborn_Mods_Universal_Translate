["Tobbert.GoodsStationWarehouseSmall.Description"]
raw = "A warehouse placed against a Goods Station, or under it, to grant it extra goods slots — each slot lets the station stock one more kind of goods. Holds no goods of its own."
status = "normal"
enUS = "A warehouse placed next to or under a Goods Station to give it extra goods slots—each slot lets the station stock one more type of goods. Holds no goods of its own."
zhCN = "放置在货物站旁边或下方的仓库，可为货物站增加货物槽位——每个槽位让货物站多储存一种货物。自身不储存任何货物。"
zhTW = "緊鄰貨物站或置於其下方的倉庫，可為貨物站增加貨物欄位——每個欄位可讓貨物站多存放一種貨物。自身不存放任何貨物。"
ruRU = "Склад, размещённый вплотную к грузовой станции или под ней, добавляет ей ячейки для товаров — каждая ячейка позволяет хранить на станции ещё один вид товаров. Сам по себе не хранит товары."
jaJP = "物資ステーションに隣接またはその下に設置すると、物資スロットを追加できます。各スロットにより、ステーションが扱える物資の種類が1つ増えます。この倉庫自体は物資を保管しません。"
frFR = "Un entrepôt placé contre une gare de marchandises ou en dessous, pour lui ajouter des emplacements de stockage de marchandises — chaque emplacement permet à la gare de stocker un type de marchandise supplémentaire. Ne stocke aucune marchandise lui-même."
deDE = "Ein Lagerhaus, das neben oder unter einer Warenstation platziert wird, um ihr zusätzliche Warenplätze zu gewähren – jeder Platz ermöglicht es der Station, eine weitere Warenart zu lagern. Lagert selbst keine Waren."
plPL = "Magazyn umieszczony przy Stacji Towarowej lub pod nią, aby zapewnić jej dodatkowe miejsca na towary — każde miejsce pozwala stacji przechowywać jeden dodatkowy rodzaj towaru. Sam nie przechowuje żadnych towarów."
ptBR = "Um armazém colocado encostado a uma Estação de Mercadorias ou embaixo dela para conceder a ela espaços extras para mercadorias — cada espaço permite que a estação armazene mais um tipo de mercadoria. Não armazena mercadorias próprias."
koKR = "상품 역에 맞대거나 아래에 배치하면 상품 슬롯을 추가해 주는 창고입니다. 슬롯 하나마다 역에 더 많은 종류의 상품을 비축할 수 있습니다. 창고 자체에는 상품을 저장하지 않습니다."
trTR = "Malzeme İstasyonu'nun yanına veya altına yerleştirildiğinde ona ek mal türü yuvaları sağlar; her yuva istasyonun bir tür daha fazla mal stoklamasına olanak tanır. Kendisi hiçbir mal depolamaz."
esES = "Un almacén colocado junto a una Estación de mercancías, o debajo de ella, para concederle ranuras de mercancías adicionales; cada ranura permite a la estación almacenar un tipo más de mercancía. No contiene mercancías por sí mismo."
itIT = "Un magazzino posizionato accanto a una Stazione Merci, o sotto di essa, per concederle slot merci aggiuntivi: ogni slot permette alla stazione di immagazzinare un tipo di merce in più. Non contiene merci proprie."
ukUA = "Склад, розміщений поруч із Товарною станцією або під нею, щоб збільшити кількість її товарних слотів — кожен слот дозволяє станції зберігати ще один вид товарів. Власних товарів не зберігає."
thTH = "คลังสินค้าที่วางติดกับสถานีสินค้า หรืออยู่ใต้สถานีสินค้า เพื่อเพิ่มช่องสินค้าให้สถานีนั้น โดยแต่ละช่องทำให้สถานีจัดเก็บสินค้าได้เพิ่มอีกหนึ่งประเภท ตัวคลังไม่เก็บสินค้าใดๆ ด้วยตัวเอง"
csCZ = "Sklad umístěný vedle nebo pod Stanicí zboží jí přidává další sloty na zboží — každý slot umožňuje stanici skladovat jeden další druh zboží. Sám o sobě žádné zboží neskladuje."
viVN = "Một nhà kho được đặt sát bên hoặc bên dưới Ga Hàng hóa để bổ sung chỗ chứa hàng cho ga — mỗi chỗ cho phép ga lưu trữ thêm một loại hàng hóa. Bản thân nhà kho không chứa hàng hóa nào."
caES = "Un magatzem situat al costat d'una Estació de mercaderies, o per sota, per donar-li ranures de mercaderies addicionals; cada ranura permet que l'estació emmagatzemi un tipus més de mercaderia. No conté mercaderies pròpies."
beBY = "Склад, які змяшчаецца побач з Станцыяй тавараў або пад ёй, дае ёй дадатковыя слоты для тавараў: кожны слот дазваляе станцыі захоўваць яшчэ адзін від тавараў. Сам па сабе тавараў не захоўвае."
roRO = "Un depozit amplasat lângă o Stație de mărfuri sau sub aceasta, pentru a-i acorda sloturi suplimentare de mărfuri — fiecare slot permite stației să stocheze încă un tip de marfă. Nu deține niciun fel de marfă propriu."
huHU = "A Goods Station mellé vagy alá helyezett raktár, amely extra áruhelyeket biztosít számára – minden hely lehetővé teszi, hogy az állomás még egy fajta árut tároljon. Saját árut nem tárol."
arSA = "مستودع يُوضع بجوار محطة البضائع أو أسفلها ليمنحها خانات بضائع إضافية، حيث تتيح كل خانة للمحطة تخزين نوع إضافي واحد من البضائع. لا يحتوي على أي بضائع خاصة به."

