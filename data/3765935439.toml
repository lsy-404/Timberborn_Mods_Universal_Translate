["Tobbert.TrainYard.Description"]
raw = "Builds trains and doubles as a fuel depot. Keep it stocked with logs and water so dry trains can come here to refuel."
status = "normal"
enUS = "Builds trains and serves as a fuel depot. Keep it stocked with logs and water so dry trains can come here to refuel."
zhCN = "“建造火车并兼作燃料仓库。保持木材和水的供应，以便干燥的火车可以来这里加油。”"
zhTW = "「建造火車並兼作燃料倉庫。保持有足夠的原木和水，以便乾燥的火車可以來這裡加油。」"
ruRU = "Строит поезда и также выполняет роль топливного склада. Держите его заполненным бревнами и водой, чтобы сухие поезда могли заправляться здесь."
jaJP = "列車と燃料補給所の両方の役割を持つ施設です。乾燥した列車がここで燃料を補給できるよう、丸太と水を常に補充しておきましょう。"
frFR = "Construit des trains et fait également office de dépôt de carburant. Gardez-le approvisionné en bûches et en eau afin que les trains à sec puissent venir ici faire le plein."
deDE = "Baut Züge und dient gleichzeitig als Brennstoffdepot. Halten Sie es mit Holz und Wasser gefüllt, damit trockene Züge hier tanken können."
plPL = "Buduje pociągi i pełni funkcję magazynu paliwa. Utrzymuj je w zapasie z pochodniami i wodą, aby suche pociągi mogły przyjeżdżać tutaj na tankowanie."
ptBR = "Constrói trens e também serve como um depósito de combustível. Mantenha abastecido com toras e água para que trens secos possam vir aqui reabastecer."
koKR = "기차를 만들고 연료 창고로도 사용됩니다. 나무와 물을 비축해 두어야 마른 기차들이 여기에 와서 연료를 보충할 수 있습니다."
csCZ = "Staví vlaky a zároveň slouží jako palivová stanice. Udržujte ji zásobenou kmeny a vodou, aby sem mohly přijet suché vlaky na dotankování."
viVN = "Xây dựng tàu hỏa và đồng thời là kho nhiên liệu. Giữ cho nó được cung cấp đầy gỗ và nước để những tàu hỏa khô có thể đến đây tiếp nhiên liệu."
trTR = "İkiz trenler inşa eder ve yakıt deposu olarak da hizmet verir. Kuru trenlerin buraya akaryakıt alması için odun ve su ile doldurulmasını sağlayın."

