itIT = "Completa il cantiere in cui si trova, torna a un deposito di costruzione e vi rimane. Premi di nuovo per rimandarlo al lavoro."
ukUA = "Завершує ділянку, на якій перебуває, повертається до будівельного депо і залишається там. Натисніть ще раз, щоб відправити його назад до роботи."
thTH = "เสร็จสิ้นงานก่อสร้างในพื้นที่ที่อยู่ตอนนี้ จากนั้นกลับไปยังลานก่อสร้างและอยู่ที่นั่น กดอีกครั้งเพื่อส่งกลับไปทำงาน"
csCZ = "Dokončí stavbu, na které právě pracuje, vrátí se na staveniště a zůstane tam. Dalším stisknutím ho pošlete zpět do práce."
viVN = "Hoàn tất công trình đang thi công, quay về bãi xây dựng và ở lại đó. Nhấn lại để đưa nó trở lại làm việc."
caES = "Acaba el lloc on es troba, torna a un pati de construcció i s'hi queda. Torna a prémer per tornar-lo a posar a treballar."
beBY = "Завяршае ўчастак, на якім знаходзіцца, вяртаецца ў будаўнічы двор і застаецца там. Націсніце яшчэ раз, каб адправіць яго назад на працу."
roRO = "Termină șantierul pe care se află, apoi se întoarce la un depou de construcție și rămâne acolo. Apasă din nou pentru a-l trimite înapoi la lucru."
huHU = "Befejezi a helyszínt, ahol éppen van, majd visszatér egy építkezési telepre, és ott is marad. Újra megnyomva visszaküldi munkára."
arSA = "يُكمل العمل في الموقع الذي يوجد فيه، ثم يعود إلى ساحة البناء ويبقى هناك. اضغط مرة أخرى لإعادته إلى العمل."

