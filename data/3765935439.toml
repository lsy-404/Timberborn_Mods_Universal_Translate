jaJP = "物資ステーションに隣接させて設置すると、物資スロットを追加できるサイロです。各スロットにより、ステーションが保管できる物資の種類が1つ増えます。このサイロ自体は物資を保管しません。"
frFR = "Un silo placé contre une station de marchandises pour lui ajouter des emplacements de marchandises — chaque emplacement permet à la station de stocker un type de marchandises supplémentaire. Ne stocke aucune marchandise lui-même."
deDE = "Ein Silo, das an einer Warenstation platziert wird, um ihr zusätzliche Warenplätze zu gewähren – jeder Platz ermöglicht es der Station, eine weitere Warenart zu lagern. Lagert selbst keine Waren ein."
plPL = "Silos umieszczony przy Stacji Towarowej, aby zapewnić jej dodatkowe miejsca na towary — każde miejsce pozwala stacji przechowywać jeszcze jeden rodzaj towaru. Sam nie przechowuje żadnych towarów."
ptBR = "Um silo colocado junto a uma Estação de Mercadorias para conceder a ela espaços extras para mercadorias — cada espaço permite que a estação estoque mais um tipo de mercadoria. Não armazena mercadorias por conta própria."
koKR = "물품 기지에 붙여 배치해 추가 물품 슬롯을 제공하는 사일로입니다. 슬롯 하나마다 기지에 물품 종류를 하나 더 비축할 수 있습니다. 자체적으로는 물품을 보관하지 않습니다."
trTR = "Mal İstasyonu’na bitişik yerleştirilerek ona ek eşya yuvaları kazandıran bir silo — her yuva, istasyonun bir eşya türünü daha stoklamasını sağlar. Kendi içinde eşya depolamaz."
esES = "Un silo colocado junto a una Estación de Mercancías para concederle ranuras de mercancías adicionales; cada ranura permite que la estación almacene un tipo más de mercancía. No guarda ninguna mercancía por sí mismo."
itIT = "Un silo posizionato accanto a una Stazione Merci per aggiungere slot merci extra: ogni slot permette alla stazione di immagazzinare un tipo di merce in più. Non contiene merci proprie."
ukUA = "Силос, розміщений біля Складу товарів, щоб додати йому додаткові слоти для товарів: кожен слот дозволяє станції зберігати ще один вид товарів. Сам не зберігає жодних товарів."
thTH = "ไซโลที่วางติดกับสถานีสินค้าเพื่อเพิ่มช่องเก็บสินค้าให้สถานี โดยแต่ละช่องช่วยให้สถานีเก็บสินค้าได้เพิ่มอีกหนึ่งประเภท ตัวไซโลเองไม่เก็บสินค้าใด ๆ"
csCZ = "Silo umístěné u Zbožové stanice, které jí poskytne další sloty pro zboží — každý slot umožňuje stanici skladovat o jeden druh zboží více. Samo žádné zboží neskladuje."
viVN = "Một silo đặt sát Ga Hàng Hóa để bổ sung ô chứa hàng cho ga — mỗi ô cho phép ga lưu kho thêm một loại hàng hóa. Bản thân silo không chứa hàng hóa."
caES = "Un silo col·locat contra una Estació de Mercaderies per donar-li ranures de mercaderies addicionals; cada ranura permet que l'estació emmagatzemi un tipus més de mercaderia. No conté cap mercaderia pròpia."
beBY = "Сілас, які размяшчаецца побач з Станцыяй тавараў, дае ёй дадатковыя слоты для тавараў: кожны слот дазваляе станцыі захоўваць яшчэ адзін від тавараў. Сам сілас тавараў не захоўвае."
roRO = "Un siloz amplasat lângă o Stație de Mărfuri pentru a-i oferi sloturi suplimentare de marfă — fiecare slot permite stației să depoziteze încă un tip de marfă. Nu deține niciun fel de marfă propriu."
huHU = "Egy siló, amelyet egy Áruállomáshoz illesztenek, hogy extra áruhelyet biztosítson neki – minden hely lehetővé teszi, hogy az állomás még egy áruféleséget tároljon. Saját árut nem tárol."
arSA = "صومعة تُوضع بجوار محطة بضائع لمنحها فتحات بضائع إضافية، حيث تتيح كل فتحة للمحطة تخزين نوع إضافي من البضائع. لا تحتفظ بأي بضائع بذاتها."

