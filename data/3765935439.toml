["Tobbert.TrackLineTool.Prompt"]
raw = "Drag to lay a line of one-way track. Turn once to add a junction. Press R or Shift+R to cycle the junction piece (corner / T / crossing)."
status = "abandoned"
enUS = "Drag to lay a line of one-way track. Turn once to add a junction. Press R or Shift+R to cycle the junction piece (corner / T / crossing)."
zhCN = "拖动以铺设单向轨道。旋转一次以添加交叉口。按 R 或 Shift+R 来循环交叉口组件（拐角 / T形 / 交叉口）。"
zhTW = "拖曳以鋪設單行軌道。轉動一次以添加交叉口。按 R 或 Shift+R 來循環交叉口件（轉角 / T 型 / 十字路口）。"
ruRU = "Перетащите, чтобы проложить линию однопутного пути. Поверните один раз, чтобы добавить соединение. Нажмите R или Shift+R, чтобы переключать элементы соединения (угол / Т / пересечение)."
jaJP = "「一方通行のレールを敷くにはドラッグしてください。交差点を追加するには一度回転させます。交差点のパーツ（コーナー / T / 交差点）をサイクルするにはRまたはShift+Rを押してください。」"
frFR = "Faites glisser pour poser une voie de chemin de fer à sens unique. Tournez une fois pour ajouter une jonction. Appuyez sur R ou Shift+R pour faire défiler le morceau de jonction (coin / T / croisement)."
deDE = "Ziehe, um eine Strecke für eine Richtung zu verlegen. Drehe einmal, um eine Kreuzung hinzuzufügen. Drücke R oder Shift+R, um das Kreuzungsteil (Ecke / T / Übergang) zu wechseln."
plPL = "Przeciągnij, aby położyć linię toru jednokierunkowego. Ob Turnuj raz, aby dodać zjazd. Naciśnij R lub Shift+R, aby zmieniać element zjazdu (zakręt / T / skrzyżowanie)."
ptBR = "Arraste para colocar uma linha de trilho unidirecional. Vire uma vez para adicionar uma junção. Pressione R ou Shift+R para alternar o segmento da junção (canto / T / cruzamento)."
koKR = "한 방향 트랙을 놓으려면 드래그하세요. 교차로를 추가하려면 한 번 회전하세요. R 또는 Shift+R을 눌러 교차로 조각(코너 / T / 교차로)을 순환하세요."
trTR = "Tek yönlü ray serermek için sürükleyin. Bir kavşak eklemek için bir kez döndürün. Kavşak parçasını (köşe / T / geçiş) döngüye almak için R veya Shift+R tuşlarına basın."
esES = "Arrastra para trazar una línea de vía de sentido único. Gira una vez para añadir un cruce. Pulsa R o Mayús+R para cambiar la pieza del cruce (curva / T / cruce recto)."
itIT = "Trascina per tracciare una linea di binario a senso unico. Ruota una volta per aggiungere uno scambio. Premi R o Maiusc+R per scorrere i pezzi dello scambio (curva / a T / incrocio)."
ukUA = "Перетягніть, щоб прокласти лінію односторонньої колії. Один раз клацніть, щоб додати перехрестя. Натисніть R або Shift+R, щоб перемикати тип перехрестя (поворот / Т-подібне / хрестовина)."
thTH = "ลากเพื่อวางเส้นทางแบบทิศทางเดียว หมุนหนึ่งครั้งเพื่อเพิ่มทางแยก กด R หรือ Shift+R เพื่อสลับชิ้นส่วนทางแยก (มุม / ตัว T / ทางข้าม)"
csCZ = "Táhněte pro položení jednosměrné kolejnice. Otočte jednou pro přidání křižovatky. Stiskněte R nebo Shift+R pro cyklování kusu křižovatky (roh / T / křížení)."
viVN = "Kéo để đặt một đoạn đường ray một chiều. Xoay một lần để thêm một điểm giao nhau. Nhấn R hoặc Shift+R để xoay phần giao nhau (góc / T / giao lộ)."
caES = "Arrossega per traçar una línia de via d'un sentit. Gira una vegada per afegir un encreuament. Prem R o Shift+R per canviar la peça d'encreuament (corba / en T / creuament)."
beBY = "Перацягніце, каб пракласці лінію аднабаковых рэек. Націсніце адзін раз, каб дадаць развілку. Націсніце R або Shift+R, каб перайсці паміж тыпамі развілкі (паварот / Т-падобная / перакрыжаванне)."
roRO = "Trageți pentru a trasa o linie de șină cu sens unic. Rotiți o dată pentru a adăuga o joncțiune. Apăsați R sau Shift+R pentru a schimba tipul piesei de joncțiune (colț / T / încrucișare)."
huHU = "Húzással egyirányú sínvonalat húzhatsz. Egyszer kattintva elágazást adhatsz hozzá. Az R vagy a Shift+R megnyomásával válthatsz az elágazási elemek között (sarok / T / kereszteződés)."
arSA = "اسحب لرسم خط من مسار أحادي الاتجاه. انقر مرة واحدة لإضافة تقاطع. اضغط R أو Shift+R للتنقل بين قطع التقاطع (منعطف / T / تقاطع متصالب)."

