["Tobbert.SwingFloodgate.Description"]
raw = "A dam on a hinge. Closed, it holds the water back and bars the way; open, it swings aside and lets the river run."
status = "normal"
enUS = "A dam on a hinge. When closed, it holds back the water and blocks the way; when open, it swings aside and lets the river flow."
zhCN = "铰接式堤坝。关闭时，它能拦住水流并阻断通道；打开时，它会摆到一旁，让河水流过。"
zhTW = "裝在鉸鏈上的水壩。關閉時，它會擋住水流和去路；打開時，它會向旁邊擺開，讓河水流過。"
ruRU = "Плотина на шарнире. В закрытом состоянии она удерживает воду и преграждает путь; в открытом — откидывается в сторону и пропускает течение реки."
jaJP = "蝶番付きのダム。閉じると水をせき止め、通路をふさぐ。開くと脇へ回転し、川の流れを通す。"
frFR = "Un barrage sur une charnière. Fermé, il retient l’eau et bloque le passage ; ouvert, il pivote sur le côté et laisse couler la rivière."
deDE = "Ein Damm mit Scharnier. Geschlossen hält er das Wasser zurück und versperrt den Weg; geöffnet schwenkt er zur Seite und lässt den Fluss fließen."
plPL = "Zapora na zawiasie. Zamknięta zatrzymuje wodę i blokuje przejście; otwarta odchyla się na bok i pozwala rzece płynąć."
ptBR = "Uma represa com dobradiça. Fechada, segura a água e bloqueia a passagem; aberta, gira para o lado e deixa o rio correr."
koKR = "경첩이 달린 댐입니다. 닫으면 물을 가두고 길을 막으며, 열면 옆으로 젖혀져 강물이 흐르게 합니다."
trTR = "Menteşeli bir baraj. Kapalıyken suyu tutar ve geçişi engeller; açıkken yana doğru döner ve nehrin akmasına izin verir."
esES = "Una presa sobre una bisagra. Cerrada, retiene el agua y bloquea el paso; abierta, se aparta y deja que el río fluya."
itIT = "Una diga incernierata. Chiusa, trattiene l'acqua e sbarra il passaggio; aperta, si scosta lateralmente e lascia scorrere il fiume."
ukUA = "Гребля на петлі. Зачинена, вона утримує воду і перегороджує шлях; відчинена, вона відхиляється вбік і дає річці текти далі."
thTH = "เขื่อนบานพับ เมื่อปิด มันกั้นน้ำและขวางทาง เมื่อเปิด มันจะแกว่งไปด้านข้างและปล่อยให้แม่น้ำไหลผ่าน"
csCZ = "Hráz na pantu. Zavřená zadržuje vodu a blokuje cestu; otevřená se odklopí a nechá řeku volně téct."
viVN = "Một con đập có bản lề. Khi đóng, nó giữ nước lại và chặn lối đi; khi mở, nó xoay sang bên và để dòng sông chảy qua."
caES = "Una resclosa sobre una frontissa. Tancada, retén l'aigua i barra el pas; oberta, gira a un costat i deixa passar el riu."
beBY = "Плаціна на завесе. Зачыненая, яна ўтрымлівае ваду і перакрывае шлях; адчыненая, яна адыходзіць убок і дазваляе рацэ цячы далей."
roRO = "Un baraj pe balama. Închis, reține apa și blochează trecerea; deschis, se dă la o parte și lasă râul să curgă."
huHU = "Egy zsanéron forgó gát. Zárva visszatartja a vizet, és elzárja az utat; nyitva félrelendül, és hagyja, hogy a folyó továbbfolyjon."
arSA = "سد على مفصل. عندما يكون مغلقًا، يحبس الماء ويسد الطريق؛ وعندما يكون مفتوحًا، يتأرجح جانبًا ويترك النهر يجري."

