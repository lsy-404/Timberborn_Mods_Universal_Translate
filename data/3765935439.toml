jaJP = "物資ステーションの隣または下に設置すると、物資スロットを追加できる倉庫です。各スロットにより、ステーションが保管できる物資の種類が1つ増えます。この倉庫自体は物資を保管しません。"
frFR = "Un entrepôt placé contre une station de marchandises ou en dessous de celle-ci lui accorde des emplacements supplémentaires pour les marchandises — chaque emplacement permet à la station de stocker un type de marchandises supplémentaire. Ne stocke aucune marchandise lui-même."
deDE = "Ein Lagerhaus, das direkt neben oder unter einer Güterstation platziert wird, um ihr zusätzliche Warenplätze zu geben – jeder Platz ermöglicht es der Station, eine weitere Warenart zu lagern. Lagert selbst keine Waren."
plPL = "Magazyn umieszczony przy Stacji Towarowej lub pod nią, aby zapewnić jej dodatkowe miejsca na towary — każde miejsce pozwala stacji przechowywać jeszcze jeden rodzaj towarów. Sam nie przechowuje żadnych towarów."
ptBR = "Um armazém colocado junto a uma Estação de Mercadorias ou embaixo dela para conceder a ela espaços extras para mercadorias — cada espaço permite que a estação estoque mais um tipo de mercadoria. Não armazena mercadorias por conta própria."
koKR = "상품 운송소에 맞닿거나 그 아래에 배치해 추가 상품 슬롯을 제공하는 창고입니다. 슬롯마다 운송소가 비축할 수 있는 상품 종류가 하나씩 늘어납니다. 자체적으로는 상품을 저장하지 않습니다."
csCZ = "Sklad umístěný vedle nebo pod stanicí zboží jí poskytne další sloty pro zboží — každý slot umožní stanici skladovat jeden další druh zboží. Sám žádné zboží neskladuje."
viVN = "Kho hàng được đặt sát hoặc bên dưới Ga Hàng Hóa để cấp thêm ô hàng hóa — mỗi ô cho phép nhà ga dự trữ thêm một loại hàng hóa. Bản thân kho không chứa hàng hóa nào."
