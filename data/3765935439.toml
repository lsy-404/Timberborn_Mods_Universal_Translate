zhCN = "放置在货物站旁边或下方的仓库，可为货物站增加货物槽位——每个槽位可让货物站多储存一种货物。自身不储存任何货物。"
zhTW = "放置在貨物站旁邊或下方的倉庫，可為貨物站增加貨物欄位——每個欄位都能讓貨物站多存放一種貨物。自身不存放任何貨物。"
