["Tobbert.GoodsStation.Description"]
raw = "Loads and unloads goods carried by trains. Set, good by good, what the station sends and what it receives; workers take from and drop off at it directly, while haulers shuttle goods to and from the district's storage."
status = "normal"
enUS = "Loads and unloads goods carried by trains. Set, for each good, what the station sends and receives; workers take goods from and drop them off at the station directly, while haulers shuttle goods to and from the district's storage."
zhCN = "装卸火车运输的货物。逐项设置车站发送和接收的货物；工人直接从车站取货或将货物送到车站，而搬运工则在车站与区划仓库之间运送货物。"
zhTW = "裝載和卸卸火車運送的貨物。可逐項設定車站要發送和接收哪些貨物；工人會直接從車站取貨或送貨，而搬運工則在車站和區域倉庫之間運送貨物。"
ruRU = "Загружает и разгружает товары, перевозимые поездами. Для каждого товара задайте, что станция отправляет и что принимает; рабочие напрямую забирают товары со станции и доставляют их на неё, а грузчики перевозят товары между станцией и хранилищем района."
jaJP = "列車が運ぶ物資を積み降ろします。物資ごとに、駅が送るものと受け取るものを設定できます。作業員は駅へ直接物資を運び込んだり、駅から持ち出したりします。一方、運搬人は地区の保管場所との間で物資を運びます。"
frFR = "Charge et décharge les marchandises transportées par les trains. Définissez, marchandise par marchandise, ce que la station expédie et reçoit ; les ouvriers y déposent directement des marchandises et en prennent, tandis que les transporteurs font la navette entre la station et l’entrepôt du district."
deDE = "Verlädt und entlädt Waren, die von Zügen transportiert werden. Lege für jedes Gut einzeln fest, was der Bahnhof versendet und empfängt. Arbeiter nehmen Waren direkt dort auf und liefern sie dort ab, während Transporteure Waren zum Lager des Bezirks bringen und von dort abholen."
plPL = "Ładuje i rozładowuje towary przewożone pociągami. Ustaw osobno dla każdego towaru, co stacja wysyła, a co przyjmuje. Robotnicy bezpośrednio pobierają towary ze stacji i dostarczają je do niej, a przewoźnicy transportują towary do magazynów w dzielnicy i z powrotem."
ptBR = "Carrega e descarrega mercadorias transportadas por trens. Defina, mercadoria por mercadoria, o que a estação envia e o que recebe; os trabalhadores retiram mercadorias dela e as entregam diretamente nela, enquanto os carregadores transportam mercadorias de e para o armazenamento do distrito."
koKR = "기차가 운반하는 물품을 싣고 내립니다. 물품별로 역에서 내보낼 것과 받을 것을 설정하세요. 일꾼은 물품을 역에서 직접 가져가거나 역에 내려놓고, 운반꾼은 물품을 구역의 저장고와 역 사이로 운반합니다."
trTR = "Trenlerle taşınan malları yükler ve boşaltır. İstasyonun hangi malları gönderip hangilerini alacağını her mal için ayrı ayrı belirleyin; işçiler malları doğrudan istasyondan alıp istasyona bırakırken, taşıyıcılar malları bölgenin depolarına götürüp getirir."
esES = "Carga y descarga los bienes transportados por los trenes. Configura, bien por bien, qué envía y qué recibe la estación; los trabajadores toman y dejan bienes en ella directamente, mientras que los transportistas trasladan bienes entre ella y el almacén del distrito."
itIT = "Carica e scarica le merci trasportate dai treni. Imposta, merce per merce, cosa la stazione invia e cosa riceve; i lavoratori prelevano e depositano direttamente presso di essa, mentre i trasportatori spostano le merci da e verso il magazzino del distretto."
ukUA = "Завантажує та вивантажує товари, які перевозять потяги. Для кожного товару окремо задається, що станція відправляє і що приймає; працівники беруть і залишають вантажі на станції безпосередньо, а візки перевозять товари до сховища району та назад."
thTH = "โหลดและขนถ่ายสินค้าที่รถไฟขนมา กำหนดทีละชนิดสินค้าว่าสถานีจะส่งออกอะไรและรับเข้าอะไร โดยคนงานจะนำสินค้าจากสถานีไปใช้หรือวางสินค้าลงที่สถานีโดยตรง ส่วนผู้ขนส่งจะวิ่งขนสินค้าไปมาระหว่างสถานีกับคลังเก็บของในเขตการจัดการ"
csCZ = "Nakládá a vykládá zboží přepravované vlaky. U každého zboží nastavte, co stanice odesílá a co přijímá; pracovníci zboží přímo odebírají a odkládají ve stanici, zatímco přepravci je převážejí do skladu v okrsku a zpět."
viVN = "Bốc và dỡ hàng hóa được tàu chở đến. Thiết lập riêng cho từng loại hàng hóa xem nhà ga gửi đi và nhận về những gì; công nhân lấy hàng từ nhà ga và giao hàng trực tiếp đến đó, còn người vận chuyển sẽ đưa hàng hóa đến và đi từ kho của khu vực."
caES = "Carrega i descarrega les mercaderies transportades pels trens. Estableix, mercaderia per mercaderia, què envia i què rep l'estació; els treballadors agafen i deixen mercaderies directament a l'estació, mentre que els transportistes fan viatges d'anada i tornada entre l'estació i l'emmagatzematge del districte."
beBY = "Загружае і разгружае тавары, якія перавозяць цягнікі. Для кожнага тавару асобна задаецца, што станцыя адпраўляе і што прымае; працаўнікі бяруць і пакідаюць тавары на станцыі непасрэдна, а перавозчыкі курсіруюць з таварамі да захоўішча раёна і назад."
roRO = "Încarcă și descarcă bunurile transportate de trenuri. Stabiliți, bun cu bun, ce trimite și ce primește stația; lucrătorii iau din ea și depun în ea direct, în timp ce hamalii transportă bunuri între stație și depozitul districtului."
huHU = "Árukat rakodnak és ráznak le a vonatok által szállított árukról. Árufajtánként állítható be, mit küld és mit fogad be az állomás; a munkások közvetlenül innen vesznek el árut és ide szállítanak, míg a szállítók az áruk között közlekednek az állomás és a körzet raktára között."
arSA = "يقوم بتحميل البضائع من القطارات وإنزالها. حدد، بضاعة تلو الأخرى، ما ترسله المحطة وما تستقبله؛ يأخذ العمال منها ويُفرغون فيها مباشرةً، بينما تنقل عربات النقل البضائع ذهابًا وإيابًا من وإلى مخزن المنطقة."

