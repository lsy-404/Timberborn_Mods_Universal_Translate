["Tobbert.GoodsStationWarehouseLarge.Description"]
raw = "A warehouse placed against a Goods Station, or under it, to grant it extra goods slots — each slot lets the station stock one more kind of goods. Holds no goods of its own."
status = "normal"
enUS = "A warehouse placed next to or beneath a Goods Station to give it extra goods slots—each slot lets the station stock one more type of goods. Stores no goods of its own."
zhCN = "放置在货物站旁边或下方的仓库，可为货物站增加货物槽位——每个槽位让货物站多储存一种货物。自身不储存任何货物。"
zhTW = "將倉庫放在貨物站旁邊或下方，可為貨物站增加貨物欄位——每個欄位都能讓貨物站多儲存一種貨物。本身不儲存任何貨物。"
ruRU = "Склад, размещённый вплотную к товарной станции или под ней, добавляет ей ячейки для товаров — каждая ячейка позволяет хранить на станции ещё один вид товаров. Сам по себе ничего не хранит."
jaJP = "物資ステーションに隣接またはその下に設置する倉庫で、追加の物資スロットを付与します。各スロットにより、ステーションに保管できる物資の種類が1つ増えます。この倉庫自体には物資を保管しません。"
frFR = "Un entrepôt placé contre une station de marchandises ou en dessous pour lui ajouter des emplacements de marchandises — chaque emplacement permet à la station de stocker un type de marchandise supplémentaire. Ne stocke aucune marchandise lui-même."
deDE = "Ein Lagerhaus, das neben oder unter einer Güterstation platziert wird, um ihr zusätzliche Warenplätze zu gewähren – jeder Platz ermöglicht der Station, eine weitere Warenart zu lagern. Lagert selbst keine Waren."
plPL = "Magazyn umieszczony przy stacji towarowej lub pod nią, zapewniający jej dodatkowe miejsca na towary — każde miejsce pozwala stacji przechowywać jeden dodatkowy rodzaj towaru. Sam nie przechowuje żadnych towarów."
ptBR = "Um armazém colocado junto à Estação de Mercadorias ou abaixo dela para conceder espaços extras para mercadorias — cada espaço permite que a estação estoque mais um tipo de mercadoria. Não armazena mercadorias por conta própria."
koKR = "상품역에 붙이거나 그 아래에 배치해 상품역의 상품 칸을 늘리는 창고입니다. 각 칸에 상품을 한 종류씩 더 비축할 수 있습니다. 자체적으로는 상품을 저장하지 않습니다."
csCZ = "Sklad umístěný vedle nebo pod Zbožovou stanicí jí poskytne další místa pro zboží — každé místo umožňuje stanici skladovat o jeden druh zboží navíc. Sám o sobě žádné zboží neskladuje."
viVN = "Một nhà kho đặt sát Ga Hàng Hóa hoặc bên dưới ga, giúp ga có thêm ô hàng hóa — mỗi ô cho phép ga dự trữ thêm một loại hàng hóa. Bản thân nhà kho không chứa hàng hóa."
trTR = "Bir Mal İstasyonu'nun yanına veya altına yerleştirildiğinde ona ek mal yuvaları kazandıran depo — her yuva, istasyonun bir tür daha mal stoklamasını sağlar. Kendi başına hiçbir mal depolamaz."

