["Tobbert.GoodsStationWarehouseSmall.Description"]
raw = "A warehouse placed against a Goods Station, or under it, to grant it extra goods slots — each slot lets the station stock one more kind of goods. Holds no goods of its own."
status = "normal"
enUS = "A warehouse placed against or under a Goods Station to grant it extra goods slots—each slot lets the station stock one more kind of goods. Holds no goods of its own."
zhCN = "将仓库放置在货物站旁边或下方，可为其增加货物槽位——每个槽位都能让货物站多储存一种货物。仓库自身不储存任何货物。"
zhTW = "放置在貨物站旁邊或下方的倉庫，可為貨物站增加貨物欄位——每個欄位讓貨物站多儲存一種貨物。倉庫本身不儲存任何貨物。"
ruRU = "Склад, размещённый вплотную к грузовой станции или под ней, даёт ей дополнительные ячейки для товаров — каждая ячейка позволяет станции хранить ещё один вид товаров. Сам по себе не хранит товары."
jaJP = "物資ステーションに隣接して、またはその下に設置する倉庫で、物資スロットを追加します。スロット1つにつき、ステーションが備蓄できる物資の種類が1つ増えます。この倉庫自体は物資を保管しません。"
frFR = "Un entrepôt placé contre une station de marchandises ou en dessous de celle-ci pour lui ajouter des emplacements de marchandises — chaque emplacement permet à la station de stocker un type de marchandises supplémentaire. Ne stocke aucune marchandise lui-même."
deDE = "Ein Lagerhaus, das direkt neben oder unter einer Warenstation platziert wird und ihr zusätzliche Warenplätze verschafft – jeder Platz ermöglicht es der Station, eine weitere Warenart zu lagern. Lagert selbst keine Waren."
plPL = "Magazyn umieszczony przy Stacji Towarowej lub pod nią, aby zapewnić jej dodatkowe miejsca na towary — każde miejsce pozwala stacji przechowywać jeszcze jeden rodzaj towaru. Sam nie przechowuje żadnych towarów."
ptBR = "Um armazém colocado ao lado ou embaixo de uma Estação de Mercadorias para conceder a ela espaços extras para mercadorias — cada espaço permite que a estação estoque mais um tipo de mercadoria. Não armazena mercadorias por conta própria."
koKR = "상품 역에 맞대거나 아래에 배치해 상품 슬롯을 추가하는 창고입니다. 슬롯 하나마다 역에 더 많은 종류의 상품을 비축할 수 있습니다. 자체적으로 상품을 저장하지 않습니다."
csCZ = "Sklad umístěný vedle Stanice zboží nebo pod ní, který jí přidává další sloty pro zboží — každý slot umožňuje stanici skladovat jeden další druh zboží. Sám o sobě žádné zboží neskladuje."
viVN = "Một kho hàng đặt cạnh hoặc bên dưới Ga Hàng hóa để cung cấp thêm ô chứa hàng cho ga — mỗi ô cho phép ga lưu trữ thêm một loại hàng hóa. Bản thân kho không chứa hàng hóa nào."
trTR = "Bir Malzeme İstasyonu'nun yanına veya altına yerleştirildiğinde istasyona ek mal türü yuvaları kazandıran depo — her yuva, istasyonun bir tür daha fazla mal stoklamasını sağlar. Kendi içinde hiçbir mal depolamaz."

