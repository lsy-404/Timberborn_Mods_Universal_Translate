["Building.MediumAlcoholTank.FlavorDescription"]
raw = "After The Great Drought, beavers learned that some alcoholic beverages were worth keeping in reserve."
status = "normal"
enUS = "After The Great Drought, beavers learned that some alcoholic beverages were worth keeping in reserve."
zhCN = "“在大干旱之后，海狸们学会了某些酒精饮料值得保存。”"
zhTW = "在大乾旱之後，河狸學會了一些酒精飲料值得儲存。"
ruRU = "После Великой Засухи бобры узнали, что некоторые алкогольные напитки стоит хранить в резерве."
jaJP = "大干ばつの後、ビーバーたちはいくつかのアルコール飲料を保存する価値があることを学びました。"
frFR = "Après la Grande Sécheresse, les castors ont appris que certaines boissons alcoolisées valaient la peine d'être conservées en réserve."
deDE = "„Nach der großen Dürre lernten die Biber, dass einige alkoholische Getränke wert waren, aufbewahrt zu werden.“"
plPL = "Po Wielkiej Suszy bobry nauczyły się, że niektóre napoje alkoholowe warto trzymać w rezerwie."
ptBR = "Depois da Grande Seca, os castores aprenderam que algumas bebidas alcoólicas valiam a pena serem mantidas em reserva."
koKR = "대가뭍의 대가뭍을 겪은 후, 비버들은 일부 주류가 비축할 가치가 있다는 것을 배웠습니다."
trTR = "Büyük Kuraklıktan sonra, kunduzlar bazı alkollü içeceklerin rezervde tutulmaya değer olduğunu öğrendi."
esES = "Tras La Gran Sequía, los castores aprendieron que algunas bebidas alcohólicas merecían guardarse como reserva."
itIT = "Dopo La Grande Siccità, i castori hanno imparato che alcune bevande alcoliche valeva la pena tenerle in riserva."
ukUA = "Після Великої посухи бобри дізналися, що деякі алкогольні напої варто зберігати про запас."
thTH = "หลังจากภัยแล้งครั้งใหญ่ ชาวบีเวอร์เรียนรู้ว่าเครื่องดื่มแอลกอฮอล์บางชนิดคุ้มค่าแก่การเก็บสำรองไว้"
csCZ = "Po Velké suchu se bobři naučili, že některé alkoholické nápoje stojí za to mít v rezervě."
viVN = "Sau Cơn Hạn Hán Lớn, những con nhím đã học được rằng một số đồ uống có cồn đáng để dự trữ."
caES = "Després de la Gran Sequera, els castors van aprendre que algunes begudes alcohòliques valien la pena guardar-les en reserva."
beBY = "Пасля Вялікай засухі бабры даведаліся, што некаторыя алкагольныя напоі варта захоўваць у запасе."
roRO = "După Marea Secetă, castorii au descoperit că unele băuturi alcoolice merită păstrate în rezervă."
huHU = "A Nagy Szárazság után a hódok megtanulták, hogy egyes alkoholos italokat érdemes tartalékolni."
arSA = "بعد الجفاف الكبير، تعلّم القنادس أن بعض المشروبات الكحولية تستحق الاحتفاظ بها في المخزون الاحتياطي."

