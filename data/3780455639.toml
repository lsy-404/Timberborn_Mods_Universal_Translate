["Building.LargeTeaTank.FlavorDescription"]
raw = "Despite the efforts of kits that try to use it as a swimming pool, this tank was designed to keep the tea flowing."
status = "normal"
enUS = "Despite the efforts of kits trying to use it as a swimming pool, this tank was designed to keep the tea flowing."
zhCN = "尽管小动物们试图把它当作游泳池， pero这个水箱是为了持续供应茶水而设计的。"
zhTW = "儘管套件試圖將其用作游泳池，但這個大茶水箱的設計是為了保持茶水不斷流動。"
ruRU = "Несмотря на усилия енотов, которые пытаются использовать его как бассейн, этот бак был спроектирован для того, чтобы поддерживать поток чая."
jaJP = "「このタンクはプールとして使用しようとするキットの努力にもかかわらず、ティーを流し続けるために設計されました。」"
frFR = "Malgré les efforts des kits qui tentent de l'utiliser comme une piscine, ce réservoir a été conçu pour garder le thé en circulation."
deDE = "Trotz der Bemühungen von Kits, die versuchen, es als Schwimmbecken zu nutzen, wurde dieser Tank entworfen, um den Tee fließen zu lassen."
plPL = "Pomimo wysiłków wiewiórek, które próbują wykorzystać go jako basen, ten zbiornik został zaprojektowany, aby utrzymywać napar w ruchu."
ptBR = "Apesar dos esforços dos kits que tentam usá-lo como uma piscina, este tanque foi projetado para manter o chá fluindo."
koKR = "수영장으로 사용하려는 키트의 노력에도 불구하고, 이 탱크는 차를 계속 흘러내리게 하도록 설계되었습니다."
csCZ = "I když se snaží mláďata, která se pokoušejí použít tento tank jako bazén, byl tento tank navržen tak, aby udržoval čaj v proudění."
viVN = "Mặc dù có sự nỗ lực của những chú nhóc cố gắng sử dụng nó như một bể bơi, bể chứa này được thiết kế để giữ cho trà luôn chảy."
trTR = "Onların yüzme havuzu olarak kullanma çabalarına rağmen, bu tank çayın akışını sağlamak için tasarlandı."

