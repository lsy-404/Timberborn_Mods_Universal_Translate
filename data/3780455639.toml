["Building.LargeBeerTank.FlavorDescription"]
raw = "Despite the efforts of kits that try to use it as a swimming pool, this tank was designed to keep the beer flowing."
status = "normal"
enUS = "Despite the efforts of kits that try to use it as a swimming pool, this tank was designed to keep the beer flowing."
zhCN = "“尽管有小动物们试图把它当作游泳池，这个罐子是为了保持啤酒的流通而设计的。”"
zhTW = "儘管小孩們試圖把它當作游泳池使用，但這個大啤酒桶的設計是為了不斷供應啤酒。"
ruRU = "Несмотря на усилия бобров, которые пытаются использовать его как плавательный бассейн, этот резервуар был разработан, чтобы поддерживать поток пива."
jaJP = "プールとして使用しようとするキットの努力にもかかわらず、このタンクはビールを流し続けるために設計されました。"
frFR = "Malgré les efforts des kits qui essaient de l'utiliser comme piscine, ce réservoir a été conçu pour faire couler la bière."
deDE = "Obwohl die Kits versuchen, es als Schwimmbad zu nutzen, wurde dieser Tank entwickelt, um das Bier fließen zu lassen."
plPL = "Pomimo starań bobrów, które próbują używać go jako basenu, ten zbiornik został zaprojektowany, aby piwo nie przestawało płynąć."
ptBR = "Apesar dos esforços dos kits que tentam usá-lo como uma piscina, este tanque foi projetado para manter a cerveja fluindo."
koKR = "수영장으로 사용하려는 키트의 노력에도 불구하고, 이 탱크는 맥주를 계속 흘러나오게 하도록 설계되었습니다."
csCZ = "I přes úsilí kit, kteří se snaží využít ho jako bazén, byl tento tank navržen tak, aby udržel pivo v proudu."
viVN = "Trái ngược với nỗ lực của các bộ kit cố gắng sử dụng nó như một bể bơi, bồn chứa này được thiết kế để giữ cho bia luôn chảy."
trTR = "Yüzme havuzu olarak kullanmaya çalışan kitlerin çabalarına rağmen, bu tank biranın akışını sağlaması için tasarlandı."

