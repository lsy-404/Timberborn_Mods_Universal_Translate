["Building.LargeWineTank.FlavorDescription"]
raw = "Despite the efforts of kits that try to use it as a swimming pool, this tank was designed to keep the wine flowing."
status = "normal"
enUS = "Despite the efforts of the kits that try to use it as a swimming pool, this tank was designed to keep the wine flowing."
zhCN = "尽管小动物们试图把它当作游泳池使用，但这个酒桶的设计是为了保持酒水的流动。"
zhTW = "儘管小孩們嘗試把它當作游泳池來使用，但這個大酒罐的設計是為了保持酒的流動。"
ruRU = "Несмотря на усилия белок, которые пытаются использовать его как бассейн, этот резервуар был спроектирован для бесконечного потока вина."
jaJP = "「プールとして使用しようとするキットの努力にもかかわらず、このタンクはワインを流し続けるために設計されています。」"
frFR = "Malgré les efforts des kits qui essaient de l'utiliser comme piscine, ce réservoir a été conçu pour garder le vin à flot."
deDE = "Trotz der Bemühungen von Kits, die versuchen, ihn als Schwimmbecken zu nutzen, wurde dieser Tank entworfen, um den Wein fließen zu lassen."
plPL = "Pomimo starań kitów, które próbują używać go jako basenu, ten zbiornik został zaprojektowany, aby utrzymać wino w ruchu."
ptBR = "Apesar dos esforços dos kits que tentam usá-lo como uma piscina, esse tanque foi projetado para manter o vinho fluindo."
koKR = "수영장으로 사용하려는 킷들의 노력에도 불구하고, 이 탱크는 와인이 계속 흐르도록 디자인되었습니다."
trTR = "Onu bir yüzme havuzu olarak kullanmaya çalışan kitlerin çabalarına rağmen, bu tank şarabın akmasını sağlamak için tasarlandı."
esES = "A pesar de los esfuerzos de los retoños que intentan usarlo como piscina, este depósito fue diseñado para mantener el vino fluyendo."
itIT = "Nonostante gli sforzi dei cuccioli che cercano di usarla come piscina, questa cisterna è stata progettata per far scorrere il vino."
ukUA = "Попри зусилля бобенят, які намагаються використовувати його як басейн, цей резервуар створено для того, щоб вино продовжувало текти."
thTH = "แม้ลูกบีเวอร์บางตัวจะพยายามใช้มันเป็นสระว่ายน้ำ แต่ถังนี้ถูกออกแบบมาเพื่อให้ไวน์ไหลเวียนอยู่ตลอดไป"
csCZ = "I přes úsilí kitů, které se snaží použít tento tank jako bazén, byl tento nádrž navržena tak, aby víno nepřestávalo téct."
viVN = "Mặc dù có nỗ lực của những bộ kit cố gắng sử dụng nó như một bể bơi, bồn này được thiết kế để giữ cho rượu vang luôn chảy."
caES = "Malgrat els esforços dels petits que intenten utilitzar-lo com a piscina, aquest dipòsit va ser dissenyat per mantenir el vi fluint."
beBY = "Нягледзячы на спробы дзіцянят выкарыстоўваць гэты рэзервуар як басейн, ён быў створаны для таго, каб вino заставалася ў плыні."
roRO = "Deși puii încearcă să-l folosească drept piscină, acest rezervor a fost proiectat pentru a menține vinul curgând."
huHU = "Annak ellenére, hogy a fiókák úszómedencének próbálják használni, ezt a tartályt azzal a céllal tervezték, hogy a bor folyamatosan áramoljon benne."
arSA = "رغم جهود الصغار الذين يحاولون استخدامه كحوض سباحة، صُمّم هذا الخزان لإبقاء النبيذ متدفقًا."

