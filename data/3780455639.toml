csCZ = "Po Velké suchu se bobři naučili, že některé víno stojí za to uchovat na později."
viVN = "Sau Cơn Hạn Hán Vĩ Đại, loài rái cá đã học được rằng một số loại rượu vang xứng đáng được giữ lại."
