["Building.MediumTeaTank.FlavorDescription"]
raw = "After The Great Drought, beavers learned that some tea was worth keeping in reserve."
status = "normal"
enUS = "After The Great Drought, beavers learned that some tea was worth keeping in reserve."
zhCN = "“大干旱之后，海狸们学会了有些茶值得储存。”"
zhTW = "“大旱之後，海狸們學會了一些茶是值得儲存的。”"
ruRU = "После Великой Засухи бобры узнали, что некоторые сорта чая стоит держать в запасе."
jaJP = "「大干ばつの後、ビーバーたちは一部の紅茶は резервしておく価値があることを学びました。」"
frFR = "Après La Grande Sécheresse, les castors ont appris que certains thés valaient la peine d'être conservés."
deDE = "Nach der großen Dürre lernten die Biber, dass man einige Teesorten besser aufbewahren sollte."
plPL = "Po Wielkiej Suszy bobry nauczyły się, że niektóre herbaty warto trzymać w rezerwie."
ptBR = "Após a Grande Seca, os castores aprenderam que alguns chás eram dignos de serem mantidos em reserva."
koKR = "대재앙 이후, 비버들은 일부 차는 저장할 가치가 있다는 것을 배웠다."
csCZ = "Po Velkém Suchu se bobři naučili, že některý čaj stojí za to mít v zásobě."
viVN = "Sau Cơn Hạng Hán Lớn, những con beaver đã học được rằng có một số loại trà đáng để giữ lại."
trTR = "Büyük Kuraklığın ardından, kunduzlar bazı çayların rezervde tutulmaya değer olduğunu öğrendiler."

