frFR = "Produit des boissons alcoolisées à partir des récoltes, des édulcorants et de l'eau fraîche."
deDE = "Stellt alkoholische Getränke aus geernteten Pflanzen, Süßungsmitteln und frischem Wasser her."
plPL = "Produkuje napoje alkoholowe z zebranych plonów, słodzików i świeżej wody."
