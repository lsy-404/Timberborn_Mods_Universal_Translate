["Building.MediumFermentedDrinkTank.FlavorDescription"]
raw = "After The Great Drought, beavers learned that some fermented drinks were worth keeping in reserve."
status = "normal"
enUS = "After The Great Drought, beavers learned that some fermented drinks were worth keeping in reserve."
zhCN = "“在大干旱之后，海狸们学会了有些发酵饮料值得储存。”"
zhTW = "在大乾旱之後，海狸們學會了某些發酵飲料值得保存。"
ruRU = "После Великой Засухи бобры узнали, что некоторые ферментированные напитки стоит хранить в запасе."
jaJP = "「大干ばつの後、ビーバーたちはいくつかの発酵飲料を備蓄する価値があることを学びました。」"
frFR = "Après la Grande Sécheresse, les castors ont appris que certaines boissons fermentées valaient la peine d'être conservées en réserve."
deDE = "Nach der großen Dürre lernten die Biber, dass es sich lohnte, einige fermentierte Getränke im Vorrat zu halten."
plPL = "Po Wielkiej Suszy bobry nauczyły się, że niektóre fermentowane napoje warto trzymać w zapasie."
ptBR = "Após A Grande Seca, os castores aprenderam que algumas bebidas fermentadas valiam a pena serem mantidas em reserva."
koKR = "대재앙 이후, 비버들은 일부 발효 음료를 비축할 가치가 있다는 것을 알게 되었다."
trTR = " Büyük Kuraklık'tan sonra, kunduzlar bazı fermente içeceklerin rezerve alınmaya değer olduğunu öğrendiler."
esES = "Después de la Gran Sequía, los castores aprendieron que algunas bebidas fermentadas valían la pena guardar en reserva."
itIT = "Dopo la Grande Siccità, i castori hanno imparato che alcune bevande fermentate valeva la pena tenerle in riserva."
ukUA = "Після Великої посухи бобри зрозуміли, що деякі ферментовані напої варто зберігати про запас."
thTH = "หลังจาก \"ภัยแล้งครั้งใหญ่\" บีเวอร์เรียนรู้ว่าเครื่องดื่มหมักบางชนิดคุ้มค่าที่จะเก็บสำรองไว้"
csCZ = "Po Velké Dvouhře se bobři naučili, že některé fermentované nápoje stojí za to uchovávat na později."
viVN = "Sau Nạn Hạn Hán Lớn, những con castor đã học được rằng một số loại thức uống lên men đáng để bảo quản."
caES = "Després de la Gran Sequera, els castors van aprendre que valia la pena guardar certes begudes fermentades en reserva."
beBY = "Пасля Вялікай засухі бабры даведаліся, што некаторыя браджаныя напоі варта захоўваць у запасе."
roRO = "După Marea Secetă, castorii au învățat că unele băuturi fermentate merită păstrate în rezervă."
huHU = "A Nagy Aszály után a hódok megtanulták, hogy egyes erjesztett italokat érdemes tartalékolni."
arSA = "بعد الجفاف الكبير، تعلّم القنادس أن بعض المشروبات المخمّرة تستحق الاحتفاظ بها في المخزون الاحتياطي."

