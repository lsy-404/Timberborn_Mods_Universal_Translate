["Building.LargeAlcoholTank.FlavorDescription"]
raw = "Despite the efforts of kits that try to use it as a swimming pool, this tank was designed to keep the drinks flowing."
status = "normal"
enUS = "Despite the efforts of the kits trying to use it as a swimming pool, this tank was designed to keep the drinks flowing."
zhCN = "尽管小动物们努力把它当作游泳池使用，这个水箱的设计初衷是为了保持饮料的源源不断。"
zhTW = "儘管小動物們努力把它當作游泳池來使用，但這個罐子是為了保持飲料不斷流動而設計的。"
ruRU = "Несмотря на усилия енотов, которые пытаются использовать его как плавательный бассейн, этот бак был разработан для постоянного потока напитков."
jaJP = "「プールとして利用しようとする子供たちの努力にもかかわらず、このタンクは飲み物を常に提供するために設計されています。」"
frFR = "Malgré les efforts des petits animaux qui essaient de l'utiliser comme piscine, ce réservoir a été conçu pour garder les boissons en continu."
deDE = "Trotz der Bemühungen von kits, die versuchen, ihn als Schwimmbad zu nutzen, wurde dieser Tank entworfen, um die Getränke fließen zu lassen."
plPL = "Pomimo wysiłków kitów, które próbują używać go jako basenu, ten zbiornik został zaprojektowany, aby utrzymać płynność napojów."
ptBR = "Apesar dos esforços dos kits que tentam usá-lo como uma piscina, este tanque foi projetado para manter as bebidas fluindo."
koKR = "수영장으로 사용하려는 키트의 노력에도 불구하고, 이 탱크는 음료가 계속 흐르도록 설계되었습니다."
trTR = "Bir yüzme havuzu olarak kullanmaya çalışan kitlerin çabalarına rağmen, bu tank içeceklerin akışını sağlamak için tasarlandı."
esES = "A pesar de los esfuerzos de los retoños que intentan usarlo como piscina, este depósito fue diseñado para mantener el flujo de bebidas."
itIT = "Nonostante gli sforzi dei cuccioli che cercano di usarla come piscina, questa cisterna è stata progettata per mantenere le bevande in movimento."
ukUA = "Попри зусилля бобренят, які намагаються використовувати його як басейн, цей резервуар створено для того, щоб напої не переставали текти."
thTH = "แม้ว่าลูกบีเวอร์บางตัวจะพยายามใช้มันเป็นสระว่ายน้ำ แต่ถังนี้ถูกออกแบบมาเพื่อให้เครื่องดื่มไหลเวียนอย่างต่อเนื่อง"
csCZ = "I přes snahu krys, které se ho snaží použít jako bazén, byl tento tank navržen tak, aby udržoval nápoje v proudu."
viVN = "Mặc dù có sự nỗ lực của lũ trẻ cố gắng sử dụng nó như một bể bơi, nhưng bồn chứa này được thiết kế để giữ cho đồ uống luôn chảy."
caES = "Malgrat els esforços dels cadells que intenten usar-lo com a piscina, aquest dipòsit va ser dissenyat per mantenir les begudes fluint."
beBY = "Нягледзячы на спробы дзiцянят выкарыстоўваць гэты разервуар як басейн, ён быў створаны для таго, каб напоі заставаліся ў руху."
roRO = "Deși puii încearcă să-l folosească drept piscină, acest rezervor a fost proiectat pentru a menține băuturile în circulație."
huHU = "A tartályt bár a kölykök úszómedencének próbálják használni, azt úgy tervezték, hogy az italok folyamatosan áramoljanak benne."
arSA = "ًعلى الرغم من محاولات الصغار استخدامه كحوض سباحة، صُمم هذا الخزان لإبقاء المشروبات متدفقة."

