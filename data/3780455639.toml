zhCN = "从收获的农作物、甜味剂和清水中生产酒精饮料。"
zhTW = "「從收穫的作物、甜味劑和淡水中生產酒精飲料。」"
ruRU = "Производит алкогольные напитки из собранных культур, подсластителей и пресной воды."
