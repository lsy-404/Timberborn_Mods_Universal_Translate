["Building.LargeDrinkTank.FlavorDescription"]
raw = "Despite the efforts of kits that try to use it as a swimming pool, this tank was designed to keep the drinks flowing."
status = "normal"
enUS = "Despite the efforts of the kits trying to use it as a swimming pool, this tank was designed to keep the drinks flowing."
zhCN = "尽管有小机器人试图把它当成游泳池使用，但这个水箱的设计初衷是为了保持饮料的畅通供应。"
zhTW = "儘管有小動物試圖將其用作游泳池，但這個水塔的設計是為了保持飲料的源源不斷。"
ruRU = "Несмотря на усилия енотов, которые пытаются использовать его как бассейн, эта цистерна была спроектирована для того, чтобы поддерживать подачу напитков."
jaJP = "「プールとして使おうとする子供たちの努力にもかかわらず、このタンクは飲み物をたっぷり流し続けるために設計されています。」"
frFR = "Malgré les efforts des kits qui essaient de l'utiliser comme piscine, ce réservoir a été conçu pour garder les boissons en circulation."
deDE = "Trotz der Bemühungen von Kits, die es als Schwimmbecken nutzen wollen, wurde dieser Tank entwickelt, um die Getränke am Fließen zu halten."
plPL = "Pomimo wysiłków kitów, które próbują wykorzystać go jako basen, ten zbiornik został zaprojektowany, aby napoje mogły swobodnie płynąć."
ptBR = "Apesar dos esforços dos kits que tentam usá-lo como uma piscina, este tanque foi projetado para manter as bebidas fluindo."
koKR = "수영장으로 사용하려는 키트들의 노력에도 불구하고, 이 탱크는 음료가 계속 흐르도록 설계되었습니다."
csCZ = "I přes úsilí jehňat, která se ho snaží využít jako bazén, byl tento zásobník navržen tak, aby udržel nápoje v neustálém toku."
viVN = "Mặc dù có sự cố gắng của các bầy trẻ cố gắng biến nó thành một bể bơi, nhưng bể chứa này được thiết kế để giữ cho đồ uống luôn tươi mát."
trTR = "Onların yüzme havuzu olarak kullanmaya çalıştıkları çabalara rağmen, bu tank içeceklerin sürekli akışını sağlamak için tasarlandı."

