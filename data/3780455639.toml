["Building.MediumDrinkTank.FlavorDescription"]
raw = "After The Great Drought, beavers learned that some drinks were worth keeping in reserve."
status = "normal"
enUS = "After The Great Drought, beavers learned that some drinks were worth keeping in reserve."
zhCN = "“大干旱”过后，海狸们明白了一些饮料值得储存。"
zhTW = "在大旱之後，海狸們了解到某些飲料值得儲存。作為飲料工廠的一部分，他們開始積累儲備。"
ruRU = "После Великой Засухи бобры узнали, что некоторые напитки стоит хранить про запас."
jaJP = "大干ばつの後、ビーバーたちはいくつかの飲み物を備蓄する価値があることを学びました。"
frFR = "Après La Grande Sécheresse, les castors ont appris que certaines boissons valaient la peine d'être conservées en réserve."
deDE = "Nach der großen Dürre lernten die Biber, dass einige Getränke es wert waren, aufbewahrt zu werden."
plPL = "Po Wielkiej Suszy bobry nauczyły się, że niektóre napoje warto trzymać w rezerwie."
ptBR = "Após A Grande Seca, os castores aprenderam que algumas bebidas valiam a pena serem mantidas em reserva."
koKR = "대대적인 가뭄 이후, 비버들은 일부 음료는 비축할 가치가 있다는 것을 배웠습니다."
csCZ = "Po Velké suchu se bobři naučili, že některé nápoje stojí za to uchovat v zásobě."
viVN = "Sau Nạn Hạn Hán Lớn, những con thủy lợn đã học được rằng một số đồ uống thì đáng để dự trữ."
trTR = "Büyük Kuraklık'tan sonra, kunduzlar bazı içeceklerin saklanmaya değer olduğunu öğrendi."

