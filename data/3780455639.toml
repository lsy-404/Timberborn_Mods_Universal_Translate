frFR = "Après la Grande Sécheresse, les castors ont appris que certaines boissons fermentées valaient la peine d'être conservées en réserve."
deDE = "Nach der großen Dürre lernten die Biber, dass es sich lohnte, einige fermentierte Getränke im Vorrat zu halten."
plPL = "Po Wielkiej Suszy bobry nauczyły się, że niektóre fermentowane napoje warto trzymać w zapasie."
ptBR = "Após A Grande Seca, os castores aprenderam que algumas bebidas fermentadas valiam a pena serem mantidas em reserva."
koKR = "대재앙 이후, 비버들은 일부 발효 음료를 비축할 가치가 있다는 것을 알게 되었다."
