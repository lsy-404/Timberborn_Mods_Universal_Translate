["Building.MediumBeerTank.FlavorDescription"]
raw = "After The Great Drought, beavers learned that some beer was worth keeping in reserve."
status = "normal"
enUS = "After The Great Drought, beavers learned that some beer was worth keeping in reserve."
zhCN = "“在大干旱之后，海狸们学会了一些啤酒值得储存。”"
zhTW = "“大乾旱”之後，海狸們學會了某些啤酒值得保留。"
ruRU = "После Великой Засухи бобры узнали, что некоторое пиво стоит хранить про запас."
jaJP = "「大干ばつの後、ビーバーたちはいくつかのビールは備えておく価値があることを学びました。」"
frFR = "Après La Grande Sécheresse, les castors ont appris que certaines bières valaient la peine d'être conservées en réserve."
deDE = "Nach der Großen Dürre lernten die Biber, dass einige Biere es wert waren, aufbewahrt zu werden."
plPL = "Po Wielkiej Suszy, bobry nauczyły się, że niektóre piwa warto trzymać w rezerwie."
ptBR = "Após A Grande Seca, os castores aprenderam que algumas cervejas valiam a pena serem mantidas em reserva."
koKR = "대가뭄 이후, 비버들은 일부 맥주는 비축할 가치가 있음을 알게 되었다."
trTR = "Büyük Kuraklıktan sonra, kunduzlar bazı biraların saklamaya değer olduğunu öğrendi."
esES = "Después de La Gran Sequía, los castores aprendieron que algo de cerveza merecía guardarse como reserva."
itIT = "Dopo La Grande Siccità, i castori hanno imparato che un po' di birra valeva la pena conservarla in riserva."
ukUA = "Після Великої засухи бобри зрозуміли, що деяке пиво варто зберігати про запас."
thTH = "หลังจากภัยแล้งครั้งใหญ่ เหล่าบีเวอร์เรียนรู้ว่าเบียร์บางชนิดก็คุ้มค่าที่จะเก็บสำรองไว้"
csCZ = "Po Velké suchu se bobři naučili, že některé pivo stojí za to uchovat na později."
viVN = "Sau Nạn Hạn Hán Lớn, những con castor đã học rằng một số loại bia đáng để giữ lại."
caES = "Després de la Gran Sequera, els castors van aprendre que valia la pena guardar una mica de cervesa en reserva."
beBY = "Пасля Вялікай засухі бобры зразумелі, што частку піва варта захоўваць у запасе."
roRO = "După Marea Secetă, castorii au învățat că merită să păstrezi niște bere în rezervă."
huHU = "A Nagy Aszály után a hódok megtanulták, hogy némi sört érdemes tartalékolni."
arSA = "بعد الجفاف الكبير، تعلّم القنادس أن بعض البيرة تستحق الاحتفاظ بها في الاحتياطي."

