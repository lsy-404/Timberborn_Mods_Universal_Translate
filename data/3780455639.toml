["Building.MediumWineTank.FlavorDescription"]
raw = "After The Great Drought, beavers learned that some wine was worth keeping in reserve."
status = "normal"
enUS = "After The Great Drought, beavers learned that some wine was worth keeping in reserve."
zhCN = "“大干旱”之后，海狸们了解到一些葡萄酒是值得储存的。"
zhTW = "「在大乾旱之後，海狸們學會了有些葡萄酒值得儲存。」"
