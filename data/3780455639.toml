["Building.LargeFermentedDrinkTank.FlavorDescription"]
raw = "Despite the efforts of kits that try to use it as a swimming pool, this tank was designed to keep the fermented drinks flowing."
status = "normal"
enUS = "Despite the efforts of the kits trying to use it as a swimming pool, this tank was designed to keep the fermented drinks flowing."
zhCN = "尽管有小 Kits 试图将其用作游泳池，但这个储罐的设计是为了保持发酵饮品的持续流动。"
zhTW = "儘管小動物們試圖將其當作游泳池使用，但這個儲罐的設計是為了保持發酵飲料的持續流動。"
ruRU = "Несмотря на усилия енотов, пытающихся использовать его в качестве бассейна, этот резервуар был создан для того, чтобы поддерживать поток ферментированных напитков."
jaJP = "プールとして使用しようとするキットの努力にもかかわらず、このタンクは発酵飲料を流し続けるために設計されました。"
frFR = "Malgré les efforts des kits qui essaient de l'utiliser comme une piscine, ce réservoir a été conçu pour garder les boissons fermentées en circulation."
deDE = " Trotz der Bemühungen von Kits, die versuchen, ihn als Schwimmbecken zu nutzen, wurde dieser Tank entworfen, um die fermentierten Getränke fließen zu lassen."
plPL = "Pomimo starań kitów, które próbują wykorzystać go jako basen, ten zbiornik został zaprojektowany, aby utrzymać fermentowane napoje w ruchu."
ptBR = "Apesar dos esforços dos kits que tentam usá-lo como uma piscina, este tanque foi projetado para manter as bebidas fermentadas fluindo."
koKR = "수영장으로 사용하려는 키트들의 노력에도 불구하고, 이 탱크는 발효 음료를 계속 흘려보낼 수 있도록 설계되었습니다."
csCZ = "Navzdory snahám kitů, kteří se snaží použít tuto nádrž jako bazén, byla tato nádrž navržena tak, aby udržovala fermentované nápoje v tečení."
viVN = "Mặc dù có những nỗ lực của các chú lửng cố gắng sử dụng nó như một bể bơi, nhưng bể này được thiết kế để giữ cho các loại đồ uống lên men luôn chảy."
trTR = "Onun bir yüzme havuzu olarak kullanılmaya çalışması için yapılan çabalara rağmen, bu tank fermante içeceklerin akışını sağlamak için tasarlandı."

