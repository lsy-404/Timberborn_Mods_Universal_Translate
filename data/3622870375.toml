csCZ = "Může kondenzovat purified vodu ze vzduchu, dokud je k dispozici elektřina."
viVN = "Nó có thể ngưng tụ nước tinh khiết từ không khí miễn là có điện."
caES = "Pot condensar aigua purificada de l'aire sempre que hi hagi electricitat."
beBY = "Яно можа кандэнсаваць ачышчаную ваду з паветра, пакуль ёсць электрычнасць."
