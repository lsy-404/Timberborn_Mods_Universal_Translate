["Building.PowerLCc.Description"]
raw = "This primary battery is crafted using a mysterious substance extracted from beavers. Although it generates minimal electricity，its effects are virtually limitless."
status = "normal"
enUS = "This primary battery is crafted using a mysterious substance extracted from beavers. Although it generates minimal electricity, its effects are virtually limitless."
zhCN = "这个主电池是用从海狸提取的神秘物质制成的。尽管它产生的电力微不足道，但它的效果几乎是无穷无尽的。"
zhTW = "這個主要電池是使用從海狸中提取的神秘物質製成的。雖然它產生的電力微乎其微，但其效果幾乎是無限的。"
ruRU = "Этот основной аккумулятор изготовлен из загадочного вещества, извлеченного из бобров. Хотя он генерирует минимальное количество электричества, его эффекты практически безграничны."
jaJP = "この主バッテリーはビーバーから抽出された謎の物質を使用して作られています。生成される電力は最小限ですが、その効果はほぼ無限です。"
frFR = "Cette batterie principale est fabriquée à partir d'une substance mystérieuse extraite des castors. Bien qu'elle génère une électricité minimale, ses effets sont pratiquement illimités."
deDE = "Dieser primäre Akku ist aus einer mysteriösen Substanz gefertigt, die von Bibern gewonnen wurde. Obwohl er nur minimalen Strom erzeugt, sind seine Effekte nahezu grenzenlos."
plPL = "Ta główna bateria jest wykonana z tajemniczej substancji wydobytej z bobrów. Mimo że generuje minimalną ilość energii, jej efekty są praktycznie nieograniczone."
ptBR = "Esta bateria primária é feita com uma substância misteriosa extraída de castores. Embora gere eletricidade mínima, seus efeitos são virtualmente ilimitados."
koKR = "이 주요 배터리는 비버에서 추출한 신비로운 물질로 만들어졌습니다. 비록 전기를 최소한으로 생성하지만, 그 효과는 사실상 무한합니다."
trTR = "Bu birincil pil, kunduzlardan çıkarılan gizemli bir madde kullanılarak üretilmiştir. Minimal elektrik üretmesine rağmen, etkileri neredeyse sınırsızdır."
esES = "Esta batería primaria se fabrica con una misteriosa sustancia extraída de los castores. Aunque genera una cantidad mínima de electricidad, sus efectos son prácticamente ilimitados."
itIT = "Questa batteria primaria è realizzata con una misteriosa sostanza estratta dai castori. Sebbene generi un'elettricità minima, i suoi effetti sono praticamente illimitati."
ukUA = "Ця первинна батарея виготовлена з таємничої речовини, яку добувають із бобрів. Хоча вона виробляє мінімальну кількість електроенергії, її ефекти практично безмежні."
thTH = "หม้อแบตเตอรี่ปฐมภูมินี้ผลิตขึ้นจากสารลึกลับที่สกัดมาจากบีเวอร์ แม้ว่าจะผลิตไฟฟ้าได้น้อยมาก แต่ผลกระทบของมันแทบจะไร้ขีดจำกัด"
csCZ = "„Tento primární akumulátor je vyroben ze záhadné látky extrahované z bobrů. Ačkoli produkuje minimální množství elektrické energie, jeho účinky jsou prakticky neomezené.“"
viVN = "Pin chính này được chế tác từ một chất bí ẩn được chiết xuất từ hải ly. Mặc dù nó chỉ tạo ra lượng điện tối thiểu, nhưng tác dụng của nó hầu như vô hạn."
caES = "Aquesta bateria primària es fabrica amb una substància misteriosa extreta dels castors. Tot i que genera una electricitat mínima, els seus efectes són pràcticament il·limitats."
beBY = "Гэтая першасная батарэя вырабляецца з таямнічай субстанцыі, здабытай у баброў. Хоць яна выпрацоўвае мінімум электраэнергіі, яе эфекты практычна бязмежныя."
roRO = "Această baterie primară este fabricată dintr-o substanță misterioasă extrasă de la castori. Deși generează electricitate minimă, efectele sale sunt practic nelimitate."
huHU = "Ez az elsődleges elem egy rejtélyes, bávatagoktól kinyert anyagból készül. Bár csak minimális mennyiségű áramot termel, hatásai gyakorlatilag határtalanok."
arSA = "هذه البطارية الأولية مصنوعة من مادة غامضة مستخلصة من القنادس. ورغم أنها تولّد كمية ضئيلة من الكهرباء، فإن تأثيراتها لا حدود لها تقريبًا."

["Building.PowerLCc.FlavorDescription"]
raw = "For some unknown reason， beavers near the battery mysteriously end up injured…"
status = "normal"
enUS = "For some unknown reason, beavers near the battery mysteriously end up injured…"
zhCN = "“出于某种未知的原因，靠近电池的海狸神秘地受伤……”"
zhTW = "出於某種未知原因，靠近電池的海狸神秘地受了傷…"
ruRU = "По неизвестной причине бобры рядом с батареей таинственным образом получают травмы…"
jaJP = "「なぜか理由は不明ですが、バッテリーの近くにいるビーバーは神秘的に怪我をしてしまう…」"
frFR = "Pour une raison inconnue, les castors près de la batterie finissent mystérieusement blessés..."
deDE = "„Aus einem unbekannten Grund verletzen sich Biber in der Nähe der Batterie auf mysteriöse Weise…“"
plPL = "Z jakiegoś nieznanego powodu bobry w pobliżu baterii w tajemniczy sposób ulegają kontuzjom..."
ptBR = "Por alguma razão desconhecida, os castores perto da bateria misteriosamente acabam se ferindo…"
koKR = "어떤 이유인지는 알 수 없지만, 배터리 근처의 비버들이 신비롭게 부상을 당하게 됩니다…"
trTR = "Bilinmeyen bir sebepten ötürü, bataryanın yakındaki kunduzlar gizemli bir şekilde yaralanıyor..."
esES = "Por alguna razón desconocida, los castores cerca de la batería acaban misteriosamente heridos…"
itIT = "Per qualche motivo sconosciuto, i castori vicino alla batteria finiscono misteriosamente feriti…"
ukUA = "З незрозумілої причини бобри поблизу акумулятора таємничим чином опиняються пораненими…"
thTH = "ด้วยเหตุผลที่ไม่ทราบแน่ชัด บีเวอร์ที่อยู่ใกล้แบตเตอรี่มักได้รับบาดเจ็บอย่างลึกลับ…"
csCZ = "Z neznámého důvodu se kuny poblíž baterie tajemně zraní…"
viVN = "Vì một lý do không rõ nào đó, những chú hải ly gần ắc quy dường như bị thương một cách bí ẩn…"
caES = "Per algun motiu desconegut, els castors que són a prop de la bateria acaben misteriosament ferits…"
beBY = "З невядомай прычыны бабры каля акумулятара таямнічым чынам пачынаюць атрымліваць траўмы…"
roRO = "Dintr-un motiv necunoscut, castorii din apropierea bateriei ajung misterios răniți…"
huHU = "Valamilyen ismeretlen okból az akkumulátor közelében álló bóbiták rejtélyes módon sérülést szenvednek…"
arSA = "لسبب غامض، ينتهي المطاف بالقنادس القريبون من البطارية بالإصابة بشكل غامض…"

