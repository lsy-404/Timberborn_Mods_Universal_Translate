["Building.WaterTankLC.Description"]
raw = "Directly condenses precious purified water from humid air，requiring no connection to rivers or electricity."
status = "normal"
enUS = "Directly condenses precious purified water from humid air, requiring no connection to rivers or electricity."
zhCN = "“直接从潮湿空气中凝结珍贵的净化水，无需与河流或电力连接。”"
zhTW = "直接從潮濕空氣中凝聚珍貴的純淨水，不需要連接河流或電力。"
ruRU = "Прямо конденсирует драгоценную очищенную воду из влажного воздуха, не требуя подключения к рекам или электричеству."
jaJP = "「湿った空気から貴重な純水を直接凝縮し、河川や電気への接続は不要です。」"
frFR = "Condense directement de l'eau purifiée précieuse à partir de l'air humide, sans nécessiter de connexion aux rivières ou à l'électricité."
deDE = "Das wertvolle, gereinigte Wasser wird direkt aus der feuchten Luft kondensiert und benötigt keine Verbindung zu Flüssen oder Strom."
plPL = "Bezpośrednio kondensuje cenną, oczyszczoną wodę z wilgotnego powietrza, nie wymagając połączenia z rzekami ani elektryczności."
ptBR = "Condensa diretamente água purificada preciosa do ar úmido, não requerendo conexão com rios ou eletricidade."
koKR = "고온의 공기에서 귀중한 정수기를 직접 응축하여 하천이나 전기와의 연결이 필요하지 않습니다."
trTR = "Nemli havadan doğrudan değerli arıtılmış suyu yoğunlaştırır, nehirlerle veya elektriğin bağlantısına gerek yoktur."
esES = "Condensa directamente agua purificada, valiosa, a partir del aire húmedo, sin necesidad de conexión a ríos ni electricidad."
itIT = "Condensa direttamente l'acqua purificata preziosa dall'aria umida, senza richiedere alcun collegamento a fiumi o elettricità."
ukUA = "Безпосередньо конденсує дорогоцінну очищену воду з вологого повітря, не потребуючи з'єднання з річками чи електрикою."
thTH = "ควบแน่นน้ำบริสุทธิ์อันมีค่าจากอากาศชื้นได้โดยตรง โดยไม่ต้องเชื่อมต่อกับแม่น้ำหรือพลังงานไฟฟ้า"
csCZ = "Bezprostředně kondenzuje cennou čištěnou vodu z vlhkého vzduchu, nevyžaduje připojení k řekám ani elektřině."
viVN = "Ngưng tụ trực tiếp nước tinh khiết quý giá từ không khí ẩm, không cần kết nối với sông hoặc nguồn điện."
caES = "Condensa directament aigua purificada valuosa de l'aire humit, sense necessitat de connexió a rius ni electricitat."
beBY = "Непасрэдна кандэнсуе каштоўную ачышчаную ваду з вільготнага паветра, без патрэбы ў падключэнні да рэк або электрычнасці."
roRO = "Condensează direct apă purificată prețioasă din aerul umed, fără a necesita conexiune la râuri sau electricitate."
huHU = "Közvetlenül kondenzálja az értékes tisztított vizet a párás levegőből, és nincs szükség folyóhoz vagy elektromos áramhoz való csatlakozásra."
arSA = "يكثّف الماء النقي الثمين مباشرةً من الهواء الرطب، ولا يتطلب أي اتصال بالأنهار أو بالكهرباء."

["Building.WaterTankLC.FlavorDescription"]
raw = "Transforms drifting mist into flowing water，a lifeline in arid regions."
status = "normal"
enUS = "Transforms drifting mist into flowing water, a lifeline in arid regions."
zhCN = "“将漂浮的雾气转化为流动的水，干旱地区的生命线。”"
zhTW = "「將漂浮的霧氣轉化為流動的水，成為乾旱地區的生命線。」"
ruRU = "Превращает плывущий туман в течащую воду, жизненно важный источник в засушливых регионах."
jaJP = "「漂う霧を流れる水に変え、乾燥した地域の命の源となる。」"
frFR = "Transforme la brume flottante en eau courante, une bouée de sauvetage dans des régions arides."
deDE = "Verwandelt schwebenden Nebel in fließendes Wasser, eine Lebensader in trockenen Regionen."
plPL = "Przekształca dryfującą mgłę w płynącą wodę, ratunek w suchych regionach."
ptBR = "Transforma a névoa flutuante em água corrente, uma tábua de salvação em regiões áridas."
koKR = "떠다니는 안개를 흐르는 물로 변환시킵니다. 메마른 지역에서의 생명선입니다."
trTR = "Yüzen sisleri akan suya dönüştürür, kurak bölgelerde hayati bir yaşam kaynağıdır."
esES = "Transforma la neblina a la deriva en agua corriente, una tabla de salvación en las regiones áridas."
itIT = "Trasforma la nebbia vagante in acqua corrente, un'ancora di salvezza nelle regioni aride."
ukUA = "Перетворює блукаючий туман на проточну воду — рятівну лінію в посушливих регіонах."
thTH = "แปลงหมอกที่ลอยอยู่ให้กลายเป็นน้ำที่ไหลได้ เป็นเส้นชีวิตในพื้นที่แห้งแล้ง"
csCZ = "Přetváří dovádějící mlhu na tekoucí vodu, životní linka v suchých oblastech."
viVN = "Biến sương mù trôi nổi thành nước chảy, một nguồn sống ở các vùng khô hạn."
caES = "Transforma la boira que es mou en aigua corrent, un salvavides a les regions àrides."
beBY = "Ператварае дрыфуючы туман у плынную ваду — выратаванне ў засушлівых раёнах."
roRO = "Transformă ceața care plutește în apă curgătoare, un colac de salvare în regiunile aride."
huHU = "A ködfoszlányokat folyóvízzé alakítja, ami életmentő forrás a száraz vidékeken."
arSA = "يحوّل الضباب المتناثر إلى مياه جارية، وهي شريان حياة في المناطق القاحلة."

