["Building.LinchiConverter.FlavorDescription"]
raw = "Beavers have finally cracked the ultimate alchemical secret: Wood + Water = More Wood. Wait, something doesn't add up..."
status = "normal"
enUS = "Beavers have finally cracked the ultimate alchemical secret: Wood + Water = More Wood. Wait, something doesn't add up..."
zhCN = "海狸们终于破解了终极炼金秘方：木材 + 水 = 更多木材。等等，似乎有些不对劲……"
zhTW = "海狸終於破解了究極煉金術祕密：木材 + 水 = 更多木材。等等，似乎有些地方不對勁……"
ruRU = "Бобры наконец разгадали последнюю алхимическую тайну: Древесина + Вода = Больше древесины. Подожди, что-то тут не сходится..."
jaJP = "ビーバーたちはついに究極の錬金術の秘密を解き明かした：木材 + 水 = さらに木材。待て、何かおかしい…"
frFR = "Les castors ont enfin percé le secret alchimique ultime : Bois + Eau = Plus de bois. Attends, quelque chose ne va pas..."
deDE = "Biber haben endlich das ultimative alchemistische Geheimnis geknackt: Holz + Wasser = mehr Holz. Warte, irgendetwas passt hier nicht..."
plPL = "Bobry w końcu rozgryzły ostateczny sekret alchemiczny: Drewno + Woda = Więcej Drewna. Czekaj, coś tu nie pasuje..."
ptBR = "Castores finalmente decifraram o segredo alquímico supremo: Madeira + Água = Mais Madeira. Espera, algo não bate..."
koKR = "비버들이 마침내 궁극의 연금술 비밀을 풀어냈다: 나무 + 물 = 더 많은 나무. 잠깐, 뭔가 맞지 않는 것 같아..."
trTR = "Kunduzlar nihayet nihai simya sırrını çözdü: Ahşap + Su = Daha Fazla Ahşap. Bekle, bir şeyler tutarsız görünüyor..."
esES = "Los castores por fin descubrieron el secreto alquímico definitivo: Madera + Agua = Más Madera. Espera, algo no cuadra..."
itIT = "I castori hanno finalmente scoperto il segreto alchemico definitivo: Legno + Acqua = Più Legno. Un momento, qualcosa non torna..."
ukUA = "Бобри нарешті розгадали найвищу алхімічну таємницю: Деревина + Вода = Більше деревини. Зачекайте, тут щось не сходиться..."
thTH = "บีเวอร์ในที่สุดก็ไขความลับการเล่นแร่แปรธาตุขั้นสูงสุดได้แล้ว: ไม้ + น้ำ = ไม้เพิ่ม รอก่อน มีบางอย่างไม่ลงตัว..."
csCZ = "Bobři konečně odhalili nejvyšší alchymistické tajemství: Dřevo + Voda = Více dřeva. Počkej, něco nesedí..."
viVN = "Các chú hải ly cuối cùng đã giải mã bí mật giả kim tối thượng: Gỗ + Nước = Nhiều gỗ hơn. Chờ đã, có gì đó không ổn..."
caES = "Els castors han descobert finalment el secret alquímic definitiu: Fusta + Aigua = Més Fusta. Espera, alguna cosa no quadra..."
beBY = "Бабры нарэшце разгадалі найвялікшы алхімічны сакрэт: Дрэва + Вада = Больш дрэва. Пачакайце, нешта не сыходзіцца..."
roRO = "Castorii au descoperit în sfârșit secretul alchimic suprem: Lemn + Apă = Mai mult lemn. Stai puțin, ceva nu se potrivește..."
huHU = "A bívók végre feltárták a végső alkímiai titkot: Fa + Víz = Több fa. Várjunk csak, valami nem stimmel..."
arSA = "أخيرًا تمكّن القنادس من كشف السر الكيميائي الأعظم: خشب + ماء = مزيد من الخشب. لحظة، هناك شيء غير منطقي..."
