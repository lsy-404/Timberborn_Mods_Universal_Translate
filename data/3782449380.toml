["Building.IndustrialSmelter.Description"]
raw = "Smelts scrap metal into metal blocks. Its innovative design fits more workers in the same amount of space."
status = "normal"
enUS = "Smelts scrap metal into metal blocks. Its innovative design fits more workers in the same amount of space."
zhCN = "将废金属熔化为金属块。其创新设计能在相同空间内容纳更多工人。"
zhTW = "將廢金屬熔煉成金屬塊。其創新的設計能在相同空間內容納更多工人。"
ruRU = "Плавит металл scrap в металлические блоки. Его инновационный дизайн позволяет разместить больше рабочих на той же площади."
jaJP = "廃 metalを金属ブロックに精錬します。革新的なデザインにより、同じスペースにより多くの作業者が収容できます。"
frFR = "Transforme les métaux en blocs métalliques. Son design innovant permet d'accueillir plus de travailleurs dans le même espace."
deDE = "Schmilzt Schrottmetall zu Metallblöcken. Sein innovatives Design ermöglicht es, mehr Arbeiter im gleichen Raum unterzubringen."
plPL = "Przerabia złom metalowy na bloki metalowe. Jego innowacyjny design pomieści więcej pracowników w tej samej przestrzeni."
ptBR = "Fundição de sucata metálica em blocos de metal. Seu design inovador comporta mais trabalhadores na mesma quantidade de espaço."
koKR = "스크랩 금속을 금속 블록으로 녹입니다. 혁신적인 디자인으로 동일한 공간에 더 많은 작업자를 배치할 수 있습니다."
trTR = "Ateş, hurda metali metal bloklara dönüştürür. Yenilikçi tasarımı, aynı alanda daha fazla işçi çalıştırmaya olanak tanır."
esES = "Funde chatarra en bloques de metal. Su diseño innovador permite que trabajen más obreros en el mismo espacio."
itIT = "Fonderia fonde rottami metallici in blocchi di metallo. Il suo design innovativo permette di ospitare più lavoratori nello stesso spazio."
ukUA = "Плавильня переплавляє металобрухт на металеві блоки. Її інноваційна конструкція дозволяє розмістити більше працівників на тій самій площі."
thTH = "หลอมเศษโลหะให้เป็นบล็อกโลหะ การออกแบบที่ล้ำสมัยทำให้รองรับคนงานได้มากขึ้นในพื้นที่เท่าเดิม"
csCZ = "Taví šrot do kovových bloků. Jeho inovativní design umožňuje umístit více pracovníků do stejného prostoru."
viVN = "Nấu chảy phế liệu thành các khối kim loại. Thiết kế sáng tạo của nó chứa đựng nhiều công nhân hơn trong cùng một không gian."
caES = "Fon metall de rebuig en blocs de metall. El seu disseny innovador permet encabir més treballadors en el mateix espai."
beBY = "Пераплаўляе металалом у металічныя блокі. Яго наватарская канструкцыя дазваляе размясціць больш працаўнікоў на той жа плошчы."
roRO = "Topește resturile de metal în blocuri de metal. Designul său inovator permite încadrarea a mai mulți lucrători în același spațiu."
huHU = "Átolvasztja a fémhulladékot fémtömbökké. Innovatív kialakításának köszönhetően ugyanakkora helyen több munkás fér el."
arSA = "يصهر الخردة المعدنية إلى كتل معدنية. يتيح تصميمه المبتكر استيعاب عدد أكبر من العمال في المساحة نفسها."

