["Faction.Pointdexters.WonderCompletionFlavor"]
raw = "After studying as much as they can about their new environment, they are ready to create a new path to the restoration of the Earth. As always, Excelsior!"
status = "normal"
enUS = "After studying as much as they can about their new environment, they are ready to create a new path to the restoration of the Earth. As always, Excelsior!"
zhCN = "“在尽可能多地研究了他们的新环境后，他们准备开辟一条通往地球恢复的新道路。和往常一样，奋发向上！”"
zhTW = "在盡可能多地研究他們的新環境後，他們已準備好開創一條恢復地球的新道路。和往常一樣，卓越無比！"
ruRU = "После того как они изучили всё, что могли, о своей новой среде, они готовы проложить новый путь к восстановлению Земли. Как всегда, Экскельсиор!"
jaJP = "新しい環境についてできる限り学んだ後、彼らは地球の復興への新たな道を切り開く準備ができました。いつものように、エクセルシオール！"
frFR = "Après avoir étudié autant qu'ils le pouvaient sur leur nouvel environnement, ils sont prêts à tracer un nouveau chemin vers la restauration de la Terre. Comme toujours, Excelsior !"
deDE = "Nachdem sie so viel wie möglich über ihre neue Umgebung gelernt haben, sind sie bereit, einen neuen Weg zur Wiederherstellung der Erde zu schaffen. Wie immer, Excelsior!"
plPL = "Po zbadaniu jak najwięcej o swoim nowym środowisku, są gotowi stworzyć nową drogę do przywrócenia Ziemi. Jak zawsze, Excelsior!"
ptBR = "Depois de estudar o máximo que puderam sobre seu novo ambiente, eles estão prontos para criar um novo caminho para a restauração da Terra. Como sempre, Excelsior!"
koKR = "새로운 환경에 대해 가능한 한 많은 연구를 한 후, 그들은 지구 복원의 새로운 길을 만들 준비가 되었습니다. 항상 그렇듯이, 엑셀시어!"
trTR = "Yeni çevreleri hakkında mümkün olduğunca çok şey öğrendikten sonra, Dünya'nın yeniden tesisi için yeni bir yol yaratmaya hazırlar. Her zamanki gibi, Excelsior!"
esES = "Después de estudiar todo lo posible sobre su nuevo entorno, están listos para trazar un nuevo camino hacia la restauración de la Tierra. ¡Como siempre, Excelsior!"
itIT = "Dopo aver studiato il più possibile il loro nuovo ambiente, sono pronti a tracciare una nuova strada verso la restaurazione della Terra. Come sempre, Excelsior!"
ukUA = "Після того як вони якомога краще вивчили своє нове середовище, вони готові прокласти новий шлях до відновлення Землі. Як завжди, Ексцельсіор!"
thTH = "หลังจากศึกษาสภาพแวดล้อมใหม่ของพวกเขาอย่างละเอียดเท่าที่ทำได้ พวกเขาก็พร้อมที่จะสร้างเส้นทางใหม่สู่การฟื้นฟูโลก ตามปกติแล้ว เอ็กเซลซิเออร์!"
csCZ = "Po co nejvíce nastudovali o svém novém prostředí, jsou připraveni vytvořit novou cestu k obnovení Země. Jako vždy, Excelsior!"
viVN = "Sau khi nghiên cứu càng nhiều càng tốt về môi trường mới của họ, họ đã sẵn sàng để tạo ra một con đường mới cho việc phục hồi Trái Đất. Như mọi khi, Excelsior!"
caES = "Després d'estudiar tot el que poden sobre el seu nou entorn, estan preparats per obrir un nou camí cap a la restauració de la Terra. Com sempre, Excelsior!"
beBY = "Пасля вывучэння свайго новага асяроддзя, наколькі гэта магчыма, яны гатовыя пракласці новы шлях да аднаўлення Зямлі. Як заўсёды, Excelsior!"
roRO = "După ce au studiat cât de mult pot despre noul lor mediu, sunt gata să deschidă o nouă cale spre restaurarea Pământului. Ca întotdeauna, Excelsior!"
huHU = "A környezetük minden lehető részletét megtanulmányozva új utat készülnek kijelölni a Föld helyreállítása felé. Ahogy mindig, Excelsior!"
arSA = "بعد أن درسوا كل ما استطاعوا عن بيئتهم الجديدة، أصبحوا مستعدين لشق طريق جديد نحو استعادة كوكب الأرض. كعادتهم دائمًا، إكسلسيور!"

["Faction.Pointdexters.WonderCompletionMessage"]
raw = "Eureka, you've done it! By devoting yourself to the pursuit of science you managed to master the Pointdexters and harness this map's resources to build the faction's wonder."
status = "normal"
enUS = "Eureka, you've done it! By dedicating yourself to the pursuit of science, you have mastered the Pointdexters and harnessed this map's resources to construct the faction's wonder."
zhCN = "“好极了，你成功了！通过致力于科学的追求，你掌握了Pointdexters，并利用这片地图的资源建造了这个派系的奇迹。”"
zhTW = "「太好了，你成功了！通過專注於科學的探索，你掌握了點智族並利用這張地圖的資源建立了該派系的奇觀。」"
ruRU = "Эврика, вы это сделали! Посвятив себя научным исследованиям, вы смогли овладеть Поинтдекстерами и использовать ресурсы этой карты для строительства чуда фракции."
jaJP = "「ユーレカ、あなたはやりました！科学の探求に身を捧げることで、ポイントデクスターをマスターし、このマップの資源を活用して派閥の驚異を建設しました。」"
frFR = "Eureka, vous l'avez fait ! En vous consacrant à la recherche scientifique, vous avez réussi à maîtriser les Pointdexters et à exploiter les ressources de cette carte pour construire la merveille de la faction."
deDE = "Eureka, du hast es geschafft! Indem du dich der Wissenschaft gewidmet hast, hast du es geschafft, die Pointdexters zu meistern und die Ressourcen dieser Karte zu nutzen, um das Wunder der Fraktion zu bauen."
plPL = "Eureka, udało ci się! Poświęcając się dążeniu do nauki, udało ci się opanować Pointdexters i wykorzystać zasoby tej mapy do zbudowania cudów frakcji."
ptBR = "Eureka, você conseguiu! Ao dedicar-se à busca pela ciência, você conseguiu dominar os Pointdexters e aproveitar os recursos deste mapa para construir a maravilha da facção."
koKR = "유레카, 당신이 해냈습니다! 과학 탐구에 헌신함으로써 포인텍스터스를 정복하고 이 맵의 자원을 활용하여 종족의 경이로움을 건설했습니다."
trTR = "Eureka, başardın! Bilim peşinde kendini adayıp Pointdexters'ı ustaca yönetmeyi ve bu haritanın kaynaklarını kullanarak fraksiyonun harikasını inşa etmeyi başardın."
esES = "¡Eureka, lo has logrado! Al dedicarte por completo a la búsqueda de la ciencia, conseguiste dominar a los Pointdexters y aprovechar los recursos de este mapa para construir la maravilla de la facción."
itIT = "Eureka, ce l'hai fatta! Dedicandoti alla ricerca scientifica sei riuscita a padroneggiare i Pointdexters e a sfruttare le risorse di questa mappa per costruire la meraviglia della fazione."
ukUA = "Евріка, у вас вийшло! Відданим науці служінням ви зуміли підкорити Pointdexters і використати ресурси цієї карти, щоб звести диво фракції."
thTH = "ยูเรกา คุณทำได้แล้ว! ด้วยการอุทิศตนเพื่อการค้นคว้าวิทยาศาสตร์ คุณสามารถเชี่ยวชาญ Pointdexters และใช้ทรัพยากรของแผนที่นี้เพื่อสร้างสิ่งมหัศจรรย์ของกลุ่มได้สำเร็จ"
csCZ = "Eureka, dokázali jste to! Díky svému oddání vědeckému bádání se vám podařilo ovládnout Pointdexters a využít zdroje na této mapě k postavení zázraku frakce."
viVN = "Thật tuyệt vời, bạn đã làm được! Bằng cách cống hiến cho việc theo đuổi khoa học, bạn đã thành thạo các Pointdexters và khai thác tài nguyên của bản đồ này để xây dựng kỳ quan của phe."
caES = "Eureka, ho has aconseguit! Dedicant-te a la recerca científica, has aconseguit dominar els Pointdexters i aprofitar els recursos d'aquest mapa per construir la meravella de la facció."
beBY = "Эўрыка, вы справіліся! Прысвяціўшы сябе пошуку навукі, вы навучыліся кіраваць Pointdexters і выкарыстоўваць рэсурсы гэтай карты, каб пабудаваць цуд фракцыі."
roRO = "Eureka, ai reușit! Prin dedicarea ta căutării științei ai reușit să stăpânești Pointdexters și să valorifici resursele acestei hărți pentru a construi minunea facțiunii."
huHU = "Eureka, megcsináltad! A tudomány iránti odaadásoddal sikerült elsajátítanod a Pointdextereket, és ennek a térképnek az erőforrásait felhasználva felépítetted a frakció csodáját."
arSA = "يوريكا، لقد نجحت! بتكريسك نفسك لطلب العلم تمكنت من إتقان \"البوينتدكسترز\" وتسخير موارد هذه الخريطة لبناء أعجوبة الفصيل."

["Building.AdvancedBreedingPodPointdexters.FlavorDescription"]
raw = "Through science and medicine, we mastered the key to a healthy working environment: skipping childhood entirely!"
status = "normal"
enUS = "Through science and medicine, we mastered the key to a healthy working environment: skipping childhood entirely!"
zhCN = "“通过科学和医学，我们掌握了健康工作环境的关键：完全跳过童年！”"
zhTW = "通過科學和醫學，我們掌握了一個健康工作環境的關鍵：完全跳過童年！"
ruRU = "С помощью науки и медицины мы освоили секрет здоровой рабочей среды: полностью пропуская детство!"
jaJP = "「科学と医学を通じて、私たちは健康的な作業環境の鍵を習得しました：幼少期を完全にスキップすることです！」"
frFR = "Grâce à la science et à la médecine, nous avons maîtrisé la clé d'un environnement de travail sain : sauter complètement l'enfance !"
deDE = "Durch Wissenschaft und Medizin haben wir den Schlüssel zu einer gesunden Arbeitsumgebung gemeistert: Die gesamte Kindheit einfach überspringen!"
plPL = "Dzięki nauce i medycynie opanowaliśmy klucz do zdrowego miejsca pracy: całkowite pominięcie dzieciństwa!"
ptBR = "Através da ciência e da medicina, dominamos a chave para um ambiente de trabalho saudável: pular a infância completamente!"
koKR = "과학과 의학을 통해 우리는 건강한 작업 환경의 열쇠를 마스터했습니다: 어린 시절을 완전히 건너뛰는 것!"
trTR = "Bilim ve tıp sayesinde, sağlıklı bir çalışma ortamının anahtarını öğrendik: çocukluğu tamamen atlamak!"
esES = "A través de la ciencia y la medicina, dominamos la clave para un entorno de trabajo saludable: ¡saltarnos la infancia por completo!"
itIT = "Attraverso la scienza e la medicina, abbiamo padroneggiato la chiave per un ambiente di lavoro sano: saltare completamente l'infanzia!"
ukUA = "Завдяки науці та медицині ми опанували ключ до здорового робочого середовища: повністю пропускати дитинство!"
thTH = "ผ่านวิทยาศาสตร์และการแพทย์ เรามาไขความลับของสภาพแวดล้อมการทำงานที่ดีต่อสุขภาพได้แล้ว นั่นคือการข้ามวัยเด็กไปเลยทั้งหมด!"
csCZ = "Vědou a medicínou jsme zvládli klíč k zdravému pracovnímu prostředí: úplně přeskočit dětství!"
viVN = "Thông qua khoa học và y học, chúng tôi đã làm chủ chìa khóa của một môi trường làm việc lành mạnh: bỏ qua hoàn toàn tuổi thơ!"
caES = "Mitjançant la ciència i la medicina, hem dominat la clau per a un entorn de treball saludable: saltar-nos la infància per complet!"
beBY = "Праз навуку і медыцыну мы авалодалі ключом да здаровага працоўнага асяроддзя: цалкам прапусціць дзяцінства!"
roRO = "Prin știință și medicină, am stăpânit cheia unui mediu de lucru sănătos: sărirea peste copilărie cu totul!"
huHU = "Tudomány és orvostudomány révén elsajátítottuk az egészséges munkakörnyezet kulcsát: a gyermekkor teljes kihagyását!"
arSA = "عن طريق العلم والطب، أتقنّا سرّ بيئة عمل صحية: تخطي الطفولة تماماً!"
