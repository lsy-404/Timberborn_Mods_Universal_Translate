["Building.IceBath.FlavorDescription"]
raw = "The beavers can't decide if this is a pleasure or a punishment, but it doesn't stop them from coming here often."
status = "normal"
enUS = "The beavers can't decide if this is a pleasure or a punishment, but it doesn't stop them from coming here often."
zhCN = "“海狸们无法决定这是快乐还是惩罚，但这并不妨碍他们经常来到这里。”"
zhTW = "「海狸們無法決定這是享受還是懲罰，但這並不妨礙他們經常來這裡。」"
ruRU = "«Бобры не могут решить, является ли это удовольствием или наказанием, но это не мешает им часто приходить сюда.»"
jaJP = "ビーバーたちはこれが楽しいのか罰なのか決められませんが、だからといってここに頻繁に来るのをやめるわけではありません。"
frFR = "Les castors ne peuvent pas décider s'il s'agit d'un plaisir ou d'une punition, mais cela ne les empêche pas de venir ici souvent."
deDE = "Die Biber können sich nicht entscheiden, ob dies ein Vergnügen oder eine Bestrafung ist, aber das hält sie nicht davon ab, oft hierher zu kommen."
plPL = "Bóbr nie może zdecydować, czy to przyjemność, czy kara, ale to nie powstrzymuje ich przed częstym przychodzeniem tutaj."
ptBR = "Os castores não conseguem decidir se isso é um prazer ou um castigo, mas isso não os impede de vir aqui com frequência."
koKR = "비버들은 이것이 즐거움인지 처벌인지 결정을 내릴 수 없지만, 그렇다고 해서 자주 이곳에 오는 것을 멈추지는 않습니다."
trTR = "Kunduzlar bunun bir zevk mi yoksa bir ceza mı olduğuna karar veremiyor, ama bu onları buraya sık sık gelmekten alıkoymuyor."
esES = "Los castores no saben si esto es un placer o un castigo, pero eso no les impide venir aquí con frecuencia."
itIT = "I castori non sanno se sia un piacere o una punizione, ma questo non impedisce loro di venire qui spesso."
ukUA = "Бобри не можуть вирішити, це задоволення чи покарання, але це не заважає їм часто приходити сюди."
thTH = "บีเวอร์ยังตัดสินใจไม่ได้ว่าที่นี่เป็นความสุขหรือการลงโทษ แต่ก็ไม่ได้หยุดพวกมันจากการมาที่นี่บ่อย ๆ"
csCZ = "“Někdy si bobři nejsou jisti, jestli je to požitkem nebo trestem, ale to je neodrazuje od toho, aby sem chodili často.”"
viVN = "Những con castor không thể quyết định đây là một niềm vui hay là một hình phạt, nhưng điều đó không ngăn cản chúng đến đây thường xuyên."
caES = "Els castors no saben si això és un plaer o un càstig, però això no els impedeix venir aquí sovint."
beBY = "Бобры не могут решить, удовольствие это или наказание, но это не мешает им часто сюда приходить."
roRO = "Castorii nu se pot hotărî dacă aceasta este o plăcere sau o pedeapsă, dar asta nu îi oprește să vină aici foarte des."
huHU = "A békák nem tudják eldönteni, hogy ez öröm vagy büntetés, de ez nem akadályozza meg őket abban, hogy gyakran idejöjjenek."
arSA = "لا يستطيع القنادس الحسم إن كان هذا متعة أم عقابًا، لكن ذلك لا يمنعهم من المجيء إلى هنا كثيرًا."

["Building.Symposium.Description"]
raw = "A large amphitheater where the smartest beavers gather to share their knowledge with one another."
status = "normal"
enUS = "A large amphitheater where the smartest beavers gather to share their knowledge with one another."
zhCN = "一个大型圆形剧场，最聪明的海狸聚集在一起分享他们的知识。"
zhTW = "一個大型的圓形劇場，最聰明的海狸聚集在此相互分享他們的知識。"
ruRU = "Большой амфитеатр, где самые умные бобры собираются, чтобы делиться своими знаниями друг с другом."
jaJP = "「賢いビーバーたちが集まり、互いに知識を共有する大きな円形劇場。」"
frFR = "Un grand amphithéâtre où les castors les plus intelligents se rassemblent pour partager leurs connaissances entre eux."
deDE = "Ein großes Amphitheater, in dem die cleversten Biber zusammenkommen, um ihr Wissen miteinander zu teilen."
plPL = "Duży amfiteatr, w którym zbierają się najbystrzejsze bobry, aby dzielić się swoją wiedzą."
ptBR = "Um grande anfiteatro onde os castores mais inteligentes se reúnem para compartilhar seu conhecimento uns com os outros."
koKR = "가장 똑똑한 비버들이 모여 서로의 지식을 공유하는 대규모 원형 극장입니다."
trTR = "Diğerleriyle bilgilerini paylaşmak için en zeki kunduzların toplandığı büyük bir amfitiyatro."
esES = "Un gran anfiteatro donde los castores más inteligentes se reúnen para compartir sus conocimientos entre ellos."
itIT = "Un grande anfiteatro dove i castori più intelligenti si riuniscono per condividere le proprie conoscenze l'uno con l'altro."
ukUA = "Великий амфітеатр, де найрозумніші бобри збираються, щоб ділитися знаннями один з одним."
thTH = "อัฒจันทร์ขนาดใหญ่ที่เหล่าบีเวอร์ที่ฉลาดที่สุดมารวมตัวกันเพื่อแบ่งปันความรู้ให้กัน"
csCZ = "Velké amfiteátr, kde se scházejí nejchytřejší bobři, aby si navzájem sdíleli své znalosti."
viVN = "Một nhà hát lớn nơi những con beaver thông minh tập trung lại để chia sẻ kiến thức với nhau."
caES = "Un gran amfiteatre on els castors més intel·ligents es reuneixen per compartir els seus coneixements entre ells."
beBY = "Вялікі амфітэатр, куды збіраюцца найразумнейшыя бабры, каб дзяліцца адзін з адным сваімі ведамі."
roRO = "Un amfiteatru mare unde cei mai inteligenți castori se adună pentru a-și împărtăși cunoștințele unii cu alții."
huHU = "Egy nagy amfiteátrum, ahol a legokosabb bívók gyűlnek össze, hogy megosszák egymással tudásukat."
arSA = "مدرج كبير حيث يجتمع أذكى القنادس لتبادل معارفهم فيما بينهم."

