enUS = "It's hot and it's cold, it's yes and it's no, it's in and it's out, it's up and it's down."
zhCN = "“它热，它冷，它是，是不是，它在，它出，它上，它下。”"
zhTW = "它是熱的，它是冷的，它是肯定的，它是否定的，它是在裡面的，它是在外面的，它是向上的，它是向下的。"
ruRU = "Здесь жарко и холодно, да и нет, внутри и снаружи, вверх и вниз."
jaJP = "それは熱いし寒い、はいでありいいえであり、内であり外であり、上であり下である。"
frFR = "C'est chaud et c'est froid, c'est oui et c'est non, c'est dedans et c'est dehors, c'est en haut et c'est en bas."
deDE = "Es ist heiß und es ist kalt, es ist ja und es ist nein, es ist drinnen und es ist draußen, es ist oben und es ist unten."
plPL = "Jest gorąco i zimno, jest tak i nie, jest w środku i na zewnątrz, jest w górę i w dół."
ptBR = "É quente e é frio, é sim e é não, é dentro e é fora, é para cima e é para baixo."
koKR = "뜨겁고 차갑고, 예하고 아니고, 안과 밖, 위와 아래."
trTR = "Sıcak ve soğuk, evet ve hayır, içinde ve dışında, yukarıda ve aşağıda."
esES = "Es caliente y es frío, es sí y es no, es dentro y es fuera, es arriba y es abajo."
itIT = "È caldo e freddo, è sì e è no, è dentro e è fuori, è su e è giù."
ukUA = "Воно гаряче і воно холодне, воно так і воно ні, воно всередині і воно зовні, воно вгорі і воно внизу."
thTH = "ร้อนก็ใช่ เย็นก็ได้ ตอบรับก็ได้ ปฏิเสธก็ได้ ข้างในก็ได้ ข้างนอกก็ได้ ขึ้นก็ได้ ลงก็ได้"
csCZ = "Je to horké a studené, je to ano a ne, je to dovnitř a ven, je to nahoru a dolů."
viVN = "Nó nóng và nó lạnh, nó có và nó không, nó ở trong và nó ở ngoài, nó lên và nó xuống."
caES = "És calent i és fred, és sí i és no, és dins i és fora, és amunt i és avall."
beBY = "Яно гарачае і яно халоднае, яно так і яно не, яно ўнутры і яно звонку, яно ўверсе і яно ўнізе."
roRO = "Este fierbinte și este rece, este da și este nu, este înăuntru și este afară, este sus și este jos."
huHU = "Forró és hideg, igen és nem, be és ki, fel és le."
arSA = "هو حار وهو بارد، هو نعم وهو لا، هو داخل وهو خارج، هو أعلى وهو أسفل."

