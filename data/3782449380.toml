["Building.IceBath.Description"]
raw = "An icy tub that keeps your beavers' skin young and tight. Also, bubbles!"
status = "normal"
enUS = "An icy tub that keeps your beavers' skin young and tight. Also, bubbles!"
zhCN = "一个冰冷的浴缸，可以保持你的海狸皮肤年轻紧致。同时，还有气泡！"
zhTW = "一個冰冷的浴缸，可以保持你的海狸皮膚年輕緊緻。此外，還有泡泡！"
ruRU = "Ледяная ванна, которая сохраняет кожу ваших бобров молодой и упругой. Также, пузырики!"
jaJP = "若く引き締まった肌を保つ氷の湯船。さらに、泡も出ます！"
frFR = "Une baignoire glacée qui garde la peau de vos castors jeune et ferme. De plus, des bulles !"
deDE = "Eine eiskalte Badewanne, die die Haut deiner Biber jung und straff hält. Außerdem, Blasen!"
plPL = "Zimna wanna, która utrzymuje skórę twoich bobrów młodą i jędrną. A także bąbelki!"
ptBR = "Uma banheira gelada que mantém a pele dos seus castores jovem e firme. Além disso, bolhas!"
koKR = "너의 비버의 피부를 젊고 탄력 있게 유지해주는 얼음 욕조. 그리고, 거품도!"
trTR = "Heyvanlarınızın derisini genç ve sıkı tutan buzlu bir küvet. Ayrıca, baloncuklar!"
esES = "Una bañera helada que mantiene la piel de tus castores joven y tersa. ¡Además, burbujas!"
itIT = "Una vasca di ghiaccio che mantiene la pelle dei tuoi castori giovane e tonica. Inoltre, bolle!"
ukUA = "Крижана ванна, яка тримає шкіру ваших бобрів молодою та підтягнутою. Також бульбашки!"
thTH = "อ่างน้ำแข็งเย็นเฉียบที่ช่วยให้ผิวของบีเวอร์ของคุณดูอ่อนเยาว์และกระชับ อีกอย่าง มีฟองอากาศด้วย!"
csCZ = "Ledová vana, která udržuje pleť vašich bobrů mladou a pevnou. Také bublinky!"
viVN = "Một bồn tắm lạnh giúp da của những con beaver luôn tươi trẻ và căng mịn. Cũng có bọt nữa!"
caES = "Una banyera gelada que manté la pell dels teus castors jove i tensa. A més, bombolles!"
beBY = "Крыгаватая ванна, якая захоўвае скуру вашых баброў маладой і напятай. Яшчэ і бурбалкі!"
roRO = "O cadă cu gheață care menține pielea castorilor tânără și fermă. Și, bule!"
huHU = "Egy jeges kád, amely megőrzi a bébrék bőrének fiatalságát és feszességét. Ráadásul buborékok is vannak!"
arSA = "حوض جليدي يحافظ على بشرة قنادسك شابة ومشدودة. وأيضًا، فقاعات!"

