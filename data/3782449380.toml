["Building.AutomatedWaterPump.FlavorDescription"]
raw = "Why do it yourself when you can build something to do it for you?"
status = "normal"
enUS = "Why do it yourself when you can build something to do it for you?"
zhCN = "为什么要自己动手，当你可以建造一些东西来为你完成这些工作？"
zhTW = "「為什麼自己動手，當你可以建造一些東西來替你完成？」"
ruRU = "Зачем делать это самим, когда можно построить что-то, что сделает это за вас?"
jaJP = "「自分でやる必要はありません、あなたのためにそれをするものを建設できますから。」"
frFR = "Pourquoi le faire soi-même quand on peut construire quelque chose pour le faire à sa place ?"
deDE = "Warum es selbst tun, wenn du etwas bauen kannst, das es für dich erledigt?"
plPL = "Po co robić to samodzielnie, skoro możesz zbudować coś, co zrobi to za ciebie?"
ptBR = "Por que fazer você mesmo quando pode construir algo para fazer isso por você?"
koKR = "왜 스스로 할 필요가 있나요, 당신을 위해 할 수 있는 무언가를 만들 수 있을 때?"
trTR = "Neden kendin yapasın ki, senin için bunu yapacak bir şey inşa edebilirsin?"
esES = "¿Para qué hacerlo tú mismo si puedes construir algo que lo haga por ti?"
itIT = "Perché farlo da soli quando puoi costruire qualcosa che lo faccia al posto tuo?"
ukUA = "Навіщо робити самому, якщо можна побудувати щось, що зробить це за тебе?"
thTH = "ทำเองทำไม ในเมื่อสร้างสิ่งที่ทำแทนคุณได้"
csCZ = "Proč to dělat sám, když si můžeš postavit něco, co to udělá za tebe?"
viVN = "Tại sao phải tự làm khi bạn có thể xây dựng một thứ để làm điều đó cho bạn?"
caES = "Per què fer-ho tu mateix quan pots construir alguna cosa que ho faci per tu?"
beBY = "Навошта рабіць самому, калі можна пабудаваць нешта, што зробіць гэта за цябе?"
roRO = "De ce să o faci tu când poți construi ceva care o face în locul tău?"
huHU = "Miért csinálnád magad, ha építhetsz valamit, ami helyetted csinálja?"
