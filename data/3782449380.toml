["Building.SolarPanels.FlavorDescription"]
raw = "We harnessed fire, then water, the logical next step was the sun!"
status = "normal"
enUS = "We harnessed fire, then water, the logical next step was the sun!"
zhCN = "“我们掌握了火，再掌握了水，下一步逻辑就是阳光！”"
zhTW = "「我們利用了火，然後是水，邏輯上的下一步就是太陽！」"
ruRU = "Мы освоили огонь, затем воду, логичным следующим шагом было солнце!"
jaJP = "「私たちは火を利用し、水を利用しました。次の論理的なステップは太陽です！」"
frFR = "Nous avons maîtrisé le feu, puis l'eau, la prochaine étape logique était le soleil !"
deDE = "Wir nutzten das Feuer, dann das Wasser, der logische nächste Schritt war die Sonne!"
plPL = "Użyliśmy ognia, potem wody, więc logicznym krokiem było słońce!"
ptBR = "Domamos o fogo, depois a água, o próximo passo lógico foi o sol!"
koKR = "우리는 불과 물을 이용했고, 다음 논리적인 단계는 태양이었습니다!"
trTR = "Önce ateşi, sonra suyu kontrol altına aldık, mantıklı bir sonraki adım güneşti!"
esES = "Domamos el fuego, luego el agua; el siguiente paso lógico era el sol."
itIT = "Abbiamo domato il fuoco, poi l'acqua, e il passo logico successivo era il sole!"
ukUA = "Ми приборкали вогонь, потім воду, а логічним наступним кроком стало сонце!"
thTH = "เราควบคุมไฟ แล้วก็น้ำ ขั้นตอนต่อไปที่สมเหตุสมผลคือดวงอาทิตย์!"
csCZ = "Zvládli jsme oheň, pak vodu, logickým dalším krokem bylo slunce!"
viVN = "Chúng tôi đã khai thác lửa, sau đó là nước, bước tiếp theo hợp lý là mặt trời!"
caES = "Vam domar el foc, després l'aigua; el pas lògic següent era el sol!"
beBY = "Мы укаротвалі агонь, потым ваду, і лагічным наступным крокам стала сонца!"
roRO = "Am domesticit focul, apoi apa, iar pasul următor, firesc, a fost soarele!"
huHU = "Megszelídítettük a tüzet, aztán a vizet, a logikus következő lépés pedig a Nap volt!"
arSA = "لقد سخّرنا النار، ثم الماء، والخطوة المنطقية التالية كانت الشمس!"

