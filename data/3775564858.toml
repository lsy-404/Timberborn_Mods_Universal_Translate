["Grows.Parsnips.Cite"]
raw = "It's meh, good thing too otherwise all the leafcoats would have to decide between having no parsnips or being hated by their own kind 😅"
status = "normal"
enUS = "It's okay, good thing too otherwise all the leafcoats would have to choose between having no parsnips or being hated by their own kind 😅"
zhCN = "“这没什么好，幸好要不然所有的叶子外套都得在没有胡萝卜和被自己人厌恶之间做出选择😅”"
zhTW = "「這一般般，真是幸運，否則所有的葉衣族都得在沒有根莖或被自己同類厭惡之間做選擇😅」"
