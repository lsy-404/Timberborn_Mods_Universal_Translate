jaJP = "「まぁまぁだね、そうじゃなかったら、すべてのリーフコートはパースニップがないか、自分たちの仲間に嫌われるかの選択をしなければならなかっただろうから😅」"
frFR = "C'est bof, tant mieux sinon tous les leafcoats auraient dû choisir entre ne pas avoir de panais ou être détestés par les leurs 😅"
deDE = "Ist okay, gut so, sonst müssten alle Blätterer entscheiden, ob sie keine Pastinaken haben oder von ihrem eigenen Volk gehasst werden 😅"
plPL = "Jest średnio, dobrze, bo inaczej wszyscy liściści musieliby decydować między brakiem pasternaków a tym, że będą nienawidzeni przez własny gatunek 😅"
ptBR = "É mediano, ainda bem que senão todos os folhacos teriam que decidir entre não ter pastinacas ou serem odiados pela sua própria espécie 😅"
koKR = "그냥 그래, 그렇지 않으면 모든 리프코트들이 파르슬립스가 없거나 자기들끼리 미움받는 것 중 하나를 선택해야 했을 거야 😅"
csCZ = "Je to takový průměr, naštěstí, jinak by se všechny listovky musely rozhodnout mezi tím, zda mít bez petrželky, nebo být nenáviděny svým vlastním druhem 😅"
viVN = "Nó bình thường, may mắn là vậy nếu không thì tất cả những người mặc áo khoác lá sẽ phải chọn giữa việc không có củ cải đường hoặc bị chính đồng loại của họ ghét 😅"
trTR = "Eh, bu da iyi bir şey, yoksa bütün yaprak elbiseleri ya hiç yer havucu olmaya ya da kendi türlerinden nefret edilmesine karar vermek zorunda kalırdı 😅"

