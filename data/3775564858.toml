koKR = "우리가 이농사를 언제 시작했지? 응? 어떤 비버가 그들이 일본인에서 이세계로 넘어왔다고 했다고? 말도 안 돼, 그건 불가능해!"
trTR = "Ne zaman buğday tarımına başladık? He? Bir kunduz, Japon bir insandan isekai'den geldiklerini mi söyledi? Saçmalama, bu imkansız."
esES = "¿Cuándo empezamos a cultivar esto? ¿Eh? ¿Un castor dijo que fueron isekai desde un jumano shapanés? No seas ridiculús, eso es imposible"
itIT = "Quando abbiamo cominciato a coltivare queste? Eh? Un castoro ha detto che sono state isekaiate da un hooman shapanese? Non dire ridicolus, è impossibile"
ukUA = "Коли ми почали їх вирощувати? Га? Один бобер казав, що їх ісекайнуло з якогось японського хумана? Та не будь таким абсурдним, це ж неможливо"
thTH = "เราเริ่มปลูกพวกนี้ตั้งแต่เมื่อไหร่กัน? หา? บีเวอร์ตัวหนึ่งบอกว่าพวกเขาถูกส่งไปต่างโลกโดยมนุษย์ชาวญี่ปุ่นงั้นเหรอ? อย่าพูดเหลวไหลน่า เป็นไปไม่ได้หรอก"
csCZ = "Kdy jsme začali farmářit s těmito? Co? Bobr říkal, že se isekai'd z japonského člověka? Nebuď směšný, to je nemožné."
viVN = "Khi nào chúng ta bắt đầu trồng những thứ này? Hả? Một con rái cá nói rằng chúng đã chuyển sinh từ một con người Nhật Bản? Đừng có nực cười, điều đó là không thể."
caES = "Quan vam començar a cultivar aquestes? Eh? Un castor va dir que van arribar d'un món paral·lel des d'un humà shapanès? No siguis ridícul, això és impossible"
beBY = "Калі мы пачалі іх вырошчваць? Га? Нехта з бабраў казаў, што яны прыйшлі да нас з ісэкай ад нейкага шапанскага чалавека? Не будзь дурнем, гэта немагчыма"
