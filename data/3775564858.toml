huHU = "Mikor kezdtük el ezeket termeszteni? Mi? Egy hód azt mondta, hogy egy shapanese hooman isekai-zott ide? Ne legyél már nevetséges, ez lehetetlen."
arSA = "متى بدأنا بزراعة هذه؟ هاه؟ قال أحد القنادس إنها جاءت من عالم آخر من بشري شابانيزي؟ لا تكن سخيفًا، هذا مستحيل"

