zhCN = "“真是的！？一只海狸的农业水平差到什么程度才能种出干枯的卷心菜！？”"
zhTW = "真的嗎！？一隻海狸的農業技術差到什麼地步才能種出乾燥的捲心菜！"
ruRU = "Серьезно!? Насколько плохим фермером должен быть бобер, чтобы делать сухие капусты!?"
jaJP = "「冗談でしょ！？ビーバーはどれだけ農業が下手だったら干しキャベツを作ることになるの！？ 」"
frFR = "Sérieusement!? Jusqu'à quel point un castor doit-il être mauvais en agriculture pour faire des choux secs!?"
deDE = "„Im Ernst!? Wie schlecht muss ein Biber im Landwirtschaften sein, um trockene Kohlen zu produzieren!?”"
plPL = "Na serio!? Jak bardzo beaver musi być zły w uprawie, żeby zrobić suche kapusty!?"
ptBR = "Sério!? Quão ruim em agricultura um castor precisa ser para fazer repolhos secos!?"
koKR = "진짜!? 비버가 건조한 양배추를 만들려면 농사 실력이 얼마나 나빠야 하는 거야!?"
trTR = "Ciddiyetten bu kadar kötü bir çiftçi olması gereken bir kunduz var mı ki kuru lahana yapabiliyor!?"
esES = "¡¿En serio!? ¡¿Qué tan malo en la agricultura tiene que ser un castor para conseguir repollos secos!?"
itIT = "Sul serio!? Quanto bisogna essere incapaci nell'agricoltura per un castoro per far seccare i cavoli!?"
ukUA = "Серйозно?! Наскільки ж треба бути поганим у землеробстві, щоб бобер зміг виростити сухі капустяні голови!?"
thTH = "จริงเหรอเนี่ย! บีเวอร์ต้องห่วยเรื่องทำฟาร์มขนาดไหนกันถึงปลูกกะหล่ำปลีจนแห้งตายได้!?"
csCZ = "Vážně!? Jak špatný musí být bobr v zemědělství, aby vyprodukoval suché zelí!?"
viVN = "Thật sao!? Một con nhím phải tệ đến mức nào trong việc trồng trọt mới làm ra bắp cải khô như vậy!?"
caES = "Seriosament!? Quina mala collita ha de fer un castor perquè les cols surtin seques!?"
beBY = "Сур'ёзна?! Наколькі кепска бабёр павінен ведаць земляробства, каб вырасціць сухую капусту?!"
