["Grows.Parsnips.Cite"]
raw = "It's meh, good thing too otherwise all the leafcoats would have to decide between having no parsnips or being hated by their own kind 😅"
status = "normal"
enUS = "It's okay, good thing too otherwise all the leafcoats would have to choose between having no parsnips or being hated by their own kind 😅"
zhCN = "“这没什么好，幸好要不然所有的叶子外套都得在没有胡萝卜和被自己人厌恶之间做出选择😅”"
zhTW = "「這一般般，真是幸運，否則所有的葉衣族都得在沒有根莖或被自己同類厭惡之間做選擇😅」"
ruRU = "Это так себе, хорошо, что иначе всем листопадам пришлось бы выбирать между отсутствием пастернака и ненавистью со стороны своих сородичей 😅"
jaJP = "「まぁまぁだね、そうじゃなかったら、すべてのリーフコートはパースニップがないか、自分たちの仲間に嫌われるかの選択をしなければならなかっただろうから😅」"
frFR = "C'est bof, tant mieux sinon tous les leafcoats auraient dû choisir entre ne pas avoir de panais ou être détestés par les leurs 😅"
deDE = "Ist okay, gut so, sonst müssten alle Blätterer entscheiden, ob sie keine Pastinaken haben oder von ihrem eigenen Volk gehasst werden 😅"
plPL = "Jest średnio, dobrze, bo inaczej wszyscy liściści musieliby decydować między brakiem pasternaków a tym, że będą nienawidzeni przez własny gatunek 😅"
ptBR = "É mediano, ainda bem que senão todos os folhacos teriam que decidir entre não ter pastinacas ou serem odiados pela sua própria espécie 😅"
koKR = "그냥 그래, 그렇지 않으면 모든 리프코트들이 파르슬립스가 없거나 자기들끼리 미움받는 것 중 하나를 선택해야 했을 거야 😅"
trTR = "Eh, bu da iyi bir şey, yoksa bütün yaprak elbiseleri ya hiç yer havucu olmaya ya da kendi türlerinden nefret edilmesine karar vermek zorunda kalırdı 😅"
esES = "Bah, menos mal, porque si no, todos los leafcoats tendrían que elegir entre no tener chirivías o ser odiados por los suyos 😅"
itIT = "Così così, meno male, altrimenti tutti i leafcoats dovrebbero scegliere tra non avere pastinache o essere odiati dai propri simili 😅"
ukUA = "Та так собі, але добре, бо інакше всім leafcoats довелося б обирати між відсутністю пастернаку і ненавистю своїх же одноплемінників 😅"
thTH = "มันก็งั้นๆ แต่ดีแล้วที่เป็นแบบนี้ ไม่อย่างนั้นพวกหางไม้ทุกตัวคงต้องเลือกระหว่างการไม่มีพาร์สนิปกับการถูกเผ่าพันธุ์ของตัวเองเกลียด 😅"
csCZ = "Je to takový průměr, naštěstí, jinak by se všechny listovky musely rozhodnout mezi tím, zda mít bez petrželky, nebo být nenáviděny svým vlastním druhem 😅"
viVN = "Nó bình thường, may mắn là vậy nếu không thì tất cả những người mặc áo khoác lá sẽ phải chọn giữa việc không có củ cải đường hoặc bị chính đồng loại của họ ghét 😅"
caES = "Està bé, no més, i menys mal, perquè altrament tots els leafcoats haurien de decidir entre no tenir pastanagues blanques o ser odiats pels de la seva pròpia espècie 😅"
beBY = "Гэта так сабе, і добра, бо інакш усім лістапёрым давялося б выбіраць паміж адсутнасцю пастарнаку і тым, што іх ненавідзяць уласныя суродзічы 😅"
roRO = "E mda, și bine că e așa, altfel toți leafcoats ar fi nevoiți să aleagă între a nu avea păstârnac sau a fi urâți de proprii lor semeni 😅"
huHU = "Nem túl nagy szám, de jó is ez így, különben a leafcoatoknak választaniuk kellene aközött, hogy nem lesz pasztinákjuk, vagy a saját fajtájuk fogja utálni őket 😅"
arSA = "حسنًا، الأمر ليس مثاليًا، ولحسن الحظ أن الأمر لم يصل إلى هذا الحد، وإلا لكان على كل الليفكوتس الاختيار بين عدم وجود الجزر الأبيض أو أن يكرههم بنو جنسهم 😅"

