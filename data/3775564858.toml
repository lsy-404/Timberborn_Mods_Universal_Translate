["Grows.BlueberryPlant.Cite"]
raw = "Why don't these quench our thirst even a little?"
status = "normal"
enUS = "Why don't these quench our thirst even a little?"
zhCN = "“为什么这些根本不能解渴呢？”"
zhTW = "「這些怎麼連一點渴望都無法解渴？」"
ruRU = "Почему они не утоляют нашу жажду даже чуть-чуть?"
jaJP = "なぜこれらは私たちの渇きを少しも癒してくれないのか？"
frFR = "Pourquoi est-ce que cela ne désaltère même pas un peu ?"
deDE = "„Warum stillen diese nicht einmal ein wenig unseren Durst?“"
plPL = "Czemu te nie gaszą naszego pragnienia nawet trochę?"
ptBR = "Por que essas frutas não saciam nossa sede nem um pouco?"
koKR = "왜 이게 우리의 목마름을 조금도 풀어주지 않을까?"
trTR = "Bu küçük çilekler neden susuzluğumuzu hiç gidermiyor?"
esES = "¿Por qué estas no nos quitan ni un poquito la sed?"
itIT = "Perché queste non ci dissetano nemmeno un po'?"
ukUA = "Чому вони навіть трохи не втамовують нашу спрагу?"
thTH = "ทำไมมันถึงไม่ช่วยดับกระหายของเราได้แม้แต่นิดเดียวนะ"
csCZ = "Proč nám tyto ani trochu neumí uhasit žízeň?"
viVN = "Tại sao những thứ này lại không làm dịu cơn khát của chúng ta dù chỉ một chút?"
caES = "Per què això no ens apaga ni una mica la set?"
beBY = "Чаму гэта ані трохі не гасіць нашу смагу?"
roRO = "De ce nu ne potolesc nici puțin setea?"
huHU = "Miért nem oltja ez akár csak egy kicsit sem a szomjunkat?"
arSA = "لماذا لا تروي عطشنا ولو قليلاً؟"

