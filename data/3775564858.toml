["Grows.Rice.Cite"]
raw = "When did we start farming these? Huh? A beaver said they isekai'd from a shapanese hooman? Don't be ridiculus, that's impossible"
status = "normal"
enUS = "When did we start farming these? Huh? A beaver said they got transported from a Japanese human? Don't be ridiculous, that's impossible."
zhCN = "“我们什么时候开始种这些的？嗯？一只海狸说他们是从一个日本人那里穿越来的？别傻了，这不可能。”"
zhTW = "我們什麼時候開始種植這些？哈？一隻海狸說他們是從一個日本人那裡異世界轉生過來的？別傻了，那是不可能的。"
ruRU = "Когда мы начали это культивировать? А? Бобер сказал, что они оказались здесь из японского мира? Не будь смешным, это невозможно."
jaJP = "「これを育て始めたのはいつだっけ？え？ビーバーが彼らは異世界から日本の人間になったと言っていた？馬鹿げたことを言わないで、そんなの不可能だ。」"
frFR = "Quand avons-nous commencé à cultiver cela ? Hein ? Un castor a dit qu'ils provenaient d'un humain japonais d'un autre monde ? Ne sois pas ridicule, c'est impossible."
deDE = "„Wann haben wir damit begonnen, die anzubauen? Huh? Ein Biber sagte, sie seien von einem japanischen Menschen isekai'd worden? Sei nicht lächerlich, das ist unmöglich.“"
plPL = "Kiedy zaczęliśmy uprawiać te? Hej? Bobr powiedział, że przenieśli się z japońskiego człowieka? Nie bądź śmieszny, to niemożliwe."
ptBR = "Quando começamos a cultivar isso? Hã? Um castor disse que eles vieram de um humano japonês? Não seja ridículo, isso é impossível."
koKR = "우리가 이농사를 언제 시작했지? 응? 어떤 비버가 그들이 일본인에서 이세계로 넘어왔다고 했다고? 말도 안 돼, 그건 불가능해!"
csCZ = "Kdy jsme začali farmářit s těmito? Co? Bobr říkal, že se isekai'd z japonského člověka? Nebuď směšný, to je nemožné."
viVN = "Khi nào chúng ta bắt đầu trồng những thứ này? Hả? Một con rái cá nói rằng chúng đã chuyển sinh từ một con người Nhật Bản? Đừng có nực cười, điều đó là không thể."
