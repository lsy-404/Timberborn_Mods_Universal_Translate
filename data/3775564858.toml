["Grows.Birch.Cite"]
raw = "Better than nothing, occasionally the bad tide takes long enough to come that these actually grow"
status = "normal"
enUS = "Better than nothing, sometimes the bad tide takes long enough to come that these actually grow."
zhCN = "“总比没有好，有时坏潮来了太久，这些东西真的能生长。”"
zhTW = "總比沒有好，偶爾壞潮來得夠久，使得這些實際上能夠生長。"
ruRU = "Лучше, чем ничего: иногда плохой прилив приходит так долго, что они действительно вырастают."
jaJP = "「無いよりマシで、時々悪潮が来るのに時間がかかることがあって、これが実際に成長する。」"
frFR = "Better than nothing, occasionally the bad tide takes long enough to come that these actually grow"
deDE = "Besser als nichts, gelegentlich dauert es so lange, bis die schlechte Flut kommt, dass diese tatsächlich wachsen."
plPL = "Lepiej niż nic, czasami zła fala przychodzi na tyle późno, że te rzeczywiście rosną."
ptBR = "Melhor que nada, às vezes a maré ruim demora o suficiente para que esses realmente cresçam."
koKR = "아무것도 아닌 것보다는 나아, 가끔 나쁜 조수가 오기까지 시간이 너무 오래 걸려서 실제로 자란다"
csCZ = "Chyba v překladu, občas špatná vlna trvá dost dlouho, aby tohle skutečně vyrostlo."
viVN = "Tốt hơn không, thỉnh thoảng dòng nước xấu mất thời gian đủ lâu để những cái này thực sự phát triển."
trTR = "Hiç yoktan iyi, arada sırada kötü gelgit o kadar uzun sürüyor ki bu ağaçlar gerçekten büyüyor."

