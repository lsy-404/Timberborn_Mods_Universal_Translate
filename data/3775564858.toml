trTR = "Eureka! Başka bir güç var, ona Yerçekimi diyeceğim!"
esES = "¡Eureka! Existe otra fuerza, ¡la llamaré Gravedad!"
itIT = "Eureka! Esiste un'altra forza, la chiamerò Gravità!"
ukUA = "Еврика! Існує ще одна сила, я назву її Гравітацією!"
thTH = "ยูเรกา! มีแรงอีกอย่างหนึ่ง ข้าจะตั้งชื่อมันว่า แรงโน้มถ่วง!"
