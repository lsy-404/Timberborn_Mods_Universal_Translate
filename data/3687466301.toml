["UI.TW.SimpleWorkshopControl.TT.PowerLevelIsBatteryAwareToggle"]
raw = "Power level will include battery power. Workshops will turn on if there is battery available, and generators will attempt to keep battery above zero."
status = "normal"
enUS = "Power level will include battery power. Workshops will turn on if battery is available, and generators will attempt to keep the battery above zero."
zhCN = "“电量将包括电池电量。车间将在有电池可用时开启，发电机将尝试保持电池电量在零以上。”"
zhTW = "電力水平將包括電池電量。如果有可用的電池，工作坊將會啟動，而發電機將會努力保持電池電量高於零。"
ruRU = "Уровень мощности будет учитывать энергию от аккумулятора. Мастерские будут включаться при наличии энергии от аккумулятора, а генераторы будут пытаться поддерживать уровень заряда аккумулятора выше нуля."
jaJP = "電力レベルはバッテリーの電力を含みます。ワークショップはバッテリーが利用可能な場合に稼働し、発電機はバッテリーをゼロ以上に保とうとします。"
frFR = "Le niveau d'énergie inclura la puissance de la batterie. Les ateliers s'allumeront s'il y a de la batterie disponible, et les générateurs tenteront de maintenir la batterie au-dessus de zéro."
deDE = "Der Leistungspegel berücksichtigt die Batterieleistung. Werkstätten schalten sich ein, wenn Batterien verfügbar sind, und Generatoren versuchen, die Batterie über null zu halten."
plPL = "Poziom energii będzie uwzględniał moc z baterii. Warsztaty włączą się, jeśli dostępna jest bateria, a generatory będą starały się utrzymać poziom baterii powyżej zera."
ptBR = "Os níveis de energia incluirão a energia da bateria. As oficinas ligarão se houver bateria disponível, e os geradores tentarão manter a bateria acima de zero."
koKR = "전력 수준은 배터리 전원을 포함합니다. 워크숍은 배터리가 있을 경우 켜지며, 발전기는 배터리를 0 이상으로 유지하려고 합니다."
trTR = "Güç seviyesi batarya gücünü içerecektir. Atölyeler, batarya mevcutsa çalışacak ve jeneratörler bataryayı sıfırın üzerinde tutmaya çalışacaktır."
esES = "El nivel de energía incluirá la energía de las baterías. Los talleres se encenderán si hay batería disponible, y los generadores intentarán mantener la batería por encima de cero."
itIT = "Il livello di energia includerà l'energia delle batterie. Le officine si accenderanno se c'è batteria disponibile, e i generatori cercheranno di mantenere la batteria sopra lo zero."
ukUA = "Рівень потужності враховуватиме запас енергії батареї. Майстерні вмикатимуться, якщо в батареї є заряд, а генератори намагатимуться підтримувати заряд батареї вище нуля."
thTH = "ระดับกำลังจะรวมพลังงานในแบตเตอรี่ด้วย โรงงานจะเริ่มทำงานหากมีพลังงานในแบตเตอรี่ และเครื่องกำเนิดไฟฟ้าจะพยายามรักษาระดับพลังงานในแบตเตอรี่ให้สูงกว่าศูนย์"
csCZ = "Úroveň energie bude zahrnovat bateriovou energii. Dílničky se zapnou, pokud je k dispozici baterie, a generátory se pokusí udržet baterii nad nulou."
viVN = "Mức năng lượng sẽ bao gồm năng lượng từ pin. Các xưởng sẽ hoạt động nếu có pin sẵn có, và các máy phát điện sẽ cố gắng giữ mức pin trên không."
caES = "El nivell d'energia inclourà l'energia de les bateries. Els tallers s'activaran si hi ha bateria disponible, i els generadors intentaran mantenir la bateria per sobre de zero."
beBY = "Узровень магутнасці будзе ўлічваць энергію акумулятараў. Майстэрні будуць уключацца, калі ў акумулятары будзе энергія, а генератары будуць імкнуцца падтрымліваць яе запас вышэй за нуль."
roRO = "Nivelul de putere va include energia din baterie. Atelierele se vor porni dacă există energie disponibilă în baterie, iar generatoarele vor încerca să mențină nivelul bateriei peste zero."
huHU = "A teljesítményszint az akkumulátor energiáját is figyelembe veszi. A műhelyek bekapcsolnak, ha van energia az akkumulátorban, a generátorok pedig megpróbálják nulla felett tartani az akkumulátor töltöttségét."
