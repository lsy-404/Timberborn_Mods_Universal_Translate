["UI.TW.SimpleWorkshopControl.PowerLevelInfo"]
raw = "Power level is supply divided by total demand (then normalized to a 0-100 scale).\nIf battery-aware is checked, supply will have available battery power added to it.\nActive demand is buildings currently on. Total demand is buildings that would like to be on, if they had enough power.\nThe power percentage shown in the vanilla GUI and used to control workshop speed is supply / active demand."
status = "normal"
enUS = "Power level is supply divided by total demand (then normalized to a 0-100 scale). If battery-aware is checked, supply will have available battery power added to it. Active demand is buildings currently on. Total demand is buildings that would like to be on, if they had enough power. The power percentage shown in the vanilla GUI and used to control workshop speed is supply / active demand."
zhCN = "功率水平是供给除以总需求（然后归一化到0-100的比例）。\n如果选中了电池感知，供给将加上可用电池电量。\n活跃需求是当前开启的建筑。总需求是如果有足够电力希望开启的建筑。\n在原版用户界面中显示的功率百分比以及用于控制工坊速度的功率是供给 / 活跃需求。"
zhTW = "電力水平是供應量除以總需求量（然後標準化到0-100的範圍）。如果選中「電池感知」，供應將會添加可用的電池電量。當前需求是目前啟用的建築。總需求是希望啟用但如果有足夠電力的建築。原版GUI中顯示的電力百分比和用來控制工作坊速度的計算方式是供應量 / 當前需求。"
ruRU = "Уровень энергии - это подача, деленная на общий спрос (затем нормализованная на шкале 0-100).\nЕсли включено отслеживание батареи, к подаче будет добавлена доступная энергия батареи.\nАктивный спрос - это здания, которые в данный момент работают. Общий спрос - это здания, которые хотели бы работать, если бы у них было достаточно энергии.\nПроцент энергии, отображаемый в стандартном интерфейсе и используемый для управления скоростью работы мастерской, равен подаче / активному спросу."
jaJP = "電力レベルは供給を総需要で割ったもの（その後、0-100のスケールに正規化されます）。  \nバッテリー感知がチェックされている場合、供給には利用可能なバッテリー電力が追加されます。  \nアクティブ需要は現在稼働中の建物です。総需要は、十分な電力があれば稼働したい建物のことです。  \nバニラのGUIに表示され、工房の速度を制御するために使用される電力パーセンテージは、供給 / アクティブ需要です。"
frFR = "Le niveau d'énergie est l'approvisionnement divisé par la demande totale (puis normalisé sur une échelle de 0 à 100). Si l'option 'sensible à la batterie' est cochée, l'approvisionnement inclura la puissance de batterie disponible. La demande active correspond aux bâtiments actuellement en marche. La demande totale est celle des bâtiments qui souhaiteraient être en marche, s'ils avaient suffisamment d'énergie. Le pourcentage de puissance affiché dans l'interface graphique classique et utilisé pour contrôler la vitesse de l'atelier est l'approvisionnement / la demande active."
deDE = "Der Leistungspegel ist die Versorgung geteilt durch die Gesamtnachfrage (dann normalisiert auf eine Skala von 0-100).\nWenn die Option akku-bewusst aktiviert ist, wird die verfügbare Batterieleistung zur Versorgung addiert.\nDie aktive Nachfrage sind Gebäude, die derzeit eingeschaltet sind. Die Gesamtnachfrage sind Gebäude, die eingeschaltet sein möchten, wenn sie genügend Strom hätten.\nDer in der Standard-GUI angezeigte Leistungsprozentsatz, der zur Steuerung der Werkstattgeschwindigkeit verwendet wird, ist Versorgung / aktive Nachfrage."
plPL = "Poziom energii to podaż podzielona przez całkowite zapotrzebowanie (następnie normalizowane do skali 0-100).  \nJeśli zaznaczone jest 'świadome baterii', do podaży dodana zostanie dostępna moc akumulatorów.  \nAktywne zapotrzebowanie to budynki, które są aktualnie włączone. Całkowite zapotrzebowanie to budynki, które chciałyby być włączone, jeśli miałyby wystarczającą ilość energii.  \nProcent energii pokazany w domyślnym GUI i używany do kontrolowania prędkości warsztatów to podaż / aktywne zapotrzebowanie."
ptBR = "O nível de energia é o suprimento dividido pela demanda total (então normalizado em uma escala de 0-100).  \nSe a opção consciente de bateria estiver marcada, o suprimento terá a energia da bateria disponível adicionada a ele.  \nA demanda ativa são os edifícios que estão atualmente ligados. A demanda total são os edifícios que gostariam de estar ligados, se tivessem energia suficiente.  \nA porcentagem de energia mostrada na interface gráfica padrão e usada para controlar a velocidade da oficina é suprimento / demanda ativa."
koKR = "전력 수준은 공급량을 총 수요로 나눈 값 (그 다음 0-100 스케일로 정규화됨)입니다. \n배터리 인식이 활성화되어 있으면 공급량에 사용 가능한 배터리 전력이 추가됩니다. \n활성 수요는 현재 켜져 있는 건물입니다. 총 수요는 충분한 전력이 있다면 켜지고 싶어 하는 건물입니다. \n바닐라 GUI에 표시되고 작업장 속도 조절에 사용되는 전력 비율은 공급량 / 활성 수요입니다."
trTR = "Güç seviyesi, arzın toplam talebe bölünmesiyle elde edilir (sonra 0-100 ölçeğine normalize edilir).\nAkü bilinci seçiliyse, arza mevcut akü gücü eklenir.\nAktif talep, şu anda açık olan binalardır. Toplam talep ise, yeterli güce sahip olsalar açılmak isteyen binalardır.\nVanilla GUI'de gösterilen ve atölye hızını kontrol etmek için kullanılan güç yüzdesi, arz / aktif talep şeklindedir."
esES = "Nivel de energía es el suministro dividido entre la demanda total (luego normalizado a una escala de 0-100).\nSi la opción de considerar baterías está marcada, al suministro se le sumará la energía disponible de las baterías.\nLa demanda activa son los edificios que están encendidos actualmente. La demanda total son los edificios que querrían estar encendidos si tuvieran energía suficiente.\nEl porcentaje de energía que se muestra en la interfaz original y que se usa para controlar la velocidad del taller es suministro / demanda activa."
itIT = "Il livello di potenza è l'offerta divisa per la domanda totale (quindi normalizzato su una scala da 0 a 100).\nSe è selezionata l'opzione con batteria, alla fornitura viene aggiunta la potenza disponibile delle batterie.\nLa domanda attiva è costituita dagli edifici attualmente accesi. La domanda totale è costituita dagli edifici che vorrebbero essere accesi, se avessero abbastanza energia.\nLa percentuale di potenza mostrata nell'interfaccia originale e usata per controllare la velocità dell'officina è offerta / domanda attiva."
ukUA = "Рівень потужності — це постачання, поділене на загальний попит (потім нормалізоване до шкали 0–100).\nЯкщо позначено «враховувати батарею», до постачання додаватиметься доступна потужність батарей.\nАктивний попит — це будівлі, які зараз увімкнені. Загальний попит — це будівлі, які хотіли б бути увімкненими, якби мали достатньо енергії.\nВідсоток потужності, що показується у стандартному інтерфейсі та використовується для керування швидкістю майстерні, — це постачання / активний попит."
thTH = "ระดับพลังงานคือกำลังผลิตหารด้วยความต้องการพลังงานทั้งหมด (จากนั้นปรับให้อยู่ในมาตราส่วน 0-100)\nหากเปิดตัวเลือกรับรู้แบตเตอรี่ กำลังผลิตจะรวมพลังงานแบตเตอรี่ที่มีอยู่เข้าไปด้วย\nความต้องการที่ทำงานอยู่คืออาคารที่กำลังเปิดทำงานอยู่ ส่วนความต้องการทั้งหมดคืออาคารที่ต้องการเปิดทำงาน หากมีพลังงานเพียงพอ\nเปอร์เซ็นต์พลังงานที่แสดงใน GUI ปกติและใช้ควบคุมความเร็วของเวิร์กช็อปคือ กำลังผลิต / ความต้องการที่ทำงานอยู่"
csCZ = "Úroveň výkonu je dodávka dělená celkovým požadavkem (poté normalizována na škálu 0-100). Pokud je zaškrtnuto povědomí o baterii, bude dodávce přidána dostupná kapacita baterie. Aktuální požadavek jsou budovy, které jsou momentálně zapnuté. Celkový požadavek jsou budovy, které by chtěly být zapnuté, pokud by měly dostatek energie. Percento výkonu zobrazené v základním uživatelském rozhraní a používané k řízení rychlosti dílny je dodávka / aktuální požadavek."
viVN = "Cấp độ năng lượng là nguồn cung chia cho tổng nhu cầu (sau đó được chuẩn hóa trên thang 0-100).\nNếu tùy chọn nhận biết pin được chọn, nguồn cung sẽ có thêm năng lượng pin có sẵn.\nNhu cầu hoạt động là các tòa nhà hiện đang hoạt động. Tổng nhu cầu là các tòa nhà muốn hoạt động, nếu chúng có đủ năng lượng.\nPhần trăm năng lượng hiển thị trong GUI gốc và được sử dụng để kiểm soát tốc độ xưởng là nguồn cung / nhu cầu hoạt động."
caES = "El nivell de potència és el subministrament dividit entre la demanda total (després normalitzat a una escala de 0-100).\nSi està marcada l'opció de tenir en compte la bateria, al subministrament se li afegirà la potència disponible de la bateria.\nLa demanda activa són els edificis que estan actualment encesos. La demanda total són els edificis que voldrien estar encesos, si tinguessin prou potència.\nEl percentatge de potència que es mostra a la interfície original i que serveix per controlar la velocitat del taller és subministrament / demanda activa."
beBY = "Узровень магутнасці — гэта энергія вытворчасці, падзеленая на агульны попыт (затым нармалізаваны да шкалы 0–100).\nКалі ўключана опцыя «Улічваць батарэі», да вытворчасці дадаецца даступная энергія batarei.\nАктыўны попыт — гэта будынкі, якія зараз уключаны. Агульны попыт — гэта будынкі, якія хацелі б быць уключаны, калі б мелі дастаткова энергіі.\nПрацэнт энергіі, які паказваецца ў стандартным інтэрфейсе і выкарыстоўваецца для кіравання хуткасцю майстэрні, — гэта вытворчасць / актыўны попыт."
roRO = "Nivelul de putere este furnizarea împărțită la cererea totală (apoi normalizat la o scară de 0-100).\nDacă opțiunea cu conștientizarea bateriei este bifată, la furnizare se adaugă puterea disponibilă din baterii.\nCererea activă este formată din clădirile care sunt pornite în prezent. Cererea totală este formată din clădirile care ar dori să fie pornite, dacă ar avea suficientă putere.\nProcentul de putere afișat în interfața standard a jocului și folosit pentru a controla viteza atelierelor este furnizarea / cererea activă."
huHU = "Az energiaszint a termelés és a teljes igény hányadosa (majd 0–100-as skálára normalizálva).\nHa az akkumulátor-figyelembevétel be van jelölve, a rendelkezésre álló akkumulátorenergia hozzáadódik a termeléshez.\nAz aktív igény a jelenleg bekapcsolt épületek igénye. A teljes igény azoknak az épületeknek az igénye, amelyek bekapcsolva lennének, ha lenne elég energiájuk.\nAz alapjátékban a felületen látható és a műhelyek sebességének szabályozására használt energiaszázalék a termelés / aktív igény képlettel számítódik."
arSA = "مستوى الطاقة هو الإمداد مقسومًا على إجمالي الطلب (ثم يُطبّع إلى مقياس 0-100).\nإذا كان خيار مراعاة البطاريات محددًا، فستُضاف طاقة البطاريات المتاحة إلى الإمداد.\nالطلب الفعلي هو طلب المباني التي تعمل حاليًا. أما إجمالي الطلب فهو طلب المباني التي ترغب في العمل لو توفر لها ما يكفي من الطاقة.\nنسبة الطاقة المعروضة في واجهة اللعبة الأصلية والمستخدمة للتحكم في سرعة ورشة العمل هي الإمداد / الطلب الفعلي."

["UI.TW.SimpleWorkshopControl.PowerLevelGeneratorWarning"]
raw = "! Building is generator. Will only turn off if power level is above Stop AND if turning off will not reduce power level below Start."
status = "normal"
enUS = "! Building is a generator. It will only turn off if the power level is above Stop AND if turning it off will not reduce the power level below Start."
zhCN = "! 建筑是发电机。仅在电力水平高于停止时关闭，并且关闭不会使电力水平低于起始值。"
zhTW = "! 建築物是發電機。只有在電力水平高於停止值並且關閉不會使電力水平低於起始值的情況下才會關閉。"
ruRU = "! Здание является генератором. Остановится только если уровень энергии выше Стоп И если остановка не приведёт к снижению уровня энергии ниже Старт."
jaJP = "! 建物は発電機です。電力レベルが停止より上で、かつ、停止することが開始より下に電力レベルを下げない場合にのみ、停止します。"
frFR = "! Le bâtiment est un générateur. Il ne s'éteindra que si le niveau de puissance est supérieur à Arrêt ET si l'arrêt ne réduit pas le niveau de puissance en dessous du Début."
deDE = "! Das Gebäude ist ein Generator. Es wird nur abgeschaltet, wenn der Leistungsstand über Stop liegt UND wenn das Abschalten den Leistungsstand nicht unter Start senkt."
plPL = "! Budynek jest generatorem. Wyłączy się tylko wtedy, gdy poziom mocy będzie wyższy niż Stop I jeśli wyłączenie nie spowoduje, że poziom mocy spadnie poniżej Start."
ptBR = "! O edifício é um gerador. Só será desligado se o nível de energia estiver acima de Parar E se desligar não reduzir o nível de energia abaixo de Iniciar."
koKR = "! 건물은 발전기입니다. 정지 수준 이상인 경우에만 꺼지며, 꺼트리는 것이 시작 수준 이하로 전력 수준을 줄이지 않을 경우에만 가능합니다."
trTR = "! Bina jeneratördür. Güç seviyesi Durdur'dan yüksekse ve kapatmanın güç seviyesini Başlangıç'ın altına düşürmeyeceğinden eminseniz kapatılacaktır."
esES = "¡El edificio es un generador. Solo se apagará si el nivel de energía está por encima de Stop Y si apagarlo no reducirá el nivel de energía por debajo de Start."
itIT = "Attenzione: l'edificio è un generatore. Si spegnerà solo se il livello di potenza è superiore a Stop E se spegnerlo non riduce il livello di potenza al di sotto di Start."
ukUA = "! Будівля є генератором. Вона вимикатиметься лише тоді, коли рівень потужності перевищує значення «Зупинка», і якщо вимкнення не знизить рівень потужності нижче значення «Старт»."
thTH = "เตือน: อาคารนี้เป็นเครื่องกำเนิดไฟฟ้า จะปิดเฉพาะเมื่อระดับพลังงานสูงกว่าค่าหยุด และการปิดจะไม่ทำให้ระดับพลังงานลดลงต่ำกว่าค่าเริ่มต้น"
csCZ = "! Budova je generátor. Vypne se pouze pokud je úroveň energie nad Stop A pokud vypnutí nezpůsobí pokles úrovně energie pod Start."
viVN = "! Tòa nhà là máy phát điện. Chỉ tắt khi mức năng lượng cao hơn Ngừng VÀ nếu việc tắt không làm giảm mức năng lượng dưới Bắt đầu."
caES = "Aquest edifici és un generador. Només s'apagarà si el nivell d'energia és per sobre de Stop i si apagar-lo no fa baixar el nivell d'energia per sota de Start."
beBY = "Гэта будынак-генератар. Ён выключыцца толькі тады, калі ўзровень магутнасці вышэйшы за Stop, і калі выключэнне не знізіць узровень магутнасці ніжэй за Start."
roRO = "Această clădire este un generator. Se va opri doar dacă nivelul de putere este peste Stop ȘI dacă oprirea nu va reduce nivelul de putere sub Start."
huHU = "Ez az épület generátor. Csak akkor kapcsol ki, ha a teljesítményszint meghaladja a Leállítás értékét, ÉS a kikapcsolás nem csökkenti a teljesítményszintet a Indítás érték alá."
arSA = "في الواقع المبنى مولّد. لن يتوقف إلا إذا كان مستوى الطاقة أعلى من مستوى الإيقاف، وإذا كان إيقافه لن يخفض مستوى الطاقة إلى ما دون مستوى البدء."

