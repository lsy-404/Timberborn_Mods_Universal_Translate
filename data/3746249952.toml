["Building.FractureCharge.Description"]
raw = "Blows up inside the water source to increase its output, maybe. Hopefully?"
status = "normal"
enUS = "Detonates within the water source to potentially boost its output, maybe. Fingers crossed?"
zhCN = "“在水源内部爆炸以增加其输出，也许会。希望如此？”"
zhTW = "“在水源內部爆炸以增加其產量，也許吧。希望如此？”"
ruRU = "Взрывается внутри источника воды, чтобы увеличить его производительность, возможно. Надеюсь?"
jaJP = "「水源の内部で爆発し、その出力を増加させるかもしれない。うまくいけば？」"
frFR = "Explose à l'intérieur de la source d'eau pour augmenter sa production, peut-être. Espérons-le ?"
deDE = "Explodiert im Inneren der Wasserquelle, um deren Ausstoß möglicherweise zu erhöhen. Hoffentlich?"
plPL = "Wybucha wewnątrz źródła wody, aby zwiększyć jego wydajność, może. Miejmy nadzieję?"
ptBR = "Explode dentro da fonte de água para aumentar sua produção, talvez. Tomara?"
koKR = "물 공급원 내부에서 폭발하여 출력을 증가시킵니다. 어쩌면요? 희망적으로?"
trTR = "Su kaynağının içinde patlar ve çıktısını artırır, belki. Umarım?"
esES = "Explota dentro de la fuente de agua para aumentar su producción, quizás. ¿Esperemos que sí?"
itIT = "Esplode all'interno della fonte d'acqua, forse per aumentarne la portata. Speriamo?"
ukUA = "Вибухає всередині джерела води, щоб, можливо, збільшити його видобуток. Сподіваємось?"
thTH = "ระเบิดภายในแหล่งน้ำเพื่ออาจเพิ่มปริมาณผลผลิตของมัน บางที หวังว่าจะได้ผลนะ?"
csCZ = "Vyhodí se uvnitř vodního zdroje, aby se zvýšil jeho výstup, možná. Doufejme?"
viVN = "Nổ bên trong nguồn nước để tăng sản lượng của nó, có thể. Hy vọng là vậy?"
caES = "Vola dins de la font d'aigua per augmentar-ne el rendiment, potser. Esperem que sí?"
beBY = "Узрывае ўнутры крыніцы вады, магчыма, каб павялічыць яе выхад. Будзем спадзявацца?"
roRO = "Explodează în interiorul sursei de apă, poate ca să îi crească debitul. Sperăm?"
huHU = "Felrobban a vízforrás belsejében, hátha így megnő a kibocsátása. Remélhetőleg?"
arSA = "ينفجر داخل مصدر المياه لزيادة إنتاجه، ربما. آمل ذلك؟"

["Building.FractureCharge.FlavorDescription"]
raw = "Why not just dump a pile of explosives down a hole and see what happens?"
status = "normal"
enUS = "Why not just dump a pile of explosives down a hole and see what happens?"
zhCN = "“为什么不直接把一堆炸药扔进洞里看看会发生什么？”"
zhTW = "「為什麼不直接在洞裡丟一堆爆炸物，看看會發生什麼？」"
ruRU = "Почему бы просто не сбросить кучу взрывчатки в яму и не посмотреть, что произойдет?"
jaJP = "穴に爆薬の束を投げ込んで、何が起こるか見てみてはどうですか？"
frFR = "Pourquoi ne pas simplement jeter une pile d'explosifs dans un trou et voir ce qui se passe ?"
deDE = "Warum nicht einfach einen Haufen Sprengstoff in ein Loch kippen und sehen, was passiert?"
plPL = "Czemu po prostu nie wrzucić stosu materiałów wybuchowych do dołu i nie zobaczyć, co się stanie?"
ptBR = "Por que não simplesmente despejar uma pilha de explosivos em um buraco e ver o que acontece?"
koKR = "왜 그냥 구멍에 폭발물을 쏟아붓고 무슨 일이 일어나는지 지켜보지 않을까요?"
trTR = "Neden sadece bir delik içine bir avuç patlayıcı döküp ne olacağını görmüyoruz?"
