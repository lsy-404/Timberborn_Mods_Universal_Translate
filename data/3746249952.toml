itIT = "Perché non gettare un mucchio di esplosivi in un buco e vedere cosa succede?"
ukUA = "Чому б просто не скинути купу вибухівки в яму й не подивитися, що станеться?"
thTH = "ทำไมไม่โยนดินระเบิดกองหนึ่งลงไปในหลุมแล้วดูว่าจะเกิดอะไรขึ้นล่ะ"
csCZ = "Proč prostě nehodit hromadu výbušnin do díry a nevidět, co se stane?"
viVN = "Tại sao không chỉ đơn giản là đổ một đống thuốc nổ xuống một cái hố và xem chuyện gì sẽ xảy ra?"
caES = "Per què no deixar caure un munt d'explosius per un forat i veure què passa?"
beBY = "Чаму б не кінуць купу выбуховых рэчываў у яму і не паглядзець, што будзе?"
roRO = "De ce să nu aruncăm pur și simplu o grămadă de explozibili într-o gaură și să vedem ce se întâmplă?"
huHU = "Miért ne dobnánk le egy halom robbanóanyagot egy lyukba, hogy lássuk, mi történik?"
arSA = "لماذا لا نُلقي كومة من المتفجرات في حفرة ونرى ماذا يحدث؟"

