["Shay.RainbornAcidChanceCap.Settings.MaxChance.Tooltip"]
status = "normal"
raw = "Replaces Rainborn's hard-coded 50% maximum acid-rain probability. The configured Acid rain escalation events value still controls how many clean rains are needed to reach this maximum. 0 disables scheduled acid-rain rolls, 50 matches Rainborn's original behavior, and 100 allows the chance to reach 100%."
enUS = "Replaces Rainborn's hard-coded 50% maximum acid-rain probability. The configured Acid rain escalation events value still controls how many clean rains are needed to reach this maximum. 0 disables scheduled acid-rain rolls, 50 matches Rainborn's original behavior, and 100 allows the chance to reach 100%."
zhCN = "替换 Rainborn 硬编码的 50% 酸雨概率上限。配置的“酸雨升级事件”值仍决定达到此上限需要经历多少次无污染降雨。0 会禁用定时酸雨判定，50 与 Rainborn 的原始行为一致，100 则允许概率达到 100%。"
zhTW = "取代 Rainborn 硬編碼的 50% 酸雨機率上限。已設定的「酸雨升級事件」值仍會控制需要經過多少次無酸雨，才能達到此上限。0 會停用排定的酸雨機率判定，50 與 Rainborn 原本的行為相同，100 則允許機率達到 100%。"
ruRU = "Заменяет жёстко заданную максимальную вероятность кислотного дождя в 50% в моде Rainborn. Параметр «Число этапов усиления кислотного дождя» по-прежнему определяет, сколько чистых дождей нужно, чтобы достичь этого максимума. Значение 0 отключает запланированные проверки на кислотный дождь, 50 соответствует исходному поведению Rainborn, а 100 позволяет вероятности достичь 100%."
jaJP = "Rainbornにハードコードされている、酸性雨の発生確率の最大値50%を置き換えます。設定された「酸性雨の段階的増加イベント」の値は、最大値に達するまでに必要な晴天の回数を引き続き制御します。0にすると予定された酸性雨の抽選が無効になり、50にするとRainborn本来の挙動と同じになり、100にすると発生確率が100%に達するようになります。"
frFR = "Remplace la probabilité maximale de pluie acide de 50 % codée en dur dans Rainborn. La valeur configurée pour les événements d’escalade de pluie acide détermine toujours le nombre de pluies propres nécessaires pour atteindre ce maximum. 0 désactive les tirages de pluie acide programmés, 50 correspond au comportement d’origine de Rainborn, et 100 permet à la probabilité d’atteindre 100 %."
deDE = "Ersetzt die fest codierte maximale Wahrscheinlichkeit von 50 % für sauren Regen in Rainborn. Der konfigurierte Wert für die Eskalationsereignisse des sauren Regens bestimmt weiterhin, wie viele Regenfälle ohne sauren Regen nötig sind, um dieses Maximum zu erreichen. 0 deaktiviert geplante Würfe für sauren Regen, 50 entspricht dem ursprünglichen Verhalten von Rainborn und 100 ermöglicht, dass die Wahrscheinlichkeit 100 % erreicht."
plPL = "Zastępuje zakodowany na stałe w modzie Rainborn maksymalny poziom prawdopodobieństwa kwaśnego deszczu wynoszący 50%. Ustawiona wartość „Wydarzenia eskalacji kwaśnego deszczu” nadal określa, ile czystych opadów potrzeba, aby osiągnąć maksimum. 0 wyłącza zaplanowane losowania kwaśnego deszczu, 50 odpowiada oryginalnemu działaniu moda Rainborn, a 100 pozwala, by prawdopodobieństwo osiągnęło 100%."
ptBR = "Substitui a probabilidade máxima de chuva ácida de 50%, definida diretamente no código de Rainborn. O valor configurado de eventos de escalada da chuva ácida ainda determina quantas chuvas limpas são necessárias para atingir esse máximo. 0 desativa as chances programadas de chuva ácida, 50 mantém o comportamento original de Rainborn e 100 permite que a chance chegue a 100%."
koKR = "Rainborn에 하드코딩된 산성비 최대 확률 50%를 대체합니다. 설정된 산성비 단계 상승 이벤트 값은 이 최대 확률에 도달하는 데 필요한 맑은 비의 횟수를 계속 결정합니다. 0은 예약된 산성비 확률 계산을 비활성화하고, 50은 Rainborn의 기존 동작과 같으며, 100은 확률이 100%까지 올라가도록 합니다."
csCZ = "Nahrazuje napevno nastavenou maximální pravděpodobnost kyselého deště 50 % v modifikaci Rainborn. Nastavená hodnota „Události stupňování kyselého deště“ stále určuje, kolik čistých dešťů je potřeba k dosažení tohoto maxima. 0 vypne plánované losování kyselého deště, 50 odpovídá původnímu chování modifikace Rainborn a 100 umožňuje, aby pravděpodobnost dosáhla 100 %."
viVN = "Thay thế xác suất mưa axit tối đa 50% được mã hóa cứng của Rainborn. Giá trị Số lần mưa axit leo thang đã cấu hình vẫn quyết định cần bao nhiêu trận mưa sạch để đạt mức tối đa này. 0 sẽ tắt các lần tung xác suất mưa axit theo lịch, 50 khớp với hành vi ban đầu của Rainborn, còn 100 cho phép xác suất đạt 100%."
trTR = "Rainborn’un sabit kodlanmış %50’lik maksimum asit yağmuru olasılığını değiştirir. Yapılandırılmış Asit yağmuru artış olayları değeri, bu maksimuma ulaşmak için kaç temiz yağmur gerektiğini belirlemeye devam eder. 0, planlanmış asit yağmuru olasılık hesaplamalarını devre dışı bırakır; 50, Rainborn’un özgün davranışıyla eşleşir; 100 ise olasılığın %100’e ulaşmasını sağlar."
