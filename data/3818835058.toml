["Shay.RainbornAcidChanceCap.Settings.MaxChance.Tooltip"]
status = "normal"
raw = "Replaces Rainborn's hard-coded 50% maximum acid-rain probability. The configured Acid rain escalation events value still controls how many clean rains are needed to reach this maximum. 0 disables scheduled acid-rain rolls, 50 matches Rainborn's original behavior, and 100 allows the chance to reach 100%."
enUS = "Replaces Rainborn's hard-coded 50% maximum acid rain probability. The configured Acid rain escalation events value still controls how many clean rains are needed to reach this maximum. 0 disables scheduled acid rain rolls, 50 matches Rainborn's original behavior, and 100 allows the chance to reach 100%."
zhCN = "替换 Rainborn 硬编码的 50% 酸雨概率上限。已配置的“酸雨升级事件”值仍决定达到此上限需要经历多少次洁净降雨。设为 0 可禁用计划中的酸雨概率判定，设为 50 与 Rainborn 的原始行为一致，设为 100 则酸雨概率最高可达 100%。"
zhTW = "取代 Rainborn 硬編碼的 50% 酸雨機率上限。已設定的「酸雨升級事件」值仍會決定需要多少次乾淨降雨才能達到此上限。0 會停用排定的酸雨機率判定，50 會符合 Rainborn 的原始行為，而 100 則允許機率升至 100%。"
ruRU = "Заменяет жёстко заданную в Rainborn максимальную вероятность кислотного дождя в 50%. Настройка «Количество событий усиления кислотного дождя» по-прежнему определяет, сколько обычных дождей нужно, чтобы достичь этого максимума. Значение 0 отключает запланированные проверки на кислотный дождь, 50 соответствует исходному поведению Rainborn, а при значении 100 вероятность может достигнуть 100%."
jaJP = "Rainbornにハードコードされている酸性雨の最大確率50%を置き換えます。設定された「酸性雨のエスカレーションイベント」の値は、この最大確率に達するまでに必要な、通常の雨の回数を引き続き制御します。0にすると予定された酸性雨の抽選が無効になり、50にするとRainborn本来の動作と同じになり、100にすると確率が100%に達するようになります。"
frFR = "Remplace la probabilité maximale de pluie acide de 50 % codée en dur par Rainborn. La valeur configurée pour les événements d’escalade de la pluie acide détermine toujours le nombre de pluies propres nécessaires pour atteindre ce maximum. 0 désactive les tirages programmés de pluie acide, 50 correspond au comportement d’origine de Rainborn et 100 permet à la probabilité d’atteindre 100 %."
deDE = "Ersetzt die fest codierte maximale Wahrscheinlichkeit von 50 % für sauren Regen in Rainborn. Der konfigurierte Wert für die Eskalationsereignisse des sauren Regens bestimmt weiterhin, wie viele saubere Regenfälle nötig sind, um dieses Maximum zu erreichen. 0 deaktiviert geplante Würfe für sauren Regen, 50 entspricht Rainborns ursprünglichem Verhalten und 100 ermöglicht eine Wahrscheinlichkeit von bis zu 100 %."
plPL = "Zastępuje zakodowane na stałe w modzie Rainborn maksymalne prawdopodobieństwo kwaśnego deszczu wynoszące 50%. Ustawiona wartość „Liczba etapów narastania kwaśnego deszczu” nadal określa, ile czystych opadów potrzeba, aby osiągnąć to maksimum. 0 wyłącza zaplanowane losowania kwaśnego deszczu, 50 odpowiada oryginalnemu działaniu moda Rainborn, a 100 pozwala, by prawdopodobieństwo osiągnęło 100%."
ptBR = "Substitui a probabilidade máxima de chuva ácida de 50% codificada no Rainborn. O valor configurado de eventos de escalada da chuva ácida ainda controla quantas chuvas limpas são necessárias para atingir esse máximo. 0 desativa as tentativas programadas de chuva ácida, 50 corresponde ao comportamento original do Rainborn e 100 permite que a chance chegue a 100%."
koKR = "Rainborn의 고정된 산성비 최대 확률 50%를 대체합니다. 설정된 산성비 단계 상승 이벤트 값은 이 최대 확률에 도달하기까지 필요한 맑은 비의 횟수를 계속 제어합니다. 0은 예약된 산성비 판정을 비활성화하고, 50은 Rainborn의 원래 동작과 같으며, 100은 확률이 100%까지 오를 수 있게 합니다."
csCZ = "Nahrazuje natvrdo nastavenou maximální pravděpodobnost kyselého deště u Rainborn ve výši 50 %. Hodnota Události zvyšování pravděpodobnosti kyselého deště v nastavení nadále určuje, kolik čistých dešťů je potřeba k dosažení této maximální hodnoty. Hodnota 0 vypne plánované hody na kyselý déšť, 50 odpovídá původnímu chování Rainborn a při hodnotě 100 může pravděpodobnost dosáhnout 100 %."
viVN = "Thay thế xác suất mưa axit tối đa 50% được mã hóa cứng của Rainborn. Giá trị Số sự kiện tăng dần mưa axit đã cấu hình vẫn quyết định cần bao nhiêu trận mưa sạch để đạt mức tối đa này. 0 sẽ tắt các lần tính xác suất mưa axit theo lịch, 50 sẽ giữ nguyên hành vi ban đầu của Rainborn, còn 100 cho phép xác suất đạt 100%."
trTR = "Rainborn’un sabit kodlanmış %50 asit yağmuru olasılığı üst sınırını değiştirir. Yapılandırılmış Asit yağmuru tırmanma olayları değeri, bu üst sınıra ulaşmak için gereken temiz yağmur sayısını belirlemeye devam eder. 0, zamanlanmış asit yağmuru olasılık hesaplamalarını devre dışı bırakır; 50, Rainborn’un özgün davranışıyla eşleşir; 100 ise olasılığın %100’e ulaşmasını sağlar."
