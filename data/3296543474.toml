["Knatte.DoubleInvSlopeW.Description"]
raw = "Square that sticks out on both sides. \nPlacment hex block all water other blocks only from top/bottom like a built in Impermeable Floor"
status = "normal"
enUS = "Square that protrudes on both sides. \nPlacement hex block prevents water from entering; other blocks only allow water from the top/bottom, like a built-in impermeable floor."
zhCN = "不同形状的防洪堤，部分悬空，能完全阻断水流。"
zhTW = "兩邊突出的小方塊。放置六角形區塊，所有水只有從上/下進入，像是一個內建的不透水地板。"
ruRU = "Квадрат, который выступает с обеих сторон. Размещение шестигранного блока: вся вода, другие блоки только сверху/снизу, как встроенный непроницаемый пол."
jaJP = "両側に突き出た四角形。  \n水を全て排除する配置の六角形ブロック、他のブロックは上下からのみ配置できる、まるで組み込まれた不透過な床のように。"
frFR = "Carré qui dépasse des deux côtés. Bloc hexagonal de placement, toute l'eau, les autres blocs seulement par le haut/en bas, comme un sol imperméable intégré."
deDE = "Quadrat, das auf beiden Seiten herausragt. \nPlatzierung des Hex-Blocks: Wasser kann nur von oben/unten eindringen, wie ein integrieter impermeabler Fußboden."
plPL = "Kwadrat, który wystaje po obu stronach. Umiejscowienie bloku heksagonalnego, aby zatrzymać wodę, inne bloki tylko od góry/dół jak wbudowana nieprzepuszczalna podłoga."
ptBR = "Quadrado que se projeta em ambos os lados. \nColocação do bloco hexagonal, toda água, outros blocos apenas de cima/embaixo, como um piso impermeável embutido."
koKR = "양쪽으로 튀어나온 정사각형. \n놓기 위한 육각형 블록으로 모든 물이 다른 블록과 마찬가지로 위/아래에서만 닿게 되며 내장된 불투수층과 같습니다."
trTR = "Her iki tarafta dışa doğru çıkan kare. \nSu ve diğer blokların yalnızca üstten/alttan yerleştirildiği altıgen blok yerleştirme, entegre su geçirmez zemin gibi."
esES = "Cuadrado que sobresale por ambos lados.\nColocación del bloque hexagonal: bloquea todo el agua; los demás bloques solo desde arriba o abajo, como un suelo impermeable integrado."
itIT = "Quadrato che sporge da entrambi i lati.\nPosizionamento: il blocco esagonale blocca tutta l'acqua; gli altri blocchi la bloccano solo dall'alto o dal basso, come un Pavimento Impermeabile integrato"
ukUA = "Квадрат, що виступає з обох боків.\nРозміщення: шестикутний блок блокує всю воду, а інші блоки лише зверху/знизу, як вбудована Impermeable Floor."
thTH = "ช่องสี่เหลี่ยมที่ยื่นออกมาทั้งสองข้าง\nการวางบล็อกหกเหลี่ยมนี้จะกั้นน้ำทุกทิศทาง ส่วนบล็อกอื่นจะกั้นน้ำได้เฉพาะจากด้านบนและด้านล่าง เหมือน Impermeable Floor ที่มีมาในตัว"
csCZ = "Čtverec, který vyčnívá na obou stranách. \nUmístění šestihranného bloku blokuje vodu, ostatní bloky pouze z vrchu/dole jako vestavěná nepropustná podlaha."
viVN = "Một hình vuông nhô ra ở cả hai bên.\nKhối lục giác được đặt ngăn nước hoàn toàn; các khối khác chỉ cho nước từ trên xuống dưới như một mặt sàn không thấm nước tích hợp."
caES = "Quadrat que sobresurt pels dos costats.\nCol·locar aquest bloc hexagonal bloqueja tota l'aigua; els altres blocs només des de dalt o des de baix, com una Terra impermeable integrada."
beBY = "Квадратны блок, які выступае з абодвух бакоў.\nРазмяшчаецца шасцікутным блокам, які не прапускае ваду; іншыя блокі прымыкаюць толькі зверху або знізу, як убудаваная непранікальная падлога."
roRO = "Pătrat care iese în afară pe ambele laturi.\nBlocul hexagonal oprește toată apa, iar celelalte blocuri doar de sus/de jos, ca o Impermeable Floor încorporată."
huHU = "Mindkét oldalán kiálló négyzet.\nElhelyezve ez a hatszög alakú blokk minden vizet feltartóztat, a többi blokk viszont csak felülről vagy alulról, mint a beépített vízhatlan padló."
arSA = "مربع يبرز من الجانبين الاثنين.\nوضع الكتلة السداسية يحجب كل المياه، بينما تحجب الكتل الأخرى من الأعلى والأسفل فقط، مثل أرضية مدمجة غير منفذة."

