["Knatte.DiagPath.Description"]
raw = "Path to go diagonal on Decoration and levees.\nTakes no less pathing lenght then normal road but looks better."
status = "normal"
enUS = "Path to go diagonally on decoration and levees. Takes no less pathing length than a normal road but looks better."
zhCN = "斜向的道路，能铺设在防洪堤或装饰块上。<br><color=#FFA500>仅供美观，实际上海狸走的仍是折线。</color>"
zhTW = "在裝飾和堤壩上走斜線的路徑。所需的路徑長度不比正常道路少，但看起來更好。"
ruRU = "Путь для диагонального движения по декорациям и дамбам. Это занимает не меньше расстояния, чем обычная дорога, но выглядит лучше."
jaJP = "装飾と堤防に斜めに進む道。通常の道路と比べてパスの長さは変わらないが、見た目が良い。"
frFR = "Chemin pour aller en diagonale sur la décoration et les digues. Cela ne prend pas moins de longueur de chemin qu'une route normale, mais c'est plus esthétique."
deDE = "Weg, um diagonal auf Dekorationen und Deichen zu gehen. Nimmt nicht weniger Weglänge als eine normale Straße, sieht aber besser aus."
plPL = "Ścieżka do przechodzenia po przekątnej na dekoracjach i wałach. Nie ma krótszej długości ścieżki niż normalna droga, ale wygląda lepiej."
ptBR = "Caminho para ir na diagonal em decorações e quebra-mares. Não tem um comprimento de caminho menor do que uma estrada normal, mas parece melhor."
koKR = "경로 이름: Knatte.DiagPath.Description - 번역할 새로운 텍스트: \"장식 및 제방에서 대각선으로 가는 경로입니다. 일반 도로보다 경로 길이가 짧지 않지만 더 좋습니다.\""
trTR = "Süslemeler ve setlerde çapraz gitme yolu. Normal yola göre en az aynı uzunlukta bir yol alır ancak daha şık görünür."
esES = "Camino para ir en diagonal sobre decoraciones y diques.\nNo requiere menos longitud de recorrido que un camino normal, pero se ve mejor."
itIT = "Percorso diagonale per decorazioni e argini.\nRichiede una lunghezza di percorso non inferiore a quella di una strada normale, ma ha un aspetto migliore."
ukUA = "Доріжка для діагонального прокладання на декорації та дамбах.\nВона не коротша за звичайну дорогу за довжиною шляху, але виглядає краще."
thTH = "ทางเดินแนวทแยงสำหรับของตกแต่งและคันกั้นน้ำ\nใช้ระยะทางในการเดินไม่น้อยไปกว่าถนนปกติ แต่ดูสวยงามกว่า"
csCZ = "Cesta k diagonálnímu umístění dekorací a hrází. Nevyžaduje méně místa na cestu než běžná silnice, ale vypadá lépe."
viVN = "Đường đi chéo cho trang trí và đê.\nKhông ngắn hơn độ dài lộ trình so với đường bình thường nhưng trông lại đẹp hơn."
caES = "Camí per anar en diagonal sobre decoracions i nivells d'aigua.\nNo requereix menys longitud de camí que una carretera normal, però té un aspecte millor."
beBY = "Шлях для діагонального руху па прыкрасах і дамбах.\nЗаймае не меншую даўжыню шляху, чым звычайная дарога, але выглядае лепш."
roRO = "Cale pentru a merge diagonal pe decorațiuni și diguri.\nNu necesită mai puțină lungime de parcurs decât un drum normal, dar arată mai bine."
huHU = "Ösvény, amely átlósan halad a díszítőelemek és töltések között.\nUgyanakkora útvonalhosszt igényel, mint a normál út, de jobban néz ki."
arSA = "مسار يسمح بالتحرك قطرياً على الديكور والسدود الترابية.\nلا يقل طول المسار المطلوب للتنقل عن الطريق العادي، لكنه يبدو أفضل."

