["LV.ARSP.PrecisionOilYieldLore"]
raw = "Iron Teeth perfected a meticulous pressing method, coaxing every last drop from canola seeds with industrial finesse."
status = "normal"
enUS = "Iron Teeth perfected a meticulous pressing method, coaxing every last drop from canola seeds with industrial finesse."
zhCN = "铁牙们完善了精密压榨技术，以工业级精度从油菜籽中榨取最后一滴油。"
zhTW = "鐵齒完美掌握了一種精細的壓榨方法，以工業技術榨取油菜籽中的每一滴油。"
ruRU = "Iron Teeth усовершенствовала тщательный метод прессования, извлекая каждую последнюю каплю из семян рапса с индустриальной утонченностью."
jaJP = "アイアンティースは緻密な圧搾方法を完成させ、産業的な巧みさでカノーラ種子から最後の一滴まで絞り出しました。"
frFR = "Iron Teeth a perfectionné une méthode d'extraction minutieuse, pressant chaque dernière goutte des graines de canola avec une finesse industrielle."
deDE = "Iron Teeth perfektionierte eine sorgfältige Pressmethode, um jede letzte Tropfen aus Raps Samen mit industrieller Finesse herauszuholen."
plPL = "Iron Teeth udoskonalił staranną metodę prasowania, wydobywając każdą ostatnią kroplę z nasion rzepaku z przemysłową finezją."
ptBR = "Iron Teeth aperfeiçoou um método de prensagem meticuloso, extraindo até a última gota das sementes de canola com finesse industrial."
koKR = "아이언 티스는 정교한 압착 방법을 완벽하게 다듬어, 산업적 기교로 카놀라 씨앗에서 마지막 한 방울까지 짜냈습니다."
trTR = "Demir Dişler, endüstriyel ustalıkla kanola tohumlarından son damlasını almak için titiz bir sıyırma yöntemi geliştirdi."
esES = "Los Dienteférreos perfeccionaron un meticuloso método de prensado, extrayendo hasta la última gota de las semillas de colza con refinamiento industrial."
itIT = "Denti di Ferro hanno perfezionato un metodo di pressatura meticoloso, estraendo fino all'ultima goccia dai semi di colza con raffinatezza industriale."
ukUA = "Залізнозубі розробили ретельний метод пресування, який з промислознайомою точністю витискає з насіння ріпаку кожну останню краплю олії."
thTH = "เขี้ยวเหล็กพัฒนาวิธีการอัดที่ละเอียดรอบคอบ สามารถคั้นน้ำมันออกจากเมล็ดคาโนลาได้ทุกหยดด้วยความประณีตแบบอุตสาหกรรม"
csCZ = "Železné zuby vylepšily pečlivou metodu lisování, která s průmyslovou zručností vytlačila každou poslední kapku z řepkových semen."
viVN = "Răng Sắt hoàn thiện một phương pháp ép dầu tỉ mỉ, vắt kiệt từng giọt từ hạt cải dầu bằng sự tinh xảo công nghiệp."
caES = "Els Dents de Ferro van perfeccionar un mètode de premsat meticulós, extraient fins a la darrera gota de les llavors de colza amb una precisió industrial."
beBY = "Залатыя зубы («Iron Teeth») выдатна выпрацавалі дбайны метад прэсавання, з прамысловай дакладнасцю выціскаючы кожную кроплю алею з насення рапсу."
roRO = "Iron Teeth au perfecționat o metodă de presare meticuloasă, extrăgând până la ultima picătură de ulei din semințele de rapiță cu o precizie industrială."
huHU = "Az Iron Teeth tökéletesítette a precíz préselési eljárást, amellyel ipari finomsággal szinte minden cseppet kicsepegtetnek a repceszemekből."
arSA = "أتقن فريق Iron Teeth طريقة عصر دقيقة ومدروسة، تستخلص آخر قطرة من بذور الكانولا بدقة صناعية."

