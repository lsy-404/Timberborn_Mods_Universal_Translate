["LV.ARSP.SunflowerBiofuelLore"]
raw = "'Sunflowers yield a nectar richer than rivers—blend it with a humble tuber, and the refinery sings a fuel-laden hymn!' — Helian Nectarine"
status = "normal"
enUS = "\"Sunflowers yield a nectar richer than rivers—blend it with a humble tuber, and the refinery sings a fuel-laden hymn!\" — Helian Nectarine"
zhCN = "向日葵赠予神尾种族的不仅是美味的食物，更是具有丰厚能量的原材料。"
zhTW = "「向日葵產出的花蜜比河流更為豐富——將它與一種卑微的塊根混合，煉油廠便唱出一首充滿燃料的聖歌！」——海莉安·蜜果"
ruRU = "«Подсолнечники дают нектар, богаче рек — смешай его со скромной бульбой, и refinery поет гимн, полный топлива!» — Хелиан Нектарин"
jaJP = "「ひまわりは川よりも豊かな蜜を生み出します—それを控えめな根菜と混ぜれば、製油所は燃料たっぷりの賛美歌を歌います！」 — ヘリアン・ネクタリン"
frFR = "« Les tournesols donnent un nectar plus riche que les rivières — mélangez-le avec un tubercule humble, et la raffinerie chante un hymne chargé de carburant ! » — Helian Nectarine"
deDE = "\"Sonnenblumen erzeugen einen Nektar, der reicher ist als Flüsse – mische ihn mit einer bescheidenen Knolle, und die Raffinerie singt ein von Treibstoff erfülltes Hymne!\" — Helian Nectarine"
plPL = "'Słoneczniki wydają nektar bogatszy niż rzeki — połącz go z pokornym bulwiastym warzywem, a rafineria zaśpiewa hymn pełen paliwa!' — Helian Nectarine"
ptBR = "'Girassóis produzem um néctar mais rico que os rios—misture-o com um humilde tubérculo, e a refinaria canta um hino carregado de combustível!' — Helian Nectarine"
koKR = "'해바라기는 강보다 더 풍부한 꿀을 생산합니다—겸손한 뿌리채소와 섞으면 정유소가 연료로 가득 찬 찬송가를 부릅니다!' — 헬리안 넥타린"
trTR = "'Ayçiçekler, nehirlerden daha zengin bir nektar verir—onu mütevazı bir yumru ile birleştir, rafineri yakıt dolu bir ezgi söylesin!' — Helian Nectarine"
esES = "'Los girasoles producen un néctar más rico que los ríos: mézclalo con un humilde tubérculo y la refinería entona un himno cargado de combustible!' — Helian Nectarine"
itIT = "'I girasoli producono un nettare più ricco dei fiumi—mescolatelo con un umile tubero e la raffineria canta un inno carico di carburante!' — Helian Nectarine"
ukUA = "«Соняшники дають нектар багатший за річки — змішайте його зі скромним бульбоплодом, і переробний завод заспіває паливний гімн!» — Геліан Нектарін"
thTH = "'ดอกทานตะวันให้น้ำหวานที่อุดมกว่าแม่น้ำ—ผสมกับหัวมันอันเรียบง่ายเพียงหัวเดียว แล้วโรงกลั่นก็ขับขานบทเพลงสรรเสริญที่เต็มไปด้วยเชื้อเพลิง!' — Helian Nectarine"
csCZ = "'Slunečnice dávají nektar bohatší než řeky - smíchejte ho s pokorným hlízou a rafinérie zpívá hymnu plnou paliva!' — Helian Nektarin"
viVN = "'Hoa hướng dương cho mật hoa phong phú hơn các con sông—hãy trộn nó với một củ khoai giản dị, và nhà máy lọc dầu hát lên một bài thánh ca đầy nhiên liệu!' — Helian Nectarine"
caES = "«Els girasols produeixen un nèctar més ric que els rius: barreja'l amb un humil tubercle, i la refineria entona un himne carregat de combustible!» — Helian Nectarine"
beBY = "«Сланечнікі даюць нектар багацейшы за рэкі — зменш яго з сціплым клубнем, і перапрацоўчы завод заспявае паліўны гімн!» — Гелян Нектарын"
roRO = "„Floarea-soarelui produce un nectar mai bogat decât râurile — amestecă-l cu un tubercul modest, iar rafinăria cântă un imn încărcat de combustibil!” — Helian Nectarine"
huHU = "„A napraforgó folyónál gazdagabb nektárt terem – keverd össze egy szerény gumóval, és a finomító üzemanyagban gazdag himnuszt zengedményez!” — Helian Nectarine"
arSA = "\"يُنتج عبّاد الشمس رحيقًا أغنى من الأنهار، امزجه مع درنة متواضعة، وسيُنشد المصفاة ترنيمة مشبعة بالوقود!\" — هيليان نيكتارين"

