["LV.ARSP.DirectLogForgingLore"]
raw = "Beavers discovered they could gnaw logs into rough shapes and hammer them into gears, skipping the plank step entirely. It’s crude, but it works."
status = "normal"
enUS = "Beavers discovered they could gnaw logs into rough shapes and hammer them into gears, skipping the plank step entirely. It’s crude, but it works."
zhCN = "海狸们发现啃咬打磨原木也能直接制成齿轮，虽然粗糙，但很实用。"
zhTW = "海狸發現牠們可以咬食樹幹成粗略形狀，並將它們敲打成齒輪，完全省略了木板這一步。這雖然粗糙，但有效。"
ruRU = "Бобры поняли, что могут грызть бревна в грубые формы и забивать их в шестерёнки, полностью пропуская этап доски. Это примитивно, но это работает."
jaJP = "ビーバーたちは、丸太をざっくりとした形にかじり、ギアにハンマーで叩き込むことができることを発見しました。板の工程を完全にスキップしています。粗末ですが、効果があります。"
frFR = "Les castors ont découvert qu'ils pouvaient ronger des rondins en formes grossières et les marteler en engrenages, sautant complètement l'étape de la planche. C'est rudimentaire, mais ça fonctionne."
deDE = "Biber entdeckten, dass sie Stämme in grobe Formen nagen und sie zu Zahnrädern hämmern konnten, ohne den Planken-Schritt vollständig auszulassen. Es ist grob, aber es funktioniert."
plPL = "Bobry odkryły, że mogą gryźć kłody w surowe kształty i wbić je w zębatki, całkowicie pomijając etap desek. To prymitywne, ale działa."
ptBR = "Os castores descobriram que podiam roer troncos em formas rudimentares e martelá-los em engrenagens, pulando completamente a etapa das tábuas. É rudimentar, mas funciona."
koKR = "비버들은 통나무를 거칠게 깎아 기어로 두들길 수 있다는 것을 발견했습니다. 판자를 생략하는 방법입니다. 거칠지만, 작동합니다."
trTR = "Kunduzlar, kütükleri kaba şekillere kemirip dişlilere değiştirebileceklerini keşfettiler, levha aşamasını tamamen atlayarak. Bu ilkel, ama işe yarıyor."
esES = "Los castores descubrieron que podían roer troncos hasta darles formas toscas y martillarlos para convertirlos en engranajes, saltándose por completo el paso de las tablas. Es rudimentario, pero funciona."
itIT = "I castori hanno scoperto che potevano rosicchiare i tronchi fino a dargli una forma grezza e martellarli fino a ricavarne ingranaggi, saltando del tutto il passaggio delle assi. È rozzo, ma funziona."
ukUA = "Бобри виявили, що можна гризти колоди до грубих форм і вибивати з них шестерні молотом, оминаючи етап дощок. Це грубо, але працює."
thTH = "บีเวอร์ค้นพบว่าพวกมันสามารถแทะท่อนซุงให้เป็นรูปร่างหยาบ ๆ แล้วตอกให้กลายเป็นเฟืองได้ โดยไม่ต้องผ่านขั้นตอนทำแผ่นไม้เลย มันหยาบไปหน่อย แต่ก็ใช้ได้ผล"
csCZ = "Bobři objevili, že mohou kmeny zakusovat do hrubých tvarů a kladivem je utvářet na ozubená kola, přičemž úplně vynechávají krok s prkny. Je to primitivní, ale funguje to."
viVN = "Những chú hải ly phát hiện chúng có thể nhai các khúc gỗ thành những hình thù thô sơ và đóng chúng thành bánh răng, bỏ qua hoàn toàn bước làm ván. Nó thô sơ, nhưng hoạt động."
caES = "Els castors van descobrir que podien rosegar troncs fins a donar-los formes toscas i martellar-los per convertir-los en engranatges, saltant-se el pas de les taules completament. És rudimentari, però funciona."
beBY = "Бабры выявілі, што могуць абгрызаць бервяно да грубай формы і выбіваць з яго шасцерні, пакідаючы крок з дошкамі зусім. Гэта грубавата, але працуе."
roRO = "Castorii au descoperit că pot roade bușteni până la forme aproximative și îi pot bate în roți dințate, sărind complet peste etapa scândurii. Este rudimentar, dar funcționează."
huHU = "A hódok rájöttek, hogy a rönköket durva alakra rághatják, majd kalapálással fogaskerekekké alakíthatják, így a deszkázási lépést teljesen kihagyhatják. Ez nyers megoldás, de működik."
arSA = "اكتشف القنادس أنهم يستطيعون نحت الجذوع إلى أشكال خشنة وطرقها لتصبح تروسًا، متجاوزين مرحلة الألواح تمامًا. الطريقة بدائية، لكنها تنجح."

