["LV.ARSP.ResinFiredSmelterLore"]
raw = "Folktails tapped into the sticky power of pine resin, crafting a smelter that burns slow and steady for swift metalwork."
status = "normal"
enUS = "Folktails tapped into the sticky power of pine resin, crafting a smelter that burns slow and steady for swift metalwork."
zhCN = "神尾们发现了松脂的隔热性，建造出温度稳定的冶炼炉，实现快速金属加工。"
zhTW = "Folktails 利用松樹樹脂的粘稠特性，製作出一種慢而穩定燃燒的熔爐，以便快速進行金屬加工。"
ruRU = "Сказания использовали липкую силу сосновой смолы, создавая плавильню, которая горит медленно и стабильно для быстрого металлообработки."
jaJP = "フォークテイルズは、松の樹脂の粘着力を利用して、金属加工のためにゆっくりと安定して燃える溶鉱炉を作り上げました。"
frFR = "Folktails a exploité le pouvoir collant de la résine de pin, fabriquant un four à métaux qui brûle lentement et constamment pour un travail du métal rapide."
deDE = "Volksmärchen nutzten die klebrige Kraft von Harz, um einen Schmelzofen zu schaffen, der langsam und gleichmäßig brennt und schnelles Metallhandwerk ermöglicht."
plPL = "Folktails wykorzystał lepki urok żywicy sosnowej, tworząc piec, który pali się powoli i równomiernie, idealny do szybkiej obróbki metalu."
ptBR = "Folktails aproveitou o poder pegajoso da resina de pinho, criando um forno que queima lenta e constantemente para um trabalho em metal ágil."
koKR = "포크테일은 소나무 수지의 끈적한 힘을 활용하여 빠른 금속 작업을 위한 천천히 지속적으로 타는 제련소를 만들었다."
trTR = "Halk masalları, çam reçinesinin yapışkan gücünden faydalandı ve hızlı metal işçiliği için yavaş ve sürekli yanan bir eritici yaptılar."
esES = "Los Bucólicos aprovecharon el pegajoso poder de la resina de pino y crearon una fundición que arde lenta y constante para un trabajo metalúrgico rápido."
itIT = "Le Codalesta hanno sfruttato la potenza appiccicosa della resina di pino, costruendo una fonderia che brucia lenta e costante per una lavorazione dei metalli rapida."
ukUA = "Хвостонародці скористалися липкою силою соснової смоли й побудували плавильню, яка горить повільно й рівно, забезпечуючи швидку металообробку."
thTH = "หางไม้ได้ใช้พลังของยางสนที่เหนียวข้น สร้างเตาหลอมที่เผาไหม้อย่างช้าและสม่ำเสมอ เพื่อการงานโลหะที่รวดเร็ว"
csCZ = "Folklórní příběhy využily lepivou sílu borovicové pryskyřice a vytvořily tavicí pec, která hoří pomalu a rovnoměrně pro rychlé zpracování kovů."
viVN = "Folktails khai thác sức mạnh dính của nhựa thông, chế tạo một lò luyện kim cháy chậm và đều đặn để gia công kim loại nhanh chóng."
caES = "Els Folktails van aprofitar el poder enganxós de la resina de pi, construint una fosa que crema lenta i constant per a una metal·lúrgia ràpida."
beBY = "Фолктэйлы выкарысталі липкую сілу смалы хвойных дрэў і стварылі плавільню, якая гарыць павольна і роўна, забяспечваючы хуткую металаapracоўку."
roRO = "Folktails au valorificat puterea lipicioasă a rășinii de pin, construind un cuptor de topit care arde lent și constant pentru prelucrarea rapidă a metalului."
huHU = "A telepesek gyantájának ragadós erejét kihasználva a bányászok olyan kohót építettek, amely lassan, egyenletesen ég, így gyors fémmegmunkálást tesz lehetővé."
arSA = "فولكتيلز استفادوا من القوة اللزجة لراتنج الصنوبر، فصنعوا فرنًا يحترق ببطء وثبات لصهر المعادن بسرعة."

