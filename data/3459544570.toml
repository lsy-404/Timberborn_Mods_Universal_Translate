["LV.ARSP.SteelBoundPlanksLore"]
raw = "Iron Teeth ingenuity turned the tables—smelting metal scraps into a binding lattice that hardens planks without a drop of resin."
status = "normal"
enUS = "Iron Teeth ingenuity turned the tables—smelting metal scraps into a binding lattice that hardens planks without a drop of resin."
zhCN = "铁牙们将金属块制成加固网格，无需一滴松脂就能强化木板硬度。"
zhTW = "鐵牙的巧思翻轉了局面——將金屬廢料熔煉成堅固的格子，能夠使木板在不需要一滴樹脂的情況下硬化。"
ruRU = "Мастера Железных Зубов перевернули ситуацию — они переплавили металлические обрезки в связывающую решетку, которая упрочняет доски без капли смолы."
jaJP = "アイアンティースの独創性が状況を一変させた—金属のスクラップを溶解して、樹脂なしで板材を硬化させる結合格子を作り上げた。"
frFR = "L'ingéniosité d'Iron Teeth a inversé la situation : elle a permis de fondre des déchets métalliques en un treillis liant qui durcit les planches sans une goutte de résine."
deDE = "Die Ingenieurskunst von Iron Teeth hat die Bedingungen geändert – Metallreste werden zu einem verbindenden Gitter geschmolzen, das Planken ohne einen Tropfen Harz verhärtet."
plPL = "Pomysłowość Żelaznych Zębów odwróciła sytuację — przetapianie metalowych odpadów w wiążącą siatkę, która utwardza deski bez kropli żywicy."
ptBR = "A engenhosidade dos Dentes de Ferro virou o jogo — fundindo sucatas de metal em uma rede de ligação que endurece tábuas sem uma gota de resina."
koKR = "철 이빨의 독창성이 상황을 뒤바꿨습니다. 금속 조각을 녹여서 수지 한 방울 없이 판자를 강화하는 격자 구조로 만들었습니다."
trTR = "Demir Dişlerin zekası durumu değiştirdi—metal atıkları reçineli bir damla olmadan sertleştirilen tahtalar için bağlayıcı bir örgü haline dönüştürdü."
esES = "La ingeniosidad de los Dienteférreos dio la vuelta a la situación: fundiendo chatarra de metal en una red de unión que endurece las tablas sin una gota de resina."
itIT = "Il genio dei Denti di Ferro ha ribaltato la situazione: fondendo rottami metallici si ottiene un reticolo legante che indurisce le assi senza neanche una goccia di resina."
ukUA = "Винахідливість Залізнозубих перевернула ситуацію: вони переплавляють металеві відходи в зв'язувальну решітку, яка зміцнює дошки без жодної краплі смоли."
thTH = "เทคโนโลยีของเขี้ยวเหล็กพลิกสถานการณ์ได้ — หลอมเศษโลหะให้กลายเป็นโครงตาข่ายยึดเกาะที่ทำให้แผ่นไม้แข็งตัวได้โดยไม่ต้องใช้ยางไม้แม้แต่หยดเดียว"
csCZ = "Ingenuita železných zubů otočila situaci—tavením kovových zbytků vznikla vazebná mřížka, která zpevňuje prkna bez kapky pryskyřice."
viVN = "Khéo léo của Iron Teeth đã đảo ngược tình thế—nung chảy phế liệu kim loại thành một mạng lưới kết dính làm cứng ván mà không cần một giọt nhựa."
caES = "Els ingenis dels Iron Teeth han donat la volta a la situació: fonen restes de metall per crear una xarxa lligadora que enforteix les taules sense cap gota de resina."
beBY = "Вынаходлівасць Залатых Зубоў перавярнула ўсё з ног на галаву: металічныя адходы плавяцца ў звязваючую рашотку, якая ўмацоўвае дошкі без кроплі смалы."
roRO = "Ingeniozitatea Iron Teeth a întors situația pe dos: a topit resturi metalice într-o rețea de legătură care întărește scândurile fără o picătură de rășină."
huHU = "Az Iron Teeth leleményessége fordított a helyzeten: fémhulladékot olvasztottak össze olyan kötőhálóvá, amely gyanta nélkül is megkeményíti a deszkákat."
arSA = "بفضل براعة \"آيرون تيث\"، انقلبت الموازين: صُهرت قطع الخردة المعدنية لتصبح شبكة رابطة تُقوّي الألواح الخشبية دون قطرة واحدة من الراتنج."

