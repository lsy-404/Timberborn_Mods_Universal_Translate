["LV.ARSP.TimberbotFrameworkLore"]
raw = "'Our bots now dance with the strength of the forest—planks over steel, a Folktails triumph!' — Gearwhisker Timbercog"
status = "normal"
enUS = "\"Our bots now dance with the strength of the forest—planks over steel, a Folktails triumph!\" — Gearwhisker Timbercog"
zhCN = "为了让机关人也学会亲近自然，神尾种族决定抛弃所有钢铁和金属的部件。"
zhTW = "「我們的機器人現在以森林的力量舞動—用木板替代鋼鐵，這是Folktails的勝利！」— Gearwhisker Timbercog"
ruRU = "\"Наши боты теперь танцуют с силой леса — доски вместо стали, триумф Фолктайлс!\" — Гирвискер Таймбек."
jaJP = "「我々のボットは今、森の力で踊る—鋼の上に板、フォークテイルズの勝利！」 — ギアウィスカー・ティンバーコグ"
frFR = "« Nos bots dansent désormais avec la force de la forêt - des planches sur de l'acier, un triomphe de Folktails ! » — Gearwhisker Timbercog"
deDE = "„Unsere Bots tanzen jetzt mit der Kraft des Waldes – Planken über Stahl, ein Triumph von Folktails!“ — Gearwhisker Timbercog"
plPL = "'Nasze boty teraz tańczą z siłą lasu—deski nad stalą, triumf Folktails!' — Gearwhisker Timbercog"
ptBR = "\"Nossos robôs agora dançam com a força da floresta—tábuas sobre aço, um triunfo de Folktails!\" — Gearwhisker Timbercog"
koKR = "'우리의 봇들은 이제 숲의 힘으로 춤을 춘다—강철보다 판자가, 포크테일의 승리다!' — 기어위스커 티머코그"
trTR = "'Robotlarımız artık ormanın gücüyle dans ediyor—ahşaplar çelikten güçlü, Folktails zaferi!' — Gearwhisker Timbercog"
esES = "\"Nuestros robots ahora bailan con la fuerza del bosque: tablones sobre acero, ¡un triunfo de los Bucólicos!\" — Gearwhisker Timbercog"
itIT = "\"I nostri bot ora danzano con la forza della foresta: assi al posto dell'acciaio, un trionfo di Codalesta!\" — Gearwhisker Timbercog"
ukUA = "'Наші боти тепер танцюють із силою лісу — дошки замість сталі, перемога Хвостонародців!' — Gearwhisker Timbercog"
thTH = "'ตอนนี้บอตของเราเต้นด้วยพลังของป่า—ไม้เหนือเหล็กกล้า ชัยชนะของหางไม้!' — Gearwhisker Timbercog"
csCZ = "'Naši roboti nyní tančí s silou lesa—prkna nad ocelí, triumf Folktails!' — Gearwhisker Timbercog"
viVN = "'Những bot của chúng ta nay nhảy múa với sức mạnh của rừng—ván gỗ vượt lên thép, một chiến thắng Folktails!' — Gearwhisker Timbercog"
caES = "«Els nostres bots ara ballen amb la força del bosc: fusta per sobre de l'acer, un triomf dels Folktails!» — Gearwhisker Timbercog"
beBY = "„Нашы боты цяпер танцуюць з моцай лесу — дошкі замест сталі, перамога Folktails!\" — Gearwhisker Timbercog"
roRO = "„Roboții noștri dansează acum cu puterea pădurii — scânduri peste oțel, un triumf al Folktails!” — Gearwhisker Timbercog"
huHU = "„Robotjaink most a fa erejével táncolnak – deszka az acél felett, a Folktails diadala!\" — Gearwhisker Timbercog"
arSA = "«روبوتاتنا ترقص الآن بقوة الغابة—ألواح خشب فوق الفولاذ، انتصار للفولكتيلز!» — جيرويسكر تيمبركوغ"

["LV.ARSP.TimberbotFrameworkEff"]
raw = "Unlock Timberbot Framework: Folktails can use Treated Planks instead of Metal Blocks for their Bot parts. Biofuel is also no longer needed for the Chassis."
status = "normal"
enUS = "Unlock Timberbot Framework: Folktails can use Treated Planks instead of Metal Blocks for their Bot parts. Biofuel is also no longer needed for the Chassis."
zhCN = "在部件厂解锁 机关人部件（木械化）：用树脂木板替代金属块制造机关人部件，且机关人主体不再需要生物燃料。（神尾专属）"
zhTW = "解鎖木材機器人框架：民間故事可以使用處理過的木板作為機器人部件，而底盤不再需要生物燃料。"
ruRU = "Разблокировать фреймворк Timberbot: Folktails могут использовать обработанные доски вместо металлических блоков для своих частей бота. Биотопливо также больше не требуется для шасси."
jaJP = "ティンバーボットフレームワークを解除：フォルクテイルはボットパーツに金属ブロックの代わりに処理済みの板を使用できます。また、シャーシにはバイオ燃料も必要なくなりました。"
frFR = "Déverrouillez le cadre Timberbot : Les Folktails peuvent utiliser des Planches Traitées au lieu de Blocs Métalliques pour les pièces de leur Bot. Le bio carburant n'est également plus nécessaire pour le Châssis."
deDE = "Entsperren Sie das Timberbot-Framework: Folktails können behandeltes Holz anstelle von Metallblöcken für ihre Bot-Teile verwenden. Biokraftstoff wird auch nicht mehr für das Chassis benötigt."
plPL = "Odblokuj Ramę Timberbota: Folktails mogą używać Obrabianych Desek zamiast Bloków Metalowych do swoich części Bota. Biopaliwo nie jest już potrzebne do podwozia."
ptBR = "Desbloqueie o Timberbot Framework: Folktails podem usar Pranchas Tratadas em vez de Blocos de Metal para as partes de seus Bots. Biocombustível também não é mais necessário para o Chassi."
koKR = "목록 이름: LV.ARSP.TimberbotFrameworkEff - 번역할 새로운 텍스트: \"팀버봇 프레임워크 잠금 해제: 포크테일은 봇 부품에 금속 블록 대신 처리된 판자를 사용할 수 있습니다. 차대에는 바이오 연료도 더 이상 필요하지 않습니다.\""
trTR = "Timberbot Çerçevesini Kilidini Aç: Folktails, Bot parçaları için Metal Bloklar yerine İşlenmiş Tahtalar kullanabilir. Şasi için Biyo-yakıta da artık ihtiyaç yok."
esES = "Desbloquea el Marco de Timberbot: los Bucólicos pueden usar Tablones Tratados en lugar de Bloques de Metal para las piezas de sus bots. Además, el Biocombustible ya no es necesario para el Chasis."
itIT = "Sblocca Timberbot Framework: i Codalesta possono usare Assi Trattate invece di Blocchi di Metallo per le parti dei loro Bot. Anche il Biocarburante non è più necessario per il Telaio."
ukUA = "Розблокуйте каркас Timberbot: Хвостонародці можуть використовувати оброблені дошки замість металевих блоків для деталей своїх ботів. Біопаливо також більше не потрібне для шасі."
thTH = "ปลดล็อก Timberbot Framework: หางไม้สามารถใช้ไม้แปรรูปที่ผ่านการปรับสภาพแทนบล็อกโลหะสำหรับชิ้นส่วนบอทของพวกมัน และไม่จำเป็นต้องใช้ไบโอฟิวเอลสำหรับแชสซีอีกต่อไป"
csCZ = "Odemkněte rámec Timberbota: Folktails mohou používat ošetřené prkna místo kovových bloků pro své části botů. Bioolej již také není potřebný pro podvozek."
viVN = "Mở khóa Timberbot Framework: Folktails có thể sử dụng ván được xử lý thay vì các khối kim loại cho các bộ phận Bot của họ. Nhiên liệu sinh học cũng không còn cần cho khung chassis."
caES = "Desbloqueja el Timberbot Framework: els Folktails poden fer servir taulons tractats en lloc de blocs de metall per a les peces dels seus bots. A més, ja no cal biocombustible per al xassís."
beBY = "Разблакіроўка Timberbot Framework: Folktails могуць выкарыстоўваць апрацаваныя дошкі замест metal blocks для дэталяў сваіх ботаў. Biofuel таксама больш не патрэбны для Chassis."
roRO = "Deblocați Timberbot Framework: Folktails pot folosi scânduri tratate în loc de blocuri de metal pentru piesele botului lor. De asemenea, biocombustibilul nu mai este necesar pentru șasiu."
huHU = "Feloldható: Timberbot-keretrendszer: A Folktailek a Kezelt deszkákat használhatják a Fém blokkok helyett a botalkatrészeikhez. A Chassis-hoz már nincs szükség bioüzemanyagra sem."
arSA = "فتح إطار عمل Timberbot: يمكن للـFolktails استخدام ألواح معالجة بدلاً من كتل معدنية لأجزاء الروبوت الخاصة بهم. ولم يعد الوقود الحيوي مطلوباً للهيكل أيضاً."

