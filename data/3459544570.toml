["LV.ARSP.HighYieldLogPressLore"]
raw = "After seasons of trial, beavers perfected a water-driven press that turns raw logs into gears at breakneck speed—a marvel of late-season ingenuity."
status = "normal"
enUS = "After seasons of trial, beavers perfected a water-driven press that turns raw logs into gears at breakneck speed—a marvel of late-season ingenuity."
zhCN = "经过多次试验，海狸们完善了水力冲压技术，能以惊人速度将原木直接变成齿轮。"
zhTW = "經過幾季的試驗，海狸們完善了一種水力驅動的壓榨機，以驚人的速度將原木轉化為齒輪，這是一項晚季創意的奇蹟。"
ruRU = "После сезонов испытаний бобры усовершенствовали водяной пресс, который превращает сырые бревна в шестерни с головокружительной скоростью — чудо позднего сезона изобретательности."
jaJP = "試行錯誤の末、ビーバーたちは水力プレスを完璧に仕上げ、生の丸太を驚異的な速さで歯車に変えることができるようになった。これは遅い季節の驚くべき創意工夫の成果である。"
frFR = "Après des saisons d'essais, les castors ont perfectionné une presse actionnée par l'eau qui transforme les troncs d'arbre bruts en engrenages à une vitesse folle—une merveille d'ingéniosité en fin de saison."
deDE = "Nach Jahreszeiten des Versuchs perfektionierten Biber eine wassergetriebene Presse, die rohe Holzstämme mit atemberaubender Geschwindigkeit in Zahnräder verwandelt – ein Wunder späten saisonalen Einfallsreichtums."
plPL = "Po sezonach prób bobry udoskonaliły prasę napędzaną wodą, która przekształca surowe kłody w zębatki z zawrotną prędkością — cud późno-sezonowego wynalazczości."
ptBR = "Após temporadas de tentativas, castores aperfeiçoaram uma prensa movida a água que transforma toras brutas em engrenagens a uma velocidade impressionante—uma maravilha da engenhosidade no final da temporada."
koKR = "한 시즌의 시험 끝에, 비버들은 원시 로그를 빠른 속도로 기어로 변환하는 수력 프레스를 완벽하게 제작했다. 이는 늦가을의 기발한 발명품이다."
trTR = "Mevsimlerce süren denemelerin ardından, kunduzlar ham ağaçları deli gibi hızda dişlilere dönüştüren suyla çalışan bir presi mükemmelleştirdiler - son sezon yaratıcılığının bir harikası."
esES = "Tras temporadas de prueba, los castores perfeccionaron una prensa movida por agua que convierte troncos en bruto en engranajes a una velocidad vertiginosa: una maravilla del ingenio de finales de temporada."
itIT = "Dopo stagioni di prove, i castori hanno perfezionato una pressa ad acqua che trasforma i tronchi grezzi in ingranaggi a velocità vertiginosa: una meraviglia dell'ingegno di fine stagione."
ukUA = "Після кількох сезонів випробувань бобри досконалили водяний прес, який перетворює необроблені колоди на шестерні з неймовірною швидкістю — диво пізньосезонної винахідливості."
thTH = "หลังผ่านการทดลองมาหลายฤดูกาล เหล่าบีเวอร์ก็สมบูรณ์แบบเครื่องอัดที่ขับเคลื่อนด้วยน้ำ ซึ่งเปลี่ยนท่อนซุงดิบให้กลายเป็นเฟืองด้วยความเร็วสุดขีด—ผลงานชวนอัศจรรย์ของไหวพริบในช่วงปลายฤดู"
csCZ = "Po sezonách zkoušení bobři zdokonalili vodou poháněný lis, který proměňuje surové kmeny na ozubená kola neuvěřitelnou rychlostí—podivuhodný výtvor pozdně sezónní vynalézavosti."
viVN = "Sau nhiều mùa thử nghiệm, loài hải ly đã hoàn thiện một máy ép hoạt động bằng nước có thể biến các khúc gỗ thô thành bánh răng với tốc độ chóng mặt— một kỳ tích của sự khéo léo cuối mùa."
caES = "Després de temporades de prova, els castors van perfeccionar una premsa accionada per aigua que converteix troncs crus en engranatges a una velocitat vertiginosa: una meravella de l'enginy de final de temporada."
beBY = "Пасля многіх сезонаў выпрабаванняў бабры дасканалілі прэс на водным ходзе, які хутка ператварае сыравінныя бервяны ў шасцярні — цуд позняй вынаходлівасці."
roRO = "După sezoane de încercări, castorii au perfecționat o presă acţionată de apă, care transformă bușteni brute în roți dințate cu viteză amețitoare — o minune a ingeniozității de la sfârșitul sezonului."
huHU = "Évek kísérletezése után a bobrok egy vízhajtású présgépet tökéletesítettek, amely szédítő sebességgel nyers rönkökből fogaskerekeket állít elő – a késői szezon leleményességének valódi csodája."
arSA = "بعد مواسم من التجارب، أتقن القنادس مكبسًا يعمل بقوة الماء ويحوّل الجذوع الخام إلى تروس بسرعة مذهلة، وهو إنجاز رائع من براعة أواخر الموسم."

