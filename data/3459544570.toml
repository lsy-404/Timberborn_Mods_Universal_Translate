["LV.ARSP.RapidCanolaCrushLore"]
raw = "'Speed trumps all—grind the seeds quick, and let the oil flow, waste be what it may!' — Boltfur Greasesnap"
status = "normal"
enUS = "\"Speed trumps all—grind the seeds quick, and let the oil flow, waste be what it may!\" — Boltfur Greasesnap"
zhCN = "铁牙们为了快速获得菜籽油，不得不狠心浪费一部分原材料。"
zhTW = "「速度至上——快速研磨種子，讓油流出，浪費則無所謂！」——波爾特弗·油脂彈"
ruRU = "«Скорость превосходит всё — молите семена быстро, и пусть масло течет, пускай это будет пустая трата!» — Болтфур Смазгриб"
jaJP = "「速さが全てに勝る——種を素早く挽き、油を流し、無駄は何でもかまわない！」 — ボルトファー・グリーズナップ"
frFR = "\"La vitesse l'emporte sur tout—moulez les graines rapidement, et laissez l'huile couler, peu importe le gaspillage !\" — Boltfur Greasesnap"
deDE = "'Schnelligkeit siegt über alles – mahle die Samen schnell, und lass das Öl fließen, was auch immer dabei verloren geht!' — Boltfur Greasesnap"
plPL = "'Prędkość zwycięża wszystko - miel nasiona szybko, a niech olej płynie, niech się dzieje, co chce!' — Boltfur Greasesnap"
ptBR = "\"A velocidade supera tudo—moa as sementes rápido e deixe o óleo fluir, que o desperdício seja o que for!\" — Boltfur Greasesnap"
koKR = "\"속도가 모든 것을 이긴다—씨앗을 빨리 갈아버리고, 기름이 흐르게 하라, 낭비가 무엇이든!\" — 볼트퍼 그리스냅"
trTR = "\"Hız her şeyin önündedir—tohumları hızlıca ezin, yağı akıtın, israf ne olursa olsun!\" — Boltfur Greasesnap"
esES = "'Lo que importa es la velocidad: muele las semillas deprisa y deja que el aceite fluya, que el desperdicio sea lo que sea!' — Boltfur Greasesnap"
itIT = "'La velocità batte tutto: macina in fretta i semi e lascia scorrere l'olio, che importa lo spreco!' — Boltfur Greasesnap"
ukUA = "«Швидкість понад усе — мели насіння швидко, нехай олія тече, хоч би що витрачалося!» — Болтфур Грисснеп"
thTH = "'ความเร็วสำคัญกว่าทุกสิ่ง—บดเมล็ดให้เร็ว ปล่อยให้น้ำมันไหล ของเหลือจะเป็นอย่างไรก็ช่างมัน!' — Boltfur Greasesnap"
csCZ = "'Rychlost převládá nad vším — rozemelte semena rychle a nechte olej téct, na zbytek se neohlížejte!' — Boltfur Greasesnap"
viVN = "'Tốc độ trội hơn tất cả—nghiền hạt nhanh, để dầu chảy ra, phế thải cho dù nó là gì đi nữa!' — Boltfur Greasesnap"
caES = "«La velocitat ho és tot: mòlia les llavors de pressa i deixa que l'oli flueixi, que el residu sigui el que sigui!» — Boltfur Greasesnap"
beBY = "«Хуткасць вышэй за ўсё — мелі насенне хутчэй, і няхай масла цячэ, няхай адходы будуць якімі заўгодна!» — Болтфур Грисснап"
roRO = "„Viteza bate tot — macină repede semințele și lasă uleiul să curgă, oricare ar fi risipa!” — Boltfur Greasesnap"
huHU = "„A sebesség mindent felülír – darálj gyorsan a magokból, hadd folyjon az olaj, a pazarlás legyen, aminek lennie kell!\" — Boltfur Greasesnap"
arSA = "\"السرعة تفوق كل شيء، اطحن البذور بسرعة، ودع الزيت يتدفق، فليكن الهدر ما يكون!\" — بولتفور غريسسناب"

