["LV.ARSP.CrudeLogPressExtractLore"]
raw = "'We crush logs and scrape metal ‘til the extract drips out—slow, messy, but it beats touching that yuke water!' — Pressjaw Scrapchew"
status = "normal"
enUS = "\"We crush logs and scrape metal until the extract drips out—slow, messy, but it beats touching that yuke water!\" — Pressjaw Scrapchew"
zhCN = "渗入土地的恶水虽然会污染环境，却也让铁牙种族更方便地获得提取物。"
zhTW = "「我們壓碎木頭，刮取金屬，直到萃取液滴出來——緩慢、凌亂，但總比碰到那可怕的水好！」——普雷斯喬·斯克拉普丘"
ruRU = "«Мы дробим бревна и скребем металл, пока экстракт не начнет капать — медленно, грязно, но это лучше, чем трогать эту юку!» — Прессджоу Скрэпчу"
jaJP = "「私たちは丸太を砕き、金属をこすり合わせて抽出物が滴るまで—遅くて乱雑だけど、そのユーク水に触れるよりはましだ！」 — プレスジョー・スクラップチュー"
frFR = "'Nous broyons des bûches et grattisons du métal jusqu'à ce que l'extrait s'écoule - lentement, de manière désordonnée, mais ça vaut mieux que de toucher cette eau yuke !' — Pressjaw Scrapchew"
deDE = "„Wir zerstoßen Holz und schaben Metall, bis der Extrakt herausläuft – langsam, unordentlich, aber es ist besser, als dieses Yuke-Wasser anzufassen!“ — Pressjaw Scrapchew"
plPL = "'Rozbijamy kłody i skrobimy metal, aż ekstrakt zaczyna kapać - powoli, brudno, ale lepsze to niż dotykanie tej wstrętnej wody!' — Pressjaw Scrapchew"
ptBR = "\"Nós trituramos toras e raspamos metal até que o extrato goteje—lento, bagunçado, mas é melhor do que tocar naquela água do yuke!\" — Pressjaw Scrapchew"
koKR = "'우리는 통나무를 부수고 금속을 긁어내어 추출물이 떨어지도록 해 — 느리고 지저분하지만, 그 유크 물에 손대는 것보다는 나아!' — 프레스조 스크랩츄"
trTR = "'Kütükleri eziyoruz ve metal zımparalıyoruz, ta ki öz damlayana kadar—yavaş, dağınık ama o çirkin suyla temas etmekten iyidir!' — Pressjaw Scrapchew"
esES = "«“Trituramos troncos y raspamos metal hasta que el extracto gotea: lento, desordenado, ¡pero mejor que tocar esa agua de yuke!” — Pressjaw Scrapchew»"
itIT = "'Schiacciamo tronchi e raschiamo metallo finché l'estratto non gocciola: lento, disordinato, ma è meglio che toccare quell'acqua schifosa!' — Pressjaw Scrapchew"
ukUA = "'Ми дробимо колоди й шкрябаємо метал, аж поки екстракт не закапає: повільно, брудно, зате краще, ніж торкатися тієї гидкої води!' — Pressjaw Scrapchew"
thTH = "\"เราบดท่อนไม้แล้วขูดโลหะจนน้ำสกัดไหลออกมา—ช้า รกรุงรัง แต่ก็ยังดีกว่าไปแตะน้ำยุคนั่นน่ะ!\" — Pressjaw Scrapchew"
csCZ = "'Rozdrtíme klády a škrábeme kov, dokud nezačne vytékat extrakt - pomalu, nepořádně, ale lepší než se dotýkat té juki vody!' — Pressjaw Scrapchew"
viVN = "'Chúng tôi nghiền gỗ và cạo kim loại cho tới khi chiết xuất nhỏ giọt—chậm, bẩn, nhưng tốt hơn là chạm vào nước yuke đó!' — Pressjaw Scrapchew"
caES = "'Triturem troncs i raspem metall fins que l'extracte degota—lent, brut, però és millor que tocar aquella aigua maleïda!' — Pressjaw Scrapchew"
beBY = "'Мы дробім бярвенні і скрэбам метал, пакуль экстракт не закапае — павольна, брудна, але гэта лепш, чым датыкацца да той паскудnaй вады!' — Pressjaw Scrapchew"
roRO = "'Zdrobim buștenii și răzuim metalul până când extractul picură — lent, murdar, dar e mai bine decât să atingem apa aia scârboasă!' — Pressjaw Scrapchew"
huHU = "„Összezúzzuk a fatörzseket, és lekaparjuk a fémet, amíg ki nem csöpög a kivonat – lassú, rendetlen, de még mindig jobb, mint hozzáérni ahhoz a förtelmes mocsokvízhez!” — Pressjaw Scrapchew"
arSA = "'نسحق الجذوع ونكشط المعدن حتى يبدأ المستخلص بالتقاطر، بطيء ومزعج، لكنه أهون من لمس ذلك الماء الكريه!' — Pressjaw Scrapchew"

