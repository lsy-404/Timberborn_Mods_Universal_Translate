["LV.ARSP.WaterFilterLore"]
raw = "Beavers devised a clever centrifuge tweak, using treated planks to strain badwater—yielding extract and a trickle of fresh water from the sludge."
status = "normal"
enUS = "Beavers devised a clever centrifuge tweak, using treated planks to strain bad water—yielding extract and a trickle of fresh water from the sludge."
zhCN = "海狸们采用了新的吸附材料，从恶水中分离出提取物的同时，还能产生少量净水。"
zhTW = "海狸設計了一種巧妙的離心機調整，利用處理過的木板過濾污染水，從污泥中提取出精華和涓涓細流的潔淨水。"
ruRU = "Бобры разработали умное улучшение центрифуги, используя обработанные доски для фильтрации загрязненной воды, что позволяло получать экстракт и струйку пресной воды из осадка."
jaJP = "ビーバーは、処理されたプランクを使って悪水をろ過する巧妙な遠心分離器の改良を考案し、スラッジから抽出物とわずかな新鮮な水を得ました。"
frFR = "Les castors ont conçu une astuce astucieuse pour la centrifugeuse, utilisant des planches traitées pour filtrer les eaux usées, produisant de l'extrait et un filet d'eau fraîche à partir du sludge."
deDE = "Biber entwickelten einen cleveren Drehzellen-Feinschliff, indem sie behandeltes Holz verwendeten, um schlechtes Wasser zu filtern – was Extrakte und einen kleinen Wasserstrom aus dem Schlamm lieferte."
plPL = "Bobry opracowały sprytną modyfikację wirówki, wykorzystując strukowane deski do filtrowania zanieczyszczonej wody - uzyskując ekstrakt i strużkę świeżej wody z osadu."
ptBR = "Castores elaboraram uma engenhosa modificação em uma centrífuga, usando tábuas tratadas para filtrar água contaminada—gerando extrato e um fio de água limpa a partir do lodo."
koKR = "비버들은 처리된 판자를 사용하여 나쁜 물을 걸러내는 교묘한 원심 분리기 조정을 고안했습니다. 이는 슬러지에서 추출물을 얻고 신선한 물의 흐름을 만들어냅니다."
trTR = "kunduzlar, kötü suyu süzmek için işlenmiş tahtalar kullanarak akıllıca bir santrifüj ayarı geliştirdiler; bu da tortudan öz ve taze su damlaları elde ediyor."
esES = "Los castores idearon un ingenioso ajuste para la centrifugadora: usaban tablones tratados para filtrar el agua contaminada, obteniendo extracto y un pequeño chorro de agua dulce del lodo."
itIT = "Gli castori hanno ideato un abile ritocco alla centrifuga, usando assi trattate per filtrare l'acqua di scarto, ottenendo estratto e un rivolo di acqua dolce dal fango."
ukUA = "Бобри придумали хитре вдосконалення центрифуги: використовуючи оброблені дошки, вони проціджують отруйну воду, отримуючи екстракт і тонкий струмок прісної води з осаду."
thTH = "ช่างเผ่าบีเวอร์ได้คิดค้นการปรับปรุงเครื่องเหวี่ยงแบบฉลาด โดยใช้แผ่นไม้ที่ผ่านการปรับสภาพเพื่อกรองน้ำเสีย ได้สารสกัดออกมา พร้อมกับน้ำจืดปริมาณเล็กน้อยจากตะกอน"
csCZ = "Bobři vymysleli chytrou úpravu centrifugy, která využívá zpracované prkna k filtrování špatné vody – výsledkem je extrakt a pramínek čerstvé vody ze kalu."
viVN = "Hải ly đã nghĩ ra một chỉnh sửa máy ly tâm khéo léo, dùng những tấm ván được xử lý để lọc nước bẩn—tạo ra chiết xuất và một giọt nước ngọt từ bùn."
caES = "Els castors van ideat un ajust ingeniós per a la centrifugadora: usen taulons tractats per filtrar l'aigua contaminada, obtenint un extracte i un fil d'aigua dolça de la fangada."
beBY = "Бабры прыдумалі разумную мадыфікацыю цэнтрыфугі: яны выкарыстоўваюць апрацаваныя дошкі, каб працэджваць брудную ваду, атрымліваючы экстракт і невялікі струмень прэснай вады з асадку."
roRO = "Castorii au inventat o modificare ingenioasă a centrifugii, folosind scânduri tratate pentru a filtra apa tulbure—obținând extract și un mic șuvoi de apă proaspătă din nămol."
huHU = "A hódok okos centrifuga-módosítást találtak ki: kezelt deszkákkal szűrik a mérgező vizet, így kivonatot és az iszapból származó csekély mennyiségű friss vizet nyernek."
arSA = "ابتكر الغرانيق طريقة ذكية معدّلة للطرد المركزي، تستخدم ألواحاً خشبية معالجة لترشيح المياه السامة، فتنتج مستخلصاً وتيارًا رفيعًا من المياه العذبة من الحمأة."

