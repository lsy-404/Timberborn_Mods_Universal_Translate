["LV.ARSP.DilutedExtractLore"]
raw = "By blending pure water with badwater, beavers tease out more extract from the mire—a clever rinse born of necessity."
status = "normal"
enUS = "By blending pure water with bad water, beavers extract more from the mire—a clever rinse born of necessity."
zhCN = "海狸们巧妙地将净水与恶水混合，提高吸附效率，获得更多提取物。"
zhTW = "通過將純水與壞水混合，海狸從泥沼中提取出更多的精華——這是一種出於必要而生的巧妙沖洗。"
ruRU = "Смешивая чистую воду с грязной, бобры извлекают больше вещества из трясины — хитроумная промывка, рожденная из необходимости."
jaJP = "ピュアウォーターとバッドウォーターをブレンドすることで、ビーバーは泥からより多くのエキスを引き出します。これは必要に迫られた賢いすすぎ方です。"
frFR = "En mélangeant de l'eau pure avec de l'eau mauvaise, les castors extraient plus d'extraits des marais—un rinçage astucieux né de la nécessité."
deDE = "Durch die Mischung von reinem Wasser mit schlechtem Wasser extrahieren Biber mehr aus dem Morast – eine clevere Spülung, die aus der Notwendigkeit entstanden ist."
plPL = "Mieszańce czystej wody ze złą wodą, bobry wydobywają więcej ekstraktu z bagna—sprytne spłukanie zrodzone z konieczności."
ptBR = "Ao misturar água pura com água poluída, os castores extraem mais extrato do lodaçal - um enxágue inteligente nascido da necessidade."
koKR = "정수와 오수를 혼합하여 비버들은 수렁에서 더 많은 추출물을 끌어내며, 이는 필요에 의해 태어난 기발한 헹굼 방식이다."
trTR = "Saf suyu kötü suyla karıştırarak, kunduzlar bataklıktan daha fazla öz çıkarıyorlar—gereksizlikten doğan zeki bir durulama."
esES = "Al mezclar agua pura con agua envenenada, los castores extraen más extracto del pantano: un enjuague ingenioso nacido de la necesidad."
itIT = "Mescolando acqua pura con acqua cattiva, i castori estraggono più estratto dalla palude: un risciacquo intelligente nato dalla necessità."
ukUA = "Змішуючи чисту воду з поганою водою, бобри витягують із трясовини більше екстракту — кмітливе полоскання, народжене з потреби."
thTH = "บีเวอร์ผสมน้ำบริสุทธิ์กับน้ำเสีย เพื่อดึงสารสกัดออกมาจากโคลนได้มากขึ้น—การล้างอย่างชาญฉลาดที่เกิดจากความจำเป็น"
csCZ = "Smícháním čisté vody se špinavou vodou bobři získávají více extraktu z bažiny - chytré opláchnutí z nutnosti."
viVN = "Bằng cách pha nước tinh khiết với nước bẩn, hải ly rút thêm chiết xuất từ đầm lầy — một cách rửa khôn ngoan sinh ra từ sự cần thiết."
caES = "En barrejar aigua pura amb aigua tòxica, els castors extreuen més extracte del fang: un aclariment astut nascut de la necessitat."
beBY = "Змешваючы чystую ваду з брудной вадою, бабры вымываюць з балота больш экстракту — разумны спосаб прамыву, які нарадзіўся з патрэбы."
roRO = "Prin amestecarea apei pure cu apă coruptă, castorii extrag mai mult extract din mlaștină, o clătire ingenioasă născută din necesitate."
huHU = "A tiszta víz és a mérgezett víz keverésével a bobrok több kivonatot csalogatnak ki a lápból – okos öblítés, amelyet szükség szült."
arSA = "يقوم القنادس بخلط الماء النقي بالماء الفاسد لاستخلاص المزيد من المستخلص من المستنقع، وهي طريقة ذكية للشطف ولدت من الضرورة."

