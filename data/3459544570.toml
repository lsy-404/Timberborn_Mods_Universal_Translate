["LV.ARSP.PlankBulkProcessingLore"]
raw = "'Stack ‘em high, cut ‘em slow—more planks for the haul!' — Broadaxe Bulkchew"
status = "normal"
enUS = "\"Stack them high, cut them slow—more planks for the haul!\" — Broadaxe Bulkchew"
zhCN = "海狸们并排原木，慢速切削，有效提高了木板产量。"
zhTW = "「堆得高，高得慢——更多的木板用於運輸！」—博拉斧·大咀"
ruRU = "\"Накладывайте их высоко, режьте медленно — больше досок для груза!\" — Бродекс Булкчу"
jaJP = "「高く積んで、ゆっくり切る—運ぶためのより多くの板！」 — ブローダエクス・バルクチュー"
frFR = "« empilez-les haut, coupez-les lentement - plus de planches pour le chargement ! » — Broadaxe Bulkchew"
deDE = "\"Staple sie hoch, schneide sie langsam – mehr Planken für den Transport!\" — Broadaxe Bulkchew"
plPL = "'Układaj je wysoko, tnij powoli—więcej desek na zapas!' — Broadaxe Bulkchew"
ptBR = "'Empilhe-os alto, corte-os devagar—mais tábuas para a carga!' — Broadaxe Bulkchew"
koKR = "'높이 쌓고, 천천히 자르라 — 더 많은 판자를 가져오자!' — 브로드엑스 벌크츄"
trTR = "'Yüksek yükleyin, yavaş kesin — daha fazla tahtaya sahip olun!' — Broadaxe Bulkchew"
esES = "\"¡Apílalos alto, córtalos despacio—más tablones para el acarreo!\" — Broadaxe Bulkchew"
itIT = "'Impilatele in alto, tagliatele piano—più assi per il trasporto!' — Broadaxe Bulkchew"
ukUA = "'Складайте високо, пиляйте повільно — більше дощок за рейс!' — Broadaxe Bulkchew"
thTH = "'กองให้สูงๆ ตัดให้ช้าๆ—ไม้กระดานจะได้เพิ่มขึ้นสำหรับการขนส่ง!' — Broadaxe Bulkchew"
csCZ = "'Hromadit je vysoko, řezat pomalu—více prken na přepravu!' — Broadaxe Bulkchew"
viVN = "'Xếp cao lên, cắt chậm lại—thêm ván để mang về!' — Broadaxe Bulkchew"
caES = "'Apila-les alt, talla-les lentament: més taulons per al transport!' — Broadaxe Bulkchew"
beBY = "'Складайце іх вышэй, рэжце павольней — больш дошак для перавозкі!' — Broadaxe Bulkchew"
roRO = "\"Stivuiește-le sus, taie-le rar — mai multe scânduri pentru transport!\" — Broadaxe Bulkchew"
huHU = "„Rakd magasra, vágd lassan – több deszka a szállításra!\" — Broadaxe Bulkchew"
arSA = "«ارصف الألواح عالياً، واقطعها ببطء — المزيد من الألواح للنقل!» — بروادآكس بولكشيو"

