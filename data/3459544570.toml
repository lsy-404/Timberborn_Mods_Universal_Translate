["LV.ARSP.ExtractChargedExplosiveLore"]
raw = "'One drop of extract, and the blast doubles—gnaw on that, rockface!' — Flintpaw Boomforge"
status = "normal"
enUS = "\"One drop of extract, and the blast doubles—gnaw on that, rockface!\" — Flintpaw Boomforge"
zhCN = "将提取物重加工为炸药的技术，让海狸们实现了炸药自由。"
zhTW = "「一滴提取物，威力就加倍——咬著這個吧，岩石面！」——弗林特爪 龍鑄"
ruRU = "«Одна капля экстракта, и взрыв удваивается — грызи это, скала!» — Флинтпа́у Бумфо́рдж"
jaJP = "「一滴の抽出物で、爆発が二倍になる—それをかじりついてみろ、岩の壁！」— フリントパウ・ブームフォージ"
frFR = "'Une goutte d'extrait, et l'explosion double—grignote ça, falaise !' — Flintpaw Boomforge"
deDE = "„Ein Tropfen Extrakt, und die Explosion verdoppelt sich – nag dir daran, Felswand!“ — Flintpaw Boomforge"
plPL = "'Jedna kropla ekstraktu, a wybuch podwaja się—gryź to, skało!' — Flintpaw Boomforge"
ptBR = "'Uma gota de extrato, e a explosão dobra—mastigue isso, face de rocha!' — Flintpaw Boomforge"
koKR = "‘한 방울의 추출물이면 폭발력이 두 배로 늘어난다—그걸 잘라먹어라, 바위 얼굴!’ — 플린트포우 붐포지"
trTR = "'Bir damla ekstrakt, patlama iki katına çıkar—bununla çiğne, kaya yüzeyi!' — Flintpaw Boomforge"
esES = "\"Una gota de extracto, y la explosión se duplica: ¡mastica eso, roca!\" — Flintpaw Boomforge"
itIT = "\"Una goccia di estratto e l'esplosione raddoppia: mordi questa, roccia!\" — Flintpaw Boomforge"
ukUA = "«Одна крапля екстракту — і вибух подвоюється. Гризи це, скелелом!» — Флінтпо Бумфорж"
thTH = "\"หยดเดียวของสารสกัด แล้วการระเบิดก็เพิ่มเป็นสองเท่า—กัดสิ่งนั้นไว้ซะ หินผา!\" — Flintpaw Boomforge"
csCZ = "'Jedna kapka extraktu a výbuch se zdvojnásobí—pořádně si na tom zgňákej, skále!' — Flintpaw Boomforge"
viVN = "'Một giọt chiết xuất, và vụ nổ tăng gấp đôi—hãy nghiền ngẫm điều đó, rockface!' — Flintpaw Boomforge"
caES = "«Una gota d'extracte, i l'explosió es duplica: mastega això, roca!» — Flintpaw Boomforge"
beBY = "«Адна кропля экстракту, і выбух падвойваецца — ад'ешся, скала!» — Флінтпаў Бумфорж"
roRO = "„O picătură de extract, și explozia se dublează — rodeste-o pe asta, stâncă!\" — Flintpaw Boomforge"
huHU = "„Egy csepp kivonat, és a robbanás megduplázódik – rágd csak ezt, sziklaarc!” — Flintpaw Boomforge"
arSA = "«قطرة واحدة من المستخلص، وينفجر الانفجار ضعفين، فاقضم هذا أيها الصخر!» — فلينتباو بومفورج"

