["LV.ARSP.WoodReinforcedAlloyLore"]
raw = "'With every plank we add, the metal grows stronger—nature and iron as one!' — Leafclaw Metalweaver"
status = "normal"
enUS = "'With every plank we add, the metal grows stronger—nature and iron as one!' — Leafclaw Metalweaver"
zhCN = "神尾们将树脂木板作为金属块的内芯，使金属块强度大大提升。"
zhTW = "「隨著每一塊木板的添加，金屬變得更加堅固——自然與鐵結合為一！」—葉爪金屬編織者"
ruRU = "«С каждым добавленным бруском металл становится сильнее — природа и железо как единое целое!» — Лифклоу Металельщик"
jaJP = "「私たちが追加するすべての板とともに、金属はより強くなる—自然と鉄が一体となる！」 — リーフクロー・メタルウィーバー"
frFR = "« Avec chaque planche ajoutée, le métal devient plus fort—nature et fer comme un ! » — Leafclaw Metalweaver"
deDE = "„Mit jeder Planke, die wir hinzufügen, wird das Metall stärker – Natur und Eisen als Eins!“ — Leafclaw Metalweaver"
plPL = "'Z każdym dodanym deska, metal staje się silniejszy — natura i żelazo jako jedno!' — Leafclaw Metalweaver"
ptBR = "'Com cada tábua que adicionamos, o metal se torna mais forte—natureza e ferro como um só!' — Leafclaw Metalweaver"
koKR = "'우리가 추가하는 각 판자가 생겨날수록 금속은 더욱 강해진다—자연과 철이 하나로!' — 리프클로 메탈위버"
trTR = "'Her eklediğimiz tahtayla birlikte, metal güçleniyor - doğa ve demir bir arada!' — Leafclaw Metalweaver"
esES = "«Con cada tabla que añadimos, el metal se vuelve más fuerte: ¡naturaleza y hierro como uno solo!» — Leafclaw Metalweaver"
itIT = "'Con ogni asse che aggiungiamo, il metallo diventa più forte: natura e ferro sono una cosa sola!' — Leafclaw Metalweaver"
ukUA = "'З кожною дошкою, яку ми додаємо, метал стає міцнішим — природа і залізо як одне ціле!' — Листокогтя Металеткачка"
thTH = "\"ทุกแผ่นไม้ที่เราเพิ่มเข้าไป โลหะก็ยิ่งแข็งแกร่งขึ้น ธรรมชาติและเหล็กกลายเป็นหนึ่งเดียว!\" — Leafclaw Metalweaver"
csCZ = "'S každou deskou, kterou přidáme, se kov stává silnějším — příroda a železo jako jedno!' — Leafclaw Metalweaver"
viVN = "'Với mỗi tấm ván chúng ta thêm vào, kim loại ngày càng mạnh mẽ — thiên nhiên và sắt hòa làm một!' — Leafclaw Metalweaver"
caES = "«Amb cada post que afegim, el metall es fa més fort: natura i ferro, com u!» — Leafclaw Metalweaver"
beBY = "«З кожнай дошчачкай, што мы дадаем, метал становіцца мацнейшым — прырода і жалеза як адно цэлае!» — Leafclaw Metalweaver"
roRO = "„Cu fiecare scândură pe care o adăugăm, metalul devine mai puternic — natura și fierul, una!\" — Leafclaw Metalweaver"
huHU = "„Minden egyes deszkával, amit hozzáadunk, a fém erősebbé válik – a természet és a vas egy!\" — Leafclaw Metalweaver"
arSA = "\"مع كل لوح خشب نضيفه، يزداد المعدن قوةً — الطبيعة والحديد صارا واحداً!\" — ليفكلاو ميتالويفر"

