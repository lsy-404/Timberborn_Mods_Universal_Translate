["Building.Hospital.IronTeeth.Description"]
status = "normal"
raw = "A tower with 16 glass flasks and 3 doctors, driven by a shaft (80 power). Without power or doctors it heals like a medical bed (an injury in 7 days). With 3 doctors an injury heals in 5 days, with healing extract in 2. Doctors with extract cure badwater contamination using 1 extract per beaver."
enUS = "A tower with 16 glass flasks and 3 doctors, driven by a shaft (80 power). Without power or doctors it heals like a medical bed (an injury in 7 days). With 3 doctors an injury heals in 5 days, with healing extract in 2. Doctors with extract cure badwater contamination using 1 extract per beaver."
zhCN = "一座塔楼，配有16个玻璃烧瓶和3名医生，由轴提供动力（80动力）。在没有动力或医生的情况下，它的治疗效果与医疗床相同（伤势需7天痊愈）。有3名医生时，伤势5天即可痊愈；若使用治疗提取物，则只需2天。配备提取物的医生可以使用每名海狸1份提取物来治愈恶水污染。"
zhTW = "一座塔樓，配有 16 個玻璃燒瓶與 3 名醫生，由轉軸驅動（80 動力）。若沒有動力或醫生，它的治療方式如同醫療床（傷勢需 7 天痊癒）。有 3 名醫生時，傷勢 5 天痊癒；若使用治療萃取液，則只需 2 天。配有萃取液的醫生會消耗每位海狸 1 份萃取液，以治癒惡水污染。"
ruRU = "Башня с 16 стеклянными колбами и 3 врачами, приводимая в действие валом (80 мощности). Без энергии и врачей она лечит, как медицинская койка (травма заживает за 7 дней). С 3 врачами травма заживает за 5 дней, а с целебным экстрактом — за 2. Врачи с экстрактом излечивают заражение дурной водой, расходуя 1 экстракт на каждого бобра."
jaJP = "16本のガラスフラスコと3人の医師を備えたタワー。シャフト（80 power）で駆動される。電力も医師もない場合は、医療ベッドと同様に治療する（負傷は7日で回復）。医師が3人いると負傷は5日で回復し、治療エキスを使用すると2日で回復する。治療エキスを使う医師は、ビーever1人あたり1の治療エキスを使用して、バッドウォーターによる汚染を治療する。"
frFR = "Une tour avec 16 fioles en verre et 3 médecins, entraînée par un arbre (80 de puissance). Sans énergie ni médecins, elle soigne comme un lit médical (une blessure guérit en 7 jours). Avec 3 médecins, une blessure guérit en 5 jours, et avec de l'extrait de guérison, en 2. Les médecins utilisant de l'extrait soignent la contamination par l'eau infecte, à raison de 1 extrait par castor."
deDE = "Ein Turm mit 16 Glaskolben und 3 Ärzten, angetrieben durch eine Welle (80 Leistung). Ohne Strom oder Ärzte heilt er wie ein Krankenbett (eine Verletzung in 7 Tagen). Mit 3 Ärzten heilt eine Verletzung in 5 Tagen, mit Heilextrakt in 2. Ärzte mit Extrakt heilen Schlechtwasser-Verseuchung und verbrauchen dafür 1 Extrakt pro Biber."
plPL = "Wieża z 16 szklanymi kolbami i 3 lekarzami, napędzana wałem (80 mocy). Bez zasilania lub lekarzy leczy jak łóżko medyczne (obrażenia w ciągu 7 dni). Z 3 lekarzami obrażenia goją się w ciągu 5 dni, a z ekstraktem leczniczym w ciągu 2. Lekarze z ekstraktem leczą zanieczyszczenie złą wodą, zużywając 1 ekstrakt na bobra."
ptBR = "Uma torre com 16 frascos de vidro e 3 médicos, movida por um eixo (80 de potência). Sem energia ou médicos, ela cura como um leito médico (uma lesão em 7 dias). Com 3 médicos, uma lesão cura em 5 dias, com extrato curativo em 2. Médicos com extrato curam a contaminação por água ruim usando 1 extrato por castor."
koKR = "16개의 유리 플라스크와 의사 3명이 있는 탑으로, 축(80 동력)으로 구동됩니다. 동력이나 의사가 없으면 의료 침대처럼 치료합니다(부상은 7일 걸림). 의사 3명이 있으면 부상은 5일에 치료되고, 치유 추출물이 있으면 2일에 치료됩니다. 추출물을 사용하는 의사는 베이 한 명당 추출물 1개를 사용하여 독성 물(badwater) 오염을 치료합니다."
trTR = "Diş: 16 cam şişeli ve 3 doktorlu bir kule; bir şaftla çalıştırılır (80 güç). Güç veya doktor olmadan, bir tıbbi yatak gibi iyileştirir (yaralanma 7 günde iyileşir). 3 doktorla yaralanma 5 günde iyileşir, iyileştirici özle ise 2 günde. Özü olan doktorlar, kişi başına 1 öz kullanarak bozuk su kirlenmesini tedavi eder."
esES = "Una torre con 16 matraces de vidrio y 3 doctores, accionada por un eje (80 de potencia). Sin energía ni doctores, cura como una cama médica (una lesión en 7 días). Con 3 doctores, una lesión se cura en 5 días, o en 2 con extracto curativo. Los doctores con extracto curan la contaminación por agua mala usando 1 extracto por castor."
itIT = "Una torre con 16 ampolle di vetro e 3 dottori, azionata da un albero (80 di potenza). Senza energia o dottori cura le ferite come un letto medico (una ferita guarisce in 7 giorni). Con 3 dottori una ferita guarisce in 5 giorni, con l'estratto curativo in 2. I dottori con l'estratto curano la contaminazione da acqua tossica usando 1 estratto per castoro."
ukUA = "Вежа з 16 скляними колбами та 3 лікарями, що приводиться в дію валом (80 одиниць потужності). Без живлення чи лікарів вона лікує, як медичне ліжко (травма загоюється за 7 днів). З 3 лікарями травма загоюється за 5 днів, а з екстрактом для загоєння — за 2. Лікарі з екстрактом виліковують забруднення поганою водою, витрачаючи 1 екстракт на бобра."
thTH = "หอคอยที่มีขวดแก้ว 16 ใบและหมอ 3 คน ขับเคลื่อนด้วยเพลา (กำลัง 80 พลังงาน) หากไม่มีพลังงานหรือหมอ จะรักษาเหมือนเตียงพยาบาล (บาดเจ็บหายใน 7 วัน) เมื่อมีหมอ 3 คน อาการบาดเจ็บจะหายใน 5 วัน และหาก มีสารสกัดรักษา จะหายใน 2 วัน หมอที่ใช้สารสกัดสามารถรักษาการปนเปื้อนน้ำเสียได้ โดยใช้สารสกัด 1 หน่วยต่อบีเวอร์หนึ่งตัว"
csCZ = "Věž se 16 skleněnými baňkami a 3 doktory, poháněná hřídelí (80 výkonu). Bez energie nebo doktorů léčí jako lůžko na ošetřovně (zranění se zahojí za 7 dní). Se 3 doktory se zranění zahojí za 5 dní, s léčivým extraktem za 2. Doktoři s extraktem léčí kontaminaci špinavou vodou, přičemž na každého bobra spotřebují 1 extrakt."
viVN = "Một tháp có 16 bình thủy tinh và 3 bác sĩ, được dẫn động bởi một trục (80 công suất). Khi không có năng lượng hoặc bác sĩ, tháp chữa trị như một giường y tế (vết thương lành trong 7 ngày). Với 3 bác sĩ, vết thương lành trong 5 ngày, và trong 2 ngày nếu có tinh chất chữa bệnh. Bác sĩ dùng tinh chất chữa bệnh sẽ chữa nhiễm độc nước bẩn, mỗi hải ly tiêu tốn 1 tinh chất."
caES = "Una torre amb 16 ampolles de vidre i 3 metges, accionada per un eix (80 de potència). Sense energia ni metges, cura com un llit mèdic (una lesió en 7 dies). Amb 3 metges, una lesió es cura en 5 dies, i amb extracte curatiu, en 2. Els metges amb extracte curen la contaminació per aigua pútrida utilitzant 1 unitat d'extracte per castor."
beBY = "Вежа з 16 шкляных колбаў і 3 доктарамі, якая працуе ад вала (80 магутнасці). Без магутнасці ці доктараў яна лечыць, як медыцынскае ложка (траўма загойваецца за 7 дзён). З 3 доктарамі траўма загойваецца за 5 дзён, з лекавым экстрактам — за 2. Доктары з экстрактам лечаць забруджванне брудnoй вадой, выкарыстоўваючы 1 экстракт на бабра."
roRO = "Un turn cu 16 flacoane de sticlă și 3 medici, acționat de un ax (80 putere). Fără energie sau medici, vindecă precum un pat medical (o rană în 7 zile). Cu 3 medici, o rană se vindecă în 5 zile, iar cu extract de vindecare, în 2. Medicii cu extract tratează contaminarea cu apă toxică, consumând 1 extract per castor."
huHU = "A 16 üveglombikot és 3 orvost tartalmazó torony, amelyet tengely hajt (80 teljesítmény). Áram és orvosok nélkül úgy gyógyít, mint egy orvosi ágy (egy sérülés 7 nap alatt gyógyul). 3 orvossal a sérülés 5 nap alatt gyógyul, gyógyító kivonattal pedig 2 nap alatt. A kivonattal dolgozó orvosok a rossz víz szennyeződését gyógyítják, lakosonként 1 kivonatot használva."
arSA = "برج يضم 16 قارورة زجاجية و3 أطباء، ويُدار بواسطة عمود نقل (80 قوة). بدون طاقة أو أطباء، يعالج الإصابات كما يفعل سرير الرعاية الطبية (تُشفى الإصابة خلال 7 أيام). ومع وجود 3 أطباء، تُشفى الإصابة خلال 5 أيام، وخلال 2 عند استخدام مستخلص الشفاء. ويعالج الأطباء المستخدمون للمستخلص تلوث المياه الفاسدة باستهلاك وحدة واحدة من المستخلص لكل قندس."

