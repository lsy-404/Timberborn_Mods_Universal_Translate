["Building.Hospital.Description"]
status = "normal"
raw = "A two-storey hospital tent with 16 beds and 3 doctors. Without doctors it heals like a medical bed (an injury in 7 days). With 3 doctors an injury heals in 5 days, with medicine in 2. Doctors with antidote cure badwater contamination in 2 days, using half the antidote needed at home."
enUS = "A two-story hospital tent with 16 beds and 3 doctors. Without doctors, it heals like a medical bed (an injury in 7 days). With 3 doctors, an injury heals in 5 days, or in 2 days with medicine. Doctors with antidote cure badwater contamination in 2 days, using half the antidote needed at home."
zhCN = "一顶两层的医院帐篷，设有16张床位和3名医生。没有医生时，治疗效果与医疗床相同（7天治愈一处伤病）。配备3名医生后，伤病可在5天内治愈；使用药物则只需2天。医生使用解毒剂，可在2天内治愈恶水污染，所需解毒剂仅为在家治疗的一半。"
zhTW = "一座有兩層樓、配備 16 張病床和 3 名醫生的醫院帳篷。沒有醫生時，療傷效果與醫療床相同（7 天治癒一處傷勢）。有 3 名醫生時，5 天治癒一處傷勢；使用藥物則只需 2 天。醫生使用解毒劑，可在 2 天內治癒壞水污染，所需解毒劑量是居家治療的一半。"
ruRU = "Двухэтажный госпитальный шатёр на 16 коек с 3 врачами. Без врачей лечит так же, как медицинская койка (травма за 7 дней). С 3 врачами травма заживает за 5 дней, а с лекарством — за 2. Врачи с противоядием вылечивают заражение дурной водой за 2 дня, используя половину противоядия, необходимого дома."
jaJP = "16床と医師3人を収容できる2階建ての病院テント。医師がいない場合は医療ベッドと同じ治療効果（負傷が治るまで7日）。医師3人がいる場合、負傷は5日で治り、薬があれば2日で治る。解毒薬を持つ医師は、家で必要な量の半分の解毒薬を使い、バッドウォーター汚染を2日で治療する。"
frFR = "Une tente-hôpital à deux étages avec 16 lits et 3 médecins. Sans médecins, elle soigne comme un lit médical (une blessure guérit en 7 jours). Avec 3 médecins, une blessure guérit en 5 jours, ou en 2 jours avec des médicaments. Les médecins munis d’antidote soignent la contamination par les eaux polluées en 2 jours, en utilisant deux fois moins d’antidote qu’à domicile."
deDE = "Ein zweistöckiges Lazarettzelt mit 16 Betten und 3 Ärzten. Ohne Ärzte heilt es wie ein Krankenbett (eine Verletzung in 7 Tagen). Mit 3 Ärzten heilt eine Verletzung in 5 Tagen, mit Medizin in 2. Ärzte mit Gegengift heilen eine Badwasservergiftung in 2 Tagen und verbrauchen dabei die Hälfte des Gegengifts, das zu Hause benötigt wird."
plPL = "Dwupiętrowy namiot szpitalny z 16 łóżkami i 3 lekarzami. Bez lekarzy leczy tak jak łóżko medyczne (uraz goi się w 7 dni). Z 3 lekarzami uraz goi się w 5 dni, a z lekarstwem w 2. Lekarze z antidotum leczą skażenie złej wody w 2 dni, zużywając połowę antidotum potrzebnego w domu."
ptBR = "Uma tenda hospitalar de dois andares, com 16 leitos e 3 médicos. Sem médicos, ela cura como uma cama médica (uma lesão em 7 dias). Com 3 médicos, uma lesão sara em 5 dias ou em 2 dias com remédio. Médicos com antídoto curam a contaminação por água contaminada em 2 dias, usando metade do antídoto necessário em casa."
koKR = "침대 16개와 의사 3명이 있는 2층 병원 텐트입니다. 의사가 없으면 의료 침대처럼 부상을 치료합니다(부상 회복에 7일). 의사 3명이 있으면 부상 회복에 5일, 약을 사용하면 2일이 걸립니다. 해독제를 가진 의사는 가정에서 필요한 양의 절반만 사용해 배드워터 오염을 2일 만에 치료합니다."
csCZ = "Dvoupatrový nemocniční stan se 16 lůžky a 3 lékaři. Bez lékařů léčí jako zdravotní lůžko (zranění se zahojí za 7 dní). Se 3 lékaři se zranění zahojí za 5 dní, s léky za 2 dny. Lékaři s protijedem vyléčí kontaminaci špatnou vodou za 2 dny a spotřebují přitom polovinu protijedu potřebného doma."
viVN = "Lều bệnh viện hai tầng với 16 giường và 3 bác sĩ. Không có bác sĩ, lều chữa trị như giường y tế (chữa lành vết thương trong 7 ngày). Có 3 bác sĩ, vết thương lành trong 5 ngày, hoặc 2 ngày nếu có thuốc. Bác sĩ dùng thuốc giải độc để chữa nhiễm độc nước xấu trong 2 ngày, chỉ tốn một nửa lượng thuốc giải độc cần dùng tại nhà."
trTR = "16 yataklı ve 3 doktorlu, iki katlı bir hastane çadırı. Doktor yokken, tıbbi yatak gibi iyileştirir (bir yaralanma 7 günde iyileşir). 3 doktorla bir yaralanma 5 günde, ilaçla 2 günde iyileşir. Antidot kullanan doktorlar, evde gerekenden yarısı kadar antidot kullanarak kötü su bulaşmasını 2 günde tedavi eder."

