["Eurymachus.TwitchBorn.Settings.IgnoreUnhandledCommandsTooltip"]
status = "normal"
raw = "Hide chat messages starting with ! unless they match\na TwitchBorn command. Other bot commands will not\nappear as beaver speech."
enUS = "Hide chat messages starting with ! unless they match\na TwitchBorn command. Other bot commands will not\nappear as beaver speech."
zhCN = "隐藏以 ! 开头的聊天消息，除非它们符合\nTwitchBorn 命令。其他机器人命令不会\n显示为海狸发言。"
zhTW = "隱藏以 ! 開頭的聊天訊息，除非它們符合\nTwitchBorn 指令。其他機器人指令不會\n以海狸發言的形式顯示。"
ruRU = "Скрывать сообщения чата, начинающиеся с !, если только они не соответствуют\nкоманде TwitchBorn. Другие команды ботов не будут\nотображаться как речь бобров."
jaJP = "!で始まるチャットメッセージは、TwitchBornのコマンドに一致する場合を除き非表示にします。\nその他のボットコマンドは、ビーバーの発言として\n表示されません。"
frFR = "Masquer les messages de chat commençant par ! sauf s'ils correspondent\nà une commande TwitchBorn. Les autres commandes de bot n'apparaîtront pas\nsous forme de paroles de castor."
deDE = "Chatnachrichten ausblenden, die mit ! beginnen, sofern sie nicht\neinem TwitchBorn-Befehl entsprechen. Andere Bot-Befehle werden nicht\nals Bibersprache angezeigt."
plPL = "Ukrywaj wiadomości czatu zaczynające się od !, chyba że pasują do polecenia\nTwitchBorn. Pozostałe polecenia botów nie będą\nwyświetlane jako wypowiedzi bobrów."
ptBR = "Oculte mensagens do chat que começam com !, a menos que correspondam\na um comando do TwitchBorn. Outros comandos de bots não\naparecerão como fala dos castores."
koKR = "!로 시작하는 채팅 메시지는\nTwitchBorn 명령어와 일치하지 않는 한 숨깁니다. 다른 봇 명령어는\n비버의 말로 표시되지 않습니다."
trTR = "! ile başlayan sohbet mesajlarını, bir TwitchBorn komutuyla\neşleşmedikleri sürece gizle. Diğer bot komutları kunduz\nkonuşması olarak görünmez."
esES = "Oculta los mensajes del chat que empiecen por !, salvo que coincidan con\nun comando de TwitchBorn. Los demás comandos de bots no\naparecerán como diálogo de los castores."
itIT = "Nascondi i messaggi della chat che iniziano con !, a meno che non corrispondano\na un comando di TwitchBorn. Gli altri comandi dei bot non\nappariranno come messaggi dei castori."
ukUA = "Приховувати повідомлення чату, що починаються з !, якщо вони не відповідають\nкоманді TwitchBorn. Інші команди ботів не\nвідображатимуться як репліки бобрів."
thTH = "ซ่อนข้อความแชตที่ขึ้นต้นด้วย ! เว้นแต่จะตรงกับ\nคำสั่งของ TwitchBorn คำสั่งบอตอื่น ๆ จะไม่\nปรากฏเป็นคำพูดของบีเวอร์"
csCZ = "Skrýt zprávy chatu začínající znakem !, pokud neodpovídají\npříkazu TwitchBorn. Ostatní příkazy botů se nezobrazí\njako bobří řeč."
viVN = "Ẩn tin nhắn trò chuyện bắt đầu bằng ! trừ khi chúng khớp với\nmột lệnh TwitchBorn. Các lệnh bot khác sẽ không\nxuất hiện dưới dạng lời thoại của hải ly."
caES = "Amaga els missatges del xat que comencin amb ! tret que coincideixin amb\nuna ordre de TwitchBorn. Les altres ordres dels bots no\napareixeran com a parla dels castors."
beBY = "Хаваць паведамленні чата, якія пачынаюцца з !, за выключэннем\nтых, што адпавядаюць камандзе TwitchBorn. Іншыя каманды бота не\nбудуць паказвацца як рэплікі баброў."
roRO = "Ascunde mesajele din chat care încep cu !, cu excepția cazului în care corespund\nunei comenzi TwitchBorn. Alte comenzi ale roboților nu vor\napărea ca replici ale castorilor."
huHU = "Rejtsd el a ! jellel kezdődő csevegőüzeneteket, hacsak nem egyeznek\nmeg egy TwitchBorn-paranccsal. Más botparancsok nem\njelennek meg hód beszédeként."
arSA = "أخفِ رسائل الدردشة التي تبدأ بـ ! ما لم تطابق\nأمرًا من TwitchBorn. لن تظهر أوامر الروبوتات الأخرى\nعلى هيئة كلام للقنادس."

