["Eurymachus.TwitchBorn.Settings.BotConnectionTooltip"]
status = "normal"
raw = "Replies to viewers in the Twitch channel above.\nUse your broadcaster account or a separate bot account.\nSaved connection tokens are encrypted on this device."
enUS = "Replies to viewers in the Twitch channel above.\nUse your broadcaster account or a separate bot account.\nSaved connection tokens are encrypted on this device."
zhCN = "在上方的 Twitch 频道中回复观众。\n使用你的主播账号或单独的机器人账号。\n保存的连接令牌已在此设备上加密。"
zhTW = "在上方的 Twitch 頻道中回覆觀眾。\n使用你的實況主帳號或獨立的機器人帳號。\n已儲存的連線權杖會在此裝置上加密。"
ruRU = "Отвечает зрителям в указанном выше канале Twitch.\nИспользуйте аккаунт стримера или отдельный аккаунт бота.\nСохранённые токены подключения зашифрованы на этом устройстве."
jaJP = "上記のTwitchチャンネルで視聴者に返信します。\n配信者アカウントまたは別のボットアカウントを使用してください。\n保存された接続トークンは、このデバイス上で暗号化されます。"
frFR = "Répond aux spectateurs dans le canal Twitch ci-dessus.\nUtilisez votre compte de diffuseur ou un compte de bot distinct.\nLes jetons de connexion enregistrés sont chiffrés sur cet appareil."
deDE = "Antwortet Zuschauern im oben genannten Twitch-Kanal.\nVerwende dein Broadcaster-Konto oder ein separates Bot-Konto.\nGespeicherte Verbindungstoken werden auf diesem Gerät verschlüsselt."
plPL = "Odpowiada widzom na kanale Twitcha powyżej.\nUżyj konta nadawcy lub osobnego konta bota.\nZapisane tokeny połączenia są szyfrowane na tym urządzeniu."
ptBR = "Responde aos espectadores no canal da Twitch acima.\nUse sua conta de streamer ou uma conta de bot separada.\nOs tokens de conexão salvos são criptografados neste dispositivo."
koKR = "위에 입력한 Twitch 채널의 시청자에게 답글을 보냅니다.\n방송인 계정 또는 별도의 봇 계정을 사용하세요.\n저장된 연결 토큰은 이 기기에서 암호화됩니다."
trTR = "Yukarıdaki Twitch kanalındaki izleyicilere yanıt verir.\nYayıncı hesabınızı veya ayrı bir bot hesabını kullanın.\nKaydedilen bağlantı belirteçleri bu cihazda şifrelenir."
esES = "Responde a los espectadores en el canal de Twitch indicado arriba.\nUsa tu cuenta de streamer o una cuenta de bot independiente.\nLos tokens de conexión guardados están cifrados en este dispositivo."
itIT = "Risponde agli spettatori nel canale Twitch qui sopra.\nUsa il tuo account da streamer o un account bot separato.\nI token di connessione salvati sono crittografati su questo dispositivo."
ukUA = "Відповідає глядачам у каналі Twitch, зазначеному вище.\nВикористовуйте обліковий запис стримера або окремий обліковий запис бота.\nЗбережені токени підключення зашифровані на цьому пристрої."
thTH = "ตอบกลับผู้ชมในช่อง Twitch ด้านบน\nใช้บัญชีผู้ถ่ายทอดสดหรือบัญชีบอตแยกต่างหาก\nโทเค็นการเชื่อมต่อที่บันทึกไว้จะถูกเข้ารหัสบนอุปกรณ์นี้"
csCZ = "Odpovídá divákům ve výše uvedeném kanálu na Twitchi.\nPoužijte svůj účet vysílatele nebo samostatný účet bota.\nUložené přístupové tokeny jsou v tomto zařízení zašifrované."
viVN = "Trả lời người xem trong kênh Twitch ở trên.\nSử dụng tài khoản phát sóng của bạn hoặc một tài khoản bot riêng.\nCác mã thông báo kết nối đã lưu được mã hóa trên thiết bị này."
caES = "Respon als espectadors del canal de Twitch indicat més amunt.\nUtilitza el teu compte de streamer o un compte de bot independent.\nEls tokens de connexió desats estan xifrats en aquest dispositiu."
beBY = "Адказвае гледачам у канале Twitch, указаным вышэй.\nВыкарыстоўвайце ўліковы запіс транслятара або асобны ўліковы запіс бота.\nЗахаваныя токены падключэння зашыфраваныя на гэтай прыладзе."
roRO = "Răspunde spectatorilor pe canalul Twitch de mai sus.\nFolosește contul tău de streamer sau un cont de bot separat.\nTokenurile de conectare salvate sunt criptate pe acest dispozitiv."
huHU = "Válaszol a fenti Twitch-csatorna nézőinek.\nHasználd a közvetítői fiókodat vagy egy külön botfiókot.\nA mentett kapcsolati tokenek titkosítva vannak ezen az eszközön."
arSA = "يردّ على المشاهدين في قناة Twitch المذكورة أعلاه.\nاستخدم حساب البث الخاص بك أو حسابًا منفصلًا للبوت.\nتُشفَّر رموز الاتصال المحفوظة على هذا الجهاز."

