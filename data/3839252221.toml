huHU = "A névárnyékhoz tartozó parancs vagy Channel Point-jutalom címe.\nAlapértelmezett parancshasználat: !shadow #00000080\n#RRGGBB vagy #RRGGBBAA formátumot fogad el. Eltávolításához: !shadow off"
