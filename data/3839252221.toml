zhCN = "让观众通过下方 Twitch 频道中的聊天\n与您的殖民地互动。"
zhTW = "讓觀眾透過下方的 Twitch 頻道聊天室\n與你的殖民地互動。"
ruRU = "Позвольте зрителям взаимодействовать с вашей колонией через чат\nна канале Twitch, указанном ниже."
jaJP = "視聴者が下記のTwitchチャンネルのチャットを通じて\nあなたのコロニーと交流できるようにします。"
frFR = "Permettez aux spectateurs d'interagir avec votre colonie via le chat\nde la chaîne Twitch ci-dessous."
deDE = "Ermögliche Zuschauern, über den Chat\nim unten stehenden Twitch-Kanal mit deiner Kolonie zu interagieren."
plPL = "Pozwól widzom wchodzić w interakcje z twoją kolonią za pośrednictwem czatu\nna poniższym kanale Twitcha."
ptBR = "Permita que os espectadores interajam com sua colônia pelo chat\nno canal da Twitch abaixo."
koKR = "아래 Twitch 채널의 시청자가 채팅을 통해\n식민지와 상호작용할 수 있도록 합니다."
trTR = "İzleyicilerin aşağıdaki Twitch kanalındaki sohbet aracılığıyla\nkoloninizle etkileşim kurmasını sağlayın."
esES = "Permite que los espectadores interactúen con tu colonia mediante el chat\ndel canal de Twitch que aparece abajo."
itIT = "Consenti agli spettatori di interagire con la tua colonia tramite la chat\nnel canale Twitch qui sotto."
ukUA = "Дозвольте глядачам взаємодіяти з вашою колонією через чат\nна каналі Twitch нижче."
thTH = "ให้ผู้ชมโต้ตอบกับอาณานิคมของคุณผ่านแชต\nในช่อง Twitch ด้านล่าง"
csCZ = "Umožněte divákům komunikovat s vaší kolonií prostřednictvím chatu\nna níže uvedeném kanálu Twitch."
viVN = "Cho phép người xem tương tác với thuộc địa của bạn thông qua trò chuyện\ntrên kênh Twitch bên dưới."
caES = "Permet que els espectadors interactuïn amb la teva colònia mitjançant el xat\ndel canal de Twitch següent."
beBY = "Дазвольце гледачам узаемадзейнічаць з вашай калоніяй праз чат\nна канале Twitch ніжэй."
roRO = "Permite spectatorilor să interacționeze cu colonia ta prin chatul\ncanalului Twitch de mai jos."
huHU = "Tedd lehetővé, hogy a nézők a lent megadott Twitch-csatorna chatjén keresztül\nkapcsolatba lépjenek a kolóniáddal."
arSA = "اسمح للمشاهدين بالتفاعل مع مستعمرتك عبر الدردشة\nفي قناة Twitch أدناه."

