["ice_cracked.DemolitionPlus.Description"]
status = "normal"
raw = "Removes trees, bushes, crops, dead plants and thorns at once, without waiting for a beaver. Click one, or drag over an area. Nothing is harvested."
enUS = "Removes trees, bushes, crops, dead plants and thorns at once, without waiting for a beaver. Click one, or drag over an area. Nothing is harvested."
zhCN = "移除树木、灌木、作物、枯死植物和荆棘，无需等待海狸。点击单个目标，或拖动框选一片区域。不会收获任何物品。"
zhTW = "移除樹木、灌木、作物、枯死植物與荊棘，無需等待海狸即可立即完成。點擊單一目標，或拖曳框選一個區域。不會採收任何東西。"
ruRU = "Удаляет деревья, кусты, посевы, мёртвые растения и колючки сразу, не дожидаясь бобра. Щёлкните по одному объекту или протяните курсор по области. Ресурсы при этом не собираются."
jaJP = "木、低木、作物、枯れた植物、トゲをまとめて、ビーバーを待たずに即座に撤去します。1つクリックするか、範囲をドラッグしてください。収穫は行われません。"
frFR = "Supprime les arbres, buissons, cultures, plantes mortes et épines d'un seul coup, sans attendre un castor. Cliquez sur un élément ou faites glisser le curseur sur une zone. Rien n'est récolté."
deDE = "Entfernt Bäume, Büsche, Feldfrüchte, abgestorbene Pflanzen und Dornen auf einmal, ohne auf einen Biber zu warten. Klicke auf eine Stelle oder ziehe über ein Gebiet. Es wird nichts geerntet."
plPL = "Usuwa drzewa, krzewy, uprawy, martwe rośliny i ciernie od razu, bez czekania na bobra. Kliknij jedno z nich lub przeciągnij po obszarze. Nic nie zostaje zebrane."
ptBR = "Remove árvores, arbustos, plantações, plantas mortas e espinhos de uma só vez, sem esperar por um castor. Clique em um item ou arraste sobre uma área. Nada é colhido."
koKR = "나무, 덤불, 작물, 죽은 식물, 가시덤불을 베달 일꾼을 기다리지 않고 한 번에 제거합니다. 하나를 클릭하거나 영역 위를 드래그하세요. 수확되는 것은 없습니다."
trTR = "Ağaçları, çalıları, ekinleri, ölü bitkileri ve dikenleri bir kerede, bir kunduzun beklemesine gerek kalmadan kaldırır. Birine tıklayın veya bir alanın üzerinden sürükleyin. Hiçbir şey hasat edilmez."
esES = "Elimina árboles, arbustos, cultivos, plantas muertas y espinas de una sola vez, sin esperar a que un castor lo haga. Haz clic en uno o arrastra sobre una zona. No se cosecha nada."
itIT = "Rimuove alberi, cespugli, colture, piante morte e spine in una sola volta, senza aspettare un castoro. Clicca su uno di essi oppure trascina il cursore su un'area. Nulla viene raccolto."
ukUA = "Видаляє дерева, кущі, врожай, мертві рослини та терни одразу, не чекаючи бобра. Клацніть на одному або проведіть мишею по ділянці. Нічого не збирається."
thTH = "ลบต้นไม้ พุ่มไม้ พืชผล พืชที่ตายแล้ว และหนาม ได้ทันทีโดยไม่ต้องรอให้บีเวอร์มาทำ คลิกทีละจุด หรือลากทับพื้นที่ที่ต้องการ ไม่มีอะไรถูกเก็บเกี่ยว"
csCZ = "Odstraní stromy, keře, plodiny, mrtvé rostliny i trny najednou, aniž by na to musel čekat bobr. Klikněte na jeden nebo přetáhněte přes oblast. Nic se nesklízí."
viVN = "Xóa cây, bụi cây, cây trồng, cây chết và gai ngay lập tức, không cần chờ hải ly. Nhấp vào một đối tượng hoặc kéo qua một khu vực. Không thu hoạch được gì."
caES = "Elimina arbres, arbustos, cultius, plantes mortes i espines alhora, sense esperar que un castor ho faci. Fes clic sobre un element o arrossega sobre una zona. No es recull res."
beBY = "Выдаляе дрэвы, кусты, пасевы, мёртвыя расліны і галіны адразу, без чакання бабра. Націсніце на адзін аб'ект або перацягніце па ўчастку. Нічога не збіраецца."
roRO = "Elimină imediat copacii, tufișurile, culturile, plantele moarte și spinii, fără să aștepte un castor. Dați clic pe unul sau trageți peste o zonă. Nimic nu este recoltat."
huHU = "Eltávolítja a fákat, bokrokat, terményeket, elpusztult növényeket és tüskéket azonnal, anélkül hogy be kellene várni egy hódot. Kattintson egyre, vagy húzza az egeret egy terület fölött. Semmit sem takarít be."
arSA = "يزيل الأشجار والشجيرات والمحاصيل والنباتات الميتة والأشواك دفعة واحدة، دون انتظار أي قندس. انقر على عنصر واحد، أو اسحب فوق منطقة. لا يتم حصاد أي شيء."
