["ForestMushrooms.Settings.RegrowthMax.Help"]
status = "normal"
raw = "Upper bound for a new random regrowth wait. Default 20. Range 0-10000. Lowering this below the minimum also lowers the minimum. Equal bounds give a fixed delay."
enUS = "Upper bound for a new random regrowth wait. Default: 20. Range: 0–10000. Lowering this below the minimum also lowers the minimum. Equal bounds give a fixed delay."
zhCN = "新随机再生等待时间的上限。默认值为 20。范围：0-10000。将此值调低至低于下限时，下限也会随之降低。上下限相等时，等待时间固定。"
zhTW = "新隨機再生等待時間的上限。預設值為 20。範圍為 0-10000。將此值調低至低於下限時，下限也會隨之降低。上下限相同時，延遲時間固定。"
ruRU = "Верхняя граница случайного ожидания перед новым отрастанием. По умолчанию — 20. Диапазон: 0–10000. Если уменьшить это значение ниже минимума, минимум также снизится. Если обе границы равны, задержка будет фиксированной."
jaJP = "新たなランダムな再成長待ち時間の上限。デフォルトは20。範囲は0～10000。これを最小値未満に下げると、最小値も下がります。上下限が等しい場合、待ち時間は固定されます。"
frFR = "Limite supérieure du délai aléatoire avant une nouvelle repousse. Valeur par défaut : 20. Plage : 0-10000. Si cette valeur est inférieure au minimum, elle abaisse également le minimum. Des limites égales donnent un délai fixe."
deDE = "Obergrenze für die Wartezeit bis zum zufälligen Nachwachsen. Standardwert: 20. Bereich: 0–10000. Wird dieser Wert unter das Minimum gesenkt, sinkt auch das Minimum. Bei gleichen Grenzwerten ist die Verzögerung festgelegt."
