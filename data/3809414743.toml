["ForestMushrooms.Settings.RegrowthMin.Help"]
status = "normal"
raw = "Lower bound for a new random regrowth wait. Default 12. Range 0-10000. Raising this above the maximum also raises the maximum."
enUS = "Lower bound for a new random regrowth wait. Default 12. Range 0–10000. Raising this above the maximum also raises the maximum."
zhCN = "新随机再生等待时间的下限。默认值为 12。范围：0-10000。将此值调高至超过上限时，上限也会随之提高。"
zhTW = "新隨機再生等待時間的下限。預設值為 12。範圍：0-10000。將此值調高至超過上限時，也會調高上限。"
ruRU = "Нижняя граница случайного ожидания нового отрастания. По умолчанию: 12. Диапазон: 0–10000. Если увеличить это значение выше максимума, максимум тоже повысится."
jaJP = "新しいランダムな再成長待機時間の下限。デフォルトは12。範囲は0～10000。この値を最大値より大きくすると、最大値も引き上げられます。"
frFR = "Limite inférieure du délai aléatoire avant une nouvelle repousse. Valeur par défaut : 12. Plage : 0-10000. Si cette valeur dépasse le maximum, celui-ci augmente également."
deDE = "Untergrenze für eine neue zufällige Wartezeit bis zum Nachwachsen. Standardwert: 12. Bereich: 0–10000. Wird dieser Wert über die Obergrenze angehoben, steigt auch die Obergrenze."
plPL = "Dolna granica losowego czasu oczekiwania na odrost. Domyślnie 12. Zakres: 0–10000. Podniesienie tej wartości powyżej maksimum podnosi również maksimum."
ptBR = "Limite mínimo para um novo tempo de espera aleatório para o rebrote. Padrão: 12. Intervalo: 0–10000. Aumentar esse valor acima do máximo também aumenta o máximo."
koKR = "새로운 무작위 재생 대기 시간의 하한입니다. 기본값은 12입니다. 범위는 0-10000입니다. 이 값을 최댓값보다 높이면 최댓값도 함께 높아집니다."
csCZ = "Dolní mez nové náhodné čekací doby na opětovný růst. Výchozí hodnota: 12. Rozsah 0–10000. Zvýšením této hodnoty nad maximum se zvýší i maximum."
viVN = "Giới hạn dưới của thời gian chờ tái sinh ngẫu nhiên mới. Mặc định là 12. Phạm vi 0-10000. Tăng giá trị này vượt quá mức tối đa cũng sẽ tăng mức tối đa."
trTR = "Yeni bir rastgele yeniden büyüme bekleme süresinin alt sınırı. Varsayılan: 12. Aralık: 0-10000. Bu değerin maksimumun üzerine çıkarılması maksimumu da yükseltir."

