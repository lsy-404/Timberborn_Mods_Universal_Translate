[_meta]
name = "Forest Mushrooms"

["ForestMushrooms.Settings.Help"]
status = "normal"
raw = "Times use simulation days unless marked hours. Age and moisture thresholds apply immediately. Already sampled countdowns stay unchanged; new waits use the new settings. Picking time applies when the next picking job starts. Settings apply across settlements."
enUS = "Times use simulation days unless marked hours. Age and moisture thresholds apply immediately. Already sampled countdowns stay unchanged; new waits use the new settings. Picking time applies when the next picking job starts. Settings apply across settlements."
zhCN = "时间单位为模拟日，除非标明小时。年龄和湿度阈值立即生效。已开始计时的倒计时保持不变；新的等待将使用新设置。采摘时间设置将在下一项采摘任务开始时生效。设置适用于所有定居点。"
zhTW = "時間以模擬日計算，除非標示為小時。年齡與濕度門檻會立即生效。已開始計時的倒數不變；新的等待時間則使用新設定。採摘時間會在下一項採摘工作開始時生效。設定適用於所有殖民地。"
ruRU = "Время указывается в днях симуляции, если не отмечены часы. Пороговые значения возраста и влажности применяются немедленно. Уже начатые отсчёты остаются без изменений; для новых ожиданий используются новые настройки. Время сбора применяется, когда начинается следующая задача по сбору. Настройки действуют во всех поселениях."
jaJP = "時間は、時間と明記されている場合を除き、シミュレーション日で表されます。年齢と湿度のしきい値は即時に適用されます。すでに開始済みのカウントダウンは変更されず、新たな待ち時間には新しい設定が適用されます。採集時間の設定は、次の採集作業が始まるときに適用されます。設定はすべての居住地に適用されます。"
frFR = "Les durées sont exprimées en jours de simulation, sauf indication contraire en heures. Les seuils d’âge et d’humidité s’appliquent immédiatement. Les comptes à rebours déjà démarrés restent inchangés ; les nouveaux temps d’attente utilisent les nouveaux paramètres. La durée de cueillette s’applique au démarrage de la prochaine tâche de cueillette. Les paramètres s’appliquent à toutes les colonies."
deDE = "Zeitangaben beziehen sich auf Simulationstage, sofern sie nicht als Stunden gekennzeichnet sind. Alters- und Feuchtigkeitsschwellen gelten sofort. Bereits erfasste Countdown-Werte bleiben unverändert; für neue Wartezeiten gelten die neuen Einstellungen. Die Pflückzeit gilt ab Beginn des nächsten Pflückauftrags. Die Einstellungen gelten für alle Siedlungen."
plPL = "Czas podano w dniach symulacji, chyba że oznaczono godziny. Progi wieku i wilgotności zaczynają obowiązywać natychmiast. Odliczanie już rozpoczętych okresów pozostaje bez zmian; nowe okresy oczekiwania korzystają z nowych ustawień. Czas zbierania zaczyna obowiązywać od rozpoczęcia następnego zadania zbierania. Ustawienia obowiązują we wszystkich osadach."
ptBR = "Os tempos usam dias de simulação, a menos que estejam marcados como horas. Os limites de idade e umidade são aplicados imediatamente. Contagens regressivas já iniciadas permanecem inalteradas; novas esperas usam as novas configurações. O tempo de coleta se aplica quando o próximo trabalho de coleta começa. As configurações se aplicam a todos os assentamentos."
koKR = "시간은 시간 단위로 표시된 경우를 제외하면 시뮬레이션 일수입니다. 나이와 수분 임계값은 즉시 적용됩니다. 이미 측정된 카운트다운은 그대로 유지되며, 새 대기 시간부터 새 설정이 적용됩니다. 채집 시간 설정은 다음 채집 작업이 시작될 때 적용됩니다. 설정은 모든 정착지에 적용됩니다."
csCZ = "Časy se uvádějí ve dnech simulace, pokud nejsou označené jako hodiny. Prahové hodnoty věku a vlhkosti se uplatní okamžitě. Již započaté odpočty zůstanou beze změny; nové čekací doby se řídí novým nastavením. Doba sběru se uplatní při zahájení dalšího sběru. Nastavení platí pro všechny osady."
viVN = "Thời gian được tính theo ngày mô phỏng, trừ khi ghi rõ là giờ. Các ngưỡng tuổi và độ ẩm có hiệu lực ngay lập tức. Các bộ đếm ngược đã được lấy mẫu sẽ giữ nguyên; thời gian chờ mới sẽ dùng các cài đặt mới. Thời gian hái có hiệu lực khi công việc hái tiếp theo bắt đầu. Cài đặt áp dụng cho tất cả các khu định cư."
trTR = "Saatler, saat olarak belirtilmedikçe simülasyon günlerini ifade eder. Yaş ve nem eşikleri hemen uygulanır. Halihazırda örneklenmiş geri sayımlar değişmeden kalır; yeni bekleme sürelerinde yeni ayarlar kullanılır. Toplama süresi, bir sonraki toplama işi başladığında uygulanır. Ayarlar tüm yerleşim yerlerinde geçerlidir."

