["ForestMushrooms.Settings.WetDays.Help"]
status = "normal"
raw = "Uninterrupted irrigation required for growth. Default 8. Range 0-10000. Dry soil removes mushrooms on living trees."
enUS = "Uninterrupted irrigation required for growth. Default: 8. Range: 0–10000. Dry soil removes mushrooms from living trees."
zhCN = "生长需要不间断灌溉。默认值：8。范围：0-10000。土壤干燥会使活树上的蘑菇消失。"
zhTW = "生長需要持續灌溉。預設值為 8。範圍 0-10000。土壤乾燥會使活樹上的蘑菇消失。"
ruRU = "Для роста требуется непрерывное орошение. По умолчанию: 8. Диапазон: 0–10000. Сухая почва удаляет грибы с живых деревьев."
jaJP = "成長には途切れない灌漑が必要です。既定値は8。範囲は0～10000。土壌が乾燥すると、生きている木のキノコが取り除かれます。"
frFR = "Une irrigation ininterrompue est nécessaire à la croissance. Valeur par défaut : 8. Plage : 0-10000. Un sol sec fait disparaître les champignons des arbres vivants."
deDE = "Für das Wachstum ist ununterbrochene Bewässerung erforderlich. Standardwert: 8. Bereich: 0–10000. Trockener Boden entfernt Pilze von lebenden Bäumen."
plPL = "Do wzrostu wymagane jest nieprzerwane nawadnianie. Domyślnie: 8. Zakres: 0–10000. Sucha gleba usuwa grzyby z żywych drzew."
ptBR = "É necessária irrigação ininterrupta para o crescimento. Padrão: 8. Intervalo: 0-10000. O solo seco remove os cogumelos das árvores vivas."
koKR = "성장하려면 관개가 중단되지 않아야 합니다. 기본값 8. 범위 0-10000. 토양이 마르면 살아 있는 나무의 버섯이 사라집니다."
csCZ = "Pro růst je nutné nepřetržité zavlažování. Výchozí hodnota: 8. Rozsah: 0–10000. Suchá půda odstraňuje houby z živých stromů."
viVN = "Cần tưới liên tục để cây phát triển. Mặc định là 8. Phạm vi 0-10000. Đất khô sẽ làm nấm trên cây sống biến mất."
trTR = "Büyüme için kesintisiz sulama gerekir. Varsayılan: 8. Aralık: 0-10000. Kuru toprak, yaşayan ağaçlardaki mantarları yok eder."

