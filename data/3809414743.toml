["ForestMushrooms.Settings.InitialMean.Help"]
status = "normal"
raw = "Mean exponential wait after eligibility. Default 16. Zero removes this random wait. Range 0-10000. Existing countdowns are preserved."
enUS = "Mean exponential wait after eligibility. Default: 16. Zero removes this random wait. Range: 0–10000. Existing countdowns are preserved."
zhCN = "符合条件后的平均指数等待时间。默认值为 16。设为 0 可取消此随机等待。范围：0-10000。现有倒计时会保留。"
zhTW = "符合條件後的平均指數等待時間。預設值為 16。設為 0 可移除此隨機等待時間。範圍為 0-10000。現有倒數計時會保留。"
ruRU = "Среднее время ожидания по экспоненциальному распределению после наступления условий. По умолчанию — 16. Ноль отключает это случайное ожидание. Диапазон: 0–10000. Текущие отсчёты сохраняются."
jaJP = "対象条件を満たした後の指数分布による平均待ち時間。既定値は16。0にすると、このランダムな待ち時間はなくなります。範囲：0～10000。既存のカウントダウンは維持されます。"
frFR = "Temps d’attente moyen exponentiel après l’éligibilité. Valeur par défaut : 16. Zéro supprime cette attente aléatoire. Plage : 0-10000. Les comptes à rebours en cours sont conservés."
deDE = "Mittlere exponentielle Wartezeit nach Erreichen der Voraussetzungen. Standardwert: 16. Bei 0 entfällt diese zufällige Wartezeit. Bereich: 0–10000. Laufende Countdown-Zähler bleiben erhalten."
plPL = "Średni czas wykładniczego oczekiwania po spełnieniu warunków. Domyślnie 16. Zero usuwa to losowe oczekiwanie. Zakres 0–10000. Istniejące odliczania zostają zachowane."
ptBR = "Tempo médio de espera exponencial após ficar elegível. O padrão é 16. Zero remove esse tempo de espera aleatório. Intervalo: 0-10000. As contagens regressivas existentes são preservadas."
koKR = "자격을 얻은 후 평균 지수 대기 시간입니다. 기본값은 16입니다. 0으로 설정하면 이 무작위 대기 시간이 제거됩니다. 범위는 0-10000입니다. 기존 카운트다운은 유지됩니다."
csCZ = "Průměrná exponenciální doba čekání po splnění podmínek. Výchozí hodnota: 16. Nula toto náhodné čekání odstraní. Rozsah: 0–10000. Stávající odpočty zůstanou zachovány."
viVN = "Thời gian chờ trung bình theo phân phối hàm mũ sau khi đủ điều kiện. Mặc định là 16. Giá trị 0 sẽ loại bỏ thời gian chờ ngẫu nhiên này. Phạm vi: 0-10000. Các bộ đếm ngược hiện có được giữ nguyên."
trTR = "Uygun hâle geldikten sonraki ortalama üstel bekleme süresi. Varsayılan: 16. Sıfır, bu rastgele beklemeyi kaldırır. Aralık: 0-10000. Mevcut geri sayımlar korunur."

