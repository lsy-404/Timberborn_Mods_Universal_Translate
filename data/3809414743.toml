["ForestMushrooms.Settings.DeadTreeDays.Help"]
status = "normal"
raw = "Time an existing crop stays pickable after its tree dies. Default 2. Zero removes it immediately. Cutting always removes the crop. Changing this applies to existing dead trees."
enUS = "Time an existing crop remains pickable after its tree dies. Default: 2. Zero removes it immediately. Cutting always removes the crop. Changing this setting affects existing dead trees."
zhCN = "树木死亡后，其作物仍可采摘的时间。默认值为 2。设为 0 会立即移除作物。砍伐树木总会移除作物。此设置变更也会应用于现有的枯树。"
zhTW = "樹木死亡後，現有作物仍可採收的時間。預設值為 2。設為 0 會立即移除作物。砍伐樹木時，作物一律會被移除。變更此設定會套用至現有的枯死樹木。"
ruRU = "Время, в течение которого существующий урожай остаётся пригодным для сбора после гибели дерева. По умолчанию — 2. Ноль удаляет его немедленно. При рубке урожай удаляется всегда. Изменение этого параметра применяется и к уже погибшим деревьям."
jaJP = "木が枯れた後、既存の作物が収穫可能な状態で残る期間。デフォルトは2。0にするとすぐに消えます。伐採すると作物は必ず消えます。この設定の変更は、すでに枯れている木にも適用されます。"
frFR = "Durée pendant laquelle une culture existante reste récoltable après la mort de son arbre. Valeur par défaut : 2. La valeur 0 la supprime immédiatement. L’abattage supprime toujours la culture. La modification de ce paramètre s’applique aux arbres morts existants."
deDE = "Dauer, für die eine vorhandene Ernte nach dem Absterben ihres Baums noch gepflückt werden kann. Standardwert: 2. Bei 0 wird sie sofort entfernt. Beim Fällen wird die Ernte immer entfernt. Änderungen daran gelten auch für bereits abgestorbene Bäume."
plPL = "Czas, przez jaki istniejący plon pozostaje możliwy do zebrania po śmierci drzewa. Domyślnie 2. Zero powoduje jego natychmiastowe usunięcie. Ścięcie zawsze usuwa plon. Zmiana tego ustawienia dotyczy istniejących martwych drzew."
ptBR = "Tempo durante o qual uma cultura existente continua podendo ser colhida após a morte da árvore. O padrão é 2. Zero faz com que ela seja removida imediatamente. O corte sempre remove a cultura. Essa alteração também se aplica às árvores mortas existentes."
koKR = "나무가 죽은 뒤 기존 작물을 수확할 수 있는 기간입니다. 기본값은 2입니다. 0이면 작물이 즉시 사라집니다. 나무를 베면 작물은 항상 사라집니다. 이 설정을 변경하면 이미 죽은 나무에도 적용됩니다."
csCZ = "Doba, po kterou lze stávající úrodu sklízet i po odumření stromu. Výchozí hodnota: 2. Nula ji odstraní okamžitě. Pokácením se úroda vždy odstraní. Změna této hodnoty se vztahuje i na již odumřelé stromy."
viVN = "Thời gian cây trồng hiện có vẫn có thể thu hoạch sau khi cây chết. Mặc định là 2. Đặt bằng 0 sẽ khiến cây trồng biến mất ngay lập tức. Chặt cây luôn loại bỏ cây trồng. Thay đổi này áp dụng cho cả những cây đã chết."
trTR = "Bir ağaç öldükten sonra üzerindeki mevcut mahsulün toplanabilir durumda kalacağı süre. Varsayılan: 2. Sıfır, mahsulü hemen kaldırır. Ağacı kesmek mahsulü her zaman kaldırır. Bu ayarı değiştirmek, mevcut ölü ağaçlara da uygulanır."
