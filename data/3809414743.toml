[_meta]
name = "Forest Mushrooms"

["ForestMushrooms.Settings.Help"]
status = "normal"
raw = "Times use simulation days unless marked hours. Age and moisture thresholds apply immediately. Already sampled countdowns stay unchanged; new waits use the new settings. Picking time applies when the next picking job starts. Settings apply across settlements."
enUS = "Times use simulation days unless marked hours. Age and moisture thresholds apply immediately. Already sampled countdowns stay unchanged; new waits use the new settings. Picking time applies when the next picking job starts. Settings apply across settlements."
zhCN = "时间以模拟天数为单位，除非标明小时。年龄和湿度阈值立即生效。已开始计时的倒计时保持不变；新的等待时间使用新设置。采摘时间设置从下一个采摘任务开始时生效。设置对所有聚居地生效。"
zhTW = "時間以模擬日計算，除非標示為小時。年齡和濕度門檻會立即生效。已開始計時的倒數不會改變；新的等待時間會採用新設定。採摘時間會在下一個採摘工作開始時生效。設定適用於所有聚居地。"
ruRU = "Время указано в игровых днях, если не обозначены часы. Пороговые значения возраста и влажности применяются немедленно. Уже начавшиеся отсчёты не изменяются; новые интервалы ожидания используют новые настройки. Время сбора применяется при начале следующего задания на сбор. Настройки распространяются на все поселения."
jaJP = "時間は、時間単位と明記されていない限り、シミュレーション内の日数です。年齢と湿度のしきい値は即時に適用されます。すでに測定済みのカウントダウンは変更されず、新たな待機時間には新しい設定が適用されます。採取時間の設定は、次の採取作業が始まるときに適用されます。設定はすべての居住地に適用されます。"
frFR = "Les durées sont exprimées en jours de simulation, sauf indication contraire en heures. Les seuils d’âge et d’humidité s’appliquent immédiatement. Les comptes à rebours déjà entamés restent inchangés ; les nouveaux délais utilisent les nouveaux paramètres. Le délai de cueillette s’applique au démarrage de la prochaine tâche de cueillette. Les paramètres s’appliquent à toutes les colonies."
deDE = "Zeitangaben sind Simulationstage, sofern sie nicht als Stunden gekennzeichnet sind. Alters- und Feuchtigkeitsschwellen gelten sofort. Bereits gestartete Countdown-Zähler bleiben unverändert; für neue Wartezeiten gelten die neuen Einstellungen. Die Pflückzeit gilt ab dem Start des nächsten Pflückauftrags. Die Einstellungen gelten für alle Siedlungen."
plPL = "Czasy podano w dniach symulacji, chyba że oznaczono je jako godziny. Progi wieku i wilgotności obowiązują natychmiast. Już rozpoczęte odliczanie pozostaje bez zmian; nowe oczekiwanie korzysta z nowych ustawień. Czas zbioru zaczyna obowiązywać, gdy rozpocznie się następne zadanie zbioru. Ustawienia obowiązują we wszystkich osadach."
ptBR = "Os tempos usam dias de simulação, salvo quando indicados em horas. Os limites de idade e umidade se aplicam imediatamente. Contagens regressivas já iniciadas permanecem inalteradas; novas esperas usam as novas configurações. O tempo de colheita se aplica quando o próximo trabalho de colheita começa. As configurações se aplicam a todos os assentamentos."
koKR = "시간은 시간 단위로 표시된 경우를 제외하고 시뮬레이션 일수를 기준으로 합니다. 나이와 수분 임계값은 즉시 적용됩니다. 이미 측정된 카운트다운은 변경되지 않으며, 새로운 대기 시간에는 새 설정이 적용됩니다. 채집 시간 설정은 다음 채집 작업이 시작될 때 적용됩니다. 설정은 모든 정착지에 적용됩니다."
csCZ = "Časy se uvádějí ve dnech simulace, pokud nejsou označeny jako hodiny. Věkové a vlhkostní prahy se uplatní okamžitě. Již započaté odpočty se nezmění; nové čekací doby se řídí novým nastavením. Doba sběru se uplatní při zahájení dalšího sběru. Nastavení platí ve všech osadách."
viVN = "Thời gian được tính theo ngày trong mô phỏng, trừ khi ghi rõ là giờ. Các ngưỡng tuổi và độ ẩm được áp dụng ngay lập tức. Các bộ đếm ngược đã được lấy mẫu vẫn giữ nguyên; thời gian chờ mới sẽ dùng cài đặt mới. Thời gian hái được áp dụng khi công việc hái tiếp theo bắt đầu. Cài đặt được áp dụng cho tất cả các khu định cư."
trTR = "Saat olarak belirtilmedikçe süreler simülasyon günüdür. Yaş ve nem eşikleri hemen uygulanır. Hâlihazırda örneklenmiş geri sayımlar değişmeden kalır; yeni bekleme süreleri yeni ayarları kullanır. Toplama süresi, bir sonraki toplama işi başladığında uygulanır. Ayarlar tüm yerleşimlerde geçerlidir."

