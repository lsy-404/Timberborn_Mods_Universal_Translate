viVN = "Giới hạn trên của thời gian chờ tái sinh ngẫu nhiên mới. Mặc định là 20. Phạm vi 0-10000. Nếu giảm giá trị này xuống dưới mức tối thiểu, mức tối thiểu cũng sẽ giảm theo. Hai giới hạn bằng nhau sẽ tạo ra độ trễ cố định."
