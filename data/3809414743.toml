["ForestMushrooms.Settings.DeadTreeDays.Help"]
status = "normal"
raw = "Time an existing crop stays pickable after its tree dies. Default 2. Zero removes it immediately. Cutting always removes the crop. Changing this applies to existing dead trees."
enUS = "Time an existing crop remains pickable after its tree dies. Default: 2. Zero removes it immediately. Cutting always removes the crop. Changing this setting affects existing dead trees."
zhCN = "树木死亡后，其作物仍可采摘的时长。默认值为 2。设为 0 会立即移除作物。砍伐树木总会移除作物。更改此设置会影响现有的枯树。"
zhTW = "樹木死亡後，現有作物仍可採摘的時間。預設值為 2。設為 0 會立即移除作物。砍伐樹木一定會移除作物。變更此設定也會套用至現有的枯死樹木。"
ruRU = "Время, в течение которого существующий урожай остаётся доступным для сбора после гибели дерева. По умолчанию — 2. Ноль означает, что урожай исчезнет сразу. Срубание всегда удаляет урожай. Изменение этого параметра применяется к уже погибшим деревьям."
jaJP = "木が枯れた後も、既存の作物を収穫できる期間。デフォルトは2。0にすると、作物はすぐに消滅します。伐採すると、作物は必ず取り除かれます。この設定の変更は、すでに枯れている木にも適用されます。"
frFR = "Durée pendant laquelle une culture existante reste récoltable après la mort de son arbre. Valeur par défaut : 2. Une valeur de zéro la supprime immédiatement. L’abattage supprime toujours la culture. Toute modification s’applique aux arbres déjà morts."
deDE = "Wie lange eine vorhandene Ernte nach dem Absterben ihres Baums noch gepflückt werden kann. Standardwert: 2. Bei 0 wird sie sofort entfernt. Beim Fällen wird die Ernte immer entfernt. Eine Änderung wirkt sich auch auf bereits abgestorbene Bäume aus."
plPL = "Czas, przez jaki istniejący plon pozostaje możliwy do zebrania po obumarciu drzewa. Domyślnie: 2. Wartość zero usuwa go natychmiast. Ścięcie zawsze usuwa plon. Zmiana tego ustawienia dotyczy już obumarłych drzew."
ptBR = "Tempo durante o qual uma cultura existente continua colhível após a morte da árvore. O padrão é 2. Zero a remove imediatamente. Cortar a árvore sempre remove a cultura. A alteração se aplica às árvores mortas existentes."
koKR = "나무가 죽은 뒤 기존 작물을 수확할 수 있는 기간입니다. 기본값은 2입니다. 0으로 설정하면 즉시 사라집니다. 나무를 베면 작물은 항상 사라집니다. 이 설정 변경은 이미 죽은 나무에도 적용됩니다."
csCZ = "Doba, po kterou lze stávající plodinu sklízet po odumření stromu. Výchozí hodnota je 2. Nula ji odstraní okamžitě. Pokácení vždy plodinu odstraní. Změna se vztahuje i na již odumřelé stromy."
viVN = "Thời gian cây trồng hiện có vẫn có thể thu hoạch sau khi cây chết. Mặc định là 2. Đặt thành 0 sẽ xóa cây trồng ngay lập tức. Chặt cây luôn xóa cây trồng. Thay đổi thiết lập này sẽ áp dụng cho những cây đã chết."
trTR = "Bir ağaç öldükten sonra mevcut bir ürünün toplanabilir kalacağı süre. Varsayılan: 2. Sıfır, ürünü hemen kaldırır. Kesmek ürünü her zaman kaldırır. Bu ayar değiştirildiğinde mevcut ölü ağaçlara da uygulanır."
