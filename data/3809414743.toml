["ForestMushrooms.Settings.InitialMean.Help"]
status = "normal"
raw = "Mean exponential wait after eligibility. Default 16. Zero removes this random wait. Range 0-10000. Existing countdowns are preserved."
enUS = "Mean exponential wait after eligibility. Default: 16. Zero removes this random wait. Range: 0–10000. Existing countdowns are preserved."
zhCN = "符合条件后的平均指数等待时间。默认值为 16。设为 0 可取消此随机等待。范围：0-10000。现有倒计时会保留。"
zhTW = "符合資格後的平均指數等待時間。預設值為 16。設為 0 可移除此隨機等待。範圍為 0-10000。現有倒數計時會保留。"
ruRU = "Среднее время ожидания с экспоненциальным распределением после наступления условия. По умолчанию — 16. Ноль отключает случайное ожидание. Диапазон: 0–10000. Текущие отсчёты сохраняются."
jaJP = "適格になった後の平均待機時間（指数分布）。デフォルトは16。0にすると、このランダムな待機時間はなくなります。範囲：0～10000。既存のカウントダウンは維持されます。"
frFR = "Délai exponentiel moyen après l’éligibilité. Valeur par défaut : 16. Zéro supprime ce délai aléatoire. Plage : 0-10000. Les comptes à rebours en cours sont conservés."
deDE = "Durchschnittliche exponentielle Wartezeit nach Erfüllung der Voraussetzungen. Standardwert: 16. Bei 0 entfällt diese zufällige Wartezeit. Bereich: 0–10000. Bestehende Countdown-Zähler bleiben erhalten."
plPL = "Średni wykładniczy czas oczekiwania po spełnieniu warunków. Domyślnie 16. Wartość zero usuwa to losowe oczekiwanie. Zakres: 0–10000. Istniejące odliczania zostają zachowane."
ptBR = "Tempo médio de espera exponencial após se tornar elegível. Padrão: 16. Zero remove essa espera aleatória. Intervalo: 0-10000. As contagens regressivas existentes são preservadas."
koKR = "자격을 얻은 후의 평균 지수 대기 시간입니다. 기본값은 16입니다. 0으로 설정하면 이 무작위 대기 시간이 제거됩니다. 범위: 0-10000. 기존 카운트다운은 유지됩니다."
csCZ = "Průměrná exponenciální doba čekání po splnění podmínek. Výchozí hodnota: 16. Nula toto náhodné čekání odstraní. Rozsah 0–10000. Probíhající odpočty zůstanou zachovány."
viVN = "Thời gian chờ trung bình theo phân phối hàm mũ sau khi đủ điều kiện. Mặc định là 16. Đặt thành 0 để bỏ thời gian chờ ngẫu nhiên này. Phạm vi: 0-10000. Các bộ đếm ngược hiện có sẽ được giữ nguyên."
trTR = "Uygunluk sağlandıktan sonraki ortalama üstel bekleme süresi. Varsayılan: 16. Sıfır, bu rastgele beklemeyi kaldırır. Aralık: 0-10000. Mevcut geri sayımlar korunur."

