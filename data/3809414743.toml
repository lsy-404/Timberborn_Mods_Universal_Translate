csCZ = "Stáří od zasazení nebo pokácení, po jehož uplynutí mohou houby růst. Výchozí hodnota je 40. Rozsah 0–10000."
viVN = "Thời gian kể từ khi tạo ra hoặc bị chặt để nấm có thể mọc. Mặc định là 40. Phạm vi 0-10000."
