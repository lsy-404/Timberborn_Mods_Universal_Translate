["ForestMushrooms.Settings.RegrowthMin.Help"]
status = "normal"
raw = "Lower bound for a new random regrowth wait. Default 12. Range 0-10000. Raising this above the maximum also raises the maximum."
enUS = "Lower bound for the wait before new random regrowth. Default: 12. Range: 0–10000. Raising this above the maximum also raises the maximum."
zhCN = "新随机再生等待时间的下限。默认值为 12。范围：0-10000。将此值调高至超过上限，也会提高上限。"
zhTW = "新隨機再生等待時間的下限。預設值為 12。範圍為 0-10000。將此值提高到高於上限，也會提高上限。"
ruRU = "Нижняя граница нового случайного ожидания перед повторным ростом. По умолчанию — 12. Диапазон: 0–10000. При повышении выше максимального значения максимум также повышается."
jaJP = "新しいランダムな再成長待ち時間の下限。デフォルトは12。範囲は0～10000。この値を上限より大きくすると、上限も引き上げられます。"
frFR = "Limite inférieure du délai aléatoire avant une nouvelle repousse. Valeur par défaut : 12. Plage : 0-10000. Si cette valeur dépasse le maximum, le maximum augmente également."
deDE = "Untergrenze für die zufällige Wartezeit bis zum Nachwachsen. Standardwert: 12. Bereich: 0–10000. Wird dieser Wert über die Obergrenze angehoben, erhöht sich auch die Obergrenze."
plPL = "Dolna granica losowego czasu oczekiwania na ponowny wzrost. Domyślnie 12. Zakres 0–10000. Podniesienie tej wartości powyżej maksimum podnosi również maksimum."
ptBR = "Limite inferior para o tempo de espera de um novo rebrote aleatório. Padrão: 12. Intervalo: 0-10000. Aumentar este valor acima do máximo também aumenta o máximo."
koKR = "새로운 무작위 재성장 대기 시간의 최솟값입니다. 기본값은 12입니다. 범위는 0~10000입니다. 이 값을 최댓값보다 높이면 최댓값도 함께 높아집니다."
csCZ = "Dolní mez čekání na nový náhodný růst. Výchozí hodnota je 12. Rozsah 0–10000. Zvýšení této hodnoty nad maximum zvýší i maximum."
viVN = "Giới hạn dưới của thời gian chờ mọc lại ngẫu nhiên mới. Mặc định là 12. Phạm vi 0-10000. Tăng giá trị này vượt quá giới hạn trên cũng sẽ làm tăng giới hạn trên."
trTR = "Yeni rastgele yeniden büyüme bekleme süresinin alt sınırı. Varsayılan: 12. Aralık: 0-10000. Bu değeri üst sınırın üzerine çıkarmak, üst sınırı da artırır."

