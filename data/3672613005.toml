["LV.DP.NoOccupationDesc"]
raw = "Decorative plants do not take any 'space' so you can build it on/with anything else. Due to technical limitation, it has to occupy the ground on the first level."
status = "normal"
enUS = "Decorative plants do not take any space, so you can build it on or with anything else. Due to a technical limitation, it has to occupy the ground on the first level."
zhCN = "装饰植物不占用任何“空间”，因此你可以在其他物体上方或与之一起建造。由于技术限制，它必须占据第一层的地面。"
zhTW = "裝飾植物不佔用任何空間，因此你可以與其他物件一起建造或放置。由於技術限制，它必須佔據第一層地面。"
ruRU = "Декоративные растения не занимают никакого 'пространства', поэтому их можно размещать на/с чем угодно. Из-за технических ограничений оно должно занимать землю на первом уровне."
jaJP = "装飾用の植物は「スペース」を一切占有しないため、他のものの上にも、他のものと一緒に設置できます。技術的な制約のため、第一レベルの地面を占有する必要があります。"
frFR = "Les plantes décoratives n'occupent aucun 'espace', vous pouvez donc les placer sur/avec n'importe quel autre élément. En raison d'une limitation technique, elles doivent occuper le sol au premier niveau."
deDE = "Dekorative Pflanzen nehmen keinen 'Platz' ein, sodass du sie zusammen mit allem anderen bauen kannst. Aufgrund technischer Einschränkungen müssen sie den Boden der ersten Ebene belegen."
plPL = "Dekoracyjne rośliny nie zajmują żadnej 'przestrzeni', więc możesz je stawiać na dowolnym innym elemencie. Ze względu na ograniczenia techniczne muszą zajmować grunt na pierwszym poziomie."
ptBR = "Plantas decorativas não ocupam nenhum 'espaço', então você pode colocá-las em cima de qualquer outra coisa. Devido a uma limitação técnica, elas precisam ocupar o solo no primeiro nível."
koKR = "장식용 식물은 어떠한 '공간'도 차지하지 않으므로 다른 물체 위에나 다른 물체와 함께 설치할 수 있습니다. 기술적 한계로 인해 1단계의 지면을 차지해야 합니다."
trTR = "Dekoratif bitkiler hiçbir 'alan' kaplamaz, bu nedenle başka herhangi bir şeyin üzerine/yapısına inşa edebilirsiniz. Teknik sınırlamalar nedeniyle, yerin ilk seviyesini kaplaması gerekir."
esES = "Las plantas decorativas no ocupan ningún «espacio», así que puedes construirlas sobre cualquier otra cosa. Debido a una limitación técnica, tienen que ocupar el terreno del primer nivel."
itIT = "Le piante decorative non occupano alcuno 'spazio', quindi puoi costruirle sopra o insieme a qualsiasi altra cosa. A causa di una limitazione tecnica, devono occupare il terreno al primo livello."
ukUA = "Декоративні рослини не займають жодного «місця», тож їх можна розміщувати на/разом із будь-чим іншим. Через технічне обмеження вони мають займати землю на першому рівні."
thTH = "พืชประดับไม่ใช้ “พื้นที่” เลย คุณจึงสร้างมันไว้บน/ร่วมกับสิ่งอื่นได้ เนื่องจากข้อจำกัดทางเทคนิค มันต้องใช้พื้นที่บนพื้นในระดับแรกด้วย"
csCZ = "Dekorativní rostliny nezabírají žádný 'prostor', takže je můžete umístit na cokoli jiného nebo spolu s čímkoli dalším. Kvůli technickému omezení musí zabírat půdu na prvním levelu."
viVN = "Cây trang trí không chiếm bất kỳ 'không gian' nào nên bạn có thể đặt nó lên trên hoặc cùng với bất kỳ vật thể nào khác. Do hạn chế kỹ thuật, nó phải chiếm mặt đất ở tầng một."
caES = "Les plantes decoratives no ocupen cap 'espai', així que les pots construir sobre qualsevol altra cosa. A causa d'una limitació tècnica, han d'ocupar el terreny del primer nivell."
beBY = "Дэкаратыўныя расліны не займаюць ніякай «прасторы», таму іх можна размяшчаць на/разам з чым заўгодна. З-за тэхнічных абмежаванняў яны павінны займаць зямлю на першым узроўні."
roRO = "Plantele decorative nu ocupă niciun „spațiu”, așa că le poți construi pe/cu orice altceva. Din cauza unei limitări tehnice, trebuie să ocupe terenul de la primul nivel."
huHU = "A dísznövények nem foglalnak el „helyet”, így bármi másra is építheted őket, illetve bármi mással együtt is. Technikai korlát miatt az első szinten a talajt kell elfoglalniuk."
arSA = "النباتات الزينة لا تشغل أي «مساحة»، لذا يمكنك وضعها فوق أي شيء آخر أو معه. وبسبب قيد تقني، يجب أن تشغل الأرض في المستوى الأول."

