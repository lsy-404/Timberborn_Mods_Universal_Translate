["LV.DP.ClearDone"]
raw = "Decorative Plants decorations cleared. Click Generate to regenerate them and add them back to the game.\n<RedHighlight>Please restart the game to take effect!</RedHighlight>"
status = "normal"
enUS = "Decorative Plants decorations cleared. Click Generate to regenerate them and add them back to the game.\n<RedHighlight>Please restart the game to take effect!</RedHighlight>"
zhCN = "装饰植物的装饰已清除。点击生成以重新生成它们并将它们重新添加到游戏中。\n<RedHighlight>请重新启动游戏以使更改生效！</RedHighlight>"
zhTW = "裝飾植物的裝飾已清除。點擊生成以重新生成並將它們加入遊戲。\n<RedHighlight>請重新啟動遊戲以使變更生效！</RedHighlight>"
ruRU = "Украшения Decorative Plants очищены. Нажмите Сгенерировать, чтобы заново сгенерировать их и вернуть в игру.\n<RedHighlight>Пожалуйста, перезапустите игру, чтобы изменения вступили в силу!</RedHighlight>"
jaJP = "装飾植物の装飾をクリアしました。再生成してゲームに追加するには、生成をクリックしてください。\n<RedHighlight>変更を有効にするにはゲームを再起動してください！</RedHighlight>"
frFR = "Les décorations de Decorative Plants ont été effacées. Cliquez sur Générer pour les régénérer et les remettre dans le jeu.\n<RedHighlight>Veuillez redémarrer le jeu pour que cela prenne effet !</RedHighlight>"
deDE = "Die Dekorationen von Decorative Plants wurden gelöscht.\nKlicken Sie auf Generieren, um sie erneut zu erzeugen und sie wieder dem Spiel hinzuzufügen.\n<RedHighlight>Bitte starten Sie das Spiel neu, damit die Änderungen greifen!</RedHighlight>"
plPL = "Dekoracje Decorative Plants zostały usunięte.\nKliknij Generuj, aby je ponownie wygenerować i dodać z powrotem do gry.\n<RedHighlight>Proszę ponownie uruchomić grę, aby zmiany zaczęły obowiązywać!</RedHighlight>"
ptBR = "Decorações de Plantas Decorativas removidas.\nClique em Gerar para regenerá-las e adicioná-las de volta ao jogo.\n<RedHighlight>Por favor reinicie o jogo para que as alterações entrem em vigor!</RedHighlight>"
koKR = "Decorative Plants의 장식이 제거되었습니다.\n생성 버튼을 클릭하여 다시 생성하고 게임에 다시 추가하세요.\n<RedHighlight>효과가 적용되려면 게임을 다시 시작하세요!</RedHighlight>"
trTR = "Decoratif Bitkiler dekorasyonları temizlendi. Yeniden oluşturmak ve tekrar oyuna eklemek için 'Üret' butonuna tıklayın.\n<KırmızıVurgu>Lütfen etkili olması için oyunu yeniden başlatın!</KırmızıVurgu>"
esES = "Se han eliminado las decoraciones de plantas decorativas. Haz clic en Generar para volver a generarlas y añadirlas de nuevo al juego.\n<RedHighlight>¡Reinicia el juego para que los cambios surtan efecto!</RedHighlight>"
itIT = "Le decorazioni di piante decorative sono state rimosse. Fai clic su Genera per rigenerarle e aggiungerle di nuovo al gioco.\n<RedHighlight>Riavvia il gioco perché le modifiche abbiano effetto!</RedHighlight>"
ukUA = "Декорації декоративних рослин очищено. Натисніть «Згенерувати», щоб створити їх знову та додати до гри.\n<RedHighlight>Перезапустіть гру, щоб зміни набули чинності!</RedHighlight>"
thTH = "ล้างของตกแต่งจาก Decorative Plants แล้ว คลิก Generate เพื่อสร้างใหม่และเพิ่มกลับเข้าไปในเกม\n<RedHighlight>โปรดรีสตาร์ตเกมเพื่อให้มีผล!</RedHighlight>"
csCZ = "Dekorace dekorativních rostlin byly vymazány. Klikněte na Generovat, abyste je znovu vygenerovali a přidali zpět do hry.\n<RedHighlight>Prosím restartujte hru, aby se změny projevily!</RedHighlight>"
viVN = "Các trang trí của Decorative Plants đã được xóa.\nNhấp vào Tạo để tái tạo chúng và thêm chúng trở lại vào trò chơi.\n<RedHighlight>Vui lòng khởi động lại trò chơi để có hiệu lực!</RedHighlight>"
caES = "S'han eliminat les decoracions de Decorative Plants. Fes clic a Genera per tornar-les a generar i afegir-les de nou al joc.\n<RedHighlight>Reinicia el joc perquè els canvis tinguin efecte!</RedHighlight>"
beBY = "Дэкарацыі дэкаратыўных раслін выдаленыя. Націсніце «Згенераваць», каб стварыць іх нанова і зноў дадаць у гульню.\n<RedHighlight>Перазапусціце гульню, каб змены ўступілі ў сілу!</RedHighlight>"
roRO = "Decorațiunile modului Decorative Plants au fost eliminate. Faceți clic pe Generează pentru a le genera din nou și a le adăuga înapoi în joc.\n<RedHighlight>Vă rugăm să reporniți jocul pentru ca modificările să aibă efect!</RedHighlight>"
huHU = "A Decorative Plants dekorációi törölve. Kattints a Generálás gombra, hogy újrageneráld és visszaadd őket a játékhoz.\n<RedHighlight>A változtatások életbe lépéséhez indítsd újra a játékot!</RedHighlight>"
arSA = "تم مسح زخارف النباتات الزخرفية. انقر على «توليد» لإعادة توليدها وإضافتها إلى اللعبة من جديد.\n<RedHighlight>يُرجى إعادة تشغيل اللعبة لتطبيق التغييرات!</RedHighlight>"

