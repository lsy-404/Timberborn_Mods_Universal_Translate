["LV.DP.SettingDesc"]
raw = "Generate the Decorative Plants decorations for your game. You should come back here to regenerate every time you have a change in mods that add or remove a faction or plants."
status = "normal"
enUS = "Generate the Decorative Plants decorations for your game. You should come back here to regenerate every time you have a change in mods that add or remove factions or plants."
zhCN = "为你的游戏生成装饰植物的装饰品。每当你对添加或移除派系或植物的模组进行更改时，应该回到这里重新生成。"
zhTW = "為你的遊戲生成裝飾性植物的裝飾品。每當你對新增或移除派系或植物的模組有變更時，請回到此處重新生成。"
ruRU = "Сгенерируйте декорации Decorative Plants для вашей игры. Вам следует возвращаться сюда, чтобы повторно сгенерировать их каждый раз, когда в модах происходят изменения, добавляющие или удаляющие фракцию или растения."
jaJP = "ゲーム用の Decorative Plants の装飾を生成します。ファクション（勢力）や植物を追加・削除するモッドに変更があった場合は、再生成するためにここに戻ってください。"
frFR = "Générez les décorations du mod Decorative Plants pour votre jeu. Vous devriez revenir ici pour régénérer à chaque fois que vous apportez des modifications aux mods qui ajoutent ou retirent une faction ou des plantes."
deDE = "Generiere die Dekorationen der Dekorativen Pflanzen für dein Spiel. Du solltest jedes Mal hierher zurückkehren, um neu zu generieren, wenn sich Mods ändern, die eine Fraktion oder Pflanzen hinzufügen oder entfernen."
plPL = "Generuj dekoracje Decorative Plants dla swojej gry. Powinieneś wrócić tutaj, aby ponownie wygenerować za każdym razem, gdy zajdzie zmiana w modach dodających lub usuwających frakcję lub rośliny."
ptBR = "Gere as decorações do mod Decorative Plants para o seu jogo. Você deve voltar aqui para regenerar sempre que houver uma alteração nos mods que adicionam ou removem facções ou plantas."
koKR = "게임용 Decorative Plants 모드의 장식을 생성합니다. 파벌이나 식물을 추가하거나 제거하는 모드에 변경이 있을 때마다 재생성하려면 여기로 다시 와야 합니다."
trTR = "OYUNUNUZ İÇİN Süs Bitkileri dekorasyonlarını oluşturun. Bir fraksiyon veya bitki ekleyen ya da kaldıran modlarınızda değişiklik olduğunda yeniden oluşturmak için buraya geri dönmelisiniz."
esES = "Genera las decoraciones de Decorative Plants para tu partida. Deberías volver aquí para generarlas de nuevo cada vez que haya algún cambio en los mods que añaden o eliminan una facción o plantas."
itIT = "Genera le decorazioni di Decorative Plants per la tua partita. Torna qui per rigenerarle ogni volta che modifichi le mod che aggiungono o rimuovono una fazione o delle piante."
ukUA = "Згенеруйте декорації Decorative Plants для своєї гри. Щоразу, коли змінюється набір модів, які додають або видаляють фракцію чи рослини, повертайтеся сюди, щоб згенерувати їх знову."
thTH = "สร้างของตกแต่งจากพืชประดับสำหรับเกมของคุณ คุณควรกลับมาที่นี่เพื่อสร้างใหม่ทุกครั้งที่มีการเปลี่ยนแปลงม็อดที่เพิ่มหรือลบฝ่ายหรือพืช"
csCZ = "Generujte dekorace modu Decorative Plants pro vaši hru. Měli byste se sem vrátit, abyste je znovu vygenerovali pokaždé, když dojde ke změně v modifikacích, které přidávají nebo odstraňují frakci nebo rostliny."
viVN = "Tạo các đồ trang trí Decorative Plants cho trò chơi của bạn. Bạn nên quay lại đây để tạo lại mỗi khi bạn có sự thay đổi trong các mod thêm hoặc loại bỏ một phe hoặc cây trồng."
caES = "Genera les decoracions de Decorative Plants per a la teva partida. Hauries de tornar aquí per generar-les de nou cada vegada que canviïs mods que afegeixin o eliminin una facció o plantes."
beBY = "Згенеруйце дэкарацыі з мода «Дэкаратыўныя расліны» для сваёй гульні. Вяртайцеся сюды, каб зноў згенераваць іх кожны раз, калі змяняюцца моды, якія дадаюць або выдаляюць фракцыю ці расліны."
roRO = "Generează decorațiunile Decorative Plants pentru jocul tău. Ar trebui să revii aici pentru a le regenera de fiecare dată când modifici modurile care adaugă sau elimină o facțiune ori plante."
huHU = "Generáld le a Decorative Plants dekorációit a játékodhoz. Minden alkalommal térj vissza ide, és generáld újra őket, amikor változás történik a frakciókat vagy növényeket hozzáadó vagy eltávolító modokban."
arSA = "أنشئ زينة النباتات الزخرفية في لعبتك. ينبغي أن تعود إلى هنا لإعادة إنشائها كلما أجريت تغييرًا على التعديلات التي تضيف فصيلاً أو نباتات أو تزيلها."

