["LV.DP.GenerateDone"]
raw = "Decorative Plants decorations generated for {0} factions. You should see them in the game now.\n<RedHighlight>Please restart the game to take effect!</RedHighlight>"
status = "normal"
enUS = "Decorative Plants decorations generated for {0} factions. You should see them in the game now.\n<RedHighlight>Please restart the game to take effect!</RedHighlight>"
zhCN = "为 {0} 个势力生成的装饰植物。你现在应该在游戏中看到它们。\n<RedHighlight>请重启游戏以使更改生效！</RedHighlight>"
zhTW = "為 {0} 個派系生成裝飾性植物裝飾。你現在應該在遊戲中看到它們。\n<RedHighlight>請重新啟動遊戲以使其生效！</RedHighlight>"
ruRU = "Украшения из декоративных растений сгенерированы для {0} фракций. Теперь вы должны увидеть их в игре.\n<RedHighlight>Пожалуйста, перезапустите игру, чтобы изменения вступили в силу!</RedHighlight>"
jaJP = "デコラティブプランツの装飾が {0}勢力向けに生成されました。今、ゲーム内でそれらを確認できるはずです。\n<RedHighlight>効果を有効にするには、ゲームを再起動してください。</RedHighlight>"
frFR = "Décorations de Decorative Plants générées pour {0} factions. Vous devriez les voir dans le jeu maintenant.\n<RedHighlight>Veuillez redémarrer le jeu pour que cela prenne effet !</RedHighlight>"
deDE = "Dekorationen von Decorative Plants wurden für {0} Fraktionen generiert. Du solltest sie jetzt im Spiel sehen.\n<RedHighlight>Bitte starte das Spiel neu, damit es wirksam wird!</RedHighlight>"
plPL = "Dekoracje z roślin dekoracyjnych wygenerowano dla {0} frakcji. Powinieneś je teraz zobaczyć w grze.\n<RedHighlight>Proszę ponownie uruchomić grę, aby zmiany zaczęły obowiązywać!</RedHighlight>"
ptBR = "Decorações de Plantas Decorativas geradas para {0} facções. Você já deve vê-las no jogo.\n<RedHighlight>Por favor reinicie o jogo para que tenha efeito!</RedHighlight>"
koKR = "{0} 진영에 대해 데코레이티브 플랜트 장식이 생성되었습니다. 이제 게임에서 확인하실 수 있습니다.\n<RedHighlight>효과를 적용하려면 게임을 다시 시작하십시오!</RedHighlight>"
trTR = "{0} fraksiyonları için dekoratif bitki süslemeleri oluşturuldu. Şimdi bunları oyunda görmelisiniz. <RedHighlight>Etki göstermesi için lütfen oyunu yeniden başlatın!</RedHighlight>"
esES = "Decoraciones de Plantas decorativas generadas para {0} facciones. Ya deberías verlas en el juego.\n<RedHighlight>¡Reinicia el juego para que surtan efecto!</RedHighlight>"
itIT = "Decorazioni di Piante decorative generate per {0} fazioni. Ora dovresti vederle nel gioco.\n<RedHighlight>Riavvia il gioco per applicare le modifiche!</RedHighlight>"
ukUA = "Декорації «Декоративні рослини» згенеровано для {0} фракцій. Тепер ви маєте побачити їх у грі.\n<RedHighlight>Перезапустіть гру, щоб зміни набули чинності!</RedHighlight>"
thTH = "สร้างของตกแต่งจาก Decorative Plants สำหรับ {0} ฝ่ายแล้ว ตอนนี้คุณควรจะเห็นของตกแต่งเหล่านี้ในเกม\n<RedHighlight>โปรดรีสตาร์ตเกมเพื่อให้การเปลี่ยนแปลงมีผล!</RedHighlight>"
csCZ = "Dekorační rostliny byly vygenerovány pro {0} frakcí.\nTeď byste je měli vidět ve hře.\n<RedHighlight>Restartujte hru, aby se změny projevily!</RedHighlight>"
viVN = "Các trang trí của Decorative Plants được tạo ra cho {0} phe phái. Bạn có thể thấy chúng trong trò chơi ngay bây giờ.\n<RedHighlight>Vui lòng khởi động lại trò chơi để có hiệu lực!</RedHighlight>"
caES = "S'han generat les decoracions de Decorative Plants per a {0} faccions. Ja hauríeu de veure-les al joc.\n<RedHighlight>Reinicieu el joc perquè els canvis tinguin efecte!</RedHighlight>"
beBY = "Дэкарацыі «Дэкаратыўныя расліны» створаны для {0} фракцый. Цяпер вы павінны бачыць іх у гульні.\n<RedHighlight>Каб змены ўступілі ў сілу, перазапусціце гульню!</RedHighlight>"
roRO = "Au fost generate decorațiuni Decorative Plants pentru {0} facțiuni. Ar trebui să le vedeți acum în joc.\n<RedHighlight>Vă rugăm să reporniți jocul pentru ca modificările să intre în vigoare!</RedHighlight>"
huHU = "A Decorative Plants dekorációkat generált {0} frakció számára. Most már látnod kell őket a játékban.\n<RedHighlight>A változtatás érvénybe lépéséhez indítsd újra a játékot!</RedHighlight>"
arSA = "تم إنشاء زينة النباتات الزخرفية لفصائل {0}. ينبغي أن تراها في اللعبة الآن.\n<RedHighlight>يُرجى إعادة تشغيل اللعبة لتفعيل التغييرات!</RedHighlight>"

