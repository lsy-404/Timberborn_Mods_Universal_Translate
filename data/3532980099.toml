["LV.BO.EnableBenchmarkDesc"]
raw = "Show the Benchmark UI (in game: Esc -> Benchmark).\nCertain code are injected to the game and will cause the game to run slower.\nPlease restart the game after changing this setting."
status = "normal"
enUS = "Show the Benchmark UI (in game: Esc -> Benchmark).\nCertain code are injected to the game and will cause the game to run slower.\nPlease restart the game after changing this setting."
zhCN = "显示性能测试界面（游戏中按ESC→性能测试）。<br>某些代码将被注入游戏，可能导致运行变慢。<br>修改此设置后请重启游戏。"
zhTW = "顯示基準測試用戶界面（遊戲中：Esc -> 基準測試）。\n某些代碼會被注入到遊戲中，並將導致遊戲運行變慢。\n更改此設置後請重新啟動遊戲。"
ruRU = "Показать интерфейс бенчмарка (в игре: Esc -> Бенчмарк). Некоторые коды внедряются в игру и могут замедлить её работу. Пожалуйста, перезапустите игру после изменения этой настройки."
jaJP = "ベンチマーク UI を表示します（ゲーム内: Esc -> ベンチマーク）。\n特定のコードがゲームに挿入されるため、ゲームが遅くなる可能性があります。\nこの設定を変更した後、ゲームを再起動してください。"
frFR = "Afficher l'interface de benchmarking (dans le jeu : Échap -> Benchmark). Certains codes sont injectés dans le jeu et ralentiront le fonctionnement du jeu. Veuillez redémarrer le jeu après avoir modifié ce paramètre."
deDE = "Zeige die Benchmark-Benutzeroberfläche (im Spiel: Esc -> Benchmark). \nBestimmter Code wird in das Spiel eingefügt und kann dazu führen, dass das Spiel langsamer läuft. \nBitte starte das Spiel neu, nachdem du diese Einstellung geändert hast."
plPL = "Wyświetl interfejs benchmarku (w grze: Esc -> Benchmark).\nNiektóre kody są wstrzykiwane do gry i mogą spowodować jej wolniejsze działanie.\nProszę zrestartować grę po zmianie tego ustawienia."
ptBR = "Mostrar a interface de Benchmark (no jogo: Esc -> Benchmark).\nCerto código é injetado no jogo e fará com que o jogo funcione mais lentamente.\nPor favor, reinicie o jogo após alterar esta configuração."
koKR = "벤치마크 UI를 표시합니다 (게임 내: Esc -> 벤치마크).  \n일부 코드가 게임에 주입되어 게임 속도가 느려질 수 있습니다.  \n이 설정을 변경한 후 게임을 다시 시작해 주세요."
trTR = "Benchmark arayüzünü göster (oyunda: Esc -> Benchmark).\nBazı kodlar oyuna enjekte edilir ve oyunun yavaş çalışmasına neden olur.\nBu ayarı değiştirdikten sonra oyunu yeniden başlatmalısınız."
esES = "Mostrar la interfaz de prueba de rendimiento (en el juego: Esc -> Benchmark).\nCiertos códigos se inyectan en el juego y harán que se ejecute más lentamente.\nReinicia el juego después de cambiar este ajuste."
itIT = "Mostra l'interfaccia del benchmark (in gioco: Esc -> Benchmark).\nAlcuni codici vengono inseriti nel gioco e ne rallenteranno l'esecuzione.\nRiavvia il gioco dopo aver modificato questa impostazione."
ukUA = "Показати інтерфейс бенчмарку (у грі: Esc -> Benchmark).\nПевний код додано до гри, і це призведе до її уповільнення.\nБудь ласка, перезапустіть гру після зміни цього налаштування."
thTH = "แสดงหน้าจอ Benchmark (ในเกม: Esc -> Benchmark)\nโค้ดบางส่วนถูกฉีดเข้าไปในเกม ซึ่งจะทำให้เกมทำงานช้าลง\nโปรดรีสตาร์ทเกมหลังจากเปลี่ยนการตั้งค่านี้"
csCZ = "Zobrazit uživatelské rozhraní Benchmark (v hře: Esc -> Benchmark). Některé kódy jsou injektovány do hry a způsobí, že hra poběží pomaleji. Po změně tohoto nastavení restartujte hru."
viVN = "Hiển thị giao diện Benchmark (trong game: Esc -> Benchmark).\nMột số đoạn mã được chèn vào trò chơi và sẽ khiến trò chơi chạy chậm hơn.\nVui lòng khởi động lại trò chơi sau khi thay đổi cài đặt này."
caES = "Mostra la interfície de referència (al joc: Esc -> Benchmark).\nCerts codis s'injecten al joc i faran que el joc vagi més lent.\nReinicia el joc després de canviar aquest paràmetre."
beBY = "Паказаць інтэрфейс бенчмарку (у гульні: Esc -> Benchmark).\nНекаторыя коды ўбудаваны ў гульню і запавольваюць яе працу.\nКалі ласка, перазапусціце гульню пасля змены гэтай налады."
roRO = "Afișează interfața de benchmark (în joc: Esc -> Benchmark).\nAnumit cod este injectat în joc și va face jocul să ruleze mai lent.\nTe rugăm să repornești jocul după ce schimbi această setare."
huHU = "Mutassa a benchmark felületet (játékban: Esc -> Benchmark).\nBizonyos kódok be vannak injektálva a játékba, és ettől a játék lassabban fog futni.\nKérjük, a beállítás módosítása után indítsa újra a játékot."
arSA = "عرض واجهة الاختبار المعياري (داخل اللعبة: Esc ← Benchmark).\nيتم حقن شيفرات معينة في اللعبة، وقد تؤدي إلى إبطاء تشغيلها.\nيرجى إعادة تشغيل اللعبة بعد تغيير هذا الإعداد."

