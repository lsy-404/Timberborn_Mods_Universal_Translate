["LV.BO.WellKnown_BehaviorManager"]
raw = "Control the actions of your characters. One of the top performance hogs.\nDelaying this would cause characters to not change their actions immediately.\nI would <b>not recommend</b> delaying this without testing as it may reduce your worker's productivity."
status = "abandoned"
enUS = "Control the actions of your characters. One of the top performance hogs.\nDelaying this would cause characters to not change their actions immediately.\nI would <b>not recommend</b> delaying this without testing as it may reduce your worker's productivity."
zhCN = "控制角色行为。主要性能消耗源之一。<br>延迟此项会导致角色行为不能立即更新。<br><b>不建议</b>未经测试就延迟此项，可能降低工人效率。"
zhTW = "控制角色的行動。這是性能消耗的主要原因之一。\n延遲這個將導致角色無法立即改變行動。\n我<b>不建議</b>在未經測試的情況下延遲這個，因為這可能會降低你的工作效率。"
ruRU = "Контролируйте действия своих персонажей. Один из основных потребителей ресурсов. Задержка этого может привести к тому, что персонажи не изменят свои действия мгновенно. Я бы <b>не рекомендовал</b> задерживать это без тестирования, так как это может снизить продуктивность ваших рабочих."
jaJP = "キー名: LV.BO.WellKnown_BehaviorManager - 翻訳テキスト: \"キャラクターの行動を制御します。性能を大きく消費する要因の一つです。\nこれを遅延させると、キャラクターが行動を即座に変えなくなります。\nテストなしで遅延させることは<b>おすすめしません</b>。作業員の生産性が低下する可能性があります。\""
frFR = "Nom de la clé : LV.BO.WellKnown_BehaviorManager - Nouveau texte à traduire : \"Contrôlez les actions de vos personnages. L'un des principaux consommateurs de ressources. Retarder cela empêcherait les personnages de changer leurs actions immédiatement. Je <b>ne recommanderais pas</b> de retarder cela sans test, car cela pourrait réduire la productivité de vos travailleurs.\""
deDE = "Steuerung der Aktionen Ihrer Charaktere. Einer der größten Leistungsschleicher. Das Verzögern dieser Funktion könnte dazu führen, dass Charaktere ihre Aktionen nicht sofort ändern. Ich würde <b>nicht empfehlen</b>, dies ohne Tests zu verzögern, da es die Produktivität Ihrer Arbeiter verringern könnte."
plPL = "Nazwa klucza: LV.BO.WellKnown_BehaviorManager - Tłumaczenie: \"Kontroluj działania swoich postaci. Jedna z największych obciążeń dla wydajności. Opóźnienie tego spowoduje, że postacie nie zmienią swoich działań natychmiast. <b>Nie polecam</b> opóźniania tego bez testów, ponieważ może to zmniejszyć wydajność twoich pracowników.\""
ptBR = "Controle as ações dos seus personagens. Um dos principais responsáveis pelo uso intenso de desempenho. \nAtrasar isso pode fazer com que os personagens não mudem suas ações imediatamente. \nEu <b>não recomendaria</b> atrasar isso sem testar, pois pode reduzir a produtividade dos seus trabalhadores."
koKR = "키 이름: LV.BO.WellKnown_BehaviorManager - 번역할 새 텍스트: \"당신의 캐릭터 행동을 제어하세요. 성능 저하의 주요 원인 중 하나입니다.\n이것을 지연시키면 캐릭터가 즉시 행동을 변경하지 않을 수 있습니다.\n테스트 없이 이 기능을 지연시키는 것을 <b>권장하지 않습니다</b>. 그렇지 않으면 작업자의 생산성이 떨어질 수 있습니다.\""
trTR = "Karakterlerinizin eylemlerini kontrol edin. En üst düzey performans tüketicilerinden biri.\nBunun geciktirilmesi, karakterlerin eylemlerini hemen değiştirmemesine neden olur.\nTest yapmadan bunu geciktirmeyi <b>tavsiye etmiyorum</b> çünkü bu, işçinizin verimliliğini azaltabilir."
esES = "Controla las acciones de tus personajes. Uno de los mayores consumidores de rendimiento.\nRetrasar esto haría que los personajes no cambien sus acciones de inmediato.\n<b>No recomendaría</b> retrasar esto sin hacer pruebas, ya que podría reducir la productividad de tus trabajadores."
itIT = "Controlla le azioni dei tuoi personaggi. Uno dei maggiori divoratori di prestazioni.\nRitardare questo passaggio farebbe sì che i personaggi non cambino le proprie azioni immediatamente.\nIo <b>non consiglierei</b> di ritardare questo passaggio senza prima testarlo, poiché potrebbe ridurre la produttività dei tuoi lavoratori."
ukUA = "Керуйте діями своїх персонажів. Один із найбільших пожирачів продуктивності.\nВідкладення цього призведе до того, що персонажі не змінюватимуть свої дії негайно.\nЯ <b>не рекомендую</b> відкладати це без тестування, оскільки це може знизити продуктивність ваших працівників."
thTH = "ควบคุมการกระทำของตัวละครของคุณ หนึ่งในตัวการที่กินทรัพยากรประสิทธิภาพมากที่สุด\nการเลื่อนสิ่งนี้จะทำให้ตัวละครไม่เปลี่ยนการกระทำของพวกมันทันที\nผม<b>ไม่แนะนำ</b>ให้เลื่อนสิ่งนี้โดยไม่ทดสอบก่อน เพราะอาจทำให้ประสิทธิภาพการทำงานของคนงานของคุณลดลง"
csCZ = "Řiďte akce svých postav. Jeden z hlavních žroutů výkonu.\nZpoždění této akce by způsobilo, že se postavy okamžitě nezmění ve svých činnostech.\n<b>Nedoporučuji</b> zpoždění této akce bez testování, protože by to mohlo snížit produktivitu vašich pracovníků."
viVN = "Kiểm soát hành động của các nhân vật của bạn. Một trong những tác nhân tiêu tốn tài nguyên nhiều nhất.\nViệc trì hoãn điều này sẽ khiến các nhân vật không thay đổi hành động ngay lập tức.\nTôi sẽ <b>không khuyến nghị</b> trì hoãn điều này mà không có thử nghiệm vì nó có thể làm giảm năng suất công nhân của bạn."
caES = "Controla les accions dels teus personatges. Un dels majors consumidors de rendiment.\nRetardar això faria que els personatges no canviessin les seves accions immediatament.\n<b>No recomanaria</b> retardar això sense fer proves, ja que pot reduir la productivitat dels teus treballadors."
beBY = "Кантралюйце дзеянні вашых персанажаў. Адзін з асноўных ворагаў прадукцыйнасці.\nАдкладванне гэтага прывядзе да таго, што персанажы не будуць змяняць свае дзеянні адразу.\nЯ б <b>не рэкамендаваў</b> адкладваць гэта без тэставання, бо гэта можа знізіць прадукцыйнасць вашых працоўных."
roRO = "Controlați acțiunile personajelor. Unul dintre cele mai mari consumatoare de performanță.\nAmânarea acestui lucru ar face ca personajele să nu își schimbe acțiunile imediat.\nNu aș <b>recomanda</b> amânarea acestui lucru fără testare, deoarece poate reduce productivitatea lucrătorilor tăi."
huHU = "Irányítsd a karaktereid cselekedeteit. Az egyik legnagyobb teljesítményigénylő elem.\nEnnek késleltetése azt eredményezné, hogy a karakterek nem változtatnák meg azonnal a cselekvésüket.\n<b>Nem javasolt</b> késleltetni ezt tesztelés nélkül, mert csökkentheti a dolgozóid termelékenységét."
arSA = "تحكّم في تصرفات شخصياتك. وهذا من أكثر العناصر استهلاكاً للأداء.\nسيؤدي تأخير هذا إلى عدم تغيير الشخصيات لأفعالها فوراً.\nلا <b>أنصح بشدة</b> بتأخير هذا دون اختبار، لأنه قد يقلل من إنتاجية عمالك."

["LV.BO.WellKnown_NavMeshObserver"]
raw = "Control the pathfinding of your characters when they move.\nDelaying this may cause characters to not react to pathfinding changes immediately."
status = "abandoned"
enUS = "Control the pathfinding of your characters when they move.\nDelaying this may cause characters to not react to pathfinding changes immediately."
zhCN = "控制角色移动时的寻路系统。<br>延迟此项可能会导致角色不能立即响应寻路变化。"
zhTW = "控制角色移動時的路徑尋找。\n延遲此操作可能會導致角色無法立即對路徑尋找的變化做出反應。"
ruRU = "Контролируйте путь движения ваших персонажей, когда они перемещаются. Задержка этого может привести к тому, что персонажи не будут сразу реагировать на изменения в пути."
jaJP = "キャラクターの移動時の経路探索を制御します。これを遅らせると、キャラクターが経路探索の変更にすぐには反応しない可能性があります。"
frFR = "Contrôlez le cheminement de vos personnages lorsqu'ils se déplacent. Retarder cela peut entraîner un manque de réaction immédiate des personnages aux changements de cheminement."
deDE = "Steuern Sie die Navigation Ihrer Charaktere, wenn sie sich bewegen. Eine Verzögerung kann dazu führen, dass Charaktere nicht sofort auf Änderungen der Pfadfindung reagieren."
plPL = "Kontroluj ścieżkę poruszania się swoich postaci podczas ich ruchu. Opóźnienie tego może spowodować, że postacie nie zareagują od razu na zmiany w ścieżkowaniu."
ptBR = "Controle a navegação dos seus personagens quando eles se movem. Atrasar isso pode fazer com que os personagens não reajam a mudanças na navegação imediatamente."
koKR = "캐릭터가 이동할 때 경로 탐색을 제어합니다. 이를 지연하면 캐릭터가 경로 탐색 변경에 즉시 반응하지 않을 수 있습니다."
trTR = "Karakterleriniz hareket ederken yol bulmalarını kontrol edin. Bunu geciktirmek, karakterlerin yol bulma değişikliklerine hemen tepki vermemesine neden olabilir."
esES = "Controla la búsqueda de rutas de tus personajes cuando se mueven.\nRetrasar esto puede hacer que los personajes no reaccionen a los cambios de ruta de inmediato."
itIT = "Controlla il pathfinding dei tuoi personaggi quando si muovono.\nRitardare questa operazione potrebbe far sì che i personaggi non reagiscano immediatamente alle modifiche del pathfinding."
ukUA = "Керуйте прокладанням шляхів ваших персонажів під час їх руху.\nЗатримка цього може призвести до того, що персонажі не реагуватимуть на зміни шляхів одразу."
thTH = "ควบคุมการค้นหาเส้นทางของตัวละครของคุณเมื่อพวกมันเคลื่อนที่\nการหน่วงเวลาสิ่งนี้อาจทำให้ตัวละครไม่ตอบสนองต่อการเปลี่ยนแปลงการค้นหาเส้นทางทันที"
csCZ = "Ovládejte cestu vašich postav, když se pohybují. Zpoždění může způsobit, že postavy okamžitě nereagují na změny v navigaci."
viVN = "Điều khiển việc tìm đường cho các nhân vật của bạn khi họ di chuyển. Việc trì hoãn điều này có thể khiến các nhân vật không phản ứng kịp với những thay đổi về tìm đường."
caES = "Controla la cerca de camí dels teus personatges quan es mouen.\nRetardar això pot provocar que els personatges no reaccionin immediatament als canvis de cerca de camí."
beBY = "Кантралюйце пракладванне маршрutu вашых персанажаў, калі яны рухаюцца.\nЗатрымка гэтага можа прывесці да таго, што персанажы не будуць неадкладна рэагаваць на змены маршруту."
roRO = "Controlați modul în care personajele își caută traseul atunci când se deplasează.\nAmânarea acestui lucru poate face ca personajele să nu reacționeze imediat la modificările traseului."
huHU = "Szabályozza karaktereinek útvonalkeresését, amikor mozognak.\nEnnek késleltetése miatt előfordulhat, hogy a karakterek nem reagálnak azonnal az útvonalkeresési változásokra."
