["LV.BO.BmInfo"]
raw = "Measure how long each components takes to run.\nChoose the duration to gather data for.\nAfter clicking 'Start Benchmark', <b>try not to pause the game</b> until it finishes to avoid skewing the results.\nYou can, however, change the game speed to any speed you want to know the performance at.\nIf the game is paused, it will be automatically resumed once you click this button.\nAfter the benchmark is finished, this dialog will automatically open again."
status = "normal"
enUS = "Measure how long each components takes to run.\nChoose the duration to gather data for.\nAfter clicking 'Start Benchmark', <b>try not to pause the game</b> until it finishes to avoid skewing the results.\nYou can, however, change the game speed to any speed you want to know the performance at.\nIf the game is paused, it will be automatically resumed once you click this button.\nAfter the benchmark is finished, this dialog will automatically open again."
zhCN = "测量各组件运行耗时。<br>选择数据采集时长。<br>点击“开始测试”后，测试完成前<b>请勿暂停游戏</b>，以免影响结果。<br>可以调整游戏速度，来测试不同速度下的性能。<br>如果游戏已暂停，点击按钮将自动恢复。<br>测试完成后，将自动再次打开此窗口。"
zhTW = "測量每個組件運行所需的時間。  \n選擇收集數據的持續時間。  \n在點擊「開始基準測試」後，<b>盡量不要暫停遊戲</b>，以避免影響結果。  \n不過，你可以將遊戲速度改為任何你想知道性能的速度。  \n如果遊戲已暫停，點擊此按鈕後將自動恢復。  \n基準測試完成後，這個對話框將自動再次打開。"
ruRU = "Ключевое имя: LV.BO.BmInfo - Новый текст для перевода: \"Измерьте, сколько времени требуется каждому компоненту для работы. Выберите продолжительность для сбора данных. После нажатия 'Начать бенчмарк' <b>постарайтесь не ставить игру на паузу</b> до окончания, чтобы избежать искажения результатов. Однако вы можете изменить скорость игры на любую, чтобы узнать производительность на этой скорости. Если игра на паузе, она автоматически продолжится, как только вы нажмете эту кнопку. После завершения бенчмарка это диалоговое окно автоматически откроется снова.\""
jaJP = "キー名：LV.BO.BmInfo - 翻訳テキスト：「各コンポーネントの実行にかかる時間を測定します。データを収集する期間を選択してください。「ベンチマーク開始」をクリックした後は、結果が歪まないように、<b>ゲームを一時停止しないようにしてください</b>。ただし、パフォーマンスを知りたい速度にゲームのスピードを変更することはできます。ゲームが一時停止している場合、このボタンをクリックすると自動的に再開されます。ベンチマークが終了した後、このダイアログは自動的に再表示されます。」"
frFR = "Nom de la clé : LV.BO.BmInfo - Nouveau texte à traduire : \"Mesurez combien de temps chaque composant prend pour fonctionner. Choisissez la durée pour collecter des données. Après avoir cliqué sur 'Démarrer la mesure de performance', <b>essayez de ne pas mettre le jeu en pause</b> jusqu'à ce qu'il se termine pour éviter de fausser les résultats. Vous pouvez, cependant, changer la vitesse du jeu à n'importe quelle vitesse pour connaître la performance. Si le jeu est en pause, il sera automatiquement repris une fois que vous cliquerez sur ce bouton. Après que la mesure de performance soit terminée, cette fenêtre s'ouvrira automatiquement à nouveau.\""
deDE = "Schlüsselname: LV.BO.BmInfo - Übersetzung: \"Messen Sie, wie lange jeder Bestandteil läuft. Wählen Sie die Dauer aus, für die Daten gesammelt werden sollen. Nachdem Sie auf 'Benchmark starten' geklickt haben, <b>versuchen Sie, das Spiel nicht zu pausieren</b>, bis es beendet ist, um Verzerrungen der Ergebnisse zu vermeiden. Sie können jedoch die Spielgeschwindigkeit auf jede Geschwindigkeit ändern, bei der Sie die Leistung wissen möchten. Wenn das Spiel pausiert ist, wird es automatisch wieder fortgesetzt, sobald Sie auf diese Schaltfläche klicken. Nachdem der Benchmark abgeschlossen ist, wird dieses Dialogfeld automatisch erneut geöffnet.\""
plPL = "Mierz, jak długo każdy element potrzebuje na uruchomienie. Wybierz czas trwania, aby zebrać dane. Po kliknięciu 'Rozpocznij test wydajności', <b>staraj się nie wstrzymywać gry</b> aż do jej zakończenia, aby uniknąć zniekształcenia wyników. Możesz jednak zmienić prędkość gry na dowolną, aby sprawdzić wydajność. Jeśli gra jest wstrzymana, zostanie automatycznie wznowiona po kliknięciu tego przycisku. Po zakończeniu testu wydajności, ten dialog zostanie automatycznie otwarty ponownie."
ptBR = "Meça quanto tempo cada componente leva para rodar.\nEscolha a duração para coletar dados.\nApós clicar em 'Iniciar Benchmark', <b>tente não pausar o jogo</b> até que termine para evitar distorcer os resultados.\nVocê pode, no entanto, mudar a velocidade do jogo para qualquer velocidade que desejar saber o desempenho.\nSe o jogo estiver pausado, ele será automaticamente retomado assim que você clicar neste botão.\nApós o término do benchmark, esta janela será automaticamente reaberta."
koKR = "각 구성 요소가 작동하는 시간을 측정하십시오.\n데이터를 수집할 기간을 선택하십시오.\n'벤치마크 시작'을 클릭한 후, <b>결과를 왜곡하지 않기 위해 게임을 일시 중지하지 않도록 하십시오</b>.\n하지만 원하는 성능을 확인하기 위해 게임 속도를 변경할 수 있습니다.\n게임이 일시 중지된 경우, 이 버튼을 클릭하면 자동으로 다시 재개됩니다.\n벤치마크가 완료되면 이 대화 상자가 자동으로 다시 열립니다."
trTR = "Her bir bileşenin ne kadar süre çalıştığını ölçün. Veri toplamak için süreyi seçin. 'Benchmarkı Başlat'a tıkladıktan sonra, sonuçların çarpıtılmaması için <b>şu ana kadar oyunu duraklatmamaya çalışın</b>. Ancak, performansı öğrenmek istediğiniz herhangi bir hızda oyun hızını değiştirebilirsiniz. Oyun duraklatıldıysa, bu butona tıkladığınızda otomatik olarak yeniden başlayacaktır. Benchmark tamamlandıktan sonra, bu iletişim kutusu otomatik olarak tekrar açılacaktır."
esES = "Mida cuánto tiempo tarda en ejecutarse cada componente.\nElija la duración para la que se recopilarán datos.\nTras hacer clic en \"Start Benchmark\", <b>intente no pausar el juego</b> hasta que termine, para evitar que los resultados se distorsionen.\nSin embargo, puede cambiar la velocidad del juego a cualquier velocidad para conocer el rendimiento a esa velocidad.\nSi el juego está en pausa, se reanudará automáticamente al hacer clic en este botón.\nUna vez terminado el benchmark, este cuadro de diálogo se abrirá automáticamente de nuevo."
itIT = "Misura quanto tempo impiega ciascun componente per essere eseguito.\nScegli la durata per cui raccogliere i dati.\nDopo aver cliccato su \"Avvia benchmark\", <b>cerca di non mettere in pausa il gioco</b> fino al termine, per evitare di falsare i risultati.\nPuoi tuttavia cambiare la velocità di gioco su qualsiasi velocità per la quale vuoi conoscere le prestazioni.\nSe il gioco è in pausa, verrà automaticamente ripreso una volta cliccato questo pulsante.\nAl termine del benchmark, questa finestra si aprirà automaticamente di nuovo."
ukUA = "Виміряйте, скільки часу займає виконання кожного компонента.\nВиберіть тривалість, за яку потрібно зібрати дані.\nПісля натискання «Start Benchmark» <b>намагайтеся не призупиняти гру</b>, доки тест не завершиться, щоб не спотворити результати.\nОднак ви можете змінити швидкість гри на будь-яку, при якій хочете дізнатися продуктивність.\nЯкщо гру призупинено, її буде автоматично відновлено після натискання цієї кнопки.\nПісля завершення тесту це вікно автоматично відкриється знову."
thTH = "วัดว่าแต่ละส่วนประกอบใช้เวลาทำงานนานเท่าใด\nเลือกระยะเวลาที่ต้องการเก็บข้อมูล\nหลังจากคลิก 'เริ่มการทดสอบประสิทธิภาพ' <b>พยายามอย่าหยุดเกมชั่วคราว</b> จนกว่าการทดสอบจะเสร็จสิ้น เพื่อหลีกเลี่ยงการทำให้ผลลัพธ์คลาดเคลื่อน\nอย่างไรก็ตาม คุณสามารถเปลี่ยนความเร็วของเกมเป็นความเร็วใดก็ได้ที่ต้องการทราบประสิทธิภาพ\nหากเกมหยุดชั่วคราวอยู่ เกมจะกลับมาทำงานต่อโดยอัตโนมัติเมื่อคุณคลิกปุ่มนี้\nเมื่อการทดสอบประสิทธิภาพเสร็จสิ้น หน้าต่างนี้จะเปิดขึ้นมาอีกครั้งโดยอัตโนมัติ"
csCZ = "Měřte, jak dlouho trvá spuštění každé komponenty. Vyberte dobu, po kterou chcete shromažďovat data. Po kliknutí na 'Spustit benchmark' <b>se snažte hru nepozastavovat</b>, dokud se neskončí, abyste se vyhnuli zkreslení výsledků. Můžete však měnit rychlost hry na jakoukoli rychlost, na které chcete znát výkon. Pokud je hra pozastavena, automaticky se znovu spustí, jakmile kliknete na toto tlačítko. Po dokončení benchmarku se toto okno automaticky znovu otevře."
viVN = "Đo thời gian chạy của từng thành phần.\nChọn thời lượng để thu thập dữ liệu.\nSau khi nhấn 'Start Benchmark', <b>hãy cố gắng không tạm dừng trò chơi</b> cho đến khi nó kết thúc để tránh làm sai lệch kết quả.\nTuy nhiên, bạn có thể thay đổi tốc độ trò chơi sang bất kỳ tốc độ nào bạn muốn để biết hiệu suất ở mức đó.\nNếu trò chơi đang bị tạm dừng, nó sẽ tự động tiếp tục khi bạn nhấp nút này.\nSau khi Benchmark kết thúc, hộp thoại này sẽ tự động mở lại."
caES = "Mesura quant de temps triga a executar-se cada component.\nTria la durada de la qual vols recopilar dades.\nDesprés de fer clic a \"Start Benchmark\", <b>intenta no pausar el joc</b> fins que acabi, per evitar que els resultats es distorsionin.\nTanmateix, pots canviar la velocitat del joc a qualsevol velocitat que vulguis conèixer el rendiment.\nSi el joc està en pausa, es reprendrà automàticament en fer clic en aquest botó.\nUn cop acabat el benchmark, aquest diàleg s'obrirà automàticament de nou."
beBY = "Вымерайце, колькі часу займае кожны кампанент для працы.\nВыберыце працягласць, за які трэба сабраць даныя.\nПасля націску на «Start Benchmark» <b>пастарайцеся не прыпыняць гульню</b>, пакуль яна не завершыцца, каб не скрывіць вынікі.\nАднак вы можаце змяніць хуткасць гульні на любую, на якой хочаце даведацца прадукцыйнасць.\nКалі гульня прыпынена, яна будзе аўтаматычна ўзноўлена пасля націску гэтай кнопкі.\nПасля завяршэння бенчмарку гэты дыялог будзе аўтаматычна адкрыты зноў."
roRO = "Măsoară cât durează fiecare componentă pentru a rula.\nAlege durata pentru care să se colecteze date.\nDupă ce apeși „Start Benchmark”, <b>evită să pui jocul pe pauză</b> până la finalizare, pentru a nu denatura rezultatele.\nPoți totuși schimba viteza jocului la orice valoare dorești, pentru a afla performanța la acea viteză.\nDacă jocul este pus pe pauză, acesta va fi reluat automat după ce apeși acest buton.\nDupă ce benchmark-ul se termină, această fereastră se va deschide din nou automat."
huHU = "Mérje meg, mennyi ideig fut az egyes összetevők.\nVálaszd ki az adatgyűjtés időtartamát.\nA „Start Benchmark” gomb megnyomása után <b>ne szüneteltesd a játékot</b>, amíg be nem fejeződik, hogy ne torzítsa az eredményeket.\nUgyanakkor bármilyen játéksexadbességet beállíthatsz, amelynél a teljesítményt meg szeretnéd ismerni.\nHa a játék szünetel, a gomb megnyomásakor automatikusan folytatódik.\nA benchmark befejezése után ez a párbeszédablak automatikusan újra megnyílik."
arSA = "قِس المدة التي يستغرقها تشغيل كل مكوّن.\nاختر المدة التي تريد جمع البيانات خلالها.\nبعد النقر على \"بدء الاختبار\"، <b>حاول ألا توقف اللعبة مؤقتًا</b> حتى ينتهي، لتجنب تشويه النتائج.\nيمكنك، مع ذلك، تغيير سرعة اللعبة إلى أي سرعة تريد معرفة الأداء عندها.\nإذا كانت اللعبة متوقفة مؤقتًا، فسيُستأنف تشغيلها تلقائيًا بمجرد النقر على هذا الزر.\nبعد انتهاء الاختبار، ستُفتح هذه النافذة تلقائيًا مرة أخرى."

