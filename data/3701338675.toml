["LV.BDl.CopyOneNotf"]
raw = "This building has multiple banners. Only the first one was copied. To copy a specific banner, use the Copy button in that banner's panel."
status = "normal"
enUS = "This building has multiple banners. Only the first one was copied. To copy a specific banner, use the Copy button in that banner's panel."
zhCN = "该建筑有多个横幅。仅复制了第一个。要复制特定的横幅，请使用该横幅面板中的复制按钮。"
zhTW = "這棟建築有多個標誌。只有第一個標誌被複製。要複製特定的標誌，請使用該標誌面板中的複製按鈕。"
ruRU = "Это здание имеет несколько баннеров. Скопирован только первый. Чтобы скопировать конкретный баннер, используйте кнопку Копировать в панели этого баннера."
jaJP = "この建物には複数のバナーがあります。最初のバナーのみがコピーされました。特定のバナーをコピーするには、そのバナーのパネルにあるコピーボタンを使用してください。"
frFR = "Ce bâtiment a plusieurs bannières. Seule la première a été copiée. Pour copier une bannières spécifique, utilisez le bouton Copier dans le panneau de cette bannières."
deDE = "Dieses Gebäude hat mehrere Banner. Nur das erste wurde kopiert. Um ein bestimmtes Banner zu kopieren, verwenden Sie die Schaltfläche \"Kopieren\" im Panel dieses Banners."
plPL = "Ten budynek ma wiele banerów. Tylko pierwszy z nich został skopiowany. Aby skopiować konkretny baner, użyj przycisku Kopiuj w panelu tego banera."
ptBR = "Este edifício possui múltiplos estandartes. Apenas o primeiro foi copiado. Para copiar um estandarte específico, use o botão Copiar no painel desse estandarte."
koKR = "이 건물에는 여러 개의 배너가 있습니다. 첫 번째 배너만 복사되었습니다. 특정 배너를 복사하려면 해당 배너 패널의 복사 버튼을 사용하세요."
trTR = "Bu binanın birden fazla bayrağı var. Sadece ilki kopyalandı. Belirli bir bayrağı kopyalamak için o bayrağın panelindeki Kopyala butonunu kullanın."
esES = "Este edificio tiene varias pancartas. Solo se copió la primera. Para copiar una pancarta específica, usa el botón Copiar en el panel de esa pancarta."
itIT = "Questo edificio ha più stendardi. È stato copiato solo il primo. Per copiare uno stendardo specifico, usa il pulsante Copia nel pannello di quello stendardo."
ukUA = "Ця будівля має кілька прапорів. Скопійовано лише перший. Щоб скопіювати конкретний прапор, використовуйте кнопку «Копіювати» на панелі цього прапора."
thTH = "อาคารนี้มีป้ายหลายผืน คัดลอกได้เฉพาะป้ายแรกเท่านั้น หากต้องการคัดลอกป้ายใดป้ายหนึ่งโดยเฉพาะ ให้ใช้ปุ่มคัดลอกในแผงของป้ายนั้น"
csCZ = "Tato budova má několik bannerů. Byl zkopírován pouze první z nich. Chcete-li zkopírovat konkrétní banner, použijte tlačítko Zkopírovat v panelu daného banneru."
viVN = "Công trình này có nhiều biểu ngữ. Chỉ có biểu ngữ đầu tiên được sao chép. Để sao chép một biểu ngữ cụ thể, hãy sử dụng nút Sao chép trong bảng điều khiển của biểu ngữ đó."
caES = "Aquest edifici té diverses pancartes. Només s'ha copiat la primera. Per copiar una pancarta específica, utilitza el botó Copiar del panell d'aquesta pancarta."
beBY = "Гэты будынак мае некалькі сцяжкоў. Скапіяваны быў толькі першы. Каб скапіяваць пэўную сцяжку, выкарыстайце кнопку «Капіяваць» на панэлі гэтай сцяжкі."
roRO = "Această clădire are mai multe bannere. A fost copiat doar primul. Pentru a copia un anumit banner, folosiți butonul Copiază din panoul acelui banner."
huHU = "Ez az épület több zászlóval rendelkezik. Csak az első került átmásolásra. Egy adott zászló másolásához használd annak a zászlónak a paneljén lévő Másolás gombot."
arSA = "يحتوي هذا المبنى على لافتات متعددة. نُسخت الأولى فقط. لنسخ لافتة محددة، استخدم زر \"نسخ\" في لوحة تلك اللافتة."

