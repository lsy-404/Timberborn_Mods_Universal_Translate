frFR = "Utilisez cet outil pour ajouter des marqueurs à la carte. Shift-cliquez sur un marqueur pour le supprimer. Cliquez sur un marqueur pour faire défiler la couleur du marqueur."
deDE = "Verwende dieses Werkzeug, um Marker auf der Karte hinzuzufügen. Shift-Klick auf einen Marker, um ihn zu löschen. Klicke auf einen Marker, um die Markerfarbe zu wechseln."
plPL = "Użyj tego narzędzia, aby dodać znaczniki na mapie. Shift-kliknij na znacznniku, aby go usunąć. Kliknij na znaczniku, aby zmienić kolor znacznika."
ptBR = "Use esta ferramenta para adicionar marcadores ao mapa. Shift+Clique em um marcador para removê-lo. Clique em um marcador para alternar a cor do marcador."
koKR = "이 도구를 사용하여 지도에 마커를 추가합니다. 마커 위에서 Shift-클릭하면 삭제됩니다. 마커를 클릭하면 마커의 색상이 순환됩니다."
trTR = "Bu aracı haritaya İşaretçiler eklemek için kullanın. Bir İşaretçi üzerinde Shift-Tıklayarak silin. Bir İşaretçi üzerinde tıklayarak İşaretçi rengini değiştirin."
esES = "Usa esta herramienta para añadir marcadores al mapa. Mayús+clic sobre un marcador para eliminarlo. Haz clic sobre un marcador para cambiar su color."
itIT = "Usa questo strumento per aggiungere dei Marcatori alla mappa. Maiusc-clic su un Marcatore per eliminarlo. Clicca su un marcatore per scorrere i colori del Marcatore."
ukUA = "Використовуйте цей інструмент, щоб додавати маркери на карту. Shift-клацання по маркеру видаляє його. Клацання по маркеру циклічно змінює його колір."
thTH = "ใช้เครื่องมือนี้เพื่อเพิ่มเครื่องหมายลงบนแผนที่ Shift-คลิกที่เครื่องหมายเพื่อลบ คลิกที่เครื่องหมายเพื่อสลับสีของเครื่องหมาย"
csCZ = "Použijte tento nástroj k přidání značek na mapu. Stiskněte Shift a klikněte na značku pro její smazání. Klikněte na značku pro změnu barvy značky."
viVN = "Sử dụng công cụ này để thêm các điểm đánh dấu vào bản đồ. Nhấn Shift và nhấp chuột lên một điểm đánh dấu để xóa nó. Nhấp vào một điểm đánh dấu để đổi màu của nó."
caES = "Utilitzeu aquesta eina per afegir marcadors al mapa. Maj + clic sobre un marcador per eliminar-lo. Feu clic sobre un marcador per canviar-ne el color de forma cíclica."
beBY = "Выкарыстоўвайце гэты інструмент, каб дадаваць маркеры на карту. Націсніце Shift і клацніце па маркеры, каб выдаліць яго. Націсніце па маркеры, каб перамыкаць колер маркера."
roRO = "Folosește acest instrument pentru a adăuga marcaje pe hartă. Apasă Shift + clic pe un marcaj pentru a-l șterge. Apasă clic pe un marcaj pentru a parcurge culorile acestuia."
huHU = "Használd ezt az eszközt jelölők hozzáadására a térképhez. Shift-kattintással a jelölő fölött törölheted azt. Kattints a jelölőre a jelölő színének váltásához."
arSA = "استخدم هذه الأداة لإضافة علامات إلى الخريطة. اضغط مع مفتاح Shift فوق علامة لحذفها. انقر فوق العلامة لتبديل لونها بين الخيارات المتاحة."

