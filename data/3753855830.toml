["AcademicsTodoList.Settings.Info"]
status = "normal"
raw = "Missing is what is not yet delivered to the sites. The building panel counts it the same way. Paused buildings are left out. Blocked or hard-to-reach sites still count. Click a good to keep it on the bar. Click the good again to track the biggest shortage. The dropdown picks Follow selection, Whole map, or one district. Have and need come from the same scope. The widget changes to the alarm color when stock drops below the alarm threshold of the needed amount."
enUS = "Missing is what is not yet delivered to the sites. The building panel counts it the same way. Paused buildings are left out. Blocked or hard-to-reach sites still count. Click a good to keep it on the bar. Click the good again to track the biggest shortage. The dropdown picks Follow selection, Whole map, or one district. Have and need come from the same scope. The widget changes to the alarm color when stock drops below the alarm threshold of the needed amount."
zhCN = "缺失量是指尚未运送到工地的物资。建筑面板的计算方式与此相同。暂停的建筑不计入其中。被阻塞或难以抵达的工地仍然计入。点击某种物资可将其保留在快捷栏中；再次点击该物资，则会追踪最大的短缺项。下拉菜单可选择“跟随选择”“全图”或某个单一区域。现有量与需求量采用相同的统计范围。当库存低于需求量的警报阈值时，该小部件会变为警报颜色。"
zhTW = "缺少的是尚未運送到工地的資源。建築面板也以相同方式計算。暫停的建築不計入。受阻或難以抵達的工地仍會計入。點擊資源可將其保留在工具列上。再次點擊該資源則會追蹤最大的短缺。下拉選單可選擇「跟隨選取」、「整張地圖」或單一行政區。擁有量與需求量採用相同範圍。當庫存降至需求量的警報門檻以下時，此小工具會變為警報顏色。"
ruRU = "Недостающее — это то, что ещё не доставлено на строительные площадки. Панель здания учитывает его так же. Приостановленные здания не учитываются. Заблокированные или труднодоступные площадки по-прежнему учитываются. Нажмите на товар, чтобы закрепить его на панели. Нажмите на товар повторно, чтобы отслеживать самую большую нехватку. Выпадающий список позволяет выбрать «Следовать за выделением», «Вся карта» или один район. Наличие и потребность берутся из одной и той же области. Виджет меняет цвет на тревожный, когда запас опускается ниже порогового значения тревоги от требуемого количества."
jaJP = "不足とは、まだ建設現場に届けられていない資源のことです。建設パネルでも同じ方法で数えられます。一時停止中の建設物は除外されます。妨害されている場所や到達しにくい建設現場も引き続き数えられます。資源をクリックするとバーに残ります。もう一度クリックすると、最も不足している量を追跡します。ドロップダウンでは「選択に従う」「マップ全体」「特定の地区」から選べます。保有量と必要量は同じ範囲から取得されます。ストックが必要量のアラーム閾値を下回ると、ウィジェットはアラーム色に変わります。"
frFR = "Ce qui manque correspond à ce qui n'a pas encore été livré sur les chantiers. Le panneau des bâtiments le compte de la même manière. Les bâtiments en pause sont exclus. Les chantiers bloqués ou difficiles d'accès sont tout de même comptés. Cliquez sur une ressource pour la garder dans la barre. Cliquez de nouveau sur la ressource pour suivre la plus forte pénurie. La liste déroulante permet de choisir Suivre la sélection, Toute la carte ou un seul district. Le stock disponible et le besoin proviennent du même périmètre. Le widget passe à la couleur d'alerte lorsque le stock tombe sous le seuil d'alerte, défini comme une proportion de la quantité requise."
deDE = "Fehlend ist, was noch nicht zu den Baustellen geliefert wurde. Das Gebäudepanel zählt es auf dieselbe Weise. Pausierte Gebäude werden ausgelassen. Blockierte oder schwer erreichbare Baustellen werden trotzdem mitgezählt. Klicke auf eine Ware, um sie in der Leiste zu behalten. Klicke die Ware erneut an, um den größten Mangel zu verfolgen. Das Auswahlmenü bietet Der Auswahl folgen, Ganze Karte oder einen einzelnen Distrikt. Vorhanden und benötigt stammen aus demselben Bereich. Das Widget wechselt zur Alarmfarbe, wenn der Bestand unter die Alarmschwelle des benötigten Betrags sinkt."
plPL = "Brakujące to to, co jeszcze nie zostało dostarczone na budowy. Panel budynku liczy to w ten sam sposób. Wstrzymane budynki są pomijane. Zablokowane lub trudno dostępne budowy nadal są liczone. Kliknij towar, aby pozostał na pasku. Kliknij go ponownie, aby śledzić największy niedobór. Rozwijana lista pozwala wybrać: Śledź zaznaczenie, Cała mapa lub jeden dystrykt. Stan posiadania i zapotrzebowanie pochodzą z tego samego zakresu. Widżet zmienia kolor na alarmowy, gdy zapas spada poniżej progu alarmowego, czyli wartości zapotrzebowania."
ptBR = "Falta o que ainda não foi entregue às construções. O painel de construção conta da mesma forma. Construções pausadas não entram na contagem. Locais bloqueados ou de difícil acesso continuam sendo contados. Clique em um bem para mantê-lo na barra. Clique no bem novamente para acompanhar a maior escassez. O menu suspenso permite escolher Seguir seleção, Mapa inteiro ou um único distrito. Disponível e necessário vêm do mesmo escopo. O widget muda para a cor de alarme quando o estoque cai abaixo do limite de alarme da quantidade necessária."
koKR = "Missing은 아직 현장으로 배송되지 않은 것입니다. 건물 패널도 같은 방식으로 계산합니다. 일시 정지된 건물은 제외됩니다. 막혔거나 접근하기 어려운 현장도 계속 포함됩니다. 자원을 클릭하면 막대에 계속 표시됩니다. 같은 자원을 다시 클릭하면 가장 부족한 양을 추적합니다. 드롭다운에서는 선택 따르기, 전체 지도, 또는 특정 구역 중 하나를 고를 수 있습니다. 보유량과 필요량은 같은 범위에서 가져옵니다. 재고가 필요량의 경보 임계값 아래로 떨어지면 위젯이 경보 색으로 바뀝니다."
trTR = "Eksik olan, henüz şantiyelere teslim edilmemiş olandır. Bina paneli bunu aynı şekilde sayar. Duraklatılmış binalar hesaba katılmaz. Engellenmiş veya ulaşması zor şantiyeler yine de sayılır. Bir malı çubukta tutmak için üzerine tıklayın. En büyük eksikliği izlemek için aynı mala tekrar tıklayın. Açılır menü Seçimi takip et, Tüm harita veya tek bir bölge seçeneklerinden birini belirler. Sahip olunan ve gereken miktarlar aynı kapsamdan alınır. Stok, gereken miktarın alarm eşiğinin altına düştüğünde bileşen alarm rengine döner."
esES = "Falta lo que aún no se ha entregado a las obras. El panel de edificios lo cuenta de la misma forma. Los edificios pausados no se incluyen. Las obras bloqueadas o de difícil acceso sí se cuentan. Haz clic en un bien para mantenerlo en la barra. Haz clic de nuevo en el bien para seguir la mayor escasez. El desplegable permite elegir Seguir selección, Todo el mapa o un solo distrito. Tener y necesitar proceden del mismo ámbito. El widget cambia al color de alarma cuando las existencias bajan del umbral de alarma de la cantidad necesaria."
itIT = "Mancante è ciò che non è ancora stato consegnato ai cantieri. Il pannello degli edifici lo conta allo stesso modo. Gli edifici in pausa sono esclusi. I cantieri bloccati o difficili da raggiungere vengono comunque conteggiati. Fai clic su una merce per mantenerla nella barra. Fai di nuovo clic sulla merce per monitorare la carenza più grande. Il menu a tendina permette di scegliere Segui selezione, Intera mappa o un solo distretto. Disponibile e necessario provengono dallo stesso ambito. Il widget passa al colore di allarme quando la scorta scende sotto la soglia di allarme della quantità necessaria."
ukUA = "Відсутнє — це те, що ще не доставлено до будівельних майданчиків. Панель будівель рахує його так само. Призупинені будівлі не враховуються. Заблоковані або важкодоступні майданчики все одно враховуються. Натисніть ресурс, щоб закріпити його на панелі. Натисніть той самий ресурс ще раз, щоб відстежувати найбільшу нестачу. Випадаючий список дозволяє вибрати «Слідувати за вибраним», «Уся карта» або один район. «Є» і «Потрібно» розраховуються в межах однієї й тієї самої області. Віджет змінює колір на тривожний, коли запас падає нижче порогу тривоги від потрібної кількості."
thTH = "ที่ยังขาดคือสิ่งที่ยังไม่ได้ส่งไปยังไซต์ก่อสร้าง แผงข้อมูลอาคารนับตามแบบเดียวกัน อาคารที่หยุดชั่วคราวจะไม่ถูกนับรวม ไซต์ที่ถูกขวางหรือเข้าถึงยากยังคงถูกนับ คลิกสินค้าเพื่อให้คงอยู่บนแถบ คลิกสินค้าเดิมอีกครั้งเพื่อติดตามสินค้าที่ขาดมากที่สุด เมนูแบบดรอปดาวน์เลือกได้ระหว่าง ตามที่เลือก ทั้งแผนที่ หรือเขตเดียว จำนวนที่มีและจำนวนที่ต้องการมาจากขอบเขตเดียวกัน วิดเจ็ตจะเปลี่ยนเป็นสีแจ้งเตือนเมื่อปริมาณในคลังลดลงต่ำกว่าเกณฑ์แจ้งเตือนของจำนวนที่ต้องการ"
csCZ = "Chybí je to, co ještě nebylo doručeno na staveniště. Panel budovy to počítá stejně. Pozastavené budovy se nezapočítávají. Blokovaná nebo těžko dostupná staveniště se počítají dál. Kliknutím na zboží ho ponecháte na liště. Dalším kliknutím na totéž zboží začnete sledovat největší nedostatek. Rozbalovací nabídka umožňuje vybrat Sledovat výběr, Celou mapu nebo jednu čtvrť. Údaje o zásobě i potřebě pocházejí ze stejného rozsahu. Widget se změní na barvu alarmu, když zásoba klesne pod prahovou hodnotu alarmu vzhledem k potřebnému množství."
viVN = "Thiếu là những gì chưa được giao đến các công trường. Bảng thông tin công trình đếm theo cùng cách. Các công trình đang tạm dừng sẽ không được tính. Các công trường bị chặn hoặc khó tiếp cận vẫn được tính. Nhấp vào một loại hàng hóa để giữ nó trên thanh. Nhấp lại vào hàng hóa đó để theo dõi mức thiếu hụt lớn nhất. Danh sách thả xuống cho phép chọn Theo lựa chọn, Toàn bản đồ hoặc một khu vực duy nhất. Có và cần được lấy từ cùng một phạm vi. Tiện ích sẽ chuyển sang màu cảnh báo khi lượng tồn kho giảm xuống dưới ngưỡng cảnh báo tính theo số lượng cần thiết."
caES = "Falta el que encara no s'ha lliurat a les obres. El panell d'edificis ho compta de la mateixa manera. Els edificis aturats no s'inclouen. Les obres bloquejades o de difícil accés continuen comptant. Feu clic en un bé per mantenir-lo a la barra. Torneu a fer clic en el bé per fer el seguiment de la major escassetat. El desplegable permet triar Seguir la selecció, Tot el mapa o un únic districte. Tenir i necessitar provenen del mateix àmbit. El giny canvia al color d'alarma quan l'estoc baixa per sota del llindar d'alarma de la quantitat necessària."
beBY = "Тое, што яшчэ не даставілі на будоўлі, — гэта недахоп. Панэль будынка лічыць гэта так жа. Прыпыненыя будынкі не ўлічваюцца. Заблакіраваныя або цяжкадаступныя будоўлі ўсё роўна ўлічваюцца. Націсніце на тавар, каб захаваць яго на панэлі. Націсніце на тавар яшчэ раз, каб адсочваць найбольшы недахоп. Выпадальны спіс дазваляе выбраць: «Выбраны аб'ект», «Уся карта» або адзін раён. Наяўнасць і патрэба разлічваюцца ў адной вобласці. Віджэт мяняе колер на колер трывогі, калі запас падае ніжэй парога трывогі ад патрэбнай колькасці."
roRO = "Lipsește ceea ce nu a fost încă livrat pe șantiere. Panoul clădirilor îl numără în același mod. Clădirile pauzate sunt excluse. Șantierele blocate sau greu accesibile sunt încă numărate. Dați clic pe un bun pentru a-l menține în bară. Dați clic din nou pe bun pentru a urmări cea mai mare lipsă. Meniul derulant alege Urmărește selecția, Toată harta sau un singur district. Disponibilul și necesarul provin din același domeniu. Widgetul trece la culoarea de alarmă când stocul scade sub pragul de alarmă al cantității necesare."
huHU = "Hiányzik az, ami még nem jutott el az építkezési helyszínekre. Az épülettábla ugyanúgy számolja. A szüneteltetett épületek nincsenek benne. Az elakadt vagy nehezen elérhető helyszínek továbbra is beleszámítanak. Kattintson egy árucikkre, hogy az a sávban maradjon. Kattintson újra az árucikkre, hogy a legnagyobb hiányt kövesse. A legördülő menüben a Kijelölés követése, a Teljes térkép vagy egy adott körzet közül választhat. A meglévő és a szükséges mennyiség ugyanabból a hatókörből származik. Az elem riasztási színre vált, ha a készlet a szükséges mennyiség riasztási küszöbe alá csökken."
arSA = "المفقود هو ما لم يُسلَّم بعد إلى مواقع البناء. تحسب لوحة المبنى المفقود بالطريقة نفسها. تُستثنى المباني المتوقفة مؤقتاً. أما المواقع المحظورة أو الصعبة الوصول فتُحتسب ضمن المفقود. انقر على سلعة لإبقائها على الشريط. انقر على السلعة مرة أخرى لتتبع أكبر نقص. تتيح القائمة المنسدلة اختيار \"متابعة التحديد\" أو \"الخريطة كاملة\" أو منطقة واحدة. يأتي المتوفر والمطلوب من النطاق نفسه. يتحول الأداة إلى لون الإنذار عندما ينخفض المخزون عن عتبة الإنذار من الكمية المطلوبة."

