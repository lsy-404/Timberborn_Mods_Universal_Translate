["HDBF.Building.BoxFarm.Advanced.Description"]
raw = "A metal-and-glass greenhouse: eight farmers tend 300 indoor slots with metal upkeep."
status = "normal"
enUS = "A metal-and-glass greenhouse: eight farmers tend 300 indoor slots with metal upkeep."
