plPL = "Szklarnia o konstrukcji z desek: czterech rolników uprawia 150 stanowisk wewnątrz, a budynek wymaga okresowej konserwacji z użyciem desek."
ptBR = "Uma estufa com estrutura de tábuas: quatro agricultores cuidam de 150 espaços internos, com manutenção periódica de tábuas."
koKR = "널빤지 골조 온실: 농부 4명이 실내 재배 칸 150개를 관리하며, 주기적으로 널빤지 유지보수가 필요합니다."
csCZ = "Skleník s prkennou konstrukcí: čtyři farmáři pečují o 150 vnitřních políček a pravidelně udržují prkna."
viVN = "Nhà kính khung ván: bốn nông dân chăm sóc 150 ô trồng trong nhà, cần bảo trì định kỳ bằng ván."
