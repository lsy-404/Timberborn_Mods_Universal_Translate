zhTW = "金屬與玻璃溫室：8 名農夫照料 300 個室內種植格，維護時需要金屬。"
ruRU = "Теплица из металла и стекла: восемь фермеров обрабатывают 300 внутренних посадочных мест; для обслуживания требуется металл."
jaJP = "金属とガラスの温室：8人の農家が屋内の300区画を管理し、維持には金属が必要。"
frFR = "Une serre en métal et en verre : huit agriculteurs s’occupent de 300 emplacements intérieurs, avec un coût d’entretien en métal."
deDE = "Ein Gewächshaus aus Metall und Glas: Acht Bauern bewirtschaften 300 Anbauplätze im Innenbereich; der Unterhalt kostet Metall."
plPL = "Szklarnia z metalu i szkła: ośmiu rolników uprawia 300 wewnętrznych stanowisk, a jej konserwacja wymaga metalu."
ptBR = "Uma estufa de metal e vidro: oito agricultores cuidam de 300 espaços internos, e ela exige manutenção com metal."
koKR = "금속과 유리로 된 온실: 농부 8명이 금속 유지비를 들여 실내 재배 칸 300개를 관리합니다."
csCZ = "Skleník z kovu a skla: osm farmářů obhospodařuje 300 vnitřních pěstebních polí; údržba spotřebovává kov."
viVN = "Nhà kính bằng kim loại và kính: tám nông dân chăm sóc 300 ô trồng trong nhà, tiêu tốn kim loại để bảo trì."
trTR = "Metal ve camdan bir sera: sekiz çiftçi, metal bakım maliyetiyle 300 kapalı alan ekim yuvasını işler."

["HDBF.Building.BoxFarm.Top.Description"]
raw = "An industrial farm complex: 16 farmers and 600 indoor slots with grid power and metal upkeep."
status = "normal"
enUS = "An industrial farm complex: 16 farmers and 600 indoor slots with grid power and metal upkeep."
zhCN = "一座工业化农场综合体：可容纳 16 名农夫，提供 600 个室内种植槽位，需要能量网供电并消耗金属维护。"
zhTW = "工業農場綜合設施：可容納 16 名農夫與 600 個室內種植格，需連接動能網供能並消耗金屬維護。"
ruRU = "Промышленный фермерский комплекс: 16 фермеров и 600 мест для выращивания в помещении, с питанием от энергосети и расходом металла на обслуживание."
jaJP = "電力網を利用し、維持に金属を消費する、農家16人・屋内栽培枠600の産業農場複合施設。"
frFR = "Un complexe agricole industriel : 16 agriculteurs et 600 emplacements intérieurs, alimenté par le réseau énergétique et nécessitant un entretien en métal."
deDE = "Ein industrieller Farmkomplex mit 16 Landwirten, 600 Anbauplätzen im Innenbereich, Stromnetzversorgung und Metallunterhalt."
plPL = "Przemysłowy kompleks farm: 16 rolników i 600 miejsc do uprawy w pomieszczeniach, zasilanie z sieci i utrzymanie wymagające metalu."
ptBR = "Um complexo agrícola industrial: 16 agricultores e 600 espaços internos, com energia de rede e manutenção em metal."
koKR = "산업형 농장 단지: 농부 16명과 실내 재배 칸 600개를 갖추고, 전력망 전력과 금속 유지비가 필요합니다."
csCZ = "Průmyslový zemědělský komplex: 16 farmářů a 600 vnitřních míst, s mechanickým pohonem ze sítě a kovem potřebným na údržbu."
viVN = "Một tổ hợp nông trại công nghiệp: 16 nông dân, 600 chỗ trồng trong nhà, cần điện lưới và kim loại để bảo trì."
trTR = "Endüstriyel bir çiftlik kompleksi: 16 çiftçi, 600 iç mekân yuvası, mekanik güç şebekesi ve metal bakım gereksinimi."

