["HDBF.Tooltip.AutoMaintenance"]
status = "normal"
raw = "When enabled the farm pays every overdue upkeep cycle automatically each day at the same material cost as pressing Perform maintenance."
enUS = "When enabled, the farm automatically pays every overdue upkeep cycle each day, at the same material cost as pressing Perform maintenance."
zhCN = "当启用时，农场会每天自动支付所有已逾期的维护周期，所需材料成本与按下“执行维护”相同。"
zhTW = "啟用後，農場會每天自動支付所有逾期的維護週期，所需材料成本與手動按下「執行維護」相同。"
ruRU = "Если эта опция включена, ферма автоматически каждый день оплачивает все просроченные циклы обслуживания по той же стоимости материалов, что и при нажатии «Выполнить обслуживание»."
jaJP = "有効にすると、農場は期限切れのメンテナンス費用を毎日自動的に支払い、「メンテナンスを実行」を押した場合と同じ材料コストがかかります。"
frFR = "Lorsqu'elle est activée, la ferme paie automatiquement chaque jour tous les cycles d'entretien en retard, au même coût en matériaux que lorsqu'on appuie sur « Effectuer l'entretien »."
deDE = "Wenn aktiviert, bezahlt die Farm jeden überfälligen Wartungszyklus jeden Tag automatisch mit denselben Materialkosten wie beim Drücken von „Wartung durchführen\"."
plPL = "Gdy ta opcja jest włączona, farma automatycznie opłaca każdy zaległy cykl konserwacji każdego dnia, zużywając ten sam koszt materiałów, co przy naciśnięciu przycisku „Wykonaj konserwację”."
ptBR = "Quando ativado, a fazenda paga automaticamente todo ciclo de manutenção atrasado diariamente, com o mesmo custo de material de quando se pressiona Realizar manutenção."
koKR = "활성화하면 농장은 기한이 지난 유지 관리 주기를 매일 자동으로 지불하며, 이때의 재료 비용은 '유지 관리 수행'을 눌렀을 때와 같습니다."
trTR = "Etkinleştirildiğinde çiftlik, gecikmiş her bakım döngüsünü her gün otomatik olarak öder; bu işlem, \"Bakımı yap\" düğmesine basmakla aynı malzeme maliyetine sahiptir."
esES = "Cuando está activado, la granja paga automáticamente cada día todos los ciclos de mantenimiento atrasados, con el mismo coste de materiales que al pulsar Realizar mantenimiento."
itIT = "Se attivata, la fattoria paga automaticamente ogni giorno tutti i cicli di manutenzione scaduti, allo stesso costo in materiali di quando si preme \"Esegui manutenzione\"."
ukUA = "Коли увімкнено, ферма щодня автоматично сплачує кожен прострочений цикл обслуговування за тією самою ціною матеріалів, що й натискання «Виконати обслуговування»."
thTH = "เมื่อเปิดใช้งาน ฟาร์มจะชำระค่าบำรุงรักษาที่ค้างชำระทุกรอบโดยอัตโนมัติทุกวัน ในราคาวัสดุเท่ากับการกดปุ่มดำเนินการบำรุงรักษาด้วยตนเอง"
csCZ = "Když je zapnuto, farma každý den automaticky hradí všechny splatné cykly údržby se stejnou materiálovou cenou, jaká je u ručního provedení údržby."
viVN = "Khi được bật, trang trại tự động thanh toán mọi chu kỳ bảo trì quá hạn mỗi ngày, với cùng chi phí vật liệu như khi nhấn Thực hiện bảo trì."
caES = "Quan està activat, la granja paga automàticament cada dia tots els cicles de manteniment vençuts, amb el mateix cost de materials que en prémer Fes manteniment."
beBY = "Калі функцыя ўключана, ферма кожны дзень аўтаматычна аплачвае ўсе пратэрмінаваныя цыклы тэхабслугоўвання з тым жа коштам матэрыялаў, што і пры націсканні «Выканаць тэхабслугоўванне»."
roRO = "Când este activată, ferma plătește automat în fiecare zi fiecare ciclu de întreținere restant, la același cost în materiale ca și la apăsarea butonului Efectuează întreținerea."
huHU = "Ha engedélyezve van, a farm minden napon automatikusan kifizeti a lejárt karbantartási ciklusokat, ugyanannyi nyersanyagköltséggel, mint a Karbantartás elvégzése gomb megnyomásakor."
arSA = "عند التفعيل، تدفع المزرعة تكلفة الصيانة المتأخرة تلقائياً في كل دورة يومياً، بالتكلفة المادية نفسها التي تُدفع عند الضغط على \"تنفيذ الصيانة\"."

