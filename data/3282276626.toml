["KnatteTobbert.Bridge.Description"]
raw = "Allows Path,Shafts and trains between mountains"
status = "normal"
enUS = "Allows paths, shafts, and trains between mountains"
zhCN = "帮助海狸跨过山岭。上面可以铺设道路，或者建造传动轴。"
zhTW = "允許在山脈之間建立小徑、軸和火車。"
ruRU = "Позволяет создавать пути, шахты и перевозки между горами."
jaJP = "山の間に通路、シャフト、列車を許可します。"
frFR = "Permet des chemins, des axes et des trains entre les montagnes"
deDE = "Erlaubt Pfade, Wellen und Züge zwischen Bergen"
plPL = "Pozwala na ścieżki, wały i kolejki między górami"
ptBR = "Permite caminhos, eixos e trilhos entre montanhas"
koKR = "산 사이에 경로, 샤프트 및 기차를 허용합니다."
trTR = "Dağlar arasında Yol, Şaft ve trenlerin geçmesine izin verir"
esES = "Permite caminos, ejes y trenes entre montañas"
itIT = "Consente Percorsi, Alberi di trasmissione e treni tra le montagne"
ukUA = "Дозволяє прокладати шляхи, вали та потяги між горами."
thTH = "อนุญาตให้มีทางเดิน เพลาส่งกำลัง และรถไฟข้ามระหว่างภูเขา"
csCZ = "Umožňuje cesty, hřídele a vlaky mezi horami"
viVN = "Cho phép đường đi, hầm mỏ và tàu chạy giữa các ngọn núi"
caES = "Permet camins, eixos i trens entre muntanyes"
beBY = "Дазваляе пракладваць шляхі, валы і цягнікі паміж горамі"
roRO = "Permite drumuri, arbori de transmisie și trenuri între munți"
huHU = "Lehetővé teszi, hogy utak, tengelyek és vonatok közlekedjenek a hegyek között."
arSA = "يسمح بوجود مسارات وأعمدة نقل وقطارات بين الجبال"

["KnatteTobbert.BridgeF.Description"]
raw = "Allows Path,Shafts and trains between mountains\nComplete bridge with both start and finish"
status = "normal"
enUS = "Allows paths, shafts, and trains between mountains.  \nComplete bridge with both start and finish."
zhCN = "帮助海狸跨过山岭。上面可以铺设道路，或者建造传动轴。<br><color=#FFFF1A>末端可以继续建造钢桥，或者其他建筑。</color>"
zhTW = "允許在山間的路徑、軸和列車\n完整的橋樑，具有起點和終點"
ruRU = "Позволяет прокладывать пути, шахты и поезда между горами. Завершите мост с началом и концом."
jaJP = "山の間に経路、軸、列車を許可します\nスタートとフィニッシュの両方がある完全な橋"
frFR = "Permet des chemins, des axes et des trains entre les montagnes.\nPont complet avec un début et une fin."
deDE = "Ermöglicht Pfade, Wellen und Züge zwischen Bergen. \nVollständige Brücke mit sowohl Start als auch Ziel."
plPL = "Zezwolenia na drogi, wały i tory między górami\nZakończony most z obu stron na początku i na końcu"
ptBR = "Permite caminhos, eixos e trilhos entre montanhas  \nPonte completa com início e fim"
koKR = "산간의 경로, 샤프트 및 기차를 허용합니다.\n시작과 끝이 있는 완전한 다리"
trTR = "Dağlar arasında Yollar, Şaftlar ve trenler için olanak tanır\nBaşlangıç ve bitiş ile tam köprü"
esES = "Permite Caminos, Ejes y trenes entre montañas\nCompleta el puente con inicio y final"
itIT = "Consente a percorsi, alberi di trasmissione e treni di attraversare le montagne\nCompleta il ponte con inizio e fine"
ukUA = "Дозволяє прокладати доріжки, вали та потяги між горами\nПовноцінний міст з початковою і кінцевою точками"
thTH = "ช่วยให้สร้างทางเดิน เพลาส่งกำลัง และรางรถไฟข้ามระหว่างภูเขาได้\nสร้างสะพานให้สมบูรณ์ทั้งจุดเริ่มต้นและจุดสิ้นสุด"
csCZ = "Umožňuje cesty, šachty a vlaky mezi horami\nDokončete most s oběma konci"
viVN = "Cho phép Đường đi, Trục và tàu giữa các ngọn núi. Cầu hoàn chỉnh có cả điểm bắt đầu và kết thúc"
caES = "Permet passos, eixos i trens entre muntanyes\nPont complet amb inici i final"
beBY = "Дазваляе Шляхі, валы і цягнікі паміж гор\nЗавершаны мост з пачаткам і канцом"
roRO = "Permite căi, arbori și trenuri între munți\nCompletează podul cu atât punctul de start, cât și pe cel de sosire"
huHU = "Lehetővé teszi ösvények, tengelyek és vonatok közlekedését hegyek között\nTeljes híd kezdőponttal és végponttal"
arSA = "يسمح بوجود الممرات والأعمدة المتصلة بالعربات بين الجبال\nأكمل الجسر بنقطتي البداية والنهاية"

