["Knatte.SmallGate.Description"]
raw = "Balances goods between the two connected districts. Each side has one worker that distribute goods between the Small Gate and the rest of the district."
status = "normal"
enUS = "Balances goods between the two connected districts. Each side has one worker who distributes goods between the Small Gate and the rest of the district."
zhCN = "平衡两个相连地区之间的货物。每个地区都有自己的劳工，在地区交汇门和地区的其他地方运送物品。"
zhTW = "在兩個相連的區域之間平衡貨物。每一側都有一名工人負責在小門和該區域的其餘部分之間分配貨物。"
ruRU = "Балансирует товары между двумя связанными округами. С каждой стороны есть один работник, который распределяет товары между Маленькими Вратами и остальной частью округа."
jaJP = "2つの接続された地区の間で商品をバランスさせます。各側には、小さなゲートと地区の残りの部分の間で商品を分配する1人の作業者がいます。"
frFR = "Équilibre les marchandises entre les deux districts connectés. Chaque côté a un travailleur qui distribue les biens entre la Petite Porte et le reste du district."
deDE = "Gleicht Waren zwischen den beiden verbundenen Stadtteilen aus. Jede Seite hat einen Arbeiter, der Waren zwischen dem Kleinen Tor und dem Rest des Stadtteils verteilt."
plPL = "Równoważy towary między dwoma połączonymi dzielnicami. Po każdej stronie znajduje się jeden pracownik, który rozdziela towary między Małą Bramą a resztą dzielnicy."
ptBR = "Equilibra os bens entre os dois distritos conectados. Cada lado tem um trabalhador que distribui bens entre o Portão Pequeno e o restante do distrito."
koKR = "연결된 두 구역 간의 물품을 조정합니다. 각 쪽에는 작은 게이트와 나머지 구역 사이에서 물품을 분배하는 직원이 한 명 있습니다."
trTR = "İki bağlı bölge arasında malları dengeler. Her bir tarafta, Küçük Kapı ile bölgenin geri kalanı arasında malları dağıtan bir işçi bulunur."
esES = "Equilibra los bienes entre los dos distritos conectados. Cada lado tiene un trabajador que distribuye los bienes entre la Puerta Pequeña y el resto del distrito."
itIT = "Bilancia i beni tra i due distretti collegati. Ogni lato ha un lavoratore che distribuisce i beni tra il Piccolo Cancello e il resto del distretto."
ukUA = "Балансує товари між двома з'єднаними районами. Кожна сторона має одного робітника, який розподіляє товари між Малими воротами та рештою району."
thTH = "ปรับสมดุลสินค้าระหว่างสองเขตที่เชื่อมต่อกัน แต่ละฝั่งมีคนงานหนึ่งคนที่คอยกระจายสินค้าระหว่างประตูเล็กและส่วนที่เหลือของเขต"
csCZ = "Vyvažuje zboží mezi dvěma připojenými čtvrtěmi. Na každé straně je jeden pracovník, který distribuuje zboží mezi Malou bránou a ostatními částmi čtvrti."
viVN = "Cân bằng hàng hóa giữa hai quận được kết nối. Mỗi bên có một công nhân phân phối hàng hóa giữa Cổng Nhỏ và phần còn lại của quận."
caES = "Equilibra les mercaderies entre els dos districtes connectats. Cada costat té un treballador que distribueix les mercaderies entre la Porta Petita i la resta del districte."
beBY = "Выраўноўвае тавары паміж двума злучанымі раёнамі. Кожны бок мае аднаго працаўніка, які размяркоўвае тавары паміж Малымі варотамі і рэштай раёна."
roRO = "Echilibrează bunurile între cele două districte conectate. Fiecare parte are câte un lucrător care distribuie bunurile între Poarta Mică și restul districtului."
huHU = "Kiegyenlíti az árukat a két összekapcsolt körzet között. Mindkét oldalon egy-egy munkás osztja el az árukat a Kis kapu és a körzet többi része között."
arSA = "توازن البضائع بين المنطقتين المتصلتين. لكل جانب عامل واحد يوزّع البضائع بين البوابة الصغيرة وبقية المنطقة."

["Knatte.SmallGate.FlavorDescription"]
raw = "Basegame item removed from update 4 is reused"
status = "normal"
enUS = "Base game item removed from update 4 is reused."
zhCN = "地区交汇点，你的老祖宗回来了！"
zhTW = "從更新 4 中移除的基礎遊戲物品被重新使用。"
ruRU = "Элемент базовой игры, удаленный в обновлении 4, был повторно использован."
jaJP = "アップデート4から削除された基本ゲームアイテムが再利用されています。"
frFR = "L'objet de base du jeu supprimé dans la mise à jour 4 est réutilisé."
deDE = "Basis-Spielobjekt, das aus Update 4 entfernt wurde, wird wiederverwendet."
plPL = "Elementy bazowej gry usunięte w aktualizacji 4 zostały ponownie wykorzystane."
ptBR = "Item do jogo base removido da atualização 4 é reutilizado."
koKR = "업데이트 4에서 제거된 기본 게임 아이템이 재사용됩니다."
trTR = "4. güncellemeden kaldırılan temel oyun öğesi yeniden kullanıldı"
esES = "El objeto del juego base eliminado en la actualización 4 se reutiliza."
itIT = "Un oggetto del gioco base rimosso con l'aggiornamento 4 viene riutilizzato"
ukUA = "Предмет із базової гри, видалений в оновленні 4, використовується повторно."
