["Knatte.MetalBigPillar.Description"]
raw = "Big metal pillar from old version of game split in multiple pieces so it can be built to any height\nTop piece can have platforms and overhangs inside it"
status = "normal"
enUS = "Big metal pillar from the old version of the game split into multiple pieces so it can be built to any height. The top piece can have platforms and overhangs inside it."
zhCN = "坚固的柱子，根据需要分成了多个结构。<br><color=#FFFF1A>顶部结构可以容纳平台和悬挑的支柱部分。</color>"
zhTW = "大型金屬柱子來自舊版遊戲，分成多個部分，以便可以搭建成任何高度。頂部部分可以內有平台和懸臂。"
ruRU = "Большая металлическая колонна из старой версии игры разделена на несколько частей, чтобы её можно было собрать на любую высоту. Верхняя часть может иметь платформы и навесы внутри."
jaJP = "古いバージョンのゲームからの大きな金属の柱が複数の部分に分かれ、高さを自由に変えられるようになっています。上部の部分にはプラットフォームやオーバーハングを設置することができます。"
frFR = "Gros pilier en métal de l'ancienne version du jeu, divisé en plusieurs morceaux pour pouvoir être construit à n'importe quelle hauteur. La pièce supérieure peut avoir des plateformes et des saillies à l'intérieur."
deDE = "Großer Metallpfeiler aus der alten Version des Spiels, der in mehrere Stücke zerlegt ist, sodass er auf jede Höhe gebaut werden kann. Das oberste Stück kann Plattformen und Überhänge darin haben."
plPL = "Duży metalowy słup z starej wersji gry podzielony na wiele części, aby można go było zbudować na dowolną wysokość. Górna część może mieć platformy i występy wewnątrz."
ptBR = "Grande pilar de metal da versão antiga do jogo dividido em várias peças para ser montado em qualquer altura. A peça superior pode ter plataformas e saliências dentro dela."
koKR = "구식 게임에서 여러 조각으로 나뉜 큰 금속 기둥으로, 원하는 높이로 건설할 수 있습니다. 상단 조각에는 플랫폼과 돌출부를 설치할 수 있습니다."
trTR = "Eski versiyonundan alınmış büyük metal direk, istediği yüksekliğe inşa edilebilmesi için birden fazla parçaya bölünmüştür. Üst parçasında platformlar ve çıkıntılar bulunabilir."
esES = "Gran pilar de metal de una versión anterior del juego, dividido en varias piezas para poder construirlo a cualquier altura.\nLa pieza superior puede tener plataformas y voladizos en su interior."
itIT = "Grande pilastro di metallo dalla vecchia versione del gioco, diviso in più parti così da poter essere costruito a qualsiasi altezza\nLa parte superiore può avere piattaforme e sporgenze al suo interno"
ukUA = "Велика металева колона зі старої версії гри, поділена на кілька частин, тож її можна звести на будь-яку висоту.\nВерхня частина може мати платформи та навіси всередині себе."
thTH = "เสาโลหะขนาดใหญ่จากเวอร์ชันเก่าของเกม ถูกแบ่งออกเป็นหลายชิ้นส่วน เพื่อให้สามารถสร้างให้สูงเท่าไรก็ได้\nชิ้นส่วนด้านบนสามารถมีแพลตฟอร์มและส่วนยื่นอยู่ภายในได้"
csCZ = "Velký kovový sloup z staré verze hry rozdělený na několik kusů, takže lze postavit do libovolné výšky. Horní část může mít platformy a přesahy uvnitř."
viVN = "Cột kim loại lớn từ phiên bản cũ của trò chơi được chia thành nhiều phần để có thể xây dựng ở mọi chiều cao\nPhần ở trên cùng có thể chứa các sàn và các phần nhô ra ở bên trong nó"
caES = "Gran pilar metàl·lic de l'antiga versió del joc, dividit en diverses peces perquè es pugui construir a qualsevol alçada.\nLa peça superior pot tenir plataformes i voladissos a l'interior."
beBY = "Вялікі металічны слуп са старой версіі гульні, падзелены на некалькі частак, каб яго можна было будаваць на любую вышыню.\nВерхняя частка можа мець платформы і навісы ўнутры."
roRO = "Stâlp metalic mare din versiunea veche a jocului, împărțit în mai multe piese, astfel încât să poată fi construit la orice înălțime.\nPiesa de sus poate avea platforme și elemente în consolă în interiorul ei."
huHU = "Nagy fémoszlop a játék régi verziójából, több darabra osztva, így bármilyen magasságra építhető.\nA felső darabba platformok és túlnyúló részek építhetők."
arSA = "عمود معدني كبير من نسخة قديمة من اللعبة، مقسّم إلى عدة أجزاء بحيث يمكن بناؤه بأي ارتفاع.\nيمكن أن يحتوي الجزء العلوي على منصات وأجزاء بارزة داخله."

