csCZ = "Víš, jak těžké je modelovat a texturovat? - KnatteAnka"
viVN = "Bạn có biết khó khăn đến mức nào khi mô hình hóa và tạo kết cấu không? - KnatteAnka"
caES = "Saps tu com de difícil és modelar i texturitzar? - KnatteAnka"
