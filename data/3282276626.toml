["Knatte.Aque_MetalBigPillar.Description"]
raw = "Big metal pillar from old version of game split in multiple pieces so it can be built to any height\nTop piece can have platforms and overhangs inside it"
status = "abandoned"
enUS = "Big metal pillar from the old version of the game split into multiple pieces so it can be built to any height. The top piece can have platforms and overhangs inside it."
zhCN = "坚固的柱子，根据需要分成了多个结构。使用了水渠材质。<br><color=#FFFF1A>顶部结构可以容纳平台和悬挑的支柱部分。</color><br><color=#FFA500>水渠在 Water Extention 模组内。</color>"
zhTW = "大型金屬柱子來自舊版遊戲，分成多個部分，可以建造成任何高度。頂部部分可以有平台和懸臂在裡面。"
ruRU = "Большая металлическая колонна из старой версии игры разбита на несколько частей, чтобы ее можно было построить на любую высоту. Верхняя часть может иметь платформы и навесы внутри."
jaJP = "古いバージョンのゲームの大きな金属の柱がいくつかの部分に分かれており、任意の高さに構築できるようになっています。上部の部分にはプラットフォームや突き出しが含まれることができます。"
frFR = "Gros pilier en métal de l'ancienne version du jeu, divisé en plusieurs morceaux pour pouvoir être construit à n'importe quelle hauteur. La pièce supérieure peut avoir des plateformes et des débordements à l'intérieur."
deDE = "Großer Metallpfeiler aus der alten Version des Spiels, der in mehrere Stücke zerlegt ist, damit er in jede Höhe gebaut werden kann. Das obere Stück kann Plattformen und Überhänge im Inneren haben."
plPL = "Duży metalowy słup z starej wersji gry podzielony na wiele kawałków, aby można było zbudować go na dowolną wysokość. Górny kawałek może mieć platformy i wysunięcia wewnątrz."
ptBR = "Grande pilar de metal da versão antiga do jogo dividido em várias peças para que possa ser construído em qualquer altura. A peça superior pode ter plataformas e saliências dentro dela."
koKR = "구버전의 게임에서 여러 조각으로 나뉘어진 큰 금속 기둥으로, 원하는 높이로 건설할 수 있습니다. 상단 조각에는 플랫폼과 돌출부를 설치할 수 있습니다."
trTR = "Eski sürümden gelen büyük metal dikme, her yüksekliğe inşa edilebilmesi için birden fazla parçaya bölünmüştür. Üst parçasında platformlar ve çıkıntılar olabilir."
esES = "Gran pilar metálico de una versión antigua del juego, dividido en varias piezas para poder construirlo a cualquier altura.\nLa pieza superior puede tener plataformas y voladizos en su interior."
itIT = "Grande pilastro di metallo della vecchia versione del gioco, diviso in più parti così da poter essere costruito fino a qualsiasi altezza.\nLa parte superiore può contenere piattaforme e sporgenze al suo interno."
ukUA = "Велика металева опора зі старої версії гри, розділена на кілька частин, тож її можна побудувати на будь-яку висоту\nВерхня частина може мати платформи та навіси всередині"
thTH = "เสาโลหะขนาดใหญ่จากเวอร์ชันเก่าของเกม ถูกแบ่งออกเป็นหลายชิ้นเพื่อให้สามารถสร้างได้ที่ความสูงใดก็ได้\nชิ้นส่วนด้านบนสามารถมีแพลตฟอร์มและส่วนยื่นอยู่ภายในได้"
csCZ = "Velký kovový sloup z staré verze hry rozdělený na více kusů, takže může být postaven do libovolné výšky. Horní kus může mít platformy a převisy uvnitř."
viVN = "Trụ kim loại lớn từ phiên bản cũ của trò chơi được chia thành nhiều mảnh để có thể xây cao ở bất kỳ độ cao nào\nPhần trên cùng có thể có các nền và các phần nhô ra bên trong nó"
caES = "Gran pilar metàl·lic de la versió antiga del joc, dividit en diverses peces perquè es pugui construir a qualsevol alçada.\nLa peça superior pot tenir plataformes i voladissos a l'interior."
beBY = "Вялікі металічны слуп са старой версіі гульні, падзелены на некалькі частак, каб яго можна было ўзводзіць на любую вышыню.\nВерхняя частка можа ўтрымліваць платформы і навісы ўнутры."
roRO = "Stâlp metalic mare din versiunea veche a jocului, împărțit în mai multe piese, astfel încât să poată fi construit la orice înălțime.\nPiesa de sus poate avea platforme și elemente în consolă în interiorul ei."
huHU = "Nagy fémoszlop a játék régi verziójából, több darabra osztva, így tetszőleges magasságúra építhető.\nA felső darabba platformok és túlnyúló részek építhetők."
arSA = "بعمود معدني كبير من نسخة قديمة من اللعبة، مقسّم إلى عدة قطع بحيث يمكن بناؤه بأي ارتفاع\nيمكن أن تحتوي القطعة العلوية على منصات وبروزات داخلها"

