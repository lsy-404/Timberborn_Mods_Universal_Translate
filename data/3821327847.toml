["Building.Wetland.Description"]
raw = "A marshy patch of ground. Place on land or underwater. Paths sit on top; crops and trees that grow in one tile of water can grow here."
status = "normal"
enUS = "A marshy patch of ground. Place it on land or underwater. Paths sit on top; crops and trees that grow in one tile of water can grow here."
zhCN = "一片沼泽地。可建在陆地或水下。道路建在其顶部；能在一格深的水中生长的作物和树木也能在这里生长。"
zhTW = "一片沼澤地。可放置於陸地或水下。道路會鋪在上方；能在一格深的水中生長的作物和樹木，也能在此生長。"
ruRU = "Заболоченный участок земли. Можно разместить на суше или под водой. Поверх него можно прокладывать пути; здесь могут расти культуры и деревья, которым достаточно одного тайла воды."
jaJP = "沼地の地面。陸上または水中に設置できます。上に道を敷けます。1タイル分の水で育つ作物や木をここで育てられます。"
frFR = "Une parcelle de terre marécageuse. Peut être placée sur la terre ferme ou sous l’eau. Les chemins se trouvent au-dessus ; les cultures et les arbres qui poussent dans un carreau d’eau peuvent y pousser."
deDE = "Ein sumpfiges Stück Land. Kann an Land oder unter Wasser platziert werden. Wege verlaufen obenauf; Feldfrüchte und Bäume, die in einem Feld mit Wasser wachsen, können hier gedeihen."
plPL = "Podmokły skrawek ziemi. Można go umieścić na lądzie lub pod wodą. Ścieżki znajdują się na wierzchu; mogą tu rosnąć uprawy i drzewa, które rosną w jednym polu wody."
ptBR = "Um terreno pantanoso. Pode ser colocado em terra ou debaixo d’água. Caminhos ficam por cima; plantações e árvores que crescem em um bloco de água podem crescer aqui."
koKR = "늪지대 지형입니다. 지상이나 물속에 배치할 수 있습니다. 위에 길을 놓을 수 있으며, 물 한 타일에서 자라는 작물과 나무도 이곳에서 자랄 수 있습니다."
trTR = "Bataklık bir arazi parçası. Karaya veya su altına yerleştirilebilir. Yollar üstüne döşenir; 1 birim derinliğindeki suda yetişebilen ekinler ve ağaçlar burada da yetişebilir."
esES = "Un terreno pantanoso. Colócalo en tierra firme o bajo el agua. Los caminos se sitúan encima; los cultivos y árboles que crecen en una casilla de agua pueden crecer aquí."
itIT = "Un terreno paludoso. Da collocare su terraferma o sott'acqua. I sentieri si trovano sopra; colture e alberi che crescono in una casella d'acqua possono crescere anche qui."
ukUA = "Болотиста ділянка землі. Розміщується на суші або під водою. Доріжки розташовуються поверх; культури та дерева, що ростуть на одній клітинці води, можуть рости тут."
thTH = "พื้นที่ดินชุ่มน้ำที่เป็นหล่มโคลน วางบนพื้นดินหรือใต้น้ำก็ได้ ทางเดินจะอยู่บนพื้นผิว ส่วนพืชและต้นไม้ที่เติบโตได้ในช่องน้ำหนึ่งช่อง ก็สามารถเติบโตที่นี่ได้เช่นกัน"
csCZ = "Bažinatý kus půdy. Lze umístit na souši i pod vodou. Cesty vedou po povrchu; mohou zde růst plodiny a stromy, které rostou na jednom políčku vody."
viVN = "Một khoảnh đất lầy lội. Có thể đặt trên đất liền hoặc dưới nước. Đường đi nằm phía trên; cây trồng và cây cối có thể sinh trưởng trong một ô nước có thể mọc ở đây."
caES = "Una zona pantanosa de terreny. Es pot col·locar sobre terra o sota l'aigua. Els camins es troben a sobre; els cultius i arbres que creixen en una casella d'aigua també poden créixer aquí."
beBY = "Багністая ўчастка зямлі. Размяшчаецца на суше або пад вадой. Сцежкі размяшчаюцца зверху; культуры і дрэвы, якія растуць на адной клетцы вады, могуць расці і тут."
roRO = "Un teren mlăștinos. Se poate amplasa pe uscat sau sub apă. Căile sunt amplasate deasupra; culturile și copacii care cresc pe o pătrățică de apă pot crește aici."
huHU = "Mocsaras talajfelszín. Szárazföldre vagy víz alá is építhető. Az utak a tetején helyezkednek el; a víz egy csempéjében növő növények és fák itt is nőhetnek."
arSA = "أرض رطبة مستنقعية. تُبنى على اليابسة أو تحت الماء. تُقام الممرات فوقها، ويمكن للمحاصيل والأشجار التي تنمو في بلاطة واحدة من الماء أن تنمو هنا."

["Building.Wetland.FlavorDescription"]
raw = "The grass grows long where the water never quite leaves."
status = "normal"
enUS = "The grass grows long where the water never quite leaves."
zhCN = "水流经久不退之处，草木便会疯长。"
zhTW = "水從不完全退去的地方，草就長得茂盛。"
ruRU = "Там, где вода никак не уходит до конца, трава вырастает высокой."
jaJP = "水が完全には引かない場所では、草が長く伸びる。"
frFR = "L’herbe pousse haut là où l’eau ne se retire jamais tout à fait."
deDE = "Das Gras wächst lang an Orten, an denen das Wasser nie ganz verschwindet."
plPL = "Trawa rośnie bujnie tam, gdzie woda nigdy całkiem nie ustępuje."
ptBR = "A grama cresce alta onde a água nunca chega a desaparecer por completo."
koKR = "물이 완전히 마르지 않는 곳에는 풀이 길게 자랍니다."
trTR = "Suyun hiçbir zaman tam olarak çekilmediği yerlerde otlar uzun uzar."
esES = "La hierba crece alta donde el agua nunca termina de retirarse."
itIT = "L'erba cresce alta dove l'acqua non se ne va mai del tutto."
ukUA = "Трава росте високо там, де вода ніколи до кінця не відступає."
thTH = "หญ้าขึ้นสูงเป็นพง ณ จุดที่น้ำไม่เคยหายไปไหนจนหมด"
csCZ = "Tráva roste vysoko tam, kde voda nikdy úplně neopadá."
viVN = "Cỏ mọc cao ở nơi nước chẳng bao giờ rút hẳn."
caES = "L'herba creix alta allà on l'aigua mai no acaba de marxar."
beBY = "Трава расце высокай там, дзе вада ніколі да канца не сыходзіць."
roRO = "Iarba crește lungă acolo unde apa nu pleacă niciodată de tot."
huHU = "A fű hosszúra nő ott, ahol a víz soha egészen nem tűnik el."
arSA = "ينمو العشب طويلاً حيث لا يغادر الماء المكان أبداً تماماً."

