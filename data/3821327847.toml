raw = "The grass grows long where the water never quite leaves."
status = "normal"
enUS = "The grass grows long where the water never quite leaves."
zhCN = "水流经久不退之处，草木便会疯长。"
zhTW = "水從不完全退去的地方，草就長得茂盛。"
ruRU = "Там, где вода никак не уходит до конца, трава вырастает высокой."
jaJP = "水が完全には引かない場所では、草が長く伸びる。"
frFR = "L’herbe pousse haut là où l’eau ne se retire jamais tout à fait."
deDE = "Das Gras wächst lang an Orten, an denen das Wasser nie ganz verschwindet."
plPL = "Trawa rośnie bujnie tam, gdzie woda nigdy całkiem nie ustępuje."
ptBR = "A grama cresce alta onde a água nunca chega a desaparecer por completo."
koKR = "물이 완전히 마르지 않는 곳에는 풀이 길게 자랍니다."
csCZ = "Tráva roste vysoko tam, kde voda nikdy úplně neopadá."
viVN = "Cỏ mọc cao ở nơi nước chẳng bao giờ rút hẳn."
trTR = "Suyun hiçbir zaman tam olarak çekilmediği yerlerde otlar uzun uzar."

