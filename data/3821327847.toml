["Building.Wetland.Description"]
raw = "A marshy patch of ground. Place on land or underwater. Paths sit on top; crops and trees that grow in one tile of water can grow here."
status = "normal"
enUS = "A marshy patch of ground. Place it on land or underwater. Paths sit on top; crops and trees that grow in one tile of water can grow here."
zhCN = "一片沼泽地。可建在陆地或水下。道路建在其顶部；能在一格深的水中生长的作物和树木也能在这里生长。"
zhTW = "一片沼澤地。可放置於陸地或水下。道路會鋪在上方；能在一格深的水中生長的作物和樹木，也能在此生長。"
ruRU = "Заболоченный участок земли. Можно разместить на суше или под водой. Поверх него можно прокладывать пути; здесь могут расти культуры и деревья, которым достаточно одного тайла воды."
jaJP = "沼地の地面。陸上または水中に設置できます。上に道を敷けます。1タイル分の水で育つ作物や木をここで育てられます。"
frFR = "Une parcelle de terre marécageuse. Peut être placée sur la terre ferme ou sous l’eau. Les chemins se trouvent au-dessus ; les cultures et les arbres qui poussent dans un carreau d’eau peuvent y pousser."
deDE = "Ein sumpfiges Stück Land. Kann an Land oder unter Wasser platziert werden. Wege verlaufen obenauf; Feldfrüchte und Bäume, die in einem Feld mit Wasser wachsen, können hier gedeihen."
plPL = "Podmokły skrawek ziemi. Można go umieścić na lądzie lub pod wodą. Ścieżki znajdują się na wierzchu; mogą tu rosnąć uprawy i drzewa, które rosną w jednym polu wody."
ptBR = "Um terreno pantanoso. Pode ser colocado em terra ou debaixo d’água. Caminhos ficam por cima; plantações e árvores que crescem em um bloco de água podem crescer aqui."
koKR = "늪지대 지형입니다. 지상이나 물속에 배치할 수 있습니다. 위에 길을 놓을 수 있으며, 물 한 타일에서 자라는 작물과 나무도 이곳에서 자랄 수 있습니다."
csCZ = "Bažinatý kus půdy. Lze umístit na souši i pod vodou. Cesty vedou po povrchu; mohou zde růst plodiny a stromy, které rostou na jednom políčku vody."
viVN = "Một khoảnh đất lầy lội. Có thể đặt trên đất liền hoặc dưới nước. Đường đi nằm phía trên; cây trồng và cây cối có thể sinh trưởng trong một ô nước có thể mọc ở đây."
trTR = "Bataklık bir arazi parçası. Karaya veya su altına yerleştirilebilir. Yollar üstüne döşenir; 1 birim derinliğindeki suda yetişebilen ekinler ve ağaçlar burada da yetişebilir."

