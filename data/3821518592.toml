["Building.AdvancedPumps.ElevatorStop.Description"]
raw = "Landing for the 1x1 elevator. One fixed, rotatable path entrance. Beavers call the car and wait in assigned spaces."
status = "normal"
enUS = "Landing for the 1x1 elevator. One fixed, rotatable path entrance. Beavers call the car and wait in assigned spaces."
zhCN = "1x1 电梯的停靠站。一个固定且可旋转的路径入口。海狸会呼叫电梯轿厢，并在指定位置等候。"
zhTW = "1x1 電梯的停靠點。固定式、可旋轉的道路入口。海狸會呼叫電梯車廂，並在指定位置等候。"
ruRU = "Площадка для лифта 1x1. Один неподвижный, но поворачиваемый вход с дорожки. Бобры вызывают кабину и ждут на отведённых местах."
jaJP = "1x1エレベーター用の乗り場。固定式で回転可能な通路の入口が1つあります。ビーバーはエレベーターを呼び、割り当てられたスペースで待ちます。"
frFR = "Palier pour l’ascenseur 1x1. Une entrée de chemin fixe et orientable. Les castors appellent la cabine et attendent dans les emplacements attribués."
deDE = "Podest für den 1x1-Aufzug. Ein fester, drehbarer Wegeingang. Biber rufen den Aufzug und warten auf den zugewiesenen Plätzen."
plPL = "Przystanek windy 1x1. Jedno stałe, obracane wejście na ścieżkę. Bobry przywołują kabinę i czekają w wyznaczonych miejscach."
ptBR = "Plataforma de desembarque para o elevador 1x1. Uma entrada fixa e giratória para caminhos. Os castores chamam a cabine e aguardam nos espaços designados."
koKR = "1x1 엘리베이터용 승강장입니다. 고정된 회전식 통로 입구 하나가 있습니다. 비버들은 승강기를 호출하고 지정된 공간에서 기다립니다."
trTR = "1x1 asansör için iniş platformu. Sabit, döndürülebilir bir yol girişi. Kunduzlar asansör kabinini çağırır ve kendilerine ayrılan alanlarda bekler."
esES = "Parada del ascensor 1x1. Una entrada fija para caminos que puede girarse. Los castores llaman a la cabina y esperan en espacios asignados."
itIT = "Fermata per l'ascensore 1x1. Un unico punto d'accesso fisso al percorso, orientabile. I castori chiamano la cabina e attendono negli spazi assegnati."
ukUA = "Посадкова платформа для ліфта 1x1. Один нерухомий, поворотний вхід із шляху. Бобри викликають кабіну та чекають у відведених місцях."
thTH = "ชานจอดสำหรับลิฟต์ขนาด 1x1 มีทางเข้าสำหรับเส้นทางเดินที่ตายตัวหนึ่งจุดซึ่งสามารถหมุนได้ บีเวอร์เรียกลิฟต์และรอในช่องที่กำหนดไว้"
csCZ = "Nástupiště pro výtah 1×1. Jeden pevný, otočitelný vstup na cestu. Bobři přivolají kabinu a čekají na přidělených místech."
viVN = "Sàn chờ cho thang máy 1x1. Lối vào đường đi cố định, có thể xoay. Hải ly gọi cabin và chờ tại các chỗ được chỉ định."
caES = "Replanta per a l'ascensor 1x1. Una entrada de camí fixa i rotable. Els castors criden la cabina i esperen en espais assignats."
beBY = "Пасадачная пляцоўка для ліфта 1x1. Адзін нерухомы паваротны ўваход для шляху. Бабры выклікаюць кабіну і чакаюць у прызначаných месцах."
roRO = "Debarcaderul pentru liftul 1x1. Are o singură intrare fixă pe traseu, care poate fi rotită. Castorii cheamă cabina și așteaptă în spațiile alocate."
huHU = "Az 1x1-es lift emeleti állomása. Egy rögzített, forgatható járóút-bejárat. A bobrok hívják a kabint, és a kijelölt helyeken várakoznak."
arSA = "مَحطّة للمصعد بحجم 1×1. مدخل واحد ثابت للمسار يمكن تدويره. يستدعي البيفرز المصعد وينتظرون في أماكن مخصصة لهم."

