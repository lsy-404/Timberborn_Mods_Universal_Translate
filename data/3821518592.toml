["Building.AdvancedPumps.PipeSegmentGlass.Description"]
status = "normal"
raw = "Same as the Conduit, but with a transparent shell so the water shows while it flows (shows murky if a pump is drawing contaminated water)."
enUS = "Same as the Conduit, but with a transparent shell so the water is visible as it flows (it looks murky if a pump is drawing contaminated water)."
zhCN = "与管道相同，但外壳透明，可以看到水流动（如果水泵抽取的是受污染的水，则会显示浑浊）。"
zhTW = "與導水管相同，但外殼透明，水流經時清晰可見（若抽水機抽取的是受污染的水，則會顯示混濁）。"
ruRU = "То же, что и трубопровод, но с прозрачной оболочкой, сквозь которую видно текущую воду (если насос качает загрязнённую воду, она выглядит мутной)."
jaJP = "導水管と同じですが、透明な外殻になっているため、水が流れる様子が見えます（ポンプが汚染された水を汲み上げている場合は、濁って見えます）。"
frFR = "Identique au conduit, mais avec une paroi transparente qui laisse voir l’eau lorsqu’elle s’écoule (elle apparaît trouble si une pompe aspire de l’eau contaminée)."
deDE = "Wie der Wasserkanal, aber mit einer durchsichtigen Hülle, durch die das fließende Wasser zu sehen ist (wird trüb angezeigt, wenn eine Pumpe verunreinigtes Wasser ansaugt)."
plPL = "Działa tak samo jak Przewód, ale ma przezroczystą obudowę, dzięki czemu widać przepływającą wodę (staje się mętna, gdy pompa pobiera skażoną wodę)."
ptBR = "Igual ao Conduto, mas com uma estrutura transparente que permite ver a água enquanto ela flui (fica turva se uma bomba estiver puxando água contaminada)."
koKR = "도관과 같지만 투명한 외벽으로 물이 흐르는 모습이 보입니다(펌프가 오염된 물을 끌어올리면 탁하게 보입니다)."
csCZ = "Stejný jako kanál, ale s průhledným pláštěm, takže je vidět voda, když jím protéká (při čerpání kontaminované vody se zobrazuje kalná)."
viVN = "Giống như Ống dẫn, nhưng có vỏ trong suốt để nhìn thấy nước khi chảy qua (nước sẽ hiện đục nếu máy bơm đang hút nước ô nhiễm)."
trTR = "İletken ile aynıdır, ancak su akarken görünmesini sağlayan şeffaf bir dış yüzeye sahiptir (pompa kirli su çekiyorsa su bulanık görünür)."

