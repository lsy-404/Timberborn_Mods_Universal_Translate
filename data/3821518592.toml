["Building.AdvancedPumps.WaterPump.Description"]
status = "normal"
raw = "Draws water through an automatically extending intake pipe and feeds connected water pipes. Set output from 0–10 in the building panel; power use scales with output from 0–450 hp. Surplus water leaves at open pipe ends after connected tanks are filled."
enUS = "Draws water through an automatically extending intake pipe and feeds connected water pipes. Set the output from 0–10 in the building panel; power use scales with the output from 0–450 hp. Surplus water exits through open pipe ends after connected tanks are filled."
zhCN = "通过自动延伸的进水管抽水，并向相连的水管供水。在建筑面板中将输出设为 0–10；耗电量会随输出从 0–450 hp 变化。相连的水箱装满后，多余的水会从开放的管道末端流出。"
zhTW = "透過會自動延伸的進水管抽水，並供水給相連的水管。在建築面板中將輸出設為 0–10；耗電量會隨輸出在 0–450 hp 之間變化。相連的水槽裝滿後，多餘的水會從開放的管口流出。"
ruRU = "Забирает воду через автоматически выдвигаемую заборную трубу и подаёт её в подключённые водопроводы. Задайте производительность от 0 до 10 в панели здания; потребление энергии зависит от производительности и составляет от 0 до 450 hp. Излишки воды вытекают через открытые концы труб после заполнения подключённых резервуаров."
jaJP = "自動で伸長する取水管を通じて水を汲み上げ、接続された水道管に供給します。建物パネルで出力を0～10に設定できます。電力消費量は出力に応じて0～450 hpの範囲で変化します。接続されたタンクが満水になると、余剰の水は開いた管端から流れ出ます。"
frFR = "Aspire de l’eau par un tuyau d’admission qui s’allonge automatiquement et alimente les tuyaux connectés. Réglez le débit de 0 à 10 dans le panneau du bâtiment ; la consommation d’énergie varie en fonction du débit, de 0 à 450 hp. L’eau excédentaire s’écoule par les extrémités ouvertes des tuyaux une fois les réservoirs connectés remplis."
deDE = "Zieht Wasser durch ein sich automatisch verlängerndes Ansaugrohr und speist angeschlossene Wasserrohre. Stelle den Ausstoß im Gebäudefenster auf 0–10 ein; der Stromverbrauch steigt proportional zum Ausstoß von 0–450 hp. Überschüssiges Wasser tritt an offenen Rohrenden aus, sobald angeschlossene Tanks gefüllt sind."
plPL = "Pobiera wodę przez automatycznie wydłużającą się rurę wlotową i doprowadza ją do podłączonych rur wodnych. Ustaw wydajność w zakresie 0–10 w panelu budynku; zużycie mocy rośnie wraz z wydajnością, od 0 do 450 hp. Nadmiar wody wypływa przez otwarte końce rur po napełnieniu podłączonych zbiorników."
ptBR = "Puxa água por um tubo de captação que se estende automaticamente e abastece os canos de água conectados. Ajuste a saída de 0–10 no painel do edifício; o consumo de energia varia conforme a saída, de 0–450 hp. O excesso de água sai pelas extremidades abertas dos canos depois que os tanques conectados estiverem cheios."
koKR = "자동으로 늘어나는 취수관을 통해 물을 끌어와 연결된 수도관에 공급합니다. 건물 패널에서 출력을 0–10으로 설정하세요. 전력 소비량은 출력에 따라 0–450 hp까지 증가합니다. 연결된 탱크가 가득 차면 남는 물은 열린 관 끝으로 흘러나갑니다."
csCZ = "Čerpá vodu pomocí automaticky prodlužované sací trubky a dodává ji do připojených vodovodních trubek. Výstup nastavte v panelu budovy v rozmezí 0–10; spotřeba energie se podle něj mění v rozmezí 0–450 hp. Přebytečná voda odtéká otevřenými konci trubek, jakmile se naplní připojené nádrže."
viVN = "Hút nước qua ống lấy nước tự động kéo dài và cấp nước vào các đường ống nước được kết nối. Đặt lưu lượng đầu ra từ 0–10 trong bảng điều khiển công trình; mức tiêu thụ điện năng tăng theo lưu lượng đầu ra, từ 0–450 hp. Nước dư sẽ thoát ra ở các đầu ống hở sau khi các bể chứa được kết nối đã đầy."
trTR = "Otomatik olarak uzayan bir emiş borusuyla su çeker ve bağlı su borularına besler. Bina panelinden çıkışı 0–10 arasında ayarlayın; güç tüketimi, çıkışa bağlı olarak 0–450 hp arasında değişir. Bağlı tanklar dolduktan sonra fazla su, açık boru uçlarından dışarı akar."

