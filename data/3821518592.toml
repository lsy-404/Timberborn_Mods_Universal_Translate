zhCN = "可堆叠的垂直水管。将其堆叠成管柱，可将水输送到不同高度；每一层都可连接水平水渠。"
zhTW = "可堆疊的垂直水管。將多個水管堆疊成管柱，便能將水輸送至不同高度；每一層都可連接水平導管。"
ruRU = "Вертикальная водопроводная труба, которую можно ставить друг на друга. Складывайте их в колонну, чтобы подавать воду вверх или вниз между уровнями; на каждом уровне труба соединяется с горизонтальными каналами."
jaJP = "積み重ね可能な垂直水道管。縦に積んで水を上下の階層へ運び、各階層で水平水路に接続します。"
frFR = "Une conduite d’eau verticale empilable. Empilez-les en colonne pour acheminer l’eau vers des niveaux supérieurs ou inférieurs ; elle se raccorde aux conduites horizontales à chaque niveau."
deDE = "Ein stapelbares vertikales Wasserrohr. Staple sie zu einer Säule, um Wasser zwischen Ebenen nach oben oder unten zu leiten; verbindet sich auf jeder Ebene mit horizontalen Leitungen."
plPL = "Modułowa pionowa rura wodna. Łącz je w kolumnę, aby transportować wodę między poziomami w górę lub w dół; na każdym poziomie łączy się z poziomymi przewodami."
ptBR = "Um cano vertical de água empilhável. Empilhe-os em uma coluna para transportar água entre níveis; conecta-se a canais horizontais em todos os níveis."
koKR = "쌓을 수 있는 수직 수도관입니다. 여러 개를 쌓아 기둥을 만들면 물을 위층이나 아래층으로 운반할 수 있으며, 모든 층에서 수평 도관과 연결됩니다."
csCZ = "Stohovatelná svislá vodní trubka. Stohujte je do sloupce a veďte jimi vodu mezi úrovněmi nahoru nebo dolů; na každé úrovni se napojují na vodorovná potrubí."
viVN = "Một đường ống nước thẳng đứng có thể xếp chồng. Xếp chúng thành cột để dẫn nước lên hoặc xuống giữa các tầng; kết nối với các đường dẫn nước nằm ngang ở mọi tầng."
trTR = "Üst üste dizilebilen dikey su borusu. Suyu katlar arasında yukarı veya aşağı taşımak için boruları bir sütun hâlinde üst üste dizin; her katta yatay su kanallarına bağlanır."

