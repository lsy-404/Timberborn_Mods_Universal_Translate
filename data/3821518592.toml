["Building.AdvancedPumps.ItemStation.Description"]
status = "normal"
raw = "Pick one packed good. Haulers fill this station and the item network ships the good to connected Delivery Stations; it never lets haulers carry it back out. If every delivery is full it stockpiles here until room frees. Stands against a warehouse or workshop output to pull straight from it, no hauler trip."
enUS = "Choose one packed good. Haulers fill this station, and the item network ships the good to connected Delivery Stations; haulers can never carry it back out. If all deliveries are full, it stockpiles goods here until space becomes available. Place it against a warehouse or workshop output to pull goods directly, without a hauler trip."
zhCN = "选择一种已打包货物。搬运工会将这座货站装满，物品网络会把货物运送到相连的配送站；搬运工无法将货物从这里搬走。若所有配送站都已满，货物会暂存在这里，直到腾出空间。将其紧靠仓库或工坊的输出端放置，即可直接从中取货，无需搬运工往返。"
zhTW = "選擇一種包裝貨物。搬運工會將此站填滿，物品網路會把貨物運送至連接的配送站；搬運工無法將貨物從此站取回。若所有配送站都滿了，貨物便會暫存於此，直到有空間為止。將此站緊靠倉庫或工坊的輸出端建造，即可直接從中取貨，無須搬運工往返。"
ruRU = "Выберите один упакованный товар. Грузчики заполняют эту станцию, а сеть предметов отправляет товар в подключённые станции доставки; грузчики не могут забрать его обратно. Если все станции доставки заполнены, товар складируется здесь, пока не освободится место. Установите станцию вплотную к выходу склада или мастерской, чтобы товар поступал напрямую, без участия грузчиков."
jaJP = "梱包された物資を1種類選択してください。運搬人がこのステーションに物資を補充し、アイテムネットワークが接続された配送ステーションへ物資を運びます。運搬人が物資を持ち出すことはできません。すべての配送先が満杯の場合、空きができるまでここに備蓄されます。倉庫や作業場の出力口に隣接させると、運搬人を介さずに直接物資を取り込みます。"
frFR = "Choisissez un bien conditionné. Les transporteurs approvisionnent cette station, puis le réseau d’objets achemine le bien vers les stations de livraison connectées ; les transporteurs ne peuvent jamais l’emporter. Si toutes les stations de livraison sont pleines, le bien est stocké ici jusqu’à ce qu’une place se libère. Se place contre la sortie d’un entrepôt ou d’un atelier pour en prélever directement les biens, sans trajet de transporteur."
deDE = "Wähle eine verpackte Ware aus. Träger füllen diese Station, und das Warennetzwerk transportiert die Ware zu verbundenen Lieferstationen; Träger können sie nicht wieder herausnehmen. Sind alle Lieferungen voll, wird die Ware hier gelagert, bis wieder Platz frei ist. Die Station muss an den Ausgang eines Lagers oder einer Werkstatt angrenzen, um die Ware direkt dort abzuholen – ohne Umweg über Träger."
plPL = "Wybierz jeden pakowany towar. Tragarze zapełniają tę stację, a sieć transportu przedmiotów dostarcza towar do połączonych stacji dostaw; tragarze nigdy nie mogą go stąd zabierać. Jeśli wszystkie stacje dostaw są pełne, towar jest tu składowany, aż zwolni się miejsce. Ustaw stację przy wyjściu z magazynu lub warsztatu, by pobierała towar bezpośrednio, bez kursu tragarza."
ptBR = "Escolha um produto embalado. Os transportadores abastecem esta estação, e a rede de itens envia o produto para as Estações de Entrega conectadas; ela nunca permite que os transportadores o retirem. Se todas as entregas estiverem lotadas, ele fica armazenado aqui até surgir espaço. Coloque-a encostada na saída de um armazém ou oficina para retirar o produto diretamente, sem precisar de uma viagem do transportador."
koKR = "포장 상품 하나를 선택하세요. 운반꾼이 이 정거장을 채우면, 물품 네트워크가 연결된 배송 정거장으로 상품을 보냅니다. 운반꾼은 이곳에 있는 상품을 다시 가져갈 수 없습니다. 모든 배송 정거장이 가득 차 있으면, 빈자리가 생길 때까지 이곳에 쌓아 둡니다. 창고나 작업장의 출구에 맞닿게 설치하면 운반꾼이 거치지 않고 상품을 바로 가져옵니다."
csCZ = "Vyberte jednu zabalenou surovinu. Nosiči naplní tuto stanici a síť přepravy zboží ji dopraví do připojených doručovacích stanic; nosičům nikdy neumožní odnést ji zpět. Pokud jsou všechny doručovací stanice plné, zůstává zde uskladněná, dokud se neuvolní místo. Umístěte ji k výstupu skladu nebo dílny, aby zboží odebírala přímo odtud bez cesty nosiče."
viVN = "Chọn một loại hàng đóng gói. Nhân công vận chuyển sẽ chất đầy hàng vào trạm này, rồi mạng lưới hàng hóa sẽ chuyển hàng đến các Trạm Giao hàng được kết nối; nhân công không bao giờ có thể lấy hàng từ đây để mang đi. Nếu mọi điểm giao hàng đều đầy, hàng sẽ được lưu kho tại đây cho đến khi có chỗ trống. Đặt trạm sát kho hoặc đầu ra của xưởng để lấy hàng trực tiếp, không cần nhân công vận chuyển."
trTR = "Paketli bir mal seçin. Taşıyıcılar bu istasyonu doldurur ve eşya ağı, malı bağlı Teslimat İstasyonlarına gönderir; taşıyıcıların malı buradan geri almasına hiçbir zaman izin vermez. Tüm teslimatlar doluysa, yer açılana kadar malı burada stoklar. Doğrudan çekebilmesi ve taşıyıcı seferine gerek kalmaması için bir depo veya atölyenin çıkışına bitişik yerleştirin."

