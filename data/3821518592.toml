["Building.AdvancedPumps.Outlet.Description"]
status = "normal"
raw = "Legacy outlet retained for existing saves. New networks release surplus water automatically at open pipe ends."
enUS = "Legacy outlet retained for existing saves. New networks release surplus water automatically at open pipe ends."
zhCN = "为兼容现有存档而保留的旧式出口。新网络会在开放的管道末端自动排放多余的水。"
zhTW = "保留舊式出口以相容既有存檔。新式網路會在開放的管道末端自動排出多餘的水。"
ruRU = "Устаревший выпуск воды сохранён для существующих сохранений. В новых сетях излишки воды автоматически сбрасываются через открытые концы труб."
jaJP = "既存のセーブデータとの互換性のために残されている旧式の排出口です。新しいネットワークでは、開放されたパイプの末端から余剰水が自動的に放出されます。"
frFR = "Sortie héritée conservée pour les sauvegardes existantes. Les nouveaux réseaux évacuent automatiquement l'eau excédentaire par les extrémités de tuyaux ouvertes."
deDE = "Veralteter Auslass, der für bestehende Spielstände beibehalten wurde. Neue Netzwerke geben überschüssiges Wasser automatisch an offenen Rohrenden ab."
plPL = "Wylot zachowany dla istniejących zapisów gry. Nowe sieci automatycznie odprowadzają nadmiar wody przez otwarte końce rur."
ptBR = "Saída legada mantida para salvamentos existentes. Novas redes liberam automaticamente o excesso de água pelas extremidades abertas dos canos."
koKR = "기존 저장 파일을 위해 레거시 배출구를 유지합니다. 새 네트워크는 열린 파이프 끝에서 남는 물을 자동으로 방출합니다."
csCZ = "Zastaralý vývod zachovaný kvůli stávajícím uloženým pozicím. Nové sítě automaticky vypouštějí přebytečnou vodu na otevřených koncích potrubí."
viVN = "Cửa xả cũ được giữ lại để tương thích với các bản lưu hiện có. Mạng lưới mới tự động xả lượng nước dư ở các đầu ống mở."
trTR = "Mevcut kayıtlar için eski çıkış korunmuştur. Yeni ağlar, fazla suyu açık boru uçlarından otomatik olarak tahliye eder."

