["Building.AdvancedPumps.VerticalItemPipe.Description"]
status = "normal"
raw = "A stackable vertical cargo pipe. Stack them to move goods up or down levels; connects to horizontal item conduits at every level."
enUS = "A stackable vertical cargo pipe. Stack them to move goods up or down levels; connects to horizontal item conduits at every level."
zhCN = "可堆叠的垂直货物管道。将它们堆叠起来，可在不同高度之间上下运输货物；每一层都能连接水平物品管道。"
zhTW = "可堆疊的垂直貨物管道。將它們堆疊起來，即可讓貨物上下移動；每一層都能連接水平貨物管道。"
ruRU = "Штабелируемая вертикальная грузовая труба. Ставьте их друг на друга, чтобы перемещать товары между уровнями вверх или вниз; на каждом уровне соединяется с горизонтальными трубопроводами для предметов."
jaJP = "積み重ね可能な垂直貨物パイプ。積み重ねて物資を上下の階層に移動できます。各階層で水平アイテム導管に接続します。"
frFR = "Un conduit vertical de marchandises empilable. Empilez-les pour déplacer des marchandises vers le haut ou vers le bas ; il se connecte aux conduits horizontaux de marchandises à chaque niveau."
deDE = "Ein stapelbares, vertikales Warentransportrohr. Staple mehrere übereinander, um Waren zwischen Ebenen nach oben oder unten zu transportieren. Auf jeder Ebene kann es an horizontale Warentransportleitungen angeschlossen werden."
plPL = "Pionowy, piętrowalny przewód do transportu towarów. Można układać je jeden na drugim, aby przenosić towary między poziomami; łączy się z poziomymi kanałami transportu towarów na każdym poziomie."
ptBR = "Um tubo vertical de carga empilhável. Empilhe-os para transportar mercadorias entre níveis, para cima ou para baixo; conecta-se a conduítes horizontais de itens em todos os níveis."
koKR = "쌓아 올릴 수 있는 수직 화물 파이프입니다. 여러 개를 쌓아 물품을 층간 위아래로 운반하세요. 각 층에서 수평 물품 수송관과 연결됩니다."
csCZ = "Stohovatelná svislá nákladní trubka. Stohujte je a přepravujte zboží mezi úrovněmi nahoru či dolů; na každé úrovni se připojuje k vodorovným dopravníkům zboží."
viVN = "Một ống vận chuyển hàng hóa theo chiều dọc có thể xếp chồng. Xếp chồng chúng để chuyển hàng hóa lên hoặc xuống các tầng; kết nối với các ống dẫn vật phẩm nằm ngang ở mọi tầng."
trTR = "Üst üste yerleştirilebilen dikey bir yük borusu. Eşyaları katlar arasında yukarı veya aşağı taşımak için üst üste yerleştirin; her katta yatay eşya kanallarına bağlanır."

