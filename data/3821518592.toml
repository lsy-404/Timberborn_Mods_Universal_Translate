["Building.AdvancedPumps.ItemDepot.Description"]
status = "normal"
raw = "Pick one packed good. Only the item network fills this station - haulers never drop goods in, they only carry them onward. Stands against a warehouse to push straight into it when there is room."
enUS = "Choose one packed good. Only the item network fills this station—haulers never drop goods here; they only carry them onward. Place it against a warehouse to push goods directly into it when there’s room."
zhCN = "选择一种打包货物。只有物品网络会为此站点装货——搬运工不会把货物放进来，只会将其继续运送。将它紧靠仓库放置，有空间时货物便会直接送入仓库。"
zhTW = "選擇一種包裝貨物。只有物品網絡會填滿此站點——搬運工不會把貨物放進來，他們只會將貨物繼續運送。將此站點緊靠倉庫建造，若倉庫有空間，貨物便會直接送入其中。"
ruRU = "Выберите один упакованный товар. Эту станцию заполняет только сеть предметов — грузчики никогда не оставляют в ней товары, а лишь переносят их дальше. Разместите её вплотную к складу, чтобы товары перемещались прямо в него, если там есть место."
jaJP = "梱包品を1つ選択します。このステーションに補充するのはアイテムネットワークのみです。運搬人がここに荷物を降ろすことはなく、先へ運ぶだけです。倉庫に隣接させると、空きがある場合に倉庫へ直接搬入します。"
frFR = "Choisissez un bien emballé. Seul le réseau d'objets approvisionne cette station : les transporteurs n'y déposent jamais de biens, ils ne font que les acheminer. Placée contre un entrepôt, elle y pousse directement les biens lorsqu'il y a de la place."
deDE = "Wähle eine verpackte Ware aus. Nur das Warennetzwerk füllt diese Station – Transportarbeiter liefern hier niemals Waren ab, sondern bringen sie nur weiter. Stelle die Station an ein Lagerhaus, damit sie Waren direkt hineinschiebt, wenn Platz ist."
plPL = "Wybierz jeden zapakowany towar. Tę stację zaopatruje wyłącznie sieć towarowa — tragarze nigdy nie dostarczają tu towarów, tylko przenoszą je dalej. Ustaw ją przy magazynie, aby towary trafiały bezpośrednio do niego, gdy jest w nim miejsce."
ptBR = "Escolha um item empacotado. Apenas a rede de itens abastece esta estação — os transportadores nunca deixam itens nela; apenas os levam adiante. Posicione-a encostada a um armazém para enviar os itens diretamente para ele quando houver espaço."
koKR = "포장된 물품 하나를 선택하세요. 이곳은 물품 네트워크만 채울 수 있습니다. 운반꾼은 물품을 이곳에 내려놓지 않고 다음 목적지로 운반하기만 합니다. 창고에 붙여 배치하면 공간이 있을 때 물품을 곧바로 창고 안으로 밀어 넣습니다."
csCZ = "Vyberte jedno zabalené zboží. Tuto stanici plní pouze síť předmětů – přepravci sem zboží nikdy neodkládají, pouze je odnášejí dál. Umístěte ji ke skladu, aby zboží putovalo přímo do něj, když je v něm místo."
viVN = "Chọn một loại hàng đã đóng gói. Chỉ mạng lưới hàng hóa mới tiếp tế cho trạm này — người vận chuyển không bao giờ thả hàng vào đây, họ chỉ mang hàng đi tiếp. Đặt sát một nhà kho để đẩy hàng thẳng vào đó khi còn chỗ."
trTR = "Paketlenmiş bir mal seçin. Bu istasyonu yalnızca eşya ağı doldurur; taşıyıcılar buraya mal bırakmaz, yalnızca malları ileri taşır. Yer varsa malları doğrudan depoya göndermek için bir deponun yanına yerleştirin."

