["Building.AdvancedPumps.WaterTank.Description"]
status = "normal"
raw = "Storage at the receiving end of the water network. Only connected pumps fill it, through the pipes; beavers draw water out into their barrels. Pick \"Water\" in its panel."
enUS = "Storage at the receiving end of the water network. Only connected pumps fill it through the pipes; beavers draw water from it into their barrels. Select “Water” in its panel."
zhCN = "位于水网接收端的储水设施。只有与其相连的水泵才能通过管道向其注水；海狸会从中取水装入桶中。在其面板中选择“水”。"
zhTW = "位於水網接收端的儲水設施。只有已連接的抽水機能透過管線將水注入其中；海狸會從中取水裝進桶裡。在面板中選擇「水」。"
ruRU = "Хранилище в конце водопроводной сети, принимающем воду. Заполняется только подключёнными насосами по трубам; бобры набирают из него воду в бочки. Выберите «Вода» в его панели."
jaJP = "水ネットワークの受け側にある貯水施設。接続されたポンプだけがパイプを通して水を補給し、ビーバーはここから樽に水を汲みます。パネルで「水」を選択してください。"
frFR = "Stockage à l’extrémité réceptrice du réseau d’eau. Seules les pompes connectées le remplissent, par les tuyaux ; les castors en tirent de l’eau pour remplir leurs barils. Sélectionnez « Eau » dans son panneau."
deDE = "Speicher am Ende des Wassernetzes. Nur angeschlossene Pumpen füllen ihn über die Rohre; Biber schöpfen Wasser daraus in ihre Fässer. Wähle in seinem Bedienfeld „Wasser“ aus."
plPL = "Zbiornik na końcu sieci wodnej, do którego trafia woda. Napełniają go wyłącznie podłączone pompy, przez rury; bobry pobierają z niego wodę do swoich beczek. W jego panelu wybierz „Woda”."
ptBR = "Armazenamento na extremidade receptora da rede de água. Somente bombas conectadas o abastecem, pelos canos; os castores retiram água dele para encher seus barris. Selecione “Água” no painel dele."
koKR = "물 네트워크의 끝에 설치하는 저장고입니다. 연결된 펌프만 파이프를 통해 이곳을 채울 수 있으며, 비버는 이곳에서 물을 통에 담아 갑니다. 패널에서 \"물\"을 선택하세요."
csCZ = "Zásobárna na konci vodovodní sítě, kam voda přitéká. Plní ji pouze připojená čerpadla, a to potrubím; bobři z ní čerpají vodu do svých barelů. V jejím panelu vyberte „Voda“."
viVN = "Nơi trữ nước ở đầu nhận của mạng lưới nước. Chỉ các máy bơm được kết nối mới bơm nước vào bể qua đường ống; hải ly múc nước ra đổ vào thùng của mình. Chọn “Nước” trong bảng điều khiển của bể."
trTR = "Su ağının alıcı ucundaki depolama birimi. Yalnızca bağlı pompalar borular aracılığıyla doldurabilir; kunduzlar suyu buradan fıçılarına alır. Panelinden “Su”yu seçin."

