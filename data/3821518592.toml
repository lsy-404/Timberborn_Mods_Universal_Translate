["Building.AdvancedPumps.WaterTankMedium.Description"]
raw = "A taller water tank - more storage at the receiving end of the water network. Pick \"Water\" in its panel."
status = "normal"
enUS = "A taller water tank—more storage at the receiving end of the water network. Select \"Water\" in its panel."
zhCN = "更高的水箱——在水网的接收端储存更多水。在其面板中选择“水”。"
zhTW = "更高的水槽——在水網的接收端提供更多儲水空間。在其面板中選擇「水」。"
ruRU = "Более высокая водяная цистерна — больше места для хранения в точке приёма системы водоснабжения. Выберите «Вода» в её панели."
jaJP = "より背の高い水タンク。水ネットワークの受け側で、より多くの水を貯蔵できます。パネルで「水」を選択してください。"
frFR = "Un réservoir d’eau plus haut : davantage de stockage à l’extrémité réceptrice du réseau d’eau. Sélectionnez « Eau » dans son panneau."
deDE = "Ein höherer Wassertank – mehr Speicherkapazität am Ende des Wassernetzes. Wähle in seinem Bedienfeld „Wasser“ aus."
plPL = "Wyższy zbiornik na wodę — większy zapas na końcu sieci wodociągowej. W jego panelu wybierz „Woda”."
ptBR = "Um tanque de água mais alto — mais armazenamento no ponto de recebimento da rede de água. Selecione “Água” no painel dele."
koKR = "더 높은 물탱크입니다. 물 네트워크의 수용 지점에 더 많은 물을 저장합니다. 패널에서 “물”을 선택하세요."
trTR = "Daha yüksek bir su deposu — su şebekesinin alıcı ucunda daha fazla depolama kapasitesi. Panelinde “Su”yu seçin."
esES = "Un depósito de agua más alto: más almacenamiento en el extremo receptor de la red de agua. Selecciona \"Agua\" en su panel."
itIT = "Una cisterna d'acqua più alta: maggiore capacità di stoccaggio all'estremità ricevente della rete idrica. Seleziona \"Acqua\" nel suo pannello."
ukUA = "Вища водонапірна цистерна — більше місткості на приймальному кінці водної мережі. Оберіть «Вода» на її панелі."
thTH = "ถังเก็บน้ำที่สูงกว่า เพิ่มความจุในการเก็บน้ำที่ปลายทางของเครือข่ายน้ำ เลือก \"น้ำ\" ในแผงของถัง"
csCZ = "Vyšší vodní nádrž – více úložného prostoru na konci vodovodní sítě, kam voda přitéká. V jejím panelu vyberte „Voda“."
viVN = "Bể chứa nước cao hơn — tăng sức chứa ở đầu nhận của mạng lưới nước. Chọn \"Nước\" trong bảng điều khiển của bể."
caES = "Un dipòsit d'aigua més alt: més capacitat d'emmagatzematge a l'extrem receptor de la xarxa d'aigua. Selecciona «Aigua» al seu panell."
beBY = "Вышэйшая вадзяная цыстэрна — больш месца для захоўвання ў канцы вадзянай сеткі, куды паступае вада. Выберыце «Вада» ў яе панэлі."
