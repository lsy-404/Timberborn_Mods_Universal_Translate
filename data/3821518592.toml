["Building.AdvancedPumps.VerticalBeaverTube.Description"]
status = "normal"
raw = "A stackable vertical beaver tube. Stack them into a shaft beavers travel up and down. Glass-walled."
enUS = "A stackable vertical tube for beavers. Stack them to create a shaft that beavers can travel up and down. Glass-walled."
zhCN = "可堆叠的垂直海狸管道。将它们堆叠成竖井，供海狸上下通行。带玻璃墙。"
zhTW = "可堆疊的垂直海狸管道。堆疊起來，形成海狸上下通行的豎井。設有玻璃牆。"
ruRU = "Вертикальная труба для бобров, которую можно складывать друг на друга. Соберите из них шахту, по которой бобры смогут перемещаться вверх и вниз. Стенки стеклянные."
jaJP = "積み重ね可能な垂直型ビーバー用チューブ。積み重ねてシャフトにすると、ビーバーが上下に移動します。壁はガラス製です。"
frFR = "Un tube vertical empilable pour castors. Empilez-les pour former une gaine dans laquelle les castors peuvent monter et descendre. Avec des parois en verre."
deDE = "Ein stapelbarer vertikaler Biber-Tunnel. Staple sie zu einem Schacht, in dem Biber auf und ab laufen. Mit Glaswänden."
plPL = "Modułowa pionowa rura dla bobrów. Łącz je w szyb, którym bobry będą podróżować w górę i w dół. Ściany ze szkła."
ptBR = "Um tubo vertical empilhável para castores. Empilhe-os para formar um poço pelo qual os castores podem subir e descer. Com paredes de vidro."
koKR = "쌓을 수 있는 수직 비버 통로입니다. 여러 개를 쌓아 비버가 오르내리는 통로를 만드세요. 유리벽으로 되어 있습니다."
csCZ = "Stohovatelná svislá bobří trubice. Stohujte je na sebe a vytvořte šachtu, kterou bobři cestují nahoru a dolů. Se skleněnými stěnami."
viVN = "Ống cho hải ly di chuyển theo chiều dọc, có thể xếp chồng lên nhau. Xếp chồng các ống để tạo thành một giếng đứng cho hải ly đi lên xuống. Thành ống bằng kính."
trTR = "Üst üste yerleştirilebilen dikey bir kunduz tüpü. Kunduzların yukarı ve aşağı hareket ettiği bir şaft oluşturmak için üst üste dizin. Cam duvarlıdır."

