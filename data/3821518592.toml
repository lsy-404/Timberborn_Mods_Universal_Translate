["Building.AdvancedPumps.BeaverTube.Description"]
status = "normal"
raw = "A walkable pneumatic tube on the same network beavers already travel through. Glass-walled so you can watch them pass."
enUS = "A walkable pneumatic tube on the same network beavers already travel through. Glass-walled so you can watch them pass."
zhCN = "一条可供海狸通行、并与它们现有行进网络相连的气动管道。管壁为玻璃制成，方便观察它们经过。"
zhTW = "可供海狸在同一網絡中通行的氣動管道。管壁採用玻璃設計，讓你能看著牠們經過。"
ruRU = "Проходимая пневматическая труба в той же сети, по которой уже передвигаются бобры. Со стеклянными стенками, чтобы можно было наблюдать за ними."
jaJP = "ビーバーがすでに行き来しているネットワーク上に設置できる、歩いて通れる空気圧チューブ。ガラス張りなので、ビーバーが通り過ぎる様子を眺められます。"
frFR = "Un tube pneumatique praticable, relié au même réseau que celui qu’empruntent déjà les castors. Ses parois vitrées permettent de les regarder passer."
deDE = "Ein begehbares Pneumatikrohr im selben Netzwerk, durch das sich die Biber bereits bewegen. Mit Glaswänden, damit du sie hindurchlaufen sehen kannst."
plPL = "Przechodnia rura pneumatyczna w tej samej sieci, po której już poruszają się bobry. Ma szklane ściany, więc można obserwować, jak przez nią przechodzą."
ptBR = "Um tubo pneumático transitável, na mesma rede pela qual os castores já se deslocam. Com paredes de vidro para você vê-los passar."
koKR = "비버들이 이미 이동하는 동일한 네트워크를 따라 걸어 다닐 수 있는 공압 튜브입니다. 유리벽으로 되어 있어 비버들이 지나가는 모습을 볼 수 있습니다."
csCZ = "Průchozí pneumatická trubice ve stejné síti, kterou bobři už využívají k cestování. Má skleněné stěny, takže můžete sledovat, jak jí procházejí."
viVN = "Một đường ống khí nén có thể đi lại, nằm trên cùng mạng lưới mà các hải ly đang di chuyển. Thành ống bằng kính để bạn có thể nhìn chúng đi qua."
trTR = "Kunduzların zaten içinde dolaştığı aynı ağda yer alan, yürünebilir bir pnömatik tüp. Geçip gidişlerini izleyebilmeniz için cam duvarlı."

