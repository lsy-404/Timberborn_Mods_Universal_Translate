deDE = "Unabhängiger Schacht für 4 Biber. Auf jeder Etage muss eine Landefläche derselben Größe gebaut werden. Verbindet sich nicht mit nahegelegenen Aufzügen. Benötigt 320 hp."
plPL = "Niezależny szyb dla 4 bobrów. Na każdym piętrze zbuduj lądowisko o tym samym rozmiarze. Nie łączy się z pobliskimi windami. Wymaga 320 hp."
ptBR = "Eixo independente para 4 castores. Construa um patamar do mesmo tamanho em cada andar. Não se conecta a elevadores próximos. Requer 320 hp."
koKR = "비버 4마리용 독립 샤프트입니다. 각 층에 같은 크기의 승강장을 건설하세요. 주변 승강기와 연결되지 않습니다. 320 hp가 필요합니다."
trTR = "4 kunduz için bağımsız şaft. Her katta aynı boyutta bir sahanlık inşa edin. Yakındaki asansörlere bağlanmaz. 320 hp gerektirir."
esES = "Eje independiente para 4 castores. Construye un descansillo del mismo tamaño en cada piso. No se conecta a los ascensores cercanos. Requiere 320 hp."
itIT = "Pozzo indipendente per 4 castori. Costruisci un pianerottolo di dimensioni uguali su ogni piano. Non si collega agli ascensori vicini. Richiede 320 hp."
ukUA = "Окрема шахта для 4 бобрів. На кожному поверсі побудуйте майданчик такого самого розміру. Не з'єднується з сусідніми ліфтами. Потребує 320 hp."
thTH = "ลิฟต์แบบอิสระสำหรับบีเวอร์ 4 ตัว สร้างลานจอดที่มีขนาดเท่ากันบนทุกชั้น ไม่เชื่อมต่อกับลิฟต์ที่อยู่ใกล้เคียง ต้องใช้กำลัง 320 hp"
csCZ = "Samostatná šachta pro 4 bobry. Na každém podlaží postavte přistávací plošinu stejné velikosti. Nepřipojuje se k sousedním výtahům. Vyžaduje 320 hp."
viVN = "Trục độc lập dành cho 4 hải ly. Xây một sàn đáp có cùng kích thước ở mỗi tầng. Không kết nối với các thang máy gần đó. Cần 320 hp."
caES = "Eix independent per a 4 castors. Construïu un replà de la mateixa mida a cada planta. No es connecta als ascensors propers. Requereix 320 hp."
beBY = "Незалежная шахта для 4 бабраў. Пабудуйце пляцоўку такога ж памеру на кожным паверсе. Не злучаецца з бліжэйшымі ліфтамі. Патрабуе 320 hp."
roRO = "Ax independent pentru 4 castori. Construiți un debarcader de aceeași dimensiune la fiecare etaj. Nu se conectează la liftele din apropiere. Necesită 320 hp."
huHU = "Önálló akna 4 bizonyos számára. Minden emeleten építsen ugyanekkora leszállót. Nem kapcsolódik a közeli liftekhez. 320 hp-t igényel."
arSA = "مصعد مستقل لعدد 4 من القنادس. ابنِ منصة هبوط بالحجم نفسه على كل طابق. لا يتصل بالمصاعد القريبة. يتطلب 320 حصانًا (hp)."

