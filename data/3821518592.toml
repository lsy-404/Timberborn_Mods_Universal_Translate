["Building.AdvancedPumps.ItemPipe.Description"]
status = "normal"
raw = "A 1x1 cargo pipe. Auto-connects to neighbouring item conduits and stations and carries packed goods between them."
enUS = "A 1x1 cargo pipe. Automatically connects to neighboring item conduits and stations and carries packed goods between them."
zhCN = "1x1货物管道。自动连接相邻的物品输送管道和站点，并在它们之间运输打包货物。"
zhTW = "1x1 貨物管道。會自動連接相鄰的物品管線和站點，並在它們之間運送包裝貨物。"
ruRU = "Грузовая труба размером 1x1. Автоматически подключается к соседним товарным трубам и станциям и перевозит между ними упакованные товары."
jaJP = "1x1の貨物用パイプ。隣接するアイテム導管やステーションに自動接続し、梱包された品物をそれらの間で運びます。"
frFR = "Un conduit de marchandises de 1x1. Se connecte automatiquement aux conduits et aux stations voisins et transporte des marchandises emballées entre eux."
deDE = "Eine 1x1-Güterleitung. Verbindet sich automatisch mit benachbarten Güterleitungen und Stationen und transportiert verpackte Waren zwischen ihnen."
plPL = "Rura towarowa 1x1. Automatycznie łączy się z sąsiednimi kanałami transportu przedmiotów i stacjami, przenosząc między nimi zapakowane towary."
ptBR = "Um tubo de carga 1x1. Conecta-se automaticamente a condutos de itens e estações vizinhos e transporta mercadorias embaladas entre eles."
koKR = "1x1 화물 파이프입니다. 인접한 물품 도관 및 정거장에 자동으로 연결되어 그 사이로 포장된 물품을 운반합니다."
csCZ = "Nákladní potrubí 1x1. Automaticky se připojuje k sousedním potrubím a stanicím pro přepravu předmětů a přepravuje mezi nimi zabalené zboží."
viVN = "Ống vận chuyển hàng hóa kích thước 1x1. Tự động kết nối với các ống dẫn hàng hóa và trạm lân cận, vận chuyển hàng hóa đóng gói giữa chúng."
trTR = "1x1 boyutunda bir kargo borusu. Komşu eşya kanallarına ve istasyonlara otomatik bağlanır ve aralarında paketlenmiş malları taşır."

