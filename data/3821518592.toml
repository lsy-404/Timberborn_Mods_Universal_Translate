["Building.AdvancedPumps.Elevator2x2.Description"]
raw = "Independent shaft for 4 beavers. Build a landing of the same size on each floor. Does not connect to nearby lifts. Requires 320 hp."
status = "normal"
enUS = "Independent shaft for 4 beavers. Build a landing of the same size on each floor. Does not connect to nearby lifts. Requires 320 hp."
zhCN = "供4只海狸使用的独立竖井。每层都要建造一个同样大小的平台。不会与附近的升降机连接。需要320 hp。"
zhTW = "供 4 隻海狸使用的獨立軸道。每層都要建造相同大小的平台。無法連接附近的升降梯。需要 320 hp。"
ruRU = "Независимая шахта на 4 бобра. На каждом этаже постройте площадку такого же размера. Не соединяется с ближайшими подъёмниками. Требует 320 hp."
jaJP = "ビーバー4匹用の独立したシャフト。各階に同じサイズの踊り場を建設してください。近くのリフトとは接続しません。320 hpが必要です。"
