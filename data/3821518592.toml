["Building.AdvancedPumps.PipeSegment.Description"]
status = "normal"
raw = "A 1x1 water pipe. Auto-connects to neighbouring conduits, tanks and pumps and switches shape like a beaver tube."
enUS = "A 1x1 water pipe. Automatically connects to neighboring conduits, tanks, and pumps, and changes shape like a beaver tube."
zhCN = "1x1 水管。会自动连接相邻的管道、储罐和水泵，并像海狸管道一样切换形状。"
zhTW = "1x1 水管。會自動連接相鄰的導管、水槽和水泵，並像海狸管道一樣切換形狀。"
ruRU = "Водопроводная труба размером 1×1. Автоматически соединяется с соседними трубами, резервуарами и насосами и меняет форму, как бобровая нора."
jaJP = "1x1の水道管。隣接する導管、タンク、ポンプに自動接続し、ビーバーチューブのように形状が切り替わります。"
frFR = "Un tuyau d’eau de 1x1. Se connecte automatiquement aux conduites, réservoirs et pompes voisins, et change de forme comme un tube de castor."
deDE = "Eine 1x1-Wasserleitung. Verbindet sich automatisch mit benachbarten Leitungen, Tanks und Pumpen und ändert ihre Form wie ein Biberröhrchen."
plPL = "Rura wodna o wymiarach 1x1. Automatycznie łączy się z sąsiednimi przewodami, zbiornikami i pompami oraz zmienia kształt jak rura bobrowa."
ptBR = "Um cano de água de 1x1. Conecta-se automaticamente a conduítes, tanques e bombas vizinhos e muda de forma como um tubo de castor."
koKR = "1x1 물 파이프입니다. 인접한 도관, 탱크, 펌프에 자동으로 연결되며 비버 튜브처럼 모양이 바뀝니다."
csCZ = "Vodovodní potrubí o rozměrech 1×1. Automaticky se připojuje k sousedním potrubím, nádržím a čerpadlům a mění tvar jako bobří trubice."
viVN = "Một ống dẫn nước 1x1. Tự động kết nối với các đường ống dẫn, bể chứa và máy bơm lân cận, đồng thời đổi hình dạng như ống dẫn của hải ly."
trTR = "1x1 su borusu. Komşu kanallara, tanklara ve pompalara otomatik bağlanır ve kunduz borusu gibi şekil değiştirir."

