["Building.AdvancedPumps.Elevator.Description"]
status = "normal"
raw = "Independent shaft without path access. Build a landing of the same size on each floor. Nearby lifts stay separate. One beaver per trip. 80 hp."
enUS = "Independent shaft without path access. Build a landing of the same size on each floor. Nearby lifts stay separate. One beaver per trip. 80 hp."
zhCN = "无需道路通行的独立轴道。每层都要建造一个同样大小的平台。附近的升降机彼此独立。每趟运送一只海狸。80 hp。"
zhTW = "無需道路連接的獨立軸道。每層都要建造一個大小相同的停靠平台。附近的升降機彼此獨立。每趟運送一隻海狸。80 hp。"
ruRU = "Автономный лифт без доступа по дорожкам. На каждом этаже постройте площадку того же размера. Ближайшие лифты остаются независимыми. Один бобр за поездку. 80 hp."
jaJP = "通路に接続しない独立したシャフト。各階に同じサイズの踊り場を建設してください。近くのリフトとは接続されません。1回につきビーバー1匹。80 hp。"
frFR = "Arbre indépendant sans accès par chemin. Construisez un palier de même taille à chaque étage. Les ascenseurs proches restent séparés. Un castor par trajet. 80 hp."
deDE = "Unabhängiger Schacht ohne Wegzugang. Baue auf jeder Etage einen gleich großen Absatz. Benachbarte Aufzüge bleiben getrennt. Ein Biber pro Fahrt. 80 hp."
plPL = "Niezależny wał bez dostępu do ścieżki. Zbuduj lądowisko tej samej wielkości na każdym piętrze. Sąsiednie windy pozostają oddzielne. Jeden bóbr na kurs. 80 hp."
ptBR = "Eixo independente, sem acesso por caminho. Construa um patamar do mesmo tamanho em cada andar. Elevadores próximos permanecem separados. Um castor por viagem. 80 hp."
koKR = "경로에 연결되지 않는 독립형 동력축. 각 층에 같은 크기의 승강장을 건설하세요. 가까이 있는 승강기는 서로 연결되지 않습니다. 한 번에 비버 한 마리. 80 hp."
csCZ = "Samostatná hřídel bez přístupu po cestě. Na každém podlaží postavte plošinu stejné velikosti. Nedaleké výtahy zůstávají oddělené. Jeden bobr na jednu jízdu. 80 hp."
viVN = "Trục truyền lực độc lập, không cần lối đi tiếp cận. Xây một chiếu nghỉ cùng kích thước ở mỗi tầng. Các thang máy gần nhau vẫn hoạt động riêng biệt. Mỗi chuyến chở một hải ly. 80 hp."
trTR = "Yol erişimi olmayan bağımsız şaft. Her katta aynı boyutta bir sahanlık inşa edin. Yakındaki asansörler birbirinden bağımsız kalır. Her seferinde bir kunduz taşır. 80 hp."

