["Building.AdvancedPumps.ItemPipeGlass.Description"]
raw = "Same as the Item Conduit, but with a transparent shell so the cargo shows while it moves."
status = "normal"
enUS = "Same as the Item Conduit, but with a transparent shell so the cargo is visible as it moves."
zhCN = "与物品管道相同，但外壳透明，能看到货物在其中移动。"
zhTW = "功能與物品輸送管相同，但外殼透明，貨物移動時也能看見。"
ruRU = "То же, что и грузопровод, но с прозрачной оболочкой, сквозь которую виден движущийся груз."
jaJP = "アイテム導管と同じですが、透明な外殻になっているため、貨物が移動する様子を見られます。"
frFR = "Identique au conduit à objets, mais avec une coque transparente qui laisse voir les marchandises pendant leur transport."
deDE = "Wie die Güterleitung, aber mit einer transparenten Hülle, sodass die Fracht beim Transport sichtbar ist."
plPL = "Działa tak samo jak Przewód transportowy, ale ma przezroczystą obudowę, dzięki czemu widać przewożone towary."
ptBR = "Igual ao Conduto de Itens, mas com uma estrutura transparente que permite ver a carga enquanto ela se move."
koKR = "아이템 도관과 같지만, 투명한 외피 덕분에 화물이 이동하는 동안에도 보입니다."
trTR = "Eşya Kanalı ile aynı işlevi görür, ancak içinden geçen yükün görünmesini sağlayan şeffaf bir gövdeye sahiptir."
esES = "Igual que el Conducto de objetos, pero con una carcasa transparente para que la carga se vea mientras se mueve."
itIT = "Uguale al Condotto per oggetti, ma con un involucro trasparente, così il carico è visibile mentre si muove."
ukUA = "Так само, як Транспортний жолоб для предметів, але з прозорою оболонкою, щоб вантаж було видно під час руху."
thTH = "เหมือนกับท่อลำเลียงไอเท็ม แต่มีตัวท่อโปร่งใสเพื่อให้มองเห็นสินค้าขณะที่กำลังเคลื่อนที่"
csCZ = "Stejné jako dopravní potrubí na předměty, ale s průhledným pláštěm, takže je během přepravy vidět náklad."
viVN = "Giống như Ống dẫn vật phẩm, nhưng có vỏ trong suốt để nhìn thấy hàng hóa khi di chuyển."
caES = "Igual que el Conducte d'Objectes, però amb una carcassa transparent perquè la càrrega es vegi mentre es mou."
beBY = "Тое ж, што і Item Conduit, але з празрыстым корпусам, каб груз быў бачны падчас руху."
roRO = "Același lucru ca Conducta de obiecte, dar cu o carcasă transparentă, astfel încât mărfurile să fie vizibile în timp ce se deplasează."
huHU = "Ugyanaz, mint az Elemszállító cső, de átlátszó burkolattal, így a szállított áru mozgás közben is látszik."
arSA = "نفس وظيفة ناقل العناصر، لكن بغلاف شفاف يُظهر البضائع أثناء تحركها."

