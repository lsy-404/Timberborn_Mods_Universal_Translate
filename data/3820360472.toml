["Building.ArtesianWell.Description"]
status = "normal"
raw = "Drilled deep into a confined aquifer. The pressure underground pushes clean water up by itself: no power, no workers, no refilling. Keeps both tiles in front at the target depth, up to a daily limit."
enUS = "Drilled deep into a confined aquifer. Underground pressure pushes clean water up by itself: no power, no workers, no refilling. Keeps both tiles in front at the target depth, up to a daily limit."
zhCN = "向深层承压含水层钻探。地下压力会自动将清水推上来：无需动力、无需工人、无需补水。可将前方两个地块维持在目标深度，但每日有上限。"
zhTW = "鑽入深層封閉含水層。地下壓力會自行將乾淨的水推上來：不需動力、不需工人，也不需補水。會維持前方兩格在目標深度，直到達到每日上限。"
ruRU = "Пробурена глубоко в замкнутый водоносный горизонт. Подземное давление само поднимает чистую воду: не нужны ни энергия, ни рабочие, ни пополнение запасов. Поддерживает заданную глубину на обеих клетках перед скважиной, в пределах дневного лимита."
jaJP = "閉じ込められた帯水層まで深く掘削。地下の圧力によって、きれいな水が自ら湧き上がります。動力も作業員も補給も不要です。手前の2マスを目標の深さまで、1日の上限量まで維持します。"
frFR = "Foré profondément dans un aquifère captif. La pression souterraine fait remonter l’eau propre toute seule : pas d’énergie, pas d’ouvriers, pas besoin de remplissage. Maintient les deux cases devant lui à la profondeur cible, jusqu’à une limite quotidienne."
deDE = "Tief in einen begrenzten Grundwasserleiter gebohrt. Der Druck unter der Erde drückt sauberes Wasser von selbst nach oben: keine Energie, keine Arbeitskräfte, kein Nachfüllen. Hält beide Felder davor bis zur Zieltiefe feucht, bis zu einer täglichen Höchstmenge."
plPL = "Wierci głęboko w uwięzionym poziomie wodonośnym. Podziemne ciśnienie samo wypycha czystą wodę na powierzchnię: bez zasilania, pracowników ani uzupełniania wody. Utrzymuje oba pola przed sobą na docelowej głębokości, do dziennego limitu."
ptBR = "Perfura profundamente um aquífero confinado. A pressão subterrânea empurra a água limpa para cima por conta própria: sem energia, sem trabalhadores e sem reabastecimento. Mantém as duas casas à frente na profundidade desejada, até um limite diário."
koKR = "깊은 곳의 대수층에 구멍을 뚫습니다. 지하의 압력으로 깨끗한 물이 저절로 솟아오릅니다. 동력도 일꾼도, 다시 채울 필요도 없습니다. 하루 공급량 한도까지, 앞쪽 두 칸을 목표 깊이로 유지합니다."
csCZ = "Vyhloubená hluboko do uzavřeného zvodněného kolektoru. Podzemní tlak vytlačuje čistou vodu vzhůru bez jakéhokoli pohonu: nepotřebuje energii ani pracovníky a není nutné ji doplňovat. Udržuje obě políčka před sebou v cílové hloubce, a to až do dosažení denního limitu."
viVN = "Được khoan sâu vào tầng chứa nước bị giới hạn. Áp suất dưới lòng đất tự đẩy nước sạch lên: không cần năng lượng, nhân công hay châm thêm nước. Duy trì cả hai ô phía trước ở độ sâu mục tiêu, tối đa đến giới hạn mỗi ngày."
trTR = "Kapalı bir akiferin derinliklerine kadar sondaj yapılmıştır. Yer altındaki basınç temiz suyu kendi kendine yukarı iter: güç gerekmez, işçi gerekmez, yeniden doldurmak gerekmez. Önündeki iki kareyi hedef derinlikte, günlük sınıra kadar suyla doldurur."

["Building.ArtesianWell.FlavorDescription"]
status = "normal"
raw = "\"After everything we gave, the ground finally gave back.\""
enUS = "\"After everything we gave, the ground finally gave back.\""
zhCN = "“在我们付出一切之后，大地终于有所回报。”"
zhTW = "「在我們付出一切之後，大地終於有所回報。」"
ruRU = "«После всего, что мы отдали, земля наконец отплатила нам тем же»."
jaJP = "「与えたものすべてのあとで、大地はついに恵みを返してくれた。」"
frFR = "« Après tout ce que nous lui avons donné, la terre a enfin rendu la pareille. »"
deDE = "„Nachdem wir alles gegeben hatten, gab der Boden endlich etwas zurück.“"
plPL = "„Po wszystkim, co daliśmy, ziemia w końcu nam odpłaciła”."
ptBR = "“Depois de tudo que demos, enfim a terra retribuiu.”"
koKR = "“우리가 모든 것을 내어준 끝에, 마침내 땅도 보답했다.”"
csCZ = "„Po tom všem, co jsme mu dali, nám země konečně něco vrátila.“"
viVN = "“Sau tất cả những gì chúng ta đã trao đi, cuối cùng đất cũng hồi đáp.”"
trTR = "“Bunca şey verdikten sonra, toprak sonunda karşılığını verdi.”"

