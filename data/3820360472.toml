["Building.FloatValveDischarge.Description"]
raw = "Haulers fill its tank with water. Like a cistern, it pours into the tile in front until the water there reaches the target depth, then stops by itself. No workers needed."
status = "normal"
enUS = "Haulers fill its tank with water. Like a cistern, it pours water onto the tile in front until the water there reaches the target depth, then stops on its own. No workers needed."
zhCN = "搬运工会将水装入其水箱。与蓄水池一样，它会将水排入前方的格子，直到那里的水达到目标深度，然后自动停止。无需工人。"
zhTW = "搬運工會將水裝入其水槽。和蓄水池一樣，它會將水注入前方的地格，直到那裡的水位達到目標深度，然後自動停止。無需工人。"
ruRU = "Переносчики наполняют его резервуар водой. Как цистерна, он выливает воду на клетку перед собой, пока вода там не достигнет заданной глубины, а затем останавливается сам. Работники не нужны."
jaJP = "運搬係がタンクに水を補給します。貯水槽と同じように、前方のマスの水深が目標に達するまで水を注ぎ、達すると自動的に止まります。作業員は必要ありません。"
frFR = "Les transporteurs remplissent son réservoir d’eau. Comme une citerne, il déverse de l’eau sur la case devant lui jusqu’à ce que la profondeur de l’eau atteigne la valeur cible, puis s’arrête automatiquement. Aucun ouvrier requis."
deDE = "Transportarbeiter füllen seinen Tank mit Wasser. Wie eine Zisterne gibt es Wasser auf das Feld davor ab, bis das Wasser dort die Zieltiefe erreicht, und stoppt dann automatisch. Keine Arbeiter erforderlich."
plPL = "Tragarze napełniają jej zbiornik wodą. Podobnie jak cysterna, wylewa wodę na pole przed sobą, aż osiągnie ona docelową głębokość, po czym sama się zatrzymuje. Nie wymaga pracowników."
ptBR = "Transportadores enchem seu tanque com água. Como uma cisterna, ele despeja água na casa à frente até que ela atinja a profundidade desejada e então para sozinho. Não precisa de trabalhadores."
koKR = "운반꾼이 이 탱크에 물을 채웁니다. 저수조처럼 앞쪽 타일의 물이 목표 깊이에 도달할 때까지 물을 쏟아붓고, 그 후에는 자동으로 멈춥니다. 작업자는 필요하지 않습니다."
csCZ = "Dopravci plní její nádrž vodou. Stejně jako cisterna vypouští vodu do políčka před sebou, dokud tam voda nedosáhne cílové hloubky, a pak se sama zastaví. Nepotřebuje pracovníky."
viVN = "Nhân công vận chuyển đổ đầy nước vào bể chứa của nó. Tương tự bể chứa nước, nó xả nước vào ô phía trước cho đến khi nước ở đó đạt độ sâu mục tiêu, rồi tự dừng. Không cần công nhân."
trTR = "Taşıyıcılar tankını suyla doldurur. Bir sarnıç gibi, önündeki karo hedef derinliğe ulaşana kadar su boşaltır, ardından kendiliğinden durur. İşçi gerekmez."

["Building.FloatValveDischarge.FlavorDescription"]
raw = "\"The float rises, the tap closes. Simple.\""
status = "normal"
enUS = "\"The float rises, the tap closes. Simple.\""
zhCN = "“浮子升起，阀门关闭。就这么简单。”"
zhTW = "「浮子升起，水龍頭關閉。很簡單。」"
ruRU = "«Поплавок поднимается, кран закрывается. Просто.»"
jaJP = "「フロートが上がると、蛇口が閉まる。簡単だ。」"
frFR = "« Le flotteur monte, le robinet se ferme. Simple. »"
deDE = "„Der Schwimmer steigt, der Hahn schließt sich. Ganz einfach.“"
plPL = "„Pływak się unosi, zawór się zamyka. Proste.”"
ptBR = "“A boia sobe, a torneira fecha. Simples.”"
koKR = "“부표가 올라가면 수도꼭지가 닫힌다. 간단하지.”"
csCZ = "„Plovák stoupá, kohoutek se zavírá. Jednoduché.“"
viVN = "“Phao nổi lên, vòi đóng lại. Đơn giản thôi.”"
trTR = "“Şamandıra yükselir, musluk kapanır. Basit.”"

