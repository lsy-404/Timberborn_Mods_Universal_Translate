["Building.FloatValveDischarge.DisplayName"]
new = "Float Valve Discharge"
status = "normal"

["Building.FloatValveDischarge.Description"]
new = "Haulers fill its tank with water. Like a cistern, it pours into the tile in front until the water there reaches the target depth, then stops by itself. No workers needed."
status = "normal"

["Building.FloatValveDischarge.FlavorDescription"]
new = "\"The float rises, the tap closes. Simple.\""
status = "normal"

["Building.ArtesianWell.DisplayName"]
new = "Artesian Well"
status = "normal"

["Building.ArtesianWell.Description"]
new = "Drilled deep into a confined aquifer. The pressure underground pushes clean water up by itself: no power, no workers, no refilling. Keeps both tiles in front at the target depth, up to a daily limit."
status = "normal"

["Building.ArtesianWell.FlavorDescription"]
new = "\"After everything we gave, the ground finally gave back.\""
status = "normal"

