["Building.ArtesianWell.Description"]
raw = "Drilled deep into a confined aquifer. The pressure underground pushes clean water up by itself: no power, no workers, no refilling. Keeps both tiles in front at the target depth, up to a daily limit."
status = "normal"
enUS = "Drilled deep into a confined aquifer. Underground pressure pushes clean water up by itself: no power, no workers, no refilling. Keeps both tiles in front at the target depth, up to a daily limit."
zhCN = "深入钻探至承压含水层。地下压力会自行将清水推上来：无需动力、无需工人，也无需补充水源。可将前方两格的水位维持在目标深度，但每天有上限。"
zhTW = "深入鑽入封閉含水層。地下壓力會自行將乾淨水推送上來：不需動力、工人，也不需補水。會在目標深度維持前方兩格的水位，每日抽水量有上限。"
ruRU = "Пробурена глубоко в замкнутый водоносный горизонт. Подземное давление само поднимает чистую воду: не нужны ни энергия, ни рабочие, ни пополнение запасов. Поддерживает оба участка впереди на заданной глубине в пределах суточного лимита."
jaJP = "被圧帯水層まで深く掘り下げています。地下の圧力で、電力も作業員も補充もなしに、きれいな水が自然に押し上げられます。前方の2マスを目標深度に保ちますが、1日あたりの上限があります。"
frFR = "Foré profondément dans un aquifère captif. La pression souterraine fait remonter l’eau propre toute seule : pas d’énergie, pas de travailleurs, pas de remplissage. Maintient les deux cases devant lui à la profondeur cible, dans la limite quotidienne."
deDE = "Tief in einen gespannten Grundwasserleiter gebohrt. Der unterirdische Druck befördert sauberes Wasser von selbst nach oben: ohne Strom, ohne Arbeiter, ohne Nachfüllen. Versorgt beide Felder davor bis zur Zieltiefe, bis zu einer täglichen Höchstmenge."
plPL = "Wierci głęboko w uwięzionym poziomie wodonośnym. Podziemne ciśnienie samo wypycha czystą wodę na powierzchnię: nie potrzeba zasilania ani pracowników, a studni nie trzeba uzupełniać. Utrzymuje obie kratki przed sobą na docelowej głębokości, do dziennego limitu."
ptBR = "Perfurado profundamente em um aquífero confinado. A pressão subterrânea empurra a água limpa para cima por conta própria: sem energia, sem trabalhadores, sem reabastecimento. Mantém os dois terrenos à frente na profundidade desejada, até um limite diário."
koKR = "가둬진 대수층 깊숙이 구멍을 뚫었습니다. 지하의 압력으로 깨끗한 물이 저절로 솟아오릅니다. 동력도, 일꾼도, 재충전도 필요 없습니다. 하루 한도까지, 앞쪽 두 칸을 목표 수심으로 유지합니다."
csCZ = "Vyhloubená hluboko do uzavřené zvodnělé vrstvy. Podzemní tlak sám vytlačuje čistou vodu nahoru: bez energie, bez pracovníků, bez doplňování. Udržuje obě políčka před sebou na cílové hloubce, až do denního limitu."
viVN = "Được khoan sâu vào tầng chứa nước ngầm bị giới hạn. Áp suất dưới lòng đất tự đẩy nước sạch lên: không cần năng lượng, công nhân hay tiếp nước lại. Duy trì cả hai ô phía trước ở độ sâu mục tiêu, tối đa theo giới hạn mỗi ngày."
trTR = "Basınçlı bir yeraltı suyu akiferine kadar derinlemesine delinmiştir. Yeraltındaki basınç temiz suyu kendiliğinden yukarı iter: güç gerekmez, işçi gerekmez, yeniden doldurmak gerekmez. Önündeki iki kareyi hedef derinlikte, günlük sınıra kadar suyla dolu tutar."

["Building.ArtesianWell.FlavorDescription"]
raw = "\"After everything we gave, the ground finally gave back.\""
status = "normal"
enUS = "\"After everything we gave, the ground finally gave back.\""
zhCN = "“在我们付出一切之后，大地终于回馈了我们。”"
zhTW = "「在我們付出一切之後，大地終於回饋了我們。」"
ruRU = "«После всего, что мы отдали, земля наконец отплатила нам тем же.»"
jaJP = "「私たちが与えたすべての後に、ついに大地が返してくれた。」"
frFR = "« Après tout ce que nous lui avons donné, la terre a enfin rendu la pareille. »"
deDE = "„Nachdem wir alles gegeben hatten, gab der Boden endlich etwas zurück.“"
plPL = "„Po tym wszystkim, co daliśmy, ziemia w końcu nam odpłaciła”."
ptBR = "“Depois de tudo que demos, finalmente a terra nos retribuiu.”"
koKR = "“우리가 바친 모든 것 끝에, 땅이 마침내 돌려주었다.”"
csCZ = "„Po všem, co jsme dali, nám země konečně něco vrátila.“"
viVN = "“Sau tất cả những gì chúng ta đã trao đi, cuối cùng đất cũng đền đáp.”"
trTR = "“Bunca şey verdikten sonra, toprak sonunda karşılığını verdi.”"

