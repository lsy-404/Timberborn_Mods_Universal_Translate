["Building.FloatValveDischarge.Description"]
status = "normal"
raw = "Haulers fill its tank with water. Like a cistern, it pours into the tile in front until the water there reaches the target depth, then stops by itself. No workers needed."
enUS = "Haulers fill its tank with water. Like a cistern, it pours into the tile in front until the water there reaches the target depth, then stops by itself. No workers needed."
zhCN = "搬运工会将水装入其水箱。与蓄水池一样，它会将水倒入前方的地块，直到那里的水达到目标深度，然后自动停止。无需工人。"
zhTW = "搬運工會將水裝滿其水槽。和蓄水池一樣，它會將水倒入前方的地塊，直到該處水深達到目標深度，然後自動停止。無需工人。"
ruRU = "Переносчики наполняют его резервуар водой. Как и цистерна, оно выливает воду на клетку впереди, пока глубина воды там не достигнет целевого уровня, а затем останавливается само. Рабочие не нужны."
jaJP = "運搬人がタンクに水を補充します。貯水槽と同様に、前方のマスの水深が目標に達するまで水を流し、その後は自動で停止します。作業員は不要です。"
frFR = "Les transporteurs remplissent son réservoir d’eau. Comme une citerne, il déverse de l’eau sur la case devant lui jusqu’à ce que celle-ci atteigne la profondeur cible, puis s’arrête automatiquement. Aucun ouvrier n’est nécessaire."
deDE = "Transportarbeiter füllen den Tank mit Wasser. Wie eine Zisterne gibt es Wasser auf das Feld davor ab, bis es dort die Zieltiefe erreicht, und stoppt dann automatisch. Keine Arbeiter erforderlich."
plPL = "Tragarze napełniają jego zbiornik wodą. Podobnie jak cysterna, wylewa wodę na pole przed sobą, aż osiągnie ona tam docelową głębokość, po czym samoczynnie się zatrzymuje. Nie wymaga pracowników."
ptBR = "Transportadores enchem seu tanque com água. Como uma cisterna, ela despeja água no bloco à frente até que a água ali atinja a profundidade desejada; então, para automaticamente. Não precisa de trabalhadores."
koKR = "운반꾼이 이곳의 물탱크에 물을 채웁니다. 저수조처럼 앞쪽 타일에 목표 수심에 도달할 때까지 물을 쏟아붓고, 그러면 자동으로 멈춥니다. 작업자는 필요하지 않습니다."
csCZ = "Dopravci plní její nádrž vodou. Stejně jako cisterna ji vypouští do políčka před sebou, dokud tam voda nedosáhne cílové hloubky, a pak se sama zastaví. Nejsou potřeba žádní pracovníci."
viVN = "Nhân công vận chuyển đổ đầy nước vào bể chứa. Tương tự bể chứa nước, công trình xả nước xuống ô phía trước cho đến khi nước ở đó đạt độ sâu mục tiêu, rồi tự dừng. Không cần công nhân."
trTR = "Taşıyıcılar tankını suyla doldurur. Bir sarnıç gibi, önündeki kareye su boşaltır; oradaki su hedef derinliğe ulaşınca kendiliğinden durur. İşçi gerekmez."

["Building.FloatValveDischarge.FlavorDescription"]
new = "\"The float rises, the tap closes. Simple.\""
status = "normal"
enUS = "\"The float rises, the tap closes. Simple.\""
zhCN = "“浮子升起，阀门关闭。就这么简单。”"
ruRU = "«Поплавок поднимается, кран закрывается. Всё просто.»"
jaJP = "「フロートが上がると、タップが閉じる。簡単だ。」"
frFR = "« Le flotteur monte, le robinet se ferme. Simple. »"
deDE = "„Der Schwimmer steigt, der Hahn schließt sich. Ganz einfach.“"
plPL = "„Pływak się unosi, zawór się zamyka. Proste.”"
ptBR = "“A boia sobe, a torneira fecha. Simples.”"
koKR = "“부표가 올라가면 밸브가 닫혀. 간단하지.”"
csCZ = "„Plovák stoupá, kohoutek se zavírá. Jednoduché.“"
viVN = "“Phao nổi lên, vòi đóng lại. Đơn giản.”"
trTR = "“Şamandıra yükselir, musluk kapanır. Basit.”"

