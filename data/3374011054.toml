["eMka.Minimap.Settings.ChunkSizeTooltip"]
raw = "The size of the chunks that the minimap is divided into for rendering.\nLower values will cause the minimap to render slower, but may help with performance issues."
status = "normal"
enUS = "The size of the chunks that the minimap is divided into for rendering. Lower values will cause the minimap to render slower, but may help with performance issues."
zhCN = "小地图划分为渲染区块的大小。<br>较小的值会降低地图渲染速度，但可能减小性能占用。"
zhTW = "迷你地圖分割的塊大小以進行渲染。較低的數值將導致迷你地圖渲染速度變慢，但可能有助於解決性能問題。"
ruRU = "Размер фрагментов, на которые разделяется мини-карта для отображения. Более низкие значения могут замедлить отрисовку мини-карты, но могут помочь с проблемами производительности."
jaJP = "ミニマップがレンダリングのために分割されるチャンクのサイズ。値が低いほど、ミニマップのレンダリングが遅くなりますが、パフォーマンスの問題を改善する可能性があります。"
frFR = "La taille des morceaux dans lesquels la minimap est divisée pour le rendu. Des valeurs plus faibles ralentiront le rendu de la minimap, mais pourraient aider à résoudre des problèmes de performances."
deDE = "Die Größe der Abschnitte, in die die Minikarte zum Rendern unterteilt ist. Niedrigere Werte führen dazu, dass die Minikarte langsamer gerendert wird, können jedoch bei Leistungsproblemen helfen."
plPL = "Rozmiar fragmentów, na które podzielona jest mapa minimap do renderowania. Niższe wartości mogą spowodować wolniejsze renderowanie minimapy, ale mogą pomóc w problemach z wydajnością."
ptBR = "O tamanho dos blocos em que o minimapa é dividido para renderização. Valores mais baixos farão com que o minimapa renderize mais devagar, mas podem ajudar com problemas de performance."
koKR = "미니맵이 렌더링을 위해 나누어지는 청크의 크기입니다. 값이 낮을수록 미니맵의 렌더링 속도가 느려지지만 성능 문제를 해결하는 데 도움이 될 수 있습니다."
trTR = "Minimap'in render edilmesi için bölündüğü parçaların boyutu.\nDaha düşük değerler, minimap'in daha yavaş render edilmesine neden olacaktır, ancak performans sorunlarına yardımcı olabilir."
esES = "El tamaño de los fragmentos en que se divide el minimapa para su renderizado.\nValores más bajos harán que el minimapa se renderice más lentamente, pero pueden ayudar con problemas de rendimiento."
itIT = "La dimensione dei blocchi in cui la minimappa è suddivisa per il rendering.\nI valori più bassi faranno sì che la minimappa venga renderizzata più lentamente, ma possono aiutare con i problemi di prestazioni."
ukUA = "Розмір фрагментів, на які поділено міні-карту для відображення.\nМенші значення сповільнюють відображення міні-карти, але можуть допомогти з проблемами продуктивності."
thTH = "ขนาดของชิ้นส่วนที่แผนที่ขนาดเล็กถูกแบ่งออกเพื่อการเรนเดอร์\nค่าที่ต่ำลงจะทำให้แผนที่ขนาดเล็กเรนเดอร์ช้าลง แต่อาจช่วยแก้ปัญหาด้านประสิทธิภาพได้"
csCZ = "Velikost částí, na které je minimapa rozdělena pro vykreslení. Nižší hodnoty způsobí pomalejší vykreslování minimapy, ale mohou pomoci s problémem s výkonem."
viVN = "Kích thước của các khối mà bản đồ thu nhỏ được chia thành để hiển thị.\nCác giá trị nhỏ hơn sẽ khiến bản đồ thu nhỏ hiển thị chậm hơn, nhưng có thể giúp cải thiện hiệu suất."
caES = "La mida dels blocs en què es divideix el minimapa per a la representació.\nEls valors més baixos faran que el minimapa es representi més lentament, però poden ajudar amb els problemes de rendiment."
beBY = "Памер блокаў, на якія падзяляецца міні-карта для адлюстравання.\nМеншыя значэнні прывядуць да таго, што міні-карта будзе адлюстроўвацца павольней, але могуць дапамагчы пры праблемах з прадукцыйнасцю."
roRO = "Dimensiunea segmentelor în care este împărțită hartă mică pentru randare.\nValorile mai mici vor face ca harta mică să se randeze mai lent, dar pot ajuta la problemele de performanță."
huHU = "A térkép azon darabjainak mérete, amelyekre a kistérkép a megjelenítéshez fel van osztva.\nAz alacsonyabb értékek miatt a kistérkép lassabban jelenik meg, de segíthetnek a teljesítménnyel kapcsolatos problémákon."
arSA = "حجم الأجزاء التي يُقسَّم إليها الخريطة المصغرة لأغراض العرض.\nكلما قلَّت القيم، أصبح عرض الخريطة المصغرة أبطأ، لكنها قد تساعد في حل مشكلات الأداء."

