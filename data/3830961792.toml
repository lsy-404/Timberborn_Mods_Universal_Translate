["PerformancePlus.Settings.FrameRateGovernor.Tooltip"]
status = "normal"
raw = "Slows the game below the speed you chose whenever frames would take too long, so the frame rate stays at the target below. The game plays the same, only more slowly while it is busy. It never goes below x1 and leaves VSync as it is. Off: the speed you choose is always used."
enUS = "Slows the game below your chosen speed whenever frames would take too long, keeping the frame rate at the target below. The game plays the same, just more slowly while it's busy. It never goes below x1 and leaves VSync unchanged. Off: Always uses your chosen speed."
zhCN = "当帧耗时过长时，会将游戏速度降低到你所选速度以下，使帧率保持在下方设定的目标值。游戏玩法不变，只是在负载较高时运行得更慢。速度不会低于 x1，且不会改变 VSync 设置。关闭：始终使用你所选的速度。"
zhTW = "只要影格耗時過長，就會將遊戲速度降到你所選速度以下，讓影格率維持在下方設定的目標。遊戲內容不變，只是在忙碌時進行得比較慢。速度絕不會低於 x1，且不會更動 VSync。關閉：一律使用你選擇的速度。"
ruRU = "Замедляет игру относительно выбранной вами скорости, когда кадры формируются слишком долго, чтобы частота кадров оставалась на целевом уровне, указанном ниже. Игра работает так же, только медленнее при высокой нагрузке. Скорость не опускается ниже x1, а настройка VSync остаётся без изменений. Выкл.: всегда используется выбранная вами скорость."
jaJP = "フレームの処理に時間がかかりすぎる場合、ゲーム速度を選択した速度より下げて、下記の目標フレームレートを維持します。ゲーム内容は変わらず、負荷が高い間は進行が遅くなるだけです。速度がx1を下回ることはなく、VSyncの設定も変更しません。オフ：常に選択した速度で動作します。"
frFR = "Ralentit le jeu en dessous de la vitesse choisie lorsque le rendu des images prend trop de temps, afin que la fréquence d’images reste à la cible définie ci-dessous. Le jeu se déroule de la même façon, mais plus lentement lorsqu’il est sollicité. Ne descend jamais en dessous de x1 et ne modifie pas la VSync. Désactivé : la vitesse choisie est toujours utilisée."
deDE = "Drosselt das Spiel unter die von dir gewählte Geschwindigkeit, wenn Frames zu lange brauchen würden, damit die unten eingestellte Zielbildrate eingehalten wird. Das Spiel läuft gleich ab, nur langsamer, wenn es stark ausgelastet ist. Die Geschwindigkeit sinkt nie unter x1, und VSync bleibt unverändert. Aus: Es wird immer die von dir gewählte Geschwindigkeit verwendet."
plPL = "Spowalnia grę poniżej wybranej prędkości, gdy generowanie klatek trwałoby zbyt długo, aby utrzymać poniższą docelową liczbę klatek na sekundę. Gra działa tak samo, tylko wolniej, gdy jest obciążona. Nigdy nie spowalnia poniżej x1 i pozostawia VSync bez zmian. Wyłączone: zawsze używana jest wybrana prędkość."
ptBR = "Reduz a velocidade do jogo para menos que a escolhida sempre que os quadros demorariam demais, para manter a taxa de quadros na meta definida abaixo. O jogo continua igual, apenas mais devagar quando está sobrecarregado. Nunca fica abaixo de x1 e não altera o VSync. Desativado: a velocidade escolhida é sempre usada."
koKR = "프레임 처리에 너무 오래 걸릴 때 선택한 게임 속도를 낮춰 아래에 설정한 목표 프레임률을 유지합니다. 게임은 똑같이 진행되며, 바쁠 때만 더 느리게 진행됩니다. 속도는 x1 미만으로 내려가지 않으며 VSync 설정은 그대로 둡니다. 끔: 항상 선택한 속도를 사용합니다."
trTR = "Karelerin işlenmesi çok uzun sürecek olduğunda, kare hızı aşağıdaki hedefte kalsın diye oyunu seçtiğiniz hızın altına düşürür. Oyun aynı şekilde oynanır, yalnızca yoğunken daha yavaş çalışır. x1'in altına asla düşmez ve VSync'i olduğu gibi bırakır. Kapalı: Seçtiğiniz hız her zaman kullanılır."
esES = "Reduce la velocidad del juego por debajo de la que elegiste siempre que los fotogramas tarden demasiado en generarse, para que la tasa de fotogramas se mantenga en el objetivo indicado más abajo. El juego funciona igual, solo que más lentamente cuando está ocupado. Nunca baja de x1 y deja la sincronización vertical (VSync) tal como está. Desactivado: siempre se usa la velocidad que elegiste."
itIT = "Rallenta il gioco al di sotto della velocità scelta quando i fotogrammi richiederebbero troppo tempo, così la frequenza dei fotogrammi rimane al valore obiettivo indicato sotto. Il gioco funziona allo stesso modo, solo più lentamente quando è sotto carico. Non scende mai sotto x1 e lascia invariato VSync. Disattivato: viene sempre usata la velocità scelta."
ukUA = "Гра сповільнюється нижче вибраної швидкості, коли кадри обробляються надто довго, щоб частота кадрів залишалася на цільовому рівні, вказаному нижче. Гра працює так само, лише повільніше, коли вона сильно завантажена. Швидкість ніколи не опускається нижче x1, а VSync залишається без змін. Вимкнено: завжди використовується вибрана вами швидкість."
thTH = "ลดความเร็วเกมให้ต่ำกว่าความเร็วที่คุณเลือกเมื่อการประมวลผลเฟรมใช้เวลานานเกินไป เพื่อให้อัตราเฟรมคงอยู่ตามเป้าหมายด้านล่าง เกมยังเล่นเหมือนเดิม เพียงแต่ช้าลงขณะมีภาระงานมาก จะไม่ลดต่ำกว่า x1 และจะไม่เปลี่ยนการตั้งค่า VSync ปิด: ใช้ความเร็วที่คุณเลือกเสมอ"
csCZ = "Zpomalí hru pod vámi zvolenou rychlost, kdykoli by vykreslování snímků trvalo příliš dlouho, aby snímková frekvence zůstala na níže uvedené cílové hodnotě. Hra se hraje stejně, jen při zátěži pomaleji. Nikdy neklesne pod x1 a VSync ponechá beze změny. Vypnuto: vždy se používá vámi zvolená rychlost."
viVN = "Tự động giảm tốc độ trò chơi xuống thấp hơn mức bạn đã chọn khi khung hình mất quá nhiều thời gian để dựng, để tốc độ khung hình duy trì ở mục tiêu bên dưới. Trò chơi vẫn diễn ra như cũ, chỉ chậm hơn khi đang bận. Tốc độ không bao giờ thấp hơn x1 và giữ nguyên VSync. Tắt: luôn sử dụng tốc độ bạn đã chọn."
caES = "Redueix la velocitat del joc per sota de la que has triat sempre que els fotogrames trigarien massa a generar-se, perquè la freqüència de fotogrames es mantingui en l’objectiu indicat a continuació. El joc funciona igual, només més lentament quan està ocupat. Mai baixa de x1 i deixa la sincronització vertical (VSync) tal com està. Desactivat: sempre s’utilitza la velocitat que has triat."
beBY = "Запавольвае гульню ніжэй за выбраную хуткасць, калі кадры займаюць занадта шмат часу, каб частата кадраў заставалася на зададзеным ніжэй узроўні. Гульня працуе гэтак жа, толькі павольней, пакуль занятая. Хуткасць ніколі не апускаецца ніжэй за x1, а VSync застаецца без змен. Выкл.: заўсёды выкарыстоўваецца выбраная хуткасць."
roRO = "Încetinește jocul sub viteza aleasă ori de câte ori cadrele durează prea mult, astfel încât rata de cadre să rămână la ținta de mai jos. Jocul se desfășoară la fel, doar mai încet când este solicitat. Nu coboară niciodată sub x1 și lasă VSync neschimbat. Dezactivat: se folosește întotdeauna viteza aleasă."
huHU = "Lassítja a játékot a választott sebesség alá, ha a képkockák előállítása túl sokáig tart, hogy a képkockasebesség az alább megadott célértéken maradjon. A játék ugyanúgy működik, csak leterheltség esetén lassabban. Soha nem lassít x1 alá, és a VSync beállítását változatlanul hagyja. Kikapcsolva: mindig a választott sebesség érvényesül."
arSA = "يُبطّئ اللعبة إلى ما دون السرعة التي اخترتها كلما استغرق عرض الإطارات وقتًا أطول من اللازم، ليبقى معدل الإطارات عند الهدف أدناه. تظل طريقة اللعب كما هي، لكن اللعبة تصبح أبطأ فقط أثناء انشغالها. لا تنخفض السرعة أبدًا عن x1، ويظل VSync على حاله. إيقاف: تُستخدم السرعة التي اخترتها دائمًا."

