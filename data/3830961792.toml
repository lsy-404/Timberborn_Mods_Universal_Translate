zhCN = "启用上方设置时维持的帧率，可设为每秒 10 到 120 帧。"
zhTW = "啟用上方設定時維持的影格率，範圍為每秒 10 至 120 幀。"
ruRU = "Частота кадров, поддерживаемая при включённой настройке выше: от 10 до 120 кадров в секунду."
jaJP = "上記の設定がオンの間に維持されるフレームレート（毎秒10～120フレーム）。"
frFR = "Fréquence d’images maintenue lorsque le paramètre ci-dessus est activé, de 10 à 120 images par seconde."
deDE = "Die Bildrate, die bei aktivierter obiger Einstellung beibehalten wird (10 bis 120 Bilder pro Sekunde)."
plPL = "Liczba klatek na sekundę utrzymywana, gdy powyższe ustawienie jest włączone, od 10 do 120 klatek na sekundę."
ptBR = "Taxa de quadros mantida enquanto a configuração acima estiver ativada, de 10 a 120 quadros por segundo."
