["PerformancePlus.Settings.ShorterShadows.Tooltip"]
status = "normal"
raw = "Draws shadows only up to 60 m from the camera instead of across the whole view, which saves time every frame in large settlements. The far part of the view has no shadows. Off: shadows as far as the game draws them."
enUS = "Draws shadows only up to 60 m from the camera instead of across the whole view, which saves time every frame in large settlements. The far part of the view has no shadows. Off: shadows as far as the game draws them."
zhCN = "阴影仅渲染到距摄像机 60 m 以内，而非覆盖整个视野，在大型聚居地中可节省每帧的处理时间。视野远处没有阴影。关闭：阴影会延伸至游戏所能渲染的最远处。"
zhTW = "陰影只會繪製到距離攝影機 60 m 的範圍內，而非覆蓋整個視野，因此在大型聚落中每個影格都能節省運算時間。視野遠處不會有陰影。關閉：陰影會延伸到遊戲原本能繪製的最遠距離。"
ruRU = "Отображает тени только в пределах 60 м от камеры, а не по всему полю зрения, что экономит время на каждом кадре в крупных поселениях. В дальней части изображения теней нет. Выкл.: тени отображаются на максимально возможном для игры расстоянии."
jaJP = "カメラから60 m以内にのみ影を描画し、視界全体に描画する場合と比べて、大規模な集落ではフレームごとの処理時間を節約します。視界の遠方には影が表示されません。オフ：ゲームが描画する範囲まで影を描画します。"
frFR = "Les ombres ne sont rendues que jusqu'à 60 m de la caméra au lieu de couvrir toute la vue, ce qui réduit le temps de calcul à chaque image dans les grandes colonies. La partie éloignée de la vue n'a pas d'ombres. Désactivé : les ombres sont rendues jusqu'à la distance maximale prévue par le jeu."
deDE = "Schatten werden nur bis zu 60 m von der Kamera entfernt dargestellt statt über die gesamte Ansicht. Das spart in großen Siedlungen bei jedem Frame Zeit. Im weiter entfernten Teil der Ansicht gibt es keine Schatten. Aus: Schatten so weit, wie das Spiel sie darstellt."
plPL = "Rysuje cienie tylko w odległości do 60 m od kamery zamiast w całym polu widzenia, co oszczędza czas przy każdej klatce w dużych osadach. W dalszej części widoku nie ma cieni. Wył.: cienie są rysowane tak daleko, jak sięga zasięg gry."
ptBR = "Desenha sombras somente até 60 m da câmera, em vez de em toda a área visível, economizando tempo a cada quadro em assentamentos grandes. A parte distante da área visível fica sem sombras. Desativado: sombras até onde o jogo as desenha."
koKR = "화면 전체가 아니라 카메라에서 최대 60 m 거리까지만 그림자를 렌더링하여, 대규모 정착지에서 매 프레임 시간을 절약합니다. 화면의 먼 부분에는 그림자가 없습니다. 끔: 게임에서 렌더링하는 범위까지 그림자를 표시합니다."
trTR = "Gölgeleri tüm görüntü boyunca çizmek yerine kameradan yalnızca 60 m'ye kadar çizer; bu da büyük yerleşimlerde her karede zaman kazandırır. Görüntünün uzak kısmında gölge olmaz. Kapalı: Gölgeler, oyunun çizebildiği en uzak noktaya kadar çizilir."
esES = "Dibuja sombras solo hasta 60 m de la cámara en lugar de en toda la vista, lo que ahorra tiempo en cada fotograma en asentamientos grandes. La parte lejana de la vista no tiene sombras. Desactivado: sombras hasta donde las dibuja el juego."
itIT = "Disegna le ombre solo fino a 60 m dalla telecamera invece che su tutta la visuale, risparmiando tempo a ogni fotogramma negli insediamenti grandi. La parte lontana della visuale non ha ombre. Disattivato: ombre fino alla massima distanza a cui il gioco le disegna."
ukUA = "Тіні промальовуються лише на відстані до 60 м від камери, а не по всьому полю зору, що заощаджує час на кожному кадрі у великих поселеннях. У віддаленій частині поля зору тіней немає. Вимкнено: тіні промальовуються на всю відстань, на яку їх промальовує гра."
thTH = "แสดงเงาเฉพาะในระยะไม่เกิน 60 m จากกล้อง แทนที่จะแสดงทั่วทั้งมุมมอง ซึ่งช่วยประหยัดเวลาในแต่ละเฟรมเมื่ออยู่ในชุมชนขนาดใหญ่ พื้นที่ส่วนไกลของมุมมองจะไม่มีเงา ปิด: แสดงเงาได้ไกลเท่าที่เกมจะเรนเดอร์ได้"
csCZ = "Vykresluje stíny pouze do vzdálenosti 60 m od kamery, nikoli v celém záběru, což v rozsáhlých osadách šetří čas při každém snímku. Ve vzdálené části záběru nejsou žádné stíny. Vypnuto: stíny až do vzdálenosti, do které je hra vykresluje."
viVN = "Chỉ vẽ bóng đổ trong phạm vi 60 m tính từ camera thay vì trên toàn bộ khung nhìn, giúp tiết kiệm thời gian xử lý ở mỗi khung hình trong các khu định cư lớn. Phần xa của khung nhìn sẽ không có bóng đổ. Tắt: bóng đổ được vẽ xa đến mức trò chơi cho phép."
caES = "Dibuixa ombres només fins a 60 m de la càmera, en lloc de fer-ho a tota la vista, cosa que estalvia temps a cada fotograma en assentaments grans. La part més allunyada de la vista no té ombres. Desactivat: ombres fins on les dibuixa el joc."
beBY = "Малюе цені толькі на адлегласці да 60 м ад камеры, а не па ўсім полі зроку, што эканоміць час на кожным кадры ў вялікіх паселішчах. У далёкай частцы поля зроку ценяў няма. Выкл.: цені адлюстроўваюцца настолькі далёка, наколькі іх малюе гульня."
roRO = "Redă umbrele doar până la o distanță de 60 m de cameră, în loc să le redea pe întregul câmp vizual, economisind timp la fiecare cadru în așezările mari. Partea îndepărtată a câmpului vizual nu are umbre. Dezactivat: umbrele sunt redate până la distanța maximă la care le redă jocul."
huHU = "A teljes látómező helyett csak a kamerától legfeljebb 60 m-re rajzol árnyékokat, így nagy településeken minden képkockánál időt takarít meg. A látómező távolabbi részén nincsenek árnyékok. Kikapcsolva: árnyékok olyan messzire, ameddig a játék kirajzolja őket."
arSA = "يعرض الظلال حتى مسافة 60 م من الكاميرا فقط، بدلًا من عرضها في كامل مجال الرؤية، مما يوفر وقتًا مع كل إطار في المستوطنات الكبيرة. لا تظهر الظلال في الجزء البعيد من مجال الرؤية. إيقاف: تُعرض الظلال حتى أقصى مدى ترسمها فيه اللعبة."
