trTR = "Yukarıdaki ayar açıkken korunacak kare hızı: saniyede 10 ila 120 kare."
esES = "La frecuencia de fotogramas que se mantiene cuando la opción anterior está activada, de 10 a 120 fotogramas por segundo."
itIT = "Frequenza dei fotogrammi mantenuta quando l'impostazione precedente è attiva: da 10 a 120 fotogrammi al secondo."
ukUA = "Частота кадрів, що підтримується, коли ввімкнено наведений вище параметр: від 10 до 120 кадрів за секунду."
thTH = "อัตราเฟรมที่คงไว้เมื่อเปิดการตั้งค่าด้านบน ตั้งแต่ 10 ถึง 120 เฟรมต่อวินาที"
csCZ = "Snímková frekvence udržovaná při zapnutém výše uvedeném nastavení, od 10 do 120 snímků za sekundu."
viVN = "Tốc độ khung hình được duy trì khi bật cài đặt phía trên, từ 10 đến 120 khung hình mỗi giây."
caES = "La taxa de fotogrames que es manté quan l'opció anterior està activada, de 10 a 120 fotogrames per segon."
beBY = "Частата кадраў, якая будзе падтрымлівацца, калі ўключана налада вышэй: ад 10 да 120 кадраў у секунду."
roRO = "Rata de cadre menținută cât timp setarea de mai sus este activată, între 10 și 120 de cadre pe secundă."
huHU = "A fentebb megadott beállítás bekapcsolt állapotában tartott képkockasebesség, másodpercenként 10 és 120 képkocka között."
