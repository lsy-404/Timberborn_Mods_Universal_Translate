["PerformancePlus.Settings.TickLength.Tooltip"]
status = "normal"
raw = "How long each step of the simulation is, in percent of the game's own (0.6 s). Longer steps mean fewer of them a day, so the game keeps up at higher speeds; days, growth, needs and walking take as long as before. Slightly delays beaver decisions, which leads to minor inefficiencies. Needs \"Allow minor gameplay changes\". Applies when a settlement is loaded. With \"Tick length follows the frame rate\" on, this is the longest a step gets. 100: the game's own."
enUS = "Length of each simulation step, as a percentage of the game's own (0.6 s). Longer steps mean fewer steps per day, helping the game keep up at higher speeds; days, growth, needs, and walking take the same amount of time as before. Beaver decisions are delayed slightly, causing minor inefficiencies. Requires \"Allow minor gameplay changes.\" Applies when a settlement is loaded. When \"Tick length follows the frame rate\" is on, this is the longest a step can be. 100: the game's own."
zhCN = "每个模拟步长的时长，相对于游戏原生步长（0.6 s）的百分比。步长越长，每天的步数就越少，因此游戏在更高速度下也能跟上；游戏内一天的时长、作物生长、需求变化和行走所需的时间仍与之前相同。海狸做出决策会略有延迟，从而造成轻微的效率损失。需要启用“允许轻微的玩法变化”。在载入聚居地时生效。启用“步长随帧率变化”时，此设置决定步长的最长时长。100：游戏原生步长。"
zhTW = "每個模擬步驟的長度，以遊戲原始步長（0.6 s）的百分比表示。步長越長，每天的步數就越少，因此遊戲在較高速度下也能跟上；一天的長度、生長、需求和行走所需時間則維持不變。海狸的決策會稍微延遲，造成些微效率損失。需要啟用「允許輕微的遊戲玩法變更」。在載入聚落時套用。啟用「步長隨影格率變化」時，此值是步長可達的上限。100：遊戲原始步長。"
ruRU = "Длительность каждого шага симуляции в процентах от стандартной длительности шага игры (0,6 с). Более длинные шаги означают, что за день их будет меньше, поэтому игра справляется с более высокой скоростью; дни, рост, потребности и ходьба занимают столько же времени, что и раньше. Немного задерживает решения бобров, что приводит к небольшим потерям эффективности. Требуется включить «Допустить небольшие изменения игрового процесса». Применяется при загрузке поселения. Если включена настройка «Длительность шага зависит от частоты кадров», это максимальная длительность шага. 100: стандартная длительность шага игры."
jaJP = "シミュレーションの各ステップの長さを、ゲーム本来の長さ（0.6 s）に対する割合で指定します。ステップが長いほど1日あたりのステップ数が減るため、ゲームはより高速でも処理が追いつきます。日数、成長、ニーズ、歩行にかかる時間は以前と変わりません。ビーバーの判断がわずかに遅れ、軽微な非効率が生じます。「軽微なゲームプレイの変更を許可」が必要です。集落を読み込んだときに適用されます。「ステップの長さをフレームレートに合わせる」がオンの場合、ステップの長さはこの値を超えません。100：ゲーム本来の長さ。"
frFR = "Durée de chaque étape de la simulation, en pourcentage de celle du jeu (0,6 s). Des étapes plus longues signifient qu'il y en a moins par jour, ce qui permet au jeu de suivre à des vitesses plus élevées ; les jours, la croissance, les besoins et les déplacements à pied durent autant qu'avant. Retarde légèrement les décisions des castors, ce qui entraîne de petites inefficacités. Nécessite « Autoriser de légers changements de gameplay ». S'applique au chargement d'une colonie. Lorsque « La durée des étapes suit la fréquence d'images » est activé, il s'agit de la durée maximale d'une étape. 100 : celle du jeu."
deDE = "Dauer jedes Simulationsschritts als Prozentsatz der spielinternen Schrittdauer (0.6 s). Längere Schritte bedeuten weniger Schritte pro Tag, sodass das Spiel bei höheren Geschwindigkeiten mithalten kann; Tage, Wachstum, Bedürfnisse und Fortbewegung dauern genauso lange wie zuvor. Die Entscheidungen der Biber verzögern sich leicht, was zu geringfügigen Ineffizienzen führt. Erfordert „Geringfügige Gameplay-Änderungen zulassen“. Wird angewendet, wenn eine Siedlung geladen wird. Wenn „Schrittdauer folgt der Bildrate“ aktiviert ist, ist dies die maximale Dauer eines Schritts. 100: die spielinterne Schrittdauer."
plPL = "Jak długo trwa każdy krok symulacji, wyrażone jako procent standardowego kroku gry (0,6 s). Dłuższe kroki oznaczają, że w ciągu dnia jest ich mniej, więc gra nadąża przy większych prędkościach; dni, wzrost, potrzeby i chodzenie nadal trwają tyle samo. Nieznacznie opóźnia decyzje bobrów, co prowadzi do drobnych nieefektywności. Wymaga opcji „Zezwalaj na drobne zmiany w rozgrywce”. Obowiązuje po wczytaniu osady. Gdy włączona jest opcja „Długość kroku zależy od liczby klatek”, jest to maksymalna długość kroku. 100: standardowy krok gry."
ptBR = "Duração de cada etapa da simulação, em porcentagem do valor padrão do próprio jogo (0.6 s). Etapas mais longas significam menos etapas por dia, então o jogo acompanha velocidades mais altas; dias, crescimento, necessidades e caminhadas continuam durando o mesmo que antes. Atrasa ligeiramente as decisões dos castores, causando pequenas ineficiências. Requer \"Permitir pequenas mudanças na jogabilidade\". Aplica-se quando um assentamento é carregado. Com \"A duração do ciclo acompanha a taxa de quadros\" ativada, este é o tempo máximo de uma etapa. 100: o valor padrão do próprio jogo."
koKR = "시뮬레이션 단계 하나의 길이를 게임 기본 단계(0.6초)의 백분율로 설정합니다. 단계가 길어지면 하루의 단계 수가 줄어들어 게임이 더 높은 속도에서도 따라갈 수 있습니다. 하루의 길이, 성장, 욕구 및 이동에 걸리는 시간은 이전과 같습니다. 비버의 결정이 약간 늦어져 사소한 비효율이 발생합니다. \"사소한 게임플레이 변경 허용\"이 필요합니다. 정착지를 불러올 때 적용됩니다. \"단계 길이를 프레임 속도에 맞춤\"이 켜져 있으면 단계 길이의 최댓값이 됩니다. 100: 게임 기본값."
trTR = "Simülasyonun her adımının süresi, oyunun kendi adımına (0.6 s) göre yüzde olarak belirtilir. Daha uzun adımlar, bir günde daha az adım atılması demektir; böylece oyun daha yüksek hızlarda ayak uydurabilir. Günler, büyüme, ihtiyaçlar ve yürüme eskisi kadar sürer. Kunduzların kararlarını biraz geciktirir ve küçük verimsizliklere yol açar. \"Küçük oynanış değişikliklerine izin ver\" ayarını gerektirir. Yerleşim yüklendiğinde uygulanır. \"Adım süresi kare hızını takip eder\" açıkken, bir adımın ulaşabileceği en uzun süre budur. 100: Oyunun kendi adımı."
esES = "Duración de cada paso de la simulación, como porcentaje de la duración propia del juego (0.6 s). Los pasos más largos implican menos pasos al día, así que el juego puede seguir el ritmo a velocidades más altas; los días, el crecimiento, las necesidades y los desplazamientos duran lo mismo que antes. Retrasa ligeramente las decisiones de los castores, lo que provoca pequeñas ineficiencias. Requiere «Permitir cambios menores en la jugabilidad». Se aplica al cargar un asentamiento. Si «La duración del paso sigue la velocidad de fotogramas» está activado, este es el paso más largo posible. 100: la duración propia del juego."
itIT = "Durata di ogni passo della simulazione, espressa in percentuale rispetto a quella originale del gioco (0,6 s). Passi più lunghi significano meno passi al giorno, quindi il gioco riesce a tenere il passo a velocità più elevate; la durata dei giorni, della crescita, dei bisogni e degli spostamenti resta invariata. Ritarda leggermente le decisioni dei castori, causando piccole inefficienze. Richiede «Consenti modifiche minori al gameplay». Si applica quando viene caricata una colonia. Se «La durata del tick segue la frequenza dei fotogrammi» è attivo, questo è il valore massimo della durata di un passo. 100: il valore originale del gioco."
ukUA = "Тривалість кожного кроку симуляції у відсотках від стандартного значення гри (0,6 с). Довші кроки означають, що їх буде менше за день, тож гра встигає працювати на вищій швидкості; тривалість днів, росту, потреб і ходьби не змінюється. Трохи затримує рішення бобрів, що призводить до незначної неефективності. Потребує параметра «Дозволити незначні зміни ігрового процесу». Застосовується під час завантаження поселення. Якщо ввімкнено «Тривалість кроку залежить від частоти кадрів», це максимальна тривалість кроку. 100: стандартне значення гри."
thTH = "แต่ละขั้นของการจำลองใช้เวลานานเท่าใด โดยคิดเป็นเปอร์เซ็นต์ของค่าดั้งเดิมของเกม (0.6 s) ขั้นที่ยาวขึ้นหมายถึงมีขั้นต่อวันน้อยลง ทำให้เกมทำงานทันที่ความเร็วสูงขึ้น ส่วนวัน การเติบโต ความต้องการ และการเดินยังใช้เวลานานเท่าเดิม การตัดสินใจของบีเวอร์จะล่าช้าเล็กน้อย ซึ่งทำให้เกิดความไม่มีประสิทธิภาพเล็กน้อย ต้องเปิดใช้ \"อนุญาตให้มีการเปลี่ยนแปลงการเล่นเกมเล็กน้อย\" มีผลเมื่อโหลดถิ่นฐาน เมื่อเปิด \"ความยาวของขั้นตอนตามอัตราเฟรม\" ค่านี้จะเป็นระยะเวลาสูงสุดของแต่ละขั้น 100: ค่าดั้งเดิมของเกม"
csCZ = "Jak dlouho trvá každý krok simulace, v procentech délky vlastního kroku hry (0,6 s). Delší kroky znamenají méně kroků za den, takže hra zvládá vyšší rychlosti; dny, růst, potřeby a chůze trvají stejně jako předtím. Rozhodnutí bobrů se mírně zpožďují, což vede k drobným neefektivitám. Vyžaduje „Povolit drobné změny hratelnosti“. Použije se při načtení osady. Je-li zapnuto „Délka kroku se řídí snímkovou frekvencí“, jde o nejdelší možný krok. 100: vlastní krok hry."
viVN = "Thời lượng của mỗi bước mô phỏng, tính theo phần trăm so với bước của trò chơi (0.6 s). Bước càng dài thì mỗi ngày càng có ít bước hơn, giúp trò chơi theo kịp ở tốc độ cao hơn; ngày, tốc độ sinh trưởng, nhu cầu và việc đi lại vẫn mất thời gian như trước. Quyết định của hải ly bị trì hoãn đôi chút, dẫn đến một số kém hiệu quả nhỏ. Cần bật \"Cho phép thay đổi nhỏ trong lối chơi\". Có hiệu lực khi tải một khu định cư. Khi bật \"Độ dài bước theo tốc độ khung hình\", đây là thời lượng tối đa của một bước. 100: bước của trò chơi."
caES = "Durada de cada pas de la simulació, com a percentatge de la durada pròpia del joc (0,6 s). Els passos més llargs impliquen que n’hi ha menys per dia, de manera que el joc pot seguir el ritme a velocitats més altes; els dies, el creixement, les necessitats i els desplaçaments a peu duren el mateix que abans. Retarda lleugerament les decisions dels castors, cosa que provoca petites ineficiències. Requereix «Permet canvis menors en la jugabilitat». S’aplica quan es carrega un assentament. Amb «La durada del pas segueix la freqüència d’imatges» activat, aquest és el pas més llarg possible. 100: la durada pròpia del joc."
beBY = "Працягласць кожнага кроку сімуляцыі ў працэнтах ад стандартнага кроку гульні (0.6 s). Даўжэйшыя крокі азначаюць, што за дзень іх будзе менш, таму гульня паспявае працаваць на больш высокіх хуткасцях; дні, рост, патрэбы і перамяшчэнне займаюць столькі ж часу, як і раней. Трохі затрымлівае прыняцце рашэнняў бабрамі, што прыводзіць да нязначнай неэфектыўнасці. Патрабуе «Дазволіць нязначныя змены гульнявога працэсу». Ужываецца пры загрузцы паселішча. Калі ўключана «Даўжыня кроку залежыць ад частаты кадраў», гэта максімальная працягласць кроку. 100: стандартная працягласць кроку гульні."
roRO = "Durata fiecărui pas al simulării, ca procent din durata implicită a jocului (0,6 s). Pașii mai lungi înseamnă mai puțini pași pe zi, astfel jocul ține pasul la viteze mai mari; zilele, creșterea, nevoile și deplasarea durează la fel ca înainte. Întârzie ușor deciziile castorilor, ceea ce duce la mici ineficiențe. Necesită „Permite modificări minore ale jocului”. Se aplică atunci când este încărcată o așezare. Cu „Durata pasului urmează rata de cadre” activată, aceasta este durata maximă a unui pas. 100: valoarea implicită a jocului."
huHU = "A szimuláció egyes lépéseinek hossza a játék saját lépéshosszának (0,6 s) százalékában. A hosszabb lépések azt jelentik, hogy egy nap alatt kevesebb lépés történik, így a játék nagyobb sebességnél is lépést tud tartani; a napok, a növekedés, a szükségletek és a gyaloglás időtartama változatlan marad. Kissé késlelteti a hódok döntéseit, ami kisebb hatékonyságvesztéshez vezet. Ehhez engedélyezni kell a „Kisebb játékmenet-változtatások engedélyezése” beállítást. A telep betöltésekor lép életbe. Ha a „Lépéshossz követi a képkockasebességet” be van kapcsolva, ez a maximális lépéshossz. 100: a játék saját lépéshossza."
arSA = "مدة كل خطوة من المحاكاة، كنسبة مئوية من المدة الأصلية للعبة (0.6 s). تعني الخطوات الأطول عددًا أقل منها في اليوم، ما يساعد اللعبة على مواكبة السرعات الأعلى؛ وتظل الأيام والنمو والاحتياجات والمشي تستغرق المدة نفسها كما قبل. تؤخر قرارات القنادس قليلًا، ما يؤدي إلى أوجه قصور طفيفة. يتطلب «السماح بتغييرات طفيفة على أسلوب اللعب». يُطبَّق عند تحميل مستوطنة. عند تفعيل «مدة الخطوة تتبع معدل الإطارات»، تكون هذه أطول مدة يمكن أن تصل إليها الخطوة. 100: المدة الأصلية للعبة."

