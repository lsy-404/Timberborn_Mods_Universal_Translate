["PerformancePlus.Settings.DistantAnimations.Tooltip"]
status = "normal"
raw = "Beavers, bots and buildings drawn small on the screen move their limbs and parts every second or fourth frame instead of every frame, which saves time in large settlements. Only the look changes: they keep their pace and do the same things. Off: every model visible is animated every frame."
enUS = "Beavers, bots, and buildings drawn small on the screen move their limbs and parts every second or fourth frame instead of every frame, which saves time in large settlements. Only the look changes: they keep their pace and do the same things. Off: every model visible is animated every frame."
zhCN = "在屏幕上显示得较小的海狸、机器人和建筑，每隔 2 帧或 4 帧才会让肢体和部件动一次，而不是每帧都动，这能为大型聚居地节省处理时间。改变的只有外观：它们的活动速度不变，做的事情也不变。关闭：每个可见模型每帧都会播放动画。"
zhTW = "畫面上顯示較小的海狸、機器人和建築物，其肢體和部件每 2 或 4 幀才會動一次，而非每一幀都動，藉此減輕大型聚落的運算負擔。這只會改變外觀：它們的步調不變，做的事情也一樣。關閉：所有可見模型都會逐幀播放動畫。"
ruRU = "Бобры, боты и здания, отображаемые на экране мелкими, двигают конечностями и деталями не каждый кадр, а каждый второй или четвёртый, что экономит ресурсы в крупных поселениях. Меняется только внешний вид: они сохраняют темп и делают то же самое. Выкл.: каждая видимая модель анимируется каждый кадр."
jaJP = "画面上で小さく表示されるビーバー、ボット、建物は、毎フレームではなく2フレームまたは4フレームごとに手足や部品を動かします。これにより、大規模な居住地で処理時間を節約できます。見た目だけが変わり、移動速度や行動は変わりません。オフ：画面に表示されているすべてのモデルを毎フレームアニメーションさせます。"
frFR = "Les castors, les bots et les bâtiments affichés en petit à l’écran animent leurs membres et leurs éléments une image sur deux ou sur quatre au lieu de chaque image, ce qui fait gagner du temps dans les grandes colonies. Seule l’apparence change : ils gardent leur rythme et font les mêmes choses. Désactivé : tous les modèles visibles sont animés à chaque image."
deDE = "Biber, Bots und Gebäude, die auf dem Bildschirm klein dargestellt werden, bewegen ihre Gliedmaßen und Teile nur jedes zweite oder vierte Bild statt in jedem Bild, was in großen Siedlungen Zeit spart. Nur das Aussehen ändert sich: Sie behalten ihre Geschwindigkeit bei und tun dasselbe. Aus: Jedes sichtbare Modell wird in jedem Bild animiert."
plPL = "Bobry, boty i budynki wyświetlane na ekranie w małej skali poruszają kończynami i elementami co drugą lub co czwartą klatkę zamiast w każdej, co oszczędza czas w dużych osadach. Zmienia się tylko wygląd: poruszają się w tym samym tempie i robią to samo. Wył.: każdy widoczny model jest animowany w każdej klatce."
ptBR = "Castores, robôs e edifícios que aparecem pequenos na tela movimentam seus membros e componentes a cada dois ou quatro quadros, em vez de a cada quadro, economizando tempo em grandes colônias. Só o visual muda: eles mantêm o ritmo e fazem as mesmas coisas. Desativado: todos os modelos visíveis são animados a cada quadro."
koKR = "비버, 봇, 화면에 작게 표시되는 건물은 팔다리와 부품이 매 프레임이 아니라 2프레임 또는 4프레임마다 움직여 대규모 정착지에서 연산 시간을 절약합니다. 달라지는 것은 외형뿐입니다. 이동 속도는 그대로이며 같은 행동을 합니다. 끄기: 화면에 보이는 모든 모델이 매 프레임 애니메이션됩니다."
trTR = "Ekranda küçük görünen kunduzlar, botlar ve binalar uzuvlarını ve parçalarını her karede değil, iki veya dört karede bir hareket ettirir; bu da büyük yerleşimlerde zaman kazandırır. Yalnızca görünüş değişir: hızları aynı kalır ve aynı şeyleri yaparlar. Kapalı: Görünen her model her karede canlandırılır."
esES = "Los castores, bots y edificios que se muestran pequeños en pantalla mueven sus extremidades y piezas cada 2 o 4 fotogramas, en lugar de en cada fotograma, lo que ahorra tiempo en asentamientos grandes. Solo cambia el aspecto: mantienen el ritmo y hacen lo mismo. Desactivado: todos los modelos visibles se animan en cada fotograma."
itIT = "I castori, i bot e gli edifici che appaiono piccoli sullo schermo muovono gli arti e le parti ogni 2 o 4 fotogrammi, anziché a ogni fotogramma, per risparmiare tempo negli insediamenti più grandi. Cambia solo l’aspetto: mantengono la stessa velocità e fanno le stesse cose. Disattivato: ogni modello visibile viene animato a ogni fotogramma."
ukUA = "Бобри, боти та будівлі, відображені на екрані маленькими, рухають кінцівками й частинами кожного другого або четвертого кадру замість кожного кадру, що заощаджує час у великих поселеннях. Змінюється лише вигляд: вони зберігають свій темп і роблять те саме. Вимкнено: кожна видима модель анімується в кожному кадрі."
thTH = "บีเวอร์ บอต และอาคารที่แสดงขนาดเล็กบนหน้าจอจะขยับแขนขาและชิ้นส่วนทุกเฟรมที่สองหรือทุกเฟรมที่สี่ แทนที่จะเป็นทุกเฟรม ซึ่งช่วยประหยัดเวลาในนิคมขนาดใหญ่ มีเพียงรูปลักษณ์ที่เปลี่ยนไปเท่านั้น: พวกมันยังเคลื่อนที่ด้วยความเร็วเท่าเดิมและทำสิ่งเดิม ๆ ปิด: โมเดลทุกชิ้นที่มองเห็นจะเคลื่อนไหวทุกเฟรม."
csCZ = "Bobři, roboti a budovy zobrazené na obrazovce v malém měřítku mají končetiny a části animované jen v každém druhém nebo čtvrtém snímku místo v každém snímku, což ve velkých osadách šetří čas. Mění se pouze vzhled: pohybují se stejnou rychlostí a dělají totéž. Vypnuto: každý viditelný model se animuje v každém snímku."
viVN = "Hải ly, rô-bốt và công trình được hiển thị nhỏ trên màn hình sẽ cử động chân tay và các bộ phận mỗi 2 hoặc 4 khung hình thay vì ở mọi khung hình, giúp tiết kiệm thời gian trong các khu định cư lớn. Chỉ thay đổi hình ảnh: chúng vẫn di chuyển với tốc độ như cũ và làm những việc tương tự. Tắt: mọi mô hình hiển thị đều được tạo hoạt ảnh ở mọi khung hình."
caES = "Els castors, els bots i els edificis que es veuen petits a la pantalla mouen les extremitats i les peces cada dos o cada quatre fotogrames, en lloc de cada fotograma, cosa que estalvia temps en assentaments grans. Només en canvia l’aspecte: mantenen el ritme i fan les mateixes coses. Desactivat: tots els models visibles s’animen a cada fotograma."
beBY = "Бабры, боты і будынкі, адлюстраваныя на экране ў малым памеры, рухаюць канечнасцямі і часткамі кожны другі або чацвёрты кадр замест кожнага кадра, што эканоміць час у вялікіх паселішчах. Змяняецца толькі выгляд: яны захоўваюць свой тэмп і робяць тое самае. Выкл.: кожная бачная мадэль анімуецца кожны кадр."
roRO = "Castorii, roboții și clădirile afișate la scară mică pe ecran își mișcă membrele și componentele la fiecare al doilea sau al patrulea cadru, în loc de fiecare cadru, ceea ce economisește timp în așezările mari. Se schimbă doar aspectul: își păstrează ritmul și fac aceleași lucruri. Dezactivat: fiecare model vizibil este animat la fiecare cadru."
huHU = "A képernyőn kicsinek látszó hódok, robotok és épületek minden képkocka helyett csak minden második vagy negyedik képkockán mozgatják végtagjaikat és alkatrészeiket, ami időt takarít meg a nagy településeken. Csak a látvány változik: tartják a tempójukat, és ugyanazokat a dolgokat végzik. Kikapcsolva: minden látható modell minden képkockán animálódik."
arSA = "القنادس والروبوتات والمباني التي تظهر صغيرة على الشاشة تحرّك أطرافها وأجزاءها في كل إطار ثانٍ أو رابع بدلًا من كل إطار، مما يوفر الوقت في المستوطنات الكبيرة. يتغير المظهر فقط: فهي تحافظ على وتيرتها وتواصل فعل الأشياء نفسها. إيقاف: تُحرّك جميع النماذج الظاهرة في كل إطار."

