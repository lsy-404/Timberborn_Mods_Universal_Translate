["PerformancePlus.Settings.AllowMinorChanges.Tooltip"]
status = "normal"
raw = "Lets Performance Plus take faster shortcuts that can change small details of what happens. Off: the game plays exactly as it does without the mod."
enUS = "Lets Performance Plus take faster shortcuts that can change small details of what happens. Off: The game plays exactly as it does without the mod."
zhCN = "允许 Performance Plus 使用更快的捷径，这可能会改变游戏运行中的一些细节。关闭：游戏运行效果与不安装此模组时完全一致。"
zhTW = "允許 Performance Plus 採用更快速的捷徑，這可能會改變遊戲中發生情況的細節。關閉：遊戲的運作方式與未安裝此模組時完全一致。"
ruRU = "Позволяет Performance Plus использовать более быстрые обходные пути, которые могут менять небольшие детали происходящего. Выкл.: игра работает точно так же, как без мода."
jaJP = "Performance Plusが、結果の細部を変える可能性のある高速化処理を行えるようにします。オフの場合：このMODがない場合とまったく同じようにゲームが動作します。"
frFR = "Autorise Performance Plus à utiliser des raccourcis plus rapides, qui peuvent modifier de petits détails du déroulement du jeu. Désactivé : le jeu se déroule exactement comme sans le mod."
deDE = "Erlaubt Performance Plus, schnellere Abkürzungen zu nutzen, die kleine Details des Spielgeschehens verändern können. Aus: Das Spiel verhält sich genau wie ohne Mod."
plPL = "Pozwala Performance Plus stosować szybsze skróty, które mogą zmieniać drobne szczegóły przebiegu gry. Wył.: gra działa dokładnie tak, jak bez moda."
ptBR = "Permite que o Performance Plus use atalhos mais rápidos, que podem alterar pequenos detalhes do que acontece. Desativado: o jogo funciona exatamente como funcionaria sem o mod."
koKR = "Performance Plus가 더 빠른 지름길을 사용하도록 허용합니다. 이로 인해 게임에서 일어나는 일의 세부 사항이 조금 달라질 수 있습니다. 꺼짐: 모드를 사용하지 않을 때와 게임이 정확히 동일하게 진행됩니다."
trTR = "Performance Plus'ın, gerçekleşen olayların küçük ayrıntılarını değiştirebilecek daha hızlı kestirmeler kullanmasına olanak tanır. Kapalı: oyun, mod yokmuş gibi tamamen aynı şekilde çalışır."
esES = "Permite que Performance Plus use atajos más rápidos que pueden cambiar pequeños detalles de lo que ocurre. Desactivado: el juego se comporta exactamente igual que sin el mod."
itIT = "Consente a Performance Plus di utilizzare scorciatoie più rapide che possono modificare piccoli dettagli di ciò che accade. Disattivato: il gioco funziona esattamente come senza la mod."
ukUA = "Дозволяє Performance Plus використовувати швидші спрощені алгоритми, які можуть змінювати дрібні деталі ігрових подій. Вимкнено: гра працює точно так само, як і без мода."
thTH = "อนุญาตให้ Performance Plus ใช้ทางลัดที่เร็วขึ้น ซึ่งอาจทำให้รายละเอียดเล็กน้อยของสิ่งที่เกิดขึ้นเปลี่ยนไป ปิด: เกมจะทำงานเหมือนกับตอนที่ไม่มีม็อดนี้ทุกประการ"
csCZ = "Umožní Performance Plus používat rychlejší zkratky, které mohou změnit drobné detaily průběhu hry. Vypnuto: hra funguje přesně stejně jako bez modu."
viVN = "Cho phép Performance Plus sử dụng các cách xử lý nhanh hơn, có thể làm thay đổi đôi chút các chi tiết diễn ra trong trò chơi. Tắt: trò chơi hoạt động chính xác như khi không có mod."
caES = "Permet que Performance Plus faci servir dreceres més ràpides que poden canviar petits detalls del que passa. Desactivat: el joc funciona exactament igual que sense el mod."
beBY = "Дазваляе Performance Plus выкарыстоўваць больш хуткія спрашчэнні, якія могуць змяніць дробныя дэталі таго, што адбываецца. Выкл.: гульня працуе дакладна гэтак жа, як без мода."
roRO = "Permite modului Performance Plus să recurgă la scurtături mai rapide, care pot schimba mici detalii din ceea ce se întâmplă. Dezactivat: jocul se comportă exact ca fără mod."
huHU = "Lehetővé teszi a Performance Plus számára, hogy gyorsabb, egyszerűsített megoldásokat alkalmazzon, amelyek apró részleteket változtathatnak meg a történésekben. Kikapcsolva: a játék pontosan úgy működik, mint a mod nélkül."
arSA = "يسمح Performance Plus باستخدام اختصارات أسرع قد تغيّر تفاصيل صغيرة مما يحدث. إيقاف: تعمل اللعبة تمامًا كما تعمل من دون التعديل."

