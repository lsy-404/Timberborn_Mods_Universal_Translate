["PerformancePlus.Settings.TickLengthFollowsFrameRate.Tooltip"]
status = "normal"
raw = "With \"Keep a frame rate\" on as well, \"Tick length (%)\" is the longest a step gets: a settlement starts at the game's own, and at midnight the step lengthens or shortens by one notch when the day before called for it. Needs \"Allow minor gameplay changes\". Applies when a settlement is loaded."
enUS = "With \"Keep a frame rate\" also enabled, \"Tick length (%)\" is the maximum step length. A settlement starts at the game's own value, and at midnight the step length increases or decreases by one notch if the previous day called for it. Requires \"Allow minor gameplay changes\". Applies when a settlement is loaded."
zhCN = "同时启用“保持帧率”后，“步长（%）”是单个游戏步长的上限：聚居地从游戏默认值开始；如果前一天的情况需要调整，午夜时步长会增加或减少一档。需要启用“允许轻微的游戏性改动”。载入聚居地时生效。"
zhTW = "同時也開啟「維持影格率」時，「步進長度（%）」就是每個步進的最長長度：聚落載入時會先採用遊戲原本的步進長度，並在午夜時，若前一天的狀況有此需要，將步進長度調高或調低一個級距。需要開啟「允許輕微的遊戲玩法變更」。聚落載入時生效。"
ruRU = "Если также включена настройка «Поддерживать частоту кадров», параметр «Длительность шага (%)» задаёт максимальную длительность шага: поселение начинает с исходного значения игры, а в полночь длительность шага увеличивается или уменьшается на одно деление, если этого требовали условия предыдущего дня. Требуется настройка «Разрешить незначительные изменения игрового процесса». Применяется при загрузке поселения."
jaJP = "「フレームレートを維持」も有効にすると、「ティック長（%）」がステップ長の上限になります。集落はゲーム既定の長さで開始し、前日の状況に応じて、真夜中にステップ長が1段階長くなるか短くなります。「軽微なゲームプレイ変更を許可」が必要です。集落をロードしたときに適用されます。"
frFR = "Avec « Maintenir une fréquence d’images » également activé, « Durée du tick (%) » correspond à la durée maximale d’une étape : une colonie commence à la valeur définie par le jeu, puis, à minuit, la durée de l’étape augmente ou diminue d’un cran si la journée précédente le justifie. Nécessite « Autoriser les changements mineurs du gameplay ». S’applique au chargement d’une colonie."
deDE = "Wenn zusätzlich „Bildrate beibehalten“ aktiviert ist, gibt „Tick-Länge (%)“ die maximale Dauer eines Schritts an: Eine Siedlung beginnt mit der vom Spiel vorgegebenen Dauer. Um Mitternacht wird der Schritt um eine Stufe verlängert oder verkürzt, wenn es der Vortag erforderte. Erfordert „Geringfügige Gameplay-Änderungen zulassen“. Gilt, wenn eine Siedlung geladen wird."
plPL = "Gdy włączona jest również opcja „Utrzymuj liczbę klatek na sekundę”, „Długość kroku (%)” określa maksymalną długość kroku: osada zaczyna od wartości ustawionej przez grę, a o północy długość kroku zwiększa się lub zmniejsza o jeden poziom, jeśli wymagał tego poprzedni dzień. Wymaga opcji „Zezwalaj na niewielkie zmiany w rozgrywce”. Działa po wczytaniu osady."
ptBR = "Com “Manter uma taxa de quadros” também ativado, “Duração do tique (%)” é o máximo que um passo pode durar: um assentamento começa com o valor definido pelo próprio jogo e, à meia-noite, a duração do passo aumenta ou diminui um nível quando o dia anterior exigiu isso. Requer “Permitir pequenas alterações na jogabilidade”. Aplica-se quando um assentamento é carregado."
koKR = "\"프레임 속도 유지\"도 켜져 있으면, \"틱 길이(%)\"는 틱이 길어질 수 있는 최대치입니다. 정착지는 게임 기본값으로 시작하며, 전날의 상황에 따라 자정에 틱 길이가 한 단계 길어지거나 짧아집니다. \"사소한 게임플레이 변경 허용\"이 필요합니다. 정착지를 불러왔을 때 적용됩니다."
trTR = "“Kare hızını koru” da açıkken, “Adım uzunluğu (%)” bir adımın ulaşabileceği en uzun süredir: Bir yerleşim oyunun kendi değerinden başlar ve önceki gün gerektirdiyse adım uzunluğu gece yarısında bir kademe uzar veya kısalır. “Küçük oynanış değişikliklerine izin ver” ayarı gerekir. Bir yerleşim yüklendiğinde uygulanır."
esES = "Con «Mantener una tasa de fotogramas» también activado, «Duración del tic (%)» es la duración máxima que puede alcanzar un paso: un asentamiento empieza en el valor propio del juego y, a medianoche, la duración del paso aumenta o disminuye un nivel cuando el día anterior lo haya indicado. Requiere «Permitir cambios menores en la jugabilidad». Se aplica al cargar un asentamiento."
itIT = "Con attiva anche «Mantieni una frequenza dei fotogrammi», «Durata del tick (%)» indica la durata massima raggiunta da un passo: un insediamento parte dalla durata predefinita del gioco e, a mezzanotte, la durata del passo aumenta o diminuisce di un livello se il giorno precedente lo ha richiesto. Richiede «Consenti modifiche minori al gameplay». Si applica quando viene caricato un insediamento."
ukUA = "Якщо також увімкнено «Підтримувати частоту кадрів», «Тривалість такту (%)» задає максимальну тривалість такту: поселення починає зі стандартної для гри тривалості такту, а опівночі тривалість такту збільшується або зменшується на один рівень, якщо цього вимагав попередній день. Потребує «Дозволити незначні зміни ігрового процесу». Застосовується, коли завантажено поселення."
thTH = "เมื่อเปิด \"คงอัตราเฟรม\" ด้วย \"ความยาวช่วงเวลา (%)\" จะเป็นระยะเวลาสูงสุดที่แต่ละขั้นตอนยาวได้: เมื่อโหลดชุมชน ช่วงเวลาจะเริ่มต้นที่ค่าที่เกมกำหนดเอง และเมื่อถึงเที่ยงคืน ช่วงเวลาจะเพิ่มหรือลดลงหนึ่งระดับ หากวันก่อนหน้าระบุว่าควรทำเช่นนั้น ต้องเปิด \"อนุญาตการเปลี่ยนแปลงเกมเพียงเล็กน้อย\" มีผลเมื่อโหลดชุมชน"
csCZ = "Pokud je zapnutá také možnost „Udržovat snímkovou frekvenci“, „Délka kroku (%)“ určuje nejdelší možnou délku kroku: osada začíná na hodnotě nastavené samotnou hrou a o půlnoci se délka kroku prodlouží nebo zkrátí o jeden stupeň, pokud si to vyžádal předchozí den. Vyžaduje možnost „Povolit drobné změny herního průběhu“. Platí při načtení osady."
viVN = "Khi bật cả \"Giữ tốc độ khung hình\", \"Độ dài nhịp (%)\" là độ dài tối đa của một nhịp: khu định cư bắt đầu ở mức mặc định của trò chơi, và vào nửa đêm, độ dài nhịp tăng hoặc giảm một nấc nếu ngày trước đó yêu cầu. Cần bật \"Cho phép thay đổi nhỏ trong lối chơi\". Áp dụng khi tải khu định cư."
caES = "Amb «Mantenir una freqüència d’imatges» també activat, «Durada del tic (%)» és el màxim que pot durar un pas: un assentament comença amb la durada pròpia del joc i, a mitjanit, el pas s’allarga o s’escurça un nivell si el dia anterior ho requeria. Requereix «Permet canvis menors en la jugabilitat». S’aplica quan es carrega un assentament."
beBY = "Калі таксама ўключана «Падтрымліваць частату кадраў», «Працягласць такту (%)» задае максімальную працягласць такту: паселішча пачынае з уласнай працягласці такту гульні, а апоўначы такт падаўжаецца або скарачаецца на адну прыступку, калі ў гэтым была патрэба напярэдадні. Патрабуецца «Дазволіць нязначныя змены гульнявога працэсу». Ужываецца пры загрузцы паселішча."
roRO = "Cu „Menține rata de cadre” activată și „Durata pasului (%)” reprezintă durata maximă a unui pas: o așezare începe la valoarea implicită a jocului, iar la miezul nopții durata pasului crește sau scade cu o treaptă, dacă ziua precedentă a impus acest lucru. Necesită „Permite modificări minore ale jocului”. Se aplică la încărcarea unei așezări."
huHU = "Ha a „Képkockasebesség megtartása” is be van kapcsolva, a „Játékütem hossza (%)” adja meg a lépés maximális hosszát: a település a játék saját értékével indul, éjfélkor pedig a lépés egy fokozattal hosszabb vagy rövidebb lesz, ha az előző nap ezt szükségessé tette. Ehhez a „Kisebb játékmenet-változtatások engedélyezése” beállítás szükséges. A település betöltésekor lép érvénybe."
arSA = "عند تفعيل \"الحفاظ على معدل الإطارات\" أيضًا، تكون \"مدة الخطوة (%)\" هي أطول مدة يمكن أن تبلغها الخطوة: تبدأ المستوطنة بمدة الخطوة التي تحددها اللعبة نفسها، وعند منتصف الليل تطول الخطوة أو تقصر بمقدار درجة واحدة إذا اقتضى الأمر ذلك في اليوم السابق. يتطلب ذلك تفعيل \"السماح بتغييرات طفيفة في أسلوب اللعب\". يسري ذلك عند تحميل مستوطنة."

