["LV.WSP.DecreaseStrBuffDesc"]
raw = "A marvel of beaver engineering, this gate tames the wildest rivers, calming their flow to protect our lands."
status = "normal"
enUS = "A marvel of beaver engineering, this gate tames the wildest rivers, calming their flow to protect our lands."
zhCN = "土木工程的奇迹，这道闸门驯服了狂野的河流，平息水流以保护我们的土地。"
zhTW = "這是一個海狸工程的奇蹟，這道閘門馴服了最狂野的河流，平息它們的流動以保護我們的土地。"
ruRU = "Чудо бобрового инженерного искусства, эта плотина усмиряет самые дикие реки, успокаивая их течение, чтобы защитить наши земли."
jaJP = "ビーバーの工学の驚異、このゲートは最も荒々しい川を制御し、その流れを穏やかにして私たちの土地を守ります。"
frFR = "Une merveille de l'ingénierie des castors, cette porte apprivoise les rivières les plus sauvages, apaisant leur cours pour protéger nos terres."
deDE = "Ein Wunder der Bibertechnik zähmt dieses Tor die wildesten Flüsse und beruhigt ihren Fluss, um unser Land zu schützen."
plPL = "Cud inżynierii bobrów, ta brama okiełzna najdziksze rzeki, uspokajając ich nurt, aby chronić nasze ziemie."
ptBR = "Uma maravilha da engenharia dos castores, este portão doma os rios mais selvagens, acalmando seu fluxo para proteger nossas terras."
koKR = "비버 공학의 경이로움인 이 문은 가장 거친 강을 길들이고, 그 흐름을 잠재워 우리의 땅을 보호합니다."
trTR = "Şuursuz nehirleri kontrol altına alan, akışlarını yumuşatarak topraklarımızı koruyan, kunduz mühendisliğinin bir harikası olan bu kapı."
esES = "Una maravilla de la ingeniería castor, esta compuerta doma los ríos más salvajes, calmando su caudal para proteger nuestras tierras."
itIT = "Una meraviglia dell'ingegneria dei castori, questa chiusa doma i fiumi più impetuosi, placando la loro corrente per proteggere le nostre terre."
ukUA = "Чудо бобрової інженерії, ця шлюза приборкує найдикіші річки, заспокоюючи їхню течію, щоб захистити наші землі."
thTH = "ประตูอันน่าทึ่งนี้เป็นผลงานด้านวิศวกรรมของบีเวอร์ ช่วยควบคุมแม่น้ำที่ดุร้ายที่สุดให้สงบการไหล เพื่อปกป้องดินแดนของเรา"
csCZ = "Zázrak bobřího inženýrství, tato brána zkrotí nejdivočejší řeky, zklidňuje jejich tok, aby chránila naše území."
viVN = "Một kỳ công của kỹ thuật hải ly, cổng chắn này kiềm chế những con sông hung dữ nhất, làm dịu dòng chảy để bảo vệ vùng đất của chúng ta."
caES = "Una meravella de l'enginyeria castora, aquesta comporta domina els rius més salvatges, calmant el seu cabal per protegir les nostres terres."
beBY = "Цуд бабровай інжынерыі, гэтая шлюза ўкрощае самыя дзікія рэкі, супакойваючы іх плынь, каб абараніць нашы землі."
roRO = "O minune a ingineriei castorilor, această stăvilă domolește cele mai sălbatice râuri, liniștindu-le curgerea pentru a ne proteja ținuturile."
huHU = "A hódmérnöki csoda ez a zsilip, amely megszelídíti a legvadabb folyókat, és lecsillapítja áramlásukat, hogy védje földjeinket."
arSA = "تُعدّ هذه البوابة إعجازًا من هندسة القنادس، فهي تُروّض أعتى الأنهار وتُهدّئ تدفقها لحماية أراضينا."

["LV.WSP.IncreaseStrBuffDesc"]
raw = "Channeling nature's might, this conduit unleashes a surge of water, bending rivers to our will."
status = "normal"
enUS = "Channeling nature's power, this conduit releases a surge of water, bending rivers to our will."
zhCN = "征服自然的力量，这条导管释放出汹涌的水流，征服河流以顺从我们的意志。"
zhTW = "引導自然的力量，這個管道釋放出一股水流，讓河流隨心所欲地彎曲。"
ruRU = " channeling nature's might, this conduit unleashes a surge of water, bending rivers to our will."
jaJP = "自然の力を呼び起こし、この導管は水の波を解き放ち、私たちの意志のままに川を曲げる。"
