["MapMakerPlants.VoidTile.Description"]
raw = "Visually deletes the ground under it.\nFor places where you don’t ever expect to see water."
status = "normal"
enUS = "Visually deletes the ground under it.\nFor places where you don’t ever expect to see water."
zhCN = "透明的遮盖物，可以使下方的地面变透明。"
zhTW = "在其下方視覺上刪除地面。對於那些你永遠不會期待見到水的地方。"
ruRU = "Визуально убирает землю под собой. Для мест, где вы никогда не ожидаете увидеть воду."
jaJP = "視覚的にその下の地面を消去します。水が見えることなど決して想像しない場所のために。"
frFR = "Supprime visuellement le sol en dessous. Pour des endroits où vous ne vous attendez jamais à voir de l'eau."
deDE = "Löscht visuell den Boden unter sich. Für Orte, an denen man niemals erwartet, Wasser zu sehen."
plPL = "Wizualnie usuwa grunt pod sobą. Dla miejsc, w których nigdy nie spodziewasz się zobaczyć wody."
ptBR = "Exclui visualmente o solo debaixo dele. Para lugares onde você nunca espera ver água."
koKR = "그 아래의 땅을 시각적으로 삭제합니다. 물이 결코 나타날 것으로 예상하지 않는 장소를 위한 것입니다."
trTR = "Görsel olarak altındaki zemini siler. Su görmeyi beklemediğiniz yerler için."
esES = "Elimina visualmente el suelo bajo él.\nPara lugares donde no esperas ver agua nunca."
itIT = "Nasconde visivamente il terreno sotto di esso.\nPer i luoghi in cui non ti aspetteresti mai di vedere l'acqua."
ukUA = "Візуально прибирає ґрунт під ним.\nДля місць, де ви ніколи не очікуєте побачити воду."
thTH = "ทำให้พื้นดินใต้มันหายไปในภาพ\nใช้กับจุดที่คุณไม่คาดว่าจะพบน้ำเลย"
csCZ = "Vizuelně odstraní zem pod ním. Pro místa, kde nikdy neočekáváte, že uvidíte vodu."
viVN = "Xóa trực quan mặt đất dưới nó.\nỞ những nơi bạn không bao giờ nghĩ sẽ có nước."
caES = "Visualment elimina el terra que hi ha sota seu.\nPer a llocs on no esperes mai veure aigua."
beBY = "Візуальна выдаляе грунт пад сабой.\nДля месцаў, дзе вы ніколі не чакаеце ўбачыць ваду."
