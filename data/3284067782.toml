["MapMakerPlants.CrystalSupport.Description"]
raw = "Support necessary to placefloating cristals above Z-level 1.\nSelf-stackable\nWill be invisible and have no hitbox when playing"
status = "normal"
enUS = "Support necessary to placefloating cristals above Z-level 1.\nSelf-stackable\nWill be invisible and have no hitbox when playing"
zhCN = "透明的支撑物，可以堆叠，用于支撑在空中放置的浮空晶体。游玩时方块将不可见且无碰撞体积。"
zhTW = "支援在Z級別1以上放置浮動晶體。  \n可自我堆疊  \n在遊玩時將隱形並且不會有碰撞盒"
ruRU = "Поддержка, необходимая для размещения плавающих кристаллов выше Z-уровня 1.  \nСамонакладывающийся  \nБудет невидимым и не будет иметь хитбокса во время игры"
jaJP = "Zレベル1以上に浮遊クリスタルを配置するために必要なサポート。\n自己スタック可能\nプレイ中は目に見えず、当たり判定はありません。"
frFR = "Support nécessaire pour placer des cristaux flottants au-dessus du niveau Z 1.  \nAuto-empilable  \nSera invisible et n'aura pas de hitbox pendant le jeu."
deDE = "Unterstützung erforderlich, um schwebende Kristalle über Z-Level 1 zu platzieren.  \nSelbststapelbar  \nWerden unsichtbar sein und beim Spielen keine Hitbox haben."
plPL = "Wsparcie niezbędne do umieszczenia unoszących się kryształów powyżej poziomu Z 1.  \nMożliwość samowarstwowania  \nBędzie niewidoczne i nie będzie miało hitboxa podczas gry"
ptBR = "Suporte necessário para colocar cristais flutuantes acima do nível Z 1.  \nAutoempilhável  \nFicará invisível e não terá hitbox durante o jogo."
koKR = "Z-레벨 1 위에 떠 있는 수정 결정을 배치하는 데 필요한 지원입니다.  \n자기 스택 가능  \n게임을 플레이할 때 보이지 않으며 충돌 박스가 없습니다."
trTR = "Z-düzeyi 1'in üzerine yüzen kristalleri yerleştirmek için gerekli destek.\nKendiliğinden üst üste yerleştirilebilir\nOynarken görünmez olacak ve vurulamaz."
esES = "Soporte necesario para colocar cristales flotantes por encima del nivel Z 1.\nSe puede apilar sobre sí mismo\nSerá invisible y no tendrá hitbox durante la partida"
itIT = "Supporto necessario per posizionare cristalli fluttuanti sopra il livello Z 1.\nImpilabile su sé stesso\nSarà invisibile e non avrà hitbox durante il gioco"
ukUA = "Опора, необхідна для розміщення плаваючих кристалів над Z-рівнем 1.\nМожна складати одне на одне\nБуде невидимою і не матиме хітбокса під час гри"
thTH = "ต้องใช้ตัวรองรับเพื่อวางคริสตัลลอยเหนือระดับ Z 1\nสามารถซ้อนทับกันได้ด้วยตัวเอง\nจะมองไม่เห็นและไม่มีกล่องชน (hitbox) เมื่อเล่นเกม"
csCZ = "Podpora potřebná k umístění plovoucích krystalů nad úrovní Z 1.\nSamo-stohovatelné\nBude neviditelné a nebude mít hitbox při hraní"
viVN = "Hỗ trợ cần thiết để đặt các tinh thể nổi ở trên mức Z-level 1.\nCó thể xếp chồng lên nhau\nSẽ vô hình và không có vùng va chạm khi chơi"
caES = "Suport necessari per col·locar cristalls flotants per sobre del nivell Z 1.\nEs pot apilar sobre si mateix\nSerà invisible i no tindrà hitbox durant el joc"
beBY = "Патрэбна падтрымка, каб размясціць плаваючыя крышталі вышэй за Z-узровень 1.\nМожна складваць адзін на другі\nБудзе нябачнай і не будзе мець хітбокса падчас гульні"
roRO = "Suport necesar pentru plasarea cristalelor plutitoare deasupra nivelului Z 1.\nSe poate stivui peste sine însuși\nVa fi invizibil și nu va avea hitbox în timpul jocului"
huHU = "Támasz, amely szükséges a lebegő kristályok elhelyezéséhez az 1-es Z-szint felett.\nEgymásra halmozható\nJáték közben láthatatlan lesz, és nem lesz ütközésre képes hitboxa"
arSA = "الدعم اللازم لوضع البلورات العائمة فوق المستوى Z-1.\nقابل للتكديس ذاتيًا\nسيكون غير مرئي ولا يملك صندوق اصطدام أثناء اللعب"

