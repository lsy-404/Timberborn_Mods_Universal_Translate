["MPME.FloatingRock.Description"]
raw = "Floats in the sky to support a sky island\nrequires to rest on something for incomprehensible reasons, use the support"
status = "normal"
enUS = "Floats in the sky to support a sky island\nrequires to rest on something for incomprehensible reasons, use the support"
zhCN = "漂浮在空中的神秘晶体，用于支撑空中岛屿。"
zhTW = "懸浮在空中以支撐空中島嶼。"
ruRU = "Плавают в небе, поддерживая небесный остров."
jaJP = "空の島を支えるために空に浮かぶ。"
frFR = "Flotte dans le ciel pour soutenir une île dans le ciel."
deDE = "Schwimmende Objekte im Himmel zur Unterstützung einer Sky-Insel."
plPL = "Unosi się w powietrzu, aby wspierać wyspę w chmurach."
ptBR = "Flutua no céu para sustentar uma ilha no céu."
koKR = "하늘 섬을 지탱하기 위해 하늘에 떠 있는 물체입니다. 설명할 수 없는 이유로 무엇인가에 의존해야 하며, 지지를 사용하세요."
trTR = "Gökyüzünde bir gökyüzü adasını desteklemek için süzülür, anlaması zor nedenlerden dolayı bir şeyin üzerinde durması gerekir, desteği kullanın."
esES = "Flota en el cielo para sostener una isla celeste\nnecesita descansar sobre algo, por razones incomprensibles; usa el soporte"
itIT = "Galleggia nel cielo per sostenere un'isola celeste\nrichiede di appoggiarsi a qualcosa per ragioni incomprensibili, usa il supporto"
ukUA = "Ширяє в небі, щоб підтримувати острів у небі\nз незрозумілих причин потребує спиратися на щось, тож використовуйте опору"
thTH = "ลอยอยู่บนท้องฟ้าเพื่อรองรับเกาะลอยฟ้า\nต้องพักพิงบนบางสิ่งด้วยเหตุผลที่ไม่อาจเข้าใจได้ จึงควรใช้ตัวรองรับ"
csCZ = "Vznáší se na obloze, aby podpořil ostrov v oblacích, potřebuje se opřít o něco z nepochopitelných důvodů, použijte podporu"
viVN = "Lơ lửng giữa trời để hỗ trợ một hòn đảo trên không\nYêu cầu dựa vào một vật gì đó vì lý do khó hiểu, hãy dùng hỗ trợ"
caES = "Flota al cel per sostenir una illa celestial\nrequereix descansar sobre alguna cosa per motius incomprensibles; utilitza el suport"
beBY = "Плавае ў небе, каб падтрымліваць нябесны востраў,\nпатрабуе абапірацца на нешта па незразумелых прычынах; выкарыстоўвайце апору"
roRO = "Plutește în cer pentru a susține o insulă cerească\nnecesită să se sprijine pe ceva, dintr-un motiv de neînțeles; folosiți suportul"
huHU = "Lebeg az égben, hogy támogasson egy égi szigetet,\nmegérthetetlen okokból valamin meg kell pihennie, használd a támaszt"
arSA = "الصخرة العائمة تطفو في السماء لدعم جزيرة سماوية\nتتطلب الاستناد على شيء ما لأسباب غير مفهومة، استخدم الدعامة"

["MPME.FloatingRock.FlavorDescription"]
raw = "\"How does it worksxa0?\"\nOhxa0? Oh, nowxa0? After all these yearsxa0? After all these gamesxa0? Now you ask ME how those workxa0?"
status = "normal"
enUS = "How does it work?\"  \n\"Oh? Oh, now? After all these years? After all these games? Now you ask ME how those work?"
zhCN = "这是什么原理？这么多年，这么多游戏，现在才问我这些是如何运作的？"
zhTW = "這個是怎麼運作的？\"\n哦？哦，現在？經過這麼多年？經過這麼多遊戲？現在你問我這些是怎麼運作的？"
ruRU = "Как это работает? О? О, теперь? После всех этих лет? После всех этих игр? Теперь ты спрашиваешь МЕНЯ, как это работает?"
jaJP = "「どうやって機能するの？」  \nああ？ああ、今？何年も経って？これまでのゲームの後に？今になって私にそれがどう機能するかを聞くの？"
frFR = "\"Comment ça fonctionne ?\"\nOh ? Oh, maintenant ? Après toutes ces années ? Après tous ces jeux ? Maintenant, tu me demandes comment ça fonctionne ?"
deDE = "Wie funktioniert das?\" Oh? Oh, jetzt? Nach all diesen Jahren? Nach all diesen Spielen? Fragst du JETZT mich, wie das funktioniert?"
plPL = "Jak to działa? Och? Och, teraz? Po tych wszystkich latach? Po tych wszystkich grach? Teraz pytasz Mnie, jak to działa?"
ptBR = "Como isso funciona?\"\nOh? Oh, agora? Depois de todos esses anos? Depois de todos esses jogos? Agora você me pergunta como isso funciona?"
koKR = "어떻게 작동하나요?\"  \n\"어? 어, 이제? 이 모든 세월이 지나고? 이 모든 게임들이 지나고? 이제야 나에게 어떻게 작동하는지 물어보는 건가요?"
trTR = "Bu nasıl çalışıyorxa0? Ohxa0? Ah, şimdi mi xa0? Tüm bu yıllardan sonra xa0? Tüm bu oyunlardan sonra xa0? Şimdi bana bu nasıl çalışıyor diye soruyorsun xa0?"
esES = "\"¿Cómo funciona?\"\nOh, ¿eh? ¿Oh, ahora? ¿Después de todos estos años? ¿Después de todos estos juegos? ¿Ahora me preguntas a MÍ cómo funcionan?"
itIT = "\"Come funziona?\"\nOh? Oh, adesso? Dopo tutti questi anni? Dopo tutti questi giochi? Adesso chiedi a ME come funzionano?"
ukUA = "\"Як це працює?\"\nОй? Ой, тепер? Після стількох років? Після стількох ігор? І тепер ти питаєш У МЕНЕ, як вони працюють?"
thTH = "\"มันทำงานยังไงนะ?\"\nโอ้? โอ้ ตอนนี้เหรอ? หลังจากผ่านมาหลายปีเนี่ยนะ? หลังจากเล่นเกมมาตั้งหลายเกมเนี่ยนะ? ตอนนี้แกกลับมาถามฉันเนี่ยนะว่ามันทำงานยังไง?"
csCZ = "Jak to funguje?\nO? O, teď? Po všech těch letech? Po všech těch hrách? Teď se mě ptáš, jak to funguje?"
viVN = "Nó hoạt động như thế nào?\nÔi?\nỒ, giờ sao?\nSau bao nhiêu năm?\nSau tất cả những trò chơi này sao?\nGiờ bạn hỏi TÔI cách chúng hoạt động?"
caES = "\"Com funciona, xa0?\"\nOh, xa0? Oh, ara, xa0? Després de tants anys, xa0? Després de tants jocs, xa0? Ara em preguntes A MI com funcionen aquestes coses, xa0?"
beBY = "\"Як гэта працуе?\"\nО, не, ну вы ж не сур'ёзна? Пасля ўсіх гэтых гадоў? Пасля ўсіх гэтых гульняў? І цяпер вы пытаеце ў МЯНЕ, як яны працуюць?"
roRO = "\"Cum funcționează\xa0?\"\nOh\xa0? Oh, acum\xa0? După atâția ani\xa0? După atâtea jocuri\xa0? Acum mă întrebi PE MINE cum funcționează ele\xa0?"
huHU = "\"Hogyan működik?\"\nÓ, most? Évek után? Ennyi játék után? Most engem kérdezel meg, hogy azok hogyan működnek?"
arSA = "“كيف تعمل؟”\nأوه؟ أوه، الآن؟ بعد كل تلك السنين؟ بعد كل تلك الألعاب؟ والآن تسألني أنا كيف تعمل تلك الأشياء؟"

