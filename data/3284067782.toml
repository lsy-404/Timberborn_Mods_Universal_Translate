["Building.VoidSinkHole.Description"]
raw = "Visually deletes the ground under it.\nActs as a negative water source to delete water falling off the islands\nThe flag won’t be visible in-game"
status = "normal"
enUS = "Visually deletes the ground under it.\nActs as a negative water source to delete water falling off the islands\nThe flag won’t be visible in-game"
zhCN = "透明的遮盖物，可以使下方的地面变透明，同时作为负水源吸收周围的水。游玩时标记旗将不可见。"
zhTW = "在視覺上刪除其下方的地面。  \n作為一個負水源，刪除從島嶼上掉落的水。  \n遊戲中將不會顯示這面旗幟。"
ruRU = "Визуально удаляет землю под собой. \nДействует как негативный источник воды для удаления воды, падающей с островов. \nФлаг не будет виден в игре."
jaJP = "視覚的にその下の地面を削除します。  \n島から落ちる水を削除するためのネガティブな水源として機能します。  \nゲーム内では旗は表示されません。"
frFR = "Supprime visuellement le sol en dessous.\nAgit comme une source d'eau négative pour supprimer l'eau tombant des îles.\nLe drapeau ne sera pas visible en jeu."
deDE = "Löscht visuell den Boden darunter.  \nFungiert als negative Wasserquelle, um Wasser zu löschen, das von den Inseln fällt.  \nDie Flagge wird im Spiel nicht sichtbar sein."
plPL = "Wizualnie usuwa ziemię pod sobą. Działa jako negatywne źródło wody, aby usunąć wodę spływającą z wysp. Flaga nie będzie widoczna w grze."
ptBR = "Exclui visualmente o chão abaixo dele.  \nAge como uma fonte negativa de água para deletar a água que cai das ilhas.  \nA bandeira não será visível no jogo."
koKR = "시각적으로 그 아래의 땅을 삭제합니다. 섬에서 떨어지는 물을 삭제하는 부정적인 물의 원천으로 작용합니다. 게임 내에서는 깃발이 보이지 않습니다."
trTR = "Görsel olarak altındaki zemini siler. Adalardan düşen suyu silmek için negatif su kaynağı olarak işlev görür. Bayrak oyun içinde görünmeyecek."
esES = "Visualmente elimina el suelo que hay debajo.\nActúa como una fuente de agua negativa que elimina el agua que cae desde las islas.\nLa bandera no será visible en el juego."
itIT = "Visivamente rimuove il terreno sotto di esso.\nFunge da fonte d'acqua negativa per eliminare l'acqua che cade dalle isole\nLa bandiera non sarà visibile nel gioco"
ukUA = "Візуально видаляє ґрунт під ним.\nДіє як від'ємне джерело води, що видаляє воду, яка стікає з островів\nПрапорець не буде видно в грі"
thTH = "ทำให้พื้นดินใต้สิ่งนี้หายไปในการแสดงผล\nทำหน้าที่เป็นแหล่งน้ำติดลบเพื่อลบน้ำที่ไหลตกจากเกาะต่างๆ\nธงจะไม่ปรากฏในเกม"
csCZ = "Vizualně maže půdu pod sebou. \nPůsobí jako negativní zdroj vody pro odstranění vody, která padá z ostrovů. \nVlajka nebude viditelná ve hře."
viVN = "Xóa mặt đất phía dưới nó bằng hiệu ứng trực quan.\nHoạt động như một nguồn nước âm để xóa nước rơi xuống khỏi các hòn đảo.\nCờ sẽ không hiển thị trong trò chơi."
caES = "Visualment elimina el terreny que hi ha a sota.\nActua com a font d'aigua negativa que elimina l'aigua que cau des de les illes\nLa bandera no serà visible al joc"
beBY = "Візуальна ўсталёўка выдаляе зямлю пад ёй.\nДзейнічае як негатыўная крыніца вады, якая выдаляе ваду, што падае з астравоў\nСцяг не будзе бачны ў гульні"
roRO = "Vizual șterge terenul de sub el.\nAcționează ca o sursă negativă de apă, ștergând apa care cade de pe insule\nSteagul nu va fi vizibil în joc"
huHU = "Vizuálisan eltünteti az alatta lévő talajt.\nNegatív vízforrásként működik, amely eltünteti a szigetekről lefolyó vizet.\nA zászló a játékban nem lesz látható."
arSA = "يحذف الأرض التي تقع تحته بصرياً.\nيعمل كمصدر ماء سلبي يحذف المياه المتساقطة من الجزر\nلن تظهر العلامة في اللعبة"

