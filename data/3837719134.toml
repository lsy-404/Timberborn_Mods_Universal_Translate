["Good.SpiritWood.Description"]
status = "normal"
raw = "Spirit trees take sixty years to mature; the raw material for spirit buildings and spirit gears."
enUS = "Spirit trees take sixty years to mature; they provide the raw material for spirit buildings and spirit gears."
zhCN = "灵树需要六十年才能成熟；它是灵性建筑和灵性齿轮的原材料。"
