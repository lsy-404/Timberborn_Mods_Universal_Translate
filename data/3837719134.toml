["Building.Spiritveil.CompactMechanicalPump.FlavorDescription"]
status = "normal"
raw = "Small enough to overlook, stubborn enough to keep the fields green."
enUS = "Small enough to overlook, stubborn enough to keep the fields green."
zhCN = "小到容易被忽略，却倔强得能让田地保持翠绿。"
zhTW = "小到容易被忽略，卻倔強得足以讓田地保持翠綠。"
ruRU = "Небольшой, чтобы его не замечали, и упрямый, чтобы поля оставались зелёными."
