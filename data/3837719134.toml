["Building.Spiritveil.Bench.Description"]
status = "normal"
raw = "A bench by the stream for resting or meditating. Sit long enough and you lose track of the hour."
enUS = "A bench by the stream for resting or meditating. Sit long enough and you lose track of the hour."
zhCN = "溪边的一张长椅，供人休息或冥想。坐得久了，便会忘了时辰。"
zhTW = "溪邊的長椅，供休憩或冥想之用。坐得夠久，你就會忘了時間。"
ruRU = "Скамья у ручья для отдыха и медитации. Просидишь на ней достаточно долго, и потеряешь счёт времени."
jaJP = "小川のそばにある、休憩や瞑想のためのベンチ。長く座っていると、時間の感覚を失ってしまいます。"
frFR = "Un banc au bord du ruisseau pour se reposer ou méditer. Restez assis assez longtemps et vous perdez la notion de l'heure."
deDE = "Eine Bank am Bach zum Ausruhen oder Meditieren. Sitzt man lange genug darauf, verliert man das Zeitgefühl."
plPL = "Ławka nad strumieniem, na której można odpocząć lub medytować. Wystarczy tu posiedzieć odpowiednio długo, a traci się rachubę godzin."
ptBR = "Um banco à beira do riacho para descansar ou meditar. Fique sentado tempo suficiente e você perde a noção da hora."
koKR = "개울가의 벤치로, 쉬거나 명상하기에 좋다. 오래 앉아 있다 보면 시간 가는 줄 모르게 된다."
trTR = "Dere kenarındaki bir bank; dinlenmek ve meditasyon yapmak için. Orada yeterince uzun oturursanız saatin nasıl geçtiğini fark etmezsiniz."
esES = "Un banco junto al arroyo para descansar o meditar. Si te sientas el tiempo suficiente, pierdes la noción de la hora."
itIT = "Una panchina accanto al ruscello per riposare o meditare. Se ci si siede abbastanza a lungo, si perde la cognizione dello scorrere delle ore."
ukUA = "Лавка біля струмка для відпочинку чи медитації. Просидиш досить довго — і втратиш лік годинам."
thTH = "ม้านั่งข้างลำธารสำหรับพักผ่อนหรือทำสมาธิ นั่งนานพอแล้วคุณจะไม่รู้ตัวว่าเวลาผ่านไปนานแค่ไหน"
csCZ = "Lavička u potoka pro odpočinek nebo meditaci. Pokud na ní budete sedět dostatečně dlouho, ztratíte přehled o čase."
viVN = "Một chiếc ghế dài bên dòng suối để nghỉ ngơi hoặc thiền định. Ngồi đủ lâu và bạn sẽ quên mất thời gian."
caES = "Un banc al costat del rierol per descansar o meditar. Si t'hi asseus prou temps, perds la noció de l'hora."
beBY = "Лаўка каля ручая для адпачынку або медытацыі. Пасядзіш досыць доўга, і пачынаеш губляць лік гадзін."
roRO = "O o bancă de lângă pârâu, pentru odihnă sau meditație. Dacă stai suficient de mult, pierzi noțiunea timpului."
huHU = "A patak mellett álló pad pihenésre és meditálásra való. Ha elég sokáig ülsz rajta, elveszíted az idő érzékét."
arSA = "مقعد بجوار الجدول لاستراحة التأمل أو الاسترخاء. إذا جلست لفترة طويلة، فستفقد إحساسك بالوقت."

