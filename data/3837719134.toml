["Building.Spiritveil.EarthRepopulator.FlavorDescription"]
status = "normal"
raw = "One boat to the heavens, and the whole clan goes with it."
enUS = "One boat to the heavens, and the whole clan goes with it."
zhCN = "一舟登仙，全族同往。"
zhTW = "一船飛升昇天，整個宗族都跟著去。"
ruRU = "Одна лодка на небеса, и весь клан отправляется вслед за ней."
jaJP = "天に昇る船は一隻、そして一族全員がそれに乗っていく。"
