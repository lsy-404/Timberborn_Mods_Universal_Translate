["Building.Spiritveil.TributeToIngenuity.Description"]
status = "normal"
raw = "Honours the clan's generations of craft; raise the stele, and the spirit veins flourish. Meditate inside to slowly bank Golden Core progress."
enUS = "Honors the clan's generations of craft; raise the stele, and the spirit veins flourish. Meditate inside to slowly bank Golden Core progress."
zhCN = "致敬宗门历代的工艺传承；竖起石碑，灵脉便会繁茂。在其中打坐，可缓慢积累金丹进度。"
zhTW = "致敬宗門世代的工藝傳承；立起碑石，靈脈便會繁盛。於其中打坐，可緩慢累積金丹的修煉進度。"
ruRU = "Чтит поколения мастерства клана; возведите стелу, и духовные жилы расцветут. Медитируйте внутри, чтобы медленно накапливать прогресс Золотого ядра."
jaJP = "清族の代々の技を讃える碑を建てると霊脈が栄える。内部で瞑想すると、金丹の進捗がゆっくりと蓄えられる。"
frFR = "Rend hommage aux générations d'artisanat du clan ; érigez la stèle, et les veines spirituelles prospéreront. Méditez à l'intérieur pour accumuler lentement la progression du Noyau d'or."
deDE = "Ehrt die Handwerkskunst der Generationen des Klans; errichte die Stele, dann gedeihen die Geistadern. Meditiere im Inneren, um den Fortschritt zum Goldenen Kern langsam zu festigen."
plPL = "Szanuje pokolenia rzemiosła klanu; postaw stelę, a żyły duchowe rozkwitną. Medytuj wewnątrz, aby powoli zwiększać postęp Złotego Jądra."
ptBR = "Homenageia as gerações de ofício do clã; ergua a estela e os veios espirituais florescerão. Medite em seu interior para acumular progresso do Núcleo Dourado de forma lenta."
koKR = "클랜 대대로 이어진 기술을 기리는 건물입니다. 비석을 세우면 영혼의 맥이 번성합니다. 안에서 명상하면 금단(金丹) 진행도가 천천히 쌓입니다."
trTR = "Klanın nesiller boyu süren zanaatını onurlandırır; steli dikin, ruh damarları çiçek açar. İçinde meditasyon yaparak Altın Çekirdek ilerlemesini yavaş yavaş biriktirin."
esES = "Honra las generaciones de artesanía del clan; levanta la estela y las venas espirituales florecen. Medita en su interior para acumular lentamente progreso hacia el Núcleo Dorado."
itIT = "Onora le generazioni di artigianato del clan; erigi la stele e le vene spirituali fioriranno. Medita al suo interno per far progredire lentamente il Nucleo d'Oro."
ukUA = "Вшановує покоління ремісників клану; зведіть стелу, і духовні жили розквітнуть. Медитуйте всередині, щоб повільно накопичувати прогрес Золотого ядра."
thTH = "เชิดชูฝีมือช่างที่สืบทอดมาหลายชั่วอายุคนของตระกูล; ตั้งศิลาจารึกขึ้น แล้วเส้นชีพจรวิญญาณจะเจริญงอกงาม นั่งสมาธิภายในเพื่อสะสมความก้าวหน้าของแก่นทอง (Golden Core) อย่างช้าๆ"
csCZ = "Ctí předků klanu za generace řemesla; vztyčte stélu a duchovní žíly rozkvetou. Meditací uvnitř pomalu zvyšujete pokrok ve Zlatém jádru."
viVN = "Tôn vinh truyền thống thủ công qua nhiều thế hệ của gia tộc; dựng bia đá lên, và linh mạch sẽ hưng thịnh. Thiền định bên trong để từ từ tích lũy tiến độ Kim Đan."
caES = "Honora les generacions d'artesania del clan; aixeca l'estela i les venes espirituals floriran. Medita'n l'interior per fer avançar a poc a poc el progrés cap al Nucli Daurat."
beBY = "Ушаноўвае пакаленні рамесніцтва роду: узвядзіце стэлу — і духоўныя жылы зацвітуць. Медытуйце ўнутры, каб паступова ўзмацняць прагрэс Залатога ядра."
roRO = "Onorează generațiile de meșteșug ale clanului; ridică stela și venele spirituale înfloresc. Meditează în interior pentru a acumula treptat progresul Nucleului de Aur."
huHU = "Tiszteli a klán generációinak mesterségbeli tudását; állítsd fel a sztélét, és a szellemi erek virágozni kezdenek. Belül meditálj, hogy lassan gyarapítsd az Aranymag fejlődését."
arSA = "يُكرّم حِرَف عشائر الأجيال المتعاقبة؛ ارفع المسلّة فتزدهر عروق الروح. تأمّل بداخلها لتراكم تقدّم النواة الذهبية ببطء."

