beBY = "Духмяныя дрэвы сталеюць шэсцьдзесят гадоў; з іх атрымліваюць сыравіну для духмяных будынкаў і духмяных шастарняў."
roRO = "Copacii spirituali au nevoie de șaizeci de ani ca să ajungă la maturitate; sunt materia primă pentru clădirile și roțile dințate spirituale."
