["Building.Spiritveil.Scarecrow.Description"]
status = "normal"
raw = "A guardian effigy that scares off birds and beasts and keeps the season's harvest safe."
enUS = "A guardian effigy that scares off birds and beasts and keeps the season's harvest safe."
