["Building.Spiritveil.Fermenter.Description"]
status = "normal"
raw = "Brews Foundation Pills and Breakthrough Pills, along with the healing, qi and longevity elixirs. Pills are drawn from stock automatically and never count as food."
enUS = "Brews Foundation Pills and Breakthrough Pills, along with the healing, qi and longevity elixirs. Pills are drawn from stock automatically and never count as food."
zhCN = "酿造基础丹药与突破丹药，以及治疗、灵气和长寿丹药。丹药会自动从库存中取用，且绝不计入食物。"
zhTW = "釀造基礎丹與突破丹，以及治療、靈氣和延壽靈藥。丹藥會自動從庫存中取用，且絕不計入食物。"
ruRU = "Варит Основные пилюли и пилюли Прорыва, а также эликсиры исцеления, ци и долголетия. Пилюли автоматически берутся из запасов и никогда не считаются едой."
jaJP = "醸造所では、基礎丹薬と突破丹薬、そして治癒・霊気・長寿の霊薬を醸造する。丹薬は在庫から自動的に引き出され、食料として数えられることはない。"
frFR = "Prépare les Pilules de fondation et les Pilules de percée, ainsi que les élixirs de guérison, de qi et de longévité. Les pilules sont automatiquement prélevées dans le stock et ne comptent jamais comme nourriture."
deDE = "Braut Gründungspillen und Durchbruchspillen sowie die Elixiere für Heilung, Qi und Langlebigkeit. Pillen werden automatisch aus dem Lager entnommen und zählen niemals als Nahrung."
plPL = "Warzy Fundacji Pill i Pill Przełomu, a także eliksiry leczenia, qi i długowieczności. Pigułki są pobierane z zapasów automatycznie i nigdy nie liczą się jako jedzenie."
ptBR = "Prepara as Pílulas de Fundação e as Pílulas de Avanço, além dos elixires de cura, qi e longevidade. As pílulas são retiradas do estoque automaticamente e nunca contam como alimento."
koKR = "기초 영약 환과 돌파 영약 환, 그리고 치유·기(氣)·장수 영약을 빚습니다. 환약은 재고에서 자동으로 꺼내 쓰며, 음식으로 집계되지 않습니다."
trTR = "Temel Yapı Pilleri ve Atılım Pillerinin yanı sıra iyileştirici, qi ve uzun ömür iksirlerini hazırlar. Piller stoktan otomatik olarak çekilir ve hiçbir zaman yiyecek sayılmaz."
esES = "Elabora Píldoras de Fundación y Píldoras de Avance, además de los elixires de curación, qi y longevidad. Las píldoras se toman del almacén automáticamente y nunca cuentan como comida."
itIT = "Prepara le Pillole di Fondazione e le Pillole di Svolta, insieme agli elisir di guarigione, qi e longevità. Le pillole vengono prelevate automaticamente dalle scorte e non contano mai come cibo."
ukUA = "Виготовляє Фундаментальні пігулки та Пігулки прориву, а також еліксири зцілення, ці та довголіття. Пігулки автоматично беруться із запасів і ніколи не враховуються як їжа."
thTH = "ผลิตยาเม็ดรากฐาน (Foundation Pills) และยาเม็ดฝ่าด่าน (Breakthrough Pills) รวมถึงยาฟื้นฟู ยาปราณ และยาอายุวัฒนะ ยาเม็ดจะถูกดึงจากสต็อกโดยอัตโนมัติ และจะไม่นับเป็นอาหารเลย"
csCZ = "Vaří Základní pilulky a Průlomové pilulky spolu s elixíry léčení, qi a dlouhověkosti. Pilulky se automaticky berou ze zásob a nikdy se nepočítají jako jídlo."
viVN = "Ủ Đan Nền Tảng và Đan Đột Phá, cùng với các loại linh dịch chữa thương, linh khí và trường thọ. Đan dược được tự động lấy từ kho dự trữ và không bao giờ được tính là thực phẩm."
caES = "Elabora les Píndoles de Fundació i les Píndoles d'Avanç, juntament amb els elixirs de curació, de qi i de longevitat. Les píndoles es treuen del magatzem automàticament i mai no compten com a menjar."
beBY = "Вырабляе Фундаментальныя таблеткі і таблеткі прарыву, а таксама эліксіры аздараўлення, ци і даўгалецця. Таблеткі аўтаматычна бяруцца са запасаў і ніколі не залічваюцца як ежа."
roRO = "Produce Pilule de Fundație și Pilule de Descoperire, împreună cu elixirele de vindecare, qi și longevitate. Pilulele sunt luate automat din stoc și nu sunt niciodată considerate hrană."
huHU = "Alapanyag-foglalkozás: a Foundation Pills (alapozó pirulák) és Breakthrough Pills (áttörési pirulák), valamint az életerő-, qi- és hosszú életű elixírek főzése. A pirulák automatikusan a készletből kerülnek elő, és soha nem számítanak élelemnek."
arSA = "يقوم بتحضير حبوب الأساس وحبوب الاختراق، إلى جانب إكسير الشفاء وإكسير الطاقة الروحية وإكسير طول العمر. تُسحب الحبوب من المخزون تلقائياً ولا تُحتسب أبداً كطعام."

