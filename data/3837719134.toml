beBY = "AquiferDrillIron Свердзел для водаеменяў големавага класа; драўляныя галемы забяспечваюць яму нудную працу днём і ўначы."
roRO = "AquiferDrillIron Foreza de acvifer de calitate golem; golemii de lemn se asigură că rămâne plictisitoare zi și noapte."
huHU = "AquiferDrillIron A golem-minőségű víznyerő fúró; fagolemek gondoskodnak arról, hogy nappal és éjjel egyaránt unalmasan, zavartalanul működjön."
