raw = "Reads the heavens to fix the seasons, timing both the planting and the cultivation."
enUS = "Reads the heavens to set the seasons, timing both planting and cultivation."
zhCN = "观星台可观测天象以确定季节，同时安排播种与培育的时机。"
zhTW = "觀測天象以校定季節，同時掌控播種與栽培的時機。"
ruRU = "Определяет небесные знаки, чтобы выбрать сезоны, и задаёт время как для посадки, так и для ухода за посевами."
jaJP = "天を読み季節を定め、植え付けと栽培の両方の時期を計る。"
frFR = "Lit les cieux pour fixer les saisons, en rythmant à la fois la plantation et la culture."
deDE = "Liest die Himmel, um die Jahreszeiten festzulegen, und bestimmt dabei den Zeitpunkt für Aussaat und Pflege."
plPL = "Odczytuje niebiosa, by ustalać pory roku, i wyznacza czas zarówno sadzenia, jak i uprawy."
ptBR = "Lê os céus para determinar as estações, definindo o tempo tanto do plantio quanto do cultivo."
koKR = "하늘의 기운을 읽어 계절을 정하고, 파종과 재배의 시기를 함께 정한다."
trTR = "Gökyüzünü okuyarak mevsimleri belirler; hem ekimin hem de yetiştirmenin zamanlamasını ayarlar."
esES = "Lee los cielos para fijar las estaciones, marcando el momento tanto de la siembra como del cultivo."
itIT = "Legge il cielo per stabilire le stagioni, scandendo sia la semina sia la coltivazione."
ukUA = "Читає небесні знаки, щоб визначати пори року, і встановлює час як для посіву, так і для догляду за посівами."
thTH = "ใช้อ่านดวงดาวเพื่อกำหนดฤดูกาล และกำหนดจังหวะเวลาทั้งการเพาะปลูกและการดูแลพืชผล"
csCZ = "Čte nebesa, aby určila roční období, a řídí tak načasování jak výsadby, tak pěstování."
viVN = "Đọc các vì sao để định mùa, đồng thời định thời điểm gieo trồng và canh tác."
caES = "Llegeix els cels per fixar les estacions, regulant tant la plantació com el cultiu."
beBY = "Чытае нябёсы, каб вызначаць поры года, і выстаўляе час як для пасадкі, так і для догляду за пасевамі."
roRO = "Citește cerurile pentru a stabili anotimpurile, sincronizând atât plantarea, cât și cultivarea."
huHU = "Az eget olvasva rögzíti az évszakokat, és időzíti mind a vetést, mind a termesztést."
arSA = "يقرأ السماء لتحديد الفصول، ويضبط توقيت الزراعة والعناية بالمحاصيل معًا."

