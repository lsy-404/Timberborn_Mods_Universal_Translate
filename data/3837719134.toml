jaJP = "ルーン文字が刻まれた陣形で、門全体を守護する。建設後、すべての突破成功率に+5パーセントポイント、マップ全体の修練速度に+1%の効果を与える（同じ建物は重複して数えない）。"
frFR = "Une formation gravée de runes qui protège la porte entière. Une fois construite : +5 points de pourcentage à toutes les percées et +1 % de vitesse de culture sur toute la carte (un même bâtiment ne compte qu'une seule fois)."
deDE = "Eine mit Runen verzierte Formation, die das gesamte Tor schützt. Nach dem Bau: +5 Prozentpunkte auf alle Durchbrüche und +1 % Kultivierungsgeschwindigkeit über die gesamte Karte (dasselbe Gebäude zählt nur einmal)."
plPL = "Formacja z wyrytymi runami, osłaniająca całą bramę. Po wybudowaniu: +5 punktów procentowych do każdego przełamania oraz +1% prędkości uprawy na całej mapie (ten sam budynek liczy się tylko raz)."
ptBR = "Uma formação gravada com runas que protege todo o portão. Uma vez construída: +5 pontos percentuais em todas as breakthroughs e +1% de velocidade de cultivo em todo o mapa (o mesmo edifício conta apenas uma vez)."
koKR = "여러 개의 룬이 새겨진 진형으로, 성문 전체를 보호합니다. 건설 완료 후 모든 돌파 확률에 +5%p, 맵 전체 수련 속도에 +1%를 제공합니다(같은 건물은 한 번만 적용됩니다)."
