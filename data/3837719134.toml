["Building.Spiritveil.EarthRecultivator.Description"]
status = "normal"
raw = "A sect treasure that mends the spirit veins. Once built, the base success rate of all five breakthroughs - the final tribulation included - is doubled, and stacks with pills, offerings and aura bonuses."
enUS = "A sect treasure that mends the spirit veins. Once built, the base success rate of all five breakthroughs, the final tribulation included, is doubled, and it stacks with pills, offerings and aura bonuses."
zhCN = "兼顾灵脉的宗门至宝。建成后，包括最终天劫在内的全部五次突破的基础成功率均翻倍，并可与丹药、供奉及灵气加成叠加。"
zhTW = "寶物能修補靈脈。建成後，包括最後天劫在內的全部五次突破，其基礎成功率都會提高一倍，並可與丹藥、供奉及靈氣加成疊加。"
ruRU = "Сокровище секты, которое восстанавливает духовные жилы. После постройки базовый шанс успеха всех пяти прорывов, включая финальное испытание небесной скорби, удваивается, и этот бонус суммируется с действием пилюль, подношений и бонусов ауры."
jaJP = "宗門の宝物で、霊脈を修復する。建設すると、天劫を含む五つの突破すべての基本成功率が二倍になる。丹薬、供物、オーラのボーナスとも重ね掛けできる。"
frFR = "Un trésor de secte qui répare les veines spirituelles. Une fois construit, le taux de réussite de base des cinq percées, y compris la tribulation finale, est doublé, et il se cumule avec les pilules, les offrandes et les bonus d'aura."
deDE = "Ein Sektenschatz, der die Geistadern heilt. Sobald er errichtet ist, wird die Grunderfolgsquote aller fünf Durchbrüche – einschließlich der letzten Prüfung – verdoppelt, und sie kumuliert sich mit Pillen, Opfergaben und Aura-Boni."
plPL = "Skarb sekty, który leczy żyły duchowe. Po wybudowaniu podwaja bazową szansę powodzenia wszystkich pięciu przełomów, łącznie z ostateczną próbą, i sumuje się z pigułkami, ofiarami oraz bonusami z aury."
ptBR = "Um tesouro da seita que repara os veios espirituais. Uma vez construído, a taxa de sucesso base de todas as cinco abordagens de avanço, incluindo a tribulação final, é dobrada, e se acumula com pílulas, oferendas e bônus de aura."
koKR = "영적 맥을 치유하는 종문 보물입니다. 건설되면 최종 천벌을 포함한 다섯 번의 돌파 모두의 기본 성공률이 두 배가 되며, 단약, 공물, 기운(오라) 보너스와 중첩됩니다."
trTR = "Bir tarikat hazinesi; ruh damarlarını onarır. İnşa edildiğinde, son kriz dahil olmak üzere beş aşamanın tümünün temel başarı oranı iki katına çıkar ve hap, sunu ve aura bonuslarıyla birlikte etki eder."
esES = "Un tesoro de la secta que repara las venas espirituales. Una vez construido, la tasa de éxito base de los cinco avances —incluida la tribulación final— se duplica, y se acumula con las píldoras, las ofrendas y los bonificadores de aura."
itIT = "Un tesoro della setta che ripara le vene spirituali. Una volta costruito, il tasso di successo di base di tutte e cinque le svolte, compresa l'ultima tribolazione, viene raddoppiato, e si cumula con pillole, offerte e bonus dell'aura."
ukUA = "Скарб секти, що зцілює духовні жили. Після побудови базовий шанс успіху всіх п'яти proryvів, включно з останнім випробуванням, подвоюється, і цей ефект складається з пілюлями, підношеннями та бонусами аури."
thTH = "ของล้ำค่าประจำสำนักที่ช่วยซ่อมแซมเส้นลมปราณวิญญาณ เมื่อสร้างแล้ว อัตราความสำเร็จพื้นฐานของการฝ่าด่านทั้งห้าขั้น รวมถึงการฝ่าด่านสุดท้ายด้วย จะเพิ่มขึ้นเป็นสองเท่า และสามารถซ้อนทับกับยาเม็ด เครื่องบูชา และโบนัสจากออร่าได้"
csCZ = "Pokladnice sekty, která léčí duchovní žíly. Po postavení se základní úspěšnost všech pěti průlomů, včetně závěrečné tribulace, zdvojnásobí a sčítá se s pilulkami, obětinami a bonusy z aury."
viVN = "Một bảo vật tông môn giúp chữa lành các linh mạch. Sau khi xây dựng, tỷ lệ thành công cơ bản của cả năm lần đột phá, bao gồm cả thiên kiếp cuối cùng, sẽ được nhân đôi, và cộng dồn với đan dược, lễ vật cúng tế cũng như các gia cát từ linh khí."
caES = "Un tresor de la secta que repara les venes espirituals. Un cop construït, la taxa d'èxit base de les cinc fases de rutura (inclosa la tribulació final) es duplica, i s'acumula amb les píndoles, les ofrenes i els bonus d'aura."
beBY = "Секцыйны скарб, які аднаўляе духоўныя жылы. Пасля будаўніцтва базавая імавернасць поспеху ўсіх пяці прарываў, уключаючы фінальнае выпрабаванне, падвойваецца, і гэты эфект складаецца з бонусамі ад пілюль, ахвяраванняў і аўры."
roRO = "Un tezaur al clanului care vindecă venele spirituale. Odată construit, șansa de bază de succes a tuturor celor cinci străpungeri, inclusiv ultima tribulație, este dublată, iar efectul se cumulează cu pilulele, ofrandele și bonusurile de aură."
huHU = "A szekta kincse, amely a lelki ereket gyógyítja. Megépítése után mind az öt áttörés alapsikerességi esélye – a végső megpróbáltatást is beleértve – megduplázódik, és ez összeadódik a pirulák, az áldozatok és a aura-bónuszok hatásával."
arSA = "يُعدّ كنزًا للطائفة يرمّم عروق الروح. بمجرد بنائه، يتضاعف معدل النجاح الأساسي لجميع الاختراقات الخمسة، بما فيها المحنة الأخيرة، ويتراكم مع الحبوب والقرابين ومكافآت الهالة."

