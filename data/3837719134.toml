["Building.Spiritveil.Hedge.Description"]
status = "normal"
raw = "A low woven wall that fences the yard, keeps out wanderers and lends the gate a little elegance."
enUS = "A low woven wall that fences the yard, keeps out wanderers and lends the gate a little elegance."
zhCN = "低矮的编织围墙，围住院子，阻挡闲逛者，也为大门平添几分雅致。"
zhTW = "低矮的編織圍牆圍住庭院，擋住四處遊蕩的生物，也為大門增添幾分優雅。"
ruRU = "Низкая плетёная изгородь, которая огораживает двор, не пускает бродяг и придаёт воротам немного изящества."
jaJP = "低く編まれた垣根が庭を囲み、よそ者の侵入を防ぎつつ、門にささやかな優雅さを添えます。"
frFR = "Un muret tressé bas qui clôture la cour, empêche les vagabonds d'entrer et donne au portail une touche d'élégance."
deDE = "Eine niedrige, geflochtene Wand, die den Hof einzäunt, Herumstreunende fernhält und dem Tor ein wenig Eleganz verleiht."
plPL = "Niski, plecionkowy mur, który ogradza podwórko, trzyma z dala włóczęgów i nadaje bramie odrobinę elegancji."
ptBR = "Uma cerca baixa de trama trançada que delimita o quintal, impede a entrada de andarilhos e dá um toque de elegância ao portão."
koKR = "낮게 엮은 울타리 벽으로 마당을 두르고, 떠돌이들을 막아 주며, 문에 약간의 우아함을 더합니다."
trTR = "Avluyu çevreleyen, gezginleri uzak tutan ve kapıya biraz zarafet katan alçak, örgü bir duvar."
esES = "Una valla tejida y baja que cerca el patio, mantiene alejados a los vagabundos y da a la puerta un toque de elegancia."
itIT = "Un basso muro intrecciato che recinta il cortile, tiene lontani i vagabondi e conferisce al cancello un po' di eleganza."
ukUA = "Низький плетений паркан, що огороджує двір, стримує бродяг і додає воротам трохи витонченості."
thTH = "ผนังรั้วถักต่ำที่ล้อมรอบลานบ้าน ช่วยกันผู้คนที่เดินเตร่เข้ามา และเพิ่มความสง่างามเล็กน้อยให้แก่ประตูทางเข้า"
