["Building.EfficientMine.Description"]
status = "normal"
raw = "Spirit Iron Mine: a deep scrap seam heavy with badwater. Only golems can work it."
enUS = "Spirit Iron Mine: a deep scrap seam heavy with badwater. Only golems can work it."
zhCN = "灵铁矿场：深层废铁矿脉，富含恶水。仅傀儡可以开采。"
zhTW = "靈鐵礦場：位於深層廢鐵礦脈，充滿毒水。只有傀儡能夠開採。"
ruRU = "Шахта железа духов: глубокая жила металлолома, насыщенная мутной водой. Работать на ней могут только големы."
jaJP = "スピリット鉄鉱山：汚水を多く含む深い屑鉄の鉱脈。ゴーレムだけがここで作業できる。"
frFR = "Mine de fer spirituelle : un filon de ferraille profond, chargé d'eau souillée. Seuls les golems peuvent y travailler."
deDE = "Spirit-Eisenmine: ein tiefes Schrottvorkommen, reich an Schlechtwasser. Nur Golems können hier arbeiten."
plPL = "Kopalnia Duchowego Żelaza: głęboka żyła złomu przesycona złą wodą. Tylko golemy mogą tam pracować."
ptBR = "Mina de Ferro Espiritual: um veio profundo de sucata repleto de água envenenada. Somente golems podem operá-la."
koKR = "영혼 철광 채굴장: 독성 물(badwater)이 가득한 깊은 고철 광맥입니다. 골렘만 작업할 수 있습니다."
trTR = "Ruh Demiri Madeni: kötü suyla dolu derin bir hurda damarı. Yalnızca golemler burada çalışabilir."
esES = "Mina de hierro espiritual: un filón profundo de chatarra cargado de agua envenenada. Solo los gólems pueden trabajarlo."
itIT = "Miniera di Ferro Spirituale: un profondo filone di rottami ricco di acqua velenosa. Solo i golem possono lavorarlo."
ukUA = "Шахта духового заліза: глибокий пласт металобрухту, насичений поганою водою. Працювати тут можуть лише големи."
thTH = "ไซต์ขุดเหล็กวิญญาณ: เหมืองเศษเหล็กลึกที่เต็มไปด้วยน้ำเสียจำนวนมาก มีเพียงโกเลมเท่านั้นที่สามารถทำงานที่นี่ได้"
csCZ = "Důl na duchovní železo: hluboké žilo šrotu bohaté na špinavou vodu. Pracovat v něm mohou pouze golemové."
viVN = "Mỏ Sắt Linh Hồn: một mạch phế liệu sâu, nhiều nước độc. Chỉ có golem mới có thể khai thác."
caES = "Mina de ferro espiritual: un filó profund de ferralla carregat d'aigua dolenta. Només els golems hi poden treballar."
beBY = "Шахта залізных парэшкаў: глыбокі пласт металалому, насычаны атрутнай вадой. Працаваць тут могуць толькі галемы."
roRO = "Mina de fier spirituală: un filon adânc de fier vechi, plin de apă otrăvită. Doar golemii pot lucra în ea."
huHU = "Spirit Iron Mine: egy mély, sok mérgező badwaterrel átitatott rozsdásfém-erezet. Csak golemek tudják kitermelni."
arSA = "مَنجم الحديد الروحي: منجم عميق لخام الخردة، مُثقَل بالمياه السامة. لا يستطيع العمل فيه سوى الغولِمات."

