["Building.Spiritveil.AquiferDrill.FlavorDescription"]
status = "normal"
raw = "The deeper it bites, the sweeter the water."
enUS = "The deeper it bites, the sweeter the water."
zhCN = "深入越深，水越甘甜。"
zhTW = "深挖得越深，水就越甘甜。"
ruRU = "Чем глубже он вгрызается, тем слаще вода."
jaJP = "深く食い込むほど、水は甘くなる。"
frFR = "Plus l'appareil mord profondément, plus l'eau est douce."
deDE = "Je tiefer er beißt, desto süßer das Wasser."
plPL = "Im głębiej wgryza się w ziemię, tym słodsza woda."
ptBR = "Quanto mais fundo ela morde, mais doce fica a água."
koKR = "깊이 파고들수록 물맛은 더 달콤해진다."
trTR = "Ne kadar derine dişlerse, su o kadar tatlı olur."
esES = "Cuanto más profundo muerde, más dulce es el agua."
itIT = "Più il morso è profondo, più dolce è l'acqua."
ukUA = "Чим глибше воно кусає, тим солодша вода."
thTH = "ยิ่งเจาะลึกลงไปเท่าไร น้ำก็ยิ่งหวานขึ้นเท่านั้น"
csCZ = "Čím hlouběji kousne, tím sladší voda."
viVN = "Càng cắn sâu, nước càng ngọt."
caES = "El més profund que mossega, més dolça és l'aigua."
beBY = "Чым глыбей ён кусае, тым смачнейшая вада."
roRO = "Cu cât mușcă mai adânc, cu atât apa e mai dulce."
huHU = "A minél mélyebbre harap, annál édesebb a víz."
arSA = "الكلما تعمّقت في العضّ، صارت المياه أحلى."

["Building.Spiritveil.ArtifactWorkshop.Description"]
status = "normal"
raw = "Part pill furnace, part workshop: the elixir fire never goes out and the smell of cinnabar never quite leaves."
enUS = "Part pill furnace, part workshop: the elixir fire never goes out and the smell of cinnabar never quite leaves."
zhCN = "丹炉半是炼丹房，半是作坊：丹火从不熄灭，朱砂的气味也始终挥之不去。"
zhTW = "丹爐一半是炼丹炉，一半是工坊：丹火从不熄灭，朱砂的气味也始终挥之不去。"
ruRU = "Отчасти печь для пилюль, отчасти мастерская: огонь для эликсиров никогда не гаснет, а запах киновари так и не выветривается до конца."
jaJP = "錬丹炉であり、工房でもある。霊薬の炎は決して消えることがなく、辰砂の匂いもいつまでも離れない。"
frFR = "Mi-fourneau à pilules, mi-atelier : le feu d'élixir ne s'éteint jamais et l'odeur de cinabre ne quitte jamais vraiment les lieux."
deDE = "Halb Pillenofen, halb Werkstatt: Das Elixierfeuer erlischt nie, und der Geruch von Zinnober verschwindet nie ganz."
plPL = "Część pigułkarnia, część warsztat: ogień eliksirów nigdy nie gaśnie, a zapach cynobru nigdy do końca nie znika."
ptBR = "Parte forno de pílulas, parte oficina: o fogo do elixir nunca se apaga e o cheiro de cinábrio nunca chega a sumir por completo."
koKR = "반은 단약 화로, 반은 공방: 영약의 불은 결코 꺼지지 않고, 진사(辰砂) 냄새도 좀처럼 가시지 않는다."
trTR = "Yarı ilaç ocağı, yarı atölye: iksir ateşi hiç sönmez ve cinnabar kokusu da hiçbir zaman tam olarak çıkmaz."
esES = "Mitad horno de píldoras, mitad taller: el fuego del elixir nunca se apaga y el olor a cinabrio nunca termina de desaparecer."
itIT = "Metà fornace per pillole, metà bottega: il fuoco dell'elisir non si spegne mai e l'odore di cinabro non se ne va mai del tutto."
ukUA = "Частково пігулкова піч, частково майстерня: еліксирний вогонь ніколи не гасне, а запах кіноварі так і не зникає до кінця."
thTH = "ครึ่งหนึ่งเป็นเตาทำยาเม็ด ครึ่งหนึ่งเป็นโรงงานช่าง: ไฟกลั่นอมตะไม่เคยดับ และกลิ่นของซินนาบาร์ก็ไม่เคยจางหายไปจริงๆ"
csCZ = "Část pilulková pec, část dílna: elixírový oheň nikdy nezhasne a pach cinabaru se nikdy úplně nevytratí."
viVN = "Nửa là lò luyện đan, nửa là xưởng thủ công: lửa luyện đan không bao giờ tắt, và mùi chu sa cũng chẳng bao giờ thực sự tan đi."
caES = "Part forn de píndoles, part taller: el foc de l'elixir mai s'apaga i l'olor de cinabri gairebé mai no marxa."
beBY = "Напалову печ для пілюль, напалову майстэрня: агонь эліксіра ніколі не гасне, а пах кіновару ніколі да канца не знікае."
roRO = "Parte cuptor de pilule, parte atelier: focul elixirului nu se stinge niciodată, iar mirosul de cinabru nu dispare de tot."
huHU = "Félig pirulókemence, félig műhely: az elixírtűz soha nem alszik ki, a cinóbor szaga pedig sosem igazán tűnik el."
arSA = "ثلث فرن للحبوب الروحية، وثلث ورشة: نار الإكسير لا تنطفئ أبدًا، ورائحة الزنجفر لا تكاد تفارق المكان."

