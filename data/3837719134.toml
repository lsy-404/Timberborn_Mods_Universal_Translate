["Building.Spiritveil.GolemPartFactory.Description"]
status = "normal"
raw = "Mortal beavers forge golem torsos, limbs and heads here, and cast metal blocks on the side - the start of the whole golem chain."
enUS = "Mortal beavers forge golem torsos, limbs and heads here, and cast metal blocks on the side - the start of the whole golem chain."
zhCN = "凡人海狸在此锻造傀儡的躯干、四肢与头部，并在一侧铸造金属块——整个傀儡生产链由此开始。"
zhTW = "凡人海狸在此鍛造傀儡的軀幹、四肢與頭部，並在一旁鑄造金屬方塊——這是整條傀儡生產鏈的起點。"
ruRU = "Смертные бобры выковывают здесь торсы, конечности и головы големов, а также отливают металлические блоки с боковой стороны — это начало всей цепочки производства големов."
jaJP = "ここでは、死すべき海狸たちがゴーレムの胴体、手足、頭部を鍛造し、側面で金属ブロックを鋳造します。ゴーレム生産チェーン全体の出発点です。"
frFR = "Les castors mortels forgent ici les torses, membres et têtes des golems, et coulent des blocs de métal sur le côté : c'est le début de toute la chaîne des golems."
deDE = "Sterbliche Biber schmieden hier Golem-Torsi, Gliedmaßen und Köpfe und gießen seitlich Metallblöcke – der Anfang der gesamten Golem-Kette."
plPL = "Śmiertelne bobry kują tutaj tułowia, kończyny i głowy golemów oraz odlewają metalowe bloki z boku — to początek całego łańcucha produkcji golemów."
ptBR = "Aqui, castores mortais forjam torsos, membros e cabeças de golems, e fundem blocos de metal ao lado: é o início de toda a cadeia de golems."
koKR = "필멸의 비버들이 이곳에서 골렘의 몸통, 팔다리, 머리를 단조하고, 옆에서는 금속 블록을 주조합니다. 골렘 제작 체인 전체가 여기서 시작됩니다."
trTR = "Ölümlü kunduzlar burada golem gövdelerini, uzuvlarını ve başlarını döver, yanında da metal bloklar dökerler - bütün golem zincirinin başlangıcı."
esES = "Los castores mortales forjan aquí torsos, extremidades y cabezas de gólem, y funden bloques de metal a un lado: el inicio de toda la cadena de gólems."
itIT = "Qui i castori mortali forgiano i torsi, gli arti e le teste dei golem, e colano blocchi di metallo sul lato: è l'inizio dell'intera catena di produzione dei golem."
ukUA = "Смертні бобри кують тут торси, кінцівки та голови големів, а з боку відливають металеві блоки — початок усього ланцюга створення големів."
thTH = "มนุษย์บีเวอร์ที่ต้องตายได้ตีรูปร่างลำตัว แขนขา และหัวของโกเล็ม รวมถึงหล่อบล็อกโลหะที่ด้านข้าง ถือเป็นจุดเริ่มต้นของสายการผลิตโกเล็มทั้งหมด"
csCZ = "Smrtelní bobři zde kovou torza, končetiny a hlavy golemů a na boku odlévají kovové bloky – začátek celého řetězce výroby golemů."
viVN = "Hải ly phàm nhân rèn thân, tay chân và đầu golem tại đây, đồng thời đúc các khối kim loại ở bên cạnh - khởi đầu của toàn bộ chuỗi golem."
caES = "Els castors mortals forgen aquí els cossos, les extremitats i els caps dels golems, i fonen blocs de metall al costat: l'inici de tota la cadena de golems."
beBY = "Смертныя бабры куюць тут торсы, канечнасці і галовы галемаў, а з аднаго боку адліваюць металічныя блокі — пачатак усяго ланцуга галемаў."
roRO = "Muritorii muritori forjează aici torsurile, membrele și capetele golemilor și toarnă blocuri de metal pe lateral - începutul întregului lanț al golemilor."
huHU = "Halandó hódok itt öntik a golem törzsét, végtagjait és fejét, a másik oldalon pedig fémtömböket öntenek – ez az egész golemlánc kezdete."
arSA = "يقوم الفئران الفانون هنا بتشكيل أجزاء الجذع والأطراف والرؤوس الخاصة بالغولم، ويصبّون كتل المعادن على الجانب، وهي بداية سلسلة صناعة الغولم بأكملها."

