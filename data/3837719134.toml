["Building.Spiritveil.Scarecrow.FlavorDescription"]
status = "normal"
raw = "It never moves, and the crows never learn."
enUS = "It never moves, and the crows never learn."
zhCN = "它从不移动，乌鸦也从不学乖。"
zhTW = "它從不移動，烏鴉也永遠學不會。"
ruRU = "Оно никогда не двигается, а вороны так и не учатся."
jaJP = "それは決して動かず、カラスも決して学習しない。"
frFR = "Il ne bouge jamais, et les corbeaux n'apprennent jamais."
deDE = "Es bewegt sich nie, und die Krähen lernen nie dazu."
plPL = "Ona nigdy się nie rusza, a kruki nigdy się nie uczą."
ptBR = "Ele nunca se move, e os corvos nunca aprendem."
koKR = "그것은 결코 움직이지 않고, 까마귀들은 결코 배우지 않는다."
trTR = "Bu asla hareket etmez ve kargalar asla öğrenmez."
esES = "Nunca se mueve, y los cuervos nunca aprenden."
itIT = "Non si muove mai, e i corvi non imparano mai."
ukUA = "Воно ніколи не рухається, а ворони так і не навчаються."
thTH = "มันไม่เคยขยับ และเหล่ากาก็ไม่เคยเรียนรู้เลย"
csCZ = "Nikdy se nehne a vrány se nikdy nic nenaučí."
viVN = "Nó không bao giờ di chuyển, và lũ quạ cũng chẳng bao giờ học được gì."
caES = "Mai es mou, i els corbs mai aprenen."
beBY = "Ён ніколі не рухаецца, і вароны так і не вучацца."
roRO = "Nu se mișcă niciodată, iar corbii nu învață niciodată."
huHU = "Soha nem mozdul, a varjak pedig soha nem tanulnak."
arSA = "ذلك لا يتحرك أبدًا، والغربان لا تتعلم أبدًا."

