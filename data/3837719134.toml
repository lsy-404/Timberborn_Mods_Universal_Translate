["Building.Spiritveil.GoldenCoreCave.Description"]
status = "normal"
raw = "A secluded retreat. Meditate inside to slowly bank Golden Core progress. Advancing still takes 240 hours at the Meditation Seat and a Golden Core Elixir."
enUS = "A secluded retreat. Meditate inside to slowly bank Golden Core progress. Advancing still takes 240 hours at the Meditation Seat and a Golden Core Elixir."
zhCN = "一处幽静的修行之所。在其中打坐，可缓慢积累金丹进度。进阶仍需在冥想座上耗时240小时，并消耗一枚金丹丹药。"
zhTW = "隱密的靜修處。在內部冥想可以緩慢累積金丹進度。想要晉升仍需要在冥想座上耗時240小時，並使用一顆金丹丹藥。"
ruRU = "Уединённое убежище. Медитируйте внутри, чтобы постепенно накапливать прогресс Золотого ядра. Продвижение по-прежнему требует 240 часов на Медитационном сиденье и Эликсир Золотого ядра."
jaJP = "人里離れた隠れ家。内部で瞑想すると、金丹の進捗がゆっくりと蓄積される。それでも、瞑想座では240時間と金丹の霊薬が必要で、進階には変わりはない。"
frFR = "Une retraite isolée. Méditez à l'intérieur pour accumuler lentement la progression du Noyau d'or. Faire progresser encore prend 240 heures sur le Siège de méditation et un Élixir de Noyau d'or."
deDE = "Ein abgeschiedener Rückzugsort. Meditiere darin, um den Fortschritt zum Goldenen Kern langsam anzusammeln. Der Aufstieg erfordert weiterhin 240 Stunden am Meditationssitz und einen Elixier des Goldenen Kerns."
plPL = "Odosobniona kryjówka. Medytuj w środku, aby powoli zwiększać postęp Złotego Jądra. Przejście dalej nadal wymaga 240 godzin na Siedzisku Medytacji oraz Eliksiru Złotego Jądra."
ptBR = "Um retiro isolado. Medite lá dentro para acumular progresso do Núcleo Dourado aos poucos. Avançar ainda exige 240 horas no Assento de Meditação e um Elixir do Núcleo Dourado."
koKR = "은둔처다. 안에서 명상하면 금단(金丹) 진행도가 천천히 쌓인다. 다음 단계로 나아가려면 여전히 명상석에서 240시간과 금단 정제약이 필요하다."
trTR = "Sakin bir inziva yeri. Içeride meditasyon yaparak Altın Çekirdek ilerlemesini yavaş yavaş biriktir. Yine de ilerlemek için Meditasyon Koltuğu'nda 240 saat ve bir Altın Çekirdek İksiri gerekir."
esES = "Un retiro apartado. Medita en su interior para acumular lentamente el progreso del Núcleo Dorado. Avanzar aún requiere 240 horas en el Asiento de Meditación y un Elixir del Núcleo Dorado."
itIT = "Un ritiro appartato. Medita all'interno per accumulare lentamente progressi verso il Nucleo d'Oro. Il avanzamento richiede ancora 240 ore alla Sede di Meditazione e un Elisir del Nucleo d'Oro."
ukUA = "Усамітнене місце для усамітнення. Медитуйте всередині, щоб поступово нарощувати прогрес Золотого ядра. Для просування все одно потрібні 240 годин на Місці медитації та Еліксир Золотого ядра."
thTH = "ที่หลบภัยอันเงียบสงบ เข้าไปทำสมาธิภายในเพื่อสะสมความคืบหน้าของแก่นทองคำอย่างช้า ๆ การก้าวหน้าต่อไปยังคงต้องใช้เวลา 240 ชั่วโมงที่เก้าอี้สมาธิ และต้องมียาอมฤตแก่นทองคำหนึ่งขวด"
csCZ = "Osamělé útočiště. Meditací uvnitř pomalu zvyšuješ pokrok ke Zlatému jádru. Postup stále vyžaduje 240 hodin u Meditačního sedadla a Elixír zlatého jádra."
viVN = "Một nơi tu luyện thanh tịnh. Hãy thiền định bên trong để tích lũy tiến độ Kim Đan từ từ. Muốn tiến thêm vẫn cần 240 giờ tại Ghế Thiền và một Kim Đan Linh Dược."
caES = "Un retir apartat. Medita a l'interior per fer avançar a poc a poc el progrés del Nucli d'Or. Avançar encara requereix 240 hores al Seient de Meditació i un Elixir de Nucli d'Or."
beBY = "Ціхі куток для адасобленых мэдытацый. Медытуйце ўнутры, каб павольна набліжаць прагрэс Залатога ядра. Для прасоўвання па-ранейшаму спатрэбіцца 240 гадзін на месцы для медытацыі і Эліксір Залатога ядра."
roRO = "O retragere izolată. Meditează în interior pentru a acumula treptat progres spre Nucleul de Aur. Avansarea necesită în continuare 240 de ore la Scaunul de Meditație și un Elixir al Nucleului de Aur."
huHU = "Egy elzárt visszavonulóhely. Belül meditálva lassan gyarapíthatod az Aranymag fejlődését. A továbblépéshez továbbra is 240 óra kell a Meditációs Ülésen és egy Aranymag-elixír."
arSA = "مَخبأٌ منعزل. تأمّل داخله لتراكم تقدّم النواة الذهبية ببطء. ولا يزال التقدّم يستغرق 240 ساعة عند مقعد التأمل، إضافةً إلى إكسير النواة الذهبية."

