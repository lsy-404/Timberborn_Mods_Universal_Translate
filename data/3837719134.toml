roRO = "Formațiune gravată cu rune care protejează întreaga poartă. Odată construită: +5 puncte procentuale la fiecare breakthrough și +1% viteză de cultivare pe toată harta (aceeași clădire se numără o singură dată)."
huHU = "A rúnákkal faragott alakzat, amely az egész kaput védi. Megépítés után: minden áttörésnél +5 százalékpont, és térképszerte +1% kultiválási sebesség (ugyanaz az épület csak egyszer számít)."
arSA = "تشكيل منقوش بالرونات يحمي البوابة بأكملها. بعد البناء: +5 نقاط مئوية لكل الاختراقات و+1% لسرعة الزراعة على مستوى الخريطة (المبنى نفسه يُحتسب مرة واحدة فقط)."

