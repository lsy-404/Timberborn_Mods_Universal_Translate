ukUA = "Сенсорний камінь, який загоряється в ту мить, коли вода змінює колір. Вартовий водних шляхів."
thTH = "ก้อนหินตรวจจับที่จะเรืองแสงทันทีที่น้ำเปลี่ยนสี ผู้เฝ้ายามแห่งทางน้ำ"
csCZ = "Senzorový kámen, který se rozsvítí ve chvíli, kdy voda zkalí. Strážce vodních cest."
viVN = "Một viên đá cảm biến sẽ sáng lên ngay khi nước đổi màu. Là người canh gác của các dòng nước."
caES = "Una pedra sensora que s'il·lumina en el moment que l'aigua es descolora. La sentinella dels canals d'aigua."
beBY = "Камень-датчык, які загараецца ў той момант, калі вада мяняе колер. Вартавы водных шляхоў."
roRO = "O pietre de simțire care se aprinde în momentul în care apa își schimbă culoarea. Santinela căilor navigabile."
