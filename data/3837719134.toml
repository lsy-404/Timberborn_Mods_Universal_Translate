["Building.Spiritveil.DirtExcavator.Description"]
status = "normal"
raw = "Golem-driven, continuously extracting dirt for terrain work and the mud pit."
enUS = "Golem-driven, continuously extracting dirt for terrain work and the mud pit."
zhCN = "由傀儡驱动，持续挖掘泥土，用于地形工程和泥坑。"
zhTW = "由傀儡驅動，持續挖掘泥土，用於地形整理與泥坑。"
ruRU = "Управляется големом, непрерывно добывает грунт для работ с рельефом и грязевой ямы."
jaJP = "ゴーレムが動力となり、地形整備と泥だめのために土を絶えず掘り出し続ける。"
frFR = "Piloté par un golem, extrayant continuellement de la terre pour les travaux de terrain et la fosse à boue."
deDE = "Golem-betrieben, fördert kontinuierlich Erde für Geländearbeiten und die Schlammgrube."
plPL = "Napędzana przez golema, ciągle wydobywa ziemię do prac terenowych i do kopalni błota."
ptBR = "Movido a golem, escavando continuamente terra para trabalhos de terreno e para o poço de lama."
koKR = "골렘이 구동하며, 지형 작업과 진흙 구덩이를 위해 흙을 지속적으로 채굴한다."
trTR = "Golem gücüyle çalışan, arazi işleri ve çamur çukuru için sürekli olarak toprak kazar."
esES = "Impulsado por golems, extrae continuamente tierra para trabajos de terreno y para el pozo de barro."
itIT = "Azionata da golem, scava continuamente terra per i lavori sul terreno e per la fossa del fango."
ukUA = "Керований големом, безперервно видобуває ґрунт для роботи з рельєфом і багнюки."
thTH = "ขับเคลื่อนด้วยโกเลม ขุดดินอย่างต่อเนื่องเพื่อใช้ในงานปรับพื้นที่และบ่อโคลน"
csCZ = "Poháněno golemem, nepřetržitě těží hlínu pro terénní úpravy a bahenní jámu."
viVN = "Được điều khiển bởi người máy Golem, liên tục đào đất phục vụ công tác san địa hình và hố bùn."
caES = "Impulsat per un golem, extreu contínuament terra per a treballs de terreny i per al fangar."
beBY = "Працуе ад голема, бесперапынна здабывае зямлю для зямляных работ і гразявай ямы."
roRO = "Excavat de un golem, extrage continuu pământ pentru lucrările de teren și pentru groapa de noroi."
huHU = "Golemekkel hajtva, folyamatosan kitermelve a földet a terepmunkákhoz és a sárgödörhöz."
arSA = "يعمل بمحرك جولم، ويستخرج التربة باستمرار لأعمال تسوية الأرض وحفرة الطين."

["Building.Spiritveil.DirtExcavator.FlavorDescription"]
status = "normal"
raw = "Golems dig, and the spirit soil rises."
enUS = "Golems dig, and the spirit soil rises."
zhCN = "傀儡挖掘，灵土翻涌。"
zhTW = "傀儡挖掘，靈壤隨之翻湧。"
ruRU = "Големы копают, и поднимается духовная почва."
jaJP = "ゴーレムが掘り、霊土が湧き上がる。"
