frFR = "Assez petit pour passer inaperçu, assez obstiné pour garder les champs verts."
deDE = "Klein genug, um übersehen zu werden, und hartnäckig genug, um die Felder grün zu halten."
plPL = "Na tyle mały, że łatwo go przeoczyć, a na tyle uparty, że pola wciąż pozostają zielone."
