["Building.Spiritveil.BadwaterDome.FlavorDescription"]
status = "normal"
raw = "What is sealed below stays below."
enUS = "What is sealed below stays below."
zhCN = "在下方封印之物，永远留在下方。"
zhTW = "密封於下者，終將留於下。"
ruRU = "Что запечатано внизу, то внизу и остаётся."
jaJP = "封じられた下のものは、下に留まる。"
frFR = "Ce qui est scellé en dessous y reste."
deDE = "Was unten versiegelt ist, bleibt unten."
plPL = "Co zapieczętowane poniżej, pozostaje poniżej."
ptBR = "O que está selado abaixo permanece abaixo."
koKR = "아래에 봉인된 것은 아래에 머문다."
trTR = "Aşağıda mühürlenen şey aşağıda kalır."
esES = "Lo que queda sellado abajo, permanece abajo."
itIT = "Ciò che è sigillato sotto, rimane sotto."
ukUA = "Те, що запечатано внизу, там і залишиться."
thTH = "สิ่งที่ถูกผนึกไว้ข้างล่าง ย่อมคงอยู่ข้างล่างต่อไป"
csCZ = "Co je zapečetěno dole, zůstane dole."
viVN = "Những gì bị phong ấn dưới đáy sẽ mãi ở dưới đáy."
caES = "Què queda segellat sota, es queda sota."
beBY = "Тое, што запячатана ўнізе, застаецца ўнізе."
roRO = "Ce este sigilat dedesubt rămâne dedesubt."
huHU = "A lezárt, ami alul van, alul marad."
arSA = "ما يُختم في الأسفل يبقى في الأسفل."

["Building.Spiritveil.BadwaterPump.Description"]
status = "normal"
raw = "Draws immortal fluid out of the tainted aquifer. Golems only - the vapour poisons any mortal beaver who lingers."
enUS = "Draws immortal fluid out of the tainted aquifer. Golems only - the vapour poisons any mortal beaver who lingers."
zhCN = "抽取受污染地下水层中不死的流体。仅限傀儡使用：蒸气会毒害任何在附近逗留的凡俗海狸。"
zhTW = "抽取受污染地下水層中不朽的流體。僅限魔像使用，因為蒸氣會毒害任何在附近逗留的凡俗海狸。"
ruRU = "Выкачивает бессмертную жидкость из заражённого водоносного слоя. Только для големов: испарения ядовиты для любого смертного бобра, который задержится рядом."
jaJP = "ゴーレム専用。不死の流体を汚染された帯水層から汲み上げる。蒸気は、そこに留まる死すべきビーバーを毒する。"
frFR = "Puise un fluide immortel de l'aquifère corrompu. Réservé aux golems : la vapeur empoisonne tout béotien mortel qui s'attarde."
deDE = "Pumpt unsterbliche Flüssigkeit aus dem verseuchten Grundwasserleiter. Nur für Golems – der Dampf vergiftet jeden sterblichen Biber, der sich dort aufhält."
plPL = "Czerpie nieśmiertelny płyn ze skażonej warstwy wodonośnej. Tylko dla golemów – opary zatruwają każdego śmiertelnego bobra, który zbyt długo tu przebywa."
ptBR = "Extrai fluido imortal do aquífero contaminado. Apenas golems - o vapor envenena qualquer castor mortal que permanecer por perto."
koKR = "불멸의 유체를 오염된 대수층에서 끌어올린다. 골렘 전용 - 증기가 머무는 모든 필멸의 해리에게 독이 된다."
trTR = "Ölümsüz sıvıyı lekeli akiferden çeker. Yalnızca golemler için: buharı, oyalanan her fani kunduzu zehirler."
esES = "Extrae fluido inmortal del acuífero contaminado. Solo para gólems: el vapor envenena a cualquier castor mortal que se demore."
itIT = "Estrae il fluido immortale dalla falda acquifera contaminata. Solo per i golem: i vapori avvelenano qualsiasi beaver mortale che vi indugi."
ukUA = "Викачує безсмертну рідину із зараженого водоносного горизонту. Лише для големів: пара отруює будь-якого смертного бобра, який затримується поруч."
thTH = "ดูดของเหลวอมตะออกจากชั้นน้ำใต้ดินที่ปนเปื้อน ใช้ได้เฉพาะโกเลม เพราะไอพิษจะทำร้ายเหล่าบีเวอร์ที่ยังเป็นมนุษย์ซึ่งอยู่ใกล้เกินไป"
csCZ = "Čerpá nesmrtelnou tekutinu z zamořeného zdroje. Pouze pro golemy: výpary otrávou každého smrtelného bobra, který se zdrží."
viVN = "Hút chất lỏng bất tử từ tầng nước ngầm bị ô nhiễm. Chỉ dành cho Golem - hơi độc sẽ làm hại bất kỳ hải ly phàm trần nào nán lại quá lâu."
caES = "Extreu fluid immortal de l'aqüífer contaminat. Només per a gòlems: el vapor enverina qualsevol castor mortal que s'hi quedi."
beBY = "Здабывае несмяротную вадкасць з забруджанага ваданосу. Толькі для галемаў: пара атручвае любога смяротнага бабра, які затрымаецца побач."
roRO = "Extrage fluidul nemuritor din acviferul contaminat. Doar golemii – vaporii otrăvesc orice castor muritor care zăbovește."
huHU = "A halhatatlan folyadékot a szennyezett vízrétegből szivattyúzza ki. Csak gólemeknek – a gőz minden halandó hódot megmérgez, aki túl sokáig marad itt."
arSA = "يستخرج سائلًا خالدًا من الطبقة المائية الملوثة. للغوليم فقط، فالأبخرة تسمم أي قندس فانٍ يبقى قريبًا منها."

