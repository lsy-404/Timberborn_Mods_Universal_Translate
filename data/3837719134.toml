["Good.CleansingPill.Description"]
status = "abandoned"
raw = "An old purifying recipe long gone flat. Tastes bitter now; disciples eat it as a filling ration."
enUS = "An old purifying recipe, long gone flat. It tastes bitter now, so disciples eat it as a filling ration."
zhCN = "古老的净化丹方早已失去效力。如今味道苦涩，弟子们只把它当作充饥的口粮吃。"
zhTW = "舊式淨化丹方早已失去效力，口感發苦。如今弟子們只把它當作填飽肚子的口糧來吃。"
ruRU = "Древний рецепт очищающей пилюли, давно утративший силу. Теперь на вкус горький; ученики едят её как сытный паёк."
jaJP = "古い浄化の丸薬の製法で、とうに効力が失われている。今は苦味があり、弟子たちは腹持ちのよい食糧として食べている。"
frFR = "Une ancienne recette purifiante, depuis longtemps éventée. Elle a maintenant un goût amer ; les disciples la mangent comme ration de remplissage."
deDE = "Ein altes Reinigungsrezept, das längst schal geworden ist. Es schmeckt inzwischen bitter; die Jünger essen es als sättigende Notration."
plPL = "Stary przepis na oczyszczający eliksir, dawno już stracił moc. Teraz smakuje gorzko, ale uczniowie jedzą go jako sycącą rację żywnościową."
ptBR = "Uma antiga receita purificadora há muito perdeu o gás. Agora tem gosto amargo; os discípulos a comem como uma ração que enche a barriga."
koKR = "오래된 정화 비법이라 맛이 밋밋해진 지 오래다. 지금은 쓴맛만 남았고, 제자들이 배를 채우는 식량으로 먹는다."
trTR = "Eski bir arındırma tarifi, uzun zaman önce tadı kaçmış. Şimdi acı bir tadı var; müritler bunu doyurucu bir erzak olarak yiyor."
esES = "Una antigua receta purificadora que hace tiempo perdió su efervescencia. Ahora sabe amarga; los discípulos la comen como ración de relleno."
itIT = "Un'antica ricetta purificante, ormai da tempo svanita. Ha un sapore amaro; i discepoli la mangiano come razione di riempimento."
ukUA = "Старий очисний рецепт, який давно втратив силу. Тепер на смак гіркий; учні їдять його як ситну пайку."
thTH = "ตำรายาชำระล้างโบราณที่ไม่มีรสชาติแล้ว ตอนนี้มีรสขม บรรดาศิษย์จึงกินมันเป็นอาหารประทังชีวิต"
csCZ = "Starý čisticí recept, který už dávno vyprchal. Teď chutná hořce; učedníci ho jedí jako výdatnou potravu."
viVN = "Một công thức thanh tẩy cổ xưa đã mất hết khí vị. Giờ nếm vào đắng chát; các đệ tử vẫn ăn nó như một khẩu phần no bụng."
caES = "Una antiga recepta purificadora fa temps que s'ha desgasificat. Ara té gust amargant; els deixebles la mengen com a ració que omple."
beBY = "Старажытны рэцэпт ачышчальнай пілюлі, які даўно страціў сілу. Цяпер горкі на смак, і вучні ядуць яго як сытны паёк."
roRO = "O rețetă veche de purificare, demult fără gust. Acum are gust amar; discipolii o mănâncă drept rație de umplutură."
huHU = "Egy régi tisztító recept, amely már régen elvesztette hatását. Mostanra keserű az íze; a tanítványok töltő élelmiszerként eszik."
arSA = "هذه وصفة تنقية قديمة فقدت فعاليتها منذ زمن بعيد. طعمها مر الآن، ويأكلها التلاميذ بوصفها حصة طعام تُشبع الجوع."

