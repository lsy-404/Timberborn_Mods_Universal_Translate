plPL = "Figura strażnicza, która odstrasza ptaki i bestie i chroni plony sezonu."
ptBR = "Um efígie guardiã que espanta pássaros e feras e mantém a colheita da estação segura."
koKR = "허수아비 모양의 수호 인형으로, 새와 짐승을 쫓아내고 계절의 수확물을 지켜 줍니다."
