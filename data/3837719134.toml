viVN = "Hãy dâng nó tại Đại Sảnh Tông Môn để tăng sức chứa vận chuyển cho toàn tộc; đồng thời đây cũng là nguyên liệu cho Trận Pháp Tông Môn."
caES = "Ofereix-lo al Saló de la Secta per augmentar la capacitat de càrrega de tot el clan; també és un material per a la Formació de la Secta."
beBY = "Прапануйце яго ў Залі секты, каб павялічыць грузападымальнасць для ўсяго клана; таксама гэта матэрыял для Масіва секты."
roRO = "Oferiți-l la Sala Sectei pentru a spori capacitatea de transport a întregului clan; este, de asemenea, un material pentru Matricea Sectei."
huHU = "Ajánld fel a Szektacsarnokban, hogy az egész klán szállítókapacitása nőjön; emellett a Szektatömb egyik anyaga."
