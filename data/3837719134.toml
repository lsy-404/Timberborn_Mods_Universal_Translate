["Building.Spiritveil.ScriptureHall.Description"]
status = "normal"
raw = "Shelf after shelf of dao texts. Once built: +5 percentage points to every breakthrough and +1% cultivation speed map-wide (counts once). Meditate inside to slowly bank Golden Core progress."
enUS = "Shelf after shelf of dao texts. Once built: +5 percentage points to every breakthrough and +1% cultivation speed map-wide (counts once). Meditate inside to slowly bank Golden Core progress."
zhCN = "书架一排排摆满道经。建成后：全图所有突破率+5个百分点，全图修炼速度+1%（仅计一次）。在内打坐可缓慢积累金丹进度。"
zhTW = "書架一排接一排，盡是道經。建成後：全圖每項突破 +5 個百分點，全圖修煉速度 +1%（僅計一次）。在內打坐冥想，可緩慢累積金丹進度。"
ruRU = "Ряды полок с текстами дао. После постройки: +5 процентных пунктов к каждому прорыву и +1% к скорости культивации по всей карте (учитывается один раз). Медитируйте внутри, чтобы медленно накапливать прогресс Золотого ядра."
jaJP = "棚に並んだ道典の山。建設後：全ての突破確率+5パーセントポイント、マップ全体の修練速度+1%（効果は1回のみ適用）。内部で瞑想すると、金丹の進捗をゆっくり蓄積できる。"
frFR = "Des rayons et des rayons de textes dao. Une fois construit : +5 points de pourcentage à chaque percée et +1 % de vitesse de cultivation sur toute la carte (ne compte qu'une fois). Méditez à l'intérieur pour accumuler lentement de la progression du Noyau d'or."
deDE = "Regale mit Dao-Texten, Stock um Stock. Einmal gebaut: +5 Prozentpunkte auf alle Durchbrüche und +1 % Kultivierungsgeschwindigkeit auf der gesamten Karte (zählt nur einmal). Im Inneren meditieren, um langsam Fortschritt für den Goldenen Kern anzusammeln."
plPL = "Całe półki z tekstami dao. Po wybudowaniu: +5 punktów procentowych do każdego przełomu i +1% prędkości kultywacji na całej mapie (liczy się jednorazowo). Medytuj wewnątrz, aby powoli gromadzić postęp Złotego Jądra."
ptBR = "Prateleira após prateleira de textos dao. Depois de construído: +5 pontos percentuais em todos os avanços e +1% de velocidade de cultivo em todo o mapa (não se acumula). Medite dentro dele para acumular lentamente progresso no Núcleo Dourado."
koKR = "도서 선반이 줄지어 늘어선 도(道) 경전 보관소. 건설되면 모든 돌파 성공 확률이 5%p 증가하고, 맵 전체의 수련 속도가 1% 증가합니다(중복 적용되지 않음). 안에서 명상하면 금단(金丹) 진척도가 천천히 쌓입니다."
trTR = "Dao metinlerinden oluşan raf raf kitaplıklar. Kurulduktan sonra: her terkiyeye (breakthrough) +5 yüzde puan ve tüm harita genelinde +%1 kültivasyon hızı sağlar (bu bonus yalnızca bir kez sayılır). İçinde meditasyon yaparak Altın Çekirdek ilerlemesini yavaş yavaş biriktirirsin."
esES = "Estantería tras estantería de textos dao. Una vez construido: +5 puntos porcentuales a cada avance y +1 % de velocidad de cultivo en todo el mapa (solo cuenta una vez). Medita en su interior para acumular lentamente progreso hacia el Núcleo Dorado."
itIT = "Scaffali su scaffali di testi dao. Una volta costruito: +5 punti percentuali a ogni svolta e +1% di velocità di coltivazione su tutta la mappa (si applica una sola volta). Medita al suo interno per accumulare lentamente progresso verso il Nucleo d'Oro."
ukUA = "Полиці з текстами дао, одна за одною. Після будівництва: +5 процентних пунктів до кожного прориву та +1% до швидкості культивації на всій карті (враховується один раз). Медитуйте всередині, щоб повільно накопичувати прогрес Золотого ядра."
thTH = "ชั้นหนังสือวางเรียงกันเป็นแถว เต็มไปด้วยคัมภีร์เต๋า เมื่อสร้างเสร็จ: เพิ่มโอกาสสำเร็จการทะลวงทุกขั้น +5 เปอร์เซ็นต์ และเพิ่มความเร็วการบ่มเพาะ +1% ทั่วทั้งแผนที่ (นับเพียงครั้งเดียว) นั่งสมาธิภายในเพื่อค่อยๆ สะสมความคืบหน้าของแก่นทองคำ"
csCZ = "Regály s dao texty, jeden za druhým. Po postavení: +5 procentních bodů ke každému průlomu a +1 % rychlosti kultivace na celé mapě (počítá se jednou). Uvnitř meditujte, čímž se pomalu připisuje pokrok Zlatého jádra."
viVN = "Hàng kệ này chứa đầy kinh sách đạo pháp. Sau khi xây xong: +5 điểm phần trăm cho mọi đột phá và +1% tốc độ tu luyện trên toàn bản đồ (chỉ tính một lần). Ở bên trong, hãy thiền định để tích lũy tiến độ Kim Đan một cách chậm rãi."
caES = "Prestatges i més prestatges de textos dao. Una vegada construït: +5 punts percentuals a totes les avanços de trencament i +1% de velocitat de cultiu a tot el mapa (es compta una sola vegada). Medita a l'interior per acumular lentament progrés del Nucli d'Or."
beBY = "Паліцы з дао-тэкстамі адна за адной. Пасля будаўніцтва: +5 працэнтных пунктаў да кожнага прарыву і +1% да хуткасці культывацыі на ўсёй карце (улічваецца аднойчы). Медытуйце ўнутры, каб паступова назапашваць прагрэс Залатога ядра."
roRO = "Rafturi după rafturi cu texte dao. Odată construită: +5 puncte procentuale la fiecare descoperire și +1% viteză de cultivare pe întreaga hartă (se aplică o singură dată). Meditează în interior pentru a acumula treptat progres către Nucleul de Aur."
huHU = "Polcok sorai dao-szövegekkel. Felépítése után: minden áttörésnél +5 százalékpont, és térképszerte +1% kultiválási sebesség (egyszer számít). Bent meditálva lassan felhalmozható az Arany Mag fejlődése."
arSA = "رفوف تلو رفوف من نصوص الدao. بعد البناء: +5 نقاط مئوية لكل اختراق و+1% سرعة زراعة على مستوى الخريطة كاملةً (يُحتسب مرة واحدة). تأمّل داخله لتراكم تقدّم النواة الذهبية ببطء."

