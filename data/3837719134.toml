itIT = "Piantata su acqua ferma, raccolta da mani sicure."
ukUA = "Посаджено на нерухомій воді, зібрано твердими руками."
thTH = "ปลูกบนผืนน้ำนิ่ง เก็บเกี่ยวด้วยมือที่มั่นคง"
csCZ = "Zasazeno na klidné vodě, sklizeno pevnýma rukama."
viVN = "Được gieo trên mặt nước tĩnh lặng, thu hoạch bởi đôi tay vững vàng."
caES = "Plantat en aigua quieta, collit per mans constants."
beBY = "Пасаджана на нерухомай вадзе, сабрана ўпэўненымі рукамі."
roRO = "Plantat pe apă liniștită, recoltat de mâini stabile."
huHU = "Nyugodt vízen ültetve, gondos kezek aratják."
arSA = "زُرعت على ماءٍ ساكن، وحُصدت بأيدٍ ثابتة."

["Building.Spiritveil.AquiferDrill.Description"]
status = "normal"
raw = "Bores down into the deep aquifer to raise a buried spirit spring - a steady nerve when the surface runs dry."
enUS = "Drills deep into the aquifer to raise a buried spirit spring, a steady source of water when the surface runs dry."
zhCN = "向深层含水层钻探，唤出埋藏的灵泉——地表干涸时，它是你稳定的依靠。"
zhTW = "鑽入深層含水層，喚出埋藏的靈泉——當地表乾涸時，它能穩定供水，令人安心。"
ruRU = "Бурит вглубь глубокого водоносного слоя, чтобы поднять погребённый духовный источник, — надёжная опора, когда поверхность пересыхает."
jaJP = "地表が干上がったときも安定して力を発揮する、地下深くの帯水層まで掘り進み、埋もれた霊泉を湧き上がらせる。"
frFR = "Fore jusqu'à l'aquifère profond pour faire jaillir une source spirituelle enfouie : un apport d'eau constant lorsque la surface s'assèche."
deDE = "Bohrt tief in den Tiefenaquifer, um eine verborgene Geistquelle emporzuholen – ein beständiger Nerv, wenn die Oberfläche austrocknet."
plPL = "Wierci w głąb głębokiego wodonośnika, by wydobyć na powierzchnię ukrytą duchową źródlaną wodę — pewny filar, gdy powierzchnia wysycha."
ptBR = "Perfura o aquífero profundo para trazer à superfície uma nascente espiritual enterrada, garantindo um fluxo constante quando a superfície secar."
koKR = "지하 깊은 대수층까지 굴착해 잠들어 있던 영천(靈泉)을 끌어올리는 장치입니다. 지표면의 물이 말라 버릴 때도 안정적으로 물을 공급해 줍니다."
trTR = "Derin akiferlere iner ve yüzey kurumuşken istikrarlı bir kaynak sağlayan gömülü bir ruh pınarını yükseltir."
esES = "Perfora el acuífero profundo para elevar un manantial espiritual enterrado: un recurso constante cuando la superficie se seca."
itIT = "Scava in profondità nella falda acquifera profonda per far salire una sorgente spirituale sepolta: una risorsa costante quando la superficie si secca."
ukUA = "Свердлить глибокий водоносний горизонт, щоб підняти прихований духовний джерельний потік — надійне джерело води, коли поверхня пересихає."
thTH = "เจาะลึกลงไปในชั้นน้ำใต้ดินลึก เพื่อปลุกน้ำพุวิญญาณที่ถูกฝังไว้ให้ไหลขึ้นมา เป็นที่พึ่งอันมั่นคงเมื่อพื้นผิวแห้งแล้ง"
csCZ = "Vrtá do hlubokého podzemního zdroje, aby na povrch vynesla zakopaný duchovní pramen – spolehlivá opora, když povrch vyschne."
viVN = "Khoan sâu xuống tầng nước ngầm để đưa một mạch suối linh khí chôn dưới đất lên mặt, giữ cho nguồn nước ổn định khi mặt đất khô cạn."
caES = "Perfora l'aqüífer profund per fer brollar una font d'esperit enterrada: un recurs constant quan la superfície s'asseca."
beBY = "Свідравысвідрысвідравы"
roRO = "Forează în acviferul adânc pentru a ridica un izvor spiritual îngropat, o sursă constantă de apă atunci când suprafața rămâne uscată."
huHU = "A mélyvízi rétegbe fúrva egy elrejtett szellemforrást old fel – folyamatos biztonságot nyújt akkor is, amikor a felszín kiszárad."
arSA = "يحفر هذا البناء بعمق في طبقة المياه الجوفية العميقة ليرفع نبع روحي مدفون، فيكون مصدرًا ثابتًا للمياه حين يجفّ السطح."

