deDE = "Biete es in der Sektenhalle an, um die Tragfähigkeit im gesamten Clan zu erhöhen; außerdem ist es ein Material für das Sektenarray."
plPL = "Złóż ją w Sali Sekty, aby zwiększyć udźwig całego klanu; jest też materiałem dla Szyku Sekty."
ptBR = "Ofereça-o no Salão da Seita para aumentar a capacidade de carga de todo o clã; também é um material para a Formação da Seita."
koKR = "씨족 전체의 운반 용량을 높이기 위해 종문 전당에 바치십시오. 또한 종문 진법의 재료이기도 합니다."
