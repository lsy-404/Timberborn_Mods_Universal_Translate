["Good.SpiritSword.Description"]
status = "normal"
raw = "Offer it at the Sect Hall for faster work across the clan; also builds the Ascension Altar and the Sect Array."
enUS = "Offer it at the Sect Hall for faster work across the clan; also builds the Ascension Altar and the Sect Array."
zhCN = "在宗门大殿供奉此物，可加快全宗门的工作效率；同时还可建造飞升祭坛与宗门大阵。"
zhTW = "在宗門大殿供奉它，可加快全宗門的工作速度；同時也能建造飛升祭壇與宗門大陣。"
ruRU = "Предложите его в Зале секты для более быстрой работы всего клана; также строит Алтарь вознесения и Сектный массив."
jaJP = "神剣を宗門ホールに供えると、一族全体の作業が速くなります。また、昇天祭壇と宗門陣も建設できます。"
frFR = "Proposez-la au Hall de la Secte pour un travail plus rapide dans tout le clan ; elle permet aussi de construire l'Autel de l'Ascension et le Réseau de la Secte."
deDE = "Biete es in der Sektenhalle an, damit die Arbeit im gesamten Klan schneller vorangeht; außerdem werden der Aufstiegsaltar und die Sektenformation errichtet."
plPL = "Złóż ofertę w Sali Sekty, aby przyspieszyć pracę w całym klanie; buduje także Ołtarz Wniebowstąpienia oraz Szyk Sekty."
ptBR = "Ofereça-a no Salão da Seita para um trabalho mais rápido em todo o clã; também constrói o Altar da Ascensão e a Formação da Seita."
koKR = "문파 회관에 바치면 문파 전체의 작업 속도가 빨라진다. 또한 승천 제단과 문파 진법도 건설할 수 있다."
trTR = "Bunu Tarikat Salonu'nda sunun; klan genelinde işler daha hızlı ilerler. Ayrıca Yükseliş Sunağı ve Tarikat Dizisi'ni de inşa eder."
esES = "Ofrécelo en el Salón de la Secta para acelerar el trabajo en todo el clan; también construye el Altar de la Ascensión y el Arreglo de la Secta."
itIT = "Offrila alla Sala della Setta per un lavoro più rapido in tutto il clan; serve anche a costruire l'Altare dell'Ascensione e la Schiera della Setta."
ukUA = "Запропонуйте його в Залі секти для швидшої роботи по всьому клану; також будує Вівтар Вознесіння та Строй Секти."
thTH = "ถวายที่ห้องโถงสำนัก เพื่อให้งานทั่วทั้งตระกูลดำเนินเร็วขึ้น และยังใช้สร้างแท่นบูชาการขึ้นสวรรค์กับค่ายจัตุรัสสำนักด้วย"
csCZ = "Nabídněte jej v Sektovní síni pro rychlejší práci v celém klanu; také staví Oltář vzestupu a Sektovní pole."
viVN = "Hãy dâng nó tại Sảnh Tông Môn để công việc trong toàn tộc nhanh hơn; đồng thời cũng xây Tế Đàn Phi Thăng và Trận Pháp Tông Môn."
caES = "Ofereixi-la a la Sala de la Secta per accelerar el treball a tot el clan; també construeix l'Altar de l'Ascensió i la Formació de la Secta."
beBY = "Прапануйце гэта ў Залі секты для больш хуткай працы па ўсім клане; таксама будуе Алтар Узнясення і Сектавы Масіў."
roRO = "Oferiți-l la Sala Sectei pentru o muncă mai rapidă în întregul clan; construiește, de asemenea, Altarul Ascensiunii și Matricea Sectei."
huHU = "Ajánld fel a Szekta Csarnokban, hogy gyorsabb legyen a munka az egész klánban; emellett az Emelkedési Oltárt és a Szekta Tömböt is építi."
arSA = "أقدِّمه في قاعة الطائفة لتسريع العمل في جميع أنحاء العشيرة؛ كما يُستخدم أيضًا في بناء مذبح الصعود ومصفوفة الطائفة."

