["Building.Spiritveil.ResourceCounter.Description"]
status = "normal"
raw = "A board hung where everyone can see it: what is on hand, what is short, and what to fetch next."
enUS = "A board hung where everyone can see it: what is on hand, what is short, and what to fetch next."
