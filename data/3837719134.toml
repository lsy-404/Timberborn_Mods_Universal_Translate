["Building.Spiritveil.Beehive.Description"]
status = "normal"
raw = "Home to spirit bees. Their honey is prized both in elixirs and at the guest table."
enUS = "Home to spirit bees. Their honey is prized both in elixirs and at the guest table."
zhCN = "家园为灵蜂之所。其蜂蜜既可入丹炼药，又是宾客席上的珍品。"
zhTW = "家園是靈蜂的居所。牠們的蜂蜜既被珍視於丹藥之中，也常見於貴客的餐桌上。"
ruRU = "Обитель духовных пчёл. Их мёд ценится как в эликсирах, так и на столе для почётных гостей."
jaJP = "精霊の蜂が暮らす場所。その蜂蜜は霊薬として、また客人の食卓でも珍重される。"
frFR = "Abeilles spirituelles. Leur miel est très prisé, aussi bien dans les élixirs qu'à la table des invités."
deDE = "Heimat der Geisterbienen. Ihr Honig ist sowohl in Elixieren als auch an der Tafel der Gäste sehr geschätzt."
plPL = "Dom duchów pszczół. Ich miód ceniony jest zarówno w eliksirach, jak i przy stole dla gości."
ptBR = "Lar de abelhas espirituais. Seu mel é valorizado tanto em elixires quanto na mesa de hóspedes."
koKR = "영혼 벌이 사는 곳. 이들의 꿀은 영약의 재료로도, 손님 식탁에서도 귀하게 여겨진다."
trTR = "Ruhani arılara ev sahipliği yapar. Balları, iksirlerde ve misafir sofralarında çok değer görür."
esES = "Hogar de abejas espirituales. Su miel es muy apreciada tanto en elixires como en la mesa de los invitados."
itIT = "Dimora di api spirituali. Il loro miele è apprezzato sia negli elisir sia alla tavola degli ospiti."
ukUA = "Дім для духовних бджіл. Їхній мед цінують як для еліксирів, так і за гостьовим столом."
thTH = "บ้านของผึ้งวิญญาณ น้ำผึ้งของมันเป็นที่ต้องการทั้งในยาอายุวัฒนะและบนโต๊ะรับแขก"
csCZ = "Domov duchovních včel. Jejich med je ceněn jak v elixírech, tak u hostitelského stolu."
viVN = "Nơi ở của những con ong linh thiêng. Mật của chúng được quý trọng cả trong đan dược lẫn trên bàn tiệc khách quý."
caES = "Casa d'abelles espirituals. La seva mel és molt apreciada tant en elixirs com a la taula dels convidats."
beBY = "Тут жывуць духоўныя пчолы. Іх мёд цэніцца і ў эліксірах, і за гасцінным сталом."
roRO = "Adăpost pentru albinele spirituale. Mierea lor este apreciată atât în elixire, cât și la masa oaspeților."
huHU = "Szellemméhek otthona. Mézüket elixírekben és a vendégasztalnál egyaránt nagyra becsülik."
arSA = "مأوى لنحل الأرواح. يُعدّ عسلها ثميناً في الإكسيرات وعلى مائدة الضيوف."

