["Building.Spiritveil.DistrictCenter.Description"]
status = "normal"
raw = "The sect hall. Council business, artifact offerings and the scripture archive all happen here - the heart and the face of the clan."
enUS = "The sect hall. Council business, artifact offerings and the scripture archive all happen here - the heart and the face of the clan."
zhCN = "宗门大殿。议事、供奉法器与典籍藏阁皆在此处进行，它既是宗门的核心，也是宗门的门面。"
zhTW = "宗門大殿。議事、靈器供奉與經典藏閣皆在此處進行，是宗族的核心，也是宗族的門面。"
ruRU = "Зал секты. Здесь проходят советы, подношения артефактов и хранится архив писаний — сердце и лицо клана."
