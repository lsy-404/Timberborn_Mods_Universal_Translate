caES = "Un petit tauler que mostra d'un cop d'ull els nivells d'aigua i les existències, perquè no cal que retinguis res de memòria."
beBY = "Невялікая табліца, якая паказвае ўзроўні вады і запасы ў адным погляду, каб нічога не трэба было трымаць у галаве."
