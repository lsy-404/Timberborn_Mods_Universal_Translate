roRO = "Cuplează sau decuplează fiecare atelier de la transmisie. O singură manetă mută întreaga montană."
huHU = "Összekapcsolja vagy szétválasztja a műhelyeket a hajtóműtől. Egyetlen kar az egész hegyet mozgatja."
