huHU = "Minden lerakott deszka a szekta alapja."
arSA = "كل لوح يُوضع هو أساس للطائفة."

["Building.Spiritveil.IronGolemForge.Description"]
status = "normal"
raw = "The immortal-grade upgrade of the artifact workshop. Golems forge spirit swords, shields and talismans for offerings, for the Ascension Altar and for the Sect Array."
enUS = "The immortal-grade upgrade of the artifact workshop. Golems forge spirit swords, shields and talismans for offerings, for the Ascension Altar and for the Sect Array."
zhCN = "不朽品阶的法器工坊升级。傀儡锻造灵剑、灵盾与护符，用于供奉、飞升祭坛和宗门阵法。"
zhTW = "不朽階的法器工坊升級。魔像會鍛造靈劍、盾牌與符籙，用於供品、飛升祭壇與宗門陣法。"
ruRU = "Улучшение мастерской артефактов до бессмертного уровня. Големы выковывают духовные мечи, щиты и талисманы для подношений, для Алтаря Вознесения и для Построения Секты."
jaJP = "神器工房の不死級アップグレードです。ゴーレムが霊剣、盾、護符を鍛造し、供物、昇天の祭壇、宗門の陣のために用いられます。"
frFR = "L'amélioration de rang immortel de l'atelier d'artefacts. Les golems forgent des épées spirituelles, des boucliers et des talismans pour les offrandes, pour l'Autel de l'Ascension et pour le Réseau de formation de la Secte."
deDE = "Die Upgrade-Stufe der Artefaktwerkstatt im Rang der Unsterblichen. Golems schmieden Geistschwerter, Schilde und Talismane für Opfergaben, für den Aufstiegsaltar und für die Sektenformation."
plPL = "Ulepszenie rangi nieśmiertelności warsztatu artefaktów. Golemy kują miecze duchowe, tarcze i talizmany na ofiary, dla Ołtarza Wniebowstąpienia oraz dla Szyku Sekty."
ptBR = "O upgrade de nível imortal da oficina de artefatos. Golems forjam espadas espirituais, escudos e talismãs para oferendas, para o Altar da Ascensão e para a Formação da Seita."
koKR = "불멸 등급의 법기 공방 업그레이드입니다. 골렘이 제물, 승천 제단, 그리고 종문 진법을 위해 영검(靈劍), 방패, 부적을 단조합니다."
trTR = "Artifact atölyesinin ölümsüz seviyesindeki yükseltmesi. Golemler, sunular, Yükseliş Sunağı ve Tarikat Dizisi için ruhsal kılıçlar, kalkanlar ve tılsımlar döker."
esES = "La versión de grado inmortal del taller de artefactos. Los gólems forjan espadas espirituales, escudos y talismanes para las ofrendas, para el Altar de la Ascensión y para la Formación de la Secta."
itIT = "L'aggiornamento di grado immortale dell'officina degli artefatti. I golem forgiano spade spirituali, scudi e talismani per le offerte, per l'Altare dell'Ascensione e per la Schiera della Setta."
ukUA = "Вдосконалення артефакторної майстерні до рівня безсмертних. Големи кують духовні мечі, щити та талісмани для підношень, для Вівтаря Вознесіння та для Бойового строю секти."
thTH = "การอัปเกรดระดับอมตะของโรงช่างเครื่องวิเศษ โกเลมตีดาบวิญญาณ โล่ และเครื่องรางสำหรับเครื่องบูชา สำหรับแท่นบูชาการเลื่อนขั้น และสำหรับค่ายกลของสำนัก"
csCZ = "Vylepšení na úrovni nesmrtelnosti pro dílnu artefaktů. Golemové kují duchovní meče, štíty a talismany pro obětiny, pro Oltář vzestupu a pro Formaci sekty."
viVN = "Xưởng pháp khí phiên bản Bất Tử của xưởng chế tác pháp khí. Người máy rèn kiếm linh, khiên và bùa chú để dâng cúng, cho Đàn Phi Thăng và cho Trận Pháp Tông Môn."
caES = "L'actualització de grau immortal del taller d'artefactes. Els gòlems forgen espases espirituals, escuts i talismans per a les ofrenes, per a l'Altar de l'Ascensió i per a la Formació de la Secta."
beBY = "Вытворчасць артэфактаў унесці ў вышэйшую ступень сілы: Големы куюць духоўныя мячы, шчыты і талісманы для ахвяраванняў, Алтара Ўзнясення і Бар'еру Секты."
roRO = "Upgrade de rang nemuritor al atelierului de artefacte. Golemii făuresc săbii spirituale, scuturi și talismane pentru ofrande, pentru Altarul Ascensiunii și pentru Formația Sectei."
huHU = "A halhatatlan fokozatú upgrade az artefaktum-műhelyhez. A golemek lélekkardokat, pajzsokat és talizmánokat kovácsolnak az áldozati felajánlásokhoz, az Emelkedési Oltárhoz és a Szekta Formációjához."
arSA = "وَرشة تحسين الأثر الخالد للأدوات السحرية. تصنع الأجسام الحجرية سيوفًا روحية ودروعًا وتعاويذ من أجل القرابين، ومن أجل مذبح الصعود، ومن أجل مصفوفة الطائفة."

