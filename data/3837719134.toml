["Building.Spiritveil.DoubleLodge.Description"]
status = "normal"
raw = "A breezy two-family lodge, cool and airy - the best bunk in the sect on a summer night."
enUS = "A breezy two-family lodge, cool and airy - the best bunk in the sect on a summer night."
zhCN = "这是一座清风习习的双户木屋，凉爽通透，是夏夜里宗门中最惬意的床铺。"
zhTW = "兩戶共住的小木屋通風涼爽，是夏夜裡宗門中最舒適的床位。"
ruRU = "Просторный двухсемейный домик, продуваемый ветерком и свежий, — лучшая койка в секте летней ночью."
jaJP = "風通しの良い二世帯用の山小屋で、涼やかで居心地がよい。夏の夜には、宗門で一番の寝床だ。"
frFR = "Un pavillon aéré pour deux familles, frais et spacieux : la meilleure couchette de la secte lors d'une nuit d'été."
deDE = "Eine luftige Doppelhütte für zwei Familien, kühl und durchlüftet – das beste Stockbett der Sekte in einer Sommernacht."
plPL = "Przewiewny dom na dwie rodziny, chłodny i przestronny – najlepsze legowisko w sekcie w letnią noc."
ptBR = "Um alojamento arejado para duas famílias, fresco e ventilado - a melhor cama da seita numa noite de verão."
koKR = "여름밤에 가장 시원한 침대, 통풍이 잘 되는 2가구용 숙소. 바람이 솔솔 불어 쾌적하기로는 이 종파에서 최고의 잠자리다."
trTR = "Esintili iki aileli bir kulübe; serin ve ferah. Yaz gecesinde sektedeki en iyi yatak."
esES = "Una cabaña ligera para dos familias, fresca y aireada: la mejor litera de la secta en una noche de verano."
itIT = "Un rifugio arioso per due famiglie, fresco e ventilato: la cuccetta migliore della setta in una notte d'estate."
ukUA = "Просторий двоквартирний будиночок, прохолодний і провітрюваний — найкраще ліжко в секті влітку вночі."
thTH = "เรือนพักสองครอบครัวที่โปร่งโล่งและเย็นสบาย เป็นที่นอนที่ดีที่สุดในนิกายยามค่ำคืนฤดูร้อน"
csCZ = "Větrný dvoupatrový přístřešek, chladný a vzdušný – nejlepší lůžko v sektě za letní noci."
viVN = "Nhà nghỉ đôi thoáng mát, có gió nhẹ luồn qua, là chỗ ngủ tuyệt nhất trong tông môn vào đêm hè."
caES = "Un alberg ventilat per a dues famílies, fresc i aireat: el millor llit de la secta en una nit d'estiu."
beBY = "Прасторны двухсямейны дом, прахалодны і паветраны — лепшае ложак у секце летняй ноччу."
roRO = "O colibă pentru două familii, răcoroasă și bătută de adieri – cel mai bun pat din clan într-o noapte de vară."
huHU = "Egy szellős, kétcsaládos szállás, hűvös és levegős – a legjobb fekvőhely a szekta tagjainak egy nyári éjszakán."
arSA = "ملجأ مزدوج نسيمي وبارد ومنعش، وهو أفضل سرير في الطائفة ليلة صيفية."

