jaJP = "静水に植え、穏やかな手で収穫する。"
frFR = "Planté sur une eau calme, récolté par des mains stables."
deDE = "Auf stillem Wasser gepflanzt, von ruhigen Händen geerntet."
plPL = "Sadzone na spokojnej wodzie, zbierane pewnymi rękami."
ptBR = "Plantado em água parada, colhido por mãos firmes."
koKR = "고요한 물 위에 심고, 차분한 손으로 거둬들인다."
trTR = "Durgun suya ekilir, sakin ellerle hasat edilir."
