zhCN = "一笔朱砂落下，时节也来相助。"
ruRU = "Один мазок киновари, и сам сезон приходит на помощь."
jaJP = "朱砂一笔落下，季节本身也来相助。"
frFR = "Un seul trait de cinabre, et la saison elle-même prête main-forte."
deDE = "Ein Strich Zinnober, und die Jahreszeit selbst greift helfend ein."
plPL = "Jedno pociągnięcie cynobrem, a sama pora roku przykłada rękę."
ptBR = "Um traço de cinábrio, e a própria estação dá uma mãozinha."
koKR = "한 번의 주사(朱砂) 획이면, 계절마저 손을 보탠다."
trTR = "Tek bir cinnabar darbesi yeter, bir de mevsim kendi payına katkıda bulunur."
esES = "Un trazo de cinabrio, y la propia estación echa una mano."
itIT = "Un solo tratto di cinabro, e la stagione stessa dà una mano."
ukUA = "Один мазок кіновару — і сама пора року приходить на допомогу."
