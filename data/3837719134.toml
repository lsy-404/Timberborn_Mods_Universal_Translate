raw = "An on-water farmstead that grows spirit grain and spirit herbs without taking up a single tile of dry land."
enUS = "An on-water farmstead that grows spirit grain and spirit herbs without taking up a single tile of dry land."
zhCN = "在水面上建造的农舍，种植灵谷与灵草，且不占用任何陆地格子。"
zhTW = "水上農舍，能在水面上種植靈穀與靈草，且不佔用任何一格陸地。"
ruRU = "Усадьба на воде, где выращивают духовное зерно и духовные травы, не занимая ни одной клетки сухой суши."
jaJP = "水上の農場で、陸地を一マスも使わずに霊穀と霊草を育てる。"
frFR = "Une ferme aquatique sur l'eau qui cultive du grain spirituel et des herbes spirituelles sans occuper la moindre case de terre ferme."
deDE = "Ein Bauernhof auf dem Wasser, der Geistgetreide und Geistkräuter anbaut, ohne auch nur eine einzige Kachel Festland zu beanspruchen."
plPL = "Przybudówka na wodzie, w której uprawia się duchowe zboże i duchowe zioła, nie zajmując ani jednego kafelka suchego lądu."
ptBR = "Uma fazenda sobre a água que cultiva grão espiritual e ervas espirituais sem ocupar nenhum bloco de terra firme."
koKR = "수면 위에 지어져 마른 땅을 한 타일도 차지하지 않고 영령 곡물과 영령 약초를 기르는 농가입니다."
trTR = "Karada hiç kara karesi kaplamadan, spirit tahılı ve spirit otları yetiştiren, su üzerinde kurulu bir çiftlik evi."
esES = "Una granja acuática que cultiva grano espiritual y hierbas espirituales sin ocupar ni una sola casilla de tierra firme."
itIT = "Una fattoria acquatica che coltiva grano spirituale ed erbe spirituali senza occupare nemmeno una casella di terraferma."
ukUA = "Освітня ферма на воді, яка вирощує духовне зерно та духовні трави, не займаючи жодної клітинки сухої землі."
thTH = "ฟาร์มเฮาส์ลอยน้ำที่ปลูกธัญพืชวิญญาณและสมุนไพรวิญญาณโดยไม่ต้องใช้พื้นที่บนผืนดินแห้งแม้แต่ช่องเดียว"
csCZ = "Vodní farma, která pěstuje duchovní obilí a duchovní bylinky, aniž by zabrala jediné políčko suché země."
viVN = "Một trang trại trên mặt nước, trồng linh cốc và linh thảo mà không chiếm dù chỉ một ô đất khô nào."
caES = "Una granja aquàtica sobre l'aigua que cultiva gra espiritual i herbes espirituals sense ocupar ni una sola casella de terra seca."
beBY = "Пасяленне на вадзе, дзе вырошчваюць духоўнае збожжа і духоўныя травы, не займаючы ні адной клеткі сушы."
roRO = "Un fermier pe apă care cultivă cereale spirituale și ierburi spirituale fără să ocupe nici o parcelă de uscat."
huHU = "A vízen álló gazdaság, amely úgy termeszt szellemgabonát és szellemgyógynövényt, hogy egyetlen négyzetméternyi szárazföldet sem foglal el."
arSA = "مزرعة عائمة على الماء تزرع حبوب الروح وأعشاب الروح دون أن تشغل ولو بلاطة واحدة من اليابسة."

