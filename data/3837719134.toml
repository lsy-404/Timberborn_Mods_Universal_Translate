["Building.Spiritveil.FountainOfJoy.FlavorDescription"]
status = "normal"
raw = "In water it sings all day. Left dry, it stays silent."
enUS = "In water it sings all day. Left dry, it stays silent."
zhCN = "在水中它整日歌唱，离水则默然无声。"
zhTW = "在水中它整日歌唱，一旦乾涸便悄然無聲。"
ruRU = "В воде она поёт весь день. Оставшись без воды, она молчит."
jaJP = "水に浸かれば一日中歌い続け、乾けば静かに黙り込む。"
frFR = "Dans l'eau, il chante toute la journée. Laissé à sec, il reste silencieux."
deDE = "Im Wasser singt es den ganzen Tag. Auf dem Trockenen bleibt es stumm."
plPL = "W wodzie śpiewa przez cały dzień. Gdy zostanie na sucho, milknie."
ptBR = "Na água, ele canta o dia inteiro. Quando seco, permanece em silêncio."
koKR = "물에 잠기면 하루 종일 노래하고, 마르면 조용해진다."
trTR = "Suda olduğunda gün boyu şarkı söyler. Kuruduğunda ise sessiz kalır."
esES = "En el agua canta todo el día. Cuando se seca, permanece en silencio."
itIT = "Nell'acqua canta tutto il giorno. Lasciata all'asciutto, resta in silenzio."
ukUA = "У воді вона співає цілий день. Коли залишається сухою, мовчить."
thTH = "ในน้ำมันจะร้องเพลงตลอดวัน แต่เมื่อแห้งแล้ว มันก็เงียบงัน"
csCZ = "Ve vodě zpívá celý den. Když vyschne, zmlkne."
viVN = "Trong nước, nó hát suốt ngày. Khi bị bỏ khô, nó im lặng."
caES = "Dins de l'aigua canta tot el dia. Quan queda seca, es manté en silenci."
beBY = "У вадзе яно спявае цэлы дзень. Калі ж яно засыхае, яно маўчыць."
roRO = "În apă cântă toată ziua. Lăsat uscat, tace."
huHU = "Vízben egész nap énekel. Ha kiszárad, hallgatag lesz."
arSA = "في الماء تغني طوال اليوم. وإذا جفّت، تبقى صامتة."

["Building.Spiritveil.GeothermalEngine.Description"]
status = "normal"
raw = "Draws earth-heat to turn the works. No wind, no water - steady and sure."
enUS = "Draws earth-heat to turn the works. No wind, no water - steady and sure."
zhCN = "地热引来大地之热驱动工坊运转。不靠风，不靠水，稳定可靠。"
zhTW = "地熱汲取地脈之熱，驅動機關運轉。不需風，不需水，穩定而可靠。"
ruRU = "Извлекает земное тепло, чтобы приводить в движение механизмы. Ни ветра, ни воды — ровно и надёжно."
jaJP = "地熱を引き出して機構を動かす。風も水も要らない――安定して、確実だ。"
frFR = "Puise la chaleur de la terre pour faire tourner les mécanismes. Ni vent, ni eau : régulier et sûr."
deDE = "Zieht Erdwärme an, um die Werke anzutreiben. Kein Wind, kein Wasser – stetig und zuverlässig."
plPL = "Czerpie ciepło z wnętrza ziemi, by napędzać mechanizmy. Ani wiatru, ani wody - stabilnie i pewnie."
ptBR = "Extrai calor da terra para mover as engrenagens. Sem vento, sem água: constante e seguro."
koKR = "지열을 끌어와 작업장을 돌린다. 바람도, 물도 필요 없다. 한결같고 확실하다."
trTR = "Yer ısısından güç çekerek çarkları döndürür. Rüzgâr da su da gerekmez; sabit ve güvenilirdir."
esES = "Extrae calor de la tierra para mover las obras. Sin viento, sin agua: constante y firme."
itIT = "Attinge al calore della terra per far girare gli ingranaggi. Né vento né acqua: costante e sicuro."
ukUA = "Черпає земне тепло, щоб приводити в рух механізми. Ні вітру, ні води — стабільно й надійно."
thTH = "ดึงความร้อนจากใต้พิภพมาขับเคลื่อนเครื่องจักร ไม่ต้องอาศัยลม ไม่ต้องอาศัยน้ำ มั่นคงและแน่นอน"
csCZ = "Čerpá teplo ze země a roztáčí dílny. Ani vítr, ani voda - stálé a spolehlivé."
viVN = "Hút nhiệt từ lòng đất để vận hành các cơ cấu. Không cần gió, không cần nước, đều đặn và chắc chắn."
caES = "Extreu calor de la terra per fer funcionar les obres. Sense vent, sense aigua: constant i segur."
beBY = "Цягне зямное цяпло, каб рухаць механізмы. Ні ветру, ні вады — роўна і надзейна."
roRO = "Trage căldura pământului pentru a pune în mișcare lucrările. Fără vânt, fără apă, constant și sigur."
huHU = "Földhőt von el, hogy megforgassa a szerkezeteket. Nincs szél, nincs víz – állandó és biztos."
arSA = "يستمد الطاقة من حرارة باطن الأرض لتدوير الآلات. لا رياح، لا ماء، ثابت ومضمون."

