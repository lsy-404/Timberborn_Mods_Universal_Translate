["Building.Spiritveil.WeatherStation.Description"]
status = "normal"
raw = "Weather Pavilion: scans the sky and the river, warning the sect of storms and badwater surges before they arrive."
enUS = "Weather Pavilion: scans the sky and the river, warning the sect of storms and badwater surges before they arrive."
zhCN = "天气楼阁：扫描天空与河流，在风暴和恶水涌流抵达前向宗门发出预警。"
zhTW = "氣象閣：掃描天空與河流，在風暴與毒水暴湧來臨之前，向宗門發出警告。"
ruRU = "Павильон погоды: сканирует небо и реку, предупреждая секту о штормах и всплесках негодной воды до их прихода."
jaJP = "天気パビリオン：空と川を観測し、嵐や悪水の急増が到来する前に宗門へ警告する。"
frFR = "Pavillon météo : observe le ciel et la rivière, et prévient la secte des tempêtes et des montées d'eau polluée avant leur arrivée."
deDE = "Wetterpavillon: Scannt den Himmel und den Fluss und warnt die Sekte vor Stürmen und Schlechtwasser-Wellen, bevor sie eintreffen."
plPL = "Pawilon pogody: skanuje niebo i rzekę, ostrzegając klan o burzach i nagłych wezbraniach złej wody, zanim nadejdą."
ptBR = "Pavilhão do Clima: examina o céu e o rio, avisando o clã sobre tempestades e surtos de água tóxica antes que cheguem."
koKR = "날씨 누각: 하늘과 강을 살펴 폭풍과 독수(badwater) 범람이 닥치기 전에 종문에 미리 경고합니다."
trTR = "Hava Pavyonu: gökyüzünü ve nehri tarar, fırtınaları ve kötü su dalgalarını gelmeden önce klana bildirir."
esES = "Pabellón meteorológico: escanea el cielo y el río, y advierte a la secta sobre tormentas y oleadas de aguas tóxicas antes de que lleguen."
itIT = "Padiglione Meteorologico: esamina il cielo e il fiume, avvisando la setta di tempeste e ondate di acqua infetta prima che arrivino."
ukUA = "Павільйон погоди: сканує небо та річку, попереджаючи клан про грози й сплески поганої води до їхнього настання."
thTH = "ศาลาพยากรณ์อากาศ: สำรวจท้องฟ้าและแม่น้ำ คอยเตือนสำนักถึงพายุและการพุ่งขึ้นของน้ำเสียก่อนที่จะมาถึง"
csCZ = "Meteorologický pavilon: prohledává oblohu a řeku a včas varuje klan před bouřemi a nárazy jedovaté vody, než dorazí."
viVN = "Trạm Thời Tiết: quét bầu trời và dòng sông, cảnh báo tông môn về bão và đợt tràn nước độc trước khi chúng ập đến."
caES = "Pavelló del Temps: escaneja el cel i el riu, i avisa la secta de tempestes i de pujades d'aigua amb badwater abans que arribin."
beBY = "Павільён надвор'я: сканіруе неба і раку, папярэджвае клан пра навальніцы і паводкі брудной вады да іх надыходу."
roRO = "Pavilionul Meteo: scanează cerul și râul, avertizând clanul despre furtuni și valuri de apă toxică înainte ca acestea să sosească."
huHU = "Időjárási pavilon: átfürkészi az eget és a folyót, és figyelmezteti a szektát a viharokra és a rossz víz áradataira, mielőtt azok megérkeznének."
arSA = "معبد الطقس: يمسح السماء والنهر، ويحذّر العشيرة من العواصف واندفاعات المياه الملوّثة قبل وصولها."

