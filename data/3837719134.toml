["Building.Spiritveil.GolemForge.FlavorDescription"]
status = "normal"
raw = "Every board laid down is a foundation of the sect."
enUS = "Every board laid down is a foundation of the sect."
zhCN = "每一块铺下的木板，都是宗门的根基。"
zhTW = "每一塊鋪下的木板，都是宗門的根基。"
ruRU = "Каждая уложенная доска — основа секты."
jaJP = "これまで敷かれたすべての板材が、宗門の礎となる。"
frFR = "Chaque planche posée est une fondation de la secte."
deDE = "Jedes gelegte Brett ist ein Fundament der Sekte."
plPL = "Każda położona deska jest fundamentem sekty."
ptBR = "Cada tábua assentada é uma fundação da seita."
koKR = "모든 널빤지 하나하나가 문파의 기반이 된다."
