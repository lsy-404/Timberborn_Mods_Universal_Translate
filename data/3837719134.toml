zhCN = "这是宗门的修炼之地。它汇聚灵气，让在此休憩的人身心安适。"
zhTW = "修煉之地，為宗門所用。此處會聚集靈氣，讓在此休憩的人身心安適。"
ruRU = "Место культивации клана. Оно собирает ци и успокаивает тело и разум каждого, кто отдыхает здесь."
jaJP = "修練の拠点。気を集め、ここで休む者の心身を安らかにする。"
frFR = "Un site de culture du clan. Il rassemble le qi et apaise le corps et l'esprit de quiconque se repose ici."
deDE = "Ein Kultivierungsort des Clans. Er sammelt Qi und lässt Körper und Geist all jener, die hier rasten, in Ruhe zurück."
plPL = "Miejsce kultywacji tego klanu. Gromadzi qi i sprawia, że każdy, kto tu odpoczywa, czuje spokój ciała i umysłu."
ptBR = "Um local de cultivo do clã. Ele reúne qi e deixa em paz o corpo e a mente de quem descansa aqui."
koKR = "클랜의 수련 장소입니다. 기(氣)를 모아, 이곳에서 쉬는 자의 몸과 마음을 편안하게 해 줍니다."
trTR = "Klanın bir yetiştirme alanı. Qi toplar ve burada dinlenen herkesin beden ile zihnini rahatlatır."
esES = "Un lugar de cultivo del clan. Reúne qi y deja en paz el cuerpo y la mente de quien descansa aquí."
itIT = "Un sito di coltivazione del clan. Raccoglie il qi e lascia in pace il corpo e la mente di chiunque riposi qui."
ukUA = "Місце культивації клану. Воно збирає ці (qi) і заспокоює тіло та розум кожного, хто відпочиває тут."
thTH = "ที่บำเพ็ญของตระกูล ที่นี่รวบรวมชี่และทำให้ร่างกายกับจิตใจของผู้ที่พักผ่อนอยู่ตรงนี้รู้สึกสงบสุข"
csCZ = "Místo kultivace klanu. Soustřeďuje čchi a tomu, kdo zde odpočívá, uvolní tělo i mysl."
viVN = "Một cơ sở tu luyện của tông môn. Nơi đây tụ linh khí, khiến thân tâm của bất kỳ ai nghỉ ngơi tại đây đều được thư thái."
caES = "Un lloc de cultiu del clan. Reuneix qi i deixa el cos i la ment de qui descansi aquí en pau."
beBY = "Месца культывавання клана. Яно збірае ци і вызваляе цела і розум кожнага, хто тут адпачывае."
roRO = "Un loc de cultivare al clanului. Adună qi și lasă trupul și mintea oricui se odihnește aici într-o stare de liniște."
huHU = "A klán egyik művelési helye. Qit gyűjt, és aki itt pihen, annak a teste és az elméje megnyugszik."
arSA = "موقع زراعة تابع للعشيرة. يجمع الطاقة الروحية ويُريح جسد ومشاعر كل من يستريح هنا."

