["Building.Spiritveil.AscensionCave.FlavorDescription"]
status = "normal"
raw = "Clouds gather at the cave mouth, and the qi follows them in."
enUS = "Clouds gather at the cave mouth, and the qi follows them in."
zhCN = "云雾在洞口聚集，灵气也随之涌入。"
zhTW = "雲氣聚在洞口，靈氣也隨之而來。"
ruRU = "Облака собираются у входа в пещеру, и вслед за ними приходит ци."
jaJP = "雲が洞窟の入り口に集まり、気もその後に続いて流れ込んでくる。"
frFR = "Des nuages s'amassent à l'entrée de la grotte, et le qi les suit à l'intérieur."
deDE = "Wolken sammeln sich am Höhleneingang, und das Qi folgt ihnen hinein."
plPL = "Chmury gromadzą się u wejścia do jaskini, a qi podąża za nimi do środka."
ptBR = "Nuvens se reúnem na entrada da caverna, e o qi as segue para dentro."
koKR = "구름이 동굴 입구에 모여들고, 기(氣)가 그 뒤를 따라 들어온다."
trTR = "Bulutlar mağaranın girişinde toplanır ve qi de onları takip ederek içeri girer."
esES = "Las nubes se reúnen en la boca de la cueva, y el qi las sigue hasta el interior."
itIT = "Le nuvole si radunano all'imboccatura della grotta, e il qi le segue all'interno."
ukUA = "Хмари збираються біля входу в печеру, а ци йде за ними всередину."
thTH = "เมฆรวมตัวกันที่ปากถ้ำ และพลังชี่ก็ไหลตามพวกมันเข้ามา"
csCZ = "Mraky se shromažďují u ústí jeskyně a qi je za nimi přichází."
viVN = "Mây tụ lại nơi cửa hang, và linh khí theo mây mà tràn vào."
caES = "Els núvols s'apleguen a l'entrada de la cova, i el qi els segueix a dins."
beBY = "Хмары збіраюцца каля ўваходу ў пячору, і ци ідзе за імі ўсярэдыну."
roRO = "Norii se adună la gura peșterii, iar qi-ul vine după ei."
huHU = "Felhők gyülekeznek a barlang szájánál, és a csí utánuk szivárog be."
arSA = "تتجمع الغيوم عند فم الكهف، وتتبعها الطاقة الروحية إلى الداخل."

["Building.Spiritveil.BadwaterDome.Description"]
status = "normal"
raw = "Caps a badwater source, holding the miasma inside and keeping the waterways around it clean."
enUS = "Caps a badwater source, holding the miasma inside and keeping the waterways around it clean."
zhCN = "封住恶水源，将瘴气锁在内部，使周围的水道保持洁净。"
zhTW = "封住一处污水源，将瘴气锁在其中，并使周围的水道保持清洁。"
ruRU = "Закрывает источник загрязнённой воды, удерживая миазмы внутри и сохраняя чистоту окружающих водных путей."
jaJP = "汚水源に蓋をし、瘴気を内部に閉じ込めて、周囲の水路を清浄に保つ。"
frFR = "Coiffe une source d'eau saumâtre, retient les miasmes à l'intérieur et garde les cours d'eau alentour propres."
deDE = "Verschließt eine Schmutzwasserquelle, hält das Miasma darin zurück und hält die umliegenden Wasserwege sauber."
plPL = "Zakrywa źródło zepsutej wody, zatrzymując w środku miazmat i utrzymując czystość okolicznych cieków wodnych."
ptBR = "Cobre uma fonte de água ruim, mantendo o miasma contido e deixando limpos os cursos d'água ao redor."
koKR = "독성 물 수원을 덮어 그 안의 미아스마를 가두고, 주변 수로를 깨끗하게 유지합니다."
trTR = "Bir kötü su kaynağını kapatarak içindeki miazmayı tutar ve çevresindeki su yollarını temiz tutar."
esES = "Tapa una fuente de agua envenenada, conteniendo el miasma en su interior y manteniendo limpias las vías fluviales de los alrededores."
itIT = "Copre una sorgente di acque reflue tossiche, trattenendo i miasmi al suo interno e mantenendo pulite le vie d'acqua circostanti."
ukUA = "Закриває джерело поганої води, утримуючи міазми всередині та підтримуючи чистоту навколишніх водних шляхів."
thTH = "ปิดแหล่งน้ำเสียด้วยโดมที่กักเก็บพิษมิอาสมาไว้ข้างใน และช่วยให้แหล่งน้ำโดยรอบสะอาดอยู่เสมอ"
csCZ = "Zakrývá zdroj špinavé vody a drží výpary uvnitř, takže vodní toky kolem něj zůstávají čisté."
viVN = "Đậy nắp một nguồn nước bẩn, giữ luồng độc khí bên trong và giúp các dòng nước xung quanh luôn sạch sẽ."
caES = "Cobreix una font d'aigua tòxica, retenint el miasma a l'interior i mantenint nets els cursos d'aigua del seu voltant."
beBY = "Накрывае крыніцу брудной вады, утрымліваючы міязму ўнутры і захоўваючы навакольныя водныя шляхі чыстымі."
roRO = "Acoperă o sursă de apă tulbure, reținând miasma înăuntru și menținând curate cursurile de apă din jur."
huHU = "A mérgezett vizes forrást lefedi, bent tartja a miazmát, és így a körülötte lévő vízfolyásokat tisztán tartja."
arSA = "يغطي مصدر المياه الملوثة ويحتجز الغازات السامة بداخله، ويُبقي المجاري المائية المحيطة به نظيفة."

