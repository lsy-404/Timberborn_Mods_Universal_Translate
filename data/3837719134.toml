itIT = "Una formazione incisa con rune che protegge l'intero cancello. Una volta costruita: +5 punti percentuali a tutte le svolte e +1% di velocità di coltivazione su tutta la mappa (lo stesso edificio conta una sola volta)."
ukUA = "Формація з рунами, що захищає всю браму. Після побудови: +5 процентних пунктів до всіх проривів і +1% до швидкості культивації на всій карті (та сама будівля враховується лише один раз)."
thTH = "ค่ายอักขระที่สลักด้วยรูนนี้ปกป้องประตูทั้งบาน เมื่อสร้างแล้ว: เพิ่มอัตราการทะลวงทุกชนิดอีก 5 เปอร์เซ็นต์จุด และเพิ่มความเร็วการบ่มเพาะทั่วทั้งแผนที่อีก 1% (อาคารเดียวกันนับเพียงครั้งเดียว)"
csCZ = "Runová formace chránící celou bránu. Po postavení: +5 procentních bodů ke každému průlomu a +1 % rychlosti kultivace na celé mapě (tato budova se počítá pouze jednou)."
viVN = "Một trận pháp khắc phù văn bao phủ toàn bộ cổng. Sau khi xây dựng: +5 điểm phần trăm cho mọi đột phá và +1% tốc độ tu luyện trên toàn bản đồ (cùng một công trình chỉ được tính một lần)."
caES = "Una formació gravada amb runes que protegeix tota la porta. Un cop construïda: +5 punts percentuals a totes les irrupcions i +1% de velocitat de cultiu a tot el mapa (el mateix edifici només compta una vegada)."
