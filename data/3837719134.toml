esES = "Un nodo de señal espiritual que enlaza mensajes lejanos con la formación de la secta: el vínculo de la puerta con el mundo exterior."
itIT = "Un nodo di segnale spirituale che collega messaggi lontani alla formazione della setta: il collegamento del cancello con il mondo esterno."
