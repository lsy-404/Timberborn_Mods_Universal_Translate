["Building.Spiritveil.UndergroundPile.Description"]
status = "normal"
raw = "Stores timber below ground, sheltered from rain and sun - though you must dig it out to use it."
enUS = "Stores timber below ground, sheltered from rain and sun, though you must dig it out to use it."
zhCN = "埋在地下储存木材，可避开雨淋与日晒——不过要用时得先挖出来。"
zhTW = "將木材儲存在地下，不受雨淋與日曬，但必須先挖出來才能使用。"
ruRU = "Хранит древесину под землёй, защищённую от дождя и солнца, однако её нужно выкопать, прежде чем использовать."
jaJP = "地下に木材を保管する施設で、雨や日差しから守られます。ただし使用するには掘り出す必要があります。"
frFR = "Stocke du bois sous terre, à l'abri de la pluie et du soleil, mais il faut le déterrer pour l'utiliser."
deDE = "Lagert Holz unterirdisch, geschützt vor Regen und Sonne – allerdings muss man es erst ausgraben, bevor man es verwenden kann."
plPL = "Magazynuje drewno pod ziemią, chroniąc je przed deszczem i słońcem, lecz aby go użyć, trzeba je najpierw wykopać."
ptBR = "Armazena madeira sob o solo, protegida da chuva e do sol, mas você precisa desenterrá-la para usá-la."
koKR = "지하에 목재를 보관하며, 비와 햇빛으로부터 보호됩니다. 다만 사용하려면 파내야 합니다."
trTR = "Kereste, yağmurdan ve güneşten korunarak toprağın altında depolanır; ancak kullanmak için onu kazıp çıkarmanız gerekir."
esES = "Almacena madera bajo tierra, protegida de la lluvia y del sol, aunque hay que excavarla para usarla."
itIT = "Immagazzina legname sottoterra, al riparo da pioggia e sole, anche se per usarlo bisogna prima scavarlo."
ukUA = "Зберігає деревину під землею, захищену від дощу та сонця, — але щоб її використати, її треба викопати."
thTH = "เก็บไม้ซุงไว้ใต้ดิน ป้องกันจากฝนและแดด แต่คุณต้องขุดออกมาก่อนจึงจะนำไปใช้ได้"
csCZ = "Ukládá dřevo pod zemí, chráněné před deštěm a sluncem, i když ho musíte vykopat, abyste ho mohli použít."
viVN = "Lưu trữ gỗ dưới lòng đất, được che chắn khỏi mưa và nắng - tuy nhiên bạn phải đào nó lên để sử dụng."
caES = "Emmagatzema fusta sota terra, protegida de la pluja i del sol, tot i que cal excavar-la per poder-la utilitzar."
beBY = "Захоўвае драўніну пад зямлёй, абароненую ад дажджу і сонца, але каб выкарыстаць яе, трэба яе выкапаць."
roRO = "Depozitează lemnul sub pământ, ferit de ploaie și soare, deși trebuie să-l scoți la suprafață înainte de a-l putea folosi."
huHU = "Fából készült rakományt tárol a föld alatt, esőtől és naptól védve, de használat előtt ki kell ásni."
arSA = "تُخزّن الأخشاب تحت الأرض، محميةً من المطر والشمس، لكن يجب حفرها لاستخدامها."

