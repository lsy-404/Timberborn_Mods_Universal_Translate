["Building.Spiritveil.Refinery.Description"]
status = "normal"
raw = "Beaver or golem can work it. Refines tainted water into mild immortal fluid and turns out spirit fuels - the hub of immortal-tier materials."
enUS = "Beaver or golem can work it. Refines tainted water into mild immortal fluid and turns out spirit fuels - the hub of immortal-tier materials."
zhCN = "海狸或魔像都可以操作它。将受污染的水精炼为温和的仙灵流体，并生产灵能燃料——这是仙阶材料的核心。"
zhTW = "海狸或魔像都能操作它。將受污染的水精煉成溫和的不朽流體，並產出靈能燃料──這是不朽等級材料的核心。"
ruRU = "Бобр или голем может управлять им. Перерабатывает загрязнённую воду в слабо-бессмертную жидкость и выпускает духовное топливо — центральное звено материалов бессмертного уровня."
jaJP = "ビーバーまたはゴーレムが操作できる。汚染された水を穏やかな不死の液体に精製し、霊的燃料を生み出す。不死のティアの素材の中核となる施設だ。"
frFR = "Un castor ou un golem peut la faire fonctionner. Raffine l'eau viciée en un fluide immortel doux et produit des carburants spirituels, le pivot des matériaux de rang immortel."
deDE = "Biber oder Golem können es bedienen. Verfeinert verseuchtes Wasser zu einer milden unsterblichen Flüssigkeit und stellt Geisterbrennstoffe her – das Zentrum der Materialien der unsterblichen Stufe."
plPL = "Bóbr lub golem mogą nad tym pracować. Przetwarza skażoną wodę na łagodny nieśmiertelny płyn i wytwarza duchowe paliwa – centrum materiałów nieśmiertelnej klasy."
ptBR = "Castor ou golem podem operá-lo. Refina água contaminada em um fluido imortal suave e produz combustíveis espirituais - o núcleo dos materiais de nível imortal."
koKR = "비버나 골렘이 작업할 수 있습니다. 오염된 물을 순한 불멸의 유체로 정제하고, 영혼 연료를 만들어 냅니다. 불멸 등급 자재의 중심지입니다."
trTR = "Bir işçi kunduz veya golem bunu çalıştırabilir. Kirlenmiş suyu hafif ölümsüz bir sıvıya arıtır ve ruh yakıtları üretir; bunlar ölümsüzlük seviyesindeki malzemelerin merkezidir."
esES = "Un castor o un golem puede operarlo. Refina agua contaminada en un fluido inmortal suave y produce combustibles espirituales: el centro de los materiales de nivel inmortal."
itIT = "Può essere gestito da un castoro o da un golem. Raffina l'acqua contaminata in un fluido immortale mite e produce combustibili spirituali: il fulcro dei materiali di livello immortale."
ukUA = "Бобер або голем можуть працювати на ньому. Очищає отруйну воду до м'якої безсмертної рідини та виробляє духовне паливо — центр матеріалів безсмертного рівня."
thTH = "ทั้งบีเวอร์และโกเลมสามารถทำงานที่นี่ได้ กลั่นน้ำที่ปนเปื้อนให้เป็นของเหลวอมตะอ่อนๆ และแปรรูปเชื้อเพลิงวิญญาณ ซึ่งเป็นศูนย์กลางของวัสดุระดับอมตะ"
csCZ = "Bobr nebo golem může obsluhovat. Zpracovává znečištěnou vodu na jemnou nesmrtelnou tekutinu a vyrábí duchovní palivo – centrum materiálů nesmrtelné úrovně."
viVN = "Hải ly hoặc khôi lỗi đều có thể vận hành. Tinh chế nước nhiễm độc thành chất lỏng bất tử ôn hòa, đồng thời tạo ra nhiên liệu tinh thần, là trung tâm của các vật liệu cấp bất tử."
caES = "Un castor o un golem pot fer-lo funcionar. Refina l'aigua contaminada en un fluid immortal suau i transforma els combustibles d'esperit: el centre dels materials de nivell immortal."
beBY = "Бабёр або голем могуць працаваць з ім. Ачышчае забруджаную ваду да мяккай бессмяротнай вадкасці і вырабляе духоўнае паліва — цэнтр матэрыялаў бессмяротнага ўзроўню."
roRO = "Poate fi operată de un castor sau de un golem. Rafinează apa contaminată într-un fluid imortal blând și transformă spiritul în combustibili – centrul materialelor de nivel imortal."
huHU = "Hősök vagy golem is képes működtetni. Átalakítja a szennyezett vizet enyhe, halhatatlan folyadékká, és spirituális üzemanyagot állít elő – ez a halhatatlan szintű anyagok központja."
arSA = "يمكن للقندس أو الغولem تشغيله. يُكرر الماء الملوث إلى سائل خالد خفيف، ويُنتج وقود الروح، وهو المحور لمواد الدرجة الخالدة."

