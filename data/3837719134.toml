["Building.Spiritveil.AquaticFarmhouse.FlavorDescription"]
status = "normal"
raw = "Planted on still water, harvested by steady hands."
enUS = "Planted on still water, harvested by steady hands."
zhCN = "种于静水，收于稳手。"
zhTW = "種於靜水之上，由穩定的手細心收成。"
