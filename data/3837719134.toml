["Good.SpiritTalisman.Description"]
status = "normal"
raw = "Offer it at the Sect Hall to raise breakthrough success by 5 percentage points; also a high-tier building material."
enUS = "Offer it at the Sect Hall to raise breakthrough success by 5 percentage points; also a high-tier building material."
zhCN = "在宗门大殿供奉此物，可将突破成功率提高5个百分点；同时它也是一种高级建筑材料。"
zhTW = "在宗门大殿供奉此物，可使突破成功率提升5个百分点；同时也是一种高阶建材。"
ruRU = "Предложите его в Зале секты, чтобы повысить вероятность успешного прорыва на 5 процентных пунктов; также это высококачественный строительный материал."
jaJP = "献上先として宗門の会館に捧げると、突破成功率が5パーセントポイント上昇し、高級建材も得られる。"
frFR = "Offrez-le au Hall de la Secte pour augmenter le taux de réussite des percées de 5 points de pourcentage ; c'est aussi un matériau de construction de haut niveau."
deDE = "Biete es in der Sektenhalle an, um die Erfolgschance für einen Durchbruch um 5 Prozentpunkte zu erhöhen; außerdem ist es ein hochwertiger Baustoff."
plPL = "Złóż ją w Sali Sekty, aby zwiększyć szansę na powodzenie przełomu o 5 punktów procentowych; to także wysokiej klasy materiał budowlany."
ptBR = "Ofereça no Salão da Seita para aumentar a chance de sucesso na transcendência em 5 pontos percentuais; também é um material de construção de alto nível."
koKR = "산문원에서 이것을 바치면 돌파 성공률이 5%p 증가하며, 고급 건축 자재 역할도 합니다."
trTR = "Sect Hall'da sunarak terfi başarı oranını 5 yüzde puanı artırın; ayrıca yüksek kademeli bir yapı malzemesidir."
esES = "Ofrécela en el Salón de la Secta para aumentar el éxito de avance en 5 puntos porcentuales; además, es un material de construcción de alto nivel."
itIT = "Offrilo presso la Sala della Setta per aumentare di 5 punti percentuali il successo della scoperta; è inoltre un materiale da costruzione di alta gamma."
ukUA = "Запропонуйте його в Залі Секти, щоб підвищити успіх прориву на 5 процентних пунктів; також це високоякісний будівельний матеріал."
thTH = "นำไปถวายที่ห้องประชุมของสำนัก เพื่อเพิ่มโอกาสสำเร็จในการทะลวงขั้นอีก 5 เปอร์เซ็นต์ และยังเป็นวัสดุก่อสร้างระดับสูงอีกด้วย"
csCZ = "Nabídněte ji v sídle sekty a zvýšíte úspěšnost průlomu o 5 procentních bodů; navíc jde o stavební materiál vysoké úrovně."
viVN = "Hãy dâng cho Sảnh Tông Môn để tăng 5 điểm phần trăm tỷ lệ thành công khi đột phá; đồng thời đây cũng là vật liệu xây dựng cao cấp."
caES = "Ofereix-lo a la Sala de la Secta per augmentar l'èxit del avanç de nivell en 5 punts percentuals; també és un material de construcció d'alt nivell."
beBY = "Прапануйце яе ў Залі сэкты, каб павысіць шанец паспяховага прарыву на 5 працэнтных пунктаў; таксама гэта высакаякасны будаўнічы матэрыял."
roRO = "Oferiți-l la Sala Sectei pentru a crește șansa de reușită a descoperirii cu 5 puncte procentuale; este, de asemenea, un material de construcție de nivel înalt."
huHU = "Ajánlja fel a Szekta Csarnokban, hogy 5 százalékponttal növelje az áttörés sikerességét; emellett kiváló minőségű építőanyag is."
arSA = "يُقدَّم في قاعة الطائفة لرفع نسبة نجاح الاختراق بمقدار 5 نقاط مئوية، وهو أيضًا مادة بناء عالية المستوى."

