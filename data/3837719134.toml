enUS = "A sensing stone that lights up the moment the water discolours. The sentry of the waterways."
zhCN = "一块能在水体变色的瞬间亮起的感应石。它是水道的哨兵。"
zhTW = "感應石，水質一旦變色便會亮起。水道的哨兵。"
