itIT = "Offrilo alla Sala della Setta per aumentare la capacità di trasporto dell'intero clan; è anche un materiale per la Schiera della Setta."
ukUA = "Запропонуйте його в Залі секти, щоб підвищити вантажопідйомність для всього клану; також це матеріал для Масиву секти."
thTH = "นำไปถวายที่หอพระของสำนัก เพื่อเพิ่มความจุในการขนส่งให้ทั้งตระกูล และยังเป็นวัสดุสำหรับค่ายกลของสำนักด้วย"
