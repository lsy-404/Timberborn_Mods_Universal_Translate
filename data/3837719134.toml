esES = "Un efigie guardiana que ahuyenta a aves y bestias y mantiene a salvo la cosecha de la temporada."
itIT = "Un'effigie protettiva che allontana uccelli e bestie e tiene al sicuro il raccolto della stagione."
ukUA = "Опудало-охоронець, яке відлякує птахів і звірів та береже врожай сезону."
thTH = "หุ่นไล่กาจำลองที่ช่วยขับไล่นกและสัตว์ป่า และปกป้องผลผลิตของฤดูกาลให้ปลอดภัย"
csCZ = "Strašák z podobizny strážce, který odhání ptáky a zvěř a chrání úrodu během sezóny."
viVN = "Hình nộm canh giữ dọa chim và thú, giúp bảo vệ mùa vụ khỏi bị phá hoại."
caES = "Una efígie guardiana que ahuyenta aves y bestias y mantiene a salvo la cosecha de la temporada."
beBY = "Пудзіла-ахоўнік, які адганяе птушак і звяроў і ахоўвае ўраджай за сезон."
roRO = "Un efigie de gardian care sperie păsările și animalele sălbatice și păstrează recolta sezonului în siguranță."
huHU = "Egy őrző bábu, amely elriasztja a madarakat és vadállatokat, és megóvja az évszak termését."
arSA = "تمثال حارس يُخيف الطيور والوحوش ويحمي محصول الموسم."

