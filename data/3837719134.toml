viVN = "Dược sư, luyện Kim Đan và Đại Thừa đan dược - lò luyện cuối cùng trước khi bế quan."
caES = "L'apotecari, que elabora els elixirs del Nucli Daurat i Mahayana: l'últim forn abans de la reclusió."
beBY = "Аптэкар, які вырабляе эліксіры Залатога ядра і Махаяны, — апошняя печ перад адасабленнем."
roRO = "Farmacistul, care prepară elixirele Miez de Aur și Mahayana, ultimul cuptor înainte de izolare."
