["Building.Spiritveil.GolemFactory.FlavorDescription"]
status = "normal"
raw = "The gears turn, the spirit takes hold, and a golem draws its first breath."
enUS = "The gears turn, the spirit takes hold, and a golem draws its first breath."
zhCN = "齿轮转动，灵力灌注，一尊傀儡迎来了它的第一次呼吸。"
zhTW = "齒輪轉動，靈氣入體，傀儡踏出了它的第一口氣。"
ruRU = "Шестерни приходят в движение, дух вселяется в них, и голем делает первый вдох."
jaJP = "歯車が回り、霊気が宿り、ゴーレムが最初の息を吹き込まれる。"
frFR = "Les rouages tournent, l'esprit s'empare de la matière, et un golem prend sa première inspiration."
deDE = "Die Zahnräder drehen sich, der Geist erfasst es, und ein Golem holt zum ersten Mal Atem."
plPL = "Trybiki się obracają, duch wstępuje w nie, i golem bierze swój pierwszy oddech."
ptBR = "As engrenagens giram, o espírito toma conta, e um golem dá seu primeiro suspiro."
koKR = "기어가 돌아가고, 영기가 깃들며, 골렘이 처음으로 숨을 들이쉰다."
trTR = "Dişliler döner, ruh bedenine yerleşir ve bir golem ilk nefesini alır."
esES = "Los engranajes giran, el espíritu se apodera de ello y un gólem da su primer aliento."
itIT = "Gli ingranaggi girano, lo spirito prende forma e un golem fa il suo primo respiro."
ukUA = "Шестерні крутяться, дух оволодіває ними, і голем робить свій перший подих."
thTH = "เฟืองหมุนไป วิญญาณเข้าสิงสถิตย์ และโกเลมก็หายใจเฮือกแรกของมัน"
csCZ = "Ozubená kola se roztáčejí, duch se usídlí a golem nadechuje svůj první dech."
viVN = "Bánh răng quay, linh khí nhập thể, và một khôi lỗi hít thở hơi thở đầu tiên."
caES = "Les engrunes giren, l'esperit s'apodera de tot i un golem pren el seu primer alè."
beBY = "Шастэрні паварочваюцца, дух займае сваё месца, і голем робіць першы ўдых."
roRO = "Roțile se învârt, spiritul își face loc, iar un golem trage prima sa respirație."
huHU = "A fogaskerekek megmozdulnak, a szellem megragad, és egy golem először veszi a levegőt."
arSA = "تدور التروس، وتستقر الروح في جسده، ويتنفس الغولم أنفاسه الأولى."

["Building.Spiritveil.GolemForge.Description"]
status = "normal"
raw = "Where mortal beavers saw spirit wood into treated planks - the root of all early timber work."
enUS = "Where mortal beavers saw spirit wood into treated planks, the root of all early timber work."
zhCN = "凡间海狸在此将灵木锯成经过处理的木板，这是一切早期木作的根基。"
zhTW = "在凡人海狸將靈木鋸成處理過的木板之處，這是所有早期木工的根本。"
ruRU = "Там, где смертные бобры распиливают духовное дерево на обработанные доски, — корень всех ранних деревянных работ."
jaJP = "ここでは、死すべき海狸たちが霊木を加工して処理済みの板材にしていた。初期の木材加工すべての根源である。"
frFR = "Là où les castors mortels transforment le bois d'esprit en planches traitées : la racine de tout le travail du bois des premiers temps."
deDE = "Wo sterbliche Biber Geisterholz zu behandelten Brettern sägen – die Wurzel aller frühen Holzarbeit."
plPL = "Tam, gdzie śmiertelne bobry przecinają duchowe drewno na obrobione deski - korzeń wszelkiej wczesnej obróbki drewna."
ptBR = "Onde castores mortais serram madeira espiritual em tábuas tratadas, a raiz de todo o trabalho inicial com madeira."
koKR = "필멸의 비버들이 영혼의 나무를 켜서 가공된 판자로 만들던 곳 - 모든 초기 목재 작업의 근원이다."
trTR = "Ölümlü kunduzların tedavi edilmiş kereste elde etmek için ruh ağacını biçtiği yer. Tüm erken dönem kereste işçiliğinin kökü burasıdır."
esES = "Donde los castores mortales aserraban madera espiritual en tablones tratados: la raíz de todo el trabajo primitivo con madera."
itIT = "Dove i mortali castori segano il legno spirituale in assi trattate: la radice di ogni prima lavorazione del legname."
ukUA = "Там, де смертні бобри розпилюють духовну деревину на оброблені дошки — корінь усіх ранніх деревообробних робіт."
thTH = "ที่ซึ่งเหล่าบีเวอร์ผู้ไม่อมตะเลื่อยไม้วิญญาณให้เป็นแผ่นไม้ผ่านการปรุงแต่ง เป็นรากฐานของงานไม้ยุคแรกทั้งหมด"
csCZ = "Tam, kde smrtelní bobři řezali duchovní dřevo na upravená prkna – kořen veškerého raného dřevařství."
viVN = "Nơi những chú hải ly phàm trần xẻ gỗ thành ván đã xử lý, cội nguồn của mọi công việc gỗ thời kỳ đầu."
caES = "On els castors mortals serraven la fusta espiritual en taulons tractats: l'arrel de tota la fusta de la primera etapa."
beBY = "Тут смяротныя бабры распільвалі заваждзоны жывы лес на апрацаваныя дошкі — аснову ўсіх ранніх драўляных работ."
roRO = "Acolo unde muritorii castori sculau lemnul spiritual în scânduri tratate - rădăcina întregii prelucrări timpurii a lemnului."
huHU = "Ahol a halandó hódok a szellemfát kezelt deszkákra fűrészelték – minden korai faipari munka gyökere."
arSA = "حيث كان البيفر الفانون يحوّلون الخشب الروحي إلى ألواح معالجة، وهو أصل كل أعمال الأخشاب المبكرة."

