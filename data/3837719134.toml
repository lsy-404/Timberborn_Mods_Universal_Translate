["Building.Spiritveil.DistrictCenter.FlavorDescription"]
status = "normal"
raw = "Its roof is the first thing a visitor sees, and the last thing they forget."
enUS = "Its roof is the first thing a visitor sees, and the last thing they forget."
zhCN = "这座建筑的屋顶是访客最先看到的东西，也是他们最先忘记的东西。"
zhTW = "這座建築的屋頂是訪客最先注意到的東西，也是他們最快忘記的東西。"
ruRU = "Его крыша — первое, что замечает посетитель, и последнее, что он забывает."
jaJP = "訪問者が最初に目にするのは屋根であり、最後に忘れるのも屋根だ。"
frFR = "Son toit est la première chose qu'un visiteur remarque, et la dernière qu'il oublie."
deDE = "Sein Dach ist das Erste, was ein Besucher sieht, und das Letzte, was er vergisst."
plPL = "Jego dach jest pierwszą rzeczą, jaką widzi odwiedzający, i ostatnią, o której zapomina."
ptBR = "O telhado é a primeira coisa que um visitante vê e a última que ele esquece."
koKR = "이 건물의 지붕은 방문객이 가장 먼저 보는 것이자, 가장 먼저 잊어버리는 것이다."
trTR = "Çatısı, bir ziyaretçinin gördüğü ilk şey, ama unuttuğu son şey."
esES = "El tejado es lo primero que ve un visitante y lo último que olvida."
itIT = "Il suo tetto è la prima cosa che un visitatore vede e l'ultima che dimentica."
ukUA = "Його дах — перше, що помічає відвідувач, і останнє, що він забуває."
thTH = "หลังคาของมันคือสิ่งแรกที่ผู้มาเยือนเห็น และเป็นสิ่งสุดท้ายที่พวกเขาจะลืม"
csCZ = "Jeho střecha je první věc, kterou návštěvník uvidí, a poslední, na kterou zapomene."
viVN = "Mái nhà là thứ đầu tiên du khách nhìn thấy, và cũng là thứ cuối cùng họ quên."
caES = "El seu sostre és el primer que veu un visitant, i el darrer que oblida."
beBY = "Яго дах — першае, што бачыць наведвальнік, і апошняе, што ён забывае."
roRO = "Acoperișul său este primul lucru pe care îl vede un vizitator și ultimul lucru pe care îl uită."
huHU = "A tető az első dolog, amit a látogató meglát, és az utolsó, amire emlékezni fog."
arSA = "سقفه أول ما يراه الزائر، وآخر ما ينساه."

["Building.Spiritveil.DoubleFloodgate.Description"]
status = "normal"
raw = "A twin-plate gate for finer water control, ready for drought and deluge alike."
enUS = "A twin-plate gate for finer water control, ready for drought and deluge alike."
zhCN = "双板闸门，可更精细地控制水流，无论干旱还是洪涝都能应对。"
zhTW = "雙板閘門，可更精細地控制水流，無論乾旱或洪澇皆能應對。"
ruRU = "Двустворчатый шлюз для более тонкого управления водой, готовый как к засухе, так и к наводнению."
jaJP = "双板水門は、より細かな水量調節を可能にし、干ばつにも洪水にも備えられます。"
frFR = "Une vanne à double plaque pour un contrôle plus fin de l'eau, prête pour la sécheresse comme pour le déluge."
deDE = "Ein Doppelschieber-Schleusentor für feinere Wasserkontrolle, bereit für Dürre und Flut gleichermaßen."
plPL = "Dwuskrzydłowa śluza wrót do precyzyjniejszego sterowania wodą, gotowa na susze i powodzie."
ptBR = "Um portão de duas placas para um controle de água mais preciso, pronto para secas e enchentes igualmente."
koKR = "두 개의 판으로 이루어진 수문으로, 가뭄과 홍수 모두에 대비해 더 세밀하게 물을 조절할 수 있습니다."
trTR = "İnce su kontrolü için çift kanatlı bir kapak; kuraklıkta da sel baskınında da hazır."
esES = "Una compuerta de doble placa para un control más fino del agua, lista para la sequía y para la inundación por igual."
itIT = "Una chiusa a doppia lastra per un controllo più preciso dell'acqua, pronta sia per la siccità sia per il diluvio."
ukUA = "Двостулкова шлюзова заслінка для точнішого керування водою, готова до посухи й повені однаково."
thTH = "ประตูน้ำสองแผ่นสำหรับควบคุมน้ำได้ละเอียดขึ้น พร้อมรับมือทั้งภัยแล้งและน้ำท่วมใหญ่"
csCZ = "Dvoudesková hradidla pro jemnější regulaci vody, připravená na sucho i na záplavy."
viVN = "Cổng đôi bằng hai tấm chắn, giúp kiểm soát nước chính xác hơn, sẵn sàng cho cả hạn hán lẫn lũ lụt."
caES = "Una comporta de doble placa per a un control més fi de l'aigua, preparada tant per a la sequera com per a la inundació."
beBY = "Засаўка з двума пласцінамі для тонкага кіравання вадой, гатовая як да засухі, так і да паводку."
roRO = "O stavilă cu două plăci pentru un control mai fin al apei, pregătită atât pentru secetă, cât și pentru inundații."
huHU = "Egy kéttáblás zsilip finomabb vízszabályozáshoz, aszályra és árvízre egyaránt felkészülten."
arSA = "بوابة ذات لوحين لتحكم أدق في المياه، جاهزة للجفاف والفيضان على حد سواء."

