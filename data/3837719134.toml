["Building.Spiritveil.Campfire.Description"]
status = "normal"
raw = "A fire for trading insights. Talking through the dao by the flames quietly sharpens everyone's understanding."
enUS = "A fire for exchanging insights. Talking through the Dao by the flames quietly sharpens everyone's understanding."
zhCN = "篝火用于交流心得。众人在火边围坐论道，能悄然提升彼此的理解。"
zhTW = "在火堆旁論道，互相切磋見解。火光之下暢談大道，眾人的理解也悄然精進。"
ruRU = "Костёр для обмена озарениями. Беседа о дао у пламени незаметно оттачивает понимание каждого."
jaJP = "見解を交わすための焚き火。炎のそばで道を語り合うと、皆の理解が静かに研ぎ澄まされる。"
frFR = "Un feu pour échanger des intuitions. En discutant du dao près des flammes, la compréhension de chacun s'affine discrètement."
deDE = "Ein Feuer für den Austausch von Erkenntnissen. Wer am Lagerfeuer über das Dao spricht, schärft still und leise das Verständnis aller."
plPL = "Ognisko do wymiany przemyśleń. Rozmowa o dao przy płomieniach po cichu wyostrza zrozumienie każdego."
ptBR = "Uma fogueira para trocar percepções. Conversar sobre o dao ao redor das chamas aprimora discretamente o entendimento de todos."
koKR = "모닥불은 깨달음을 나누는 자리다. 불꽃 곁에서 도(道)를 두고 이야기하면 모두의 이해가 조용히 날카로워진다."
trTR = "Görüş alışverişi için bir ateş. Alevlerin başında dao üzerine sohbet etmek, herkesin kavrayışını sessizce keskinleştirir."
esES = "Una fogata para intercambiar ideas. Hablar del dao junto a las llamas afila en silencio la comprensión de todos."
itIT = "Un fuoco per scambiare intuizioni. Discutere del Dao accanto alle fiamme affina silenziosamente la comprensione di tutti."
ukUA = "Вогнище для обміну прозрefinням. Бесіда про дао біля полум'я тихо загострює розуміння всіх."
thTH = "กองไฟสำหรับแลกเปลี่ยนความเข้าใจ การพูดคุยเรื่อง dao ข้างเปลวไฟค่อย ๆ ทำให้ความเข้าใจของทุกคนคมชัดขึ้น"
csCZ = "Oheň pro výměnu postřehů. Povídání o dao u plamenů nenápadně prohlubuje porozumění všech."
viVN = "Một đống lửa để trao đổi giác ngộ. Vừa ngồi bên lửa bàn về đạo, mọi người sẽ âm thầm hiểu sâu hơn."
caES = "Un foc per intercanviar coneixements. Parlar del dao al voltant de les flames afina discretament la comprensió de tothom."
