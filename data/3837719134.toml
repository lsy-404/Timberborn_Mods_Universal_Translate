["Building.Spiritveil.BuildersHut.Description"]
status = "normal"
raw = "The builders' lodge. Craftsmen rest here and stage their materials before a new hall breaks ground."
enUS = "The builders' lodge. Craftsmen rest here and stage their materials before a new hall breaks ground."
zhCN = "建造者小屋。工匠们在这里休息，并在新殿堂破土动工前备好材料。"
zhTW = "建造者小屋。工匠們在此休息，並在新殿堂動工前先備妥材料。"
ruRU = "Дом строителей. Ремесленники отдыхают здесь и заранее складывают материалы, прежде чем начнётся закладка нового зала."
jaJP = "建築者の小屋。職人たちはここで休息し、新しい会館の着工前に資材を準備しておく。"
frFR = "Le pavillon des bâtisseurs. Les artisans se reposent ici et entreposent leurs matériaux avant qu'une nouvelle salle ne soit mise en chantier."
deDE = "Die Bauhütte der Baumeister. Handwerker ruhen sich hier aus und lagern ihre Materialien, bevor eine neue Halle mit dem Bau beginnt."
plPL = "Dom budowniczych. Rzemieślnicy odpoczywają tutaj i gromadzą materiały, zanim zostanie rozpoczęta budowa nowej hali."
ptBR = "O alojamento dos construtores. Os artesãos descansam aqui e organizam seus materiais antes que um novo salão seja iniciado."
koKR = "건축가 오두막. 장인들이 이곳에서 쉬며, 새로운 전당의 기초 공사가 시작되기 전에 자재를 미리 준비해 둡니다."
trTR = "Inşaatçılar kulübesi. Zanaatkârlar burada dinlenir ve yeni bir salon temeli atılmadan önce malzemelerini burada hazırlar."
esES = "El refugio de los constructores. Los artesanos descansan aquí y preparan sus materiales antes de que se levante una nueva sala."
itIT = "La casa dei costruttori. Qui riposano gli artigiani e preparano i materiali prima che una nuova sala venga costruita."
ukUA = "Осередок будівельників. Тут відпочивають ремісники та готують матеріали, перш ніж почнеться будівництво нової зали."
thTH = "ที่พักของช่างก่อสร้าง ช่างฝีมือพักผ่อนที่นี่และจัดเตรียมวัสดุก่อนที่อาคารหลังใหม่จะเริ่มก่อสร้าง"
csCZ = "Stavitelská chata. Řemeslníci zde odpočívají a připravují materiál, než se položí základy nové síně."
viVN = "Nhà nghỉ của thợ xây. Các thợ thủ công nghỉ ngơi ở đây và chuẩn bị vật liệu trước khi một đại sảnh mới được khởi công."
caES = "La cabana dels constructors. Els artesans hi descansen i preparen els seus materials abans que comenci la construcció d'un nou saló."
beBY = "Дом будаўнікоў. Рамеснікі адпачываюць тут і складаюць свае матэрыялы, перш чым пачаць будаўніцтва новай залы."
roRO = "Casa constructorilor. Meșteșugarii se odihnesc aici și își depozitează materialele înainte ca o nouă sală să fie ridicată."
huHU = "A építők szálláshelye. Az iparosok itt pihennek, és itt készítik elő az anyagokat, mielőtt egy új csarnok alapjait lerakják."
arSA = "بيت البنّائين. يستريح فيه الحرفيون ويُخزّنون موادهم هنا قبل أن تُبدأ أعمال تشييد قاعة جديدة."

