["Good.SpiritTea.Description"]
status = "normal"
raw = "A smooth spirit fluid; quenches thirst, lends a little cultivation insight, and is used in elixirs."
enUS = "A smooth spirit fluid that quenches thirst, lends a little cultivation insight, and is used in elixirs."
zhCN = "顺滑的灵泉之液；可解渴，略微增进修行感悟，并可用于炼制丹药。"
zhTW = "順滑的靈液；能解渴，帶來些許修煉感悟，也可用於煉製丹藥。"
ruRU = "Гладкий духовный напиток; утоляет жажду, немного открывает путь к совершенствованию и используется в эликсирах."
jaJP = "滑らかな霊液。喉の渇きを癒し、わずかな修行の悟りをもたらし、霊薬の材料にもなる。"
frFR = "Un fluide spirituel onctueux ; il étanche la soif, apporte un peu d'intuition sur la culture et entre dans la composition d'élixirs."
deDE = "Eine glatte Geistflüssigkeit; stillt den Durst, verleiht etwas Einsicht in die Kultivierung und wird in Elixieren verwendet."
plPL = "Gładki duchowy płyn; gasi pragnienie, daje odrobinę wglądu w praktykę cultivation i służy do wytwarzania eliksirów."
ptBR = "Um fluido espiritual suave; sacia a sede, oferece um pouco de intuição sobre o cultivo e é usado em elixires."
koKR = "부드러운 영혼의 액체로, 갈증을 해소하고 수련에 약간의 깨달음을 더해 주며 영약을 만드는 데 쓰입니다."
trTR = "Pürüzsüz bir ruh sıvısı; susuzluğu giderir, biraz ekin yetiştirme içgörüsü kazandırır ve iksirlerde kullanılır."
esES = "Un fluido espiritual suave; calma la sed, otorga un poco de comprensión del cultivo y se usa en elixires."
itIT = "Un fluido spirituale morbido; placa la sete, offre un po' di comprensione della coltivazione e viene usato negli elisir."
ukUA = "Гладка духовна рідина; втамовує спрагу, трохи відкриває розуміння культивації та використовується в еліксирах."
thTH = "น้ำวิญญาณที่ลื่นนุ่ม ช่วยดับกระหาย ให้ความเข้าใจในการบำเพ็ญเพียรเล็กน้อย และใช้ในการปรุงยาอายุวัฒนะ"
csCZ = "Hladká duchovní tekutina; utišuje žízeň, propůjčuje malý vhled do kultivace a používá se v elixírech."
viVN = "Một loại linh dịch mượt mà; giải khát, mang lại chút hiểu biết nhỏ về tu luyện, và được dùng trong đan dược."
caES = "Un fluid espiritual suau; calma la set, dona una mica d'intuïció sobre el cultiu i s'utilitza en elixirs."
beBY = "Гладкая духоўная вадкасць; гасіць смагу, трохі дапамагае ў культываванні і выкарыстоўваецца ў эліксірах."
roRO = "O băutură spirituală fină, care potolește setea, oferă puțină înțelegere a cultivării și este folosită în elixire."
huHU = "Egy sima szellemi folyadék; csillapítja a szomjat, kis mértékben elősegíti a művelési bölcsesség elmélyülését, és elixírekben használják."
arSA = "سائل روحي ناعم؛ يُطفئ العطش، ويمنح قدرًا يسيرًا من البصيرة في الزراعة والتهذيب، ويُستخدم في الإكسيرات."

