["Building.Spiritveil.DanceHall.Description"]
status = "normal"
raw = "The disciples' meditation hall. A hundred hours of stillness earns Foundation Establishment; twenty can sit at once."
enUS = "The disciples' meditation hall. A hundred hours of stillness earns Foundation Establishment; twenty can sit at once."
zhCN = "弟子冥想堂。静坐百个时辰即可结成筑基；同时可容纳二十人打坐。"
zhTW = "弟子的冥想殿。靜坐一百小時即可晉升築基；可同時容納二十人就座。"
ruRU = "Зал медитации последователей. Сто часов полной неподвижности дают достижение «Основание установлено»; одновременно здесь могут сидеть двадцать человек."
jaJP = "弟子たちの瞑想場。百時間の静座で基礎確立を得られ、同時に二十名が座ることができる。"
frFR = "Le hall de méditation des disciples. Cent heures de immobilité permettent d'obtenir la Fondation établie ; vingt peuvent s'y asseoir en même temps."
deDE = "Die Meditationshalle der Jünger. Hundert Stunden stiller Versenkung führen zur Gründung der Grundlage; zwanzig können gleichzeitig darin sitzen."
plPL = "Sala medytacji uczniów. Sto godzin bezruchu daje Założenie Fundacji; jednocześnie może siedzieć dwudziestu."
ptBR = "O salão de meditação dos discípulos. Cem horas de quietude concedem a Fundação Estabelecida; vinte podem sentar-se ao mesmo tempo."
koKR = "제자들의 명상당. 백 시간의 고요한 수련을 하면 기초 확립 단계에 이르며, 동시에 스무 명이 앉을 수 있다."
trTR = "Müridlerin meditasyon salonu. Yüz saatlik sessizlik Temel Kuruluşu sağlar; aynı anda yirmi kişi oturabilir."
esES = "El salón de meditación de los discípulos. Cien horas de quietud otorgan el Establecimiento de la Fundación; pueden sentarse veinte a la vez."
itIT = "La sala di meditazione dei discepoli. Cento ore di immobilità garantiscono la Fondazione dello Stabilimento; ne possono sedere venti alla volta."
ukUA = "Зал медитації учнів. Сто годин спокою дають Заснування Фундаменту; одночасно можуть сидіти двадцять."
thTH = "ห้องสมาธิของศิษย์ผู้ฝึกตน ต้องนั่งสงบนิ่งรวมกันหนึ่งร้อยชั่วโมงจึงจะได้ตั้งสำนักรากฐาน และนั่งพร้อมกันได้ยี่สิบตน"
csCZ = "Síň meditace učedníků. Sto hodin klidu odemkne Založení Základny; najednou se zde může posadit dvacet."
viVN = "Phòng thiền của các đệ tử. Một trăm giờ tĩnh lặng sẽ giúp thiết lập Nền tảng Tông môn; có thể chứa hai mươi đệ tử cùng lúc."
caES = "La sala de meditació dels deixebles. Cent hores d'quietud desbloquegen l'Establiment de la Fundació; només poden seure-hi vint alhora."
beBY = "Залу медытацыі вучняў. Сто гадзін спакою дазваляюць заснаваць Фундамент; адначасова тут могуць сесці дваццаць чалавек."
roRO = "Sala de meditație a discipolilor. O sută de ore de liniște aduc Înființarea Fundației; douăzeci pot sta în același timp."
huHU = "A tanítványok meditációs terme. Száz óra mozdulatlanság kell az Alapító Létesítmény feloldásához; egyszerre húsz fér bele."
arSA = "قاعة التأمل الخاصة بالتلاميذ. مئة ساعة من السكون تمنح تأسيس المؤسسة؛ ويمكن لعشرين جلوس فيها في الوقت نفسه."

