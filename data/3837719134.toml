["Building.Spiritveil.GoldenCoreCave.FlavorDescription"]
status = "normal"
raw = "Deep in the rock, the only light is your own."
enUS = "Deep in the rock, the only light is your own."
zhCN = "深岩之中，唯一的光亮来自你自己。"
zhTW = "深埋岩石之中，唯一的光亮來自你自身。"
ruRU = "Глубоко в скале единственный свет — тот, что исходит от тебя самого."
jaJP = "深い岩盤の中では、頼れる光は自分自身の光だけだ。"
frFR = "Au fond de la roche, la seule lumière est la vôtre."
deDE = "Tief im Fels ist das einzige Licht dein eigenes."
plPL = "Głęboko w skale jedynym źródłem światła jesteś ty sam."
ptBR = "Nas profundezas da rocha, a única luz é a sua própria."
koKR = "바위 깊숙한 곳, 유일한 빛은 자기 자신의 빛뿐이다."
trTR = "Derin kayanın içinde, tek ışık kendi ışığındır."
esES = "En lo profundo de la roca, la única luz es la tuya."
itIT = "Nelle profondità della roccia, l'unica luce è la tua."
ukUA = "Глибоко в скелі єдине світло — твоє власне."
thTH = "ลึกลงไปในหิน แสงเดียวที่มีคือแสงจากตัวคุณเอง"
csCZ = "Hluboko v hornině je jediné světlo to vaše vlastní."
viVN = "Sâu trong lòng đá, ánh sáng duy nhất là ánh sáng của chính bạn."
caES = "Lluny dins la roca, l'única llum és la teva."
beBY = "Глыбока ў скале адзінае святло — тое, што ты сам нясеш."
roRO = "Adânc în stâncă, singura lumină este cea pe care o porți tu însuți."
huHU = "A sziklák mélyén az egyetlen fény a saját fényed."
arSA = "في أعماق الصخر، لا ضوء سوى ضوئك أنت."

["Building.Spiritveil.GolemFactory.Description"]
status = "normal"
raw = "Modelled on the golem assembler. Switch recipes to forge Wood Golems from golem parts, spirit wood and spirit fluid, or Iron Golems from parts, spirit iron, immortal fluid and immortal gears."
enUS = "Modeled on the golem assembler. Switch recipes to forge Wood Golems from golem parts, spirit wood, and spirit fluid, or Iron Golems from parts, spirit iron, immortal fluid, and immortal gears."
zhCN = "以傀儡组装器为原型。切换配方，可用傀儡部件、灵木和灵液锻造木傀儡，或用傀儡部件、灵铁、不朽灵液和不朽齿轮锻造铁傀儡。"
zhTW = "模仿傀儡組裝機。切換配方，可用傀儡零件、靈木與靈液製作木傀儡，或用零件、靈鐵、不朽靈液與不朽齒輪製作鐵傀儡。"
ruRU = "Создан по образцу сборщика големов. Переключайте рецепты, чтобы ковать деревянных големов из частей големов, духовной древесины и духовной жидкости или железных големов из частей, духовного железа, бессмертной жидкости и бессмертных шестерён."
jaJP = "モデルは傀儡組立機。レシピを切り替えると、ゴーレムの部品、霊木、霊液から木製ゴーレムを、部品、霊鉄、不滅の液体、不滅の歯車から鉄製ゴーレムを鍛造できます。"
frFR = "Modélisé sur l'assembleur de golems. Changez les recettes pour forger des golems de bois à partir de parties de golem, de bois spirituel et de fluide spirituel, ou des golems de fer à partir de parties, de fer spirituel, de fluide immortel et d'engrenages immortels."
deDE = "Nach dem Vorbild des Golem-Montierers. Wechsle die Rezepte, um Holzgolems aus Golemteilen, Geisterholz und Geistflüssigkeit oder Eisengolems aus Teilen, Geisteseisen, unsterblicher Flüssigkeit und unsterblichen Zahnrädern zu fertigen."
plPL = "Wzorowany na montowni golemów. Przełączaj receptury, aby wytwarzać Drewnianych Golemów z części golemów, duchowego drewna i duchowego płynu, albo Żelaznych Golemów z części, duchowego żelaza, nieśmiertelnego płynu i nieśmiertelnych kół zębatych."
ptBR = "Modelado com base no montador de golems. Alterne as receitas para forjar Golems de Madeira a partir de partes de golem, madeira espiritual e fluido espiritual, ou Golems de Ferro a partir de partes, ferro espiritual, fluido imortal e engrenagens imortais."
koKR = "Golem assembler를 본떠 만들었습니다. 레시피를 전환하여 golem parts, spirit wood, spirit fluid로 Wood Golem을 만들거나, parts, spirit iron, immortal fluid, immortal gears로 Iron Golem을 만듭니다."
trTR = "Golem montajcısı baz alınmıştır. Tarifleri değiştirerek golem parçalarından, ruhsal ağaçtan ve ruhsal sıvıdan Ahşap Golemler; parçalardan, ruhsal demirden, ölümsüz sıvıdan ve ölümsüz dişlilerden ise Demir Golemler üretin."
esES = "Modelado a partir del ensamblador de gólems. Cambia las recetas para forjar gólems de madera a partir de partes de gólem, madera espiritual y fluido espiritual, o gólems de hierro a partir de partes, hierro espiritual, fluido inmortal y engranajes inmortales."
itIT = "Modellato sull'assemblatore di golem. Cambia le ricette per forgiare Golem di Legno a partire da parti di golem, legno spirituale e fluido spirituale, oppure Golem di Ferro a partire da parti, ferro spirituale, fluido immortale e ingranaggi immortali."
ukUA = "Змодельовано за зразком складальника големів. Перемикайте рецепти, щоб виготовляти Дерев'яних големів із деталей големів, духовної деревини та духовної рідини або Залізних големів із деталей, духовного заліза, безсмертної рідини та безсмертних шестерень."
thTH = "ดัดแปลงจากโรงประกอบโกเลม สลับสูตรการผลิตเพื่อหลอมโกเลมไม้จากชิ้นส่วนโกเลม ไม้วิญญาณ และของเหลววิญญาณ หรือโกเลมเหล็กจากชิ้นส่วน เหล็กวิญญาณ ของเหลวอมตะ และเฟืองอมตะ"
csCZ = "Vychází z montážní dílny golemů. Přepínáním receptů lze vyrábět dřevěné golemy z částí golemů, duchovního dřeva a duchovní tekutiny, nebo železné golemy z částí, duchovního železa, nesmrtelné tekutiny a nesmrtelných ozubených kol."
viVN = "Được mô phỏng theo xưởng lắp ráp golem. Chuyển đổi công thức để chế tạo Golem Gỗ từ linh kiện golem, gỗ linh và linh dịch, hoặc Golem Sắt từ linh kiện, linh sắt, bất tử dịch và bánh răng bất tử."
caES = "Modelat a partir de l'assemblador de gòlems. Canvia les receptes per forjar gòlems de fusta a partir de peces de gòlem, fusta espiritual i fluid espiritual, o gòlems de ferro a partir de peces, ferro espiritual, fluid immortal i engranatges immortals."
beBY = "Створана па ўзоры зборшчыка галемаў. Пераключайце рэцэпты, каб ковать драўляных галемаў з часткі галема, духоўнай драўніны і духоўнай вадкасці або жалезных галемаў з часткі, духоўнага жалеза, бессмяротнай вадкасці і бессмяротных шасцярэнь."
roRO = "Modelat după asamblorul de golemi. Schimbă rețetele pentru a forja Golemi de lemn din piese de golem, lemn spiritual și fluid spiritual, sau Golemi de fier din piese, fier spiritual, fluid nemuritor și roți dințate nemuritoare."
huHU = "A golem-összeszerelő mintájára készült. Váltson receptet, hogy Fa Golemeket készítsen golemalkatrészekből, szellemfából és szellemfolyadékból, vagy Vas Golemeket alkatrészekből, szellemvasból, halhatatlan folyadékból és halhatatlan fogaskerekekből."
arSA = "نموذج مستوحى من مجمّع الغولم. بدّل الوصفات لصنع غولم خشبي من أجزاء الغولم وخشب الروح وسائل الروح، أو غولم حديدي من الأجزاء وحديد الروح وسائل الخلود وتروس الخلود."

