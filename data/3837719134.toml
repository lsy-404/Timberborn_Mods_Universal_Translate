["Building.Spiritveil.Dam.Description"]
status = "normal"
raw = "Holds the stream back into a pool - storing water, and with it a whole dry season's peace of mind."
enUS = "Holds the stream back into a pool, storing water and with it a whole dry season's peace of mind."
zhCN = "拦住溪流形成水池，蓄水储存，也让人在整个旱季都能安心。"
zhTW = "攔住溪流形成水池，儲存水源，讓整個旱季都能安心無虞。"
ruRU = "Удерживает поток в заводи — накапливает воду и вместе с ней целый засушливый сезон спокойствия."
jaJP = "流れを堰き止めて池にし、水を蓄える。乾季をまるごと乗り切れる安心感をもたらすものだ。"
frFR = "Retient le cours d'eau dans un bassin, stockant l'eau et, avec elle, toute la tranquillité d'esprit d'une saison sèche."
deDE = "Hält den Bach zu einem Becken zurück – speichert Wasser und damit für eine ganze Trockenzeit die Gewissheit, dass alles in Ordnung ist."
plPL = "Zatrzymuje strumień w zbiorniku, magazynując wodę, a wraz z nią spokój ducha na całą suchą porę roku."
ptBR = "Segura a correnteza formando um lago - armazenando água e, com ela, a tranquilidade de uma estação seca inteira."
koKR = "개울물을 가둬 웅덩이로 만들고, 물을 저장합니다. 그리고 그 물과 함께 건조한 계절 한 철 동안의 안심도 함께 저장합니다."
trTR = "Akıntıyı bir havuzda tutar; suyu depolar ve böylece kuru bir mevsim boyunca tam bir huzur sağlar."
esES = "Retiene la corriente formando un estanque: almacena agua y, con ella, la tranquilidad de toda una temporada seca."
itIT = "Trattiene il corso d'acqua formando una pozza: immagazzina l'acqua e, con essa, la tranquillità di un'intera stagione secca."
ukUA = "Утримує течію в басейні, накопичуючи воду, а разом із нею й спокій на цілу суху пору року."
thTH = "กั้นลำธารให้กลายเป็นบ่อน้ำ เก็บกักน้ำไว้ และมอบความอุ่นใจให้ตลอดฤดูแล้งทั้งฤดู"
