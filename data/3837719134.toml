thTH = "ก่อนจะรุกคืบไปข้างหน้าได้ คุณต้องยืนหยัดในตำแหน่งของตนให้มั่นคงเสียก่อน"
csCZ = "Musíš nejdřív udržet své postavení, teprve potom můžeš postoupit."
viVN = "Bạn phải giữ vững lập trường trước khi có thể tiến lên."
