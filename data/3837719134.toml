["Building.Spiritveil.FoundationCave.FlavorDescription"]
status = "normal"
raw = "The door closes, and the world stops asking anything of you."
enUS = "The door closes, and the world stops asking anything of you."
zhCN = "门关上了，世界不再向你索取任何东西。"
zhTW = "門關上了，世界不再要求你做任何事。"
ruRU = "Дверь закрывается, и мир перестаёт что-либо требовать от тебя."
jaJP = "扉が閉まり、世界はもうあなたに何も求めなくなる。"
frFR = "La porte se referme, et le monde cesse de rien exiger de vous."
deDE = "Die Tür schließt sich, und die Welt verlangt nichts mehr von dir."
plPL = "Drzwi się zamykają, a świat przestaje czegokolwiek od ciebie wymagać."
ptBR = "A porta se fecha, e o mundo deixa de exigir qualquer coisa de você."
koKR = "문이 닫히면, 세상은 더 이상 당신에게 아무것도 요구하지 않는다."
trTR = "Kapı kapanır ve dünya artık senden hiçbir şey istemez."
esES = "La puerta se cierra y el mundo deja de exigirte nada."
itIT = "La porta si chiude e il mondo smette di chiederti qualsiasi cosa."
ukUA = "Двері зачиняються, і світ перестає чогось вимагати від тебе."
thTH = "ประตูปิดลง และโลกนี้ก็หยุดเรียกร้องอะไรจากคุณเสียที"
csCZ = "Dveře se zavřou a svět od tebe přestane cokoli požadovat."
viVN = "Cánh cửa khép lại, và thế giới không còn đòi hỏi gì ở bạn nữa."
caES = "La porta es tanca, i el món deixa de demanar-te res."
beBY = "Дзверы зачыняюцца, і свет перастае ад цябе чагосьці патрабаваць."
roRO = "Ușa se închide, iar lumea încetează să mai ceară ceva de la tine."
huHU = "A kapu becsukódik, és a világ nem követel tőled többé semmit."
arSA = "ينغلق الباب، ويتوقف العالم عن مطالبتك بأي شيء."

["Building.Spiritveil.FountainOfJoy.Description"]
status = "normal"
raw = "Living water rises in the basin; drink, and the day's troubles wash off. Meditate beside it to slowly bank Foundation progress."
enUS = "Living water rises in the basin; drink, and the day's troubles wash off. Meditate beside it to slowly bank Foundation progress."
zhCN = "灵泉在池中涌起；饮之，则日间烦忧尽消。于其旁打坐冥想，可缓缓积累\"奠基\"进度。"
zhTW = "靈泉在池中湧動；飲用後，一日的煩憂盡數洗去。在其旁冥想，可緩慢累積「奠基」進度。"
ruRU = "Живая вода поднимается в чаше; сделайте глоток, и заботы дня смоются. Медитация рядом с ней медленно пополняет прогресс Основания."
jaJP = "生命の水が泉の窪地に湧き上がる。飲めば一日の苦労が洗い流される。そのそばで瞑想すると、基礎の進捗がゆっくりと蓄えられていく。"
frFR = "L'eau vivante jaillit dans le bassin ; buvez-la, et les soucis de la journée s'effacent. Méditez à ses côtés pour faire progresser lentement la Fondation."
deDE = "Lebendiges Wasser steigt im Becken empor; trinkt man davon, spülen sich die Sorgen des Tages fort. Wer daneben meditiert, bringt den Fortschritt der Grundlage langsam voran."
plPL = "Żywa woda wypływa z misy; napij się, a dzienne kłopoty spłyną. Medytuj obok niej, by powoli zwiększać postęp Fundamentu."
ptBR = "A água viva sobe na bacia; beba, e os problemas do dia são levados embora. Medite ao seu lado para acumular progresso de Fundação aos poucos."
koKR = "살아 있는 물이 웅덩이에서 솟아오릅니다. 마시면 하루의 근심이 씻겨 내려갑니다. 그 곁에서 명상하면 기반 진행도가 천천히 쌓입니다."
trTR = "Havuzda canlı su yükselir; için, günün dertleri akıp gitsin. Yanında meditasyon yaparak Temel ilerlemesini yavaşça biriktirin."
esES = "El agua viva brota en la pileta; bebe y las preocupaciones del día se lavarán. Medita junto a ella para acumular lentamente progreso en la Fundación."
itIT = "L'acqua viva sale nel bacino; bevila e le preoccupazioni della giornata si lavano via. Meditare accanto ad essa fa progredire lentamente l'avanzamento delle Fondamenta."
ukUA = "Жива вода піднімається в чаші; випий її, і клопоти дня змиються. Медитуй поруч із нею, щоб повільно накопичувати прогрес Основи."
thTH = "น้ำวิเศษจะผุดขึ้นในอ่างน้ำ ดื่มแล้วความทุกข์ของวันนั้นจะถูกชะล้างไป นั่งสมาธิอยู่ข้างน้ำพุจะค่อย ๆ เพิ่มความคืบหน้าของ Foundation"
csCZ = "Živá voda stoupá v nádrži; napij se a denní starosti z tebe opadnou. Meditace u ní postupně zvyšuje pokrok u Základů."
viVN = "Nước linh thiêng dâng lên trong bồn; uống vào, mọi phiền muộn của ngày sẽ trôi đi. Thiền định bên cạnh để tích lũy tiến độ Nền tảng từ từ."
caES = "L'aigua viva brolla a la conca; beu-la i les preocupacions del dia s'esvaeixen. Medita al seu costat per fer avançar a poc a poc el progrés de la Fundació."
beBY = "Жывая вада ўздымаецца ў басейне; напіцеся — і клопаты дня смываюцца. Медытуйце побач з ёй, каб павольна набліжаць прагрэс «Асновы»."
roRO = "Apa vie se ridică în bazin; bea din ea și necazurile zilei se spală. Meditează lângă ea pentru a acumula treptat progresul Fundației."
huHU = "A living water a medencében emelkedik; igyál belőle, és a nap gondjai lemosódnak. Mellette meditálva lassan gyarapíthatod az Alapítás haladását."
arSA = "المياه الروحية تنبع في الحوض؛ اشرب منها فتغسل عنك متاعب اليوم. وتأمّل بجوارها لتراكم تقدّم «التأسيس» ببطء."

