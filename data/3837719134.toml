["Building.Spiritveil.ThunderPool.Description"]
status = "normal"
raw = "A Golden Core disciple sits while mechanical arms draw lightning through them: 720 hours to reach Mahayana. Needs 300 hp."
enUS = "A Golden Core disciple sits while mechanical arms draw lightning through them: 720 hours to reach Mahayana. Needs 300 hp."
zhCN = "金丹弟子端坐其中，机械臂将雷电引导穿过其身：需720小时方可臻至大乘。需要300 hp。"
zhTW = "一名金丹弟子端坐其中，機械臂將雷電引過其身：720 小時即可修至大乘。需要 300 hp。"
ruRU = "Ученица ранга Золотого ядра сидит, пока механические руки пропускают через неё молнии: 720 часов до достижения Махаяны. Требуется 300 hp."
jaJP = "金丹期の弟子が座したまま、機械の腕で雷を体に通している。大乗期に至るまで720時間。300 hpが必要。"
frFR = "Un disciple du Noyau d'Or est assis pendant que des bras mécaniques font passer la foudre à travers lui : 720 heures pour atteindre le Mahayana. Nécessite 300 hp."
deDE = "Ein Jünger der Goldenen Kern-Stufe sitzt, während mechanische Arme Blitze durch ihn leiten: 720 Stunden bis zum Erreichen von Mahayana. Benötigt 300 hp."
plPL = "Uczeń Złotego Jądra siedzi, podczas gdy mechaniczne ramiona przeciągają przez niego błyskawice: 720 godzin do osiągnięcia Mahajany. Wymaga 300 hp."
ptBR = "Um discípulo do Núcleo Dourado fica sentado enquanto braços mecânicos canalizam relâmpagos através dele: 720 horas para alcançar Mahayana. Requer 300 hp."
koKR = "A Golden Core 제자가 앉아 있는 동안 기계 팔이 그들을 통해 번개를 끌어들인다: 마하야나에 도달하려면 720시간이 필요하다. 300 hp가 필요하다."
trTR = "Bir Altın Çekirdek müridi, mekanik kollar içinden yıldırım çekerken oturur: Mahayana'ya ulaşmak için 720 saat. 300 hp gerektirir."
esES = "A discípulo del Núcleo Dorado se sienta mientras brazos mecánicos hacen pasar relámpagos por su cuerpo: 720 horas para alcanzar Mahayana. Necesita 300 hp."
itIT = "Un discepolo del Nucleo d'Oro siede mentre dei bracci meccanici fanno scorrere fulmini attraverso di lui: 720 ore per raggiungere il Mahayana. Richiede 300 hp."
ukUA = "Учень Золотого ядра сидить, поки механічні руки пропускають крізь нього блискавку: 720 годин до досягнення Махаяни. Потребує 300 hp."
thTH = "ศิษย์ขั้น Golden Core นั่งอยู่ขณะที่แขนกลดึงสายฟ้าผ่านร่างกาย ใช้เวลา 720 ชั่วโมงเพื่อไปถึงขั้น Mahayana ต้องการ 300 hp"
csCZ = "Zlatý zárodečný učedník sedí, zatímco mechanická ramena jím táhnou blesky: 720 hodin k dosažení Mahájány. Vyžaduje 300 hp."
viVN = "Một đệ tử Kim Đan ngồi yên trong khi các cánh tay cơ khí dẫn sấm sét chạy qua người: cần 720 giờ để đạt đến Đại Thừa. Cần 300 hp."
caES = "Un deixeble del Nucli d'Or s'asseu mentre braços mecànics fan passar el llamp a través seu: 720 hores per arribar a Mahayana. Necessita 300 hp."
beBY = "Адэпт узроўню Залатога Ядра сядзіць, пакуль механічныя рукі прапускаюць праз яго маланку: 720 гадзін да дасягнення Махаяны. Патрабуе 300 hp."
roRO = "Un discipol din Golden Core stă așezat în timp ce brațe mecanice trag fulgere prin el: 720 de ore până ajunge la Mahayana. Necesită 300 hp."
huHU = "Egy Arany Mag tanítvány ül, miközben mechanikus karok villámot vezetnek át rajta: 720 óra a Mahájána eléréséhez. 300 hp szükséges."
arSA = "يجلس تلميذ من طائفة النواة الذهبية بينما تسحب أذرع ميكانيكية البرق عبره: 720 ساعة للوصول إلى مرحلة ماهايانا. يحتاج إلى 300 hp."

