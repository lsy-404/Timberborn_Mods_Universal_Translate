["Building.Spiritveil.SectArray.Description"]
status = "normal"
raw = "A rune-carved formation shielding the whole gate. Once built: +5 percentage points to every breakthrough and +1% cultivation speed map-wide (the same building counts only once)."
enUS = "A rune-carved formation shielding the whole gate. Once built: +5 percentage points to every breakthrough and +1% cultivation speed map-wide (the same building counts only once)."
