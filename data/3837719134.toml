trTR = "Küçük olduğu için gözden kaçabilir, ama tarlaları yeşil tutmakta inatçıdır."
esES = "Lo bastante pequeño como para pasarlo por alto, pero lo bastante terco como para mantener los campos verdes."
itIT = "Abbastanza piccolo da passare inosservato, abbastanza ostinato da mantenere verdi i campi."
ukUA = "Достатньо малий, щоб його не помітити, і достатньо впертий, щоб поля лишалися зеленими."
thTH = "เล็กจนมองข้ามได้ แต่ดื้อพอจะทำให้ทุ่งนาเขียวขจีอยู่เสมอ"
csCZ = "Dost malý na to, aby si ho člověk všiml, ale dost tvrdohlavý na to, aby pole udržel zelená."
viVN = "Nhỏ đến mức dễ bị bỏ qua, nhưng cứng đầu đủ để giữ cho cánh đồng luôn xanh tươi."
caES = "Petit o prou per passar desapercebut, però prou tossut per mantenir els camps verds."
beBY = "Невялікі, каб яго не заўважылі, але ўпартыя, каб палі заставаліся зялёнымі."
roRO = "Destul de mică pentru a fi trecută cu vederea, dar destul de încăpățânată ca să țină câmpurile verzi."
huHU = "Elég kicsi ahhoz, hogy észrevétlen maradjon, és elég makacs ahhoz, hogy a mezők zöldek maradjanak."
arSA = "صغير بما يكفي لأن يُغفل عنه، وعنيد بما يكفي للحفاظ على خضرة الحقول."

["Building.Spiritveil.ContaminationSensor.Description"]
status = "normal"
