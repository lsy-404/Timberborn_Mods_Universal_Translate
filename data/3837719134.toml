["Building.Spiritveil.FarmerMonument.Description"]
status = "normal"
raw = "Honours generations of farmer-cultivators and urges those who follow to keep at it. Meditate inside to slowly bank Qi Refining progress."
enUS = "Honors generations of farmer-cultivators and urges those who follow to keep at it. Meditate inside to slowly bank Qi Refining progress."
zhCN = "致敬一代代农耕修士，并勉励后来者坚持修行。在内部冥想可缓慢积累炼气进度。"
zhTW = "致敬世世代代的農耕修士，並勉勵後人持續修行。於室內冥想，可緩慢累積煉氣進度。"
ruRU = "Чтит поколения фермеров-культиваторов и призывает последователей не сдаваться. Медитация внутри здания медленно накапливает прогресс в очищении Ци."
jaJP = "農耕修行者の世代を称え、後に続く者にも修行を続けるよう促す。内部で瞑想すると、練気の進捗をゆっくりと蓄えられる。"
frFR = "Rend hommage à des générations de cultivateurs-agriculteurs et encourage ceux qui suivent à persévérer. Méditez à l'intérieur pour accumuler lentement les progrès du Raffinage du Qi."
deDE = "Ehrt Generationen von Bauern-Kultivierenden und ermutigt alle Nachfolgenden, weiterzumachen. Meditiere im Inneren, um den Fortschritt bei der Qi-Verfeinerung langsam anzusammeln."
plPL = "Czci pokolenia rolników-uprawiaczy i zachęca następców, by wytrwali. Medytuj w środku, aby powoli zwiększać postęp w Rafinacji Qi."
ptBR = "Homenageia gerações de agricultores-cultivadores e incentiva os que vierem depois a continuar nessa jornada. Medite dentro dele para acumular progresso no Refinamento de Qi de forma gradual."
koKR = "농부-수련자 세대를 기리며, 뒤따르는 이들에게 수련을 계속하라고 독려합니다. 건물 안에서 명상하면 기 연마(Qi Refining) 진행도가 천천히 쌓입니다."
trTR = "Çiftçi-kültivatörlerin nesillerine saygı duyar ve ardından gelenleri pes etmemeye çağırır. İçeride meditasyon yaparak Qi Rafinasyonu ilerlemesini yavaş yavaş biriktirin."
esES = "Honra a generaciones de agricultores-cultivadores e insta a quienes les sigan a seguir perseverando. Medita en su interior para acumular progreso en el Refinamiento de Qi de forma lenta y constante."
itIT = "Onora generazioni di coltivatori agricoli e incoraggia chi verrà dopo a perseverare. Medita all'interno per accumulare lentamente progressi nel Raffinamento del Qi."
ukUA = "Вшановує покоління фермерів-культиваторів і закликає тих, хто йде за ними, не здаватися. Медитуйте всередині, щоб поступово накопичувати прогрес очищення Ци."
thTH = "ให้เกียรติแก่หลายชั่วอายุของผู้บำเพ็ญเพาะปลูก และกระตุ้นให้ผู้ที่มาภายหลังมุ่งมั่นต่อไป ทำสมาธิภายในอาคารเพื่อสะสมความคืบหน้าในการกลั่นชี่ทีละน้อย"
csCZ = "Ctí generace zemědělců-pěstitelů a vybízí ty, kdo přijdou po nich, aby v tom pokračovali. Meditací uvnitř pomalu zvyšují pokrok v Rafinaci Qi."
viVN = "Tôn vinh nhiều thế hệ tu luyện viên canh nông và khuyến khích những người đi sau tiếp tục kiên trì. Hãy thiền định bên trong để tích lũy tiến độ Luyện Khí từ từ."
caES = "Honora generacions de conreadors-cultivadors i encoratja els qui segueixin a perseverar. Medita a l'interior per acumular progrés de Refinament del Qi a poc a poc."
beBY = "Ушаноўвае пакаленні фермераў-культываторов і заклікае тых, хто ідзе следам, не спыняцца. Медытуйце ўнутры, каб павольна накопліваць прагрэс ачышчэння Ці."
roRO = "Onorează generații de cultivatori-fermieri și îi îndeamnă pe cei ce vor urma să persevereze. Meditează înăuntru pentru a acumula treptat progres în Rafinarea Qi-ului."
huHU = "Tiszteli a gazdálkodó-kultivátorok nemzedékeit, és arra biztatja az utódokat, hogy kitartsanak. Bent meditálva lassan növelheti a Qi-finomítás fejlődését."
arSA = "يُكرّم أجيال المزارعين-المُزارعين الروحانيين ويحثّ من يأتي بعدهم على المواصلة. تأمّل داخله لتراكم تقدّم تكرير الqi ببطء."

