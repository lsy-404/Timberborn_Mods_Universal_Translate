["Building.Spiritveil.EarthRepopulator.Description"]
status = "normal"
raw = "The sect's only wonder. Haul 1500 Immortal Planks, 1500 Immortal Wood and 1500 Immortal Gears into the Altar's own inventory - district stock does not count - staff all four golem-only jobs and keep an Immortal Emperor in the clan, then press Activate. It never ascends on its own."
enUS = "The sect's only wonder. Haul 1500 Immortal Planks, 1500 Immortal Wood and 1500 Immortal Gears into the Altar's own inventory - district stock does not count - staff all four golem-only jobs and keep an Immortal Emperor in the clan, then press Activate. It never ascends on its own."
zhCN = "宗门唯一的奇迹。将1500个仙木板、1500个仙木和1500个仙齿轮搬入祭坛自身的库存中（区域库存不计入），安排四种仅限傀儡的工作岗位全部配人，并在宗门中保有一位仙帝，然后按下激活。它不会自行飞升。"
zhTW = "宗門唯一的奇蹟。將 1500 個仙木板、1500 個仙木和 1500 個仙齒輪運入祭壇自身的庫存（區域庫存不計入），為全部四個傀儡專屬職位配置人手，並在族群中保有一位仙帝，然後按下啟動。它不會自行飛升。"
ruRU = "Единственное чудо секты. Перенесите 1500 Бессмертных досок, 1500 Бессмертной древесины и 1500 Бессмертных шестерён во собственный инвентарь Алтаря — запасы района не учитываются — укомплектуйте все четыре работы, доступные только големам, и удерживайте в клане Бессмертного императора, затем нажмите «Активировать». Он никогда не вознесётся сам по себе."
jaJP = "祖師の唯一の奇跡。1500個の不滅の板材、1500個の不滅の木材、1500個の不滅の歯車を祭壇自身の在庫に運び込み（地区の在庫は数えない）、ゴーレム専用の四つの職業すべてに人員を配置し、クランに不滅の皇帝を留めてから「起動」を押す。自力で昇天することはない。"
frFR = "La seule merveille de la secte. Transportez 1500 Planches immortelles, 1500 Bois immortel et 1500 Engrenages immortels directement dans l'inventaire propre de l'Autel ; les stocks du district ne comptent pas. Affectez du personnel aux quatre emplois réservés aux golems et gardez un Empereur immortel dans le clan, puis appuyez sur Activer. Il n'ascensionne jamais de lui-même."
deDE = "Das einzige Wunder der Sekte. Bringe 1500 Unsterbliche Bretter, 1500 Unsterbliches Holz und 1500 Unsterbliche Zahnräder in das eigene Inventar des Altars – Lagerbestände in Distrikten zählen nicht – besetze alle vier golemspezifischen Arbeitsstellen und halte einen Unsterblichen Kaiser im Clan, und drücke dann auf Aktivieren. Er steigt niemals von selbst auf."
plPL = "Jedyny cud sekty. Przenieś 1500 Nieśmiertelnych Desek, 1500 Nieśmiertelnego Drewna i 1500 Nieśmiertelnych Przekładni do własnego magazynu Ołtarza – zapas dzielnicy się nie liczy – obsadź wszystkie cztery prace przeznaczone wyłącznie dla golemów i utrzymuj Nieśmiertelnego Cesarza w klanie, a następnie naciśnij Aktywuj. Nie wznosi się sam z siebie."
ptBR = "O único milagre da seita. Transporte 1500 Tábuas Imortais, 1500 Madeira Imortal e 1500 Engrenagens Imortais para o inventário do próprio Altar — o estoque do distrito não conta — designe trabalhadores para as quatro profissões exclusivas de golems e mantenha um Imperador Imortal no clã, depois pressione Ativar. Ele nunca ascende por conta própria."
koKR = "종파의 유일한 기적. 불멸의 널빤지 1500개, 불멸의 목재 1500개, 불멸의 톱니바퀴 1500개를 제단 자체의 창고로 운반하고 - 구역 재고는 포함되지 않음 - 골렘 전용 직업 네 개를 모두 배치한 뒤 씨족에 불멸의 황제를 유지한 다음 활성화를 누르십시오. 스스로 승천하는 일은 결코 없습니다."
trTR = "Bu mezhebin tek harikası. Altar'ın kendi envanterine 1500 Ölümsüz Tahta, 1500 Ölümsüz Kereste ve 1500 Ölümsüz Dişli taşıyın; bölge stoğu sayılmaz. Golemlere özel dört işin tamamına personel atayın ve klanda bir Ölümsüz İmparator tutun, ardından Etkinleştir'e basın. Kendiliğinden yükselmez."
esES = "El único prodigio de la secta. Transporta 1500 Tablones Inmortales, 1500 Madera Inmortal y 1500 Engranajes Inmortales al inventario propio del Altar (las existencias del distrito no cuentan), asigna personal a los cuatro empleos exclusivos de gólems y mantén un Emperador Inmortal en el clan; después pulsa Activar. Nunca asciende por sí solo."
itIT = "La meraviglia esclusiva della setta. Trasporta 1500 Assi Immortali, 1500 Legno Immortale e 1500 Ingranaggi Immortali nell'inventario dell'Altare stesso: le scorte del distretto non contano. Assegna personale a tutti e quattro i lavori riservati ai golem e mantieni un Imperatore Immortale nel clan, poi premi Attiva. Non ascende mai da solo."
ukUA = "Єдине чудо секти. Доставте 1500 Безсмертних дощок, 1500 Безсмертної деревини та 1500 Безсмертних шестерень до власного інвентаря Вівтаря — запаси округу не враховуються — призначте всіх чотирьох робітників, що працюють лише з големами, і утримуйте в клані Безсмертного Імператора, потім натисніть «Активувати». Вона ніколи не піднесеться сама."
thTH = "สิ่งมหัศจรรย์เพียงอย่างเดียวของนิกาย ขนแผ่นไม้อมตะ 1500 แผ่น ไม้อมตะ 1500 ชิ้น และเฟืองอมตะ 1500 ชิ้นเข้าไปในคลังของแท่นบูชาเอง โดยสต็อกของเขตไม่นับรวม จัดคนประจำงานเฉพาะหุ่นเชิดทั้งสี่ตำแหน่ง และให้มีจักรพรรดิอมตะอยู่ในตระกูล จากนั้นกดเปิดใช้งาน มันจะไม่ขึ้นสู่ระดับเซียนด้วยตัวเองเด็ดขาด"
csCZ = "Jediný zázrak sekty. Přenes 1500 Nesmrtelných prken, 1500 Nesmrtelného dřeva a 1500 Nesmrtelných ozubených kol do vlastního skladu Oltáře – zásoby okresu se nepočítají – obsaď všechna čtyři pracovní místa určená jen pro golemy a drž v klanu Nesmrtelného císaře, poté stiskni Aktivovat. Nevznese se sama od sebe."
viVN = "Kỳ quan duy nhất của tông môn. Hãy vận chuyển 1500 Ván Bất Tử, 1500 Gỗ Bất Tử và 1500 Bánh Răng Bất Tử vào kho riêng của Bàn Thờ (kho của khu không được tính), bố trí đủ nhân lực cho cả bốn công việc chỉ dành cho golem, và giữ một Bất Tử Đế Quân trong gia tộc, rồi nhấn Kích hoạt. Nó sẽ không tự phi thăng."
caES = "L'única meravella de la secta. Porteu 1500 Taulons Immortals, 1500 Fusta Immortal i 1500 Engranatges Immortals a l'inventari propi de l'Altar —l'estoc del districte no compta— ocupeu les quatre feines exclusives de golem i mantingueu un Emperador Immortal al clan, i després premeu Activa. Mai ascendeix per si sol."
beBY = "Адзіная цуда секты. Перанясіце 1500 Бессмяротных дошак, 1500 Бессмяротнай драўніны і 1500 Бессмяротных шасцярэнь у ўласны склад Алтара — склад раёна не ўлічваецца — прызначце працаўнікоў на ўсе чатыры працы, выключна для галемаў, і захавайце Бессмяротнага імператара ў клане, затым націсніце «Актываваць». Ён ніколі не ўзыходзіць сам."
roRO = "Singura minune a sectei. Transportă 1500 de Scânduri Nemuritoare, 1500 de Lemn Nemuritor și 1500 de Roți Dințate Nemuritoare direct în inventarul propriu al Altarului – stocul din district nu se numără – alocă toate cele patru locuri de muncă rezervate golemilor și păstrează un Împărat Nemuritor în clan, apoi apasă Activează. Nu se înalță niciodată de unul singur."
huHU = "A szekta egyetlen csodája. Vigyél 1500 Halhatatlan deszkát, 1500 Halhatatlan fát és 1500 Halhatatlan fogaskereket az Oltár saját készletébe – a körzeti készlet nem számít –, töltsd be mind a négy, kizárólag golemek által betölthető munkahelyet, és tartsd a klánban egy Halhatatlan Császárt, majd nyomd meg az Aktiválás gombot. Magától soha nem emelkedik fel."
arSA = "المعجزة الوحيدة للطائفة. انقل 1500 لوح خالد و1500 خشب خالد و1500 ترس خالد إلى مخزون المذبح الخاص به، فلا يُحتسب مخزون المنطقة. وظّف عاملين في الوظائف الأربع المخصصة للغولم وحدها، وأبقِ إمبراطورًا خالدًا في العشيرة، ثم اضغط على تفعيل. لا يرتقي من تلقاء نفسه أبدًا."

