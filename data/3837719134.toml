["Building.Spiritveil.PoleBanner.Description"]
status = "normal"
raw = "A banner pole flying the sect standard, snapping in the wind so the way home is never in doubt."
enUS = "A banner pole flying the sect standard, snapping in the wind so the way home is never in doubt."
zhCN = "一根旗杆，升起宗门旗帜，在风中猎猎作响，让归途始终清晰可辨。"
zhTW = "這根旗杆懸掛著宗門旗幟，隨風獵獵作響，讓回家的路永遠清晰可辨。"
ruRU = "Древко с знаменем секты, которое развевается на ветру, так что путь домой никогда не вызывает сомнений."
jaJP = "宗門の旗を掲げ、風にはためく旗竿。その音を頼りに、家路を見失うことはない。"
frFR = "Un mât de bannière arborant l'étendard de la secte, claquant au vent pour que le chemin du retour ne fasse jamais de doute."
deDE = "Ein Banner-Mast, der das Banner der Sekte zeigt und im Wind knattert, sodass der Weg nach Hause nie in Zweifel steht."
plPL = "Słup z proporcem, na którym łopocze sztandar sekty, trzepocze na wietrze, dzięki czemu droga do domu nigdy nie budzi wątpliwości."
ptBR = "Um mastro de bandeira com o estandarte da seita, tremulando ao vento para que o caminho de volta para casa nunca fique em dúvida."
koKR = "깃발을 휘날리는 종문 기치 장대입니다. 바람에 펄럭이는 소리가 들려, 집으로 가는 길을 잃을 일은 없습니다."
trTR = "Bir tarikat bayrağını dalgalandıran bir bayrak direği; rüzgârda çırpınarak eve giden yolun asla şüpheli olmamasını sağlar."
esES = "Un mástil de estandarte que ondea la bandera de la secta, chasqueando con el viento para que el camino de regreso nunca sea motivo de duda."
itIT = "Un palo con stendardo che sventola la bandiera della setta, schioccando al vento così che la via di casa non è mai in dubbio."
ukUA = "Древко з прапором, що несе стяг секти: він тріпоче на вітрі, тож дорогу додому ніколи не можна сплутати."
thTH = "เสาธงที่ชูธงประจำสำนัก สะบัดพลิ้วตามลม เพื่อให้เหล่าบีเวอร์ไม่มีวันหลงทางกลับบ้าน"
csCZ = "Stožár s praporem sekty vlaje a v poryvech větru šlehá, takže cesta domů nikdy není pochybná."
viVN = "Cột cờ treo cờ tông môn, phần phật trong gió để đường về nhà lúc nào cũng rõ ràng."
caES = "Un pal de bandera que ondeja l'estàndard de la secta, cruixint amb el vent perquè el camí de tornada mai no es posi en dubte."
beBY = "Сцяг на слупе з эмблемай секты, які калыхаецца на ветры, таму дарога дадому ніколі не застаецца пад сумнівам."
roRO = "Un stâlp cu stindard care flutură drapelul sectei, pocnind în vânt, ca drumul spre casă să nu fie niciodată un mister."
huHU = "A sárkány-zászlóhoz tartozó zászlórúd, amely a szélben csattogva mutatja a sekta jelvényét, így a hazaút sosincs kétségben."
arSA = "عمود راية يرفرف عليه شعار الطائفة، ويخفق مع الريح فلا يبقى أي شك في طريق العودة إلى الديار."

