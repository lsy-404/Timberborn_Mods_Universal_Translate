["Building.Spiritveil.Forester.FlavorDescription"]
status = "normal"
raw = "Plant now; the sect will thank you in sixty years."
enUS = "Plant now; the sect will thank you in sixty years."
zhCN = "现在种下，宗门会在六十年后感谢你。"
zhTW = "種下吧，宗門會在六十年後感謝你。"
ruRU = "Посадите сейчас, и секта скажет вам спасибо через шестьдесят лет."
jaJP = "今植えれば、六十年後に宗門があなたに感謝するでしょう。"
frFR = "Plantez dès maintenant ; la secte vous en remerciera dans soixante ans."
deDE = "Pflanze jetzt; die Sekte wird dir in sechzig Jahren danken."
plPL = "Posadź teraz; sekta podziękuje ci za sześćdziesiąt lat."
ptBR = "Plante agora; a seita vai agradecer a você daqui a sessenta anos."
koKR = "지금 심으세요. 종문이 육십 년 뒤에 고마워할 겁니다."
trTR = "Şimdi ek; sekt altmış yıl sonra sana teşekkür edecek."
esES = "Planta ahora; la secta te lo agradecerá dentro de sesenta años."
itIT = "Piantalo ora; la setta ti ringrazierà tra sessant'anni."
ukUA = "Посадіть зараз; секта подякує вам через шістдесят років."
thTH = "ปลูกตอนนี้เถอะ อีกหกสิบปีนิกายจะขอบคุณท่าน"
csCZ = "Zasaď hned; sekta ti poděkuje za šedesát let."
viVN = "Trồng ngay bây giờ đi; sáu mươi năm nữa, tông môn sẽ cảm ơn bạn."
caES = "Planta-la ara; la secta t'ho agrairà d'aquí a seixanta anys."
beBY = "Пасадзіце зараз; секта падзякуе вам праз шэсцьдзесят гадоў."
roRO = "Plantează acum; secta îți va mulțumi peste șaizeci de ani."
