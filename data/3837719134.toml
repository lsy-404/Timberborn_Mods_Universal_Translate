ukUA = "Дошка, підвішена на видному місці: що є в наявності, чого бракує і що треба принести далі."
thTH = "ป้ายประกาศที่แขวนไว้ให้ทุกคนมองเห็นได้: มีของอะไรอยู่ในมือ อะไรขาด และต้องไปหยิบอะไรต่อไป"
csCZ = "Tabule vystavená na očích všech: co je k dispozici, co chybí a co je třeba přinést jako další."
