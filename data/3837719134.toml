trTR = "Kavanozxadlar sessizce kabarcıklanıyor ve bütün avlu sabrın kokusunu taşıyor."
esES = "Las jarras burbujean en silencio, y todo el patio huele a paciencia."
itIT = "Le giare gorgogliano piano e l'intero cortile profuma di pazienza."
ukUA = "Банки тихо булькають, а весь двір пахне терпінням."
thTH = "ไหโหลเดือดปุดๆ อย่างเงียบเชียบ และทั้งลานก็มีกลิ่นของความอดทน"
