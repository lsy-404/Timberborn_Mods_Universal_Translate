["Building.Spiritveil.HallOfAbundance.Description"]
status = "normal"
raw = "Thick incense draws qi in from every direction. Meditate inside to slowly bank Foundation progress."
enUS = "Thick incense draws qi in from every direction. Meditate inside to slowly bank Foundation progress."
zhCN = "浓郁的香火从四面八方汇聚灵气。在殿内打坐可缓慢积累筑基进度。"
zhTW = "厚重的香煙從四面八方吸引靈氣。在內打坐，可緩慢累積「根基」進度。"
ruRU = "Густой благовонный дым притягивает ци со всех сторон. Медитируйте внутри, чтобы медленно накапливать прогресс Основания."
jaJP = "濃い香が四方から気（き）を呼び寄せる。中で瞑想すると、基礎（きそ）の進捗がゆっくりと蓄えられる。"
frFR = "Un encens épais attire le qi de toutes les directions. Méditez à l'intérieur pour accumuler lentement la progression de la Fondation."
deDE = "Dicker Weihrauch zieht Qi aus allen Richtungen an. Meditiere darin, um den Fortschritt der Grundlage langsam anzusammeln."
plPL = "Gęsty kadzidlany dym przyciąga qi z każdego kierunku. Medytuj w jego wnętrzu, aby powoli zwiększać postęp Fundamentu."
ptBR = "Incenso espesso atrai qi de todas as direções. Medite dentro dele para acumular lentamente o progresso da Fundação."
koKR = "짙은 향이 사방에서 기(氣)를 끌어모읍니다. 안에서 명상하면 기초(Foundation) 진행도가 천천히 쌓입니다."
trTR = "Kalın tütsü her yönden qi çeker. İçeride meditasyon yaparak Temel ilerlemesini yavaş yavaş biriktir."
esES = "El incienso denso atrae el qi desde todas las direcciones. Medita en su interior para acumular lentamente el progreso de la Fundación."
itIT = "Il denso incenso attira il qi da ogni direzione. Medita al suo interno per consolidare lentamente i progressi verso la Fondazione."
ukUA = "Густий ладан притягує ци з усіх боків. Медитуйте всередині, щоб повільно накопичувати прогрес Фундаменту."
thTH = "ธูปเข้มข้นดึงดูดชี่จากทุกทิศทาง นั่งสมาธิอยู่ภายในเพื่อค่อย ๆ สะสมความคืบหน้าของ Foundation"
csCZ = "Hustý kadidlo přitahuje qi ze všech stran. Medituj uvnitř, aby se pokrok ve Základech pomalu zvyšoval."
viVN = "Hương trầm đậm đặc hút linh khí từ mọi hướng. Hãy ngồi thiền bên trong để từ từ tích lũy tiến độ Nền tảng."
caES = "Un encens espès atrau el qi de totes direccions. Medita-hi dins per consolidar lentament el progrés de Fonament."
beBY = "Густы ладан прыцягвае ці з усіх бакоў. Медытуй унутры, каб павольна ўмацоўваць прагрэс Асновы."
roRO = "Tămâia densă atrage qi din toate direcțiile. Meditează în interior pentru a acumula treptat progresul de Fundație."
huHU = "Sűrű füstölő szívja magába a qit minden irányból. Lassan halmozd fel a Megalapozás fejlődését úgy, hogy meditálsz benne."
arSA = "يجذب البخور الكثيف الطاقة الروحية (تشي) من كل الاتجاهات. ادخل إليه للتأمل كي تتراكم تدريجياً تقدّمات التأسيس."

