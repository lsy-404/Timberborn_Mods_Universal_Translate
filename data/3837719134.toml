frFR = "La salle de la secte. Les affaires du conseil, les offrandes d'artefacts et les archives des écritures se déroulent toutes ici : c'est le cœur et le visage du clan."
deDE = "Die Sektenhalle. Hier finden die Ratsangelegenheiten, die Opfergaben an Artefakte und das Schriftenarchiv statt – das Herz und das Gesicht des Clans."
plPL = "Sala sekty. Tu odbywają się sprawy rady, składanie ofiar z artefaktów oraz przechowywanie archiwum pism – to serce i oblicze klanu."
ptBR = "O salão da seita. Assuntos do conselho, oferendas de artefatos e o arquivo de escrituras acontecem todos aqui: o coração e o rosto do clã."
koKR = "종문 회관입니다. 의회 업무, 유물 봉헌, 경전 보관소가 모두 이곳에서 이루어지며, 씨족의 심장이자 얼굴과 같은 곳입니다."
trTR = "Tarikat salonu. Konsey işleri, eser sunuları ve kutsal metin arşivi burada yürütülür; klanın kalbi ve yüzü burasıdır."
esES = "El salón de la secta. Los asuntos del consejo, las ofrendas de artefactos y el archivo de escrituras ocurren todos aquí: el corazón y el rostro del clan."
itIT = "La sala della setta. Qui si svolgono gli affari del consiglio, le offerte di manufatti e l'archivio delle scritture: il cuore e il volto del clan."
ukUA = "Зал секти. Тут відбуваються ради, підношення артефактів і зберігання писань — серце й обличчя клану."
thTH = "ศาลาของนิกาย การประชุมของสภา การถวายสิ่งประดิษฐ์ และคลังคัมภีร์ทั้งหมดเกิดขึ้นที่นี่ เป็นทั้งหัวใจและใบหน้าของตระกูล"
csCZ = "Sektářská síň. Zde se vyřizují záležitosti rady, přinášejí se obětiny artefaktů a nachází se archiv svitků – srdce a tvář klanu."
viVN = "Đại điện tông môn. Mọi việc nghị sự của hội đồng, dâng hiến pháp khí và kho lưu giữ kinh thư đều diễn ra tại đây, đây là trái tim và bộ mặt của tông tộc."
caES = "La sala de la secta. Aquí es fan els assumptes del consell, les ofrenes d'artefactes i l'arxiu de les escriptures: és el cor i la cara del clan."
beBY = "Залаў секты. Тут праходзяць справы савета, падносяцца артэфакты-дары і захоўваецца архіў пісанняў — сэрца і твар клана."
roRO = "Sala sectei. Aici au loc deliberările consiliului, ofrandele de artefacte și arhiva scripturilor – inima și chipul clanului."
huHU = "A szekta csarnoka. Itt zajlik a tanács üzleti élete, az artefaktumok felajánlása és a szentírások archívuma – ez a klán szíve és arca."
arSA = "قاعة الطائفة. تُدار هنا شؤون المجلس، وتُقدَّم القرابين من الأدوات الأثرية، ويُحفظ أرشيف الكتب المقدسة. إنها قلب العشيرة ووجهها."

