["Good.ImmortalGear.Description"]
status = "normal"
raw = "A gold-rimmed gear carved from immortal wood. Essential for immortal-tier buildings and for Iron Golem assembly."
enUS = "A gold-rimmed gear carved from immortal wood. Essential for immortal-tier buildings and for Iron Golem assembly."
zhCN = "金边齿轮，由不朽之木雕刻而成。是不朽级建筑及铁傀儡组装所必需的部件。"
zhTW = "金邊齒輪，以不朽之木雕琢而成。是不朽級建築以及鐵甲傀儡組裝所必需的材料。"
ruRU = "Шестерёнка с золотым ободом, выточенная из бессмертного дерева. Необходима для зданий бессмертного уровня и для сборки Железного голема."
jaJP = "金の縁取りが施された歯車で、不朽の木から彫り出されている。不朽級の建物や、アイアン・ゴーレムの組み立てに欠かせない。"
frFR = "Un engrenage bordé d'or sculpté dans du bois immortel. Indispensable aux bâtiments de rang immortel et à l'assemblage des Golems de fer."
deDE = "Ein goldgerändertes Zahnrad, aus unsterblichem Holz geschnitzt. Unverzichtbar für Gebäude der unsterblichen Stufe und für den Zusammenbau von Eisengolems."
plPL = "Złoty, obramowany trybik wyrzeźbiony z nieśmiertelnego drewna. Niezbędny do budowli nieśmiertelnego poziomu oraz do montażu Żelaznego Golema."
ptBR = "Uma engrenagem com borda dourada, esculpida em madeira imortal. Essencial para construções de nível imortal e para a montagem do Golem de Ferro."
koKR = "금빛 테두리가 새겨진 톱니바퀴로, 불멸의 나무를 깎아 만들었다. 불멸 등급 건물과 철 골렘 조립에 필수적이다."
trTR = "Ölümsüz ağaçtan oyulmuş, altın kenarlı bir dişli. Ölümsüz sınıf yapılar ile Demir Golem montajı için gereklidir."
esES = "Un engranaje con borde dorado tallado en madera inmortal. Imprescindible para los edificios de nivel inmortal y para el ensamblaje del Gólem de Hierro."
itIT = "Un ingranaggio cerchiato d'oro, intagliato in legno immortale. Essenziale per gli edifici di livello immortale e per l'assemblaggio del Golem di Ferro."
ukUA = "Шестерня з золотою облямівкою, вирізана з безсмертної деревини. Необхідна для будівель безсмертного рівня та для збирання Залізного голема."
thTH = "เฟืองขอบทองที่แกะสลักจากไม้อมตะ จำเป็นต่อสิ่งก่อสร้างระดับอมตะและการประกอบโกเล็มเหล็ก"
csCZ = "Ozubené kolo ze zlatem lemovaného nesmrtelného dřeva. Nezbytné pro budovy nesmrtelné úrovně a pro sestavení železného golema."
viVN = "Một bánh răng viền vàng được chạm khắc từ gỗ bất tử. Thiết yếu cho các công trình cấp bất tử và để lắp ráp Người Sắt Golem."
caES = "Un engranatge d'or de vora fet de fusta immortal. Essencial per als edificis de nivell immortal i per a l'assemblatge dels Gòlems de Ferro."
beBY = "Шасцярня з залатым абадком, вырабленая з бессмяротнага дрэва. Неабходная для будынкаў бессмяротнага ўзроўню і для зборкі Жалезнага голема."
roRO = "Un angrenaj cu margine aurie, sculptat din lemn nemuritor. Esențial pentru clădirile de nivel nemuritor și pentru asamblarea Golemului de Fier."
huHU = "Aranyszegélyű fogaskerék, halhatatlan fából faragva. Nélkülözhetetlen a halhatatlan szintű épületekhez és a Vasmedve-golem összeszereléséhez."
arSA = "تُرس مُذهَّب الحافة منحوت من خشب خالد. ضروري للمباني من فئة الخلود ولتجميع الغولم الحديدي."

