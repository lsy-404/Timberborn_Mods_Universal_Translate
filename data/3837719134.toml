viVN = "Một loại linh tửu đậm đà; giải khát, giúp tăng cường thấu hiểu trong thời gian tĩnh tu, và được dùng để luyện đan dược."
caES = "Un licor d'esperit de cos ple; apaga la set, aprofundeix la perspicàcia de la reclusió i s'utilitza en elixirs."
beBY = "Поўнае, насычанае духоўнае зелле; суцяшае смагу, паглыбляе разуменне ўсамоты і выкарыстоўваецца ў эліксірах."
roRO = "O băutură spirituală cu corp bogat; potolește setea, adâncește înțelegerea izolării și se folosește în elixire."
huHU = "Teltes szellemital; csillapítja a szomjat, mélyíti a magányos elmélkedés belátását, és elixírekhez használják."
