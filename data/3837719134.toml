huHU = "Egy csónak a mennyekbe, és az egész klán vele tart."
arSA = "قارب واحد إلى السماء، وتذهب العشيرة كلها معه."

["Building.Spiritveil.EfficientFarmHouse.Description"]
status = "normal"
raw = "A hard-working spirit grain farm that out-produces the common farmhouse."
enUS = "A hard-working spirit grain farm that out-produces the common farmhouse."
zhCN = "一座勤勉的灵谷农场，产量超过普通农舍。"
zhTW = "勤勞的靈穀農場，產量勝過一般的農舍。"
ruRU = "Трудолюбивая ферма духовного зерна, которая производит больше, чем обычный фермерский дом."
jaJP = "勤勉な霊穀農場で、一般的な農家より多く生産できる。"
frFR = "Une ferme à céréales spirituelles travailleuse qui produit davantage que la ferme commune."
deDE = "Ein fleißiger Geistgetreidehof, der mehr produziert als das gewöhnliche Bauernhaus."
plPL = "Pracowita farma ziaren duchowych, która produkuje więcej niż zwykły dom farmera."
ptBR = "Uma fazenda de grãos espirituais de trabalho árduo que produz mais do que a casa de fazenda comum."
koKR = "영혼의 곡물을 기르는 부지런한 농장으로, 일반 농가보다 더 많은 생산량을 자랑한다."
trTR = "Çok çalışkan bir ruh tahılı çiftliği; sıradan çiftlik evinden daha fazla üretir."
esES = "Una granja de cereales espiritual muy trabajadora que produce más que la casa de labranza común."
itIT = "Una fattoria di grano spirituale laboriosa che produce più della comune casa colonica."
ukUA = "Працьовита духовна зернова ферма, яка виробляє більше, ніж звичайний фермерський будинок."
thTH = "ฟาร์มธัญพืชวิญญาณที่ทำงานหนัก ผลิตได้มากกว่าบ้านไร่ทั่วไป"
csCZ = "Pracovitá farma s duchovním obilím, která produkuje více než běžný farmářský dům."
viVN = "Trang trại ngũ cốc linh khí chăm chỉ này sản xuất nhiều hơn nhà nông thông thường."
