["Building.Spiritveil.ImmortalGearWorkshop.Description"]
status = "normal"
raw = "Golems carve gold-rimmed gears from immortal wood - vital parts for immortal-tier buildings and for Iron Golems."
enUS = "Golems carve gold-rimmed gears from immortal wood, which are vital parts for immortal-tier buildings and for Iron Golems."
zhCN = "石像傀儡用金边齿轮从不朽之木上雕刻出它们——这些齿轮是不朽级建筑和铁甲傀儡的关键部件。"
zhTW = "Golem 從不朽之木上雕刻出金邊齒輪，這是不朽等級建築與鐵魔像的重要零件。"
ruRU = "Големы вытачивают шестерни с золотой окантовкой из бессмертной древесины — это важные детали для зданий бессмертного уровня и для Железных големов."
jaJP = "ゴーレムが不滅の木材から金の縁取りを持つ歯車を彫り出します。これは不滅級の建物と鉄のゴーレムに欠かせない部品です。"
frFR = "Les golems sculptent des engrenages bordés d'or dans du bois immortel : des pièces essentielles pour les bâtiments de rang immortel et pour les golems de fer."
deDE = "Golems schnitzen goldgesäumte Zahnräder aus unsterblichem Holz – wichtige Teile für Gebäude der unsterblichen Stufe und für Eisengolems."
plPL = "Golemy wycinają złote obręcze na przekładnie z nieśmiertelnego drewna – są to kluczowe części budynków najwyższego, nieśmiertelnego poziomu oraz Żelaznych Golemów."
ptBR = "Golems esculpem engrenagens com aro de ouro a partir de madeira imortal: peças vitais para edifícios de nível imortal e para Golems de Ferro."
koKR = "골렘이 불멸의 나무로 금테 두른 톱니바퀴를 조각합니다. 이는 불멸급 건물과 강철 골렘에 필요한 핵심 부품입니다."
trTR = "Golemler, ölümsüz ağaçtan altın kenarlı dişliler oyarlar; bu dişliler ölümsüz seviyedeki yapılar ile Demir Golemler için hayati parçalardır."
esES = "Los golems tallan engranajes con bordes dorados a partir de madera inmortal: piezas vitales para los edificios de nivel inmortal y para los Golems de Hierro."
itIT = "I Golem intagliano ingranaggi cerchiati d'oro dal legno immortale: parti vitali per gli edifici di livello immortale e per i Golem di Ferro."
ukUA = "Големи вирізають шестерні з облямівкою з золота з безсмертної деревини — життєво важливі частини для будівель безсмертного рівня та для Залізних големів."
thTH = "โกเล็มแกะสลักเฟืองขอบทองจากไม้อมตะ ซึ่งเป็นชิ้นส่วนสำคัญสำหรับอาคารระดับอมตะและสำหรับโกเล็มเหล็ก"
csCZ = "Golemové vyřezávají ozubená kola s zlatým okrajem z nesmrtelného dřeva – důležité díly pro budovy nesmrtelné úrovně a pro železné golemy."
viVN = "Golem khắc các bánh răng viền vàng từ gỗ bất tử - là bộ phận thiết yếu cho các công trình cấp bất tử và cho Golem Sắt."
caES = "Els golems tallen engranatges vorejats d'or a partir de fusta immortal: parts vitals per als edificis de nivell immortal i per als Golems de Ferro."
beBY = "Големы вырезаюць з бессмяротнага дрэва залатымі абадкамі шасцерні — важныя дэталі для будынкаў бессмяротнага ўзроўню і для Жалезных Големаў."
roRO = "Golemii cioplesc roți dințate cu margini aurii din lemn nemuritor - piese esențiale pentru clădirile de nivel nemuritor și pentru Golemii de Fier."
huHU = "A golemek aranyszegélyű fogaskerekeket faragnak halhatatlan fából – ezek létfontosságú alkatrészek a halhatatlan szintű épületekhez és a Vasgolemekhez."
arSA = "الجولمات تنحت تروسًا مُطعّمة بالذهب من الخشب الخالد، وهي أجزاء حيوية للمباني من الفئة الخالدة ولجولمات الحديد."

