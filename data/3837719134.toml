["Building.Spiritveil.ImmortalChamber.Description"]
status = "normal"
raw = "A dedicated retreat, five tiles square. 2400 hours of closed-door cultivation to attain Immortal Emperor. Needs 1500 hp."
enUS = "A dedicated retreat, five tiles square. 2400 hours of closed-door cultivation to attain Immortal Emperor. Needs 1500 hp."
zhCN = "专属闭关室，五格见方。需要2400小时的闭关修炼方可晋升为仙帝。需要1500 hp。"
zhTW = "專為閉關修煉而設的獨立密室，佔地五格見方。需要 2400 小時的閉關才能修成仙帝。需要 1500 hp。"
ruRU = "Специальное уединение, пять клеток в каждую сторону. 2400 часов закрытого совершенствования, чтобы достичь статуса Бессмертного Императора. Требуется 1500 hp."
jaJP = "専用の隠遁所、一辺5タイル四方。不死の皇帝に至るには、閉関修行に2400時間が必要。1500 hpを必要とする。"
frFR = "Une retraite dédiée, de cinq cases de côté. 2400 heures de culture en retrait pour atteindre le rang d'Empereur Immortel. Nécessite 1500 hp."
deDE = "Ein eigener Rückzugsort, fünf Felder im Quadrat. 2400 Stunden abgeschiedener Kultivierung, um den Unsterblichen Kaiser zu erreichen. Benötigt 1500 hp."
plPL = "Dedykowane odosobnienie, pięć pól na pięć. 2400 godzin zamkniętej kultywacji, by osiągnąć rangę Nieśmiertelnego Cesarza. Wymaga 1500 hp."
ptBR = "Um retiro dedicado, com cinco blocos de lado. 2400 horas de cultivo em reclusão para alcançar Imperador Imortal. Requer 1500 hp."
koKR = "전용 은거처, 가로세로 5타일. 불멸의 황제 경지에 이르기 위해 문을 닫고 2400시간 동안 수련해야 함. 1500 hp 필요."
trTR = "Beş döşeme genişliğinde, özel bir inziva odası. Ölümsüz İmparator mertebesine ulaşmak için 2400 saatlik kapalı kapı çilesi gerekir. 1500 hp ihtiyacı vardır."
esES = "Un retiro dedicado de cinco casillas por lado. 2400 horas de cultivo a puerta cerrada para alcanzar Emperador Inmortal. Necesita 1500 hp."
itIT = "Un ritiro dedicato, cinque caselle per lato. 2400 ore di coltivazione a porte chiuse per raggiungere lo status di Imperatore Immortale. Richiede 1500 hp."
ukUA = "Спеціальний пристрій для усамітнення, п'ять клітинок завдовжки і завширшки. 2400 годин закритого культивування, щоб досягти рівня Безсмертного імператора. Потребує 1500 hp."
thTH = "สถานที่ปลีกวิเวกเฉพาะ กว้างห้าช่องกระเบื้องทุกด้าน ใช้เวลาบำเพ็ญในห้องปิดสนิท 2400 ชั่วโมงเพื่อบรรลุขั้นจักรพรรดิอมตะ ต้องใช้กำลัง 1500 hp"
csCZ = "Samostatné útočiště o rozměru pět dlaždic na pět. 2400 hodin uzavřeného kultivování za účelem dosažení stavu Nesmrtelného císaře. Vyžaduje 1500 hp."
viVN = "Một tĩnh thất riêng biệt, rộng năm ô vuông. Cần bế quan khép cửa 2400 giờ để đạt Bất Hủ Đế Quân. Cần 1500 hp."
caES = "Un retir dedicat, de cinc rajoles quadrades. 2400 hores de cultiu a porta tancada per assolir Emperador Immortal. Necessita 1500 hp."
beBY = "Асобная цяжкая зала адасобленасці, пяць клетак у квадраце. 2400 гадзін зачыненага ўдзельнага культывавання, каб дасягнуць Бессмяротнага Імператара. Патрабуе 1500 hp."
roRO = "O retragere dedicată, de cinci plăci pe latură. 2400 de ore de cultivare cu ușa închisă pentru a atinge rangul de Împărat Nemuritor. Necesită 1500 hp."
huHU = "Egy különálló visszavonulási hely, öt csempe négyzetben. 2400 óra zárt ajtós művelés, hogy elérje a Halhatatlan Császár szintet. 1500 hp-t igényel."
arSA = "نمّ قريتٌ منعزلة مخصصة للعزلة، بمساحة خمسة بلاطات مربعة. تحتاج إلى 2400 ساعة من التدريب المغلق خلف الأبواب للوصول إلى مرتبة الإمبراطور الخالد. تتطلب 1500 حصان ميكانيكي (hp)."

