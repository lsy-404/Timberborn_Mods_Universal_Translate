roRO = "Un stavilar cu trei plăci, trei linii de apărare, astfel încât niciun val de inundație să nu ajungă la stavilar."
huHU = "Hármas lemezes zsilip: három védelmi vonal, hogy semmilyen áradat ne érje el a zsilipet."
