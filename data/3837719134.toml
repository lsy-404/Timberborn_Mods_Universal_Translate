["Building.Spiritveil.BrazierOfBonding.Description"]
status = "normal"
raw = "Two beavers sit here and burn incense together, warming friendship and dao heart at once. Meditate inside to slowly bank Qi Refining progress."
enUS = "Two beavers sit here and burn incense together, warming friendship and dao heart at once. Meditate inside to slowly bank Qi Refining progress."
zhCN = "两只海狸坐在这里一同焚香，既增进友谊，又滋养道心。在内部打坐，可缓慢积累炼气进度。"
zhTW = "兩隻海狸坐在這裡一同焚香，同時增進情誼與道心。在內部冥想，可緩慢累積練氣進度。"
ruRU = "Здесь сидят два бобра и вместе курят благовония, одновременно укрепляя дружбу и сердце дао. Медитируйте внутри, чтобы постепенно накапливать прогресс в очищении Ци."
jaJP = "二人のビーバーがここで一緒に香を焚き、友情と道心を同時に温める。内部で瞑想すると、練気の進捗がゆっくりと蓄積される。"
frFR = "Deux castors s'assoient ici et brûlent de l'encens ensemble, renforçant à la fois l'amitié et le cœur du dao. Méditez à l'intérieur pour accumuler lentement la progression du Raffinage du Qi."
deDE = "Hier sitzen zwei Biber und verbrennen gemeinsam Räucherwerk, wodurch Freundschaft und Dao-Herz zugleich gestärkt werden. Meditiere im Inneren, um den Fortschritt der Qi-Verfeinerung langsam zu steigern."
plPL = "Dwa bobry siedzą tu i wspólnie palą kadzidło, jednocześnie rozgrzewając przyjaźń i dao serca. Medytuj w środku, aby powoli gromadzić postęp w Rafinowaniu Qi."
ptBR = "Dois castores sentam-se aqui e queimam incenso juntos, aquecendo a amizade e o coração do dao ao mesmo tempo. Medite dentro para acumular lentamente o progresso do Refinamento de Qi."
koKR = "두 마리의 비버가 여기 앉아 함께 향을 피우며, 우정과 도심(道心)을 동시에 따뜻하게 데웁니다. 안에서 명상하면 기연(氣煉, 기 단련) 진행도를 천천히 쌓아 올릴 수 있습니다."
trTR = "Burada iki kunduz birlikte tütsü yakarak oturur ve aynı anda dostluğu ile dao kalbini ısıtır. Qi Arındırma ilerlemesini yavaş yavaş biriktirmek için içeride meditasyon yapın."
esES = "Dos castores se sientan aquí y queman incienso juntos, fortaleciendo a la vez la amistad y el corazón del dao. Medita en su interior para hacer avanzar lentamente el progreso de Refinamiento de Qi."
itIT = "Due bevieri siedono qui e bruciano incenso insieme, rafforzando al tempo stesso l'amicizia e il cuore del Dao. Meditare all'interno fa progredire lentamente il Raffinamento del Qi."
ukUA = "Два бобри сидять тут і разом палять пахощі, одночасно зміцнюючи дружбу та серце дао. Медитуйте всередині, щоб поступово просувати прогрес очищення Ци."
thTH = "สองตัวบีเวอร์นั่งที่นี่และจุดธูปด้วยกัน ช่วยเสริมความเป็นมิตรและดาวใจในเวลาเดียวกัน ทำสมาธิอยู่ภายในเพื่อสะสมความคืบหน้าของ Qi Refining อย่างค่อยเป็นค่อยไป"
csCZ = "Zde spolu sedí dva bobři a pálí kadidlo, čímž současně posilují přátelství i dao srdce. Meditací uvnitř pomalu zvyšujete postup v Rafinaci Qi."
viVN = "Hai con hải ly ngồi đây đốt hương cùng nhau, vừa củng cố tình bạn vừa bồi đắp đạo tâm. Ngồi thiền bên trong sẽ giúp tiến độ Luyện Khí tích lũy chậm rãi."
caES = "Dos castors s'asseuen aquí i cremen encens junts, escalfant alhora l'amistat i el cor del dao. Medita a l'interior per fer avançar a poc a poc el progrés del Refinament del Qi."
beBY = "Два бабры сядзяць тут і разам паляць ладан, адначасова зацяпляючы сяброўства і дао-сэрца. Медытуйце ўнутры, каб павольна прасоўваць прагрэс Ачышчэння Ці."
roRO = "Doi castori stau aici și ard tămâie împreună, întărind prietenia și inima dao în același timp. Meditați în interior pentru a avansa treptat progresul în Rafinarea Qi."
huHU = "Két hód ül itt, és együtt füstölőt égetnek, egyszerre melegítve a barátságot és a dao-szívet. Belülről meditálva lassan halad a Qi-finomítás fejlődése."
arSA = "يجلس هنا قندسان يحرقان البخور معًا، فيُدفئان الصداقة وقلب الداو في آنٍ واحد. تأمّل داخله لتتقدّم ببطء في تحسين مرحلة صقل الكي."

