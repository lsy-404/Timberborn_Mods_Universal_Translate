jaJP = "水の色が変わった瞬間に光る感知石。水路の番人である。"
frFR = "Une pierre sensible qui s'illumine dès que l'eau se décolore. La sentinelle des cours d'eau."
deDE = "Ein Sensorstein, der aufleuchtet, sobald sich das Wasser verfärbt. Der Wächter der Wasserwege."
plPL = "Kamień czujnikowy, który zapala się w chwili, gdy woda traci czystość. Strażnik wodnych szlaków."
ptBR = "Uma pedra sensora que acende no momento em que a água fica descolorida. A sentinela dos cursos d'água."
koKR = "수질이 변하는 순간 불이 켜지는 감지석. 수로의 파수꾼이다."
