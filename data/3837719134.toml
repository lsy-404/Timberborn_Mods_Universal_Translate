arSA = "ازرع الآن؛ ستشكرك الطائفة بعد ستين عامًا."

["Building.Spiritveil.FoundationCave.Description"]
status = "normal"
raw = "A secluded retreat. Meditate inside to slowly bank Foundation progress. Advancing still takes 100 hours in the Discipline Hall and a Foundation Pill."
enUS = "A secluded retreat. Meditate inside to slowly bank Foundation progress. Advancing still takes 100 hours in the Discipline Hall and a Foundation Pill."
zhCN = "一处幽静的修行之所。在其中打坐，可缓慢积累根基进度。若要晋升，仍需在道场修炼100小时，并持有一枚筑基丹。"
zhTW = "僻靜的閉關之所。在內打坐可緩慢累積根基進度。要進階仍需在講道堂修煉100小時，並持有一顆築基丹。"
ruRU = "Уединённое убежище. Медитируйте внутри, чтобы медленно накапливать прогресс Основания. Продвижение по-прежнему требует 100 часов в Зале Дисциплины и Пилюлю Основания."
jaJP = "秘境のような静かな隠れ家。中で瞑想すると、基礎の進捗が少しずつ蓄積されます。それでも昇進には、戒律堂で100時間の修練と基礎丹が必要です。"
frFR = "Une retraite isolée. Méditez à l'intérieur pour accumuler lentement la progression de la Fondation. Faire progresser encore nécessite toujours 100 heures dans la Salle de discipline et une Pilule de fondation."
deDE = "Ein abgelegener Rückzugsort. Meditiere darin, um den Fortschritt der Grundlage langsam anzusammeln. Der Aufstieg erfordert weiterhin 100 Stunden in der Disziplinhalle und eine Grundlagenpille."
plPL = "Ustronne schronienie. Medytuj w środku, aby stopniowo zwiększać postęp Fundacji. Przejście dalej nadal wymaga 100 godzin w Sali Dyscypliny oraz Pigułki Fundacji."
ptBR = "Um retiro isolado. Medite lá dentro para acumular lentamente o progresso da Fundação. Avançar ainda exige 100 horas no Salão da Disciplina e uma Pílula da Fundação."
koKR = "은밀한 은거지입니다. 안에서 명상하면 기초(Foundation) 진척도가 천천히 쌓입니다. 다음 단계로 나아가려면 여전히 수련 전당에서 100시간을 보내고 기초 단약 하나가 필요합니다."
trTR = "Sakin bir inziva yeri. Foundation ilerlemesini yavaşça biriktirmek için içeride meditasyon yap. Yine de ilerlemek için Discipline Hall'da 100 saat ve bir Foundation Pill gerekir."
esES = "Un retiro apartado. Medita en su interior para acumular lentamente el progreso de la Fundación. Avanzar aún requiere 100 horas en la Sala de Disciplina y una Píldora de Fundación."
itIT = "Un ritiro appartato. Medita all'interno per accumulare lentamente progressi verso la Fondazione. Il conseguimento richiede comunque 100 ore nella Sala della Disciplina e una Pillola della Fondazione."
ukUA = "Усамітнена обитель. Медитуйте всередині, щоб поступово накопичувати прогрес Фундаменту. Для просування все ще потрібні 100 годин у Залі дисципліни та Пілюля Фундаменту."
thTH = "ที่พักสันโดษ เข้าไปทำสมาธิภายในเพื่อสะสมความคืบหน้าของรากฐานอย่างช้าๆ แต่การก้าวหน้ายังคงต้องใช้เวลา 100 ชั่วโมงในห้องฝึกวินัย และยาเม็ดรากฐานหนึ่งเม็ด"
csCZ = "Odlehlé útočiště. Meditací uvnitř pomalu přidáváš pokrok v Základech. Postup stále vyžaduje 100 hodin v Síni disciplíny a Pilulku základů."
viVN = "Một nơi tĩnh tu thanh vắng. Hãy thiền định bên trong để từ từ tích lũy tiến độ Nền Tảng. Muốn tiến lên vẫn cần 100 giờ tại Đại Sảnh Tu Luyện và một Viên Đan Nền Tảng."
caES = "Un retir aïllat. Medita a l'interior per acumular progrés cap a la Fundació a poc a poc. Avançar encara requereix 100 hores a la Sala de Disciplina i una Píndola de Fundació."
beBY = "Ціхае прытулак. Медытуйце ўнутры, каб паступова набліжаць прагрэс Асновы. Для пераходу далей па-ранейшаму патрабуецца 100 гадзін у Залі дысцыплін і Пілюля Асновы."
roRO = "O retragere izolată. Meditează în interior pentru a acumula treptat progres către Fundație. Avansarea necesită în continuare 100 de ore în Sala Disciplinei și o Pilulă de Fundație."
huHU = "Egy elszigetelt visszavonulóhely. Benn meditálva lassan gyarapíthatod az Alapozás fejlődését. Az előrelépéshez továbbra is 100 órára van szükség a Fegyelemcsarnokban, valamint egy Alapozó Pirulára."
arSA = "ملاذ منعزل. ادخل إليه للتأمل، فيتراكم تقدم التأسيس ببطء. ومع ذلك، ما زال التقدم يتطلب 100 ساعة في قاعة الانضباط وحبة التأسيس."

