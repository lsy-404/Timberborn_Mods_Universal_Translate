["Building.Spiritveil.ArtifactWorkshop.FlavorDescription"]
status = "normal"
raw = "The furnace is never cold, and never quiet."
enUS = "The furnace is never cold, and never quiet."
zhCN = "炉火从不冷寂，也从不安静。"
zhTW = "炉火从不熄灭，也从不安静。"
ruRU = "Печь никогда не остывает и никогда не затихает."
jaJP = "炉は決して冷えず、決して静まらない。"
frFR = "Le fourneau n'est jamais froid, et jamais silencieux."
deDE = "Der Ofen ist nie kalt und nie still."
plPL = "Piec nigdy nie stygnie i nigdy nie milknie."
ptBR = "A fornalha nunca esfria e nunca fica em silêncio."
koKR = "화로는 결코 식지 않고, 결코 조용해지지 않는다."
trTR = "Ocak hiç soğumaz ve hiç sessizleşmez."
esES = "La forja nunca está fría, y nunca está en silencio."
itIT = "La fornace non è mai fredda e mai silenziosa."
ukUA = "Піч ніколи не остигає і ніколи не замовкає."
thTH = "เตาหลอมไม่เคยเย็นลง และไม่เคยเงียบเลย"
csCZ = "Pec není nikdy studená a není nikdy tichá."
viVN = "Lò luyện không bao giờ nguội, và không bao giờ im ắng."
caES = "La forja mai no es refreda, i mai no calla."
beBY = "Печ ніколі не астывае і ніколі не маўчыць."
roRO = "Cuptorul nu este niciodată rece și nu este niciodată liniștit."
huHU = "A kemence sosem hideg, és sosem csendes."
arSA = "لا يبرد الفرن أبداً، ولا يهدأ أبداً."

["Building.Spiritveil.AscensionCave.Description"]
status = "normal"
raw = "A secluded retreat. Meditate inside to slowly bank Mahayana progress. Reaching Mahayana still takes 720 hours in the Thunder Pool (300 hp) and a Mahayana Elixir."
enUS = "A secluded retreat. Meditate inside to slowly bank Mahayana progress. Reaching Mahayana still takes 720 hours in the Thunder Pool (300 hp) and a Mahayana Elixir."
zhCN = "一处幽静的隐居之所。在其中冥想，可缓慢积累大乘修为进度。要达到大乘境界，仍需在雷池（300 hp）中耗时720小时，并需要一份大乘丹。"
zhTW = "隱居之所。在內部冥想，可緩慢累積大乘修為進度。要達到大乘，仍需在雷池（300 hp）中耗時720小時，並需要一顆大乘丹。"
ruRU = "Уединённое убежище. Медитируйте внутри, чтобы постепенно накапливать прогресс Махаяны. Для достижения Махаяны всё равно требуется 720 часов в Громовом пруду (300 hp) и эликсир Махаяны."
jaJP = "隠遁の地。内部で瞑想すると、大乗への進捗がゆっくりと蓄えられる。大乗に到達するには、依然として雷池（300 hp）で720時間と大乗の霊薬が必要である。"
frFR = "Une retraite isolée. Méditez à l'intérieur pour accumuler lentement la progression vers le Mahayana. Atteindre le Mahayana prend toujours 720 heures dans le bassin de la foudre (300 hp) et un élixir Mahayana."
deDE = "Ein abgelegener Rückzugsort. Meditiere darin, um den Fortschritt zur Mahayana langsam anzusammeln. Das Erreichen der Mahayana dauert weiterhin 720 Stunden im Donnerteich (300 hp) und erfordert ein Mahayana-Elixier."
plPL = "Ustronne schronienie. Medytuj w środku, aby powoli gromadzić postęp w kierunku Mahajany. Osiągnięcie Mahajany nadal wymaga 720 godzin w Basenie Grzmotu (300 hp) oraz Eliksiru Mahajany."
ptBR = "Um retiro isolado. Medite lá dentro para acumular progresso Mahayana aos poucos. Alcançar o Mahayana ainda leva 720 horas na Piscina do Trovão (300 hp) e um Elixir Mahayana."
koKR = "은둔처입니다. 내부에서 명상하여 대승(Mahayana) 진척도를 천천히 쌓을 수 있습니다. 대승에 도달하려면 여전히 뇌전 연못에서 720시간(300hp)과 대승 영약이 필요합니다."
trTR = "Gizli bir inziva yeri. Mahayana ilerlemesini yavaş yavaş biriktirmek için içinde meditasyon yap. Mahayana'ya ulaşmak hâlâ Yıldırım Havuzu'nda (300 hp) 720 saat ve bir Mahayana İksiri gerektirir."
esES = "Un retiro apartado. Medita en su interior para acumular progreso Mahayana poco a poco. Alcanzar Mahayana aún requiere 720 horas en la Piscina del Trueno (300 hp) y un Elixir Mahayana."
itIT = "Un ritiro isolato. Medita al suo interno per accumulare lentamente progressi verso il Mahayana. Raggiungere il Mahayana richiede ancora 720 ore nella Pozza del Tuono (300 hp) e un Elisir Mahayana."
ukUA = "Затишний притулок. Медитуйте всередині, щоб поступово накопичувати прогрес до Махаяни. Досягнення Махаяни все одно займає 720 годин у Громовому басейні (300 к.с.) та один еліксир Махаяни."
thTH = "ที่หลบอยู่อย่างสงบ เข้าไปทำสมาธิภายในเพื่อสะสมความคืบหน้าสู่มหายานอย่างช้าๆ อย่างไรก็ตาม การจะบรรลุมหายานยังคงต้องใช้เวลา 720 ชั่วโมงในสระสายฟ้า (300 hp) และ มหายานอิลิกเซอร์"
csCZ = "Ústup stranou světa. Meditujte uvnitř, abyste postupně našetřili pokrok k Mahájánovi. Dosažení Mahájány stále vyžaduje 720 hodin v Bazénu hromu (300 hp) a mahájánský elixír."
viVN = "Một nơi ẩn cư thanh tịnh. Hãy thiền định bên trong để từ từ tích lũy tiến độ Đại Thừa. Đạt Đại Thừa vẫn cần 720 giờ tại Hồ Sấm Sét (300 hp) và một Đan Đại Thừa."
caES = "Un retir aïllat. Medita a l'interior per acumular progrés cap al Mahayana de manera lenta. Arribar al Mahayana encara requereix 720 hores a la Piscina del Tro (300 hp) i un Elixir Mahayana."
beBY = "Ціхі сховішча для медытацыі. Сядзіце ўнутры, каб паступова назапашваць прагрэс да Махаянскага ўзроўню. Для дасягнення Махаяны па-ранейшаму спатрэбіцца 720 гадзін у Громавым басейне (300 hp) і эліксір Махаяны."
roRO = "Un refugiu retras. Meditează în interior pentru a acumula treptat progresul spre Mahayana. Atingerea Mahayana necesită în continuare 720 de ore în Bazinul Tunetului (300 hp) și un Elixir Mahayana."
huHU = "Egy visszavonult menedékhely. Bent meditálva lassan felhalmozhatod a Mahájána-fejlődést. A Mahájánához továbbra is 720 óra kell a Mennydörgés-medencében (300 LE) és egy Mahájána-elixír."
arSA = "ملاذ منعزل. تأمل داخله لتراكم تقدم الماهايانا ببطء. يتطلب الوصول إلى الماهايانا لا يزال 720 ساعة في بركة الرعد (300 hp) وإكسير ماهايانا."

