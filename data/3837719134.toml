deDE = "Ein Boot in den Himmel, und der ganze Clan folgt ihm."
plPL = "Jedna łódź do niebios, a cały klan wyrusza razem z nią."
ptBR = "Um barco rumo aos céus, e o clã inteiro vai junto."
koKR = "하늘로 가는 배 한 척이면, 온 씨족이 함께 떠나는 법이지."
trTR = "Tek bir tekneyle göklere, ve bütün klan onunla birlikte gider."
esES = "Un bote al cielo, y todo el clan lo sigue."
itIT = "Una sola barca verso i cieli, e l'intero clan la segue."
ukUA = "Один човен до небес, і разом з ним піде весь клан."
thTH = "เรือลำเดียวสู่สรวงสวรรค์ แล้วทั้งตระกูลก็ไปด้วยกันทั้งหมด"
csCZ = "Jedna loďka do nebes a s ní odejde celý klan."
viVN = "Một chiếc thuyền bay lên trời, cả gia tộc cũng theo đó mà đi."
