["Barbara.TimberLoopTicketBooth.Description"]
raw = "Produces TimberLoop Tickets for a manually linked TimberLoop. Not compatible with the original RollerCoaster."
status = "normal"
enUS = "Produces TimberLoop Tickets for a manually linked TimberLoop. Not compatible with the original RollerCoaster."
zhCN = "为手动连接的 TimberLoop 生产 TimberLoop 门票。与原版 RollerCoaster 不兼容。"
zhTW = "為手動連結的 TimberLoop 生產 TimberLoop 門票。與原版 RollerCoaster 不相容。"
ruRU = "Производит билеты TimberLoop для вручную связанного TimberLoop. Несовместима с оригинальным RollerCoaster."
jaJP = "手動でリンクしたTimberLoop用のチケットを生産します。オリジナルのジェットコースターには対応していません。"
frFR = "Produit des billets TimberLoop pour un TimberLoop relié manuellement. Non compatible avec les montagnes russes d’origine."
deDE = "Produziert TimberLoop-Tickets für eine manuell verknüpfte TimberLoop. Nicht mit der originalen Achterbahn kompatibel."
plPL = "Produkuje bilety TimberLoop dla ręcznie połączonej kolejki TimberLoop. Nie jest kompatybilna z oryginalną kolejką górską."
ptBR = "Produz ingressos do TimberLoop para um TimberLoop vinculado manualmente. Não é compatível com a montanha-russa original."
koKR = "수동으로 연결한 TimberLoop용 티켓을 생산합니다. 오리지널 RollerCoaster와는 호환되지 않습니다."
csCZ = "Vyrábí vstupenky na TimberLoop pro ručně propojený TimberLoop. Není kompatibilní s původní horskou dráhou RollerCoaster."
viVN = "Sản xuất Vé TimberLoop cho một TimberLoop được liên kết thủ công. Không tương thích với RollerCoaster bản gốc."
trTR = "Manuel olarak bağlanan bir TimberLoop için TimberLoop Biletleri üretir. Orijinal RollerCoaster ile uyumlu değildir."

