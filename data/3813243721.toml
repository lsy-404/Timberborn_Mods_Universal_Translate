["Barbara.TimberLoop.P1.Description"]
status = "normal"
raw = "A six-beaver attraction with a prefabricated circuit and two laps per ride. Requires its own linked operating TimberLoop Ticket Booth."
enUS = "A six-beaver attraction with a prefabricated circuit and two laps per ride. Requires its own linked operating TimberLoop Ticket Booth."
zhCN = "可供六只海狸游玩的游乐设施，配有预制赛道，每次乘坐绕行两圈。需要连接一座专属的 TimberLoop 售票亭才能运营。"
zhTW = "可供六隻海狸乘坐的遊樂設施，配有預設賽道，每次乘坐繞行兩圈。需要連接專屬的 TimberLoop 售票亭才能運作。"
ruRU = "Аттракцион для шести бобров с готовой трассой и двумя кругами за поездку. Требуется собственная связанная с ним работающая билетная касса TimberLoop."
jaJP = "6匹のビーバーが乗れるアトラクション。あらかじめ設定されたコースを走り、1回の乗車につき2周します。稼働中のTimberLoopチケット売り場を専用に設置し、連結する必要があります。"
frFR = "Une attraction pour six castors, avec un circuit préfabriqué et deux tours par trajet. Nécessite son propre guichet TimberLoop relié et en service."
deDE = "Eine Attraktion für sechs Biber mit vorgefertigtem Rundkurs und zwei Runden pro Fahrt. Benötigt einen eigenen, verbundenen TimberLoop-Ticketschalter in Betrieb."
plPL = "Atrakcja dla sześciu bobrów z prefabrykowaną trasą i dwoma okrążeniami na przejazd. Wymaga własnej, połączonej z nią kasy biletowej TimberLoop."
ptBR = "Uma atração para seis castores, com um percurso pré-fabricado e duas voltas por passeio. Requer sua própria Bilheteria TimberLoop conectada."
koKR = "미리 제작된 코스와 탑승당 두 바퀴를 제공하는 비버 6명용 놀이기구입니다. 연결된 전용 TimberLoop 매표소가 있어야 운영할 수 있습니다."
csCZ = "Atrakce pro šest bobrů s předem připraveným okruhem a dvěma koly na jednu jízdu. Vyžaduje vlastní propojenou funkční pokladnu TimberLoop."
viVN = "Một trò thu hút sáu hải ly, có đường chạy lắp ghép sẵn và hai vòng mỗi lượt. Cần có Quầy vé TimberLoop đang hoạt động được kết nối riêng."
trTR = "Önceden hazırlanmış bir parkur ve her sürüşte iki tur içeren, altı kunduzluk bir eğlence aracı. Kendisine bağlı bir TimberLoop Bilet Gişesinin çalışır durumda olmasını gerektirir."

