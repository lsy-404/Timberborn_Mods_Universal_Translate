["Barbara.TimberLoopTicketBooth.Description"]
status = "normal"
raw = "Produces TimberLoop Tickets for a manually linked TimberLoop. Not compatible with the original RollerCoaster."
enUS = "Produces TimberLoop Tickets for a manually linked TimberLoop. Not compatible with the original RollerCoaster."
zhCN = "为手动连接的 TimberLoop 生产 TimberLoop 门票。与原版 RollerCoaster 不兼容。"
zhTW = "為手動連結的 TimberLoop 生產 TimberLoop 門票。與原版雲霄飛車不相容。"
ruRU = "Производит билеты TimberLoop для вручную подключённого TimberLoop. Несовместим с оригинальным RollerCoaster."
jaJP = "手動でリンクしたTimberLoop用のチケットを生産します。オリジナルのRollerCoasterには対応していません。"
frFR = "Produit des tickets TimberLoop pour un TimberLoop relié manuellement. Non compatible avec les montagnes russes originales."
deDE = "Produziert TimberLoop-Tickets für eine manuell verknüpfte TimberLoop. Nicht mit der originalen Achterbahn kompatibel."
plPL = "Produkuje bilety TimberLoop dla ręcznie połączonej kolejki TimberLoop. Nie jest kompatybilne z oryginalną kolejką górską."
ptBR = "Produz Ingressos do TimberLoop para um TimberLoop vinculado manualmente. Não é compatível com o RollerCoaster original."
koKR = "수동으로 연결한 TimberLoop에 사용할 TimberLoop 티켓을 생산합니다. 기존 RollerCoaster와는 호환되지 않습니다."
csCZ = "Vyrábí vstupenky TimberLoop pro ručně propojený TimberLoop. Není kompatibilní s původní horskou dráhou RollerCoaster."
viVN = "Sản xuất Vé TimberLoop cho TimberLoop được liên kết thủ công. Không tương thích với RollerCoaster gốc."
trTR = "Elle bağlanan bir TimberLoop için TimberLoop Biletleri üretir. Orijinal RollerCoaster ile uyumlu değildir."

