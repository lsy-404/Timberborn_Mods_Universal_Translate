["Barbara.TimberLoop.P1.Description"]
raw = "A six-beaver attraction with a prefabricated circuit and two laps per ride. Requires its own linked operating TimberLoop Ticket Booth."
status = "normal"
enUS = "An attraction for six beavers, with a prefabricated circuit and two laps per ride. Requires its own linked, operating TimberLoop Ticket Booth."
zhCN = "可供 6 只海狸游玩的景点，配有预设赛道，每次乘坐绕行两圈。需要连接一座专属的 TimberLoop 售票亭并投入运营。"
zhTW = "可供 6 隻海狸乘坐的遊樂設施，設有預先規劃好的賽道，每次遊玩跑兩圈。需要連接專屬的 TimberLoop 售票亭才能運作。"
ruRU = "Аттракцион для шести бобров с готовой трассой и двумя кругами за поездку. Требует собственной подключённой работающей билетной кассы TimberLoop."
jaJP = "6匹のビーバーが乗れるアトラクション。あらかじめ設定されたコースを走り、1回の乗車で2周します。稼働中のTimberLoopチケット売り場を専用に接続する必要があります。"
frFR = "Une attraction pour six castors, avec un circuit préfabriqué et deux tours par trajet. Nécessite son propre guichet TimberLoop relié et en service."
deDE = "Eine Attraktion für sechs Biber mit vorgefertigtem Rundkurs und zwei Runden pro Fahrt. Benötigt einen eigenen, verbundenen und betriebsbereiten TimberLoop-Ticketschalter."
plPL = "Atrakcja dla sześciu bobrów z prefabrykowaną trasą i dwoma okrążeniami na przejażdżkę. Wymaga własnej, połączonej z nią kasy biletowej TimberLoop."
ptBR = "Atração para seis castores, com um circuito pré-fabricado e duas voltas por passeio. Requer sua própria Bilheteria do TimberLoop vinculada para funcionar."
koKR = "미리 제작된 코스와 탑승당 두 바퀴를 제공하는 비버 6명용 놀이기구입니다. 연결된 전용 TimberLoop 매표소가 필요합니다."
csCZ = "Atrakce pro šest bobrů s předem připravenou trasou a dvěma okruhy na jednu jízdu. Vyžaduje vlastní propojenou a funkční pokladnu TimberLoop."
viVN = "Một trò thu hút sáu hải ly, có đường chạy lắp ghép sẵn và mỗi lượt chạy gồm hai vòng. Cần có quầy vé TimberLoop đang hoạt động được liên kết riêng."
trTR = "Önceden hazırlanmış bir parkur ve tur başına iki turdan oluşan, altı kunduzluk bir eğlence aracıdır. Çalışması için kendisine bağlı ayrı bir TimberLoop Bilet Gişesi gerekir."

