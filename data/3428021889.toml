["LV.SPE.WaterProdTimeMultiplierDesc"]
raw = "The multiplier for water production time (higher is harder).\nGame default 1x = 0.33 hour for 1 Water for Water Pumps.\nSetting this to 0.5 will make it produce 1 water in 0.165 hour while setting it to 2 will make it produce 1 water in 0.66 hour."
status = "normal"
enUS = "The multiplier for water production time (higher is harder).\nGame default: 1x = 0.33 hour per 1 Water for Water Pumps.\nSetting this to 0.5 will make it produce 1 water in 0.165 hour, while setting it to 2 will make it produce 1 water in 0.66 hour."
zhCN = "水资源生产时间的倍数（倍数越高，难度越大）。\n游戏默认值 1x = 水泵生产 1 单位水需要 0.33 小时。\n设置为 0.5 时，生产 1 单位水需要 0.165 小时；设置为 2 时，生产 1 单位水需要 0.66 小时。"
zhTW = "水的生產時間倍率（數值越高越難）。\n遊戲預設為 1x，水泵生產 1 單位水需要 0.33 小時。\n設為 0.5 時，生產 1 單位水需要 0.165 小時；設為 2 時，則需要 0.66 小時。"
ruRU = "Множитель времени производства воды (чем выше значение, тем сложнее игра).\nПо умолчанию в игре 1x = 0.33 часа на производство 1 единицы воды водяными насосами.\nПри значении 0.5 на производство 1 единицы воды будет уходить 0.165 часа, а при значении 2 — 0.66 часа."
jaJP = "水の生産時間の倍率（数値が高いほど難しくなります）。\nゲームのデフォルトでは、ウォーターポンプは1倍で1水を生産するのに0.33時間かかります。\n0.5に設定すると0.165時間で1水を生産し、2に設定すると0.66時間で1水を生産します。"
frFR = "Le multiplicateur de durée de production d’eau (plus il est élevé, plus c’est difficile).\nPar défaut dans le jeu, 1x = 0,33 heure pour produire 1 eau avec les pompes à eau.\nRéglez-le sur 0,5 pour produire 1 eau en 0,165 heure, ou sur 2 pour produire 1 eau en 0,66 heure."
deDE = "Der Multiplikator für die Wasserproduktionszeit (höher bedeutet schwieriger).\nDer Spielstandard 1x = 0,33 Stunden für 1 Wasser bei Wasserpumpen.\nBei einer Einstellung von 0,5 wird 1 Wasser in 0,165 Stunden produziert, bei einer Einstellung von 2 dagegen in 0,66 Stunden."
plPL = "Mnożnik czasu produkcji wody (wyższa wartość oznacza większy poziom trudności).\nDomyślna wartość w grze: 1x = 0,33 godziny na 1 jednostkę wody dla pomp wodnych.\nUstawienie wartości 0,5 sprawi, że wyprodukowanie 1 jednostki wody zajmie 0,165 godziny, a ustawienie wartości 2 sprawi, że zajmie to 0,66 godziny."
ptBR = "O multiplicador do tempo de produção de água (quanto maior, mais difícil).\nO padrão do jogo é 1x = 0,33 hora para 1 unidade de água nas Bombas de Água.\nDefinir como 0,5 fará com que produza 1 unidade de água em 0,165 hora, enquanto definir como 2 fará com que produza 1 unidade de água em 0,66 hora."
koKR = "물 생산 시간의 배수입니다(값이 높을수록 더 어렵습니다).\n물 펌프의 게임 기본값은 물 1개당 0.33시간입니다.\n이 값을 0.5로 설정하면 물 1개를 생산하는 데 0.165시간이 걸리고, 2로 설정하면 0.66시간이 걸립니다."
trTR = "Su üretim süresi çarpanı (değer yükseldikçe zorlaşır).\nSu pompaları için oyunun varsayılanı 1x = 1 Su için 0.33 saattir.\nBunu 0.5 olarak ayarlamak, 1 suyun 0.165 saatte üretilmesini; 2 olarak ayarlamak ise 1 suyun 0.66 saatte üretilmesini sağlar."
esES = "El multiplicador del tiempo de producción de agua (más alto es más difícil).\nEl valor predeterminado del juego, 1x, equivale a 0,33 horas por 1 de agua para las bombas de agua.\nSi lo cambias a 0,5, producirá 1 de agua en 0,165 horas, mientras que si lo cambias a 2, producirá 1 de agua en 0,66 horas."
itIT = "The moltiplicatore per il tempo di produzione dell'acqua (un valore più alto significa più difficoltà).\nImpostazione predefinita di gioco 1x = 0,33 ore per 1 Acqua per le Pompe dell'Acqua.\nImpostando questo valore a 0,5, produrrà 1 acqua in 0,165 ore, mentre impostandolo a 2 produrrà 1 acqua in 0,66 ore."
ukUA = "Множник часу виробництва води (вищий — складніше).\nСтандартне значення гри 1x = 0,33 години на 1 воду для водяних насосів.\nЯкщо встановити 0,5, вони вироблятимуть 1 воду за 0,165 години, а якщо встановити 2, вироблятимуть 1 воду за 0,66 години."
thTH = "ตัวคูณสำหรับเวลาการผลิตน้ำ (ค่าสูงหมายถึงยากขึ้น)\nค่าเริ่มต้นของเกม 1x = 0.33 ชั่วโมงต่อการผลิตน้ำ 1 หน่วยสำหรับเครื่องสูบน้ำ\nการตั้งค่านี้เป็น 0.5 จะทำให้ผลิตน้ำ 1 หน่วยในเวลา 0.165 ชั่วโมง ส่วนการตั้งค่าเป็น 2 จะทำให้ผลิตน้ำ 1 หน่วยในเวลา 0.66 ชั่วโมง"
csCZ = "Násobitel doby produkce vody (vyšší hodnota znamená vyšší obtížnost).\nVýchozí hodnota hry 1x = 0,33 hodiny na 1 vodu u vodních čerpadel.\nNastavení na 0,5 způsobí, že vyprodukuje 1 vodu za 0,165 hodiny, zatímco nastavení na 2 způsobí, že vyprodukuje 1 vodu za 0,66 hodiny."
viVN = "Hệ số nhân thời gian sản xuất nước (càng cao càng khó).\nMặc định trong game: 1x = 0.33 giờ để máy bơm nước tạo ra 1 đơn vị nước.\nĐặt giá trị này thành 0.5 sẽ khiến máy bơm tạo ra 1 đơn vị nước trong 0.165 giờ, còn đặt thành 2 sẽ khiến máy bơm tạo ra 1 đơn vị nước trong 0.66 giờ."
caES = "The multiplicador del temps de producció d'aigua (com més alt, més difícil).\nEl valor per defecte del joc 1x = 0,33 hores per 1 Aigua per a les Bombes d'aigua.\nSi ho poses a 0,5, produirà 1 aigua en 0,165 hores, mentre que si ho poses a 2, produirà 1 aigua en 0,66 hores."
beBY = "Множнік часу вытворчасці вады (чым вышэй, тым складаней).\nСтандартны прадвызначаны ўзровень гульні 1x = 0,33 гадзіны для 1 вады ў помпах для вады.\nКалі ўстанавіць 0,5, помпа будзе вырабляць 1 ваду за 0,165 гадзіны, а калі ўстанавіць 2, — 1 ваду за 0,66 гадзіны."
roRO = "Multiplicatorul pentru timpul de producție a apei (cu cât este mai mare, cu atât este mai greu).\nValoarea implicită a jocului 1x = 0,33 oră pentru 1 Apă la Pompele de apă.\nSetarea acestei valori la 0,5 va face ca pompa să producă 1 apă în 0,165 oră, iar setarea la 2 va face ca pompa să producă 1 apă în 0,66 oră."
huHU = "A vízszivattyúk víztermelési idejének szorzója (magasabb érték nehezebb).\nJáték alapbeállítása 1x = 0,33 óra 1 vízért vízszivattyúknál.\nHa ezt 0,5-re állítod, 0,165 óra alatt termel 1 vizet, míg 2-re állítva 0,66 óra alatt termel 1 vizet."
arSA = "مضاعف وقت إنتاج الماء (كلما كانت القيمة أعلى، كان الأمر أصعب).\nالإعداد الافتراضي للعبة 1x = 0.33 ساعة لإنتاج 1 ماء في مضخات الماء.\nتعيين هذه القيمة إلى 0.5 سيجعلها تنتج 1 ماء خلال 0.165 ساعة، بينما تعيينها إلى 2 سيجعلها تنتج 1 ماء خلال 0.66 ساعة."
