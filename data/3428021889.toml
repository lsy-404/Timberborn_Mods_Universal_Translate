ptBR = "A quantidade de água por segundo que a bomba mecânica bombeia (padrão do jogo: 0,25 m³/s).  \n⚡ Nota: alterar isso também aumenta ou diminui o consumo de energia de acordo, veja abaixo."
koKR = "기계 펌프가 초당 펌프하는 물의 양 (게임 기본값: 0.25m³/s).\n⚡ 주의: 이 값을 변경하면 전력 사용량도 이에 따라 증가하거나 감소합니다. 아래를 참조하세요."
