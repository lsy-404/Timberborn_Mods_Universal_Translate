esES = "La cantidad de agua por segundo que bombea la bomba mecánica (valor predeterminado del juego: 0,25 m³/s).\n⚡ Nota: cambiar esto también aumenta o disminuye el consumo de energía en consecuencia, ver más abajo."
itIT = "La quantità d'acqua al secondo che la pompa meccanica pompa (valore predefinito del gioco: 0,25m³/s).\n⚡ Nota: modificare questo valore aumenta o diminuisce anche il consumo di energia di conseguenza, vedi sotto."
ukUA = "Кількість води за секунду, яку перекачує механічний насос (типове значення гри: 0.25m³/s).\n⚡ Примітка: зміна цього значення також відповідно збільшує або зменшує споживання енергії, див. нижче."
thTH = "ปริมาณน้ำต่อวินาทีที่เครื่องสูบน้ำกลไกสูบ (ค่าเริ่มต้นของเกม: 0.25m³/s)\n⚡ หมายเหตุ: การเปลี่ยนค่านี้จะเพิ่มหรือลดการใช้พลังงานตามสัดส่วนด้วย ดูรายละเอียดด้านล่าง"
csCZ = "Množství vody za sekundu, které mechanické čerpadlo přečerpává (výchozí hodnota hry: 0,25m³/s).  \n⚡ Poznámka: změna tohoto také odpovídajícím způsobem zvyšuje nebo snižuje spotřebu energie, viz níže."
viVN = "Lượng nước mỗi giây mà bơm cơ học bơm ra (mặc định của trò chơi: 0.25m³/s).\n⚡ Lưu ý: việc thay đổi giá trị này cũng làm tăng hoặc giảm mức tiêu thụ điện năng tương ứng, xem bên dưới."
caES = "La quantitat d'aigua per segon que bomba la bomba mecànica (valor per defecte del joc: 0,25 m³/s).\n⚡ Nota: canviar això també augmentarà o reduirà el consum d'energia en conseqüència, vegeu a continuació."
beBY = "Колькасць вады ў секунду, якую механічны помпа перакачвае (стандартнае значэнне гульні: 0.25m³/s).\n⚡ Заўвага: змяненне гэтага таксама адпаведна павялічвае або памяншае спажыванне энергіі, гл. ніжэй."
roRO = "Cantitatea de apă pe secundă pe care o pompează pompa mecanică (valoarea implicită a jocului: 0,25m³/s).\n⚡ Notă: modificarea acesteia crește sau scade, în mod corespunzător, și consumul de energie, vezi mai jos."
huHU = "A mechanikus szivattyú által másodpercenként átpumpált víz mennyisége (alapértelmezett játékbeli érték: 0,25 m³/s).\n⚡ Megjegyzés: ennek módosítása a lenti leírásnak megfelelően az energiafelhasználást is ugyanúgy növeli vagy csökkenti."
arSA = "كمية الماء في الثانية التي تضخها المضخة الميكانيكية (القيمة الافتراضية للعبة: 0.25 م³/ث).\n⚡ ملاحظة: تغيير هذا الإعداد يزيد أو يقلل استهلاك الطاقة بالتناسب، انظر أدناه."

