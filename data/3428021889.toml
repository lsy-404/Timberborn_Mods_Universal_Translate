["LV.SPE.WaterConversationDesc"]
raw = "The conversion rate for water product vs. volume.\nGame default: 0.2, meaning Water Pumps take 0.2m³ to produce 1 Water product and Water Dumps produce 0.2m³ per Water product"
status = "normal"
enUS = "The conversion rate for water product vs. volume (Game default: 0.2, meaning Water Pumps require 0.2m³ to produce 1 water product and Water Dumps generate 0.2m³ per water product)"
zhCN = "水产品与体积的转换率（游戏默认：0.2，意味着水泵需要0.2m³来生产1个水产品，而水倾倒点每个水产品产生0.2m³）。"
zhTW = "水產品與體積的轉換率（遊戲預設：0.2，意味著水泵需要 0.2m³ 來生產 1 個水產品，而水排放器每個水產品產生 0.2m³）"
ruRU = "Коэффициент преобразования для водного продукта по сравнению с объемом. Значение по умолчанию в игре: 0.2, что означает, что водяные насосы используют 0.2 м³ для производства 1 водного продукта, а водные сливы производят 0.2 м³ на 1 водный продукт."
jaJP = "水製品の変換率と容量 (ゲームのデフォルト：0.2、つまり水ポンプは1つの水製品を生産するのに0.2m³を必要とし、水ダンプは水製品ごとに0.2m³を生産します)"
frFR = "Le taux de conversion pour le produit d'eau par rapport au volume. Valeur par défaut du jeu : 0,2, ce qui signifie que les pompes à eau consomment 0,2 m³ pour produire 1 produit d'eau et les déversoirs à eau produisent 0,2 m³ par produit d'eau."
deDE = "Die Umwandlungsrate für Wasserprodukte im Vergleich zum Volumen. Spielstandard: 0,2, was bedeutet, dass Wasserpumpen 0,2 m³ benötigen, um 1 Wasserprodukt zu erzeugen, und Wasserdumps 0,2 m³ pro Wasserprodukt produzieren."
plPL = "Współczynnik konwersji dla produktu wodnego w porównaniu do objętości (domyślnie w grze: 0,2, co oznacza, że pompy wodne zużywają 0,2 m³ do wyprodukowania 1 produktu wodnego, a zrzuty wodne produkują 0,2 m³ na produkt wodny)"
ptBR = "A taxa de conversão para produto de água em relação ao volume (padrão do jogo: 0,2, significando que Bombas de Água utilizam 0,2m³ para produzir 1 produto de água e Lixos de Água produzem 0,2m³ por produto de água)"
koKR = "수조 제품과 부피 간의 변환 비율(게임 기본값: 0.2, 즉 물 펌프는 1개의 수조 제품을 생산하는 데 0.2m³를 소비하고, 물 덤프는 수조 제품당 0.2m³를 생산함)"
trTR = "Su ürünü ile hacim arasındaki dönüşüm oranı. Oyun varsayılanı: 0.2, bu da Su Pompası'nın 1 Su ürünü üretmek için 0.2m³ su alması ve Su Boşaltıcıların her Su ürünü başına 0.2m³ üretmesi anlamına gelir."
esES = "La tasa de conversión entre producto de agua y volumen.\nValor predeterminado del juego: 0,2, lo que significa que las Bombas de agua necesitan 0,2 m³ para producir 1 producto de agua, y los Vertederos de agua producen 0,2 m³ por cada producto de agua"
itIT = "La velocità di conversione tra prodotto d'acqua e volume.\nImpostazione predefinita del gioco: 0,2, il che significa che le Pompe d'acqua richiedono 0,2 m³ per produrre 1 prodotto d'acqua e gli Scarichi d'acqua producono 0,2 m³ per ogni prodotto d'acqua"
ukUA = "Коефіцієнт переходу між продуктом води та об'ємом.\nСтандартне значення гри: 0,2, тобто Водяні насоси витрачають 0,2 м³, щоб виробити 1 одиницю продукту «Вода», а Водяні скидачі виробляють 0,2 м³ на одиницю продукту «Вода»."
thTH = "อัตราการแปลงผลผลิตน้ำเทียบกับปริมาตร\nค่าเริ่มต้นของเกม: 0.2 หมายความว่าปั๊มน้ำใช้ 0.2m³ เพื่อผลิตผลผลิตน้ำ 1 หน่วย และจุดทิ้งน้ำผลิต 0.2m³ ต่อผลผลิตน้ำ 1 หน่วย"
csCZ = "Poměr přeměny vody na produkt vs. objem. \nVýchozí hodnota hry: 0,2, což znamená, že Vodní čerpadla spotřebují 0,2 m³ k výrobě 1 vodního produktu a Vodní skládky produkují 0,2 m³ na produkt vody."
viVN = "Tỷ lệ quy đổi nước thành phẩm so với thể tích.\nMặc định trong trò chơi: 0,2, có nghĩa là Máy bơm nước tiêu thụ 0,2 m³ để tạo ra 1 nước thành phẩm và máy xả nước tạo ra 0,2 m³ cho mỗi nước thành phẩm"
caES = "La taxa de conversió d'aigua per producte en funció del volum.\nValor per defecte del joc: 0,2, cosa que significa que les Bombes d'aigua necessiten 0,2 m³ per produir 1 producte d'aigua i els Abocadors d'aigua produeixen 0,2 m³ per cada producte d'aigua"
beBY = "Каэфіцыент пераўтварэння для таварў з вады да аб'ёму.\nСтандартнае значэнне гульні: 0.2, што азначае, што водзяныя помпы выкарыстоўваюць 0.2 м³, каб вырабіць 1 адзінку вады, а водзяныя скідальнікі вырабляюць 0.2 м³ на адзінку вады."
roRO = "Rata de conversie pentru produsul de apă în raport cu volumul.\nValoare implicită a jocului: 0,2, ceea ce înseamnă că Pompele de apă consumă 0,2 m³ pentru a produce 1 produs de apă, iar Descărcătoarele de apă produc 0,2 m³ per produs de apă."
huHU = "A vízterméknek a térfogathoz viszonyított átváltási aránya.\nA játék alapértéke: 0,2, ami azt jelenti, hogy a Vízszivattyúk 0,2 m³ vizet használnak fel 1 vízterméket előállításához, a Víz-lerakók pedig 0,2 m³ vizet termelnek víztermékenként."
arSA = "معدل تحويل ناتج المياه مقابل الحجم.\nالإعداد الافتراضي للعبة: 0.2، أي أن مضخات المياه تحتاج إلى 0.2 م³ لإنتاج وحدة واحدة من ناتج المياه، وأن أحواض التفريغ تنتج 0.2 م³ لكل وحدة من ناتج المياه."

