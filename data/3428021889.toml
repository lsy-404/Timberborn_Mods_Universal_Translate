["LV.SPE.MechPumpPowerDesc"]
raw = "When you increase or decrease the mechanical pump water amount, the power usage is also adjusted accordingly.\nYou can, however, change the power usage multiplier here to make it use more or less (cheating :P) power than the default calculation.\nFor example, setting Water amount to x2 while setting this to x0.5 will make the pump use the same power as default, but pump double the water."
status = "normal"
enUS = "When you increase or decrease the amount of water the mechanical pump uses, the power consumption adjusts accordingly. However, you can change the power usage multiplier here to make it consume more or less (cheating :P) power than the default calculation. For example, setting the Water amount to x2 while adjusting this to x0.5 will make the pump use the same power as default but pump double the water."
zhCN = "当你增加或减少机械泵的水量时，功率使用量也会相应调整。你可以在这里改变功率使用倍数，使其比默认计算消耗更多或更少的功率（作弊 :P）。例如，将水量设置为x2，同时将此设置为x0.5，将使泵的功率与默认值相同，但泵送的水量将翻倍。"
zhTW = "當您增加或減少機械泵的水量時，功率使用量也會相應調整。不過，您可以在這裡更改功率使用倍率，使其使用比默認計算更多或更少的（作弊 :P）電力。例如，將水量設置為x2，同時將此設置為x0.5，將使泵的功率使用與默認值相同，但能抽取雙倍的水量。"
ruRU = "Когда вы увеличиваете или уменьшаете количество воды, перекачиваемой механическим насосом, потребление энергии также регулируется соответственно. Однако вы можете изменить множитель потребления энергии здесь, чтобы он использовал больше или меньше (жульничая :P) энергии, чем вычисление по умолчанию. Например, установка количества воды на x2 при установке этого значения на x0.5 заставит насос использовать ту же энергию, что и по умолчанию, но перекачивать в два раза больше воды."
jaJP = "機械ポンプの水量を増減させると、それに応じて電力の使用量も調整されます。ただし、ここで電力使用量の倍率を変更することで、デフォルトの計算よりも多くまたは少なく（ずるい :P）電力を使用させることができます。例えば、水量をx2に設定し、この倍率をx0.5に設定すると、ポンプはデフォルトと同じ電力を使用しながら、2倍の水を汲み上げます。"
frFR = "Lorsque vous augmentez ou diminuez la quantité d'eau de la pompe mécanique, la consommation d'énergie est également ajustée en conséquence. Vous pouvez cependant changer le multiplicateur de consommation d'énergie ici pour lui faire utiliser plus ou moins (tricher :P) d'énergie que le calcul par défaut. Par exemple, en réglant la quantité d'eau sur x2 tout en mettant cela sur x0,5, la pompe utilisera la même énergie que par défaut, mais pompera le double d'eau."
deDE = "Wenn du die Wassermenge der mechanischen Pumpe erhöhst oder verringerst, wird der Stromverbrauch entsprechend angepasst. Du kannst hier jedoch den Leistungsfaktormultiplikator ändern, um mehr oder weniger (Schummler :P) Energie als die Standardberechnung zu verbrauchen. Zum Beispiel wird das Setzen der Wassermenge auf x2 und das Einstellen dieses Wertes auf x0,5 die Pumpe die gleiche Leistung wie im Standard verbrauchen lassen, aber die doppelte Menge Wasser fördern."
plPL = "Kiedy zwiększasz lub zmniejszasz ilość wody w pompie mechanicznej, zużycie mocy jest również odpowiednio dostosowywane. Możesz jednak zmienić mnożnik zużycia mocy tutaj, aby używał więcej lub mniej (oszustwo :P) mocy niż domyślne obliczenia. Na przykład ustawiając ilość wody na x2, a to na x0.5, pompa będzie używała tej samej mocy co domyślnie, ale będzie pompować podwójną ilość wody."
ptBR = "Quando você aumenta ou diminui a quantidade de água da bomba mecânica, o consumo de energia também é ajustado de acordo. Você pode, no entanto, mudar o multiplicador de consumo de energia aqui para fazer com que ela use mais ou menos (trapaceando :P) energia do que o cálculo padrão. Por exemplo, definir a quantidade de água para x2 enquanto configura isso para x0,5 fará com que a bomba use a mesma energia que o padrão, mas bombeie o dobro da água."
koKR = "기계 펌프의 물 양을 늘리거나 줄이면 전력 사용량도 그에 따라 조정됩니다. 그러나 여기에서 전력 사용량 배수를 변경하여 기본 계산보다 더 많이 또는 덜 (치트 :P) 사용하도록 설정할 수 있습니다. 예를 들어, 물 양을 x2로 설정하고 이 값을 x0.5로 설정하면 펌프는 기본과 동일한 전력을 사용하면서 두 배의 물을 펌프질하게 됩니다."
trTR = "Mechanik pompa su miktarını artırdığınızda veya azalttığınızda, güç tüketimi de buna göre ayarlanır. Ancak, burada güç tüketimi çarpanını değiştirerek varsayılan hesaplamadan daha fazla veya daha az (hile :P) güç kullanmasını sağlayabilirsiniz. Örneğin, su miktarını x2 olarak ayarlayıp bunu x0.5 olarak ayarladığınızda, pompa varsayılanla aynı güçte çalışacak ama suyun iki katını pompalayacaktır."
esES = "Cuando aumenta o reduce la cantidad de agua de la bomba mecánica, el consumo de energía también se ajusta en consecuencia.\nSin embargo, aquí puede cambiar el multiplicador de consumo de energía para que use más o menos energía (trampa :P) que el cálculo predeterminado.\nPor ejemplo, si establece la Cantidad de agua en x2 y esto en x0.5, la bomba usará la misma energía que la predeterminada, pero bombeará el doble de agua."
itIT = "Quando aumenti o diminuisci la quantità d'acqua della pompa meccanica, anche il consumo di energia viene adattato di conseguenza.\nPuoi, tuttavia, modificare qui il moltiplicatore del consumo di energia per farla consumare più o meno energia (barando :P) rispetto al calcolo predefinito.\nAd esempio, impostando la quantità d'acqua a x2 e questo valore a x0.5, la pompa consumerà la stessa energia del valore predefinito, ma pomperà il doppio dell'acqua."
ukUA = "Коли ви збільшуєте або зменшуєте кількість води механічної помпи, споживання енергії також відповідно коригується.\nОднак тут можна змінити множник споживання енергії, щоб помпа використовувала більше або менше енергії (читерство :P), ніж за стандартним розрахунком.\nНаприклад, якщо встановити Кількість води на x2, а тут — на x0.5, помпа використовуватиме ту саму енергію, що й за замовчуванням, але перекачуватиме вдвічі більше води."
thTH = "When you increase or decrease the mechanical pump water amount, the power usage is also adjusted accordingly.\nYou can, however, change the power usage multiplier here to make it use more or less (cheating :P) power than the default calculation.\nFor example, setting Water amount to x2 while setting this to x0.5 will make the pump use the same power as default, but pump double the water."
csCZ = "Když zvýšíte nebo snížíte množství vody z mechanického čerpadla, také se odpovídajícím způsobem upraví spotřeba energie. Můžete však zde změnit násobitel spotřeby energie, aby čerpadlo používalo více nebo méně (podvádění :P) energie než ve výchozím výpočtu. Například nastavení množství vody na x2 při nastavení tohoto na x0.5 způsobí, že čerpadlo použije stejnou energii jako ve výchozím nastavení, ale čerpá dvojnásobné množství vody."
viVN = "Khi bạn tăng hoặc giảm lượng nước của bơm cơ học, mức tiêu thụ năng lượng cũng được điều chỉnh tương ứng.\nTuy nhiên, bạn có thể thay đổi hệ số tiêu thụ năng lượng ở đây để nó tiêu thụ nhiều hoặc ít năng lượng hơn (gian lận :P) so với tính toán mặc định.\nVí dụ, đặt lượng nước ở mức x2 trong khi đặt hệ số này ở x0.5 sẽ khiến bơm tiêu thụ cùng một lượng năng lượng như mặc định, nhưng sẽ bơm gấp đôi lượng nước."
caES = "Quan augmenteu o disminuïu la quantitat d'aigua de la bomba mecànica, el consum d'energia també s'ajusta en conseqüència.\nTanmateix, aquí podeu canviar el multiplicador de consum d'energia perquè consumeixi més o menys energia (trampa :P) que el càlcul per defecte.\nPer exemple, si establiu la quantitat d'aigua a x2 i aquest valor a x0,5, la bomba consumirà la mateixa energia que per defecte, però bombejarà el doble d'aigua."
beBY = "Калі вы павялічваеце або памяншаеце аб'ём вады механічнай помпы, спажыванне энергіі таксама адпаведна змяняецца.\nАднак тут вы можаце змяніць множнік спажывання энергіі, каб помпа выкарыстоўвала больш або менш энергіі (чыт, вы падманваеце :P), чым разлік па змаўчанні.\nНапрыклад, калі задаць Аб'ём вады x2, а гэтае значэнне — x0.5, помпа будзе спажываць тое ж самае энергія, што і па змаўчанні, але перакачваць удвая больш вады."
roRO = "Când crești sau scazi cantitatea de apă a pompei mecanice, consumul de energie se ajustează și el în consecință.\nPoți însă modifica aici multiplicatorul consumului de energie, pentru ca pompa să consume mai multă sau mai puțină energie (trișezi :P) decât calculul implicit.\nDe exemplu, dacă setezi cantitatea de apă la x2 și aici setezi valoarea x0,5, pompa va consuma aceeași energie ca în mod implicit, dar va pompa dublu față de cantitatea normală de apă."
huHU = "Ha növeli vagy csökkenti a mechanikus szivattyú vízmennyiségét, az energiafogyasztás is ennek megfelelően változik.\nItt azonban módosíthatja az energiafogyasztási szorzót is, hogy a szivattyú az alapértelmezett számítástól többet vagy kevesebbet fogyasszon (csalás :P).\nPéldául ha a Vízmennyiséget x2-re állítja, az energiafogyasztási szorzót pedig x0,5-re, a szivattyú ugyanannyi energiát fogyaszt, mint alapértelmezetten, de kétszer annyi vizet szivattyúz."
arSA = "عند زيادة كمية المياه التي يضخها المضخة الميكانيكية أو تقليلها، يتم تعديل استهلاك الطاقة تبعاً لذلك أيضاً.\nيمكنك، مع ذلك، تغيير مضاعف استهلاك الطاقة هنا لجعلها تستهلك طاقة أكثر أو أقل (غش :P) من حساب الافتراضي.\nعلى سبيل المثال، إذا ضبطت كمية المياه على x2 وضبطت هذا على x0.5، فإن المضخة ستستهلك نفس الطاقة الافتراضية، لكنها ستضخ ضعف كمية المياه."

