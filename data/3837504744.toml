frFR = "Les fantômes des ordres de plantation sont dessinés semi-transparents, avec des contours de feuilles pleins, de sorte que tout ce qui se trouve sur la case reste visible à travers eux."
deDE = "Pflanzaufträge werden als durchsichtige Geister dargestellt, mit deutlichen Blattumrissen, sodass alles, was auf dem Feld steht, durchscheint."
