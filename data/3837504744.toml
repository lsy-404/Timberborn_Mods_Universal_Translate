itIT = "I fantasmi degli ordini di piantagione vengono disegnati semitrasparenti, con contorni fogliari pieni, così che tutto ciò che si trova sulla casella risulta visibile attraverso di essi."
ukUA = "Ghost-зображення посадкових наказів малюються напівпрозорими, з суцільними контурами листя, тож будь-що, що стоїть на клітинці, просвічує крізь них."
thTH = "Ghost ของคำสั่งปลูกจะวาดให้โปร่งแสง โดยมีเส้นขอบใบไม้ทึบ เพื่อให้สิ่งที่อยู่บนช่องนั้นมองทะลุเห็นได้"
csCZ = "Náhledy příkazů k výsadbě jsou vykresleny průhledně s plnými obrysy listů, takže cokoli, co stojí na dlaždici, je skrz ně vidět."
viVN = "Bóng mờ của lệnh trồng cây được vẽ trong suốt, với viền lá rắn, nên bất kỳ thứ gì đứng trên ô đều hiện xuyên qua."
