["UltimatePlantingTools.PatternForest.Description"]
status = "normal"
raw = "Plants trees and bushes in parallel lines, each species as many lines per cycle as set in the panel, spread apart, repeating. The lines start where you first click."
enUS = "Plant trees and bushes in parallel lines, with each species planted as many lines per cycle as set in the panel, spaced apart and repeating. The lines start where you first click."
zhCN = "在面板中设置每个物种每个循环的行数，将树木、灌木和植物按平行线排列种植，线与线之间相互分开并重复排列。线条从你第一次点击的位置开始。"
zhTW = "在每個循環中，以平行線的方式種植樹木和灌木，每個物種的線數依面板中的設定而定，線與線之間保持間距並重複排列。線條從你第一次點擊的位置開始。"
ruRU = "Сажайте деревья, кусты и растения параллельными линиями: для каждого вида — столько линий за цикл, сколько задано на панели, с промежутками, с повторением. Линии начинаются там, где вы впервые нажали."
jaJP = "植物を平行な線状に植えます。各種類は、パネルで設定された本数の線を1サイクルごとに、間隔を空けて繰り返し植えます。線は最初にクリックした場所から始まります。"
frFR = "Plantez des arbres et des buissons en lignes parallèles, chaque espèce selon le nombre de lignes par cycle défini dans le panneau, espacées et répétées. Les lignes commencent à l'endroit où vous cliquez en premier."
deDE = "Pflanzt Bäume und Sträucher in parallelen Linien. Jede Art wird so viele Linien pro Zyklus gepflanzt, wie im Panel eingestellt, mit Abstand zueinander und sich wiederholend. Die Linien beginnen dort, wo Ihr zuerst klickt."
plPL = "Sadzi drzewa, krzewy i rośliny w równoległych rzędach, przy czym każdy gatunek sadzony jest w takiej liczbie rzędów na cykl, jaka ustawiona jest w panelu, z zachowaniem odstępów i z powtarzaniem wzoru. Rzędy zaczynają się w miejscu, w którym po raz pierwszy klikniesz."
ptBR = "Planta árvores e arbustos em linhas paralelas, cada espécie com tantas linhas por ciclo quanto definido no painel, espaçadas e repetidas. As linhas começam onde você clicar pela primeira vez."
koKR = "나무, 덤불을 여러 줄로 나란히 심습니다. 각 종은 패널에서 설정한 만큼의 줄을 한 주기마다 심고, 간격을 두고 반복합니다. 줄은 처음 클릭한 지점에서 시작됩니다."
trTR = "Ağaçları, çalıları ve bitkileri paralel çizgiler halinde ekin; her tür, panelde ayarlanan sayıda çizgiyle bir döngüde yer alır, aralıklı olarak tekrarlanır. Çizgiler, ilk tıkladığınız yerde başlar."
esES = "Planta árboles y arbustos en líneas paralelas, cada especie con tantas líneas por ciclo como se indique en el panel, separadas entre sí y repitiéndose. Las líneas comienzan donde hagas clic por primera vez."
itIT = "Pianta alberi e cespugli in linee parallele, con ogni specie disposta in tante linee per ciclo quante impostate nel pannello, distanziate tra loro e ripetute. Le linee iniziano dove fai il primo clic."
ukUA = "Саджайте дерева, кущі та рослини рядами, паралельними один одному: для кожного виду стільки рядів на цикл, скільки вказано на панелі, з проміжками, із повторенням. Ряди починаються там, де ви вперше клацнули."
thTH = "ปลูกต้นไม้และพุ่มไม้เป็นแนวขนานกัน โดยแต่ละชนิดจะปลูกเป็นจำนวนแนวต่อรอบตามที่กำหนดในแผงควบคุม เว้นระยะห่างกันและทำซ้ำไปเรื่อยๆ แนวจะเริ่มจากจุดแรกที่คุณคลิก"
csCZ = "Sázejte stromy, keře a rostliny v rovnoběžných řadách; každý druh vysadí tolik řad na cyklus, kolik je nastaveno na panelu, s rozestupy a opakovaně. Řady začínají tam, kde poprvé kliknete."
viVN = "Trồng cây và bụi thành các hàng song song, mỗi loài trồng số hàng trên mỗi chu kỳ đúng như đã đặt trong bảng điều khiển, cách nhau và lặp lại. Các hàng bắt đầu từ vị trí bạn nhấp chuột đầu tiên."
caES = "Planta arbres i arbustos en línies paral·leles, amb cada espècie tantes línies per cicle com s'indiqui al panell, separades i repetint-se. Les línies comencen on hagis fet clic per primera vegada."
beBY = "Садзіце дрэвы, кусты і расліны ў паралельных радах: кожнага выгляду столькі радоў за цыкл, колькі ўказана ў панэлі, з прамежкамі, з паўтарэннем. Ніткі пачынаюцца там, дзе вы ўпершыню націснулі."
roRO = "Plantează copaci și tufe în linii paralele, fiecare specie câte linii pe ciclu este stabilit în panou, distanțate, în mod repetat. Liniile încep de unde faci primul clic."
huHU = "Fák, cserjék és bokrok ültetése párhuzamos sorokban: fajonként a panelen beállított számú sor ciklusonként, egymástól távol, ismétlődve. A sorok ott kezdődnek, ahol először kattintasz."
arSA = "ازرع الأشجار والشجيرات في خطوط متوازية، حيث يزرع كل نوع عدد الخطوط لكل دورة المحدد في اللوحة، مع تباعد بينها وتكرار النمط. تبدأ الخطوط من النقطة التي تنقر عليها أولاً."

