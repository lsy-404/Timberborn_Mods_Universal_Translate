["UltimatePlantingTools.PatternCrops.Description"]
status = "normal"
raw = "Plants crops in parallel lines, each species as many lines per cycle as set in the panel, spread apart, repeating. The lines start where you first click."
enUS = "Plants crops in parallel lines, with as many lines per cycle for each species as set in the panel, spaced apart and repeating. The lines start where you first click."
zhCN = "在一个周期内，按面板中设定的行数，将每种作物以间隔排列成平行行进行种植，并重复该模式。这些行从你第一次点击的位置开始。"
zhTW = "在一个循环中，每种作物都会按面板中设定的行数，以间隔排列的方式平行种植多行，并不断重复。这些行从你第一次点击的位置开始。"
ruRU = "Сажает культуры параллельными линиями: для каждого вида столько линий за цикл, сколько задано на панели, с промежутками, повторяя шаблон. Линии начинаются там, где вы впервые кликнули."
jaJP = "植物を、パネルで設定した周期ごとの列数で、間隔を空けて平行な列に繰り返し植えます。列は最初にクリックした場所から始まります。"
frFR = "Plante des cultures en lignes parallèles, chaque espèce selon autant de lignes par cycle que défini dans le panneau, espacées et répétées. Les lignes commencent à l'endroit où vous cliquez en premier."
deDE = "Pflanzt Feldfrüchte in parallelen Reihen, wobei jede Art pro Zyklus so viele Reihen anlegt, wie im Panel eingestellt, mit Abstand zueinander und sich wiederholend. Die Reihen beginnen dort, wo du zuerst klickst."
plPL = "Sadzi uprawy w równoległych rzędach; każdy gatunek sadzony jest w tylu rzędach na cykl, ile ustawiono w panelu, z odstępami, powtarzając wzór. Rzędy zaczynają się w miejscu, w którym po raz pierwszy klikniesz."
ptBR = "Planta culturas em linhas paralelas, com cada espécie plantada na quantidade de linhas por ciclo definida no painel, espaçadas e repetidas. As linhas começam onde você clicar pela primeira vez."
koKR = "작물을 평행한 줄로 심습니다. 패널에서 설정한 만큼의 줄을 주기마다 각 작물 종류별로 심고, 간격을 두고 반복합니다. 줄은 처음 클릭한 지점에서 시작됩니다."
trTR = "Mahsulleri paralel çizgiler halinde ekin; her tür, panelde ayarlanan sayıda çizgiyle, döngü başına aralıklı ve tekrarlı olarak dizilir. Çizgiler, ilk tıkladığın yerden başlar."
esES = "Planta cultivos en líneas paralelas; cada especie ocupa tantas líneas por ciclo como se indique en el panel, separadas entre sí, y el patrón se repite. Las líneas comienzan donde hagas clic por primera vez."
itIT = "Pianta le colture in linee parallele, con ogni specie che occupa tante linee per ciclo quante impostate nel pannello, distanziate e ripetute. Le linee iniziano dal punto in cui fai clic per la prima volta."
ukUA = "Садить культури паралельними рядами: кожен вид саджається стільки рядів за цикл, скільки вказано на панелі, з відступами, повторюючись. Ряди починаються там, де ви вперше клацнули."
thTH = "ปลูกพืชเป็นแถวขนานกัน โดยแต่ละชนิดพืชจะปลูกเป็นจำนวนแถวต่อรอบตามที่ตั้งไว้ในแผง เว้นระยะห่างและทำซ้ำไปเรื่อย ๆ แถวจะเริ่มต้นตรงจุดแรกที่คุณคลิก"
csCZ = "Sází plodiny do paralelních řad; každý druh do tolika řad za cyklus, kolik je nastaveno na panelu, rozmístěných od sebe a opakovaných. Řady začínají tam, kde poprvé klikneš."
viVN = "Trồng cây thành các hàng song song, mỗi loài trồng số hàng trên mỗi chu kỳ theo cài đặt trong bảng, các hàng cách đều nhau và được lặp lại. Các hàng bắt đầu từ vị trí bạn nhấp chuột đầu tiên."
caES = "Planta cultius en línies paral·leles, amb tantes línies per cicle de cada espècie com s'indiqui al panell, separades i en repetició. Les línies comencen on hi cliquis per primera vegada."
beBY = "Садзіць культуры паралельнымі радамі: кожны від ствараецца ў колькасці радоў за цыкл, зададзенай на панэлі, з прамежкамі, з паўтарэннем. Рады пачынаюцца там, дзе вы націснулі ўпершыню."
roRO = "Plantează culturile în linii paralele, fiecare specie având atâtea linii pe ciclu câte sunt setate în panou, distanțate între ele și repetate. Liniile încep de unde faci primul clic."
huHU = "Növényeket ültet párhuzamos sorokban: minden fajtából annyi sort ültet ciklusonként, amennyit a panelen beállítottak, egymástól távolságot tartva, ismétlődve. A sorok ott kezdődnek, ahol először kattintasz."
arSA = "زرع المحاصيل في خطوط متوازية، حيث يُزرع كل نوع في عدد من الخطوط لكل دورة يساوي ما هو محدد في اللوحة، مع تباعد بينها، ويتكرر النمط. تبدأ الخطوط من النقطة التي تنقر عليها أولاً."

