["UltimatePlantingTools.Settings.TranslucentGhostsTooltip"]
status = "normal"
raw = "Planting orders' ghosts are drawn see-through, with solid leaf outlines, so whatever stands on the tile shows through."
enUS = "Planting order ghosts are drawn translucent, with solid leaf outlines, so anything standing on the tile shows through."
zhCN = "种植指令的虚影以半透明方式绘制，带有实心的叶片轮廓，因此位于地块上的物体会透过虚影显示出来。"
zhTW = "種植指令的虛影以半透明繪製，但葉片輪廓為實線，因此站在格子上的任何東西都會透出來。"
ruRU = "Призраки заказов на посадку отрисовываются полупрозрачными, с чёткими контурами листьев, поэтому то, что стоит на клетке, будет просвечивать сквозь них."
