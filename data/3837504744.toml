["UltimatePlantingTools.Copy.Description"]
status = "normal"
raw = "First drag over plants to copy them, then drag to plant copies. Lines the line tools could plant are continued; anything else is repeated, empty tiles included. Copies start where you first click."
enUS = "First drag over plants to copy them, then drag to plant copies. Lines the line tools could plant are continued; anything else is repeated, empty tiles included. Copies start where you first click."
zhCN = "先拖过植物以复制它们，然后拖动以种植复制品。能够由线性工具种植的线条会被延续；其他内容会被重复，包括空地块。复制品从你第一次点击的位置开始。"
zhTW = "先拖曳經過植物以複製它們，然後拖曳以種植複製品。線性工具能種植的線段會被延續；其他一律重複，包括空白地塊。複製品從你第一次點擊的位置開始。"
ruRU = "Сначала проведите курсором по растениям, чтобы скопировать их, затем проведите курсором, чтобы высадить копии. Линии, которые могут высадить инструменты линий, продолжаются; всё остальное повторяется, включая пустые клетки. Копии начинаются там, где вы впервые нажали."
jaJP = "まず植物の上をドラッグしてコピーし、その後ドラッグしてコピーを植えます。植物ラインツールで植えられる列は連続して植えられ、それ以外のものは繰り返され、空のタイルも含まれます。コピーは最初にクリックした場所から始まります。"
frFR = "Faites d'abord glisser sur des plantes pour les copier, puis glissez pour planter des copies. Les lignes que les outils de ligne pourraient planter sont prolongées ; tout le reste est répété, y compris les cases vides. Les copies commencent à l'endroit où vous avez cliqué en premier."
deDE = "Ziehe zuerst über Pflanzen, um sie zu kopieren, und ziehe dann, um Pflanzenkopien zu setzen. Reihen, die die Linienwerkzeuge pflanzen könnten, werden fortgesetzt; alles andere wird wiederholt, einschließlich leerer Felder. Die Kopien beginnen dort, wo du zuerst geklickt hast."
plPL = "Najpierw przeciągnij nad roślinami, aby je skopiować, a następnie przeciągnij, aby posadzić kopie. Linie, które narzędzia do sadzenia linii mogą posadzić, są kontynuowane; wszystko inne jest powtarzane, w tym puste kafelki. Kopie zaczynają się tam, gdzie najpierw klikniesz."
ptBR = "Primeiro arraste sobre as plantas para copiá-las e, em seguida, arraste para plantar as cópias. As linhas que as ferramentas de linha poderiam plantar são continuadas; qualquer outra coisa é repetida, incluindo os blocos vazios. As cópias começam onde você clicou pela primeira vez."
koKR = "먼저 식물 위로 드래그하여 복사한 다음, 드래그하여 복사본을 심으세요. 줄 도구로 심을 수 있는 줄은 이어서 심어지며, 그 외의 것은 빈 타일을 포함해 반복해서 심어집니다. 복사본은 처음 클릭한 지점에서부터 시작됩니다."
trTR = "Bitkilerin üzerinden sürükleyerek önce onları kopyalayın, ardından kopyaları dikmek için sürükleyin. Çizgi araçlarının dikebileceği çizgiler devam ettirilir; diğer her şey, boş kareler dahil, tekrarlanır. Kopyalar, ilk tıkladığınız yerden başlar."
esES = "Primero arrastra sobre las plantas para copiarlas y luego arrastra para plantar las copias. Las líneas que las herramientas de línea podrían plantar se continúan; cualquier otra cosa se repite, incluidas las casillas vacías. Las copias comienzan donde hiciste clic por primera vez."
itIT = "Trascina prima sopra le piante per copiarle, poi trascina per piantare le copie. Le linee che gli strumenti di linea potrebbero piantare vengono proseguite; tutto il resto viene ripetuto, comprese le caselle vuote. Le copie iniziano dove hai cliccato per la prima volta."
ukUA = "Спочатку проведіть курсором над рослинами, щоб скопіювати їх, а потім проведіть ним, щоб посадити копії. Лінії, які можуть посадити інструменти для ліній, продовжуються; усе інше повторюється, включно з порожніми плитками. Копії починаються там, де ви вперше клацнули."
thTH = "ลากผ่านพืชก่อนเพื่อคัดลอก จากนั้นลากเพื่อปลูกสำเนา เส้นที่เครื่องมือแบบเส้นสามารถปลูกได้จะถูกต่อเนื่อง ส่วนอื่นทั้งหมดจะถูกทำซ้ำ รวมถึงช่องว่างด้วย สำเนาจะเริ่มจากจุดแรกที่คุณคลิก"
csCZ = "Nejprve přetáhněte přes rostliny, abyste je zkopírovali, poté přetáhněte, abyste zasadili kopie. Řádky, které mohou nástroje pro sázení zasadit, se pokračují; cokoli jiného se opakuje, včetně prázdných dlaždic. Kopie začínají tam, kde jste poprvé klikli."
viVN = "Trước tiên kéo qua các cây trồng để sao chép chúng, sau đó kéo để trồng các bản sao. Những hàng mà công cụ trồng hàng có thể trồng sẽ được tiếp nối; mọi thứ khác đều được lặp lại, kể cả các ô trống. Các bản sao bắt đầu từ nơi bạn nhấp chuột lần đầu."
caES = "Primer arrossegueu sobre les plantes per copiar-les, després arrossegueu per plantar les còpies. Les línies que les eines de línia poden plantar es continuen; qualsevol altra cosa es repeteix, inclosos els blocs buits. Les còpies comencen on hi heu fet clic per primera vegada."
beBY = "Спачатку перацягніце над раслінамі, каб скапіяваць іх, затым перацягніце, каб пасадзіць копіі. Лініі, якія могуць быць пасаджаны інструментамі ліній, працягваюцца; усё астатняе паўтараецца, у тым ліку пустыя клеткі. Копіі пачынаюцца там, дзе вы спачатку клікнулі."
roRO = "Mai întâi trageți peste plante pentru a le copia, apoi trageți pentru a planta copiile. Liniile pe care le pot planta instrumentele de linie sunt continuate; orice altceva este repetat, inclusiv plăcile goale. Copiile încep de unde ați dat primul clic."
huHU = "Először húzzon át a növényeken a másoláshoz, majd húzzon a másolatok elültetéséhez. A vonaleszközökkel elültethető sorokat folytatják a rendszer; minden más ismétlődik, beleértve az üres csempéket is. A másolatok ott kezdődnek, ahol először kattintott."
arSA = "اسحب أولاً فوق النباتات لنسخها، ثم اسحب لزراعة النسخ. تُمتد الخطوط التي يمكن لأدوات الخطوط زراعتها، أما ما عدا ذلك فيُكرَّر، بما في ذلك الأرباع الفارغة. تبدأ النسخ من المكان الذي نقرت فيه أولاً."

