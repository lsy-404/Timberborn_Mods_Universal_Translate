koKR = "계획 주문의 유령 이미지는 반투명하게 그려지며, 잎 윤곽선은 실선으로 표시되어 해당 칸에 이미 놓인 것이 비쳐 보입니다."
trTR = "Ekim emirlerinin hayaletleri şeffaf çizilir ve yaprak hatları katıdır; böylece karenin üzerinde duran her şey görünür kalır."
