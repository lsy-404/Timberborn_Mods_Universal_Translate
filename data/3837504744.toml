["UltimatePlantingTools.PatternAquatic.Description"]
status = "normal"
raw = "Plants aquatic crops in parallel lines, each species as many lines per cycle as set in the panel, spread apart, repeating. The lines start where you first click."
enUS = "Plants aquatic crops in parallel lines, with each species planted as many lines per cycle as set in the panel, spaced apart and repeating. The lines start where you first click."
zhCN = "在水生作物中按平行线种植，每个物种每个周期的线数与面板中设置的一致，线间隔开并重复。线条从你第一次点击的位置开始。"
zhTW = "種植水生作物時，會以平行線排列，每個物種在每個週期中種植的線數依面板設定，各線之間保持間距並重複排列。線條從你第一次點擊的位置開始。"
ruRU = "Сажает водные культуры параллельными линиями: каждый вид высаживается таким количеством линий за цикл, какое задано в панели, с промежутками между ними, с повторением. Линии начинаются с точки, где вы впервые нажали."
jaJP = "水生作物を、パネルで設定した列数ずつ、種類ごとに間隔を空けて平行な列に繰り返し植えます。列は最初にクリックした位置から始まります。"
frFR = "Plante des cultures aquatiques en lignes parallèles, chaque espèce selon le nombre de lignes par cycle défini dans le panneau, espacées et répétées. Les lignes commencent à l'endroit où vous cliquez en premier."
deDE = "Pflanzt Wasserpflanzen in parallelen Reihen an. Jede Art wird pro Zyklus so vielen Reihen zugeordnet, wie im Bedienfeld eingestellt, mit Abstand zueinander, und wiederholt sich. Die Reihen beginnen dort, wo du zuerst geklickt hast."
plPL = "Sadzi wodne rośliny w równoległych rzędach; każdy gatunek tworzy tyle rzędów na cykl, ile ustawiono w panelu, rozmieszczonych w odstępach i powtarzanych. Rzędy zaczynają się w miejscu, w którym kliknięto po raz pierwszy."
ptBR = "Planta cultivos aquáticos em linhas paralelas, com cada espécie plantada em tantas linhas por ciclo quanto definido no painel, espaçadas entre si e repetindo o padrão. As linhas começam onde você clicar primeiro."
koKR = "수생 작물을 평행한 줄로 심습니다. 각 작물은 패널에서 설정한 만큼의 줄을 주기마다 만들고, 간격을 띄워 반복합니다. 줄은 처음 클릭한 곳에서 시작됩니다."
trTR = "Sulak bitkileri, panelde ayarlanan sayıda hat olacak şekilde her tür döngü başına paralel hatlar halinde, aralıklı olarak tekrarlanarak diker. Hatlar, ilk tıkladığınız yerde başlar."
esES = "Planta cultivos acuáticos en líneas paralelas; cada especie se planta en tantas líneas por ciclo como se indique en el panel, separadas entre sí y repitiéndose. Las líneas comienzan donde hagas clic por primera vez."
itIT = "Pianta colture acquatiche in linee parallele, con ogni specie disposta in tante linee per ciclo quante impostate nel pannello, distanziate tra loro e ripetute. Le linee iniziano dove fai il primo clic."
ukUA = "Саджає водні культури паралельними лініями: кожного виду стільки ліній за цикл, скільки задано на панелі, з проміжками, повторюючись. Лінії починаються там, де ви вперше клацнули."
thTH = "ปลูกพืชน้ำเป็นแถวขนานกัน โดยแต่ละชนิดพืชจะปลูกจำนวนแถวต่อรอบตามที่ตั้งไว้ในแผง เว้นระยะห่างและวนซ้ำ แถวจะเริ่มจากจุดแรกที่คุณคลิก"
csCZ = "Vysazuje vodní plodiny v rovnoběžných řadách; každý druh vysadí tolik řad na cyklus, kolik je nastaveno na panelu, s rozestupy, a opakuje to. Řady začínají tam, kde poprvé kliknete."
viVN = "Trồng cây thủy sinh thành các hàng song song, mỗi loài trồng số hàng trong mỗi chu kỳ theo cài đặt trên bảng điều khiển, cách đều nhau và lặp lại. Các hàng bắt đầu từ vị trí bạn nhấp chuột đầu tiên."
caES = "Planta cultius aquàtics en línies paral·leles, amb tantes línies per cicle de cada espècie com s'indiqui al panell, separades entre si i repetint-se. Les línies comencen on hagis fet el primer clic."
beBY = "Садзіць водныя культуры ў паралельных радах: кожнага выгляду столькі радоў за цыкл, колькі ўказана на панэлі, з прабелам паміж імі, з паўтарэннем. Рады пачынаюцца там, дзе вы націснулі ўпершыню."
roRO = "Plantează culturi acvatice în linii paralele, fiecare specie în atâtea linii pe ciclu câte sunt stabilite în panou, distanțate și repetate. Liniile încep de unde faci primul clic."
huHU = "Vízi növényeket ültet párhuzamos sorokban. Fajonként ciklusonként annyi sort ültet, amennyit a panelen beállítottak, egymástól távolságot tartva, ismétlődve. A sorok ott kezdődnek, ahol először kattintasz."
arSA = "يزرع المحاصيل المائية في خطوط متوازية، حيث يزرع كل نوع عدداً من الخطوط في كل دورة يساوي العدد المحدد في اللوحة، موزعة بمسافات بينها ومكررة. تبدأ الخطوط من النقطة التي تنقر عليها أولاً."

