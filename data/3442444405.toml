["LV.CAS.SaveWeatherWarningDesc"]
raw = "When a weather warning is issued, make an extra save named 'weatherwarning.save' that is only overwritten by the next cycle's warning. This save is not counted towards the save count."
status = "normal"
enUS = "When a weather warning is issued, create an additional save named 'weatherwarning.save' that is only overwritten by the next cycle's warning. This save does not count towards the save total."
zhCN = "勾选后，将在恶劣天气预警时自动保存，下一次恶劣天气预警时会自动覆盖保存。"
zhTW = "當發佈天氣警報時，請額外保存一個名為 'weatherwarning.save' 的文件，該文件僅在下個週期的警報覆蓋時被覆蓋。這個保存不計入保存次數。"
ruRU = "Когда выдается предупреждение о погоде, создайте дополнительное сохранение с именем 'weatherwarning.save', которое будет перезаписываться только предупреждением следующего цикла. Это сохранение не учитывается в общем числе сохранений."
jaJP = "天候警報が発令されたときは、次のサイクルの警報によってのみ上書きされる「weatherwarning.save」という名前の追加セーブを作成します。このセーブはセーブ数にはカウントされません。"
frFR = "Lorsque un avis de tempête est publié, créez une sauvegarde supplémentaire nommée 'weatherwarning.save' qui n'est écrasée que par l'avis du cycle suivant. Cette sauvegarde n'est pas comptabilisée dans le nombre de sauvegardes."
deDE = "Wenn eine Wetterwarnung ausgegeben wird, erstellen Sie eine zusätzliche Sicherung mit dem Namen 'weatherwarning.save', die nur von der nächsten Warnung des Zyklus überschrieben wird. Diese Sicherung zählt nicht zur Anzahl der Sicherungen."
plPL = "Kiedy wydawane jest ostrzeżenie pogodowe, utwórz dodatkowe zapisanie o nazwie 'weatherwarning.save', które jest nadpisywane tylko przez ostrzeżenie z następnej cyklu. To zapisanie nie jest uwzględniane w liczbie zapisów."
ptBR = "Quando um alerta meteorológico é emitido, crie um salvamento extra chamado 'weatherwarning.save' que só será sobrescrito pelo aviso do próximo ciclo. Esse salvamento não conta para a contagem de salvamentos."
koKR = "날씨 경고가 발효되면 'weatherwarning.save'라는 이름의 추가 저장을 만듭니다. 이 저장은 다음 주기의 경고로만 덮어쓰기 됩니다. 이 저장은 저장 수에 포함되지 않습니다."
trTR = "Bir hava uyarısı verildiğinde, sadece bir sonraki döngünün uyarısı tarafından üzerine yazılacak 'weatherwarning.save' adında ek bir kayıt oluşturun. Bu kayıt, kayıt sayısına dahil edilmez."
esES = "Cuando se emita una advertencia meteorológica, crea un guardado adicional llamado \"weatherwarning.save\" que solo se sobrescribe con la advertencia del siguiente ciclo. Este guardado no se cuenta en el número de guardados."
itIT = "Quando viene emesso un avviso meteorologico, crea un salvataggio extra denominato 'weatherwarning.save' che viene sovrascritto solo dall'avviso del ciclo successivo. Questo salvataggio non viene conteggiato nel numero di salvataggi."
ukUA = "Коли видається попередження про погоду, створіть додаткове збереження під назвою «weatherwarning.save», яке перезаписується лише наступним попередженням циклу. Це збереження не враховується в кількості збережень."
thTH = "เมื่อมีการประกาศคำเตือนสภาพอากาศ ให้สร้างไฟล์บันทึกพิเศษชื่อ 'weatherwarning.save' ซึ่งจะถูกเขียนทับเฉพาะเมื่อมีคำเตือนของรอบถัดไปเท่านั้น ไฟล์บันทึกนี้จะไม่ถูกนับรวมในจำนวนไฟล์บันทึกที่กำหนดไว้"
csCZ = "Když je vydáno varování před nepřízní počasí, vytvořte extra uložení s názvem 'weatherwarning.save', které je přepsáno pouze varováním z příštího cyklu. Toto uložení se nepočítá do celkového počtu uložených pozic."
viVN = "Khi một cảnh báo thời tiết được phát hành, hãy tạo một bản lưu bổ sung có tên 'weatherwarning.save' chỉ bị ghi đè bởi cảnh báo của chu kỳ tiếp theo. Lưu này sẽ không được tính vào tổng số lần lưu."
caES = "Quan s'emet un avís meteorològic, fes un desat addicional anomenat 'weatherwarning.save' que només se sobreescriu amb l'avís del cicle següent. Aquest desat no es compta dins del nombre de desats."
beBY = "Калі выдаецца папярэджанне аб надвор'і, стварыце дадатковае захаванне пад назвай «weatherwarning.save», якое перазапісваецца толькі пры папярэджанні наступнага цыкла. Гэта захаванне не ўлічваецца ў агульнай колькасці захаванняў."
roRO = "Când este emisă o avertizare meteo, creează un salvat suplimentar numit „weatherwarning.save”, care este suprascris doar de avertizarea următorului ciclu. Acest salvat nu este numărat în totalul salvărilor."
huHU = "Amikor időjárás-figyelmeztetés érkezik, készítsen egy extra mentést „weatherwarning.save” néven, amelyet csak a következő ciklus figyelmeztetése írhat felül. Ez a mentés nem számít bele a mentések számába."
arSA = "عند إصدار تحذير من الطقس، أنشئ حفظًا إضافيًا باسم 'weatherwarning.save' لا يُستبدل إلا بتحذير الدورة التالية. لا يُحتسب هذا الحفظ ضمن عدد الحفظ."

