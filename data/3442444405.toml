viVN = "Hiển thị cảnh báo trước khi trò chơi tự động lưu, với một khoảng thời gian nhất định. Điều này hữu ích cho người chơi không thích hiện tượng giật lag khi lưu tự động."
caES = "Mostra un avís una mica abans que el joc es desi automàticament. Això és útil per als jugadors que no volen que el joc es bloquegi breument en desar automàticament."
