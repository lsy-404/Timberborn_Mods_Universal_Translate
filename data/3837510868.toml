["DamWorks.TimberCrib.Boardwalk.Description"]
raw = "Vanilla dam: water spills over the 0.65-level barrier below the top walkway. The cyan placement line marks the overflow level. Matching Works finish; appearance does not change water behaviour."
status = "normal"
enUS = "Vanilla dam: water spills over the 0.65-level barrier below the top walkway. The cyan placement line marks the overflow level. Matching Works finish; appearance does not change water behaviour."
zhCN = "原版堤坝：水会从顶部步道下方0.65高度的挡水板上溢出。青色的放置线标示溢出高度。与原版相符的外观完成；外观不会改变水的行为。"
zhTW = "普通水壩：水會從頂部步道下方的 0.65 高度屏障溢出。青色放置線標示溢流高度。與原版相符的外觀不會改變水的行為。"
ruRU = "Ванильная плотина: вода переливается через барьер высотой 0,65 под верхней дорожкой. Голубая линия установки обозначает уровень перелива. Совпадающие варианты отделки не меняют поведение воды; внешний вид не влияет на поведение воды."
jaJP = "標準のダム：水は最上部の通路の下にある0.65レベルの仕切りを越えてあふれます。水色の設置線があふれるレベルを示します。仕上げは既存のものと一致しますが、見た目を変えても水の挙動は変わりません。"
frFR = "Barrage vanille : l'eau déborde par-dessus la barrière de niveau 0,65 située sous la passerelle supérieure. La ligne de placement cyan indique le niveau de débordement. Les finitions correspondent ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Vanilla-Damm: Wasser fließt über die 0,65-Höhenbarriere unterhalb des oberen Laufstegs. Die cyanfarbene Platzierungslinie markiert die Überlaufhöhe. Passende Ausführungen entsprechen dem Original; das Aussehen verändert das Wasserverhalten nicht."
plPL = "Zapora standardowa: woda przelewa się przez barierę na poziomie 0,65 poniżej górnego chodnika. Turkusowa linia wyznacza poziom przelewu. Pasujące wykończenia nie zmieniają zachowania wody, a jedynie wygląd."
ptBR = "Barragem vanilla: a água transborda pela barreira de nível 0,65 abaixo da passarela superior. A linha ciano de posicionamento marca o nível de transbordamento. Os acabamentos correspondentes são concluídos; a aparência não altera o comportamento da água."
koKR = "바닐라 댐: 물은 상단 보도 아래의 0.65 높이 장벽 위로 넘쳐 흐릅니다. 청록색 설치선은 넘침 수위를 표시합니다. 일치하는 마감 작업을 적용해도 외형만 바뀔 뿐 물의 작동 방식은 바뀌지 않습니다."
csCZ = "Vanilla přehrada: voda přetéká přes bariéru ve výšce 0,65 pod horní chodníkem. Azurová čára umístění označuje úroveň přelivu. Odpovídající díla jsou dokončena; vzhled nemění chování vody."
viVN = "Đập gốc: nước tràn qua rào chắn mức 0,65 nằm dưới lối đi trên cùng. Đường kẻ đặt màu xanh lam đánh dấu mức tràn. Các công trình tương ứng hoàn thiện; vẻ ngoài không làm thay đổi cách nước vận hành."
trTR = "Vanilla baraj: su, en üst yürüyüş yolunun altındaki 0.65 seviyesindeki bariyerin üzerinden taşar. Camgöbeği yerleştirme çizgisi taşma seviyesini gösterir. Eşleşen yapılar işi bitirir; görünüm su davranışını değiştirmez."
esES = "Presa de serie: el agua se desborda por encima de la barrera de nivel 0,65 situada debajo de la pasarela superior. La línea de colocación cian marca el nivel de desbordamiento. Los acabados coinciden; el aspecto no cambia el comportamiento del agua."
itIT = "Diga vanilla: l'acqua tracima la barriera di livello 0,65 situata sotto la passerella superiore. La linea di posizionamento ciano indica il livello di tracimazione. Le opere corrispondenti completano il lavoro; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Звичайна гребля: вода переливається через бар'єр на рівні 0,65 нижче верхньої доріжки. Блакитна лінія розміщення позначає рівень переливу. Відповідні роботи завершено; зовнішній вигляд не змінює поведінку води."
thTH = "เขื่อนแบบปกติ: น้ำจะล้นข้ามกำแพงกั้นระดับ 0.65 ที่อยู่ต่ำกว่าทางเดินด้านบน เส้นวางสีฟ้าอมเขียว (cyan) แสดงระดับที่น้ำล้น วัสดุที่ตรงกันจะทำให้งานเสร็จสมบูรณ์ แต่รูปลักษณ์ที่เปลี่ยนไปไม่ได้เปลี่ยนพฤติกรรมของน้ำ"
caES = "Presa de sèrie: l'aigua vessa per sobre de la barrera de nivell 0,65 situada per sota de la passarel·la superior. La línia cian de col·locació marca el nivell de desbordament. Els acabats coincidents s'acaben; l'aspecte no canvia el comportament de l'aigua."
beBY = "Звычайная плаціна: вада пераліваецца цераз бар'ер на ўзроўні 0,65 ніжэй за верхні настыл. Ціянавая лінія размяшчэння пазначае ўзровень перапаўнення. Адпаведныя адзнакі завяршаюцца; знешні выгляд не мяняе паводзіны вады."
roRO = "Baraj vanilla: apa se revarsă peste bariera de nivel 0,65 de sub pasarela superioară. Linia cyan de amplasare marchează nivelul de revărsare. Lucrările de potrivire se finalizează; aspectul nu schimbă comportamentul apei."
huHU = "Vanilla gát: a víz a felső sétány alatti 0,65-ös szintű korláton túlfolyik. A ciánkék elhelyezési vonal jelöli a túlfolyási szintet. Az illeszkedő változatok ugyanúgy működnek; a megjelenés nem változtat a víz viselkedésén."
arSA = "سد فانيليا: يفيض الماء فوق الحاجز الذي يبلغ مستواه 0.65 أسفل الممشى العلوي. يشير الخط السماوي لموضع البناء إلى مستوى الفيضان. تتطابق التشطيبات مع الأعمال، والمظهر لا يغيّر سلوك المياه."

