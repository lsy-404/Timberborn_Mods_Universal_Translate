ruRU = "Обычная плотина: вода переливается через барьер высотой 0,65 уровня ниже верхней дорожки. Голубая линия установки отмечает уровень перелива. Варианты отделки работают так же; внешний вид не меняет поведение воды."
jaJP = "バニラのダム：水は最上部の通路の下にある0.65レベルの仕切りを越えてあふれ出ます。水色の設置線が溢流レベルを示します。Matching Works の仕上げ仕様ですが、見た目を変えても水の挙動は変わりません。"
