trTR = "Vanilla baraj: su, üst yürüyüş yolunun altındaki 0,65 seviyesindeki bariyerin üzerinden taşar. Camgöbeği yerleştirme çizgisi taşma seviyesini gösterir. Eşleşen yapılar tamamlanır; görünüm su davranışını değiştirmez."
esES = "Presa de vainilla: el agua se desborda por la barrera de nivel 0,65 situada debajo de la pasarela superior. La línea de colocación cian marca el nivel de desbordamiento. Los acabados coincidentes no cambian el comportamiento del agua; solo afectan a la apariencia."
