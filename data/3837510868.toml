ptBR = "Barragem vanilla: a água transborda pela barreira de nível 0,65 abaixo da passarela superior. A linha ciano de posicionamento marca o nível de transbordamento. Os acabamentos correspondentes ficam prontos; a aparência não altera o comportamento da água."
