csCZ = "Vanilla přehrada: voda přetéká přes bariéru ve výšce 0,65 pod horní chodníkem. Azurová čára pro umístění označuje úroveň přetoku. Odpovídající dílo se dokončí; vzhled nemění chování vody."
viVN = "Đập thông thường: nước tràn qua rào chắn mức 0.65 nằm dưới lối đi trên cùng. Vạch màu xanh lam khi đặt đánh dấu mức tràn. Các công trình khớp sẽ hoàn thiện; vẻ ngoài không làm thay đổi hành vi của nước."
trTR = "Standart baraj: su, üst yürüyüş yolunun altındaki 0.65 seviyesindeki bariyerin üzerinden taşar. Turkuaz yerleştirme çizgisi taşma seviyesini gösterir. Eşleşen işler tamamlanır; görünüm su davranışını değiştirmez."
esES = "Presa de cantería de Vanilla: el agua se desborda por la barrera de nivel 0,65 situada debajo de la pasarela superior. La línea de colocación cian marca el nivel de desbordamiento. Los acabados coincidentes no cambian el comportamiento del agua; solo afectan a la apariencia."
itIT = "Diga standard: l'acqua tracima la barriera di livello 0,65 sotto il passaggio superiore. La linea di posizionamento ciano indica il livello di tracimazione. Le opere corrispondenti completano l'aspetto; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Звичайна гребля: вода переливається через бар'єр на рівні 0,65 нижче верхньої доріжки. Блакитна лінія розміщення позначає рівень переливу. Відповідні роботи завершуються; зовнішній вигляд не змінює поведінку води."
thTH = "เขื่อนแบบปกติ: น้ำจะไหลล้นข้ามกำแพงกั้นระดับ 0.65 ที่อยู่ต่ำกว่าทางเดินด้านบน เส้นวางสีฟ้าอมเขียวแสดงระดับการล้น งานตกแต่งที่ตรงกันจะไม่เปลี่ยนพฤติกรรมของน้ำ"
