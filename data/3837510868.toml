beBY = "Ванільная плаціна: вада пераліваецца цераз бар'ер на ўзроўні 0,65 ніжэй верхняй пешаходнай дарожкі. Ціянавая лінія размяшчэння пазначае ўзровень перапаўнення. Адпаведныя роботы завяршаюцца; змяненне выгляду не ўплывае на паводзіны вады."
roRO = "Baraj vanilla: apa se revarsă peste bariera de nivel 0,65 de sub pasarela superioară. Linia cyan de amplasare marchează nivelul de revărsare. Lucrările corespunzătoare se finalizează; aspectul nu schimbă comportamentul apei."
huHU = "Vanilla gát: a víz a felső sétány alatti 0,65-ös szintű akadály fölött ömlik túl. A ciánkék lerakási vonal a túlfolyás szintjét jelöli. A megfelelő kivitelezések befejeződnek; a megjelenés nem változtatja meg a víz viselkedését."
arSA = "السد الأساسي: يفيض الماء فوق الحاجز الذي يبلغ مستواه 0.65 أسفل الممشى العلوي. يحدد الخط السماوي لوضع البناء مستوى الفيضان. تنهي المنتجات المطابقة التشطيب، لكن المظهر لا يغير سلوك الماء."

