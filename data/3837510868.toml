deDE = "Vanilla-Damm: Wasser fließt über die 0,65-Höhe-Barriere unterhalb des oberen Laufstegs. Die türkisfarbene Platzierungslinie markiert das Überlaufniveau. Passende Oberflächen werden fertiggestellt; das Aussehen verändert das Wasserverhalten nicht."
plPL = "Zwykła tama: woda przelewa się przez barierę na poziomie 0,65 poniżej górnego chodnika. Turkusowa linia ustawienia oznacza poziom przelewu. Pasujące elementy wykończenia nie zmieniają zachowania wody, wpływają jedynie na wygląd."
ptBR = "Barragem vanilla: a água transborda pela barreira de nível 0,65 abaixo da passarela superior. A linha ciano de posicionamento marca o nível de transbordamento. Os acabamentos correspondentes ficam prontos; a aparência não altera o comportamento da água."
koKR = "Vanilla 댐: 물은 상단 通로 아래의 0.65 높이 장벽 위로 넘쳐 흐릅니다. 청록색 배치선은 넘침 수위를 표시합니다. 일치하는 작업은 마감만 바뀌며, 외형은 물의 동작을 바꾸지 않습니다."
csCZ = "Vanilla přehrada: voda přetéká přes bariéru ve výšce 0,65 pod horní chodníkem. Azurová čára umístění označuje úroveň přetoku. Odpovídající dokončené práce; vzhled nemění chování vody."
viVN = "Đập tiêu chuẩn: nước tràn qua rào chắn ở mức 0,65 bên dưới lối đi phía trên. Vạch đặt màu xanh lam đánh dấu mức tràn. Kiểu hoàn thiện khớp với công trình không thay đổi, chỉ có ngoại hình là khác; hành vi của nước vẫn giữ nguyên."
trTR = "Vanilla baraj: su, üst yürüyüş yolunun altındaki 0.65 seviyesindeki engelin üzerinden taşar. Turkuaz yerleştirme çizgisi taşma seviyesini gösterir. Eşleşen yapılar işi tamamlar; görünüm su davranışını değiştirmez."
esES = "Presa vanilla: el agua se desborda sobre la barrera de nivel 0,65 situada debajo de la pasarela superior. La línea de colocación cian marca el nivel de desbordamiento. Los acabados coinciden; el aspecto no cambia el comportamiento del agua."
itIT = "Diga standard: l'acqua trabocca sopra la barriera di livello 0,65 sotto il passaggio superiore. La linea di posizionamento ciano indica il livello di tracimazione. Le opere corrispondenti completano la struttura; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Звичайна гребля: вода переливається через бар'єр рівня 0.65 під верхньою доріжкою. Блакитна лінія розміщення позначає рівень переливу. Відповідність робіт визначає результат; зовнішній вигляд не змінює поведінку води."
thTH = "เขื่อนพื้นฐาน: น้ำจะไหลล้นข้ามกำแพงกั้นระดับ 0.65 ที่อยู่ต่ำกว่าทางเดินด้านบน เส้นวางสีฟ้าอมเขียวแสดงระดับที่น้ำจะล้น ผิวภายนอกที่ตรงกันไม่ทำให้พฤติกรรมของน้ำเปลี่ยนไป"
caES = "Presa de model vanilla: l'aigua vessa per sobre de la barrera de nivell 0,65 situada sota la passarel·la superior. La línia cian de col·locació marca el nivell de desbordament. Els acabats amb coincidència es completen; l'aspecte no canvia el comportament de l'aigua."
beBY = "Звычайная плаціна: вада пераліваецца цераз бар'ер на ўзроўні 0,65 ніжэй верхняй пешаходнай дарожкі. Ціянавая лінія размяшчэння пазначае ўзровень перапаўнення. Адпаведныя роботы завяршаюцца; выгляд не мяняе паводзіны вады."
roRO = "Baraj de bază: apa se revarsă peste bariera de nivel 0,65 de sub pasarela de sus. Linia cyan de amplasare marchează nivelul de revărsare. Lucrările corespunzătoare se termină; aspectul nu schimbă comportamentul apei."
huHU = "Vanilla gát: a víz a felső sétány alatti 0,65-ös szintű korláton folyik át. A türkiz elhelyezési vonal jelöli a túlfolyási szintet. A megfelelő kivitelek elkészülnek; a megjelenés nem változtatja meg a víz viselkedését."
arSA = "سد فانيلا: يفيض الماء فوق الحاجز الذي يبلغ مستوى 0.65 أسفل الممشى العلوي. يحدد الخط السيان لوضع البناء مستوى الفيضان. تنتهي المطابقة مع الأعمال، ولا يغيّر المظهر سلوك المياه."

