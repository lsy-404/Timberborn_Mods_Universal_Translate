["LV.SE.AutosaveWarningDesc"]
raw = "Show a warning some time before the game autosaves. This is useful for players who dislike game stuttering on autosave."
status = "normal"
enUS = "Show a warning some time before the game autosaves. This is useful for players who dislike game stuttering during autosave."
zhCN = "勾选后，游戏定期保存之前会显示一个警告，以提示即将发生游戏卡顿。"
zhTW = "在遊戲自動儲存之前顯示警告。這對於不喜歡自動儲存時遊戲卡頓的玩家來說非常有用。"
ruRU = "Показывайте предупреждение за некоторое время до автоматического сохранения игры. Это полезно для игроков, которым не нравится подтормаживание игры при автоматическом сохранении."
jaJP = "ゲームが自動保存する前に警告を表示します。これは、自動保存時のゲームのカクつきを嫌うプレイヤーにとって便利です。"
frFR = "Affichez un avertissement un certain temps avant que le jeu ne sauvegarde automatiquement. Cela est utile pour les joueurs qui n'aiment pas le ralentissement du jeu lors de la sauvegarde automatique."
deDE = "Zeigen Sie eine Warnung einige Zeit bevor das Spiel automatisch speichert. Dies ist nützlich für Spieler, die Spielruckler beim automatischen Speichern nicht mögen."
plPL = "Pokaż ostrzeżenie chwilę przed automatycznym zapisem gry. Jest to przydatne dla graczy, którzy nie lubią zacięć w grze podczas automatycznego zapisywania."
ptBR = "Mostre um aviso algum tempo antes do jogo fazer o salvamento automático. Isso é útil para jogadores que não gostam de travamentos no jogo durante o salvamento automático."
koKR = "게임이 자동 저장되기 전에 미리 경고를 표시합니다. 이는 자동 저장 시 게임이 끊기는 것을 싫어하는 플레이어에게 유용합니다."
trTR = "Oyun otomatik kaydetmeden önce bir süre uyarı göster. Bu, otomatik kaydetme sırasında oyunun takılmasından hoşlanmayan oyuncular için faydalıdır."
esES = "Mostrar una advertencia poco antes de que el juego se guarde automáticamente. Esto es útil para los jugadores que no quieren que el juego se entrecorte al guardarse automáticamente."
itIT = "Mostra un avviso poco prima che il gioco salvi automaticamente. Questo è utile per i giocatori che non gradiscono che il gioco si blocchi per un attimo durante il salvataggio automatico."
ukUA = "Показувати попередження за деякий час до автозбереження гри. Це корисно для гравців, яким не подобаються лаги гри під час автозбереження."
thTH = "แสดงคำเตือนล่วงหน้าก่อนที่เกมจะบันทึกอัตโนมัติสักครู่ ซึ่งมีประโยชน์สำหรับผู้เล่นที่ไม่ชอบให้เกมกระตุกขณะบันทึกอัตโนมัติ"
csCZ = "Zobrazit upozornění nějakou dobu před tím, než hra automaticky uloží. To je užitečné pro hráče, kteří nemají rádi trhání hry během automatického ukládání."
viVN = "Hiển thị cảnh báo trước khi trò chơi tự động lưu một khoảng thời gian. Điều này hữu ích cho người chơi không thích hiện tượng giật lag khi tự động lưu."
caES = "Mostra un avís una estona abans que el joc es desi automàticament. Això és útil per als jugadors que no volen que el joc es bloquegi o es vegi afectat quan es desa automàticament."
beBY = "Паказваць папярэджанне крыху раней, чым гульня выканае аўтазахаванне. Гэта зручна для гульцоў, якім не падабаецца, што гульня заціхае падчас аўтазахавання."
roRO = "Afișează un avertisment cu puțin timp înainte ca jocul să se salveze automat. Acest lucru este util pentru jucătorii care nu agreează blocajele jocului la salvarea automată."
huHU = "Figyelmeztetést jelenít meg egy kicsit a játék automatikus mentése előtt. Ez hasznos azoknak a játékosoknak, akik nem szeretik, ha az automatikus mentés akadozást okoz a játékban."
arSA = "تعرض تحذيرًا قبل الحفظ التلقائي للعبة بوقت قصير. وهذا مفيد للاعبين الذين يكرهون تقطّع اللعبة عند الحفظ التلقائي."

