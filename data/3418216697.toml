["LV.SE.EnabledDesc"]
raw = "Whether to save every x days or not. Does not affect 'special first cycle day' and 'extra save on weather warning' options."
status = "normal"
enUS = "Whether to save every x days or not. Does not affect 'special first cycle day' and 'extra save on weather warning' options."
zhCN = "是否每隔 x 天保存一次。不会影响“特殊第一循环日”和“天气警告额外保存”选项。"
zhTW = "是否每隔x天進行存檔。此選項不影響「特殊的第一循環天」和「天氣警告額外存檔」選項。"
ruRU = "Сохранять ли каждые x дней или нет. Не влияет на параметры 'специальный первый день цикла' и 'дополнительное сохранение при предупреждении о погоде'."
jaJP = "x日ごとに保存するかどうか。'特別な最初のサイクルの日'および'天候警告時の追加保存'オプションには影響しません。"
frFR = "Que ce mod sauvegarde tous les x jours ou non. Cela n'affecte pas les options 'jour spécial du premier cycle' et 'sauvegarde supplémentaire en cas d'alerte météorologique'."
deDE = "Ob alle x Tage gespeichert wird oder nicht. Beeinflusst nicht die Optionen 'besonderer erster Zykustag' und 'zusätzliches Speichern bei Wetterwarnung'."
plPL = "Czy co x dni należy zapisywać, czy nie. Nie wpływa na opcje 'specjalny pierwszy dzień cyklu' oraz 'dodatkowe zapisy przy ostrzeżeniu pogodowym'."
ptBR = "Se vai salvar a cada x dias ou não. Não afeta as opções de 'dia especial do primeiro ciclo' e 'salvamento extra em alerta de clima'."
koKR = "매 x일마다 저장할지 여부. '특별 첫 사이클 하루' 및 '날씨 경고 시 추가 저장' 옵션에는 영향을 주지 않습니다."
trTR = "Her x günde kaydedilip kaydedilmeyeceğini belirler. 'Özel ilk döngü günü' ve 'hava uyarısı sırasında ekstra kaydet' seçeneklerini etkilemez."
esES = "Si guardar cada x días o no. No afecta a las opciones \"día especial del primer ciclo\" y \"guardado extra al haber aviso de clima\"."
itIT = "Se salvare ogni x giorni o meno. Non influisce sulle opzioni \"primo giorno del ciclo speciale\" e \"salvataggio extra all'avviso di maltempo\"."
ukUA = "Чи зберігати кожні x днів чи ні. Не впливає на опції «особливий перший день циклу» та «додаткове збереження під час попередження про погоду»."
thTH = "การบันทึกทุก ๆ กี่วันหรือไม่ ไม่มีผลต่อตัวเลือก 'วันแรกของรอบพิเศษ' และ 'บันทึกเพิ่มเมื่อมีการเตือนสภาพอากาศ'"
csCZ = "„Zda ukládat každé x dní, nebo ne. Neovlivňuje možnosti 'speciální první cyklus den' a 'extra uložení při varování před počasím'.“"
viVN = "Có lưu mỗi x ngày hay không. Không ảnh hưởng đến các tùy chọn 'ngày đầu chu kỳ đặc biệt' và 'lưu thêm khi có cảnh báo thời tiết'."
caES = "Si desar cada x dies o no. No afecta les opcions \"primer dia especial del cicle\" i \"desar extra en avís de meteorologia\"."
beBY = "Ці захоўваць гульню кожныя x дзён або не. Не ўплывае на опцыі «спецыяльны першы дзень цыкла» і «дадатковае захаванне пры папярэджанні аб надвор'і»."
roRO = "Dacă să se salveze la fiecare x zile sau nu. Nu afectează opțiunile „ziua specială a primului ciclu” și „salvare suplimentară la avertizarea meteo”."
huHU = "Azt határozza meg, hogy minden x napban mentsen-e, vagy sem. Nem befolyásolja a „különleges első ciklusnap” és a „extra mentés időjárási figyelmeztetéskor” beállításokat."
arSA = "سواء كان سيتم الحفظ كل عدد معين من الأيام أم لا. لا يؤثر ذلك على خياري \"يوم الدورة الأول الخاص\" و\"حفظ إضافي عند تحذير الطقس\"."

