["LV.SE.AutoSaveFilenameDesc"]
raw = "Custom filename for auto-saves. If you use this,\nmake sure to put .saveeveryday at the end to auto delete. If not, the game will not delete the save file automatically.\nUse {0} for cycle number and {1} for cycle day number and {2} for total day. For example: C{0}_D{1}.saveeveryday.\nLeave empty to use the default filename (SaveDay{2}.saveeveryday)."
status = "normal"
enUS = "Custom filename for auto-saves. If you use this, make sure to put .saveeveryday at the end to enable auto deletion. If not, the game will not automatically delete the save file. Use {0} for cycle number, {1} for cycle day number, and {2} for total days. For example: C{0}_D{1}.saveeveryday. Leave empty to use the default filename (SaveDay{2}.saveeveryday)."
zhCN = "可以更改定期存档的名称，留空则使用模组默认（SaveDay{2}.saveeveryday）。<br>使用“{0}”表示周期数，“{1}”表示周期天数，“{2}”表示总天数。<br>注意，末尾须添加“.saveeveryday”，否则游戏不会自动删除多余的定期存档。"
zhTW = "自動保存的自定義檔名。如果您使用此選項，請確保在末尾加上 .saveeveryday，以便自動刪除。如果沒有，遊戲將不會自動刪除保存檔案。使用 {0} 作為循環編號，{1} 作為循環天數，{2} 作為總天數。例如：C{0}_D{1}.saveeveryday。留空將使用預設檔名（SaveDay{2}.saveeveryday）。"
ruRU = "Пользовательское имя файла для авто-сохранений. Если вы используете это, обязательно добавьте .saveeveryday в конце, чтобы автоматически удалить. В противном случае игра не будет автоматически удалять файл сохранения. Используйте {0} для номера цикла, {1} для номера дня цикла и {2} для общего числа дней. Например: C{0}_D{1}.saveeveryday. Оставьте пустым, чтобы использовать имя файла по умолчанию (SaveDay{2}.saveeveryday)."
jaJP = "自動保存のカスタムファイル名。これを使用する場合は、.saveeverydayを末尾に付けて自動削除できるようにしてください。そうしないと、ゲームは保存ファイルを自動的に削除しません。\nサイクル番号には{0}を、サイクル日番号には{1}を、合計日数には{2}を使用してください。例：C{0}_D{1}.saveeveryday。\nデフォルトのファイル名（SaveDay{2}.saveeveryday）を使用するには空白のままにしてください。"
frFR = "Nom de fichier personnalisé pour les sauvegardes automatiques. Si vous utilisez cela, assurez-vous d’ajouter .saveeveryday à la fin pour supprimer automatiquement. Sinon, le jeu ne supprimera pas le fichier de sauvegarde automatiquement. Utilisez {0} pour le numéro de cycle et {1} pour le numéro de jour de cycle et {2} pour le jour total. Par exemple : C{0}_D{1}.saveeveryday. Laissez vide pour utiliser le nom de fichier par défaut (SaveDay{2}.saveeveryday)."
deDE = "Benutzerdefinierter Dateiname für automatisches Speichern. Wenn Sie dies verwenden, stellen Sie sicher, dass Sie am Ende .saveeveryday hinzufügen, um automatisch zu löschen. Andernfalls wird die Spielstanddatei nicht automatisch gelöscht. Verwenden Sie {0} für die Zyklusnummer und {1} für die Zyklustagnummer und {2} für den Gesamttag. Zum Beispiel: C{0}_D{1}.saveeveryday. Lassen Sie es leer, um den Standarddateinamen (SaveDay{2}.saveeveryday) zu verwenden."
plPL = "Niestandardowa nazwa pliku dla automatycznych zapisów. Jeśli to robisz, upewnij się, że na końcu dodasz .saveeveryday, aby automatycznie usunąć. W przeciwnym razie gra nie usunie pliku zapisu automatycznie. Użyj {0} dla numeru cyklu, {1} dla numeru dnia cyklu i {2} dla łącznej liczby dni. Na przykład: C{0}_D{1}.saveeveryday. Pozostaw puste, aby użyć domyślnej nazwy pliku (SaveDay{2}.saveeveryday)."
ptBR = "Nome de arquivo personalizado para salvamentos automáticos. Se você usar isso, certifique-se de colocar .saveeveryday no final para exclusão automática. Caso contrário, o jogo não excluirá o arquivo de salvamento automaticamente. Use {0} para o número do ciclo, {1} para o número do dia do ciclo e {2} para o total de dias. Por exemplo: C{0}_D{1}.saveeveryday. Deixe em branco para usar o nome de arquivo padrão (SaveDay{2}.saveeveryday)."
koKR = "자동 저장을 위한 사용자 지정 파일 이름입니다. 이를 사용할 경우, 자동 삭제를 위해 끝에 .saveeveryday를 꼭 추가하세요. 그렇지 않으면 게임이 저장 파일을 자동으로 삭제하지 않습니다. {0}은 사이클 번호, {1}은 사이클 일수, {2}는 총 일수를 나타냅니다. 예: C{0}_D{1}.saveeveryday. 기본 파일 이름(SaveDay{2}.saveeveryday)을 사용하려면 비워두세요."
trTR = "Otomatik kayıtlara özel dosya adı. Bunu kullanıyorsanız, otomatik silme için sonuna .saveeveryday eklediğinizden emin olun. Aksi takdirde, oyun kayıt dosyasını otomatik olarak silmeyecektir. Döngü numarası için {0}, döngü günü numarası için {1} ve toplam gün için {2} kullanın. Örneğin: C{0}_D{1}.saveeveryday. Varsayılan dosya adını kullanmak için boş bırakın (SaveDay{2}.saveeveryday)."
esES = "Nombre de archivo personalizado para los guardados automáticos. Si lo usas,\nasegúrate de añadir .saveeveryday al final para que se borre automáticamente. Si no, el juego no eliminará el archivo de guardado automáticamente.\nUsa {0} para el número de ciclo, {1} para el número de día del ciclo y {2} para el día total. Por ejemplo: C{0}_D{1}.saveeveryday.\nDéjalo vacío para usar el nombre de archivo predeterminado (SaveDay{2}.saveeveryday)."
itIT = "Nome file personalizzato per i salvataggi automatici. Se lo usi,\nassicurati di aggiungere .saveeveryday alla fine, così il file viene eliminato automaticamente. In caso contrario, il gioco non eliminerà automaticamente il file di salvataggio.\nUsa {0} per il numero del ciclo, {1} per il numero del giorno nel ciclo e {2} per il giorno totale. Ad esempio: C{0}_D{1}.saveeveryday.\nLascia vuoto per usare il nome file predefinito (SaveDay{2}.saveeveryday)."
ukUA = "Власна назва файлу для автозбережень. Якщо ви використовуєте її,\nобов'язково додайте .saveeveryday в кінці, щоб збереження автоматично видалялися. Якщо ні, гра не видалятиме файл збереження автоматично.\nВикористовуйте {0} для номера циклу, {1} для номера дня циклу та {2} для загального дня. Наприклад: C{0}_D{1}.saveeveryday.\nЗалиште порожнім, щоб використовувати стандартну назву файлу (SaveDay{2}.saveeveryday)."
thTH = "ชื่อไฟล์แบบกำหนดเองสำหรับการบันทึกอัตโนมัติ หากคุณใช้ค่านี้\nโปรดตรวจสอบให้แน่ใจว่าได้ใส่ .saveeveryday ที่ท้ายชื่อเพื่อให้ระบบลบอัตโนมัติ หากไม่ใส่ เกมจะไม่ลบไฟล์บันทึกนั้นโดยอัตโนมัติ\nใช้ {0} สำหรับหมายเลขรอบ ใช้ {1} สำหรับหมายเลขวันในรอบ และใช้ {2} สำหรับจำนวนวันทั้งหมด ตัวอย่างเช่น: C{0}_D{1}.saveeveryday\nเว้นว่างไว้เพื่อใช้ชื่อไฟล์เริ่มต้น (SaveDay{2}.saveeveryday)"
csCZ = "Vlastní název souboru pro automatické ukládání. Pokud to použijete, ujistěte se, že na konci je .saveeveryday pro automatické smazání. Pokud ne, hra soubor s uložením automaticky nesmaže. Použijte {0} pro číslo cyklu, {1} pro číslo dne cyklu a {2} pro celkový den. Například: C{0}_D{1}.saveeveryday. Nechte prázdné pro použití výchozího názvu souboru (SaveDay{2}.saveeveryday)."
viVN = "Tên tệp tùy chỉnh cho lưu tự động. Nếu bạn sử dụng tính năng này, hãy đảm bảo thêm .saveeveryday vào cuối để tự động xóa. Nếu không, trò chơi sẽ không tự động xóa tệp lưu. Sử dụng {0} cho số chu kỳ và {1} cho số ngày của chu kỳ và {2} cho tổng số ngày. Ví dụ: C{0}_D{1}.saveeveryday. Để trống để sử dụng tên tệp mặc định (SaveDay{2}.saveeveryday)."
caES = "Nom de fitxer personalitzat per als desats automàtics. Si l'utilitzes,\nassegura't d'afegir .saveeveryday al final perquè s'eliminin automàticament. Si no, el joc no eliminarà el fitxer de desat automàticament.\nFes servir {0} per al número de cicle, {1} per al número de dia del cicle i {2} per al dia total. Per exemple: C{0}_D{1}.saveeveryday.\nDeixa-ho buit per utilitzar el nom de fitxer predeterminat (SaveDay{2}.saveeveryday)."
beBY = "Користальніцкая назва файла для аўтазахаванняў. Калі вы выкарыстоўваеце гэта,\nпераканайцеся, што дадалі .saveeveryday у канцы, каб файл аўтаматычна выдаляўся. Калі не, гульня не будзе выдаляць файл захавання аўтаматычна.\nВыкарыстоўвайце {0} для нумара цыкла, {1} для нумара дня цыкла і {2} для агульнага дня. Напрыклад: C{0}_D{1}.saveeveryday.\nПакіньце пустым, каб выкарыстоўваць стандартную назву файла (SaveDay{2}.saveeveryday)."
roRO = "Nume de fișier personalizat pentru salvările automate. Dacă folosiți această opțiune,\nasigurați-vă că adăugați .saveeveryday la final pentru ștergerea automată. Dacă nu, jocul nu va șterge automat fișierul de salvare.\nFolosiți {0} pentru numărul ciclului, {1} pentru numărul zilei din ciclu și {2} pentru numărul total al zilelor. De exemplu: C{0}_D{1}.saveeveryday.\nLăsați gol pentru a folosi numele implicit de fișier (SaveDay{2}.saveeveryday)."
huHU = "Egyedi fájlnév az automatikus mentésekhez. Ha ezt használod,\ngyőződj meg róla, hogy a végére a .saveeveryday kiterjesztés kerül, hogy a fájl automatikusan törlődjön. Ellenkező esetben a játék nem törli automatikusan a mentésfájlt.\nA {0} a ciklus számát, a {1} a ciklus napjának sorszámát, a {2} pedig az összes eltelt nap számát jelöli. Például: C{0}_D{1}.saveeveryday.\nHagyd üresen, ha az alapértelmezett fájlnevet szeretnéd használni (SaveDay{2}.saveeveryday)."
arSA = "اسم ملف مخصص للحفظ التلقائي. إذا استخدمت هذا،\nفتأكد من وضع .saveeveryday في نهاية الاسم ليتم الحذف التلقائي. وإذا لم تفعل ذلك، فلن تحذف اللعبة ملف الحفظ تلقائيًا.\nاستخدم {0} لرقم الدورة، و{1} لرقم يوم الدورة، و{2} لإجمالي الأيام. على سبيل المثال: C{0}_D{1}.saveeveryday.\nاتركه فارغًا لاستخدام اسم الملف الافتراضي (SaveDay{2}.saveeveryday)."

