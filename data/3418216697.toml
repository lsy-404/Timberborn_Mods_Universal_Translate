["LV.SE.SaveWeatherWarningDesc"]
raw = "When a weather warning is issued, make an extra save named 'weatherwarning.save' that is only overwritten by the next cycle's warning. This save is not counted towards the save count."
status = "normal"
enUS = "When a weather warning is issued, make an extra save named 'weatherwarning.save' that is only overwritten by the next cycle's warning. This save does not count towards the save count."
zhCN = "勾选后，将在恶劣天气预警时自动保存，下一次恶劣天气预警时会自动覆盖保存。"
zhTW = "當發布氣象警報時，請額外保存一個名為 'weatherwarning.save' 的檔案，該檔案僅在下一個循環的警報中被覆蓋。該保存不計入保存計數。"
ruRU = "Когда выдается предупреждение о погоде, создается дополнительный сохранение с названием 'weatherwarning.save', которое перезаписывается только следующим предупреждением цикла. Это сохранение не учитывается в общем количестве сохранений."
jaJP = "気象警報が発令されたときは、「weatherwarning.save」という名前の追加保存を行い、次のサイクルの警報によってのみ上書きされるようにします。この保存は保存数には含まれません。"
frFR = "Lorsque qu'un avertissement météo est émis, créez une sauvegarde supplémentaire nommée 'weatherwarning.save' qui n'est écrasée que par l'avertissement du cycle suivant. Cette sauvegarde n'est pas prise en compte dans le nombre de sauvegardes."
deDE = "Wenn eine Wetterwarnung ausgegeben wird, erstellen Sie ein zusätzliches Save mit dem Namen 'weatherwarning.save', das nur von der nächsten Warnung des Zyklus überschrieben wird. Dieses Save zählt nicht zur Anzahl der Saves."
plPL = "Gdy wydany zostaje alert pogodowy, utwórz dodatkowe zapisanie o nazwie 'weatherwarning.save', które jest nadpisywane tylko przez ostrzeżenie z następnej rundy. To zapisanie nie jest zaliczane do liczby zapisów."
ptBR = "Quando um aviso meteorológico é emitido, crie uma salvaguarda extra chamada 'weatherwarning.save' que só será sobrescrita pelo aviso do próximo ciclo. Essa salvaguarda não conta para a contagem de salvamentos."
koKR = "날씨 경고가 발령될 때, 'weatherwarning.save'라는 이름의 추가 저장을 생성하며, 이 저장은 다음 사이클의 경고로만 덮어씌워집니다. 이 저장은 저장 개수에 포함되지 않습니다."
trTR = "Bir hava uyarısı verildiğinde, 'weatherwarning.save' adında ekstra bir kayıt oluşturun ve bu kayıt yalnızca bir sonraki döngünün uyarısıyla üzerine yazılır. Bu kayıt, kayıt sayısına dahil edilmez."
esES = "Cuando se emita una advertencia meteorológica, crea un guardado adicional llamado \"weatherwarning.save\" que solo se sobrescribe con la siguiente advertencia del ciclo. Este guardado no se cuenta en el número de guardados."
itIT = "Quando viene emesso un avviso meteorologico, crea un salvataggio extra chiamato 'weatherwarning.save' che viene sovrascritto solo dal successivo avviso del ciclo. Questo salvataggio non viene conteggiato nel numero dei salvataggi."
ukUA = "Коли видається попередження про погоду, створити додатковe збереження під назвою «weatherwarning.save», яке перезаписується лише наступним попередженням циклу. Це збереження не враховується в кількості збережень."
thTH = "เมื่อมีการออกคำเตือนสภาพอากาศ ให้สร้างไฟล์บันทึกเพิ่มเติมชื่อ 'weatherwarning.save' ซึ่งจะถูกเขียนทับเฉพาะเมื่อมีคำเตือนของรอบถัดไปเท่านั้น ไฟล์บันทึกนี้จะไม่ถูกนับรวมในจำนวนไฟล์บันทึกทั้งหมด"
csCZ = "Když je vydáno varování před počasím, vytvořte další zálohu nazvanou 'weatherwarning.save', která je přepsána pouze varováním z dalšího cyklu. Tato záloha se nezapočítává do celkového počtu záloh."
viVN = "Khi một cảnh báo thời tiết được đưa ra, hãy tạo một bản lưu bổ sung có tên 'weatherwarning.save' chỉ bị ghi đè bởi cảnh báo của chu kỳ tiếp theo. Bản lưu này không được tính vào số lần lưu."
caES = "Quan s'emet un avís meteorològic, fes un desat extra anomenat \"weatherwarning.save\" que només se sobreescriu amb l'avís del següent cicle. Aquest desat no es compta en el recompte de desats."
beBY = "Пры выдачы папярэджання аб надвор'і стварайце дадатковае захаванне пад назвай «weatherwarning.save», якое перазапісваецца толькі наступxadным папярэджаннем цыкла. Гэта захаванне не ўлічваецца ў колькасці захаванняў."
roRO = "Când se emite un avertisment meteo, creează un salvat suplimentar numit „weatherwarning.save”, care este suprascris doar de avertismentul ciclului următor. Acest salvat nu se numără în numărul de salvări."
huHU = "Amikor időjárási figyelmeztetés érkezik, készíts egy extra mentést „weatherwarning.save” néven, amelyet csak a következő ciklus figyelmeztetése írhat felül. Ez a mentés nem számít bele a mentések számába."
arSA = "عند إصدار تحذير من الطقس، أنشئ حفظًا إضافيًا باسم 'weatherwarning.save' لا يُستبدل إلا بتحذير الدورة التالية. لا يُحتسب هذا الحفظ ضمن عدد الحفظات."

