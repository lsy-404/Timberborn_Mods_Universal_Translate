zhCN = "价格每天应变化的速度。0表示没有变化，1表示瞬时变化。起始和结束的过渡大约持续（1 / 过渡速度）天。"
zhTW = "價格每日變動的速度。0表示無變化，1表示瞬時變化。開始和結束的過渡將持續約（1 / 過渡速度）天。"
ruRU = "Насколько быстро цена должна изменяться в день. 0 - это отсутствие изменений, 1 - мгновенно. Начальные и конечные переходы будут длиться примерно (1 / Скорость перехода) дней."
jaJP = "価格が1日あたりどれくらい変動するか。0はなし、1は即時。開始と終了の遷移は約（1 / 遷移速度）日間続きます。"
frFR = "À quelle vitesse le prix doit-il changer par jour. 0 signifie aucun changement, 1 est instantané. Les transitions de début et de fin dureront environ (1 / Vitesse de transition) jours."
deDE = "Wie schnell der Preis pro Tag ändern sollte. 0 ist keine Änderung, 1 ist sofort. Die Anfangs- und Endübergänge dauern ungefähr (1 / Übergangsgeschwindigkeit) Tage."
plPL = "„Jak szybko cena powinna się zmieniać na dzień. 0 oznacza brak zmiany, 1 oznacza natychmiastową zmianę. Początkowe i końcowe przejścia będą trwały około (1 / Prędkości przejścia) dni.”"
ptBR = "Quão rápido o preço deve mudar por dia. 0 é nenhum, 1 é instantâneo. As transições de início e fim durarão aproximadamente (1 / Velocidade de transição) dias."
koKR = "가격이 하루에 얼마나 빨리 변할지. 0은 없음, 1은 즉시. 시작과 끝 전환은 약 (1 / 전환 속도)일 동안 지속됩니다."
trTR = "Fiyatın günde ne kadar hızlı değişmesi gerektiği. 0 yok, 1 anında. Başlangıç ve bitiş geçişleri yaklaşık (1 / Geçiş hızı) gün sürecektir."
esES = "A qué velocidad debería cambiar el precio por día. 0 significa que no cambia, 1 que cambia instantáneamente. Las transiciones inicial y final durarán aproximadamente (1 / Velocidad de transición) días."
itIT = "Quanto velocemente dovrebbe cambiare il prezzo ogni giorno. 0 significa nessun cambiamento, 1 significa istantaneamente. Le transizioni iniziale e finale dureranno circa (1 / velocità di transizione) giorni."
ukUA = "Як швидко має змінюватися ціна за день. 0 — не змінюється, 1 — миттєво. Початковий і кінцевий перехід триватимуть приблизно (1 / швидкість переходу) днів."
thTH = "ความเร็วที่ราคาควรเปลี่ยนแปลงต่อวัน 0 คือไม่เปลี่ยนเลย, 1 คือเปลี่ยนทันที ช่วงเปลี่ยนผ่านตอนเริ่มต้นและตอนสิ้นสุดจะใช้เวลาประมาณ (1 / ความเร็วในการเปลี่ยนผ่าน) วัน"
csCZ = "Jak rychle by se měla cena měnit za den. 0 je žádná změna, 1 je okamžitá. Počáteční a koncové přechody budou trvat přibližně (1 / Rychlost přechodu) dní."
viVN = "Tốc độ thay đổi giá mỗi ngày. 0 là không có, 1 là ngay lập tức. Thời gian chuyển tiếp bắt đầu và kết thúc sẽ kéo dài khoảng (1 / Tốc độ chuyển tiếp) ngày."
caES = "La velocitat a la qual hauria de canviar el preu cada dia. 0 significa cap canvi, 1 és instantani. Les transicions inicial i final duraran aproximadament (1 / velocitat de transició) dies."
beBY = "Як хутка павінна змяняцца цана за дзень. 0 — без змен, 1 — імгненна. Пачатковы і канчатковы пераходы будуць доўжыцца прыблізна (1 / хуткасць пераходу) дзён."
roRO = "Cât de repede ar trebui să se schimbe prețul în fiecare zi. 0 înseamnă deloc, 1 înseamnă instantaneu. Tranzițiile de început și de sfârșit vor dura aproximativ (1 / Viteza tranziției) zile."
huHU = "Milyen gyorsan változzon az ár naponta. A 0 azt jelenti, hogy nincs változás, az 1 pedig azt, hogy azonnali. A kezdő és a befejező átmenet körülbelül (1 / az átmenet sebessége) napig tart."
arSA = "مدى سرعة تغيّر السعر يوميًا. 0 يعني عدم التغيّر، و1 يعني تغيّرًا فوريًا. ستستغرق الانتقالات عند البداية والنهاية حوالي (1 / سرعة الانتقال) يومًا."

