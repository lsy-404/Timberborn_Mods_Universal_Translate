huHU = "Mekkora lehet az árváltozás. A 0 azt jelenti, hogy nincs változás. A 0.5 +/- 50%-ot jelent, a 2.0 pedig +/- 200%-ot (Az ár soha nem csökkenhet a normál érték 10%-a alá, de ha ezt 10-re állítod, akár a normál érték fölé 1000%-kal is emelkedhet)."
arSA = "مدى تغيّر الأسعار. 0 يعني عدم حدوث أي تغييرات. 0.5 يعني +/- 50%، و2.0 يعني +/- 200% (لا يمكن أن ينخفض السعر أبدًا إلى أقل من 10% من السعر المعتاد، لكن إذا ضبطت هذه القيمة على 10 فقد يرتفع إلى 1000% فوق السعر المعتاد)."

