["Building.TWTradeOffice.Description"]
raw = "Allows buying and selling of resources. To work, rear wall must touch a warehouse, stockpile, tank, or science building."
status = "normal"
enUS = "Allows buying and selling of resources. To function, the rear wall must be adjacent to a warehouse, stockpile, tank, or science building."
zhCN = "“允许买卖资源。要正常工作，后墙必须靠触仓库、库存、储罐或科技建筑。”"
zhTW = "允許買賣資源。為了運作，後牆必須接觸到倉庫、儲藏室、儲水槽或科技建築。"
ruRU = "Позволяет покупать и Selling ресурсов. Для работы задняя стена должна соприкасаться со складом, хранилищем, резервуаром или научным зданием."
jaJP = "リソースの売買を可能にします。稼働するためには、後面の壁が倉庫、貯蔵庫、タンク、または科学ビルに接触している必要があります。"
frFR = "Permet d'acheter et de vendre des ressources. Pour fonctionner, le mur arrière doit toucher un entrepôt, un stock, un réservoir ou un bâtiment scientifique."
deDE = "Ermöglicht den Kauf und Verkauf von Ressourcen. Damit es funktioniert, muss die Rückwand an ein Lager, einen Vorratsbehälter, einen Wassertank oder ein Wissenschaftsgebäude anstoßen."
plPL = "Pozwala na kupno i sprzedaż zasobów. Aby działać, tylna ściana musi dotykać magazynu, składowiska, zbiornika lub budynku naukowego."
ptBR = "Permite a compra e venda de recursos. Para funcionar, a parede traseira deve encostar em um armazém, depósito, tanque ou edifício de ciência."
koKR = "자원 구매 및 판매를 허용합니다. 작동하려면 뒷벽이 창고, 재고, 탱크 또는 과학 건물에 접촉해야 합니다."
trTR = "Kaynak alım satımını sağlar. Çalışabilmesi için arka duvarın bir depoya, stok alanına, tank veya bilim binasına temas etmesi gerekir."
esES = "Permite comprar y vender recursos. Para funcionar, la pared trasera debe estar pegada a un almacén, un depósito de recursos, un tanque o un edificio de ciencia."
itIT = "Consente di acquistare e vendere risorse. Per funzionare, la parete posteriore deve toccare un magazzino, un deposito, un serbatoio o un edificio scientifico."
ukUA = "Дозволяє купувати й продавати ресурси. Для роботи задня стіна має прилягати до складу, майданчика для запасів, резервуара або наукової будівлі."
thTH = "เปิดให้ซื้อและขายทรัพยากรได้ เพื่อให้ทำงานได้ ผนังด้านหลังต้องติดกับคลังสินค้า กองเก็บของ ถังเก็บน้ำ หรืออาคารวิทยาศาสตร์"
csCZ = "Umožňuje nákup a prodej zdrojů. Pro fungování musí zadní stěna dosahovat ke skladu, zásobníku, nádrži nebo vědecké budově."
viVN = "Cho phép mua bán tài nguyên. Để hoạt động, tường sau phải tiếp xúc với kho, bãi chứa, bể chứa hoặc tòa nhà nghiên cứu."
caES = "Permet comprar i vendre recursos. Per funcionar, la paret posterior ha de tocar un magatzem, una pila d'emmagatzematge, un dipòsit o un edifici de ciència."
beBY = "Дазваляе купляць і прадаваць рэсурсы. Каб працаваць, задняя сцяна павінна прылягаць да склада, пляцоўкі для запасаў, рэзервуара або навуковага будынка."
roRO = "Permite cumpărarea și vânzarea resurselor. Pentru a funcționa, peretele din spate trebuie să atingă un depozit, o stivă, un rezervor sau o clădire de cercetare."
huHU = "Lehetővé teszi az erőforrások vásárlását és eladását. A működéséhez a hátsó falának érintkeznie kell egy raktárral, készlethalommal, tartállyal vagy tudományépülettel."
arSA = "يتيح شراء الموارد وبيعها. لكي يعمل، يجب أن يلامس جداره الخلفي مخزنًا أو ساحة تخزين أو خزانًا أو مبنىً علميًا."

["Building.TWTradeOffice.FlavorDescription"]
raw = "Ask not where the goods, they go, nor guess from whence they came."
status = "normal"
enUS = "Ask not where the goods go, nor guess from whence they came."
zhCN = "“不要问货物从何而来，也不要猜测它们去往何方。”"
zhTW = "「不要問貨物從何而來，也不要猜測它們將往何處去。」"
ruRU = "Не спрашивай, куда идут товары, и не пытайся угадать, откуда они пришли."
jaJP = "「物はどこへ行くのか、またはどこから来たのかを問うな。」"
frFR = "Ne demandez pas d'où viennent les marchandises, ni ne devinez d'où elles viennent."
deDE = "Frage nicht, wo die Waren hingehen, noch rate, woher sie gekommen sind."
plPL = "Nie pytaj, dokąd towar idzie, ani nie zgaduj, skąd pochodzi."
ptBR = "Não pergunte de onde vêm as mercadorias, nem adivinhe de onde elas vêm."
koKR = "상품이 어디로 가는지 묻지 말고, 그들이 어디에서 왔는지 추측하지 마라."
trTR = "Malın nereden geldiğini, nereye gittiğini sorma, nereden geldiğini tahmin etme."
esES = "No preguntes adónde van las mercancías, ni adivines de dónde vienen."
itIT = "Non chiedere dove vadano le merci, né indovinare da dove siano giunte."
ukUA = "Не питай, куди товари йдуть, і не гадай, звідки вони прийшли."
thTH = "อย่าถามว่าสินค้าเหล่านี้จะไปที่ใด และอย่าคาดเดาว่ามันมาจากไหน."
