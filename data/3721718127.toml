trTR = "Fiyat değişikliklerinin ne kadar büyük olabileceğini belirtir. 0, değişiklik olmadığını gösterir. 0.5, +/- %50 anlamına gelir. 2.0, +/- %200 anlamına gelir (Fiyat asla normalin %10'unun altına düşemez, ancak bunu 10 olarak ayarlarsanız normalin %1000 üstüne çıkabilir)."
esES = "Cuánto pueden variar los precios. 0 significa que no hay cambios. 0,5 significa +/- 50 %  2,0 significa +/- 200 % (El precio nunca puede bajar del 10 % del precio normal, pero si estableces este valor en 10, puede subir hasta un 1000 % por encima del precio normal)."
itIT = "Di quanto può variare il prezzo. 0 significa nessuna variazione. .5 significa +/- 50%, 2.0 significa +/- 200% (il prezzo non può mai scendere sotto il 10% del valore normale, ma se imposti questo valore su 10 può arrivare fino al 1000% sopra il valore normale)."
ukUA = "Наскільки значними можуть бути зміни цін. 0 означає відсутність змін. .5 означає +/- 50%  2.0 означає +/- 200% (Ціна ніколи не може опуститися нижче 10% від нормальної, але якщо встановити це значення на 10, вона може зрости до 1000% понад норму)."
thTH = "ราคาจะเปลี่ยนแปลงได้มากแค่ไหน 0 หมายถึงไม่มีการเปลี่ยนแปลง .5 หมายถึง +/- 50%  2.0 หมายถึง +/- 200% (ราคาไม่มีทางต่ำกว่า 10% ของราคาปกติ แต่ถ้าตั้งค่านี้เป็น 10 ราคาอาจสูงกว่าราคาปกติได้ถึง 1000%)"
csCZ = "Jak velké mohou být změny cen. 0 znamená žádné změny. 0,5 znamená +/- 50 %, 2,0 znamená +/- 200 % (cena nemůže nikdy klesnout pod 10 % normální ceny, ale pokud to nastavíte na 10, může vzrůst až na 1000 % nad normální cenu)."
viVN = "Các thay đổi giá có thể lớn đến mức nào. 0 có nghĩa là không có thay đổi. 0.5 có nghĩa là +/- 50%. 2.0 có nghĩa là +/- 200% (Giá không bao giờ thấp hơn 10% của mức bình thường, nhưng nếu bạn đặt giá trị này là 10, nó có thể lên đến 1000% so với mức bình thường)."
