ukUA = "Вимірює силу та напрямок вітру й надсилає сигнал автоматизації на основі налаштовуваного порогового значення."
thTH = "วัดความแรงและทิศทางของลม และส่งสัญญาณอัตโนมัติตามเกณฑ์ที่กำหนดได้"
