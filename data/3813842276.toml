["Teleporter.Status.OutOfExtract.Remote.NoSource"]
raw = "Out of extract. Only a wormhole siphon can restart this teleporter, but no teleporter on the district's paths is set as an extract source."
status = "normal"
enUS = "Out of extract. Only a wormhole siphon can restart this teleporter, but no teleporter on the district's paths is set as an extract source."
