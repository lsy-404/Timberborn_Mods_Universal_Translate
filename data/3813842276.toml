zhTW = "抽取物已耗盡。只有蟲洞虹吸器能重新啟動這座傳送器，但此區域道路上的傳送器都未設為抽取源。"
ruRU = "Запас экстракта исчерпан. Перезапустить этот телепортатор может только червоточинный сифон, но ни один телепортатор на путях района не назначен источником экстракта."
jaJP = "抽出物がありません。このテレポーターを再起動できるのはワームホール・サイフォンだけですが、地区内の経路上にあるテレポーターのうち、抽出元に設定されているものはありません。"
frFR = "Extraction épuisée. Seul un siphon de trou de ver peut redémarrer ce téléporteur, mais aucun téléporteur sur les chemins du district n’est défini comme source d’extraction."
deDE = "Keine Extraktquelle. Nur ein Wurmloch-Siphon kann diesen Teleporter neu starten, aber kein Teleporter auf den Wegen des Bezirks ist als Extraktquelle festgelegt."
plPL = "Brak źródła pobierania. Tylko syfon tunelu czasoprzestrzennego może ponownie uruchomić ten teleporter, ale żaden teleporter na ścieżkach dzielnicy nie jest ustawiony jako źródło pobierania."
ptBR = "Sem fonte de extração. Apenas um sifão de buraco de minhoca pode reiniciar este teletransportador, mas nenhum teletransportador nos caminhos do distrito está definido como fonte de extração."
koKR = "추출물 부족. 웜홀 사이펀이 이 순간이동기를 재가동할 수 있는 유일한 방법이지만, 구역 경로에 있는 순간이동기 중 추출원으로 설정된 것은 없습니다."
csCZ = "Došel extrakt. Tento teleporter může znovu spustit pouze červí díra se sifonem, ale žádný teleporter na cestách v okrsku není nastaven jako zdroj extraktu."
viVN = "Đã hết nguồn khai thác. Chỉ có ống hút lỗ sâu mới có thể khởi động lại máy dịch chuyển này, nhưng không có máy dịch chuyển nào trên các lối đi của khu vực được đặt làm nguồn khai thác."
trTR = "Çekim kaynağı yok. Bu ışınlayıcıyı yalnızca bir solucan deliği sifonu yeniden başlatabilir, ancak bölgenin yollarındaki hiçbir ışınlayıcı çekim kaynağı olarak ayarlanmamış."

