["Teleporter.Status.OutOfExtract.Remote.NoSource"]
raw = "Out of extract. Only a wormhole siphon can restart this teleporter, but no teleporter on the district's paths is set as an extract source."
status = "normal"
enUS = "Out of extract. Only a wormhole siphon can restart this teleporter, but no teleporter on the district's paths is set as an extract source."
zhCN = "提取物耗尽。只有虫洞虹吸器能重新启动这台传送器，但该区路径上的传送器都没有设为提取源。"
zhTW = "抽取物已耗盡。只有蟲洞虹吸器能重新啟動這座傳送器，但此區域道路上的傳送器都未設為抽取源。"
ruRU = "Запас экстракта исчерпан. Перезапустить этот телепортатор может только червоточинный сифон, но ни один телепортатор на путях района не назначен источником экстракта."
jaJP = "抽出物がありません。このテレポーターを再起動できるのはワームホール・サイフォンだけですが、地区内の経路上にあるテレポーターのうち、抽出元に設定されているものはありません。"
frFR = "Extraction épuisée. Seul un siphon de trou de ver peut redémarrer ce téléporteur, mais aucun téléporteur sur les chemins du district n’est défini comme source d’extraction."
deDE = "Keine Extraktquelle. Nur ein Wurmloch-Siphon kann diesen Teleporter neu starten, aber kein Teleporter auf den Wegen des Bezirks ist als Extraktquelle festgelegt."
plPL = "Brak źródła pobierania. Tylko syfon tunelu czasoprzestrzennego może ponownie uruchomić ten teleporter, ale żaden teleporter na ścieżkach dzielnicy nie jest ustawiony jako źródło pobierania."
ptBR = "Sem fonte de extração. Apenas um sifão de buraco de minhoca pode reiniciar este teletransportador, mas nenhum teletransportador nos caminhos do distrito está definido como fonte de extração."
koKR = "추출물 부족. 웜홀 사이펀이 이 순간이동기를 재가동할 수 있는 유일한 방법이지만, 구역 경로에 있는 순간이동기 중 추출원으로 설정된 것은 없습니다."
trTR = "Çekim kaynağı yok. Bu ışınlayıcıyı yalnızca bir solucan deliği sifonu yeniden başlatabilir, ancak bölgenin yollarındaki hiçbir ışınlayıcı çekim kaynağı olarak ayarlanmamış."
esES = "Sin extracción. Solo un sifón de agujero de gusano puede reiniciar este teletransportador, pero ningún teletransportador en los caminos del distrito está configurado como fuente de extracción."
itIT = "Fuori dall'estrazione. Solo un sifone del wormhole può riavviare questo teletrasportatore, ma nessun teletrasportatore sui percorsi del distretto è impostato come fonte di estrazione."
ukUA = "Закінчився видобуток. Перезапустити цей телепортер може лише сифон wormhole, але жоден телепортер на шляхах району не встановлено як джерело видобутку."
thTH = "ไม่มีวัสดุดึงออก ต้องใช้ท่อดูดหลุมหนอนเพื่อเริ่มเทเลพอร์เตอร์นี้ใหม่ แต่ไม่มีเทเลพอร์เตอร์บนเส้นทางของเขตที่ตั้งเป็นแหล่งดึงออก"
csCZ = "Došel extrakt. Tento teleporter může znovu spustit pouze červí díra se sifonem, ale žádný teleporter na cestách v okrsku není nastaven jako zdroj extraktu."
viVN = "Đã hết nguồn khai thác. Chỉ có ống hút lỗ sâu mới có thể khởi động lại máy dịch chuyển này, nhưng không có máy dịch chuyển nào trên các lối đi của khu vực được đặt làm nguồn khai thác."
caES = "Sense d'extracció. Només un sifó de cuc de cuc pot reiniciar aquest teletransportador, però cap teletransportador dels camins del districte no està configurat com a font d'extracció."
beBY = "Вычарпана. Перазапусціць гэты тэлепартар может толькі сіфон чорнай дзіркі, але ні адзін тэлепартар на шляхах раёна не заданы як крыніца вывазу."
roRO = "Fără extracție. Doar un sifon de gaură de vierme poate reporni acest teleportor, dar niciun teleportor de pe căile districtului nu este setat ca sursă de extracție."
huHU = "Elfogyott a kivonás. Csak egy féreglyuk-szifon tudja újraindítani ezt a teleportert, de a körzet útvonalain egyetlen teleporter sincs kivonási forrásként beállítva."
arSA = "نفدت كمية الاستخراج. لا يمكن إعادة تشغيل هذا الجهاز الناقل إلا بواسطة مضخة ثقب دودي، ولا يوجد أي جهاز ناقل على مسارات المنطقة مُعيَّن كمصدر استخراج."

