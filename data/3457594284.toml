[_meta]
name = "Underground Sluice"

["Building.UndergroundSluice.Description"]
raw = "Tunnel through terrain, replacing it with a Sluice. Use the layer tool to see under terrain or structures."
status = "normal"
enUS = "Tunnel through the terrain, replacing it with a sluice. Use the layer tool to see beneath the terrain or structures."
zhCN = "在地形中挖掘隧道，并用水闸替代原有地形。使用图层工具可查看地形或建筑下方的结构。"
zhTW = "在地形中挖隧道，用水閘取而代之。使用圖層工具以查看地形或結構下方。"
ruRU = "Пронзите рельеф, заменив его на шлюз. Используйте инструмент слоев, чтобы увидеть подземные участки или конструкции."
jaJP = "地形を貫通し、水門に置き換えます。層ツールを使用して、地形や構造物の下を確認してください。"
frFR = "Tunnel à travers le terrain, le remplaçant par un déversoir. Utilisez l'outil de couche pour voir sous le terrain ou les structures."
deDE = "Tunnel durch das Gelände und ersetze es durch einen Schöpfwerk. Verwende das Ebenenwerkzeug, um unter dem Gelände oder Gebäuden zu sehen."
plPL = "Tuneluj przez teren, zastępując go śluzą. Użyj narzędzia warstw, aby zobaczyć pod terenem lub strukturami."
ptBR = "Cave um túnel através do terreno, substituindo-o por uma Lagoa. Use a ferramenta de camada para ver abaixo do terreno ou das estruturas."
koKR = "지하 수문을 통해 지형을 터널로 만들고, 이를 수문으로 대체하십시오. 지형이나 구조물 아래를 보려면 레이어 도구를 사용하십시오."
trTR = "Yer altından geçit açın ve bunu bir Sluice ile değiştirin. Arazi veya yapılar altındaki alanı görmek için katman aracını kullanın."
esES = "Excava un túnel a través del terreno, sustituyéndolo por una compuerta. Usa la herramienta de capas para ver debajo del terreno o de las estructuras."
itIT = "Scava una galleria nel terreno, sostituendolo con una chiusa. Usa lo strumento dei livelli per vedere sotto il terreno o le strutture."
ukUA = "Прокладає тунель крізь місцевість, замінюючи її шлюзом. Використовуйте інструмент шарів, щоб побачити, що під місцевістю чи спорудами."
thTH = "ขุดอุโมงค์ผ่านภูมิประเทศ โดยแทนที่ด้วยประตูระบายน้ำ ใช้เครื่องมือชั้นเพื่อดูใต้ภูมิประเทศหรือสิ่งปลูกสร้าง"
csCZ = "Procházejte terénem, který nahradíte příkopem. Použijte nástroj pro vrstvy, abyste viděli pod terénem nebo strukturami."
viVN = "Đào xuyên qua địa hình, thay thế nó bằng một cống xả. Sử dụng công cụ lớp để xem dưới địa hình hoặc các công trình."
caES = "Excava un túnel pel terreny i substitueix-lo per una comporta. Fes servir l’eina de capes per veure sota el terreny o les estructures."
beBY = "Пракладзіце тунэль праз грунт, замяняючы яго шлюзам. Выкарыстоўвайце інструмент слаёў, каб убачыць, што знаходзіцца пад грунтам або збудаваннямі."
roRO = "Săpați un tunel prin teren, înlocuindu-l cu o ecluză. Folosiți instrumentul pentru straturi pentru a vedea sub teren sau structuri."
huHU = "Alagutat váj a terepen keresztül, és zsilippel helyettesíti azt. A terep vagy építmények alatti rész megtekintéséhez használd a rétegeszközt."
arSA = "احفر نفقًا عبر التضاريس واستبدلها ببوابة مائية. استخدم أداة الطبقات لرؤية ما تحت التضاريس أو المنشآت."

