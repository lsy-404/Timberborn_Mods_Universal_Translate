ptBR = "Um jogador perdeu a sincronização, então o jogo foi recarregado para todos a partir do salvamento do Anfitrião. O Anfitrião pode clicar em Jogar para continuar."
koKR = "플레이어 한 명의 동기화가 어긋나 모두를 위해 호스트의 저장 파일에서 게임을 다시 불러왔습니다. 호스트가 플레이를 눌러 계속할 수 있습니다."
trTR = "Bir oyuncunun oyunu eşitlemesi bozulduğu için herkesin oyunu Host'un kayıt dosyasından yeniden yüklendi. Host, devam etmek için oynat düğmesine basabilir."
esES = "Un jugador se desincronizó, así que el juego se recargó para todos desde la partida guardada del anfitrión. El anfitrión puede pulsar reproducir para continuar."
itIT = "Un giocatore è uscito dalla sincronizzazione, quindi la partita è stata ricaricata per tutti dal salvataggio dell'Host. L'Host può premere play per continuare."
ukUA = "Гравець вийшов з синхронізації, тож гру було перезавантажено для всіх із збереження Хоста. Хост може натиснути «Відтворити», щоб продовжити."
thTH = "ผู้เล่นคนหนึ่งหลุดการซิงค์ ระบบจึงโหลดเกมใหม่จากเซฟของโฮสต์สำหรับทุกคน โฮสต์สามารถกดเล่นเพื่อดำเนินต่อได้"
csCZ = "Hráč se přestal synchronizovat, proto byla hra všem znovu načtena z Hostitelovy uložené hry. Hostitel může stisknout tlačítko Hrát a pokračovat."
viVN = "Một người chơi đã mất đồng bộ, nên trò chơi đã được tải lại từ bản lưu của Chủ phòng cho tất cả mọi người. Chủ phòng có thể nhấn nút chơi để tiếp tục."
caES = "Un jugador es va desincronitzar, així que el joc es va recarregar des del desat de l'amfitrió per a tothom. L'amfitrió pot prémer play per continuar."
beBY = "Гулец адстаў ад сінхранізацыі, таму для ўсіх гульцоў гульня была перазагружана з захаванага Гаспадаром. Гаспадар можа націснуць «Прайграць», каб працягнуць."
roRO = "Un jucător s-a desincronizat, așa că jocul a fost reîncărcat pentru toată lumea din salvarea Gazdei. Gazda poate apăsa pe joc pentru a continua."
huHU = "Egy játékos szinkronon kívülre került, ezért a játék mindenki számára újratöltődött a házigazda mentéséből. A házigazda megnyomhatja a lejátszás gombot a folytatáshoz."
arSA = "ترك أحد اللاعبين المزامنة، لذا أُعيد تحميل اللعبة للجميع من حفظ المضيف. يمكن للمضيف الضغط على تشغيل لمتابعة اللعب."

