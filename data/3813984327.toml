["BeaverBuddies.ClientDesynced.Resyncing"]
raw = "A player fell out of sync. The Host is reloading the game for everyone; it will carry on in a moment."
status = "normal"
enUS = "A player fell out of sync. The Host is reloading the game for everyone; it will carry on in a moment."
zhCN = "一名玩家发生了同步错误。主机正在为所有人重新加载游戏；片刻后即可继续。"
zhTW = "有位玩家發生同步錯誤。主機正在為所有人重新載入遊戲；稍後就會繼續。"
ruRU = "У одного из игроков произошло рассинхронизирование. Хост перезагружает игру для всех; вскоре она продолжится."
jaJP = "プレイヤーの同期が外れました。ホストが全員のゲームを再読み込みしています。まもなく再開します。"
frFR = "Un joueur s’est désynchronisé. L’hôte recharge la partie pour tout le monde ; elle reprendra dans un instant."
deDE = "Ein Spieler ist nicht mehr synchron. Der Host lädt das Spiel für alle neu; gleich geht es weiter."
plPL = "Gracz utracił synchronizację. Host wczytuje ponownie grę dla wszystkich; za chwilę będzie można kontynuować."
ptBR = "Um jogador perdeu a sincronização. O anfitrião está recarregando o jogo para todos; ele continuará em instantes."
koKR = "플레이어 한 명의 동기화가 어긋났습니다. 호스트가 모두를 위해 게임을 다시 불러오고 있습니다. 잠시 후 계속됩니다."
csCZ = "Hráč se desynchronizoval. Hostitel všem znovu načítá hru; za chvíli bude pokračovat."
viVN = "Một người chơi đã bị mất đồng bộ. Máy chủ đang tải lại trò chơi cho mọi người; trò chơi sẽ tiếp tục sau giây lát."
trTR = "Bir oyuncunun eşitlemesi bozuldu. Sunucu oyunu herkes için yeniden yüklüyor; birazdan devam edecek."

["BeaverBuddies.ClientDesynced.Resynced"]
raw = "A player fell out of sync, so the game was reloaded from the Host's save for everyone. The Host can press play to carry on."
status = "normal"
enUS = "A player fell out of sync, so the game was reloaded from the Host's save for everyone. The Host can press play to carry on."
zhCN = "一名玩家发生不同步，因此所有玩家都已从主机的存档重新载入游戏。主机可以按下“播放”继续游戏。"
zhTW = "有位玩家的遊戲狀態不同步，因此所有人的遊戲都已從主機的存檔重新載入。主機可以按下「播放」繼續遊戲。"
ruRU = "Один из игроков рассинхронизировался, поэтому для всех игра была перезагружена из сохранения хоста. Хост может нажать «Играть», чтобы продолжить."
jaJP = "プレイヤーの同期が外れたため、全員のゲームをホストのセーブデータから再読み込みしました。ホストはプレイを押して続行できます。"
frFR = "Un joueur s’est désynchronisé. Le jeu a donc été rechargé pour tout le monde à partir de la sauvegarde de l’hôte. L’hôte peut appuyer sur « Jouer » pour continuer."
deDE = "Ein Spieler ist aus dem Synchronisierungstakt geraten. Daher wurde das Spiel für alle anhand des Spielstands des Hosts neu geladen. Der Host kann auf „Spielen“ drücken, um fortzufahren."
plPL = "Jeden z graczy utracił synchronizację, więc dla wszystkich wczytano zapis Hosta. Host może nacisnąć przycisk odtwarzania, aby kontynuować."
ptBR = "Um jogador perdeu a sincronização, então o jogo foi recarregado para todos a partir do salvamento do Anfitrião. O Anfitrião pode clicar em Jogar para continuar."
koKR = "플레이어 한 명의 동기화가 어긋나 모두를 위해 호스트의 저장 파일에서 게임을 다시 불러왔습니다. 호스트가 플레이를 눌러 계속할 수 있습니다."
csCZ = "Hráč se přestal synchronizovat, proto byla hra všem znovu načtena z Hostitelovy uložené hry. Hostitel může stisknout tlačítko Hrát a pokračovat."
viVN = "Một người chơi đã mất đồng bộ, nên trò chơi đã được tải lại từ bản lưu của Chủ phòng cho tất cả mọi người. Chủ phòng có thể nhấn nút chơi để tiếp tục."
trTR = "Bir oyuncunun oyunu eşitlemesi bozulduğu için herkesin oyunu Host'un kayıt dosyasından yeniden yüklendi. Host, devam etmek için oynat düğmesine basabilir."

["BeaverBuddies.ClientDesynced.ResyncFailed"]
raw = "The game fell out of sync and couldn't be reloaded for everyone. Save it, then host it again."
status = "normal"
enUS = "The game fell out of sync and couldn't be reloaded for everyone. Save it, then host it again."
zhCN = "游戏已不同步，无法为所有人重新加载。请保存游戏，然后重新主持。"
zhTW = "遊戲狀態失去同步，無法為所有人重新載入。請先儲存，再重新主持遊戲。"
ruRU = "Игра рассинхронизировалась, и её не удалось перезагрузить для всех. Сохраните её, а затем снова запустите как хост."
jaJP = "ゲームの同期が外れ、全員の再読み込みに失敗しました。セーブしてから、もう一度ホストしてください。"
frFR = "Le jeu s’est désynchronisé et n’a pas pu être rechargé pour tout le monde. Enregistrez-le, puis hébergez-le à nouveau."
deDE = "Das Spiel ist nicht mehr synchron und konnte nicht für alle neu geladen werden. Speichere es und hoste es dann erneut."
plPL = "Gra utraciła synchronizację i nie udało się jej ponownie wczytać u wszystkich. Zapisz ją, a następnie ponownie ją hostuj."
ptBR = "O jogo perdeu a sincronização e não foi possível recarregá-lo para todos. Salve-o e hospede-o novamente."
koKR = "게임 동기화가 어긋나 모든 플레이어에게 다시 불러올 수 없습니다. 저장한 다음 다시 호스팅하세요."
csCZ = "Hra se desynchronizovala a nepodařilo se ji znovu načíst pro všechny. Uložte ji a poté ji znovu spusťte jako hostitel."
viVN = "Trò chơi đã mất đồng bộ và không thể tải lại cho tất cả mọi người. Hãy lưu trò chơi, rồi mở phòng lại."
trTR = "Oyun senkronizasyonunu kaybetti ve herkes için yeniden yüklenemedi. Kaydedin, ardından oyunu yeniden barındırın."

