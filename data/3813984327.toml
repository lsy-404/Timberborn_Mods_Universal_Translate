["BeaverBuddies.Settings.PauseReduction.Tooltip"]
status = "normal"
raw = "For an optimal experience, all players should set it to the same value.\n\nOff - Default behaviour\nMenu only - Auto-pause only when opening the menu (not for deconstructions)\nNever auto-pause - The game will never auto-pause, including when opening the menu. This can lead to save corruptions if you don't pause the game before saving."
enUS = "For an optimal experience, all players should set it to the same value.\n\nOff - Default behavior\nMenu only - Auto-pause only when opening the menu (not for deconstructions)\nNever auto-pause - The game will never auto-pause, including when opening the menu. This can lead to save corruption if you don't pause the game before saving."
zhCN = "为获得最佳体验，所有玩家都应将其设为相同的值。\n\n关闭 - 默认行为\n仅菜单 - 仅在打开菜单时自动暂停（拆除建筑时不会）\n从不自动暂停 - 游戏永远不会自动暂停，包括打开菜单时。如果保存前没有暂停游戏，可能会导致存档损坏。"
zhTW = "為了獲得最佳體驗，所有玩家都應將此設定為相同的值。\n\n關閉－預設行為\n僅選單－僅在開啟選單時自動暫停（拆除建築時不會）\n永不自動暫停－遊戲永遠不會自動暫停，包括開啟選單時。如果你在儲存前沒有暫停遊戲，可能會導致存檔損毀。"
ruRU = "Для наилучшей игры всем игрокам следует установить одинаковое значение.\n\nВыкл. — поведение по умолчанию\nТолько меню — пауза включается автоматически только при открытии меню (не при сносе построек)\nНикогда не ставить на паузу автоматически — игра никогда не будет автоматически ставиться на паузу, в том числе при открытии меню. Если перед сохранением не поставить игру на паузу, сохранение может повредиться."
jaJP = "最適な体験のため、すべてのプレイヤーが同じ値に設定してください。\n\nオフ - デフォルトの動作\nメニューのみ - メニューを開いたときのみ自動一時停止（解体時は除く）\n自動一時停止なし - メニューを開いたときも含め、ゲームが自動一時停止されることはありません。保存前にゲームを一時停止しないと、セーブデータが破損する可能性があります。"
frFR = "Pour une expérience optimale, tous les joueurs devraient choisir la même valeur.\n\nDésactivé - Comportement par défaut\nMenu uniquement - Mise en pause automatique uniquement à l'ouverture du menu (pas lors des déconstructions)\nJamais de pause automatique - Le jeu ne se mettra jamais en pause automatiquement, même à l'ouverture du menu. Cela peut corrompre les sauvegardes si vous ne mettez pas le jeu en pause avant de sauvegarder."
deDE = "Für ein optimales Spielerlebnis sollten alle Spieler denselben Wert einstellen.\n\nAus – Standardverhalten\nNur im Menü – Automatische Pause nur beim Öffnen des Menüs (nicht beim Abriss)\nNie automatisch pausieren – Das Spiel wird nie automatisch pausiert, auch nicht beim Öffnen des Menüs. Das kann zu beschädigten Spielständen führen, wenn du das Spiel vor dem Speichern nicht pausierst."
plPL = "Aby zapewnić optymalne wrażenia, wszyscy gracze powinni ustawić tę samą wartość.\n\nWył. — domyślne zachowanie\nTylko menu — automatyczna pauza tylko przy otwieraniu menu (nie przy rozbiórce)\nNigdy nie wstrzymuj automatycznie — gra nigdy nie zostanie automatycznie wstrzymana, także podczas otwierania menu. Może to doprowadzić do uszkodzenia zapisów, jeśli nie wstrzymasz gry przed zapisem."
ptBR = "Para uma experiência ideal, todos os jogadores devem definir o mesmo valor.\n\nDesativado - Comportamento padrão\nSomente menu - Pausa automaticamente apenas ao abrir o menu (não durante demolições)\nNunca pausar automaticamente - O jogo nunca pausará automaticamente, inclusive ao abrir o menu. Isso pode corromper os arquivos salvos se você não pausar o jogo antes de salvar."
koKR = "최적의 경험을 위해 모든 플레이어가 같은 값을 설정해야 합니다.\n\n끄기 - 기본 동작\n메뉴에서만 - 메뉴를 열 때만 자동 일시 정지(철거 시에는 해당하지 않음)\n자동 일시 정지 안 함 - 메뉴를 열 때를 포함해 게임이 자동으로 일시 정지되지 않습니다. 저장하기 전에 게임을 일시 정지하지 않으면 저장 파일이 손상될 수 있습니다."
csCZ = "Pro optimální zážitek by měli všichni hráči nastavit stejnou hodnotu.\n\nVypnuto – Výchozí chování\nPouze nabídka – Automatická pauza pouze při otevření nabídky (ne při demolici)\nNikdy automaticky nepozastavovat – Hra se nikdy automaticky nepozastaví, ani při otevření nabídky. Pokud hru před uložením nepozastavíte, může dojít k poškození uložených pozic."
viVN = "Để có trải nghiệm tối ưu, tất cả người chơi nên đặt cùng một giá trị.\n\nTắt - Hành vi mặc định\nChỉ trong menu - Chỉ tự động tạm dừng khi mở menu (không áp dụng khi tháo dỡ)\nKhông bao giờ tự động tạm dừng - Trò chơi sẽ không bao giờ tự động tạm dừng, kể cả khi mở menu. Điều này có thể làm hỏng tệp lưu nếu bạn không tạm dừng trò chơi trước khi lưu."
trTR = "En iyi deneyim için tüm oyuncular aynı değeri seçmelidir.\n\nKapalı - Varsayılan davranış\nYalnızca menü - Otomatik duraklatma yalnızca menü açıldığında gerçekleşir (sökme işlemleri hariç)\nOtomatik duraklatma yok - Oyun, menü açıldığında bile hiçbir zaman otomatik duraklatılmaz. Kaydetmeden önce oyunu duraklatmazsanız kayıt dosyaları bozulabilir."

