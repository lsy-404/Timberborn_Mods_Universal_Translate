zhCN = "在有多个起始位置的地图上，按玩家顺序，多少个起始位置会获得一个区中心和初始海狸。只有一个起始位置的地图会忽略此设置。"
zhTW = "在有多個起始位置的地圖上，依玩家順序，指定有幾個位置會獲得區域中心和初始海狸。只有一個起始位置的地圖會忽略此設定。"
ruRU = "На карте с несколькими стартовыми локациями определяет, сколько из них получат районный центр и стартовых бобров, в порядке игроков. На карте с одной стартовой локацией игнорируется."
jaJP = "開始地点が複数あるマップで、プレイヤーの順番に、いくつの開始地点に地区センターと初期ビーバーを配置するかを指定します。開始地点が1つのマップでは無視されます。"
frFR = "Sur une carte comportant plusieurs points de départ, nombre de ces points qui reçoivent un centre de district et des castors de départ, dans l’ordre des joueurs. Une carte avec un seul point de départ ignore ce paramètre."
deDE = "Auf einer Karte mit mehreren Startpositionen: Wie viele davon erhalten in Spielerreihenfolge ein Bezirkszentrum und Startbiber? Bei einer Karte mit nur einer Startposition wird diese Einstellung ignoriert."
plPL = "Na mapie z kilkoma miejscami startowymi określa, ile z nich otrzyma Centrum Dzielnicy i początkowych bobrów, w kolejności graczy. Na mapie z jednym miejscem startowym ta opcja jest ignorowana."
ptBR = "Em um mapa com vários locais iniciais, quantos deles recebem um Centro Distrital e castores iniciais, na ordem dos jogadores. Em um mapa com apenas um local inicial, essa opção é ignorada."
koKR = "시작 지점이 여러 개인 지도에서 플레이어 순서대로 몇 개의 시작 지점에 구역 중심지와 시작 비버를 배치할지 지정합니다. 시작 지점이 하나뿐인 지도에서는 이 설정이 무시됩니다."
csCZ = "Na mapě s několika počátečními lokacemi určuje, kolik z nich dostane Centrum okrsku a počáteční bobry v pořadí hráčů. Mapa s jednou počáteční lokací toto nastavení ignoruje."
viVN = "Trên bản đồ có nhiều vị trí khởi đầu, có bao nhiêu vị trí được cấp Trung tâm Quận và hải ly khởi đầu, theo thứ tự người chơi. Bản đồ chỉ có một vị trí khởi đầu sẽ bỏ qua thiết lập này."
trTR = "Birden fazla başlangıç konumu olan bir haritada, oyuncu sırasına göre kaçına bir Bölge Merkezi ve başlangıç kunduzları verileceği. Tek başlangıç konumu olan bir haritada bu ayar yok sayılır."

