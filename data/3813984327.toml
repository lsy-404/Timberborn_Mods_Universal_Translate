["BeaverBuddies.JoinCoopGame.Error.CouldNotConnect"]
raw = "Could not connect to Host. Please check the address and port, and make sure the Host is hosting and has port forwarded if needed. Error details:"
status = "normal"
enUS = "Could not connect to Host. Please check the address and port, and make sure the Host is hosting and has port forwarding set up if needed. Error details:"
zhCN = "无法连接到主机。请检查地址和端口，并确认主机正在运行游戏，且已在需要时设置端口转发。错误详情："
zhTW = "無法連線至主機。請檢查位址和連接埠，並確認主機正在開放連線；如有需要，也請確認已設定連接埠轉送。錯誤詳細資訊："
ruRU = "Не удалось подключиться к хосту. Проверьте адрес и порт, а также убедитесь, что хост запустил игру и при необходимости настроил переадресацию порта. Подробности ошибки:"
jaJP = "ホストに接続できませんでした。アドレスとポートを確認し、ホストがゲームをホストしていること、必要に応じてポートフォワーディングが設定されていることを確認してください。エラーの詳細："
frFR = "Impossible de se connecter à l’hôte. Vérifiez l’adresse et le port, et assurez-vous que l’hôte héberge bien la partie et a redirigé le port si nécessaire. Détails de l’erreur :"
deDE = "Verbindung zum Host nicht möglich. Bitte überprüfe die Adresse und den Port und stelle sicher, dass der Host eine Sitzung hostet und bei Bedarf eine Portweiterleitung eingerichtet hat. Fehlerdetails:"
plPL = "Nie udało się połączyć z hostem. Sprawdź adres i port oraz upewnij się, że host uruchomił grę i w razie potrzeby przekierował port. Szczegóły błędu:"
ptBR = "Não foi possível conectar ao anfitrião. Verifique o endereço e a porta e certifique-se de que o anfitrião esteja hospedando a partida e tenha feito o encaminhamento de porta, se necessário. Detalhes do erro:"
koKR = "호스트에 연결할 수 없습니다. 주소와 포트를 확인하고, 호스트가 게임을 열었는지, 필요한 경우 포트 포워딩을 설정했는지 확인하세요. 오류 세부 정보:"
trTR = "Sunucuya bağlanılamadı. Lütfen adresi ve bağlantı noktasını kontrol edin; ayrıca sunucunun barındırma yaptığından ve gerekiyorsa bağlantı noktası yönlendirmesinin ayarlandığından emin olun. Hata ayrıntıları:"
esES = "No se pudo conectar con el anfitrión. Comprueba la dirección y el puerto, y asegúrate de que el anfitrión esté alojando la partida y de que haya reenviado el puerto si es necesario. Detalles del error:"
itIT = "Impossibile connettersi all'host. Controlla l'indirizzo e la porta, e assicurati che l'host stia ospitando la partita e abbia inoltrato la porta, se necessario. Dettagli dell'errore:"
ukUA = "Не вдалося підключитися до хоста. Перевірте адресу та порт і переконайтеся, що хост запущений і, за потреби, переспрямував порт. Деталі помилки:"
thTH = "ไม่สามารถเชื่อมต่อกับโฮสต์ได้ โปรดตรวจสอบที่อยู่และพอร์ต และตรวจสอบว่าโฮสต์กำลังเปิดเซิร์ฟเวอร์อยู่และได้ตั้งค่าการส่งต่อพอร์ตไว้แล้วหากจำเป็น รายละเอียดข้อผิดพลาด:"
csCZ = "Nepodařilo se připojit k hostiteli. Zkontrolujte adresu a port a ujistěte se, že hostitel hru hostuje a v případě potřeby má přesměrovaný port. Podrobnosti o chybě:"
viVN = "Không thể kết nối với máy chủ. Vui lòng kiểm tra địa chỉ và cổng, đồng thời đảm bảo máy chủ đang mở phòng và đã chuyển tiếp cổng nếu cần. Chi tiết lỗi:"
caES = "No s'ha pogut connectar amb l'amfitrió. Comproveu l'adreça i el port, i assegureu-vos que l'amfitrió està allotjant la partida i que ha redirigit el port si cal. Detalls de l'error:"
beBY = "Не ўдалося падключыцца да хоста. Калі ласка, праверце адрас і порт, а таксама пераканайцеся, што хост запушчаны і, пры неабходнасці, порт перанакіраваны. Падрабязнасці памылкі:"
roRO = "Nu s-a putut conecta la gazdă. Verifică adresa și portul și asigură-te că gazda este pornită și că portul este redirecționat, dacă este necesar. Detalii despre eroare:"
huHU = "Nem sikerült csatlakozni a gazdagéphez. Ellenőrizd a címet és a portot, és győződj meg arról, hogy a gazdagép üzemel, valamint szükség esetén a port át van irányítva (port forwarding). Hibaadatok:"
arSA = "لم يتمكن الاتصال بالمضيف. يُرجى التحقق من العنوان والمنفذ، والتأكد من أن المضيف يستضيف اللعبة وأنه قد فُعّل توجيه المنفذ (Port Forwarding) عند الحاجة. تفاصيل الخطأ:"

