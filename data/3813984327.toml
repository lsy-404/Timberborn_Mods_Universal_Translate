csCZ = "Jejich BeaverBuddies hledá zápasy jiným způsobem než váš. Kdo má starší verzi, musí ji aktualizovat."
viVN = "BeaverBuddies của họ tìm trận khác với phiên bản của bạn. Người dùng phiên bản cũ hơn cần cập nhật."
