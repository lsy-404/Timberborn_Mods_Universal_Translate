["BeaverBuddies.ClientDesynced.NeedToEnableTracing"]
status = "normal"
raw = "To report this desync, *all players* must first enable more detailed logging by pressing Enable Logging, below. If another desync occurs, you can then report it on our Discord with the detailed log. Logging mode may cause some lag, but it will only be active until you restart the game."
enUS = "To report this desync, *all players* must first enable more detailed logging by pressing Enable Logging below. If another desync occurs, you can then report it on our Discord with the detailed log. Logging mode may cause some lag, but it will only remain active until you restart the game."
zhCN = "要报告此次不同步，*所有玩家*都必须先点击下方的“启用日志记录”，以启用更详细的日志。如果再次发生不同步，之后你就可以将详细日志发送到我们的 Discord 上进行报告。日志记录模式可能会导致一些卡顿，但只会持续到你重启游戏为止。"
zhTW = "若要回報這次不同步，*所有玩家*必須先按下下方的「啟用記錄」，開啟更詳細的記錄功能。若再次發生不同步，你就能在我們的 Discord 上附上詳細記錄進行回報。記錄模式可能會造成些許延遲，但只會持續到你重新啟動遊戲為止。"
ruRU = "Чтобы сообщить об этой рассинхронизации, *всем игрокам* сначала нужно включить подробное ведение журнала, нажав кнопку «Включить ведение журнала» ниже. Если рассинхронизация произойдёт снова, вы сможете сообщить о ней в нашем Discord-сервере, приложив подробный журнал. Режим ведения журнала может вызывать небольшие задержки, но будет активен только до перезапуска игры."
jaJP = "この同期ずれを報告するには、まず*全プレイヤー*が下の「ログを有効化」を押して、より詳細なログを有効にする必要があります。再び同期ずれが発生したら、詳細ログを添えてDiscordで報告できます。ログ記録モードでは多少ラグが発生する場合がありますが、ゲームを再起動するまでの間だけ有効です。"
frFR = "Pour signaler cette désynchronisation, *tous les joueurs* doivent d’abord activer la journalisation détaillée en appuyant ci-dessous sur « Activer la journalisation ». Si une autre désynchronisation se produit, vous pourrez alors la signaler sur notre Discord en joignant le journal détaillé. Le mode journalisation peut entraîner quelques ralentissements, mais il ne restera actif que jusqu’au redémarrage du jeu."
deDE = "Um diese Desynchronisierung zu melden, müssen *alle Spieler* zunächst die detailliertere Protokollierung aktivieren, indem sie unten auf „Protokollierung aktivieren“ drücken. Tritt erneut eine Desynchronisierung auf, könnt ihr sie anschließend mit dem detaillierten Protokoll auf unserem Discord melden. Der Protokollierungsmodus kann zu Verzögerungen führen, ist aber nur bis zum Neustart des Spiels aktiv."
plPL = "Aby zgłosić tę desynchronizację, *wszyscy gracze* muszą najpierw włączyć bardziej szczegółowe logowanie, naciskając poniższy przycisk „Włącz logowanie”. Jeśli dojdzie do kolejnej desynchronizacji, będzie można zgłosić ją na naszym Discordzie, dołączając szczegółowy log. Tryb logowania może powodować pewne opóźnienia, ale będzie aktywny tylko do ponownego uruchomienia gry."
ptBR = "Para reportar esta dessincronização, *todos os jogadores* devem primeiro ativar o registro detalhado pressionando Ativar registro, abaixo. Se ocorrer outra dessincronização, você poderá reportá-la no nosso Discord com o registro detalhado. O modo de registro pode causar um pouco de lag, mas ficará ativo somente até você reiniciar o jogo."
koKR = "이 동기화 오류를 신고하려면 먼저 *모든 플레이어*가 아래의 로깅 활성화를 눌러 더 자세한 로그를 기록하도록 해야 합니다. 동기화 오류가 다시 발생하면 상세 로그와 함께 Discord에서 신고할 수 있습니다. 로깅 모드에서는 약간의 지연이 발생할 수 있지만, 게임을 다시 시작할 때까지만 활성화됩니다."
csCZ = "Aby bylo možné nahlásit tuto desynchronizaci, musí *všichni hráči* nejprve zapnout podrobnější zaznamenávání kliknutím na tlačítko Povolit zaznamenávání níže. Pokud dojde k další desynchronizaci, můžete ji pak nahlásit na našem Discordu spolu s podrobným záznamem. Režim zaznamenávání může způsobit určité zpomalení, ale bude aktivní pouze do restartování hry."
viVN = "Để báo cáo tình trạng mất đồng bộ này, *tất cả người chơi* trước tiên phải bật ghi nhật ký chi tiết hơn bằng cách nhấn vào Bật ghi nhật ký bên dưới. Nếu xảy ra mất đồng bộ lần nữa, bạn có thể báo cáo trên Discord của chúng tôi kèm theo nhật ký chi tiết. Chế độ ghi nhật ký có thể gây giật lag, nhưng chỉ hoạt động cho đến khi bạn khởi động lại trò chơi."
trTR = "Bu senkronizasyon hatasını bildirmek için önce *tüm oyuncuların* aşağıdaki Günlüğe Kaydetmeyi Etkinleştir düğmesine basarak daha ayrıntılı günlük kaydını etkinleştirmesi gerekir. Başka bir senkronizasyon hatası meydana gelirse ayrıntılı günlüğü Discord sunucumuzda paylaşarak bildirebilirsiniz. Günlük kaydı modu bir miktar gecikmeye neden olabilir, ancak yalnızca oyunu yeniden başlatana kadar etkin kalır."

