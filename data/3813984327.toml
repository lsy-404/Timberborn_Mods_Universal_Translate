["BeaverBuddies.FirstTimer.Message"]
raw = "It looks like this is your first time using BeaverBuddies. We recommend taking a quick look through our guide to make sure you are set up to play. Would you like to do that now?"
status = "normal"
enUS = "It looks like this is your first time using BeaverBuddies. We recommend taking a quick look through our guide to make sure you’re all set to play. Would you like to do that now?"
zhCN = "这似乎是你第一次使用 BeaverBuddies。我们建议你快速浏览一下指南，确保已经做好游戏准备。要现在查看吗？"
zhTW = "看起來你是第一次使用 BeaverBuddies。我們建議你快速瀏覽一下指南，確保一切都設定妥當，可以開始遊玩。要現在查看嗎？"
ruRU = "Похоже, вы впервые используете BeaverBuddies. Рекомендуем быстро ознакомиться с нашим руководством, чтобы убедиться, что всё готово к игре. Хотите сделать это сейчас?"
jaJP = "BeaverBuddiesを初めてお使いのようです。プレイの準備が整っているか確認するため、ガイドにざっと目を通すことをおすすめします。今すぐ確認しますか？"
frFR = "Il semble que vous utilisiez BeaverBuddies pour la première fois. Nous vous recommandons de consulter rapidement notre guide pour vous assurer que tout est prêt pour jouer. Voulez-vous le faire maintenant ?"
deDE = "Es sieht so aus, als würdest du BeaverBuddies zum ersten Mal verwenden. Wir empfehlen dir, kurz einen Blick in unseren Leitfaden zu werfen, damit du startklar bist. Möchtest du das jetzt tun?"
plPL = "Wygląda na to, że po raz pierwszy korzystasz z BeaverBuddies. Zalecamy szybkie zapoznanie się z naszym poradnikiem, aby upewnić się, że wszystko jest gotowe do gry. Czy chcesz zrobić to teraz?"
ptBR = "Parece que esta é a primeira vez que você usa o BeaverBuddies. Recomendamos dar uma olhada rápida no nosso guia para garantir que está tudo pronto para jogar. Gostaria de fazer isso agora?"
koKR = "BeaverBuddies를 처음 사용하시는 것 같습니다. 플레이할 준비가 되었는지 확인할 수 있도록 가이드를 간단히 살펴보시길 권장합니다. 지금 살펴보시겠습니까?"
csCZ = "Zdá se, že BeaverBuddies používáte poprvé. Doporučujeme rychle si projít naši příručku, abyste měli jistotu, že máte vše připravené ke hraní. Chcete to udělat teď?"
viVN = "Có vẻ đây là lần đầu bạn sử dụng BeaverBuddies. Chúng tôi khuyên bạn xem nhanh hướng dẫn để đảm bảo đã thiết lập sẵn sàng chơi. Bạn có muốn xem ngay bây giờ không?"
trTR = "BeaverBuddies’i ilk kez kullanıyor gibisiniz. Oynamaya hazır olduğunuzdan emin olmak için rehberimize kısaca göz atmanızı öneririz. Bunu şimdi yapmak ister misiniz?"

