viVN = "Một người chơi đã bị mất đồng bộ. Máy chủ đang tải lại trò chơi cho mọi người; trò chơi sẽ tiếp tục sau giây lát."
caES = "Un jugador s'ha desincronitzat. L'amfitrió està recarregant la partida per a tothom; continuarà d'aquí un moment."
beBY = "Адзін з гульцоў страціў сінхранізацыю. Гаспадар перазапускае гульню для ўсіх; яна працягнецца праз імгненне."
roRO = "Un jucător s-a desincronizat. Gazda reîncarcă jocul pentru toți; acesta va continua în scurt timp."
