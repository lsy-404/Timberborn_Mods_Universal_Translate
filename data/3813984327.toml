["BeaverBuddies.Settings.EnableSteamConnection.Tooltip"]
status = "normal"
raw = "Allows players to join your games via Steam's peer-to-peer networking.\nPlayers will still be able to join via port forwarding.\nNote: This feature may not work if your network does not support peer-to-peer connections.\nAdditionally, peer-to-peer connections may be slower than direct connections."
enUS = "Allows players to join your games via Steam's peer-to-peer networking.\nPlayers will still be able to join via port forwarding.\nNote: This feature may not work if your network does not support peer-to-peer connections.\nAdditionally, peer-to-peer connections may be slower than direct connections."
zhCN = "允许玩家通过 Steam 的点对点网络连接加入你的游戏。\n玩家仍可通过端口转发加入。\n注意：如果你的网络不支持点对点连接，此功能可能无法正常工作。\n此外，点对点连接可能比直接连接更慢。"
zhTW = "允許玩家透過 Steam 的點對點網路加入你的遊戲。\n玩家仍可透過連接埠轉送加入。\n注意：如果你的網路不支援點對點連線，這項功能可能無法運作。\n此外，點對點連線可能會比直接連線慢。"
ruRU = "Позволяет игрокам присоединяться к вашим играм через одноранговую сеть Steam.\nИгроки также смогут присоединяться через проброс портов.\nПримечание: эта функция может не работать, если ваша сеть не поддерживает одноранговые соединения.\nКроме того, одноранговые соединения могут быть медленнее прямых."
jaJP = "Steamのピアツーピアネットワークを通じて、プレイヤーがあなたのゲームに参加できるようにします。\nプレイヤーは引き続き、ポートフォワーディングを通じて参加できます。\n注意：お使いのネットワークがピアツーピア接続に対応していない場合、この機能は動作しないことがあります。\nまた、ピアツーピア接続は直接接続より遅くなることがあります。"
frFR = "Permet aux joueurs de rejoindre vos parties via le réseau pair-à-pair de Steam.\nLes joueurs pourront toujours rejoindre vos parties grâce à la redirection de port.\nRemarque : cette fonctionnalité peut ne pas fonctionner si votre réseau ne prend pas en charge les connexions pair-à-pair.\nDe plus, les connexions pair-à-pair peuvent être plus lentes que les connexions directes."
deDE = "Ermöglicht Spielern, deinen Spielen über Steams Peer-to-Peer-Netzwerk beizutreten.\nSpieler können weiterhin über Portweiterleitung beitreten.\nHinweis: Diese Funktion funktioniert möglicherweise nicht, wenn dein Netzwerk keine Peer-to-Peer-Verbindungen unterstützt.\nAußerdem können Peer-to-Peer-Verbindungen langsamer sein als direkte Verbindungen."
plPL = "Umożliwia graczom dołączanie do twoich gier za pośrednictwem sieci peer-to-peer Steam.\nGracze nadal będą mogli dołączać przez przekierowanie portów.\nUwaga: Ta funkcja może nie działać, jeśli twoja sieć nie obsługuje połączeń peer-to-peer.\nPonadto połączenia peer-to-peer mogą być wolniejsze niż połączenia bezpośrednie."
ptBR = "Permite que jogadores entrem nos seus jogos pela rede ponto a ponto do Steam.\nOs jogadores ainda poderão entrar por meio do encaminhamento de portas.\nObservação: este recurso pode não funcionar se sua rede não oferecer suporte a conexões ponto a ponto.\nAlém disso, as conexões ponto a ponto podem ser mais lentas do que as conexões diretas."
koKR = "Steam의 P2P 네트워킹을 통해 플레이어가 게임에 참여할 수 있습니다.\n플레이어는 포트 포워딩을 통해서도 계속 참여할 수 있습니다.\n참고: 네트워크가 P2P 연결을 지원하지 않으면 이 기능이 작동하지 않을 수 있습니다.\n또한 P2P 연결은 직접 연결보다 느릴 수 있습니다."
csCZ = "Umožňuje hráčům připojit se k vašim hrám prostřednictvím peer-to-peer sítě služby Steam.\nHráči se budou moci připojit i nadále pomocí přesměrování portů.\nPoznámka: Tato funkce nemusí fungovat, pokud vaše síť nepodporuje peer-to-peer připojení.\nPeer-to-peer připojení navíc mohou být pomalejší než přímá připojení."
viVN = "Cho phép người chơi tham gia trò chơi của bạn thông qua mạng ngang hàng của Steam.\nNgười chơi vẫn có thể tham gia thông qua chuyển tiếp cổng.\nLưu ý: Tính năng này có thể không hoạt động nếu mạng của bạn không hỗ trợ kết nối ngang hàng.\nNgoài ra, kết nối ngang hàng có thể chậm hơn kết nối trực tiếp."
trTR = "Oyuncuların Steam'in eşler arası ağ bağlantısını kullanarak oyunlarınıza katılmasını sağlar.\nOyuncular yine de bağlantı noktası yönlendirmesiyle katılabilir.\nNot: Ağınız eşler arası bağlantıları desteklemiyorsa bu özellik çalışmayabilir.\nAyrıca, eşler arası bağlantılar doğrudan bağlantılardan daha yavaş olabilir."

