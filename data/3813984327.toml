["BeaverBuddies.Menu.HostNewGame.Tooltip"]
status = "normal"
raw = "Start a new game you host. You pick the map, multiplayer mode and game settings, and friends join from a Steam invite or your address."
enUS = "Start a new game that you host. Choose the map, multiplayer mode, and game settings, then invite friends through Steam or have them join using your address."
zhCN = "创建一个由你主持的新游戏。你可以选择地图、多人游戏模式和游戏设置，好友可通过 Steam 邀请或你的地址加入。"
zhTW = "開始一場由你主持的新遊戲。由你選擇地圖、多人遊戲模式和遊戲設定，朋友則可透過 Steam 邀請或你的位址加入。"
ruRU = "Начните новую игру в качестве хоста. Выберите карту, режим многопользовательской игры и настройки, а друзья смогут присоединиться по приглашению в Steam или по вашему адресу."
jaJP = "新しいゲームをホストします。マップ、マルチプレイヤーモード、ゲーム設定を選ぶと、友達はSteamの招待またはあなたのアドレスから参加できます。"
frFR = "Lancez une nouvelle partie que vous hébergez. Choisissez la carte, le mode multijoueur et les paramètres de jeu, puis vos amis vous rejoignent via une invitation Steam ou votre adresse."
deDE = "Starte ein neues Spiel, das du hostest. Du wählst die Karte, den Mehrspielermodus und die Spieleinstellungen aus. Deine Freunde treten über eine Steam-Einladung oder deine Adresse bei."
plPL = "Rozpocznij nową grę jako gospodarz. Wybierasz mapę, tryb wieloosobowy i ustawienia gry, a znajomi dołączają z zaproszenia na Steamie lub pod Twoim adresem."
ptBR = "Inicie um novo jogo hospedado por você. Escolha o mapa, o modo multijogador e as configurações do jogo; seus amigos podem entrar por um convite do Steam ou pelo seu endereço."
koKR = "새 게임을 호스트합니다. 지도를 선택하고 멀티플레이어 모드와 게임 설정을 정하면, 친구들이 Steam 초대 또는 주소를 통해 참가합니다."
csCZ = "Začněte novou hru, kterou budete hostovat. Vyberete mapu, režim pro více hráčů a nastavení hry. Přátelé se připojí přes pozvánku na Steamu nebo pomocí vaší adresy."
viVN = "Bắt đầu một ván mới do bạn làm chủ. Bạn chọn bản đồ, chế độ nhiều người chơi và cài đặt trò chơi; bạn bè tham gia qua lời mời trên Steam hoặc địa chỉ của bạn."
trTR = "Barındıracağınız yeni bir oyun başlatın. Haritayı, çok oyunculu modu ve oyun ayarlarını siz seçin; arkadaşlarınız Steam davetiyle veya adresinizden katılsın."

["BeaverBuddies.Menu.HostSavedGame.Tooltip"]
