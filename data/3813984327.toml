["BeaverBuddies.Settings.FriendsCanJoinSteamGame.Tooltip"]
status = "normal"
raw = "When enabled, your friends can join your game directly via Steam without you inviting them, and it's listed in Open matches for anyone."
enUS = "When enabled, your friends can join your game directly through Steam without an invitation, and it appears in Open Matches for everyone."
zhCN = "启用后，你的好友无需你邀请，即可通过 Steam 直接加入你的游戏；同时，任何人都能在“开放对局”中找到你的游戏。"
zhTW = "啟用後，你的好友無須收到邀請，就能透過 Steam 直接加入你的遊戲；而且你的遊戲會列在「公開對戰」中，任何人都能加入。"
ruRU = "Если включено, ваши друзья смогут присоединяться к вашей игре напрямую через Steam без приглашения с вашей стороны, а сама игра будет отображаться в списке открытых матчей для всех."
jaJP = "有効にすると、招待しなくてもフレンドがSteam経由で直接ゲームに参加でき、誰でも参加できるオープンマッチ一覧にも表示されます。"
frFR = "Lorsque cette option est activée, vos amis peuvent rejoindre directement votre partie via Steam sans que vous ayez à les inviter, et celle-ci apparaît dans les parties ouvertes pour tout le monde."
deDE = "Wenn diese Option aktiviert ist, können deine Freunde deinem Spiel direkt über Steam beitreten, ohne dass du sie einladen musst. Außerdem wird es unter „Offene Partien“ angezeigt und ist für alle zugänglich."
plPL = "Po włączeniu tej opcji znajomi mogą dołączyć bezpośrednio do twojej gry przez Steam, bez zaproszenia z twojej strony, a gra będzie widoczna w sekcji Otwartych gier dla wszystkich."
ptBR = "Quando ativada, essa opção permite que seus amigos entrem diretamente no seu jogo pelo Steam sem que você precise convidá-los, e ele aparece em Partidas abertas para qualquer pessoa."
koKR = "활성화하면 친구들이 초대 없이 Steam을 통해 게임에 바로 참여할 수 있으며, 누구나 참여할 수 있는 공개 게임 목록에도 표시됩니다."
csCZ = "Když je tato možnost zapnutá, vaši přátelé se mohou připojit k vaší hře přímo přes Steam, aniž byste je museli pozvat, a hra se zobrazuje v seznamu otevřených her, kde ji může najít kdokoli."
viVN = "Khi bật, bạn bè của bạn có thể tham gia trò chơi của bạn trực tiếp qua Steam mà không cần bạn mời họ, và trò chơi sẽ xuất hiện trong mục Trận đấu mở để mọi người đều có thể tham gia."
trTR = "Etkinleştirildiğinde arkadaşların, onları davet etmen gerekmeksizin Steam üzerinden doğrudan oyununa katılabilir. Ayrıca oyun, herkesin görebileceği Açık maçlar listesinde yer alır."

