["BeaverBuddies.Menu.HostNewGame.Tooltip"]
raw = "Start a new game you host. You pick the map, multiplayer mode and game settings, and friends join from a Steam invite or your address."
status = "normal"
enUS = "Start a new game that you host. Choose the map, multiplayer mode, and game settings. Friends can join through a Steam invite or your address."
zhCN = "创建并主持新游戏。你可以选择地图、多人游戏模式和游戏设置，好友可通过 Steam 邀请或你的地址加入。"
zhTW = "開始一場由你主持的新遊戲。你可以選擇地圖、多人遊戲模式和遊戲設定，朋友則可透過 Steam 邀請或你的位址加入。"
ruRU = "Начните новую игру на своём сервере. Вы выбираете карту, режим многопользовательской игры и настройки, а друзья присоединяются по приглашению в Steam или вашему адресу."
jaJP = "自分がホストとなって新しいゲームを始めます。マップ、マルチプレイヤーモード、ゲーム設定を選び、フレンドはSteamの招待またはあなたのアドレスから参加します。"
frFR = "Lancez une nouvelle partie que vous hébergez. Vous choisissez la carte, le mode multijoueur et les paramètres de jeu, puis vos amis vous rejoignent via une invitation Steam ou votre adresse."
deDE = "Starte ein neues Spiel, das du hostest. Du wählst die Karte, den Mehrspielermodus und die Spieleinstellungen. Deine Freunde treten über eine Steam-Einladung oder deine Adresse bei."
plPL = "Rozpocznij nową grę jako gospodarz. Wybierz mapę, tryb wieloosobowy i ustawienia gry, a znajomi dołączą przez zaproszenie Steam lub podając twój adres."
ptBR = "Inicie um novo jogo hospedado por você. Você escolhe o mapa, o modo multijogador e as configurações do jogo, e seus amigos entram por um convite do Steam ou pelo seu endereço."
koKR = "호스팅할 새 게임을 시작합니다. 맵, 멀티플레이어 모드, 게임 설정을 선택하면 친구들이 Steam 초대나 주소를 통해 참가합니다."
trTR = "Barındıracağınız yeni bir oyun başlatın. Haritayı, çok oyunculu modu ve oyun ayarlarını siz seçin; arkadaşlarınız Steam davetiyle veya adresiniz üzerinden katılsın."
esES = "Inicia una nueva partida que tú alojas. Eliges el mapa, el modo multijugador y la configuración de la partida, y tus amigos se unen desde una invitación de Steam o tu dirección."
itIT = "Avvia una nuova partita che ospiti. Scegli la mappa, la modalità multigiocatore e le impostazioni di gioco, e gli amici possono unirsi tramite un invito Steam o il tuo indirizzo."
ukUA = "Почніть нову гру, яку ви будете розміщувати на своєму сервері. Ви обираєте карту, режим багатокористувацької гри та налаштування гри, а друзі приєднуються через запрошення Steam або за вашою адресою."
thTH = "เริ่มเกมใหม่ที่คุณเป็นเจ้าภาพ คุณเลือกแผนที่ โหมดผู้เล่นหลายคน และการตั้งค่าเกม จากนั้นเพื่อนสามารถเข้าร่วมได้ผ่านคำเชิญ Steam หรือที่อยู่ของคุณ"
csCZ = "Zahajte novou hru, kterou budete hostovat. Vyberete mapu, režim pro více hráčů a nastavení hry; přátelé se připojí prostřednictvím pozvánky na Steamu nebo vaší adresy."
viVN = "Bắt đầu một ván mới do bạn làm máy chủ. Bạn chọn bản đồ, chế độ nhiều người chơi và cài đặt trò chơi; bạn bè tham gia bằng lời mời Steam hoặc địa chỉ của bạn."
caES = "Comença una nova partida que tu hostejaràs. Tu tries el mapa, el mode multijugador i la configuració de la partida, i els amics s'hi poden unir des d'una invitació de Steam o amb la teva adreça."
beBY = "Пачніце новую гульню, якую вы будзеце ўзначальваць. Вы выбіраеце карту, рэжым мультыплеера і налады гульні, а сябры могуць далучыцца па запрашэнні ў Steam або па вашым адрасе."
roRO = "Începe un joc nou pe care îl găzduiești. Alegi harta, modul multiplayer și setările jocului, iar prietenii se alătură printr-o invitație Steam sau prin adresa ta."
huHU = "Indítson egy új játékot, amelynek Ön a házigazdája. Kiválasztja a térképet, a többjátékos módot és a játék beállításait, a barátai pedig Steam-meghívóval vagy az Ön címével csatlakozhatnak."
arSA = "ابدأ لعبة جديدة تستضيفها. تختار الخريطة ووضع اللعب المتعدد وإعدادات اللعبة، ويمكن للأصدقاء الانضمام عبر دعوة Steam أو عنوانك."

