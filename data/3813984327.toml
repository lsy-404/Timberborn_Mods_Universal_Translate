["BeaverBuddies.Match.FindMatch.Tooltip"]
raw = "A 1v1 against another player over Steam who picked the same multiplayer mode. Players with the same map, difficulty and game settings are tried first. Where your picks differ, a coin flip decides, and whoever's map it is hosts."
status = "normal"
enUS = "A 1v1 match against another player on Steam who chose the same multiplayer mode. Players with the same map, difficulty, and game settings are matched first. If your choices differ, a coin flip decides, and the player whose map is chosen hosts."
zhCN = "通过 Steam 与另一名选择相同多人游戏模式的玩家进行 1v1 对战。系统会优先匹配地图、难度和游戏设置都与你相同的玩家。如果你们的选择不同，则由抛硬币决定；地图所属玩家将担任主机。"
zhTW = "透過 Steam 與另一位選擇相同多人遊戲模式的玩家進行 1 對 1 對戰。系統會優先配對地圖、難度和遊戲設定相同的玩家。若你們的選擇不同，則以擲硬幣決定；地圖所屬玩家會擔任主機。"
ruRU = "Матч 1 на 1 с другим игроком через Steam, выбравшим тот же режим мультиплеера. Сначала ищется игрок с той же картой, сложностью и настройками игры. Если ваши выборы различаются, всё решает подбрасывание монетки, а хостом становится игрок, чью карту выбрали."
jaJP = "Steamで同じマルチプレイヤーモードを選んだプレイヤーとの1対1対戦です。まず、マップ、難易度、ゲーム設定が同じプレイヤーとのマッチングを試みます。選択が異なる場合はコイントスで決定し、選ばれたマップの持ち主がホストになります。"
frFR = "Un 1 contre 1 contre un autre joueur via Steam ayant choisi le même mode multijoueur. On essaie d’abord de trouver des joueurs ayant choisi la même carte, la même difficulté et les mêmes paramètres de jeu. En cas de désaccord, un tirage à pile ou face tranche, et l’hôte est le joueur dont la carte a été retenue."
deDE = "Ein 1v1 gegen einen anderen Spieler über Steam, der denselben Mehrspielermodus ausgewählt hat. Spieler mit derselben Karte, demselben Schwierigkeitsgrad und denselben Spieleinstellungen werden zuerst gesucht. Wenn eure Auswahl voneinander abweicht, entscheidet ein Münzwurf, und derjenige, dessen Karte es ist, hostet das Spiel."
plPL = "Pojedynek 1 na 1 z innym graczem przez Steam, który wybrał ten sam tryb wieloosobowy. Najpierw dobierani są gracze z taką samą mapą, trudnością i ustawieniami gry. Jeśli ich wybory się różnią, rozstrzyga rzut monetą, a gospodarzem zostaje gracz, którego mapa została wybrana."
ptBR = "Um confronto 1v1 contra outro jogador pela Steam que escolheu o mesmo modo multijogador. Primeiro, tenta-se encontrar jogadores com o mesmo mapa, dificuldade e configurações de jogo. Se as escolhas forem diferentes, um cara ou coroa decide, e quem tiver escolhido o mapa será o anfitrião."
koKR = "Steam을 통해 같은 멀티플레이어 모드를 선택한 다른 플레이어와 1대1 대전을 합니다. 먼저 맵, 난이도, 게임 설정이 같은 플레이어를 우선으로 찾습니다. 서로 선택한 항목이 다르면 동전 던지기로 결정하고, 맵이 선택된 플레이어가 호스트가 됩니다."
csCZ = "Souboj 1 na 1 s jiným hráčem přes Steam, který si vybral stejný režim pro více hráčů. Nejprve se hledají hráči se stejnou mapou, obtížností a nastavením hry. Pokud se vaše volby liší, rozhodne hod mincí a hostitelem bude hráč, jehož mapa byla vybrána."
viVN = "Trận 1v1 với một người chơi khác qua Steam đã chọn cùng chế độ nhiều người chơi. Ưu tiên ghép những người chơi chọn cùng bản đồ, độ khó và cài đặt trò chơi. Nếu lựa chọn của hai bên khác nhau, tung đồng xu để quyết định; người có bản đồ được chọn sẽ làm chủ trận đấu."
trTR = "Steam üzerinden aynı çok oyunculu modunu seçmiş başka bir oyuncuya karşı 1'e 1. Önce haritası, zorluk seviyesi ve oyun ayarları sizinkilerle aynı olan oyuncular bulunmaya çalışılır. Seçimleriniz farklıysa yazı tura atılır ve kimin haritası seçilirse o oyuncu ev sahipliği yapar."

