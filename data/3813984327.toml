["BeaverBuddies.FirstTimer.Message"]
status = "normal"
raw = "It looks like this is your first time using BeaverBuddies. We recommend taking a quick look through our guide to make sure you are set up to play. Would you like to do that now?"
enUS = "It looks like this is your first time using BeaverBuddies. We recommend taking a quick look through our guide to make sure you’re all set to play. Would you like to do that now?"
zhCN = "这似乎是你第一次使用 BeaverBuddies。我们建议你快速浏览一下指南，确保已正确设置好游戏。要现在查看吗？"
zhTW = "看起來你是第一次使用 BeaverBuddies。我們建議你快速瀏覽一下指南，確保一切設定妥當，可以開始遊戲。你現在想要閱讀指南嗎？"
ruRU = "Похоже, вы впервые пользуетесь BeaverBuddies. Рекомендуем быстро ознакомиться с нашим руководством, чтобы убедиться, что всё готово к игре. Хотите сделать это сейчас?"
jaJP = "BeaverBuddiesを初めてご利用のようです。プレイの準備が整っているか確認するため、ガイドにさっと目を通すことをおすすめします。今すぐご覧になりますか？"
frFR = "Il semble que ce soit la première fois que vous utilisez BeaverBuddies. Nous vous recommandons de consulter rapidement notre guide pour vous assurer que tout est prêt pour jouer. Voulez-vous le faire maintenant ?"
deDE = "Es sieht so aus, als würdest du BeaverBuddies zum ersten Mal verwenden. Wir empfehlen dir, kurz einen Blick in unseren Leitfaden zu werfen, damit du fürs Spielen bereit bist. Möchtest du das jetzt tun?"
plPL = "Wygląda na to, że używasz BeaverBuddies po raz pierwszy. Zalecamy szybkie zapoznanie się z naszym poradnikiem, aby upewnić się, że wszystko jest gotowe do gry. Czy chcesz zrobić to teraz?"
ptBR = "Parece que esta é a primeira vez que você usa o BeaverBuddies. Recomendamos dar uma olhada rápida no nosso guia para garantir que tudo esteja pronto para jogar. Gostaria de fazer isso agora?"
koKR = "BeaverBuddies를 처음 사용하시는 것 같네요. 플레이 준비가 잘 되었는지 확인할 수 있도록 가이드를 빠르게 살펴보시는 것을 권장합니다. 지금 살펴보시겠어요?"
csCZ = "Zdá se, že BeaverBuddies používáte poprvé. Doporučujeme rychle si projít našeho průvodce, abyste měli jistotu, že máte vše připravené ke hře. Chcete si ho projít teď?"
viVN = "Có vẻ đây là lần đầu bạn sử dụng BeaverBuddies. Chúng tôi khuyên bạn nên xem nhanh hướng dẫn để đảm bảo mọi thứ đã sẵn sàng để chơi. Bạn có muốn xem ngay bây giờ không?"
trTR = "BeaverBuddies'i ilk kez kullanıyor gibisiniz. Oyuna hazır olduğunuzdan emin olmak için rehberimize kısaca göz atmanızı öneririz. Şimdi göz atmak ister misiniz?"

