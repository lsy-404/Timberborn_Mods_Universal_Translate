["BeaverBuddies.Settings.FriendsCanJoinSteamGame.Tooltip"]
raw = "When enabled, your friends can join your game directly via Steam without you inviting them, and it's listed in Open matches for anyone."
status = "normal"
enUS = "When enabled, your friends can join your game directly through Steam without an invitation, and your game is listed in Open Matches for anyone to join."
zhCN = "启用后，你的好友无需邀请即可通过 Steam 直接加入你的游戏；同时，游戏也会显示在“开放对局”中，供所有人加入。"
zhTW = "啟用後，你的好友無須等你邀請，就能透過 Steam 直接加入你的遊戲；而且遊戲會列在「開放中的對戰」中，任何人都能加入。"
ruRU = "Если включено, ваши друзья смогут присоединиться к вашей игре напрямую через Steam без приглашения с вашей стороны, а она будет отображаться в списке открытых матчей для всех желающих."
