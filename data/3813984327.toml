csCZ = "Když je tato možnost zapnutá, vaši přátelé se mohou připojit k vaší hře přímo přes Steam, aniž byste je museli pozvat, a hra se zobrazí v seznamu otevřených zápasů pro všechny."
viVN = "Khi bật, bạn bè của bạn có thể tham gia trực tiếp vào trò chơi của bạn qua Steam mà không cần bạn mời họ, và trò chơi sẽ xuất hiện trong mục Trận đấu mở để bất kỳ ai cũng có thể tham gia."
