["BeaverBuddies.Settings.AllowDevTools.Tooltip"]
status = "normal"
raw = "Lets every player use the dev tools. Changes made with them are synced. Dev tools that can't be synced are always blocked in co-op."
enUS = "Lets every player use the dev tools. Changes made with them are synced. Dev tools that can't be synced are always blocked in co-op."
zhCN = "允许所有玩家使用开发者工具。通过这些工具所做的更改会同步。无法同步的开发者工具在合作模式中始终会被禁用。"
zhTW = "讓每位玩家都能使用開發者工具。使用這些工具所做的變更會同步。無法同步的開發者工具在合作模式中一律會被封鎖。"
ruRU = "Позволяет всем игрокам пользоваться инструментами разработчика. Внесённые с их помощью изменения синхронизируются. Инструменты разработчика, которые нельзя синхронизировать, всегда заблокированы в кооперативном режиме."
jaJP = "すべてのプレイヤーが開発者ツールを使えるようにします。開発者ツールで行った変更は同期されます。協力プレイでは、同期できない開発者ツールは常に無効になります。"
frFR = "Permet à chaque joueur d’utiliser les outils de développement. Les modifications effectuées avec ces outils sont synchronisées. Les outils de développement qui ne peuvent pas être synchronisés sont toujours bloqués en coop."
deDE = "Ermöglicht allen Spielern, die Entwicklertools zu verwenden. Mit ihnen vorgenommene Änderungen werden synchronisiert. Entwicklertools, deren Änderungen nicht synchronisiert werden können, sind im Koop immer gesperrt."
plPL = "Pozwala każdemu graczowi korzystać z narzędzi deweloperskich. Wprowadzone za ich pomocą zmiany są synchronizowane. Narzędzia deweloperskie, których nie można synchronizować, są zawsze zablokowane w trybie współpracy."
ptBR = "Permite que todos os jogadores usem as ferramentas de desenvolvedor. As alterações feitas com elas são sincronizadas. As ferramentas de desenvolvedor que não podem ser sincronizadas ficam sempre bloqueadas no modo cooperativo."
koKR = "모든 플레이어가 개발자 도구를 사용할 수 있게 합니다. 개발자 도구로 변경한 내용은 동기화됩니다. 동기화할 수 없는 개발자 도구는 협동 플레이에서 항상 차단됩니다."
csCZ = "Umožňuje všem hráčům používat vývojářské nástroje. Změny provedené pomocí těchto nástrojů se synchronizují. Vývojářské nástroje, jejichž změny nelze synchronizovat, jsou v kooperativním režimu vždy zakázané."
viVN = "Cho phép mọi người chơi sử dụng công cụ dành cho nhà phát triển. Các thay đổi được thực hiện bằng công cụ này sẽ được đồng bộ. Những công cụ dành cho nhà phát triển không thể đồng bộ luôn bị chặn trong chế độ co-op."
trTR = "Her oyuncunun geliştirici araçlarını kullanmasına izin verir. Bu araçlarla yapılan değişiklikler eşitlenir. Eşitlenemeyen geliştirici araçları co-op modunda her zaman engellenir."

