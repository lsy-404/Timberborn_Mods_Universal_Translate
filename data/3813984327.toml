plPL = "Wybierz gospodarza, aby zobaczyć jego mecz. Wybierz poniżej swoją frakcję, a następnie kliknij „Dołącz”: zagrasz na jego mapie i poziomie trudności."
ptBR = "Escolha um anfitrião para ver a partida dele. Escolha sua facção abaixo e entre: você jogará no mapa e na dificuldade dele."
koKR = "호스트를 선택해 해당 호스트의 매치를 확인하세요. 아래에서 진영을 선택한 다음 참가하세요. 해당 호스트의 맵과 난이도로 플레이하게 됩니다."
trTR = "Eşleşmelerini görmek için bir ev sahibi seç. Aşağıdan grubunu seç, ardından Katıl'a tıkla: onların haritasında ve zorluk seviyesinde oynarsın."
