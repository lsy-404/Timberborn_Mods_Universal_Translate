frFR = "Une fois activée, cette option permet à vos amis de rejoindre directement votre partie via Steam sans invitation de votre part, et celle-ci apparaît dans les parties ouvertes pour tout le monde."
deDE = "Wenn diese Option aktiviert ist, können deine Freunde deinem Spiel direkt über Steam beitreten, ohne dass du sie einladen musst. Außerdem wird es unter „Offene Partien“ für alle angezeigt."
plPL = "Po włączeniu tej opcji znajomi mogą dołączyć bezpośrednio do twojej gry przez Steam, bez zaproszenia z twojej strony, a gra jest widoczna na liście otwartych rozgrywek dla wszystkich."
ptBR = "Quando ativada, permite que seus amigos entrem diretamente no seu jogo pelo Steam sem que você os convide, e ele aparece em Partidas abertas para qualquer pessoa."
