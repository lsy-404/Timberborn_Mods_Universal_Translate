koKR = "당신은 상세 로그 기록을 켰지만, 상대방은 켜지 않았습니다. BeaverBuddies 설정에서 \\\"항상 상세 로그 기록 사용\\\"을 끄거나, 상대방에게 켜 달라고 요청하세요."
csCZ = "Máte zapnuté podrobné protokolování, zatímco oni ne. V nastavení BeaverBuddies vypněte možnost „Vždy používat podrobné protokolování“, nebo je požádejte, aby ji zapnuli."
viVN = "Bạn đang bật ghi nhật ký chi tiết còn họ thì không. Hãy tắt “Luôn dùng ghi nhật ký chi tiết” trong cài đặt BeaverBuddies, hoặc yêu cầu họ bật tính năng này."
trTR = "Ayrıntılı günlük kaydı sende açık, onlarda değil. BeaverBuddies ayarlarından “Ayrıntılı Günlük Kaydını Her Zaman Kullan” seçeneğini kapat ya da onlardan bu seçeneği açmalarını iste."

