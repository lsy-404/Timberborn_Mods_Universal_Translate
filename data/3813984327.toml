["BeaverBuddies.Trade.HalfHelp"]
status = "normal"
raw = "Pick what this side buys from the other district and sells to it. Goods trade by their value: with logs at 2 and water at 4, one water goes for two logs. Between two districts of the same player goods go across for free."
enUS = "Pick what this side buys from the other district and sells to it. Goods trade by their value: with logs at 2 and water at 4, one water goes for two logs. Between two districts of the same player goods go across for free."
zhCN = "选择本方从另一个区域购买和向其出售的物品。货物按价值交易：若木材价值为2、水价值为4，则1单位水可换2单位木材。同一玩家的两个区域之间运送货物不收费。"
zhTW = "選擇本方向從另一個行政區購買與出售的物資。物資依價值交易：若木材價值為 2、水價值為 4，則一單位水可換兩單位木材。同一玩家的兩個行政區之間運送物資不需付費。"
ruRU = "Выберите, что эта сторона покупает у другого района и продаёт ему. Товары обмениваются по их стоимости: при стоимости бревен 2 и воды 4 одна вода обменивается на два бревна. Между двумя районами одного игрока товары перемещаются бесплатно."
jaJP = "このサイドが他の地区から購入し、他の地区へ販売する品目を選択します。商品は価値に基づいて取引されます。丸太の価値が2、水の価値が4の場合、水1つは丸太2つと交換されます。同じプレイヤーの2つの地区間では、商品は無料で移動します。"
frFR = "Choisissez ce que ce côté achète à l'autre district et ce qu'il lui vend. Les marchandises s'échangent selon leur valeur : avec des rondins à 2 et de l'eau à 4, une unité d'eau vaut deux rondins. Entre deux districts d'un même joueur, les marchandises circulent gratuitement."
deDE = "Wähle aus, was diese Seite vom anderen Distrikt kauft und an ihn verkauft. Waren werden nach ihrem Wert gehandelt: Bei Holzstämmen mit Wert 2 und Wasser mit Wert 4 erhält man für ein Wasser zwei Holzstämme. Zwischen zwei Distrikten desselben Spielers werden Waren kostenlos transportiert."
plPL = "Wybierz, co ta strona kupuje od drugiej dzielnicy, a co jej sprzedaje. Towary są wyceniane według wartości: przy drewnie wartym 2 i wodzie wartej 4 jedna woda jest warta dwa kawałki drewna. Między dwiema dzielnicami tego samego gracza towary są przewożone za darmo."
ptBR = "Escolha o que este lado compra do outro distrito e vende para ele. Os bens são negociados pelo seu valor: com toras a 2 e água a 4, uma água vale duas toras. Entre dois distritos do mesmo jogador, os bens são transportados entre eles sem custo."
koKR = "이쪽이 다른 구역에서 사들이고 그 구역에 팔 상품을 고르세요. 상품은 가치에 따라 교환됩니다. 통나무의 가치가 2, 물의 가치가 4라면 물 1개는 통나무 2개와 교환됩니다. 같은 플레이어의 두 구역 사이에서는 상품이 무료로 오갑니다."
trTR = "Bu tarafın diğer bölgeden ne satın alacağını ve ona neyi satacağını seçin. Mallar değerlerine göre ticaret yapar: kütükler 2, su 4 değerindeyse, bir su iki kütüğe karşılık verilir. Aynı oyuncuya ait iki bölge arasında mallar ücretsiz taşınır."
esES = "Elija qué compra este lado del otro distrito y qué le vende. Los bienes se intercambian según su valor: con troncos a 2 y agua a 4, un agua se cambia por dos troncos. Entre dos distritos del mismo jugador, los bienes se transportan gratis."
itIT = "Scegli cosa questo lato compra dall'altro distretto e cosa gli vende. Le merci si scambiano in base al loro valore: con tronchi a 2 e acqua a 4, un'acqua vale due tronchi. Tra due distretti dello stesso giocatore le merci passano gratuitamente."
ukUA = "Оберіть, що ця сторона купує в іншого району і продає йому. Товари торгуються за їхньою вартістю: якщо колоди коштують 2, а вода 4, то одна вода обмінюється на дві колоди. Між двома районами одного гравця товари переміщуються безкоштовно."
thTH = "เลือกว่าฝั่งนี้จะซื้ออะไรจากอีกเขตหนึ่งและขายอะไรให้เขตนั้น สินค้าจะถูกแลกเปลี่ยนตามมูลค่า: เมื่อท่อนไม้มีค่า 2 และน้ำมีค่า 4 น้ำ 1 หน่วยจะแลกได้ท่อนไม้ 2 หน่วย ระหว่างสองเขตของผู้เล่นคนเดียวกัน สินค้าจะถูกส่งข้ามไปโดยไม่มีค่าใช้จ่าย"
csCZ = "Vyberte, co tato strana od druhého distriktu nakupuje a co mu prodává. Zboží se obchoduje podle své hodnoty: pokud má dřevo hodnotu 2 a voda 4, jedna voda se vymění za dvě dřeva. Mezi dvěma distrikty téhož hráče se zboží přepravuje zdarma."
viVN = "Chọn những gì khu này mua từ khu kia và bán cho khu kia. Hàng hóa được trao đổi theo giá trị: khi gỗ có giá 2 và nước có giá 4, một đơn vị nước đổi được hai đơn vị gỗ. Giữa hai khu thuộc cùng một người chơi, hàng hóa được chuyển qua miễn phí."
caES = "Trieu què compra aquesta banda a l'altre districte i què li ven. Els béns es comercien pel seu valor: amb troncs a 2 i aigua a 4, una unitat d'aigua es canvia per dos troncs. Entre dos districtes del mateix jugador, els béns es transporten de franc."
beBY = "Абярыце, што гэтая сторона купляе ў іншага раёна і прадае яму. Тавары гандлююць па сваёй вартасці: пры нарыхтоўцы па 2 і вадзе па 4 адна адзінка вады прыраўноўваецца да двух калод. Паміж двума раёнамі аднаго гульца тавары перавозяцца бясплатна."
roRO = "Alegeți ce cumpără această parte de la celălalt district și ce vinde acestuia. Bunurile se schimbă după valoarea lor: cu busteni la 2 și apă la 4, o unitate de apă se schimbă pe doi busteni. Între două districte ale aceluiași jucător, bunurile circulă gratuit."
huHU = "Válaszd ki, mit vásárol ez az oldal a másik körzettől, és mit ad el annak. Az áruk értékük alapján cserélnek gazdát: ha a fa ára 2, a vízé pedig 4, akkor egy víz két fáért cserélhető el. Ugyanazon játékos két körzete között az áruk díjmentesen mozognak."
arSA = "اختر ما تشتريه هذه الجهة من المنطقة الأخرى وما تبيعه لها. تُتداول السلع حسب قيمتها: فإذا كانت قيمة الأخشاب 2 وقيمة الماء 4، فإن وحدة الماء الواحدة تُقايَض بوحدتين من الأخشاب. وبين منطقتين تابعتين للاعب نفسه تنتقل السلع دون مقابل."

