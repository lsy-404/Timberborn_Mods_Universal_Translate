["BeaverBuddies.Performance.OtherMods"]
status = "normal"
raw = "{0} is on. BeaverBuddies has the same optimizations built in, made for multiplayer, and turned them off so they don't run twice. Before playing with others, turn off {0} in the mod manager, or the game can desync."
enUS = "{0} is on. BeaverBuddies has the same optimizations built in, made for multiplayer, and turned them off so they don't run twice. Before playing with others, turn off {0} in the mod manager, or the game can desync."
zhCN = "{0}已启用。BeaverBuddies内置了相同的优化功能，专为多人游戏设计，并已将其关闭以避免重复运行。在与他人联机游戏前，请在模组管理器中关闭{0}，否则游戏可能会出现不同步。"
zhTW = "{0} 已啟用。BeaverBuddies 內建了相同的最佳化功能，專為多人遊戲設計，並已將其關閉以免重複執行。在與他人遊玩之前，請先在模組管理器中關閉 {0}，否則遊戲可能會發生不同步。"
ruRU = "{0} включён. В BeaverBuddies уже встроены такие же оптимизации, сделанные для многопользовательской игры, и они отключены, чтобы не работать дважды. Перед игрой с другими игроками отключите {0} в менеджере модов, иначе игра может рассинхронизироваться."
jaJP = "{0}は有効です。BeaverBuddiesには同様の最適化機能が組み込まれており、マルチプレイ向けに作られています。そのため、二重に動作しないよう、それらの最適化は無効化されています。他のプレイヤーと遊ぶ前に、MODマネージャーで{0}を無効にしてください。そうしないと、ゲームが非同期になる可能性があります。"
frFR = "{0} est activé. BeaverBuddies intègre les mêmes optimisations, conçues pour le multijoueur, et les a désactivées pour qu'elles ne s'exécutent pas deux fois. Avant de jouer avec d'autres joueurs, désactivez {0} dans le gestionnaire de mods, sinon le jeu risque de se désynchroniser."
deDE = "{0} ist aktiviert. BeaverBuddies hat dieselben Optimierungen eingebaut, die für Mehrspielerpartien gedacht sind, und diese deaktiviert, damit sie nicht doppelt laufen. Deaktiviere vor dem Spielen mit anderen {0} im Mod-Manager, sonst kann es zu Desynchronisationen kommen."
plPL = "{0} jest włączony. BeaverBuddies ma wbudowane te same optymalizacje, przeznaczone do gry wieloosobowej, i wyłączył je, aby nie działały dwukrotnie. Przed grą z innymi graczami wyłącz {0} w menedżerze modów, w przeciwnym razie gra może ulec desynchronizacji."
ptBR = "{0} está ativado. O BeaverBuddies já tem essas mesmas otimizações integradas, feitas para multijogador, e as desativou para que não rodem duas vezes. Antes de jogar com outras pessoas, desative {0} no gerenciador de mods, caso contrário o jogo pode dessincronizar."
koKR = "{0} 이(가) 켜져 있습니다. BeaverBuddies에는 멀티플레이를 위해 만든 동일한 최적화가 내장되어 있으며, 중복 실행을 막기 위해 해당 최적화를 꺼 두었습니다. 다른 플레이어와 함께 플레이하기 전에 모드 관리자에서 {0} 을(를) 끄십시오. 그렇지 않으면 게임이 동기화되지 않을 수 있습니다."
trTR = "{0} açık. BeaverBuddies, çok oyunculu oyun için tasarlanmış aynı optimizasyonları zaten içeriyor ve bunları, aynı işlemin iki kez çalışmaması için kapatıyor. Başkalarıyla oynamadan önce mod yöneticisinde {0} modunu kapatın, aksi halde oyun senkronizasyon dışı kalabilir."
esES = "{0} está activado. BeaverBuddies incluye las mismas optimizaciones, pensadas para multijugador, y las desactiva para que no se ejecuten dos veces. Antes de jugar con otros, desactiva {0} en el gestor de mods, o el juego puede desincronizarse."
itIT = "{0} è attivo. BeaverBuddies include già le stesse ottimizzazioni, pensate per il multigiocatore, e le ha disattivate per evitare che vengano eseguite due volte. Prima di giocare con altri, disattiva {0} nel gestore dei mod, altrimenti il gioco potrebbe andare in desincronizzazione."
ukUA = "{0} увімкнено. BeaverBuddies має вбудовані ті самі оптимізації, призначені для мультиплеєра, і вимкнув їх, щоб вони не працювали двічі. Перш ніж грати з іншими, вимкніть {0} у менеджері модів, інакше гра може призвести до десинхронізації."
thTH = "{0} กำลังทำงานอยู่ BeaverBuddies มีการปรับปรุงประสิทธิภาพเดียวกันอยู่ในตัว ซึ่งออกแบบมาสำหรับการเล่นหลายผู้เล่น และได้ปิดการปรับปรุงเหล่านั้นไว้เพื่อไม่ให้ทำงานซ้ำสองครั้ง ก่อนเล่นร่วมกับผู้อื่น ให้ปิด {0} ในตัวจัดการม็อด มิฉะนั้นเกมอาจเกิดการซิงโครไนซ์ไม่ตรงกัน"
csCZ = "{0} je zapnutý. BeaverBuddies má stejné optimalizace zabudované, vytvořené pro hru více hráčů, a vypnul je, aby neběžely dvakrát. Před hraním s ostatními vypněte {0} ve správci modů, jinak se může hra rozsynchronizovat."
viVN = "{0} đang bật. BeaverBuddies đã tích hợp sẵn các tối ưu hóa tương tự, được thiết kế cho chơi nhiều người, và đã tắt chúng để tránh chạy trùng lặp. Trước khi chơi cùng người khác, hãy tắt {0} trong trình quản lý mod, nếu không trò chơi có thể bị lệch đồng bộ (desync)."
caES = "{0} està activat. BeaverBuddies inclou les mateixes optimitzacions, pensades per al multijugador, i les ha desactivat perquè no s'executin dues vegades. Abans de jugar amb altres persones, desactiva {0} al gestor de mods, o el joc pot desincronitzar-se."
beBY = "{0} уключаны. BeaverBuddies мае ўбудаваныя тыя самыя аптымізацыі, распрацаваныя для шматкарыстальніцкай гульні, і адключыў іх, каб яны не выконваліся двойчы. Перш чым гуляць з іншымі, адключыце {0} у менеджары модаў, інакш гульня можа стаць несінхроннай."
roRO = "{0} este activat. BeaverBuddies include deja aceleași optimizări, făcute pentru multiplayer, și le-a dezactivat pentru a nu rula de două ori. Înainte de a juca împreună cu alții, dezactivează {0} în managerul de mode, altfel jocul poate intra în desincronizare."
huHU = "{0} be van kapcsolva. A BeaverBuddies már beépítve tartalmazza ugyanezeket az optimalizálásokat, többjátékos módra készítve, és kikapcsolta őket, hogy ne fussanak kétszer. Mielőtt másokkal játszanál, kapcsold ki a {0} modot a mod-kezelőben, különben a játék szinkronizációs hibát okozhat."
arSA = "{0} مفعّل. يحتوي BeaverBuddies على التحسينات نفسها مدمجة فيه، وقد صُمّمت للعب الجماعي، وأوقفها كي لا تعمل مرتين. قبل اللعب مع آخرين، أوقف {0} في مدير المودات، وإلا فقد تحدث مشكلة في المزامنة."

