thTH = "เลือกเซฟเกมที่คุณต้องการโฮสต์ เพื่อนสามารถเข้าร่วมผ่านคำเชิญ Steam หรือที่อยู่ของคุณ และเกมจะคงการตั้งค่าที่ใช้ตอนสร้างเซฟไว้"
csCZ = "Hostujte jednu ze svých uložených her. Přátelé se připojí prostřednictvím pozvánky na Steamu nebo zadáním vaší adresy a hra zachová nastavení, se kterým byla vytvořena."
viVN = "Tạo phòng cho một trong các bản lưu của bạn. Bạn bè có thể tham gia qua lời mời trên Steam hoặc địa chỉ của bạn, và trò chơi sẽ giữ nguyên các cài đặt được thiết lập khi tạo bản lưu."
caES = "Hosteja una de les teves partides guardades. Els amics es poden unir des d'una invitació de Steam o amb la teva adreça, i el joc manté la configuració amb què es va crear."
beBY = "Размесціце адну са сваіх захаваных гульняў. Сябры могуць далучыцца праз запрашэнне ў Steam або па вашым адрасе, а гульня захоўвае налады, з якімі была створана."
roRO = "Găzduiți unul dintre jocurile salvate. Prietenii se pot alătura printr-o invitație Steam sau prin adresa dumneavoastră, iar jocul păstrează setările cu care a fost creat."
huHU = "Indíts egy mentett játékot szerverként. A barátok Steam-meghívóval vagy a te címeden csatlakozhatnak, a játék pedig megtartja azokat a beállításokat, amelyekkel létrehozták."
arSA = "استضف أحد ملفات حفظك. ينضم الأصدقاء عبر دعوة Steam أو عنوانك، وتحتفظ اللعبة بالإعدادات التي أُنشئ بها الحفظ."

