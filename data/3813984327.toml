["BeaverBuddies.NewGame.MaxStartingLocations.Tooltip"]
raw = "On a map with several starting locations, how many of them get a District Center and starting beavers, in player order. A map with one start ignores it."
status = "normal"
enUS = "On a map with several starting locations, how many of them receive a District Center and starting beavers, in player order. Maps with only one starting location ignore this setting."
zhCN = "在有多个起始位置的地图上，按玩家顺序，为其中多少个位置配置区中心和初始海狸。只有一个起始位置的地图会忽略此设置。"
zhTW = "在有多個起始位置的地圖上，依玩家順序，會有幾個位置獲得行政中心和起始海狸。只有一個起始位置的地圖會忽略此設定。"
ruRU = "На карте с несколькими стартовыми точками определяет, сколько из них по порядку игроков получат районный центр и стартовых бобров. На карте с одной стартовой точкой этот параметр игнорируется."
jaJP = "開始地点が複数あるマップで、プレイヤー順にいくつの開始地点に地区センターと初期ビーバーを配置するか。開始地点が1つのマップでは無視されます。"
frFR = "Sur une carte comportant plusieurs emplacements de départ, nombre d’entre eux qui reçoivent un centre de district et des castors de départ, dans l’ordre des joueurs. Les cartes avec un seul emplacement de départ ignorent ce paramètre."
deDE = "Auf einer Karte mit mehreren Startpositionen: Wie viele davon in Spielerreihenfolge ein Distriktzentrum und Startbiber erhalten. Bei einer Karte mit nur einem Start wird diese Einstellung ignoriert."
plPL = "Na mapie z kilkoma lokacjami startowymi określa, ile z nich otrzyma Centrum dzielnicy i początkowych bobrów, w kolejności graczy. Na mapie z jedną lokacją startową to ustawienie jest ignorowane."
ptBR = "Em um mapa com vários locais iniciais, quantos deles recebem um Centro distrital e castores iniciais, na ordem dos jogadores. Um mapa com apenas um local inicial ignora essa opção."
koKR = "시작 지점이 여러 개인 맵에서 플레이어 순서대로 몇 곳에 구역 중심지와 시작 비버를 배정할지 지정합니다. 시작 지점이 하나인 맵에서는 이 설정이 무시됩니다."
trTR = "Birden fazla başlangıç konumu olan bir haritada, oyuncu sırasına göre kaçında bir Bölge Merkezi ve başlangıç kunduzları olur. Tek başlangıç konumu olan bir harita bu ayarı yok sayar."
esES = "En un mapa con varias ubicaciones iniciales, indica cuántas de ellas reciben un Centro de Distrito y castores iniciales, en orden de jugador. Un mapa con una sola ubicación inicial lo ignora."
itIT = "Su una mappa con diverse posizioni iniziali, indica quante di esse ricevono un Centro di Distretto e castori iniziali, in ordine di giocatore. Una mappa con una sola posizione iniziale lo ignora."
ukUA = "На карті з кількома стартовими локаціями визначається, скільки з них отримають Районний центр і стартових бобрів, у порядку гравців. Карта з однією стартовою локацією ігнорує цей параметр."
thTH = "บนแผนที่ที่มีจุดเริ่มต้นหลายแห่ง จะมีกี่แห่งที่ได้รับศูนย์กลางเขต (District Center) และบีเวอร์เริ่มต้น โดยเรียงตามลำดับผู้เล่น แผนที่ที่มีจุดเริ่มต้นเพียงแห่งเดียวจะไม่นำค่านี้มาใช้"
csCZ = "Na mapě s několika výchozími místy určuje, kolik z nich v pořadí hráčů dostane centrum čtvrti a počáteční bobry. Na mapě s jedním výchozím místem se toto nastavení ignoruje."
viVN = "Trên bản đồ có nhiều vị trí khởi đầu, số vị trí được đặt Trung tâm quận và hải ly khởi đầu, theo thứ tự người chơi. Bản đồ chỉ có một vị trí khởi đầu sẽ bỏ qua cài đặt này."
caES = "En un mapa amb diverses ubicacions inicials, quantes d'elles reben un Centre de districte i castors inicials, segons l'ordre dels jugadors. Un mapa amb una sola ubicació inicial l'ignora."
beBY = "На карце з некалькімі стартавымі пунктамі вызначае, колькі з іх атрымаюць Цэнтр раёна і стартавых бабраў, у парадку гульцоў. Карта з адной кропкай старту гэта ігнаруе."
roRO = "Pe o hartă cu mai multe locații de start, câte dintre ele primesc un Centru de District și castori de pornire, în ordinea jucătorilor. O hartă cu un singur start ignoră această setare."
huHU = "Több kezdőpozíciót tartalmazó térképeken megadja, hogy ezek közül hány kapjon Körzetközpontot és kezdeti embereket (bebereket) a játékosok sorrendjében. Egy kezdőpozíciót tartalmazó térképen ez a beállítás figyelmen kívül marad."
arSA = "عدد مواقع البداية التي تحصل على مركز منطقة وقنادس بداية، حسب ترتيب اللاعبين، عندما تحتوي الخريطة على عدة مواقع بداية. الخريطة ذات موقع بداية واحد تتجاهل هذا الإعداد."

