["BeaverBuddies.Settings.AlwaysTrace.Tooltip"]
status = "normal"
raw = "When enabled, the game will always use detailed logging, which enables you to submit desync reports on the first occurrence without manually enabling detailed logging.\nNote that all players must have the setting enabled.\nThis setting will cause some lag and is not recommended for most players."
enUS = "When enabled, the game will always use detailed logging, allowing you to submit desync reports on the first occurrence without manually enabling detailed logging.\nNote that all players must have this setting enabled.\nThis setting will cause some lag and is not recommended for most players."
zhCN = "启用后，游戏将始终使用详细日志记录，这样首次发生不同步时，你就可以提交不同步报告，而无需手动启用详细日志记录。\n请注意，所有玩家都必须启用此设置。\n此设置会导致一定程度的卡顿，不建议大多数玩家启用。"
zhTW = "啟用後，遊戲將一律使用詳細記錄，讓你無須手動啟用詳細記錄，就能在首次發生不同步時提交報告。\n請注意，所有玩家都必須啟用此設定。\n此設定會造成一些延遲，不建議大多數玩家啟用。"
ruRU = "Если параметр включён, игра всегда будет вести подробный журнал, что позволит отправить отчёт о рассинхронизации при первом же её возникновении, не включая подробное журналирование вручную.\nОбратите внимание: этот параметр должен быть включён у всех игроков.\nЭтот параметр может вызывать задержки и не рекомендуется большинству игроков."
jaJP = "有効にすると、ゲームでは常に詳細ログが使用されるため、手動で詳細ログを有効にしなくても、最初に発生した時点で同期ずれのレポートを提出できます。\nこの設定は、すべてのプレイヤーで有効にする必要があります。\nこの設定を有効にすると多少のラグが発生するため、ほとんどのプレイヤーにはおすすめしません。"
frFR = "Lorsque cette option est activée, le jeu utilise toujours la journalisation détaillée, ce qui vous permet d'envoyer des rapports de désynchronisation dès la première occurrence, sans avoir à activer manuellement la journalisation détaillée.\nNotez que tous les joueurs doivent avoir activé cette option.\nCette option peut provoquer des ralentissements et n'est pas recommandée pour la plupart des joueurs."
deDE = "Wenn diese Option aktiviert ist, verwendet das Spiel immer eine detaillierte Protokollierung. So kannst du beim ersten Auftreten eines Desyncs einen Bericht einreichen, ohne die detaillierte Protokollierung manuell aktivieren zu müssen.\nBeachte, dass alle Spieler diese Option aktiviert haben müssen.\nDiese Einstellung verursacht möglicherweise Verzögerungen und wird den meisten Spielern nicht empfohlen."
plPL = "Po włączeniu tej opcji gra będzie zawsze używać szczegółowego rejestrowania, co pozwoli przesyłać raporty o desynchronizacji już przy pierwszym jej wystąpieniu, bez konieczności ręcznego włączania szczegółowego rejestrowania.\nPamiętaj, że tę opcję muszą włączyć wszyscy gracze.\nTo ustawienie może powodować opóźnienia i nie jest zalecane dla większości graczy."
ptBR = "Quando ativado, o jogo sempre usará o registro detalhado, permitindo que você envie relatórios de dessincronização na primeira ocorrência, sem precisar ativar manualmente o registro detalhado.\nObserve que todos os jogadores precisam ativar essa configuração.\nEssa configuração causará um pouco de lentidão e não é recomendada para a maioria dos jogadores."
koKR = "활성화하면 게임에서 항상 상세 로그를 사용하므로, 상세 로그를 수동으로 켜지 않아도 처음 발생했을 때 동기화 오류 보고서를 제출할 수 있습니다.\n모든 플레이어가 이 설정을 활성화해야 합니다.\n이 설정을 사용하면 약간의 랙이 발생하므로 대부분의 플레이어에게는 권장하지 않습니다."
csCZ = "Je-li tato možnost zapnutá, hra bude vždy používat podrobné protokolování, takže budete moci odeslat hlášení o desynchronizaci hned při jejím prvním výskytu, aniž byste museli podrobné protokolování zapínat ručně.\nUpozorňujeme, že toto nastavení musí mít zapnuté všichni hráči.\nToto nastavení způsobí určité zpoždění a většině hráčů se nedoporučuje."
viVN = "Khi được bật, trò chơi sẽ luôn ghi nhật ký chi tiết, cho phép bạn gửi báo cáo mất đồng bộ ngay từ lần đầu tiên xảy ra mà không cần bật ghi nhật ký chi tiết theo cách thủ công.\nLưu ý rằng tất cả người chơi đều phải bật cài đặt này.\nCài đặt này sẽ gây ra một chút giật lag và không được khuyến nghị cho hầu hết người chơi."
trTR = "Etkinleştirildiğinde oyun her zaman ayrıntılı günlük kaydı kullanır; böylece ayrıntılı günlük kaydını elle etkinleştirmenize gerek kalmadan, eşzamanlama bozulması raporlarını ilk oluştuğunda gönderebilirsiniz.\nTüm oyuncuların bu ayarı etkinleştirmiş olması gerektiğini unutmayın.\nBu ayar bir miktar takılmaya neden olur ve çoğu oyuncuya önerilmez."

