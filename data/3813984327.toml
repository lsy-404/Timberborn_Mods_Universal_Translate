["BeaverBuddies.ClientDesynced.Resyncing"]
status = "normal"
raw = "A player fell out of sync. The Host is reloading the game for everyone; it will carry on in a moment."
enUS = "A player fell out of sync. The host is reloading the game for everyone; it will continue in a moment."
zhCN = "一名玩家与游戏不同步。主机正在为所有人重新加载游戏；片刻后即可继续。"
zhTW = "有位玩家的遊戲狀態不同步。主機正在為所有人重新載入遊戲；片刻後就會繼續。"
ruRU = "Один из игроков рассинхронизировался. Хост перезагружает игру для всех; через мгновение она продолжится."
jaJP = "プレイヤーの同期がずれました。ホストが全員分のゲームを再読み込みしています。まもなく再開します。"
frFR = "Un joueur s’est désynchronisé. L’hôte recharge la partie pour tout le monde ; elle reprendra dans un instant."
deDE = "Ein Spieler ist nicht mehr synchron. Der Host lädt das Spiel für alle neu; gleich geht es weiter."
plPL = "Jeden z graczy utracił synchronizację. Gospodarz ponownie wczytuje grę dla wszystkich; gra za chwilę będzie kontynuowana."
ptBR = "Um jogador perdeu a sincronização. O anfitrião está recarregando o jogo para todos; ele continuará em instantes."
koKR = "플레이어 한 명의 동기화가 어긋났습니다. 호스트가 모두를 위해 게임을 다시 불러오고 있습니다. 잠시 후 계속됩니다."
csCZ = "Hráč se desynchronizoval. Hostitel znovu načítá hru pro všechny; za chvíli bude pokračovat."
viVN = "Một người chơi đã mất đồng bộ. Chủ phòng đang tải lại trò chơi cho mọi người; trò chơi sẽ tiếp tục sau giây lát."
trTR = "Bir oyuncunun eşzamanlılığı bozuldu. Sunucu oyunu herkes için yeniden yüklüyor; oyun birazdan devam edecek."

["BeaverBuddies.ClientDesynced.Resynced"]
status = "normal"
raw = "A player fell out of sync, so the game was reloaded from the Host's save for everyone. The Host can press play to carry on."
enUS = "A player fell out of sync, so the game was reloaded from the Host's save for everyone. The Host can press Play to carry on."
zhCN = "一名玩家的游戏状态发生不同步，因此已为所有人从主机的存档重新加载游戏。主机可以按下“播放”继续游戏。"
zhTW = "有玩家的遊戲狀態不同步，因此所有人的遊戲都已從主機的存檔重新載入。主機可以按下播放以繼續遊戲。"
ruRU = "У одного из игроков произошло рассинхронизирование, поэтому для всех игра была перезагружена из сохранения хоста. Хост может нажать «Играть», чтобы продолжить."
jaJP = "プレイヤーの同期が外れたため、全員のゲームがホストのセーブデータから再読み込みされました。ホストは再生ボタンを押すと続行できます。"
frFR = "Un joueur s’est désynchronisé ; le jeu a donc été rechargé pour tout le monde à partir de la sauvegarde de l’hôte. L’hôte peut appuyer sur Lecture pour continuer."
deDE = "Ein Spieler ist nicht mehr synchron, daher wurde das Spiel für alle aus dem Spielstand des Hosts neu geladen. Der Host kann auf „Spielen“ drücken, um fortzufahren."
plPL = "Jeden z graczy utracił synchronizację, więc wszystkim wczytano grę z zapisu gospodarza. Gospodarz może nacisnąć „Graj”, aby kontynuować."
ptBR = "Um jogador perdeu a sincronização, então o jogo foi recarregado para todos a partir do salvamento do anfitrião. O anfitrião pode clicar em jogar para continuar."
koKR = "플레이어 한 명의 동기화가 어긋나 모두의 게임이 호스트의 저장 파일에서 다시 로드되었습니다. 호스트가 플레이를 눌러 계속 진행할 수 있습니다."
csCZ = "Hráč se desynchronizoval, takže byla všem znovu načtena hra z uložené pozice hostitele. Hostitel může pokračovat stisknutím tlačítka pro spuštění."
viVN = "Một người chơi đã bị mất đồng bộ, nên trò chơi đã được tải lại từ bản lưu của Máy chủ cho tất cả mọi người. Máy chủ có thể nhấn Phát để tiếp tục."
trTR = "Bir oyuncunun eşzamanlılığı bozuldu; bu yüzden herkes için oyun Ana Bilgisayarın kayıt dosyasından yeniden yüklendi. Devam etmek için Ana Bilgisayar oynat düğmesine basabilir."

["BeaverBuddies.ClientDesynced.ResyncFailed"]
status = "normal"
raw = "The game fell out of sync and couldn't be reloaded for everyone. Save it, then host it again."
enUS = "The game fell out of sync and couldn't be reloaded for everyone. Save it, then host it again."
zhCN = "游戏已失去同步，无法为所有玩家重新加载。请保存游戏，然后重新开局。"
zhTW = "遊戲已不同步，無法為所有人重新載入。請先儲存，然後再次建立主機。"
ruRU = "Игра рассинхронизировалась, и её не удалось перезагрузить для всех. Сохраните её, а затем снова запустите в качестве хоста."
jaJP = "ゲームの同期がずれ、全員分を再読み込みできませんでした。保存してから、もう一度ホストしてください。"
frFR = "Le jeu s’est désynchronisé et n’a pas pu être rechargé pour tout le monde. Sauvegardez-le, puis hébergez-le à nouveau."
deDE = "Das Spiel ist nicht mehr synchron und konnte nicht für alle neu geladen werden. Speichere es und hoste es dann erneut."
plPL = "Gra utraciła synchronizację i nie udało się jej ponownie wczytać u wszystkich. Zapisz ją, a następnie ponownie ją hostuj."
ptBR = "O jogo perdeu a sincronização e não pôde ser recarregado para todos. Salve-o e hospede-o novamente."
koKR = "게임 동기화가 어긋나 모든 플레이어를 다시 동기화할 수 없습니다. 저장한 다음 다시 호스팅하세요."
csCZ = "Hra se rozcházela v synchronizaci a nepodařilo se ji znovu načíst všem hráčům. Uložte ji a potom ji znovu spusťte jako hostitel."
viVN = "Trò chơi đã mất đồng bộ và không thể tải lại cho mọi người. Hãy lưu trò chơi, rồi mở máy chủ lại."
trTR = "Oyun eşzamanlılığını yitirdi ve herkes için yeniden yüklenemedi. Oyunu kaydedin, ardından yeniden barındırın."

