zhTW = "對方的遊戲使用了其他模組，或是使用了這些模組的其他版本。若要加入已開設的遊戲，你們使用的模組必須完全相同。"
ruRU = "В их игре используются другие моды или другие их версии. Чтобы присоединиться к игре, которую они разместили, у вас должны быть установлены точно такие же моды и версии."
jaJP = "相手のゲームでは別のMOD、または異なるバージョンのMODが使用されています。ホストされたゲームに参加するには、まったく同じMODを使用する必要があります。"
frFR = "Leur partie utilise d'autres mods, ou d'autres versions de ceux-ci. Pour rejoindre une partie hébergée, vous devez avoir exactement les mêmes."
deDE = "In ihrem Spiel werden andere Mods oder andere Versionen davon verwendet. Um einem gehosteten Spiel beizutreten, benötigst du genau dieselben Mods."
plPL = "W ich grze używane są inne mody lub inne ich wersje. Aby dołączyć do hostowanej gry, musisz mieć dokładnie te same mody."
ptBR = "O jogo deles usa outros mods ou outras versões deles. Para entrar em uma partida hospedada, você precisa ter exatamente os mesmos mods."
koKR = "상대방 게임에서 다른 모드나 다른 버전의 모드를 사용하고 있습니다. 호스트가 연 게임에 참가하려면 모드 구성이 정확히 같아야 합니다."
csCZ = "Jejich hra používá jiné mody nebo jiné verze těchto modů. Abyste se mohli připojit k hostované hře, musíte mít přesně stejné mody."
viVN = "Trò chơi của họ sử dụng các mod khác hoặc phiên bản khác của những mod đó. Để tham gia trò chơi được lưu trữ, bạn cần có chính xác cùng những mod đó."
trTR = "Onların oyununda farklı modlar ya da bu modların farklı sürümleri kullanılıyor. Barındırılan bir oyuna katılmak için modların tamamen aynısına sahip olmanız gerekir."

