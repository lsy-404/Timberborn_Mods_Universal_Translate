koKR = "호스트 주소로 게임에 참가하세요. Steam에서는 친구의 초대를 통해서도 참가할 수 있습니다."
trTR = "Oyuna, barındırıcısının adresini kullanarak katılın. Steam'de arkadaşınızın davetiyle de katılabilirsiniz."
esES = "Únete a una partida con la dirección de su anfitrión. En Steam, también funciona una invitación de un amigo."
itIT = "Partecipa a una partita tramite l'indirizzo dell'host. Su Steam funziona anche un invito di un amico."
ukUA = "Приєднайтеся до гри за адресою її хоста. У Steam також працює запрошення від друга."
thTH = "เข้าร่วมเกมด้วยที่อยู่ของโฮสต์ บน Steam คำเชิญจากเพื่อนก็ใช้ได้เช่นกัน"
csCZ = "Připojte se ke hře pomocí adresy jejího hostitele. Na Steamu funguje také pozvánka od přítele."
viVN = "Tham gia trò chơi bằng địa chỉ của máy chủ. Trên Steam, bạn cũng có thể tham gia qua lời mời của bạn bè."
caES = "Uneix-te a una partida amb l'adreça del seu amfitrió. A Steam, també funciona una invitació d'un amic."
beBY = "Далучыцца да гульні па адрасе яе гаспадара. У Steam таксама працуе запрашэнне ад сябра."
