["BeaverBuddies.Match.FindMatch.Tooltip"]
raw = "A 1v1 against another player who picked the same multiplayer mode. Players with the same map, difficulty and game settings are tried first. Where your picks differ, a coin flip decides, and whoever's map it is hosts."
status = "normal"
enUS = "A 1v1 against another player who chose the same multiplayer mode. Players with the same map, difficulty, and game settings are matched first. If your choices differ, a coin flip decides, and the player whose map is chosen hosts."
zhCN = "与另一名选择相同多人游戏模式的玩家进行 1v1 对战。系统会优先匹配地图、难度和游戏设置都相同的玩家。如果你们的选择不同，则由抛硬币决定；地图所属玩家将担任主机。"
zhTW = "與另一位選擇相同多人遊戲模式的玩家進行 1 對 1 對戰。系統會優先配對地圖、難度和遊戲設定相同的玩家。若你們的選擇不同，則以擲硬幣決定；地圖所屬玩家會擔任主機。"
ruRU = "Матч 1 на 1 с другим игроком, выбравшим тот же режим мультиплеера. Сначала подбираются игроки с одинаковыми картой, сложностью и настройками игры. Если ваши выборы различаются, всё решает подбрасывание монетки, а хостом становится игрок, чью карту выбрали."
jaJP = "同じマルチプレイヤーモードを選んだプレイヤーとの1対1対戦です。まず、マップ、難易度、ゲーム設定が同じプレイヤーとのマッチングを試みます。選択が異なる場合はコイントスで決定し、選ばれたマップの持ち主がホストになります。"
frFR = "Un 1 contre 1 contre un autre joueur ayant choisi le même mode multijoueur. On essaie d’abord de trouver des joueurs ayant choisi la même carte, la même difficulté et les mêmes paramètres de jeu. Si vos choix diffèrent, un tirage à pile ou face tranche, et c’est le joueur dont la carte est choisie qui héberge."
deDE = "Ein 1v1 gegen einen anderen Spieler, der denselben Mehrspielermodus ausgewählt hat. Spieler mit derselben Karte, demselben Schwierigkeitsgrad und denselben Spieleinstellungen werden zuerst gesucht. Wenn eure Auswahl voneinander abweicht, entscheidet ein Münzwurf, und derjenige, dessen Karte es ist, hostet das Spiel."
plPL = "Pojedynek 1 na 1 z innym graczem, który wybrał ten sam tryb wieloosobowy. W pierwszej kolejności dobierani są gracze z taką samą mapą, poziomem trudności i ustawieniami gry. Jeśli ich wybory się różnią, rozstrzyga rzut monetą, a gospodarzem zostaje gracz, którego mapa została wybrana."
ptBR = "Um confronto 1v1 contra outro jogador que escolheu o mesmo modo multijogador. Primeiro, são tentados jogadores com o mesmo mapa, dificuldade e configurações de jogo. Se as escolhas forem diferentes, um cara ou coroa decide, e quem tiver escolhido o mapa será o anfitrião."
koKR = "같은 멀티플레이어 모드를 선택한 다른 플레이어와 1대1 대전을 합니다. 먼저 맵, 난이도, 게임 설정이 같은 플레이어를 찾습니다. 서로 선택한 항목이 다르면 동전 던지기로 결정하고, 자신의 맵이 선택된 플레이어가 호스트가 됩니다."
trTR = "Aynı çok oyunculu modu seçmiş başka bir oyuncuya karşı 1'e 1. Önce haritası, zorluk seviyesi ve oyun ayarları sizinkilerle aynı olan oyuncular denenir. Seçimleriniz farklıysa yazı tura atılır ve kimin haritası seçilirse o oyuncu ev sahipliği yapar."
esES = "Un 1 contra 1 frente a otro jugador que haya elegido el mismo modo multijugador. Primero se buscan jugadores con el mismo mapa, dificultad y ajustes de partida. Si vuestras elecciones difieren, una moneda decide, y el anfitrión será quien tenga el mapa elegido."
itIT = "Un 1v1 contro un altro giocatore che ha scelto la stessa modalità multiplayer. Vengono prima cercati giocatori con la stessa mappa, la stessa difficoltà e le stesse impostazioni di gioco. Quando le scelte differiscono, decide un lancio di moneta, e ospita la partita chi ha scelto la mappa."
ukUA = "Дуель 1 на 1 проти іншого гравця, який обрав той самий режим мультиплеєра. Спершу шукаються гравці з такою самою картою, складністю та налаштуваннями гри. Якщо ваш вибір відрізняється, кидок монети вирішує, а хостом стає той, чия це карта."
thTH = "การต่อสู้แบบ 1 ต่อ 1 กับผู้เล่นอีกคนที่เลือกโหมดผู้เล่นหลายคนเดียวกัน ระบบจะจับคู่ผู้เล่นที่มีแผนที่ ระดับความยาก และการตั้งค่าเกมเหมือนกันก่อน หากตัวเลือกของคุณแตกต่างกัน ให้ใช้การโยนเหรียญเพื่อตัดสิน และผู้ที่เป็นเจ้าของแผนที่นั้นจะเป็นฝ่ายเป็นเจ้าภาพ"
csCZ = "Souboj 1 na 1 s jiným hráčem, který si vybral stejný režim pro více hráčů. Nejprve se hledají hráči se stejnou mapou, obtížností a nastavením hry. Pokud se vaše volby liší, rozhodne hod mincí a hostitelem bude hráč, jehož mapa byla vybrána."
viVN = "Trận 1v1 với một người chơi khác đã chọn cùng chế độ nhiều người chơi. Ưu tiên ghép những người chơi chọn cùng bản đồ, độ khó và cài đặt trò chơi. Nếu lựa chọn của hai bên khác nhau, tung đồng xu để quyết định; người có bản đồ được chọn sẽ làm chủ trận đấu."
caES = "Un 1v1 contra un altre jugador que hagi escollit el mateix mode multijugador. Es proven primer els jugadors amb el mateix mapa, dificultat i configuració de partida. Si les vostres seleccions difereixen, una tirada de moneda decideix, i qui tingui el mapa escollit serà l'amfitrió."
beBY = "Дуэль 1 на 1 з іншым гульцом, які абраў той жа мнагакарыстальніцкі рэжым. Спачатку шукаюцца гульцы з тай жа карай, узроўнем складанасці і наладамі гульні. Калі вашы выбары розняцца, манету падкідваюць, і той, чыя карта, становіцца гаспадаром."
roRO = "Un 1v1 împotriva unui alt jucător care a ales același mod multiplayer. Jucătorii cu aceeași hartă, dificultate și setări de joc sunt încercați primii. Dacă alegerile tale diferă, o monedă decide, iar cel a cărui hartă este va găzdui jocul."
huHU = "1v1 egy másik játékossal, aki ugyanazt a többjátékos módot választotta. Először azok a játékosok kerülnek párosításra, akiknek ugyanaz a pálya, nehézségi szint és játékbeállítás. Ha a választásaitok eltérnek, egy pénzfeldobás dönt, és az hoz a házigazda szerepébe, akinek a pályáján játszanak."
arSA = "مواجهة فردية 1 ضد 1 مع لاعب آخر اختار وضع اللعب الجماعي نفسه. يُفضَّل أولاً اللاعبون الذين لديهم الخريطة نفسها والصعوبة نفسها وإعدادات اللعبة نفسها. وإذا اختلفت اختياراتكما، يُحسم الأمر برمية عملة، ويكون المضيف صاحب الخريطة المختارة."

