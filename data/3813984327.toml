["BeaverBuddies.Settings.AllowDevTools.Tooltip"]
raw = "Lets every player use the dev tools. Changes made with them are synced. Dev tools that can't be synced are always blocked in co-op."
status = "normal"
enUS = "Lets every player use the dev tools. Changes made with them are synced. Dev tools that can't be synced are always blocked in co-op."
zhCN = "允许所有玩家使用开发者工具。使用这些工具所做的更改会同步。无法同步的开发者工具在合作模式中始终会被禁用。"
zhTW = "讓所有玩家都能使用開發者工具。使用這些工具所做的變更會同步。無法同步的開發者工具在合作模式中一律禁止使用。"
ruRU = "Позволяет каждому игроку пользоваться инструментами разработчика. Изменения, внесённые с их помощью, синхронизируются. Инструменты разработчика, которые нельзя синхронизировать, всегда недоступны в кооперативной игре."
jaJP = "すべてのプレイヤーが開発ツールを使えるようにします。開発ツールで行った変更は同期されます。同期できない開発ツールは、協力プレイでは常にブロックされます。"
frFR = "Permet à tous les joueurs d’utiliser les outils de développement. Les modifications apportées avec ces outils sont synchronisées. En coop, les outils de développement qui ne peuvent pas être synchronisés sont toujours bloqués."
deDE = "Ermöglicht allen Spielern die Nutzung der Entwicklertools. Damit vorgenommene Änderungen werden synchronisiert. Entwicklertools, die nicht synchronisiert werden können, sind im Koop-Modus immer gesperrt."
plPL = "Pozwala każdemu graczowi korzystać z narzędzi deweloperskich. Wprowadzane za ich pomocą zmiany są synchronizowane. Narzędzia deweloperskie, których nie da się synchronizować, są zawsze zablokowane w trybie współpracy."
ptBR = "Permite que todos os jogadores usem as ferramentas de desenvolvedor. As alterações feitas com elas são sincronizadas. As ferramentas de desenvolvedor que não podem ser sincronizadas ficam sempre bloqueadas no modo cooperativo."
koKR = "모든 플레이어가 개발자 도구를 사용할 수 있게 합니다. 개발자 도구로 변경한 내용은 동기화됩니다. 동기화할 수 없는 개발자 도구는 협동 모드에서 항상 차단됩니다."
csCZ = "Umožňuje všem hráčům používat vývojářské nástroje. Provedené změny se synchronizují. Vývojářské nástroje, které nelze synchronizovat, jsou v kooperativní hře vždy zablokované."
viVN = "Cho phép mọi người chơi sử dụng công cụ dành cho nhà phát triển. Các thay đổi được thực hiện bằng những công cụ này sẽ được đồng bộ hóa. Các công cụ dành cho nhà phát triển không thể đồng bộ hóa luôn bị chặn trong chế độ co-op."
trTR = "Her oyuncunun geliştirici araçlarını kullanmasına izin verir. Bu araçlarla yapılan değişiklikler eşitlenir. Eşitlenemeyen geliştirici araçları, eşli oyunda her zaman engellenir."

