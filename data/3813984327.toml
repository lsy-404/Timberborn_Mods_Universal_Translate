["BeaverBuddies.Settings.PauseReduction.Tooltip"]
new = "For an optimal experience, all players should set it to the same value.\n\nOff - Default behaviour\nMenu only - Auto-pause only when opening the menu (not for deconstructions)\nNever auto-pause - The game will never auto-pause, including when opening the menu. This can lead to save corruptions if you don't pause the game before saving."
status = "normal"
enUS = "For the best experience, all players should set this to the same value.\n\nOff - Default behavior\nMenu only - Automatically pause only when opening the menu (not for deconstructions)\nNever auto-pause - The game will never pause automatically, including when opening the menu. This can corrupt saves if you don't pause the game before saving."
zhCN = "为获得最佳体验，所有玩家都应将其设为相同的值。\n\n关闭 - 默认行为\n仅菜单 - 仅在打开菜单时自动暂停（拆除建筑时不会）\n永不自动暂停 - 游戏永远不会自动暂停，包括打开菜单时。如果保存前不先暂停游戏，可能会导致存档损坏。"
zhTW = "為了獲得最佳體驗，所有玩家都應將此設定為相同值。\n\n關閉－預設行為\n僅限選單－只有開啟選單時才會自動暫停（拆除建築時不會）\n永不自動暫停－遊戲絕不會自動暫停，包括開啟選單時。如果你在儲存前沒有暫停遊戲，可能會導致存檔損毀。"
ruRU = "Для оптимальной игры все игроки должны выбрать одинаковое значение.\n\nВыключено — поведение по умолчанию  \nТолько в меню — игра автоматически ставится на паузу только при открытии меню (но не при разборке построек)  \nНикогда не ставить на паузу автоматически — игра никогда не будет автоматически ставиться на паузу, даже при открытии меню. Если перед сохранением не поставить игру на паузу, сохранение может повредиться."
jaJP = "最適なプレイ体験のため、すべてのプレイヤーが同じ値に設定してください。\n\nオフ - デフォルトの動作\nメニューのみ - メニューを開いたときのみ自動一時停止する（解体時は一時停止しません）\n自動一時停止しない - メニューを開いたときも含め、ゲームが自動一時停止することはありません。保存前にゲームを一時停止しないと、セーブデータが破損する可能性があります。"
frFR = "Pour une expérience optimale, tous les joueurs devraient choisir la même valeur.\n\nDésactivée - Comportement par défaut\nMenu uniquement - Mise en pause automatique uniquement à l'ouverture du menu (pas lors des démolitions)\nJamais de mise en pause automatique - Le jeu ne se mettra jamais en pause automatiquement, même à l'ouverture du menu. Cela peut corrompre les sauvegardes si vous ne mettez pas le jeu en pause avant de sauvegarder."
deDE = "Für ein optimales Spielerlebnis sollten alle Spieler denselben Wert einstellen.\n\nAus - Standardverhalten\nNur Menü - Automatische Pause nur beim Öffnen des Menüs (nicht bei Abrissen)\nNie automatisch pausieren - Das Spiel pausiert nie automatisch, auch nicht beim Öffnen des Menüs. Das kann zu beschädigten Spielständen führen, wenn du das Spiel vor dem Speichern nicht pausierst."
plPL = "Aby uzyskać optymalne wrażenia, wszyscy gracze powinni ustawić tę samą wartość.\n\nWył. – domyślne zachowanie\nTylko menu – automatyczna pauza tylko przy otwieraniu menu (nie podczas rozbiórki)\nNigdy nie wstrzymuj automatycznie – gra nigdy nie zostanie automatycznie wstrzymana, nawet przy otwieraniu menu. Jeśli nie wstrzymasz gry przed zapisem, może to doprowadzić do uszkodzenia zapisów."
csCZ = "Pro optimální zážitek by měli všichni hráči nastavit stejnou hodnotu.\n\nVypnuto – výchozí chování\nPouze nabídka – automatické pozastavení pouze při otevření nabídky (nikoli při demolicích)\nNikdy automaticky nepozastavovat – Hra se nikdy automaticky nepozastaví, ani při otevření nabídky. Pokud hru před ukládáním nepozastavíte, může dojít k poškození uložených pozic."
viVN = "Để có trải nghiệm tối ưu, tất cả người chơi nên đặt tùy chọn này ở cùng một giá trị.\n\nTắt - Hành vi mặc định\nChỉ menu - Chỉ tự động tạm dừng khi mở menu (không áp dụng khi tháo dỡ)\nKhông bao giờ tự động tạm dừng - Trò chơi sẽ không bao giờ tự động tạm dừng, kể cả khi mở menu. Điều này có thể làm hỏng dữ liệu lưu nếu bạn không tạm dừng trò chơi trước khi lưu."
trTR = "En iyi deneyim için tüm oyuncular bunu aynı değere ayarlamalıdır.\n\nKapalı - Varsayılan davranış\nYalnızca menü - Yalnızca menüyü açarken otomatik duraklatır (yıkımlar için değil)\nOtomatik duraklatma asla - Menü açılırken bile oyun asla otomatik duraklatılmaz. Oyunu kaydetmeden önce duraklatmazsanız bu, kayıtların bozulmasına yol açabilir."

