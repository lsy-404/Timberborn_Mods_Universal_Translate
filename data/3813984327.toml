plPL = "Ich BeaverBuddies wyszukuje mecze inaczej niż twój. Osoba korzystająca ze starszej wersji musi ją zaktualizować."
ptBR = "O BeaverBuddies deles procura partidas de um jeito diferente do seu. Quem estiver usando a versão mais antiga precisa atualizar."
koKR = "상대방의 BeaverBuddies는 당신의 것과 다른 방식으로 게임을 찾습니다. 구버전을 사용하는 쪽이 업데이트해야 합니다."
csCZ = "Jejich BeaverBuddies hledá shody jiným způsobem než vaše. Kdo má starší verzi, musí ji aktualizovat."
viVN = "BeaverBuddies của họ tìm trận đấu theo cách khác với của bạn. Người dùng phiên bản cũ hơn cần cập nhật."
trTR = "Onların BeaverBuddies eşleşmeleri sizinkinden farklı şekilde arıyor. Eski sürüme sahip olanın güncelleme yapması gerekiyor."

["BeaverBuddies.Match.Incompatible.Mods"]
