ukUA = "Оберіть хост-гравця, щоб побачити його матч. Нижче виберіть свою фракцію, потім натисніть «Приєднатися»: ви граєте на його карті та з його складністю."
thTH = "เลือกโฮสต์เพื่อดูการแข่งขันของพวกเขา เลือกฝ่ายของคุณด้านล่าง จากนั้นกดเข้าร่วม คุณจะเล่นบนแผนที่และระดับความยากของฝ่ายนั้น"
csCZ = "Vyberte hostitele a zobrazte jeho zápas. Níže zvolte svou frakci a pak se připojte: budete hrát na jeho mapě a obtížnosti."
viVN = "Chọn một người chơi chủ phòng để xem thiết lập trận của họ. Chọn phe của bạn bên dưới, rồi nhấn Tham gia: bạn sẽ chơi bản đồ và độ khó của họ."
