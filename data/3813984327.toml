["BeaverBuddies.JoinInProgress.FailedToReload"]
raw = "The game couldn't be saved for the player joining it, so they weren't let in. Try again, or save and Host again."
status = "normal"
enUS = "The game couldn't be saved for the player joining, so they weren't allowed in. Try again, or save and host again."
zhCN = "无法为正在加入的玩家保存游戏，因此未允许其加入。请重试，或保存游戏后重新主持。"
zhTW = "無法為正在加入的玩家儲存遊戲，因此未能讓他們加入。請再試一次，或先儲存遊戲，然後重新主持。"
ruRU = "Не удалось сохранить игру для подключающегося игрока, поэтому его не пустили. Попробуйте ещё раз или сохраните игру и снова создайте хост."
jaJP = "参加しようとしているプレイヤー向けにゲームを保存できなかったため、参加は許可されませんでした。もう一度試すか、保存してから再度ホストしてください。"
frFR = "La partie n’a pas pu être sauvegardée pour le joueur qui tentait de la rejoindre, il n’a donc pas pu entrer. Réessayez, ou sauvegardez la partie et hébergez-la à nouveau."
deDE = "Das Spiel konnte für den beitretenden Spieler nicht gespeichert werden, daher wurde ihm der Beitritt verweigert. Versuche es erneut oder speichere das Spiel und starte das Hosting erneut."
plPL = "Nie udało się zapisać gry dla dołączającego gracza, więc nie wpuszczono go do rozgrywki. Spróbuj ponownie albo zapisz grę i ponownie ją hostuj."
ptBR = "Não foi possível salvar o jogo para o jogador que estava entrando, então ele não pôde entrar. Tente novamente ou salve e hospede de novo."
koKR = "참가하려는 플레이어를 위해 게임을 저장하지 못해 입장을 허용하지 않았습니다. 다시 시도하거나 저장한 뒤 다시 호스트하세요."
trTR = "Oyuna katılan oyuncu için oyun kaydedilemedi, bu yüzden içeri alınmadı. Tekrar deneyin ya da oyunu kaydedip yeniden barındırın."
esES = "No se pudo guardar la partida para el jugador que intentaba unirse, por lo que no se le permitió entrar. Inténtalo de nuevo o guarda y vuelve a alojar la partida."
itIT = "Impossibile salvare la partita per il giocatore che si stava unendo, quindi non è stato ammesso. Riprova oppure salva e ospita di nuovo."
ukUA = "Гру не вдалося зберегти для гравця, який приєднувався, тому його не впустили. Спробуйте ще раз або збережіть і знову створіть гру для гостей."
thTH = "เกมไม่สามารถบันทึกสำหรับผู้เล่นที่กำลังเข้าร่วม จึงไม่ได้อนุญาตให้เข้า ลองอีกครั้ง หรือบันทึกแล้วเปิดโฮสต์ใหม่"
csCZ = "Hru se nepodařilo uložit pro připojujícího se hráče, takže nebyl vpuštěn. Zkuste to znovu, nebo hru uložte a znovu ji hostujte."
viVN = "Không thể lưu trò chơi cho người chơi đang tham gia, nên họ không được phép vào. Hãy thử lại hoặc lưu trò chơi rồi tạo phòng lại."
caES = "No s'ha pogut desar la partida per al jugador que s'hi volia unir, així que no s'ha deixat entrar. Torna-ho a provar o desa i tornar a Hostatjar."
beBY = "Гульня не магла быць захаваная для гульца, які далучаўся да яе, таму яго не пусцілі. Паспрабуйце яшчэ раз або захавайце і зноў адкрыйце гульню для ўдзелу."
roRO = "Jocul nu a putut fi salvat pentru jucătorul care se alătură, așa că nu a fost lăsat să intre. Încearcă din nou sau salvează și găzduiește din nou."
huHU = "A játékot nem sikerült elmenteni a csatlakozni készülő játékos számára, ezért nem engedtük be. Próbáld újra, vagy mentsd el, majd indítsd újra a játékot házigazdaként."
arSA = "لم يتمكن النظام من حفظ اللعبة للاعب الذي ينضم إليها، لذلك لم يُسمح له بالدخول. حاول مرة أخرى، أو احفظ ثم استضف اللعبة من جديد."

