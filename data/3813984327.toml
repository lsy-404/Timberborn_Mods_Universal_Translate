["BeaverBuddies.Settings.EnableSteamConnection.Tooltip"]
raw = "Allows players to join your games via Steam's peer-to-peer networking.\nPlayers will still be able to join via port forwarding.\nNote: This feature may not work if your network does not support peer-to-peer connections.\nAdditionally, peer-to-peer connections may be slower than direct connections."
status = "normal"
enUS = "Allows players to join your games via Steam's peer-to-peer networking.\nPlayers will still be able to join via port forwarding.\nNote: This feature may not work if your network does not support peer-to-peer connections.\nAdditionally, peer-to-peer connections may be slower than direct connections."
zhCN = "允许玩家通过 Steam 的点对点网络加入你的游戏。\n玩家仍可通过端口转发加入。\n注意：如果你的网络不支持点对点连接，此功能可能无法使用。\n此外，点对点连接可能比直接连接更慢。"
zhTW = "允許玩家透過 Steam 的點對點網路連線加入你的遊戲。\n玩家仍可透過連接埠轉送加入。\n注意：如果你的網路不支援點對點連線，此功能可能無法運作。\n此外，點對點連線可能比直接連線更慢。"
ruRU = "Позволяет игрокам присоединяться к вашим играм через одноранговую сеть Steam.\nИгроки по-прежнему смогут присоединяться через перенаправление портов.\nПримечание: эта функция может не работать, если ваша сеть не поддерживает одноранговые соединения.\nКроме того, одноранговые соединения могут быть медленнее прямых."
jaJP = "Steamのピアツーピア通信を利用して、他のプレイヤーがあなたのゲームに参加できるようにします。\nポートフォワーディングを利用した参加も引き続き可能です。\n注意：お使いのネットワークがピアツーピア接続に対応していない場合、この機能は動作しないことがあります。\nまた、ピアツーピア接続は直接接続より遅くなることがあります。"
frFR = "Permet aux joueurs de rejoindre vos parties via le réseau pair-à-pair de Steam.\nLes joueurs pourront toujours rejoindre vos parties grâce à la redirection de ports.\nRemarque : cette fonctionnalité peut ne pas fonctionner si votre réseau ne prend pas en charge les connexions pair-à-pair.\nDe plus, les connexions pair-à-pair peuvent être plus lentes que les connexions directes."
deDE = "Ermöglicht Spielern, deinen Spielen über Steams Peer-to-Peer-Netzwerk beizutreten.\nSpieler können weiterhin über Portweiterleitung beitreten.\nHinweis: Diese Funktion funktioniert möglicherweise nicht, wenn dein Netzwerk Peer-to-Peer-Verbindungen nicht unterstützt.\nAußerdem können Peer-to-Peer-Verbindungen langsamer sein als direkte Verbindungen."
plPL = "Umożliwia graczom dołączanie do Twoich gier za pośrednictwem sieci peer-to-peer Steam.\nGracze nadal będą mogli dołączać przez przekierowanie portów.\nUwaga: Ta funkcja może nie działać, jeśli Twoja sieć nie obsługuje połączeń peer-to-peer.\nPonadto połączenia peer-to-peer mogą być wolniejsze niż połączenia bezpośrednie."
ptBR = "Permite que jogadores entrem nos seus jogos usando a rede ponto a ponto do Steam.\nOs jogadores ainda poderão entrar por meio do redirecionamento de portas.\nNota: Este recurso pode não funcionar se a sua rede não oferecer suporte a conexões ponto a ponto.\nAlém disso, as conexões ponto a ponto podem ser mais lentas do que as conexões diretas."
koKR = "플레이어가 Steam의 P2P 네트워크를 통해 게임에 참가할 수 있습니다.\n플레이어는 여전히 포트 포워딩을 통해 참가할 수 있습니다.\n참고: 네트워크가 P2P 연결을 지원하지 않으면 이 기능이 작동하지 않을 수 있습니다.\n또한 P2P 연결은 직접 연결보다 느릴 수 있습니다."
trTR = "Oyuncuların Steam'in eşler arası ağ bağlantısını kullanarak oyunlarınıza katılmasını sağlar.\nOyuncular, bağlantı noktası yönlendirme yoluyla da katılabilir.\nNot: Ağınız eşler arası bağlantıları desteklemiyorsa bu özellik çalışmayabilir.\nAyrıca eşler arası bağlantılar, doğrudan bağlantılardan daha yavaş olabilir."
esES = "Permite a los jugadores unirse a tus partidas mediante la red peer-to-peer de Steam.\nLos jugadores seguirán pudiendo unirse mediante reenvío de puertos.\nNota: es posible que esta función no funcione si tu red no admite conexiones peer-to-peer.\nAdemás, las conexiones peer-to-peer pueden ser más lentas que las conexiones directas."
itIT = "Consente ai giocatori di unirsi alle tue partite tramite la rete peer-to-peer di Steam.\nI giocatori potranno comunque unirsi tramite port forwarding.\nNota: questa funzione potrebbe non funzionare se la tua rete non supporta connessioni peer-to-peer.\nInoltre, le connessioni peer-to-peer potrebbero essere più lente delle connessioni dirette."
ukUA = "Дозволяє гравцям приєднуватися до ваших ігор через одноранговий зв'язок Steam.\nГравці й надалі зможуть приєднуватися через перенаправлення портів.\nПримітка: ця функція може не працювати, якщо ваша мережа не підтримує одноранговi з'єднання.\nКрім того, одноранговi з'єднання можуть бути повільнішими за прямі."
thTH = "การเปิดใช้งานนี้ช่วยให้ผู้เล่นเข้าร่วมเกมของคุณผ่านการเชื่อมต่อแบบ peer-to-peer ของ Steam ได้\nผู้เล่นยังคงสามารถเข้าร่วมผ่านการเปิดพอร์ต (port forwarding) ได้เช่นเดิม\nหมายเหตุ: ฟีเจอร์นี้อาจใช้งานไม่ได้หากเครือข่ายของคุณไม่รองรับการเชื่อมต่อแบบ peer-to-peer\nนอกจากนี้ การเชื่อมต่อแบบ peer-to-peer อาจช้ากว่าการเชื่อมต่อโดยตรง"
csCZ = "Umožňuje hráčům připojit se k vašim hrám prostřednictvím technologie peer-to-peer ve službě Steam.\nHráči se budou stále moci připojit pomocí přesměrování portů.\nPoznámka: Tato funkce nemusí fungovat, pokud vaše síť nepodporuje připojení peer-to-peer.\nPřipojení peer-to-peer navíc mohou být pomalejší než přímá připojení."
viVN = "Cho phép người chơi tham gia trò chơi của bạn thông qua kết nối ngang hàng của Steam.\nNgười chơi vẫn có thể tham gia bằng cách chuyển tiếp cổng.\nLưu ý: Tính năng này có thể không hoạt động nếu mạng của bạn không hỗ trợ kết nối ngang hàng.\nNgoài ra, kết nối ngang hàng có thể chậm hơn kết nối trực tiếp."
caES = "Permet als jugadors unir-se a les vostres partides mitjançant la xarxa peer-to-peer de Steam.\nEls jugadors encara podran unir-se mitjançant reenviament de ports.\nNota: Aquesta funció pot no funcionar si la vostra xarxa no admet connexions peer-to-peer.\nA més, les connexions peer-to-peer poden ser més lentes que les connexions directes."
beBY = "Дазваляе гульцам далучацца да вашых гульняў праз аднарангovую сетку Steam.\nГульцы ўсё яшчэ змогуць далучыцца праз перанакіраванне портаў.\nПрымітка: гэта функцыя можа не працаваць, калі ваша сетка не падтрымлівае аднаранговыя злучэнні.\nАкрамя таго, аднарангovyя злучэнні могуць быць павольнейшымі за прамыя злучэнні."
roRO = "Permite jucătorilor să se alăture jocurilor tale prin rețeaua peer-to-peer a Steam.\nJucătorii vor putea în continuare să se alăture prin redirecționare de porturi.\nNotă: această funcție s-ar putea să nu funcționeze dacă rețeaua ta nu acceptă conexiuni peer-to-peer.\nDe asemenea, conexiunile peer-to-peer pot fi mai lente decât conexiunile directe."
huHU = "Lehetővé teszi, hogy játékosok a Steam peer-to-peer hálózatán keresztül csatlakozzanak a játékaidhoz.\nA játékosok továbbra is csatlakozhatnak port-továbbítással.\nMegjegyzés: Ez a funkció nem működhet, ha a hálózatod nem támogatja a peer-to-peer kapcsolatokat.\nEmellett a peer-to-peer kapcsolatok lassabbak lehetnek, mint a közvetlen kapcsolatok."
arSA = "يتيح للاعبين الانضمام إلى ألعابك عبر الشبكة المباشرة بين الأقران (peer-to-peer) في Steam.\nسيظل بإمكان اللاعبين الانضمام عبر توجيه المنافذ (port forwarding).\nملاحظة: قد لا تعمل هذه الميزة إذا كانت شبكتك لا تدعم اتصالات الشبكة المباشرة بين الأقران.\nبالإضافة إلى ذلك، قد تكون اتصالات الشبكة المباشرة بين الأقران أبطأ من الاتصالات المباشرة."

