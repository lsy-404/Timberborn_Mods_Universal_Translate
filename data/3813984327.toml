trTR = "Etkinleştirildiğinde arkadaşların, onları davet etmen gerekmeden Steam üzerinden doğrudan oyununa katılabilir ve oyun, herkesin görebileceği Açık Eşleşmeler listesinde görünür."
esES = "Cuando está activado, tus amigos pueden unirse a tu partida directamente a través de Steam sin que los invites, y aparece en Partidas abiertas para cualquiera."
