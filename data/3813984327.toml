ukUA = "Гравець втратив синхронізацію. Хост перезавантажує гру для всіх; вона продовжиться за мить."
thTH = "ผู้เล่นคนหนึ่งหลุดจากการซิงค์ ผู้เล่นโฮสต์กำลังโหลดเกมใหม่สำหรับทุกคน และเกมจะดำเนินต่อในอีกสักครู่"
