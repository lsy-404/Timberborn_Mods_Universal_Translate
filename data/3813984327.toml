["BeaverBuddies.Match.Incompatible.LoggingTheirs"]
raw = "They have detailed logging on and you don't. Turn on \"Always Use Detailed Logging\" in the BeaverBuddies settings, or ask them to turn it off."
status = "normal"
enUS = "They have detailed logging enabled, but you don't. Turn on \"Always Use Detailed Logging\" in the BeaverBuddies settings, or ask them to turn it off."
zhCN = "他们启用了详细日志记录，而你没有。请在 BeaverBuddies 设置中启用“始终使用详细日志记录”，或者让他们关闭此选项。"
zhTW = "對方已啟用詳細記錄，而你沒有。請在 BeaverBuddies 設定中啟用「一律使用詳細記錄」，或請對方將其關閉。"
ruRU = "У них включено подробное ведение журнала, а у вас — нет. Включите «Всегда использовать подробное ведение журнала» в настройках BeaverBuddies или попросите их отключить его."
jaJP = "相手は詳細ログを有効にしていますが、あなたは有効にしていません。BeaverBuddiesの設定で「常に詳細ログを使用」を有効にするか、相手に無効にしてもらってください。"
frFR = "Ils ont activé la journalisation détaillée, contrairement à vous. Activez « Always Use Detailed Logging » dans les paramètres de BeaverBuddies, ou demandez-leur de la désactiver."
deDE = "Bei ihnen ist die detaillierte Protokollierung aktiviert, bei dir nicht. Aktiviere in den BeaverBuddies-Einstellungen „Detaillierte Protokollierung immer verwenden“ oder bitte sie, sie zu deaktivieren."
plPL = "Oni mają włączone szczegółowe logowanie, a ty nie. Włącz opcję „Zawsze używaj szczegółowego logowania” w ustawieniach BeaverBuddies albo poproś ich o jej wyłączenie."
ptBR = "Eles estão com o registro detalhado ativado, e você não. Ative “Sempre usar registro detalhado” nas configurações do BeaverBuddies ou peça para eles desativá-lo."
koKR = "상대방은 상세 로그 기록을 켜 두었지만, 당신은 그렇지 않습니다. BeaverBuddies 설정에서 \"항상 상세 로그 기록 사용\"을 켜거나, 상대방에게 끄라고 요청하세요."
csCZ = "Mají zapnuté podrobné protokolování, zatímco vy ne. Zapněte v nastavení BeaverBuddies možnost „Vždy používat podrobné protokolování“, nebo je požádejte, aby ji vypnuli."
viVN = "Họ đã bật ghi nhật ký chi tiết, còn bạn thì chưa. Hãy bật \"Always Use Detailed Logging\" trong cài đặt BeaverBuddies hoặc yêu cầu họ tắt tùy chọn này."
trTR = "Onlarda ayrıntılı günlük kaydı açık, sende değil. BeaverBuddies ayarlarından \"Ayrıntılı Günlük Kaydını Her Zaman Kullan\" seçeneğini aç ya da onlardan kapatmalarını iste."

