["BeaverBuddies.Match.FindMatch.Tooltip"]
status = "normal"
raw = "A 1v1 against another player over Steam who picked the same multiplayer mode. Players with the same map, difficulty and game settings are tried first. Where your picks differ, a coin flip decides, and whoever's map it is hosts."
enUS = "A 1v1 against another player on Steam who selected the same multiplayer mode. Players with the same map, difficulty, and game settings are matched first. If your selections differ, a coin flip decides, and the player whose map is chosen hosts."
zhCN = "通过 Steam 与另一位选择了相同多人游戏模式的玩家进行 1v1 对战。会优先匹配地图、难度和游戏设置都相同的玩家。如果你们的选择不同，则由掷硬币决定；地图所属玩家将担任主机。"
zhTW = "透過 Steam 與另一位選擇相同多人遊戲模式的玩家進行 1 對 1 對戰。系統會優先配對地圖、難度和遊戲設定都相同的玩家。如果你們的選擇不同，則由擲硬幣決定；地圖屬於哪位玩家，就由哪位玩家擔任主機。"
ruRU = "Матч 1 на 1 с другим игроком через Steam, выбравшим тот же режим многопользовательской игры. Сначала вас попытаются свести с игроками, выбравшими ту же карту, сложность и настройки игры. Если ваши варианты различаются, выбор решит подбрасывание монеты, а хостом станет игрок, чья карта выпадет."
jaJP = "Steam経由で、同じマルチプレイモードを選んだ別のプレイヤーと1対1で対戦します。マップ、難易度、ゲーム設定が同じプレイヤーが、まず優先的にマッチングされます。選択内容が異なる場合はコイントスで決め、選ばれたマップのプレイヤーがホストになります。"
frFR = "Un match 1 contre 1 contre un autre joueur sur Steam ayant choisi le même mode multijoueur. Les joueurs ayant choisi la même carte, la même difficulté et les mêmes paramètres de jeu sont recherchés en priorité. En cas de choix différents, le hasard tranche à pile ou face, et le joueur dont la carte est retenue héberge la partie."
deDE = "Ein 1-gegen-1 gegen einen anderen Spieler über Steam, der denselben Mehrspielermodus gewählt hat. Spieler mit derselben Karte, demselben Schwierigkeitsgrad und denselben Spieleinstellungen werden zuerst zusammengeführt. Unterscheiden sich eure Auswahlmöglichkeiten, entscheidet ein Münzwurf, und derjenige, dessen Karte ausgewählt wird, hostet das Spiel."
plPL = "Pojedynek 1 na 1 z innym graczem przez Steam, który wybrał ten sam tryb wieloosobowy. Najpierw dobierani są gracze z tą samą mapą, poziomem trudności i ustawieniami gry. Jeśli ich wybory się różnią, decyduje rzut monetą, a gospodarzem zostaje osoba, której mapa została wybrana."
ptBR = "Um 1 contra 1 contra outro jogador pela Steam que escolheu o mesmo modo multijogador. Primeiro, tentamos encontrar jogadores com o mesmo mapa, nível de dificuldade e configurações de jogo. Quando as escolhas forem diferentes, um cara ou coroa decide, e quem escolheu o mapa será o anfitrião."
koKR = "Steam에서 같은 멀티플레이 모드를 선택한 다른 플레이어와 1대1 대전을 합니다. 같은 맵, 난이도, 게임 설정을 선택한 플레이어를 우선으로 찾습니다. 선택이 다른 항목은 동전 던지기로 결정하고, 맵이 선택된 플레이어가 호스트가 됩니다."
csCZ = "Souboj 1 na 1 s jiným hráčem přes Steam, který si zvolil stejný režim pro více hráčů. Nejprve se hledají hráči se stejnou mapou, obtížností a herním nastavením. Pokud se vaše volby liší, rozhodne hod mincí a hostitelem se stane ten, jehož mapa byla vybrána."
viVN = "Trận đấu 1v1 với một người chơi khác qua Steam đã chọn cùng chế độ nhiều người chơi. Trước tiên, hệ thống sẽ tìm những người chơi có cùng bản đồ, độ khó và cài đặt trò chơi. Nếu lựa chọn của hai bên khác nhau, kết quả sẽ do tung đồng xu quyết định; người có bản đồ được chọn sẽ làm chủ phòng."
trTR = "Steam üzerinden aynı çok oyunculu modu seçmiş başka bir oyuncuya karşı 1'e 1 maç. Önce harita, zorluk ve oyun ayarları sizinkiyle aynı olan oyuncular denenir. Seçimleriniz farklıysa yazı tura atılır ve haritası seçilen oyuncu oyuna ev sahipliği yapar."

