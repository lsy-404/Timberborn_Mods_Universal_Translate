jaJP = "ホストのアドレスを指定してゲームに参加します。Steamでは、フレンドからの招待でも参加できます。"
frFR = "Rejoignez une partie à l’aide de l’adresse de son hôte. Sur Steam, l’invitation d’un ami fonctionne aussi."
deDE = "Tritt einem Spiel über die Adresse des Hosts bei. Auf Steam funktioniert auch die Einladung eines Freundes."
