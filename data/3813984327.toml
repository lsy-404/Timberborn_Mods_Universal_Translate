["BeaverBuddies.Settings.AlwaysTrace.Tooltip"]
raw = "When enabled, the game will always use detailed logging, which enables you to submit desync reports on the first occurrence without manually enabling detailed logging.\nNote that all players must have the setting enabled.\nThis setting will cause some lag and is not recommended for most players."
status = "normal"
enUS = "When enabled, the game will always use detailed logging, allowing you to submit desync reports the first time a desync occurs without manually enabling detailed logging.\nNote that all players must have this setting enabled.\nThis setting may cause lag and is not recommended for most players."
zhCN = "启用后，游戏将始终使用详细日志记录，这样你就能在首次发生不同步时提交报告，无需手动启用详细日志记录。\n请注意，所有玩家都必须启用此设置。\n此设置会造成一定卡顿，不建议大多数玩家启用。"
zhTW = "啟用後，遊戲將一律使用詳細記錄功能，讓你在首次發生不同步時即可提交報告，無須手動啟用詳細記錄。\n請注意，所有玩家都必須啟用此設定。\n此設定會造成些許延遲，因此不建議大多數玩家使用。"
ruRU = "Если эта настройка включена, игра всегда будет вести подробный журнал, что позволит отправлять отчёты о рассинхронизации при первом же её появлении без необходимости вручную включать подробное журналирование.\nУчтите, что эта настройка должна быть включена у всех игроков.\nОна может вызывать задержки и не рекомендуется большинству игроков."
jaJP = "有効にすると、詳細ログが常に使用されるため、手動で詳細ログを有効にしなくても、最初に同期ずれが発生した時点で同期ずれレポートを送信できます。\nすべてのプレイヤーがこの設定を有効にする必要があります。\nこの設定を有効にすると多少ラグが発生するため、ほとんどのプレイヤーには推奨されません。"
frFR = "Lorsque cette option est activée, le jeu utilise toujours la journalisation détaillée, ce qui vous permet d'envoyer des rapports de désynchronisation dès le premier incident sans avoir à activer manuellement la journalisation détaillée.\nNotez que tous les joueurs doivent activer cette option.\nCette option peut entraîner des ralentissements et n'est pas recommandée pour la plupart des joueurs."
deDE = "Wenn diese Option aktiviert ist, verwendet das Spiel immer eine detaillierte Protokollierung. So kannst du bereits beim ersten Auftreten eines Desyncs einen Desync-Bericht einreichen, ohne die detaillierte Protokollierung manuell aktivieren zu müssen.\nBeachte, dass alle Spieler diese Option aktiviert haben müssen.\nDiese Einstellung verursacht Verzögerungen und wird den meisten Spielern nicht empfohlen."
plPL = "Po włączeniu tej opcji gra będzie zawsze korzystać ze szczegółowego rejestrowania, dzięki czemu będzie można wysłać raport o desynchronizacji już przy jej pierwszym wystąpieniu, bez konieczności ręcznego włączania szczegółowego rejestrowania.\nPamiętaj, że to ustawienie muszą włączyć wszyscy gracze.\nTo ustawienie może powodować lagi i nie jest zalecane dla większości graczy."
ptBR = "Quando ativada, esta opção fará com que o jogo sempre use o registro detalhado, permitindo enviar relatórios de dessincronização na primeira ocorrência sem precisar ativar o registro detalhado manualmente.\nObserve que todos os jogadores precisam ativar esta opção.\nEsta opção causará um pouco de lag e não é recomendada para a maioria dos jogadores."
koKR = "활성화하면 게임에서 항상 상세 로그를 사용하므로, 상세 로그를 수동으로 활성화하지 않아도 동기화 오류가 처음 발생했을 때 보고서를 제출할 수 있습니다.\n모든 플레이어가 이 설정을 활성화해야 합니다.\n이 설정을 사용하면 렉이 발생할 수 있으므로 대부분의 플레이어에게는 권장하지 않습니다."
csCZ = "Je-li tato možnost zapnutá, hra bude vždy používat podrobné protokolování, takže můžete odeslat hlášení o desynchronizaci hned při jejím prvním výskytu, aniž byste museli podrobné protokolování zapínat ručně.\nUpozorňujeme, že toto nastavení musí mít zapnuté všichni hráči.\nToto nastavení způsobí určité zpoždění a většině hráčů se nedoporučuje."
viVN = "Khi bật, trò chơi sẽ luôn sử dụng nhật ký chi tiết, cho phép bạn gửi báo cáo lỗi mất đồng bộ ngay từ lần đầu tiên xảy ra mà không cần bật nhật ký chi tiết thủ công.\nLưu ý rằng tất cả người chơi đều phải bật cài đặt này.\nCài đặt này sẽ gây giật lag và không được khuyến nghị cho hầu hết người chơi."
trTR = "Etkinleştirildiğinde oyun her zaman ayrıntılı günlük kaydı tutar; böylece ayrıntılı günlük kaydını elle etkinleştirmeden ilk desenkronizasyon oluşumunda rapor gönderebilirsiniz.\nTüm oyuncuların bu ayarı etkinleştirmiş olması gerektiğini unutmayın.\nBu ayar bir miktar gecikmeye neden olur ve çoğu oyuncu için önerilmez."

