viVN = "Bạn đang bật ghi nhật ký chi tiết, còn họ thì không. Hãy tắt \\\"Always Use Detailed Logging\\\" trong cài đặt BeaverBuddies, hoặc yêu cầu họ bật tính năng này."
trTR = "Sizde ayrıntılı günlük kaydı açık, onlarda değil. BeaverBuddies ayarlarından \"Ayrıntılı Günlük Kaydını Her Zaman Kullan\" seçeneğini kapatın veya onlardan bu seçeneği açmalarını isteyin."

["BeaverBuddies.Match.Incompatible.Protocol"]
status = "normal"
raw = "Their BeaverBuddies looks for matches differently from yours. Whoever has the older version needs to update."
