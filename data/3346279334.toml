status = "normal"
enUS = "This station allows beavers to get on the train and travel to another station that is connected to it."
zhCN = "允许通过火车运送海狸，海狸可以通过火车前往另一个乘客站。"
zhTW = "這個車站允許海狸上車，並前往彼此相連的另一個車站。"
