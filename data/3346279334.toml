["Tobbert.TrackCrossing.Description"]
raw = "Beavers can cross the tracks here. Collision will not be implemented as performance will suffer too much."
status = "normal"
enUS = "Beavers can cross the tracks here. Collision will not be implemented as performance will suffer too much."
zhCN = "海狸可以在这里穿过轨道。"
zhTW = "水獺可以在這裡穿越軌道。由於性能會受到太大影響，因此不會實現碰撞。"
ruRU = "Бобры могут пересекать пути здесь. Столкновение не будет реализовано, так как производительность сильно пострадает."
jaJP = "ビーバーはここで線路を渡ることができます。パフォーマンスが大きく低下するため、衝突は実装されません。"
frFR = "Les castors peuvent traverser les voies ici. La collision ne sera pas mise en œuvre car les performances souffriraient trop."
deDE = "Biber können hier die Gleise überqueren. Kollisionen werden nicht implementiert, da die Leistung zu sehr darunter leiden würde."
plPL = "Bobry mogą przechodzić przez tory tutaj. Kolizje nie będą wprowadzone, ponieważ wydajność zbyt ucierpi."
ptBR = "Os castores podem atravessar os trilhos aqui. A colisão não será implementada, pois o desempenho sofrerá muito."
koKR = "비버는 여기서 선로를 가로지를 수 있습니다. 충돌은 구현되지 않으며, 성능이 너무 저하될 것입니다."
trTR = "Alageyiklerin burada rayların üzerinden geçmesine izin verilir. Çarpışma uygulanmayacak, çünkü performans çok fazla etkilenir."
esES = "Los castores pueden cruzar las vías aquí. No se implementará la colisión, ya que el rendimiento se vería afectado en exceso."
