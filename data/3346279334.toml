ukUA = "Ця станція дозволяє бобрам сісти на потяг і поїхати до іншої станції, яка з'єднана з цією."
thTH = "สถานีนี้ช่วยให้บีเวอร์ขึ้นรถไฟและเดินทางไปยังสถานีอื่นที่เชื่อมต่อถึงกันได้"
csCZ = "Tato stanice umožňuje bobrům nastoupit na vlak a cestovat na jinou stanici, která jsou vzájemně propojené."
viVN = "Trạm này cho phép những chú hải ly lên tàu và di chuyển đến một trạm khác được kết nối với nhau."
caES = "Aquesta estació permet als castors pujar al tren i viatjar a una altra estació connectada amb ella."
beBY = "Гэтая станцыя дазваляе бабрам садзіцца ў цягнік і ездзіць на іншую станцыю, якая звязана з ёй."
roRO = "Această stație permite castorilor să urce în tren și să călătorească până la o altă stație conectată la ea."
