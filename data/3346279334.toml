koKR = "이 역은 비버들이 기차에 타고 서로 연결된 다른 역으로 여행할 수 있게 해줍니다."
trTR = "Bu istasyon, kunduzların trene binip birbirine bağlı olan diğer istasyonlara seyahat etmelerini sağlar."
esES = "Esta estación permite a los castores subir al tren y viajar a otra estación que esté conectada con ella."
