["Tobbert.TrackOneWay.Description"]
raw = "Will tell trains that they can only go through the green side. Can be changed back to a straight track by using the toggle when clicking on it. Creates a track section between one ways that allow a single train to be on it (indicated by the colors)."
status = "normal"
enUS = "Will inform trains that they can only pass through the green side. It can be switched back to a straight track by using the toggle when clicking on it. It creates a track section between one-way tracks that allows a single train to be on it (indicated by the colors)."
zhCN = "火车按路标方向通行的轨道，可以切换为直线轨道。<br><color=#FFFF1A>单向轨道会分隔不同轨道段，以颜色区分。</color><br><color=#FFA500>每个轨道段上只能有一辆火车通行，其他火车会在轨道段前依次等待。</color>"
zhTW = "將告訴火車只能通過綠色的路段。點擊開關可以將其改回直線軌道。在單行道之間創建一段軌道，使得只有一列火車可以在上面行駛（由顏色顯示）。"
ruRU = "Скажет поездам, что они могут проходить только через зеленую сторону. Можно вернуть прямую трассу, воспользовавшись переключателем при нажатии на него. Создает участок пути между односторонними направлениями, который позволяет находиться на нем только одному поезду (указываемое цветами)."
jaJP = "列車には緑の側面を通過できるだけであることを指示します。クリックして切り替えを使用することで直線トラックに戻すことができます。一方向の間に単一の列車が存在できるトラックセクションを作成します（色で示されています）。"
frFR = "Informera les trains qu'ils ne peuvent passer que par le côté vert. Peut être rétabli en une voie droite en utilisant le commutateur en cliquant dessus. Crée une section de voie entre des sens uniques qui permet à un seul train d'y être présent (indiqué par les couleurs)."
deDE = "Wird den Zügen mitteilen, dass sie nur durch die grüne Seite fahren können. Kann durch Umschalten beim Klicken darauf wieder in eine gerade Strecke geändert werden. Erstellt einen Gleisabschnitt zwischen Einbahnstraßen, der es einem einzelnen Zug ermöglicht, darauf zu sein (angezeigt durch die Farben)."
plPL = "Powiedzą, że pociągi mogą przejeżdżać tylko przez zieloną stronę. Można to zmienić z powrotem na prosty tor, używając przełącznika po kliknięciu na niego. Tworzy odcinek toru między jedną stroną, który pozwala jednemu pociągowi na pozostanie na nim (zaznaczone kolorami)."
ptBR = "Direi aos trens que eles podem passar apenas pelo lado verde. Pode ser revertido para um trilho reto usando o interruptor ao clicar nele. Cria uma seção de trilho entre as vias únicas que permite que um único trem esteja nela (indicado pelas cores)."
koKR = "기차가 초록색 측면으로만 이동할 수 있음을 알립니다. 클릭할 때 토글을 사용하여 직선 트랙으로 되돌릴 수 있습니다. 하나의 기차만 그 위에 있을 수 있도록 하는 일방통행 사이의 트랙 섹션을 생성합니다(색상으로 표시됨)."
trTR = "Trenlere sadece yeşil taraftan geçebileceklerini bildirir. Üzerine tıklanarak değiştirilen ayar ile düz bir ray haline geri döndürülebilir. Tek bir trenin üzerine çıkmasına izin veren, tek yönler arasına bir ray kesimi oluşturur (renklerle gösterilir)."
esES = "Hará que los trenes solo puedan circular por el lado verde. Puede volver a cambiarse a una vía recta usando el interruptor al hacer clic sobre ella. Crea una sección de vía entre sentidos únicos que solo permite que un tren esté en ella a la vez (indicado por los colores)."
itIT = "Indicherà ai treni che possono passare solo dal lato verde. Può essere riportato a un binario dritto usando il pulsante di commutazione quando ci si clicca sopra. Crea una sezione di binario tra binari a senso unico che consentono a un solo treno di trovarsi al suo interno (indicato dai colori)."
ukUA = "Повідомляє потягам, що вони можуть проїжджати лише зеленою стороною. Можна повернути до прямої колії, використовуючи перемикач під час натискання на нього. Створює ділянку колії між односторонніми переїздами, на якій може перебувати лише один потяг (позначається кольорами)."
thTH = "อธิบายให้รถไฟทราบว่าสามารถวิ่งผ่านได้เฉพาะด้านสีเขียวเท่านั้น สามารถเปลี่ยนกลับเป็นรางตรงได้โดยใช้สวิตช์เมื่อคลิกที่รางนั้น สร้างช่วงรางระหว่างทางเดียวที่อนุญาตให้รถไฟเพียงขบวนเดียวอยู่ในช่วงนั้นได้ (ระบุด้วยสี)"
csCZ = "Řekne vlakům, že mohou projíždět pouze zelenou stranou. Lze přepnout zpět na přímou trať pomocí přepínače při kliknutí na ni. Vytváří úsek tratě mezi jednosměrkami, který umožňuje jedinému vlaku se na něm nacházet (označeno barvami)."
viVN = "Sẽ cho tàu hỏa biết chúng chỉ có thể đi qua phía xanh. Có thể đổi lại thành đường ray thẳng bằng cách sử dụng công tắc khi nhấp vào nó. Tạo một đoạn đường ray giữa các đường một chiều cho phép một tàu hỏa duy nhất ở trên đó (được đánh dấu bằng màu sắc)."
caES = "Indicarà als trens que només poden passar pel costat verd. Es pot canviar de nou a una via recta usant l'interruptor en fer-hi clic. Crea una secció de via entre sentits únics que permet que un sol tren hi sigui alhora (indicat pels colors)."
beBY = "Паведамляе цягнікам, што яны могуць рухацца толькі праз зялёную бок. Можна вярнуць звычайны прамы шлях, выкарыстоўваючы перамыкач пры націсканні на яго. Стварае ўчастак шляху паміж аднабаковымі пераездамі, на які можа заехаць толькі адзін цягнік (паказваецца колерамі)."
roRO = "Va spune trenurilor că pot trece doar prin partea verde. Poate fi schimbat înapoi la o șină dreaptă folosind comutatorul la clic pe el. Creează o secțiune de șină între sensuri unice care permite ca un singur tren să fie pe ea (indicat de culori)."
huHU = "A vonatoknak csak a zöld oldalon szabad áthaladniuk. Kattintásra a váltó segítségével visszaállítható egyenes sínre. Olyan sínszakaszt hoz létre az egyirányú sínek között, amelyen egyszerre csak egy vonat tartózkodhat (ezt a színek jelzik)."
arSA = "تخبر القطارات أنه يمكنها المرور عبر الجانب الأخضر فقط. يمكن تغييره مرة أخرى إلى مسار مستقيم باستخدام مفتاح التبديل عند النقر عليه. ينشئ قسمًا من السكك بين مسارات أحادية الاتجاه تسمح لقطار واحد فقط بالوجود فيه (يُشار إلى ذلك بالألوان)."

