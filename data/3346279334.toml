frFR = "Lorsqu'il est activé, il ne permettra AUX CASTORS de se rendre uniquement dans les stations de passagers qui ont également ce paramètre activé et qui se trouvent dans d'autres districts."
deDE = "Wenn aktiviert, wird es NUR erlauben, dass Biber zu Passagierstationen gehen, die ebenfalls diese Einstellung aktiviert haben und in anderen Bezirken liegen."
plPL = "Gdy jest włączone, pozwoli to jedynie bobrom na korzystanie z stacji pasażerskich, które również mają włączone to ustawienie i znajdują się w innych dzielnicach."
ptBR = "Quando ativado, permitirá que apenas castores acessem estações de passageiros que também tenham esta configuração ativada e estejam em outros distritos."
koKR = "활성화되면 이 설정이 활성화되고 다른 구역에 있는 여객역으로만 비버가 이동할 수 있습니다."
trTR = "Etkinleştirildiğinde, sadece bu ayar etkin olan ve diğer bölgelerde bulunan yolcu istasyonlarına kunduzların gitmesine izin verecektir."
esES = "Cuando está activado, SOLO permite que los castores vayan a estaciones de pasajeros que también tengan esta opción activada y que estén en otros distritos."
itIT = "Se attivato, consente ESCLUSIVAMENTE ai castori di recarsi alle stazioni passeggeri che hanno anch'esse questa impostazione attivata e che si trovano in altri distretti."
ukUA = "Коли ввімкнено, дозволяє бобрам користуватися лише пасажирськими станціями, які також мають цей параметр увімкненим і знаходяться в інших районах."
thTH = "เมื่อเปิดใช้งาน จะอนุญาตให้เฉพาะบีเวอร์เดินทางไปยังสถานีโดยสารที่เปิดการตั้งค่านี้ด้วยเท่านั้น และอยู่ในเขตอื่น"
csCZ = "Při aktivaci to umožní pouze bobrům navštěvovat nádraží, která mají také toto nastavení povolené a nacházejí se v jiných okresech."
viVN = "Khi được bật, sẽ CHỈ cho các hải ly đi tới các trạm hành khách mà cài đặt này cũng được bật và nằm ở các khu vực khác."
caES = "Quan està activat, només permetrà que els castors vagin a les estacions de passatgers que també tinguin aquesta opció activada i que estiguin en altres districtes."
beBY = "Пры ўключэнні дазваляе бабрам карыстацца толькі пасажырскімі станцыямі, на якіх таксама ўключана гэтая налада і якія знаходзяцца ў іншых раёнах."
roRO = "Când este activată, va permite ca castorii să folosească doar stațiile de pasageri care au și ele această setare activată și se află în alte districte."
huHU = "Ha engedélyezve van, CSAK azok a bébik léphetnek be az utasállomásokra, amelyeken szintén engedélyezve van ez a beállítás, és amelyek más körzetekben találhatók."
arSA = "عند التفعيل، سيسمح فقط للقنادس بالذهاب إلى محطات الركاب التي لديها هذا الإعداد مفعّلاً أيضاً وتقع في مناطق أخرى."

