["Tobbert.WaitingStation.Description"]
raw = "Trains can wait here when they have nothing to do. This prevents trains from occupying the tracks. Trains cannot pathfind over this, so make sure its not in any crucial paths."
status = "normal"
enUS = "Trains can wait here when they have nothing to do. This prevents trains from occupying the tracks. Trains cannot navigate over this, so make sure it's not in any crucial paths."
zhCN = "火车没有运送任务时会在这里等待，防止占用轨道。<br><color=#FFFF1A>等候站不会被火车视作可用于运送物品的轨道。</color><br><color=#FFA500>建议与运送轨道并联，或者自身头尾相连后再与运送轨道连接。</color>"
zhTW = "火車在這裡可以等候，當它們沒有事情要做時。這可以防止火車佔用軌道。火車無法繞行過這個地方，所以請確保它不在任何關鍵路徑上。"
ruRU = "Поезда могут ждать здесь, когда им нечего делать. Это предотвращает занятость путей поездами. Поезда не могут проложить путь через это, так что убедитесь, что это не находится на каких-либо важных маршрутах."
jaJP = "列車は何もすることがないときにここで待機することができます。これにより、列車が線路を占有するのを防ぎます。列車はこれを通過することができないため、重要な経路に配置されないようにしてください。"
frFR = "Les trains peuvent attendre ici lorsqu'ils n'ont rien à faire. Cela empêche les trains d'occuper les voies. Les trains ne peuvent pas se frayer un chemin au-dessus de cela, donc assurez-vous que ce n'est pas sur des chemins cruciaux."
deDE = "Züge können hier warten, wenn sie nichts zu tun haben. Dies verhindert, dass Züge die Gleise blockieren. Züge können darüber nicht navigieren, also stellen Sie sicher, dass es sich nicht auf wichtigen Wegen befindet."
plPL = "Pociągi mogą czekać tutaj, gdy nie mają nic do zrobienia. Zapobiega to zajmowaniu torów przez pociągi. Pociągi nie mogą przechodzić przez to, więc upewnij się, że nie znajduje się to na żadnych kluczowych trasach."
ptBR = "Os trens podem esperar aqui quando não têm nada a fazer. Isso evita que os trens ocupem os trilhos. Os trens não conseguem encontrar caminho por cima disso, então certifique-se de que não esteja em nenhum caminho crucial."
koKR = "기차는 할 일이 없을 때 여기에서 대기할 수 있습니다. 이는 기차가 트랙을 점유하지 않도록 방지합니다. 기차는 이 위를 경로 탐색할 수 없으므로, 중요한 경로에 위치하지 않도록 하세요."
trTR = "Trenler burada bekleyebilirler, eğer yapacak bir işleri yoksa. Bu, trenlerin rayları kaplamasını engeller. Trenler buradan yol almaz, bu yüzden bunun kritik yolların üzerinde olmadığından emin olun."
esES = "Los trenes pueden esperar aquí cuando no tienen nada que hacer. Esto evita que los trenes ocupen las vías. Los trenes no pueden calcular rutas sobre esto, así que asegúrate de que no esté en ningún camino crucial."
itIT = "I treni possono attendere qui quando non hanno nulla da fare. Questo impedisce ai treni di occupare i binari. I treni non possono calcolare un percorso attraverso questo punto, quindi assicurati che non si trovi su percorsi cruciali."
ukUA = "Потяги можуть чекати тут, коли їм нічого робити. Це запобігає тому, щоб потяги займали колії. Потяги не можуть прокладати маршрут через це місце, тож переконайтеся, що воно не знаходиться на жодному важливому шляху."
thTH = "รถไฟสามารถจอดรอที่นี่เมื่อไม่มีงานต้องทำ ซึ่งช่วยไม่ให้รถไฟไปกีดขวางรางอื่น รถไฟไม่สามารถหาเส้นทางผ่านจุดนี้ได้ ดังนั้นโปรดตรวจสอบให้แน่ใจว่าไม่ได้วางอยู่บนเส้นทางสำคัญใด ๆ"
csCZ = "Vlakům se zde umožňuje čekat, když nemají co dělat. To zabraňuje vlakům obsazovat koleje. Vlakům se přes to nedá projít, takže se ujistěte, že to není v žádných důležitých cestách."
viVN = "Tàu hỏa có thể đợi ở đây khi chúng không có việc gì để làm. Điều này ngăn tàu hỏa chiếm dụng đường ray. Tàu hỏa không thể tìm đường đi qua khu vực này, vì vậy hãy đảm bảo khu vực này không nằm trên bất kỳ tuyến đường quan trọng nào."
caES = "Els trens poden esperar aquí quan no tenen res a fer. Això evita que els trens ocupin les vies. Els trens no poden trobar camí a través d'això, així que assegura't que no estigui en cap camí crucial."
beBY = "Цягнікі могуць чакаць тут, калі ім няма чаго рабіць. Гэта не дазваляе цягнікам займаць каляіны. Цягнікі не могуць пракладаць маршрут праз гэта, таму пераканайцеся, што гэта не знаходзіцца ні на адным ключавым шляху."
roRO = "Trenurile pot aștepta aici atunci când nu au nimic de făcut. Acest lucru împiedică trenurile să ocupe șinele. Trenurile nu pot traversa prin pathfinding peste acest obiect, așa că asigură-te că nu se află pe niciun traseu esențial."
huHU = "A vonatok ide várakozhatnak, ha nincs dolguk. Ez megakadályozza, hogy a vonatok elfoglalják a sínpályát. A vonatok nem tudnak útvonalat keresni ezen keresztül, ezért ügyeljen rá, hogy ne essen bele egyetlen fontos útvonalba sem."
arSA = "يمكن للقطارات الانتظار هنا عندما لا يكون لديها ما تفعله. يمنع هذا القطارات من شغل السكك. لا يمكن للقطارات إيجاد مسار عبر هذا المكان، لذا تأكد من أنه ليس على أي مسار حيوي."

