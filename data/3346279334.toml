["Tobbert.PassengerStation.DistrictObject"]
raw = "When enabled will ONLY allow beavers to go passenger stations that also have this setting enabled and are in other districts."
status = "normal"
enUS = "When enabled, it will ONLY allow beavers to go to passenger stations that also have this setting enabled and are in other districts."
zhCN = "启用后，只允许海狸前往同样启用此设置且属于其他地区中心的乘客站。"
zhTW = "啟用時，只會允許海狸進入具備此設定並且位於其他區域的乘客站。"
ruRU = "Когда включено, это будет позволять бобрам заходить только на пассажирские станции, где также включена эта настройка, и которые находятся в других районах."
