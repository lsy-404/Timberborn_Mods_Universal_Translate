["Tobbert.TrackStraight.Description"]
raw = "A Track Piece that goes straight. Can be changed to be a one way signal using the toggle when clicking on it. Creates a track section between one ways that allow a single train to be on it (indicated by the colors)."
status = "normal"
enUS = "A track piece that goes straight. It can be changed to a one-way signal using the toggle when clicked on. It creates a track section between one-ways that allows a single train to be on it (indicated by the colors)."
zhCN = "火车直线前进的轨道，可以切换为单向轨道。<br><color=#FFFF1A>互相连接的轨道组成轨道段，有相同颜色。</color><br><color=#FFA500>每个轨道段上只能有一辆火车通行，其他火车会在轨道段前依次等待。</color>"
zhTW = "一段直行的軌道片。點擊時可以通過開關變更為單行信號。創建一個單行之間的軌道區段，允許一列列車在上面行駛（以顏色表示）。"
ruRU = "Прямой элемент рельса. Может быть изменен на односторонний сигнал с помощью переключателя при клике на него. Создает участок рельсов между односторонними направлениями, позволяя одному поезду находиться на нем (что указывается цветами)."
jaJP = "まっすぐなトラックパーツです。クリックしてトグルを使用することで、一方通行の信号に変更できます。一方通行の間にトラックセクションを作成し、単一の列車がその上に存在できるようにします（色で示されています）。"
frFR = "Un morceau de rail qui va tout droit. Peut être changé en un signal unidirectionnel en utilisant le bouton bascule en cliquant dessus. Crée une section de rail entre des voies unidirectionnelles qui permet à un seul train d'y être (indiqué par les couleurs)."
deDE = "Ein Gleisstück, das gerade verläuft. Kann durch Klicken darauf in ein Einrichtungsignal umgeschaltet werden. Erstellt einen Gleisabschnitt zwischen Einbahnstrecken, der es einem einzelnen Zug ermöglicht, darauf zu fahren (angezeigt durch die Farben)."
plPL = "Prosta część toru. Może zostać zmieniona na sygnał jednokierunkowy za pomocą przełącznika po kliknięciu na nią. Tworzy odcinek toru pomiędzy torami jednokierunkowymi, na którym może znajdować się tylko jeden pociąg (wskazane kolorem)."
ptBR = "Um trecho de trilho que vai em linha reta. Pode ser alterado para um sinal de mão única usando o botão alternar ao clicar nele. Cria uma seção de trilho entre vias de mão única que permite que apenas um trem esteja nela (indicado pelas cores)."
koKR = "직선으로 되어 있는 트랙 조각입니다. 클릭 시 전환을 통해 일방 통행 신호로 변경할 수 있습니다. 색상으로 표시되는 단일 기차가 있을 수 있는 일방 통행 구간을 생성합니다."
trTR = "Doğru giden bir ray parçası. Üzerine tıklanarak açma kapama düğmesi kullanılarak tek yönlü sinyale dönüştürülebilir. Renklerle gösterilen tek bir trenin üzerinde olmasına izin veren tek yönler arasında bir ray bölümü oluşturur."
esES = "Una pieza de vía que va recta. Puede cambiarse para convertirla en una señal de sentido único usando el interruptor al hacer clic sobre ella. Crea una sección de vía entre señales de sentido único que permite que un solo tren ocupe el tramo a la vez (indicado por los colores)."
itIT = "Un pezzo di binario rettilineo. Può essere trasformato in un segnale a senso unico usando l'interruttore al clic su di esso. Crea un tratto di binario tra segnali a senso unico che consente a un solo treno di trovarsi al suo interno (indicato dai colori)."
ukUA = "Пряма секція колії. Можна перемкнути на односторонній сигнал, натиснувши на неї і використавши перемикач. Утворює ділянку колії між односторонніми сигналами, на якій може перебувати лише один потяг (позначається кольорами)."
thTH = "ชิ้นส่วนรางตรง สามารถเปลี่ยนเป็นสัญญาณทางเดียวได้โดยใช้สวิตช์เมื่อคลิกที่ชิ้นส่วนนี้ สร้างช่วงรางระหว่างสัญญาณทางเดียวที่อนุญาตให้รถไฟเพียงขบวนเดียวอยู่บนช่วงนั้นได้ (ระบุด้วยสี)"
csCZ = "Úsek koleje, který je rovný. Může být změněn na jednosměrný signál pomocí přepínače při kliknutí na něj. Vytváří úsek koleje mezi jednosměrnými, který umožňuje, aby na něm byl pouze jeden vlak (označeno barvami)."
viVN = "Một đoạn đường ray đi thẳng. Có thể đổi thành tín hiệu một chiều bằng công tắc khi nhấp vào nó. Tạo một đoạn đường ray giữa hai hướng một chiều, cho phép một đoàn tàu duy nhất đi trên nó (được đánh dấu bằng màu sắc)."
caES = "Una peça de via recta. Es pot canviar per convertir-la en un senyal d'una sola direcció fent clic a sobre amb el botó d'alternança. Crea una secció de via entre senyals d'una sola direcció que permet que només un tren hi sigui alhora (indicat pels colors)."
beBY = "Прамы рэйкавы элемент, які iдзе прама. Можа быць зменены на аднабаковы сігнал з дапамогай пераключальніка пры націсканні на яго. Стварае секцыю рэйкавай лініі паміж аднабаковымі сігналамі, на якой may быць толькі адзін цягнік адначасова (паказваецца колерам)."
roRO = "O piesă de cale dreaptă. Poate fi schimbată într-un semnal unidirecțional folosind comutatorul la clic pe ea. Creează o secțiune de cale între semnalele unidirecționale care permite ca un singur tren să se afle pe ea (indicat de culori)."
huHU = "Egyenesen haladó sínelem. Kattintással átállítható egyirányú jelzőre a gombbal. Egyirányú jelzők között sínszakaszt hoz létre, amelyre egyszerre csak egy vonat léphet (ezt a színek jelzik)."
arSA = "قطعة مسار مستقيمة. يمكن تغييرها إلى إشارة اتجاه واحد باستخدام المفتاح عند النقر عليها. تُنشئ قسمًا من المسار بين إشارات الاتجاه الواحد يسمح بوجود قطار واحد فقط عليه (يُشار إلى ذلك بالألوان)."

