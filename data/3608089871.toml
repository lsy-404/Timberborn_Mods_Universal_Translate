["oo.DoubleHard.DoubleHardDescription"]
raw = "Everything is the same as Hard, except Droughs and Badtides will eventually last 60 days instead of being capped at 30 days."
status = "normal"
enUS = "Everything is the same as Hard, except Droughs and Badtides will eventually last 60 days instead of being capped at 30 days."
zhCN = "更加困难的困难模式。<br><br>干旱与恶水潮的持续时间最终将翻倍。<br><br>其余设定与困难模式相同。"
zhTW = "一切與困難模式相同，不過乾旱和壞潮將最終持續60天，而不是限制在30天。"
ruRU = "Все так же, как в режиме Hard, за исключением того, что засухи и плохие приливы в конечном итоге будут длиться 60 дней вместо ограничения в 30 дней."
jaJP = "「すべてはハードと同じですが、干ばつと悪潮は最終的に30日間で制限されるのではなく、60日間続くことになります。」"
frFR = "Tout est pareil qu'en mode Difficile, sauf que les sécheresses et les marées basses dureront finalement 60 jours au lieu d'être limitées à 30 jours."
deDE = "Alles ist wie bei Hard, außer dass Dürreperioden und schlechte Gezeiten schließlich 60 Tage dauern werden, anstatt auf 30 Tage begrenzt zu sein."
plPL = "Wszystko jest takie samo jak w trybie Trudnym, z wyjątkiem tego, że susze i złe przypływy będą trwały ostatecznie 60 dni, zamiast być ograniczone do 30 dni."
ptBR = "Tudo é igual ao Duro, exceto que as Secas e as Marés Ruins vão durar eventualmente 60 dias em vez de serem limitadas a 30 dias."
koKR = "모든 것은 하드와 같지만, 가뭄과 나쁜 조수는 30일로 제한되는 대신 결국 60일 동안 지속됩니다."
trTR = "Her şey zorlu ile aynı, tek farkı kuraklıklar ve kötü gelgitlerin 30 günle sınırlı olmasının aksine sonunda 60 gün sürecek olmasıdır."
esES = "Todo es igual que en Difícil, excepto que las sequías y las mareas de mal agua acabarán durando 60 días en lugar de limitarse a 30 días."
itIT = "Tutto è uguale alla difficoltà Difficile, tranne che siccità e maree nere alla fine dureranno 60 giorni invece di essere limitate a 30 giorni."
ukUA = "Все так само, як на складному рівні, за винятком того, що посухи та погані припливи з часом тривають 60 днів замість обмеження в 30 днів."
thTH = "ทุกอย่างเหมือนกับโหมดยาก ยกเว้นว่าภัยแล้งและคลื่นน้ำเสียจะคงอยู่ได้ถึง 60 วันในที่สุด จากเดิมที่จำกัดไว้ไม่เกิน 30 วัน"
csCZ = "Všechno je stejné jako v režimu Těžko, kromě toho, že sucha a špatné přílivy nakonec potrvají 60 dní místo omezených 30 dní."
viVN = "Mọi thứ vẫn giống như ở chế độ Hard, ngoại trừ Droughs và Badtides sẽ kéo dài 60 ngày thay vì bị giới hạn ở 30 ngày."
caES = "Tot és igual que en Difícil, excepte que les sequeres i les marees negres duraran finalment 60 dies en lloc de limitar-se a 30 dies."
beBY = "Усё тое ж самае, што і на складаным узроўні, за выключэннем таго, што засухі і брудная вада ў выніку будуць доўжыцца 60 дзён замест абмежавання ў 30 дзён."
roRO = "Totul este identic cu modul Greu, cu excepția faptului că secetele și apele otrăvite vor dura în cele din urmă 60 de zile, în loc să fie limitate la 30 de zile."
huHU = "Minden megegyezik a Nehéz beállítással, kivéve, hogy az aszályok és a mérgezett víz (badwater) idővel 60 napig tartanak, nem pedig 30 napra korlátozva."
arSA = "كل شيء مطابق لمستوى \"صعب\"، باستثناء أن الجفاف وفيضان المياه السامة سيستمران في النهاية 60 يومًا بدلًا من أن يُحدّا بـ30 يومًا."
