["CAT.EnabledDesc"]
raw = "Mark all the map as 'cuttable' area when loading a save with this mod for the first time (including a new game)"
status = "normal"
enUS = "Mark all the map as 'cuttable' area when loading a save with this mod for the first time (including a new game)."
zhCN = "勾选后，首次加载带有此模组的存档或新游戏时，将对整个地图标记树木砍伐区域。"
zhTW = "在第一次加載此模組的存檔時（包括新遊戲），將所有地圖標記為「可切割」區域。"
ruRU = "Отметьте всю карту как 'разрезаемая' область при загрузке сохранения с этим модом в первый раз (включая новую игру)"
jaJP = "このMODを使用して初めてセーブを読み込む際、すべてのマップを「切断可能」エリアとしてマークします（新しいゲームも含む）。"
frFR = "Marquez toute la carte comme étant une zone 'coupable' lors du chargement d'une sauvegarde avec ce mod pour la première fois (y compris un nouveau jeu)."
deDE = "Markiere die gesamte Karte als 'schnittbare' Fläche, wenn beim ersten Laden eines Speichers mit diesem Mod (einschließlich eines neuen Spiels)"
plPL = "Oznacz wszystkie obszary na mapie jako 'możliwe do wycięcia' podczas ładowania zapisu z tym modem po raz pierwszy (włącznie z nową grą)"
ptBR = "Marque toda a área do mapa como 'cortável' ao carregar um salvamento com este mod pela primeira vez (incluindo um novo jogo)."
koKR = "이 모드를 처음 사용하여 저장을 로드할 때 모든 맵을 '벌목 가능' 지역으로 표시합니다 (새 게임 포함)"
trTR = "Bu mod ile ilk kez bir kaydı yüklediğinizde haritadaki tüm alanı 'kesilebilir' alan olarak işaretleyin (yeni bir oyun dahil)."
esES = "Marcar todo el mapa como área \"talable\" al cargar una partida guardada con este mod por primera vez (incluida una nueva partida)"
itIT = "Contrassegna come area \"tagliabile\" tutta la mappa quando si carica per la prima volta un salvataggio con questa mod (inclusa una nuova partita)"
ukUA = "Позначити всю карту як зону «можна рубати» під час першого завантаження збереження з цим модом (включно з новою грою)"
thTH = "ทำเครื่องหมายพื้นที่ทั้งหมดของแผนที่ว่า \"สามารถตัดได้\" เมื่อโหลดเซฟที่ใช้มอดนี้เป็นครั้งแรก (รวมถึงเกมใหม่)"
csCZ = "Označit celou mapu jako 'řezatelnou' oblast při načítání uložené hry poprvé s tímto módem (včetně nové hry)"
viVN = "Đánh dấu toàn bộ bản đồ thành khu vực có thể đốn được khi tải bản lưu có mod này lần đầu tiên (kể cả khi bắt đầu trò chơi mới)."
caES = "Marca tota el mapa com a zona \"talable\" en carregar una partida desada amb aquest mod per primera vegada (inclosa una partida nova)."
beBY = "Пазначаць усю мапу як зону «можна рубаць» пры першай загрузцы захаванай гульні з гэтым модам (уключаючы новую гульню)."
roRO = "Marchează întreaga hartă ca zonă \"tăiabilă\" la încărcarea unui salvat cu acest mod pentru prima dată (inclusiv la un joc nou)"
huHU = "Jelölje meg az egész térképet „kivágható” területként, amikor először tölt be ezzel a modullal készült mentést (az új játékot is beleértve)."
arSA = "تحديد كامل الخريطة كمنطقة \"قابلة للقطع\" عند تحميل حفظ باستخدام هذا المود لأول مرة (بما في ذلك لعبة جديدة)"

