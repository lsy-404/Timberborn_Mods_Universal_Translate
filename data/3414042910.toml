["CAT.AlwaysEnabledDesc"]
raw = "Mark all the map as 'cuttable' area when loading a save with this mod even if it was already activated before. Automatically uncheck once you load a save."
status = "normal"
enUS = "Mark all the map as a 'cuttable' area when loading a save with this mod, even if it was already activated before. It will automatically uncheck once you load a save."
zhCN = "勾选后，加载带有此模组的存档时，即使之前已激活过，也会对整个地图标记树木砍伐区域。加载存档后将自动取消勾选。"
zhTW = "在載入此模組的存檔時，將所有地圖標記為「可切割」區域，即使它之前已經啟用。載入存檔後自動取消選中。"
ruRU = "Пометьте всю карту как 'разрезаемую' область при загрузке сохранения с этим модом, даже если она уже была активирована ранее. Автоматически снимите отметку после загрузки сохранения."
jaJP = "このモッドでセーブをロードする際に、既にアクティブになっていてもマップのすべてを「切断可能」エリアとしてマークします。セーブをロードすると自動的にチェックが外れます。"
frFR = "Marquez toute la carte comme une zone « coupable » lors du chargement d'une sauvegarde avec ce mod, même si elle avait déjà été activée auparavant. Se désélectionne automatiquement une fois que vous chargez une sauvegarde."
deDE = "Markiere alle Karten als 'durchtrennbare' Bereiche, wenn du ein Save mit diesem Mod lädst, auch wenn sie zuvor bereits aktiviert waren. Deaktiviere sie automatisch, sobald du ein Save lädst."
plPL = "Oznacz cały mapę jako obszar 'możliwy do cięcia' podczas ładowania zapisu z tym modem, nawet jeśli był już wcześniej aktywowany. Automatycznie odznacz po załadowaniu zapisu."
ptBR = "Marque toda a área do mapa como 'cortável' ao carregar um salvamento com este mod, mesmo que já tenha sido ativado antes. Desmarque automaticamente assim que você carregar um salvamento."
koKR = "이 모드를 사용하여 세이브를 로드할 때 이전에 활성화되어 있었더라도 모든 맵을 '벌목 가능' 지역으로 표시합니다. 세이브를 로드하면 자동으로 체크 해제됩니다."
trTR = "Bu mod ile bir kaydı yüklerken haritanın tümünü 'kesilebilir' alan olarak işaretleyin, daha önce etkinleştirilmiş olsa bile. Bir kayıt yüklediğinizde otomatik olarak işareti kaldırır."
esES = "Marca todo el mapa como área \"talable\" al cargar una partida con este mod, incluso si ya estaba activado antes. Se desmarca automáticamente una vez que cargues una partida."
itIT = "Contrassegna tutta la mappa come area \"abbattibile\" quando carichi un salvataggio con questa mod, anche se era già stata attivata in precedenza. Deseleziona automaticamente l'opzione una volta caricato un salvataggio."
ukUA = "Позначати всю карту як зону «можна рубати» під час завантаження збереження з цим модом, навіть якщо її було активовано раніше. Автоматично знімати позначку після завантаження збереження."
thTH = "ทำเครื่องหมายพื้นที่ทั้งหมดของแผนที่ว่า \"ตัดได้\" เมื่อโหลดเซฟที่มีม็อดนี้ แม้ว่าจะเปิดใช้งานไว้ก่อนแล้วก็ตาม และยกเลิกการเลือกโดยอัตโนมัติเมื่อคุณโหลดเซฟ"
csCZ = "Vyberte celou mapu jako 'řezatelnou' oblast při načítání uložené hry s tímto módem, i když byla předtím již aktivována. Automaticky se odškrtněte poté, co načtete uloženou hru."
viVN = "Đánh dấu toàn bộ bản đồ thành khu vực 'có thể chặt' khi tải một bản lưu có mod này, ngay cả khi nó đã được kích hoạt trước đó. Tự động bỏ chọn khi bạn tải một bản lưu."
caES = "Marca tota l'àrea del mapa com a «talable» en carregar una partida amb aquest mod, fins i tot si ja s'havia activat abans. Es desmarca automàticament en carregar una partida."
beBY = "Пазначаць усю карту як зону «можна сячы» пры загрузцы захавання з гэтым модам, нават калі яна была ўключана раней. Пасля загрузкі захавання галачка аўтаматычна знімаецца."
roRO = "Marchează toată harta ca zonă „tăiabilă” la încărcarea unui salvat cu acest mod, chiar dacă a fost deja activată înainte. Debifează automat această opțiune după ce încarci un salvat."
huHU = "Jelölje meg az egész térképet „vágható” területként, amikor ezzel a modullal tölt be mentést, még akkor is, ha korábban már aktiválta. A mentés betöltése után a jelölés automatikusan törlődik."
arSA = "عند تحميل حفظ باستخدام هذا المود، يتم تحديد كل المنطقة على الخريطة كمنطقة \"قابلة للقطع\"، حتى لو كان ذلك مفعّلاً من قبل. ويتم إلغاء التحديد تلقائياً بعد تحميل الحفظ."
