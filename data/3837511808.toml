raw = "Vanilla platform support and pass-through rules. Supports paths and buildings above; open below. Matching Works finish."
enUS = "Vanilla platform support and pass-through rules. Supports paths and buildings above; open below. Matching Works finish."
zhCN = "遵循原版平台的支撑和通行规则。可支撑上方的道路和建筑；下方畅通。与 Works 饰面相配。"
zhTW = "遵循原版平台的支撐與通行規則。可支撐上方的道路和建築；下方保持暢通。採用相配的 Works 飾面。"
ruRU = "Стандартные правила опоры и проходимости платформ. Поддерживает дорожки и здания сверху; снизу проход открыт. Отделка соответствует «Мастерским»."
jaJP = "標準プラットフォームの支持・通過ルール。上部の道や建物を支え、下部は開放されています。Worksに合った仕上げ。"
frFR = "Règles de soutien et de passage de la plateforme du jeu de base. Elle supporte les chemins et les bâtiments au-dessus ; le dessous reste ouvert. Finition assortie à Works."
deDE = "Vanilla-Regeln für Plattformstützen und Durchgänge. Stützt Wege und Gebäude darüber; darunter bleibt es offen. Passende Works-Oberfläche."
plPL = "Podstawowe zasady podpierania i przepuszczania platform. Podpiera ścieżki i budynki powyżej; poniżej pozostaje otwarte. Wykończenie pasujące do Works."
ptBR = "Regras padrão de suporte e passagem da plataforma. Dá suporte a caminhos e construções acima; deixa a parte de baixo livre. Acabamento que combina com Works."
koKR = "바닐라 플랫폼의 지지 및 통과 규칙을 따릅니다. 위쪽의 길과 건물을 지지하고, 아래쪽은 개방되어 있습니다. Works와 어울리는 마감입니다."
trTR = "Temel oyundaki platform destek ve geçiş kuralları. Üstündeki yolları ve binaları destekler; altı açıktır. Works ile eşleşen kaplama."
esES = "Reglas de soporte y paso de las plataformas del juego base. Soporta caminos y edificios encima; queda abierto por debajo. Acabado a juego con Works."
itIT = "Regole del gioco base per il supporto e il passaggio delle piattaforme. Supporta sentieri ed edifici sopra; lascia libero lo spazio sottostante. Finitura abbinata a Works."
ukUA = "Стандартні правила опори платформ і прохідності. Підтримує доріжки й будівлі зверху; знизу залишається відкритим. Оздоблення в стилі Works."
thTH = "กฎการรองรับและการลอดผ่านของแท่นแบบเกมหลัก รองรับทางเดินและอาคารด้านบน; ด้านล่างเปิดโล่ง พื้นผิวเข้าชุดกับ Works"
csCZ = "Pravidla podpory a průchodnosti platformy v základní hře. Podporuje cesty a budovy nad sebou; prostor pod ní zůstává volný. Ladí s povrchovou úpravou Works."
viVN = "Quy tắc hỗ trợ và thông hành của nền tảng trong game gốc. Hỗ trợ đường đi và công trình bên trên; để trống bên dưới. Lớp hoàn thiện đồng bộ với Works."
caES = "Regles de suport i pas de les plataformes del joc base. Dona suport a camins i edificis a sobre; deixa lliure la part inferior. Acabat a joc amb Works."
beBY = "Правілы падтрымкі і праходжання для платформ з базавай гульні. Падтрымлівае дарожкі і будынкі зверху; знізу адкрытая. Аздабленне ў адпаведным стылі Works."
roRO = "Regulile standard de susținere și de trecere ale platformelor. Susține poteci și clădiri deasupra; lasă liber dedesubt. Finisaj asortat cu cel al Works."
huHU = "Az alapjáték platformjainak megtámasztási és átjárhatósági szabályait követi. Megtámasztja a fölötte lévő utakat és épületeket; alatta szabad az átjárás. A Works stílusához illő kivitel."
arSA = "قواعد دعم المنصات والمرور من خلالها في اللعبة الأساسية. تدعم المسارات والمباني فوقها؛ وتبقى مفتوحة من الأسفل. بتشطيب متناسق مع Works."

