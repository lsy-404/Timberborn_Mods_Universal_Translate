["LV.WSP.DecreaseStrBuffDesc"]
raw = "A marvel of beaver engineering, this gate tames the wildest rivers, calming their flow to protect our lands."
status = "normal"
enUS = "A marvel of beaver engineering, this gate tames the wildest rivers, calming their flow to protect our lands."
zhCN = "土木工程的奇迹，这道闸门驯服了狂野的河流，平息水流以保护我们的土地。"
zhTW = "一個海狸工程的奇蹟，這扇大門馴服了最狂野的河流，平息它們的流動以保護我們的土地。"
ruRU = "Чудо бобрового инженерного искусства, эта плотина укрощает самые дикие реки, успокаивая их течение, чтобы защитить наши земли."
jaJP = "ビーバーの工学の驚異であるこのゲートは、最も荒々しい川を制御し、その流れを穏やかにして私たちの土地を守ります。"
frFR = "Une merveille de l'ingénierie des castors, cette porte apprivoise les rivières les plus sauvages, apaisant leur cours pour protéger nos terres."
deDE = "Ein Wunder der Bibertechnik zähmt dieses Tor die wildesten Flüsse und beruhigt ihren Fluss, um unser Land zu schützen."
plPL = "Cud inżynierii bobrów, ta brama oswaja najdziksze rzeki, uspokajając ich bieg, aby chronić nasze ziemie."
ptBR = "Uma maravilha da engenharia dos castores, este portão doma os rios mais selvagens, acalmando seu fluxo para proteger nossas terras."
koKR = "비버 공학의 경이로움, 이 게이트는 가장 거친 강을 길들이고, 우리의 땅을 보호하기 위해 흐름을 진정시킵니다."
trTR = "Vahşi nehirleri evcilleştiren, akışını sakinleştirerek topraklarımızı koruyan bir kunduz mühendisliği harikası, bu kapı."
esES = "Una maravilla de la ingeniería castora, esta compuerta doma los ríos más salvajes, calmando su caudal para proteger nuestras tierras."
itIT = "Una meraviglia dell'ingegneria dei castori, questa chiusa doma i fiumi più impetuosi, placando la loro corrente per proteggere le nostre terre."
ukUA = "Диво бобрової інженерії, ця шлюза приборкує найдикіші річки, заспокоюючи їхню течію, щоб захистити наші землі."
thTH = "ประตูชิ้นนี้เป็นผลงานอันน่าทึ่งของวิศวกรรมบีเวอร์ ช่วยควบคุมแม่น้ำที่ดุร้ายที่สุดให้ไหลอย่างสงบ เพื่อปกป้องดินแดนของเรา"
csCZ = "Poklad beaverského inženýrství, tato brána zkrocuje nejsyčivější řeky, uklidňuje jejich tok, aby chránila naše území."
viVN = "Một kỳ công của kỹ thuật hải ly, cánh cổng này khuất phục những con sông dữ nhất, làm dịu dòng chảy của chúng để bảo vệ đất đai của chúng ta."
caES = "Una meravella de l'enginyeria castora, aquesta comporta domina els rius més salvatges, calmant-ne el flux per protegir les nostres terres."
beBY = "Цуд бабровай інжынерыі, гэтая засаўка ўкрощвае самыя дзікія рэкі, супакойваючы іх плынь, каб абараніць нашы землі."
roRO = "O minune a ingineriei castorilor, această stăvilă domolește cele mai sălbatice râuri, calmându-le cursul pentru a ne proteja terenurile."
huHU = "A bobr-mérnöki csoda ez a zsilip, amely megszelídíti a legvadabb folyókat, lecsendesítve áramlásukat, hogy védje földjeinket."
arSA = "تحفة من هندسة القنادس، تُروِّض هذه البوابة أعتى الأنهار، فتُهدِّئ تدفقها لحماية أراضينا."

["LV.WSP.IncreaseStrBuffDesc"]
raw = "Channeling nature's might, this conduit unleashes a surge of water, bending rivers to our will."
status = "normal"
enUS = "Channeling nature's might, this conduit unleashes a surge of water, bending rivers to our will."
zhCN = "征服自然的力量，这条导管释放出汹涌的水流，征服河流以顺从我们的意志。"
zhTW = "通過自然的力量，這個通道釋放出水流的沖擊，將河流彎曲到我們的意志之下。"
ruRU = "Канализируя силу природы, этот проводник высвобождает поток воды, подчиняя реки нашей воле."
jaJP = "自然の力を引き出すこの導管は、水の奔流を解き放ち、川を我々の意志に曲げる。"
