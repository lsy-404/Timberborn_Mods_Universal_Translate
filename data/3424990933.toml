["LV.QS.AutoContinueShiftDesc"]
raw = "Automatically load the last saved game (like clicking the Continue button) when holding Shift during the game start."
status = "normal"
enUS = "Automatically load the last saved game (like clicking the Continue button) when holding Shift during game startup."
zhCN = "勾选后，在游戏启动时按住Shift键，会自动加载最后一次保存的游戏（类似于“继续游戏”）。"
zhTW = "在遊戲開始時按住 Shift 鍵，自動加載最後保存的遊戲（就像點擊繼續按鈕一樣）。"
ruRU = "Автоматически загружать последнее сохранённое состояние игры (как при нажатии кнопки Продолжить), удерживая Shift во время начала игры."
jaJP = "ゲーム開始時にShiftキーを押しっぱなしにすると、最後に保存したゲームが自動的にロードされます（Continueボタンをクリックした場合のように）。"
frFR = "Charger automatiquement la dernière partie sauvegardée (comme en cliquant sur le bouton Continuer) en maintenant Shift pendant le démarrage du jeu."
deDE = "Lade automatisch das zuletzt gespeicherte Spiel (wie beim Klicken auf die Fortsetzen-Schaltfläche), wenn die Umschalttaste während des Spielstarts gedrückt gehalten wird."
plPL = "Automatycznie załaduj ostatnio zapisaną grę (jak klikając przycisk Kontynuuj) podczas przytrzymywania klawisza Shift na początku gry."
ptBR = "Carregar automaticamente o último jogo salvo (como clicar no botão Continuar) ao segurar Shift durante o início do jogo."
koKR = "게임 시작 시 Shift 키를 누르고 있을 때 마지막 저장된 게임을 자동으로 로드합니다 (계속 버튼 클릭과 유사)."
trTR = "Shift tuşuna basılıyken oyun başlangıcında Son Kaydedilen oyunu otomatik olarak yükleyin (Devam et butonuna tıklamak gibi)."
esES = "Cargar automáticamente la última partida guardada (como hacer clic en el botón Continuar) al mantener presionada la tecla Mayús durante el inicio del juego."
itIT = "Carica automaticamente l'ultimo salvataggio (come cliccando il pulsante Continua) tenendo premuto Maiusc all'avvio del gioco."
ukUA = "Автоматично завантажувати останню збережену гру (так само, як натискання кнопки «Продовжити»), якщо утримувати Shift під час запуску гри."
thTH = "เมื่อกด Shift ค้างไว้ระหว่างเริ่มเกม ระบบจะโหลดเกมที่บันทึกไว้ล่าสุดโดยอัตโนมัติ (เหมือนการคลิกปุ่มทำต่อ)"
csCZ = "Automaticky načíst poslední uloženou hru (jako když kliknete na tlačítko Pokračovat) při držení klávesy Shift během spuštění hry."
viVN = "Tự động tải trò chơi đã lưu gần đây nhất (giống như nhấn nút Tiếp tục) khi giữ phím Shift trong lúc khởi động trò chơi."
caES = "Carrega automàticament l'última partida desada (igual que fer clic al botó Continua) quan es manté premuda la tecla Majús durant l'inici del joc."
beBY = "Аўтаматычна загружае апошняе захаванне гульні (як націсканне кнопкі «Працягнуць») пры ўтрыманні Shift падчас запуску гульні."
roRO = "Încarcă automat ultimul joc salvat (similar cu apăsarea butonului Continuă) atunci când ții apăsat Shift la pornirea jocului."
huHU = "Automatikusan betölti az utoljára mentett játékot (mint a Folytatás gomb megnyomása), ha a játék indításakor Shift billentyűt tart lenyomva."
arSA = "تحميل آخر لعبة محفوظة تلقائياً (مثل النقر على زر \"متابعة\") عند الضغط مع الاستمرار على مفتاح Shift أثناء بدء اللعبة."

