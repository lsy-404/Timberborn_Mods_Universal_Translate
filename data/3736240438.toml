zhTW = "在遊戲開始時，需等待多少個完整的日子，才可以觸發任何降雨事件。\n\n0 讓第一次降雨在第1天發生（預設）。"
ruRU = "Сколько полных дней нужно ждать в начале игры, прежде чем может начаться любое дождевое событие.\n\n0 позволяет первому дождю произойти в первый день (по умолчанию)."
jaJP = "ゲーム開始時に雨のイベントが発生するまで待つフルデーの数。\n\n0に設定すると、1日目に最初の雨が発生します（デフォルト）。"
frFR = "Combien de jours complets attendre au début du jeu avant qu'un événement de pluie puisse se produire.\n\n0 permet au premier événement de pluie d'avoir lieu le jour 1 (par défaut)."
deDE = "Wie viele volle Tage zu Beginn des Spiels gewartet werden soll, bevor ein Regenereignis eintreten kann.\n\n0 erlaubt den ersten Regen am Tag 1 (Standard)."
plPL = "Ile pełnych dni należy czekać na początku gry, zanim jakiekolwiek zdarzenie deszczu może się wydarzyć.\n\n0 pozwala na pierwszy deszcz w dniu 1 (domyślnie)."
ptBR = "Quantos dias completos esperar no início do jogo antes que qualquer evento de chuva possa ocorrer.\n\n0 permite que a primeira chuva aconteça no dia 1 (padrão)."
koKR = "게임 시작 시 비가 내리는 이벤트가 발생하기 전에 대기해야 하는 전체 일수입니다.\n\n0은 첫 번째 비가 1일째에 발생하도록 합니다."
trTR = "Oyun başlangıcında herhangi bir yağmur olayı gerçekleşmeden önce kaç tam gün bekleyeceğinizi belirtin.\n\n0, ilk yağmurun 1. günde gerçekleşmesine izin verir (varsayılan)."
esES = "Cuántos días completos esperar al inicio de la partida antes de que pueda producirse cualquier evento de lluvia.\n\n0 permite que la primera lluvia ocurra el día 1 (valor predeterminado)."
itIT = "Quanti giorni interi attendere all'inizio della partita prima che possa verificarsi un evento di pioggia.\n\n0 permette che la prima pioggia cada il giorno 1 (predefinito)."
ukUA = "Скільки повних днів чекати на початку гри, перш ніж може відбутися будь-яка подія дощу.\n\n0 означає, що перший дощ відбудеться у перший день (за замовчуванням)."
thTH = "จำนวนวันเต็มที่ต้องรอตั้งแต่เริ่มเกม ก่อนที่เหตุการณ์ฝนตกจะเกิดขึ้นได้\n\n0 หมายถึงให้ฝนตกครั้งแรกในวันที่ 1 (ค่าเริ่มต้น)"
csCZ = "Kolik plných dnů čekat na začátku hry, než může nastat jakákoliv dešťová událost.\n\n0 umožňuje, aby první déšť nastal v den 1 (výchozí)."
viVN = "Số ngày đầy đủ để chờ đợi khi bắt đầu trò chơi trước khi bất kỳ sự kiện mưa nào có thể xảy ra.\n\n0 cho phép trận mưa đầu tiên xảy ra vào ngày 1 (mặc định)."
caES = "Quants dies sencers complets cal esperar a l'inici de la partida abans que pugui produir-se cap esdeveniment de pluja.\n\n0 fa que la primera pluja caigui el dia 1 (per defecte)."
roRO = "Câte zile întregi să se aștepte la începutul jocului înainte ca vreun eveniment de ploaie să poată avea loc.\n\n0 permite ca prima ploaie să aibă loc în ziua 1 (implicit)."
huHU = "Hány teljes napot kell várni a játék kezdetén, mielőtt bármely esőesemény bekövetkezhet.\n\nA 0 azt jelenti, hogy az első eső az 1. napon esik (alapértelmezett)."
arSA = "كم عدد الأيام الكاملة التي يجب انتظارها عند بداية اللعبة قبل أن يمكن لأي حدث مطر أن يبدأ.\n\n0 يسمح بحدوث أول مطر في اليوم 1 (الافتراضي)."

