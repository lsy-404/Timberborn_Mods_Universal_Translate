["academicunwinds.Rainborn.Settings.RainHoursMin.Tooltip"]
raw = "Shortest possible rain event, in in-game hours.\n\nEach storm rolls a fresh duration somewhere between this and the max."
status = "normal"
enUS = "Shortest possible rain event, in in-game hours.\n\nEach storm rolls a fresh duration somewhere between this and the maximum."
zhCN = "游戏内小时中最短的降雨事件。\n\n每场风暴的持续时间在此时长和最长时长之间随机产生。"
zhTW = "遊戲內最短的降雨事件時間（小時）。\n\n每場暴風雨會在這個時間和最大時間之間隨機生成持續時間。"
ruRU = "Самая короткая возможная продолжительность дождя в игровых часах.\n\nКаждый шторм имеет новую продолжительность где-то между этим значением и максимальным."
jaJP = "ゲーム内時間での最短の雨イベント。\n\n各嵐はこの最小値と最大値の間で新しい継続時間を決定します。"
frFR = "Durée minimale possible de l'événement de pluie en heures de jeu.\n\nChaque tempête entraîne une nouvelle durée quelque part entre celle-ci et la durée maximale."
deDE = "Die kürzeste mögliche Regenperiode in Spielstunden.\n\nJeder Sturm hat eine frische Dauer irgendwo zwischen diesem und dem Maximum."
plPL = "Najkrótsza możliwa trwałość opadu w godzinach w grze.  \n\nKażda burza ma losowy czas trwania gdzieś pomiędzy tym a maksymalnym."
ptBR = "Duração mínima possível de chuva em horas de jogo.\n\nCada tempestade tem uma duração nova entre este valor e o máximo."
koKR = "게임 시간으로 측정된 가장 짧은 비 이벤트입니다.\n\n각 폭풍우는 이 최소값과 최대값 사이의 새로운 지속 시간을 생성합니다."
trTR = "Oyun içindeki saat cinsinden en kısa yağış olayı.\n\nHer fırtına, bunun ile maksimum arasında yeni bir süre belirler."
esES = "Duración mínima posible de una lluvia, en horas de juego.\n\nCada tormenta obtiene una duración aleatoria entre este valor y el máximo."
