status = "normal"
enUS = "This building has multiple decals. Only the first one was copied. To copy a specific decal, use the Copy button in that decal's panel."
zhCN = "此建筑有多个贴花，仅复制第一个贴花。要复制特定贴花，请使用该贴花面板中的复制按钮。"
zhTW = "這座建築有多個貼圖。只有第一個被複製。要複製特定的貼圖，請使用該貼圖面板中的複製按鈕。"
ruRU = "Это здание имеет несколько декалей. Скопирована только первая. Чтобы скопировать конкретную декаль, используйте кнопку «Копировать» в панели этой декали."
jaJP = "この建物には複数のデカールがあります。最初のデカールのみがコピーされました。特定のデカールをコピーするには、そのデカールのパネルにあるコピーボタンを使用してください。"
frFR = "Ce bâtiment a plusieurs décalcomanies. Seule la première a été copiée. Pour copier un décalcomanie spécifique, utilisez le bouton Copier dans le panneau de cette décalcomanie."
deDE = "Dieses Gebäude hat mehrere Dekorationen. Nur die erste wurde kopiert. Um eine bestimmte Dekoration zu kopieren, verwenden Sie die Kopier-Taste im Panel dieser Dekoration."
plPL = "Ten budynek ma wiele naklejek. Tylko pierwsza została skopiowana. Aby skopiować konkretną naklejkę, użyj przycisku Kopiuj w panelu tej naklejki."
ptBR = "Este edifício tem várias decalques. Apenas o primeiro foi copiado. Para copiar um decalque específico, use o botão Copiar no painel daquele decalque."
koKR = "이 건물에는 여러 개의 데칼이 있습니다. 첫 번째만 복사되었습니다. 특정 데칼을 복사하려면 해당 데칼 패널에서 복사 버튼을 사용하세요."
trTR = "Bu binanın birden fazla çıkartması var. Sadece ilki kopyalandı. Belirli bir çıkartmayı kopyalamak için, o çıkartmanın panelindeki Kopyala butonunu kullanın."
esES = "Este edificio tiene varias calcomanías. Solo se copió la primera. Para copiar una calcomanía específica, usa el botón Copiar en el panel de esa calcomanía."
itIT = "Questo edificio ha più decalcomanie. È stata copiata solo la prima. Per copiare una decalcomania specifica, usa il pulsante Copia nel pannello di quella decalcomania."
ukUA = "Ця будівля має кілька декалей. Скопійовано лише першу. Щоб скопіювати конкретну декаль, використовуйте кнопку «Копіювати» на панелі цієї декалі."
thTH = "อาคารนี้มีดีคัลหลายชิ้น คัดลอกได้เพียงชิ้นแรกเท่านั้น หากต้องการคัดลอกดีคัลชิ้นใดชิ้นหนึ่ง ให้ใช้ปุ่มคัดลอกในแผงของดีคัลชิ้นนั้น"
csCZ = "Tato budova má více dekálů. Bylo zkopírováno pouze první. Chcete-li zkopírovat konkrétní dekál, použijte tlačítko Zkopírovat v panelu tohoto dekálu."
viVN = "Tòa nhà này có nhiều nhãn dán. Chỉ decal đầu tiên được sao chép. Để sao chép một decal cụ thể, hãy sử dụng nút Sao chép trong bảng điều khiển của decal đó."
caES = "Aquest edifici té diverses decoracions. Només s'ha copiat la primera. Per copiar una decoració concreta, utilitza el botó Copia del panell d'aquesta decoració."
beBY = "Гэты будынак мае некалькі дэкаляў. Скапіяваны быў толькі першы. Каб скапіяваць пэўны дэкаль, выкарыстоўвайце кнопку «Капіяваць» на панэлі гэтага дэкаля."
roRO = "Această clădire are mai multe decalcomanii. Doar prima a fost copiată. Pentru a copia o decalcomanie specifică, folosește butonul Copiere din panoul acelei decalcomanii."
huHU = "Ez az épület több matricával rendelkezik. Csak az első került átmásolásra. Egy adott matrica másolásához használd az adott matrica panelján található Másolás gombot."
arSA = "هذا المبنى يحتوي على عدة ملصقات زخرفية. تم نسخ الأول فقط. لنسخ ملصق محدد، استخدم زر \"نسخ\" في لوحة ذلك الملصق."

