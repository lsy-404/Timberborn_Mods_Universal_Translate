["VF.CropRaisedBaseSmall.Description"]
new = "9 planting tiles, 5×5 total footprint. 2-tile growing storey. Soil level is 2 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge. The preview switches to a flush upper bed on a fully supported matching farm roof. Ordinary crops only; trees require a Tree Farm."
status = "normal"
enUS = "9 planting tiles, 5×5 total footprint. 2-tile growing story. Soil level is 2 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge. The preview switches to a flush upper bed on a fully supported matching farm roof. Ordinary crops only; trees require a Tree Farm."
zhCN = "9个种植格，占地共5×5。种植层高2格。土壤层比底座高2格，下方留有可用地面。将水连接到角落接口。在土壤高度设置阶梯，或让管道通道与其相接，即可从任意一侧进入；每层都不需要额外的站点。树木需要可到达的林务员和伐木工；作物则使用农场或园丁小屋。在完全支撑且与之匹配的农场屋顶上，预览会切换为齐平的上层种植床。仅限普通作物；树木需要树木农场。"
zhTW = "9 格種植地，總占地 5×5。2 格高的栽培層。土壤高度在底座上方 2 格，下方因此留有可用地面。將水連接至角落接口。在土壤高度設置樓梯，或與管道通道相連，即可從任一側進入；每一層都不需要額外的站點。樹木需要可到達的造林場和伐木工；作物則使用農舍或園丁小屋。若位於完全受支撐且相符的農場屋頂上，預覽會切換為與屋頂齊平的上層種植床。僅適用於普通作物；樹木需要樹木農場。"
ruRU = "9 клеток для посадки, общая площадь основания — 5×5 клеток. Выращивающий ярус высотой 2 клетки. Уровень почвы находится на 2 клетки выше основания, оставляя внизу пригодное для использования пространство. Подключите воду к угловым портам. Лестницы или примыкающий трубный проход на уровне почвы обеспечивают доступ с любой стороны; для каждого яруса не нужна отдельная станция. Для деревьев нужны доступные лесничий и лесоруб; для культур — фермерский дом или дом садовников. На полностью поддерживаемой крыше соответствующей фермы предпросмотр переключается на верхнюю грядку вровень с крышей. Только обычные культуры; для деревьев нужна лесная ферма."
jaJP = "植栽マスは9個、設置面積は合計5×5タイル。栽培階は2タイル分。土壌面は基部より2タイル高く、その下の地面も利用できます。水は隅の接続口につないでください。土壌面の高さに階段を設置するか、チューブウェイを接続すれば、どの側からでもアクセスできます。各階層に追加のステーションは必要ありません。樹木にはアクセス可能な森林管理所と伐採所が必要です。作物には農家または庭師のロッジを使います。対応する農場の屋根が完全に支えられている場合、プレビューは屋根と面一の上段の栽培ベッドに切り替わります。通常の作物のみ対応。樹木にはツリーファームが必要です。"
frFR = "9 cases de plantation, emprise totale de 5×5. Étage de culture de 2 cases. Le niveau du sol se trouve 2 cases au-dessus de la base, laissant un espace utilisable en dessous. Raccordez l’eau aux ports d’angle. Des escaliers ou un tube de circulation adjacent à hauteur du sol donnent accès par n’importe quel côté ; aucune station supplémentaire n’est nécessaire pour chaque niveau. Les arbres nécessitent un forestier et un bûcheron accessibles ; les cultures utilisent une ferme ou un pavillon des jardiniers. L’aperçu passe à une planche de culture supérieure affleurante sur un toit de ferme correspondant entièrement soutenu. Cultures ordinaires uniquement ; les arbres nécessitent une ferme arboricole."
deDE = "9 Pflanzfelder, insgesamt 5×5 Grundfläche. 2 Felder hohe Anbauetage. Die Bodenhöhe liegt 2 Felder über der Basis und lässt darunter nutzbaren Boden frei. Wasser an die Eckanschlüsse anschließen. Treppen oder ein angrenzender Röhrenweg auf Bodenhöhe ermöglichen den Zugang von jeder Seite; für jede Ebene ist keine zusätzliche Station nötig. Bäume benötigen einen erreichbaren Förster und Holzfäller; Feldfrüchte können mit einem Bauernhof oder einer Gärtnerhütte angebaut werden. Auf einem vollständig gestützten passenden Farmdach wechselt die Vorschau zu einem bündig abschließenden oberen Beet. Nur gewöhnliche Feldfrüchte; für Bäume ist eine Baumfarm erforderlich."
ptBR = "9 quadrados de plantio, área total de 5×5. Pavimento de cultivo com 2 quadrados de altura. O nível do solo fica 2 quadrados acima da base, deixando o terreno abaixo utilizável. Conecte a água às entradas nos cantos. Escadas ou uma tubovia encostada na altura do solo dão acesso por qualquer lado; não é necessária uma estação extra para cada nível. Árvores precisam de um silvicultor e um lenhador ao alcance; plantações usam uma Fazenda ou um Alojamento dos Jardineiros. A prévia muda para um canteiro superior nivelado com o telhado de uma fazenda correspondente totalmente sustentado. Apenas plantações comuns; árvores exigem uma Fazenda de Árvores."

