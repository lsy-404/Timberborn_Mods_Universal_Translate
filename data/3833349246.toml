["VF.RaisedBaseSmall.Description"]
new = "9 planting tiles, 5×5 total footprint. 5-tile growing storey. Soil level is 4 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge."
status = "normal"
enUS = "9 planting tiles, 5×5 total footprint. 5-tile growing story. Soil level is 4 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge."
zhCN = "9个种植格，占地总面积为5×5格。种植层高5格。土层比底座高4格，下方留有可用地面。在角落接口接入水。在土层高度建造楼梯或连接相邻的管道通道，即可从任意一侧进入；每层都无需额外建造站点。树木需要林务员和伐木工能够到达；作物则由农场小屋或园丁小屋照料。"
zhTW = "9 個種植格，占地總範圍為 5×5 格。種植樓層高 5 格。土壤高度比底座高 4 格，因此下方仍留有可用地面。將供水接至角落接口。在土壤高度連接樓梯或相鄰的管道通道，即可從任一側進入；每一層都不需要額外的站點。樹木需要可到達的林務員和伐木工；作物則由農舍或園丁小屋照料。"
ruRU = "9 посадочных клеток, общие габариты — 5×5. Выращивающий ярус высотой 5 клеток. Уровень почвы на 4 клетки выше основания, поэтому под ним остаётся пригодная для использования земля. Подключите воду к угловым портам. Лестницы или примыкающий трубный проход на уровне почвы обеспечивают доступ с любой стороны; для каждого яруса не нужна отдельная станция. Для деревьев нужны доступные лесничий и лесоруб; для культур — ферма или Домик садовников."
jaJP = "植栽マスは9個、全体の設置面積は5×5マス。栽培階の高さは5マス。土壌面は基部より4マス高く、その下の地面も利用可能。水を隅の接続口につなぐ。土壌面の高さに階段、または接続したチューブウェイがあれば、どの側からもアクセスできる。階層ごとに追加の駅は不要。樹木には到達可能な森林管理所と伐採所が必要。作物には農場または庭師のロッジを使用する。"
frFR = "9 cases de plantation, emprise totale de 5×5. Étage de culture de 5 cases. Le niveau du sol se trouve 4 cases au-dessus de la base, laissant le terrain en dessous utilisable. Raccordez l’eau aux ports d’angle. Des escaliers ou un tube de transport adjacent à hauteur du sol donnent accès par n’importe quel côté ; aucune station supplémentaire n’est nécessaire pour chaque étage. Les arbres nécessitent un forestier et un bûcheron accessibles ; les cultures utilisent une ferme ou une loge des jardiniers."
deDE = "9 Pflanzfelder, Grundfläche insgesamt 5×5. 5 Kacheln hohe Anbauetage. Die Bodenhöhe liegt 4 Kacheln über der Basis, sodass darunter nutzbarer Boden bleibt. Wasser an die Eckanschlüsse anschließen. Treppen oder ein angrenzender Röhrenweg auf Bodenhöhe ermöglichen den Zugang von jeder Seite; pro Ebene ist keine zusätzliche Station erforderlich. Bäume benötigen einen erreichbaren Förster und Holzfäller; für Feldfrüchte werden ein Bauernhof oder eine Gärtnerhütte genutzt."
plPL = "9 miejsc do sadzenia, całkowity obrys 5×5. Pięciokratkowe piętro uprawne. Poziom gleby znajduje się 4 kratki nad podstawą, dzięki czemu teren poniżej pozostaje użyteczny. Podłącz wodę do przyłączy w narożnikach. Schody lub stykający się z konstrukcją tunel rurowy na wysokości gleby zapewniają dostęp z dowolnej strony; nie potrzeba dodatkowego stanowiska na każdym poziomie. Drzewa wymagają dostępnego leśniczego i drwala; uprawy wymagają farmy lub Domku Ogrodników."
ptBR = "9 espaços de plantio, ocupando uma área total de 5×5. Andar de cultivo com 5 quadrados. O nível do solo fica 4 quadrados acima da base, deixando o terreno abaixo utilizável. Conecte a água aos pontos de conexão nos cantos. Escadas ou um tubo de transporte encostado na altura do solo dão acesso por qualquer lado; não é necessária uma estação extra para cada nível. Árvores precisam de um silvicultor e um lenhador ao alcance; plantações usam uma fazenda ou a Cabana dos Jardineiros."
koKR = "식재 타일 9개, 전체 설치 면적 5×5타일. 재배층 높이는 5타일입니다. 토양 높이는 바닥에서 4타일 위로, 아래쪽 지면은 사용할 수 있습니다. 물을 모서리 연결구에 연결하세요. 토양 높이에 계단이나 맞닿은 튜브웨이를 설치하면 어느 쪽에서든 접근할 수 있으며, 층마다 별도의 작업소는 필요하지 않습니다. 나무를 재배하려면 접근 가능한 산림 관리소와 벌목꾼 깃발이 필요하고, 작물에는 농장이나 정원사의 오두막을 이용하세요."
viVN = "9 ô trồng, diện tích chiếm chỗ tổng cộng 5×5. Tầng trồng cao 5 ô. Mặt đất nằm cao hơn chân đế 4 ô, để lại khoảng đất bên dưới có thể sử dụng. Nối nước vào các cổng ở góc. Cầu thang hoặc đường ống đi lại tiếp giáp ở độ cao mặt đất sẽ tạo lối vào từ bất kỳ phía nào; không cần thêm trạm cho mỗi tầng. Cây cần có người trồng rừng và thợ đốn cây trong tầm với; cây trồng cần Nông trại hoặc Nhà làm vườn."
trTR = "9 dikim karesi, toplam 5×5 karelik taban alanı. 5 karelik yetiştirme katı. Toprak seviyesi tabandan 4 kare yukarıdadır ve altta kullanılabilir zemin bırakır. Suyu köşe bağlantı noktalarına bağlayın. Toprak seviyesindeki merdivenler veya bitişik bir tüp yolu, her yönden erişim sağlar; her kat için ek bir istasyona gerek yoktur. Ağaçlar için erişilebilir bir Ormancı ve Oduncu gerekir; ekinler için Çiftlik Evi veya Bahçıvanlar Locası kullanılır."

