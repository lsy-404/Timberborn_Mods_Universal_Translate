csCZ = "25 políček pro pěstování s obvodovým chodníkem. Celková půdorysná plocha 7×7, výška 4. Vodovodní potrubí připojte k rohu v úrovni základny nebo střechy. Vyžaduje schody k úrovni půdy. Stejné plošiny skládejte přímo nad sebe. Pouze běžné suchozemské plodiny."
