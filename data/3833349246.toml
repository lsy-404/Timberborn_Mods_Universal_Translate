new = "9 planting tiles, 5×5 total footprint. 2-tile growing storey. Place directly on a matching roof: soil is at the base, with no under-bed legs or gap. Requires full stackable support. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge. Ordinary crops only; trees require a Tree Farm."
