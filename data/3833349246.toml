deDE = "9 Pflanzfelder, 5×5 Grundfläche. 4 Felder hohe Anbauetage. Direkt auf ein passendes Dach setzen: Die Erde befindet sich an der Basis, ohne Beine unter dem Beet oder Zwischenraum. Benötigt vollständige Unterstützung durch stapelbare Gebäude. Wasser an die Eckanschlüsse anschließen. Treppen oder ein angrenzender Röhrenweg auf Höhe der Erde ermöglichen den Zugang von jeder Seite; pro Ebene ist keine zusätzliche Station erforderlich. Für Bäume sind ein erreichbarer Förster und Holzfäller erforderlich; Nutzpflanzen können mit einem Bauernhof oder einer Gärtnerhütte angebaut werden. Bäume und gewöhnliche Nutzpflanzen sind erlaubt."
plPL = "9 pól uprawnych, całkowity obrys 5×5. 4-polowe piętro uprawne. Umieść bezpośrednio na pasującym dachu: ziemia znajduje się u podstawy, bez nóg pod grządkami ani szczeliny. Wymaga pełnego podparcia przez konstrukcje piętrowe. Doprowadź wodę do narożnych przyłączy. Schody lub przylegający tunel rurowy na poziomie ziemi zapewniają dostęp z dowolnej strony; nie potrzeba dodatkowej stacji dla każdego poziomu. Drzewa wymagają dostępnego leśnika i drwala; uprawy korzystają z gospodarstwa rolnego lub Domku ogrodnika. Dozwolone są drzewa i zwykłe uprawy."
ptBR = "9 quadrados de plantio, ocupando uma área total de 5×5. Andar de cultivo com 4 quadrados. Coloque diretamente sobre um telhado compatível: o solo fica na base, sem pernas sob o canteiro nem espaço vazio. Requer suporte empilhável completo. Conecte a água às entradas nos cantos. Escadas ou uma tubovia adjacente à altura do solo dão acesso por qualquer lado; não é necessária uma estação extra para cada nível. Árvores precisam de um silvicultor e um lenhador ao alcance; plantações usam uma Fazenda ou uma Cabana dos Jardineiros. Árvores e plantações comuns são permitidas."
koKR = "식재 타일 9개, 전체 점유 면적 5×5. 재배층은 4타일입니다. 알맞은 지붕 위에 바로 배치하세요. 흙은 바닥에 있으며, 베드 아래에 다리나 틈이 없습니다. 완전한 적층 지지대가 필요합니다. 모서리 포트에 물을 연결하세요. 흙 높이에 계단을 놓거나 튜브 통로를 맞닿게 연결하면 어느 쪽에서든 접근할 수 있습니다. 각 층마다 별도의 작업소는 필요하지 않습니다. 나무를 재배하려면 접근 가능한 산림 관리소와 벌목꾼이 필요하며, 작물에는 농가나 정원사의 숙소를 사용하세요. 나무와 일반 작물을 재배할 수 있습니다."
csCZ = "9 políček k výsadbě, celkový půdorys 5×5. Pěstební patro o 4 políčkách. Umístěte přímo na odpovídající střechu: zemina je na základně, bez nohou pod záhonem či mezery. Vyžaduje plnou stohovatelnou oporu. Připojte vodu ke konektorům v rozích. Schody nebo přilehlá trubková cesta ve výšce zeminy umožňují přístup z kterékoli strany; pro každé patro není potřeba další stanoviště. Stromy vyžadují dostupného lesníka a dřevorubce; plodiny využívají farmu nebo zahradnickou chatu. Lze pěstovat stromy i běžné plodiny."
viVN = "9 ô trồng, tổng diện tích chiếm chỗ 5×5. Tầng trồng 4 ô. Đặt trực tiếp lên mái phù hợp: đất nằm ở đáy, không có chân đỡ bên dưới luống hay khoảng hở. Cần có kết cấu đỡ xếp chồng đầy đủ. Nối đường nước với các cổng ở góc. Có thể tiếp cận từ bất kỳ phía nào bằng cầu thang hoặc đường đi dạng ống liền kề ở độ cao mặt đất; không cần thêm trạm cho mỗi tầng. Cây cần có người trồng rừng và tiều phu có thể tiếp cận; cây trồng cần Nông trại hoặc Nhà nghỉ Người làm vườn. Có thể trồng cây và các loại cây trồng thông thường."

