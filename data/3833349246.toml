["VF.UpperBedSmall.Description"]
new = "9 planting tiles, 5×5 total footprint. 5-tile growing storey. Place directly on a matching roof: soil is at the base, with no under-bed legs or gap. Requires full stackable support. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge."
status = "normal"
enUS = "9 planting tiles, 5×5 total footprint. 5-tile growing story. Place directly on a matching roof: soil is at the base, with no under-bed legs or gap. Requires full stackable support. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge."
zhCN = "9个种植格，占地共5×5格。种植层高5格。可直接建在匹配的屋顶上：底部就是土壤，没有床下支腿或空隙。需要完整的可堆叠支撑。将水连接到角落接口。在土壤高度，楼梯或相连的管道通道可从任意一侧提供通行；每层都不需要额外的站点。树木需要可到达的林务员和伐木工；作物则由农舍或园丁小屋负责。"
ruRU = "9 посадочных клеток, общая площадь — 5×5. Ярус для выращивания высотой 5 клеток. Устанавливается прямо на подходящую крышу: почва находится у основания, без ножек под грядкой и зазора. Для установки в стопку требуется полная опора. Подведите воду к угловым портам. Лестница или примыкающий трубный переход на уровне почвы обеспечивают доступ с любой стороны; для каждого яруса не нужна отдельная станция. Для деревьев нужны доступные лесник и дровосек; для культур — ферма или Дом садовников."
jaJP = "植栽タイル9マス、占有面積は合計5×5。栽培階の高さは5タイル。対応する屋根の上に直接配置します。土は底面にあり、ベッド下の脚や隙間はありません。全段を支えられる積み重ね対応の支持が必要です。水を角のポートに接続してください。土の高さに階段を設置するか、チューブウェイを隣接させれば、どの側からでもアクセスできます。各段に追加のステーションは必要ありません。樹木にはアクセス可能な植林場と伐採場が必要です。作物には農場または園芸家の小屋を使用します。"
frFR = "9 cases de plantation, emprise totale de 5×5. Étage de culture de 5 cases. À placer directement sur un toit compatible : la terre se trouve à la base, sans pieds ni espace sous le bac. Nécessite un support complet pour l’empilement. Raccordez les ports d’angle à l’eau. Des escaliers ou un tube de transport adjacent, à hauteur du sol, donnent accès depuis n’importe quel côté ; aucune station supplémentaire n’est nécessaire pour chaque étage. Les arbres doivent être accessibles à un forestier et à un bûcheron ; les cultures utilisent une ferme ou une loge des jardiniers."
plPL = "9 pól uprawnych, łączny obrys 5×5 pól. Kondygnacja uprawna o wysokości 5 pól. Umieść bezpośrednio na pasującym dachu: gleba znajduje się u podstawy, bez nóg pod grządką ani odstępu. Wymaga pełnego podparcia umożliwiającego układanie w stos. Podłącz wodę do przyłączy w narożnikach. Schody lub stykający się z konstrukcją tubeway na wysokości gleby zapewniają dostęp z dowolnej strony; nie potrzeba dodatkowej stacji dla każdej kondygnacji. Drzewa wymagają zasięgu leśnika i drwala; uprawy — gospodarstwa lub Chaty Ogrodników."
ptBR = "9 espaços de plantio, área total de 5×5. Pavimento de cultivo de 5 quadrados. Coloque diretamente sobre um telhado compatível: o solo fica na base, sem pernas sob a cama nem vão. Requer suporte empilhável completo. Conecte água às entradas nos cantos. Escadas ou uma tubovia encostada, na altura do solo, dão acesso por qualquer lado; não é necessária uma estação extra para cada nível. Árvores precisam de um silvicultor e um lenhador ao alcance; plantações usam uma fazenda ou uma Casa dos Jardineiros."
koKR = "식재 타일 9개, 전체 설치 면적 5×5. 재배층 높이 5타일. 호환되는 지붕 위에 바로 설치하세요. 흙이 바닥에 놓이며, 아래쪽에 지지 다리나 틈이 없습니다. 완전한 적층 지지가 필요합니다. 물을 모서리 연결구에 연결하세요. 흙 높이에 계단이나 맞닿은 튜브웨이를 설치하면 어느 쪽에서든 접근할 수 있으며, 층마다 추가 시설은 필요하지 않습니다. 나무에는 접근 가능한 조림 담당자와 벌목꾼이 필요하고, 작물에는 농장이나 정원사의 오두막을 사용합니다."
viVN = "9 ô trồng, diện tích chiếm chỗ tổng cộng 5×5. Tầng trồng 5 ô. Đặt trực tiếp lên mái tương ứng: đất ở đáy, không có chân đỡ bên dưới luống hay khoảng trống. Cần có giá đỡ xếp chồng đầy đủ. Nối nước vào các cổng ở góc. Cầu thang hoặc đường ống đi bộ tiếp giáp ở độ cao ngang mặt đất giúp tiếp cận từ bất kỳ phía nào; không cần thêm trạm cho mỗi tầng. Cây thân gỗ cần có người trồng rừng và tiều phu có thể tiếp cận; cây trồng cần có Nông trại hoặc Nhà nghỉ Người làm vườn."
trTR = "9 ekim karesi, toplam 5×5 taban alanı. 5 karelik yetiştirme katı. Uygun bir çatının üzerine doğrudan yerleştirin: toprak tabandadır; yatağın altında ayak veya boşluk yoktur. Tam istiflenebilir destek gerektirir. Suyu köşe bağlantı noktalarına bağlayın. Merdivenler veya toprak seviyesinde bitişik bir tüp yolu, herhangi bir taraftan erişim sağlar; her kat için ek bir istasyon gerekmez. Ağaçlar için erişilebilir bir ormancı ve oduncu gerekir; ekinler için bir çiftlik evi veya Bahçıvanlar Kulübesi kullanılır."

