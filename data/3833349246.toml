["VF.CompactDeckSmall.Description"]
raw = "9 planting tiles with a perimeter walkway. Total footprint 5×5, height 4. Connect water pipes to a corner at base or roof level. Requires stairs to the soil level. Stack matching decks directly above. Ordinary land crops only."
status = "normal"
enUS = "9 planting tiles with a perimeter walkway. Total footprint 5×5, height 4. Connect water pipes to a corner at base or roof level. Requires stairs to the soil level. Stack matching decks directly above. Ordinary land crops only."
zhCN = "9 个种植地块，外围设有走道。占地 5×5，高 4。可在底部或屋顶高度将水管连接到角落。需要修建楼梯通往土壤层。可将相同的种植层直接叠放在上方。仅限普通陆地作物。"
zhTW = "9 個種植格，四周設有走道。總占地為 5×5，高度為 4。可在底部或屋頂高度將水管接至角落。需要樓梯通往土壤層。可將相同的甲板直接疊放在上方。僅限一般陸地作物。"
ruRU = "9 посадочных клеток с проходом по периметру. Габариты основания — 5×5, высота — 4. Подключайте водопроводные трубы к углу на уровне основания или крыши. Требуется лестница к уровню почвы. Такие же ярусы можно устанавливать непосредственно друг над другом. Только обычные наземные культуры."
jaJP = "周囲に通路を備えた栽培マス9つ。設置面積は5×5、高さ4。水道管は基部または屋根の高さにある角へ接続。土壌レベルまでの階段が必要。同じデッキを真上に積み重ね可能。通常の陸上作物のみ。"
frFR = "9 cases de plantation avec une passerelle périphérique. Emprise totale de 5×5, hauteur de 4. Raccordez les tuyaux d’eau à un coin au niveau de la base ou du toit. Nécessite des escaliers jusqu’au niveau du sol. Empilez directement au-dessus des plateformes identiques. Cultures terrestres ordinaires uniquement."
deDE = "9 Pflanzfelder mit umlaufendem Laufweg. Grundfläche insgesamt 5×5, Höhe 4. Wasserrohre an einer Ecke auf Boden- oder Dachebene anschließen. Treppen bis zur Bodenebene erforderlich. Passende Decks direkt darüber stapeln. Nur gewöhnliche Feldfrüchte an Land."
plPL = "9 pól uprawnych z chodnikiem wokół obwodu. Całkowity obrys 5×5, wysokość 4. Podłącz rury wodne do narożnika na poziomie podstawy lub dachu. Wymaga schodów prowadzących na poziom gleby. Układaj pasujące platformy bezpośrednio jedna nad drugą. Tylko zwykłe uprawy lądowe."
ptBR = "9 espaços de cultivo com uma passarela ao redor. Área total ocupada de 5×5, altura 4. Conecte tubulações de água a um canto na altura da base ou do telhado. Requer escadas até o nível do solo. Empilhe plataformas iguais diretamente acima. Apenas cultivos terrestres comuns."
koKR = "식재 타일 9개와 둘레 통로. 전체 점유 면적 5×5, 높이 4. 급수관은 바닥 또는 지붕 높이의 모서리에 연결하세요. 토양 높이까지 계단이 필요합니다. 같은 데크를 바로 위에 쌓으세요. 일반 육지 작물만 재배할 수 있습니다."
csCZ = "9 pěstitelských políček s obvodovým chodníkem. Celková půdorysná plocha 5×5, výška 4. Vodovodní potrubí připojte k rohu v úrovni základny nebo střechy. Vyžaduje schody vedoucí k úrovni půdy. Stejné plošiny lze skládat přímo nad sebe. Pouze běžné suchozemské plodiny."
viVN = "9 ô trồng cây với lối đi dọc chu vi. Diện tích chiếm chỗ tổng thể 5×5, chiều cao 4. Nối ống nước vào một góc ở tầng nền hoặc tầng mái. Cần có cầu thang dẫn đến tầng đất. Xếp các sàn cùng loại trực tiếp lên trên. Chỉ dành cho cây trồng trên đất thông thường."
