["VF.RaisedBaseMedium.Description"]
new = "25 planting tiles, 7×7 total footprint. 5-tile growing storey. Soil level is 4 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge."
status = "normal"
enUS = "25 planting tiles, 7×7 total footprint. 5-tile growing story. Soil level is 4 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners' Lodge."
zhCN = "25个种植格，占地共7×7格。种植层高5格。土层位于底座上方4格，下方留有可用地面。将水接入角落端口。在土层高度接上楼梯或相邻的管道通道，即可从任意一侧进入；每一层都不需要额外建造站点。树木需要林务员和伐木工都能到达；作物则由农舍或园丁小屋负责。"
zhTW = "25 個種植格，總占地為 7×7 格。栽培樓層高 5 格。土壤層位於底座上方 4 格，底下仍留有可用地面。將水連接至角落接口。在土壤高度，樓梯或相連的管道通路可從任一側進入；每層不需要額外的站點。樹木需要可抵達的造林員和伐木工；作物則由農舍或園丁小屋種植。"
ruRU = "25 посадочных клеток, общие габариты основания — 7×7. Этаж для выращивания высотой 5 клеток. Уровень почвы находится на 4 клетки выше основания, поэтому под ним остаётся пригодное для использования пространство. Подключите воду к угловым портам. Для деревьев нужны доступные лесник и лесоруб; для культур — ферма или дом садовников. Ступени или примыкающий трубный путь на уровне почвы обеспечивают доступ с любой стороны; для каждого яруса не нужна отдельная станция."
jaJP = "植栽タイル25マス、全体の占有面積は7×7。栽培階は5タイル分。土壌面は基礎より4タイル高く、その下の地面も利用できます。水を角の接続口につないでください。土壌面の高さに階段または隣接するチューブウェイを設置すれば、どの側からでもアクセスできます。階層ごとに追加のステーションは不要です。樹木には到達可能な森林管理所と木こり小屋が必要です。作物には農家または園芸家のロッジを使用します。"
frFR = "25 cases de plantation, emprise totale de 7×7. Étage de culture de 5 cases. Le niveau du sol se trouve 4 cases au-dessus de la base, laissant le terrain en dessous utilisable. Raccordez l’eau aux ports d’angle. Des escaliers ou un tube de transport adjacent à hauteur du sol donnent accès par n’importe quel côté ; aucune station supplémentaire n’est nécessaire à chaque niveau. Les arbres nécessitent un forestier et un bûcheron pouvant les atteindre ; les cultures nécessitent une ferme ou un pavillon des jardiniers."
deDE = "25 Pflanzfelder, 7×7 Gesamtgrundfläche. 5 Felder hohe Anbauebene. Das Bodenniveau liegt 4 Felder über der Basis, sodass darunter nutzbarer Boden verbleibt. Wasser an die Eckanschlüsse anschließen. Treppen oder ein angrenzender Röhrenweg auf Bodenhöhe ermöglichen den Zugang von jeder Seite; für jede Ebene ist keine zusätzliche Station erforderlich. Bäume benötigen einen erreichbaren Förster und Holzfäller; Nutzpflanzen benötigen einen Bauernhof oder eine Gärtnerhütte."
ptBR = "25 espaços de plantio, com pegada total de 7×7. Andar de cultivo de 5 tiles. O nível do solo fica 4 tiles acima da base, deixando terreno utilizável abaixo. Conecte a água às entradas nos cantos. Escadas ou uma tubovia adjacente à altura do solo dão acesso por qualquer lado; não é necessária uma estação extra para cada nível. Árvores precisam de um silvicultor e de um lenhador ao alcance; plantações usam uma fazenda ou uma Cabana dos Jardineiros."
koKR = "재배 타일 25개, 전체 점유 면적 7×7타일. 재배층 높이 5타일. 토양 높이는 바닥에서 4타일 위라 아래쪽 지면을 사용할 수 있습니다. 물은 모서리 연결구에 연결하세요. 토양 높이에 계단을 설치하거나 튜브웨이를 맞닿게 연결하면 어느 쪽에서든 접근할 수 있으며, 층마다 별도의 정거장은 필요하지 않습니다. 나무에는 접근 가능한 산림 관리인과 벌목꾼이 필요하고, 작물에는 농장이나 정원사의 오두막이 필요합니다."
csCZ = "25 políček pro pěstování, celkový půdorys 7×7. Pěstební podlaží vysoké 5 políček. Úroveň půdy je 4 políčka nad základnou, takže pod ní zůstává využitelná zem. Přiveďte vodu k rohovým přípojkám. Přístup z kterékoli strany zajišťují schody nebo přilehlá trubková cesta ve výšce půdy; pro každé podlaží není potřeba další stanice. Stromy potřebují lesníka a dřevorubce v dosahu; plodiny využívají farmu nebo Zahradnickou chatu."
viVN = "25 ô trồng, diện tích chiếm chỗ tổng cộng 7×7 ô. Tầng trồng cao 5 ô. Mặt đất cao hơn chân đế 4 ô, để lại khoảng đất có thể sử dụng bên dưới. Nối nước vào các cổng ở góc. Cầu thang hoặc đường ống tiếp giáp ở độ cao mặt đất cho phép tiếp cận từ bất kỳ phía nào; không cần thêm trạm cho mỗi tầng. Cây cần có lâm trường và trạm khai thác gỗ có thể tiếp cận; cây trồng dùng Nhà nông trại hoặc Nhà nghỉ Người làm vườn."
trTR = "25 ekim karesi, toplam 7×7 taban alanı. 5 karelik yetiştirme katı. Toprak seviyesi tabandan 4 kare yukarıdadır; böylece altta kullanılabilir zemin kalır. Suyu köşe bağlantı noktalarına bağlayın. Toprak seviyesinde merdivenler veya bitişik bir tüp yolu her yandan erişim sağlar; her kat için ayrıca bir istasyon gerekmez. Ağaçlar için erişilebilir bir ormancı ve oduncu gerekir; ekinler için bir çiftlik veya Bahçıvan Locası kullanılır."

