["VF.LegacyDeckSmall.Description"]
raw = "An existing deck from prototype 0.1.0. Its original dimensions and crops are preserved. New construction uses the compact deck sizes."
status = "normal"
enUS = "An existing deck from prototype 0.1.0. Its original dimensions and crops are preserved. New construction uses the compact deck sizes."
zhCN = "原型 0.1.0 中已有的种植平台。其原始尺寸和作物均予以保留。新建建筑采用紧凑型平台尺寸。"
zhTW = "這是原型 0.1.0 時期的既有甲板。其原始尺寸與作物均予以保留。新建築則採用緊湊型甲板尺寸。"
ruRU = "Существующий ярус из прототипа 0.1.0. Его исходные размеры и выращиваемые культуры сохранены. В новых постройках используются компактные размеры ярусов."
jaJP = "プロトタイプ0.1.0から引き継がれた既存のデッキです。元の寸法と作物は維持されています。新規建設ではコンパクトなデッキサイズが使用されます。"
frFR = "Une plateforme existante du prototype 0.1.0. Ses dimensions d'origine et ses cultures sont préservées. Les nouvelles constructions utilisent les formats compacts des plateformes."
deDE = "Eine bestehende Plattform aus Prototyp 0.1.0. Ihre ursprünglichen Abmessungen und Feldfrüchte bleiben erhalten. Neue Konstruktionen verwenden die kompakten Plattformgrößen."
plPL = "Istniejąca platforma z prototypu 0.1.0. Zachowano jej pierwotne wymiary i uprawy. Nowe konstrukcje korzystają z kompaktowych rozmiarów platform."
ptBR = "Uma plataforma existente do protótipo 0.1.0. Suas dimensões originais e plantações foram preservadas. Novas construções usam os tamanhos compactos de plataforma."
koKR = "기존 데크는 프로토타입 0.1.0 버전의 것입니다. 원래 크기와 작물이 유지됩니다. 새로 건설하는 데크에는 소형 크기가 적용됩니다."
csCZ = "Stávající plošina z prototypu 0.1.0. Její původní rozměry a plodiny zůstávají zachovány. Nová výstavba používá kompaktní rozměry plošin."
viVN = "Một sàn hiện có từ bản thử nghiệm 0.1.0. Kích thước và cây trồng ban đầu của nó được giữ nguyên. Công trình xây mới sử dụng các kích thước sàn nhỏ gọn."
trTR = "0.1.0 prototipinden kalma mevcut bir tarım platformu. Özgün boyutları ve ekinleri korunmuştur. Yeni yapılar kompakt platform boyutlarını kullanır."

