enUS = "9 planting tiles, 5×5 total footprint. 2-tile growing story. Place directly on a matching roof: soil is at the base, with no under-bed legs or gap. Requires full stackable support. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge. Ordinary crops only; trees require a Tree Farm."
zhTW = "9 個種植格，總占地 5×5。種植樓層高 2 格。直接放在相符的屋頂上：土壤位於底部，沒有床下支腳或空隙。需要完整的可堆疊支撐。將水連接至角落的接口。在土壤高度，任何一側都可用樓梯或相鄰的管道通道進出；每一層都不需要額外的工作站。樹木需要可到達的林務員和伐木工；作物則使用農舍或園丁小屋。僅限一般作物；樹木需要樹木農場。"
ruRU = "9 посадочных клеток, общая площадь основания — 5×5 клеток. Ярус для выращивания высотой 2 клетки. Размещайте прямо на подходящей крыше: почва находится у основания, без опор под грядкой и зазора. Требуется полная опора для штабелирования. Подключите воду к угловым портам. Лестницы или примыкающий тубвей на уровне почвы обеспечивают доступ с любой стороны; для каждого яруса не нужна отдельная станция. Для деревьев нужны доступные лесник и лесоруб; для культур — Фермерский дом или Дом садовников. Только обычные культуры; для деревьев требуется Лесная ферма."
frFR = "9 cases de culture, emprise totale de 5×5. Étage de culture de 2 cases. À placer directement sur un toit correspondant : la terre se trouve à la base, sans pieds sous les plates-bandes ni espace vide. Nécessite un support empilable complet. Raccordez l’eau aux ports d’angle. Des escaliers ou un tube de transport adjacent à hauteur du sol donnent accès depuis n’importe quel côté ; aucun poste supplémentaire n’est nécessaire pour chaque étage. Les arbres nécessitent un forestier et un bûcheron accessibles ; les cultures nécessitent une ferme ou une loge des jardiniers. Cultures ordinaires uniquement ; les arbres nécessitent une ferme arboricole."
deDE = "9 Pflanzkacheln, Grundfläche insgesamt 5×5. 2 Kacheln hohe Anbauebene. Direkt auf ein passendes Dach setzen: Die Erde liegt an der Unterseite, ohne Beine unter dem Beet und ohne Zwischenraum. Benötigt vollständige stapelbare Unterstützung. Wasser an die Eckanschlüsse anschließen. Treppen oder ein angrenzender Rohrweg auf Bodenhöhe ermöglichen den Zugang von jeder Seite; für jede Ebene ist keine zusätzliche Station erforderlich. Bäume müssen für einen erreichbaren Förster und Holzfäller zugänglich sein; für Nutzpflanzen wird ein Bauernhof oder eine Gärtnerhütte benötigt. Nur gewöhnliche Nutzpflanzen; Bäume benötigen eine Baumfarm."
plPL = "9 pól uprawnych, łączny obrys 5×5. Piętro uprawne wysokie na 2 kratki. Umieść bezpośrednio na pasującym dachu: gleba znajduje się u podstawy, bez nóg pod grządką ani odstępu. Wymaga pełnego podparcia umożliwiającego piętrowanie. Podłącz wodę do narożnych przyłączy. Schody lub przylegający tunel rurowy na wysokości gleby zapewniają dostęp z dowolnej strony; nie potrzeba dodatkowej stacji na każdym poziomie. Drzewa wymagają dostępnego leśnika i drwala; uprawy korzystają z gospodarstwa lub Domku ogrodników. Tylko zwykłe uprawy; drzewa wymagają Farmy drzew."
csCZ = "9 políček pro pěstování, celkový půdorys 5×5. Pěstební patro vysoké 2 políčka. Umístěte přímo na odpovídající střechu: půda je u základny, bez nohou ani mezery pod záhonem. Vyžaduje plnou stohovatelnou oporu. Připojte vodu ke konektorům v rozích. Schody nebo přiléhající tubeway ve výšce půdy umožňují přístup z kterékoli strany; pro každé patro není potřeba další stanoviště. Stromy vyžadují dosažitelného lesníka a dřevorubce; plodiny se obhospodařují pomocí statku nebo Zahradnické chaty. Pouze běžné plodiny; stromy vyžadují Lesní farmu."
viVN = "9 ô trồng cây, diện tích chiếm chỗ tổng cộng 5×5. Tầng trồng cao 2 ô. Đặt trực tiếp lên mái tương ứng: đất ở đáy, không có chân đỡ bên dưới hoặc khoảng hở. Cần có giá đỡ xếp chồng hoàn chỉnh. Nối nước vào các cổng ở góc. Có thể tiếp cận từ bất kỳ phía nào bằng cầu thang hoặc đường ống chạm vào công trình ở độ cao mặt đất; không cần thêm trạm cho mỗi tầng. Cây cần có người trồng rừng và tiều phu có thể tiếp cận; cây trồng cần Nông trại hoặc Nhà nghỉ Người làm vườn. Chỉ trồng được cây trồng thông thường; cây cần có Trang trại Cây."
trTR = "9 ekim karesi, toplam 5×5 taban alanı. 2 kare yüksekliğinde yetiştirme katı. Uyumlu bir çatının üzerine doğrudan yerleştirin: toprak tabandadır; yatağın altında ayak veya boşluk yoktur. Tam istiflenebilir destek gerektirir. Suyu köşe bağlantı noktalarına bağlayın. Toprak seviyesinde merdivenler veya bitişik bir tüp yolu her yönden erişim sağlar; her kat için ek bir istasyon gerekmez. Ağaçlar için erişilebilir bir ormancı ve oduncu gerekir; mahsuller için Çiftlik Evi veya Bahçıvanlar Locası kullanılır. Yalnızca sıradan mahsuller; ağaçlar için Ağaç Çiftliği gerekir."

