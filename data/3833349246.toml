["VF.TreeRaisedBaseSmall.Description"]
new = "9 planting tiles, 5×5 total footprint. 4-tile growing storey. Soil level is 4 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge. The preview switches to a flush upper bed on a fully supported matching farm roof. Trees and ordinary crops are allowed."
status = "normal"
enUS = "9 planting tiles, 5×5 total footprint. 4-tile growing story. Soil level is 4 tiles above the base, leaving usable ground below. Connect water to corner ports. Stairs or a touching tubeway at soil height provide access on any side; no extra station is needed for each tier. Trees need a reachable forester and lumberjack; crops use a farmhouse or Gardeners’ Lodge. The preview switches to a flush upper bed on a fully supported matching farm roof. Trees and ordinary crops are allowed."
zhCN = "9 个种植格，总占地为 5×5。种植层高 4 格。土壤层位于底座上方 4 格处，下方留有可用地面。在角落接口连接水源。在土壤高度建造楼梯或与其相接的管道，即可从任意一侧进入；每一层都不需要额外的工作站。树木需要可到达的林务员和伐木工；作物则使用农场或园丁小屋。若对应的农场屋顶获得完整支撑，预览会切换为与屋顶齐平的上层种植床。允许种植树木和普通作物。"
zhTW = "9 個種植格，總占地 5×5 格。種植層高 4 格。土壤層位於底座上方 4 格處，下方仍保留可用地面。將水源連接至角落接口。在土壤高度設置樓梯或與其相接的管道，即可從任一側進出；每一層都不需要額外的工作站。樹木需要可抵達的林務員和伐木工；作物則使用農舍或園丁小屋。在完全支撐且相容的農場屋頂上，預覽會切換為與屋頂齊平的上層種植床。允許種植樹木和一般作物。"
ruRU = "9 посадочных клеток, общая площадь основания — 5×5 клеток. Ярус для выращивания высотой 4 клетки. Уровень почвы находится на 4 клетки выше основания, оставляя внизу пригодное для использования пространство. Подключите воду к угловым портам. Лестницы или примыкающий тубвей на уровне почвы обеспечивают доступ с любой стороны; для каждого яруса не нужна отдельная станция. Для деревьев нужны доступные лесничий и лесоруб; для культур — ферма или Дом садовников. На полностью поддерживаемой крыше подходящей фермы предварительный просмотр переключается на верхнюю грядку вровень с крышей. Можно выращивать деревья и обычные культуры."
frFR = "9 cases de plantation, emprise totale de 5×5. Étage de culture de 4 cases. Le niveau du sol se trouve 4 cases au-dessus de la base, laissant le terrain en dessous utilisable. Raccordez l'eau aux ports d'angle. Des escaliers ou un tubeway adjacent au niveau du sol permettent d'accéder à l'étage depuis n'importe quel côté ; aucun poste supplémentaire n'est nécessaire pour chaque niveau. Les arbres nécessitent un forestier et un bûcheron à portée ; les cultures nécessitent une ferme ou une loge des jardiniers. L'aperçu passe à une parcelle supérieure affleurante sur un toit de ferme correspondant et entièrement soutenu. Les arbres et les cultures ordinaires sont autorisés."
ptBR = "9 espaços de plantio, área total de 5×5. Andar de cultivo com 4 tiles. O nível do solo fica 4 tiles acima da base, deixando o terreno abaixo utilizável. Conecte a água às entradas nos cantos. Escadas ou um tubo de passagem encostado à estrutura, na altura do solo, dão acesso por qualquer lado; não é necessária uma estação extra para cada nível. Árvores precisam de um silvicultor e um lenhador ao alcance; plantações usam uma fazenda ou uma Cabana dos Jardineiros. A prévia muda para um canteiro superior nivelado quando está sobre um telhado de fazenda correspondente, totalmente apoiado. Árvores e plantações comuns são permitidas."
koKR = "식재 타일 9개, 전체 점유 면적 5×5. 재배층 높이는 4타일입니다. 흙 높이는 바닥에서 4타일 위에 있어 아래쪽 지면을 사용할 수 있습니다. 물을 모서리 연결부에 연결하세요. 어느 쪽에서든 흙 높이에 계단을 설치하거나 튜브웨이를 맞닿게 연결하면 접근할 수 있으며, 각 층마다 별도의 정거장은 필요하지 않습니다. 완전히 지지된 호환 농장 지붕에서는 미리보기가 지붕과 높이가 맞는 위쪽 밭으로 전환됩니다. 나무와 일반 작물을 재배할 수 있습니다."
viVN = "9 ô trồng trọt, diện tích chiếm chỗ tổng cộng 5×5. Tầng trồng cao 4 ô. Mặt đất cao hơn đáy 4 ô, để lại phần đất bên dưới có thể sử dụng. Nối nước vào các cổng ở góc. Cầu thang hoặc đường ống đi lại tiếp giáp ở độ cao mặt đất cho phép tiếp cận từ bất kỳ phía nào; không cần thêm trạm cho mỗi tầng. Cây cần có nhân viên lâm nghiệp và tiều phu có thể tiếp cận; cây trồng cần Nhà nông trại hoặc Nhà nghỉ Người làm vườn. Bản xem trước chuyển sang luống phía trên ngang bằng với mái trang trại tương ứng được chống đỡ hoàn toàn. Có thể trồng cây và các loại cây trồng thông thường."
trTR = "9 ekim karosu, toplam 5×5 taban alanı. 4 karoluk yetiştirme katı. Toprak seviyesi tabandan 4 karo yukarıdadır ve altta kullanılabilir zemin bırakır. Köşe bağlantı noktalarına su bağlayın. Merdivenler veya toprak seviyesinde bitişik bir tüp yolu, her yönden erişim sağlar; her kat için ayrı bir istasyon gerekmez. Ağaçlar için erişebilen bir ormancı ve oduncu gerekir; ekinler için Çiftlik Evi veya Bahçıvanlar Locası kullanılır. Tam desteklenen uyumlu bir çiftlik çatısında önizleme, üst tarhı çatıyla aynı seviyeye getirir. Ağaçlar ve sıradan ekinler yetiştirilebilir."

