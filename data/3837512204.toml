koKR = "지붕이 있는 목재 다리입니다. 갑판, 기둥, 지붕을 위해 2층 높이를 차지합니다."
trTR = "Üstü kapalı ahşap köprü. Döşeme, direkler ve çatı için iki seviye ayırır."
esES = "Un puente de madera con techo. Ocupa dos niveles para el tablero, los postes y el techo."
itIT = "Un ponte di legno coperto. Riserva due livelli per l'impalcato, i pilastri e il tetto."
ukUA = "Дерев’яний міст із дахом. Займає два рівні для настилу, стійок і даху."
thTH = "สะพานไม้มีหลังคา ใช้พื้นที่สองชั้นสำหรับพื้นสะพาน เสา และหลังคา"
csCZ = "Zastřešený dřevěný most. Vyhrazuje dvě úrovně pro mostovku, sloupky a střechu."
viVN = "Một cây cầu gỗ có mái che. Dành hai tầng cho mặt cầu, cột và mái."
caES = "Un pont de fusta cobert. Reserva dos nivells per al tauler, els pilars i la teulada."
beBY = "Крыты драўляны мост. Адводзіць два ўзроўні пад насціл, слупы і дах."
roRO = "Un pod de lemn acoperit. Rezervă două niveluri pentru punte, stâlpi și acoperiș."
huHU = "Tetővel fedett fahíd. Két szintnyi helyet tart fenn a hídpálya, az oszlopok és a tető számára."
arSA = "جسر خشبي مسقوف. يشغل مستويين لأرضية الجسر والأعمدة والسقف."

