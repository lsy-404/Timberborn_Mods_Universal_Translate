["Bridgeworks.Supported.Description"]
status = "normal"
raw = "Deck is one level above the base. Connect paths or stairs at deck height. Ground or platforms must support the marked legs or abutments."
enUS = "Deck is one level above the base. Connect paths or stairs at deck height. Ground or platforms must support the marked legs or abutments."
zhCN = "桥面比基座高一层。请在桥面高度连接道路或楼梯。标记的支腿或桥台必须由地面或平台支撑。"
zhTW = "橋面比基座高一層。請在橋面高度連接道路或樓梯。地面或平台必須支撐標示的支柱或橋台。"
ruRU = "Настил находится на один уровень выше основания. Подключайте дорожки или лестницы на высоте настила. Земля или платформы должны поддерживать отмеченные стойки или устои."
jaJP = "デッキは基部より1段高い位置にあります。デッキの高さに通路や階段を接続してください。地面またはプラットフォームで、印の付いた脚部や橋台を支える必要があります。"
frFR = "Le tablier se trouve un niveau au-dessus de la base. Reliez des chemins ou des escaliers à la hauteur du tablier. Le sol ou des plateformes doivent soutenir les piliers ou les culées indiqués."
deDE = "Die Fahrbahn liegt eine Ebene über der Basis. Wege oder Treppen auf Fahrbahnhöhe anschließen. Der Boden oder Plattformen müssen die markierten Beine oder Widerlager stützen."
plPL = "Pomost znajduje się o jeden poziom nad podstawą. Połącz ścieżki lub schody na wysokości pomostu. Grunt lub platformy muszą podpierać zaznaczone nogi lub przyczółki."
ptBR = "O tabuleiro fica um nível acima da base. Conecte caminhos ou escadas na altura do tabuleiro. O terreno ou as plataformas devem sustentar as pernas ou os encontros marcados."
koKR = "데크는 지면보다 한 단계 높습니다. 데크 높이에 길이나 계단을 연결하세요. 지면이나 플랫폼이 표시된 다리 또는 교각을 지탱하거나 맞닿아 있어야 합니다."
csCZ = "Mostovka je o jednu úroveň nad základnou. Cesty nebo schody připojte ve výšce mostovky. Terén nebo plošiny musí podpírat označené nohy nebo opěry."
viVN = "Mặt cầu cao hơn phần đế một tầng. Nối đường đi hoặc cầu thang ở độ cao mặt cầu. Mặt đất hoặc các bệ phải đỡ những chân trụ hoặc mố cầu được đánh dấu."
trTR = "Taban tabanının bir seviye üzerindedir. Yolları veya merdivenleri taban yüksekliğine bağlayın. Zemin veya platformlar, işaretli ayakları ya da payandaları desteklemelidir."

["Bridgeworks.Covered.Description"]
status = "normal"
raw = "A roofed timber bridge. Reserves two levels for the deck, posts and roof."
enUS = "A roofed timber bridge. Reserves two levels for the deck, posts, and roof."
zhCN = "带顶的木桥。桥面、立柱和屋顶需要预留两层空间。"
zhTW = "有頂木橋。為橋面、支柱和屋頂預留兩個高度層。"
ruRU = "Крытый деревянный мост. Резервирует два уровня под настил, стойки и крышу."
jaJP = "屋根付きの木製橋。デッキ、支柱、屋根のために2段分を確保します。"
frFR = "Un pont couvert en bois. Il occupe deux niveaux pour le tablier, les poteaux et le toit."
deDE = "Eine überdachte Holzbrücke. Belegt zwei Ebenen für Fahrbahn, Pfosten und Dach."
plPL = "Zadaszony drewniany most. Rezerwuje dwa poziomy na pomost, słupy i dach."
ptBR = "Uma ponte de madeira coberta. Reserva dois níveis para o tabuleiro, os postes e o telhado."
koKR = "지붕이 있는 목재 다리입니다. 갑판, 기둥, 지붕을 위해 2층 높이를 차지합니다."
csCZ = "Zastřešený dřevěný most. Vyhrazuje dvě úrovně pro mostovku, sloupky a střechu."
viVN = "Một cây cầu gỗ có mái che. Dành hai tầng cho mặt cầu, cột và mái."
trTR = "Üstü kapalı ahşap köprü. Döşeme, direkler ve çatı için iki seviye ayırır."

