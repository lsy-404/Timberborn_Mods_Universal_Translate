ruRU = "Декоративный мост со стандартными пешеходными соединениями подвесного моста."
jaJP = "標準的な吊り橋の歩行接続を備えた装飾用の橋。"
frFR = "Un pont décoratif avec des connexions piétonnes standard d’un pont suspendu."
deDE = "Eine dekorative Brücke mit standardmäßigen Gehwegverbindungen einer Hängebrücke."
plPL = "Dekoracyjny most ze standardowymi połączeniami ścieżek jak w moście wiszącym."
