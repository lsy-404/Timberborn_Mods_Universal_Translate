thTH = "สะพานไม้มีหลังคา ใช้พื้นที่สองชั้นสำหรับพื้นสะพาน เสา และหลังคา"
caES = "Un pont de fusta cobert. Reserva dos nivells per al tauler, els pilars i la teulada."
beBY = "Крыты драўляны мост. Адводзіць два ўзроўні пад насціл, слупы і дах."
roRO = "Un pod de lemn acoperit. Rezervă două niveluri pentru punte, stâlpi și acoperiș."
