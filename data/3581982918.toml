["LV.CFun.PointMulDesc"]
raw = "How fast the Need point increases for Attraction buildings.\n1 is the game default, higher is faster (easier), lower is slower (harder)."
status = "normal"
enUS = "How fast the Need point increases for Attraction buildings.\n1 is the game default, higher is faster (easier), lower is slower (harder)."
zhCN = "可以将建筑的影响效率更改为原本的N倍（游戏默认：1）。"
zhTW = "關鍵名稱：LV.CFun.PointMulDesc - 新翻譯文本：“吸引建築物的需求點增加速度。  \n1 是遊戲預設值，數值越高越快（更容易），數值越低越慢（更困難）。”"
ruRU = "Как быстро увеличивается значение потребности для зданий Привлечения.  \n1 - это значение по умолчанию в игре, больше - быстрее (легче), меньше - медленнее (труднее)."
jaJP = "必要ポイントがアトラクション建物のためにどのくらい速く増加するか。\n1はゲームのデフォルトで、高いほど速く（簡単）、低いほど遅く（難しい）なります。"
frFR = "Nom de clé : LV.CFun.PointMulDesc - Nouveau texte à traduire : \"À quel point le point de besoin augmente pour les bâtiments d'attraction. \n1 est la valeur par défaut du jeu, plus c'est élevé, plus c'est rapide (plus facile), plus c'est bas, plus c'est lent (plus difficile).\""
deDE = "Wie schnell der Bedarfspunkt für Anziehungsgebäude steigt. \n1 ist der Standardwert des Spiels, höher ist schneller (einfacher), niedriger ist langsamer (schwieriger)."
plPL = "Jak szybko rośnie punkt potrzeby dla budynków atrakcji. \n1 to domyślny ustawienie w grze, wyższa wartość oznacza szybszy wzrost (łatwiejsze), niższa wartość oznacza wolniejszy wzrost (trudniejsze)."
ptBR = "Quão rápido o ponto de Necessidade aumenta para os edifícios de Atração. 1 é o padrão do jogo, mais alto é mais rápido (mais fácil), mais baixo é mais lento (mais difícil)."
koKR = "매력 건물에 대한 필요 포인트가 증가하는 속도입니다. \n1은 게임 기본값이며, 숫자가 클수록 더 빠르게(더 쉽게) 증가하고, 작을수록 더 느리게(더 어렵게) 증가합니다."
trTR = "Çekim binaları için İhtiyaç puanının ne kadar hızla arttığını gösterir. 1 oyun varsayılanıdır, daha yüksek daha hızlıdır (daha kolay), daha düşük ise daha yavaştır (daha zor)."
esES = "Qué tan rápido aumenta el punto de Necesidad para los edificios de Atracción.\n1 es el valor predeterminado del juego; un valor mayor es más rápido (más fácil), y un valor menor es más lento (más difícil)."
itIT = "Quanto velocemente aumenta il punto di Bisogno per gli edifici di Attrazione.\n1 è il valore predefinito del gioco, un valore più alto è più veloce (più facile), un valore più basso è più lento (più difficile)."
ukUA = "Наскільки швидко зростає потреба в очках для будівель привабливості.\n1 — стандартне значення гри, більше значення означає швидше (легше), менше — повільніше (складніше)."
thTH = "ความเร็วที่ค่าความต้องการเพิ่มขึ้นสำหรับสิ่งปลูกสร้างดึงดูด\n1 คือค่าเริ่มต้นของเกม ค่าสูงกว่าจะเร็วขึ้น (ง่ายขึ้น) ค่าต่ำกว่าจะช้าลง (ยากขึ้น)"
csCZ = "Jak rychle se zvyšuje bod potřeb pro budovy přitažlivosti. 1 je výchozí hodnota hry, vyšší je rychlejší (snazší), nižší je pomalejší (těžší)."
viVN = "Tốc độ tăng điểm nhu cầu cho các công trình thu hút.\n1 là mặc định của trò chơi, càng cao càng nhanh (dễ), càng thấp càng chậm (khó)."
caES = "Amb quina rapidesa augmenta el punt de necessitat dels edificis d'atracció.\n1 és el valor per defecte del joc; un valor més alt és més ràpid (més fàcil), i un valor més baix és més lent (més difícil)."
beBY = "Наколькі хутка павялічваецца паказчык патрэбы для будынкаў прыцягнення.\n1 — гульнявое значэнне па змаўчанні, большае значэнне — хутчэй (лягчэй), меншае — павольней (складаней)."
roRO = "Cât de repede crește punctele de nevoie pentru clădirile de atracție.\n1 este valoarea implicită a jocului; o valoare mai mare este mai rapidă (mai ușoară), iar o valoare mai mică este mai lentă (mai grea)."
huHU = "A Vonzás épületek Igény-pontjainak növekedési sebessége.\nAz 1 a játék alapértéke, a magasabb érték gyorsabb (könnyebb), az alacsonyabb érték lassabb (nehezebb)."
arSA = "كم تزداد سرعة نقطة الحاجة لمباني الجذب.\nالقيمة 1 هي الإعداد الافتراضي للعبة، والقيمة الأعلى تعني زيادة أسرع (أسهل)، والقيمة الأدنى تعني زيادة أبطأ (أصعب)."

