["LV.CFun.CapacityMulDesc"]
raw = "Multiply the capacity of Attraction buildings. Rounded down with minimum 1.\n1 is the game default, higher is more capacity (easier), lower is less capacity (harder).\nFor example, 1.5 means Campfire (default 5 spots) would have 7 spots."
status = "normal"
enUS = "Multiply the capacity of Attraction buildings. Rounded down with minimum 1.\n1 is the game default, higher is more capacity (easier), lower is less capacity (harder).\nFor example, 1.5 means Campfire (default 5 spots) would have 7 spots."
zhCN = "可以将建筑的游客数更改为原本的N倍（游戏默认：1），向下取整且最小为1。"
zhTW = "乘以吸引建築物的容量。向下取整，最低為 1。\n1 是遊戲的預設值，更高則容量更大（更容易），更低則容量更小（更困難）。\n例如，1.5 意味著篝火（預設 5 個位置）將擁有 7 個位置。"
ruRU = "Увеличивает ёмкость зданий Привлечения. Округляется вниз, минимум 1. \n1 — это значение по умолчанию в игре, больше — больше ёмкости (легче), меньше — меньше ёмкости (сложнее). \nНапример, 1.5 означает, что Костёр (по умолчанию 5 мест) будет иметь 7 мест."
jaJP = "キー名: LV.CFun.CapacityMulDesc - 翻訳文: \"アトラクション建物の容量を乗算します。最小1で切り捨て。\n1がゲームのデフォルトで、数字が大きいほど容量が増え（簡単）、小さいほど容量が減ります（難しい）。\n例えば、1.5の場合、キャンプファイヤー（デフォルトの5スポット）は7スポットになります。\""
frFR = "Multipliez la capacité des bâtiments d'attraction. Arrondi à l'inférieur avec un minimum de 1. \n1 est la valeur par défaut du jeu, plus c'est élevé, plus la capacité est grande (plus facile), moins c'est élevé, moins la capacité est grande (plus difficile). \nPar exemple, 1,5 signifie que le feu de camp (valeur par défaut de 5 places) aurait 7 places."
deDE = "Schlüsselname: LV.CFun.CapacityMulDesc - Übersetzung: \"Multipliziere die Kapazität von Attraktionsgebäuden. Abgerundet mit einem Minimum von 1. 1 ist der Standardwert im Spiel, höher bedeutet mehr Kapazität (einfacher), niedriger bedeutet weniger Kapazität (schwieriger). Zum Beispiel bedeutet 1,5, dass das Lagerfeuer (Standard 5 Plätze) 7 Plätze hätte.\""
plPL = "Multiplikuj pojemność budynków atrakcji. Zaokrąglone w dół z minimum 1. \n1 to domyślna wartość w grze, wyższe to większa pojemność (łatwiejsze), niższe to mniejsza pojemność (trudniejsze).\nNa przykład, 1.5 oznacza, że Ognisko (domyślnie 5 miejsc) miałoby 7 miejsc."
ptBR = "Multiplique a capacidade dos edifícios de Atração. Arredondado para baixo com mínimo de 1. \n1 é o padrão do jogo, valores mais altos representam mais capacidade (mais fácil), valores mais baixos representam menos capacidade (mais difícil). \nPor exemplo, 1,5 significa que a Fogueira (padrão de 5 lugares) teria 7 lugares."
koKR = "어트랙션 건물의 용량을 곱합니다. 최소 1로 내림 처리됩니다.  \n1은 게임 기본값이며, 숫자가 높을수록 용량이 증가(쉬움)하고, 숫자가 낮을수록 용량이 감소(어려움)합니다.  \n예를 들어, 1.5는 캠프파이어(기본 5개 자리)가 7개 자리가 됩니다."
trTR = "Çekim binalarının kapasitesini çarp. Minimum 1 ile aşağıya yuvarlanır.\n1, oyunun varsayılanıdır; daha yüksek olan daha fazla kapasite (daha kolay), daha düşük olan daha az kapasite (daha zor) demektir.\nÖrneğin, 1.5, Ateş Çukuru’nun (varsayılan 5 yer) 7 yere sahip olacağı anlamına gelir."
esES = "Multiplica la capacidad de los edificios de Atracción. Se redondea hacia abajo con un mínimo de 1.\n1 es el valor predeterminado del juego; un valor mayor aumenta la capacidad (más fácil), y un valor menor la reduce (más difícil).\nPor ejemplo, 1.5 significa que la Fogata (5 plazas por defecto) tendría 7 plazas."
itIT = "Moltiplica la capacità degli edifici Attrazione. Arrotondato per difetto, con minimo 1.\n1 è il valore predefinito del gioco; valori più alti aumentano la capacità (più facile), valori più bassi la riducono (più difficile).\nAd esempio, 1.5 significa che il Falò (5 posti predefiniti) avrebbe 7 posti."
ukUA = "Помножити місткість будівель притягання. Результат округлюється вниз, мінімум 1.\n1 — це стандартне значення гри, більше значення означає більшу місткість (легше), менше значення означає меншу місткість (складніше).\nНаприклад, 1,5 означає, що Багаття (стандартно 5 місць) матиме 7 місць."
thTH = "คูณความจุของอาคารดึงดูด ปัดลงเป็นจำนวนเต็ม โดยมีค่าต่ำสุดเป็น 1\nค่า 1 คือค่าเริ่มต้นของเกม ค่าที่สูงกว่าหมายถึงความจุมากขึ้น (ง่ายขึ้น) ค่าที่ต่ำกว่าหมายถึงความจุน้อยลง (ยากขึ้น)\nตัวอย่างเช่น ค่า 1.5 หมายความว่า แคมป์ไฟ (ค่าเริ่มต้น 5 ช่อง) จะมี 7 ช่อง"
csCZ = "Násobte kapacitu atrakcí. Zaokrouhleno dolů na minimum 1. \n1 je výchozí hodnota ve hře, vyšší hodnota znamená větší kapacitu (snazší), nižší hodnota znamená menší kapacitu (těžší).\nNapříklad 1.5 znamená, že Ohnisko (výchozích 5 míst) by mělo 7 míst."
viVN = "Nhân hệ số cho sức chứa của các công trình thu hút.\nLàm tròn xuống với tối thiểu là 1.\n1 là mặc định của trò chơi, giá trị cao hơn có nhiều sức chứa hơn (dễ hơn), giá trị thấp hơn có ít sức chứa hơn (khó hơn).\nVí dụ, 1.5 có nghĩa là Campfire (mặc định 5 chỗ) sẽ có 7 chỗ."
caES = "Multiplica la capacitat dels edificis d'Atracció. S'arrodoneix a la baixa amb un mínim de 1.\n1 és el valor per defecte del joc; un valor més alt és més capacitat (més fàcil), i un valor més baix és menys capacitat (més difícil).\nPer exemple, 1,5 faria que la Fogata (5 llocs per defecte) tingués 7 llocs."
beBY = "Памнажае ўмяшчальнасць будынкаў прываблівання. Вынік ակругляецца ўніз, мінімум 1.\n1 — стандартнае значэнне гульні, большае значэнне азначае большую ўмяшчальнасць (лягчэй), меншае — меншую ўмяшчальнасць (складаней).\nНапрыклад, 1,5 азначае, што ў Вогнішчы (стандартна 5 месцаў) будзе 7 месцаў."
roRO = "Înmulțește capacitatea clădirilor de Atracție. Rotunjit în jos, cu minimum 1.\n1 este valoarea implicită a jocului, valorile mai mari înseamnă mai multă capacitate (mai ușor), iar valorile mai mici înseamnă mai puțină capacitate (mai greu).\nDe exemplu, 1,5 înseamnă că Tabăra (5 locuri implicit) ar avea 7 locuri."
huHU = "Szorozza meg a Vonzerő épületek kapacitását. Lefelé kerekítve, minimum 1.\nAz 1 a játék alapértéke, a magasabb érték nagyobb kapacitást jelent (könnyebb), az alacsonyabb érték kisebb kapacitást jelent (nehezebb).\nPéldául az 1,5 azt jelenti, hogy a Tábortűznél (alapértelmezett 5 hely) 7 hely lenne."
arSA = "تُضرب سعة مباني الجذب في هذا العامل. يُقرَّب الناتج إلى الأسفل مع حد أدنى 1.\nالقيمة 1 هي الإعداد الافتراضي للعبة، والقيمة الأعلى تعني سعة أكبر (أسهل)، والقيمة الأدنى تعني سعة أقل (أصعب).\nعلى سبيل المثال، تعني القيمة 1.5 أن نار المخيم (الافتراضي 5 أماكن) ستصبح لها 7 أماكن."

