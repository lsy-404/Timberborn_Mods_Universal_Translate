["LV.CFun.RangeMulDesc"]
raw = "Multiply the range of Attraction buildings. Rounded down with minimum 1.\n1 is the game default, higher is more range (easier), lower is less range (harder).\nFor example, 1.5 means Farmer Monument (default 7 tiles range) would have 10 tiles range."
status = "normal"
enUS = "Multiply the range of Attraction buildings. Rounded down with minimum 1.\n1 is the game default, higher is more range (easier), lower is less range (harder).\nFor example, 1.5 means Farmer Monument (default 7 tiles range) would have 10 tiles range."
zhCN = "可以将建筑的影响范围更改为原本的N倍（游戏默认：1），向下取整且最小为1。"
zhTW = "關鍵名稱：LV.CFun.RangeMulDesc - 新文本翻譯：\"增加吸引建築的範圍。向下取整，最小為1。 1是遊戲的默認值，更高代表範圍更大（更容易），更低則代表範圍更小（更困難）。例如，1.5意味著農民紀念碑（默認範圍為7個格子）將有10個格子的範圍。\""
ruRU = "Увеличивает диапазон зданий Привлечения. Округляется вниз до 1.\n1 - это значение по умолчанию в игре, больше - больший диапазон (легче), меньше - меньший диапазон (сложнее).\nНапример, 1.5 означает, что Памятник Фермера (по умолчанию 7 клеток диапазона) будет иметь диапазон в 10 клеток."
jaJP = "「アトラクション建物の範囲を乗算します。最小1に切り捨てられます。 1はゲームのデフォルトで、数値が高いほど範囲が広く（簡単）、低いほど範囲が狭く（難しい）なります。例えば、1.5の場合、農夫記念碑（デフォルトの範囲7タイル）は10タイルの範囲になります。」"
frFR = "Multipliez la portée des bâtiments d'Attraction. Arrondi à l'inférieur avec un minimum de 1. \n1 est la valeur par défaut du jeu, plus c'est élevé, plus la portée est grande (plus facile), moins c'est élevé, moins la portée est grande (plus difficile). \nPar exemple, 1,5 signifie que le Monument des Agriculteurs (portée par défaut de 7 tuiles) aurait une portée de 10 tuiles."
deDE = "Multipliziere den Bereich von Attraktionsgebäuden. Nach unten gerundet mit minimal 1.\n1 ist der Spiele-Standard, höher bedeutet mehr Reichweite (einfacher), niedriger bedeutet weniger Reichweite (schwieriger).\nZum Beispiel bedeutet 1,5, dass das Farmer-Denkmal (Standardreichweite 7 Fliesen) eine Reichweite von 10 Fliesen hätte."
plPL = "Pomnóż zasięg budynków przyciągających. Zaokrąglone w dół z minimalną wartością 1.  \n1 to domyślna wartość w grze, wyższa oznacza większy zasięg (łatwiej), niższa oznacza mniejszy zasięg (trudniej).  \nNa przykład 1,5 oznacza, że Pomnik Rolnika (domyślny zasięg 7 płytek) miałby zasięg 10 płytek."
ptBR = "Multiplique o alcance dos edifícios de Atração. Arredondado para baixo com mínimo de 1.\n1 é o valor padrão do jogo, valores mais altos significam mais alcance (mais fácil), valores mais baixos significam menos alcance (mais difícil).\nPor exemplo, 1,5 significa que o Monumento do Agricultor (alcance padrão de 7 tiles) teria 10 tiles de alcance."
koKR = "매력 건물의 범위를 곱합니다. 최소 1로 내림 처리됩니다. \n1은 게임 기본값이며, 더 높을수록 범위가 늘어나고(더 쉬움), 더 낮을수록 범위가 줄어듭니다(더 어려움). \n예를 들어, 1.5는 농부 기념비(기본 7타일 범위)가 10타일 범위를 가지게 됨을 의미합니다."
trTR = "Çekim binalarının menzilini çarpan. Minimum 1 ile aşağı yuvarlanır. \n1 oyunun varsayılanıdır, daha yüksek daha fazla menzil (daha kolay), daha düşük daha az menzil (daha zor) demektir. \nÖrneğin, 1.5, Çiftçi Anıtı'nın (varsayılan 7 karolar menzil) 10 karoya sahip olacağı anlamına gelir."
esES = "Multiplica el alcance de los edificios de Atracción. Redondeado hacia abajo, con un mínimo de 1.\n1 es el valor predeterminado del juego; un valor mayor aumenta el alcance (más fácil) y un valor menor lo reduce (más difícil).\nPor ejemplo, 1,5 significa que el Monumento al Granjero (alcance predeterminado de 7 casillas) tendría un alcance de 10 casillas."
itIT = "Moltiplica il raggio degli edifici di Attrazione. Arrotondato per difetto, con minimo 1.\n1 è il valore predefinito del gioco, un valore più alto dà più raggio (più facile), un valore più basso dà meno raggio (più difficile).\nAd esempio, 1.5 fa sì che il Monumento del Contadino (raggio predefinito di 7 riquadri) abbia un raggio di 10 riquadri."
ukUA = "Помножити радіус дії будівель притягання. Результат округлюється вниз, мінімум 1.\n1 — стандартне значення гри, більше значення означає більший радіус (легше), менше значення означає менший радіус (важче).\nНаприклад, 1.5 означає, що пам'ятник фермеру (стандартний радіус 7 клітинок) матиме радіус 10 клітинок."
thTH = "คูณระยะของอาคารดึงดูด ปัดเศษลงโดยมีค่าต่ำสุดเป็น 1\n1 คือค่าเริ่มต้นของเกม ยิ่งสูงยิ่งมีระยะมาก (ง่ายขึ้น) ยิ่งต่ำยิ่งมีระยะน้อย (ยากขึ้น)\nตัวอย่างเช่น 1.5 หมายความว่า อนุสาวรีย์ชาวไร่ (ระยะเริ่มต้น 7 ช่อง) จะมีระยะ 10 ช่อง"
csCZ = "Násobte dosah budov přitažlivosti. Zaokrouhluje se dolů, minimálně 1. 1 je výchozí hodnota ve hře, vyšší znamená větší dosah (snazší), nižší znamená menší dosah (těžší). Například 1,5 znamená, že Monument farmáře (výchozí dosah 7 bloků) by měl dosah 10 bloků."
viVN = "Nhân rộng phạm vi của các công trình thu hút. Làm tròn xuống với tối thiểu 1.\n1 là mặc định của trò chơi, phạm vi càng lớn (dễ hơn), phạm vi càng nhỏ (khó hơn).\nVí dụ, 1.5 có nghĩa là Tượng đài Nông dân (phạm vi mặc định 7 ô) sẽ có phạm vi 10 ô."
caES = "Multiplica el rang dels edificis d'Atracció. Arrodonit a la baixa, amb un mínim de 1.\n1 és el valor per defecte del joc; un valor més alt és més rang (més fàcil), un valor més baix és menys rang (més difícil).\nPer exemple, 1,5 vol dir que el Monument del Granjer (rang per defecte de 7 caselles) tindria un rang de 10 caselles."
beBY = "Памнажае радыус дзеяння будынкаў прыцягнення. Вынік акругляецца ўніз, мінімальнае значэнне — 1.\n1 — стандартнае значэнне гульні, большае значэнне дае большы радыус (лягчэй), меншае — меншы радыус (складаней).\nНапрыклад, 1,5 азначае, што Помнік фермеру (стандартны радыус 7 клетак) будзе мець радыус 10 клетак."
roRO = "Înmulțește raza clădirilor de Atracție. Rezultatul este rotunjit în jos, cu minimum 1.\n1 este valoarea implicită a jocului, valorile mai mari înseamnă rază mai mare (mai ușor), valorile mai mici înseamnă rază mai mică (mai greu).\nDe exemplu, 1,5 înseamnă că Monumentul Fermierului (rază implicită de 7 plăci) ar avea o rază de 10 plăci."
huHU = "Szorozza meg a Vonzás épületek hatótávolságát. Lefelé kerekítve, minimum 1.\nAz 1 a játék alapértéke, a magasabb érték nagyobb hatótávolságot jelent (könnyebb), az alacsonyabb érték kisebb hatótávolságot jelent (nehezebb).\nPéldául az 1,5 azt jelenti, hogy a Farmer emlékmű (alapértelmezett 7 csempe hatótávolság) 10 csempe hatótávolságot kap."
arSA = "اضرب نطاق مباني الجذب. يُقرَّب الناتج للأسفل مع حد أدنى 1.\n1 هو الإعداد الافتراضي للعبة، والقيمة الأعلى تعني نطاقاً أكبر (أسهل)، والقيمة الأدنى تعني نطاقاً أقل (أصعب).\nعلى سبيل المثال، القيمة 1.5 تعني أن نصب Farmer Monument (النطاق الافتراضي 7 بلاطات) سيكون نطاقه 10 بلاطات."

