["LV.TPi.HorizontalPipeValveDesc"]
status = "normal"
raw = "A one-way straight pipe. Can be closed both ways when paused. Point a directed end at a building to pour into it or draw from it. Select the valve and opt in Fill or Extract."
enUS = "A one-way straight pipe. Can be closed in both directions when paused. Point a directed end at a building to pour into it or draw from it. Select the valve and choose Fill or Extract."
zhCN = "单向直管。暂停时可双向关闭。将有向端对准建筑，即可向其注入液体或从中抽取液体。选中阀门并选择“注入”或“抽取”。"
zhTW = "單向直管。暫停時可雙向關閉。將有方向性的一端朝向建築物，即可向其中注入或從中抽取液體。選取閥門，選擇「注入」或「抽取」。"
ruRU = "Прямая труба с односторонним потоком. На паузе её можно перекрыть в обоих направлениях. Направьте её конец на здание, чтобы подавать в него жидкость или забирать её. Выберите клапан и включите режим «Заполнение» или «Откачка»."
jaJP = "一方向の直管。ポーズ中は両方向に閉じられます。矢印の先を建物に向けると、そこへ注水するか、そこから取水します。バルブを選択し、「注水」または「取水」を選んでください。"
frFR = "Un tuyau droit à sens unique. Peut être fermé dans les deux sens lorsqu'il est en pause. Orientez une extrémité avec une flèche vers un bâtiment pour y déverser ou en tirer du liquide. Sélectionnez la vanne et choisissez Remplir ou Extraire."
deDE = "Ein gerades Einwegrohr. Kann im Pausenmodus in beide Richtungen geschlossen werden. Richte ein Ende mit Flussrichtung auf ein Gebäude, um Flüssigkeit hineinzuleiten oder daraus abzuziehen. Wähle das Ventil aus und entscheide dich für „Füllen“ oder „Entnehmen“."
plPL = "Jednokierunkowa prosta rura. Po wstrzymaniu można ją zamknąć w obu kierunkach. Skieruj końcówkę do budynku, aby napełnić go lub pobierać z niego płyn. Zaznacz zawór i wybierz opcję Napełnianie lub Pobieranie."
ptBR = "Um cano reto de sentido único. Pode ser fechado nos dois sentidos quando pausado. Aponte uma extremidade direcionada para uma construção para despejar nela ou retirar dela. Selecione a válvula e escolha Encher ou Extrair."
koKR = "한 방향으로만 흐르는 직선 파이프입니다. 일시 정지하면 양방향을 모두 닫을 수 있습니다. 방향이 표시된 끝을 건물 쪽으로 향하게 하면 건물에 액체를 붓거나 건물에서 액체를 끌어올 수 있습니다. 밸브를 선택하고 채우기 또는 추출을 선택하세요."
csCZ = "Jednosměrná rovná trubka. Při pozastavení ji lze uzavřít v obou směrech. Nasměrujte její konec k budově, abyste do ní mohli kapalinu napouštět nebo z ní čerpat. Vyberte ventil a zvolte Naplnit nebo Odebírat."
viVN = "Một đường ống thẳng một chiều. Có thể đóng cả hai chiều khi tạm dừng. Hướng một đầu có mũi tên về phía công trình để bơm nước vào hoặc lấy nước ra khỏi đó. Chọn van rồi chọn Nạp hoặc Rút."
trTR = "Tek yönlü düz bir boru. Duraklatıldığında iki yönde de kapatılabilir. İçine sıvı doldurmak veya sıvı çekmek için yönlü ucunu bir binaya doğru çevirin. Vanayı seçip Doldur veya Çek seçeneklerinden birini belirleyin."

