status = "normal"
enUS = "How quickly connected pipes equalize. Higher values move liquid faster. Default: 0.8."
zhCN = "相连管道中液体达到平衡的速度。数值越高，液体流动越快。默认值为 0.8。"
zhTW = "連接的管道平衡液體的速度。數值越高，液體流動越快。預設值為 0.8。"
