["LV.TPi.ModUpdate113000"]
raw = "v11.3.0:\n- Added Horizontal and Vertical T Junctions. Thanks to the contribution of idmytro.\n- Fixed Tank panel showing up during construction and show the wrong 'liquid' (visual bug).\n- Fixed hitboxes for pipes.\n- Vertical pieces should now occupy Bottom and Path slot."
status = "abandoned"
enUS = "v11.3.0:\n- Added horizontal and vertical T-junctions. Thanks to idmytro for the contribution.\n- Fixed a visual bug where the tank panel appeared during construction and showed the wrong “liquid.”\n- Fixed pipe hitboxes.\n- Vertical pieces should now occupy the Bottom and Path slots."
zhCN = "v11.3.0：\n- 新增水平和垂直 T 型接头。感谢 idmytro 的贡献。\n- 修复了建造期间出现水箱面板并显示错误“液体”的问题（视觉错误）。\n- 修复了管道的碰撞框。\n- 垂直部件现在应占用底部和路径槽位。"
zhTW = "v11.3.0：\n- 新增水平與垂直 T 字形接頭。感謝 idmytro 的貢獻。\n- 修正建造期間出現水槽面板並顯示錯誤「液體」的問題（視覺錯誤）。\n- 修正管道的碰撞箱。\n- 垂直零件現在應會佔用底部和路徑欄位。"
ruRU = "v11.3.0:\n- Добавлены горизонтальные и вертикальные Т-образные соединения. Спасибо idmytro за вклад.\n- Исправлено отображение панели резервуара во время строительства и неверной «жидкости» в ней (визуальный баг).\n- Исправлены хитбоксы труб.\n- Вертикальные элементы теперь должны занимать слоты «Нижняя часть» и «Дорожка»."
jaJP = "v11.3.0：\n- 水平T字路と垂直T字路を追加。貢献してくれたidmytroに感謝します。\n- 建設中にタンクのパネルが表示され、誤った「液体」が表示される問題（視覚的な不具合）を修正。\n- パイプの当たり判定を修正。\n- 垂直パーツが「底部」と「通路」のスロットを占有するようになりました。"
frFR = "v11.3.0 :\n- Ajout de raccords en T horizontaux et verticaux. Merci à idmytro pour sa contribution.\n- Correction de l’affichage du panneau du réservoir pendant la construction, qui indiquait le mauvais « liquide » (bug visuel).\n- Correction des zones de collision des tuyaux.\n- Les éléments verticaux devraient désormais occuper les emplacements inférieur et chemin."
deDE = "v11.3.0:\n- Horizontale und vertikale T-Stücke hinzugefügt. Vielen Dank für den Beitrag von idmytro.\n- Behoben: Das Tank-Fenster wurde während des Baus angezeigt und zeigte die falsche „Flüssigkeit“ an (visueller Fehler).\n- Hitboxen für Rohre behoben.\n- Vertikale Teile belegen jetzt den unteren und den Pfad-Slot."
plPL = "v11.3.0:\n- Dodano poziome i pionowe trójniki. Podziękowania za wkład dla idmytro.\n- Naprawiono błąd wizualny powodujący wyświetlanie panelu zbiornika podczas budowy oraz niewłaściwej „cieczy”.\n- Naprawiono obszary trafienia rur.\n- Elementy pionowe powinny teraz zajmować slot dolny i slot ścieżki."
ptBR = "v11.3.0:\n- Adicionados entroncamentos em T horizontais e verticais. Agradecemos a contribuição de idmytro.\n- Corrigido um erro visual que fazia o painel do tanque aparecer durante a construção e exibir o “líquido” errado.\n- Corrigidas as áreas de colisão dos canos.\n- Agora, as peças verticais devem ocupar o espaço inferior e o espaço de caminho."
koKR = "v11.3.0:\n- 수평 및 수직 T자 연결부가 추가되었습니다. 기여해 주신 idmytro님께 감사드립니다.\n- 건설 중에 탱크 패널이 표시되고 잘못된 ‘액체’가 표시되던 시각적 버그를 수정했습니다.\n- 파이프의 히트박스를 수정했습니다.\n- 이제 수직 부품은 바닥 및 경로 슬롯을 차지해야 합니다."
csCZ = "v11.3.0:\n- Přidána horizontální a vertikální T-křižovatka. Děkujeme idmytrovi za příspěvek.\n- Opraveno zobrazování panelu nádrže během výstavby a zobrazování nesprávné „kapaliny“ (vizuální chyba).\n- Opraveny hitboxy potrubí.\n- Vertikální díly by nyní měly zabírat sloty „Dno“ a „Cesta“."
viVN = "v11.3.0:\n- Đã thêm các chỗ nối chữ T nằm ngang và thẳng đứng. Cảm ơn idmytro đã đóng góp.\n- Đã sửa lỗi bảng của Bể chứa xuất hiện trong lúc xây dựng và hiển thị sai «chất lỏng» (lỗi hình ảnh).\n- Đã sửa vùng va chạm của các đường ống.\n- Các đoạn thẳng đứng giờ sẽ chiếm ô Đáy và ô Lối đi."
trTR = "v11.3.0:\n- Yatay ve Dikey T Kavşakları eklendi. Katkısı için idmytro'ya teşekkürler.\n- İnşaat sırasında Tank panelinin görünmesi ve yanlış “sıvıyı” göstermesi (görsel hata) düzeltildi.\n- Boruların çarpışma alanları düzeltildi.\n- Dikey parçalar artık Alt ve Yol yuvasını kaplamalı."
