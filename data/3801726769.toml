["LV.TPi.HorizontalPipeValveDesc"]
raw = "A one-way straight pipe. Can be closed both ways when paused. Point a directed end at a building to pour into it or draw from it. Select the valve and opt in Fill or Extract."
status = "normal"
enUS = "A one-way straight pipe. Can be closed in both directions when paused. Point a directed end at a building to pour into it or draw from it. Select the valve and opt in to Fill or Extract."
zhCN = "单向直管。暂停时可双向关闭。将带方向的一端对准建筑，即可向其中注入或从中抽取。选中阀门，然后选择“注入”或“抽取”。"
zhTW = "單向直管。暫停時可雙向關閉。將有方向的一端朝向建築物，即可向其注入或從中抽取。選取閥門，然後選擇「注水」或「抽取」。"
ruRU = "Односторонняя прямая труба. В режиме паузы её можно закрыть в обоих направлениях. Направьте конец со стрелкой на здание, чтобы заполнять его или забирать из него жидкость. Выберите клапан и включите режим «Заполнение» или «Извлечение»."
jaJP = "一方向の直管です。一時停止中は両方向に閉じることができます。矢印のある端を建物に向けると、そこに注水するか、そこから水を引き出します。バルブを選択し、「注水」または「抽出」を選んでください。"
frFR = "Un tuyau droit à sens unique. Peut être fermé dans les deux sens lorsqu’il est en pause. Orientez une extrémité dirigée vers un bâtiment pour y déverser ou en extraire du liquide. Sélectionnez la vanne et choisissez Remplir ou Extraire."
deDE = "Ein gerades Einwegrohr. Kann im pausierten Zustand in beide Richtungen geschlossen werden. Richte ein gerichtetes Ende auf ein Gebäude, um Flüssigkeit hineinzuleiten oder daraus zu entnehmen. Wähle das Ventil aus und entscheide dich für Füllen oder Entnehmen."
plPL = "Jednokierunkowa prosta rura. Po wstrzymaniu można ją zamknąć z obu stron. Skieruj końcówkę w stronę budynku, aby wlewać do niego lub pobierać z niego ciecz. Zaznacz zawór i wybierz „Napełnianie” lub „Pobieranie”."
ptBR = "Um cano reto unidirecional. Pode ser fechado nos dois sentidos quando pausado. Aponte uma extremidade direcionada para uma construção para despejar nela ou retirar dela. Selecione a válvula e escolha Encher ou Extrair."
koKR = "한쪽 방향으로 흐르는 직선형 파이프입니다. 일시 정지하면 양방향 모두 닫을 수 있습니다. 방향이 표시된 끝을 건물 쪽으로 향하게 하면 건물에 액체를 붓거나 건물에서 액체를 끌어올 수 있습니다. 밸브를 선택하고 채우기 또는 추출을 선택하세요."
csCZ = "Jednosměrná rovná trubka. Po pozastavení ji lze uzavřít v obou směrech. Nasměrujte konec trubky na budovu, aby do ní kapalina vtékala nebo z ní vytékala. Vyberte ventil a zvolte Plnění nebo Odběr."
viVN = "Một đường ống thẳng một chiều. Có thể đóng cả hai chiều khi tạm dừng. Hướng đầu có mũi tên vào một công trình để bơm chất lỏng vào đó hoặc hút chất lỏng ra. Chọn van rồi chọn Nạp đầy hoặc Hút ra."
trTR = "Tek yönlü düz boru. Duraklatıldığında iki yönde de kapatılabilir. İçine sıvı aktarmak veya sıvı çekmek için yönlü ucunu bir binaya doğrultun. Vanayı seçip Doldur veya Çek seçeneğini etkinleştirin."

