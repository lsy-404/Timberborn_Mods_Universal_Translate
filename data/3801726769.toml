["LV.TPi.ModUpdate113000"]
status = "normal"
raw = "v11.3.0:\n- Added Horizontal and Vertical T Junctions. Thanks to the contribution of idmytro.\n- Fixed Tank panel showing up during construction and show the wrong 'liquid' (visual bug).\n- Fixed hitboxes for pipes.\n- Vertical pieces should now occupy Bottom and Path slot."
enUS = "v11.3.0:\n- Added horizontal and vertical T-junctions. Thanks to idmytro for the contribution.\n- Fixed a visual bug where the Tank panel appeared during construction and showed the wrong “liquid.”\n- Fixed pipe hitboxes.\n- Vertical pieces should now occupy the Bottom and Path slots."
zhCN = "v11.3.0：\n- 新增水平和垂直 T 形三通。感谢 idmytro 的贡献。\n- 修复了建造期间显示储液罐面板且显示错误“液体”的问题（视觉错误）。\n- 修复了管道的碰撞箱。\n- 垂直部件现在应占用底部和道路槽位。"
zhTW = "v11.3.0：\n- 新增水平和垂直 T 型接頭。感謝 idmytro 的貢獻。\n- 修正建造期間出現儲液槽面板並顯示錯誤「液體」的問題（視覺錯誤）。\n- 修正管道的點擊判定範圍。\n- 垂直組件現在應會占用底部和道路欄位。"
ruRU = "v11.3.0:\n- Добавлены горизонтальные и вертикальные Т-образные соединения. Спасибо idmytro за вклад.\n- Исправлено отображение панели резервуара во время строительства и неверной «жидкости» на ней (визуальная ошибка).\n- Исправлены хитбоксы труб.\n- Теперь вертикальные элементы должны занимать слоты «Низ» и «Путь»."
jaJP = "v11.3.0：\n- 横型および縦型のT字ジャンクションを追加。idmytroの貢献に感謝します。\n- 建設中にタンクのパネルが表示され、誤った「液体」が表示される問題を修正（視覚上の不具合）。\n- パイプの当たり判定を修正。\n- 縦型パーツが「底部」と「通路」のスロットを占有するようになりました。"
frFR = "v11.3.0 :\n- Ajout de jonctions en T horizontales et verticales. Merci à idmytro pour sa contribution.\n- Correction de l'affichage du panneau du réservoir pendant la construction, qui montrait le mauvais « liquide » (bug visuel).\n- Correction des zones de collision des tuyaux.\n- Les éléments verticaux devraient désormais occuper les emplacements inférieur et de chemin."
deDE = "v11.3.0:\n- Horizontale und vertikale T-Stücke hinzugefügt. Vielen Dank für den Beitrag von idmytro.\n- Behoben: Das Tankfenster wurde während des Baus angezeigt und zeigte die falsche „Flüssigkeit“ an (Grafikfehler).\n- Hitboxen für Rohre korrigiert.\n- Vertikale Teile sollten nun den Boden- und Weg-Slot belegen."
plPL = "v11.3.0:\n- Dodano poziome i pionowe trójniki. Podziękowania dla idmytro za wkład.\n- Naprawiono błąd wizualny powodujący wyświetlanie panelu zbiornika podczas budowy i pokazywanie niewłaściwej „cieczy”.\n- Naprawiono obszary zaznaczania rur.\n- Elementy pionowe powinny teraz zajmować slot dolny i slot ścieżki."
ptBR = "v11.3.0:\n- Adicionadas junções em T horizontais e verticais. Agradecemos a contribuição de idmytro.\n- Corrigido o painel do tanque, que aparecia durante a construção e exibia o “líquido” errado (erro visual).\n- Corrigidas as áreas de interação dos canos.\n- As peças verticais agora devem ocupar os espaços Inferior e Caminho."
koKR = "v11.3.0:\n- 수평 및 수직 T자 연결부를 추가했습니다. 기여해 주신 idmytro님께 감사드립니다.\n- 건설 중에 탱크 패널이 표시되고 잘못된 '액체'가 보이던 시각적 버그를 수정했습니다.\n- 파이프의 히트박스를 수정했습니다.\n- 이제 수직 부품은 바닥 및 경로 슬롯을 차지해야 합니다."
csCZ = "v11.3.0:\n- Přidána vodorovná a svislá T-křížení. Děkujeme idmytro za příspěvek.\n- Opraveno zobrazování panelu nádrže během výstavby a nesprávné „kapaliny“ (vizuální chyba).\n- Opraveny kolizní oblasti potrubí.\n- Svislé díly by nyní měly zabírat sloty „Spodní“ a „Cesta“."
viVN = "v11.3.0:\n- Đã thêm các nhánh chữ T nằm ngang và thẳng đứng. Cảm ơn idmytro đã đóng góp.\n- Đã sửa lỗi bảng điều khiển của bể chứa xuất hiện trong lúc xây dựng và hiển thị sai “chất lỏng” (lỗi hình ảnh).\n- Đã sửa vùng va chạm của các đường ống.\n- Các đoạn thẳng đứng giờ sẽ chiếm ô Đáy và ô Đường đi."
trTR = "v11.3.0:\n- Yatay ve Dikey T Kavşakları eklendi. Katkısı için idmytro'ya teşekkürler.\n- İnşaat sırasında Tank panelinin görünmesine ve yanlış “sıvıyı” göstermesine neden olan görsel hata düzeltildi.\n- Boruların çarpışma kutuları düzeltildi.\n- Dikey parçalar artık Alt ve Yol yuvalarını kaplamalı."

