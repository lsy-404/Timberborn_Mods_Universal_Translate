["LV.TPi.ElbowPipeValveDesc"]
raw = "A one-way 90° pipe. Can be closed both ways when paused. Point a directed end at a building to pour into it or draw from it. Select the valve and opt in Fill or Extract."
status = "normal"
enUS = "A one-way 90° pipe. Can be closed in both directions when paused. Point a directed end at a building to pour into it or draw from it. Select the valve and choose Fill or Extract."
zhCN = "单向 90° 管道。暂停时可关闭两个方向。将带有方向的一端对准建筑，即可向其中注入或从中抽取液体。选中阀门并选择“注入”或“抽取”。"
zhTW = "單向 90° 管道。暫停時可雙向關閉。將有方向的一端對準建築物，即可向其注入或從中抽取液體。選取閥門，選擇「注入」或「抽取」。"
ruRU = "Односторонняя труба с изгибом на 90°. На паузе её можно закрыть в обоих направлениях. Направьте конец трубы на здание, чтобы подавать в него жидкость или забирать её. Выберите клапан и укажите режим «Заполнение» или «Откачка»."
jaJP = "一方向の90°パイプ。ポーズ中は両方向に閉じることができます。向きのある端を建物に向けると、そこに注水するか、そこから汲み出します。バルブを選択し、「注水」または「汲み出し」を選んでください。"
frFR = "Un tuyau unidirectionnel à 90°. Peut être fermé dans les deux sens lorsqu’il est en pause. Dirigez une extrémité orientée vers un bâtiment pour y déverser du liquide ou en puiser. Sélectionnez la vanne et choisissez Remplir ou Extraire."
deDE = "Ein Einwegrohr mit 90°-Winkel. Kann im pausierten Zustand in beide Richtungen geschlossen werden. Richte ein Ende mit Fließrichtung auf ein Gebäude, um Flüssigkeit hineinzuleiten oder daraus zu entnehmen. Wähle das Ventil aus und entscheide dich für Füllen oder Entnehmen."
plPL = "Jednokierunkowa rura 90°. Po wstrzymaniu można ją zamknąć z obu stron. Skieruj zakończenie w stronę budynku, aby wlewać do niego ciecz lub ją z niego pobierać. Wybierz zawór i zdecyduj, czy ma napełniać, czy pobierać."
ptBR = "Um cano unidirecional de 90°. Pode ser fechado nos dois sentidos quando pausado. Aponte uma extremidade direcionada para um edifício para despejar nele ou retirar líquido dele. Selecione a válvula e escolha Encher ou Extrair."
koKR = "한쪽 방향으로만 흐르는 90° 파이프입니다. 일시 정지하면 양방향으로 닫을 수 있습니다. 방향이 표시된 끝을 건물 쪽으로 향하게 하면 건물에 액체를 넣거나 건물에서 끌어올 수 있습니다. 밸브를 선택하고 채우기 또는 추출을 선택하세요."
csCZ = "Jednosměrná trubka s úhlem 90°. Při pozastavení ji lze uzavřít v obou směrech. Namiřte její směrovaný konec na budovu, chcete-li do ní vodu přivádět nebo z ní vodu čerpat. Vyberte ventil a zvolte Plnění nebo Čerpání."
viVN = "Một đường ống một chiều góc 90°. Có thể đóng cả hai chiều khi tạm dừng. Hướng đầu có mũi tên vào một công trình để bơm nước vào hoặc hút nước ra từ đó. Chọn van và chọn Nạp hoặc Hút."
trTR = "Tek yönlü 90° boru. Duraklatıldığında iki yönde de kapatılabilir. İçine sıvı aktarmak veya sıvı çekmek için yönlü ucunu bir binaya doğrultun. Vanayı seçip Doldurma veya Çekme modunu seçin."

