plPL = "Jak szybko połączone rury wyrównują poziom cieczy. Wyższe wartości przyspieszają przepływ cieczy. Domyślnie: 0.8."
ptBR = "A rapidez com que os canos conectados igualam os níveis. Valores mais altos movem o líquido mais rápido. Padrão: 0.8."
koKR = "연결된 파이프의 액체가 얼마나 빠르게 균등해지는지를 설정합니다. 값이 높을수록 액체가 더 빠르게 이동합니다. 기본값 0.8."
csCZ = "Jak rychle se propojené potrubí vyrovnávají. Vyšší hodnoty přesouvají kapalinu rychleji. Výchozí hodnota: 0.8."
viVN = "Tốc độ cân bằng của các đường ống được kết nối. Giá trị cao hơn giúp chất lỏng di chuyển nhanh hơn. Mặc định là 0.8."
trTR = "Bağlı borulardaki sıvıların ne kadar hızlı dengelendiği. Daha yüksek değerler sıvıyı daha hızlı taşır. Varsayılan: 0.8."

