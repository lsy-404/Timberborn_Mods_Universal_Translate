["LV.TPi.HorizontalPipeThrottleFlavor"]
raw = "When asked why it costs so much when it looks exactly like a One-way Valve, they said R&D isn't cheap."
status = "normal"
enUS = "When asked why it costs so much when it looks exactly like a One-way Valve, they said R&D isn't cheap."
zhCN = "有人问他们，为什么这东西看起来和单向阀一模一样，价格却这么贵。他们说，研发可不便宜。"
zhTW = "有人問他們，這東西看起來明明跟單向閥一模一樣，為什麼還這麼貴，他們說研發可不便宜。"
ruRU = "Когда их спросили, почему это стоит так дорого, если выглядит точь-в-точь как обратный клапан, они ответили, что исследования и разработки обходятся недёшево."
jaJP = "見た目は一方通行バルブとまったく同じなのに、なぜこんなに高いのかと尋ねたところ、研究開発は安くないと言われた。"
frFR = "Quand on leur a demandé pourquoi cela coûtait si cher alors que cela ressemblait exactement à une vanne à sens unique, ils ont répondu que la R&D ne coûtait pas rien."
deDE = "Als man sie fragte, warum sie so viel kostet, obwohl sie genau wie ein Einwegventil aussieht, sagten sie, dass Forschung und Entwicklung nicht billig seien."
plPL = "Zapytani, dlaczego to tyle kosztuje, skoro wygląda dokładnie jak zawór jednokierunkowy, odpowiedzieli, że badania i rozwój nie są tanie."
ptBR = "Quando perguntaram por que custa tanto se parece exatamente com uma válvula de sentido único, disseram que pesquisa e desenvolvimento não sai barato."
koKR = "왜 겉보기엔 일방향 밸브와 똑같은데 이렇게 비싸냐고 묻자, 연구 개발은 공짜가 아니라고 답했다."
csCZ = "Když se jich zeptali, proč to stojí tolik, když to vypadá přesně jako jednosměrný ventil, řekli, že výzkum a vývoj není levná záležitost."
viVN = "Khi được hỏi vì sao nó lại đắt đến vậy trong khi trông y hệt một Van một chiều, họ nói rằng nghiên cứu và phát triển đâu có rẻ."
trTR = "Görünüşü birebir Tek Yönlü Vana'ya benzediği hâlde neden bu kadar pahalı olduğu sorulunca, Ar-Ge'nin ucuz olmadığını söylediler."

