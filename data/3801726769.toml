["LV.TPi.EqualizeKDesc"]
raw = "How quickly connected pipes even out. Higher values move liquid faster. Default 0.8."
status = "normal"
enUS = "How quickly connected pipes equalize. Higher values move liquid faster. Default: 0.8."
zhCN = "相连管道中液体达到平衡的速度。数值越高，液体流动越快。默认值为 0.8。"
zhTW = "連接的管道平衡液體的速度。數值越高，液體流動越快。預設值為 0.8。"
ruRU = "С какой скоростью соединённые трубы выравнивают уровень жидкости. Чем выше значение, тем быстрее движется жидкость. По умолчанию: 0.8."
jaJP = "接続されたパイプ内の液体が均等になる速さ。値が大きいほど、液体の移動が速くなります。デフォルトは0.8。"
frFR = "Vitesse à laquelle les tuyaux connectés égalisent leur niveau. Des valeurs plus élevées font circuler le liquide plus vite. Valeur par défaut : 0.8."
deDE = "Wie schnell verbundene Rohre den Flüssigkeitsstand ausgleichen. Höhere Werte lassen Flüssigkeit schneller fließen. Standardwert: 0.8."
plPL = "Jak szybko połączone rury wyrównują poziom cieczy. Wyższe wartości przyspieszają przepływ cieczy. Domyślnie: 0.8."
ptBR = "A rapidez com que os canos conectados igualam os níveis. Valores mais altos movem o líquido mais rápido. Padrão: 0.8."
koKR = "연결된 파이프의 액체가 얼마나 빠르게 균등해지는지를 설정합니다. 값이 높을수록 액체가 더 빠르게 이동합니다. 기본값 0.8."
trTR = "Bağlı borulardaki sıvıların ne kadar hızlı dengelendiği. Daha yüksek değerler sıvıyı daha hızlı taşır. Varsayılan: 0.8."
esES = "Qué tan rápido se igualan los tubos conectados. Valores más altos mueven el líquido más rápido. Predeterminado 0.8."
itIT = "Quanto rapidamente si equalizzano i tubi collegati. Valori più alti spostano il liquido più velocemente. Predefinito 0.8."
ukUA = "Наскільки швидко вирівнюються з'єднані труби. Вищі значення переміщують рідину швидше. За замовчуванням 0,8."
thTH = "ความเร็วที่ท่อที่เชื่อมต่อกันปรับระดับของเหลวให้เท่ากัน ค่าที่สูงกว่าทำให้ของเหลวเคลื่อนที่เร็วขึ้น ค่าเริ่มต้นคือ 0.8"
csCZ = "Jak rychle se propojené potrubí vyrovnávají. Vyšší hodnoty přesouvají kapalinu rychleji. Výchozí hodnota: 0.8."
viVN = "Tốc độ cân bằng của các đường ống được kết nối. Giá trị cao hơn giúp chất lỏng di chuyển nhanh hơn. Mặc định là 0.8."
caES = "Amb quina rapidesa s'igualen les canonades connectades. Els valors més alts mouen el líquid més ràpidament. Per defecte, 0,8."
beBY = "Наколькі хутка злучаныя трубы выраўноўваюць ўзровень. Большыя значэнні перамяшчаюць вадкасць хутчэй. Стандартна 0,8."
roRO = "Cât de repede se nivelează conductele conectate. Valorile mai mari mută lichidul mai rapid. Implicit 0,8."
huHU = "Milyen gyorsan egyenlítődnek ki a csatlakoztatott csövek. A magasabb értékek gyorsabban mozgatják a folyadékot. Alapérték: 0,8."
arSA = "مدى سرعة تسوية منسوب السوائل في الأنابيب المتصلة. القيم الأعلى تنقل السائل بسرعة أكبر. الافتراضي 0.8."

