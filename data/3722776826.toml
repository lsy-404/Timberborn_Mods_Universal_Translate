["Building.Pizzeria.FlavorDescription"]
raw = "What are you if you can’t decide between spadderdock pizza or chestnut pizza? You’re indeSLICEsive."
status = "abandoned"
enUS = "What are you if you can’t decide between spadderdock pizza or chestnut pizza? You’re indeSLICEsive."
zhCN = "如果你无法在稻稈披萨和栗子披萨之间做出决定，那你是什么呢？你就是毫不犹豫的选择。"
zhTW = "如果你無法在扁蓿披薩和栗子披薩之間做出決定，那你就是不果斷的。"
ruRU = "Что вы такое, если не можете решить, что выбрать: пиццу из водяного ореха или пиццу с каштаном? Вы нерешительны."
jaJP = "「スパッダードックピザとクリのピザのどちらを選ぶか決められないあなたは、インデスライスィブです。」"
frFR = "Que faites-vous si vous ne pouvez pas décider entre la pizza spadderdock ou la pizza aux châtaignes ? Vous êtes indécis."
deDE = "„Was bist du, wenn du dich nicht zwischen Spadderdock-Pizza und Kastanien-Pizza entscheiden kannst? Du bist indeSLICEsiv.“"
plPL = "Co jesteś, jeśli nie możesz zdecydować się między pizzą z spadderdock a pizzą z kasztanami? Jesteś indeSLICEsive."
ptBR = "O que você é se não consegue decidir entre pizza de spadderdock ou pizza de castanha? Você é indeSLICEsivo."
koKR = "스패더닥 피자와 밤 피자 중 어떤 것을 선택할지 결정할 수 없다면 당신은 결단력이 부족한 사람입니다."
trTR = "Spadderdock pizzası ile kestane pizzası arasında karar veremiyorsanız, siz indeSLICEsive'siniz."
esES = "¿Qué eres si no puedes decidirte entre una pizza de espadaña o una de castañas? ¡Indecipizza!"
itIT = "Cosa sei se non riesci a decidere tra la pizza alla ninfea gialla e quella alle castagne? Sei indeci-fetta!"
ukUA = "Як назвати того, хто не може вибрати між піцою з лататтям і піцою з каштанами? Піцерішучий!"
thTH = "ถ้าตัดสินใจไม่ได้ว่าจะกินพิซซ่าผักแหนหรือพิซซ่าเกาลัด คุณเป็นอะไร? คุณก็ลังเลจนเลือกไม่ลงสักชิ้นไง!"
csCZ = "Co jsi, když se nemůžeš rozhodnout mezi pizzou ze spadderdocku a pizzou z kaštanů? Jsi neSLICEsivní."
viVN = "Bạn là gì nếu không thể quyết định giữa pizza spadderdock hay pizza hạt dẻ? Bạn thật sự không quyết đoán."
caES = "Què ets si no et decideixes entre una pizza de nenúfar o una de castanyes? Ets indeciPIZZA."
beBY = "Хто ты, калі не можаш выбраць паміж піцай з жоўтым гарлачыкам і піцай з каштанамі? Ты — нерашучы кавалачак!"
roRO = "Ce ești dacă nu te poți hotărî între pizza cu nufăr galben și pizza cu castane? Ești indecis(ă) cu felia!"
huHU = "Mi vagy, ha nem tudsz dönteni a sárga tavirózsás és a gesztenyés pizza között? Egy indeciszelet."
arSA = "ماذا تكون إذا لم تستطع الاختيار بين بيتزا السبادردوك وبيتزا الكستناء؟ أنت متردّد... لدرجة أنك لا تحسم أمرك حتى بشريحة!"

