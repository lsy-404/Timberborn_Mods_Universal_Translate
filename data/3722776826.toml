itIT = "Richiede grano e un paio di altri ingredienti per preparare qualcosa di un po’ più gustoso."
ukUA = "Використовує пшеницю та ще кілька інгредієнтів, щоб приготувати щось трохи смачніше."
thTH = "นำข้าวสาลีและวัตถุดิบอีกสองสามอย่างมาปรุงเป็นของอร่อยขึ้นอีกนิด"
