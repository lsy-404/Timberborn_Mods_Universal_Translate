["Building.Pizzeria.Folktails.FlavorDescription"]
raw = "What are you if you can’t decide between spadderdock pizza or chestnut pizza? You’re indeSLICEsive."
status = "normal"
enUS = "What are you if you can’t decide between spadderdock pizza or chestnut pizza? You’re indeSLICEsive."
zhCN = "“如果你无法在水蕨披萨和栗子披萨之间决定，那你是什么呢？你就是犹豫不决的。”"
zhTW = "如果你無法決定要吃藻菜比薩還是栗子比薩，那你就是優柔寡斷的（indecisive）了。"
ruRU = "Что вы выберете, если не можете определиться между пиццей из спаржилки и пиццей с каштанами? Вы — неуверенный в себе."
jaJP = "「スパッダードックピザとクリのピザのどちらにするか決められないなら、あなたは決断力に欠けているということです。」"
frFR = "Que faites-vous si vous ne pouvez pas décider entre une pizza spadderdock ou une pizza aux châtaignes ? Vous êtes indécis."
deDE = "Was bist du, wenn du dich nicht zwischen Spadderdock-Pizza oder Kastanienpizza entscheiden kannst? Du bist unentschlossen."
plPL = "Czym jesteś, jeśli nie potrafisz zdecydować się między pizzą z spadderdock a pizzą z kasztanów? Jesteś indeSLICEsive."
ptBR = "O que você é se não consegue decidir entre pizza de spadderdock ou pizza de castanha? Você é indeSLICÍVEL."
koKR = "스패더독 피자와 밤 피자 중에서 결정하지 못한다면 당신은 indeSLICEsive입니다."
trTR = "Spadderdock pizzası ile kestane pizzası arasında karar veremiyorsanız, siz indeSLICEsive'siniz."
esES = "¿Qué eres si no puedes decidirte entre una pizza de espadaña y una de castañas? ¡Eres indeci-pizza-do!"
itIT = "Cosa sei se non riesci a decidere tra una pizza alla spadderdock e una alle castagne? Sei indeciso... a fette."
ukUA = "Хто ти, якщо не можеш вибрати між піцою з лататтям і піцою з каштанами? Ти — нерішу-шмат-чий!"
thTH = "ถ้าตัดสินใจไม่ได้ว่าจะเลือกพิซซ่าสแพดเดอร์ด็อกหรือพิซซ่าเกาลัด คุณเป็นอะไร? คุณก็เป็นคนลังเลจนเลือกไม่ถูกสักชิ้นไง!"
csCZ = "Co jste, pokud se nemůžete rozhodnout mezi pizzou ze spadderdocku a pizzou z kaštanů? Jste nerozhodní."
viVN = "Nếu bạn không thể quyết định giữa pizza spadderdock hay pizza hạt dẻ thì bạn là một người không quyết đoán."
caES = "Què ets si no pots decidir-te entre una pizza de nenúfar groc o una de castanyes? Ets un indeci-slice."
beBY = "Хто ты, калі не можаш вырашыць, якую піцу выбраць — з кубышкай ці з каштанам? Ты нерашучы кавалачак!"
roRO = "Ce ești dacă nu te poți hotărî între pizza cu nufăr galben și pizza cu castane? Ești inde-feli-cis."
huHU = "Mi vagy, ha nem tudsz dönteni a vízitökös és a gesztenyés pizza között? Szeletképtelen!"
arSA = "ماذا تكون إذا لم تستطع الاختيار بين بيتزا النيلم وبيتزا الكستناء؟ أنت متردّد... أو بالأحرى، متردّد الشريحة!"

