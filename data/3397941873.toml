["MapMakerPlantReader.LemonadeStand.Description"]
raw = "A place for beavers to meet and chat around a cup of freshly squeezed lemonade, and to teach little kits about capitalism."
status = "normal"
enUS = "A place for beavers to meet and chat around a cup of freshly squeezed lemonade, and to teach little kits about capitalism."
zhCN = "用柠檬和水制作柠檬汁。"
zhTW = "一個讓水獺聚會和聊天的地方，圍著一杯新鮮擠壓的檸檬水，並教小浣熊關於資本主義的知識。"
ruRU = "Место для бобров, чтобы встретиться и пообщаться за чашкой свежевыжатого лимонада, и научить маленьких детенышей капитализму."
jaJP = "ビーバーが集まり、絞りたてのレモネードを飲みながらおしゃべりし、小さな子ビーバーに資本主義を教えるための場所。"
frFR = "Un endroit pour que les castors se rencontrent et discutent autour d'une tasse de limonade fraîchement pressée, et pour enseigner aux petits kits le capitalisme."
deDE = "Ein Ort für Biber, um sich zu treffen und bei einer Tasse frisch gepresster Limonade zu plaudern und den kleinen Bibern etwas über Kapitalismus beizubringen."
plPL = "Miejsce, gdzie bobry mogą się spotykać i rozmawiać przy filiżance świeżo wyciśniętej lemoniady oraz uczyć małe kitki o kapitalizmie."
ptBR = "Um lugar para os castores se encontrarem e conversarem em volta de um copo de limonada fresca, e para ensinar os pequenos filhotes sobre capitalismo."
koKR = "비버들이 신선하게 짜낸 레모네이드를 마시면서 만나고 이야기할 수 있는 장소이며, 작은 새끼들에게 자본주의를 가르치는 곳입니다."
trTR = "Yeni sıkılmış limonata eşliğinde bir araya gelip sohbet edebilecekleri bir yer, aynı zamanda küçük gençlere kapitalizmi öğretmek için."
esES = "Un lugar donde los castores se reúnen a charlar con un vaso de limonada recién exprimida y para enseñar a las crías el capitalismo."
itIT = "Un luogo dove i castori possono incontrarsi e chiacchierare davanti a un bicchiere di limonata appena spremuta, e insegnare ai piccoli cuccioli il capitalismo."
ukUA = "Місце, де бобри можуть зустрітися й поспілкуватися за склянкою свіжовичавленого лимонаду та навчити бобренят капіталізму."
thTH = "ที่สำหรับบีเวอร์มาพบปะพูดคุยกันขณะจิบน้ำมะนาวคั้นสดใหม่ และสอนลูกบีเวอร์ตัวน้อยเกี่ยวกับระบบทุนนิยม"
csCZ = "Místo pro bobry, kde se mohou setkávat a povídat si u šálku čerstvě vymačkané limonády a učit malé bobříky o kapitalismu."
viVN = "Một nơi cho các chú hải ly gặp gỡ và trò chuyện quanh một ly nước chanh ép tươi, và để dạy cho các chú hải ly con về chủ nghĩa tư bản."
caES = "Un lloc on els castors es poden reunir i conversar al voltant d'una tassa de llimonada acabada de fer, i ensenyar als petits castorets sobre el capitalisme."
beBY = "Месца, дзе бабры могуць сустрэцца і пагутарыць за шклянкай свежага лімонаду, а таксама навучыць маленькіх бабранят капіталізму."
roRO = "Un loc unde castorii se întâlnesc și stau de vorbă în jurul unei cești de limonadă proaspăt stoarsă și unde îi învață pe castorașii mici despre capitalism."
huHU = "Egy hely, ahol a hódok összejöhetnek és cseveghetnek egy pohár frissen facsart limonádé mellett, valamint megtanulhatják a kicsinyeknek a kapitalizmust."
arSA = "مكان يلتقي فيه القنادس للدردشة حول كوب من عصير الليمون الطازج، ولتعليم الصغار عن الرأسمالية."

["MapMakerPlantReader.LemonadeStand.FlavorDescription"]
raw = "\"When life gives you lemons… please dont burn someone’s house down with them\""
status = "normal"
enUS = "\"When life gives you lemons… please don’t burn someone’s house down with them.\""
zhCN = "“当生活给你柠檬时……请不要用它们去烧别人的房子。”"
zhTW = "當生活給你檸檬時…請不要用它們去燒毀別人的房子。"
ruRU = "Когда жизнь дает тебе лимоны... пожалуйста, не сжигай чей-то дом с их помощью."
jaJP = "「人生がレモンをくれるとき…誰かの家を燃やさないでください。」"
frFR = "Quand la vie te donne des citrons… s'il te plaît, ne brûle pas la maison de quelqu'un avec."
deDE = "„Wenn dir das Leben Zitronen gibt… bitte verbrenne damit nicht das Haus von jemandem.“"
plPL = "Kiedy życie daje ci cytryny… proszę, nie pal komuś domu nimi.\""
ptBR = "Quando a vida te der limões... por favor, não queime a casa de alguém com eles."
koKR = "인생이 레몬을 줄 때… 누군가의 집을 불 태우지 마세요."
trTR = "\"Hayat sana limon verirse... lütfen kimsenin evini ateşe verme.\""
esES = "\"Cuando la vida te da limones… por favor, no quemes la casa de nadie con ellos dentro\""
itIT = "\"Quando la vita ti dà dei limoni… per favore non dar fuoco alla casa di qualcuno con dentro\""
ukUA = "\"Коли життя підкидає тобі лимони… будь ласка, не спалюй разом із ними чийсь будинок\""
thTH = "\"เมื่อชีวิตมอบมะนาวให้คุณ… ช่วยอย่าเผาบ้านใครทั้งหลังพร้อมกับมะนาวนั้นด้วยเถอะ\""
csCZ = "\"Když ti život dá citrony… prosím, nezapalte s nimi někomu dům.\""
viVN = "\"Khi cuộc sống cho bạn những quả chanh… làm ơn đừng đốt cháy nhà của ai đó bằng chúng\""
caES = "\"Quan la vida et dona llimones… si us plau, no cremis la casa d'algú amb ell a dins\""
beBY = "«Калі жыццё дорыць табе лімоны… калі ласка, не спальвай чыйсьці дом разам з імі»"
roRO = "\"Când viața îți dă lămâi… te rog, nu da foc casei cuiva împreună cu ei\""
huHU = "\"Ha az élet citromot ad neked… kérlek, ne égesd fel vele együtt valakinek a házát\""
arSA = "\"عندما تعطيك الحياة ليمونًا… أرجوك لا تحرق منزل أحد وهو بداخله\""
