["MapMakerPlants.VoidTile.Description"]
raw = "Visually deletes the ground under it.\nFor places where you don’t ever expect to see water."
status = "normal"
enUS = "Visually deletes the ground under it.\nFor places where you don’t ever expect to see water."
zhCN = "透明的遮盖物，可以使下方的地面变透明。"
zhTW = "在其下方視覺上刪除地面。對於那些你永遠不會期待見到水的地方。"
ruRU = "Визуально убирает землю под собой. Для мест, где вы никогда не ожидаете увидеть воду."
jaJP = "視覚的にその下の地面を消去します。水が見えることなど決して想像しない場所のために。"
frFR = "Supprime visuellement le sol en dessous. Pour des endroits où vous ne vous attendez jamais à voir de l'eau."
deDE = "Löscht visuell den Boden unter sich. Für Orte, an denen man niemals erwartet, Wasser zu sehen."
plPL = "Wizualnie usuwa grunt pod sobą. Dla miejsc, w których nigdy nie spodziewasz się zobaczyć wody."
ptBR = "Exclui visualmente o solo debaixo dele. Para lugares onde você nunca espera ver água."
koKR = "그 아래의 땅을 시각적으로 삭제합니다.\n물체를 결코 볼 수 없을 것으로 예상되는 장소를 위해서입니다."
trTR = "Görsel olarak altındaki zemini siler. Su görmeyi asla beklemediğiniz yerler için."
esES = "Elimina visualmente el suelo que hay debajo.\nPara lugares donde no esperas ver agua nunca."
itIT = "Visivamente rimuove il terreno sotto di esso.\nPer i luoghi in cui non ti aspetteresti mai di vedere dell'acqua."
ukUA = "Візуально прибирає ґрунт під собою.\nДля місць, де ви ніколи не очікуєте побачити воду."
thTH = "ทำให้พื้นดินใต้ตำแหน่งนี้หายไปในภาพที่เห็น\nใช้สำหรับจุดที่คุณไม่คาดคิดว่าจะมีน้ำอยู่เลย"
csCZ = "Vizualně odstraní zem pod sebou. \nNa místa, kde nikdy neočekáváte, že uvidíte vodu."
viVN = "Loại bỏ trực quan mặt đất dưới nó. Dành cho những nơi bạn không bao giờ nghĩ sẽ thấy nước."
caES = "Vista visualment el terra que hi ha sota.\nPer a llocs on no esperes mai veure aigua."
roRO = "Vizual șterge terenul de sub el.\nPentru locuri unde nu te aștepți niciodată să vezi apă."
huHU = "Vizuálisan eltünteti az alatta lévő talajt.\nOlyan helyekre, ahol soha nem számítasz víz megjelenésére."
arSA = "يُخفي الأرض الموجودة تحته بصريًا.\nللأماكن التي لا تتوقع فيها رؤية الماء أبدًا."

