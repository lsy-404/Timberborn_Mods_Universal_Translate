["MPME.FloatingRock.FlavorDescription"]
raw = "\"How does it worksxa0?\"\nOhxa0? Oh, nowxa0? After all these yearsxa0? After all these gamesxa0? Now you ask ME how those workxa0?"
status = "normal"
enUS = "How does it work?\nOh? Oh, now? After all these years? After all these games? Now you ask ME how those work?"
zhCN = "“这是什么原理？这么多年，这么多游戏，这么多空中岛屿，现在才问我这是什么原理？”"
zhTW = "這個是怎麼運作的？\"\n哦？哦，現在？經過這麼多年？經過這麼多遊戲？現在你問我這些是怎麼運作的？"
ruRU = "\"Как это работает?\" О? О, теперь? После всех этих лет? После всех этих игр? Теперь ты спрашиваешь МЕНЯ, как это работает?"
jaJP = "「どうやって動くの？」  \nああ？ああ、今？これまでの何年も経って？これまでのゲームの後に？今になって私にどうやってそれが機能するのか聞くの？"
frFR = "\"Comment ça fonctionne ?\"\nOh ? Oh, maintenant ? Après toutes ces années ? Après tous ces jeux ? Maintenant, tu me demandes comment ça fonctionne ?\""
deDE = "Wie funktioniert das? Oh? Oh, jetzt? Nach all diesen Jahren? Nach all diesen Spielen? Fragst du JETZT mich, wie das funktioniert?"
plPL = "Jak to działa? Och? Och, teraz? Po tych wszystkich latach? Po tych wszystkich grach? Teraz pytasz Mnie, jak to działa?"
ptBR = "Como isso funciona?\"\nOh? Oh, agora? Depois de todos esses anos? Depois de todos esses jogos? Agora você me pergunta como isso funciona?"
koKR = "어떻게 작동하죠?\"  \n\"어? 어, 지금이요? 수년이 지나고? 수많은 게임이 지나고? 이제서야 저한테 그게 어떻게 작동하는지 물어보나요?"
trTR = "Nasıl çalışıyor xa0? Oh xa0? Oh, şimdi xa0? Tüm bu yıllardan sonra xa0? Tüm bu oyunlardan sonra xa0? Şimdi bana bu nasıl çalışıyor diye soruyorsun xa0?"
esES = "\"¿Cómo funciona\xa0?\"\nOh\xa0? ¿Oh, ahora\xa0? ¿Después de todos estos años\xa0? ¿Después de todos estos juegos\xa0? ¿Y ahora me preguntas A MÍ cómo funcionan\xa0?"
itIT = "\"Come funzionaxa0?\"\nOhxa0? Oh, adessoxa0? Dopo tutti questi annixa0? Dopo tutti questi giochixa0? Adesso chiedi a ME come funzionano quellixa0?"
ukUA = "«Як воно працює ?»\nОй ? Ой, тепер ? Після стількох років ? Після стількох ігор ? Тепер ти питаєш У МЕНЕ, як вони працюють ?"
thTH = "“มันทำงานยังไงกันนะ?”\nโอ้? โอ้ ตอนนี้หรือ? หลังจากผ่านมาหลายปีหรือ? หลังจากเล่นกันมาตั้งหลายเกมหรือ? แล้วตอนนี้เธอกลับมาถามฉันเนี่ยนะว่าพวกมันทำงานยังไง?"
csCZ = "Jak to funguje? Oh? Oh, teď? Po všech těch letech? Po všech těch hrách? Teď se ptáš MĚ, jak to funguje?"
viVN = "Nó hoạt động như thế nào?\nỒ?\nỒ, bây giờ?\nSau bao năm trời?\nSau tất cả những trò chơi này?\nGiờ bạn hỏi TÔI cách chúng hoạt động?"
caES = "\"Com funciona?\"\nOh? Oh, ara? Després de tants anys? Després de tants jocs? Ara em preguntes A MI com funcionen?"
beBY = "\"Як яно працуе?\"\nО, га? Ой, цяпер? Пасля ўсіх гэтых гадоў? Пасля ўсіх гэтых гульняў? Цяпер ты пытаешся ў МЯНЕ, як яны працуюць?"
roRO = "\"Cum funcționează, de fapt?\"\nOh, acum? După atâția ani? După atâtea jocuri? Acum mă întrebi PE MINE cum funcționează ele?"
huHU = "\"Hogyan működik\xa0?\"\nÓ, most\xa0? Ennyi év után\xa0? Ennyi játék után\xa0? Most engem kérdezel, hogy ezek hogyan működnek\xa0?"
arSA = "\"كيف تعمل؟\"\nأوه؟ أوه، الآن؟ بعد كل هذه السنين؟ بعد كل هذه الألعاب؟ والآن تسألني أنا كيف تعمل تلك الأشياء؟"

