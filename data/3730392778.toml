["Building.DragonclawNest.FlavorDescription"]
raw = "Warmth, fiber, and time turn a guarded egg into the next pair of claws."
status = "normal"
enUS = "Warmth, fiber, and time turn a guarded egg into the next pair of claws."
zhCN = "“温暖、纤维和时间将一个受保护的蛋变成下一对爪子。”"
zhTW = "溫暖、纖維和時間將一顆被守護的蛋變成下一對爪子。"
ruRU = "Тепло, волокно и время превращают охраняемое яйцо в следующую пару когтей."
jaJP = "「温もり、繊維、そして時間が、守られた卵を次の一対の爪に変える。」"
frFR = "La chaleur, les fibres et le temps transforment un œuf protégé en la prochaine paire de griffes."
deDE = "Wärme, Faser und Zeit verwandeln ein bewachtes Ei in das nächste Paar Krallen."
plPL = "Warmth, fiber, and time turn a guarded egg into the next pair of claws."
ptBR = "Calor, fibra e tempo transformam um ovo guardado na próxima dupla de garras."
koKR = "온기, 섬유, 그리고 시간은 보호된 알을 다음 쌍의 발톱으로 바꾼다."
trTR = "Sıcaklık, lif ve zaman, korunan bir yumurtayı bir sonraki pençeye dönüştürüyor."
esES = "Calor, fibra y tiempo convierten un huevo protegido en el próximo par de garras."
itIT = "Calore, fibra e tempo trasformano un uovo custodito nel prossimo paio di artigli."
ukUA = "Тепло, волокно і час перетворюють охоронюване яйце на наступну пару кігтів."
thTH = "ความอบอุ่น เส้นใย และเวลา เปลี่ยนไข่ที่ได้รับการคุ้มกันให้กลายเป็นกรงเล็บคู่ต่อไป"
csCZ = "Teplo, vlákno a čas promění chráněné vejce v další pár drapáků."
viVN = "Độ ấm, sợi, và thời gian biến một quả trứng được bảo vệ thành một cặp móng vuốt tiếp theo."
caES = "Escalfor, fibra i temps converteixen un ou protegit en la següent parella de urpes."
beBY = "Цяпло, валакно і час ператвараюць ахоўванае яйка ў наступную пару кіпцюроў."
roRO = "Căldura, fibrele și timpul transformă un ou păzit în următoarea pereche de gheare."
huHU = "Melegség, rost és idő kell ahhoz, hogy egy őrzött tojásból a következő karmokpár váljon."
arSA = "الدفء والألياف والوقت تحوّل البيضة المحروسة إلى زوج المخالب التالي."

