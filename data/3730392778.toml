viVN = "Một tổ ấm áp nơi những chú rồng Dragonclaw được nuôi lớn bằng than và sợi."
caES = "Un niu càlid on es crien les cries de Dragonclaw amb carbó i fibra."
beBY = "Ціплы гняздзечка, дзе гадуюць дракаклышоў вугалем і валакном."
roRO = "Un cuib călduros unde puii de Dragonclaw sunt crescuți cu cărbune și fibre."
huHU = "Egy meleg fészek, ahol a Sárkánykarmok fiókáit szénnel és rostanyaggal nevelik."
