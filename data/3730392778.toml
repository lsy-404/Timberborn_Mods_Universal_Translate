trTR = "kömür ve lif ile beslenen Dragonclaw yavrularının büyütüldüğü sıcak bir yuva."
esES = "Un nido cálido donde se crían las crías de Garrazarpa con carbón y fibra."
itIT = "Un nido caldo in cui i cuccioli di Dragonclaw vengono allevati con carbone e fibra."
ukUA = "Теплий гніздечко, де виховують дракокігтових дитинчат за допомогою деревного вугілля та волокна."
thTH = "รังอบอุ่นที่ใช้เลี้ยงลูกมังกรกรงเล็บด้วยถ่านและเส้นใย"
