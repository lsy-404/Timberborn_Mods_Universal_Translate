["acalc79.ExtremeDifficulties.ScorchedEarthDescription"]
raw = "Hard temperate duration, expected duration of hazardous is 10-20x cycle number. Not recommended without the discharge."
status = "normal"
enUS = "Hard temperate duration; the expected duration of hazardous conditions is 10–20× the cycle number. Not recommended without the discharge."
zhCN = "困难温带持续时间，危险期的预计持续时间为周期数的10-20倍。没有排放口时不建议使用。"
zhTW = "艱難的溫帶持續時間；危險期的預期持續時間為循環次數的 10-20 倍。不建議在沒有排放口的情況下使用。"
ruRU = "Продолжительность сложного умеренного сезона: ожидаемая продолжительность опасного периода составляет 10-20x номера цикла. Не рекомендуется без сброса жидкости."
jaJP = "難易度ハードの温帯期間。危険な期間の予想はサイクル数の10-20倍です。排水機構なしでは推奨されません。"
frFR = "Durée tempérée difficile, la durée prévue des conditions dangereuses est de 10 à 20 fois le nombre de cycles. Non recommandé sans le dispositif d'évacuation."
deDE = "Dauer der schwierigen gemäßigten Phase: Die erwartete Dauer der Gefahrenphase beträgt das 10- bis 20-Fache der Zykluszahl. Ohne den Auslass nicht empfohlen."
plPL = "Czas trwania trudnego okresu umiarkowanego — oczekiwany czas trwania okresu zagrożenia wynosi 10-20x liczba cykli. Nie zaleca się bez odpływu."
ptBR = "Duração temperada difícil; a duração esperada do período perigoso é de 10 a 20 vezes o número do ciclo. Não recomendado sem a descarga."
koKR = "가혹한 온대 기간 동안 위험 상태의 예상 지속 시간은 주기 수의 10~20배입니다. 방류 기능 없이는 권장하지 않습니다."
csCZ = "Délka období sucha na obtížné úrovni odpovídá 10–20násobku čísla cyklu. Bez vypouštění vody se nedoporučuje."
viVN = "Thời lượng khắc nghiệt ở vùng ôn đới: thời lượng dự kiến của tình trạng nguy hiểm bằng 10-20 lần số chu kỳ. Không khuyến nghị nếu không có hệ thống xả."
trTR = "Zor ılıman süre; tehlikeli dönemin beklenen süresi, döngü sayısının 10-20 katıdır. Tahliye olmadan önerilmez."

["acalc79.ExtremeDifficulties.UltraHardWeatherDescription"]
status = "normal"
raw = "Fair weather always lasts only 3 days, by cycle 38 it has average contamination of 15% with peaks at 30%. Eruption and flood reach average 10, drought and badtide 50."
enUS = "Fair weather always lasts only 3 days. By cycle 38, it has an average contamination of 15%, with peaks at 30%. Eruptions and floods reach an average of 10, while droughts and badtides reach 50."
zhCN = "晴好天气始终只持续 3 天；到第 38 个周期时，平均污染率为 15%，峰值为 30%。火山喷发和洪水的平均污染率为 10%，干旱和恶潮则为 50%。"
zhTW = "晴朗天氣總是只持續 3 天；到了第 38 個週期，平均污染度為 15%，峰值可達 30%。火山噴發和洪水的平均污染度為 10%，乾旱和毒潮則為 50%。"
ruRU = "Хорошая погода всегда длится всего 3 дня; к 38-му циклу средний уровень загрязнения достигает 15%, а пиковый — 30%. Во время извержения и наводнения средний уровень достигает 10%, а во время засухи и токсичного прилива — 50%."
jaJP = "好天は常に3日間しか続かない。38サイクル目までに汚染度は平均15%、ピーク時には30%に達する。噴火と洪水は平均10%、干ばつと毒水潮は50%に達する。"
frFR = "Le beau temps ne dure toujours que 3 jours. Au cycle 38, la contamination moyenne atteint 15 %, avec des pics à 30 %. Les éruptions et les inondations atteignent une moyenne de 10 %, les sécheresses et les marées toxiques, de 50 %."
deDE = "Gutes Wetter dauert immer nur 3 Tage. Ab Zyklus 38 beträgt die durchschnittliche Kontamination 15 %, mit Spitzenwerten von 30 %. Bei Eruptionen und Überschwemmungen erreicht sie durchschnittlich 10 %, bei Dürren und schlechtem Wasserstand 50 %."
plPL = "Dobra pogoda zawsze trwa tylko 3 dni; w 38. cyklu średnie skażenie wynosi 15%, a szczytowo osiąga 30%. Wybuchy wulkanu i powodzie osiągają średnio 10, a susze i toksyczne przypływy — 50."
ptBR = "O tempo bom sempre dura apenas 3 dias. No ciclo 38, a contaminação média chega a 15%, com picos de 30%. Erupções e inundações chegam a uma média de 10; secas e marés tóxicas, a 50."
koKR = "맑은 날씨는 항상 3일만 지속되며, 38주기까지 오염도가 평균 15%, 최고 30%에 이릅니다. 분화와 홍수의 평균 오염도는 10, 가뭄과 독성 조수의 평균 오염도는 50입니다."
csCZ = "Příznivé počasí vždy trvá pouze 3 dny. Do 38. cyklu dosahuje průměrná kontaminace 15 % a vrcholí na 30 %. Erupce a povodeň dosahují průměrné hodnoty 10, sucho a špatný příliv 50."
viVN = "Thời tiết thuận lợi luôn chỉ kéo dài 3 ngày; đến chu kỳ 38, mức ô nhiễm trung bình là 15%, với đỉnh điểm là 30%. Phun trào và lũ lụt đạt mức trung bình 10, hạn hán và thủy triều độc đạt mức 50."
trTR = "Güzel hava her zaman yalnızca 3 gün sürer; 38. döngüye gelindiğinde ortalama kirlenme oranı %15, en yüksek oran ise %30 olur. Patlama ve sel ortalama 10'a, kuraklık ve kötü gelgit 50'ye ulaşır."

["acalc79.ExtremeDifficulties.DroughtIsComingWeatherDescription"]
status = "normal"
raw = "Fair weather always lasts only 3 days, but their strength increases to keep up with length of hazards. By cycle 68 it has average contamination of 30% with peaks at 60%. Eruption and flood reach average 15, drought and badtide average 5 times the cycle number without limit."
enUS = "Fair weather always lasts only 3 days, but its intensity increases to keep pace with the duration of hazards. By cycle 68, it has an average contamination of 30%, with peaks of 60%. Eruptions and floods reach an average of 15, while droughts and badtides average 5 times the cycle number, with no limit."
zhCN = "晴好天气始终只持续 3 天，但其强度会增加，以应对危害持续时间的延长。到第 68 个周期时，其平均污染率为 30%，峰值为 60%。喷发和洪水的强度达到周期数的平均 15 倍，干旱和恶潮则达到周期数的平均 5 倍，且没有上限。"
zhTW = "晴朗天氣總是只持續 3 天，但其強度會增加，以跟上災害持續時間的增長。到第 68 個週期時，污染平均達 30%，峰值達 60%。噴發和洪水的平均值會達到週期數的 15 倍，乾旱和壞潮則會達到週期數的 5 倍，且沒有上限。"
ruRU = "Благоприятная погода всегда длится всего 3 дня, но её сила увеличивается, чтобы соответствовать продолжительности опасных явлений. К 68-му циклу средний уровень загрязнения достигает 30%, а пиковый — 60%. Извержения и наводнения достигают среднего уровня 15, а засухи и вредные приливы — в среднем 5-кратного числа цикла, без ограничений."
jaJP = "晴天は常に3日間だけ続きますが、災害の長さに合わせてその強度は増していきます。サイクル68までに、汚染度は平均30%、ピーク時には60%に達します。噴火と洪水の平均値は15、干ばつと有毒潮の平均値はサイクル数の5倍に達し、上限はありません。"
frFR = "Le beau temps ne dure toujours que 3 jours, mais son intensité augmente pour suivre la durée des catastrophes. Au cycle 68, la contamination moyenne atteint 30 %, avec des pics à 60 %. Les éruptions et les inondations atteignent une moyenne de 15, tandis que les sécheresses et les marées toxiques atteignent une moyenne égale à 5 fois le numéro du cycle, sans limite."
deDE = "Gutes Wetter dauert immer nur 3 Tage, aber seine Intensität nimmt zu, um mit der Dauer der Gefahren Schritt zu halten. Ab Zyklus 68 beträgt die durchschnittliche Kontamination 30 % mit Spitzenwerten von 60 %. Bei Eruptionen und Überschwemmungen erreicht der Durchschnitt 15, bei Dürren und schlechten Fluten 5-mal die Zyklusnummer, ohne Obergrenze."
plPL = "Dobra pogoda zawsze trwa tylko 3 dni, ale jej siła wzrasta, by dorównać długości zagrożeń. Do 68. cyklu jej średnie skażenie wynosi 30%, a szczytowe wartości sięgają 60%. Eruptions i powodzie osiągają średnio 15, a susze i złe przypływy średnio 5 razy więcej niż numer cyklu, bez ograniczeń."
ptBR = "O tempo bom sempre dura apenas 3 dias, mas sua intensidade aumenta para acompanhar a duração dos perigos. No ciclo 68, a contaminação média é de 30%, com picos de 60%. Erupções e inundações chegam a uma média de 15; secas e marés tóxicas chegam a uma média de 5 vezes o número do ciclo, sem limite."
koKR = "맑은 날씨는 항상 3일만 지속되지만, 위험 상황의 지속 기간에 맞춰 그 강도가 증가합니다. 68번째 주기에는 오염도가 평균 30%, 최고 60%에 이릅니다. 화산 폭발과 홍수는 평균 15회, 가뭄과 악조는 주기 수의 5배까지 제한 없이 증가합니다."
csCZ = "Příznivé počasí trvá vždy jen 3 dny, ale jeho intenzita se zvyšuje, aby odpovídala délce nebezpečných událostí. Do 68. cyklu dosahuje průměrná kontaminace 30 % a maxima 60 %. Erupce a povodeň dosahují průměrné hodnoty 15, sucho a špatný příliv průměrně 5násobku čísla cyklu, bez omezení."
viVN = "Thời tiết thuận lợi luôn chỉ kéo dài 3 ngày, nhưng cường độ sẽ tăng lên để tương ứng với thời gian kéo dài của các mối nguy. Đến chu kỳ 68, mức ô nhiễm trung bình là 30%, đạt đỉnh 60%. Phun trào và lũ lụt đạt mức trung bình 15, hạn hán và triều độc đạt mức trung bình gấp 5 lần số chu kỳ, không giới hạn."
trTR = "Güzel hava her zaman yalnızca 3 gün sürer, ancak şiddeti tehlikelerin süresine ayak uyduracak şekilde artar. 68. döngüye gelindiğinde kirlilik ortalama %30, zirve değerleri ise %60 olur. Patlama ve sel ortalama 15'e, kuraklık ve zehirli gelgit ise sınır olmaksızın döngü sayısının ortalama 5 katına ulaşır."

["acalc79.ExtremeDifficulties.ScorchedEarthWeatherDescription"]
status = "normal"
raw = "Hazards average 15 times the cycle number. Hard's fair weather with source strength scaling to keep up with hazards."
enUS = "Hazards average 15 times the cycle number. Hard’s fair weather, with source strength scaling to keep up with hazards."
zhCN = "灾害的平均强度为周期数的 15 倍。困难模式下的正常天气会根据灾害强度进行调整，以保持相应难度。"
zhTW = "災害平均為週期編號的 15 倍。困難模式的晴朗天氣會隨災害強度調整水源強度，以跟上災害變化。"
ruRU = "Опасности в среднем в 15 раз превышают номер цикла. В режиме «Справедливая погода» источники усиливаются пропорционально опасностям."
jaJP = "災害の規模は、サイクル数の15倍が平均です。ハードでは、災害に追いつくよう水源の強さが変化する、穏やかな天候になります。"
frFR = "Les dangers sont en moyenne 15 fois supérieurs au numéro du cycle. En difficulté Difficile, le temps est clément, avec une intensité des sources qui augmente pour suivre le rythme des dangers."
deDE = "Gefahren liegen im Durchschnitt beim 15-Fachen der Zyklusnummer. Die Schönwetterphasen auf „Schwer“ sind fair, wobei die Quellenstärke angepasst wird, damit sie mit den Gefahren mithalten kann."
plPL = "Zagrożenia są średnio 15 razy większe od numeru cyklu. Umiarkowana pogoda na poziomie trudnym, a siła źródeł rośnie wraz z zagrożeniami."
ptBR = "Os perigos têm uma média de 15 vezes o número do ciclo. O clima bom do modo Difícil, com a intensidade das fontes aumentando para acompanhar os perigos."
koKR = "위험도는 주기 번호의 15배를 평균으로 합니다. 어려움 모드의 평온한 날씨를 적용하고, 위험도에 맞춰 수원 강도를 조정합니다."
csCZ = "Nebezpečí dosahují v průměru 15násobku čísla cyklu. Počasí v režimu Těžká obtížnost je spravedlivé a síla zdrojů se přizpůsobuje tak, aby držela krok s nebezpečími."
viVN = "Mức độ khắc nghiệt trung bình gấp 15 lần số chu kỳ. Thời tiết ôn hòa của chế độ Khó, với cường độ nguồn tăng theo để theo kịp các mối nguy hiểm."
trTR = "Tehlikeler, döngü numarasının ortalama 15 katı kadardır. Zorluğun ılıman havası, kaynak gücü tehlikelere ayak uyduracak şekilde ölçeklenir."
