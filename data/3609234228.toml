["acalc79.ExtremeDifficulties.ScorchedEarthDescription"]
raw = "Hard temperate duration, expected duration of hazardous is 10-20x cycle number. Not recommended without the discharge."
status = "normal"
enUS = "Hard temperate duration; the expected duration of hazardous conditions is 10–20× the cycle number. Not recommended without the discharge."
zhCN = "困难温带持续时间，危险期的预计持续时间为周期数的10-20倍。没有排放口时不建议使用。"
zhTW = "艱難的溫帶持續時間；危險期的預期持續時間為循環次數的 10-20 倍。不建議在沒有排放口的情況下使用。"
ruRU = "Продолжительность сложного умеренного сезона: ожидаемая продолжительность опасного периода составляет 10-20x номера цикла. Не рекомендуется без сброса жидкости."
jaJP = "難易度ハードの温帯期間。危険な期間の予想はサイクル数の10-20倍です。排水機構なしでは推奨されません。"
frFR = "Durée tempérée difficile, la durée prévue des conditions dangereuses est de 10 à 20 fois le nombre de cycles. Non recommandé sans le dispositif d'évacuation."
deDE = "Dauer der schwierigen gemäßigten Phase: Die erwartete Dauer der Gefahrenphase beträgt das 10- bis 20-Fache der Zykluszahl. Ohne den Auslass nicht empfohlen."
plPL = "Czas trwania trudnego okresu umiarkowanego — oczekiwany czas trwania okresu zagrożenia wynosi 10-20x liczba cykli. Nie zaleca się bez odpływu."
ptBR = "Duração temperada difícil; a duração esperada do período perigoso é de 10 a 20 vezes o número do ciclo. Não recomendado sem a descarga."
koKR = "가혹한 온대 기간 동안 위험 상태의 예상 지속 시간은 주기 수의 10~20배입니다. 방류 기능 없이는 권장하지 않습니다."
trTR = "Zor ılıman süre; tehlikeli dönemin beklenen süresi, döngü sayısının 10-20 katıdır. Tahliye olmadan önerilmez."
esES = "Duración templada en difícil: se espera que la duración del período peligroso sea de 10-20x el número de ciclos. No se recomienda sin la descarga."
itIT = "Durata temperata difficile; la durata prevista del periodo pericoloso è 10-20 volte il numero del ciclo. Sconsigliata senza lo scarico."
ukUA = "Тривалість суворого помірного періоду; очікувана тривалість небезпечного періоду становить 10–20-кратне значення номера циклу. Не рекомендується без скидання."
thTH = "ระยะเวลาช่วงอากาศอบอุ่นแบบยาก โดยคาดว่าช่วงอันตรายจะยาวนาน 10-20 เท่าของจำนวนรอบ ไม่แนะนำหากไม่มีการระบายออก"
csCZ = "Délka období sucha na obtížné úrovni odpovídá 10–20násobku čísla cyklu. Bez vypouštění vody se nedoporučuje."
viVN = "Thời lượng khắc nghiệt ở vùng ôn đới: thời lượng dự kiến của tình trạng nguy hiểm bằng 10-20 lần số chu kỳ. Không khuyến nghị nếu không có hệ thống xả."
caES = "Durada temperada difícil; la durada prevista dels períodes perillosos és de 10-20x el número de cicle. No es recomana sense el desguàs."
beBY = "Працягласць складанага ўмеранага перыяду; чаканая працягласць небяспечнага перыяду складае 10–20-кратную колькасць цыклаў. Не рэкамендуецца без скіду."
roRO = "Durată temperată dificilă, durata estimată a perioadei periculoase este de 10-20x numărul ciclului. Nu este recomandată fără evacuare."
huHU = "A kemény, mérsékelt éghajlatú időszak időtartama: a veszélyes időszak várható időtartama a ciklusszám 10–20-szorosa. A leeresztés nélkül nem ajánlott."
arSA = "مدة الموسم المعتدل على الصعوبة الصعبة؛ المدة المتوقعة للفترة الخطرة هي 10-20 ضعف رقم الدورة. لا يُنصح بها دون التصريف."

["acalc79.ExtremeDifficulties.UltraHardWeatherDescription"]
raw = "Temperate weather always lasts only 3 days, by cycle 38 it has average contamination of 15% with peaks at 30%. Eruption and flood reach average 10, drought and badtide 50."
status = "normal"
enUS = "Temperate weather always lasts only 3 days. By cycle 38, it has an average contamination of 15%, with peaks at 30%. Eruptions and floods reach an average of 10, while droughts and badtides reach 50."
zhCN = "温和天气始终只持续 3 天；到第 38 个周期时，平均污染率为 15%，峰值为 30%。火山喷发和洪水的平均污染率为 10%，干旱和恶潮则为 50%。"
zhTW = "溫和天氣總是只持續 3 天；到了第 38 個週期，平均污染度為 15%，峰值可達 30%。火山噴發和洪水的平均污染度為 10%，乾旱和毒潮則為 50%。"
ruRU = "Умеренная погода всегда длится всего 3 дня; к 38-му циклу средний уровень загрязнения достигает 15%, а пиковый — 30%. Во время извержения и наводнения средний уровень достигает 10%, а во время засухи и токсичного прилива — 50%."
jaJP = "温暖な天候は常に3日間しか続かない。38サイクル目までに汚染度は平均15%、ピーク時には30%に達する。噴火と洪水は平均10%、干ばつと毒水潮は50%に達する。"
frFR = "Le temps doux ne dure toujours que 3 jours. Au cycle 38, la contamination moyenne atteint 15 %, avec des pics à 30 %. Les éruptions et les inondations atteignent une moyenne de 10, les sécheresses et les marées toxiques, de 50 %."
deDE = "Mildes Wetter dauert immer nur 3 Tage. Ab Zyklus 38 beträgt die durchschnittliche Kontamination 15 %, mit Spitzenwerten von 30 %. Bei Eruptionen und Überschwemmungen erreicht sie durchschnittlich 10 %, bei Dürren und schlechtem Wasserstand 50 %."
plPL = "Umiarkowana pogoda zawsze trwa tylko 3 dni; w 38. cyklu średnie skażenie wynosi 15%, a szczytowo osiąga 30%. Erupcje i powodzie osiągają średnio 10, a susze i toksyczne przypływy — 50."
ptBR = "O clima temperado sempre dura apenas 3 dias; no ciclo 38, a contaminação média é de 15%, com picos de 30%. Erupções e inundações chegam a uma média de 10; secas e marés tóxicas, a 50."
koKR = "온화한 날씨는 항상 3일만 지속되며, 38주기까지 오염도는 평균 15%, 최고 30%에 이릅니다. 분화와 홍수는 평균 10, 가뭄과 독성 조수는 평균 50에 이릅니다."
trTR = "Ilıman hava her zaman yalnızca 3 gün sürer; 38. döngüye gelindiğinde ortalama kirlenme oranı %15, en yüksek oran ise %30 olur. Patlama ve sel ortalama 10'a, kuraklık ve kötü gelgit 50'ye ulaşır."
esES = "El clima templado siempre dura solo 3 días; para el ciclo 38, tiene una contaminación promedio del 15 %, con picos del 30 %. La erupción y la inundación alcanzan un promedio de 10; la sequía y la marea tóxica, de 50."
itIT = "Il clima temperato dura sempre solo 3 giorni; al ciclo 38 la contaminazione media è del 15%, con picchi del 30%. Eruzioni e inondazioni raggiungono una media di 10, siccità e maree tossiche di 50."
ukUA = "Помірна погода завжди триває лише 3 дні; до 38-го циклу її середній рівень забруднення становить 15%, а піковий — 30%. Виверження та повінь сягають середнього значення 10, посуха й поганий приплив — 50."
thTH = "สภาพอากาศอบอุ่นจะกินเวลาเพียง 3 วันเสมอ เมื่อถึงรอบที่ 38 จะมีการปนเปื้อนเฉลี่ย 15% และสูงสุด 30% การปะทุและน้ำท่วมมีค่าเฉลี่ยถึง 10 ส่วนภัยแล้งและกระแสน้ำเสียมีค่าเฉลี่ยถึง 50"
csCZ = "Mírné počasí vždy trvá pouze 3 dny. Do 38. cyklu dosahuje průměrná kontaminace 15 % a vrcholí na 30 %. Erupce a povodeň dosahují průměrné hodnoty 10, sucho a špatný příliv 50."
viVN = "Thời tiết ôn hòa luôn chỉ kéo dài 3 ngày; đến chu kỳ 38, mức ô nhiễm trung bình là 15%, với đỉnh điểm là 30%. Phun trào và lũ lụt đạt mức trung bình 10, hạn hán và thủy triều độc đạt mức 50."
caES = "El clima temperat dura sempre només 3 dies; al cicle 38 té una contaminació mitjana del 15%, amb pics del 30%. Les erupcions i les inundacions arriben a una mitjana de 10, i les sequeres i les marees tòxiques, de 50."
beBY = "Умеранае надвор'е заўсёды доўжыцца толькі 3 дні; да 38-га цыкла сярэдні ўзровень забруджанасці складае 15%, з пікамі да 30%. Вывяржэнне і паводка дасягаюць сярэдняга значэння 10, засуха і таксічны прыліў — 50."
roRO = "Vremea temperată durează întotdeauna doar 3 zile, iar până la ciclul 38 contaminarea medie ajunge la 15%, cu vârfuri de 30%. Erupția și inundația ajung la o medie de 10, iar seceta și mareea toxică la 50."
huHU = "A mérsékelt időjárás mindig csak 3 napig tart; a 38. ciklusra átlagosan 15%-os szennyezettséget ér el, 30%-os csúcsértékekkel. A kitörés és az árvíz átlaga eléri a 10-et, az aszályé és a rosszvíz-áré pedig az 50-et."
arSA = "لا يستمر الطقس المعتدل أبدًا سوى 3 أيام، وبحلول الدورة 38 يبلغ متوسط التلوث فيه 15%، مع ذروات تصل إلى 30%. ويبلغ متوسط الثوران والفيضان 10، والجفاف والمدّ الفاسد 50."

["acalc79.ExtremeDifficulties.DroughtIsComingWeatherDescription"]
raw = "Temperate weather always lasts only 3 days, but their strength increases to keep up with length of hazards. By cycle 68 it has average contamination of 30% with peaks at 60%. Eruption and flood reach average 15, drought and badtide average 5 times the cycle number without limit."
status = "normal"
enUS = "Temperate weather always lasts only 3 days, but its intensity increases to keep pace with the duration of hazards. By cycle 68, it has an average contamination of 30%, with peaks of 60%. Eruptions and floods reach an average of 15, while droughts and badtides average 5 times the cycle number, with no limit."
zhCN = "温和天气始终只持续 3 天，但其强度会增加，以匹配灾害持续时间的延长。到第 68 个周期时，其平均污染率为 30%，峰值为 60%。喷发和洪水的平均强度达到周期数的 15 倍，干旱和恶潮则达到周期数的 5 倍，且没有上限。"
zhTW = "溫和天氣總是只持續 3 天，但其強度會增加，以跟上災害持續時間的增長。到第 68 個週期時，污染平均為 30%，峰值達 60%。噴發和洪水的平均值會達到週期數的 15 倍，乾旱和壞潮則會達到週期數的 5 倍，且沒有上限。"
ruRU = "Умеренная погода всегда длится всего 3 дня, но её сила увеличивается, чтобы соответствовать продолжительности опасных явлений. К 68-му циклу средний уровень загрязнения достигает 30%, а пиковый — 60%. Извержения и наводнения достигают среднего значения 15, а засухи и вредные приливы — среднего значения, равного 5-кратному номеру цикла, без ограничений."
jaJP = "温暖な天候は常に3日間しか続きませんが、災害の長さに応じてその強度は増加します。サイクル68までに、汚染度は平均30%、ピーク時には60%に達します。噴火と洪水は平均15、干ばつと有毒な潮は平均でサイクル数の5倍に達し、上限はありません。"
frFR = "Le temps tempéré ne dure toujours que 3 jours, mais son intensité augmente pour suivre la durée des catastrophes. Au cycle 68, la contamination moyenne atteint 30 %, avec des pics à 60 %. Les éruptions et les inondations atteignent une moyenne de 15, tandis que les sécheresses et les marées toxiques atteignent une moyenne égale à 5 fois le numéro du cycle, sans limite."
deDE = "Gemäßigtes Wetter dauert immer nur 3 Tage, aber seine Intensität nimmt zu, um mit der Dauer der Gefahren Schritt zu halten. Ab Zyklus 68 beträgt die durchschnittliche Kontamination 30 % mit Spitzenwerten von 60 %. Eruptionen und Überschwemmungen erreichen einen Durchschnitt von 15, Dürren und Schlechtwasserfluten einen Durchschnitt vom 5-Fachen der Zyklusnummer, ohne Obergrenze."
plPL = "Umiarkowana pogoda zawsze trwa tylko 3 dni, ale jej siła wzrasta, by dorównać długości zagrożeń. Do 68. cyklu jej średnie skażenie wynosi 30%, a szczytowe wartości sięgają 60%. Erupcje i powodzie osiągają średnio 15, a susze i złe przypływy średnio 5 razy więcej niż numer cyklu, bez ograniczeń."
ptBR = "O clima temperado sempre dura apenas 3 dias, mas sua intensidade aumenta para acompanhar a duração dos perigos. No ciclo 68, a contaminação média é de 30%, com picos de 60%. Erupções e inundações chegam a uma média de 15; secas e marés tóxicas chegam a uma média de 5 vezes o número do ciclo, sem limite."
koKR = "온화한 날씨는 항상 3일만 지속되지만, 위험 상황의 지속 기간에 맞춰 그 강도가 증가합니다. 68번째 주기에는 오염도가 평균 30%, 최고 60%에 이릅니다. 분화와 홍수는 평균 15회, 가뭄과 악조는 제한 없이 주기 수의 5배에 이릅니다."
trTR = "Ilıman hava her zaman yalnızca 3 gün sürer, ancak şiddeti tehlikelerin süresine ayak uyduracak şekilde artar. 68. döngüde kirlilik ortalama %30, zirve değerlerde ise %60 olur. Patlama ve sel ortalama 15'e, kuraklık ve zehirli gelgit ise sınır olmaksızın döngü sayısının ortalama 5 katına ulaşır."
esES = "El clima templado siempre dura solo 3 días, pero su intensidad aumenta para mantenerse a la par con la duración de los peligros. Para el ciclo 68, tiene una contaminación media del 30 %, con picos del 60 %. Las erupciones y las inundaciones alcanzan una media de 15; las sequías y las mareas tóxicas, una media de 5 veces el número de ciclo, sin límite."
itIT = "Il clima temperato dura sempre solo 3 giorni, ma la loro intensità aumenta per tenere il passo con la durata delle calamità. Al ciclo 68 raggiunge una contaminazione media del 30%, con picchi del 60%. Eruzioni e inondazioni raggiungono una media di 15, mentre siccità e maree tossiche raggiungono una media pari a 5 volte il numero del ciclo, senza limiti."
ukUA = "Помірна погода завжди триває лише 3 дні, але інтенсивність небезпечних явищ зростає відповідно до їхньої тривалості. До 68-го циклу середній рівень забруднення становить 30%, а піки сягають 60%. Виверження й повінь досягають середнього значення 15, а посуха й токсичний приплив — середнього значення, що дорівнює 5-кратному номеру циклу, без обмежень."
thTH = "สภาพอากาศอบอุ่นมีระยะเวลาเพียง 3 วันเสมอ แต่ความรุนแรงจะเพิ่มขึ้นตามระยะเวลาของภัยพิบัติ เมื่อถึงวัฏจักรที่ 68 จะมีการปนเปื้อนเฉลี่ย 30% และสูงสุดถึง 60% การปะทุและน้ำท่วมมีค่าเฉลี่ยถึง 15 ส่วนภัยแล้งและคลื่นน้ำเสียมีค่าเฉลี่ย 5 เท่าของหมายเลขวัฏจักรโดยไม่มีขีดจำกัด"
csCZ = "Mírné počasí trvá vždy jen 3 dny, ale jeho intenzita se zvyšuje, aby odpovídala délce nebezpečných událostí. Do 68. cyklu dosahuje průměrná kontaminace 30 % a maxima 60 %. Erupce a povodeň dosahují průměrné hodnoty 15, sucho a toxický příliv průměrně 5násobku čísla cyklu, bez omezení."
viVN = "Thời tiết ôn hòa luôn chỉ kéo dài 3 ngày, nhưng cường độ sẽ tăng lên để tương ứng với thời gian kéo dài của các mối nguy. Đến chu kỳ 68, mức ô nhiễm trung bình là 30%, đạt đỉnh 60%. Phun trào và lũ lụt đạt mức trung bình 15, hạn hán và triều độc đạt mức trung bình gấp 5 lần số chu kỳ, không giới hạn."
caES = "El temps temperat dura sempre només 3 dies, però la seva intensitat augmenta per adaptar-se a la durada dels perills. Al cicle 68, la contaminació mitjana és del 30%, amb pics del 60%. Les erupcions i les inundacions arriben a una mitjana de 15; les sequeres i les marees tòxiques, a una mitjana de 5 vegades el número de cicle, sense límit."
beBY = "Умеранае надвор’е заўсёды доўжыцца толькі 3 дні, але яго інтэнсіўнасць павялічваецца, каб не адставаць ад працягласці небяспечных з’яў. Да 68-га цыкла сярэдні ўзровень забруджвання ў ім дасягае 30%, з пікамі да 60%. Вывяржэнне і паводка дасягаюць сярэдняй працягласці 15, а засуха і атрутны прыліў — сярэдняй працягласці, роўнай 5-кратнаму нумару цыкла, без абмежавання."
roRO = "Vremea temperată durează întotdeauna doar 3 zile, dar intensitatea pericolelor crește pentru a ține pasul cu durata lor. Până la ciclul 68, aceasta are o contaminare medie de 30%, cu vârfuri de 60%. Erupția și inundația ajung la o medie de 15, iar seceta și mareea toxică la o medie de 5 ori numărul ciclului, fără limită."
huHU = "A mérsékelt időjárás mindig csak 3 napig tart, de az ereje növekszik, hogy lépést tartson a veszélyes időszakok hosszával. A 68. ciklusra átlagosan 30%-os a szennyezettsége, a csúcsérték pedig 60%. A kitörés és az árvíz átlagosan 15-öt ér el, az aszály és a rosszvíz-ár pedig a ciklusszám ötszörösét, korlátlanul."
arSA = "يستمر الطقس المعتدل دائمًا 3 أيام فقط، لكن شدته تزداد لمواكبة طول المخاطر. بحلول الدورة 68، يبلغ متوسط التلوث فيه 30%، مع ذروات تصل إلى 60%. يصل متوسط الثوران والفيضان إلى 15، بينما يبلغ متوسط الجفاف والمدّ الملوّث 5 أضعاف رقم الدورة، بلا حد."

["acalc79.ExtremeDifficulties.ScorchedEarthWeatherDescription"]
raw = "Hazards average 15 times the cycle number. Hard's temperate weather with source strength scaling to keep up with hazards."
