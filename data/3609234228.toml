enUS = "Hazards average 15 times the cycle number. Hard's temperate weather, with source strength scaling to keep up with hazards."
zhCN = "灾害的平均强度为周期数的 15 倍。困难模式下的温和天气会调整水源强度，以跟上灾害强度。"
zhTW = "災害平均為週期編號的 15 倍。困難模式的溫和天氣會調整水源強度，以跟上災害變化。"
ruRU = "Опасности в среднем в 15 раз превышают номер цикла. Умеренная погода режима «Сложно», а сила источников растёт, чтобы не отставать от опасностей."
jaJP = "災害の規模はサイクル数の15倍が平均です。ハードの温帯気候で、水源の強さは災害に追いつくよう変化します。"
frFR = "Les dangers sont en moyenne 15 fois supérieurs au numéro du cycle. La météo tempérée de la difficulté Difficile, avec une intensité des sources ajustée pour suivre le rythme des dangers."
deDE = "Gefahren liegen im Durchschnitt beim 15-Fachen der Zyklusnummer. Das gemäßigte Wetter auf „Schwer“ wird durch eine angepasste Quellenstärke ergänzt, damit sie mit den Gefahren mithalten kann."
plPL = "Zagrożenia wynoszą średnio 15 razy tyle co numer cyklu. Umiarkowana pogoda na poziomie trudnym, a siła źródeł rośnie, by nadążyć za zagrożeniami."
ptBR = "Os perigos têm uma média de 15 vezes o número do ciclo. Clima temperado do modo Difícil, com a intensidade das fontes escalando para acompanhar os perigos."
koKR = "위험도는 주기 번호의 15배를 평균으로 합니다. 어려움 모드의 온화한 날씨를 적용하고, 위험도에 맞춰 수원 강도를 조정합니다."
trTR = "Tehlikeler, döngü numarasının ortalama 15 katıdır. Zorluğun ılıman havası ve tehlikelere ayak uyduracak şekilde ölçeklenen kaynak gücü."
esES = "Los peligros tienen un promedio de 15 veces el número del ciclo. Clima templado de dificultad Difícil, con la intensidad de las fuentes ajustada para seguir el ritmo de los peligros."
itIT = "I pericoli sono in media 15 volte il numero del ciclo. Clima temperato della difficoltà Difficile, con la potenza delle sorgenti che si adatta per stare al passo con i pericoli."
ukUA = "У середньому небезпеки дорівнюють 15-кратному номеру циклу. Помірна погода рівня «Складно», а сила джерел масштабується відповідно до небезпек."
thTH = "อันตรายมีค่าเฉลี่ย 15 เท่าของหมายเลขรอบ สภาพอากาศเขตอบอุ่นระดับยาก โดยปรับความแรงของแหล่งน้ำให้สอดคล้องกับอันตรายเหล่านี้."
csCZ = "Nebezpečí dosahují v průměru 15násobku čísla cyklu. Mírné počasí režimu Těžká obtížnost a síla zdrojů se přizpůsobují tak, aby držely krok s nebezpečími."
viVN = "Mức độ khắc nghiệt trung bình gấp 15 lần số chu kỳ. Thời tiết ôn hòa của chế độ Khó, với cường độ nguồn tăng theo để theo kịp các mối nguy hiểm."
caES = "La mitjana dels perills és 15 vegades el número del cicle. Clima temperat del mode Difícil, amb la intensitat de les fonts escalada per seguir el ritme dels perills."
beBY = "Небяспекі ў сярэднім у 15 разоў перавышаюць нумар цыкла. Умеранае надвор'е ўзроўню «Цяжкі» з магутнасцю крыніц, якая маштабуецца ў адпаведнасці з небяспекамі."
roRO = "Pericolele au în medie de 15 ori numărul ciclului. Vremea temperată din modul Dificil, cu intensitatea surselor ajustată pentru a ține pasul cu pericolele."
huHU = "A veszélyek átlagos értéke a ciklusszám 15-szöröse. A Hard mérsékelt időjárása, a források erőssége pedig a veszélyekhez igazodva skálázódik."
arSA = "يبلغ متوسط شدة الأخطار 15 ضعف رقم الدورة. طقس معتدل على مستوى الصعوبة الصعب، مع تحجيم قوة المصادر لمواكبة الأخطار."
