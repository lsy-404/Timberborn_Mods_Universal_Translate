["evaporation.settings.coveredevaporationrate.desc"]
raw = "How slow or fast covered water evaporates compared to Vanilla. 100% = vanilla, 1% is 100x slower."
status = "normal"
enUS = "How slow or fast covered water evaporates compared to Vanilla. 100% = vanilla, 1% is 100x slower."
zhCN = "被遮蔽水面相比于游戏默认的蒸发速度（100%=原版，1%=减慢100倍）。"
zhTW = "與香草相比，蓋住的水蒸發得多慢或多快。100% = 香草，1% 是 100 倍慢。"
ruRU = "Насколько медленно или быстро испаряется покрытая вода по сравнению с ванилью. 100% = ваниль, 1% - в 100 раз медленнее."
jaJP = "バニラと比較して、水がどれくらい遅くまたは早く蒸発するか。100％＝バニラ、1％は100倍遅い。"
frFR = "À quelle vitesse ou lenteur l'eau couverte s'évapore par rapport à la vanille. 100 % = vanille, 1 % est 100 fois plus lent."
deDE = "Wie langsam oder schnell Wasser im Vergleich zu Vanille verdampft. 100% = Vanille, 1% ist 100x langsamer."
plPL = "Jak wolno lub szybko woda pokryta paruje w porównaniu do wanilii. 100% = wanilia, 1% to 100 razy wolniej."
ptBR = "Quão lenta ou rapidamente a água coberta evapora em comparação com a baunilha. 100% = baunilha, 1% é 100x mais lento."
koKR = "덮인 물이 바닐라와 비교하여 얼마나 느리게 또는 빠르게 증발하는지를 나타냅니다. 100% = 바닐라, 1%는 100배 느리게 증발합니다."
trTR = "Kapalı suyun buhardaşımanın Vanilya'ya göre ne kadar yavaş veya hızlı olduğu. %100 = vanilya, %1 100 kat daha yavaş."
esES = "Qué tan lento o rápido se evapora el agua cubierta en comparación con el juego original. 100% = original, 1% es 100 veces más lento."
itIT = "Quanto più lentamente o rapidamente l'acqua coperta evapora rispetto a Vanilla. 100% = vanilla, 1% è 100 volte più lento."
ukUA = "Наскільки повільніше або швидше випаровується покрита вода порівняно з ванільною. 100% = ванільна швидкість, 1% означає в 100 разів повільніше."
thTH = "ความเร็วที่น้ำที่ถูกปกคลุมระเหยช้าหรือเร็วเมื่อเทียบกับค่าเริ่มต้นของเกม 100% = ค่าเริ่มต้น, 1% หมายถึงช้ากว่า 100 เท่า"
csCZ = "Jak pomalu nebo rychle se zakrytá voda odpařuje v porovnání s Vanilkou. 100 % = vanilka, 1 % je 100x pomalejší."
viVN = "Mức độ nước được phủ bay hơi nhanh hay chậm so với Vanilla. 100% = Vanilla, 1% chậm hơn 100 lần."
caES = "Amb quina rapidesa s'evapora l'aigua coberta en comparació amb la versió original. 100% = com l'original, 1% és 100 vegades més lent."
beBY = "Наколькі хутка або павольна накрытая вада выпараецца ў параўнанні з ванільнай гульнёй. 100% = ванільная гульня, 1% — у 100 разоў павольней."
roRO = "Cât de lentă sau rapidă se evaporă apa acoperită, comparativ cu jocul de bază. 100% = vanilla, 1% înseamnă de 100 de ori mai lentă."
huHU = "A borítás alatti víz párolgása a Vanillához képest mennyivel lassabb vagy gyorsabb. 100% = vanilla, 1% 100-szor lassabb."
arSA = "مدى سرعة أو بطء تبخر المياه المغطاة مقارنةً بالإعداد الأصلي للعبة. 100% = الإعداد الأصلي، و1% يعني أن التبخر أبطأ بمقدار 100 مرة."

