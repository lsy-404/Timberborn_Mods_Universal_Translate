["evaporation.settings.updateinterval.desc"]
raw = "How often to update coverage detection (1=faster, 10=slower). Roughly: 1≈half day, 5≈2 days, 10≈week."
status = "normal"
enUS = "How often to update coverage detection (1=faster, 10=slower). Roughly: 1≈half day, 5≈2 days, 10≈week."
zhCN = "模组主逻辑的运行频率，即遮蔽检测刷新的间隔（1=较快，10=较慢；1≈半天，5≈2天，10≈1周）。"
zhTW = "更新覆蓋檢測的頻率應該如何？（1=較快，10=較慢）。大致上：1≈半天，5≈2天，10≈一週。"
ruRU = "Как часто обновлять обнаружение покрытия (1=быстрее, 10=медленнее). Приблизительно: 1≈полдня, 5≈2 дня, 10≈неделя."
jaJP = "カバレッジ検出の更新頻度（1=速い、10=遅い）。大体の目安: 1≈半日、5≈2日、10≈1週間。"
frFR = "À quelle fréquence mettre à jour la détection de couverture (1=plus rapide, 10=plus lent). Approximativement : 1≈demi-journée, 5≈2 jours, 10≈semaine."
deDE = "Wie oft die Abdeckungsdetektion aktualisiert werden soll (1=schneller, 10=langsamer). Ungefähr: 1≈halb Tag, 5≈2 Tage, 10≈Woche."
plPL = "Jak często aktualizować wykrywanie pokrycia (1=szybciej, 10=wolniej). Orientacyjnie: 1≈pół dnia, 5≈2 dni, 10≈tydzień."
ptBR = "Com que frequência atualizar a detecção de cobertura (1=mais rápido, 10=mais lento). Aproximadamente: 1≈meio dia, 5≈2 dias, 10≈semana."
koKR = "커버리지 감지를 얼마나 자주 업데이트할지 설정합니다 (1=빠름, 10=느림). 대략적으로: 1≈반일, 5≈2일, 10≈1주일."
trTR = "Kaplama tespitini ne sıklıkla güncelleyeceğinizi ayarlayın (1=daha hızlı, 10=daha yavaş). Yaklaşık olarak: 1≈yarım gün, 5≈2 gün, 10≈hafta."
esES = "Con qué frecuencia actualizar la detección de cobertura (1=más rápido, 10=más lento). Aproximadamente: 1≈medio día, 5≈2 días, 10≈una semana."
itIT = "Quanto spesso aggiornare il rilevamento della copertura (1=più veloce, 10=più lento). Indicativamente: 1≈mezza giornata, 5≈2 giorni, 10≈una settimana."
ukUA = "Як часто оновлювати визначення покриття (1 = частіше, 10 = рідше). Орієнтовно: 1 ≈ пів дня, 5 ≈ 2 дні, 10 ≈ тиждень."
thTH = "ความถี่ในการอัปเดตการตรวจจับพื้นที่ครอบคลุม (1=เร็วกว่า, 10=ช้ากว่า) โดยประมาณ: 1≈ครึ่งวัน, 5≈2 วัน, 10≈1 สัปดาห์"
csCZ = "Jak často aktualizovat detekci pokrytí (1=rychleji, 10=pomaleji). Přibližně: 1≈polovina dne, 5≈2 dny, 10≈týden."
viVN = "Tần suất cập nhật phát hiện độ phủ (1=nhanh hơn, 10=chậm hơn). Xấp xỉ: 1≈nửa ngày, 5≈2 ngày, 10≈tuần."
caES = "Con de sovint actualitzar la detecció de cobertura (1=més ràpid, 10=més lent). Aproximadament: 1≈mig dia, 5≈2 dies, 10≈una setmana."
beBY = "Як часта абнаўляць выяўленне покрыцця (1=хутчэй, 10=павольней). Прыблізна: 1≈паўдня, 5≈2 дні, 10≈тыдзень."
roRO = "Cât de des să se actualizeze detectarea acoperirii (1=mai rapid, 10=mai lent). Aproximativ: 1≈o jumătate de zi, 5≈2 zile, 10≈o săptămână."
huHU = "Milyen gyakran frissüljön a lefedettség-érzékelés (1=gyorsabban, 10=lassabban). Nagyjából: 1≈fél nap, 5≈2 nap, 10≈egy hét."
arSA = "كم مرة يتم تحديث كشف التغطية (1 = أسرع، 10 = أبطأ). تقريباً: 1 ≈ نصف يوم، 5 ≈ يومان، 10 ≈ أسبوع."
