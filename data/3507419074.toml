["evaporation.settings.maxsearchheight.desc"]
raw = "How high above water to search for cover. Higher values detect taller structures but may impact performance on large maps."
status = "normal"
enUS = "How high above water to search for cover. Higher values detect taller structures but may impact performance on large maps."
zhCN = "检测水面上是否存在遮蔽物的最大高度。数值越高，遮蔽物可以离水面越高，但在大地图可能影响性能。"
zhTW = "搜索掩護的水面高度應為多高。較高的數值可以檢測到較高的結構，但可能會影響在大地圖上的性能。"
ruRU = "На какой высоте над водой искать укрытие. Более высокие значения обнаруживают более высокие объекты, но могут негативно сказаться на производительности на больших картах."
jaJP = "水面からどのくらいの高さでカバーを探すか。高い値は高い構造物を検出しますが、大きなマップではパフォーマンスに影響を与える可能性があります。"
frFR = "À quelle hauteur au-dessus de l'eau rechercher un abri. Des valeurs plus élevées détectent des structures plus hautes, mais peuvent affecter les performances sur de grandes cartes."
deDE = "Wie hoch über dem Wasser man nach Deckung suchen soll. Höhere Werte erkennen höhere Strukturen, können jedoch die Leistung auf großen Karten beeinträchtigen."
plPL = "Jak wysoko nad wodą szukać osłony. Wyższe wartości wykrywają wyższe struktury, ale mogą wpływać na wydajność na dużych mapach."
ptBR = "Quão alto acima da água procurar abrigo. Valores mais altos detectam estruturas mais altas, mas podem impactar o desempenho em mapas grandes."
koKR = "물 위에서 덮개를 검색하는 높이. 더 높은 값은 더 높은 구조물을 탐지하지만 큰 맵에서는 성능에 영향을 미칠 수 있습니다."
trTR = "Kapak aramak için suyun ne kadar üstünde yüksekliğe kadar çıkılacağını belirtir. Daha yüksek değerler, daha yüksek yapıları tespit eder ancak büyük haritalarda performansı etkileyebilir."
esES = "Qué altura sobre el agua se buscará para encontrar cobertura. Los valores más altos detectan estructuras más altas, pero pueden afectar el rendimiento en mapas grandes."
itIT = "Quanto in alto sopra l'acqua cercare una copertura. Valori più alti rilevano strutture più alte, ma possono influire sulle prestazioni nelle mappe grandi."
ukUA = "Наскільки високо над водою шукати укриття. Більші значення виявляють вищі споруди, але можуть погіршити продуктивність на великих картах."
thTH = "ระดับความสูงเหนือน้ำที่จะใช้ค้นหาสิ่งปกคลุม ค่าที่สูงขึ้นสามารถตรวจจับโครงสร้างที่สูงกว่าได้ แต่อาจส่งผลต่อประสิทธิภาพในแผนที่ขนาดใหญ่"
csCZ = "Jak vysoko nad vodou hledat kryt. Vyšší hodnoty detekují vyšší struktury, ale mohou ovlivnit výkon na velkých mapách."
viVN = "Độ cao so với mặt nước để tìm chỗ che chắn. Các giá trị cao hơn sẽ phát hiện các công trình cao hơn nhưng có thể ảnh hưởng đến hiệu suất trên các bản đồ lớn."
caES = "Com d'alt per sobre de l'aigua cal buscar cobertura. Els valors més alts detecten estructures més altes, però poden afectar el rendiment en mapes grans."
beBY = "Наколькі высока над вадой шукаць укрыццё. Большыя значэнні выяўляюць вышэйшыя пабудовы, але могуць паўплываць на прадукцыйнасць на вялікіх картах."
roRO = "Cât de sus deasupra apei să se caute adăpost. Valorile mai mari detectează structuri mai înalte, dar pot afecta performanța pe hărțile mari."
huHU = "Milyen magasan a víz felett keressen fedezéket. A magasabb értékek magasabb építményeket is észlelnek, de nagy térképeken ronthatják a teljesítményt."
arSA = "ما مدى الارتفاع فوق سطح الماء الذي يُبحث فيه عن مكان للاحتماء. القيم الأعلى تكشف الهياكل الأطول، لكنها قد تؤثر على الأداء في الخرائط الكبيرة."

