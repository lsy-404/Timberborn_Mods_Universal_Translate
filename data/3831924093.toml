["ChessPlanter.Tool.Description"]
status = "normal"
raw = "Drag an area to plant all picked crops in diagonal stripes, each with the same share. Fields that are already marked stay as they are."
enUS = "Drag an area to plant all picked crops in diagonal stripes, each with the same share. Fields that are already marked stay as they are."
zhCN = "拖动选择一个区域，将所有已选作物按对角条纹种植，每种作物所占比例相同。已标记的地块保持不变。"
zhTW = "拖曳選取一個區域，即可將所有已選定的作物以斜紋方式種植，且每種作物所佔比例相同。已標記的田地保持不變。"
ruRU = "Перетащите область, чтобы посадить все выбранные культуры диагональными полосами, каждую в одинаковой доле. Участки, которые уже отмечены, остаются без изменений."
jaJP = "エリアをドラッグすると、選択したすべての作物を斜めの縞模様で、それぞれ同じ割合で植えます。すでにマークされている畑はそのまま残ります。"
frFR = "Faites glisser une zone pour planter toutes les cultures sélectionnées en bandes diagonales, chacune avec la même part. Les champs déjà marqués restent tels quels."
deDE = "Ziehe einen Bereich auf, um alle ausgewählten Feldfrüchte in diagonalen Streifen mit jeweils gleichem Anteil zu pflanzen. Bereits markierte Felder bleiben unverändert."
plPL = "Przeciągnij, aby zaznaczyć obszar, a następnie zasadź wszystkie zebrane uprawy w ukośnych pasach, każdą w takiej samej proporcji. Pola, które są już oznaczone, pozostają bez zmian."
ptBR = "Arraste sobre uma área para plantar todas as culturas colhidas em faixas diagonais, cada uma com a mesma proporção. Os campos que já estiverem marcados permanecem como estão."
koKR = "드래그하여 영역을 지정하면, 수확한 작물을 모두 대각선 줄무늬 형태로 심되 각 작물을 같은 비율로 나눠 심습니다. 이미 표시된 밭은 그대로 둡니다."
trTR = "Alanı sürükleyerek toplanan tüm ürünleri eşit paylarla çapraz şeritler halinde ekin. Zaten işaretlenmiş tarlalar olduğu gibi kalır."
esES = "Arrastra sobre un área para plantar todos los cultivos recolectados en franjas diagonales, cada uno con la misma proporción. Los campos que ya están marcados se mantienen como están."
itIT = "Trascina su un'area per piantare tutte le colture raccolte in strisce diagonali, ciascuna con la stessa quota. I campi già contrassegnati restano invariati."
ukUA = "Перетягніть область, щоб посадити всі обрані культури діагональними смугами, кожну в однаковій частці. Ділянки, які вже позначені, залишаються без змін."
thTH = "ลากเพื่อกำหนดพื้นที่ จากนั้นจะปลูกพืชที่เก็บเกี่ยวแล้วทั้งหมดเป็นแถบทแยงมุม โดยแต่ละชนิดได้สัดส่วนเท่ากัน ช่องที่ทำเครื่องหมายไว้แล้วจะคงสถานะเดิม"
csCZ = "Přetažením oblasti zasadíte všechny vybrané plodiny do diagonálních pruhů, přičemž každá bude mít stejný podíl. Pole, která jsou již označena, zůstanou beze změny."
viVN = "Kéo qua một khu vực để trồng tất cả các loại cây đã chọn theo các dải chéo, mỗi loại chiếm cùng một phần diện tích. Các ô đất đã được đánh dấu sẽ giữ nguyên như hiện tại."
caES = "Arrossegueu sobre una àrea per plantar tots els cultius seleccionats en franges diagonals, cadascun amb la mateixa proporció. Els camps que ja estan marcats es mantenen tal com estan."
beBY = "Пракіруйце вобласць, каб пасадзіць усе абраныя культуры ў дыяганальныя палосы, кожную ў роўнай частцы. Ужо пазначаныя ўчасткі застаюцца без змен."
roRO = "Trage peste o zonă pentru a planta toate culturile alese în benzi diagonale, fiecare cu aceeași pondere. Câmpurile care sunt deja marcate rămân neschimbate."
huHU = "Húzzon ki egy területet, hogy az összes kiválasztott növényt átlós csíkokban ültesse el, mindegyikből azonos arányban. A már megjelölt táblák változatlanok maradnak."
arSA = "اسحب على منطقة لزراعة جميع المحاصيل المختارة في خطوط مائلة، بحصة متساوية لكل منها. تبقى الحقول المحددة بالفعل كما هي."

