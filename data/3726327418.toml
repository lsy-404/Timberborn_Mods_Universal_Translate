ptBR = "<YellowHighlight>Este local ainda está muito fresco e nu. Pode se desenvolver à medida que a árvore cresce.</YellowHighlight>"
koKR = "<YellowHighlight>이 장소는 아직 매우 새롭고 텅 비어 있습니다. 나무가 자라면서 발전할 수 있습니다.</YellowHighlight>"
trTR = "<YellowHighlight>Bu alan hala çok yeni ve çıplak. Ağaç büyüdükçe gelişebilir.</YellowHighlight>"
