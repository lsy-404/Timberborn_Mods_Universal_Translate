["ModSetting.TWAllWeatherDrill.OtherWeatherScaleDesc"]
raw = "Scale applied to water flow during hazardous weather that is not a drought or a badtide (This hopefully catches most modded weather). Vanilla value = 0"
status = "normal"
enUS = "Scale applied to water flow during hazardous weather that is not a drought or a badtide (This hopefully catches most modded weather). Vanilla value = 0"
zhCN = "非干旱期或恶水潮的恶劣天气时含水层的水流强度相对于水力的倍率（用于兼容其他模组添加的天气）（游戏默认：0）。"
zhTW = "在危險天氣下（不包括乾旱或潮汐災害）對水流應用的比例（希望這能涵蓋大多數模組化的天氣）。原版值 = 0"
ruRU = "Масштаб, применяемый к потоку воды во время опасной погоды, которая не является засухой или плохим приливом (это, надеюсь, охватывает большинство модифицированной погоды). Значение по умолчанию = 0"
jaJP = "「干ばつや悪潮ではない危険な天候時に適用される水流のスケール（これでほとんどのモッド天候をカバーできることを願っています）。元の値 = 0」"
frFR = "Échelle appliquée au débit d'eau pendant des conditions météorologiques dangereuses qui ne sont pas une sécheresse ou une marée basse (Cela devrait idéalement inclure la plupart des conditions météorologiques modifiées). Valeur par défaut = 0"
deDE = "Skalierung, die während gefährlicher Wetterbedingungen angewendet wird, die keine Dürre oder Flut ist (das sollte hoffentlich die meisten modifizierten Wetterbedingungen erfassen). Vanilla-Wert = 0"
plPL = "Skala stosowana w przypadku przepływu wody podczas niebezpiecznych warunków pogodowych, które nie są suszą ani złym przypływem (mam nadzieję, że obejmuje to większość zmodyfikowanej pogody). Wartość standardowa = 0"
ptBR = "Escala aplicada ao fluxo de água durante condições climáticas adversas que não sejam seca ou maré baixa (Isso deve abranger a maioria dos climas modificados). Valor padrão = 0"
koKR = "가뭄이나 나쁜 조수 상태가 아닌 위험한 날씨 동안 물 흐름에 적용되는 스케일(이것은 대부분의 모드된 날씨를 포함하길 바랍니다). 기본값 = 0"
trTR = "Tehlikeli hava koşullarında, kıtlık veya kötü gelgit olmayan su akışına uygulanan ölçek (Umarız, modlu havanın çoğunu kapsar). Vanilla değeri = 0"
esES = "Factor aplicado al caudal de agua durante fenómenos meteorológicos peligrosos que no sean una sequía ni una marea tóxica (Con suerte, esto abarca la mayoría de los fenómenos meteorológicos añadidos por mods). Valor del juego base = 0"
itIT = "Moltiplicatore applicato al flusso d'acqua durante condizioni meteorologiche pericolose che non siano una siccità o una marea di acqua contaminata (Si spera che questo includa la maggior parte delle condizioni meteorologiche aggiunte dalle mod). Valore vanilla = 0"
ukUA = "Множник, що застосовується до потоку води під час небезпечної погоди, яка не є посухою чи токсичним припливом (сподіваємося, це охопить більшість погодних умов із модів). Стандартне значення = 0"
thTH = "ตัวคูณที่ใช้กับอัตราการไหลของน้ำในช่วงสภาพอากาศอันตรายที่ไม่ใช่ภัยแล้งหรือคลื่นน้ำเสีย (หวังว่าจะครอบคลุมสภาพอากาศจากม็อดส่วนใหญ่) ค่าในเกมดั้งเดิม = 0"
csCZ = "Škála aplikovaná na tok vody během nebezpečného počasí, které není suchem nebo špatnou vlnou (Toto doufejme zachytí většinu modifikovaného počasí). Výchozí hodnota = 0"
viVN = "Hệ số áp dụng cho lưu lượng nước trong thời tiết nguy hiểm, không phải hạn hán hoặc thủy triều xấu (Hy vọng điều này sẽ bắt được phần lớn thời tiết do mod thêm). Giá trị mặc định = 0"
caES = "Factor aplicat al cabal d'aigua durant fenòmens meteorològics perillosos que no siguin una sequera ni una marea tòxica (Amb sort, això inclourà la majoria dels fenòmens meteorològics afegits per mods). Valor del joc base = 0"
beBY = "Множнік для патоку вады падчас небяспечнага надвор'я, якое не з'яўляецца засухай або таксічным прылівам (Спадзяюся, гэта ахоплівае большасць надвор'я, дададзенага модамі). Значэнне ў арыгінальнай гульні = 0"
roRO = "Scală aplicată debitului de apă în timpul vremii periculoase care nu este secetă sau maree de apă contaminată (Sperăm că astfel sunt incluse majoritatea tipurilor de vreme adăugate de moduri). Valoare în jocul de bază = 0"
huHU = "A vízáramlásra alkalmazott szorzó olyan veszélyes időjárás esetén, amely nem aszály és nem rosszvíz-dagály (Remélhetőleg ez a legtöbb modolt időjárást lefedi). Alapjátékbeli érték = 0"
arSA = "المعامل المطبَّق على تدفّق المياه أثناء الطقس الخطير الذي ليس جفافًا ولا مدًّا سامًا (نأمل أن يشمل هذا معظم أنواع الطقس التي تضيفها التعديلات). القيمة في اللعبة الأساسية = 0"

