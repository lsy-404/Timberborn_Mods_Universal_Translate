thTH = "แหล่งน้ำแห้งขอด และสิ่งที่ไม่เปียกชื้นก็ลุกไหม้ รวมถึงบีเวอร์ด้วย มนุษย์ไม่เชื่อเรื่องภาวะโลกร้อน แต่พวกเราจะไม่ทำผิดพลาดแบบนั้นหรอก"
