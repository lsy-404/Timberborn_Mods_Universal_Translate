esES = "Solo los climas propios del juego, con las duraciones, penalizaciones y probabilidades de mala temporada que este asentamiento ya tenía."
itIT = "Solo i meteo originali del gioco, con le stesse durate, penalità e probabilità di badtide che questo insediamento aveva già."
ukUA = "Лише власні погодні явища гри, з тією ж тривалістю, штрафами та шансами на лиходолля, які вже були в цьому поселенні."
thTH = "เฉพาะสภาพอากาศดั้งเดิมของเกม พร้อมระยะเวลา ค่าปรับ และโอกาสเกิดพายุแล้งที่การตั้งถิ่นฐานนี้มีอยู่แล้วเท่านั้น"
csCZ = "Pouze počasí samotné hry, s délkami, postihy a pravděpodobnostmi toxického přílivu, které tato osada již měla."
viVN = "Chỉ các kiểu thời tiết có sẵn trong trò chơi, với thời lượng, bất lợi và xác suất triều độc hại mà khu định cư này vốn đã có."
caES = "Només els climes propis del joc, amb les durades, penalitzacions i probabilitats de badtide que aquest assentament ja tenia."
beBY = "Толькі ўласныя надвор'і гульні, з тымі ж тэрмінамі, штрафамі і шанцамі дрэннага часу, што ўжо меліся ў гэтым паселішчы."
roRO = "Doar vremurile proprii jocului, cu duratele, handicapurile și șansele de badtide pe care le avea deja această așezare."
huHU = "Csak a játék saját időjárásait, azokkal a hosszakkal, hátrányokkal és badtide-esélyekkel, amelyekkel ez a település már rendelkezett."
