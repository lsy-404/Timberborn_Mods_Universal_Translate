["AlternativeWeatherSystem.Weather.CorrosiveHeatwave.Flavour"]
status = "normal"
raw = "All water is contaminated, and badtide drains activated. Everything that's not wet burns. You thought heatwave was bad? Funny."
enUS = "All water is contaminated, and badtide drains activated. Everything that's not wet burns. You thought heatwave was bad? Funny."
zhCN = "所有水都被污染了，污水排放口已启动。凡是不沾水的东西都会燃烧。你还觉得热浪很糟糕？真是好笑。"
zhTW = "全部的水都受到污染，而且淤毒排水口已被啟動。凡是不潮濕的東西都會燃燒。你還覺得熱浪很糟嗎？真好笑。"
ruRU = "Вся вода заражена, и сработали стоки «плохого прилива». Всё, что не мокрое, горит. Думали, что засуха была плохой? Смешно."
jaJP = "すべての水が汚染され、バッドタイドの排水口が作動した。濡れていないものはすべて燃える。熱波がひどいと思った？笑わせるね。"
frFR = "Toute l'eau est contaminée, et les drains de mauvaise marée sont activés. Tout ce qui n'est pas mouillé brûle. Vous pensiez que la vague de chaleur était mauvaise ? Amusant."
deDE = "Alles Wasser ist verseucht, und die Schlechtwasser-Abflüsse sind aktiviert. Alles, was nicht nass ist, brennt. Du dachtest, die Hitzewelle sei schlimm? Witzig."
plPL = "Cała woda jest skażona, a odpływy badtide zostały aktywowane. Wszystko, co nie jest mokre, płonie. Myślałeś, że upał był zły? Zabawne."
ptBR = "Toda a água está contaminada, e os drenos de badtide foram ativados. Tudo o que não está molhado queima. Você achava que a onda de calor era ruim? Engraçado."
koKR = "모든 물이 오염되었고, 배드타이드 배수구가 작동했다. 젖어 있지 않은 것은 모두 불탄다. 열파가 심하다고 생각했나? 웃기시네."
trTR = "Tüm su kirlendi ve badtide tahliye kanalları devreye girdi. Islak olmayan her şey yanıyor. Sıcak dalgasını kötü mü sandın? Ne komik."
esES = "Toda el agua está contaminada, y se han activado los desagües de malamarea. Todo lo que no está mojado arde. ¿Creías que la ola de calor era mala? Qué gracioso."
itIT = "Tutta l'acqua è contaminata e le fognature della cattiva marea sono attive. Tutto ciò che non è bagnato brucia. Pensavi che l'ondata di calore fosse brutta? Divertente."
ukUA = "Уся вода забруднена, а стоки badtide активовано. Все, що не мокре, горить. Думаєте, спека була поганою? Кумедно."
thTH = "น้ำทั้งหมดปนเปื้อนแล้ว และระบบระบายน้ำของ Badtide ถูกเปิดใช้งาน ทุกอย่างที่ไม่เปียกจะไหม้ คิดว่าคลื่นความร้อนแรงแล้วหรือ? ตลกจริงๆ"
csCZ = "Veškerá voda je kontaminovaná a byly aktivovány odtoky badtide. Všechno, co není mokré, hoří. Myslel(a) sis, že vlna horka je špatná? To je k smíchu."
viVN = "Toàn bộ nước đều bị nhiễm bẩn, và các cống thoát độc hại đã được kích hoạt. Mọi thứ không ướt đều sẽ bốc cháy. Bạn tưởng đợt nắng nóng đã tệ lắm rồi à? Buồn cười thật."
caES = "Tota l'aigua està contaminada, i els desguassos de mala sort s'han activat. Tot el que no està mullat crema. Vas pensar que l'onada de calor era dolenta? Graciós."
beBY = "Уся вада забруджана, і ўключаны зліўы badtide. Усё, што не мокрае, гарыць. Думалі, што хваля спякоты — гэта кепска? Смешна."
roRO = "Toată apa este contaminată, iar scurgerile de badtide au fost activate. Tot ce nu este ud arde. Credeai că valul de căldură e rău? Amuzant."
huHU = "Minden víz szennyezett, és a mérgezett víz lecsapolói aktiválódtak. Minden, ami nem nedves, leég. Azt hitted, hogy a hőhullám rossz volt? Vicces."
arSA = "كل المياه ملوّثة، وتم تفعيل مصارف مدّ المياه الفاسدة. كل ما ليس مبللاً يحترق. ظننت أن موجة الحر كانت سيئة؟ مضحك."

