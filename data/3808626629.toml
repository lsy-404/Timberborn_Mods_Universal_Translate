["AlternativeWeatherSystem.Building.WeatherSensor.Description"]
status = "normal"
raw = "Sends a signal while the weather you choose is running, and can send it early so the gates are already open when that weather arrives."
enUS = "Sends a signal while the selected weather is in progress, and can send it early so the gates are already open when that weather arrives."
zhCN = "在你选择的天气期间发送信号，也可以提前发送信号，以便天气到来时闸门已经打开。"
zhTW = "在你選擇的天氣期間傳送訊號，也可以提前傳送，讓閘門在該天氣到來時已經開啟。"
ruRU = "Подаёт сигнал, пока длится выбранное вами погодное явление, и может подать его заранее, чтобы к его наступлению шлюзы уже были открыты."
jaJP = "選択した天候が続いている間、信号を送ります。また、その天候が到来する前に信号を送ることもできるため、天候が到来した時点でゲートがすでに開いている状態にできます。"
frFR = "Émet un signal pendant la période météorologique de votre choix et peut l’émettre à l’avance afin que les vannes soient déjà ouvertes à l’arrivée de cette période."
