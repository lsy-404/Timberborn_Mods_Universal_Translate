ruRU = "Подаёт сигнал во время выбранного вами погодного явления и может подать его заранее, чтобы ворота уже были открыты к его началу."
jaJP = "選択した天候の間、信号を送ります。また、その天候が始まる前に信号を送って、天候が到来したときにゲートがすでに開いているようにすることもできます。"
