["AlternativeWeatherSystem.Building.WeatherSensor.Description"]
raw = "Sends a signal while the weather you choose is running, and can send it early so the gates are already open when that weather arrives."
status = "abandoned"
enUS = "Sends a signal while the weather you choose is active, and can send it early so the gates are already open when that weather arrives."
zhCN = "在你选择的天气期间发送信号，也可以提前发送信号，以便该天气到来时闸门已经开启。"
zhTW = "在你選擇的天氣期間傳送訊號，也可以提前傳送，讓閘門在該天氣到來時已經開啟。"
ruRU = "Подаёт сигнал во время выбранного вами погодного явления и может подать его заранее, чтобы ворота уже были открыты к его началу."
jaJP = "選択した天候の間、信号を送ります。また、その天候が始まる前に信号を送って、天候が到来したときにゲートがすでに開いているようにすることもできます。"
frFR = "Envoie un signal pendant la météo choisie et peut l’envoyer à l’avance afin que les vannes soient déjà ouvertes lorsque cette météo arrive."
deDE = "Sendet ein Signal, solange das ausgewählte Wetter anhält, und kann es frühzeitig senden, damit die Tore bereits geöffnet sind, wenn dieses Wetter einsetzt."
plPL = "Wysyła sygnał, gdy trwa wybrana przez ciebie pogoda, i może wysłać go wcześniej, aby śluzy były już otwarte, gdy ta pogoda nadejdzie."
ptBR = "Envia um sinal enquanto o clima escolhido está ocorrendo e pode enviá-lo antecipadamente para que as comportas já estejam abertas quando esse clima chegar."
koKR = "선택한 날씨가 지속되는 동안 신호를 보내며, 해당 날씨가 시작되기 전에 미리 신호를 보내 그 날씨가 도래했을 때 수문이 이미 열려 있게 할 수 있습니다."
trTR = "Seçtiğiniz hava durumu devam ederken sinyal gönderir ve bu hava durumu geldiğinde kapılar zaten açık olsun diye sinyali önceden gönderebilir."
esES = "Envía una señal mientras dure el clima que elijas, y puede enviarla antes para que las compuertas ya estén abiertas cuando llegue ese clima."
itIT = "Invia un segnale mentre il tempo atmosferico scelto è in corso, e può inviarlo in anticipo in modo che le porte siano già aperte quando quel tempo arriva."
ukUA = "Надсилає сигнал, поки триває обраний вами тип погоди, і може надсилати його раніше, щоб шлюзи вже були відчинені до приходу цієї погоди."
thTH = "ส่งสัญญาณขณะที่สภาพอากาศที่คุณเลือกกำลังดำเนินอยู่ และสามารถส่งสัญญาณก่อนเวลาได้ เพื่อให้ประตูเปิดอยู่แล้วเมื่อสภาพอากาศนั้นมาถึง"
csCZ = "Odesílá signál, když nastane zvolené počasí, a může ho odeslat předčasně, aby už byly brány otevřené, až toto počasí nastane."
viVN = "Gửi tín hiệu khi kiểu thời tiết bạn chọn đang diễn ra và có thể gửi tín hiệu sớm để các cổng đã mở sẵn khi kiểu thời tiết đó đến."
caES = "Envia un senyal mentre el clima que triïs està en curs, i pot enviar-lo abans perquè les comportes ja estiguin obertes quan arribi aquest clima."
beBY = "Падае сігнал, пакуль працуе абранае вамі надвор'е, і можа падаваць яго раней, каб затворы ўжо былі адчынены, калі надвор'е прыйдзе."
roRO = "Trimite un semnal cât timp vremea aleasă este activă și poate trimite semnalul mai devreme, astfel încât porțile să fie deja deschise când sosește acea vreme."
huHU = "A kiválasztott időjárás ideje alatt jelet küld, és előre is küldhet jelet, hogy a kapuk már nyitva legyenek, amikor az időjárás megérkezik."
arSA = "يرسل إشارة طالما أن الطقس الذي تختاره قائم، ويمكنه إرسالها مبكرًا بحيث تكون البوابات مفتوحة بالفعل عند وصول ذلك الطقس."
