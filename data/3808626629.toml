frFR = "Uniquement les conditions météo du jeu, avec les durées, les handicaps et les probabilités de marée toxique que cette colonie avait déjà."
deDE = "Nur die Wetterereignisse des Spiels selbst, mit den Längen, Erschwernissen und Badetiden-Wahrscheinlichkeiten, die diese Siedlung bereits hatte."
plPL = "Tylko pogoda z samej gry, z długościami, utrudnieniami i szansami na złą falę, które ta osada już miała."
