["AlternativeWeatherSystem.Mode.Easy.Description"]
raw = "Long temperate spells and short hazards. Badtides start after five cycles and stay rare."
status = "normal"
enUS = "Long temperate spells and short hazards. Badtides start after five cycles and stay rare."
zhCN = "漫长的温和时节，短暂的灾害。恶水潮在第五个周期后才会开始，且较为罕见。"
zhTW = "長時間的溫和時期與短暫的危險期。五個週期後才會開始出現毒水潮，且仍然很罕見。"
ruRU = "Длительные умеренные периоды и короткие опасности. Badtides начинаются после пяти циклов и остаются редкими."
jaJP = "穏やかな天候が長く続き、危険な天候は短期間です。バッドタイドは5サイクル目から始まりますが、発生はまれです。"
frFR = "De longues périodes tempérées et de courts dangers. Les marées toxiques commencent après cinq cycles et restent rares."
deDE = "Lange gemäßigte Phasen und kurze Gefahren. Badtiden beginnen nach fünf Zyklen und bleiben selten."
plPL = "Długie łagodne okresy i krótkie zagrożenia. Złe przypływy zaczynają się po pięciu cyklach i pozostają rzadkie."
ptBR = "Longos períodos de clima temperado e perigos curtos. Marés de água tóxica começam após cinco ciclos e continuam raras."
koKR = "긴 온화한 날씨가 이어지고 짧은 위험이 찾아옵니다. 독수(Badtide)는 5주기 후부터 시작되지만 드물게 발생합니다."
trTR = "Uzun süren ılıman dönemler ve kısa süreli tehlikeler. Kötü gelgitler beş döngüden sonra başlar ve nadir kalır."
esES = "Largos periodos templados y peligros breves. Las marejadas tóxicas comienzan tras cinco ciclos y siguen siendo raras."
itIT = "Lunghi periodi temperati e brevi pericoli. Le maree nere iniziano dopo cinque cicli e restano rare."
ukUA = "Тривалі помірні періоди та короткі небезпеки. Badtides починаються після п'яти циклів і залишаються рідкісними."
thTH = "ช่วงอากาศอ่อนโยนยาวนาน และช่วงอันตรายสั้น ๆ Badtides จะเริ่มหลังผ่านไปห้ารอบ และยังคงเกิดขึ้นไม่บ่อยนัก"
csCZ = "Dlouhá mírná období a krátká nebezpečí. Badtides začínají po pěti cyklech a zůstávají vzácné."
viVN = "Những đợt thời tiết ôn hòa kéo dài và các mối nguy ngắn ngủi. Triều nước độc bắt đầu sau năm chu kỳ và vẫn hiếm khi xảy ra."
caES = "Llargues èpoques temperades i perills curts. Les marees malignes comencen després de cinc cicles i continuen sent rares."
beBY = "Доўгія спакойныя перыяды і кароткія небяспекі. Брудныя прыліўы пачынаюцца пасля пяці цыклаў і застаюцца рэдкімі."
roRO = "Perioade lungi și blânde, cu pericole scurte. Mareele otrăvite încep după cinci cicluri și rămân rare."
huHU = "Hosszú, mérsékelt időjárású szakaszok és rövid veszélyek. A mérgezett árapályok öt ciklus után kezdődnek, és ritkák maradnak."
arSA = "فترات طويلة معتدلة ومخاطر قصيرة. تبدأ المدّ السام بعد خمس دورات ويظل نادرًا."

["AlternativeWeatherSystem.Mode.Normal.Description"]
raw = "Cycles lengthen as the settlement grows, and the water sources pick up a little contamination late on."
status = "normal"
enUS = "Cycles lengthen as the settlement grows, and the water sources pick up a little contamination late on."
zhCN = "随着定居点发展，周期会变长，水源在后期也会受到少量污染。"
zhTW = "隨著聚落發展，週期會變長，水源也會在後期受到少許污染。"
ruRU = "По мере роста поселения циклы становятся длиннее, а источники воды ближе к концу немного загрязняются."
jaJP = "集落が成長するにつれてサイクルは長くなり、後半には水源が少し汚染されます。"
frFR = "Les cycles s’allongent à mesure que la colonie grandit, et les sources d’eau se contaminent légèrement vers la fin."
deDE = "Die Zyklen werden länger, wenn die Siedlung wächst, und die Wasserquellen nehmen gegen Ende etwas Verunreinigung auf."
plPL = "Wraz z rozwojem osady cykle się wydłużają, a pod koniec źródła wody ulegają niewielkiemu skażeniu."
ptBR = "Os ciclos ficam mais longos à medida que o assentamento cresce, e as fontes de água acumulam um pouco de contaminação no fim."
koKR = "정착지가 성장할수록 주기가 길어지고, 후반에는 수원에 오염 물질이 조금씩 섞입니다."
trTR = "Yerleşim büyüdükçe döngüler uzar ve su kaynakları döngünün sonlarına doğru biraz kirlenir."
esES = "Los ciclos se alargan a medida que crece el asentamiento, y las fuentes de agua se contaminan un poco hacia el final."
itIT = "I cicli si allungano man mano che l'insediamento cresce, e verso la fine le fonti d'acqua si contaminano un po'."
ukUA = "Цикли подовжуються в міру зростання поселення, а джерела води наприкінці трохи забруднюються."
thTH = "รอบเวลาจะยาวขึ้นเมื่อการตั้งถิ่นฐานเติบโต และแหล่งน้ำจะมีการปนเปื้อนเล็กน้อยในช่วงท้ายของรอบ"
csCZ = "S rostoucí osadou se cykly prodlužují a ke konci se do vodních zdrojů dostává trochu kontaminace."
viVN = "Các chu kỳ kéo dài hơn khi khu định cư phát triển, và các nguồn nước dần bị ô nhiễm nhẹ vào giai đoạn cuối."
caES = "Els cicles s'allarguen a mesura que el assentament creix, i les fonts d'aigua es contaminen una mica cap al final."
beBY = "Цыклы падаўжаюцца па меры росту пасялення, а крыніцы вады ў канцы цыклу трохі забруджваюцца."
roRO = "Ciclurile se prelungesc pe măsură ce așezarea crește, iar sursele de apă se contaminează puțin spre final."
huHU = "A ciklusok hosszabbodnak, ahogy a település nő, a vízforrások pedig késő este kissé szennyeződnek."
arSA = "أصبحت الدورات أطول مع نمو المستوطنة، وتكتسب مصادر المياه قدرًا بسيطًا من التلوث في وقت متأخر."

["AlternativeWeatherSystem.Mode.Hard.Description"]
raw = "Short temperate spells, long and wildly variable hazards, and water that grows steadily fouler."
status = "normal"
enUS = "Short temperate spells, long and wildly variable hazards, and water that grows steadily fouler."
zhCN = "短暂的温和天气，漫长且变幻莫测的灾害，以及日益变得更加污浊的水。"
zhTW = "短暫的溫和期，漫長且變化劇烈的災害期，以及日益惡化的汙水。"
ruRU = "Короткие умеренные периоды, долгие и крайне непредсказуемые опасности, а вода становится всё грязнее и токсичнее."
jaJP = "短い穏やかな時期、長くて激しく変動する災害、そして次第に汚れていく水。"
frFR = "Courtes périodes tempérées, dangers longs et très variables, et eau qui devient progressivement de plus en plus polluée."
deDE = "Kurze gemäßigte Phasen, lange und extrem unberechenbare Gefahren sowie Wasser, das stetig schmutziger wird."
plPL = "Krótkie, umiarkowane okresy pogody, długie i wyjątkowo zmienne zagrożenia oraz woda, która stopniowo staje się coraz bardziej skażona."
ptBR = "Períodos temperados curtos, perigos longos e muito variáveis, e água que fica cada vez mais contaminada."
koKR = "짧고 온화한 날씨가 이어지다가도, 길고 예측하기 어려운 재해가 찾아오고, 물은 점점 더 오염되어 갑니다."
trTR = "Kısa ılıman dönemler, uzun ve son derece değişken tehlikeler ve giderek daha kirli hâle gelen su."
esES = "Periodos templados breves, peligros largos y muy variables, y agua que se vuelve cada vez más turbia y nociva."
itIT = "Brevi periodi temperati, pericoli lunghi e molto variabili, e acqua che diventa costantemente più inquinata."
ukUA = "Короткі помірні періоди, довгі та надзвичайно мінливі небезпеки і вода, що поступово стає дедалі бруднішою."
thTH = "ช่วงอากาศอบอุ่นสั้น ๆ ภัยพิบัติที่ยาวนานและผันผวนอย่างรุนแรง และน้ำที่สกปรกขึ้นเรื่อย ๆ"
csCZ = "Krátká mírná období, dlouhá a divoce proměnlivá nebezpečí a voda, která stále více zahnívá."
viVN = "Những đợt thời tiết ôn hòa ngắn ngủi, những hiểm họa kéo dài và biến động dữ dội, cùng nguồn nước ngày càng bẩn thỉu hơn."
caES = "Períodes temperats breus, perills llargs i molt variables, i aigua que es torna cada cop més bruta."
beBY = "Кароткія памяркоўныя пэрыяды, доўгія і надзвычай зменлівыя нягоды, і вада, якая ўсё больш забруджваецца."
roRO = "Perioade scurte de vreme blândă, pericole lungi și extrem de variabile, și apă care devine tot mai murdară constant."
huHU = "Rövid, kellemes időjárási szakaszok, hosszú és kiszámíthatatlanul változó veszélyek, valamint egyre szennyezettebb víz."
arSA = "قصيرة ومعتدلة هي الفترات الجوية، وطويلة ومتقلبة بشدة هي المخاطر، والمياه تزداد تلوثاً باستمرار."

