["AlternativeWeatherSystem.Import.Explanation"]
status = "normal"
raw = "This settlement was saved without Alternative Weather System. Choose how its weather goes on: keep the game's own weather settings, pick a weather difficulty, or customise one. The cycle under way finishes as it began."
enUS = "This settlement was saved without Alternative Weather System. Choose how its weather goes on: keep the game's own weather settings, pick a weather difficulty, or customize one. The cycle underway finishes as it began."
zhCN = "这个定居点在未启用 Alternative Weather System 的情况下保存。请选择后续天气的运行方式：保留游戏自带的天气设置、选择一种天气难度，或自定义天气。当前正在进行的周期会按原定方式结束。"
zhTW = "此聚落是在未啟用 Alternative Weather System 的情況下儲存的。請選擇接下來的天氣設定：保留遊戲原本的天氣設定、選擇天氣難度，或自訂天氣。本次週期會依照原本設定完成。"
ruRU = "Это поселение было сохранено без мода Alternative Weather System. Выберите, как будет меняться погода: сохранить настройки погоды игры, выбрать сложность погоды или настроить её самостоятельно. Текущий цикл завершится так, как начался."
jaJP = "この入植地は、Alternative Weather Systemを導入せずに保存されました。今後の天候を選んでください。ゲーム本来の天候設定を維持するか、天候の難易度を選ぶか、独自にカスタマイズできます。進行中のサイクルは、開始時の設定のまま最後まで続きます。"
frFR = "Cette colonie a été sauvegardée sans Alternative Weather System. Choisissez comment la météo évoluera : conserver les paramètres météo du jeu, choisir un niveau de difficulté météorologique ou en personnaliser un. Le cycle en cours se terminera comme il a commencé."
deDE = "Diese Siedlung wurde ohne das Alternative Weather System gespeichert. Wähle, wie das Wetter weiterverläuft: Behalte die Wetterseinstellungen des Spiels bei, wähle einen Wetterschwierigkeitsgrad oder passe einen an. Der laufende Zyklus endet so, wie er begonnen hat."
plPL = "Ta osada została zapisana bez moda Alternative Weather System. Wybierz, jak ma dalej przebiegać pogoda: zachowaj ustawienia pogody z gry, wybierz poziom trudności pogodowej albo dostosuj go. Trwający cykl zakończy się tak, jak się rozpoczął."
ptBR = "Este assentamento foi salvo sem o Alternative Weather System. Escolha como o clima deve prosseguir: mantenha as configurações de clima do jogo, escolha uma dificuldade climática ou personalize uma. O ciclo em andamento terminará como começou."
koKR = "이 정착지는 대체 기상 시스템 없이 저장되었습니다. 이후 날씨를 어떻게 진행할지 선택하세요. 게임 자체의 날씨 설정을 유지하거나, 날씨 난이도를 선택하거나, 직접 설정할 수 있습니다. 진행 중인 주기는 시작할 때의 설정대로 마무리됩니다."
csCZ = "Tato osada byla uložena bez modu Alternative Weather System. Zvolte, jak bude počasí pokračovat: ponechte původní nastavení počasí ve hře, vyberte obtížnost počasí nebo si ji upravte. Probíhající cyklus skončí tak, jak začal."
viVN = "Khu định cư này được lưu mà không có Alternative Weather System. Hãy chọn cách thời tiết diễn biến tiếp theo: giữ cài đặt thời tiết của trò chơi, chọn độ khó thời tiết hoặc tự tùy chỉnh. Chu kỳ hiện tại sẽ kết thúc theo cách nó đã bắt đầu."
trTR = "Bu yerleşim Alternatif Hava Durumu Sistemi olmadan kaydedildi. Havanın nasıl devam edeceğini seçin: oyunun kendi hava durumu ayarlarını koruyun, bir hava durumu zorluğu seçin ya da kendiniz özelleştirin. Devam eden döngü başladığı şekilde tamamlanır."

