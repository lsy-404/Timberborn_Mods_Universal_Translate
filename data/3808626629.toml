status = "normal"
enUS = "Every source activates with clean water. Sounds great? Turns out you can have too much of a good thing."
zhCN = "每个水源都会喷出干净的水。听起来不错？但好事也可能过犹不及。"
zhTW = "每個水源都會在有乾淨水時啟動。聽起來很棒？結果好事也可能過猶不及。"
ruRU = "Каждый источник активируется чистой водой. Звучит здорово? Оказывается, хорошего тоже может быть слишком много."
jaJP = "すべての水源がきれいな水で作動する。素晴らしいと思う？良いものだって、多すぎると困ることがある。"
frFR = "Toutes les sources s’activent avec de l’eau propre. Ça a l’air génial ? Il s’avère qu’on peut avoir trop d’une bonne chose."
deDE = "Jede Quelle wird durch sauberes Wasser aktiviert. Klingt toll? Wie sich herausstellt, kann man des Guten zu viel haben."
plPL = "Każde źródło uruchamia się, gdy dostanie czystą wodę. Brzmi świetnie? Okazuje się, że co za dużo, to niezdrowo."
ptBR = "Todas as fontes são ativadas com água limpa. Parece ótimo? Acontece que até coisas boas podem ser demais."
koKR = "모든 수원은 깨끗한 물이 있으면 활성화됩니다. 좋아 보이죠? 알고 보니 좋은 것도 지나치면 탈이 나네요."
csCZ = "Každý zdroj se aktivuje čistou vodou. Zní to skvěle? Ukázalo se, že i dobrého může být příliš."
viVN = "Mọi nguồn nước đều kích hoạt khi có nước sạch. Nghe tuyệt chứ? Hóa ra, thứ gì tốt quá cũng không hay."
trTR = "Her kaynak temiz suyla etkinleşir. Kulağa harika mı geliyor? Meğer iyi şeyin de fazlası olabiliyormuş."

["AlternativeWeatherSystem.Weather.Flood.FlavourMostlyClean"]
raw = "Every source activates with mostly clean water. Sounds great? Turns out you can have too much of a good thing."
status = "normal"
enUS = "Every source activates with mostly clean water. Sounds great? Turns out you can have too much of a good thing."
zhCN = "每个水源启动时都会放出大部分为清水的水。听起来很不错？结果证明，好事也可能多得过头。"
zhTW = "每個水源啟動時都會流出大部分乾淨的水。聽起來很棒？結果好事也可能過猶不及。"
ruRU = "Каждый источник запускается с преимущественно чистой водой. Звучит отлично? Оказывается, хорошего тоже может быть слишком много."
jaJP = "すべての水源が、ほぼきれいな水とともに作動する。いいことずくめに聞こえる？ところが、良いものも多すぎると困りものだ。"
frFR = "Chaque source s’active avec de l’eau presque propre. Ça a l’air génial, non ? Eh bien, il est possible d’avoir trop d’une bonne chose."
deDE = "Jede Quelle aktiviert sich mit größtenteils sauberem Wasser. Klingt gut? Wie sich herausstellt, kann man von etwas Gutem auch zu viel haben."
plPL = "Każde źródło uruchamia się, dostarczając głównie czystą wodę. Brzmi świetnie? Okazuje się, że co za dużo, to niezdrowo."
ptBR = "Toda fonte é ativada com água quase sempre limpa. Parece ótimo? Acontece que até uma coisa boa pode ser boa demais."
koKR = "모든 수원은 대부분 깨끗한 물과 함께 활성화됩니다. 좋아 보이나요? 알고 보니 좋은 것도 지나치면 문제네요."
csCZ = "Každý zdroj se aktivuje a vypouští převážně čistou vodu. Zní to skvěle? Ukazuje se, že i dobrého může být příliš."
viVN = "Mọi nguồn nước đều hoạt động với phần lớn là nước sạch. Nghe tuyệt chứ? Hóa ra thứ tốt đẹp đến mấy cũng có thể quá nhiều."
trTR = "Her kaynak çoğunlukla temiz suyla etkinleşir. Kulağa harika mı geliyor? Meğer iyi şeyin fazlası da olabiliyormuş."

["AlternativeWeatherSystem.Weather.Eruption.Flavour"]
raw = "Something is brewing underneath the ground. Clean sources erupt with huge strength in between dry spells. Catch the water while you can."
status = "normal"
enUS = "Something is brewing beneath the ground. Clean water sources erupt with tremendous force between dry spells. Catch the water while you can."
zhCN = "地底下似乎有什么正在酝酿。洁净水源会在旱季间隙以惊人的力量喷涌而出。趁现在能接水时，赶紧接吧。"
zhTW = "地底下有什麼東西正在醞釀。乾旱期間，潔淨水源會以驚人的力道噴湧而出。趁現在還能取水，趕緊把握機會。"
ruRU = "Что-то назревает под землёй. Между засухами из чистых источников с огромной силой бьёт вода. Ловите её, пока есть возможность."
jaJP = "地中で何かが起ころうとしている。乾期の合間に、きれいな水源がすさまじい勢いで噴き出す。今のうちに水を確保しよう。"
frFR = "Quelque chose se prépare sous terre. Des sources d’eau propre jaillissent avec une force immense entre les périodes de sécheresse. Profitez-en tant que vous le pouvez."
deDE = "Unter der Erde braut sich etwas zusammen. Zwischen den Trockenperioden brechen saubere Quellen mit enormer Kraft hervor. Fang das Wasser auf, solange du kannst."
plPL = "Coś się kotłuje pod ziemią. Czyste źródła wybuchają z ogromną siłą między okresami suszy. Łap wodę, póki możesz."
ptBR = "Algo está se formando sob a terra. Fontes de água limpa irrompem com enorme força entre os períodos de seca. Aproveite a água enquanto pode."
koKR = "땅속에서 무언가 끓어오르고 있습니다. 건기 사이에 깨끗한 수원이 엄청난 힘으로 솟구칩니다. 물을 잡아둘 수 있을 때 잡아두세요."
csCZ = "Pod zemí se něco chystá. Mezi obdobími sucha tryskají čisté prameny s obrovskou silou. Zachyťte vodu, dokud můžete."
viVN = "Có thứ gì đó đang sôi sục dưới lòng đất. Những mạch nước sạch phun trào dữ dội giữa các đợt hạn hán. Hãy tranh thủ hứng lấy nước khi còn có thể."
trTR = "Yerin altında bir şeyler kaynıyor. Kurak dönemlerin arasında temiz su kaynakları büyük bir güçle fışkırıyor. Fırsatın varken suyu yakala."

["AlternativeWeatherSystem.Weather.Eruption.FlavourAllSources"]
raw = "Something is brewing underneath the ground. All sources erupt with huge strength in between dry spells. Catch the water while you can."
status = "normal"
enUS = "Something is brewing underground. All sources erupt with tremendous force between dry spells. Catch the water while you can."
zhCN = "地下似乎有什么东西正在酝酿。在干旱间歇期，所有水源都会以惊人的力量喷涌而出。趁现在能接多少水就接多少吧。"
zhTW = "地底下似乎有什麼正在醞釀。乾旱間歇期間，所有水源都會以驚人的力量噴湧而出。趁現在還能取水，趕快把握機會。"
ruRU = "Под землёй что-то зреет. Между засушливыми периодами все источники извергаются с огромной силой. Ловите воду, пока есть возможность."
jaJP = "地中で何かがうごめいている。乾期の合間に、すべての水源がものすごい勢いで噴き出す。今のうちに水を確保しよう。"
frFR = "Quelque chose se prépare sous terre. Toutes les sources jaillissent avec une force colossale entre les périodes de sécheresse. Profitez de l’eau tant que vous le pouvez."
deDE = "Unter der Erde braut sich etwas zusammen. Zwischen den Trockenperioden brechen alle Quellen mit gewaltiger Kraft hervor. Fang das Wasser auf, solange du kannst."
plPL = "Pod ziemią coś się szykuje. Między suszami wszystkie źródła wybuchają z ogromną siłą. Łap wodę, póki możesz."
ptBR = "Algo está se formando sob a terra. Todas as fontes entram em erupção com enorme força entre as secas. Aproveite a água enquanto pode."
koKR = "땅속에서 무언가 끓어오르고 있습니다. 가뭄 사이사이에 모든 수원에서 엄청난 힘으로 물이 솟구칩니다. 기회가 있을 때 물을 받아 두세요."
csCZ = "Pod zemí se něco chystá. Mezi obdobími sucha všechny prameny vyvěrají s obrovskou silou. Zachyťte vodu, dokud můžete."
viVN = "Có thứ gì đó đang sôi sục dưới lòng đất. Tất cả các mạch nước đều phun trào dữ dội giữa những đợt khô hạn. Hãy tranh thủ lấy nước khi còn có thể."
trTR = "Yeraltında bir şeyler demleniyor. Kuraklık dönemleri arasında tüm kaynaklar büyük bir güçle fışkırıyor. Fırsat varken suyu yakalayın."

["AlternativeWeatherSystem.Weather.Heatwave.FlavourPlantsBurn"]
raw = "Sources run dry and things that aren't wet burn, including plants and beavers. Humans disbelieved in global warming, we won't make such mistakes."
status = "normal"
enUS = "Sources run dry, and things that aren't wet burn, including plants and beavers. Humans disbelieved in global warming; we won't make the same mistake."
zhCN = "水源会干涸，所有不潮湿的东西都会燃烧，包括植物和海狸。人类曾不相信全球变暖，我们可不会重蹈覆辙。"
zhTW = "水源會乾涸，沒濕的東西都會燃燒，包括植物和海狸。人類曾不相信全球暖化，我們可不會重蹈覆轍。"
ruRU = "Источники пересыхают, а всё, что не мокрое, горит — в том числе растения и бобры. Люди не верили в глобальное потепление, мы не повторим их ошибок."
jaJP = "水源は干上がり、濡れていないものは燃えます。植物もビーバーも例外ではありません。人間は地球温暖化を信じませんでしたが、私たちはそんな過ちを繰り返しません。"
frFR = "Les sources s’assèchent et tout ce qui n’est pas humide brûle, y compris les plantes et les castors. Les humains ne croyaient pas au réchauffement climatique ; nous ne ferons pas la même erreur."
deDE = "Quellen trocknen aus und alles, was nicht nass ist, verbrennt, darunter Pflanzen und Biber. Die Menschen glaubten nicht an die globale Erwärmung. Wir werden nicht dieselben Fehler machen."
plPL = "Źródła wysychają, a wszystko, co nie jest mokre, płonie — w tym rośliny i bobry. Ludzie nie wierzyli w globalne ocieplenie; my nie popełnimy takich błędów."
ptBR = "As fontes secam e tudo que não está molhado pega fogo, incluindo plantas e castores. Os humanos não acreditavam no aquecimento global; não cometeremos os mesmos erros."
koKR = "수원이 말라붙고 젖지 않은 것들은 식물과 비버를 포함해 불에 탑니다. 인간은 지구 온난화를 믿지 않았지만, 우리는 그런 실수를 하지 않을 겁니다."
csCZ = "Prameny vysychají a všechno, co není mokré, hoří, včetně rostlin a bobrů. Lidé nevěřili v globální oteplování; my takové chyby neuděláme."
viVN = "Các nguồn nước cạn khô, và những thứ không ướt sẽ bốc cháy, bao gồm cả cây cối và hải ly. Con người từng không tin vào hiện tượng nóng lên toàn cầu; chúng ta sẽ không mắc phải những sai lầm như vậy."
trTR = "Kaynaklar kurur ve ıslak olmayan her şey yanar; bitkiler ve kunduzlar da buna dahil. İnsanlar küresel ısınmaya inanmadı, biz aynı hatayı yapmayacağız."

