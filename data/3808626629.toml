frFR = "Chaque source s’active avec de l’eau propre. Ça semble formidable ? Il s’avère qu’on peut avoir trop d’une bonne chose."
deDE = "Jede Quelle wird mit sauberem Wasser aktiviert. Klingt toll? Wie sich herausstellt, kann man auch zu viel des Guten haben."
plPL = "Każde źródło uruchamia się, gdy ma dostęp do czystej wody. Brzmi świetnie? Okazuje się, że nawet dobrego może być za dużo."
ptBR = "Todas as fontes são ativadas com água limpa. Parece ótimo? Acontece que até uma coisa boa pode ser demais."
koKR = "모든 수원은 깨끗한 물이 있을 때 활성화됩니다. 좋아 보이죠? 하지만 좋은 것도 지나치면 탈이 나기 마련입니다."
csCZ = "Každý zdroj se aktivuje čistou vodou. Zní to skvěle? Ukázalo se, že i dobrého může být příliš."
viVN = "Mọi nguồn đều kích hoạt khi có nước sạch. Nghe tuyệt chứ? Hóa ra thứ tốt đẹp đến mấy cũng có thể quá nhiều."
trTR = "Her kaynak temiz suyla etkinleşir. Kulağa harika mı geliyor? Meğer iyi şeyin de fazlası olabiliyormuş."

["AlternativeWeatherSystem.Weather.Flood.FlavourMostlyClean"]
status = "normal"
raw = "Every source activates with mostly clean water. Sounds great? Turns out you can have too much of a good thing."
enUS = "Every source activates with mostly clean water. Sounds great? Turns out you can have too much of a good thing."
zhCN = "所有水源都会以大部分为清水的状态激活。听起来不错？事实证明，好事也可能多得过头。"
zhTW = "每個水源啟動時都會流出大部分乾淨的水。聽起來很棒？結果好事也可能多過頭。"
ruRU = "Каждый источник даёт преимущественно чистую воду. Звучит здорово? Оказывается, хорошего тоже может быть слишком много."
jaJP = "すべての水源が、ほとんどきれいな水とともに稼働する。いいことづくめに聞こえる？どうやら、良いものでも多すぎることがあるらしい。"
frFR = "Toutes les sources s’activent avec une eau majoritairement propre. Ça semble idéal, non ? Il s’avère qu’on peut avoir trop d’une bonne chose."
deDE = "Jede Quelle wird mit überwiegend sauberem Wasser aktiviert. Klingt toll? Wie sich herausstellt, kann man auch von etwas Gutem zu viel haben."
plPL = "Każde źródło uruchamia się, dostarczając głównie czystą wodę. Brzmi świetnie? Okazuje się, że co za dużo, to niezdrowo."
ptBR = "Todas as fontes são ativadas com água quase sempre limpa. Parece ótimo? Acontece que até coisas boas podem vir em excesso."
koKR = "모든 수원은 대부분 깨끗한 물과 함께 작동합니다. 정말 좋을 것 같죠? 하지만 좋은 것도 지나치면 탈이 납니다."
csCZ = "Každý pramen začne chrlit převážně čistou vodu. Zní to skvěle? Ukázalo se, že i dobrého může být příliš."
viVN = "Mọi nguồn nước đều bắt đầu hoạt động với phần lớn là nước sạch. Nghe tuyệt chứ? Hóa ra, thứ tốt đẹp đến mấy cũng có thể trở nên quá nhiều."
trTR = "Her kaynak çoğunlukla temiz suyla etkinleşir. Kulağa harika mı geliyor? Meğer iyi şeyin de fazlası olabiliyormuş."

["AlternativeWeatherSystem.Weather.Eruption.Flavour"]
status = "normal"
raw = "Something is brewing underneath the ground. Clean sources erupt with huge strength in between dry spells. Catch the water while you can."
enUS = "Something is brewing underground. Clean water sources erupt with tremendous force between dry spells. Catch the water while you can."
zhCN = "地底下正酝酿着什么。洁净水源会在干旱间歇期强劲喷涌。趁现在赶紧接住这些水吧。"
zhTW = "地底下似乎有什麼正在醞釀。潔淨水源會在乾旱期間猛烈噴發。趁現在還來得及，趕緊接住這些水吧。"
ruRU = "Что-то зреет под землёй. Между засушливыми периодами из чистых источников с огромной силой вырывается вода. Ловите её, пока можете."
jaJP = "地中で何かが起ころうとしている。乾期の合間に、きれいな水源がものすごい勢いで噴き出す。今のうちに水を確保しよう。"
frFR = "Quelque chose se prépare sous terre. Des sources d’eau propre jaillissent avec une force immense entre les périodes de sécheresse. Profitez de l’eau tant que vous le pouvez."
deDE = "Unter der Erde braut sich etwas zusammen. Zwischen den Trockenzeiten brechen saubere Quellen mit gewaltiger Kraft hervor. Fang das Wasser auf, solange du kannst."
plPL = "Coś kotłuje się pod ziemią. Czyste źródła wybuchają z ogromną siłą między okresami suszy. Łap wodę, póki możesz."
ptBR = "Algo está se formando sob a terra. Fontes de água limpa entram em erupção com enorme força entre os períodos de seca. Aproveite a água enquanto pode."
koKR = "땅속에서 무언가 끓어오르고 있습니다. 건기 사이사이 깨끗한 수원이 엄청난 세기로 솟구칩니다. 기회가 있을 때 물을 받아 두세요."
csCZ = "Pod zemí se něco chystá. Čisté prameny mezi obdobími sucha vytrysknou s obrovskou silou. Zachyťte vodu, dokud můžete."
viVN = "Có thứ gì đó đang sôi sục dưới lòng đất. Các mạch nước sạch phun trào dữ dội giữa những đợt hạn hán. Hãy hứng lấy nước khi còn có thể."
trTR = "Yer altında bir şeyler kaynıyor. Temiz su kaynakları kurak dönemlerin arasında muazzam bir güçle fışkırıyor. Fırsat varken suyu yakalayın."

["AlternativeWeatherSystem.Weather.Eruption.FlavourAllSources"]
status = "normal"
raw = "Something is brewing underneath the ground. All sources erupt with huge strength in between dry spells. Catch the water while you can."
enUS = "Something is brewing underground. All sources erupt with tremendous force between dry spells. Catch the water while you can."
zhCN = "地底下似乎有什么东西正在酝酿。所有水源都会在干旱间隙以极强的势头喷发。趁现在还能接水，赶紧接吧。"
zhTW = "地底下似乎有什麼正在醞釀。每逢乾旱間歇，所有水源都會以驚人的力量噴發。趁現在還能取水，趕快把握機會。"
ruRU = "Что-то зреет под землёй. Между засушливыми периодами все источники бьют с огромной силой. Ловите воду, пока можете."
jaJP = "地中で何かが起ころうとしている。乾季の合間に、すべての水源がものすごい勢いで噴き出す。今のうちに水を確保しよう。"
frFR = "Quelque chose se prépare sous terre. Toutes les sources jaillissent avec une force immense entre les périodes de sécheresse. Profitez de l’eau tant que vous le pouvez."
deDE = "Unter der Erde braut sich etwas zusammen. Zwischen den Trockenperioden brechen alle Quellen mit gewaltiger Kraft hervor. Fang das Wasser auf, solange du kannst."
plPL = "Coś szykuje się pod ziemią. Między okresami suszy wszystkie źródła wybuchają z ogromną siłą. Łap wodę, póki możesz."
ptBR = "Algo está borbulhando sob o solo. Todas as fontes entram em erupção com enorme força entre os períodos de seca. Aproveite a água enquanto pode."
koKR = "땅속에서 무언가가 꿈틀거리고 있습니다. 가뭄과 가뭄 사이에 모든 수원이 엄청난 세기로 분출합니다. 물을 잡을 수 있을 때 잡으세요."
csCZ = "Pod zemí se něco chystá. Mezi obdobími sucha všechny prameny vyvěrají s ohromnou silou. Zachyťte vodu, dokud můžete."
viVN = "Có thứ gì đó đang sôi sục bên dưới lòng đất. Tất cả các mạch nước đều phun trào với sức mạnh khủng khiếp giữa những đợt hạn hán. Hãy hứng lấy nước khi còn có thể."
trTR = "Toprağın altında bir şeyler kaynıyor. Kuraklık dönemlerinin arasında tüm kaynaklar büyük bir güçle fışkırıyor. Fırsatın varken suyu yakala."

["AlternativeWeatherSystem.Weather.Heatwave.FlavourPlantsBurn"]
status = "normal"
raw = "Sources run dry and things that aren't wet burn, including plants and beavers. Humans disbelieved in global warming, we won't make such mistakes."
enUS = "Sources run dry, and things that aren't wet burn, including plants and beavers. Humans disbelieved in global warming; we won't make such mistakes."
zhCN = "水源会干涸，所有不湿的东西都会燃烧，包括植物和海狸。人类曾不相信全球变暖，我们可不会犯这种错。"
zhTW = "水源會乾涸，所有不潮濕的東西都會燃燒，包括植物和海狸。人類曾不相信全球暖化，我們可不會犯下這種錯誤。"
ruRU = "Источники пересыхают, а всё, что не мокрое, горит, в том числе растения и бобры. Люди не верили в глобальное потепление — мы не допустим таких ошибок."
jaJP = "水源は干上がり、濡れていないものは燃えます。植物やビーバーも例外ではありません。人間は地球温暖化を信じませんでしたが、私たちは同じ過ちを犯しません。"
frFR = "Les sources s’assèchent et tout ce qui n’est pas mouillé brûle, y compris les plantes et les castors. Les humains ne croyaient pas au réchauffement climatique ; nous ne commettrons pas les mêmes erreurs."
deDE = "Quellen trocknen aus und alles, was nicht nass ist, verbrennt – auch Pflanzen und Biber. Die Menschen glaubten nicht an die globale Erwärmung. Wir werden nicht dieselben Fehler machen."
plPL = "Źródła wysychają, a wszystko, co nie jest mokre, płonie — w tym rośliny i bobry. Ludzie nie wierzyli w globalne ocieplenie. My nie popełnimy takich błędów."
ptBR = "As fontes secam e tudo que não está molhado queima, incluindo plantas e castores. Os humanos não acreditavam no aquecimento global; nós não cometeremos os mesmos erros."
koKR = "수원이 말라붙고 젖지 않은 것들은 불타오릅니다. 식물과 비버도 예외가 아닙니다. 인간은 지구 온난화를 믿지 않았지만, 우리는 그런 실수를 하지 않을 겁니다."
csCZ = "Prameny vysychají a všechno, co není mokré, hoří, včetně rostlin a bobrů. Lidé nevěřili v globální oteplování, takovou chybu my neuděláme."
viVN = "Các nguồn nước cạn khô và những thứ không ướt sẽ bốc cháy, bao gồm cả cây cối và hải ly. Con người từng không tin vào hiện tượng nóng lên toàn cầu; chúng ta sẽ không mắc phải sai lầm như vậy."
trTR = "Kaynaklar kurur ve ıslak olmayan her şey yanar; bitkiler ve kunduzlar da buna dahildir. İnsanlar küresel ısınmaya inanmadı; biz böyle hatalar yapmayacağız."

