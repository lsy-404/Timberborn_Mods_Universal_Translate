caES = "Alguna cosa s'està covant sota terra. Les fonts nettes ergueixen amb una força enorme entre les sequeres. Recull l'aigua mentre puguis."
beBY = "Пад зямлёй нешта назапашваецца. Чыстыя крыніцы паміж засухамі вырываюцца з велізарнай сілай. Лавіце ваду, пакуль можаце."
roRO = "Ceva fierbe sub pământ. Izvoarele curate erup cu forță uriașă între perioadele de secetă. Adună apa cât poți."
huHU = "Valami forr a föld alatt. A tiszta forrásokból szárazság közben hatalmas erővel tör elő a víz. Gyűjtsd össze, amíg tudod."
arSA = "يتشكّل شيء ما تحت الأرض. تتفجّر المنابع النقية بقوة هائلة بين فترات الجفاف. اغتنموا الماء ما دمتم قادرين على ذلك."

