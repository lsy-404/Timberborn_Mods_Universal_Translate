csCZ = "Voda přestane odtékat, zdroje špinavé vody se deaktivují. Nelíbí se vám vypařování? Tak co teď?"
viVN = "Nước ngừng thoát ra, các nguồn nước độc tắt hoạt động. Bạn không thích bốc hơi ư? Giờ thì sao?"
