["AlternativeWeatherSystem.Mode.Easy.Description"]
status = "normal"
raw = "Long fair spells and short hazards. Badtides start after five cycles and stay rare."
enUS = "Long wet seasons and short hazards. Badtides start after five cycles and remain rare."
zhCN = "晴朗天气持续时间长，灾害天气持续时间短。恶水潮会在五个周期后开始出现，且很少发生。"
zhTW = "漫長的晴朗時期，短暫的危險。五個週期後開始出現壞潮，且仍然罕見。"
ruRU = "Долгие периоды хорошей погоды и короткие опасные периоды. Токсичные приливы начинаются после пяти циклов и остаются редкими."
jaJP = "穏やかな天候が長く続き、危険な天候は短期間です。悪潮は5サイクル後に始まり、まれにしか発生しません。"
frFR = "De longues périodes de beau temps et de courts épisodes dangereux. Les marées toxiques commencent après cinq cycles et restent rares."
deDE = "Lange Schönwetterperioden und kurze Gefahren. Giftwellen beginnen nach fünf Zyklen und bleiben selten."
plPL = "Długie okresy dobrej pogody i krótkie zagrożenia. Złe przypływy zaczynają się po pięciu cyklach i występują rzadko."
ptBR = "Longos períodos de clima favorável e perigos breves. As marés tóxicas começam após cinco ciclos e continuam raras."
koKR = "길고 평온한 날씨와 짧은 위험이 이어집니다. 악수기는 5주기 후에 시작되며 드물게 발생합니다."
csCZ = "Dlouhá období příznivého počasí a krátké nepříznivé výkyvy. Zlé přílivy začínají po pěti cyklech a zůstávají vzácné."
viVN = "Những đợt thời tiết thuận lợi kéo dài và các hiểm họa ngắn hạn. Đợt nước độc bắt đầu sau năm chu kỳ và hiếm khi xảy ra."
trTR = "Uzun güzel hava dönemleri ve kısa tehlikeler. Kötü gelgitler beş döngü sonra başlar ve nadir görülür."

["AlternativeWeatherSystem.Mode.Normal.Description"]
status = "normal"
raw = "Cycles lengthen as the settlement grows, and the water sources pick up a little contamination late on."
enUS = "Cycles grow longer as the settlement expands, and water sources become slightly contaminated toward the end."
zhCN = "随着定居点发展壮大，周期会变长，水源也会在后期受到少许污染。"
zhTW = "隨著聚居地發展，週期會逐漸延長，而水源在後期也會受到些微污染。"
ruRU = "По мере роста поселения циклы становятся длиннее, а источники воды ближе к концу немного загрязняются."
jaJP = "集落が発展するにつれてサイクルが長くなり、後半には水源が少し汚染されます。"
frFR = "Les cycles s’allongent à mesure que la colonie grandit, et les sources d’eau se contaminent légèrement vers la fin."
deDE = "Mit wachsender Siedlung werden die Zyklen länger, und die Wasserquellen nehmen gegen Ende etwas Verunreinigung auf."
plPL = "Cykle wydłużają się wraz z rozwojem osady, a pod koniec źródła wody ulegają niewielkiemu skażeniu."
ptBR = "Os ciclos se alongam conforme o assentamento cresce, e as fontes de água ficam um pouco contaminadas no fim."
koKR = "정착지가 성장할수록 주기가 길어지고, 후반에는 수원에 오염이 조금씩 쌓입니다."
csCZ = "S růstem osady se cykly prodlužují a vodní zdroje se ke konci mírně kontaminují."
viVN = "Các chu kỳ kéo dài khi khu định cư phát triển, và vào cuối chu kỳ, các nguồn nước bắt đầu nhiễm bẩn đôi chút."
trTR = "Yerleşim büyüdükçe döngüler uzar ve su kaynakları geç saatlerde biraz kirlenir."

["AlternativeWeatherSystem.Mode.Hard.Description"]
status = "normal"
raw = "Short fair spells, long and wildly variable hazards, and water that grows steadily fouler."
enUS = "Short fair spells, long and wildly variable hazards, and water that grows steadily fouler."
zhCN = "晴季短暂，灾害漫长且变化莫测，水质也会逐渐变得越来越差。"
zhTW = "短暫的風調雨順、漫長且變化莫測的災害，以及日益污濁的水。"
ruRU = "Короткие благоприятные периоды, долгие и крайне непредсказуемые опасности, а вода становится всё грязнее."
jaJP = "短い晴天期、長くて大きく変動する災害、そして着実に汚染されていく水。"
frFR = "De courtes périodes de beau temps, de longues périodes de conditions dangereuses très variables, et une eau qui devient progressivement plus polluée."
deDE = "Kurze, milde Schönwetterperioden, lange und stark schwankende Gefahrenzeiten und Wasser, das stetig schmutziger wird."
plPL = "Krótkie okresy sprzyjającej pogody, długie i skrajnie zmienne zagrożenia oraz woda, która staje się coraz bardziej zanieczyszczona."
ptBR = "Períodos de estiagem curtos e razoáveis, períodos de perigo longos e extremamente variáveis, e água que fica cada vez mais contaminada."
koKR = "짧은 평온기, 길고 변동이 매우 큰 재해, 그리고 갈수록 오염되는 물."
csCZ = "Krátká období příznivého počasí, dlouhá a velmi proměnlivá nebezpečí a voda, která je stále kalnější."
viVN = "Những đợt thời tiết thuận lợi ngắn, các đợt nguy hiểm kéo dài và biến động dữ dội, cùng nguồn nước ngày càng ô nhiễm."
trTR = "Kısa ve seyrek yağışlı dönemler, uzun ve büyük ölçüde değişken tehlikeler ve giderek daha kirli hâle gelen su."

