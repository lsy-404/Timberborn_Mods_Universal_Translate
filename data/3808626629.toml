plPL = "Wysyła sygnał, gdy trwa wybrana przez ciebie pogoda, i może wysłać go wcześniej, aby śluzy były już otwarte, gdy ta pogoda nadejdzie."
ptBR = "Envia um sinal enquanto o clima escolhido está ocorrendo e pode enviá-lo antecipadamente para que as comportas já estejam abertas quando esse clima chegar."
koKR = "선택한 날씨가 지속되는 동안 신호를 보내며, 해당 날씨가 시작되기 전에 미리 신호를 보내 그 날씨가 도래했을 때 수문이 이미 열려 있게 할 수 있습니다."
csCZ = "Odesílá signál, když nastane zvolené počasí, a může ho odeslat předčasně, aby už byly brány otevřené, až toto počasí nastane."
viVN = "Gửi tín hiệu khi kiểu thời tiết bạn chọn đang diễn ra và có thể gửi tín hiệu sớm để các cổng đã mở sẵn khi kiểu thời tiết đó đến."
trTR = "Seçtiğiniz hava durumu devam ederken sinyal gönderir ve bu hava durumu geldiğinde kapılar zaten açık olsun diye sinyali önceden gönderebilir."

