["AlternativeWeatherSystem.Import.Explanation"]
raw = "This settlement was saved without Alternative Weather System. Choose how its weather goes on: keep the game's own weather settings, pick a weather difficulty, or customise one. The cycle under way finishes as it began."
status = "normal"
enUS = "This settlement was saved without Alternative Weather System. Choose how its weather goes on: keep the game's own weather settings, pick a weather difficulty, or customize one. The cycle underway finishes as it began."
zhCN = "这个定居点保存时未启用 Alternative Weather System。请选择后续天气设置：保留游戏原有的天气设置、选择一种天气难度，或自定义天气。当前正在进行的周期会按原定方式结束。"
zhTW = "這個聚落是在未安裝「Alternative Weather System」的情況下儲存的。請選擇接下來的天氣設定：沿用遊戲內建設定、選擇天氣難度，或自訂設定。目前進行中的週期會依照原本的設定完成。"
ruRU = "Это поселение было сохранено без мода «Альтернативная система погоды». Выберите, как будет меняться погода: оставить настройки погоды из игры, выбрать уровень сложности погоды или настроить его самостоятельно. Текущий цикл завершится так, как начался."
jaJP = "この居住地は「Alternative Weather System」なしで保存されました。今後の天候を選択してください。ゲーム本来の天候設定を維持するか、天候の難易度を選ぶか、独自に設定できます。進行中の周期は、開始時の設定のまま終了します。"
frFR = "Cette colonie a été sauvegardée sans le mod Alternative Weather System. Choisissez la suite de son cycle météorologique : conserver les paramètres météo du jeu, choisir une difficulté météorologique ou en personnaliser une. Le cycle en cours se terminera comme il a commencé."
deDE = "Diese Siedlung wurde ohne das Alternative Weather System gespeichert. Wähle, wie das Wetter weiterverläuft: Behalte die Wetter-Einstellungen des Spiels bei, wähle einen Wetterschwierigkeitsgrad oder passe das Wetter individuell an. Der laufende Zyklus endet so, wie er begonnen hat."
plPL = "Ta osada została zapisana bez moda Alternative Weather System. Wybierz, jak ma przebiegać jej pogoda: zachowaj ustawienia pogody z gry, wybierz poziom trudności pogody lub dostosuj go. Trwający cykl zakończy się tak, jak się rozpoczął."
ptBR = "Este assentamento foi salvo sem o Alternative Weather System. Escolha como o clima vai funcionar daqui em diante: mantenha as configurações de clima do próprio jogo, escolha uma dificuldade climática ou personalize as configurações. O ciclo em andamento termina como começou."
koKR = "이 정착지는 대체 날씨 시스템 없이 저장되었습니다. 이후 날씨를 어떻게 설정할지 선택하세요. 게임 자체의 날씨 설정을 유지하거나, 날씨 난이도를 선택하거나, 직접 설정할 수 있습니다. 진행 중인 주기는 시작했을 때의 설정대로 완료됩니다."
csCZ = "Tato osada byla uložena bez modifikace Alternative Weather System. Vyberte, jak bude počasí pokračovat: ponechte původní nastavení počasí ve hře, zvolte obtížnost počasí nebo si ji přizpůsobte. Právě probíhající cyklus skončí tak, jak začal."
viVN = "Khu định cư này đã được lưu khi không có Alternative Weather System. Hãy chọn cách thời tiết tiếp diễn: giữ nguyên cài đặt thời tiết của trò chơi, chọn độ khó thời tiết hoặc tùy chỉnh. Chu kỳ hiện tại sẽ kết thúc như lúc nó bắt đầu."
trTR = "Bu yerleşim Alternatif Hava Sistemi olmadan kaydedildi. Havanın nasıl devam edeceğini seçin: oyunun kendi hava durumu ayarlarını koruyun, bir hava durumu zorluğu seçin ya da bir ayarı özelleştirin. Devam eden döngü başladığı gibi tamamlanacak."

