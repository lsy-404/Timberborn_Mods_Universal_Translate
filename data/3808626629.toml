ptBR = "As fontes secam e tudo o que não está molhado pega fogo, inclusive os castores. Os humanos não acreditavam no aquecimento global; nós não cometeremos os mesmos erros."
koKR = "수원은 말라붙고, 젖지 않은 것들은 비버를 포함해 불에 탑니다. 인간은 지구 온난화를 믿지 않았지만, 우리는 그런 실수를 반복하지 않을 겁니다."
