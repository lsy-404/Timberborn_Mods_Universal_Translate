["AlternativeWeatherSystem.Mode.Easy.Description"]
raw = "Long fair spells and short hazards. Badtides start after five cycles and stay rare."
status = "normal"
enUS = "Long wet seasons and short droughts. Badtides start after five cycles and remain rare."
zhCN = "漫长的晴好时段，短暂的灾害。恶水潮在五个周期后开始出现，且很少发生。"
zhTW = "漫長的晴朗時期與短暫的危險期。五個週期後開始出現壞水潮，且仍然罕見。"
ruRU = "Долгие периоды хорошей погоды и короткие опасные периоды. Скверные приливы начинаются после пяти циклов и случаются редко."
jaJP = "穏やかな天候が長く続き、危険な天候は短時間です。バッドタイドは5サイクル後に始まり、まれにしか発生しません。"
frFR = "De longues périodes de beau temps et de courts épisodes dangereux. Les mauvaises marées commencent après cinq cycles et restent rares."
deDE = "Lange Schönwetterperioden und kurze Gefahren. Badwellen beginnen nach fünf Zyklen und bleiben selten."
plPL = "Długie okresy dobrej pogody i krótkie zagrożenia. Złe przypływy zaczynają się po pięciu cyklach i występują rzadko."
ptBR = "Longos períodos de clima favorável e perigos curtos. As marés tóxicas começam após cinco ciclos e continuam raras."
koKR = "긴 평온기와 짧은 위험기가 이어집니다. 오염수기가 5주기 후에 시작되며 드물게 발생합니다."
csCZ = "Dlouhá období příznivého počasí a krátká nebezpečná období. Kyselé přílivy začínají po pěti cyklech a zůstávají vzácné."
viVN = "Các đợt thời tiết thuận lợi kéo dài và hiểm họa ngắn ngủi. Dòng nước bẩn bắt đầu xuất hiện sau năm chu kỳ và vẫn hiếm gặp."
trTR = "Uzun süreli güzel hava ve kısa süreli tehlikeler. Kötü gelgitler beş döngü sonra başlar ve nadir görülür."

["AlternativeWeatherSystem.Mode.Normal.Description"]
raw = "Cycles lengthen as the settlement grows, and the water sources pick up a little contamination late on."
status = "normal"
enUS = "Cycles lengthen as the settlement grows, and the water sources pick up a little contamination late on."
zhCN = "随着定居点发展，周期会变长，水源在后期也会受到少量污染。"
zhTW = "隨著聚落發展，週期會變長，水源也會在後期受到少許污染。"
ruRU = "По мере роста поселения циклы становятся длиннее, а источники воды ближе к концу немного загрязняются."
jaJP = "集落が成長するにつれてサイクルは長くなり、後半には水源が少し汚染されます。"
frFR = "Les cycles s’allongent à mesure que la colonie grandit, et les sources d’eau se contaminent légèrement vers la fin."
deDE = "Die Zyklen werden länger, wenn die Siedlung wächst, und die Wasserquellen nehmen gegen Ende etwas Verunreinigung auf."
plPL = "Wraz z rozwojem osady cykle się wydłużają, a pod koniec źródła wody ulegają niewielkiemu skażeniu."
ptBR = "Os ciclos ficam mais longos à medida que o assentamento cresce, e as fontes de água acumulam um pouco de contaminação no fim."
koKR = "정착지가 성장할수록 주기가 길어지고, 후반에는 수원에 오염 물질이 조금씩 섞입니다."
csCZ = "S rostoucí osadou se cykly prodlužují a ke konci se do vodních zdrojů dostává trochu kontaminace."
viVN = "Các chu kỳ kéo dài hơn khi khu định cư phát triển, và các nguồn nước dần bị ô nhiễm nhẹ vào giai đoạn cuối."
trTR = "Yerleşim büyüdükçe döngüler uzar ve su kaynakları döngünün sonlarına doğru biraz kirlenir."

["AlternativeWeatherSystem.Mode.Hard.Description"]
raw = "Short fair spells, long and wildly variable hazards, and water that grows steadily fouler."
status = "normal"
enUS = "Short fair spells, long and wildly variable hazards, and water that grows steadily fouler."
zhCN = "晴好天气较短，危险期漫长且变化无常，水质也会持续变得更加污浊。"
zhTW = "晴朗期短暫，危險期漫長且變化莫測，水也會逐漸變得更加污濁。"
ruRU = "Короткие благоприятные периоды, долгие и крайне непредсказуемые опасности, а вода становится всё грязнее."
jaJP = "短い穏やかな期間、長く大きく変動する危険な期間、そして着実に汚染されていく水。"
frFR = "Des périodes de beau temps courtes, des périodes de sécheresse longues et très variables, et une eau qui devient progressivement de plus en plus polluée."
deDE = "Kurze Schönwetterperioden, lange und extrem unvorhersehbare Gefahrenperioden und Wasser, das stetig verseuchter wird."
plPL = "Krótkie okresy sprzyjającej pogody, długie i bardzo zmienne zagrożenia oraz woda, która staje się coraz bardziej zanieczyszczona."
ptBR = "Períodos amenos curtos, perigos longos e extremamente variáveis e água que fica cada vez mais contaminada."
koKR = "짧고 온화한 시기, 길고 변동이 극심한 위험 시기, 그리고 갈수록 더 오염되는 물."
csCZ = "Krátká období příznivého počasí, dlouhá a velmi proměnlivá období nebezpečí a voda, která je stále kalnější."
viVN = "Những đợt thời tiết thuận lợi ngắn, những hiểm họa kéo dài và biến động dữ dội, cùng nguồn nước ngày càng ô nhiễm hơn."
trTR = "Kısa yağışlı dönemler, uzun ve büyük ölçüde değişken tehlikeler ve giderek daha kirli hâle gelen su."

