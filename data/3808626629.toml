itIT = "Qualcosa sta ribollendo sotto la superficie. Tutte le sorgenti eruttano con una forza enorme tra un periodo di siccità e l'altro. Raccogli l'acqua finché puoi."
ukUA = "Щось вариться під землею. Усі джерела вибухають із величезною силою між посушливими періодами. Ловіть воду, поки можете."
thTH = "มีบางอย่างกำลังก่อตัวอยู่ใต้พื้นดิน แหล่งน้ำทุกแห่งจะพุ่งทะลักด้วยพลังมหาศาลในช่วงระหว่างที่แห้งแล้ง รีบกักเก็บน้ำไว้ตราบที่ยังทำได้"
csCZ = "Pod zemí se něco chystá. Mezi obdobími sucha všechny prameny vyvěrají s obrovskou silou. Zachyťte vodu, dokud můžete."
viVN = "Có thứ gì đó đang sôi sục dưới lòng đất. Tất cả các mạch nước đều phun trào dữ dội giữa những đợt khô hạn. Hãy tranh thủ lấy nước khi còn có thể."
caES = "Alguna cosa s'està covant sota terra. Totes les fonts entren en erupció amb una força enorme entre les sequeres. Recolliu l'aigua mentre pugueu."
beBY = "Пад зямлёй нешта закіпае. Усе крыніцы вырываюцца з вялікай сілай паміж засухамі. Лавіце ваду, пакуль можаце."
roRO = "Ceva fierbe sub pământ. Toate izvoarele erup cu o forță uriașă între perioadele de secetă. Prinde apa cât poți."
huHU = "Valami forr a föld alatt. Minden forrás a száraz időszakok között hatalmas erővel tör felszínre. Fogd meg a vizet, amíg lehet."
arSA = "شيء ما يغلي تحت الأرض. تنفجر جميع المنابع بقوة هائلة بين فترات الجفاف. التقط الماء ما دمت تستطيع."

["AlternativeWeatherSystem.Weather.Heatwave.FlavourPlantsBurn"]
raw = "Sources run dry and things that aren't wet burn, including plants and beavers. Humans disbelieved in global warming, we won't make such mistakes."
status = "normal"
enUS = "Sources run dry, and things that aren't wet burn, including plants and beavers. Humans disbelieved in global warming; we won't make the same mistake."
zhCN = "水源会干涸，所有不潮湿的东西都会燃烧，包括植物和海狸。人类曾不相信全球变暖，我们可不会重蹈覆辙。"
zhTW = "水源會乾涸，沒濕的東西都會燃燒，包括植物和海狸。人類曾不相信全球暖化，我們可不會重蹈覆轍。"
ruRU = "Источники пересыхают, а всё, что не мокрое, горит — в том числе растения и бобры. Люди не верили в глобальное потепление, мы не повторим их ошибок."
jaJP = "水源は干上がり、濡れていないものは燃えます。植物もビーバーも例外ではありません。人間は地球温暖化を信じませんでしたが、私たちはそんな過ちを繰り返しません。"
frFR = "Les sources s’assèchent et tout ce qui n’est pas humide brûle, y compris les plantes et les castors. Les humains ne croyaient pas au réchauffement climatique ; nous ne ferons pas la même erreur."
deDE = "Quellen trocknen aus und alles, was nicht nass ist, verbrennt, darunter Pflanzen und Biber. Die Menschen glaubten nicht an die globale Erwärmung. Wir werden nicht dieselben Fehler machen."
plPL = "Źródła wysychają, a wszystko, co nie jest mokre, płonie — w tym rośliny i bobry. Ludzie nie wierzyli w globalne ocieplenie; my nie popełnimy takich błędów."
ptBR = "As fontes secam e tudo que não está molhado pega fogo, incluindo plantas e castores. Os humanos não acreditavam no aquecimento global; não cometeremos os mesmos erros."
koKR = "수원이 말라붙고 젖지 않은 것들은 식물과 비버를 포함해 불에 탑니다. 인간은 지구 온난화를 믿지 않았지만, 우리는 그런 실수를 하지 않을 겁니다."
trTR = "Kaynaklar kurur ve ıslak olmayan her şey yanar; bitkiler ve kunduzlar da buna dahil. İnsanlar küresel ısınmaya inanmadı, biz aynı hatayı yapmayacağız."
esES = "Las fuentes se secan y lo que no está mojado arde, incluidas las plantas y los castores. Los humanos no creían en el calentamiento global; nosotros no cometeremos ese tipo de errores."
itIT = "Le fonti si prosciugano e tutto ciò che non è bagnato brucia, comprese piante e castori. Gli umani non credevano nel riscaldamento globale, noi non commetteremo questo errore."
ukUA = "Джерела пересихають, і все, що не мокре, горить, зокрема рослини та бобри. Люди не вірили в глобальне потепління, а ми таких помилок не припустимося."
thTH = "แหล่งน้ำเหือดแห้ง และสิ่งที่ไม่เปียกก็ลุกไหม้ รวมถึงพืชและบีเวอร์ มนุษย์เคยไม่เชื่อเรื่องภาวะโลกร้อน แต่พวกเราจะไม่ทำผิดพลาดแบบนั้น"
csCZ = "Prameny vysychají a všechno, co není mokré, hoří, včetně rostlin a bobrů. Lidé nevěřili v globální oteplování; my takové chyby neuděláme."
viVN = "Các nguồn nước cạn khô, và những thứ không ướt sẽ bốc cháy, bao gồm cả cây cối và hải ly. Con người từng không tin vào hiện tượng nóng lên toàn cầu; chúng ta sẽ không mắc phải những sai lầm như vậy."
caES = "Les fonts s'assequen i les coses que no estan mullades s'encenen, incloses les plantes i els castors. Els humans no creien en l'escalfament global; nosaltres no cometrem aquests errors."
beBY = "Крыніцы высychаюць, і ўсё, што не вільготнае, гарыць, у тым ліку расліны і бабры. Людзі не верылі ў глабальнае пацяпленне, мы такіх памылак не дапусцім."
roRO = "Sursele de apă se usucă, iar lucrurile care nu sunt ude ard, inclusiv plantele și castorii. Oamenii nu credeau în încălzirea globală, noi nu vom face asemenea greșeli."
huHU = "A források kiszáradnak, a nedvesség nélküli dolgok pedig égnek, a növényeket és a hódokat is beleértve. Az emberek nem hittek a globális felmelegedésben, mi nem fogunk ilyen hibákat elkövetni."
arSA = "المصادر تجف، وكل ما ليس رطبًا يحترق، بما في ذلك النباتات والقنادس. لم يصدّق البشر الاحترار العالمي، أما نحن فلن نرتكب مثل هذه الأخطاء."

