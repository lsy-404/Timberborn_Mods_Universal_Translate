caES = "Tota l'aigua està contaminada, i els desguassos de la marea fangosa s'han activat. L'aigua era la nostra amiga, però ja no ho és."
beBY = "Уся вада забруджана, і адкрыліся сцёкі badtide. Вада была нашай сяброўкай, цяпер гэта ўжо не так."
