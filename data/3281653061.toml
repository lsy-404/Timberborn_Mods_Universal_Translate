["Lapantouflemagic.GigargantuanStorage.Description"]
raw = "Stores a ludicrous amount of one type of ressource.\n<color=yellow>Requires ladders for access</color>\nThe central 7x1 lines do not require to have support underneath.\n<color=#FF6EC7>The glass panes on top are graciously provided by the </color><b>WhitePaws</b><color=#FF6EC7> as part of a self-promotion campaign.</color>"
status = "normal"
enUS = "Stores a ludicrous amount of one type of resource.  \n<color=yellow>Requires ladders for access</color>  \nThe central 7x1 lines do not require support underneath.  \n<color=#FF6EC7>The glass panes on top are graciously provided by the </color><b>WhitePaws</b><color=#FF6EC7> as part of a self-promotion campaign.</color>"
zhCN = "容量巨大，但出入口在建筑中间的底部。<br><color=#FFFF1A>四个角的 3x3 部分需要支撑；中间可以建造垂直楼梯连通上下。</color>"
zhTW = "儲存大量一種資源。  \n<color=yellow>需要梯子才能進入</color>  \n中央的 7x1 線條下方不需要支撐。  \n<color=#FF6EC7>上面的玻璃窗格是由 </color><b>白爪</b><color=#FF6EC7> 提供的，作為自我推廣活動的一部分。</color>"
ruRU = "Хранит нелепое количество одного типа ресурсов.  \n<color=yellow>Для доступа требуются лестницы</color>  \nЦентральные линии 7x1 не нуждаются в поддержке снизу.  \n<color=#FF6EC7>Стеклянные панели сверху щедро предоставлены </color><b>Белыми Лапами</b><color=#FF6EC7> в рамках кампании по само-продвижению.</color>"
jaJP = "一種類のリソースを途方もない量保存します。  \n<color=yellow>アクセスにははしごが必要です</color>  \n中央の7x1のラインは、下に支えがなくても大丈夫です。  \n<color=#FF6EC7>上のガラス板は、</color><b>WhitePaws</b><color=#FF6EC7>のセルフプロモーションキャンペーンの一環として優雅に提供されています。</color>"
frFR = "Stocke une quantité absurde d'un type de ressource.  \n<color=yellow> nécessite des échelles pour y accéder</color>  \nLes lignes centrales de 7x1 ne nécessitent pas de soutien en dessous.  \n<color=#FF6EC7> Les panneaux de verre en haut sont gracieusement fournis par les </color><b>PattesBlanches</b><color=#FF6EC7> dans le cadre d'une campagne de promotion personnelle.</color>"
deDE = "Speichert eine lächerliche Menge einer Ressourcensorte.  \n<color=yellow>Benötigt Leitern für den Zugang</color>  \nDie zentralen 7x1 Linien müssen keine Unterstützung darunter haben.  \n<color=#FF6EC7>Die Glasscheiben oben werden großzügig von den </color><b>WhitePaws</b><color=#FF6EC7> im Rahmen einer Selbstvermarktungskampagne bereitgestellt.</color>"
plPL = "Przechowuje absurdalną ilość jednego rodzaju zasobu.  \n<color=yellow>Wymaga drabin do dostępu</color>  \nCentralne linie 7x1 nie wymagają wsparcia pod sobą.  \n<color=#FF6EC7>Szklane panele na górze są hojnie dostarczane przez </color><b>WhitePaws</b><color=#FF6EC7> w ramach kampanii autopromocyjnej.</color>  "
ptBR = "Armazena uma quantidade absurda de um tipo de recurso.  \n<color=yellow>Requer escadas para acesso</color>  \nAs linhas centrais de 7x1 não precisam ter suporte embaixo.  \n<color=#FF6EC7>Os painéis de vidro na parte superior são gentilmente fornecidos pela </color><b>WhitePaws</b><color=#FF6EC7> como parte de uma campanha de autopromoção.</color>"
koKR = "한 종류의 자원을 터무니없는 양으로 저장합니다.\n<color=yellow>접근을 위해 사다리가 필요합니다</color>\n중앙의 7x1 라인은 아래에 지지가 없어도 됩니다.\n<color=#FF6EC7>위의 유리 패널은 </color><b>WhitePaws</b><color=#FF6EC7>의 자가 홍보 캠페인의 일환으로 generously 제공됩니다.</color>"
trTR = "Bir tür kaynağın absürt bir miktarını depolar.\n<color=yellow>Erişim için merdiven gereklidir</color>\nOrta kısımda yer alan 7x1 hatların altında destek olmasına gerek yoktur.\n<color=#FF6EC7>Üstteki cam paneller, </color><b>BeyazAyaklar</b><color=#FF6EC7> tarafından bir kendini tanıtım kampanyası kapsamında cömertçe sağlanmaktadır.</color>"
esES = "Almacena una cantidad ridícula de un tipo de recurso.\n<color=yellow>Requiere escaleras para acceder</color>\nLas 7x1 líneas centrales no requieren tener soporte debajo.\n<color=#FF6EC7>Los paneles de vidrio de la parte superior son amablemente proporcionados por </color><b>WhitePaws</b><color=#FF6EC7> como parte de una campaña de autopromoción.</color>"
itIT = "Immagazzina una quantità ridicola di un tipo di risorsa.\n<color=yellow>Richiede scale per l'accesso</color>\nLe 7x1 file centrali non richiedono supporto sottostante.\n<color=#FF6EC7>I pannelli di vetro in cima sono gentilmente forniti da </color><b>WhitePaws</b><color=#FF6EC7> nell'ambito di una campagna di autopromozione.</color>"
ukUA = "Зберігає неймовірну кількість одного типу ресурсу.\n<color=yellow>Потрібні драбини для доступу</color>\nЦентральні 7x1 лінії не потребують опори знизу.\n<color=#FF6EC7>Скляні панелі зверху люб'язно надані </color><b>WhitePaws</b><color=#FF6EC7> в рамках кампанії із самореклами.</color>"
thTH = "เก็บทรัพยากรชนิดเดียวได้ในปริมาณมหาศาลอย่างเหลือเชื่อ\n<color=yellow>ต้องใช้บันไดเพื่อเข้าถึง</color>\nแนวแถวตรงกลางขนาด 7x1 ไม่จำเป็นต้องมีสิ่งรองรับอยู่ข้างใต้\n<color=#FF6EC7>แผ่นกระจกด้านบนได้รับการมอบให้อย่างเอื้อเฟื้อจาก </color><b>WhitePaws</b><color=#FF6EC7> เพื่อเป็นส่วนหนึ่งของแคมเปญโปรโมตตัวเอง</color>"
csCZ = "Ukládá absurdní množství jednoho typu zdroje.  \n<color=yellow>Vyžaduje žebříky pro přístup</color>  \nCentrální 7x1 řady nepotřebují podpěru pod sebou.  \n<color=#FF6EC7>Skleněné panely nahoře jsou laskavě poskytovány </color><b>WhitePaws</b><color=#FF6EC7> jako součást kampaně na sebepropagaci.</color>"
viVN = "Lưu trữ một lượng khủng khiếp của một loại tài nguyên.\n<color=yellow>Yêu cầu thang để truy cập</color>\nCác dải ở giữa có kích thước 7x1 không cần có sự hỗ trợ ở phía dưới.\n<color=#FF6EC7>Các tấm kính phía trên được cung cấp một cách hào phóng bởi </color><b>WhitePaws</b><color=#FF6EC7> như một phần của chiến dịch tự quảng bá.</color>"
caES = "Emmagatzema una quantitat ridículament gran d'un tipus de recurs.\n<color=yellow>Calen escales per accedir-hi</color>\nLes 7x1 línies centrals no cal que tinguin suport a sota.\n<color=#FF6EC7>Els vidres de la part superior són gentilment proporcionats per </color><b>WhitePaws</b><color=#FF6EC7> com a part d'una campanya d'autopromoció.</color>"
beBY = "Захоўвае неверагодна вялікую колькасць аднаго тыпу рэсурсу.\n<color=yellow>Для доступу патрабуюцца лесвіцы</color>\nЦэнтральныя лініі 7x1 не патрабуюць апоры знізу.\n<color=#FF6EC7>Шклянныя панэлі наверсе ласкава прадстаўлены </color><b>WhitePaws</b><color=#FF6EC7> у рамках рэкламнай кампаніі.</color>"
roRO = "Stochează o cantitate ridicol de mare dintr-un singur tip de resursă.\n<color=yellow>Necesită scări pentru acces</color>\nLiniile centrale de 7x1 nu necesită suport pe dedesubt.\n<color=#FF6EC7>Panourile de sticlă de deasupra sunt oferite cu generozitate de </color><b>WhitePaws</b><color=#FF6EC7> ca parte a unei campanii de autopromovare.</color>"
huHU = "Nevetetesen nagy mennyiségű egyfajta nyersanyagot tárol.\n<color=yellow>A hozzáféréshez létra szükséges</color>\nA központi 7x1-es sorok alatt nem szükséges támasz.\n<color=#FF6EC7>A tetejére helyezett üvegtáblákat kegyesen a </color><b>WhitePaws</b><color=#FF6EC7> biztosítja, egy önreklám-kampány részeként.</color>"
arSA = "يخزن كمية هائلة بشكل سخيف من نوع واحد من الموارد.\n<color=yellow>يتطلب سلالم للوصول</color>\nالخطوط المركزية 7x1 لا تتطلب وجود دعامات أسفلها.\n<color=#FF6EC7>الألواح الزجاجية في الأعلى مقدمة بكرم من </color><b>WhitePaws</b><color=#FF6EC7> ضمن حملة للترويج الذاتي.</color>"

