["Lapantouflemagic.PitTank.FlavorDescription"]
raw = "Don't lose the bucket, Hoomans waged wars for such things."
status = "normal"
enUS = "Don't lose the bucket, humans waged wars for such things."
zhCN = "“不要把水箱(tank)弄丢了，人类曾经用这玩意来打仗。”——海狸学者"
zhTW = "不要丟掉桶子，人類為這種事而發動戰爭。"
ruRU = "Не теряйте ведро, Люди вели войны из-за таких вещей."
jaJP = "バケツを失わないで、ヒューマンたちはそんなことで戦争を起こしてきた。"
frFR = "Ne perds pas le seau, les humains ont mené des guerres pour de telles choses."
deDE = "Verliere den Eimer nicht, Menschen haben Kriege für solche Dinge geführt."
plPL = "Nie zgub wiadra, Hoomanie toczyli wojny o takie rzeczy."
ptBR = "Não perca o balde, humanos travaram guerras por essas coisas."
koKR = "버킷을 잃지 마세요, 인간들은 이런 것 때문에 전쟁을 벌였습니다."
trTR = "Kova'yı kaybetme, Hoomanlar bu tür şeyler için savaşlar yaptı."
esES = "No pierdas el cubo, los Humanos libraron guerras por cosas así."
itIT = "Non perdere il secchio, gli Umani hanno combattuto guerre per cose del genere."
ukUA = "Не втратьте відро, двоногі воювали за такі речі."
thTH = "อย่าทำถังหาย มนุษย์เคยทำสงครามเพื่อของแบบนี้มาแล้ว"
csCZ = "„Nestrať kbelík, Hoomani vedli války kvůli takovým věcem.“"
viVN = "Đừng để mất cái xô, Hoomans đã gây chiến vì những thứ như vậy."
caES = "No perdis el cubell, els Humans han lluitat guerres per coses així."
beBY = "Не згубі вядро, людзі вайнаваліся за такія рэчы."
roRO = "Nu pierde găleata, Oamenii au purtat războaie pentru asemenea lucruri."
huHU = "Ne veszítsd el a vödröt, a Emberek háborúkat vívtak ilyesmiért."
