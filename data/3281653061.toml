["Lapantouflemagic.Longwarehouse.FlavorDescription"]
raw = "\"I wonder what strange shapes the storage comitee will come up with next\"\n-A lumberjack beaver\"\""
status = "normal"
enUS = "\"I wonder what strange shapes the storage committee will come up with next.\"  \n- A lumberjack beaver"
zhCN = "“我还以为他们会设计得更奇怪一些。”——海狸采集工"
zhTW = "「我想知道儲存委員會接下來會想出什麼奇怪的形狀。」  \n- 一隻伐木工的海狸"
ruRU = "\"Мне интересно, какие странные формы придумает комитет по хранению в следующий раз\" - Бобер-рубщик леса"
jaJP = "「次に貯蔵委員会がどんな奇妙な形を考え出すのか不思議だな」  \n- 認木工のビーバー"
frFR = "« Je me demande quelles formes étranges le comité de stockage va inventer ensuite. »  \n- Un castor bûcheron"
deDE = "\"Ich frage mich, welche seltsamen Formen der Lagerungsausschuss als Nächstes herausfinden wird.\"  \n- Ein Holzfäller-Biber"
plPL = "\"Zastanawiam się, jakie dziwne kształty wymyśli następnie komitet magazynowy.\"  \n- Bóbr drwal"
ptBR = "\"Eu me pergunto que formas estranhas o comitê de armazenamento vai inventar a seguir.\" - Um castor lenhador"
koKR = "\"저장 위원회가 다음에 어떤 이상한 형태를 만들어낼지 궁금하군요.\"  \n- 나무재단사 비버"
trTR = "\"Depolama komitesinin bir sonraki sefer ne tuhaf şekiller ortaya çıkaracağını merak ediyorum.\"  \n-Bir oduncu kunduz"
esES = "\"¿Qué formas extrañas se le ocurrirán al comité de almacenamiento la próxima vez?\"\n-Un leñador castor\"\""
itIT = "\"Mi chiedo che strane forme inventerà il comitato per lo stoccaggio la prossima volta\"\n-Un castoro taglialegna\"\""
ukUA = "\"Цікаво, які дивні форми придумає далі комітет зі сховищ\"\n-Бобер-лісоруб\"\""
thTH = "\"ไม่รู้เลยว่าคณะกรรมการจัดเก็บของจะคิดค้นรูปร่างแปลกๆ อะไรออกมาต่อไป\"\n-บีเวอร์คนตัดไม้\"\""
csCZ = "\"Zajímalo by mě, jaké podivné tvary vymyslí skladovací výbor příště.\"  \n-\"Dřevorubec bobr\""
viVN = "Tôi tự hỏi ủy ban lưu trữ sẽ nghĩ ra những hình dạng kỳ lạ nào tiếp theo\"\n-Một con hải ly thợ đốn củ"
caES = "\"Em pregunto quines formes estranyes inventarà el comitè d'emmagatzematge a continuació\"\n-Un castor llenyataire"
beBY = "\"Цікава, якія дзіўныя формы прыдумае камітэт па захоўванні далей\n-Бабёр-лесаруб\"\""
roRO = "\"Mă întreb ce forme ciudate va inventa comitetul de depozitare data viitoare\"\n-Un castor dughean"
