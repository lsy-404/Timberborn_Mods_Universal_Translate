ukUA = "Ви думали, що хтось просто так віддасть вам усе те скло? Хто б таке зробив?"
thTH = "คุณคิดหรือว่าจะมีใครให้กระจกทั้งหมดนั่นฟรีๆ? ใครกันที่จะทำแบบนั้น?"
csCZ = " myslel/a jsi, že ti někdo dá všechno to sklo zadarmo? Kdo by to kdy udělal?"
