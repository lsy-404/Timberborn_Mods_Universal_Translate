["BeaverBuddies.FirstTimer.Message"]
raw = "It looks like this is your first time using BeaverBuddies. We recommend taking a quick look through our guide to make sure you are set up to play. Would you like to do that now?"
status = "normal"
enUS = "It looks like this is your first time using BeaverBuddies. We recommend taking a quick look through our guide to make sure you are set up to play. Would you like to do that now?"
zhCN = "“看起来这是你第一次使用 BeaverBuddies。我们建议你快速浏览一下我们的指南，以确保你已做好游戏准备。你想现在这样做吗？”"
zhTW = "看起來這是您第一次使用 BeaverBuddies。我們建議您快速瀏覽我們的指南，以確保您已準備好進行遊戲。您現在想這樣做嗎？"
ruRU = "Похоже, это ваш первый раз, когда вы используете BeaverBuddies. Мы рекомендуем быстро ознакомиться с нашим руководством, чтобы вы были готовы к игре. Хотели бы вы сделать это сейчас?"
jaJP = "「これはBeaverBuddiesを初めて利用するようですね。プレイの準備が整っているか確認するために、ガイドに目を通すことをお勧めします。今、それを行いますか？」"
frFR = "Il semble que ce soit votre première fois en utilisant BeaverBuddies. Nous vous recommandons de jeter un coup d'œil rapide à notre guide pour vous assurer que vous êtes prêt à jouer. Souhaitez-vous le faire maintenant ?"
deDE = "Es sieht so aus, als wäre dies Ihr erster Besuch bei BeaverBuddies. Wir empfehlen, einen kurzen Blick in unser Handbuch zu werfen, um sicherzustellen, dass Sie richtig eingerichtet sind, um zu spielen. Möchten Sie das jetzt tun?"
plPL = "Wydaje się, że to twój pierwszy raz korzystając z BeaverBuddies. Zalecamy szybkie zapoznanie się z naszym przewodnikiem, aby upewnić się, że wszystko jest gotowe do gry. Czy chciałbyś to zrobić teraz?"
ptBR = "Parece que esta é a sua primeira vez usando o BeaverBuddies. Recomendamos dar uma olhada rápida em nosso guia para garantir que você esteja pronto para jogar. Você gostaria de fazer isso agora?"
koKR = "이것이 BeaverBuddies를 사용하는 첫 번째 시간인 것 같습니다. 게임을 시작할 준비가 되어 있는지 확인하기 위해 가이드를 간단히 살펴보는 것을 추천합니다. 지금 그렇게 하시겠습니까?"
trTR = "Bu, BeaverBuddies'i kullanıyor olmanızın ilk kez olduğunu gösteriyor. Oynamaya hazır olduğunuzdan emin olmak için kılavuzumuza hızlıca göz atmanızı öneririz. Bunu şimdi yapmak ister misiniz?"
esES = "Parece que es la primera vez que usas BeaverBuddies. Te recomendamos echar un vistazo rápido a nuestra guía para asegurarte de que todo esté listo para jugar. ¿Quieres hacerlo ahora?"
itIT = "Sembra che tu stia usando BeaverBuddies per la prima volta. Ti consigliamo di dare un’occhiata alla nostra guida per assicurarti che sia tutto pronto per giocare. Vuoi farlo adesso?"
ukUA = "Схоже, ви вперше користуєтеся BeaverBuddies. Радимо швидко ознайомитися з нашим посібником, щоб переконатися, що все готово до гри. Бажаєте зробити це зараз?"
thTH = "ดูเหมือนว่านี่จะเป็นครั้งแรกที่คุณใช้ BeaverBuddies เราขอแนะนำให้ลองอ่านคู่มือของเราอย่างรวดเร็ว เพื่อให้แน่ใจว่าคุณตั้งค่าพร้อมเล่นแล้ว ต้องการอ่านตอนนี้ไหม?"
csCZ = "Vypadá to, že používáte BeaverBuddies poprvé. Doporučujeme rychle se podívat na náš průvodce, abyste se ujistili, že máte vše nastaveno pro hraní. Chtěli byste to udělat nyní?"
viVN = " Có vẻ đây là lần đầu tiên bạn sử dụng BeaverBuddies. Chúng tôi khuyến nghị dành một chút thời gian xem qua hướng dẫn của chúng tôi để đảm bảo bạn đã sẵn sàng để chơi. Bạn có muốn làm điều đó ngay bây giờ không?"
caES = "Sembla que és la primera vegada que fas servir BeaverBuddies. Et recomanem que facis una ullada ràpida a la nostra guia per assegurar-te que ho tens tot a punt per jugar. Vols fer-ho ara?"
beBY = "Здаецца, вы ўпершыню карыстаецеся BeaverBuddies. Рэкамендуем хутка азнаёміцца з нашым кіраўніцтвам, каб пераканацца, што ўсё гатова да гульні. Хочаце зрабіць гэта зараз?"
roRO = "Se pare că folosești BeaverBuddies pentru prima dată. Îți recomandăm să arunci o privire rapidă peste ghidul nostru, ca să te asiguri că totul este pregătit pentru joc. Vrei să faci asta acum?"
huHU = "Úgy tűnik, most használod először a BeaverBuddies-t. Javasoljuk, hogy gyorsan nézd át az útmutatónkat, hogy biztosan minden készen álljon a játékhoz. Szeretnéd ezt most megtenni?"
arSA = "يبدو أن هذه هي المرة الأولى التي تستخدم فيها BeaverBuddies. نوصي بإلقاء نظرة سريعة على دليلنا للتأكد من استعدادك للعب. هل ترغب في ذلك الآن؟"

