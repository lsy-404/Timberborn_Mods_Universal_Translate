["BeaverBuddies.Settings.AlwaysTrace.Tooltip"]
raw = "When enabled, the game will always use detailed logging, which enables you to submit desync reports on the first occurrence without manually enabling detailed logging.\nNote that all players must have the setting enabled. \nThis setting will cause some lag and is not recommended for most players."
status = "normal"
enUS = "When enabled, the game will always use detailed logging, allowing you to submit desync reports on the first occurrence without manually enabling detailed logging. \nNote that all players must have this setting enabled. \nThis setting may cause some lag and is not recommended for most players."
zhCN = "启用时，游戏将始终使用详细日志，这样您在首次发生不同步时可以提交不同步报告，而无需手动启用详细日志。\n请注意，所有玩家必须启用此设置。\n该设置会导致部分延迟，不建议大多数玩家使用。"
zhTW = "當啟用時，遊戲將始終使用詳細日誌，這使您能夠在首次發生脫節時提交脫節報告，而無需手動啟用詳細日誌。 \n請注意，所有玩家必須啟用此設置。 \n此設置將導致某些延遲，並不建議大多數玩家使用。"
ruRU = "При включении игра всегда будет использовать подробное ведение журналов, что позволит вам отправлять отчеты о рассинхронизации при первом возникновении без необходимости вручную включать подробное ведение журналов. Обратите внимание, что все игроки должны иметь эту настройку включенной. Эта настройка может вызвать некоторые задержки и не рекомендуется для большинства игроков."
jaJP = "有効にすると、ゲームは常に詳細なログを使用し、最初の発生時に手動で詳細なログを有効にすることなくデシンク報告を送信できるようになります。すべてのプレイヤーがこの設定を有効にする必要があることに注意してください。この設定は一部の遅延を引き起こし、ほとんどのプレイヤーには推奨されません。"
frFR = "Lorsque cette option est activée, le jeu utilisera toujours un journal détaillé, ce qui vous permettra de soumettre des rapports de désynchronisation dès la première occurrence sans activer manuellement le journal détaillé. \nNotez que tous les joueurs doivent avoir cette option activée. \nCette option peut provoquer un certain lag et n'est pas recommandée pour la plupart des joueurs."
deDE = "Wenn aktiviert, wird das Spiel immer detailliertes Logging verwenden, was es Ihnen ermöglicht, Desynchronisationsberichte beim ersten Auftreten einzureichen, ohne das detaillierte Logging manuell aktivieren zu müssen. \nBitte beachten Sie, dass alle Spieler diese Einstellung aktiviert haben müssen. \nDiese Einstellung kann zu Verzögerungen führen und wird den meisten Spielern nicht empfohlen."
plPL = "Po włączeniu gra zawsze będzie używać szczegółowego logowania, co umożliwia wysyłanie raportów o desynchronizacji przy pierwszym wystąpieniu bez ręcznego włączania szczegółowego logowania. \nNależy pamiętać, że wszyscy gracze muszą mieć włączoną tę opcję. \nUstawienie to może powodować opóźnienia i nie jest zalecane dla większości graczy."
ptBR = "Quando ativado, o jogo sempre usará registros detalhados, o que permite que você envie relatórios de desincronização na primeira ocorrência sem precisar ativar manualmente os registros detalhados. \nObserve que todos os jogadores devem ter essa configuração ativada. \nEssa configuração pode causar algum atraso e não é recomendada para a maioria dos jogadores."
koKR = "활성화하면 게임이 항상 세부 로깅을 사용하게 되며, 이로 인해 첫 번째 발생 시 자동으로 비동기 보고서를 제출할 수 있습니다. \n모든 플레이어가 이 설정을 활성화해야 합니다. \n이 설정은 약간의 지연을 초래하며, 대부분의 플레이어에게는 권장되지 않습니다."
trTR = "Açık olduğunda, oyun her zaman ayrıntılı günlüğü kullanır; bu, ilk ortaya çıkışta ayrıntılı günlüğü manuel olarak etkinleştirmeden senkronizasyon hatası raporları göndermenizi sağlar. \nTüm oyuncuların bu ayarı etkinleştirmiş olması gerektiğini unutmayın. \nBu ayar bazı gecikmelere neden olacak ve çoğu oyuncu için önerilmez."
esES = "Cuando está activada, el juego siempre usará el registro detallado, lo que te permitirá enviar informes de desincronización en cuanto ocurra por primera vez, sin tener que activar manualmente el registro detallado.\nTen en cuenta que todos los jugadores deben tener esta opción activada. \nEsta opción provocará cierto lag y no se recomienda para la mayoría de los jugadores."
itIT = "Quando è attivata, il gioco utilizzerà sempre la registrazione dettagliata, consentendoti di inviare segnalazioni di desincronizzazione alla prima occorrenza senza dover attivare manualmente la registrazione dettagliata.\nNota che tutti i giocatori devono aver attivato l'impostazione. \nQuesta impostazione causerà un po' di lag e non è consigliata alla maggior parte dei giocatori."
ukUA = "Коли цей параметр увімкнено, гра завжди використовуватиме докладне журналювання, що дасть змогу надіслати звіт про розсинхронізацію вже за першої її появи, не вмикаючи докладне журналювання вручну.\nЗверніть увагу: у всіх гравців має бути ввімкнено цей параметр. \nЦей параметр спричинятиме деякі затримки й не рекомендується більшості гравців."
thTH = "เมื่อเปิดใช้งาน เกมจะใช้การบันทึกข้อมูลแบบละเอียดเสมอ ซึ่งช่วยให้คุณส่งรายงานการซิงก์ไม่ตรงกันได้ตั้งแต่ครั้งแรกที่เกิดขึ้น โดยไม่ต้องเปิดใช้การบันทึกข้อมูลแบบละเอียดด้วยตนเอง\nโปรดทราบว่าผู้เล่นทุกคนต้องเปิดใช้การตั้งค่านี้ \nการตั้งค่านี้จะทำให้เกิดอาการกระตุก และไม่แนะนำสำหรับผู้เล่นส่วนใหญ่"
csCZ = "Pokud je povoleno, hra vždy použije podrobné protokolování, což vám umožní odeslat zprávy o desynchronizaci při prvním výskytu bez nutnosti manuálně aktivovat podrobné protokolování. Všimněte si, že všichni hráči musí mít toto nastavení povolené. Toto nastavení může způsobit určité zpoždění a není doporučeno pro většinu hráčů."
viVN = "Khi được bật, trò chơi sẽ luôn ghi nhật ký chi tiết, cho phép bạn gửi báo cáo lệch đồng bộ ngay lần đầu tiên xảy ra mà không cần bật ghi nhật ký chi tiết bằng tay.\nLưu ý rằng tất cả người chơi phải bật thiết lập này.\n\nThiết lập này sẽ gây một chút lag và không được khuyến nghị cho hầu hết người chơi."
caES = "Quan està activada, el joc farà servir sempre el registre detallat, cosa que et permetrà enviar informes de desincronització en la primera ocurrència sense haver d’activar manualment el registre detallat.\nTingues en compte que tots els jugadors han de tenir aquesta opció activada.\nAquesta opció provocarà una mica de retard i no es recomana a la majoria de jugadors."
beBY = "Калі ўключана, гульня заўсёды будзе выкарыстоўваць падрабязнае вядзенне журналаў, што дазволіць вам адправіць справаздачу аб дэсінхранізацыі пры першым яе ўзнікненні, не ўключаючы падрабязнае вядзенне журналаў уручную.\nЗвярніце ўвагу, што гэтая налада павінна быць уключана ва ўсіх гульцоў. \nГэтая налада выкліча некаторыя затрымкі і не рэкамендуецца большасці гульцоў."
roRO = "Când este activată, jocul va folosi întotdeauna înregistrarea detaliată, ceea ce vă permite să trimiteți rapoarte de desincronizare la prima apariție, fără a activa manual înregistrarea detaliată.\nRețineți că toți jucătorii trebuie să aibă această setare activată. \nAceastă setare va provoca ceva lag și nu este recomandată majorității jucătorilor."
huHU = "Bekapcsolt állapotban a játék mindig részletes naplózást használ, így már az első előforduláskor beküldhetsz deszinkronizációs jelentéseket anélkül, hogy kézzel kellene bekapcsolnod a részletes naplózást.\nNe feledd, hogy ezt a beállítást minden játékosnak be kell kapcsolnia. \nEz a beállítás némi akadozást okoz, ezért a legtöbb játékosnak nem ajánlott."
arSA = "عند التفعيل، سيستخدم اللعبة دائمًا التسجيل التفصيلي، مما يتيح لك إرسال تقارير عدم التزامن عند حدوثها لأول مرة دون تفعيل التسجيل التفصيلي يدويًا.\nيجب أن يكون هذا الإعداد مفعّلًا لدى جميع اللاعبين.\nسيتسبب هذا الإعداد في بعض التأخير، ولا يُنصح به لمعظم اللاعبين."

