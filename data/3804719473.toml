viVN = "Các thay đổi sẽ có hiệu lực khi bạn nhấn Xác nhận. Độ dài thời tiết sẽ được áp dụng từ chu kỳ tiếp theo."
caES = "Els canvis tindran efecte quan premis Confirma. Les durades del clima s'aplicaran a partir del següent cicle."
