koKR = "변경 사항은 확인을 누르면 적용됩니다. 날씨 지속 시간은 다음 주기부터 적용됩니다."
trTR = "Değişiklikler \"Onayla\" tuşuna bastığınızda geçerli olur. Hava durumu sürelerı bir sonraki döngüden itibaren uygulanır."
esES = "Los cambios surten efecto al pulsar Confirmar. Las duraciones del clima se aplican a partir del siguiente ciclo."
