["acalc79.HardcoreSettings.NaturalWaterways.Prompt"]
status = "normal"
raw = "Restrict this map to natural waterways? Water will only be able to leave the map at the low points of its edges; everywhere else is sealed permanently. This changes the map itself and cannot be undone."
enUS = "Restrict this map to natural waterways? Water will only be able to leave the map at the low points along its edges; everywhere else will be sealed permanently. This changes the map itself and cannot be undone."
zhCN = "将此地图限制为天然水道？水只能从地图边缘的低处流出；其他地方将永久封闭。此操作会改变地图本身，且无法撤销。"
zhTW = "要將此地圖限制為天然水道嗎？水只能從地圖邊緣的低處流出；其他地方都會永久封閉。這會改變地圖本身，而且無法復原。"
ruRU = "Ограничить эту карту естественными водотоками? Вода сможет покидать карту только в низинах у её краёв; все остальные участки будут навсегда перекрыты. Это изменит саму карту, и изменение нельзя будет отменить."
jaJP = "このマップを自然の水路のみに制限しますか？水がマップの外へ出られるのは、マップの端の低い地点だけになります。それ以外の場所は永久に封鎖されます。この変更はマップ自体に適用され、元に戻すことはできません。"
frFR = "Restreindre cette carte aux cours d’eau naturels ? L’eau ne pourra quitter la carte qu’aux points les plus bas de ses bords ; partout ailleurs, ceux-ci seront scellés de façon permanente. Cela modifie la carte elle-même et ne peut pas être annulé."
deDE = "Wasserwege dieser Karte auf natürliche beschränken? Wasser kann die Karte dann nur noch an den tiefsten Stellen ihrer Ränder verlassen; alle anderen Stellen sind dauerhaft abgedichtet. Dadurch wird die Karte selbst verändert, und diese Änderung kann nicht rückgängig gemacht werden."
plPL = "Ograniczyć tę mapę do naturalnych cieków wodnych? Woda będzie mogła opuszczać mapę tylko w najniższych punktach jej krawędzi; wszystkie pozostałe miejsca zostaną trwale zamknięte. Ta zmiana dotyczy samej mapy i nie można jej cofnąć."
ptBR = "Restringir este mapa aos cursos d’água naturais? A água só poderá sair do mapa pelos pontos mais baixos de suas bordas; todos os outros locais ficarão permanentemente bloqueados. Isso altera o próprio mapa e não pode ser desfeito."
koKR = "이 지도의 물길을 자연적인 경로로만 제한할까요? 물은 지도 가장자리의 낮은 지점으로만 빠져나갈 수 있으며, 그 밖의 모든 곳은 영구적으로 막힙니다. 이 변경은 지도 자체에 적용되며 되돌릴 수 없습니다."
csCZ = "Omezit tuto mapu na přirozená vodní koryta? Voda bude moci opustit mapu pouze v nízko položených místech jejích okrajů; všude jinde budou okraje trvale uzavřené. Tím se změní samotná mapa a změnu nebude možné vrátit zpět."
viVN = "Giới hạn bản đồ này chỉ còn các dòng nước tự nhiên? Nước chỉ có thể chảy ra khỏi bản đồ ở những điểm thấp trên rìa bản đồ; mọi nơi khác sẽ bị bịt kín vĩnh viễn. Thay đổi này tác động lên chính bản đồ và không thể hoàn tác."
trTR = "Bu haritayı doğal su yollarıyla mı sınırlandıralım? Su, haritadan yalnızca kenarlarının alçak noktalarından çıkabilecek; diğer tüm noktalar kalıcı olarak kapatılacak. Bu işlem haritanın kendisini değiştirir ve geri alınamaz."

