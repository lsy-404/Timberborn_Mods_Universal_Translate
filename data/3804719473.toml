roRO = "Modificările intră în vigoare când apeși Confirmă. Duratele vremii se aplică de la următorul ciclu."
huHU = "A módosítások a Megerősítés gomb megnyomásakor lépnek életbe. Az időjárási hosszúságok a következő ciklustól érvényesek."
