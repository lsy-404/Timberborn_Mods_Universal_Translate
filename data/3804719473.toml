["acalc79.HardcoreSettings.Midgame.Reload"]
status = "normal"
raw = "Some of these changes take effect only in a freshly loaded game: pressing Confirm saves the settlement as an autosave and loads it again."
enUS = "Some of these changes take effect only in a freshly loaded game: pressing Confirm saves the settlement as an autosave and loads it again."
zhCN = "部分更改仅在重新加载的游戏中生效：点击“确认”会将聚居地保存为自动存档，然后再次加载。"
zhTW = "部分變更只會在重新載入的遊戲中生效：按下「確認」後，聚落會被自動存檔並重新載入。"
ruRU = "Некоторые из этих изменений вступают в силу только в только что загруженной игре: при нажатии «Подтвердить» поселение сохраняется как автосохранение и загружается снова."
jaJP = "いくつかの変更は、新たに読み込んだゲームでのみ有効になります。「確認」を押すと、集落が自動セーブとして保存され、そのセーブデータが再度読み込まれます。"
frFR = "Certaines de ces modifications ne prennent effet que dans une partie fraîchement chargée : appuyer sur Confirmer enregistre la colonie comme sauvegarde automatique puis la recharge."
deDE = "Einige dieser Änderungen werden nur in einem frisch geladenen Spiel wirksam: Beim Drücken von Bestätigen wird die Siedlung als Autospeicherstand gespeichert und anschließend wieder geladen."
plPL = "Niektóre z tych zmian zaczną obowiązywać dopiero po wczytaniu świeżo załadowanej gry: naciśnięcie Potwierdź zapisuje osadę jako autozapis i wczytuje ją ponownie."
ptBR = "Algumas dessas mudanças só entram em vigor em um jogo recém-carregado: ao pressionar Confirmar, o assentamento é salvo como um salvamento automático e carregado novamente."
koKR = "일부 변경 사항은 새로 불러온 게임에서만 적용됩니다. '확인'을 누르면 정착지가 자동 저장으로 저장된 뒤 다시 불러와집니다."
trTR = "Bu değişikliklerin bazıları yalnızca yeni yüklenmiş bir oyunda geçerli olur: Onayla'ya basmak yerleşimi otomatik kayıt olarak kaydeder ve ardından yeniden yükler."
esES = "Algunos de estos cambios solo surten efecto en una partida recién cargada: al pulsar Confirmar, el asentamiento se guarda como autoguardado y se vuelve a cargar."
itIT = "Alcune di queste modifiche hanno effetto solo in una partita appena caricata: premendo Conferma, l'insediamento viene salvato come salvataggio automatico e poi caricato di nuovo."
ukUA = "Деякі з цих змін набувають чинності лише в щойно завантаженій грі: після натискання «Підтвердити» поселення зберігається як автозбереження і завантажується знову."
thTH = "บางการเปลี่ยนแปลงเหล่านี้จะมีผลก็ต่อเมื่อโหลดเกมใหม่เท่านั้น: เมื่อกดยืนยัน ระบบจะบันทึกการตั้งถิ่นฐานเป็นการบันทึกอัตโนมัติและโหลดขึ้นมาใหม่"
csCZ = "Některé z těchto změn se projeví až po novém načtení hry: stisknutím tlačítka Potvrdit se osada uloží jako automatické uložení a poté se znovu načte."
viVN = "Một số thay đổi này chỉ có hiệu lực sau khi tải lại một ván game mới: nhấn Xác nhận sẽ lưu khu định cư thành bản tự động lưu rồi tải lại nó."
caES = "Alguns d'aquests canvis només tenen efecte en una partida acabada de carregar: en prémer Confirma, l'assentament es desa com a desament automàtic i es torna a carregar."
beBY = "Некаторыя з гэтых змен набываюць сілу толькі ў нанова загружанай гульні: пры націску «Пацвердзіць» паселішча захоўваецца як аўтазахаванне і загружаецца зноў."
roRO = "Unele dintre aceste modificări intră în vigoare numai într-un joc proaspăt încărcat: apăsarea butonului Confirmare salvează așezarea ca salvare automată și o încarcă din nou."
huHU = "Néhány ezek közül a változtatások csak egy frissen betöltött játékban lépnek életbe: a Megerősítés gombra kattintva a település automatikus mentést kap, majd újra betöltődik."
arSA = "بعض هذه التغييرات لا تسري إلا في لعبة محمّلة حديثًا: عند الضغط على \"تأكيد\" يُحفظ الاستيطان كحفظ تلقائي ثم يُحمَّل من جديد."

