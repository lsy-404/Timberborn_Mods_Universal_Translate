["LV.BPSP.WaterWheelUp1Lore"]
raw = "A light mist lifts our wheels just enough to hum through the day."
status = "abandoned"
enUS = "A light mist lifts our wheels just enough to hum through the day."
zhCN = "薄雾轻拂，让我们的水轮终日轻鸣。"
zhTW = "一層輕霧輕輕撫過我們的輪胎，讓我們在一天中愉悅地駛過。"
ruRU = "Легкий туман поднимает наши колеса достаточно, чтобы мы могли проехать через день."
jaJP = "薄い霧が私たちの車輪を少し持ち上げ、一日中ハミングするのに十分です。"
frFR = "Une légère brume soulève nos roues juste assez pour faire vibrer la journée."
deDE = "Ein leichter Nebel hebt unsere Räder gerade genug an, um den Tag hindurch zu summen."
plPL = "Lekka mgła unosi nasze koła wystarczająco, aby szumieć przez cały dzień."
ptBR = "Uma leve névoa levanta nossas rodas apenas o suficiente para zumbir ao longo do dia."
koKR = "가벼운 안개가 우리의 수차를 살짝 들어올려 하루 종일 윙윙거리게 합니다."
trTR = "Hafif bir sis, tekerleklerimizi gün boyunca vınlayacak kadar kaldırır."
esES = "Una ligera neblina eleva nuestras ruedas lo justo para zumbar durante el día."
itIT = "Una leggera foschia solleva le nostre ruote quel tanto che basta per ronzare durante la giornata."
ukUA = "Легкий туман трохи піднімає наші колеса, щоб вони гули протягом дня."
thTH = "ละอองหมอกบางเบายกล้อของเราขึ้นเพียงพอให้หมุนวนไปตลอดทั้งวัน"
csCZ = "Lehká mlha zvedá naše kola právě dost, aby během dne mohly hummovat."
viVN = "Một làn sương mù nhẹ nâng bánh xe của chúng ta lên vừa đủ để ngân nga suốt cả ngày."
caES = "Una boira lleugera aixeca les nostres rodes just el suficient per a zumbar durant el dia."
beBY = "Лёгкі туман трохі падымае нашы колы, так што яны могуць гудзець цэлы дзень."
roRO = "O ceață ușoară ne ridică roțile exact cât să putem vui pe parcursul zilei."
huHU = "Egy könnyű köd annyira felemeli kerekeinket, hogy a nap folyamán zúgva forogjanak."
arSA = "يرفع رذاذ خفيف عجلاتنا بما يكفي لتدور بهدوء طوال النهار."

