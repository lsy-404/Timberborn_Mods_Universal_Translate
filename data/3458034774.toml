deDE = "Jede ungenutzte Energie in Ihrer Kolonie wird in Wissenschaft umgewandelt. Umrechnungsrate: {0}HP-Stunde zu 1 Wissenschaft, abgerundet. Batterien sind nicht betroffen und beeinflussen nicht die Berechnung dieses Projekts."
plPL = "Każda niewykorzystana energia w twojej kolonii jest przekształcana w naukę. Stawka konwersji: {0}HP-godzina na 1 naukę, zaokrąglone w dół. Akumulatory nie są uwzględniane i nie wpływają na żadne obliczenia tego projektu."
ptBR = "Qualquer poder não utilizado em sua colônia é convertido em ciência. Taxa de conversão: {0}HP-hora para 1 Ciência, arredondado para baixo. Baterias não são afetadas e não afetam nenhum cálculo deste projeto."
koKR = "여러분의 식민지에서 사용되지 않는 모든 전력은 과학으로 전환됩니다. 전환 비율: {0}HP-시간당 1 과학, 내림하여 반올림합니다. 배터리는 영향을 받지 않으며 이 프로젝트의 계산에 영향을 주지 않습니다."
trTR = "Koloninizde kullanılmayan herhangi bir güç bilim olarak dönüştürülür. Dönüşüm oranı: {0}HP-saat 1 Bilim için, aşağıya yuvarlanarak. Piller etkilenmez ve bu projenin herhangi bir hesaplamasını etkilemez."
esES = "Cualquier energía no utilizada en toda tu colonia se convierte en ciencia. Tasa de conversión: {0} HP-hora por 1 de Ciencia, redondeado hacia abajo. Las baterías no se ven afectadas y no influyen en ningún cálculo de este proyecto."
itIT = "Qualsiasi energia inutilizzata in tutta la tua colonia viene convertita in scienza. Tasso di conversione: {0}HP-ora per 1 Scienza, arrotondato per difetto. Le batterie non sono interessate e non influiscono su alcun calcolo di questo progetto."
ukUA = "Будь-яка невикористана енергія у вашій колонії перетворюється на науку. Коефіцієнт перетворення: {0}HP-година на 1 науку, з округленням униз. Батареї не враховуються і не впливають на жоден розрахунок для цього проєкту."
thTH = "พลังงานส่วนเกินทั้งหมดในอาณานิคมของคุณจะถูกแปลงเป็นวิทยาศาสตร์ อัตราการแปลง: {0} HP-ชั่วโมงต่อ 1 วิทยาศาสตร์ ปัดเศษลง แบตเตอรี่ไม่ได้รับผลกระทบและไม่มีผลต่อการคำนวณใด ๆ ของโครงการนี้"
csCZ = "Veškerá nevyužitá energie ve vaší kolonii se převádí na vědu. Směnný kurz: {0}HP-hodina na 1 vědu, zaokrouhleno dolů. Akumulátory nejsou ovlivněny a nemají vliv na výpočty tohoto projektu."
viVN = "Mọi nguồn điện dư thừa trên khắp thuộc địa của bạn được chuyển đổi thành khoa học. Tỷ lệ chuyển đổi: {0}HP-giờ sang 1 khoa học, làm tròn xuống. Pin không bị ảnh hưởng và cũng không ảnh hưởng đến bất kỳ phép tính nào của dự án này."
caES = "Qualsevol energia sobrant de la vostra colònia es converteix en ciència. Taxa de conversió: {0}HP-hora per 1 Ciència, arrodonida a la baixa. Les bateries no es veuen afectades i no afecten cap càlcul d'aquest projecte."
beBY = "Любая неиспользованная энергия по всей вашей колонии преобразуется в науку. Коэффициент преобразования: {0} HP-час в 1 науку, с округлением вниз. Батареи не затрагиваются и не влияют на расчёты этого проекта."
roRO = "Orice putere neutilizată din întreaga colonie este convertită în știință. Rată de conversie: {0} HP-oră la 1 Știință, rotunjit în jos. Bateriile nu sunt afectate și nu influențează niciun calcul al acestui proiect."
huHU = "Bármely kihasználatlan energia a kolónián belül tudománnyá alakul. Átváltási arány: {0} HP-óra = 1 Tudomány, lefelé kerekítve. Az akkumulátorokra ez nem vonatkozik, és a projekt egyéb számításait sem befolyásolják."
arSA = "أي طاقة فائضة غير مستخدمة في جميع أنحاء مستعمرتك تُحوَّل إلى علم. معدل التحويل: {0} ساعة·حصان إلى 1 علم، مع التقريب إلى الأدنى. البطاريات لا تتأثر ولا تؤثر في أي حساب لهذا المشروع."

["LV.BPSP.SparePowerScienceLore"]
raw = "'Extra watts buzzing around? Now they zap straight into our cleverest ideas!' — Sparkchew Thinkatron"
status = "normal"
enUS = "\"Extra watts buzzing around? Now they zap straight into our cleverest ideas!\" — Sparkchew Thinkatron"
zhCN = "从能源升级到技术开放，从物质开源到思想开源。"
zhTW = "「額外的瓦數在周圍嗡嗡作響？現在它們直接進入我們最聰明的想法！」— Sparkchew Thinkatron"
ruRU = "«Дополнительные ватты жужжат вокруг? Теперь они напрямую попадают в наши самые умные идеи!» — Sparkchew Thinkatron"
jaJP = "「周りに余分なワットが buzzing していますか？今、それらは私たちの最も賢いアイデアに直接飛び込んでいます！」 — スパークチュー シンカトロン"
frFR = "'Des watts supplémentaires qui bourdonnent autour ? Maintenant, ils se dirigent directement vers nos idées les plus ingénieuses !' — Sparkchew Thinkatron"
deDE = "'Extra Wattstunden summen herum? Jetzt fließen sie direkt in unsere cleversten Ideen!' — Sparkchew Thinkatron"
plPL = "'Extra waty brzęczą wokół? Teraz wkraczają prosto do naszych najcleverniejszych pomysłów!' — Sparkchew Thinkatron"
ptBR = "'Watt extra zumbindo por aí? Agora eles vão direto para nossas ideias mais inteligentes!' — Sparkchew Thinkatron"
koKR = "'추가 전력이 돌아다니고 있나요? 이제 그들은 우리의 가장 영리한 아이디어로 직빵으로 들어옵니다!' — 스파크츄 신타트론"
trTR = "\"'Etrafta dolaşan ekstra watt'lar mı var? Artık doğrudan en zeki fikirlerimize akıyorlar!\" — Sparkchew Thinkatron"
esES = "«¿Vatios sobrantes zumbando por ahí? ¡Ahora se descargan directamente en nuestras ideas más brillantes!» — Sparkchew Thinkatron"
itIT = "'Watt in più che ronzano in giro? Ora finiscono dritti nelle nostre idee più geniali!' — Sparkchew Thinkatron"
ukUA = "«Зайві вати дзижчать навколо? Тепер вони б'ють прямо в наші найрозумніші ідеї!» — Спаркчев Тинкатрон"
thTH = "\"ไฟฟ้าส่วนเกินที่ซ่าอยู่รอบตัวน่ะเหรอ? ตอนนี้มันวิ่งตรงเข้าสู่ไอเดียที่ฉลาดที่สุดของเราแล้ว!\" — สปาร์กเชิว ธิงก์อะตรอน"
csCZ = "'Další watty, které krouží kolem? Nyní přímo směřují do našich nejchytřejších nápadů!' — Sparkchew Thinkatron"
viVN = "'Nhiều watt đang vo ve quanh đây sao? Giờ chúng sẽ phóng tia thẳng vào những ý tưởng thông minh nhất của chúng ta!' — Sparkchew Thinkatron"
caES = "\"Watts extra que zumben pels voltants? Ara s'envien directament a les nostres idees més brillants!\" — Sparkchew Thinkatron"
beBY = "«Дадатковая магутнасць лятае вакол? Цяпер яна б'е проста ў нашы разумнейшыя ідэі!» — Sparkchew Thinkatron"
roRO = "„Wați în plus care bâzâie pe-aici? Acum se duc direct în cele mai istețe idei ale noastre!\" — Sparkchew Thinkatron"
huHU = "„Extra watt-ok zümmögnek? Most egyenesen a legokosabb ötleteinkbe csapnak!\" — Sparkchew Thinkatron"
arSA = "\"ساقية الطاقة الزائدة من الواط تطنّ حولنا؟ الآن تنطلق مباشرةً إلى أذكى أفكارنا!\" — سباركشيو ثينكاترون"

