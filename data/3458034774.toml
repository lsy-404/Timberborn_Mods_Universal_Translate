["LV.BPSP.WaterWheelUp2Lore"]
raw = "'Look at that mist kick in—wheels practically sing by dusk!' — Misttail Spinner"
status = "abandoned"
enUS = "\"Look at that mist kick in—wheels practically sing by dusk!\" — Misttail Spinner"
zhCN = "徐雾长行，让我们的水轮纵情歌唱。"
zhTW = "「看那薄霧出現—輪子在黃昏時幾乎在歌唱！」 — Misttail Spinner"
ruRU = "«Смотри, как туман нарастает — колеса практически поют к сумеркам!» — Мисттейл Спиннер"
jaJP = "「その霧が立ち込めるのを見てごらん—夕暮れ時には車輪がほとんど歌っている！」 — ミストテイル・スピナー"
frFR = "«Regarde cette brume entrer — les roues chantent pratiquement au crépuscule !» — Misttail Spinner"
deDE = "„Schau dir an, wie der Nebel einsetzt – die Räder singen praktisch im Dämmerlicht!“ — Misttail Spinner"
plPL = "„Zobacz, jak mgła się zaciąga – koła praktycznie śpiewają o zmierzchu!” — Misttail Spinner"
ptBR = "\"Olhe aquela neblina entrando—as rodas praticamente cantam ao anoitecer!\" — Misttail Spinner"
koKR = "'안개가 드리워지는 걸 봐—바퀴들이 거의 저녁에 노래하네!' — 미스트테일 스피너"
trTR = "'O sisin nasıl ortaya çıktığına bak—tekerlekler neredeyse alacakaranlıkta şarkı söylüyor!' — Misttail Spinner"
esES = "'¡Mira cómo se levanta la neblina; las ruedas casi cantan al anochecer!' — Hilandera de Cola de Niebla"
itIT = "\"Guarda come si alza la nebbia—le ruote quasi cantano al tramonto!\" — Misttail Spinner"
ukUA = "«Ти глянь, як туман піднімається — колеса майже співають до вечора!» — Misttail Spinner"
thTH = "'ดูสิ หมอกเริ่มพัดขึ้นแล้ว ล้อพวกนี้จะหมุนจนเหมือนร้องเพลงก่อนค่ำแน่!' — Misttail Spinner"
csCZ = "'Podívej se na tu mlhu, jak se objevuje—kola prakticky zpívají za soumraku!' — Mlžní vrták"
viVN = "'Hãy nhìn đám sương ấy trỗi dậy—các bánh xe gần như hát ca khi hoàng hôn buông xuống!' — Misttail Spinner"
caES = "\"Mira com s'activa la boira—les rodes gairebé canten al vespre!\" — Misttail Spinner"
beBY = "«Глядзіце, як туман ускочыў — колы да змяркання ледзь не спяваюць!» — Misttail Spinner"
roRO = "\"Uite cum se ridică ceața aia—roțile aproape cântă până la apus!\" — Misttail Spinner"
huHU = "„Nézd, ahogy beindul a ködpermet—alkonyatra szinte énekelnek a kerekek!\" — Misttail Spinner"
arSA = "'انظر إلى بدء هذا الضباب—العجلات تكاد تغني عند الغسق!' — Misttail Spinner"

