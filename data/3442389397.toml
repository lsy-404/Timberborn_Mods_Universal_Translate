itIT = "Infondere le assi con resine naturali raddoppia la produzione di Assi Trattate: non serve energia, basta affidarsi alla natura."
ukUA = "Просочування дощок природними смолами подвоює виробництво оброблених дощок — без витрат енергії, просто як природа задумала."
