["LV.SP.NotEnoughScienceNextDay"]
raw = "<RedHighlight>You do not have enough science to pay for the next day. Adjust your projects or skip for today. Warning: pressing Esc will skip the projects for today.</RedHighlight>"
status = "normal"
enUS = "<RedHighlight>You do not have enough science to pay for the next day. Adjust your projects or skip for today. Warning: pressing Esc will skip the projects for today.</RedHighlight>"
zhCN = "<color=#FF4C4C>科学点数不足，无法支付费用，请调整项目或暂停项目执行。警告：按Esc将暂停今天的项目执行。</color>"
zhTW = "<RedHighlight>您沒有足夠的科學來支付明天的費用。請調整您的項目或今天跳過。警告：按下Esc將跳過今天的項目。</RedHighlight>"
ruRU = "<RedHighlight>У вас недостаточно науки, чтобы оплатить следующий день. Корректируйте свои проекты или пропустите на сегодня. Предупреждение: нажатие Esc пропустит проекты на сегодня.</RedHighlight>"
jaJP = "<RedHighlight>次の日のための十分な科学がありません。プロジェクトを調整するか、今日の分をスキップしてください。警告：Escを押すと、今日のプロジェクトがスキップされます。</RedHighlight>"
frFR = "<RedHighlight>Vous n'avez pas assez de science pour payer pour le lendemain. Ajustez vos projets ou laissez tomber pour aujourd'hui. Avertissement : appuyer sur Échap passera les projets pour aujourd'hui.</RedHighlight>"
deDE = "<RedHighlight>Sie haben nicht genug Wissenschaft, um für den nächsten Tag zu bezahlen. Passen Sie Ihre Projekte an oder überspringen Sie sie für heute. Warnung: Durch Drücken von Esc werden die Projekte für heute übersprungen.</RedHighlight>"
plPL = "<RedHighlight>Nie masz wystarczającej ilości nauki, aby zapłacić za następny dzień. Dostosuj swoje projekty lub przełóż na dzisiaj. Ostrzeżenie: naciśnięcie klawisza Esc pominie projekty na dzisiaj.</RedHighlight>"
ptBR = "<RedHighlight>Você não tem ciência suficiente para pagar pelo dia seguinte. Ajuste seus projetos ou pule para hoje. Aviso: pressionar Esc pulará os projetos para hoje.</RedHighlight>"
koKR = "<RedHighlight>다음 날을 위해 지불할 충분한 과학이 없습니다. 프로젝트를 조정하거나 오늘은 건너뛰십시오. 경고: Esc 키를 누르면 오늘 프로젝트가 건너뛰어집니다.</RedHighlight>"
trTR = "<RedHighlight>Bir sonraki gün için yeterli bilim yok. Projelerinizi ayarlayın veya bugün için atlayın. Uyarı: Esc tuşuna basmak, projeleri bugün için atlayacaktır.</RedHighlight>"
esES = "<RedHighlight>No tienes suficiente ciencia para pagar el siguiente día. Ajusta tus proyectos o sáltate el día de hoy. Advertencia: pulsar Esc omitirá los proyectos de hoy.</RedHighlight>"
itIT = "<RedHighlight>Non hai abbastanza scienza per pagare il giorno successivo. Modifica i tuoi progetti oppure salta per oggi. Attenzione: premere Esc salterà i progetti per oggi.</RedHighlight>"
ukUA = "<RedHighlight>У вас недостатньо науки, щоб оплатити наступний день. Змініть свої проєкти або пропустіть сьогоднішній день. Попередження: натискання Esc пропустить проєкти на сьогодні.</RedHighlight>"
thTH = "<RedHighlight>คุณมีวิทยาศาสตร์ไม่เพียงพอสำหรับการจ่ายในวันถัดไป ปรับโครงการของคุณ หรือข้ามไปในวันนี้ คำเตือน: การกด Esc จะข้ามโครงการสำหรับวันนี้</RedHighlight>"
csCZ = "<RedHighlight>Nemáte dostatek vědy na zaplacení za následující den. Upravte své projekty nebo dnes vynechejte. Upozornění: stisknutí Esc vynechá projekty pro dnešek.</RedHighlight>"
viVN = "<RedHighlight>Bạn không có đủ khoa học để thanh toán cho ngày hôm sau. Điều chỉnh các dự án của bạn hoặc bỏ qua cho hôm nay. Cảnh báo: nhấn Esc sẽ bỏ qua các dự án cho hôm nay.</RedHighlight>"
caES = "<RedHighlight>No tens prou ciència per pagar el dia següent. Ajusta els teus projectes o omet-los per avui. Advertència: prémer Esc ometrà els projectes per avui.</RedHighlight>"
beBY = "<RedHighlight>Вам не хапае навукі, каб аплаціць наступны дзень. Змяніце свае праекты або прапусціце на сёння. Увага: націсненне Esc прапусціць праекты на сёння.</RedHighlight>"
roRO = "<RedHighlight>Nu ai suficientă știință pentru a plăti următoarea zi. Ajustează proiectele sau sari peste ziua de azi. Atenție: apăsarea tastei Esc va sări peste proiectele de azi.</RedHighlight>"
huHU = "<RedHighlight>Nincs elég tudomány a következő nap kifizetéséhez. Módosítsd a projektjeidet, vagy hagyd ki őket mára. Figyelmeztetés: az Esc billentyű megnyomása mára kihagyja a projekteket.</RedHighlight>"
arSA = "<RedHighlight>ليس لديك ما يكفي من العلم لدفع تكلفة اليوم التالي. عدّل مشاريعك أو تخطَّ لليوم الحالي. تحذير: الضغط على Esc سيتخطى المشاريع لهذا اليوم.</RedHighlight>"

