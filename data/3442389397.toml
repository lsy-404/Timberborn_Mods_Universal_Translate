["LV.SP.Welcome"]
raw = "Thank you for using Scientific Projects mod. This screen is where you can unlock and manage the projects. You can open it by clicking on the Science button on the top-left of the screen or pressing a hotkey (default: Y, you can rebind it in the Keybindings Settings)."
status = "normal"
enUS = "Thank you for using the Scientific Projects mod. This screen is where you can unlock and manage the projects. You can open it by clicking on the Science button in the top-left corner of the screen or by pressing a hotkey (default: Y, which you can rebind in the Keybindings Settings)."
zhCN = "感谢使用科学项目模组！此界面可用于解锁和管理科学项目，你可以通过点击屏幕左上角的科学点数栏或按下快捷键（默认：Y，可在按键设置中重新绑定）来打开它。"
zhTW = "感謝您使用科學專案模組。這個畫面是您可以解鎖和管理專案的地方。您可以通過點擊螢幕左上角的科學按鈕或按快捷鍵（預設：Y，您可以在按鍵設定中重新綁定）來打開它。"
ruRU = "Спасибо, что используете мод на Научные Проекты. Этот экран предназначен для разблокировки и управления проектами. Вы можете открыть его, нажав на кнопку Наука в верхнем левом углу экрана или нажав горячую клавишу (по умолчанию: Y, вы можете переназначить её в Настройках клавиш)."
jaJP = "Scientific Projectsモッドをご利用いただきありがとうございます。この画面ではプロジェクトをアンロックし、管理することができます。画面の左上にあるサイエンスボタンをクリックするか、ホットキー（デフォルト: Y、キー設定で再割り当て可能）を押すことで開くことができます。"
frFR = "Merci d'utiliser le mod Projets Scientifiques. Cet écran est l'endroit où vous pouvez débloquer et gérer les projets. Vous pouvez l'ouvrir en cliquant sur le bouton Science en haut à gauche de l'écran ou en appuyant sur une touche de raccourci (par défaut : Y, que vous pouvez réaffecter dans les paramètres de raccourcis)."
deDE = "Vielen Dank, dass Sie das Scientific Projects-Modul verwenden. Dieser Bildschirm ist der Ort, an dem Sie die Projekte freischalten und verwalten können. Sie können ihn öffnen, indem Sie auf die Wissenschafts-Schaltfläche oben links auf dem Bildschirm klicken oder eine Tastenkombination drücken (Standard: Y, Sie können sie in den Tastenbelegungs-Einstellungen neu belegen)."
plPL = "Dziękujemy za korzystanie z modyfikacji Projektów Naukowych. Ten ekran to miejsce, w którym możesz odblokować i zarządzać projektami. Możesz go otworzyć, klikając przycisk Nauka w lewym górnym rogu ekranu lub naciskając klawisz skrótu (domyślnie: Y, możesz go zmienić w Ustawieniach Przypisania Klawiszy)."
ptBR = "Obrigado por usar o mod Projetos Científicos. Esta tela é onde você pode desbloquear e gerenciar os projetos. Você pode abri-la clicando no botão Ciência no canto superior esquerdo da tela ou pressionando uma tecla de atalho (padrão: Y, você pode redefinir isso nas Configurações de Teclas)."
koKR = "과학 프로젝트 모드를 사용해 주셔서 감사합니다. 이 화면에서는 프로젝트를 잠금 해제하고 관리할 수 있습니다. 화면 왼쪽 상단에 있는 과학 버튼을 클릭하거나 단축키(기본값: Y)를 눌러 열 수 있습니다. 단축키는 키 바인딩 설정에서 재할당할 수 있습니다."
trTR = "Bilimsel Projeler modunu kullandığınız için teşekkür ederiz. Bu ekran projeleri kilidini açabileceğiniz ve yönetebileceğiniz yerdir. Ekranın sol üst köşesindeki Bilim butonuna tıklayarak ya da bir kısayol tuşuna (varsayılan: Y, tuş bağlamalarını Ayarlar menüsünde yeniden bağlayabilirsiniz) basarak açabilirsiniz."
esES = "Gracias por usar el mod Scientific Projects. Esta pantalla es donde puedes desbloquear y gestionar los proyectos. Puedes abrirla haciendo clic en el botón de Ciencia en la parte superior izquierda de la pantalla o pulsando una tecla de acceso rápido (predeterminada: Y; puedes cambiarla en los ajustes de Atajos de teclado)."
itIT = "Grazie per aver usato la mod Scientific Projects. Questa schermata ti permette di sbloccare e gestire i progetti. Puoi aprirla cliccando sul pulsante Scienza in alto a sinistra dello schermo oppure premendo un tasto rapido (predefinito: Y; puoi modificarlo nelle Impostazioni dei tasti)."
ukUA = "Дякуємо, що використовуєте мод Scientific Projects. На цьому екрані можна розблокувати та керувати проєктами. Відкрити його можна натисканням кнопки «Наука» у верхньому лівому куті екрана або гарячою клавішею (за замовчуванням: Y, її можна змінити в налаштуваннях клавіатурних комбінацій)."
thTH = "ขอบคุณที่ใช้มod Scientific Projects หน้าจอนี้คือที่ที่คุณสามารถปลดล็อกและจัดการโปรเจกต์ต่าง ๆ ได้ คุณสามารถเปิดหน้าจอนี้ได้โดยคลิกปุ่มวิทยาศาสตร์ที่มุมบนซ้ายของหน้าจอ หรือกดปุ่มลัด (ค่าเริ่มต้นคือ Y ซึ่งคุณสามารถเปลี่ยนได้ในการตั้งค่าปุ่มลัด)"
csCZ = "Děkujeme, že používáte mod Vědecké projekty. Tato obrazovka je místem, kde můžete odemykat a spravovat projekty. Můžete ji otevřít kliknutím na tlačítko Věda v levém horním rohu obrazovky nebo stisknutím zkratky (výchozí: Y, můžete ji změnit v nastavení klávesových zkratek)."
viVN = "Cảm ơn bạn đã sử dụng mod Scientific Projects. Màn hình này là nơi bạn có thể mở khóa và quản lý các dự án. Bạn có thể mở nó bằng cách nhấp vào nút Khoa học ở góc trên bên trái màn hình hoặc nhấn phím tắt (mặc định: Y, bạn có thể gán lại trong Cài đặt Phím tắt)."
caES = "Gràcies per utilitzar el mod Scientific Projects. Aquesta pantalla és on pots desbloquejar i gestionar els projectes. Pots obrir-la fent clic al botó de Ciència situat a la part superior esquerra de la pantalla o prement una tecla de drecera (per defecte: Y; pots canviar-la a la configuració de Tecles)."
beBY = "Дзякуй за выкарыстанне мода «Scientific Projects». Гэты экран дазваляе разблакіроўваць і кіраваць праектамі. Адкрыць яго можна, націснуўшы кнопку «Навука» ў левым верхнім куце экрана або націснуўшы гарачую клавішу (па змаўчанні: Y; змяніць яе можна ў наладах прывязкі клавіш)."
roRO = "Vă mulțumim că folosiți modul Scientific Projects. Acest ecran vă permite să deblocați și să gestionați proiectele. Îl puteți deschide făcând clic pe butonul Science din colțul stânga-sus al ecranului sau apăsând o tastă de acces rapid (implicit: Y; o puteți reatribui în setările Keybindings)."
huHU = "Köszönjük, hogy a Scientific Projects modot használod. Ezen a képernyőn tudod feloldani és kezelni a projekteket. Megnyithatod a Tudomány gombra kattintva a képernyő bal felső sarkában, vagy egy billentyűparanccsal (alapértelmezetten: Y, ezt a Billentyűzet beállításaiban módosíthatod)."
arSA = "شكرًا لاستخدامك مود \"المشاريع العلمية\". تتيح لك هذه الشاشة فتح المشاريع وإدارتها. يمكنك فتحها بالنقر على زر \"العلوم\" في الزاوية العلوية اليسرى من الشاشة، أو بالضغط على اختصار لوحة المفاتيح (الافتراضي: Y، ويمكنك تغييره من إعدادات اختصارات لوحة المفاتيح)."

