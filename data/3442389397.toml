["LV.SP.MoveSpeedUpgrade3Lore"]
raw = "'In this gear, I'm not just running; I'm a furry blur of pure speed!' — Swiftstream Windrunner"
status = "abandoned"
enUS = "'In this gear, I'm not just running; I'm a furry blur of pure speed!' — Swiftstream Windrunner"
zhCN = "狸体动力学的产物，让海狸快得像是毛茸茸的闪电。"
zhTW = "「在這個齒輪中，我不僅僅是在跑步；我是一道純粹速度的毛茸茸模糊影！」— 迅流風馳"
ruRU = "«В этой одежде я не просто бегу; я пушистый вихрь чистой скорости!» — Свифтстрим Виндраннер"
jaJP = "「このギアでは、私はただ走るのではない。私は純粋なスピードの毛むくじゃらのぼやけだ！」 — スウィフトストリーム・ウィンドランナー"
frFR = "\"Dans cet équipement, je ne cours pas seulement ; je suis un flou poilu de pure vitesse !\" — Swiftstream Windrunner"
deDE = "'In diesem Gang laufe ich nicht nur; ich bin ein pelziger verschwommener Fleck reiner Geschwindigkeit!' — Swiftstream Windrunner"
plPL = "'W tym sprzęcie nie tylko biegam; jestem futrzanym zamglonym strumieniem czystej prędkości!' — Swiftstream Windrunner"
ptBR = "'Com este equipamento, não estou apenas correndo; sou uma confusão peluda de pura velocidade!' — Swiftstream Windrunner"
koKR = "'이 장비를 입고 있는 나는 단순히 달리는 것이 아니라, 순수한 속도의 털북숭이 블러입니다!' — 스위프트스트림 윈드러너"
trTR = "'Bu dişliyle sadece koşmuyorum; saf hızın kürklü bir bulanıklığıyım!' — Swiftstream Windrunner"
esES = "'Con este engranaje, ¡no solo corro; soy un borrón peludo de pura velocidad!' — Swiftstream Windrunner"
itIT = "'Con questo equipaggiamento non sto solo correndo; sono un turbine peloso di pura velocità!' — Swiftstream Windrunner"
ukUA = "«У цьому спорядженні я не просто біжу, я хутряне розмиття чистої швидкості!» — Swiftstream Windrunner"
thTH = "\"ในชุดเกียร์นี้ ฉันไม่ได้แค่วิ่ง แต่ฉันคือเจ้าขนปุยที่พร่าเลือนไปด้วยความเร็วล้วนๆ!\" — Swiftstream Windrunner"
csCZ = "'V tomto vybavení se nepohybují jen tak; jsem rozmazaný chlupatý blur čisté rychlosti!' — Swiftstream Windrunner"
viVN = "'TTrong bộ đồ này, tôi không chỉ đang chạy; tôi là một vệt lông xù của tốc độ thuần khiết!' — Swiftstream Windrunner"
caES = "«Amb aquest engranatge, no només corro; sóc un borrós pelut de pura velocitat!» — Swiftstream Windrunner"
beBY = "«У гэтым рыштунку я не проста бягу — я пухнаты згустак чыстай хуткасці!» — Swiftstream Windrunner"
roRO = "„Cu această viteză, nu doar alerg; sunt o încetoșare blănoasă de viteză pură!\" — Swiftstream Windrunner"
huHU = "„Ebben a fokozatban nem csak futok; szőrös, tiszta sebességű elmosódás vagyok!\" — Swiftstream Windrunner"
arSA = "'في هذا التروس، لستُ أركض فحسب؛ أنا بقعة من السرعة الخالصة المكسوة بالفراء!' — سويفتستريم ويندرانر"

