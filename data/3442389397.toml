["LV.SP.EmergencyDrill1Lore"]
raw = "A curious beaver's nose for damp earth led to this shallow water pocket-quick to tap, lifesaving in a pinch."
status = "abandoned"
enUS = "A curious beaver's nose for damp earth led to this shallow water pocket—quick to tap, lifesaving in a pinch."
zhCN = "某只海狸敏锐的鼻子发现了这个浅层水源——危急时刻能救命。"
zhTW = "一隻好奇的海狸對潮濕土壤的嗅覺引導它發現了這個淺水坑——迅速可取，在緊急情況下可以救命。"
ruRU = "Нос любопытного бобра, чующий влажную землю, привел к этому мелкому карману воды — легко доступному, спасительному в трудную минуту."
jaJP = "湿った土を求める好奇心旺盛なビーバーの鼻が、すぐに掘れるこの浅い水のポケットに導いた—ピンチのときに命を救う。"
frFR = "Le nez d'un castor curieux pour la terre humide a conduit à cette poche d'eau peu profonde - rapide à en profiter, essentielle en cas de besoin."
deDE = "Eine neugierige Nase eines Bibers für feuchte Erde führte zu dieser flachen Wasserstelle - schnell anzapfbar, lebensrettend in der Not."
plPL = "Czujny nos bobra do wilgotnej ziemi doprowadził do tej płytkiej kieszeni wodnej - łatwej do zdobycia, ratującej życie w kryzysowej sytuacji."
ptBR = "O nariz curioso de um castor em busca de terra úmida levou a esta poça de água rasa - fácil de acessar, salvadora em um aperto."
koKR = "호기심 많은 비버의 촉수는 축축한 땅으로 이어졌고, 이를 통해 빠르게 접근할 수 있는 이 얕은 물 웅덩이를 발견하게 되었으며, 위급할 때 생명을 구하는 역할을 합니다."
trTR = "Meraklı bir kunduzun nemli toprağa olan burunları, bu sığ su cepleriyle buluşmasına yol açtı - hızlıca erişilebilen, zor zamanlarda hayat kurtaran bir kaynak."
esES = "Un curioso olfato de castor para la tierra húmeda llevó a este pequeño depósito de agua: fácil de aprovechar y salvavidas en caso de apuro."
itIT = "Il fiuto di un castoro curioso per la terra umida ha portato a questa piccola pozza d'acqua: rapida da attingere e salvavita in caso di necessità."
ukUA = "Цікавий нюх бобра на вологу землю привів до цієї неглибокої водойми: її легко відкрити й вона рятує в скрутну мить."
thTH = "ปลายจมูกที่ไวต่อดินชื้นของบีเวอร์ผู้ช่างสงสัยนำไปสู่แอ่งน้ำตื้นแห่งนี้ เข้าถึงได้รวดเร็ว และช่วยชีวิตได้ในยามคับขัน"
csCZ = "Nose zajímavého bobra pro vlhkou půdu vedl k této mělké vodní kapse - snadno se kope, zachraňuje život v nouzi."
viVN = "Mũi của chú hải ly tò mò với đất ẩm đã dẫn tới vũng nước nông này—dễ lấy nước ngay, cứu mạng trong lúc nguy cấp."
caES = "Un nas curiós de castor per la terra humida va portar a aquesta petita bossa d'aigua: fàcil d'aprofitar amb un toc i salvavides en un apuro."
beBY = "Цікавы бабёр з дапамогай свайго носа для вільготнай зямлі знайшоў гэтую мелкую сажалку — яе лёгка выкарыстаць, і ў патрэбны момант яна можа выратаваць жыццё."
roRO = "O curiozitate a unui castor, un nas pentru pământul umed, a dus la această mică baltă de apă: se atinge rapid și salvează vieți când e nevoie."
huHU = "Egy kíváncsi hód nyomkodó orra a nedves földet szimatolva bukkant erre a sekély víztócsára, amelyet gyorsan elérhetünk, és szükség esetén életmentő lehet."
arSA = "فضول القندس وحاسة أنفه للتربة الرطبة قادته إلى هذه البركة الضحلة من المياه، سهلة الوصول إليها عند الحاجة، ومنقذة للحياة في اللحظات الحرجة."

