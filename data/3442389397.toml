deDE = "\"Diese Hausschuhe lassen mich fühlen, als würde ich über Wasser gleiten.\" — Whiskertail Quickpaw"
plPL = "'Te kapcie sprawiają, że czuję się jakbym unosił się na wodzie' — Whiskertail Quickpaw"
ptBR = "'Essas pantufas me fazem sentir como se estivesse deslizando sobre a água' — Whiskertail Quickpaw"
