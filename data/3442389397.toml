["LV.SP.DayCostNotice"]
raw = "Some projects cost a daily amount instead of an one-time unlock. Daily Science cost is deducted at the start of each day and the effects remain the same for the entire day. You can adjust the level of these projects (for the next day) using the slider."
status = "normal"
enUS = "Some projects cost a daily amount instead of a one-time unlock. Daily Science costs are deducted at the start of each day, and the effects remain the same for the entire day. You can adjust the level of these projects (for the next day) using the slider."
zhCN = "有些项目的费用是按日计算而不是一次性解锁。每日科学费用在每天开始时扣除，效果在整天内保持不变。您可以使用滑块调整这些项目的级别（用于第二天）。"
zhTW = "一些項目需要每日費用，而不是一次性解鎖。每日科學費用會在每天開始時扣除，並且效果會保持整天不變。您可以使用滑桿調整這些項目的級別（用於下一天）。"
ruRU = "Некоторые проекты стоят ежедневную сумму вместо одноразового открытия. Ежедневная стоимость науки вычитается в начале каждого дня, и эффекты остаются неизменными на протяжении всего дня. Вы можете регулировать уровень этих проектов (на следующий день) с помощью ползунка."
jaJP = "いくつかのプロジェクトは、一度きりのアンロックではなく、毎日一定のコストがかかります。毎日の科学費用は毎日の始めに差し引かれ、その効果は一日中同じままです。スライダーを使用して、これらのプロジェクトのレベルを（翌日用に）調整できます。"
frFR = "Certains projets coûtent un montant quotidien au lieu d'un déblocage unique. Le coût de la science quotidienne est déduit au début de chaque jour et les effets restent les mêmes pendant toute la journée. Vous pouvez ajuster le niveau de ces projets (pour le lendemain) à l'aide du curseur."
deDE = "Einige Projekte kosten einen täglichen Betrag anstatt einer einmaligen Freischaltung. Die täglichen Wissenschaftskosten werden zu Beginn eines jeden Tages abgezogen und die Auswirkungen bleiben den ganzen Tag über gleich. Sie können den Level dieser Projekte (für den nächsten Tag) mit dem Regler anpassen."
plPL = "Niektóre projekty kosztują dzienną kwotę zamiast jednorazowego odblokowania. Codzienny koszt nauki jest odciągany na początku każdego dnia, a efekty utrzymują się przez cały dzień. Możesz dostosować poziom tych projektów (na następny dzień) za pomocą suwaka."
ptBR = "Alguns projetos custam um valor diário em vez de um desbloqueio único. O custo da Ciência Diária é deduzido no início de cada dia e os efeitos permanecem os mesmos durante todo o dia. Você pode ajustar o nível desses projetos (para o dia seguinte) usando o controle deslizante."
koKR = "일부 프로젝트는 일회성 해제가 아닌 매일 금액이 필요합니다. 매일 과학 비용은 매일 시작 시 차감되며, 효과는 하루 종일 동일하게 유지됩니다. 다음 날에 이러한 프로젝트의 수준을 슬라이더를 사용하여 조정할 수 있습니다."
trTR = "Bazı projelerin bir kerelik kilidi açma yerine günlük bir maliyeti vardır. Günlük Bilim maliyeti her günün başında düşülür ve etkileri tüm gün için aynı kalır. Bu projelerin seviyesini (ertesi gün için) kaydırıcıyı kullanarak ayarlayabilirsiniz."
esES = "Algunos proyectos cuestan una cantidad diaria en lugar de un desbloqueo único. El costo diario de Ciencia se descuenta al inicio de cada día, y los efectos se mantienen iguales durante todo el día. Puedes ajustar el nivel de estos proyectos (para el día siguiente) con el control deslizante."
itIT = "Alcuni progetti costano una quantità giornaliera invece di uno sblocco una tantum. Il costo in Scienza giornaliero viene detratto all'inizio di ogni giorno e gli effetti rimangono invariati per tutta la giornata. Puoi regolare il livello di questi progetti (per il giorno successivo) usando il cursore."
ukUA = "Деякі проєкти коштують щоденну суму замість одноразового розблокування. Щоденна вартість науки списується на початку кожного дня, а ефекти зберігаються протягом усього дня. Рівень цих проєктів (на наступний день) можна змінити за допомогою повзунка."
thTH = "บางโครงการมีค่าใช้จ่ายเป็นรายวันแทนการปลดล็อกครั้งเดียว ค่าใช้จ่ายด้านวิทยาศาสตร์รายวันจะถูกหักตอนเริ่มต้นของแต่ละวัน และผลของโครงการจะคงเดิมตลอดทั้งวัน คุณสามารถปรับระดับของโครงการเหล่านี้ (สำหรับวันถัดไป) ได้โดยใช้ตัวเลื่อน"
csCZ = "Některé projekty mají denní náklady místo jednorázového odemknutí. Denní náklady na vědu se odečítají na začátku každého dne a účinky zůstávají během celého dne nezměněny. Můžete upravit úroveň těchto projektů (na následující den) pomocí posuvníku."
viVN = "Một số dự án đòi chi phí hàng ngày thay vì mở khóa một lần. Chi phí Khoa học hàng ngày được trừ vào đầu mỗi ngày và các hiệu ứng vẫn giữ nguyên trong suốt cả ngày. Bạn có thể điều chỉnh mức độ của các dự án này (cho ngày tiếp theo) bằng thanh trượt."
caES = "Alguns projectes tenen un cost diari en lloc d'un desbloqueig únic. El cost diari de Ciència es dedueix a l'inici de cada dia i els efectes es mantenen iguals durant tot el dia. Pots ajustar el nivell d'aquests projectes (per al dia següent) amb el control lliscant."
beBY = "Некаторыя праекты каштуюць штодзённую суму замест аднаразовага адкрыцця. Кошт штодзённай навукі спісваецца на пачатку кожнага дня, і эфекты застаюцца нязменнымі на працягу ўсяго дня. Вы можаце наладзіць узровень гэтых праектаў (на наступны дзень) з дапамогай паўзунка."
roRO = "Unele proiecte costă o sumă zilnică în loc de o deblocare unică. Costul zilnic de Știință este dedus la începutul fiecărei zile, iar efectele rămân aceleași pe parcursul întregii zile. Puteți ajusta nivelul acestor proiecte (pentru ziua următoare) folosind glisorul."
huHU = "Néhány projekt egyszeri feloldás helyett napi költséget igényel. A napi tudományköltség minden nap elején levonásra kerül, a hatások pedig egész napon át ugyanazok maradnak. Ezeknek a projekteknek a szintjét (a következő napra) a csúszka segítségével lehet módosítani."
arSA = "بعض المشاريع تكلّف مبلغًا يوميًا بدلًا من فتح لمرة واحدة. يُخصم تكلفة العلوم اليومية في بداية كل يوم، وتبقى التأثيرات كما هي طوال اليوم. يمكنك ضبط مستوى هذه المشاريع (لليوم التالي) باستخدام شريط التمرير."

