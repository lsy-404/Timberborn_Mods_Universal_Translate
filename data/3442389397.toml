esES = "El definitivo salvavidas para tu espalda, que permite a los castores transportar troncos sin tambalearse como tortugas sobrecargadas."
itIT = "L'ultimo salvaschiena, che permette ai castori di trasportare tronchi senza arrancare come tartarughe sovraccariche."
ukUA = "Найкращий порятунок для спини: бобри переносять колоди, не точачись, наче перевантажені черепахи."
thTH = "ตัวช่วยประหยัดหลังที่ดีที่สุด ช่วยให้บีเวอร์ขนท่อนไม้ได้โดยไม่ต้องเดินโยกเยกเหมือนเต่าที่แบกของหนักเกินไป"
csCZ = "Nejlepší pomocník pro záda, který umožňuje bobrům vozit klády, aniž by se houpali jako přetížené želvy."
viVN = "Cứu lưng tối thượng, cho phép hải ly kéo gỗ mà không còn phải đi lom khom như rùa mang quá tải."
caES = "L'estalviador d'esquena definitiu, que permet als castors transportar troncs sense caminar com tortugues sobrecarregades."
beBY = "Найлепшы srowaser для спiny: цялежкі дазваляюць бобрам вазіць бервенні, не перавальваючыся, як перагружаныя чарапахі."
roRO = "Cel mai bun mod de protecție a spatelui, care le permite castorilor să transporte buștenii fără să se clatine ca țestoasele supraîncărcate."
huHU = "A végső gerincvédő, amely lehetővé teszi, hogy a hódok ne totyogjanak túlterhelt teknősökként, miközben rönköket cipelnek."
