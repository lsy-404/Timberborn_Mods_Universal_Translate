["LV.SP.WorkEffUpgrade1Lore"]
raw = "After digging up hooman tool plans, beavers craft sharper blades with old-world tricks, boosting efficiency."
status = "abandoned"
enUS = "After uncovering human tool plans, beavers create sharper blades using old-world techniques, enhancing efficiency."
zhCN = "海狸们挖掘出了旧世界的工艺，打造出更锋利的工具。"
zhTW = "在挖掘人類工具計劃後，海狸利用古老技巧製作更鋒利的刀片，提高效率。"
ruRU = "После раскопок планов инструментов людей бобры создают более острые лезвия с помощью старинных приемов, увеличивая эффективность."
jaJP = "ヒューマンツールの計画を掘り起こした後、ビーバーたちは古代のコツを使って鋭い刃を作り、効率を高めます。"
frFR = "Après avoir déterré des plans d'outils humains, les castors fabriquent des lames plus tranchantes avec des astuces d'antan, améliorant leur efficacité."
deDE = "Nachdem sie die Pläne für menschliche Werkzeuge ausgegraben haben, stellen Biber mit altmodischen Tricks schärfere Klingen her, was die Effizienz steigert."
plPL = "Po wykopaniu planów narzędzi dla ludzi, bobry tworzą ostrzejsze ostrza za pomocą starych sztuczek, zwiększając wydajność."
ptBR = "Após desenterrar planos de ferramentas humanas, os castores fabricam lâminas mais afiadas com truques do velho mundo, aumentando a eficiência."
koKR = "인간 도구 계획을 발굴한 후, 비버들은 구세대의 기술로 더 날카로운 칼날을 제작하여 효율성을 높입니다."
trTR = "İnsan alet planlarını kazdıktan sonra, kunduzlar eski dünya hileleriyle daha keskin bıçaklar yapar, verimliliği artırır."
esES = "Tras desenterrar planos de herramientas de los humanos, los castores fabrican cuchillas más afiladas con trucos del mundo antiguo, lo que aumenta la eficiencia."
itIT = "Dopo aver riportato alla luce i progetti degli attrezzi degli umani, i castori forgiano lame più affilate con antiche tecniche del vecchio mondo, aumentando l'efficienza."
ukUA = "Після розкопування креслень людських інструментів бобри виготовляють гостріші леза зі стародавніми прийомами, що підвищує ефективність."
thTH = "หลังจากขุดพบแผนผังเครื่องมือของมนุษย์ บีเวอร์จึงประดิษฐ์ใบมีดที่คมขึ้นด้วยเทคนิคจากโลกเก่า ช่วยเพิ่มประสิทธิภาพการทำงาน"
csCZ = "Po vykopání plánů nástrojů pro lidi bobři vyrábějí ostřejší čepele pomocí triků ze starého světa, čímž zvyšují efektivitu."
viVN = "Sau khi đào lên bản thiết kế công cụ của loài người, những chú hải ly chế tác lưỡi dao sắc hơn với các mánh của thế giới cổ, tăng hiệu quả."
caES = "Després de desenterrar els plànols d'eines humanes, els castors forgen fulles més esmolades amb trucs de l'antic món, cosa que millora l'eficiència."
beBY = "Пасля выкопвання чалавечых інструментальных планаў бабры вырабляюць завастрэйшыя лязы са старымі прыёмамі, што павышае эфектыўнасць."
roRO = "După ce au scos la iveală planurile unor unelte ale oamenilor, castorii făuresc lame mai ascuțite folosind trucuri din lumea veche, ceea ce sporește eficiența."
huHU = "Miután előkerültek az emberi szerszámtervek, a hódok régi világbeli fortélyokkal élesebb pengéket készítenek, ezzel növelve a hatékonyságot."
arSA = "بعد التنقيب عن مخططات أدوات البشر، يصنع القنادس شفرات أحد باستخدام حيل من العالم القديم، مما يرفع الكفاءة."

