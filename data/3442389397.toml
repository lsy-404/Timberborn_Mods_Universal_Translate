["LV.SP.EmergencyDrill3Lore"]
raw = "Legend says old Gnawtooth foresaw this deepest well - our last hope when the skies turn cruel."
status = "abandoned"
enUS = "Legend says old Gnawtooth foresaw this deepest well - our last hope when the skies turn cruel."
zhCN = "据说海狸长老预见了这口深井……这是灾难来临时的最后希望。"
zhTW = "傳說古老的咬齒者預見了這口最深的井——我們在天空變得殘酷時的最後希望。"
ruRU = "Легенда гласит, что старый Гнусо-зуб предвидел этот глубокий колодец - нашу последнюю надежду, когда небеса станут жестокими."
jaJP = "伝説によれば、古いガーノスはこの最深の井戸を予見していました - 空が厳しくなったときの私たちの最後の希望です。"
frFR = "La légende dit que le vieux Gnawtooth prévit ce puits profond - notre dernier espoir lorsque les cieux deviennent cruels."
deDE = "Die Legende besagt, dass der alte Gnawtooth diesen tiefsten Brunnen voraussah - unsere letzte Hoffnung, wenn die Himmel grausam werden."
plPL = "Legenda głosi, że stary Gnawtooth przewidział tę najgłębszą studnię - naszą ostatnią nadzieję, gdy niebo stanie się okrutne."
ptBR = "A lenda diz que o velho Gnawtooth previu este poço profundo - nossa última esperança quando os céus se tornarem cruéis."
koKR = "전설에 따르면, 오래된 이빨Gnawtooth가 이 가장 깊은 우물을 예견했으며 - 하늘이 잔인해질 때 우리의 마지막 희망입니다."
trTR = "Efsaneye göre eski Dişlek, bu en derin kuyuyu - gökyüzü zalimleştiğinde son umudumuzu - önceden görmüştü."
esES = "La leyenda dice que el viejo Mordedor previó este pozo más profundo, nuestra última esperanza cuando los cielos se vuelvan crueles."
itIT = "La leggenda narra che il vecchio Dentirosi avesse previsto questo pozzo profondissimo: la nostra ultima speranza quando i cieli diventeranno crudeli."
ukUA = "Легенда каже, що старий Гризун передбачив цю найглибшу свердловину — нашу останню надію, коли небо стане жорстоким."
thTH = "ตำนานเล่าว่า กนอว์ทูธผู้เฒ่าได้ทำนายบ่อน้ำลึกที่สุดนี้ไว้ ซึ่งเป็นความหวังสุดท้ายของเรายามที่ท้องฟ้าแปรเปลี่ยนเป็นโหดร้าย"
csCZ = "Legenda praví, že starý Gnawtooth předpověděl tento nejhlubší vrt - naši poslední naději, když se nebe stane krutým."
viVN = "Huyền thoại nói rằng Gnawtooth cổ xưa đã dự đoán giếng sâu nhất này - hy vọng cuối cùng của chúng ta khi bầu trời trở nên tàn ác."
caES = "La llegenda diu que el vell Gnawtooth va preveure aquest pou més profund: la nostra última esperança quan els cels es tornin cruels."
beBY = "Легенда кажа, што стары Грызун прадбачыў гэтую найглыбейшую свідравіну — нашу апошнюю надзею, калі нябёсы стануць жорсткімі."
roRO = "Legenda spune că bătrânul Dințișor a prevăzut acest puț cel mai adânc - ultima noastră speranță când cerurile devin nemiloase."
huHU = "A legenda szerint az öreg Rágófog előre látta ezt a legmélyebb kutat, az utolsó reményt, amikor az égbolt kegyetlenné válik."
arSA = "تقول الأسطورة إن \"غناوتوث\" العجوز تنبأ بهذه البئر العميقة، أملنا الأخير عندما تقسو السماء."

