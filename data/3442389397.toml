["LV.SP.WorkEffUpgrade2Lore"]
raw = "'Rigged a water-powered sharpener-keeps our tools gnaw-ready, speeds up every job over time!' — Chiseljaw Timberchew"
status = "abandoned"
enUS = "\"Rigged a water-powered sharpener - keeps our tools ready to gnaw, speeds up every job over time!\" — Chiseljaw Timberchew"
zhCN = "水力打磨装置，用以保持工具锋利，长期提升工作效率。"
zhTW = "「改裝了一個水力驅動的磨刀器—讓我們的工具隨時能用，隨著時間推進提升每項工作的效率！」— 鑿牙木齧"
ruRU = "«Сделал точилку на водной тяге — наши инструменты всегда готовы к работе, со временем ускоряет любую задачу!» — Чизельджо Тимерчоуд"
jaJP = "「水力駆動の鉋を仕掛けて-私たちの道具を常に準備万端にし、時間が経つにつれてすべての仕事を早める！」 — チゼルジョー・ティンバーチュー"
frFR = "'A monté un taille-crayon à eau - garde nos outils prêts à ronger, accélère chaque travail avec le temps !' — Chiseljaw Timberchew"
deDE = "'Sie haben einen wasserbetriebenen Schärfer gebaut - hält unsere Werkzeuge bereit, beschleunigt jede Aufgabe im Laufe der Zeit!' — Chiseljaw Timberchew"
plPL = "\"Podrasowałem węzeł wodny do ostrzenia - utrzymuje nasze narzędzia gotowe do pracy, przyspiesza każdą robotę z czasem!\" — Chiseljaw Timberchew"
ptBR = "'Inventei um afiador movido a água - mantém nossas ferramentas prontas para mastigar, acelera cada trabalho ao longo do tempo!' — Chiseljaw Timberchew"
koKR = "'물력으로 작동하는 연마기를 조작했습니다 - 우리의 도구를 항상 날카롭게 유지하고 시간이 지남에 따라 모든 작업을 빠르게 합니다!' — 칼날턱 나무씹기"
trTR = "'Su gücüyle çalışan bir kesici düzenek yaptım - aletlerimizi her zaman tıraş hazır tutuyor, zamanla her işi hızlandırıyor!' — Chiseljaw Timberchew"
esES = "«Monté un afilador movido por agua: mantiene nuestras herramientas listas para roer y acelera cada trabajo con el tiempo.» — Chiseljaw Timberchew"
itIT = "\"Ho installato una affilatrice ad acqua: tiene i nostri attrezzi pronti a rosicchiare e velocizza ogni lavoro col passare del tempo!\" — Chiseljaw Timberchew"
ukUA = "'Змайстрував водяне точило: наші інструменти завжди готові до гризіння, а кожна робота з часом виконується швидше!' — Chiseljaw Timberchew"
thTH = "\"ติดตั้งที่ลับคมขับเคลื่อนด้วยน้ำไว้แล้ว ทำให้เครื่องมือของเราพร้อมกัดไม้เสมอ และงานทุกอย่างก็เร็วขึ้นเรื่อยๆ!\" — ชิเซลจอว์ ทิมเบอร์เชิว"
csCZ = "'Sestavil vodní brusku – naše nástroje jsou připravené k obrušování, zrychluje každou práci v průběhu času!' — Chiseljaw Timberchew"
viVN = "'Lắp đặt một máy mài nước — giữ dụng cụ của chúng ta luôn sẵn sàng để gặm, theo thời gian đẩy nhanh mọi công việc!' — Chiseljaw Timberchew"
caES = "\"Hem muntat una afiladora moguda per aigua: les nostres eines es mantenen a punt per rosegar, i cada feina s'accelera amb el temps!\" — Chiseljaw Timberchew"
beBY = "'Наладзіў вадзяны завостраючы станок: інструменты заўсёды гатовыя да грызення, а кожная праца з часам ідзе хутчэй!' — Chiseljaw Timberchew"
roRO = "'Am montat un ascuțitor acționat de apă, care ține uneltele noastre gata de rozat și accelerează orice muncă în timp!' — Chiseljaw Timberchew"
huHU = "'Vízhajtású köszörűt eszkábáltam össze – a szerszámaink mindig rágásra készek, és minden munka idővel gyorsabb lesz!' — Chiseljaw Timberchew"
arSA = "'ركّبتُ مشحذًا يعمل بقوة الماء، يُبقي أدواتنا جاهزة للقضم، ويُسرّع كل مهمة مع مرور الوقت!' — Chiseljaw Timberchew"

