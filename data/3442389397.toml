zhCN = "轻盈简便的拖鞋，仿佛是在水面上滑行。"
zhTW = "「這雙拖鞋讓我感覺像是在水面上滑行。」— 威斯克泰爾·快爪"
ruRU = "«Эти тапочки заставляют меня чувствовать себя так, будто я скольжу по воде» — Уиски Тейл Квикпоу."
jaJP = "「このスリッパを履くと、水の上を滑っているような気分になります」 — ウィスカーテイル・クイックポー"
