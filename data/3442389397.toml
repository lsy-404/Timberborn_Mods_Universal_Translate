["LV.SP.MoveSpeedUpgrade2Lore"]
raw = "Tough as beaver teeth, these boots turn rugged paths into smooth trails for swift travel."
status = "abandoned"
enUS = "Tough as beaver teeth, these boots turn rugged paths into smooth trails for swift travel."
zhCN = "靴面如牙齿般坚固，崎岖小路也会变成平滑通道。"
zhTW = "像海狸牙齒一樣堅韌，這些靴子將崎嶇的小路變成平坦的步道，讓旅行變得迅速。"
ruRU = "Крепкие, как зубы бобра, эти ботинки превращают грубые тропы в гладкие дорожки для быстрого передвижения."
jaJP = "ビーバーの歯のように頑丈なこのブーツは、険しい道をスムーズな道に変えて、素早い移動を可能にします。"
frFR = "Aussi solides que des dents de castor, ces bottes transforment les chemins rugueux en sentiers lisses pour un voyage rapide."
deDE = "Hart wie Biberzähne verwandeln diese Stiefel raue Wege in sanfte Pfade für schnelles Reisen."
plPL = "Twarde jak zęby bobra, te buty przemieniają trudne szlaki w gładkie ścieżki dla szybkiej podróży."
ptBR = "Duras como os dentes de castor, essas botas transformam caminhos acidentados em trilhas suaves para uma viagem rápida."
koKR = "비버의 이처럼 단단한 이 부츠는 험난한 길을 부드러운 길로 바꿔 빠른 이동을 가능하게 합니다."
trTR = "Kirpi dişleri kadar sert, bu botlar engebeli yolları hızlı bir yolculuk için düz parkurlara dönüştürür."
esES = "Tan resistentes como los dientes de un castor, estas botas convierten senderos accidentados en caminos lisos para viajar a gran velocidad."
itIT = "Robusti come i denti di castoro, questi stivali trasformano sentieri accidentati in percorsi lisci per spostarsi rapidamente."
ukUA = "Міцні, як бобрині зуби, ці черевики перетворюють нерівні стежки на гладкі доріжки для швидкої подорожі."
thTH = "แข็งแกร่งดั่งฟันบีเวอร์ รองเท้าคู่นี้เปลี่ยนเส้นทางขรุขระให้กลายเป็นทางเรียบสำหรับการเดินทางที่รวดเร็ว"
csCZ = "Tvrdé jako bobří zuby, tyto boty promění drsné cesty na hladké stezky pro rychlou cestu."
viVN = "Cứng như răng hải ly, đôi ủng này biến những con đường gồ ghề thành những đường mòn trơn tru để di chuyển nhanh chóng."
caES = "Tan resistents com les dents d'un castor, aquestes botes converteixen els camins accidentats en senders llisos per a desplaçar-se ràpidament."
beBY = "Такія ж моцныя, як бабровыя зубы, гэтыя боты ператвараюць няроўныя сцежкі ў гладкія дарожкі для хуткага перасоўвання."
roRO = "Rezistente ca dinții de castor, aceste cizme transformă drumurile accidentate în cărări netede pentru deplasări rapide."
huHU = "Ezek a csizmák olyan szívósak, mint a hódfogak, és a göröngyös utakat is sima ösvénnyé varázsolják a gyors utazáshoz."
arSA = "هذه الأحذية صلبة كأسنان القندس، تحوّل المسارات الوعرة إلى دروب ناعمة تتيح تنقلاً سريعاً."

