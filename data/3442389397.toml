["LV.SP.EmergenciesGroupDesc"]
raw = "In case of peril, press these big yellow buttons. But you get only one shot."
status = "normal"
enUS = "In case of danger, press these big yellow buttons. But you only get one chance."
zhCN = "只能使用一次的紧急科学项目。"
zhTW = "在危險時，按下這些大黃色按鈕。但你只有一次機會。"
ruRU = "В случае опасности нажмите на эти большие желтые кнопки. Но у вас есть только один шанс."
jaJP = "危険な場合は、これらの大きな黄色のボタンを押してください。しかし、あなたには一度きりのチャンスしかありません。"
frFR = "En cas de danger, appuyez sur ces gros boutons jaunes. Mais vous n'avez qu'une seule chance."
deDE = "Im Falle einer Gefahr drücken Sie diese großen gelben Tasten. Aber Sie haben nur einen Versuch."
plPL = "W przypadku niebezpieczeństwa naciśnij te duże żółte przyciski. Masz tylko jedną szansę."
ptBR = "Em caso de perigo, pressione estes grandes botões amarelos. Mas você só tem uma chance."
koKR = "위험이 닥치면 이 큰 노란 버튼을 눌러주세요. 하지만 기회는 한 번뿐입니다."
trTR = "Tehlike anında, bu büyük sarı butonlara basın. Ancak sadece bir hakkınız var."
esES = "En caso de peligro, pulsa estos grandes botones amarillos. Pero solo tienes una oportunidad."
itIT = "In caso di pericolo, premi questi grandi pulsanti gialli. Ma hai a disposizione un solo tentativo."
ukUA = "У разі небезпеки натискайте ці великі жовті кнопки. Але у вас лише один шанс."
thTH = "ในกรณีฉุกเฉิน ให้กดปุ่มสีเหลืองขนาดใหญ่เหล่านี้ แต่คุณมีโอกาสใช้เพียงครั้งเดียวเท่านั้น"
csCZ = "V případě nebezpečí stiskněte tato velká žlutá tlačítka. Ale máte jen jednu šanci."
viVN = "Trong trường hợp nguy hiểm, hãy nhấn các nút vàng to này. Nhưng bạn chỉ có một cơ hội duy nhất."
caES = "En cas de perill, premeu aquests grans botons grocs. Però només teniu una oportunitat."
beBY = "У разе небяспекі націсніце гэтыя вялікія жоўтыя кнопкі. Але ў вас толькі адна спроба."
roRO = "In caz de pericol, apasă aceste butoane mari galbene. Dar ai doar o singură șansă."
huHU = "Veszély esetén nyomd meg ezeket a nagy sárga gombokat. Viszont csak egyszer van lehetőséged."
arSA = "في حالة الخطر، اضغط على هذه الأزرار الصفراء الكبيرة. لكن لا تحصل إلا على محاولة واحدة فقط."

