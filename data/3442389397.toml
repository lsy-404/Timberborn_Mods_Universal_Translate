["LV.SP.EmergencyDrill2Lore"]
raw = "'We're drilling deep, but we're not drilling cheap!' — Digger McDrillface IV"
status = "abandoned"
enUS = "'We're drilling deep, but we're not drilling cheap!' — Digger McDrillface IV"
zhCN = "经过小心谨慎的搜寻，海狸们找到了第二个备用水源。"
zhTW = "「我們在深處鑽探，但我們不是在廉價鑽探！」— 鑽頭麥克·德瑞爾四世"
ruRU = "«Мы бурим глубоко, но мы не бурим дешево!» — Диггер МакДриллфейс IV"
jaJP = "「私たちは深く掘っているが、安く掘っているわけではない！」 — ディガー・マクドリルフェイス IV"
frFR = "«Nous forons profondément, mais nous ne forons pas à bas prix !» — Digger McDrillface IV"
deDE = "„Wir bohren tief, aber wir bohren nicht billig!“ — Digger McDrillface IV"
plPL = "„Wiercimy głęboko, ale nie wiercimy tanio!” — Digger McDrillface IV"
ptBR = "'Estamos perfurando fundo, mas não estamos perfurando barato!' — Digger McDrillface IV"
koKR = "'우리는 깊게 뚫고 있지만, 저렴하게 뚫지는 않는다!' — 디거 맥드릴페이스 IV"
