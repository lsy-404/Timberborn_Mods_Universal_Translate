["Barbara.FolktailsPlayground.WoodenPlayTower.Description"]
status = "normal"
raw = "Open play tower without seats. Two side wings integrate with native Platforms: build a 1×1 Platform west and east; then place paths and furniture on top."
enUS = "Open play tower without seats. Two side wings integrate with native Platforms: build a 1×1 Platform west and east; then place paths and furniture on top."
zhCN = "无座开放式游乐塔。两侧翼与原生平台兼容：在西侧和东侧各建造一个 1×1 平台，然后在上方放置道路和家具。"
zhTW = "無座位的開放式遊樂塔。兩側翼與原生平台相連：在西側和東側各建造一個 1×1 平台；接著在上方放置道路和家具。"
ruRU = "Открытая башня для игр без сидений. Два боковых крыла соединяются со стандартными платформами: постройте платформы размером 1×1 с запада и востока, затем разместите сверху дорожки и мебель."
jaJP = "座席のないオープンな遊び塔。両側のウィングは標準のプラットフォームと一体化しています。西と東に1×1のプラットフォームを建設し、その上に道や家具を配置してください。"
frFR = "Tour de jeu ouverte sans sièges. Les deux ailes latérales s’intègrent aux plateformes natives : construisez une plateforme de 1×1 à l’ouest et à l’est, puis placez des chemins et du mobilier dessus."
deDE = "Offener Spielturm ohne Sitzplätze. Die beiden Seitenflügel lassen sich mit den regulären Plattformen verbinden: Baue je eine 1×1-Plattform im Westen und Osten und platziere dann oben Wege und Möbel."
plPL = "Otwarta wieża zabawowa bez siedzeń. Dwa boczne skrzydła łączą się z podstawowymi platformami: zbuduj platformę 1×1 po stronie zachodniej i wschodniej, a następnie umieść na niej ścieżki i meble."
ptBR = "Torre de brincadeira aberta, sem assentos. As duas alas laterais se integram às plataformas nativas: construa uma plataforma de 1×1 a oeste e outra a leste; depois, coloque caminhos e móveis sobre elas."
koKR = "좌석이 없는 개방형 놀이 타워입니다. 양쪽 날개는 기본 플랫폼과 결합됩니다. 서쪽과 동쪽에 1×1 플랫폼을 건설한 다음, 위에 길과 가구를 배치하세요."
csCZ = "Otevřená hrací věž bez sedadel. Dvě boční křídla navazují na standardní plošiny: postavte plošinu o rozměrech 1×1 na západní i východní straně a poté na ni umístěte cesty a nábytek."
viVN = "Tháp vui chơi thoáng, không có ghế ngồi. Hai cánh bên kết hợp với các Sàn có sẵn: xây một Sàn 1×1 ở phía tây và phía đông; sau đó đặt đường đi và đồ nội thất lên trên."
trTR = "Oturma yeri olmayan açık oyun kulesi. İki yan kanadı yerel Platformlarla bütünleşir: batı ve doğuya 1×1 Platform inşa edin; ardından üstüne yollar ve mobilyalar yerleştirin."

