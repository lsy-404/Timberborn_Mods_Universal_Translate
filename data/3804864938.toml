["Barbara.FolktailsPlayground.WoodenPlayTower.Description"]
status = "normal"
raw = "Open play tower without seats. Two side wings integrate with native Platforms: build a 1×1 Platform west and east; then place paths and furniture on top."
enUS = "Open play tower without seats. Two side wings connect to native Platforms: build a 1×1 Platform to the west and east, then place paths and furniture on top."
zhCN = "开放式游乐塔，不设座位。两侧翼与原生平台相连：在西侧和东侧各建造一个 1×1 平台；然后在上方铺设道路并摆放家具。"
zhTW = "沒有座位的開放式遊戲塔。兩側翼與原生平台整合：在西側和東側各建造一個 1×1 平台；接著在上方放置道路和家具。"
ruRU = "Открытая игровая башня без сидений. Два боковых крыла соединяются со штатными платформами: постройте платформу размером 1×1 с запада и востока, затем разместите сверху дорожки и мебель."
jaJP = "座席のない開放型プレイタワー。両側のウィングは標準のプラットフォームと一体化します。西と東に1×1のプラットフォームを建設し、その上に道や家具を配置してください。"
frFR = "Tour de jeux ouverte sans sièges. Les deux ailes latérales s’intègrent aux plateformes natives : construisez une plateforme de 1×1 à l’ouest et à l’est, puis placez des chemins et du mobilier dessus."
deDE = "Offener Spielturm ohne Sitzplätze. Die beiden Seitenflügel lassen sich mit den nativen Plattformen verbinden: Baue westlich und östlich jeweils eine 1×1-Plattform und platziere anschließend Wege und Möbel darauf."
plPL = "Otwarta wieża do zabawy bez siedzisk. Dwa boczne skrzydła łączą się z wbudowanymi platformami: zbuduj platformę 1×1 po stronie zachodniej i wschodniej, a następnie umieść na niej ścieżki i meble."
ptBR = "Torre de brincadeira aberta, sem assentos. As duas alas laterais se integram às plataformas nativas: construa uma plataforma 1×1 a oeste e outra a leste; depois, coloque caminhos e móveis em cima."
koKR = "좌석이 없는 개방형 놀이탑입니다. 양쪽 날개는 기본 플랫폼과 연결됩니다. 서쪽과 동쪽에 1×1 플랫폼을 건설한 다음, 그 위에 길과 가구를 배치하세요."
csCZ = "Otevřená věž na hraní bez sedadel. Dvě boční křídla navazují na běžné plošiny: postavte plošinu 1×1 na západní i východní straně a poté na ni umístěte cesty a nábytek."
viVN = "Tháp vui chơi mở không có chỗ ngồi. Hai cánh bên kết hợp với Nền tảng mặc định: xây một Nền tảng 1×1 ở phía tây và phía đông; sau đó đặt đường đi và đồ nội thất lên trên."
trTR = "Oturma yerleri olmayan açık oyun kulesi. İki yan kanadı yerel Platformlarla bütünleşir: batı ve doğu taraflarına 1×1 Platform inşa edin; ardından üstlerine yollar ve mobilyalar yerleştirin."

