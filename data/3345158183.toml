["Building.HalfRoof.FlavorDescription"]
raw = "This roof doesn’t just compete-it sets the standard across your neighborhood."
status = "normal"
enUS = "This roof doesn’t just compete—it sets the standard across your neighborhood."
zhCN = "这片屋顶不仅仅是竞争——它在你的邻里树立了标准。"
zhTW = "這個屋頂不僅僅是競爭，它還在你所在的社區樹立了標準。"
ruRU = "Эта крыша не просто конкурирует — она задает стандарт в вашем районе."
jaJP = "この屋根は競争するだけでなく、あなたの近所の基準を設定します。"
frFR = "« Ce toit ne se contente pas de rivaliser - il établit la norme dans tout votre quartier. »"
deDE = "Dieses Dach konkurriert nicht nur – es setzt den Standard in deiner Nachbarschaft."
plPL = "Ten dach nie tylko konkuruje - wyznacza standard w całej okolicy."
ptBR = "Esse telhado não apenas compete - ele estabelece o padrão em toda a sua vizinhança."
koKR = "이 지붕은 단순히 경쟁하는 것이 아니라, 당신의 이웃 전반에 걸쳐 기준을 설정합니다."
csCZ = "Tato střecha se neprojevuje jen soutěživě - stanovuje standard ve vašem sousedství."
viVN = "Mái nhà này không chỉ cạnh tranh mà còn đặt chuẩn cho cả khu phố của bạn."
trTR = "Bu çatı sadece rekabet etmekle kalmaz, aynı zamanda mahalledeki standartları belirler."
esES = "Este tejado no solo compite: marca el estándar en todo tu vecindario."
itIT = "Questo tetto non si limita a competere: stabilisce lo standard in tutto il tuo quartiere."
ukUA = "Цей дах не просто конкурує — він задає стандарт для всього вашого кварталу."
thTH = "หลังคานี้ไม่ได้แค่แข่งขัน แต่ตั้งมาตรฐานให้กับทั้งย่านของคุณเลยทีเดียว"
caES = "Aquesta teulada no només competeix: marca el nivell per a tot el barri."
beBY = "Гэты дах не проста змагаецца — ён задае стандарт для ўсяго твайго суседства."
roRO = "Acest acoperiș nu doar concurează, ci stabilește standardul în tot cartierul tău."
huHU = "Ez a tető nem csupán versenyez – mércét állít fel az egész környéken."
arSA = "هذا السقف لا يكتفي بالمنافسة، بل يضع المعيار لكل ما حوله في الحي."
