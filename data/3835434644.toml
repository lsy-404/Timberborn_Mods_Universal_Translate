["Building.MWP.Pump.Flavor"]
status = "normal"
raw = "\"Finally - no beaver has to crank the pump anymore.\""
enUS = "\"Finally - no beaver has to crank the pump anymore.\""
zhCN = "\"终于——再也不用有海狸去摇水泵了。\""
zhTW = "「終於——再也不用有海狸得去搖水泵了。」"
ruRU = "«Наконец-то ни одному бобру больше не придётся крутить насос.»"
jaJP = "「やっと、もうビーバーがポンプを回さなくてもいいんだ。」"
frFR = "« Enfin, plus aucun castor n'a besoin de manœuvrer la pompe. »"
