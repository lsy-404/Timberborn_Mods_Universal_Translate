thTH = "\"ในที่สุด ไม่มีบีเวอร์ตัวไหนต้องหมุนปั๊มอีกแล้ว\""
csCZ = "\"Konečně - žádný bobr už nemusí točit klikou čerpadla.\""
viVN = "\"Cuối cùng thì cũng không còn con hải ly nào phải quay bơm nữa.\""
caES = "\"Per fi, cap castor ha de girar la bomba a mà.\""
beBY = "\"Нарэшце — ніводнаму бобру больш не трэба круціць помпу.\""
