["MWP.Flavor.Citation"]
status = "normal"
raw = "\"Water flows downhill - but drinking water must go up.\""
enUS = "\"Water flows downhill - but drinking water must go up.\""
zhCN = "\"水往低处流，但饮用水必须往高处送。\""
zhTW = "「水往低處流，但飲用水必須往高處送。」"
ruRU = "«Вода течёт вниз, но питьевая вода должна подниматься вверх.»"
jaJP = "「水は上から下へ流れる――しかし飲み水は上へ運ばなければならない。」"
frFR = "« L'eau coule vers le bas, mais l'eau potable doit monter. »"
deDE = "\"Wasser fließt bergab – doch Trinkwasser muss bergauf.\""
plPL = "\"Woda płynie w dół – ale woda pitna musi płynąć w górę.\""
ptBR = "\"A água flui morro abaixo - mas a água potável precisa subir.\""
koKR = "\"물은 아래로 흐르지만, 마실 물은 위로 올라가야 한다.\""
trTR = "\"Su yokuş aşağı akar - ama içilebilir su yukarı çıkmalıdır.\""
esES = "\"El agua fluye cuesta abajo, pero el agua potable tiene que subir.\""
itIT = "\"L'acqua scorre in discesa, ma l'acqua da bere deve salire.\""
ukUA = "\"Вода тече вниз за течією, а питна вода має підніматися вгору.\""
thTH = "\"น้ำไหลลงที่ต่ำ แต่น้ำดื่มต้องถูกสูบขึ้นที่สูง\""
csCZ = "\"Voda teče z kopce dolů – ale pitná voda musí téct nahoru.\""
viVN = "\"Nước chảy xuống dốc - nhưng nước uống thì phải đi lên.\""
caES = "\"L'aigua baixa per la pendent, però l'aigua potable ha de pujar.\""
beBY = "«Вада цячэ ўніз, але пітная вада павінна падымацца ўверх.»"
roRO = "\"Apa curge la vale, dar apa de băut trebuie să urce.\""
huHU = "\"A víz lefelé folyik – de az ivóvíznek felfelé kell mennie.\""
arSA = "\"الماء يتدفق نحو الأسفل، لكن ماء الشرب يجب أن يصعد إلى الأعلى.\""
