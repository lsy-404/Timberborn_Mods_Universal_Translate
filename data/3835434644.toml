["Building.MWP.Pump.Basic.Description"]
status = "normal"
raw = "Draws and filters drinking water using mechanical power. No workers needed."
enUS = "Draws and filters drinking water using mechanical power. No workers needed."
zhCN = "利用机械动力抽取并过滤饮用水。无需工人。"
zhTW = "利用機械動力抽取並過濾飲用水。無需工人。"
ruRU = "Качает и фильтрует питьевую воду с помощью механической энергии. Рабочие не нужны."
jaJP = "機械動力を使って飲料水をくみ上げ、ろ過します。作業員は必要ありません。"
frFR = "Puise et filtre l'eau potable à l'aide d'une puissance mécanique. Aucun travailleur n'est nécessaire."
deDE = "Entnimmt und filtert Trinkwasser mithilfe von mechanischer Kraft. Keine Arbeiter erforderlich."
plPL = "Pobiera i filtruje wodę pitną za pomocą energii mechanicznej. Nie wymaga pracowników."
ptBR = "Extrai e filtra água potável usando energia mecânica. Não precisa de trabalhadores."
koKR = "기계 동력을 사용해 식수를 끌어올리고 정화합니다. 일꾼이 필요하지 않습니다."
trTR = "Mekanik güç kullanarak içme suyu çeker ve filtreler. İşçi gerekmez."
esES = "Extrae y filtra agua potable mediante energía mecánica. No necesita trabajadores."
itIT = "Attinge e filtra l'acqua potabile utilizzando energia meccanica. Non sono necessari lavoratori."
ukUA = "Качає та фільтрує питну воду за допомогою механічної енергії. Робітники не потрібні."
thTH = "ดึงและกรองน้ำดื่มด้วยพลังงานกล ไม่ต้องใช้คนงาน"
csCZ = "Čerpá a filtruje pitnou vodu pomocí mechanické energie. Nevyžaduje žádné dělníky."
viVN = "Hút và lọc nước uống bằng năng lượng cơ học. Không cần công nhân."
caES = "Extreu i filtra aigua potable mitjançant energia mecànica. No cal cap treballador."
beBY = "Качае і фільтруе пітную ваду з дапамогай механічнай энергіі. Працаўнікі не патрэбныя."
roRO = "Extrage și filtrează apa potabilă folosind energie mecanică. Nu necesită muncitori."
huHU = "Gépi erővel szivattyúzza és szűri az ivóvizet. Nincs szükség munkásokra."
arSA = "يسحب الماء الصالح للشرب ويرشّحه باستخدام الطاقة الميكانيكية. لا يحتاج إلى عمال."

