ukUA = "Виберіть розташування для панелі опису інструменту (тієї, що посередині, коли ви будуєте). Ігровий стандарт: по центру."
thTH = "เลือกตำแหน่งสำหรับแผงคำอธิบายเครื่องมือ (แผงที่อยู่ตรงกลางเมื่อคุณกำลังสร้าง) ค่าเริ่มต้นของเกม: ตรงกลาง"
