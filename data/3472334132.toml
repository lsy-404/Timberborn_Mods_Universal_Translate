["LV.T4UI.MoveBottomRightUpDesc"]
raw = "Sometimes the bottom bar may be too long and the bottom-right elements (like a Mini Map mod) may be covered.\nThis option add some space at the bottom"
status = "normal"
enUS = "Sometimes the bottom bar may be too long, causing the bottom-right elements (like a Mini Map mod) to be covered.\nThis option adds some space at the bottom."
zhCN = "有时底部栏可能太长，导致右下角的元素（如迷你地图模组）被遮挡。\n此选项会在底部增加一些空间。"
zhTW = "有時底部工具列可能太長，導致右下角的元素（例如小地圖模組）被遮住。\n此選項會在底部增加一些空間。"
ruRU = "Иногда нижняя панель может быть слишком длинной, и её элементы в правом нижнем углу (например, мини-карта из мода) могут оказаться перекрыты.\nЭтот параметр добавляет немного места внизу."
jaJP = "下部バーが長すぎると、ミニマップMODなどの右下の要素が隠れてしまうことがあります。\nこのオプションを有効にすると、画面下部にスペースが追加されます。"
frFR = "Parfois, la barre du bas peut être trop longue et masquer les éléments en bas à droite (comme ceux du mod Mini Map).\nCette option ajoute un peu d’espace en bas."
deDE = "Manchmal ist die untere Leiste zu lang, sodass Elemente unten rechts (wie eine Minikarte aus einem Mod) verdeckt werden können.\nMit dieser Option wird unten etwas Platz geschaffen."
plPL = "Czasami dolny pasek może być zbyt długi, przez co elementy w prawym dolnym rogu (takie jak minimapa z moda) mogą być zasłonięte.\nTa opcja dodaje nieco miejsca na dole."
ptBR = "Às vezes, a barra inferior pode ficar comprida demais, e os elementos no canto inferior direito (como o minimapa de um mod) podem ficar encobertos.\nEsta opção adiciona um espaço na parte inferior."
koKR = "하단 바가 너무 길어져서 오른쪽 아래 요소(미니 맵 모드 등)가 가려질 수 있습니다.\n이 옵션을 사용하면 하단에 공간이 생깁니다."
csCZ = "Někdy může být spodní lišta příliš dlouhá a její prvky vpravo dole (například z modu Mini Map) mohou být zakryté.\nTato možnost přidá dole trochu místa."
viVN = "Đôi khi thanh dưới cùng quá dài và có thể che mất các thành phần ở góc dưới bên phải (chẳng hạn như Mini Map mod).\nTùy chọn này tạo thêm một khoảng trống ở phía dưới."
trTR = "Bazen alt çubuk fazla uzun olabilir ve sağ alttaki öğeler (Mini Harita modu gibi) kapanabilir.\nBu seçenek altta biraz boşluk açar."

["LV.T4UI.Update7_10_2"]
raw = "This update adds collapsible groups to the management panel (F1 -> F5, like Population, Workplaces, etc.). You can also enable auto-collapse in the mod settings."
status = "abandoned"
enUS = "This update adds collapsible groups to the management panel (F1 -> F5, like Population, Workplaces, etc.). You can also enable auto-collapse in the mod settings."
zhCN = "本次更新为管理面板（F1 -> F5，如人口、工作场所等）添加了可折叠分组功能。您也可以在模组设置中启用自动折叠。"
zhTW = "此更新為管理面板添加了可摺疊的群組（F1 -> F5，像是人口、工作場所等）。您也可以在模組設置中啟用自動摺疊。"
ruRU = "Этот обновление добавляет сворачиваемые группы на панель управления (F1 -> F5, такие как Население, Рабочие места и т.д.). Вы также можете включить автоматическое сворачивание в настройках мода."
jaJP = "このアップデートでは、管理パネルに折りたたみ可能なグループが追加されます（F1 -> F5、人口、職場など）。また、モッド設定で自動折りたたみを有効にすることもできます。"
frFR = "Cette mise à jour ajoute des groupes repliables au panneau de gestion (F1 -> F5, comme Population, Lieux de travail, etc.). Vous pouvez également activer le repliement automatique dans les paramètres du mod."
deDE = "Dieses Update fügt zusammenklappbare Gruppen zum Verwaltungsfeld hinzu (F1 -> F5, wie Bevölkerung, Arbeitsplätze usw.). Sie können auch die automatische Kollabierung in den Mod-Einstellungen aktivieren."
plPL = "Niniejsza aktualizacja dodaje zwijane grupy do panelu zarządzania (F1 -> F5, jak Populacja, Miejsca pracy itp.). Możesz również włączyć automatyczne zwijanie w ustawieniach moda."
ptBR = "Esta atualização adiciona grupos recolhíveis ao painel de gerenciamento (F1 -> F5, como População, Locais de Trabalho, etc.). Você também pode ativar a recolhida automática nas configurações do mod."
koKR = "이 업데이트는 관리 패널(F1 -> F5, 인구, 직장 등)에서 접을 수 있는 그룹을 추가합니다. 모드 설정에서 자동 축소를 활성화할 수도 있습니다."
csCZ = "Tato aktualizace přidává skládací skupiny do ovládacího panelu (F1 -> F5, jako Populace, Pracoviště atd.). Také můžete povolit automatické sbalování v nastavení modu."
viVN = "Bản cập nhật này thêm các nhóm có thể thu gọn vào bảng quản lý (F1 đến F5, ví dụ: Dân số, Nơi làm việc, v.v.). Bạn cũng có thể bật thu gọn tự động trong cài đặt của mod."
trTR = "Bu güncelleme, yönetim paneline (F1 -> F5, Nüfus, İş Yerleri vb. gibi) açılır gruplar ekler. Mod ayarlarında otomatik çökme seçeneğini de etkinleştirebilirsiniz."
