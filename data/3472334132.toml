["LV.T4UI.AddNegativeNeedsDesc"]
raw = "For example, showing Injury or Bee Sting chance in number instead of just low/medium/high."
status = "normal"
enUS = "For example, showing Injury or Bee Sting chance in number instead of just low/medium/high."
zhCN = "勾选后，建筑会显示负面效果的具体概率（游戏默认：否，只显示可能性大小）。"
zhTW = "例如，以數字顯示受傷或蜜蜂叮咬的機率，而不僅僅是低/中/高。"
ruRU = "Например, показывать вероятность травмы или ужаления пчелой в числовом виде вместо простого указания низкий/средний/высокий."
jaJP = "例えば、怪我や蜂刺されの確率を低/中/高ではなく数字で表示すること。"
frFR = "Par exemple, afficher le risque de blessure ou de piqûre d'abeille en chiffres au lieu de simplement faible/moyen/élevé."
deDE = "Zum Beispiel wird die Wahrscheinlichkeit von Verletzungen oder einem Bienenstich in Zahlen angezeigt, anstatt nur niedrig/mittel/hoch."
plPL = "Na przykład, pokazywanie szansy na kontuzję lub użądlenie pszczoły w liczbach zamiast po prostu niskim/średnim/wysokim."
ptBR = "Por exemplo, mostrar a chance de Lesão ou Picada de Abelha em números em vez de apenas baixo/médio/alto."
koKR = "예를 들어, 부상 또는 벌쌤 기회가 낮음/중간/높음 대신 숫자로 표시됩니다."
trTR = "Örneğin, yaralanma veya arı sokması olasılığını sadece düşük/orta/yüksek olarak belirtmek yerine sayısal olarak göstermek."
esES = "Por ejemplo, mostrar la probabilidad de Lesión o de Picadura de abeja en número en lugar de solo bajo/medio/alto."
itIT = "Ad esempio, mostrare la probabilità di Lesione o Puntura di ape in numeri invece che solo come bassa/media/alta."
ukUA = "Наприклад, відображення шансу отримання травми або укусу бджоли числом, а не лише як низький/середній/високий."
thTH = "ตัวอย่างเช่น แสดงโอกาสการบาดเจ็บหรือการถูกผึ้งต่อยเป็นตัวเลข แทนที่จะแสดงเพียงระดับต่ำ/กลาง/สูง"
csCZ = "Například zobrazit pravděpodobnost úrazu nebo bodnutí včel číslem místo pouze nízká/střední/vysoká."
viVN = "Ví dụ, hiển thị xác suất bị thương hoặc bị ong châm ở dạng số thay vì chỉ thấp/trung bình/cao."
caES = "Per exemple, mostrar la probabilitat de Lesió o Picada d'abella en nombre en lloc de només baix/mitjà/alt."
beBY = "Напрыклад, паказ шанцу траўмы або ўкусу пчалы лічбай, а не проста «нізкі/сярэдні/высокі»."
roRO = "De exemplu, afișarea șansei de Rănire sau Înțepătură de albină ca număr, în loc de doar scăzut/mediu/ridicat."
huHU = "Például a Sérülés vagy a Méhcsípés esélyének számszerű megjelenítése az alacsony/közepes/magas helyett."
arSA = "على سبيل المثال، عرض احتمال الإصابة أو لسعة النحلة كرقم بدلًا من مجرد منخفض/متوسط/مرتفع."

