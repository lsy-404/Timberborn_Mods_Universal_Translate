viVN = "Chọn vị trí cho bảng mô tả công cụ (bảng ở giữa khi bạn đang xây dựng). Mặc định của trò chơi: ở giữa."
caES = "Trieu una ubicació per al panell de descripció de l'eina (el del centre quan estàs construint). Valor predeterminat del joc: al centre."
beBY = "Выберыце месцазнаходжанне для панэлі апісання інструментаў (той, што знаходзіцца пасярэдзіне падчас будаўніцтва). Стандартнае значэнне гульні: па цэнтры."
roRO = "Alegeți o locație pentru panoul de descriere a uneltei (cel din mijloc, când construiți). Valoarea implicită a jocului: centru."
huHU = "Válassz helyet az eszközleírás panelnek (az, amelyik építés közben középen van). Játék alapértelmezése: középen."
