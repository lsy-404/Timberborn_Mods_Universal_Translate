["LV.T4UI.AutoExpandCounterDesc"]
raw = "Close all material counters (top-left corner) on start.\nAutomatically expand any closed counter when you hover over them."
status = "normal"
enUS = "Close all material counters (top-left corner) on start. Automatically expand any closed counter when you hover over them."
zhCN = "勾选后，左上角物资栏的下拉面板（物资详细数量面板）默认收回，将光标悬停在物资栏上时会自动展开，也可以点击箭头主动展开。"
zhTW = "在開始時關閉所有材料計數器（左上角）。當您將鼠標懸停在任何關閉的計數器上時，自動展開它們。"
ruRU = "Закройте все счетчики материалов (в верхнем левом углу) при запуске. Автоматически раскрывайте любой закрытый счетчик при наведении на него."
jaJP = "スタート時にすべてのマテリアルカウンター（左上隅）を閉じます。  \nそれらにカーソルを合わせると、自動的に閉じたカウンターが展開されます。"
frFR = "Fermez tous les compteurs de matériel (coin supérieur gauche) au démarrage.  \nDéveloppez automatiquement tout compteur fermé lorsque vous passez la souris dessus."
deDE = "Schließe alle Materialzähler (oben links) beim Start.  \nErweitere automatisch jeden geschlossenen Zähler, wenn du darüber fährst."
plPL = "Zamknij wszystkie liczniki materiałów (w lewym górnym rogu) na początku. Automatycznie rozwijaj wszelkie zamknięte liczniki, gdy najedziesz na nie myszką."
ptBR = "Feche todos os contadores de material (canto superior esquerdo) no início.  \nExpanda automaticamente qualquer contador fechado ao passar o mouse sobre eles."
koKR = "모든 자재 카운터(왼쪽 상단 코너)를 시작할 때 닫습니다. 마우스를 위에 올리면 닫힌 카운터가 자동으로 확장됩니다."
csCZ = "Zavřít všechny ukazatele materiálů (v levém horním rohu) na začátku.\nAutomaticky rozšířit jakýkoli zavřený ukazatel, když nad ním najedete myší."
viVN = "Đóng tất cả các bộ đếm vật liệu (góc trên bên trái) khi khởi động.\nTự động mở rộng bất kỳ bộ đếm nào đã đóng khi bạn di chuột qua chúng."
trTR = "Başlangıçta tüm malzeme sayaçlarını kapatın (sol üst köşe). Üzerine geldiğinizde kapalı her sayacı otomatik olarak açın."

