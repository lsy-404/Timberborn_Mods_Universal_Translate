["LV.T4UI.RemovePathHighlightDesc"]
raw = "Paths are no longer highlighted when you select a building. You can still see it when selecting a path"
status = "normal"
enUS = "Paths are no longer highlighted when you select a building. You can still see them when selecting a path."
zhCN = "勾选后，选中一个建筑时，不再在道路上显示路径线，但选中道路时仍会显示。"
zhTW = "當你選擇一棟建築時，路徑不再被高亮顯示。但是在選擇路徑時仍然可以看到它。"
ruRU = "Дороги больше не выделяются, когда вы выбираете здание. Вы все еще можете их видеть, выбирая путь."
jaJP = "建物を選択したときにパスがハイライト表示されなくなりました。パスを選択すると、まだ見ることができます。"
frFR = "Les chemins ne sont plus surlignés lorsque vous sélectionnez un bâtiment. Vous pouvez toujours les voir en sélectionnant un chemin."
deDE = "Wege werden nicht mehr hervorgehoben, wenn Sie ein Gebäude auswählen. Sie können sie jedoch weiterhin sehen, wenn Sie einen Weg auswählen."
plPL = "Ścieżki nie są już podświetlane, gdy wybierasz budynek. Możesz je nadal zobaczyć, gdy wybierasz ścieżkę."
ptBR = "Os caminhos não são mais realçados quando você seleciona um edifício. Você ainda pode vê-los ao selecionar um caminho."
koKR = "건물을 선택할 때 경로가 더 이상 강조 표시되지 않습니다. 경로를 선택할 때는 여전히 볼 수 있습니다."
trTR = "Yollar bir bina seçildiğinde artık vurgulanmıyor. Bir yolu seçerken yine de görebilirsiniz."
esES = "Los caminos ya no se resaltan al seleccionar un edificio. Aun así, puedes verlos al seleccionar un camino."
itIT = "I percorsi non vengono più evidenziati quando selezioni un edificio. Puoi comunque vederli quando selezioni un percorso"
ukUA = "Шляхи більше не підсвічуються, коли ви обираєте будівлю. Ви все ще можете побачити їх, коли обираєте шлях"
thTH = "ทางเดินจะไม่ถูกไฮไลต์อีกต่อไปเมื่อคุณเลือกอาคาร แต่คุณยังคงมองเห็นทางเดินได้เมื่อเลือกทางเดินนั้น"
csCZ = "Stezky již nejsou zvýrazněny, když vyberete budovu. I při výběru stezky ji stále uvidíte."
viVN = "Các đường đi sẽ không còn được làm nổi bật khi bạn chọn một tòa nhà. Bạn vẫn có thể thấy nó khi chọn một đường đi"
caES = "Els camins ja no es ressalten quan selecciones un edifici. Encara els pots veure quan selecciones un camí."
beBY = "Шляхі больш не выдзяляюцца пры выбары будынка. Вы ўсё яшчэ можаце ўбачыць іх пры выбары шляху."
roRO = "Drumurile nu mai sunt evidențiate atunci când selectezi o clădire. Le poți vedea în continuare când selectezi un drum."
huHU = "Az épületek kijelölésekor a utak már nem kerülnek kiemelésre. Úttal kijelölve továbbra is látható."
arSA = "لم تعد المسارات تُبرز عند اختيار مبنى. ما زال بإمكانك رؤيتها عند اختيار مسار."

