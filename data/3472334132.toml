ruRU = "Наведите курсор на счетчик материала, чтобы выделить все здания, содержащие этот материал. Нажатие на него позволит переключаться между этими зданиями. Удерживайте клавишу Alt (по умолчанию: Shift), чтобы переключаться между ними только в пределах выбранного района."
jaJP = "マテリアルカウンターにカーソルを合わせると、そのマテリアルを含むすべての建物が強調表示されます。クリックすると、それらの建物を循環できます。代替キー（デフォルト：Shift）を押しながら、選択している地区のみで循環します。"
frFR = "Survolez un contre-matériau pour mettre en surbrillance tous les bâtiments contenant ce matériau. Cliquer dessus fera défiler ces bâtiments. Maintenez la touche Alt (par défaut : Maj) pour faire défiler uniquement ceux de la zone sélectionnée."
deDE = "Fahre mit der Maus über einen Materialzähler, um alle Gebäude hervorzuheben, die dieses Material enthalten. Ein Klick darauf wechselt zwischen diesen Gebäuden. Halte die Alt-Taste (Standard: Shift) gedrückt, um nur in dem ausgewählten Bezirk durch sie zu wechseln."
plPL = "Najedź kursorem na licznik materiałów, aby podświetlić wszystkie budynki zawierające ten materiał. Kliknięcie spowoduje przełączenie się między tymi budynkami. Przytrzymanie klawisza Alternatywnego (domyślnie: Shift) pozwoli na przełączenie się między nimi tylko w wybranym dystrykcie."
ptBR = "Passe o mouse sobre um contador de material para destacar todos os edifícios que contêm esse material. Clicar nele irá alternar entre esses edifícios. Segurando a tecla Alternar (padrão: Shift) para alternar entre eles apenas na seleção do distrito."
koKR = "자재 카운터에 마우스를 올리면 해당 자재를 포함하고 있는 모든 건물들이 강조 표시됩니다. 클릭하면 그 건물들 사이를 순환합니다. 대체 키(기본: Shift)를 누르고 있으면 선택한 구역 내에서만 순환합니다."
trTR = "Bir malzeme sayacının üzerine gelin, o malzemeyi içeren tüm binaları vurgulayın. \nÜzerine tıklamak, bu binalar arasında döngü yapacaktır. \nSadece seçim bölgesinde döngü yapmak için Alternatif tuşuna basılı tutun (varsayılan: Shift)."
esES = "Mantenga el cursor sobre un contador de material para resaltar todos los edificios que contienen ese material.\nAl hacer clic, se recorrerán esos edificios.\nMantenga pulsada la tecla Alternar (predeterminada: Mayús) para recorrerlos solo en la selección de distrito."
itIT = "Passa il cursore su un contatore di materiale per evidenziare tutti gli edifici che contengono quel materiale.\nCliccandolo si scorre tra questi edifici.\nTenendo premuto il tasto Alternate (predefinito: Maiusc) per scorrerli, la selezione si limita solo al distretto."
ukUA = "Наведіть курсор на лічильник матеріалу, щоб підсвітити всі будівлі, які містять цей матеріал.\nНатискання на нього по черзі перемикатиме ці будівлі.\nУтримування клавіші Alternate (за замовчуванням: Shift), щоб перемикати їх лише в межах вибраного району."
thTH = "มีโอเวอร์ตัวนับวัสดุเพื่อไฮไลต์อาคารทั้งหมดที่เก็บวัสดุนั้นไว้\nคลิกเพื่อวนดูอาคารเหล่านั้นทีละหลัง\nกดปุ่มสลับ (ค่าเริ่มต้น: Shift)ค้างไว้เพื่อวนดูเฉพาะในเขตที่เลือกเท่านั้น"
csCZ = "Přejděte myší nad počítadlem materiálu, aby se zvýraznily všechny budovy, které tento materiál obsahují.\nKlepnutím na něj projdete těmito budovami.\nDržte klávesu Alternativa (výchozí: Shift), abyste prošli pouze budovami ve vybraném okrsku."
viVN = "Di chuột qua bộ đếm vật liệu để làm nổi bật tất cả các tòa nhà chứa vật liệu đó.\nNhấp vào nó sẽ lần lượt chuyển qua các tòa nhà đó.\nGiữ phím Alternate (mặc định: Shift) để lặp qua chúng chỉ khi đang chọn khu vực."
caES = "Passa el cursor sobre un comptador de material per ressaltar tots els edificis que contenen aquest material.\nFer clic hi recorrerà aquests edificis.\nMantenint premuda la tecla Alternate (per defecte: Majúscules) per recórrer-los només en el districte seleccionat."
beBY = "Навядзіце курсор на лічыльнік матэрыялу, каб падсвеціць усе будынкі, у якіх захоўваецца гэты матэрыял.\nНаціск на яго будзе перагортваць гэтыя будынкі па чарзе.\nУтрымліваючы клавішу Alternate (стандартна: Shift), каб перагортваць іх толькі ў выбраным раёне."
roRO = "Treceți cursorul peste un contor de material pentru a evidenția toate clădirile care conțin acel material.\nFăcând clic pe el, veți parcurge aceste clădiri.\nȚinând apăsată tasta Alternate (implicit: Shift), veți parcurge doar clădirile din districtul selectat."
huHU = "Vigye az egeret egy anyagszámláló fölé, hogy kiemelje az összes olyan épületet, amely az adott anyagot tartalmazza.\nKattintással ezeken az épületeken lehet körbelépkedni.\nAz Alternate billentyű (alapértelmezés: Shift) nyomva tartásával csak a kiválasztott körzetben lehet körbelépkedni ezek között."
arSA = "مرّر المؤشر فوق عدّاد مادة لتمييز جميع المباني التي تحتوي على تلك المادة.\nالنقر عليه سيتنقّل بالتناوب بين تلك المباني.\nاضغط مفتاح التبديل (الافتراضي: Shift) للتنقّل بين المباني ضمن المنطقة المحددة فقط."

