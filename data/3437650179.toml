["LV.TIMod.SwapBuildFinishedModifierDesc"]
raw = "When Dev Mode is enabled, auto finish building when placing a building while holding Ctrl would place the building normally for construction"
status = "normal"
enUS = "When Dev Mode is enabled, auto-finish building when placing a structure while holding Ctrl would place the building normally for construction."
zhCN = "勾选后，反转开发者模式下Ctrl键的功能（游戏默认：否，即按住Ctrl放置建筑时会自动完成，逆转后不按住才会自动完成）。"
zhTW = "當開啟開發模式時，按住Ctrl放置建築物時，自動完成建造的功能會正常地將建築物放置為施工。"
ruRU = "Когда режим разработчика включен, автозавершение постройки при размещении здания с зажатой кнопкой Ctrl будет осуществляться как обычно для строительства."
jaJP = "デブモードが有効になっているとき、Ctrlを押しながら建物を配置すると、自動的に建設のために通常通り建物が設置されます。"
frFR = "Lorsque le mode développeur est activé, le fait de terminer automatiquement la construction lors de la pose d'un bâtiment tout en maintenant la touche Ctrl enfoncée placerait le bâtiment normalement pour la construction."
deDE = "Wenn der Entwicklermodus aktiviert ist, würde das automatische Beenden des Bauens beim Platzieren eines Gebäudes mit gedrückter Strg-Taste das Gebäude normal zum Bau platzieren."
plPL = "Gdy tryb dewelopera jest włączony, automatyczne zakończenie budowy podczas umieszczania budynku z wciśniętym klawiszem Ctrl spowoduje normalne umieszczenie budynku do konstrukcji."
ptBR = "Quando o Modo de Desenvolvimento está ativado, finalizar automaticamente a construção ao colocar um edifício enquanto se mantém pressionada a tecla Ctrl colocaria o edifício normalmente para construção."
koKR = "개발 모드가 활성화되면, Ctrl 키를 누른 채로 건물을 배치할 때 자동으로 건물 완공이 이루어지므로 건물이 정상적으로 건설됩니다."
trTR = "Geliştirici Modu etkinleştirildiğinde, Ctrl tuşuna basılıyken bir bina yerleştirildiğinde otomatik olarak inşaatı bitirilecek bina, normal olarak inşa için yerleştirilir."
esES = "Cuando el modo de desarrollo está activado, terminar automáticamente la construcción al colocar un edificio mientras se mantiene Ctrl haría que el edificio se colocara normalmente para su construcción"
itIT = "Quando la Modalità Sviluppatore è attiva, il completamento automatico alla costruzione di un edificio, con Ctrl premuto durante il posizionamento, farebbe posizionare l'edificio normalmente per la costruzione"
ukUA = "Коли увімкнено режим розробника, автоматичне завершення будівлі під час розміщення будівлі з утриманням Ctrl розміщуватиме будівлю звичайним чином для будівництва"
thTH = "เมื่อเปิดใช้โหมดนักพัฒนา การสร้างอาคารให้เสร็จอัตโนมัติเมื่อวางอาคารขณะกดปุ่ม Ctrl ค้างไว้ จะเปลี่ยนเป็นวางอาคารตามปกติเพื่อก่อสร้าง"
csCZ = "Když je povolen režim vývoje, automaticky dokonči výstavbu, když umístíte budovu s držením klávesy Ctrl, budova bude umístěna normálně k výstavbě."
viVN = "Khi Chế độ Phát triển được bật, tự động hoàn tất việc xây dựng khi đặt một công trình trong khi giữ phím Ctrl sẽ đặt công trình theo cách thông thường để thi công."
caES = "Quan el mode de desenvolupament està activat, la funció de finalitzar automàticament la construcció en col·locar un edifici mantenint premuda la tecla Ctrl col·locaria l'edifici normalment per a la construcció"
beBY = "Калі ўключаны Рэжым распрацоўшчыка, аўтаматычнае завяršэнne будаўніцтва пры размяшчэнні будынка з утрыманнем Ctrl будзе размяшчаць будынак звычайным чынам для будаўніцтва."
roRO = "Când modul Dev este activat, funcția de finalizare automată a construcțiilor la plasarea unei clădiri ținând apăsat Ctrl ar plasa clădirea normal pentru construcție"
huHU = "Ha a Fejlesztői mód be van kapcsolva, a Ctrl lenyomása mellett épület elhelyezésekor az automatikus befejezés helyett az épület normál módon kerül elhelyezésre az építéshez."
arSA = "عند تفعيل وضع المطور، سيؤدي الإنهاء التلقائي للبناء عند وضع مبنى مع الضغط على Ctrl إلى وضع المبنى بشكل عادي لأغراض البناء."

