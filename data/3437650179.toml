["LV.TIMod.BetterResetLoadOrderDesc"]
raw = "Move to top move the mod to top but below their dependencies. Reset Load Order sorts mod by Enabling, Name then bring their dependencies right on top. Enabled mods showed first when uploading."
status = "normal"
enUS = "Move to top moves the mod to the top but below its dependencies. Reset Load Order sorts mods by Enabled, Name, then brings their dependencies right on top. Enabled mods are shown first when uploading."
zhCN = "勾选后，“重置加载顺序”会根据模组的启用状态、名称来排序，然后将依赖项排在上面。上传模组时，启用的模组会排在上面。"
zhTW = "將模組移至頂部，但在其依賴項之下。重置加載順序根據啟用狀態、名稱對模組進行排序，然後將其依賴項置於最上方。上傳時會首先顯示已啟用的模組。"
ruRU = "Переместить мод в верхнюю часть, но ниже его зависимостей. Сбросить порядок загрузки сортирует моды по включению, имени, а затем подносит их зависимости на самый верх. Включенные моды отображаются первыми при загрузке."
jaJP = "トップに移動、モッドを最上部に移動させますが、その依存関係の下に配置します。リセットロード順序は、モッドを有効化、名前で並べ替え、その上に依存関係を配置します。アップロード時には有効なモッドが最初に表示されます。"
frFR = "Déplacer vers le haut déplace le mod en haut mais en dessous de ses dépendances. Réinitialiser l'ordre de chargement trie les mods par activation, nom puis place leurs dépendances juste au-dessus. Les mods activés apparaissent en premier lors du téléchargement."
deDE = "Verschieben nach oben verschiebt das Mod nach oben, jedoch unterhalb ihrer Abhängigkeiten. Das Zurücksetzen der Lade-Reihenfolge sortiert Mods nach Aktivierung, Name und bringt ihre Abhängigkeiten direkt nach oben. Aktivierte Mods werden zuerst angezeigt, wenn sie hochgeladen werden."
plPL = "Przenieś na górę przenieś mod na górę, ale poniżej jego zależności. Resetuj kolejność ładowania sortuje mod po włączeniu, nazwie, a następnie przynosi ich zależności na samą górę. Włączone mody wyświetlają się jako pierwsze podczas przesyłania."
ptBR = "Mover para o topo move o mod para o topo, mas abaixo de suas dependências. Resetar a Ordem de Carregamento classifica o mod por Habilitação, Nome e depois coloca suas dependências logo no topo. Mods habilitados aparecem primeiro ao fazer o upload."
koKR = "상단으로 이동은 모드를 최상단으로 이동시키지만 그들의 의존성 바로 아래에 위치합니다. 로드 순서를 재설정하면 모드가 활성화, 이름별로 정렬되고 그들의 의존성이 바로 위에 오게 됩니다. 업로드 시 활성화된 모드가 먼저 표시됩니다."
trTR = "En üst sıraya taşı, modu en üst sıraya taşır ancak bağımlılıklarının altına. Yükleme sırasını sıfırlamak, modları Etkinleştirme, İsim sırasına göre sıralar ve bağımlılıklarını en üstte getirir. Yüklenirken etkinleştirilen modlar ilk olarak gösterilir."
esES = "Mover al principio: mueve el mod al principio, pero por debajo de sus dependencias. Restablecer orden de carga: ordena los mods por estado de activación y nombre, y luego coloca sus dependencias justo al principio. Al subir, los mods activados se muestran primero."
itIT = "Sposta in cima: sposta la mod in cima, ma sotto le sue dipendenze. Reimposta ordine di caricamento ordina le mod per stato di attivazione e nome, poi porta le loro dipendenze subito in cima. Le mod attive vengono mostrate per prime al caricamento."
ukUA = "Перемістити догори: переміщує мод на початок списку, але нижче за його залежності. Скинути порядок завантаження: сортує моди за станом увімкнення та назвою, а потім ставить їхні залежності прямо на початок. Увімкнені моди відображаються першими під час завантаження."
thTH = "ย้ายไปด้านบนสุด จะย้ายม็อดขึ้นไปด้านบนสุด แต่จะอยู่ต่ำกว่าม็อดที่ต้องพึ่งพา รีเซ็ตลำดับการโหลดจะจัดเรียงม็อดตามสถานะการเปิดใช้งานและชื่อ จากนั้นจะนำม็อดที่ต้องพึ่งพาขึ้นมาไว้ด้านบนสุดทันที ม็อดที่เปิดใช้งานอยู่จะแสดงก่อนเมื่อมีการอัปโหลด"
csCZ = "Přesunout nahoru přesune mod na vrchol, ale pod jeho závislosti. Obnovit pořadí načítání seřadí mod podle aktivace, názvu a poté umístí jejich závislosti na vrchol. Povolené mody se ukážou jako první při nahrávání."
viVN = "Di chuyển mod lên đầu nhưng ở dưới các phụ thuộc của chúng. Đặt lại thứ tự tải sắp xếp các mod theo trạng thái bật, Tên rồi đưa các phụ thuộc của chúng lên trên đầu. Các mod được bật sẽ hiển thị đầu tiên khi tải lên."
caES = "Mou-ho a dalt: mou el mod a dalt, però per sota de les seves dependències. Restableix l'ordre de càrrega ordena els mods per activació i nom, i després posa les seves dependències just a dalt de tot. Els mods activats es mostren primer en carregar."
beBY = "Перамясціць наверх: перамяшчае мод на верх спісу, але пад яго залежнасці. Скінуць порадак загрузкі: сартуе моды па ўключэнні, затым па назве і ставіць іх залежнасці проста ўверсе. Уключаныя моды паказваюцца першымі пры загрузцы."
roRO = "Mutați la început mută modul în partea de sus, dar sub dependențele sale. Resetează ordinea de încărcare sortează modurile după stare (activat), apoi după nume, și apoi aduce dependențele chiar în partea de sus. Modurile activate sunt afișate primele la încărcare."
huHU = "Ugrás a tetejére: a mod a tetejére kerül, de a függőségei alá. A Betöltési sorrend visszaállítása a modokat engedélyezés és név szerint rendezi, majd a függőségeiket közvetlenül a tetejére helyezi. Feltöltéskor az engedélyezett modok jelennek meg elsőként."
arSA = "نقل إلى الأعلى: ينقل المود إلى الأعلى، لكن أسفل التبعيات الخاصة به. إعادة ضبط ترتيب التحميل: يرتب المودات حسب التفعيل ثم الاسم، ثم يضع التبعيات مباشرةً في الأعلى. تظهر المودات المفعّلة أولاً عند التحميل."

