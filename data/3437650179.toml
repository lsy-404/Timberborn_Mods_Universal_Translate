["LV.TIMod.QuickQuitDesc"]
raw = "Enable quick quit when pressing [Ctrl Shift Q]. This option use Process.Kill() so no save will be made."
status = "normal"
enUS = "Enable quick quit when pressing [Ctrl Shift Q]. This option uses Process.Kill(), so no save will be made."
zhCN = "勾选后，可以通过按下快捷键（Ctrl+Shift+Q）快速退出游戏。<br>注意，此选项使用“Process.Kill()”关闭进程，因此不会自动存档。"
zhTW = "啟用在按下 [Ctrl Shift Q] 時快速退出。此選項使用 Process.Kill()，因此不會儲存任何資料。"
ruRU = "Включите быстрый выход при нажатии [Ctrl Shift Q]. Эта опция использует Process.Kill(), поэтому никаких сохранений не будет сделано."
jaJP = "[Ctrl Shift Q]を押すと素早く終了できるようにします。このオプションはProcess.Kill()を使用するため、保存は行われません。"
frFR = "Activez la fermeture rapide en appuyant sur [Ctrl Shift Q]. Cette option utilise Process.Kill(), donc aucun enregistrement ne sera effectué."
deDE = "Aktivieren Sie das schnelle Beenden beim Drücken von [Strg Umschalt Q]. Diese Option verwendet Process.Kill(), daher wird nichts gespeichert."
plPL = "Włącz szybkie wyjście po naciśnięciu [Ctrl Shift Q]. Ta opcja używa Process.Kill(), więc żadne dane nie będą zapisane."
ptBR = "Ative a saída rápida ao pressionar [Ctrl Shift Q]. Esta opção usa Process.Kill(), portanto, nenhum salvamento será feito."
koKR = "[Ctrl Shift Q]를 눌러 빠른 종료를 활성화합니다. 이 옵션은 Process.Kill()을 사용하므로 저장이 되지 않습니다."
trTR = "[Ctrl Shift Q] tuşlarına basıldığında hızlı çıkışı etkinleştir. Bu seçenek Process.Kill() kullanır, bu yüzden kayıt yapılmayacaktır."
esES = "Habilitar salida rápida al pulsar [Ctrl Shift Q]. Esta opción usa Process.Kill(), por lo que no se guardará ninguna partida."
itIT = "Abilita l'uscita rapida quando si preme [Ctrl Shift Q]. Questa opzione usa Process.Kill(), quindi non verrà effettuato alcun salvataggio."
ukUA = "Увімкнути швидкий вихід після натискання [Ctrl Shift Q]. Цей параметр використовує Process.Kill(), тому збереження не буде створено."
thTH = "เปิดใช้การออกเร็วเมื่อกด [Ctrl Shift Q] ตัวเลือกนี้ใช้ Process.Kill() จึงจะไม่มีการบันทึกเกมใดๆ"
csCZ = "Povolte rychlé ukončení stiskem [Ctrl Shift Q]. Tato možnost používá Process.Kill(), takže žádný save nebude vytvořen."
viVN = "Bật thoát nhanh khi nhấn [Ctrl Shift Q]. Tùy chọn này sẽ sử dụng Process.Kill() nên không có bản lưu nào được tạo."
caES = "Activa la sortida ràpida en prémer [Ctrl Shift Q]. Aquesta opció utilitza Process.Kill(), de manera que no es farà cap desat."
beBY = "Уключыць хуткі выхад пры націсканні [Ctrl Shift Q]. Гэты параметр выкарыстоўвае Process.Kill(), таму захаванне не будзе створана."
roRO = "Activează ieșirea rapidă când apeși [Ctrl Shift Q]. Această opțiune folosește Process.Kill(), așa că nu se va face nicio salvare."
huHU = "Gyors kilépés engedélyezése a [Ctrl Shift Q] megnyomásakor. Ez a beállítás a Process.Kill() függvényt használja, így nem készül mentés."
arSA = "تفعيل الخروج السريع عند الضغط على [Ctrl Shift Q]. يستخدم هذا الخيار Process.Kill()، لذا لن يتم حفظ أي تقدم."

