thTH = "ชั่วโมงในเกม (0-23) ที่เริ่มพักกลางวัน ค่าเริ่มต้นคือ 12 (เที่ยงวัน)"
csCZ = "Herní hodina (0-23), kdy začíná polední přestávka. Výchozí 12 (poledne)."
