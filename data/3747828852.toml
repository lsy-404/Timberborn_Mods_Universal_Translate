roRO = "Ora din joc (0-23) la care începe pauza de prânz. Implicit 12 (amiaza)."
huHU = "A játékbeli óra (0–23), amikor az ebédszünet kezdődik. Alapértelmezett érték: 12 (dél)."
arSA = "ساعة اللعبة (من 0 إلى 23) التي تبدأ عندها استراحة الغداء. القيمة الافتراضية 12 (الظهر)."

