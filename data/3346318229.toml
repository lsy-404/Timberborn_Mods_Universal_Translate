["Building.Floodgate.Flat.Description"]
raw = "Blocks water up to an adjustable height. A new more compact design to allow you to build on top of them."
status = "normal"
enUS = "Blocks water up to an adjustable height. A new, more compact design allows you to build on top of them."
zhCN = "改进的闸门，去掉了多余的顶部结构，可以在上面建造其他建筑。"
zhTW = "可調高度的水阻擋。全新的更緊湊設計，讓您可以在其上建造。"
ruRU = "Блокирует воду до регулируемой высоты. Новый более компактый дизайн, позволяющий строить поверх них."
jaJP = "調整可能な高さまで水をブロックします。新しい、よりコンパクトなデザインで、上に建設することができます。"
frFR = "Bloque l'eau jusqu'à une hauteur réglable. Un nouveau design plus compact pour vous permettre de construire par-dessus."
deDE = "Blockiert Wasser bis zu einer verstellbaren Höhe. Ein neues, kompakteres Design, das es ermöglicht, darauf zu bauen."
plPL = "Blokuje wodę do regulowanej wysokości. Nowy, bardziej kompaktowy design umożliwia budowanie na ich szczycie."
ptBR = "Bloqueia a água até uma altura ajustável. Um novo design mais compacto para permitir que você construa em cima deles."
koKR = "조절 가능한 높이까지 물을 차단합니다. 그 위에 건설할 수 있도록 하려는 새로운 더 컴팩트한 디자인입니다."
trTR = "Su seviyesini ayarlanabilir bir yüksekliğe kadar engeller. Üstüne inşa etmenizi sağlayacak daha kompakt bir tasarım."
esES = "Bloquea el agua hasta una altura ajustable. Un nuevo diseño más compacto que permite construir encima de ellas."
itIT = "Blocca l'acqua fino a un'altezza regolabile. Un nuovo design più compatto che permette di costruire sopra di essi."
ukUA = "Блокує воду до регульованої висоти. Нова, компактніша конструкція, на якій можна будувати зверху."
thTH = "กั้นน้ำให้สูงถึงระดับที่ปรับได้ เป็นดีไซน์ใหม่ที่กะทัดรัดกว่าเดิม ช่วยให้คุณสร้างสิ่งก่อสร้างไว้เหนือประตูระบายน้ำได้"
csCZ = "Blokuje vodu až do nastavitelné výšky. Nový kompaktnější design umožňuje stavět na jejich vrchu."
viVN = "Chặn nước ở độ cao có thể điều chỉnh. Một thiết kế mới nhỏ gọn hơn cho phép bạn xây dựng trên chúng."
caES = "Bloqueja l'aigua fins a una alçada ajustable. Un disseny nou i més compacte que permet construir a sobre."
beBY = "Утрымлівае ваду да рэгуляванай вышыні. Новая, больш кампактная канструкцыя, на якой можна будаваць зверху."
roRO = "Blochează apa până la o înălțime reglabilă. Un design nou, mai compact, care îți permite să construiești deasupra lor."
huHU = "A víz állítható magasságig tartja vissza. Új, kompaktabb kialakítás, amely lehetővé teszi, hogy építkezhess rajtuk."
arSA = "يحجز الماء حتى ارتفاع قابل للتعديل. تصميم جديد أكثر إحكاماً يتيح لك البناء فوقه."

