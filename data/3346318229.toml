["NewGameConfigurationPanel.BobBalancedModeDescription"]
raw = "The Seasons are fairly balanced.\n\nDifficulty: 3/5. The first drought can be long like Hard Mode, but you have longer to prepare for it.\n\n50% chance of Bad Tide starting from Cycle 5.\n\nAll seasons last 25 days. (except for early game handicap.)"
status = "abandoned"
enUS = "The Seasons are fairly balanced.\n\nDifficulty: 3/5. The first drought can be long like Hard Mode, but you have longer to prepare for it.\n\n50% chance of Bad Tide starting from Cycle 5.\n\nAll seasons last 25 days. (except for early game handicap.)"
zhCN = "季节相对平衡。\n\n难度：3/5。第一次干旱可能像困难模式一样漫长，但你有更多时间为之做好准备。\n\n从第5个周期开始，有50%几率出现坏潮。\n\n所有季节持续25天。（早期游戏有例外。）"
zhTW = "季節相當平衡。\n\n難度：3/5。第一次乾旱可能和困難模式一樣漫長，但你有更長的時間來準備。\n\n從第5循環開始，有50%的可能性出現壞潮。\n\n所有季節持續25天。（早期遊戲的障礙除外。）"
ruRU = "Сезоны довольно сбалансированы.\n\nСложность: 3/5. Первая засуха может длиться долго, как в Жёстком режиме, но у вас есть больше времени на подготовку.\n\n50% шанс начала Плохого прилива с 5-го цикла.\n\nВсе сезоны длятся по 25 дней. (за исключением начального дисбаланса.)"
jaJP = "「四季はかなりバランスが取れています。\n\n難易度: 3/5。最初の干ばつはハードモードのように長引くことがありますが、それに備える時間が長くなります。\n\nサイクル5から悪潮が始まる確率は50%。\n\nすべての季節は25日間続きます。（初期ゲームのハンデを除く）」"
frFR = "Les saisons sont assez équilibrées.\n\nDifficulté : 3/5. La première sécheresse peut être longue comme en mode Difficile, mais vous avez plus de temps pour vous y préparer.\n\n50 % de chances qu'une marée mauvaise commence à partir du Cycle 5.\n\nToutes les saisons durent 25 jours. (sauf pour le handicap du début de jeu.)"
deDE = "Die Jahreszeiten sind ziemlich ausgewogen.\n\nSchwierigkeit: 3/5. Die erste Dürre kann so lange dauern wie im Schweren Modus, aber du hast länger Zeit, dich darauf vorzubereiten.\n\n50 % Chance, dass die schlechte Flut ab Zyklus 5 beginnt.\n\nAlle Jahreszeiten dauern 25 Tage. (außer für den Handicap im frühen Spiel.)"
plPL = "Sezony są stosunkowo zbalansowane.\n\nTrudność: 3/5. Pierwsza susza może być długa jak w trybie Trudnym, ale masz więcej czasu, żeby się do niej przygotować.\n\n50% szans na Złą Falę od Cykłu 5.\n\nWszystkie sezony trwają 25 dni. (z wyjątkiem handicapu na początku gry.)"
ptBR = "As Estações são bastante equilibradas.\n\nDificuldade: 3/5. A primeira seca pode ser longa como no Modo Difícil, mas você tem mais tempo para se preparar.\n\n50% de chance de Maré Ruim começando no Ciclo 5.\n\nTodas as estações duram 25 dias. (exceto pela desvantagem do início de jogo.)"
koKR = "계절은 꽤 균형 잡혀 있습니다.\n\n난이도: 3/5. 첫 번째 가뭄은 하드 모드처럼 길 수 있지만, 준비할 시간이 더 많습니다.\n\n사이클 5부터 나쁜 조수가 발생할 확률은 50%입니다.\n\n모든 계절은 25일간 지속됩니다. (초기 게임 핸디캡 제외.)"
csCZ = "Roční období jsou poměrně vyvážená.\n\nObtížnost: 3/5. První sucho může být dlouhé jako v těžkém režimu, ale máte delší čas se na něj připravit.\n\n50% šance na špatné přílivy od cyklu 5.\n\nVšechna roční období trvají 25 dní. (kromě počátečního hendikepu.)"
viVN = "Các mùa được cân bằng khá.\n\nĐộ khó: 3/5. Đợt hạn hán đầu tiên có thể kéo dài như ở Chế độ Khó, nhưng bạn có thời gian dài hơn để chuẩn bị cho nó.\n\nCó 50% cơ hội xảy ra thủy triều xấu, bắt đầu từ Chu kỳ 5.\n\nTất cả các mùa kéo dài 25 ngày. (trừ cho bất lợi ở giai đoạn đầu game.)"
trTR = "Mevsimler oldukça dengeli.\n\nZorluk: 3/5. İlk kuraklık, Zor Mod gibi uzun olabilir, ancak ona hazırlık için daha fazla zamanınız var.\n\n5. Döngüden itibaren Kötü Gelgitin başlaması için %50 şans.\n\nTüm mevsimler 25 gün sürer. (erken oyun dezavantajı hariç.)"

