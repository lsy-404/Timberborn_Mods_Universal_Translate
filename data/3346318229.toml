["Building.Wonder.Emberpelts.Description"]
raw = "Distributes resources across the Earth. When launched, makes the beavers in the area extra happy."
status = "normal"
enUS = "Distributes resources across the Earth. When launched, makes the beavers in the area extra happy."
zhCN = "将火种送往地球各处。启动时，会让这里的海狸格外开心。"
zhTW = "在地球上分配資源。發射時，會讓該區域的海狸特別快樂。"
ruRU = "Распределяет ресурсы по Земле. После запуска делает бобров в этом районе особенно счастливыми."
jaJP = "地球全体に資源を配分します。発射されると、その地域のビーバーたちを特に喜ばせます。"
frFR = "Distribue des ressources à travers la Terre. Lorsqu'il est lancé, rend les castors de la région particulièrement heureux."
deDE = "Verteilt Ressourcen über die Erde. Bei der Aktivierung macht es die Biber in der Umgebung besonders glücklich."
plPL = "Rozdziela zasoby po całej Ziemi. Po uruchomieniu sprawia, że bobry w obszarze są wyjątkowo szczęśliwe."
ptBR = "Distribui recursos pelo planeta. Quando lançado, faz com que os castores na área fiquem muito felizes."
koKR = "지구 전역에 자원을 분배합니다. 발사되면 해당 지역의 비버들이 더욱 행복해집니다."
csCZ = "Distribuuje zdroje po Zemi. Po spuštění činí bobry v okolí extra šťastnými."
viVN = "Phân phối tài nguyên khắp Trái Đất. Khi được kích hoạt, làm cho những chú hải ly ở khu vực đó hạnh phúc hơn."
trTR = "Kaynakları Dünya genelinde dağıtır. Başlatıldığında, bölgedeki kunduzları ekstra mutlu eder."

["Building.Wonder.Emberpelts.FlavorDescription"]
raw = "It looks like a big fire pit to me."
status = "normal"
enUS = "It looks like a big fire pit to me."
zhCN = "所有文明都起源于一颗小小的火花，是时候传播至更远的地方了。"
zhTW = "看起來像是一個大火坑。"
ruRU = "Это выглядит как большой костёр."
jaJP = "大きな焚き火台のように見えます。"
frFR = "Cela ressemble pour moi à un grand foyer."
deDE = "Es sieht für mich aus wie ein großes Feuerloch."
plPL = "Wygląda na dużą palenisko dla ognia."
ptBR = "Parece um grande fogo para mim."
koKR = "나에게 이곳은 큰 모닥불처럼 보인다."
csCZ = "Vypadá to na velký ohniště."
viVN = "Theo tôi, nó trông như một cái hố lửa lớn."
trTR = "Bana büyük bir ateş çukuru gibi görünüyor."

["Faction.Emberpelts.WonderCompletionFlavor"]
raw = "Having collected great wealth and knowledge, your beavers attempted to share the fruits of their labour with the suffering planet. Unfortunately it all went up in flames. At least your beavers got to see things burn!"
status = "normal"
enUS = "Having collected great wealth and knowledge, your beavers attempted to share the fruits of their labor with the suffering planet. Unfortunately, it all went up in flames. At least your beavers got to see things burn!"
zhCN = "在收集了巨大的财富和知识后，你的海狸试图将劳动成果与痛苦的星球分享。不幸的是，一切都燃烧殆尽。至少你的海狸得以见证了火焰的景象！"
zhTW = "積累了巨大的財富和知識後，你的海狸們試圖將他們勞動的成果分享給受苦的星球。不幸的是，一切都化為火海。至少你的海狸們得以目睹一切燃燒！"
ruRU = "Собрав великое богатство и знания, ваши бобры попытались поделиться плодами своего труда с страдающей планетой. К сожалению, все это сгорело дотла. По крайней мере, ваши бобры смогли увидеть, как все горит!"
jaJP = "大きな富と知識を集めたあなたのビーバーは、苦しむ地球に彼らの労苦の成果を分け与えようとしました。しかし、残念ながらすべては炎に包まれてしまいました。少なくとも、あなたのビーバーは燃えるものを見ることができました！"
frFR = "Ayant accumulé une grande richesse et beaucoup de connaissances, vos castors ont tenté de partager les fruits de leur travail avec la planète en souffrance. Malheureusement, tout a fini en flammes. Au moins, vos castors ont eu l'occasion de voir les choses brûler !"
deDE = "Nachdem sie großen Reichtum und Wissen gesammelt hatten, versuchten Ihre Biber, die Früchte ihrer Arbeit mit dem leidenden Planeten zu teilen. Leider ging alles in Flammen auf. Zumindest durften Ihre Biber zusehen, wie die Dinge brannten!"
plPL = "Zgromadziwszy wielkie bogactwo i wiedzę, twoje bobry próbowały podzielić się owocami swojej pracy z cierpiącą planetą. Niestety, wszystko poszło z dymem. Przynajmniej twoje bobry miały okazję zobaczyć, jak rzeczy płoną!"
ptBR = "Tendo reunido grande riqueza e conhecimento, seus castores tentaram compartilhar os frutos de seu trabalho com o planeta sofredor. Infelizmente, tudo acabou em chamas. Pelo menos seus castores puderam ver as coisas queimarem!"
koKR = "막대한 부와 지식을 모은 당신의 비버들은 고통받는 지구와 그들의 노동의 열매를 나누려 했습니다. 불행히도 모든 것이 불길에 휩싸였죠. 적어도 당신의 비버들은 불타는 모습을 볼 수 있었습니다!"
csCZ = "Poté, co nashromáždili velké bohatství a znalosti, se vaši bobři pokusili sdílet plody své práce s trpící planetou. Bohužel to vše vzplálo. Aspoň se vaši bobři mohli podívat, jak to hoří!"
viVN = "Đã tích lũy được khối tài sản và tri thức lớn, những chú hải ly của ngươi đã cố gắng chia sẻ thành quả lao động của mình với hành tinh đang chịu đựng đau khổ. Thật không may, tất cả đã bốc cháy thành tro. Ít nhất, những chú hải ly của ngươi cũng được chứng kiến mọi thứ cháy rụi!"
trTR = "Büyük zenginlik ve bilgi topladıktan sonra, kunduzlarınız emeklerinin meyvelerini acı çeken gezegenle paylaşmaya çalıştı. Ne yazık ki her şey alev aldı. En azından kunduzlarınız yangınları görme fırsatı buldu!"

["Faction.Emberpelts.WonderCompletionMessage"]
raw = "Congratulations! You mastered Emberpelts and used this map's resources to build the faction's wonder."
status = "normal"
enUS = "Congratulations! You mastered Emberpelts and used this map's resources to build the faction's wonder."
zhCN = "好样的！你完全掌握了火绒独特的火焰科技，在地图上留下了印迹，并打造了该部族的奇观。"
zhTW = "恭喜你！你掌握了 Emberpelts，並利用這張地圖的資源建造了派系的奇蹟。"
ruRU = "Поздравляем! Вы освоили Emberpelts и использовали ресурсы этой карты, чтобы построить чудо фракции."
jaJP = "おめでとうございます！あなたはエンバーペルツをマスターし、この地図の資源を使って派閥のワンダーを建設しました。"
frFR = "Félicitations ! Vous avez maîtrisé les Emberpelts et utilisé les ressources de cette carte pour construire la merveille de la faction."
deDE = "Herzlichen Glückwunsch! Du hast Emberpelts gemeistert und die Ressourcen dieser Karte genutzt, um das Wunder der Fraktion zu bauen."
plPL = "Gratulacje! Opanowałeś Emberpelts i wykorzystałeś zasoby tej mapy do zbudowania cudu frakcji."
ptBR = "Parabéns! Você dominou Emberpelts e usou os recursos deste mapa para construir a maravilha da facção."
koKR = "축하합니다! 당신은 Emberpelts를 마스터하고 이 지도 자원을 사용하여 세력의 경이를 건설했습니다."
csCZ = "Gratulujeme! Ovládl(a) jsi Emberpelts a využil(a) zdroje této mapy k vybudování zázraku frakce."
viVN = "Chúc mừng! Bạn đã thành thạo Emberpelts và sử dụng nguồn tài nguyên của bản đồ này để xây dựng kỳ quan của phe Emberpelts."
