["NewGameConfigurationPanel.BobLongModeDescription"]
raw = "The Seasons are long.\n\nDifficulty: 4/5. Hard mode but longer.\n\nDroughts and Badtides last 50 to 100 days. (with an early game Handicap.)\n\nTemperate seasons last 20 to 30 days.\n\n40% chance of Bad Tides starting from Cycle 3."
status = "abandoned"
enUS = "The Seasons are long.\n\nDifficulty: 4/5. Hard mode but longer.\n\nDroughts and Bad Tides last 50 to 100 days. (with an early game handicap.)\n\nTemperate seasons last 20 to 30 days.\n\n40% chance of Bad Tides starting from Cycle 3."
zhCN = "季节很长。\n\n难度：4/5。困难模式但时间更长。\n\n干旱和恶潮持续50到100天。（带有早期游戏的劣势。）\n\n温带季节持续20到30天。\n\n从第3周期开始有40%的几率出现恶潮。"
zhTW = "四季很長。\n\n難度：4/5。困難模式但更長。\n\n乾旱和壞潮持續 50 到 100 天。（帶有早期遊戲的障礙。）\n\n溫帶季節持續 20 到 30 天。\n\n從第三個週期開始，有 40% 的幾率會出現壞潮。"
ruRU = "Сезоны длинные.\n\nСложность: 4/5. Сложный режим, но длительный.\n\nЗасухи и Плохие Приливы длятся от 50 до 100 дней. (с начальным недостатком.)\n\nУмеренные сезоны длятся от 20 до 30 дней.\n\n40% вероятность появления Плохих Приливов, начиная с Цикла 3."
jaJP = "季節は長い。\n\n難易度: 4/5。ハードモードですが、期間が長いです。\n\n干ばつと悪潮は50日から100日続きます。（初期ゲームにハンディキャップあり。）\n\n温暖な季節は20日から30日続きます。\n\nサイクル3から悪潮が始まる確率は40％です。"
frFR = "Les saisons sont longues.\n\nDifficulté : 4/5. Mode difficile mais plus long.\n\nLes sécheresses et les marées mauvaises durent de 50 à 100 jours. (avec un handicap en début de partie.)\n\nLes saisons tempérées durent de 20 à 30 jours.\n\n40 % de chance que des marées mauvaises commencent dès le cycle 3."
deDE = "Die Jahreszeiten sind lang.\n\nSchwierigkeit: 4/5. Schwieriger Modus, aber länger.\n\nDürreperioden und schlechte Gezeiten dauern 50 bis 100 Tage. (mit einem Handicap in der frühen Spielphase.)\n\nGemäßigte Jahreszeiten dauern 20 bis 30 Tage.\n\n40% Chance auf schlechte Gezeiten ab Zyklus 3."
plPL = "Pory roku są długie.\n\nTrudność: 4/5. Tryb trudny, ale dłuższy.\n\nSusze i złe pływy trwają od 50 do 100 dni. (z handicape'm na początku gry.)\n\nSezony umiarkowane trwają od 20 do 30 dni.\n\n40% szans na złe pływy od cyklu 3."
ptBR = "As Estações são longas.\n\nDificuldade: 4/5. Modo difícil, mas mais longo.\n\nSecas e Vazios Ruins duram de 50 a 100 dias. (com uma desvantagem no início do jogo.)\n\nEstações temperadas duram de 20 a 30 dias.\n\n40% de chance de Vazios Ruins começarem a partir do Ciclo 3."
koKR = "계절이 길다.\n\n난이도: 4/5. 어려운 모드지만 길어짐.\n\n가뭄과 나쁜 조수는 50일에서 100일 동안 지속된다. (초기 게임 핸디캡 포함.)\n\n온대 계절은 20일에서 30일 지속된다.\n\n사이클 3부터 나쁜 조수가 시작될 확률은 40%이다."
csCZ = "Roční období jsou dlouhá.\n\nObtížnost: 4/5. Těžký režim, ale delší.\n\nSucha a špatné přílivy trvají 50 až 100 dní. (s počátečním handicapem.)\n\nMírné roční období trvá 20 až 30 dní.\n\n40% šance na špatné přílivy, počínaje cyklem 3."
viVN = "Các mùa dài.\n\nĐộ khó: 4/5. Chế độ khó nhưng kéo dài hơn.\n\nHạn hán và Thủy triều xấu kéo dài từ 50 đến 100 ngày. (kèm theo handicap ở giai đoạn đầu trò chơi.)\n\nCác mùa ôn đới kéo dài từ 20 đến 30 ngày.\n\nCó 40% xác suất xuất hiện Thủy triều xấu bắt đầu từ Chu kỳ 3."
trTR = "Mevsimler uzun.\n\nZorluk: 4/5. Zor mod ama daha uzun.\n\nKıtlıklar ve Kötü Gelirler 50 ila 100 gün sürer. (erken oyunda bir dezavantaj ile.)\n\nIlıman mevsimler 20 ila 30 gün sürer.\n\nDöngü 3'ten itibaren Kötü Gelirlerin başlama şansı %40."
