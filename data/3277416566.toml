beBY = "Слупы, каб можна было выбіраць індывідуальны вигляд.\nМожна спалучаць з лесвіцай, каб хаваць іх, але пры гэтым яны становяцца складовымі."
roRO = "Stâlpi pentru a putea avea aspecte personalizate\nPot fi combinați cu Scara pentru a-i ascunde, dar devin stivuibili."
