["CG.ReproducibleChanceMultiplierDesc"]
raw = "Make trees more or less likely to reproduce. Each tree each hour has a 1-3% chance to reproduce depends on the kind. Setting this to 1 to keep the game's setting and 0 means no reproduction."
status = "normal"
enUS = "Make trees more or less likely to reproduce. Each tree has a 1-3% chance to reproduce every hour, depending on the type. Setting this to 1 maintains the game's settings, while 0 means no reproduction."
zhCN = "可以将树木的蔓延概率更改为原来的N倍（游戏默认：1，即每小时有1-3%的概率蔓延至相邻方格，具体概率取决于树木种类）。"
zhTW = "讓樹的繁殖機率增減。每棵樹每小時有1%-3%的機率繁殖，具體取決於樹的種類。將此設置為1以保持遊戲的設定，設置為0則表示不會繁殖。"
ruRU = "Сделайте деревья более или менее склонными к размножению. Каждое дерево каждый час имеет 1-3% шанс на размножение в зависимости от вида. Установка этого значения на 1 сохраняет настройки игры, а 0 означает отсутствие размножения."
jaJP = "木が繁殖する可能性を増減させます。各木は、種類に応じて毎時1〜3%の確率で繁殖します。これを1に設定するとゲームの設定を維持し、0は繁殖が行われないことを意味します。"
frFR = "Rendre les arbres plus ou moins susceptibles de se reproduire. Chaque arbre a chaque heure une chance de 1 à 3 % de se reproduire, selon le type. Fixer cela à 1 pour conserver les paramètres du jeu et 0 signifie pas de reproduction."
deDE = "Mache Bäume weniger oder mehr wahrscheinlich, sich zu reproduzieren. Jeder Baum hat jede Stunde eine 1-3% Chance, sich zu reproduzieren, abhängig von der Art. Dies auf 1 setzen, um die Spieleinstellungen beizubehalten, und 0 bedeutet keine Reproduktion."
plPL = "Zwiększ lub zmniejsz prawdopodobieństwo reprodukcji drzew. Każde drzewo co godzinę ma 1-3% szans na reprodukcję, w zależności od gatunku. Ustawienie na 1 utrzymuje ustawienia gry, a 0 oznacza brak reprodukcji."
ptBR = "Faça com que as árvores tenham mais ou menos probabilidade de se reproduzir. Cada árvore, a cada hora, tem uma chance de 1-3% de se reproduzir, dependendo do tipo. Definir isso para 1 mantém a configuração do jogo, e 0 significa que não há reprodução."
koKR = "나무가 번식할 가능성을 높이거나 낮추세요. 각 나무는 매시간 1-3%의 번식 확률이 있으며, 이는 종류에 따라 다릅니다. 이 값을 1로 설정하면 게임의 기본 설정을 유지하고, 0으로 설정하면 번식이 없습니다."
trTR = "Ağaçların üreme olasılığını artırın veya azaltın. Her ağaç saat başına türüne bağlı olarak %1 ile %3 arasında üreme şansına sahiptir. Bunu 1 olarak ayarlamak oyunun ayarlarını korur ve 0 ayarı üremenin olmadığı anlamına gelir."
esES = "Haz que los árboles sean más o menos propensos a reproducirse. Cada árbol cada hora tiene una probabilidad de entre 1 y 3 % de reproducirse, según el tipo. Establecer este valor en 1 mantiene la configuración original del juego, y 0 significa que no hay reproducción."
itIT = "Rendi gli alberi più o meno propensi a riprodursi. Ogni albero, ogni ora, ha una probabilità dell'1-3% di riprodursi, a seconda della specie. Impostando questo valore a 1 si mantiene l'impostazione originale del gioco, mentre 0 significa che non avviene alcuna riproduzione."
ukUA = "Зробити дерева більш або менш імовірними для розмноження. Кожне дерево щогодини має шанс 1–3% розмножитися залежно від виду. Значення 1 зберігає налаштування гри, а 0 означає відсутність розмноження."
thTH = "ทำให้ต้นไม้มีโอกาสสืบพันธุ์มากขึ้นหรือน้อยลง ต้นไม้แต่ละต้นในทุกชั่วโมงมีโอกาสสืบพันธุ์ 1-3% ขึ้นอยู่กับชนิดของต้นไม้ การตั้งค่านี้ให้เป็น 1 หมายถึงคงค่าเดิมของเกม และตั้งเป็น 0 หมายถึงไม่มีการสืบพันธุ์"
csCZ = "Upravte, jak pravděpodobné je, že stromy se budou rozmnožovat. Každý strom má každou hodinu 1-3% šanci na rozmnožení, která závisí na druhu. Nastavení na 1 udržuje nastavení hry a 0 znamená žádné rozmnožování."
viVN = "Làm cho cây dễ sinh sản hơn hoặc ít sinh sản hơn. Mỗi cây mỗi giờ có xác suất sinh sản từ 1% đến 3% tùy thuộc vào loại cây. Đặt giá trị này bằng 1 để giữ nguyên thiết lập của trò chơi, và 0 có nghĩa là không sinh sản."
caES = "Fes que els arbres siguin més o menys propensos a reproduir-se. Cada arbre, cada hora, té entre un 1 % i un 3 % de probabilitat de reproduir-se, segons el tipus. Si ho establiu en 1, es manté la configuració original del joc; si ho establiu en 0, no hi haurà reproducció."
beBY = "Зрабіце дрэвы больш або менш схільнымі да размнажэння. Кожнае дрэва кожную гадзіну мае шанс 1–3% на размнажэнне ў залежнасці ад выгляду. Значэнне 1 захоўвае налады гульні, а 0 азначае, што размнажэнне адсутнічае."
roRO = "Faceți copacii mai mult sau mai puțin susceptibili să se reproducă. Fiecare copac, în fiecare oră, are o șansă de 1-3% de a se reproduce, în funcție de tip. Setarea la 1 păstrează setarea originală a jocului, iar 0 înseamnă că nu există reproducere."
huHU = "A fák szaporodási esélyének növelése vagy csökkentése. Minden fa óránként 1–3% eséllyel szaporodik, a fajtától függően. Az 1-es érték a játék eredeti beállítását tartja meg, a 0 pedig azt jelenti, hogy nincs szaporodás."
arSA = "اجعل الأشجار أكثر أو أقل احتمالاً للتكاثر. لكل شجرة في كل ساعة فرصة تتراوح بين 1 و3% للتكاثر، وتعتمد على نوع الشجرة. اضبط هذه القيمة على 1 للإبقاء على إعداد اللعبة الأصلي، وعلى 0 لإيقاف التكاثر تمامًا."

