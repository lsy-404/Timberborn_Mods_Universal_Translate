plPL = "Odległość (w blokach), którą drzewo może rozprzestrzenić się na nowy blok. 0 oznacza brak rozprzestrzeniania. Domyślna wartość w grze: 1"
ptBR = "A distância (em quadras) que uma árvore pode se espalhar para um novo bloco. 0 significa nenhum espalhamento. Padrão do jogo: 1"
koKR = "나무가 새로운 블록으로 퍼지는 거리(블록 기준). 0은 퍼짐이 없음을 의미합니다. 게임 기본값: 1"
trTR = "Ağacın yeni bir bloğa yayılabileceği mesafe (blok cinsinden). 0, yayılma yok anlamına gelir. Oyun varsayılanı: 1"
esES = "La distancia (en bloques) a la que un árbol puede propagarse a un nuevo bloque. 0 significa que no se propaga. Valor predeterminado del juego: 1"
itIT = "La distanza (in blocchi) entro cui un albero può diffondersi verso un nuovo blocco. 0 significa nessuna diffusione. Valore predefinito del gioco: 1"
ukUA = "Відстань (у блоках), на яку дерево може поширитися на новий блок. 0 означає відсутність поширення. Стандартне значення гри: 1"
thTH = "ระยะทาง (เป็นจำนวนบล็อก) ที่ต้นไม้สามารถแพร่กระจายไปยังบล็อกใหม่ได้ 0 หมายถึงไม่มีการแพร่กระจาย ค่าเริ่มต้นของเกม: 1"
csCZ = "Vzdálenost (v blocích), do které se strom může rozšířit na nový blok. 0 znamená žádné rozšiřování. Výchozí hodnota hry: 1"
viVN = "Khoảng cách (tính bằng ô) mà cây có thể lan sang một ô mới. 0 có nghĩa là không lan. Mặc định của trò chơi: 1"
caES = "La distància (en blocs) que un arbre pot propagar cap a un bloc nou. 0 vol dir que no es propaga. Valor per defecte del joc: 1"
beBY = "Адлегласць (у блоках), на якую дрэва можа распаўсюджвацца на новы блок. 0 азначае, што распаўсюджванне адключана. Стандартнае значэнне гульні: 1"
roRO = "Distanța (în blocuri) pe care o poate extinde un copac către un bloc nou. 0 înseamnă fără extindere. Valoarea implicită a jocului: 1"
huHU = "A fa által új blokkra terjeszkedni képes távolság (blokkban). A 0 azt jelenti, hogy nincs terjeszkedés. Játék alapértelmezése: 1"
arSA = "المسافة (بالكتل) التي يمكن أن تنتشر بها الشجرة إلى كتلة جديدة. القيمة 0 تعني عدم الانتشار. القيمة الافتراضية في اللعبة: 1"

