plPL = "Mnożnik czasu wzrostu drzew, takich jak sosny lub dęby (1 to domyślna wartość gry). Można ustawić poniżej 1, aby utrudnić grę."
ptBR = "Multiplicador para o tempo de crescimento das árvores como Pinheiros ou Carvalhos (1 para o padrão do jogo). Pode ser definido abaixo de 1 para tornar o jogo mais difícil."
koKR = "소나무나 참나무와 같은 나무 성장 시간에 대한 배율(게임 기본값은 1). 게임을 더 어렵게 만들기 위해 1보다 아래로 설정할 수 있습니다."
trTR = "Ağaç büyüme süresi için çarpan, Çamlar veya Meşe ağaçları gibi (oyunun varsayılanı için 1). Oyunu daha zor hale getirmek için 1'in altında ayarlanabilir."
esES = "Multiplicador del tiempo de crecimiento de los árboles, como los pinos o los robles (1 para el valor predeterminado del juego). Puede establecerse por debajo de 1 para que el juego sea más difícil."
itIT = "Moltiplicatore per il tempo di crescita degli alberi come Pini o Querce (1 per il valore predefinito del gioco). Può essere impostato a un valore inferiore a 1 per rendere il gioco più difficile."
ukUA = "Множник часу росту дерев, наприклад сосен або дубів (1 — стандартне значення гри). Можна встановити менше 1, щоб зробити гру складнішою."
thTH = "ตัวคูณสำหรับเวลาการเติบโตของต้นไม้ เช่น ต้นสนหรือต้นโอ๊ก (1 คือค่าเริ่มต้นของเกม) สามารถตั้งค่าให้ต่ำกว่า 1 เพื่อทำให้เกมยากขึ้น"
csCZ = "Multiplikátor pro čas růstu stromů, jako jsou borovice nebo duby (1 pro výchozí hodnotu hry). Může být nastaven na hodnotu nižší než 1, aby se hra stala obtížnější."
viVN = "Hệ số nhân thời gian tăng trưởng của cây như thông hoặc sồi (1 là mặc định của trò chơi). Có thể đặt dưới 1 để làm cho trò chơi khó hơn."
caES = "Multiplicador del temps de creixement dels arbres com ara els pins o les roures (1 per al valor predeterminat del joc). Es pot establir per sota de 1 per fer el joc més difícil."
beBY = "Множнік часу росту дрэў, такіх як сосны ці дубы (1 — стандартнае значэнне гульні). Можна задаць значэнне меншае за 1, каб зрабіць гульню складаней."
roRO = "Multiplicatorul pentru timpul de creștere al copacilor, precum pinii sau stejarii (1 pentru valoarea implicită a jocului). Poate fi setat sub 1 pentru a face jocul mai greu."
huHU = "Szorzó a fenyő- vagy tölgyfák növekedési idejéhez (1 a játék alapértelmezett értéke). Az 1-nél kisebbre állítva a játék nehezebbé tehető."
arSA = "مُضاعِف لوقت نمو الأشجار مثل الصنوبر والبلوط (1 هو الإعداد الافتراضي للعبة). يمكن ضبطه على أقل من 1 لجعل اللعبة أصعب."

