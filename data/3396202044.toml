zhTW = "樹木可以擴散到新區塊的距離（以區塊計算）。0表示不擴散。遊戲預設值：1"
ruRU = "Расстояние (в кварталах), на которое дерево может распространиться на новый квартал. 0 означает отсутствие распространения. Значение по умолчанию в игре: 1"
