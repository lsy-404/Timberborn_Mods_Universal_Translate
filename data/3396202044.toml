zhCN = "可以将树木的成长速度更改为原来的N倍（游戏默认：1）。"
zhTW = "樹木生長時間的倍數，例如松樹或橡樹（遊戲預設為1）。可以設置為低於1以增加遊戲難度。"
ruRU = "Множитель времени роста деревьев, таких как сосны или дубы (1 - по умолчанию для игры). Может быть установлен ниже 1, чтобы усложнить игру."
jaJP = "松やオークの成長時間の倍率（ゲームのデフォルトは1）。1未満に設定することでゲームを難しくすることができます。"
frFR = "Multiplicateur pour le temps de croissance des arbres comme les pins ou les chênes (1 pour le défaut du jeu). Peut être réglé en dessous de 1 pour rendre le jeu plus difficile."
