koKR = "사용하도록 설정하면 나무가 위 또는 아래의 블록으로 퍼질 수 있습니다 (퍼짐 거리 사용). 게임 기본값: false"
trTR = "Etkinleştirildiğinde, ağaçlar kendilerinin üzerindeki veya altındaki bloklara yayılabilir (Yayılma Mesafesini kullanarak). Oyun varsayılanı: yanlış"
esES = "Si está activado, los árboles pueden extenderse a bloques situados por encima o por debajo de ellos (según la Distancia de propagación). Valor predeterminado del juego: falso"
itIT = "Se attivato, gli alberi possono diffondersi ai blocchi sopra o sotto di loro (usando la Distanza di diffusione). Impostazione predefinita di gioco: false"
ukUA = "Якщо увімкнено, дерева можуть поширюватися на блоки над або під собою (з використанням Відстані поширення). Стандартне значення гри: false"
thTH = "ถ้าเปิดใช้งาน ต้นไม้สามารถแพร่กระจายไปยังบล็อกที่อยู่เหนือหรือใต้ต้นไม้ได้ (โดยใช้ระยะการแพร่กระจาย) ค่าเริ่มต้นของเกม: false"
csCZ = "Při zapnutí mohou stromy rostnout do bloků nad nebo pod nimi (s použitím vzdálenosti šíření). Výchozí nastavení hry: vypnuto"
viVN = "Nếu được bật, cây có thể lan sang các khối ở phía trên hoặc phía dưới chúng (sử dụng Khoảng cách lan). Mặc định của trò chơi: sai"
caES = "Si s'activa, els arbres es poden estendre a blocs situats per sobre o per sota d'ells (segons la Distància d'expansió). Valor per defecte del joc: false"
beBY = "Калі ўключана, дрэвы могуць распаўсюджвацца на блокі вышэй або ніжэй за іх (з выкарыстаннем адлегласці распаўсюджвання). Прадвызначанае значэнне гульні: false"
roRO = "Dacă este activat, copacii se pot răspândi pe blocurile de deasupra sau de dedesubtul lor (folosind Distanța de răspândire). Valoarea implicită a jocului: false"
huHU = "Ha engedélyezve van, a fák a saját blokkjuk felett vagy alatt lévő blokkokra is terjedhetnek (a Terjedési távolság alapján). Játék alapértelmezett értéke: hamis"
arSA = "إذا فُعِّل هذا الخيار، يمكن للأشجار أن تنتشر إلى الكتل الواقعة فوقها أو تحتها (باستخدام مسافة الانتشار). القيمة الافتراضية في اللعبة: false"
