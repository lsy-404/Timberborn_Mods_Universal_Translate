viVN = "Cột cao phục vụ như một cơ sở để kết nối các mạng đường dây điện, cho phép những chú hải ly truyền tải điện năng qua khoảng cách dài."
caES = "Un pal alt que serveix de base per connectar xarxes de línies elèctriques, permetent als castors transmetre energia a llargues distàncies."
beBY = "Высокі слуп, які служыць асновай для злучэння сетак ліній электраперадачы і дазваляе бабрам перадаваць электрычную энергію на вялікія адлегласці."
roRO = "Un stâlp înalt care servește drept bază pentru conectarea rețelelor de linii electrice, permițând castorilor să transmită energie pe distanțe mari."
huHU = "Egy magas oszlop, amely az áramvezeték-hálózatok csatlakozási alapjaként szolgál, és lehetővé teszi a bebarnák számára, hogy nagy távolságokra továbbítsanak energiát."
arSA = "عمود عالٍ يعمل كقاعدة لربط شبكات خطوط الكهرباء، ويتيح للقنادس نقل الطاقة عبر مسافات بعيدة."

