["Building.PowerLineBeam.FlavorDescription"]
raw = "A horizontal pole with an anchor point at its end that serves as a base for connecting power line networks, allowing beavers to transmit power over long distances."
status = "normal"
enUS = "A horizontal pole with an anchor point at its end that serves as a base for connecting power line networks, allowing beavers to transmit power over long distances."
zhCN = "一根横杆，末端设有一个锚点，作为连接电力线路网络的基础，允许海狸在长距离传输电力。"
zhTW = "一根橫向的電杆，末端有一個錨點，作為連接電力線網絡的基礎，使海狸能夠在長距離傳輸電力。"
ruRU = "Горизонтальный столб с анкерной точкой на конце, который служит основой для подключения сетей силовых линий, позволяя бобрам передавать мощность на большие расстояния."
jaJP = "端にアンカーが付いた水平ポールで、電力線ネットワークを接続するための基盤として機能し、ビーバーが長距離にわたって電力を伝送できるようにします。"
frFR = "Un poteau horizontal avec un point d'ancrage à son extrémité qui sert de base pour connecter des réseaux de lignes électriques, permettant aux castors de transmettre l'énergie sur de longues distances."
deDE = "Ein horizontaler Pol mit einem Ankerpunkt an seinem Ende, der als Basis für die Verbindung von Stromleitungsnetzen dient und es den Bibern ermöglicht, Energie über lange Strecken zu übertragen."
plPL = "Poziomy słup z punktem kotwicznym na końcu, który służy jako podstawa do łączenia sieci linii energetycznych, pozwalając bobrom na przesyłanie energii na dużą odległość."
ptBR = "Um poste horizontal com um ponto de ancoragem na sua extremidade que serve como base para conectar redes de linhas de energia, permitindo que os castores transmitam energia por longas distâncias."
koKR = "긴 거리에서 전력을 전송할 수 있도록 전력선 네트워크를 연결하는 기반 역할을 하는 끝에 앵커 포인트가 있는 수평 기둥입니다."
trTR = "Uç kısmında bir sabitleme noktası olan yatay bir direk, güç hatları ağlarını bağlamak için bir temel görevi görür ve kunduzların enerjiyi uzun mesafelere iletmesini sağlar."
esES = "Un poste horizontal con un punto de anclaje en su extremo que sirve de base para conectar redes de líneas eléctricas, permitiendo a los castores transmitir energía a largas distancias."
itIT = "Un palo orizzontale con un punto di ancoraggio alla sua estremità, che funge da base per collegare le reti di linee elettriche e permette ai castori di trasmettere energia su lunghe distanze."
ukUA = "Горизонтальна балка з точкою кріплення на кінці, яка слугує основою для з'єднання ліній електропередачі та дає бобрам змогу передавати енергію на великі відстані."
thTH = "คานแนวนอนที่มีจุดยึดอยู่ที่ปลาย ทำหน้าที่เป็นฐานสำหรับเชื่อมต่อเครือข่ายสายส่งไฟฟ้า ช่วยให้บีเวอร์ส่งพลังงานไปได้ในระยะทางไกล"
csCZ = "Horizontální tyč s kotevním bodem na svém konci, která slouží jako základna pro připojení elektrických vedení, umožňující bobrům přenášet energii na dlouhé vzdálenosti."
viVN = "Cột ngang với một điểm neo ở cuối, phục vụ như một nền tảng để kết nối mạng lưới đường điện, cho phép những con nhím truyền tải điện qua những khoảng cách dài."
caES = "Una biga horitzontal amb un punt d'ancoratge a l'extrem que serveix de base per connectar xarxes de línies elèctriques, permetent als castors transmetre energia a llargues distàncies."
beBY = "Гарызантальная бэлька з якарным упорам на канцы, якая служыць асновай для падключэння сетак лініі электраперадачы і дазваляе бабрам перадаваць электраэнергію на вялікія адлегласці."
roRO = "Un stâlp orizontal cu un punct de ancorare la capăt, care servește drept bază pentru conectarea rețelelor de linii electrice și permite castorilor să transmită energie pe distanțe mari."
huHU = "Vízszintes rúd, amelynek végén rögzítőpont található. Ez szolgál alapként az elektromos vezetékhálózatok csatlakoztatásához, így a hódok nagy távolságra is továbbíthatnak energiát."
arSA = "عارضة أفقية لها نقطة ارتكاز في طرفها تُستخدم كقاعدة لربط شبكات خطوط الكهرباء، وتتيح للقنادس نقل الطاقة عبر مسافات بعيدة."
