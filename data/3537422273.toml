plPL = "Wysoki słup, który służy jako baza do łączenia sieci linii energetycznych, umożliwiając bobrom przesyłanie energii na długie odległości."
ptBR = "Um poste alto que serve como base para conectar redes de linhas de energia, permitindo que os castores transmitam energia por longas distâncias."
koKR = "전력선 네트워크를 연결하기 위한 기초 역할을 하는 높은 기둥으로, 비버들이 장거리에서 전력을 전송할 수 있게 합니다."
trTR = "Uzun mesafelerde enerji iletimine olanak tanıyan, enerji hattı ağlarını bağlamak için bir temel görevi gören yüksek bir direk."
esES = "Un poste alto que sirve de base para conectar redes de líneas eléctricas, permitiendo a los castores transmitir energía a largas distancias."
itIT = "Un palo alto che funge da base per collegare le reti di linee elettriche, permettendo ai castori di trasmettere energia su lunghe distanze."
ukUA = "Високий стовп, який слугує основою для з'єднання мереж електроліній і дозволяє бобрам передавати електроенергію на великі відстані."
thTH = "เสาสูงที่ใช้เป็นฐานสำหรับเชื่อมต่อเครือข่ายสายส่งไฟฟ้า ช่วยให้บีเวอร์ส่งพลังงานไฟฟ้าไปได้ในระยะทางไกล"
