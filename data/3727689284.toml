["GroupTools.CopyToolDescription"]
raw = "Click to place the copied group. Rotate and flip it with your usual building keys. Right-click or Esc to cancel."
status = "normal"
enUS = "Click to place the copied group. Rotate and flip it using your usual building keys. Right-click or Esc to cancel."
zhCN = "“单击以放置已复制的组。使用您惯用的建筑快捷键进行旋转和翻转。右键单击或按 Esc 取消。”"
zhTW = "點擊以放置複製的群組。使用您通常的建築鍵來旋轉和翻轉它。右鍵點擊或按 Esc 以取消。"
ruRU = "Щелкните, чтобы разместить скопированную группу. Поворачивайте и переворачивайте её с помощью привычных клавиш строительства. Щелкните правой кнопкой мыши или нажмите Esc, чтобы отменить."
jaJP = "「コピーしたグループを配置するにはクリックしてください。通常の建築キーで回転や反転ができます。キャンセルするには右クリックまたはEscキーを押してください。」"
frFR = "Cliquez pour placer le groupe copié. Faites-le pivoter et retourner avec vos touches de construction habituelles. Clic droit ou Échap pour annuler."
deDE = "Klicken Sie, um die kopierte Gruppe zu platzieren. Drehen und kippen Sie sie mit Ihren gewohnten Bautasten. Rechtsklick oder Esc, um abzubrechen."
plPL = "Kliknij, aby umieścić skopiowaną grupę. Obróć i przewróć ją za pomocą zwykłych klawiszy budowania. Kliknij prawym przyciskiem myszy lub naciśnij Esc, aby anulować."
ptBR = "Clique para colocar o grupo copiado. Gire e inverta-o com suas teclas de construção habituais. Clique com o botão direito ou pressionar Esc para cancelar."
koKR = "복사한 그룹을 배치하려면 클릭하세요. 일반 건축 키를 사용하여 회전 및 뒤집기를 할 수 있습니다. 취소하려면 오른쪽 클릭하거나 Esc 키를 누르세요."
trTR = "Kopyalanan grubu yerleştirmek için tıklayın. Alışılmış inşaat tuşlarınızla döndürün ve ters çevirin. İptal etmek için sağ tıklayın veya Esc tuşuna basın."
esES = "Haz clic para colocar el grupo copiado. Gíralo y voltéalo con tus teclas de construcción habituales. Haz clic derecho o pulsa Esc para cancelar."
itIT = "Clicca per posizionare il gruppo copiato. Ruotalo e capovolgilo con i tuoi tasti di costruzione abituali. Clicca con il tasto destro o premi Esc per annullare."
ukUA = "Натисніть, щоб розмістити скопійовану групу. Обертайте та відзеркалюйте її звичайними клавішами будівництва. Клацніть правою кнопкою миші або натисніть Esc, щоб скасувати."
thTH = "คลิกเพื่อวางกลุ่มที่คัดลอกไว้ หมุนและพลิกด้วยปุ่มสร้างอาคารปกติของคุณ คลิกขวาหรือกด Esc เพื่อยกเลิก"
csCZ = "Klikněte pro umístění zkopírované skupiny. Otočte ji a převraťte pomocí vašich obvyklých kláves pro stavění. Pravým tlačítkem myši nebo klávesou Esc zrušíte."
viVN = "Nhấn để đặt nhóm đã sao chép. Xoay và lật nó với các phím xây dựng thông thường của bạn. Nhấp chuột phải hoặc Esc để hủy."
caES = "Feu clic per col·locar el grup copiat. Gireu-lo i inverteu-lo amb les tecles de construcció habituals. Feu clic dret o premeu Esc per cancel·lar."
beBY = "Націсніце, каб размясціць скапіаваную групу. Павярнуць і перавярнуць яе можна звычайнымі клавішамі будаўніцтва. Націсніце правую кнопку мышы або Esc, каб скасаваць."
roRO = "Apasă pentru a plasa grupul copiat. Rotește-l și răstoarnă-l cu tastele tale obișnuite de construcție. Apasă clic dreapta sau Esc pentru a anula."
huHU = "A másolt csoport elhelyezéséhez kattints. A szokásos építési billentyűkkel forgathatod és tükrözheted. Kilépéshez jobb klikk vagy Esc."
arSA = "انقر لوضع المجموعة المنسوخة. قم بتدويرها وقلبها باستخدام مفاتيح البناء المعتادة لديك. انقر بالزر الأيمن أو اضغط على Esc للإلغاء."
