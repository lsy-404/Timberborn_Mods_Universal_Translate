zhTW = "儲存多餘的能量，並在動能網缺乏能量時供應能量。建得越高，就能儲存越多能量。"
ruRU = "Хранит избыточную энергию и отдаёт её, когда системе энергоснабжения её не хватает. Чем выше постройка, тем больше энергии она может хранить."
jaJP = "余剰エネルギーを蓄え、ネットワークのエネルギーが不足したときに供給します。高く建てるほど、より多くのエネルギーを蓄えられます。"
frFR = "Stocke l’énergie excédentaire et la restitue lorsque le réseau manque d’énergie. Plus elle est haute, plus elle peut stocker d’énergie."
deDE = "Speichert überschüssige Energie und gibt sie zurück, wenn dem Stromnetz Energie fehlt. Je höher sie gebaut wird, desto mehr Energie kann sie speichern."
plPL = "Przechowuje nadmiar energii i oddaje ją, gdy w sieci jej brakuje. Im wyżej ją zbudujesz, tym więcej energii może przechowywać."
ptBR = "Armazena o excesso de energia e a fornece novamente quando a rede está com pouca energia. Quanto mais alto for construído, mais energia poderá armazenar."
koKR = "잉여 에너지를 저장하고 네트워크에 에너지가 부족할 때 다시 공급합니다. 더 높이 지을수록 더 많은 에너지를 저장할 수 있습니다."
csCZ = "Ukládá přebytečnou energii a dodává ji zpět, když má síť energie nedostatek. Čím vyšší ji postavíte, tím více energie dokáže uložit."
