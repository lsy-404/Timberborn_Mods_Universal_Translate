["Building.EarthRecultivator.Folktails.Description"]
status = "normal"
raw = "Phân phối hạt giống cây trồng khắp Trái Đất. Lúc phóng sẽ khiến hải ly trong khu vực tăng thêm niềm vui."
enUS = "Distributes crop seeds across the Earth. Launching it increases the happiness of beavers in the area."
zhCN = "将作物种子散播到整个地球。发射时会让区域内的海狸更加开心。"
zhTW = "將作物種子散播到世界各地。發射時會提升區域內海狸的幸福感。"
ruRU = "Распространяет семена растений по всей Земле. При запуске повышает уровень счастья бобров в округе."
jaJP = "地球全体に作物の種をまく。発射時に、範囲内のビーバーの幸福度を上昇させる。"
frFR = "Distribue des graines de cultures dans le monde entier. Lors du lancement, augmente la joie des castors de la région."
deDE = "Verteilt Pflanzensamen auf der ganzen Erde. Der Start erhöht die Freude der Biber in der Umgebung."
plPL = "Rozprowadza nasiona roślin uprawnych po całej Ziemi. Przy wystrzeleniu zwiększa radość bobrów w okolicy."
ptBR = "Distribui sementes de culturas por toda a Terra. Ao ser lançado, aumenta a felicidade dos castores na área."
koKR = "지구 곳곳에 작물 씨앗을 배포합니다. 발사하면 해당 지역의 비버들이 더 행복해집니다."
csCZ = "Rozptyluje semena plodin po celé Zemi. Při odpálení zvýší radost bobrů v okolí."
viVN = "Phân phối hạt giống cây trồng khắp Trái Đất. Khi được phóng, công trình sẽ tăng niềm vui cho hải ly trong khu vực."
trTR = "Dünyanın dört bir yanına mahsul tohumları dağıtır. Fırlatıldığında bölgedeki kunduzların mutluluğunu artırır."

