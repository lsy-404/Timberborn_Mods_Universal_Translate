["Tutorial.Droughts"]
new = "Hạn hán"
status = "normal"

["Tutorial.Droughts.Description"]
new = "Chúc mừng! Khu định cư của bạn đã sống sót qua đợt hạn hán đầu tiên.\n                               \nHạn hán là một phần của chu kỳ mùa. Chúng sẽ quay lại và dần kéo dài hơn.\n\nNếu chưa làm, hãy bắt đầu chuẩn bị cho đợt tiếp theo bằng cách xây đập."
status = "normal"

["Tutorial.Forestry"]
new = "Lâm nghiệp"
status = "normal"

["Tutorial.Forestry.Forester"]
new = "Hải ly cần nguồn Gỗ khúc ổn định. Tất nhiên rồi.\n                            \nDùng điểm Khoa học do Nhà phát minh tạo ra để mở khóa Trại trồng rừng. Sau đó xây nó ở khu vực bạn muốn trồng cây."
status = "normal"

["Tutorial.Forestry.MarkBirchesForPlanting"]
new = "Dùng công cụ Trồng cây và bụi để trồng vài cây Bạch dương. Chúng lớn nhanh, rất phù hợp cho khu định cư non trẻ.\n                                          \nTương tự cây trồng, cây chỉ mọc trên vùng xanh được tưới tiêu.\n                                          \nNhớ đánh dấu khu vực trồng để chặt sau này."
status = "normal"

["Tutorial.HaulersAndWorkforce"]
new = "Phu khuân vác và lao động"
status = "normal"

["Tutorial.HaulersAndWorkforce.BuildHaulingPost"]
new = "Khi khu định cư phát triển, lượng hàng hóa xử lý sẽ nhiều hơn. Vận chuyển chúng chiếm một phần đáng kể trong ngày làm việc.\n                                               \nPhu khuân vác sẽ giúp việc đó. Họ di chuyển hàng hóa khắp khu của mình theo nhu cầu.\n                                               \nGiờ hãy xây một Trạm khuân vác."
status = "normal"

["Tutorial.HaulersAndWorkforce.ChangeWorkforce"]
new = "Một số nơi làm việc, như Trạm khuân vác, mặc định không lấp đầy toàn bộ vị trí lao động. Bạn có thể đổi số lao động mong muốn trong bảng của công trình.\n                                              \nBạn cũng có thể kiểm soát phân bổ nhân lực bằng ưu tiên nơi làm việc. Ví dụ, Trạm khuân vác thường có thể đặt ưu tiên thấp hơn.\n                                              \nGiờ hãy thử xem."
status = "normal"

["Tutorial.HaulersAndWorkforce.PauseHaulingPost"]
new = "Bạn có thể tạm dừng công trình và công trường. Điều này giúp kiểm soát hành động của hải ly tốt hơn.\n                                               \nVí dụ, nơi làm việc bị tạm dừng sẽ tự động bỏ trống và lao động tự chuyển sang nơi làm việc còn trống khác.\n                                               \nChọn Trạm khuân vác và tạm dừng nó bằng nút trong bảng công trình."
status = "normal"

