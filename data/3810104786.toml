["AnalyticsConsent.Info"]
status = "normal"
raw = "Hãy giúp chúng tôi cải thiện Timberborn bằng cách chia sẻ dữ liệu dựa trên cách bạn chơi game.\n\nNếu bạn đồng ý, chúng tôi sẽ tự động thu thập thông tin liên quan đến quá trình chơi của bạn.\n\nBạn có thể vào phần cài đặt trong game để rút lại sự đồng ý và xóa dữ liệu bất kỳ lúc nào. Để biết thêm chi tiết, vui lòng xem <link><u>chính sách quyền riêng tư</u></link>.\n\nXin cảm ơn!"
enUS = "Help us improve Timberborn by sharing data about how you play the game.\n\nIf you agree, we’ll automatically collect information about your gameplay.\n\nYou can withdraw your consent and delete your data at any time in the in-game settings. For more details, please see the <link><u>privacy policy</u></link>.\n\nThank you!"
zhCN = "请通过分享您的游戏数据，帮助我们改进《海狸浮生记》。\n\n如果您同意，我们将自动收集与您的游戏过程相关的信息。\n\n您可以随时在游戏设置中撤回同意并删除数据。详情请参阅<link><u>隐私政策</u></link>。\n\n谢谢！"
zhTW = "協助我們透過分享您遊玩遊戲的相關資料，改善《海狸浮生記》。\n\n如果您同意，我們會自動收集與您遊戲過程相關的資訊。\n\n您可以隨時前往遊戲設定撤回同意並刪除資料。詳情請參閱<link><u>隱私權政策</u></link>。\n\n謝謝！"
ruRU = "Помогите нам улучшить Timberborn, поделившись данными о том, как вы играете.\n\nЕсли вы согласны, мы будем автоматически собирать информацию о вашем игровом процессе.\n\nВы можете отозвать согласие и удалить данные в любое время в настройках игры. Подробнее см. в <link><u>политике конфиденциальности</u></link>.\n\nСпасибо!"
jaJP = "ゲームのプレイ方法に関するデータを共有して、Timberbornの改善にご協力ください。\n\n同意いただいた場合、ゲームプレイに関する情報を自動的に収集します。\n\n同意の撤回とデータの削除は、ゲーム内の設定からいつでも行えます。詳細については、<link><u>プライバシーポリシー</u></link>をご覧ください。\n\nありがとうございます！"
frFR = "Aidez-nous à améliorer Timberborn en partageant des données sur votre façon de jouer.\n\nSi vous donnez votre accord, nous collecterons automatiquement des informations relatives à votre partie.\n\nVous pouvez retirer votre consentement et supprimer vos données à tout moment dans les paramètres du jeu. Pour en savoir plus, consultez notre <link><u>politique de confidentialité</u></link>.\n\nMerci !"
deDE = "Hilf uns, Timberborn zu verbessern, indem du Daten zu deiner Spielweise mit uns teilst.\n\nWenn du zustimmst, erfassen wir automatisch Informationen zu deinem Spielverhalten.\n\nDu kannst deine Zustimmung jederzeit in den Spieleinstellungen widerrufen und deine Daten löschen. Weitere Informationen findest du in der <link><u>Datenschutzerklärung</u></link>.\n\nVielen Dank!"
plPL = "Pomóż nam ulepszyć Timberborn, udostępniając dane dotyczące sposobu, w jaki grasz.\n\nJeśli wyrazisz zgodę, będziemy automatycznie zbierać informacje związane z Twoją rozgrywką.\n\nMożesz wycofać zgodę i usunąć dane w dowolnym momencie w ustawieniach gry. Więcej informacji znajdziesz w <link><u>polityce prywatności</u></link>.\n\nDziękujemy!"
ptBR = "Ajude-nos a melhorar Timberborn compartilhando dados sobre a forma como você joga.\n\nSe concordar, coletaremos automaticamente informações relacionadas à sua experiência de jogo.\n\nVocê pode acessar as configurações do jogo para retirar seu consentimento e excluir seus dados a qualquer momento. Para saber mais, consulte a <link><u>política de privacidade</u></link>.\n\nAgradecemos!"
koKR = "게임 플레이 방식을 바탕으로 한 데이터를 공유하여 Timberborn 개선에 도움을 주세요.\n\n동의하시면 게임 플레이와 관련된 정보를 자동으로 수집합니다.\n\n게임 내 설정에서 언제든 동의를 철회하고 데이터를 삭제할 수 있습니다. 자세한 내용은 <link><u>개인정보 처리방침</u></link>을 확인해 주세요.\n\n감사합니다!"
csCZ = "Pomozte nám vylepšit hru Timberborn sdílením údajů o tom, jak hru hrajete.\n\nPokud souhlasíte, budeme automaticky shromažďovat informace související s vaším hraním.\n\nSouhlas můžete kdykoli odvolat a údaje smazat v nastavení hry. Další podrobnosti najdete v <link><u>zásadách ochrany osobních údajů</u></link>.\n\nDěkujeme!"
viVN = "Hãy giúp chúng tôi cải thiện Timberborn bằng cách chia sẻ dữ liệu về cách bạn chơi game.\n\nNếu đồng ý, bạn sẽ cho phép chúng tôi tự động thu thập thông tin liên quan đến quá trình chơi game của bạn.\n\nBạn có thể vào phần cài đặt trong game để rút lại sự đồng ý và xóa dữ liệu bất cứ lúc nào. Để biết thêm chi tiết, vui lòng xem <link><u>chính sách quyền riêng tư</u></link>.\n\nXin cảm ơn!"
trTR = "Oynama biçiminize dayalı verileri paylaşarak Timberborn’u geliştirmemize yardımcı olun.\n\nOnay vermeniz hâlinde, oyun deneyiminizle ilgili bilgileri otomatik olarak toplarız.\n\nOnayınızı geri çekmek ve verilerinizi istediğiniz zaman silmek için oyun içi ayarlara gidebilirsiniz. Daha fazla bilgi için lütfen <link><u>gizlilik politikamıza</u></link> göz atın.\n\nTeşekkürler!"

