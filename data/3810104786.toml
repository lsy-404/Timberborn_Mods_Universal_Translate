ruRU = "Чтобы приспособиться к постапокалиптическому миру, бобрам нужны крайние меры."
jaJP = "終末後の世界に適応するには、ビーバーにも過激な手段が必要だ。"
frFR = "Pour s’adapter au monde post-apocalyptique, les castors ont besoin de mesures extrêmes."
deDE = "Um sich an die postapokalyptische Welt anzupassen, brauchen Biber extreme Maßnahmen."
plPL = "Aby przystosować się do postapokaliptycznego świata, bobry potrzebują ekstremalnych środków."
ptBR = "Para se adaptar ao mundo pós-apocalíptico, os castores precisam de medidas extremas."
koKR = "종말 이후의 세계에 적응하려면 비버에게는 극단적인 조치가 필요합니다."
csCZ = "Aby se bobři přizpůsobili postapokalyptickému světu, potřebují krajní opatření."
viVN = "Để thích nghi với thế giới hậu tận thế, hải ly cần những biện pháp cực đoan."
