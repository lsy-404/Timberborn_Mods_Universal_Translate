new = "Hạnh phúc là chỉ số cho biết một hải ly hài lòng đến đâu. Nó ảnh hưởng đến ba thuộc tính: tốc độ làm việc, tốc độ di chuyển và tuổi thọ.\n                             \nMột trong những cách chính để tăng hạnh phúc là thông qua điểm vui chơi. Đó là các công trình hải ly ghé vào khi không làm việc."
