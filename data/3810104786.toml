zhTW = "經過好幾代海狸水利工程師的平衡、加固與完美塑形，這可不只是一塊木頭。"
ruRU = "Сбалансированный, укреплённый и доведённый до совершенства поколениями бобров-инженеров водного дела — это не просто бревно."
jaJP = "何世代にもわたるビーバー水利技師たちによって、バランスよく補強され、完璧な形に仕上げられたこれは、ただの木の塊ではない。"
frFR = "Équilibré, renforcé et façonné à la perfection au fil des générations par des castors ingénieurs hydrauliciens, ce n’est pas qu’un simple bloc de bois."
deDE = "Über Generationen von Biber-Wasserbauingenieuren ausbalanciert, verstärkt und perfekt geformt – das ist nicht einfach nur ein Holzklotz."
plPL = "Zrównoważony, wzmocniony i doskonale ukształtowany przez pokolenia bobrów-inżynierów wodnych — to nie jest zwykły kawałek drewna."
ptBR = "Equilibrado, reforçado e perfeitamente moldado por gerações de castores engenheiros hidráulicos, isto não é apenas um bloco de madeira."
koKR = "여러 세대에 걸친 비버 수공학자들이 균형을 맞추고, 보강하고, 완벽하게 다듬었습니다. 이건 그냥 나무 덩어리가 아닙니다."
csCZ = "Vyvážená, vyztužená a po generace vodohospodářských bobřích inženýrů dovedená k dokonalému tvaru. Tohle není jen kus dřeva."
