["Building.Thorns.Description"]
status = "normal"
raw = "Chướng ngại không thể xuyên qua, đồng thời chặn tưới tiêu và ô nhiễm. Khó phá dỡ và có thể làm bị thương những ai thử phá."
enUS = "An impassable obstacle that also blocks irrigation and pollution. Difficult to demolish and can injure anyone who tries."
