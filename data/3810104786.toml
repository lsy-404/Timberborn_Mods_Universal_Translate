["Building.EarthRepopulator.IronTeeth.FlavorDescription"]
status = "normal"
raw = "Sau một vài thử nghiệm hiện đã được phân loại với một máy bắn đá, thì thiết kế này đã được chấp nhận thay thế."
enUS = "After a few experiments with a catapult, which have now been classified, this design has been accepted as a replacement."
zhCN = "经过几次试验（如今已被归类为投石机），这个设计终于被接受为替代方案。"
zhTW = "經過幾次如今已歸類為投石機的試驗後，這項設計已獲准取代原有設計。"
ruRU = "После нескольких экспериментов с катапультой эту конструкцию наконец одобрили в качестве замены."
jaJP = "カタパルトを使った数回の実験は分類済みとなり、この設計が代替案として採用された。"
frFR = "Après quelques essais désormais classés avec un trébuchet, cette conception a été acceptée comme remplacement."
deDE = "Nach einigen Versuchen, die inzwischen als Katapult eingestuft wurden, wurde dieser Entwurf schließlich als Ersatz angenommen."
plPL = "Po kilku eksperymentach z katapultą, które zostały już sklasyfikowane, ten projekt został zaakceptowany jako zamiennik."
ptBR = "Após alguns testes agora classificados com uma catapulta, este projeto foi aceito como substituto."
koKR = "투석기를 이용한 몇 차례의 실험이 이제 공식적으로 분류됨에 따라, 이 설계가 대체안으로 채택되었습니다."
csCZ = "Po několika pokusech, které jsou nyní klasifikovány jako pokusy s katapultem, byl tento návrh přijat jako náhrada."
viVN = "Sau một vài thử nghiệm với máy bắn đá, giờ đã được phân loại, thiết kế này đã được chấp nhận thay thế."
trTR = "Fırlatma makinesiyle yapılan ve artık sınıflandırılmış olan birkaç deneyin ardından bu tasarım, onun yerine kabul edildi."

["Building.EfficientFarmhouse.Description"]
status = "normal"
raw = "Tuyển dụng hải ly làm nông để trồng và thu hoạch cây trồng. Thiết kế mở rộng của Folktails chứa được nhiều hải ly lao động hơn."
enUS = "Employ beavers as farmers to grow and harvest crops. The Folktails' expanded design accommodates more working beavers."
zhCN = "雇用海狸耕种和收获作物。神尾的扩建版可容纳更多海狸工人。"
zhTW = "雇用海狸農夫來種植和收穫作物。神尾的擴建版可容納更多海狸工人。"
ruRU = "Нанимает бобров-фермеров для выращивания и сбора урожая. Увеличенная версия «Хвостов мира» вмещает больше работающих бобров."
jaJP = "ビーバーを農夫として雇い、作物の栽培と収穫を行います。フォークテイルの拡張型設計により、より多くのビーバーを働かせることができます。"
frFR = "Emploie des castors fermiers pour planter et récolter des cultures. La version agrandie des Rustiqueues peut accueillir davantage de castors travailleurs."
deDE = "Stelle Biber als Bauern ein, die Feldfrüchte anbauen und ernten. Die erweiterte Bauweise der Rustikalruten bietet Platz für mehr arbeitende Biber."
plPL = "Zatrudnia bobry do uprawy i zbioru roślin. Rozszerzona konstrukcja Folkogonów mieści więcej pracujących bobrów."
ptBR = "Empregue castores como agricultores para plantar e colher cultivos. O projeto ampliado dos Caudas-do-mato abriga mais castores trabalhadores."
koKR = "농작물을 심고 수확할 농부 비버를 고용합니다. 나무꼬리의 확장형 설계는 더 많은 일꾼 비버를 수용합니다."
csCZ = "Zaměstnávejte bobry jako farmáře, kteří budou pěstovat a sklízet plodiny. Rozšířený návrh Folktails pojme více pracujících bobrů."
viVN = "Tuyển dụng hải ly làm nông để trồng và thu hoạch cây trồng. Thiết kế mở rộng của Folktails chứa được nhiều hải ly lao động hơn."
trTR = "Ekinleri ekip hasat etmeleri için kunduz çiftçiler işe alın. Köykuyruklar’ın genişletilmiş tasarımı, daha fazla çalışan kunduz barındırır."

