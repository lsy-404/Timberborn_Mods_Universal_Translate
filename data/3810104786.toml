["Building.Ruins.FlavorDescription"]
status = "normal"
raw = "Rải rác khắp đất nước, những tàn tích của loài người suy tàn đã cung cấp cho hải ly điều không thể tưởng tượng - một nguồn tài nguyên vượt trội hơn gỗ."
enUS = "Scattered across the land, the ruins of a fallen humanity have given beavers something unimaginable—a resource superior to wood."
zhCN = "散布在各地的人类衰亡遗迹，为海狸提供了难以想象的东西——一种胜过木材的资源。"
zhTW = "散落在各地的人類衰亡遺跡，為海狸提供了難以想像的東西——一種勝過木材的資源。"
ruRU = "Разбросанные по всей стране руины угасшей цивилизации людей дали бобрам нечто немыслимое — ресурс, превосходящий древесину."
jaJP = "国中に点在する、衰退した人類の遺跡は、ビーバーたちに想像もつかないものをもたらした――木材をしのぐ資源を。"
frFR = "Éparpillées dans tout le pays, les ruines de l’humanité déchue ont offert aux castors une ressource inimaginable, supérieure au bois."
deDE = "Überall im Land verstreut haben die Ruinen der untergegangenen Menschheit den Bibern etwas Unvorstellbares beschert – eine Ressource, die Holz überlegen ist."
plPL = "Rozsiane po całym kraju ruiny upadłej ludzkości dostarczyły bobrom czegoś niewyobrażalnego — surowca lepszego od drewna."
ptBR = "Espalhadas por todo o país, as ruínas da humanidade decadente proporcionaram aos castores algo inimaginável: um recurso superior à madeira."
koKR = "나라 곳곳에 흩어진, 몰락한 인류의 폐허는 비버들에게 상상조차 할 수 없었던 것을 제공했다. 바로 목재보다 뛰어난 자원이다."
csCZ = "Roztroušené po celé zemi poskytují ruiny zaniklé lidské civilizace bobrům něco nepředstavitelného – zdroj, který předčí dřevo."
viVN = "Rải rác khắp đất nước, tàn tích của loài người suy tàn đã mang đến cho hải ly một thứ không thể tưởng tượng nổi — nguồn tài nguyên vượt trội hơn cả gỗ."
trTR = "Ülkenin dört bir yanına dağılmış, çöküşe geçen insanlığın kalıntıları kunduzlara hayal bile edemeyecekleri bir şey sundu: ahşaptan daha üstün bir kaynak."

