["Building.EfficientMine.Description"]
status = "normal"
raw = "Tuyển dụng hải ly thợ mỏ khai thác kim loại phế liệu từ các tàn tích dưới lòng đất. Thiết kế sáng tạo tối đa hóa tốc độ khai thác."
enUS = "Employs beavers to mine scrap metal from underground ruins. Its ingenious design maximizes mining speed."
zhCN = "雇用海狸矿工从地下遗迹中开采废金属。创新设计最大限度地提高了开采速度。"
zhTW = "招募海狸礦工，從地下遺跡開採廢金屬。創新設計可將開採速度最大化。"
ruRU = "Нанимает бобров-шахтёров для добычи металлолома из подземных руин. Инновационная конструкция максимально увеличивает скорость добычи."
jaJP = "地下の遺跡から金属くずを採掘する鉱夫ビーバーを雇用します。独創的な設計により、採掘速度を最大限に高めます。"
frFR = "Recrute des castors mineurs pour extraire des débris métalliques des ruines souterraines. Sa conception ingénieuse maximise la vitesse d’extraction."
deDE = "Rekrutiert Biber, die in unterirdischen Ruinen Altmetall abbauen. Das innovative Design maximiert die Abbaugeschwindigkeit."
plPL = "Zatrudnia bobry górników do wydobywania złomu z podziemnych ruin. Pomysłowa konstrukcja maksymalizuje szybkość wydobycia."
ptBR = "Recruta castores mineradores para extrair sucata das ruínas subterrâneas. O design inovador maximiza a velocidade de mineração."
koKR = "지하 유적에서 고철을 채굴할 광부 비버를 고용합니다. 창의적인 설계로 채굴 속도를 극대화합니다."
csCZ = "Zaměstnává bobry, kteří těží kovový šrot z podzemních ruin. Geniální konstrukce maximalizuje rychlost těžby."
viVN = "Tuyển hải ly thợ mỏ để khai thác kim loại phế liệu từ những tàn tích dưới lòng đất. Thiết kế sáng tạo giúp tối đa hóa tốc độ khai thác."
trTR = "Yeraltındaki harabelerden hurda metal çıkarmak için madenci kunduzlar görevlendirir. Yenilikçi tasarımı, çıkarma hızını en üst düzeye çıkarır."

