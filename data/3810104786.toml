zhTW = "允許海狸通過，同時仍能阻擋水流"
ruRU = "Позволяет бобрам проходить, при этом преграждая поток воды."
frFR = "Permet aux castors de passer tout en bloquant le courant."
deDE = "Ermöglicht Bibern das Durchgehen und hält gleichzeitig den Wasserfluss auf."
plPL = "Umożliwia bobrom przechodzenie, jednocześnie blokując przepływ wody"
ptBR = "Permite que os castores passem enquanto bloqueia o fluxo de água"
