status = "normal"

["Faction.Folktails.Description"]
new = "Thân thiện, dễ tính nhưng chăm chỉ, Folktails là những hải ly nông dân tài ba. Chúng tôn trọng thiên nhiên và được trả ơn bằng sự trù phú dồi dào.\nChâm ngôn của họ: <i>Ăn chắc, gỗ bền.</i>"
status = "normal"

["Faction.Folktails.DisplayName"]
new = "Folktails"
status = "normal"

["Faction.Folktails.GameOver.Flavor"]
new = "Khi bạn không tận dụng được quà tặng của thiên nhiên, thiên nhiên sẽ lấy lại chúng."
status = "normal"

["Faction.Folktails.GameOver.Message"]
new = "Folktails của bạn đã đối mặt với số phận buồn của những con hải ly đi trước của họ. Đây là kết thúc."
status = "normal"

["Faction.Folktails.WonderCompletionFlavor"]
new = "Sau khi thu thập được tài sản và kiến thức lớn, những con hải ly của bạn đã chia sẻ trái ngọt từ lao động của họ với hành tinh đang đau khổ. Vẫn còn nhiều việc phải làm, nhưng Trái Đất có thể phát triển trở lại."
status = "normal"

["Faction.Folktails.WonderCompletionMessage"]
new = "Chúc mừng! Bạn đã làm chủ các phương thức thiên nhiên của Folktails và sử dụng tài nguyên của bản đồ này để xây dựng kỳ quan của phe phái."
status = "normal"

["Faction.IronTeeth.Description"]
new = "Những kẻ từ bỏ các phương thức gỗ truyền thống, họ đã làm chủ sắt và khoa học để xây dựng các máy móc tiên tiến.\nHọ đạt được sự tiến bộ thông qua sự sáng tạo, hiệu quả và thiếu quan tâm đến môi trường.\nChâm ngôn của họ: <i>Cần cù, chăm chỉ.</i>"
status = "normal"

