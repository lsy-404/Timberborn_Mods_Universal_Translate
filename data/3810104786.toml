["Building.SteamEngine.FlavorDescription"]
status = "normal"
raw = "Dù phát minh này tuyệt vời, nó vẫn là cái dằm trong mắt các quốc gia hải ly ngoài Iron Teeth."
enUS = "Despite this wonderful invention, it remains a thorn in the side of beaver nations outside the Iron Teeth."
zhCN = "尽管这项发明很棒，但对铁牙以外的海狸国家来说，它依然是眼中钉。"
zhTW = "儘管這項發明很了不起，對鐵牙以外的海狸國度而言，它依然是眼中釘。"
ruRU = "Несмотря на то, что это изобретение великолепно, оно всё же как бельмо на глазу для бобров всех фракций, кроме Железных зубов."
jaJP = "この発明は素晴らしいものだが、アイアン・ティース以外のビーバー諸国にとっては、依然として目の上のたんこぶだ。"
frFR = "Malgré son caractère génial, cette invention reste une épine dans le pied des nations de castors en dehors des Dents de fer."
deDE = "Trotz dieser großartigen Erfindung ist sie den Biberkolonien außerhalb der Eisenzähne immer noch ein Dorn im Auge."
plPL = "Choć ten wynalazek jest wspaniały, wciąż pozostaje solą w oku państw bobrów spoza Żelazozębnych."
ptBR = "Apesar de esta invenção ser maravilhosa, ela ainda é uma pedra no sapato das nações de castores que não são os Dentes de Ferro."
koKR = "이 발명품은 훌륭하지만, 강철 이빨을 제외한 비버 국가들에겐 여전히 눈엣가시다."
csCZ = "Ačkoli je tento vynález úžasný, stále je trnem v oku bobřím národům mimo frakci Iron Teeth."
viVN = "Dù phát minh này tuyệt vời, nó vẫn là cái gai trong mắt các quốc gia hải ly ngoài Iron Teeth."
trTR = "Bu icat harika olsa da Demir Dişler dışındaki kunduz uluslarının gözünde hâlâ bir dikendir."

