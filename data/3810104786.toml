["Building.GravityBattery.Description"]
status = "normal"
raw = "Lưu trữ năng lượng dư thừa và cung cấp lại khi mạng lưới thiếu năng lượng. Xây càng cao, nó càng lưu trữ được nhiều năng lượng."
enUS = "Stores excess energy and supplies it when the network is short on energy. The taller it is, the more energy it can store."
