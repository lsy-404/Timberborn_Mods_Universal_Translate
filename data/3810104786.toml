["Building.ExercisePlaza.FlavorDescription"]
status = "normal"
raw = "Iron Teeth muốn giống như những tạo vật của mình và luôn rắn rỏi hơn, tốt hơn, nhanh hơn, mạnh mẽ hơn."
enUS = "The Iron Teeth want to be like their creations and always tougher, better, faster, and stronger."
zhCN = "铁牙想要像自己的造物一样，始终更健壮、更好、更快、更强。"
zhTW = "鐵牙想要像他們創造的生物一樣，永遠更加健壯、更加優秀、更加迅速、更加強大。"
ruRU = "Железные зубы хотят походить на свои творения и быть выносливее, лучше, быстрее и сильнее."
jaJP = "アイアン・ティースは自らの創造物のようになり、常によりたくましく、より優れ、より速く、より強くありたいと願っている。"
frFR = "Les Dents de fer veulent ressembler à leurs créations et être toujours plus robustes, meilleurs, plus rapides et plus forts."
deDE = "Die Eisenzähne wollen wie ihre Schöpfungen sein: immer robuster, besser, schneller und stärker."
plPL = "Żelazozębni chcą być jak ich stworzenia i zawsze stawać się twardsi, lepsi, szybsi i silniejsi."
ptBR = "Os Dentes de Ferro querem ser como suas criações: sempre mais resistentes, melhores, mais rápidos e mais fortes."
koKR = "강철 이빨은 자신들이 만든 창조물처럼 되고 싶어 하며, 언제나 더 강인하고, 더 뛰어나고, 더 빠르고, 더 강력해지려 합니다."
csCZ = "Iron Teeth chtějí být jako své výtvory a být vždy odolnější, lepší, rychlejší a silnější."
viVN = "Iron Teeth muốn giống như những tạo vật của mình và luôn rắn rỏi hơn, tốt hơn, nhanh hơn, mạnh mẽ hơn."
trTR = "Demir Dişler, yarattıkları gibi olmak ve her zaman daha dayanıklı, daha iyi, daha hızlı, daha güçlü olmak istiyor."

