["Building.Metalsmith.FlavorDescription"]
status = "normal"
raw = "Muốn bền thì làm bằng kim loại. Đó là một điều loài ngừi làm tốt. —Ol' Kazko"
enUS = "If you want it to last, make it out of metal. That's one thing humans do well. —Ol' Kazko"
zhCN = "想要耐用，就用金属做。这是人类擅长的一件事。——老卡兹科"
zhTW = "想要耐用，就用金屬來做。這是人類擅長的事。——老卡茲科"
ruRU = "Если хочешь, чтобы было долговечно, делай из металла. Это у людей хорошо получается. —Ол’ Казко"
jaJP = "長持ちさせたいなら、金属で作ることだ。それは人間が得意なことの一つだ。—オル・カズコ"
frFR = "Pour que ça dure, il faut le faire en métal. C’est quelque chose que les humains savent bien faire. —Ol' Kazko"
deDE = "Wenn es lange halten soll, mach es aus Metall. Das ist etwas, worin die Leute gut sind. —Ol' Kazko"
plPL = "Jeśli ma być trwałe, zrób to z metalu. To coś, w czym ludzie są dobrzy. —Ol' Kazko"
ptBR = "Se quer que dure, faça de metal. Isso é algo que os humanos fazem bem. —Ol' Kazko"
koKR = "오래 쓰려면 금속으로 만들어야지. 그건 인간들이 잘하는 일이야. —Ol' Kazko"
csCZ = "Chceš-li, aby to vydrželo, vyrob to z kovu. To lidem jde dobře. —Ol' Kazko"
viVN = "Muốn bền thì làm bằng kim loại. Đó là việc loài người làm tốt. —Ol' Kazko"
trTR = "Dayanıklı olsun istiyorsan metalden yap. İnsanların iyi yaptığı bir şey bu. —Ol' Kazko"

