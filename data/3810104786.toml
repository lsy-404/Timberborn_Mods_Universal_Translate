["Building.GearWorkshop.FlavorDescription"]
status = "normal"
raw = "Bánh răng gỗ chắc như đinh đóng cột! là khẩu hiệu do Ol' Kazko đặt ra khi thúc đẩy công nghiệp hóa nhanh chóng."
enUS = "“Wooden gears are solid as a rock!” was the slogan Ol' Kazko came up with while pushing for rapid industrialization."
zhCN = "木齿轮坚如磐石！这是老卡兹科在推动快速工业化时提出的口号。"
zhTW = "木齒輪牢不可破！這是 Ol' Kazko 在推動快速工業化時提出的口號。"
ruRU = "«Деревянные шестерни крепки как гвоздь!» — лозунг, придуманный Стариной Казко, когда он продвигал ускоренную индустриализацию."
jaJP = "「木製の歯車は頑丈そのもの！」は、急速な工業化を推し進める中でオールド・カズコが掲げたスローガンだ。"
frFR = "« Les engrenages en bois sont solides comme un roc ! » : tel était le slogan lancé par le vieux Kazko pour promouvoir une industrialisation rapide."
deDE = "„Holzzahnräder sind felsenfest!“ – so lautete der Slogan, den Ol' Kazko prägte, als er die rasche Industrialisierung vorantrieb."
plPL = "„Drewniane koła zębate są solidne jak skała!” — to hasło wymyślone przez Ol’ Kazka, gdy nawoływał do szybkiej industrializacji."
ptBR = "Engrenagens de madeira são firmes como uma rocha! é o slogan criado por Ol' Kazko ao defender uma industrialização acelerada."
koKR = "“목재 톱니바퀴는 못처럼 단단하다!”는 올드 카즈코가 급속한 산업화를 추진하며 내건 구호입니다."
csCZ = "„Dřevěná ozubená kola jsou pevná jako skála!“ je slogan, který vymyslel Ol' Kazko při prosazování rychlé industrializace."
viVN = "“Bánh răng gỗ chắc như đinh đóng cột!” là khẩu hiệu do Ol' Kazko đặt ra khi thúc đẩy công nghiệp hóa nhanh chóng."
trTR = "“Ahşap dişliler kaya gibi sağlam!” hızlı sanayileşmeyi teşvik ederken Ol' Kazko'nun ortaya attığı slogandır."

