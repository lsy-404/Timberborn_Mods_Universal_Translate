["Building.HydroponicGarden.FlavorDescription"]
status = "normal"
raw = "Ý tưởng này ra đời sau khi phát hiện ra những tàn tích ẩm ướt của loài người phủ đầy nấm phát triển nhanh."
enUS = "This idea came about after discovering the damp ruins of humanity, covered in fast-growing mushrooms."
zhCN = "这个想法源于发现了人类潮湿的遗迹，上面长满了生长迅速的蘑菇。"
zhTW = "這個構想源自發現人類潮濕的遺跡上長滿了快速生長的蘑菇。"
ruRU = "Эта идея возникла после того, как обнаружили влажные человеческие руины, сплошь покрытые быстрорастущими грибами."
jaJP = "このアイデアは、人類の湿った遺跡が急速に成長するキノコで覆われているのを発見した後に生まれた。"
frFR = "Cette idée est née après la découverte des vestiges humides des humains, recouverts de champignons à croissance rapide."
deDE = "Die Idee entstand, nachdem man die feuchten, von schnell wachsenden Pilzen überwucherten Ruinen der Menschen entdeckt hatte."
plPL = "Pomysł ten narodził się po odkryciu wilgotnych ruin ludzi, porośniętych szybko rosnącymi grzybami."
ptBR = "Esta ideia surgiu após a descoberta das ruínas úmidas dos humanos, cobertas por fungos de crescimento rápido."
koKR = "이 아이디어는 빠르게 자라는 버섯으로 뒤덮인 인간의 축축한 폐허를 발견한 뒤 떠올랐습니다."
csCZ = "Tento nápad vznikl po objevení vlhkých lidských ruin pokrytých rychle rostoucími houbami."
viVN = "Ý tưởng này ra đời sau khi phát hiện những tàn tích ẩm ướt của loài người phủ đầy nấm phát triển nhanh."
