plPL = "Dawniej drewniany dom był po prostu drewnianym domem. A teraz? Już sam nie wiem. —Ma' Ngonel"
ptBR = "Antigamente, uma casa de madeira era só uma casa de madeira. E agora? Já não sei. —Ma' Ngonel"
