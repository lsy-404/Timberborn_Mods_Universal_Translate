["Building.PaperMill.FlavorDescription"]
status = "normal"
raw = "Vốn dĩ là món ăn nhẹ khô cho những hải ly khai thác, nhanh chóng tìm thấy nhiều công dụng khác."
enUS = "Originally a dry snack for beavers working in the mines, it quickly found many other uses."
