["Building.Levee.FlavorDescription"]
status = "normal"
raw = "Cân bằng, gia cố và được tạo hình hoàn hảo qua nhiều thế hệ hải ly kỹ sư nước, đây không phải chỉ là một khối gỗ."
enUS = "Balanced, reinforced, and perfectly shaped over generations by beaver water engineers, this is no mere block of wood."
