["Building.Path.FlavorDescription"]
status = "normal"
raw = "Đường quê, đưa tôi về nhà, đến căn nhà gỗ tôi thuộc về. —Bài hát nổi tiếng của hải ly"
enUS = "Country road, take me home, to the wooden house where I belong. —A popular beaver song"
