["Building.AdvancedBreedingPod.FlavorDescription"]
new = "Ý tưởng này bắt nguồn từ việc hải ly con vô tình ngã vào cái vạc đầy chiết xuất và phát triển vượt bậc sau khi uống sạch không chừa giọt nào."
status = "normal"
enUS = "The idea came from a young beaver accidentally falling into a cauldron full of extract and growing at an incredible rate after drinking every last drop."
zhCN = "这个想法源于一只小海狸不小心掉进了装满提取液的大锅里，喝得一滴不剩后便突飞猛进地成长起来。"
zhTW = "這個點子源自一隻小海狸不小心掉進裝滿萃取液的大鍋裡，喝得一滴不剩後便突飛猛進地成長。"
ruRU = "Эта идея возникла после того, как маленький бобр случайно упал в котёл с экстрактом и невероятно вырос, выпив его до последней капли."
jaJP = "このアイデアは、ビーバーの子どもが誤って抽出液の入った大釜に落ち、一滴残らず飲み干した後、驚異的に成長したことから生まれた。"
frFR = "Cette idée vient d’un jeune castor qui est accidentellement tombé dans un chaudron rempli d’extrait et s’est mis à grandir à toute vitesse après en avoir bu jusqu’à la dernière goutte."
deDE = "Die Idee entstand, als ein junger Biber versehentlich in einen Kessel voller Extrakt fiel und sich übermäßig entwickelte, nachdem er keinen einzigen Tropfen übrig gelassen hatte."
plPL = "Pomysł ten zrodził się, gdy młody bóbr przypadkiem wpadł do kotła pełnego ekstraktu i rozwinął się w niezwykłym tempie po wypiciu go do ostatniej kropli."
ptBR = "A ideia surgiu quando um filhote de castor caiu por acidente em um caldeirão cheio de extrato e cresceu extraordinariamente depois de beber até a última gota."
koKR = "이 아이디어는 새끼 비버가 실수로 추출물이 가득 찬 가마솥에 빠진 뒤, 한 방울도 남기지 않고 전부 마시고 엄청나게 성장한 데서 비롯되었습니다."
csCZ = "Tento nápad vznikl, když malé bobřík náhodou spadl do kotle plného extraktu a po vypití každé poslední kapky neuvěřitelně vyrostl."
trTR = "Bu fikir, yavru bir kunduzun yanlışlıkla özüt dolu bir kazana düşüp içindeki her şeyi bir damla bile bırakmadan içtikten sonra olağanüstü gelişmesiyle ortaya çıktı."

["Building.Agora.Description"]
