["Building.StreamGauge.FlavorDescription"]
status = "normal"
raw = "Đời hải ly có cuộc triều dâng. Dám đón con sóng cả mới có đường đổi vận."
enUS = "A beaver's life has its tides. Only those who dare to ride the big wave can change their fortunes."
zhCN = "海狸的一生中总会迎来涨潮。敢于迎接巨浪，才有改变命运的机会。"
zhTW = "海狸的一生總有漲潮。敢迎向巨浪，才有改變命運的機會。"
ruRU = "В жизни бобров тоже бывают приливы. Лишь тот, кто осмелится встретить большую волну, сможет изменить свою судьбу."
jaJP = "ビーバーの一生には潮の満ち引きがある。大波に立ち向かう勇気があってこそ、運命を変える道が開ける。"
frFR = "La vie des castors connaît ses grandes marées. Seuls ceux qui osent affronter les vagues peuvent changer leur destin."
deDE = "Im Leben der Biber gibt es Fluten. Nur wer sich der großen Welle stellt, kann sein Schicksal wenden."
plPL = "Życie bobrów niesie przypływy i odpływy. Tylko ci, którzy odważą się stawić czoła wielkiej fali, mogą odmienić swój los."
ptBR = "A vida dos castores tem suas marés. Só quem ousa enfrentar as grandes ondas pode mudar o próprio destino."
koKR = "비버의 삶에도 밀물이 찾아온다. 거센 파도를 맞설 용기가 있어야 운명을 바꿀 길이 열린다."
csCZ = "Život bobrů má svůj příliv. Jen ten, kdo se odváží čelit velké vlně, může změnit svůj osud."
viVN = "Đời hải ly có lúc triều dâng. Dám đón sóng lớn mới có đường đổi vận."
trTR = "Kunduzların yaşamında gelgitler olur. Büyük dalgaları göze alanlar talihini değiştirebilir."

