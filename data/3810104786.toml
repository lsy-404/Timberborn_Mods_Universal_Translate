["Building.ScavengerFlag.FlavorDescription"]
status = "normal"
raw = "Mang kim loại đến các khu định cư chủ yếu dùng gỗ, hải ly khai thác được một số hải ly tôn trọng và cũng có sự khinh bỉ từ những con hải ly khác."
enUS = "Bringing metal to settlements that rely mainly on wood, these beavers earn the respect of some and the contempt of others."
zhCN = "为主要使用木材的定居点带来金属，这些海狸赢得了一些海狸的尊敬，也招来另一些海狸的鄙夷。"
zhTW = "將金屬帶到以木材為主的聚落，有些海狸因此敬重這些開採者，另一些海狸則不屑一顧。"
ruRU = "Принося металл в поселения, где в основном используют древесину, некоторые бобры заслуживают уважение, а другие — лишь презрение."
jaJP = "主に木材を使う入植地に金属を持ち込むと、一部のビーバーからは尊敬される一方、ほかのビーバーからは軽蔑されることもある。"
frFR = "En apportant des métaux aux colonies principalement bâties en bois, les castors récupérateurs inspirent du respect à certains et du mépris à d’autres."
deDE = "Da sie Metall in vorwiegend aus Holz bestehenden Siedlungen einführen, ernten die Plünderer bei manchen Bibern Respekt, bei anderen jedoch Verachtung."
plPL = "Przynosząc metal do osiedli zbudowanych głównie z drewna, bobry zyskują szacunek niektórych pobratymców, ale też pogardę innych."
ptBR = "Trazendo metal para assentamentos que usam principalmente madeira, os castores sucateiros conquistam o respeito de alguns castores e o desprezo de outros."
koKR = "목재를 주로 사용하는 정착지에 금속을 가져온 이 비버들은 일부 비버에게는 존경받지만, 다른 비버들에게는 멸시받습니다."
csCZ = "Přináší kov do osad, které využívají hlavně dřevo. Někteří bobři, kteří ho těží, k nim chovají úctu, zatímco jiní jimi pohrdají."
viVN = "Mang kim loại đến các khu định cư chủ yếu dùng gỗ, một số hải ly sẽ kính trọng những hải ly khai thác được, trong khi những con khác lại khinh bỉ chúng."
trTR = "Kereste ağırlıklı yerleşim yerlerine metal getiren bu kaşif kunduzlar, bazı kunduzların saygısını kazanırken diğerlerinin küçümsemesiyle karşılaşır."

