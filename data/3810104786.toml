["Tutorial.VerticalArchitecture.BuildRooftopTerrace"]
new = "Ở hoang địa, tối ưu không gian là rất quan trọng. Hải ly làm điều đó bằng cách phát triển thành phố theo chiều dọc.\n                                                   \nMột số công trình, như Nhà ở, có mái phẳng đủ sức đỡ công trình khác.\n                                                   \nGiờ hãy xây Sân thượng. Bạn có thể cần dùng Cầu thang để nối nó với khu."
status = "normal"

["Tutorial.WaterAndFood"]
new = "Nước và thức ăn"
status = "normal"

["Tutorial.WaterAndFood.Farmhouse"]
new = "Về lâu dài, ta cần thứ bổ dưỡng hơn. Xây Nông trại để trồng và thu hoạch cây trồng.\n                                 \nGiống các cờ, nông trại có phạm vi giới hạn.\n                                 \nMẹo: Nếu thiếu lao động, bạn có thể tạm dừng một số công trình. Chọn công trình rồi bấm nút tạm dừng."
status = "normal"

["Tutorial.WaterAndFood.Gatherer"]
new = "Ngoài nước, hải ly cần thức ăn.\n                                \nNgười hái lượm tự động thu thập Quả mọng trong phạm vi Cờ hái lượm. Bạn có thể thấy phạm vi khi đặt cờ.\n                                \nXây Cờ hái lượm gần vài bụi Việt quất."
status = "normal"

["Tutorial.WaterAndFood.MarkCarrots"]
new = "Nông dân sẽ không bắt đầu làm việc cho đến khi bạn cho biết trồng gì và trồng ở đâu.\n                                   \nDùng công cụ Trồng cây lương thực để chỉ định ruộng Cà rốt.\n                                   \nCây trồng cần được trồng trên đất xanh có tưới tiêu. Nếu không, cây sẽ khô héo rồi chết."
status = "normal"

["Tutorial.WaterAndFood.WaterPump"]
new = "Hải ly cần nước để sinh tồn.\n                                 \nXây Máy bơm nước để đảm bảo luôn có nước uống. Nhớ nối Máy bơm với Trung tâm khu."
status = "normal"

["Tutorial.Wellbeing"]
new = "Hạnh phúc"
status = "normal"

["Tutorial.Wellbeing.Beaver"]
new = "Bạn có thể thấy tác động của hành động mình lên hải ly.\n                           \nChọn một hải ly bằng cách nhấp vào nó. Trong bảng, bạn có thể thấy mức hạnh phúc, thuộc tính và nhu cầu hiện tại.\n                           \nMột số nhu cầu có thể xuống giá trị âm và gây phạt nặng hoặc tử vong."
status = "normal"

["Tutorial.Wellbeing.Campfire"]
new = "Hạnh phúc là chỉ số cho biết một hải ly hài lòng đến đâu. Nó ảnh hưởng đến ba thuộc tính: tốc độ làm việc, tốc độ di chuyển và tuổi thọ.\n                             \nMột trong những cách chính để tăng hạnh phúc là thông qua điểm vui chơi. Đó là các công trình hải ly ghé vào khi không làm việc."
status = "normal"

["Tutorial.Wellbeing.OpenWellbeingPanel"]
new = "Mở bảng hạnh phúc"
status = "normal"

["Tutorial.Wellbeing.SelectBeaver"]
new = "Chọn một hải ly và kiểm tra nhu cầu của nó"
status = "normal"

["Tutorial.Wellbeing.SetWorkingHours"]
new = "Hãy nhớ rằng hải ly cần thời gian rảnh để ăn, uống, ngủ và tận hưởng các điểm vui chơi trong khu định cư.\n                                    \nĐể tối đa hóa năng suất, bạn cần cân bằng hạnh phúc của lao động với giờ làm việc của họ.\n                                    \nTạm thời, hãy quay lại giờ làm việc mặc định."
status = "normal"

["Tutorial.Wellbeing.Shrub"]
new = "Hạnh phúc cũng tăng quanh đồ trang trí. Hải ly không chủ động đến gần chúng, nên hãy đặt đồ trang trí gần nơi cư dân hay lui tới.\n                          \nBụi cây là đồ trang trí đơn giản nhất, và hải ly trân trọng từng mảng xanh nhỏ."
status = "normal"

["Tutorial.Wellbeing.WellbeingPanel"]
new = "Với hải ly, cả xã hội mới là điều quan trọng. Bạn có thể thấy hạnh phúc trung bình của khu định cư ở góc trên bên trái màn hình.\n                                   \nNhấp vào đó để xem mức đáp ứng của mọi nhu cầu. Có nhiều cách để cuộc sống nơi hoang địa dễ chịu hơn."
status = "normal"

["Tutorial.Wood"]
