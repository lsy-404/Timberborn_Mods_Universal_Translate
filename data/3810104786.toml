plPL = "Gdy zapala się zielone światło, to znak dla Folkogonów, by się zgromadzili."
ptBR = "Quando o sinalizador verde é aceso, é o sinal para os Caudas-do-mato se reunirem."
koKR = "초록색 신호등이 켜지면 나무꼬리들이 모이라는 신호입니다."
csCZ = "Když se rozsvítí zelená lucerna, je to signál pro Folktails, aby se shromáždili."
viVN = "Khi đèn hiệu xanh được thắp sáng, đó là tín hiệu để tộc Folktails tập hợp."
trTR = "Yeşil ışık yakıldığında, Köykuyruklar için toplanma işaretidir."

["Building.Airlock.Description"]
new = "Cho phép hải ly đi qua trong khi vẫn ngăn được dòng nước"
status = "normal"
