["Tutorial.Dams.BuildDam"]
new = "Trữ nước trong bể giúp hải ly không bị khát, nhưng sinh tồn lâu dài phụ thuộc vào việc thuần hóa dòng nước.\n                        \nXây một hàng Đập chắn ngang con sông gần nhất, từ bờ này sang bờ kia, rồi quan sát điều xảy ra."
