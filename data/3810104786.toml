["Bot.BeaversPerished"]
status = "normal"
raw = "Đừng bắt tôi phải nói về lũ hải ly nữa.\nChúng từng có tất cả. Không khí trong lành, nước sạch.\nGiờ đây tất cả chỉ còn là ký ức mờ nhạt."
enUS = "Don't make me talk about the beavers again.\nThey once had everything. Fresh air, clean water.\nNow it's all just a distant memory."
zhCN = "别再让我提那些海狸了。\n它们曾拥有一切：清新的空气、干净的水。\n如今，这一切都只剩下模糊的记忆。"
zhTW = "別逼我再提那些海狸了。\n牠們曾經擁有一切。清新的空氣、潔淨的水。\n如今這一切都只剩模糊的回憶。"
ruRU = "Не заставляйте меня снова говорить о бобрах.\nКогда-то у них было всё: чистый воздух, чистая вода.\nТеперь всё это лишь смутное воспоминание."
jaJP = "ビーバーたちのことをこれ以上話させないでくれ。\nかつてはすべてを手にしていた。澄んだ空気、きれいな水。\n今ではすべてがかすかな記憶に過ぎない。"
frFR = "Ne me force pas à parler encore des castors.\nIls avaient tout. De l’air pur, de l’eau propre.\nÀ présent, tout cela n’est plus qu’un vague souvenir."
deDE = "Zwing mich nicht, noch einmal über die Biber zu sprechen.\nSie hatten einst alles. Frische Luft, sauberes Wasser.\nJetzt ist all das nur noch eine verblasste Erinnerung."
plPL = "Nie każ mi już mówić o bobrach.\nKiedyś miały wszystko. Czyste powietrze, czystą wodę.\nTeraz to wszystko jest już tylko mglistym wspomnieniem."
ptBR = "Não me faça falar dos castores de novo.\nEles já tiveram tudo. Ar puro, água limpa.\nAgora, tudo isso não passa de uma lembrança distante."
koKR = "비버 얘기는 더 이상 꺼내게 하지 마세요.\n비버들은 한때 모든 것을 누렸어요. 맑은 공기와 깨끗한 물도요.\n이제는 모두 희미한 기억으로만 남았어요."
csCZ = "Nenuť mě znovu mluvit o bobřích.\nKdysi měli všechno. Čistý vzduch, čistou vodu.\nTeď už je to jen mlhavá vzpomínka."
viVN = "Đừng bắt tôi phải nói về lũ hải ly nữa.\nChúng từng có tất cả. Không khí trong lành, nước sạch.\nGiờ đây tất cả chỉ còn là ký ức mờ nhạt."
trTR = "Beni kunduzlardan bahsetmeye zorlama artık.\nBir zamanlar her şeye sahiplerdi. Temiz hava, temiz su.\nŞimdiyse hepsi silik birer anıdan ibaret."

["Bot.Created"]
status = "normal"
