["Building.EfficientMine.FlavorDescription"]
status = "normal"
raw = "Iron Teeth chiếm ưu thế khi là hải ly đầu tiên khảo sát lòng đất."
enUS = "The Iron Teeth excel as the first beavers to explore underground."
zhCN = "铁牙在海狸中占据优势，因为他们是第一批勘探地下的海狸。"
zhTW = "鐵牙在探索地下方面佔了先機，是第一批勘察地下的海狸。"
ruRU = "Железные зубы превосходят остальных, ведь они первыми среди бобров исследовали подземные глубины."
jaJP = "地下を調査した最初のビーバーとして、アイアン・ティースが優位に立つ。"
frFR = "Les Dents de fer ont l’avantage d’être les premiers castors à explorer le sous-sol."
deDE = "Die Eisenzähne haben die Nase vorn, denn sie waren die ersten Biber, die den Untergrund erkundeten."
plPL = "Żelazozębni przodują jako pierwsze bobry badające podziemia."
ptBR = "Os Dentes de Ferro se destacam por serem os primeiros castores a explorar o subsolo."
koKR = "강철 이빨은 지하를 탐사한 최초의 비버로서 우위를 점합니다."
csCZ = "Železné zuby vynikají tím, že jako první bobři prozkoumali podzemí."
viVN = "Iron Teeth chiếm ưu thế với tư cách là những hải ly đầu tiên khảo sát lòng đất."
trTR = "Demir Dişler, yeraltını keşfeden ilk kunduzlar olarak üstünlük sağlıyor."

