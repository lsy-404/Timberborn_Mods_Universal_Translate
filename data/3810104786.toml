["Building.BreedingPod.FlavorDescription"]
status = "normal"
raw = "Đám nhóc lông lá này là tương lai của chúng ta. Tháng sau nhất định phải có thêm một đội bóng và một đứa dự bị nữa. —Ol' Kazko"
enUS = "These furry little rascals are our future. Next month, we absolutely need another team and one more sub. —Ol' Kazko"
zhCN = "这些毛茸茸的小家伙就是我们的未来。下个月一定要再组一支球队，还得再添一个替补。——老卡兹科"
zhTW = "這些毛茸茸的小傢伙就是我們的未來。下個月一定要再多一支球隊，還要再多一個候補。——老卡茲科"
ruRU = "Эти мохнатые малыши — наше будущее. В следующем месяце у нас непременно должна появиться ещё одна футбольная команда и ещё один запасной. —Ол’ Казко"
jaJP = "この毛むくじゃらの子たちが、私たちの未来だ。来月は必ず、サッカーチームをもう1つと補欠を1人増やさなければ。—オル・カズコ"
frFR = "Ces petits tas de poils sont notre avenir. Le mois prochain, il nous faudra absolument une équipe de foot en plus et un remplaçant. —Ol' Kazko"
deDE = "Diese kleinen Fellknäuel sind unsere Zukunft. Nächsten Monat muss es unbedingt noch ein Fußballteam und einen Ersatzspieler mehr geben. —Ol' Kazko"
plPL = "Te futrzaste maluchy to nasza przyszłość. W przyszłym miesiącu musimy mieć jeszcze jedną drużynę i jednego rezerwowego. —Ol' Kazko"
ptBR = "Esses pequenos peludos são o nosso futuro. No mês que vem, tem que ter mais um time de futebol e mais um reserva. —Ol' Kazko"
koKR = "이 털북숭이 꼬마들이 우리의 미래야. 다음 달에는 축구팀 하나와 후보 선수 한 명이 꼭 더 있어야 해. —올 카즈코"
csCZ = "Tihle chlupáči jsou naše budoucnost. Příští měsíc musíme mít další fotbalový tým a ještě jednoho náhradníka. —Ol' Kazko"
viVN = "Đám nhóc lông lá này là tương lai của chúng ta. Tháng sau nhất định phải có thêm một đội bóng và một đứa dự bị nữa. —Ol' Kazko"
