["Building.TappersShack.FlavorDescription"]
status = "normal"
raw = "Những hải ly con sớm được dạy rằng mỗi giọt nước đều quan trọng —dù là nước hay nhựa cây."
enUS = "Young beavers are taught early that every drop matters—whether it's water or resin."
zhCN = "小海狸们很早就被教导，每一滴水都很重要——无论是水还是树液。"
zhTW = "小海狸們很早就被教導，每一滴水都很重要——無論是水還是樹液。"
ruRU = "Маленьких бобров с ранних лет учат, что важна каждая капля — будь то вода или смола."
jaJP = "幼いビーバーたちは、水であれ樹液であれ、一滴一滴が大切だと早くから教わる。"
frFR = "Les jeunes castors apprennent très tôt que chaque goutte compte, qu’il s’agisse d’eau ou de résine."
deDE = "Junge Biber lernen schon früh, dass jeder Tropfen zählt – egal, ob Wasser oder Harz."
plPL = "Młode bobry szybko uczą się, że każda kropla jest ważna — czy to wody, czy żywicy."
ptBR = "Os castores jovens aprendem desde cedo que cada gota importa — seja de água ou de seiva."
koKR = "어린 비버들은 물이든 수액이든 물 한 방울도 소중하다는 것을 일찍부터 배웁니다."
csCZ = "Mladí bobři se brzy učí, že každá kapka se počítá — ať už je to voda, nebo míza."
viVN = "Những hải ly con sớm được dạy rằng mỗi giọt đều quý giá — dù là nước hay nhựa cây."
trTR = "Genç kunduzlara her damlanın önemli olduğu erkenden öğretilir — ister su ister özsu olsun."

