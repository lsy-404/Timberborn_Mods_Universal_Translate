["Building.DistrictCrossing.Description"]
status = "normal"
raw = "Cân bằng hàng hóa giữa hai khu vực được kết nối. Mỗi bên đều có hải ly lao động riêng vận chuyển hàng hóa giữa Trạm Kết Nối Khu Vực và phần còn lại của khu vực."
enUS = "Balances goods between two connected districts. Each side has its own beavers who transport goods between the District Crossing and the rest of the district."
zhCN = "平衡两个相连区域之间的货物。两侧都有各自的海狸工人，在区域连接站与区域的其他部分之间运输货物。"
zhTW = "平衡兩個相連區域之間的貨物。每一側都有自己的海狸工人，負責在區域連接站與該區域其他部分之間運送貨物。"
ruRU = "Балансирует товары между двумя соединёнными районами. В каждом районе есть свои бобры-работники, которые перевозят товары между станцией межрайонного перехода и остальной частью района."
jaJP = "接続された2つの地区間で物資のバランスを取ります。各地区には専属のビーバーがいて、地区間接続所と地区の他の場所との間で物資を運びます。"
frFR = "Équilibre les marchandises entre deux districts connectés. Chaque côté dispose de ses propres castors travailleurs qui transportent les marchandises entre le point de passage interdistricts et le reste du district."
deDE = "Gleicht Waren zwischen zwei verbundenen Bezirken aus. Jede Seite hat eigene Biberarbeiter, die Waren zwischen dem Bezirksübergang und dem übrigen Bezirk transportieren."
plPL = "Równoważy towary między dwoma połączonymi obszarami. Każda strona ma własne pracujące bobry, które transportują towary między stacją łączącą obszary a resztą danego obszaru."
ptBR = "Equilibra os bens entre duas áreas conectadas. Cada lado tem seus próprios castores trabalhadores, que transportam bens entre a Estação de Conexão entre Distritos e o restante do distrito."
koKR = "연결된 두 구역 간에 물자를 균형 있게 분배합니다. 각 구역에는 구역 연결소와 구역 내 다른 곳 사이로 물자를 운반하는 전담 비버 일꾼이 있습니다."
csCZ = "Vyvažuje zboží mezi dvěma propojenými oblastmi. Každá strana má vlastní pracující bobry, kteří přepravují zboží mezi Spojovací stanicí oblastí a zbytkem oblasti."
viVN = "Cân bằng hàng hóa giữa hai khu vực được kết nối. Mỗi bên có hải ly lao động riêng vận chuyển hàng hóa giữa Trạm Kết Nối Khu Vực và phần còn lại của khu vực."
trTR = "Birbirine bağlı iki bölge arasındaki malları dengeler. Her iki tarafın da, Bölge Bağlantı İstasyonu ile bölgenin geri kalanı arasında mal taşıyan kendi işçi kunduzları vardır."

