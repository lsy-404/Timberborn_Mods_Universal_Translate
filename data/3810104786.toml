["Tutorial.Wood.ConnectLumberjacks"]
new = "Mọi công trình có lối vào phải được nối với Trung tâm khu bằng Đường đi. Khi chọn công trình, bạn sẽ thấy lối vào được đánh dấu bằng mũi tên.\n                                  \nXây Đường đi để nối các Cờ tiều phu với Trung tâm khu."
status = "normal"

["Tutorial.Wood.FinishLumberjacks"]
new = "Các Cờ sẽ không được xây nếu nằm ngoài phạm vi xây dựng của khu.\n                                 \nChọn Trung tâm khu để xem phạm vi xây dựng. Bạn có thể mở rộng nó bằng cách nối Đường đi với lối vào Trung tâm khu."
status = "normal"

["Tutorial.Wood.MarkTrees"]
new = "Tiều phu chỉ chặt cây ở khu vực bạn đánh dấu để chặt.\n                         \nCây phải nằm trong phạm vi Cờ tiều phu. Chọn một cờ để xem phạm vi.\n                         \nGiờ hãy dùng công cụ Đánh dấu khu vực chặt cây. Giữ nút chuột để chọn nhiều ô cùng lúc."
status = "normal"

["Tutorial.Wood.PlaceLumberjacks"]
new = "Mọi khu định cư hải ly đều cần Gỗ khúc, rất nhiều là đằng khác. Chỉ tiều phu mới chặt cây. \n                                \nXây Cờ tiều phu cạnh các cây gần đó."
status = "normal"

["Tutorial.WorkingHours"]
new = "Giờ làm việc"
status = "normal"

["Tutorial.WorkingHours.SetWorkingHours"]
new = "Điều chỉnh giờ làm việc là một cách quản lý khu định cư.\n                                       \nNgày làm việc dài hơn giúp tiến độ nhanh hơn, nhưng mỗi tối hải ly cần thời gian thư giãn và ngủ. Đừng ép chúng quá sức quá lâu.\n                                       \nTạm thời, hãy tăng giờ làm việc lên một chút."
