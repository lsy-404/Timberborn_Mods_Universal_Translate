["Building.EfficientFarmhouse.FlavorDescription"]
status = "normal"
raw = "Hiệu suất phụ thuộc vào chính sách không ăn khi làm việc."
enUS = "Efficiency depends on the no eating while working policy."
zhCN = "效率取决于工作时不进食的政策。"
zhTW = "效率取決於工作時不進食的政策。"
ruRU = "Эффективность зависит от политики, запрещающей есть во время работы."
jaJP = "作業中は食事をしない方針に、効率は左右される。"
frFR = "L’efficacité dépend de la politique interdisant de manger pendant le travail."
