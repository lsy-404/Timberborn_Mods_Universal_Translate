["Experimental.Header"]
new = "<RedHighlight>Thông tin Chế độ Thử nghiệm</RedHighlight>"
status = "normal"

["Experimental.WelcomeText"]
new = "Phiên bản này của Timberborn cho phép bạn truy cập vào các tính năng thử nghiệm, chưa hoàn thành. Vì vậy, nó cũng có khả năng cao hơn sẽ gặp phải lỗi nghiêm trọng. Bạn là một hải ly dũng cảm thực sự.\n\nLưu trữ thử nghiệm được lưu riêng biệt với trò chơi chính. Các bản cập nhật có thể sẽ làm hỏng tính tương thích với các bản lưu.\n\nTrong Chế độ Thử nghiệm này, <RedHighlight>nhiều phần của trò chơi không được dịch và hiển thị bằng tiếng Anh</RedHighlight>, bất kể bạn đã chọn ngôn ngữ gì. Điều này giúp chúng tôi thêm nội dung mới và thực hiện các thay đổi nhanh chóng mà không phải chờ đợi việc dịch thuật tốn thời gian.\n\nChúng tôi rất khuyến khích bạn tham gia vào máy chủ Discord chính thức của chúng tôi và tham gia thảo luận về nội dung mới."
status = "normal"

["Explosions.BlownInExplosionMessage"]
