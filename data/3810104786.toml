["Tutorial.Introduction.Description"]
new = "Chào mừng đến với Timberborn! Hướng dẫn này sẽ giúp bạn đặt chân vào hoang địa và sống sót qua những ngày đầu.\n                                   \nBạn sẽ học cách dùng các công cụ cần thiết để xây dựng một cộng đồng hải ly thịnh vượng.\n                                   \nKhi bạn tiến qua các bước tiếp theo, mẹo sẽ xuất hiện tại đây."
status = "normal"

["Tutorial.LayerTool.ChangeUsingMouse"]
new = "Bạn có thể điều khiển lớp hiển thị mà không cần bấm nút bằng các phím tắt tùy chỉnh.\n                                     \nNhiều hành động khác cũng có phím tắt. Bạn có thể xem chúng trong tooltip hoặc menu Cài đặt."
