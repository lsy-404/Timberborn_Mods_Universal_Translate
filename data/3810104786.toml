status = "normal"

["Faction.IronTeeth.WonderCompletionFlavor"]
new = "Những hải ly tiên phong của bạn đã bay đi qua vùng đất hoang tàn, để lại phía sau một khu định cư đang phát triển. Nếu Trái Đất muốn phục hồi, sự thịnh vượng mới của hải ly cần được chia sẻ."
