zhCN = "一道由树枝和散石构成的屏障，可以阻挡水流。必须建在水中。"
zhTW = "由樹枝和散落石塊構成、能阻擋水流的屏障。必須建在水中。"
ruRU = "Преграда из веток и рыхлых камней, блокирующая воду. Должна быть построена в воде."
jaJP = "水をせき止める、小枝とばら石の障壁。水中に建設する必要があります。"
frFR = "Une barrière faite de brindilles et de pierres non taillées qui bloque l’eau. Doit être construite dans l’eau."
deDE = "Eine Barriere aus Zweigen und losen Steinen, die Wasser zurückhält. Muss im Wasser gebaut werden."
plPL = "Bariera z gałązek i luźnych kamieni, która blokuje wodę. Musi być zbudowana w wodzie."
ptBR = "Uma barreira de gravetos e pedras soltas que bloqueia a água. Deve ser construída na água."
koKR = "물의 흐름을 막는 나뭇가지와 자갈로 만든 장벽입니다. 물속에 지어야 합니다."
trTR = "Suyu engelleyen, dallar ve gevşek taşlardan yapılmış bir bariyer. Suyun içinde inşa edilmelidir."
esES = "Una barrera de ramitas y piedras sueltas que bloquea el agua. Debe construirse en el agua."
itIT = "Una barriera di rametti e pietre sciolte che blocca l'acqua. Deve essere costruita in acqua."
ukUA = "Загорожа з гілок і пухкого каміння, що перегороджує воду. Має бути побудована у воді."
thTH = "สิ่งกีดขวางที่ทำจากกิ่งไม้และก้อนหินหลวมๆ ใช้กั้นน้ำ ต้องสร้างอยู่ในน้ำเท่านั้น"
csCZ = "Překážka z větví a volných kamenů, která zadržuje vodu. Musí být postavena ve vodě."
viVN = "Một rào chắn bằng cành cây và đá rời để chặn nước. Phải xây dựng dưới nước."
caES = "Una barrera de branquetes i pedres soltes que bloqueja l'aigua. S'ha de construir dins de l'aigua."
beBY = "Загародка з галінак і рыхлых камянёў, якая блакуе ваду. Павінна будавацца ў вадзе."
roRO = "O barieră din crengi și pietre libere care blochează apa. Trebuie construită în apă."
huHU = "Gallyakból és laza kövekből készült akadály, amely blokkolja a vizet. Vízben kell építeni."
arSA = "حاجز من الأغصان والحجارة السائبة يحجب المياه. يجب بناؤه داخل الماء."

["Building.NaturalDam.Tidetails.Description"]
raw = "A barrier of mud and branches that holds water just below its top. Must be built in water."
status = "normal"
enUS = "A barrier made of mud and branches that holds water just below its top. Must be built in water."
zhCN = "一道由泥土和树枝构成的屏障，可将水位保持在略低于其顶部的位置。必须建在水中。"
zhTW = "由泥土和樹枝構成的屏障，可將水位維持在略低於頂端的位置。必須建在水中。"
ruRU = "Преграда из грязи и веток, удерживающая воду чуть ниже своего верха. Должна строиться в воде."
jaJP = "泥と枝でできた、水を頂部のすぐ下までせき止める障壁。水中に建設する必要があります。"
frFR = "Une barrière de boue et de branches qui retient l’eau juste en dessous de son sommet. Doit être construite dans l’eau."
deDE = "Eine Barriere aus Schlamm und Ästen, die das Wasser knapp unter ihrer Oberkante zurückhält. Muss im Wasser gebaut werden."
plPL = "Bariera z błota i gałęzi, która utrzymuje wodę tuż poniżej swojej górnej krawędzi. Musi być zbudowana w wodzie."
ptBR = "Uma barreira de lama e galhos que retém a água logo abaixo do topo. Deve ser construída na água."
koKR = "물의 수위가 꼭대기 바로 아래까지 차오르도록 막는 진흙과 나뭇가지로 된 구조물입니다. 물속에 지어야 합니다."
trTR = "Suyu tepesinin hemen altına kadar tutan çamur ve dallardan oluşan bir bariyer. Suya inşa edilmelidir."
esES = "Una barrera de barro y ramas que retiene el agua justo por debajo de su parte superior. Debe construirse en el agua."
itIT = "Una barriera di fango e rami che trattiene l'acqua appena sotto la sua sommità. Deve essere costruita nell'acqua."
ukUA = "Загорода з бруду й гілок, що утримує воду трохи нижче свого верхнього краю. Має бути побудована у воді."
thTH = "สิ่งกีดขวางที่ทำจากโคลนและกิ่งไม้ ซึ่งกักเก็บน้ำไว้เกือบถึงระดับยอดของมัน ต้องสร้างในน้ำเท่านั้น"
csCZ = "Překážka z bláta a větví, která zadržuje vodu těsně pod svým vrcholem. Musí být postavena ve vodě."
viVN = "Một đập chắn bằng bùn và cành cây, giữ nước ngay dưới mép trên. Phải được xây trong nước."
caES = "Una barrera de fang i branques que reté l'aigua just per sota del seu cim. S'ha de construir dins de l'aigua."
beBY = "Гразевая і галлёвая перашкода, якая ўтрымлівае ваду крыху ніжэй за сваю вяршыню. Павінна будавацца ў вадзе."
roRO = "O barieră din noroi și crengi care reține apa chiar sub partea sa superioară. Trebuie construită în apă."
huHU = "Sár és ágak alkotta gát, amely a teteje alatt közvetlenül tartja vissza a vizet. Vízben kell építeni."
arSA = "حاجز من الطين والأغصان يحبس الماء أسفل قمته بقليل. يجب بناؤه داخل الماء."

