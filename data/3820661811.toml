["Building.MudSlide.Tidetails.Description"]
raw = "A muddy ramp worn into the bank, leading up from the water. Must start in water, on a Mud Block, or on a wetland."
status = "normal"
enUS = "A muddy ramp worn into the bank, leading up from the water. Must start in water, on a Mud Block, or on a wetland."
zhCN = "在河岸上冲刷形成的泥泞斜坡，可从水中向上攀行。必须从水中、泥土方块或湿地上开始。"
zhTW = "在河岸上踩踏而成的泥濘坡道，從水中向上延伸。起點必須在水中、泥土方塊上，或濕地上。"
ruRU = "Грязный скат, протоптанный в берегу и ведущий вверх от воды. Должен начинаться в воде, на блоке грязи или на заболоченном участке."
jaJP = "水辺に刻まれた泥の坂道で、水から上へ続く。水中、Mud Block上、または湿地に設置を開始する必要がある。"
frFR = "Une rampe boueuse creusée dans la berge, qui remonte depuis l’eau. Doit commencer dans l’eau, sur un bloc de boue ou dans une zone humide."
deDE = "Ein schlammiger Pfad, der sich in den Uferhang gegraben hat und vom Wasser nach oben führt. Muss im Wasser, auf einem Schlammblock oder in einem Feuchtgebiet beginnen."
plPL = "Błotnista rampa wydeptana w brzegu, prowadząca w górę od wody. Musi zaczynać się w wodzie, na bloku błota lub na mokradle."
ptBR = "Uma rampa lamacenta aberta na margem, que sobe a partir da água. Deve começar na água, sobre um Bloco de Lama ou em uma área alagadiça."
koKR = "강둑에 난 진흙 경사로로, 물에서 위로 이어집니다. 물속, 진흙 블록 위 또는 습지에 시작해야 합니다."
trTR = "Kıyıya oyularak oluşmuş, sudan yukarı çıkan çamurlu bir rampa. Suda, Çamur Bloğu üzerinde veya sulak alanda başlamalı."
esES = "Una rampa embarrada desgastada en la orilla, que sube desde el agua. Debe empezar en el agua, en un bloque de barro o en un humedal."
itIT = "Una rampa fangosa scavata nella sponda, che sale dall'acqua. Deve iniziare nell'acqua, su un Blocco di Fango o su una zona umida."
ukUA = "Багнистий схил, протоптаний у березі, що веде вгору від води. Має починатися у воді, на багнистому блоці або на водно-болотистій ділянці."
thTH = "ทางลาดโคลนที่สึกกร่อนลงบนฝั่ง ทอดขึ้นจากน้ำ ต้องเริ่มต้นในน้ำ บนบล็อกโคลน หรือบนพื้นที่ชุ่มน้ำ"
csCZ = "Blátivá rampa vyhloubená do břehu, stoupající od vody. Musí začínat ve vodě, na bloku bahna nebo v mokřadu."
viVN = "Một con dốc lầy lội bị nước bào mòn trên bờ, dẫn lên từ mặt nước. Phải bắt đầu trong nước, trên Khối Bùn hoặc trên vùng đất ngập nước."
caES = "Una rampa fangosa desgastada a la vora, que puja des de l'aigua. Ha de començar a l'aigua, sobre un bloc de fang o en una zona humida."
beBY = "Гразкі пандус, пратаптаны ў беразе і вядзе ад вады ўверх. Павінен пачынацца ў вадзе, на Гразяным блоку або на балоце."
roRO = "O rampă noroioasă săpată în mal, care urcă din apă. Trebuie să înceapă în apă, pe un bloc de noroi sau pe un teren umed."
huHU = "A partfalba vágott, sáros rámpa, amely a vízből vezet fel. Vízben, Sárfalon vagy mocsárföldön kell kezdődnie."
arSA = "منحدر طيني متآكل في الضفة، يمتد صعودًا من الماء. يجب أن يبدأ من الماء، أو من كتلة طينية، أو من أرض رطبة."

["Building.MudSlide.Tidetails.FlavorDescription"]
raw = "Real beavers drag logs down these. Tidetails also use them to go up."
status = "normal"
enUS = "Real beavers drag logs down these. Tidetails also use them to go up."
zhCN = "真正的海狸会沿着这些滑道拖运原木。潮尾族也会用它们往上走。"
zhTW = "真正的海狸會沿著這些地方把原木拖下去。潮尾也會利用它們往上走。"
ruRU = "Настоящие бобры спускают по ним брёвна. Хвостокрылые тоже используют их, чтобы подниматься."
jaJP = "本物のビーバーは丸太をこれで引きずり下ろす。ティーデイルもこれを使って上る。"
frFR = "Les vrais castors traînent des rondins en les faisant glisser vers le bas. Les Rustiqueues les utilisent aussi pour monter."
deDE = "Echte Biber ziehen Baumstämme diese hinunter. Auch Tidetails nutzen sie, um hinaufzukommen."
plPL = "Prawdziwe bobry ciągną po nich kłody w dół. Tidetails używają ich również do wspinania się."
ptBR = "Castores de verdade arrastam troncos por elas. Os Caudas de Maré também as usam para subir."
koKR = "진짜 비버들은 이곳으로 통나무를 끌고 내려옵니다. 조수꼬리들은 올라갈 때도 이곳을 이용합니다."
trTR = "Gerçek kunduzlar kütükleri bu rampalardan aşağı sürükler. Tidetails'lar da yukarı çıkmak için bunları kullanır."
esES = "Los castores de verdad arrastran troncos por ellos. Los Tidetails también los usan para subir."
itIT = "I veri castori trascinano giù i tronchi lungo questi scivoli. Anche i Tidetails li usano per risalire."
ukUA = "Справжні бобри спускають по них колоди вниз. Tidetails також використовують їх, щоб підніматися вгору."
thTH = "บีเวอร์ตัวจริงใช้ทางลื่นโคลนพวกนี้ลากท่อนซุงลงมา ส่วน Tidetails ก็ใช้มันไต่ขึ้นไปด้วยเช่นกัน"
csCZ = "Skuteční bobři po nich tahají klády dolů. Tidetailové je také používají k cestě nahoru."
viVN = "Hải ly thật kéo khúc gỗ xuống những chỗ này. Tidetails cũng dùng chúng để đi lên."
caES = "Els castors de veritat arrosseguen troncs per aquests. Els Tidetails també els fan servir per pujar."
beBY = "Сапраўдныя бабры спускаюць па іх брёўны ўніз. Прыліўцы таксама выкарыстоўваюць іх, каб падымацца ўверх."
