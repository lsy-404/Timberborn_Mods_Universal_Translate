["Building.RomanceRetreat.Tidetails.FlavorDescription"]
raw = "What happens inside stays inside. The windows are boarded for a reason."
status = "normal"
enUS = "What happens inside stays inside. The windows are boarded up for a reason."
zhCN = "里面发生的一切都留在里面。窗户被封起来是有原因的。"
zhTW = "裡面發生的事，就留在裡面。窗戶封起來是有原因的。"
ruRU = "Что происходит внутри, там и остаётся. Окна заколочены не просто так."
jaJP = "中で起きたことは、中だけにとどまる。窓が板で塞がれているのには理由がある。"
frFR = "Ce qui se passe à l’intérieur reste à l’intérieur. Les fenêtres sont barricadées pour une bonne raison."
deDE = "Was drinnen passiert, bleibt drinnen. Die Fenster sind nicht ohne Grund vernagelt."
plPL = "Co dzieje się w środku, zostaje w środku. Okna zabito deskami nie bez powodu."
ptBR = "O que acontece lá dentro fica lá dentro. As janelas estão tapadas por um motivo."
koKR = "안에서 벌어진 일은 안에만 머문다. 창문을 판자로 막아 둔 데는 다 이유가 있다."
csCZ = "Co se děje uvnitř, zůstane uvnitř. Ta okna jsou zabedněná z nějakého důvodu."
viVN = "Chuyện gì xảy ra bên trong thì cứ ở yên bên trong. Cửa sổ bị đóng ván vì có lý do cả."
trTR = "İçeride olan içeride kalır. Pencereler boşuna tahtalarla kapatılmadı."
