["Building.MudBlock.Tidetails.Description"]
raw = "A packed lump of mud. Must be built in water, on a wetland, or on another Mud Block. Only Mud Slides and Mud Blocks can be built on top of it."
status = "normal"
enUS = "A packed lump of mud. Must be built in water, on a wetland, or on another Mud Block. Only Mud Slides and Mud Blocks can be built on top of it."
zhCN = "一块压实的泥土。必须建在水中、湿地上或另一块泥块上。其上只能建造泥滑坡和泥块。"
zhTW = "一團壓實的泥土。必須建在水中、濕地上，或另一個泥土方塊上。上方只能建造泥漿滑道和泥土方塊。"
ruRU = "Плотно слежавшийся ком грязи. Должен быть построен в воде, на заболоченной местности или на другом Грязевом блоке. Сверху него можно строить только Грязевые горки и Грязевые блоки."
jaJP = "圧縮された泥の塊。水中、湿地、または別の泥ブロックの上に建設する必要があります。この上に建設できるのは、泥の滑り台と泥ブロックのみです。"
frFR = "Un bloc de boue compactée. Doit être construit dans l’eau, sur une zone humide ou sur un autre bloc de boue. Seuls les toboggans de boue et les blocs de boue peuvent être construits dessus."
deDE = "Ein verdichteter Klumpen Schlamm. Muss im Wasser, auf einem Feuchtgebiet oder auf einem anderen Schlammblock gebaut werden. Darauf können nur Schlammrutschen und Schlammblöcke gebaut werden."
plPL = "Ubita bryła błota. Musi być zbudowana w wodzie, na mokradle lub na innym bloku błota. Można na niej budować tylko zjeżdżalnie błotne i bloki błota."
ptBR = "Um bloco compactado de lama. Deve ser construído na água, em uma área alagada ou sobre outro Bloco de Lama. Somente Escorregadores de Lama e Blocos de Lama podem ser construídos sobre ele."
koKR = "다져진 진흙 덩어리입니다. 물속, 습지 또는 다른 진흙 블록 위에 건설해야 합니다. 위에는 진흙 미끄럼틀과 진흙 블록만 건설할 수 있습니다."
trTR = "Sıkıştırılmış bir çamur yığını. Suya, sulak alana veya başka bir Çamur Bloğunun üzerine inşa edilmelidir. Üzerine yalnızca Çamur Kaydırakları ve Çamur Blokları inşa edilebilir."
esES = "Un trozo compacto de barro. Debe construirse en el agua, en un humedal o sobre otro bloque de barro. Solo se pueden construir Deslizamientos de barro y Bloques de barro encima de él."
itIT = "Un blocco di fango compatto. Deve essere costruito in acqua, su una palude o su un altro Blocco di Fango. Sopra di esso possono essere costruiti solo Scivoli di Fango e Blocchi di Fango."
ukUA = "Щільно скупчена грудка багнюки. Має бути побудована у воді, на болоті або на іншому Багнистому блоці. На ній можна будувати лише Багнисті гірки та Багнисті блоки."
thTH = "ก้อนโคลนอัดแน่น ต้องสร้างในน้ำ บนพื้นที่ชุ่มน้ำ หรือบนบล็อกโคลนอีกชิ้นหนึ่ง สามารถสร้างสิ่งก่อสร้างบนบล็อกนี้ได้เฉพาะสไลด์โคลนและบล็อกโคลนเท่านั้น"
csCZ = "Udusaná hrouda bláta. Musí být postavena ve vodě, na mokřadu nebo na jiném blátivém bloku. Stavět na ní lze pouze blátivé skluzavky a blátivé bloky."
viVN = "Một khối bùn nén chặt. Phải được xây trong nước, trên vùng đất ngập nước hoặc trên một Khối Bùn khác. Chỉ có thể xây Đường Trượt Bùn và Khối Bùn bên trên nó."
caES = "Un bloc de fang compacte. S'ha de construir dins l'aigua, sobre un aiguamoll o sobre un altre bloc de fang. Només es poden construir Lliscadors de fang i Blocs de fang a sobre seu."
beBY = "Шчыльны камяк балота. Павінен быць пабудаваны ў вадзе, на забалочаным участку або на іншым Мулістым блоку. На яго можна будаваць толькі Мулістыя горкі і Мулістыя блокі."
roRO = "Un bulgăre de noroi compactat. Trebuie construit în apă, pe o zonă mlăștinoasă sau pe alt Bloc de noroi. Pe deasupra lui pot fi construite doar Alunecări de noroi și Blocuri de noroi."
huHU = "Tömörített sárdarab. Vízben, vizes élőhelyen vagy egy másik Sárblokkon kell megépíteni. Rajta csak Sárcsúszdák és Sárblokkok építhetők."
arSA = "كتلة طينية مضغوطة. يجب بناؤها في الماء أو على أرض رطبة أو على كتلة طين أخرى. ولا يمكن بناء سوى منزلقات الطين وكتل الطين فوقها."

