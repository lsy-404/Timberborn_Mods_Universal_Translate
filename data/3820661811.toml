["Building.DeepWaterPump.Tidetails.Description"]
raw = "Pumps drinkable water, badwater, or both. Choose the output like a Deep Mechanical Pump. Extracting only water still slows as contamination rises. Partially Solid: the main building blocks water, and its two flat tiles can be walked on or carry a path."
status = "normal"
enUS = "Pumps drinkable water, badwater, or both. Choose the output like a Deep Mechanical Pump. Extracting only water still slows as contamination rises. Partially Solid: the main building blocks water, and its two flat tiles can be walked on or carry a path."
zhCN = "抽取饮用水、恶水或两者。像深层机械水泵一样选择输出类型。即使只抽取水，抽取速度也会随着污染加重而降低。部分固体：主体建筑会阻挡水流，其两块平坦的地砖可供行走或铺设道路。"
zhTW = "抽取可飲用水、污水或兩者。像深層機械水泵一樣選擇輸出。即使只抽取水，抽取速度也會隨污染程度升高而減慢。部分實心：主建築會阻擋水流，兩塊平坦的地磚可供行走或鋪設道路。"
ruRU = "Перекачивает питьевую воду, плохую воду или и то и другое. Выберите тип выхода, как у глубинного механического насоса. Даже если откачивается только вода, её добыча замедляется по мере роста загрязнения. Частично твёрдая постройка: основное здание блокирует воду, а по двум плоским плиткам можно ходить и прокладывать дорожки."
jaJP = "飲用水、汚染水、またはその両方を汲み上げます。深層機械式ポンプのように、出力を選択してください。水だけを汲み上げる場合でも、汚染度が上がると速度が低下します。一部固体：本体は水をせき止め、2つの平らなタイルは歩行したり、道を敷いたりできます。"
frFR = "Pompe l’eau potable, l’eau contaminée, ou les deux. Choisissez la sortie comme pour une pompe mécanique profonde. Même si elle extrait uniquement de l’eau, son débit ralentit à mesure que la contamination augmente. Partiellement solide : le bâtiment principal bloque l’eau, et ses deux tuiles plates peuvent être parcourues à pied ou accueillir un chemin."
deDE = "Pumpt Trinkwasser, Badwasser oder beides. Wähle den Auslass wie bei einer Tiefenmechanischen Pumpe. Auch wenn nur Wasser entnommen wird, verlangsamt sich das Pumpen mit zunehmender Verschmutzung. Teilweise fest: Das Hauptgebäude blockiert Wasser, und die beiden flachen Felder können begangen werden oder einen Pfad tragen."
plPL = "Pompuje wodę pitną, złowodę lub oba rodzaje. Wybierz rodzaj odpływu tak jak w przypadku Głębokiej pompy mechanicznej. Wydobywanie samej wody nadal spowalnia wraz ze wzrostem zanieczyszczenia. Częściowo solidna: główna część budynku blokuje wodę, a po dwóch płaskich kafelkach można chodzić lub poprowadzić ścieżkę."
ptBR = "Bombeia água potável, água contaminada ou ambas. Escolha a saída como em uma Bomba Mecânica Profunda. Extrair somente água ainda fica mais lento à medida que a contaminação aumenta. Parcialmente sólido: o edifício principal bloqueia a água, e seus dois blocos planos podem ser atravessados a pé ou receber um caminho."
koKR = "식수, 오염수 또는 둘 다를 퍼 올립니다. 심층 기계식 펌프처럼 배출할 물을 선택하세요. 물만 추출하더라도 오염도가 높아지면 속도가 느려집니다. 부분 고체: 본체가 물의 흐름을 막으며, 평평한 타일 두 칸은 보행하거나 길을 놓는 데 사용할 수 있습니다."
csCZ = "Čerpá pitnou vodu, zkaženou vodu nebo obojí. Výstup vyberte stejně jako u hlubinného mechanického čerpadla. Čerpání pouze vody se při rostoucí kontaminaci stále zpomaluje. Částečně pevná: hlavní budova blokuje vodu a po jejích dvou plochých dlaždicích lze chodit nebo na ně umístit cestu."
viVN = "Bơm nước uống được, nước ô nhiễm hoặc cả hai. Chọn đầu ra như với Máy bơm cơ khí sâu. Ngay cả khi chỉ khai thác nước, tốc độ vẫn giảm khi mức độ ô nhiễm tăng. Bán phần đặc: công trình chính chặn nước, còn hai ô phẳng của nó có thể đi bộ qua hoặc đặt đường đi."
trTR = "İçilebilir su, kötü su ya da her ikisini pompalar. Çıkışı Derin Mekanik Pompa'daki gibi seçin. Yalnızca su çıkarırken bile, kirlilik arttıkça pompalama yavaşlar. Kısmen Katı: ana bina suyu engeller; iki düz karosunun üzerinde yürünebilir veya bunlara yol döşenebilir."

