itIT = "Prosciugato. L'acqua attorno all'ingresso è sparita, quindi i Tidetails non useranno questo edificio."
ukUA = "Висохло. Вода навколо входу зникла, тож Tidetails не використовуватимуть цю будівлю."
thTH = "แห้งแล้ง น้ำรอบทางเข้าหายไปแล้ว ดังนั้น Tidetails จะไม่ใช้อาคารนี้"
csCZ = "Vyschlo. Voda kolem vchodu zmizela, takže Tidetails tuto budovu nebudou používat."
viVN = "Đã cạn khô. Nước quanh lối vào đã biến mất, nên Tidetails sẽ không sử dụng công trình này."
caES = "Assecat. L'aigua de l'entrada ha desaparegut, així que els Tidetails no faran servir aquest edifici."
