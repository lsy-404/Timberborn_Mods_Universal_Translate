["Building.RomanceRetreat.Tidetails.Description"]
raw = "A private lodge for two adult beavers. While berries and water are stocked, adults with Romance at 0 or below come by, and at rock bottom they leave work to go. When the second adult arrives the stock is used up, and Romance fills only while both are inside. When both are full they leave together with a kit."
status = "normal"
enUS = "A private lodge for two adult beavers. When berries and water are stocked, adults with Romance at 0 or below come by, and at rock bottom they leave work to go there. When the second adult arrives, the supplies are used up, and Romance increases only while both are inside. When both are full, they leave together with a kit."
zhCN = "供两只成年海狸使用的私人小屋。储备有浆果和水时，浪漫值为 0 或更低的成年海狸会前来；浪漫值降至最低时，它们会放下工作前往小屋。第二只成年海狸到达时，储备会耗尽；只有两只海狸都在屋内时，浪漫值才会增长。两只海狸的浪漫值都满后，它们会一起离开，并带着一只幼崽。"
zhTW = "供兩隻成年海狸使用的私人小屋。備妥莓果和水後，浪漫值為 0 或更低的成年海狸會前來；浪漫值降至最低時，牠們會放下工作前往小屋。第二隻成年海狸抵達時，存貨就會用完；只有兩隻海狸都在屋內時，浪漫值才會提升。兩隻海狸的浪漫值都滿了後，牠們會一起離開，並帶著一隻幼崽。"
ruRU = "Уединённое жилище для двух взрослых бобров. Пока в нём есть ягоды и вода, сюда приходят взрослые с уровнем романтики 0 или ниже, а при самом низком уровне они бросают работу и идут сюда. Когда приходит второй взрослый, запасы расходуются, а уровень романтики повышается только пока оба находятся внутри. Когда уровень романтики у обоих достигает максимума, они вместе выходят с бобрёнком."
jaJP = "成獣のビーバー2匹専用のロッジ。ベリーと水が補充されている間、ロマンス度が0以下の成獣が訪れ、どん底になると仕事を離れて向かう。2匹目が到着すると備蓄が消費され、ロマンス度は2匹とも中にいる間だけ上昇する。2匹とも満タンになると、一緒に子どもを連れて出ていく。"
frFR = "Un pavillon privé pour deux castors adultes. Tant que des baies et de l’eau sont en réserve, les adultes dont la Romance est à 0 ou moins viennent, et ceux qui sont au plus bas quittent leur travail pour s’y rendre. À l’arrivée du deuxième adulte, les réserves sont consommées, et la Romance ne se remplit que lorsque les deux sont à l’intérieur. Lorsqu’ils sont tous deux au maximum, ils repartent ensemble avec un petit."
deDE = "Eine private Unterkunft für zwei erwachsene Biber. Solange Beeren und Wasser vorrätig sind, kommen Erwachsene mit einem Romantikwert von 0 oder weniger vorbei. Bei einem Tiefststand lassen sie sogar ihre Arbeit liegen, um herzukommen. Wenn der zweite Erwachsene eintrifft, werden die Vorräte verbraucht. Der Romantikwert steigt nur, solange beide drinnen sind. Sobald beide den Höchstwert erreicht haben, gehen sie gemeinsam mit einem Jungtier."
plPL = "Prywatny domek dla dwóch dorosłych bobrów. Gdy są w nim zapasy jagód i wody, przychodzą do niego dorosłe bobry z poziomem romansu równym 0 lub niższym, a gdy spadnie on do samego dna, przerywają pracę i idą do domku. Gdy przyjdzie drugie dorosłe bobrze, zapasy się wyczerpują, a romans rośnie tylko wtedy, gdy oboje są w środku. Gdy oboje osiągną maksimum, wychodzą razem z młodym."
ptBR = "Um refúgio particular para dois castores adultos. Enquanto houver frutas silvestres e água em estoque, adultos com Romance em 0 ou menos vêm até aqui; quando chega ao nível mais baixo, deixam o trabalho para vir. Quando o segundo adulto chega, o estoque é consumido, e o Romance só aumenta enquanto ambos estiverem dentro. Quando o Romance de ambos estiver no máximo, eles saem juntos com um filhote."
koKR = "성체 비버 두 마리를 위한 전용 오두막입니다. 열매와 물이 비축되어 있는 동안, 로맨스 수치가 0 이하인 성체들이 찾아옵니다. 수치가 바닥까지 떨어지면 일을 멈추고 오두막으로 갑니다. 두 번째 성체가 도착하면 비축품이 모두 소진되고, 두 비버가 모두 안에 있을 때만 로맨스 수치가 올라갑니다. 둘 다 수치가 가득 차면 새끼 비버와 함께 떠납니다."
csCZ = "Soukromé útočiště pro dva dospělé bobry. Dokud jsou na skladě bobule a voda, přicházejí sem dospělí s romantikou na úrovni 0 nebo nižší, a když jsou na úplném dně, přestanou pracovat a vyrazí sem. Když dorazí druhý dospělý, zásoby se spotřebují a romantika se zvyšuje, jen když jsou oba uvnitř. Jakmile jsou oba naplnění, odejdou společně s mládětem."
viVN = "Một nhà nghỉ riêng dành cho hai hải ly trưởng thành. Khi có sẵn quả mọng và nước, những cá thể trưởng thành có Mức độ lãng mạn từ 0 trở xuống sẽ ghé vào, còn khi chạm đáy thì chúng bỏ việc để đến đây. Khi cá thể trưởng thành thứ hai đến, lượng dự trữ sẽ được dùng hết, và Mức độ lãng mạn chỉ tăng khi cả hai đều ở bên trong. Khi cả hai đã đầy, chúng cùng rời đi với một hải ly con."
trTR = "İki yetişkin kunduz için özel bir konak. İçeride böğürtlen ve su bulunduğu sürece, Romantizmi 0 veya daha düşük olan yetişkinler buraya gelir; Romantizmleri dibe vurduğunda işlerini bırakıp buraya giderler. İkinci yetişkin geldiğinde stok tüketilir ve Romantizm yalnızca ikisi de içerideyken artar. İkisinin de Romantizmi dolduğunda, bir yavruyla birlikte çıkarlar."

