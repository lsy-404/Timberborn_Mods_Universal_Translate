ptBR = "Um cipreste-do-pântano que prospera em águas mais profundas. Raízes pneumatóforas crescem ao redor do tronco."
koKR = "더 깊은 물에서 잘 자라는 늪지 사이프러스입니다. 줄기 주변에 뿌리 무릎이 솟아납니다."
