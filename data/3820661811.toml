["Faction.Tidetails.Description"]
raw = "The Tidetails have adapted to life underwater. Teal-furred, with tails unusually large even for beavers, they swim faster than other factions but waddle slower on land—those tails are built to push water, not to hurry on dry ground. They build homes and workshops with entrances in the water and treat flooded paths as swimming lanes. Badwater still finds them: while contaminated they move and work in a frantic rush, but it wears on their bodies and shortens their lives."
status = "normal"
enUS = "The Tidetails have adapted to life underwater. With teal fur and tails unusually large even for beavers, they swim faster than other factions but waddle more slowly on land—their tails are built to push water, not to hurry across dry ground. They build homes and workshops with entrances in the water and treat flooded paths as swimming lanes. Badwater still finds them: while contaminated, they move and work in a frantic rush, but it wears down their bodies and shortens their lives."
zhCN = "潮汐尾适应了水下生活。它们长着青绿色的皮毛，尾巴即使对海狸来说也异常粗大；游泳速度比其他阵营更快，但在陆地上蹒跚得更慢——这些尾巴是为了划水而生，不是为了在干燥的地面上赶路。它们建造的住宅和工坊入口都设在水中，还把被水淹没的道路当作游泳通道。恶水仍会找上它们：受到污染时，它们会疯狂地加快移动和工作速度，但这会损害身体，缩短寿命。"
zhTW = "潮汐族已適應水下生活。他們有著青綠色的毛皮，尾巴甚至比一般海狸還大；游泳速度比其他派系快，但在陸地上走起路來更搖搖擺擺、更慢——那樣的尾巴是用來推水的，不是為了在乾地上趕路。他們建造房屋和工坊時會將入口設在水中，並把淹水的道路當成游泳道。污水仍會找上他們：受污染時，他們會瘋狂地加快移動和工作速度，但這會損害身體，縮短壽命。"
ruRU = "Хвосты глубин приспособились к подводной жизни. С бирюзовой шерстью и необычно крупными даже для бобров хвостами они плавают быстрее представителей других фракций, но медленнее ковыляют по суше — такие хвосты созданы, чтобы отталкиваться от воды, а не спешить по сухой земле. Они строят дома и мастерские с входами под водой и используют затопленные тропы как плавательные дорожки. Грязная вода всё равно добирается до них: пока они загрязнены, они двигаются и работают в лихорадочной спешке, но это изнуряет их тела и сокращает жизнь."
jaJP = "タイドテイルは水中での暮らしに適応してきた。青緑色の毛並みで、ビーバーとしてもひときわ大きな尾を持つ彼らは、他の派閥より速く泳げるが、陸上ではゆっくりとよちよち歩く。尾は水をかくためのもので、乾いた地面を急ぐためのものではない。水中に出入口のある住居や作業場を建て、水没した道を泳ぐための通路として利用する。それでも汚染水は彼らを蝕む。汚染されている間は、慌ただしく動き、働くようになるが、体には負担がかかり、寿命も縮まる。"
frFR = "Les Marées ont appris à vivre sous l’eau. Leur fourrure bleu sarcelle et leur queue, inhabituellement grande même pour des castors, leur permettent de nager plus vite que les autres factions, mais ils se dandinent plus lentement sur la terre ferme : leur queue est faite pour pousser l’eau, pas pour se hâter sur sol sec. Ils construisent des maisons et des ateliers dont les entrées donnent sur l’eau, et considèrent les chemins inondés comme des couloirs de nage. L’eau contaminée les atteint tout de même : tant qu’ils sont contaminés, ils se déplacent et travaillent à toute allure, mais cela éprouve leur corps et raccourcit leur vie."
deDE = "Die Tidetails haben sich an das Leben unter Wasser angepasst. Mit türkisfarbenem Fell und für Biber ungewöhnlich großen Schwänzen schwimmen sie schneller als andere Fraktionen, watscheln an Land jedoch langsamer – ihre Schwänze sind dafür gemacht, Wasser wegzudrücken, nicht dafür, auf trockenem Boden schnell voranzukommen. Sie bauen Häuser und Werkstätten mit Eingängen im Wasser und nutzen überflutete Wege als Schwimmbahnen. Auch sie bleiben vor schlechtem Wasser nicht verschont: Solange sie verseucht sind, bewegen und arbeiten sie in fieberhaftem Tempo, doch das zehrt an ihren Körpern und verkürzt ihr Leben."
plPL = "Przystosowali się do życia pod wodą. Mają turkusowe futro i ogony niezwykle duże nawet jak na bobry. Pływają szybciej niż przedstawiciele innych frakcji, ale na lądzie poruszają się wolniej — ich ogony służą do odpychania się w wodzie, a nie do pośpiechu na suchym gruncie. Budują domy i warsztaty z wejściami od strony wody, a zalane ścieżki traktują jak tory pływackie. Zła woda wciąż ich dopada: gdy są skażeni, poruszają się i pracują w gorączkowym pośpiechu, ale odbija się to na ich organizmach i skraca im życie."
ptBR = "Os Caudas-d’água se adaptaram à vida subaquática. Com pelos verde-azulados e caudas incomumente grandes até mesmo para castores, eles nadam mais rápido do que as outras facções, mas andam bamboleando mais devagar em terra — essas caudas foram feitas para impulsionar na água, não para correr em solo seco. Eles constroem casas e oficinas com entradas na água e tratam caminhos inundados como pistas de natação. A água contaminada ainda os afeta: enquanto contaminados, eles se movem e trabalham num ritmo frenético, mas isso desgasta seus corpos e encurta suas vidas."
koKR = "물속 생활에 적응한 물결꼬리는 청록빛 털과 비버치고도 유난히 큰 꼬리를 지녔습니다. 다른 세력보다 빠르게 헤엄치지만 육지에서는 더 뒤뚱거리며 걷습니다. 꼬리는 물을 밀어내기 위한 것이지, 마른 땅을 서둘러 달리기 위한 것이 아니니까요. 물속에 입구가 있는 집과 작업장을 짓고, 물에 잠긴 길을 수영로처럼 이용합니다. 그래도 오염된 물은 이들을 피해 가지 않습니다. 오염된 동안에는 미친 듯이 서둘러 움직이고 일하지만, 몸에 무리가 가 수명이 짧아집니다."
csCZ = "Tidetails se přizpůsobili životu pod vodou. Mají tyrkysovou srst a ocasy neobvykle velké i na bobry. Plavou rychleji než ostatní frakce, ale na souši se plouží pomaleji — jejich ocasy jsou stavěné k pohybu ve vodě, ne k rychlému běhu po suchu. Staví si domovy a dílny se vstupy ve vodě a zaplavené cesty považují za plavecké dráhy. Ani jim se špatná voda nevyhýbá: když jsou kontaminovaní, pohybují se a pracují ve zběsilém tempu, ale to jejich těla vyčerpává a zkracuje jim život."
viVN = "Tidetails đã thích nghi với cuộc sống dưới nước. Bộ lông màu xanh mòng két, cùng chiếc đuôi lớn khác thường ngay cả với loài hải ly, giúp họ bơi nhanh hơn các phe phái khác nhưng đi lạch bạch chậm hơn trên cạn—những chiếc đuôi ấy được tạo ra để đẩy nước, chứ không phải để chạy nhanh trên đất khô. Họ xây nhà và xưởng có lối vào dưới nước, xem những con đường ngập nước như làn bơi. Badwater vẫn ảnh hưởng đến họ: khi bị nhiễm độc, họ di chuyển và làm việc vội vã như điên, nhưng điều đó bào mòn cơ thể và rút ngắn tuổi thọ của họ."
trTR = "Gelgit Kuyruklar su altında yaşama uyum sağlamıştır. Camgöbeği kürkleri ve kunduzlara göre bile alışılmadık derecede büyük kuyruklarıyla diğer topluluklardan daha hızlı yüzer, ancak karada daha ağır aksak yürürler; bu kuyruklar kuru zeminde hızlanmak için değil, suda ilerlemek için yapılmıştır. Girişleri suya açılan evler ve atölyeler inşa eder, su basmış yolları yüzme şeritleri gibi kullanırlar. Kötü su yine de onları etkiler: kirlenmişken telaşla hareket edip çalışırlar, ancak bu bedenlerini yıpratır ve ömürlerini kısaltır."

