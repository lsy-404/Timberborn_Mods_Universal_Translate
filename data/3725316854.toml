roRO = "[[C]]Asigurați-vă că bunăstarea medie este de cel puțin {1} după [[time:{0}d]]."
huHU = "[[C]]Gondoskodjon arról, hogy az átlagos jólét legalább {1} legyen a(z) [[time:{0}d]] elteltét követően."
arSA = "أن يكون متوسط الرفاهية لدى السكان {1} على الأقل بعد [[time:{0}d]]."

