itIT = "[[C]]Paga {0} per preparare uno spuntino d'invito eroico seguendo il protocollo di esca altamente scientifico dell'Inventore."
ukUA = "[[C]]Заплатіть {0}, щоб приготувати героїчну закуску-запрошення за дуже науковим протоколом приманки Винахідника."
thTH = "[[C]]จ่าย {0} เพื่อเตรียมขนมเชิญชวนอันยิ่งใหญ่ด้วยโปรโตคอลเหยื่อวิทยาศาสตร์สุดเฉียบของนักประดิษฐ์"
