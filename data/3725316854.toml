["LV.BCEv.CampfireMystery4.O1"]
raw = "For days, the colony does not argue with the stranger.\nIt simply proves itself.\nNo beaver is ignored. No fear is answered with panic. No tired paw is treated as a burden.\nThe stranger watches from the edge of the Campfire light, silent and uncertain.\nThen, one evening, they step closer. Not beneath the floor. Not beyond the glow. Inside the circle. The colony makes room.\nOnly then does the stranger point back toward the broken storage floor. Beneath a loose board, hidden away from panic and pursuit, they reveal a small trove of salvaged materials they had carried from the failed settlement and never dared to show.\nThe Tail That Knocked Thrice is no longer a ghost story. It is a welcome story.\n[[C]][[+]]A new beaver joins the colony.\n[[C]][[+]]Gain {2}.\n[[C]][[+]]All beavers gain {0} for [[time:{1}d]]"
status = "normal"
enUS = "For days, the colony does not argue with the stranger. It simply proves itself. No beaver is ignored. No fear is answered with panic. No tired paw is treated as a burden. The stranger watches from the edge of the Campfire light, silent and uncertain. Then, one evening, they step closer. Not beneath the floor. Not beyond the glow. Inside the circle. The colony makes room. Only then does the stranger point back toward the broken storage floor. Beneath a loose board, hidden away from panic and pursuit, they reveal a small trove of salvaged materials they had carried from the failed settlement and never dared to show. The Tail That Knocked Thrice is no longer a ghost story. It is a welcome story. [[C]][[+]]A new beaver joins the colony. [[C]][[+]]Gain {2}. [[C]][[+]]All beavers gain {0} for [[time:{1}d]]"
zhCN = "几天以来，殖民地没有与陌生人争论。  \n它只是证明自己。  \n没有海狸被忽视。没有恐惧用恐慌来回应。没有疲惫的爪子被视为负担。  \n陌生人静静地在营火光的边缘观察着，沉默而不确定。  \n然后，在一个傍晚，他们走得更近。不是在地板下。不是在光芒之外。而是在圈子内。殖民地腾出空间。  \n只有在那时，陌生人才指向破损的储藏地板。在一块松动的木板下，藏匿在恐慌和追逐之外，他们揭示了一个小宝藏，里面装着他们从失败的定居点带来的抢救材料，从未敢出示。  \n“三次敲门的尾巴”不再是鬼故事。这是一个欢迎的故事。  \n[[C]][[+]]一只新的海狸加入了殖民地。  \n[[C]][[+]]获得 {2}。  \n[[C]][[+]]所有海狸获得 {0}，持续 [[time:{1}d]]"
zhTW = "幾天來，殖民地與陌生人沒有爭執。  \n它只是證明了自己。  \n沒有浣熊被忽視。  \n沒有恐懼以驚慌回應。  \n沒有疲憊的爪子被當作負擔。  \n陌生人靜靜地站在營火光線的邊緣，默默不語，心中不安。  \n然後，有一天晚上，他們走得更近。不在地板之下。不在光芒之外。就在圈子裡。殖民地讓出空間。  \n只有在那時，陌生人才指向破損的儲物地板。在一塊鬆動的木板之下，藏在恐慌和追逐的隱蔽處，他們揭示了一小堆從失敗聚落帶來的 salvaged 材料，這些材料從未敢於展示。  \n“三次敲擊的尾巴”不再是一個鬼故事。這是一個受歡迎的故事。  \n[[C]][[+]]一隻新的浣熊加入了殖民地。  \n[[C]][[+]]獲得 {2}。  \n[[C]][[+]]所有的浣熊在 [[time:{1}d]] 內獲得 {0}。"
ruRU = "На протяжении нескольких дней колония не спорит с незнакомцем. Она просто доказывает свою ценность. Ни один бобер не остаётся без внимания. Ни один страх не вызывает паники. Ни одна усталая лапа не считается бременем. Незнакомец наблюдает с края света Костра, молчаливый и неуверенный. Затем, однажды вечером, он делает шаг ближе. Не под полом. Не за пределами света. Внутри круга. Колония освобождает место. Только тогда незнакомец указывает обратно на сломанный пол для хранения. Под одной из ослабленных досок, скрытой от паники и преследования, он открывает небольшой тайник с salvaged материалами, которые он принёс из неудавшегося поселения и никогда не смел показывать. Хвост, который стучал трижды, больше не является легендой. Это история приветствия. [[C]][[+]]Новый бобер присоединяется к колонии. [[C]][[+]]Получите {2}. [[C]][[+]]Все бобры получают {0} за [[время:{1}д]]"
jaJP = "数日間、コロニーは見知らぬ者と争わない。  \nただ自らを証明する。  \n無視されるビーバーはいない。恐れにパニックで応えることはない。疲れた足は負担とは見なされない。  \n見知らぬ者はキャンプファイヤーの光の端から静かに不安な様子で見守る。  \nそして、ある晩、彼らは近づく。床の下でもなく、輝きの向こうでもない。円の中に。コロニーはスペースを作る。  \nその時、見知らぬ者は壊れた物置の床を指し示す。緩んだ板の下、パニックや追跡から隠されて、彼らは失敗した集落から運んできた小さな救出資材の宝庫を明らかにする。  \n「三度ノックされた尻尾」はもはや幽霊物語ではない。それは歓迎の物語である。  \n[[C]][[+]]新しいビーバーがコロニーに加わる。  \n[[C]][[+]]{2}を得る。  \n[[C]][[+]]すべてのビーバーは[[time:{1}d]]の間に{0}を得る。"
frFR = "Pendant des jours, la colonie ne se dispute pas avec l'étranger.  \nElle démontre simplement sa valeur.  \nAucun castor n'est ignoré. Aucune peur n'est accueillie par la panique. Aucune patte fatiguée n'est traitée comme un fardeau.  \nL'étranger observe depuis le bord de la lumière du Campfire, silencieux et incertain.  \nPuis, un soir, il s'approche. Ni sous le sol. Ni au-delà de l'éclat. À l'intérieur du cercle. La colonie fait de la place.  \nCe n'est qu'alors que l'étranger pointe de nouveau vers le sol de stockage brisé. Sous une planche lâche, cachée de la panique et de la poursuite, il révèle un petit trésor de matériaux récupérés qu'il avait transportés de la colonie échouée et n'avait jamais osé montrer.  \nLa Queue Qui Frappe Trois Fois n'est plus une histoire de fantôme. C'est une histoire de bienvenue.  \n[[C]][[+]]Un nouveau castor rejoint la colonie.  \n[[C]][[+]]Gagnez {2}.  \n[[C]][[+]]Tous les castors gagnent {0} pendant [[temps:{1}d]]"
deDE = "Tagelang argumentiert die Kolonie nicht mit dem Fremden. Sie beweist sich einfach selbst. Kein Biber wird ignoriert. Keine Angst wird mit Panik beantwortet. Keine müde Pfote wird als Last behandelt. Der Fremde beobachtet vom Rand des Lichtscheins des Lagerfeuers, still und unsicher. Dann, eines Abends, tritt er näher. Nicht unter dem Boden. Nicht jenseits des Scheins. Innerhalb des Kreises macht die Kolonie Platz. Erst dann zeigt der Fremde auf den kaputten Lagerboden zurück. Unter einem losen Brett, versteckt vor Panik und Verfolgung, enthüllt er eine kleine Sammlung geretteter Materialien, die er aus der gescheiterten Siedlung mitgebracht und nie gewagt hat zu zeigen. Der Schwanz, der dreimal klopfte, ist keine Geistergeschichte mehr. Es ist eine Willkommengeschichte. [[C]][[+]]Ein neuer Biber schließt sich der Kolonie an. [[C]][[+]]Erhalte {2}. [[C]][[+]]Alle Biber erhalten {0} für [[zeit:{1}d]]"
plPL = "Przez dni kolonia nie kłóci się z nieznajomym. Po prostu udowadnia swoją wartość. Żaden bóbr nie jest ignorowany. Żaden strach nie jest traktowany panicznie. Żadna zmęczona łapa nie jest uznawana za ciężar. Nieznajomy obserwuje z krawędzi światła Ogniska, milczący i niepewny. Potem, pewnego wieczoru, zbliżają się. Nie pod podłogą. Nie poza blaskiem. Wewnątrz kręgu. Kolonia robi miejsce. Dopiero wtedy nieznajomy wskazuje z powrotem w stronę zepsutej podłogi magazynu. Pod luźną deską, ukryty przed paniką i pościgiem, odkrywają mały zbiór ocalonych materiałów, które przynieśli z nieudanego osiedla i nigdy nie odważyli się pokazać. Ogon, który trzy razy zapukał, nie jest już historią o duchach. To opowieść o powitaniu. [[C]][[+]]Nowy bóbr dołącza do kolonii. [[C]][[+]]Zyskaj {2}. [[C]][[+]]Wszystkie bobry zyskują {0} przez [[czas:{1}d]]"
ptBR = "Por dias, a colônia não discute com o estranho.  \nEla simplesmente se prova.  \nNenhum castor é ignorado. Nenhum medo é respondido com pânico. Nenhuma pata cansada é tratada como um fardo.  \nO estranho observa da borda da luz da fogueira, silencioso e incerto.  \nEntão, uma noite, eles se aproximam. Não debaixo do chão. Não além do brilho. Dentro do círculo. A colônia faz espaço.  \nSó então o estranho aponta de volta para o chão do armazenamento quebrado. Debaixo de uma tábua solta, escondido do pânico e da perseguição, eles revelam um pequeno tesouro de materiais recuperados que carregaram do assentamento falido e nunca se atreveram a mostrar.  \nA Cauda Que Bateu Três Vezes não é mais uma história de fantasmas. É uma história de boas-vindas.  \n[[C]][[+]]Um novo castor se junta à colônia.  \n[[C]][[+]]Ganha {2}.  \n[[C]][[+]]Todos os castores ganham {0} por [[tempo:{1}d]]"
koKR = "식민지는 며칠 동안 이방인과 논쟁하지 않는다.  \n그저 스스로를 증명할 뿐이다.  \n어떤 비버도 무시당하지 않는다. 어떤 두려움도 공포로 대답하지 않는다. 피곤한 발은 짐으로 여겨지지 않는다.  \n이방인은 캠프파이어 빛의 가장자리에 서서, 조용하고 불확실하게 지켜본다.  \n그러던 어느 저녁, 그들이 조금 가까이 다가온다. 바닥 아래가 아닌, 빛 너머도 아닌, 원 안으로 들어온다. 식민지는 자리를 마련한다.  \n그때 이방인은 부서진 저장소 바닥을 가리킨다. 느슨한 보드 아래, 공포와 추격에서 숨겨진 채, 그들은 실패한 정착지에서 가져온 소중한 자재의 작은 보물이 있음을 드러낸다.  \n세 번 노크한 꼬리는 더 이상 유령 이야기가 아니다. 그것은 환영의 이야기다.  \n[[C]][[+]]새로운 비버가 식민지에 합류한다.  \n[[C]][[+]]{2}를 얻는다.  \n[[C]][[+]]모든 비버가 [[시간:{1}일]] 동안 {0}을 얻는다."
trTR = "Koloni günlerdir yabancı ile tartışmıyor. Sadece kendini kanıtlıyor. Hiçbir kunduz yok sayılmıyor. Hiçbir korku panikle yanıtlanmıyor. Hiçbir yorgun pati bir yük olarak değerlendirilmiyor. Yabancı, Kamp Ateşi ışığının kenarından sessiz ve belirsiz bir şekilde izliyor. Sonra, bir akşam, daha yakınlaşıyorlar. Zemin altında değil. Parıltının ötesinde değil. Dairenin içinde. Koloni yer açıyor. Ancak o zaman yabancı, kırık depolama zeminine geri işaret ediyor. Gevşek bir tahtanın altında, panikten ve kovalamacadan gizlenmiş, başarısız yerleşimden taşıdıkları ve asla göstermeye cesaret edemedikleri kurtarılmış malzemelerden oluşan küçük bir hazineyi ortaya çıkarıyor. Üç kere vuran Kuyruk artık bir hayalet hikayesi değil. Bu bir hoş geldin hikayesi. [[C]][[+]]Yeni bir kunduz koloniye katılıyor. [[C]][[+]]{2} kazanıldı. [[C]][[+]]Tüm kunduzlar [[time:{1}d]] için {0} kazanıyor."
esES = "For días, la colonia no discute con el desconocido.\nSimplemente se demuestra a sí misma.\nNingún castor es ignorado. Ningún miedo se responde con pánico. Ningún cansancio se trata como una carga.\nEl desconocido observa desde el borde de la luz de la Fogata, en silencio e inseguro.\nEntonces, una noche, da un paso más cerca. No bajo el suelo. No más allá del resplandor. Dentro del círculo. La colonia le hace sitio.\nSolo entonces el desconocido señala de vuelta el suelo roto del almacén. Bajo una tabla suelta, escondido lejos del pánico y la persecución, revela un pequeño tesoro de materiales rescatados que había traído del asentamiento fracasado y nunca se atrevió a mostrar.\nLa Cola que Golpeó Tres Veces ya no es una historia de fantasmas. Es una historia de bienvenida.\n[[C]][[+]]Un nuevo castor se une a la colonia.\n[[C]][[+]]Obtén {2}.\n[[C]][[+]]Todos los castores obtienen {0} durante [[time:{1}d]]"
itIT = "For giorni, la colonia non discute con lo straniero.\nDimostra semplicemente il proprio valore.\nNessun castoro viene ignorato. Nessuna paura viene affrontata con il panico. Nessuna zampa stanca viene considerata un peso.\nLo straniero osserva dal bordo della luce del Falò, silenzioso e incerto.\nPoi, una sera, si avvicina. Non sotto il pavimento. Non oltre il bagliore. Dentro il cerchio. La colonia fa spazio.\nSolo allora lo straniero indica il pavimento danneggiato del magazzino. Sotto un'asse allentata, nascosta lontano dal panico e dagli inseguitori, rivela un piccolo tesoro di materiali recuperati, portati dall'insediamento fallito e mai osati mostrare.\nLa Coda che Bussò Tre Volte non è più una storia di fantasmi. È una storia di benvenuto.\n[[C]][[+]]Un nuovo castoro si unisce alla colonia.\n[[C]][[+]]Ottieni {2}.\n[[C]][[+]]Tutti i castori ottengono {0} per [[time:{1}d]]"
ukUA = "Днями колонія не сперечається з незнайомцем.\nВона просто доводить це.\nЖодного бобра не ігнорують. На страх не відповідають панікою. Жодну стомлену лапу не вважають тягарем.\nНезнайомець мовчки й непевно спостерігає з краю світла багаття.\nАж одного вечора він підходить ближче. Не під підлогу. Не за межі сяйва. Усередину кола. Колонія звільняє для нього місце.\nЛише тоді незнайомець показує на пошкоджену підлогу сховища. Під розхитаною дошкою, сховані від паніки й переслідування, лежать невеликі запаси врятованих матеріалів, які він приніс із поселення, що зазнало краху, і ніколи не наважувався показати.\nХвіст, що постукав тричі, більше не страшна історія про привида. Тепер це історія про гостинність.\n[[C]][[+]]До колонії приєднується новий бобер.\n[[C]][[+]]Отримайте {2}.\n[[C]][[+]]Усі бобри отримують {0} протягом [[time:{1}d]]"
thTH = "หลายวันเข้า ฝูงอาณานิคมไม่โต้เถียงกับคนแปลกหน้า\nพวกเขาเพียงแค่พิสูจน์ตัวเอง\nไม่มีบีเวอร์ตัวไหนถูกเมิน ไม่มีใครตอบสนองต่อความกลัวด้วยความตื่นตระหนก ไม่มีใครมองอุ้งเท้าที่อ่อนล้าว่าเป็นภาระ\nคนแปลกหน้าเฝ้ามองอยู่ตรงขอบแสงกองไฟ เงียบงันและไม่แน่ใจ\nแล้วเย็นวันหนึ่ง พวกเขาก็ก้าวเข้ามาใกล้ ไม่อยู่ใต้พื้น ไม่อยู่นอกวงแสง แต่อยู่ภายในวง ฝูงอาณานิคมขยับที่ให้\nจากนั้นคนแปลกหน้าจึงชี้กลับไปยังพื้นห้องเก็บของที่พังยับ ใต้แผ่นไม้ที่หลวม พวกเขาซ่อนขุมวัสดุที่กู้คืนมาไว้ให้พ้นจากความตื่นตระหนกและการไล่ล่า เป็นวัสดุที่พวกเขาขนมาจากชุมชนที่ล่มสลาย และไม่เคยกล้าเปิดเผย\nหางที่เคาะสามครั้งไม่ใช่เรื่องผีอีกต่อไป แต่เป็นเรื่องราวแห่งการต้อนรับ\n[[C]][[+]]มีบีเวอร์ตัวใหม่เข้าร่วมอาณานิคม\n[[C]][[+]]ได้รับ {2}\n[[C]][[+]]บีเวอร์ทุกตัวได้รับ {0} เป็นเวลา [[time:{1}d]]"
csCZ = "Po dny se kolonie nehádá s cizincem. \nJednoduše se prokazuje. \nŽádný bobr není přehlížen. Žádný strach není odpovědí na paniku. Žádná unavená tlapa není považována za zátěž. \nCizinec sleduje z okraje světla ohniště, tichý a nejistý. \nPak, jednoho večera, se přiblíží. Ne pod podlahu. Ne za září. Uvnitř kruhu. Kolonie udělá místo. \nTeprve poté cizinec ukáže zpět směrem k rozbitému skladovému dnu. Pod volnou deskou, skrytou daleko od paniky a pronásledování, odhalí malou zásobu zachráněných materiálů, které nesli z neúspěšného osídlení a nikdy se nebáli ukázat. \nOcas, který zaklepal třikrát, už není příběhem o duchovi. Je to příběh o přijetí. \n[[C]][[+]]Nový bobr se přidává k kolonii. \n[[C]][[+]]Získejte {2}. \n[[C]][[+]]Všichni bobři získávají {0} za [[čas:{1}d]]"
viVN = "Trong nhiều ngày, thuộc địa không tranh cãi với kẻ lạ.\nNó chỉ đơn giản chứng minh bản thân.\nKhông con beaver nào bị bỏ qua. Không nỗi sợ nào được đáp lại bằng sự hoảng loạn. Không bàn chân mệt mỏi nào được coi là gánh nặng.\nKẻ lạ quan sát từ rìa ánh sáng của Campfire, im lặng và không chắc chắn.\nRồi, một buổi tối, họ tiến lại gần hơn. Không dưới sàn. Không vượt ra ngoài ánh sáng. Ở bên trong vòng tròn. Thuộc địa nhường chỗ.\nChỉ khi đó, kẻ lạ chỉ lại về phía sàn kho chứa bị hỏng. Dưới một tấm ván lỏng, được giấu kín khỏi sự hoảng loạn và truy đuổi, họ tiết lộ một kho vật liệu được salvaged nhỏ mà họ đã mang từ khu định cư thất bại và chưa bao giờ dám cho thấy.\nCái Đuôi Đã Gõ Ba Lần không còn là một câu chuyện ma. Nó là một câu chuyện chào đón.\n[[C]][[+]]Một con beaver mới gia nhập thuộc địa.\n[[C]][[+]]Có {2}.\n[[C]][[+]]Tất cả các con beaver nhận {0} cho [[time:{1}d]]"
caES = "For dies, la colònia no discuteix amb l'estranger.\nSimplement se'n demostra digne.\nCap castor no és ignorat. Cap por no es respon amb pànic. Cap pota cansada no es considera una càrrega.\nL'estranger observa des de la vora de la llum de la Foguera, en silenci i amb incertesa.\nDesprés, una nit, s'hi acosta. No sota el terra. No més enllà de la brillantor. Dins del cercle. La colònia li fa lloc.\nNomés llavors l'estranger assenyala de nou el terra de l'magatzem trencat. Sota una post solt, amagat de la por i de la persecució, revela un petit tresor de materials recuperats que havia portat de l'assentament fracassat i que mai no havia gosat mostrar.\nLa Cua que Va Trucar Tres Cops ja no és una història de fantasmes. És una història de benvinguda.\n[[C]][[+]]Un nou castor s'uneix a la colònia.\n[[C]][[+]]Obté {2}.\n[[C]][[+]]Tots els castors obtenen {0} durant [[time:{1}d]]"
beBY = "Некалькі дзён калонія не спрачаецца з незнаёмцам.\nЯна проста даказвае гэта сваімі ўчынкамі.\nНіводнага бабра не пакідаюць без увагі. На страх не адказваюць панікай. Нічыю стомленую лапу не лічаць цяжарам.\nНезнаёмец моўчкі і няўпэўнена назірае з краю святла вогнішча.\nА потым, аднойчы ўвечары, ён падыходзіць бліжэй. Не пад падлогу. Не за межы ззяння. Унутр кола. Калонія знаходзіць для яго месца.\nІ толькі тады незнаёмец паказвае наўзамен на праламаны насціл склада. Пад расхістанай дошкай, схаваныя ад панікі і пераследу, ён паказвае невялікі скарб матэрыялаў, якія ўдалося выратаваць і якія ён прынёс з пацярпелага крах паселішча, але ніколі не адважваўся паказаць.\n«Хвост, які тройчы пастукаў» больш не гісторыя пра прывідаў. Гэта гісторыя пра гасціннасць.\n[[C]][[+]]Новы бабёр далучаецца да калоніі.\n[[C]][[+]]Атрымайце {2}.\n[[C]][[+]]Усе бабры атрымліваюць {0} на працягу [[time:{1}d]]"
roRO = "For zile, colonia nu se ceartă cu străinul.\nPur și simplu se dovedește pe sine.\nNiciun castor nu este ignorat. Nicio frică nu primește răspuns cu panică. Nicio labă obosită nu este tratată ca o povară.\nStrăinul privește de la marginea luminii de la Focul de tabără, tăcut și nesigur.\nApoi, într-o seară, face un pas mai aproape. Nu sub podea. Nu dincolo de lumină. În interiorul cercului. Colonia face loc.\nAbia atunci străinul indică înapoi spre podeaua de depozitare spartă. Sub o scândură slăbită, ascunsă de panică și de urmărire, dezvăluie o mică comoară de materiale recuperate, pe care le duseseră din așezarea eșuată și pe care nu au îndrăznit niciodată să le arate.\nCoada Care Bătea de Trei Ori nu mai este o poveste de fantome. Este o poveste de bun venit.\n[[C]][[+]]Un castor nou se alătură coloniei.\n[[C]][[+]]Câștigă {2}.\n[[C]][[+]]Toți castorii câștigă {0} timp de [[time:{1}d]]"
huHU = "For napok óta a kolónia nem vitatkozik az idegennel.\nEgyszerűen bizonyítja magát.\nEgyetlen vidrát sem hagynak figyelmen kívül. Egyetlen félelmet sem pánikkal válaszolnak meg. Egyetlen fáradt mancsot sem kezelnek teherként.\nAz idegen a táborűz fényének szélétől figyel, némán és bizonytalanul.\nAztán egy este közelebb lép. Nem a padló alá. Nem a fény határán túlra. Be a körbe. A kolónia helyet csinál.\nCsak ekkor mutat vissza a törött raktárpadló felé. Egy laza deszka alatt, elrejtve a pánik és az üldözés elől, felfedi azt a kis készletnyi begyűjtött anyagot, amelyet a sikertelen településről hozott magával, és soha nem merte megmutatni.\nA „Háromszor kopogó farok” már nem kísérteties történet. Üdvözlő történet.\n[[C]][[+]]Egy új vidra csatlakozik a kolóniához.\n[[C]][[+]]{2} szerzése.\n[[C]][[+]]Minden vidra {0} szerez [[time:{1}d]] ideig."
arSA = "لأيام، لا تدخل المستعمرة في جدال مع الغريب.\nإنها تثبت جدارتها فحسب.\nلا يُتجاهل أي قندس. ولا يُقابَل أي خوف بالذعر. ولا يُعامَل أي كفّ متعب على أنه عبء.\nيراقب الغريب من حافة ضوء نار المخيم، صامتًا ومتحيرًا.\nثم، في إحدى الأمسيات، يقترب. ليس تحت الأرضية. وليس خارج دائرة الضوء. بل داخل الدائرة. فتفسح له المستعمرة مكانًا.\nعندها فقط يشير الغريب إلى أرضية المخزن المكسورة. وتحت لوح مفكوك، بعيدًا عن الذعر والملاحقة، يكشف عن كومة صغيرة من المواد المستصلحة التي حملها من المستوطنة الفاشلة، ولم يجرؤ قط على إظهارها.\nلم تعد «الذيل الذي طرق ثلاث مرات» حكاية أشباح. بل أصبحت حكاية ترحيب.\n[[C]][[+]]ينضم قندس جديد إلى المستعمرة.\n[[C]][[+]]اكسب {2}.\n[[C]][[+]]تكتسب جميع القنادس {0} لمدة [[time:{1}d]]"

["LV.BCEv.CampfireMystery4.O2"]
raw = "The colony tries, but fear has a long memory.\n{0}\nThe stranger watches from the edge of the Campfire light, silent and uncertain. They flinch at hurried paws, raised voices, and every creak from the old storage floor.\nWhen the time comes, they do not step closer. Before dawn, they leave.\nThere is no knocking this time. No spiral mark. No final warning. Only a place by the fire that remains empty.\nThe mystery ends, but not as a welcome story.\n[[C]][[-]]Adult beavers suffer {1} for [[time:{2}d]]"
status = "normal"
enUS = "The colony tries, but fear has a long memory.  \n{0}  \nThe stranger watches from the edge of the Campfire light, silent and uncertain. They flinch at hurried paws, raised voices, and every creak from the old storage floor.  \nWhen the time comes, they do not step closer. Before dawn, they leave.  \nThere is no knocking this time. No spiral mark. No final warning. Only a place by the fire that remains empty.  \nThe mystery ends, but not as a welcome story.  \n[[C]][[-]]Adult beavers suffer {1} for [[time:{2}d]]"
zhCN = "殖民地尝试着，但恐惧的记忆却悠久持久。  \n{0}  \n陌生人在营火光芒的边缘注视着，默默无声且不确定。他们对匆忙的爪子、提高的声音和旧储藏室地板每一次的吱嘎声都感到畏缩。  \n当时机来临时，他们没有走近。在黎明之前，他们离开了。  \n这次没有敲门。没有螺旋标记。没有最后的警告。只有一个空着的地方，留在火边。  \n谜团结束了，但却不是一个受欢迎的故事。  \n[[C]][[-]]成年海狸为 {1} 受苦 [[time:{2}d]]"
zhTW = "殖民地試圖應對，但恐懼有著漫長的記憶。\n{0}\n那位陌生人靜靜地站在營火光線的邊緣，默默不語，心中充滿不確定。他們對匆匆而過的爪子、高聲的談話以及老舊儲藏室地板的每一聲吱嘎感到驚慌。\n當時機來臨時，他們並未靠近。在黎明之前，他們離開了。\n這次沒有敲門聲。沒有螺旋標記。沒有最後的警告。只有一個在火邊依然空著的地方。\n謎團結束了，但並不是一個受歡迎的故事。\n[[C]][[-]]成年海狸承受 {1} 為了 [[time:{2}d]]"
ruRU = "Колония старается, но страх имеет долгую память.  \n{0}  \nНезнакомец наблюдает с края света костра, молчаливый и неуверенный. Они вздрагивают от спешащих лап, поднятых голосов и каждого скрипа старого пола для хранения.  \nКогда приходит время, они не подступаются ближе. Перед рассветом они уходят.  \nНа этот раз нет стука. Нет спирального знака. Нет последнего предупреждения. Только место у огня, которое остается пустым.  \nТайна заканчивается, но не как приветливая история.  \n[[C]][[-]]Взрослые бобры страдают {1} в течение [[time:{2}д]]"
jaJP = "コロニーは試みるが、恐れは長い記憶を持っている。\n{0}\n見知らぬ者はキャンプファイヤーの明かりの端から見守り、静かで不確かだ。彼らは急いで走る足、上がる声、古い倉庫の床のきしみのすべてに身を引いている。\nその時が来ても、一歩も近づかない。夜明け前に、彼らは去る。\n今回はノックはない。渦巻きの印もない。最後の警告もない。ただ空いている火のそばの場所が残る。\n謎は終わるが、歓迎される物語ではない。\n[[C]][[-]]大人のビーバーは{1}を苦しむ[[time:{2}d]]"
frFR = "La colonie essaie, mais la peur a une longue mémoire.  \n{0}  \nL'inconnu observe depuis le bord de la lumière du feu de camp, silencieux et incertain. Ils sursautent aux pattes pressées, aux voix élevées, et à chaque craquement du vieux sol de stockage.  \nQuand le moment arrive, ils ne s'approchent pas. Avant l'aube, ils partent.  \nIl n'y a pas de coups cette fois. Aucun signe spiralé. Aucun dernier avertissement. Seulement une place près du feu qui reste vide.  \nLe mystère se termine, mais pas comme une histoire accueillante.  \n[[C]][[-]]Les castors adultes souffrent {1} pendant [[time:{2}d]]"
deDE = "Die Kolonie versucht es, aber die Angst hat ein langes Gedächtnis.\n{0}\nDer Fremde beobachtet vom Rand des Feuers, still und unsicher. Sie zucken zusammen bei hastigen Pfoten, erhobenen Stimmen und jedem Knarren des alten Lagerbodens.\nWenn die Zeit gekommen ist, treten sie nicht näher. Vor der Morgendämmerung gehen sie.\nDiesmal gibt es klopfen. Kein spiralförmiges Zeichen. Keine letzte Warnung. Nur ein Platz am Feuer, der leer bleibt.\nDas Geheimnis endet, aber nicht als willkommene Geschichte.\n[[C]][[-]]Erwachsene Biber leiden {1} für [[time:{2}d]]"
plPL = "Kolonia próbuje, ale strach ma długą pamięć.  \n{0}  \nNieznajomy obserwuje z krawędzi światła ogniska, milczący i niepewny. Cofa się na dźwięk pospiesznych łap, podniesionych głosów i każdego skrzypnięcia starej podłogi magazynu.  \nKiedy przychodzi czas, nie podchodzi bliżej. Przed świtem, odchodzi.  \nTym razem nie ma pukanie. Nie ma spirali. Nie ma ostatecznego ostrzeżenia. Tylko miejsce przy ogniu, które pozostaje puste.  \nTajemnica kończy się, ale nie jako przyjemna opowieść.  \n[[C]][[-]]Dorosłe bobry cierpią {1} przez [[czas:{2}d]]"
ptBR = "A colônia tenta, mas o medo tem uma memória longa.  \n{0}  \nO estranho observa da beira da luz da fogueira, em silêncio e inseguro. Eles se assustam com as patas apressadas, vozes levantadas e cada rangido do velho piso de armazenamento.  \nQuando a hora chega, eles não se aproximam. Antes do amanhecer, eles partem.  \nNão há batidas desta vez. Nenhum símbolo espiral. Nenhuma última advertência. Apenas um lugar à beira do fogo que permanece vazio.  \nO mistério termina, mas não como uma história bem-vinda.  \n[[C]][[-]]Castores adultos sofrem {1} por [[time:{2}d]]"
koKR = "식민지는 노력하지만, 두려움은 오랫동안 기억에 남는다.  \n{0}  \n낯선 자는 캠프파이어 불빛 가장자리고 지켜보고 있으며, 조용하고 불확실하다. 그들은 서두르는 발, 높아진 목소리, 낡은 창고 바닥의 모든 삐걱거림에 움츠린다.  \n때가 오면, 그들은 더 가까이 나아가지 않는다. 새벽 이전에, 그들은 떠난다.  \n이번에는 knocking이 없다. 나선형 표시도 없다. 마지막 경고도 없다. 오직 불 옆의 빈 자리만이 남는다.  \n미스터리는 끝나지만, 환영받는 이야기가 아니다.  \n[[C]][[-]]어른 비버는 {1}를 겪는다 [[시간:{2}일]]"
trTR = "Koloni çabalar, ama korkunun uzun bir hafızası vardır.  \n{0}  \nYabancı, Kamp Ateşi ışığının kenarından, sessiz ve belirsiz bir şekilde izlemektedir. Aceleci patilerin, yükselen seslerin ve eski depolama zemininden gelen her gıcırtının sesiyle irkilirler.  \nZamanı geldiğinde, daha da yaklaşmazlar. Şafak öncesi ayrılırlar.  \nBu sefer kapı çalma yok. İkonik bir işaret yok. Son bir uyarı yok. Sadece ateşin yanında boş kalan bir yer var.  \nGizem sona erer, ama hoş karşılanan bir hikaye olarak değil.  \n[[C]][[-]]Yetişkin kunduzlar {1} {2} günde [[time:{2}d]] acı çeker."
esES = "La colonia lo intenta, pero el miedo tiene una memoria muy larga.\n{0}\nEl forastero observa desde el borde de la luz de la Fogata, en silencio e incierto. Se estremece ante patas apresuradas, voces alzadas y cada crujido del viejo suelo del almacén.\nCuando llegue el momento, no se acerca. Antes del amanecer, se marcha.\nEsta vez no hay golpes en la puerta. No hay marca en espiral. No hay advertencia final. Solo un lugar junto al fuego que permanece vacío.\nEl misterio termina, pero no como una historia de bienvenida.\n[[C]][[-]]Los castores adultos sufren {1} durante [[time:{2}d]]"
itIT = "La colonia ci prova, ma la paura ha una lunga memoria.\n{0}\nLo sconosciuto osserva dal margine della luce del Campfire, silenzioso e incerto. Sussulta al suono di zampe frettolose, di voci alzate e di ogni scricchiolio del vecchio pavimento del magazzino.\nQuando arriva il momento, non si avvicina. Prima dell'alba, se ne va.\nQuesta volta non bussa. Nessun segno a spirale. Nessun ultimo avvertimento. Solo un posto accanto al fuoco che resta vuoto.\nIl mistero si conclude, ma non come una storia di benvenuto.\n[[C]][[-]]I castori adulti subiscono {1} per [[time:{2}d]]"
ukUA = "Колонія намагається, але страх довго пам'ятає.\n{0}\nНезнайомець спостерігає з краю світла від Вогнища, мовчазний і невпевнений. Він здригається від поспішних лап, підвищених голосів і кожного скрипу старої складської підлоги.\nКоли настає час, він не наближається. До світанку він іде.\nЦього разу не буде стуку. Не буде спіральної позначки. Не буде останнього попередження. Лише місце біля вогнища, яке залишається порожнім.\nТаємниця завершується, але не історією про гостинність.\n[[C]][[-]]Дорослі бобри страждають від {1} протягом [[time:{2}d]]"
thTH = "อาณานิคมพยายามแล้ว แต่ความกลัวฝังใจอยู่นาน\n{0}\nคนแปลกหน้ามองดูจากขอบวงแสงของกองไฟ เงียบงันและไม่แน่ใจ พวกเขาสะดุ้งเมื่อเห็นอุ้งเท้าที่ขยับอย่างรีบร้อน ได้ยินเสียงตะโกน และทุกครั้งที่พื้นโกดังเก่าส่งเสียงลั่น\nเมื่อถึงเวลา พวกเขาก็ไม่ก้าวเข้ามาใกล้ขึ้น ก่อนรุ่งสาง พวกเขาจากไป\nครั้งนี้ไม่มีเสียงเคาะ ไม่มีรอยเกลียว ไม่มีคำเตือนครั้งสุดท้าย มีเพียงที่ว่างข้างกองไฟที่ยังคงว่างเปล่า\nปริศนาจบลง แต่ไม่ได้จบลงด้วยเรื่องราวต้อนรับขับสู้\n[[C]][[-]]บีเวอร์วัยผู้ใหญ่ทนทุกข์จาก {1} เป็นเวลา [[time:{2}d]]"
csCZ = "Kolonie se snaží, ale strach má dlouhou paměť.\n{0}\nCizinec sleduje z okraje světla táboráku, tichý a nejistý. Vyhýbá se spěšným tlapkám, zvýšeným hlasům a každému skřípění ze staré podlahy skladu.\nAž přijde čas, nepřistoupí blíž. Před úsvitem odchází.\nTentokrát žádné klepání. Žádný spirálový znak. Žádné poslední varování. Jen místo u ohně, které zůstává prázdné.\nZáhada končí, ale ne jako vítaný příběh.\n[[C]][[-]]Dospělí bobři trpí {1} po [[time:{2}d]]"
viVN = "Colony cố gắng, nhưng nỗi sợ có trí nhớ dài.  \n{0}  \nNgười lạ quan sát từ rìa ánh sáng của Campfire, im lặng và không chắc chắn. Họ giật mình trước những bàn chân vội vã, những tiếng nói to và mỗi tiếng kêu từ sàn kho cũ.  \nKhi đến lúc, họ không tiến lại gần. Trước khi bình minh, họ rời đi.  \nKhông có tiếng gõ cửa lần này. Không có dấu xoắn. Không có cảnh báo cuối cùng. Chỉ còn một chỗ bên lửa vẫn trống rỗng.  \nBí ẩn kết thúc, nhưng không phải như một câu chuyện chào đón.  \n[[C]][[-]]Bõ be trưởng thành phải chịu đựng {1} trong [[time:{2}d]]"
caES = "The colònia ho intenta, però la por té molta memòria.\n{0}\nL'estrany observa des de la vora de la llum de la Foguera, silenciós i indecís. S'estremeix davant de potes apressades, veus alçades i cada cruixit del vell terra del magatzem.\nQuan arriba el moment, no s'hi acosta. Abans de l'alba, se'n va.\nAquesta vegada no hi ha cap truc a la porta. Cap marca en espiral. Cap advertència final. Només un lloc al costat del foc que es queda buit.\nEl misteri s'acaba, però no com una història de benvinguda.\n[[C]][[-]]Els castors adults pateixen {1} durant [[time:{2}d]]"
beBY = "Калонія спрабуе, але страх доўга памятае.\n{0}\nНезнаёмец назірае з краю святла вогнішча, маўклівы і няўпэўнены. Ён узdryгвае ад паспешлівых лап, павышаных голасаў і кожнага скрыпу старой падлогі склада.\nКалі надыходзіць час, ён не падыходзіць бліжэй. Перад світаннем ён сыходзіць.\nНа гэты раз стуку не будзе. Ніякага спіральнага знака. Ніякага фінальнага папярэджання. Толькі месца каля вогнішча, якое застаецца пустым.\nТаямніца заканчваецца, але не гісторыяй з добрым прыёмам.\n[[C]][[-]]Дарослыя бабры пакутуюць ад {1} на працягу [[time:{2}d]]"
roRO = "Colonia încearcă, dar frica are memorie lungă.\n{0}\nStrăinul privește de la marginea luminii Focului de tabără, tăcut și nesigur. Tresare la labele grăbite, la vocile ridicate și la fiecare scârțâit al vechiului pod de depozitare.\nCând sosește momentul, nu se apropie. Înainte de zori, pleacă.\nDe data aceasta nu mai bate nimeni la ușă. Niciun semn în spirală. Niciun avertisment final. Doar un loc lângă foc care rămâne gol.\nMisterul se încheie, dar nu ca o poveste de bun venit.\n[[C]][[-]]Castorii adulți suferă {1} timp de [[time:{2}d]]"
arSA = "تحاول المستعمرة، لكن للخوف ذاكرة طويلة.\n{0}\nيراقب الغريب من حافة ضوء المخيم، صامتًا ومترددًا. يرتجف عند وقع الأقدام المتعجلة، وارتفاع الأصوات، وكل صرير يصدر من أرضية المخزن القديمة.\nعندما يحين الوقت، لا يقتربون. وقبل الفجر، يرحلون.\nلا طرق على الباب هذه المرة. لا علامة حلزونية. لا تحذير أخير. فقط مكان بجانب النار يبقى خاليًا.\nينتهي اللغز، لكن ليس كقصة ترحيب.\n[[C]][[-]]يعاني القنادس البالغون من {1} لمدة [[time:{2}d]]"

["LV.BCEv.CampfireMystery4.O2.FailCh3C1"]
raw = "Some beavers are still worn down, unhappy, or forgotten at the edges of colony life. To the stranger, the Campfire looks warm, but not wide enough."
status = "normal"
enUS = "Some beavers are still worn down, unhappy, or forgotten at the edges of colony life. To the stranger, the Campfire looks warm, but not wide enough."
zhCN = "一些海狸仍然感到疲惫、不快乐，或者被遗忘在殖民地生活的边缘。对陌生人来说，篝火看起来很温暖，但似乎不够宽阔。"
zhTW = "一些海狸仍然感到疲憊、不快樂或被遺忘在殖民地生活的邊緣。對於這位陌生人來說，營火看起來很溫暖，但不夠寬敞。"
ruRU = "Некоторые бобры все еще измотаны, несчастны или забыты на краю колонийной жизни. Для незнакомца костер выглядит теплым, но недостаточно большим."
jaJP = "「辺境のコロニー生活では、いくつかのビーバーがまだ疲れ果て、不幸で、忘れ去られています。見知らぬ人にとって、キャンプファイヤーは暖かそうですが、広さが足りません。」"
frFR = "Certains castors sont encore usés, malheureux ou oubliés aux marges de la vie coloniale. Pour l'étranger, le feu de camp semble chaud, mais pas assez grand."
deDE = "Einige Biber sind immer noch erschöpft, unglücklich oder in den Randbereichen des Kolonielebens vergessen. Für den Fremden sieht das Lagerfeuer zwar warm aus, aber nicht weit genug."
plPL = "Niektóre bobry wciąż są zmęczone, nieszczęśliwe lub zapomniane na obrzeżach życia kolonii. Dla obcego ognisko wygląda na ciepłe, ale nie wystarczająco szerokie."
ptBR = "Alguns castores ainda estão cansados, infelizes ou esquecidos nas bordas da vida da colônia. Para o estranho, a fogueira parece quente, mas não larga o suficiente."
koKR = "몇몇 비버들은 여전히 지치고 불행하며 식민지 생활의 변두리에서 잊혀져 있다. 낯선 사람에게 캠프파이어는 따뜻해 보이지만, 충분히 넓지 않다."
trTR = "Koloni yaşamının kenarlarında hâlâ yıpranmış, mutsuz veya unutulmuş bazı kunduzlar var. Yabancıya göre, kamp ateşi sıcak görünüyor ama yeterince geniş değil."
esES = "Algunos castores siguen agotados, infelices o olvidados en los márgenes de la vida de la colonia. Para el forastero, la Fogata parece acogedora, pero no lo bastante amplia."
itIT = "Alcuni castori sono ancora esausti, infelici o dimenticati ai margini della vita della colonia. Per un estraneo, il Falò sembra caldo, ma non abbastanza ampio."
ukUA = "Деякі бобри все ще виснажені, нещасні або забуті на околицях колонії. Для стороннього Багаття виглядає затишним, але не достатньо просторим."
thTH = "บีเวอร์บางตัวยังคงเหนื่อยล้า ไม่มีความสุข หรือถูกลืมเลือนอยู่ตามขอบของชีวิตในอาณานิคม สำหรับคนแปลกหน้า กองไฟดูอบอุ่น แต่ยังไม่กว้างพอ"
csCZ = "Někteří bobři jsou stále vyčerpaní, nešťastní nebo zapomenutí na okrajích koloniálního života. Pro cizince vypadá táborák teple, ale nedostatečně velký."
viVN = "Một số con rái cá vẫn còn mệt mỏi, không hạnh phúc, hoặc bị lãng quên ở những rìa của cuộc sống thuộc địa. Đối với người lạ, Lửa trại trông ấm áp, nhưng không đủ rộng."
caES = "Alguns castors encara estan esgotats, infeliços o oblidats als marges de la vida de la colònia. Per a l'estranger, la Foguera sembla acollidora, però no prou àmplia."
beBY = "Некаторыя бабры ўсё яшчэ знясілены, незадаволеныя або забытыя на ўскраінах жыцця калоніі. Для чужынца Вогнішча выглядае цёплым, але не досыць шырокім."
roRO = "Unii castori sunt încă epuizați, nemulțumiți sau uitați la marginea vieții coloniei. Pentru un străin, Focul de tabără pare călduros, dar nu îndeajuns de larg."
huHU = "Néhány hód még mindig kimerült, boldogtalan, vagy megfeledkeztek róluk a telepi élet szélein. Az idegen szemével nézve a Tábortűz melegnek tűnik, de nem elég széles."
arSA = "بعض القنادس ما زالت منهكة ومتعبة، أو غير سعيدة، أو منسية على أطراف حياة المستعمرة. بالنسبة للغريب، يبدو المخيم الجمعي دافئاً، لكنه ليس واسعاً بما يكفي."

["LV.BCEv.CampfireMystery4.O2.FailCh3C2"]
raw = "The water rises where it should not. Paths flood, work stalls, and the colony rushes to protect itself. To the stranger, order still looks fragile."
status = "normal"
enUS = "The water rises where it should not. Paths flood, work stalls, and the colony rushes to protect itself. To the stranger, order still looks fragile."
zhCN = "水位上升的地方不应该有。道路被淹没，工作停滞，殖民地匆忙自救。对陌生人而言，秩序依旧显得脆弱。"
zhTW = "水位升高到不應該的地方。小道淹水，工作停滯，殖民地急忙自保。對於陌生人來說，秩序看起來仍然脆弱。"
ruRU = "Вода поднимается там, где не должна. Путь затоплен, работа приостановлена, и колония спешит защитить себя. Для незнакомца порядок по-прежнему кажется хрупким."
jaJP = "「水が上がるべきでない場所で上がる。道が水没し、作業が滞り、コロニーは自らを守るために急ぐ。見知らぬ者には、秩序はまだ脆弱に見える。」"
frFR = "L'eau monte là où elle ne devrait pas. Les chemins sont inondés, le travail est arrêté, et la colonie se précipite pour se protéger. Pour l'étranger, l'ordre semble encore fragile."
deDE = "Das Wasser steigt, wo es nicht sollte. Pfade überschwemmen, die Arbeit stockt, und die Kolonie eilt, sich zu schützen. Für den Fremden sieht die Ordnung immer noch zerbrechlich aus."
plPL = "Woda podnosi się tam, gdzie nie powinna. Ścieżki zalewają się, prace stają w miejscu, a kolonia spieszy, by się ochronić. Dla obcego porządek nadal wydaje się kruchy."
ptBR = "A água sobe onde não deveria. Caminhos se inundam, o trabalho para, e a colônia se apressa para se proteger. Para o estranho, a ordem ainda parece frágil."
koKR = "물이 올라서는 안 되는 곳에서 상승한다. 길이 침수되고, 작업이 중단되며, 식민지는 스스로를 보호하기 위해 서두른다. 낯선 이에게 질서는 여전히 불안정해 보인다."
trTR = "Su, olmaması gereken yerlerde yükseliyor. Yollar sular altında kalıyor, işler duraklıyor ve koloni kendini korumak için acele ediyor. Yabancı için düzen hâlâ kırılgan görünüyor."
esES = "El agua sube donde no debería. Los caminos se inundan, el trabajo se detiene y la colonia corre a protegerse. Para el forastero, el orden todavía parece frágil."
itIT = "L'acqua sale dove non dovrebbe. I sentieri si allagano, il lavoro si ferma e la colonia si affretta a proteggersi. Per lo straniero, l'ordine sembra ancora fragile."
ukUA = "Вода піднімається там, де їй не місце. Стежки заливає, робота зупиняється, а колонія поспішає захищати себе. Для стороннього порядок усе ще видається крихким."
thTH = "น้ำกำลังขึ้นในที่ที่ไม่ควรขึ้น ทางเดินถูกน้ำท่วม งานหยุดชะงัก และอาณานิคมรีบปกป้องตัวเอง สำหรับคนแปลกหน้า ระเบียบของที่นี่ยังดูเปราะบางอยู่"
csCZ = "Voda stoupá tam, kde by neměla. Cesty jsou zaplavené, práce se zastavuje a kolonie spěchá, aby se ochránila. Pro cizince se zdá, že je pořádek stále křehký."
viVN = "Nước dâng lên ở những nơi không nên. Đường đi ngập, công việc đình trệ, và thuộc địa vội vàng tự bảo vệ mình. Đối với người lạ, trật tự vẫn trông mong manh."
caES = "L'aigua puja on no hauria. Els camins s'inunden, la feina s'atura i la colònia corre a protegir-se. Per a l'estrany, l'ordre encara sembla fràgil."
beBY = "Вада падымаецца там, дзе не павінна. Сцежкі затопліваюцца, праца спыняецца, і калонія спяшаецца абараніць сябе. Для чужынца парадак усё яшчэ выглядае далікатным."
roRO = "Apa crește acolo unde nu ar trebui. Drumurile se inundă, lucrul se oprește, iar coloniei îi vine să se apere în grabă. Pentru un străin, ordinea pare totuși fragilă."
huHU = "A víz oda szivárog, ahová nem kellene. Az ösvények elöntődnek, a munka leáll, a telep pedig sietve védekezni kezd. Egy idegen számára a rend még mindig törékenynek tűnik."
arSA = "الماء يرتفع حيث لا ينبغي له ذلك. تغمر الممرات، ويتوقف العمل، وتسارع المستعمرة إلى حماية نفسها. أما للغريب، فيبدو النظام ما يزال هشًا."

["LV.BCEv.CampfireMystery4.O2.FailCh3C3"]
raw = "Some beavers still go without shelter, food, or water. To the stranger, the colony has not proven that a frightened mouth will be cared for instead of closed away."
status = "normal"
enUS = "Some beavers still go without shelter, food, or water. To the stranger, the colony has not proven that a frightened mouth will be cared for instead of closed away."
zhCN = "一些海狸仍然没有住所、食物或水。对陌生人而言，这个殖民地并没有证明一个害怕的嘴巴会得到照顾，而不是被关起来。"
zhTW = "有些海狸仍然沒有庇護所、食物或水。對於這位陌生人來說，這個殖民地尚未證明一個驚恐的嘴巴會受到關心，而不是被關閉起來。"
ruRU = "Некоторые бобры все еще остаются без укрытия, еды или воды. Для незнакомца колония не доказала, что испуганный рот будет заботиться, а не закрыт."
jaJP = "まだシェルター、食料、または水がないビーバーもいます。見知らぬ人にとって、このコロニーは、恐れた口が閉じ込められるのではなく、大切にされることを証明していません。"
frFR = "Certains castors n'ont toujours pas d'abri, de nourriture ou d'eau. Pour l'étranger, la colonie n'a pas prouvé qu'une bouche effrayée sera prise en charge au lieu d'être refermée."
deDE = "Einige Biber leben immer noch ohne Schutz, Nahrung oder Wasser. Für den Fremden hat die Kolonie nicht bewiesen, dass ein verängstigter Mund versorgt wird, anstatt verschlossen zu bleiben."
plPL = "Niektóre bobry nadal żyją bez schronienia, jedzenia czy wody. Dla nieznajomego kolonia nie udowodniła, że przestraszona morda będzie pielęgnowana zamiast zamknięta."
ptBR = "Alguns castores ainda vivem sem abrigo, comida ou água. Para o estranho, a colônia não provou que uma boca assustadora será cuidada em vez de ser fechada."
koKR = "어떤 비버들은 여전히 피신처나 음식, 물 없이 지냅니다. 낯선 이에게 이 집단은 두려워하는 입이 닫혀지지 않고 보살핌을 받을 것이라는 것을 증명하지 못했습니다."
trTR = "Bazı kunduzlar hâlâ barınaksız, yiyeceksiz veya susuz kalıyor. Yabancı için, koloni korkmuş bir ağzın kapatılmak yerine bakım göreceğini kanıtlayamamıştır."
esES = "Algunos castores aún se quedan sin refugio, comida o agua. Para el forastero, la colonia no ha demostrado que una boca asustada vaya a ser atendida en lugar de encerrada."
itIT = "Alcuni castori restano ancora senza riparo, cibo o acqua. Allo straniero, la colonia non ha ancora dimostrato che una bocca spaventata verrà curata invece che rinchiusa."
ukUA = "Деякі бобри досі живуть без укриття, їжі чи води. Для чужинця колонія ще не довела, що налякану істоту доглянуть, а не замкнуть подалі."
thTH = "ม้าบางตัวยังต้องอยู่โดยไม่มีที่พักพิง อาหาร หรือน้ำ สำหรับคนแปลกหน้า อาณานิคมยังไม่ได้พิสูจน์ว่าปากที่หวาดกลัวจะได้รับการดูแล แทนที่จะถูกปิดกั้นขังไว้"
csCZ = "Někteří bobři stále žijí bez přístřeší, jídla nebo vody. Cizince kolonie nepřesvědčila, že se postará o vyděšená ústa místo toho, aby je zavřela."
viVN = "Một số con thủy cung vẫn sống mà không có nơi trú ẩn, thức ăn hoặc nước. Đối với người lạ, thuộc địa chưa chứng minh rằng một miệng sợ hãi sẽ được chăm sóc thay vì bị giam giữ."
caES = "Alguns castors encara es queden sense refugi, menjar o aigua. Per a l'estranger, la colònia no ha demostrat que una boca espantada serà atesa en lloc de ser tancada i apartada."
beBY = "Некаторыя бабры дагэтуль застаюцца без прытулку, ежы і вады. Для чужынца калонія не паказала, што напалоханую істоту аб'ядналі клопатам, а не зачынілі ў адзіноце."
roRO = "Unii castori încă rămân fără adăpost, hrană sau apă. Pentru străin, colonia nu a demonstrat că o gură speriată va fi îngrijită, în loc să fie închisă undeva."
huHU = "Néhány hód még mindig fedél, étel vagy víz nélkül van. Az idegen számára a kolónia még nem bizonyította, hogy a megrémült szájat gondozzák, és nem zárják el."
arSA = "بعض القنادس ما زالوا يفتقرون إلى المأوى والطعام والماء. فبالنسبة للغريب، لم تُثبت المستعمرة بعد أن الفم الخائف سيُعتنى به بدلًا من أن يُغلق عليه في الداخل."

["LV.BCEv.CampfireMystery4.O3"]
raw = "The colony packs berries and water, then leaves the bundle near the edge of the Campfire light.\nThe stranger takes it silently.\nFor a moment, it seems they might speak. Instead, they scratch one final spiral into the dirt.\nThis one does not point toward storage. It does not point beneath the floor. It points away.\nThe colony watches until the trees swallow them. The mystery ends gently, but not happily."
status = "normal"
enUS = "The colony packs berries and water, then leaves the bundle near the edge of the Campfire light.  \nThe stranger takes it silently.  \nFor a moment, it seems they might speak. Instead, they scratch one final spiral into the dirt.  \nThis one does not point toward storage. It does not point beneath the floor. It points away.  \nThe colony watches until the trees swallow them. The mystery ends gently, but not happily."
zhCN = "殖民地装填了浆果和水，然后将包裹留在营火光亮的边缘。\n陌生人默默地拿走了它。\n有那么一瞬间，似乎他们可能会说话。然而，他们却在土里划下最后一个螺旋。\n这个并不指向储存处。它不指向地板下。它指向远方。\n殖民地静静地注视着他们，直到树木将他们吞没。这个谜团温柔地结束，但并不快乐。"
zhTW = "殖民地收集了莓果和水，然後將包裹放在營火光線的邊緣附近。\n陌生人默默地拿走了它。\n一瞬間，看起來他們可能會說話。但他們卻在土壤上劃出最後一個螺旋。\n這個不是指向儲存的地方。也不指向地板下。它指向遠方。\n殖民地靜靜地觀望，直到樹木將他們吞噬。這個謎題以溫柔的方式結束，但卻不幸福。"
ruRU = "Колония упаковывает ягоды и воду, затем оставляет сверток у края света Костра. Незнакомец берет его молча. На мгновение кажется, что они могут заговорить. Вместо этого они проводят последнюю спираль в земле. Эта спираль не указывает на хранилище. Она не указывает под пол. Она указывает вбок. Колония наблюдает, пока деревья не поглощают их. Тайна заканчивается мягко, но не счастливо."
jaJP = "コロニーはベリーと水を詰め込み、キャンプファイヤーの光の近くにその束を置く。  \n strangerは静かにそれを受け取る。  \n 一瞬、話しかけるかのように思える。しかし、彼らは土の中に最後の渦を描くだけだ。  \n この渦は収納を指し示していない。床の下を指しているわけでもなく、外を指している。  \n コロニーは彼らが木々に飲み込まれるまで見守る。謎は静かに終わるが、幸せではない。"
frFR = "La colonie emballe des baies et de l'eau, puis laisse le paquet près du bord de la lumière du feu de camp. L'étranger le prend en silence. Pendant un moment, il semble qu'il pourrait parler. Au lieu de cela, il griffonne une dernière spirale dans la terre. Celle-ci ne pointe pas vers le stockage. Elle ne pointe pas sous le sol. Elle pointe vers l'extérieur. La colonie regarde jusqu'à ce que les arbres les engloutissent. Le mystère se termine doucement, mais pas heureusement."
deDE = "Die Kolonie packt Beeren und Wasser ein und lässt das Bündel dann am Rand des Lichtscheins des Lagerfeuers zurück. Der Unbekannte nimmt es schweigend. Für einen Moment scheint es, als könnten sie sprechen. Stattdessen ritzen sie eine letzte Spirale in den Boden. Diese zeigt nicht in Richtung Lagerung. Sie zeigt nicht unter den Boden. Sie zeigt weg. Die Kolonie beobachtet, bis die Bäume sie verschlucken. Das Geheimnis endet sanft, aber nicht glücklich."
plPL = "Kolonia pakuje jagody i wodę, a następnie zostawia pakunek w pobliżu krawędzi światła ogniska. \nNieznajomy zabiera go w mil silence. \nNa chwilę wydaje się, że mogą mówić. Zamiast tego, rysują jeszcze jedną spiralę w ziemi. \nTa nie wskazuje na magazyn. Nie wskazuje pod podłogę. Wskazuje w przód. \nKolonia obserwuje, aż drzewa ich pochłaniają. Tajemnica kończy się łagodnie, ale nie szczęśliwie."
ptBR = "A colônia empacota frutas silvestres e água, então deixa o fardo perto da borda da luz da fogueira. O estranho o pega em silêncio. Por um momento, parece que eles podem falar. Em vez disso, arranham uma espiral final na terra. Esta não aponta para o armazenamento. Não aponta para baixo do chão. Aponta para longe. A colônia observa até que as árvores os engulam. O mistério termina suavemente, mas não felizmente."
koKR = "식민지는 베리와 물을 챙겨 캠프파이어 불빛의 가장자리 가까이에 묶음을 두고 떠난다. \n이방인은 조용히 그것을 가져간다. \n잠시 그들이 말을 할 것 같았다. 대신, 그들은 마지막 나선형을 땅에 긁어낸다. \n이번 것은 저장소를 가리키지 않는다. 바닥 아래를 가리키지 않는다. 멀리 향한다. \n식민지는 나무가 그들을 삼킬 때까지 지켜본다. 신비는 부드럽게 끝나지만, 행복하게 끝나지는 않는다."
trTR = "“Koloni, böğürtlen ve su ile dolu bir paket yapar, ardından paketi Kamp Ateşi ışığının kenarına bırakır. \nYabancı, bunu sessizce alır. \nBir an, konuşacaklarmış gibi görünürler. Bunun yerine, toprağa son bir spiral çizerler. \nBu, depoya işaret etmez. Yerin altına da işaret etmez. Uzaklara işaret eder. \nKoloni, ağaçların onları yuttuğunu görene kadar izler. Gizem nazikçe sona erer, ama mutlu bir şekilde değil.”"
esES = "La colonia reúne bayas y agua, y deja el paquete cerca del borde de la luz de la Fogata.\nEl extraño lo toma en silencio.\nPor un momento, parece que podría hablar. En cambio, rasca una última espiral en la tierra.\nEsta no apunta hacia el almacén. No apunta bajo el suelo. Apunta hacia afuera.\nLa colonia observa hasta que los árboles los engullen. El misterio termina con suavidad, pero no con felicidad."
itIT = "La colonia impacchetta bacche e acqua, poi lascia il fagotto vicino al bordo della luce del Falò.\nLo straniero lo prende in silenzio.\nPer un momento sembra che potrebbe parlare. Invece, incide sulla terra un'ultima spirale.\nQuesta non punta verso il magazzino. Non punta sotto il pavimento. Punta via.\nLa colonia osserva finché gli alberi non li inghiottono. Il mistero finisce dolcemente, ma non felicemente."
ukUA = "Колонія складає ягоди та воду в клунок і залишає його неподалік від краю світла вогнища.\nНезнайомець мовчки бере його.\nНа мить здається, що вони можуть заговорити. Натомість вони видряпують в землі ще одну, останню спіраль.\nЦя не вказує на сховище. Вона не вказує під підлогу. Вона вказує геть.\nКолонія дивиться, доки дерева не поглинають їх. Таємниця завершується ніжно, але не щасливо."
thTH = "ชุมชนรวบรวมผลเบอร์รีและน้ำ แล้ววางมัดนั้นไว้ใกล้ขอบแสงของกองไฟ\nผู้มาเยือนรับไปอย่างเงียบงัน\nชั่วครู่หนึ่งดูเหมือนว่าพวกเขาอาจจะพูดขึ้น แต่แทนที่จะพูด พวกเขากลับขีดเส้นวนเป็นเกลียวสุดท้ายลงบนพื้นดิน\nเกลียวนี้ไม่ได้ชี้ไปยังที่เก็บของ และไม่ได้ชี้ไปใต้พื้น มันชี้ออกไปไกลจากที่นี่\nชุมชนมองตามจนกระทั่งต้นไม้กลืนร่างของพวกเขาไปจนหมด ปริศนานี้จบลงอย่างนุ่มนวล แต่ไม่ใช่อย่างมีความสุข"
csCZ = "Kolonie balí bobule a vodu, poté nechá balíček blízko okraje světla z ohniště. \nCizinec si ho tiše vezme. \nNa chvíli se zdá, že se možná chystá promluvit. Místo toho do země vyryje jeden poslední spirálový tvar. \nTento směr neukazuje na úložiště. Neukazuje pod podlahu. Ukazuje pryč. \nKolonie je pozoruje, dokud je stromy nezhltí. Záhada končí jemně, ale ne šťastně."
viVN = "Colony đóng gói trái cây và nước, rồi để gói gần cạnh ánh sáng của Lửa Trại. Kẻ lạ mặt lặng lẽ tiếp nhận nó. Trong giây lát, có vẻ như họ có thể nói. Thay vào đó, họ khắc một vòng xoắn cuối cùng xuống đất. Vòng xoắn này không chỉ vào kho. Nó không chỉ vào dưới sàn. Nó chỉ ra xa. Colony quan sát cho đến khi những cây cối nuốt chửng họ. Bí ẩn kết thúc một cách nhẹ nhàng, nhưng không hạnh phúc."
caES = "La colònia empaqueta baies i aigua, després deixa el paquet a la vora de la llum de la fogaina.\nL'estrany l'agafa en silenci.\nDurant un moment, sembla que podria parlar. En canvi, traça una última espiral final a la terra.\nAquesta no apunta cap al magatzem. No apunta sota el terra. Apunta lluny.\nLa colònia observa fins que els arbres se'ls empassen. El misteri acaba amb delicadesa, però no feliçment."
beBY = "Калонія пакідае ягады і ваду ў пучок, а потым кладзе яго побач з краем святла вогнішча.\nНезнаёмец моўчкі забірае яго.\nНа імгненне здаецца, што яны могуць загаварыць. Замест гэтага яны выводзяць апошнюю спіраль на зямлі.\nГэтая спіраль не паказвае на склад. Яна не паказвае пад падлогу. Яна паказвае прэч.\nКалонія назірае, пакуль дрэвы не пракцяць іх. Таямніца заканчваецца мякка, але не шчасліва."
roRO = "The colonia împachetează fructe de pădure și apă, apoi lasă pachetul lângă marginea luminii focului de tabără.\nStrăinul îl ia în tăcere.\nPentru o clipă, pare că ar putea vorbi. În schimb, zgârie o ultimă spirală în pământ.\nAceasta nu indică spre depozit. Nu indică sub podea. Indică spre departe.\nColonia privește până când copacii îi înghit. Misterul se încheie blând, dar nu fericit."
huHU = "A kolónia berket és vizet csomagol, majd a csomagot a tábortűz fényének szélénél hagyja.\nA idegen néma csendben átveszi.\nEgy pillanatra úgy tűnik, szólni akar. Ehelyett egy utolsó spirált karcol a földbe.\nEz nem a raktár felé mutat. Nem a padló alá mutat. Elfelé mutat.\nA kolónia addig figyeli, amíg a fák el nem nyelik őket. A rejtély szelíden ér véget, de nem boldogan."
arSA = "تجمع المستعمرة التوت والماء، ثم تترك الحزمة قرب حافة ضوء المخيم.\nيأخذها الغريب بصمت.\nللحظة، يبدو أنهم قد يتكلمون. بدلاً من ذلك، ينقشون حلزوناً أخيراً واحداً في التراب.\nهذا لا يشير نحو المخزن. ولا يشير تحت الأرضية. إنه يشير بعيداً.\nتراقب المستعمرة حتى تبتلعهم الأشجار. ينتهي اللغز برفق، لكن ليس بسعادة."

["LV.BCEv.CampfireMystery4.O4"]
raw = "The colony drives the stranger beyond the light.\nNo one cheers.\nThe stolen goods are counted. The broken planks are replaced. The injured slowly return to work.\nAt the next Campfire, someone begins to tell the story of the ghost beneath storage.\nNo one asks them to continue.\nSome stories are not frightening because of the shadow.\nSome are frightening because of what the firelight did after it found one.\n[[C]][[-]]Adult beavers suffer {0} for [[time:{1}d]]"
status = "normal"
enUS = "The colony drives the stranger beyond the light.  \nNo one cheers.  \nThe stolen goods are counted. The broken planks are replaced. The injured slowly return to work.  \nAt the next Campfire, someone begins to tell the story of the ghost beneath storage.  \nNo one asks them to continue.  \nSome stories are not frightening because of the shadow.  \nSome are frightening because of what the firelight did after it found one.  \n[[C]][[-]]Adult beavers suffer {0} for [[time:{1}d]]"
zhCN = "殖民地将陌生人驱赶到光明之外。  \n没有人喝彩。  \n被盗的物品被清点。破损的木板被更换。受伤者慢慢恢复工作。  \n在下一个篝火旁，有人开始讲述储藏室下方鬼魂的故事。  \n没有人要求他们继续。  \n有些故事并不是因为阴影而令人恐惧。  \n有些则因为火光发现它之后所做的事情而令人恐惧。  \n[[C]][[-]]成年海狸遭受{0}，持续[[time:{1}d]]"
zhTW = "殖民地將陌生人驅趕至光明之外。  \n沒有人歡呼。  \n被盜物品被清點。破損的板子被更換。受傷者慢慢回到工作崗位。  \n在下一次篝火旁，有人開始講述儲存區下方幽靈的故事。  \n沒有人要求他們繼續。  \n有些故事之所以可怕，並不是因為陰影。  \n有些則是因為火光發現某個東西後所做的事情。  \n[[C]][[-]]成年海狸因為{0}而受到[[time:{1}天]]的影響。"
ruRU = "Колония прогоняет незнакомца за пределы света.  \nНикто не радуется.  \nУкраденные товары пересчитываются. Сломанные доски заменяются. Пострадавшие медленно возвращаются к работе.  \nНа следующем костре кто-то начинает рассказывать историю о призраке под хранилищем.  \nНикто не просит их продолжить.  \nНекоторые истории не пугают из-за тени.  \nНекоторые пугают из-за того, что свет от огня сделал, когда нашел один.  \n[[C]][[-]]Взрослые бобры страдают {0} в течение [[time:{1}д]]"
jaJP = "コロニーは見知らぬ者を光の先へと追いやる。 誰も応援しない。 盗まれた品物が数えられ、壊れた板は取り替えられる。 負傷した者たちはゆっくりと仕事に戻る。 次のキャンプファイヤーでは、誰かが倉庫の下にいる幽霊の物語を語り始める。 誰も続きを聞こうとはしない。 いくつかの物語は影のために恐ろしいわけではない。 いくつかは、火の光がそれを見つけた後に行ったことのために恐ろしい。 [[C]][[-]]大人のビーバーは{0}を苦しむ [[time:{1}d]]の間。"
frFR = "La colonie pousse l'étranger au-delà de la lumière.  \nPersonne n'applaudit.  \nLes biens volés sont comptés. Les planches cassées sont remplacées. Les blessés retournent lentement au travail.  \nAu prochain feu de camp, quelqu'un commence à raconter l'histoire du fantôme sous le stockage.  \nPersonne ne leur demande de continuer.  \nCertaines histoires ne sont pas effrayantes à cause de l'ombre.  \nCertaines sont effrayantes à cause de ce que la lumière du feu a fait après avoir trouvé l'une d'elles.  \n[[C]][[-]]Les castors adultes souffrent {0} pendant [[temps:{1}j]]"
deDE = "Die Kolonie treibt den Fremden über das Licht hinaus. \nNiemand jubelt. \nDie gestohlenen Waren werden gezählt. Die beschädigten Planken werden ersetzt. Die Verletzten kehren langsam zur Arbeit zurück. \nAm nächsten Lagerfeuer beginnt jemand, die Geschichte des Geistes unter dem Lager zu erzählen. \nNiemand bittet sie, fortzufahren. \nEinige Geschichten sind nicht beängstigend wegen des Schattens. \nEinige sind beängstigend wegen dem, was das Feuerlicht tat, nachdem es einen gefunden hatte. \n[[C]][[-]]Erwachsene Biber leiden {0} für [[zeit:{1}d]]"
plPL = "Kolonia wypędza nieznajomego poza światło.  \nNikt nie wiwatuje.  \nSk stolen goods are counted. The broken planks are replaced. The injured slowly return to work.  \nPodczas następnego ogniska ktoś zaczyna opowiadać historię ducha pod magazynem.  \nNikt nie prosi ich, by kontynuowali.  \nNiektóre historie nie są przerażające z powodu cienia.  \nNiektóre są przerażające z powodu tego, co światło ognia zrobiło, gdy je znalazło.  \n[[C]][[-]]Dorosłe bobry cierpią {0} przez [[czas:{1}d]]"
ptBR = "A colônia leva o estranho para além da luz.\nNinguém aplaude.\nOs bens roubados são contados. As tábuas quebradas são substituídas. Os feridos voltam lentamente ao trabalho.\nNo próximo acampamento, alguém começa a contar a história do fantasma debaixo do armazenamento.\nNinguém pede para que continuem.\nAlgumas histórias não são assustadoras por causa da sombra.\nAlgumas são assustadoras por causa do que a luz do fogo fez depois de encontrar uma.\n[[C]][[-]]Castores adultos sofrem {0} por [[tempo:{1}d]]"
koKR = "식민지는 낯선 이를 빛 너머로 몰아냅니다.  \n아무도 환호하지 않습니다.  \n도난당한 물품이 세어집니다. 부서진 판자들이 교체됩니다. 부상자들은 천천히 다시 일터로 돌아옵니다.  \n다음 캠프파이어에서, 누군가 창고 아래 유령의 이야기를 들려주기 시작합니다.  \n아무도 그들에게 계속하라고 요청하지 않습니다.  \n일부 이야기는 그림자 때문에 무섭지 않습니다.  \n일부 이야기는 불빛이 하나를 찾은 후에 한 일 때문에 무섭습니다.  \n[[C]][[-]]성인 비버는 {0} 동안 [[time:{1}d]] 고통받습니다."
trTR = "Koloni, yabancıyı ışığın ötesine sürüyor.  \nKimse tezahürat yapmıyor.  \nÇalınan eşyalar sayılıyor. Kırık tahtalar değiştiriliyor. Yaralılar yavaş yavaş işe dönüyor.  \nBir sonraki Kamp Ateşi'nde, biri depoların altında bulunan hayaletin hikayesini anlatmaya başlıyor.  \nKimse onlardan devam etmelerini istemiyor.  \nBazı hikayeler gölgeler yüzünden korkutucu değildir.  \nBazıları, ateşin onu bulduktan sonra yaptıkları yüzünden korkutucudur.  \n[[C]][[-]]Yetişkin kunduzlar {0} için [[time:{1}g]] acı çekiyor."
esES = "La colonia expulsa al forastero más allá de la luz.\nNadie vitorea.\nLos bienes robados se cuentan. Las tablas rotas se reemplazan. Los heridos vuelven poco a poco al trabajo.\nEn la próxima Fogata, alguien empieza a contar la historia del fantasma que está bajo el almacén.\nNadie le pide que continúe.\nAlgunas historias no dan miedo por la sombra.\nDan miedo por lo que hizo la luz de la hoguera después de encontrar una.\n[[C]][[-]]Los castores adultos sufren {0} durante [[time:{1}d]]"
itIT = "La colonia scaccia lo straniero oltre la luce.\nNessuno esulta.\nLe merci rubate vengono contate. Le assi rotte vengono sostituite. I feriti tornano lentamente al lavoro.\nAl prossimo Falò, qualcuno comincia a raccontare la storia del fantasma sotto il magazzino.\nNessuno gli chiede di continuare.\nAlcune storie non fanno paura per via dell'ombra.\nAltre fanno paura per ciò che la luce del fuoco ha fatto dopo averne trovata una.\n[[C]][[-]]I castori adulti subiscono {0} per [[time:{1}d]]"
ukUA = "Колонія проганяє незнайомця за межі світла.\nНіхто не радіє.\nВикрадені товари перераховують. Зламані дошки замінюють. Поранені повільно повертаються до роботи.\nБіля наступного Вогнища хтось починає розповідати історію про привида під складом.\nНіхто не просить продовжувати.\nДеякі історії лякають не через тінь.\nА деякі лякають через те, що зробило світло вогнища після того, як знайшло одну.\n[[C]][[-]]Дорослі бобри страждають від {0} протягом [[time:{1}d]]"
thTH = "อาณานิคมขับไล่คนแปลกหน้าให้พ้นจากแสงสว่าง\nไม่มีใครโห่ร้องยินดี\nพวกเขานับของที่ถูกขโมยไป แล้วเปลี่ยนแผ่นไม้ที่หัก ผู้บาดเจ็บค่อย ๆ กลับมาทำงาน\nเมื่อถึงกองไฟครั้งถัดไป มีใครบางคนเริ่มเล่าเรื่องผีใต้คลังเก็บของ\nไม่มีใครขอให้เล่าต่อ\nบางเรื่องไม่ได้น่ากลัวเพราะเงามืด\nแต่บางเรื่องน่ากลัวเพราะสิ่งที่แสงไฟเผยให้เห็นหลังจากมันพบใครสักคน\n[[C]][[-]]บีเวอร์วัยผู้ใหญ่ได้รับผล {0} เป็นเวลา [[time:{1}d]]"
csCZ = "Kolonie žene cizince za světlo.\nNikdo neaplauduje.\nUkradené zboží je sečteno. Zlomené prkna jsou nahrazena. Zranění se pomalu vracejí do práce.\nPři dalším táboráku někdo začne vyprávět příběh ducha pod skladištěm.\nNikdo je nežádá, aby pokračovali.\nNěkteré příběhy nejsou děsivé kvůli stínu.\nNěkteré jsou děsivé kvůli tomu, co světlo ohně udělalo poté, co jednoho našlo.\n[[C]][[-]]Dospělí bobři trpí {0} po dobu [[time:{1}d]]"
viVN = "Nhóm thuộc địa đẩy người lạ ra khỏi ánh sáng.\nKhông ai cổ vũ.\nĐồ bị đánh cắp được đếm. Những thanh ván gãy được thay thế. Người bị thương từ từ trở lại làm việc.\nTại Bếp lửa tiếp theo, có người bắt đầu kể câu chuyện về hồn ma dưới kho.\nKhông ai yêu cầu họ tiếp tục.\nMột số câu chuyện không đáng sợ vì bóng tối.\nMột số lại đáng sợ vì những gì ánh sáng lửa đã làm sau khi nó tìm thấy một.\n[[C]][[-]]Beaver trưởng thành chịu {0} trong [[thời gian:{1}d]]"
caES = "El colonista condueix l'estrany més enllà de la llum.\nNingú no aplaudeix.\nEls béns robats es comptabilitzen. Les taules trencades es substitueixen. Els ferits tornen a treballar a poc a poc.\nA la següent foguera, algú comença a explicar la història del fantasma sota el magatzem.\nNingú no li demana que continuï.\nAlgunes històries no fan por per l'ombra.\nFan por per el que va fer la llum de la foguera després de trobar-ne una.\n[[C]][[-]]Els castors adults pateixen {0} durant [[time:{1}d]]"
beBY = "Калонія выганяе чужынца за межы святла.\nНіхто не радуецца.\nСкрадзеныя тавары пералічваюць. Зламаныя дошкі замяняюць. Параненыя павольна вяртаюцца да працы.\nНа наступным вогнішчы хтосьці пачынае расказваць гісторыю пра прывід пад складам.\nНіхто не просіць працягваць.\nНекаторыя гісторыі страшныя не з-за цені.\nНекаторыя страшныя з-за таго, што зрабіла святло вогнішча пасля таго, як знайшло аднаго.\n[[C]][[-]]Дарослыя бабры цярпяць {0} на працягу [[time:{1}d]]"
roRO = "Colonia îl alungă pe străin dincolo de lumină.\nNimeni nu aplaudă.\nBunurile furate sunt numărate. Scândurile rupte sunt înlocuite. Cei răniți se întorc încet la muncă.\nLa următorul Foc de tabără, cineva începe să povestească despre fantoma de sub depozit.\nNimeni nu le cere să continue.\nUnele povești nu sunt înfricoșătoare din cauza umbrei.\nAltele sunt înfricoșătoare din cauza a ceea ce a făcut lumina focului după ce a găsit una.\n[[C]][[-]]Castorii adulți suferă {0} timp de [[time:{1}d]]"
huHU = "A kolónia a fényen túlra űzi az idegent.\nSenki sem ujjong.\nAz ellopott javakat megszámolják. A törött deszkákat kicserélik. A sérültek lassan visszatérnek a munkához.\nA következő tábortűznél valaki mesélni kezdi a raktár alatti szellem történetét.\nSenki sem kéri, hogy folytassa.\nNémelyik történet nem az árnyék miatt rémisztő.\nNémelyik azért rémisztő, mert mit tett a tűzfény, miután rátalált az árnyékra.\n[[C]][[-]]A felnőtt hódok {0}-t szenvednek el [[time:{1}d]]-ig"
arSA = "تطرد المستعمرة الغريب إلى ما وراء الضوء.\nلا يهتف أحد.\nيُحصى المسروق من البضائع. وتُستبدل الألواح المكسورة. ويعود المصابون ببطء إلى العمل.\nفي نار المخيم التالية، يبدأ أحدهم بسرد قصة الشبح تحت المخزن.\nلا يطلب منهم أحد أن يواصلوا.\nبعض القصص لا تبعث على الخوف بسبب الظل.\nوبعضها يبعث على الخوف بسبب ما فعله ضوء النار بعد أن عثر على أحدها.\n[[C]][[-]]يعاني القنادس البالغون من {0} لمدة [[time:{1}d]]"
