["DockWorks.CornerPier.DarkOak.1.Description"]
status = "normal"
raw = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
enUS = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
zhCN = "可直接承托平台。顶部可铺设道路，方便步行通行。固定式码头，并非浮动结构；不提供船只停靠或货物装卸功能。"
zhTW = "支援原生平台。可在頂部加建道路以供通行。固定式碼頭，並非浮動結構；不提供船隻或貨物裝卸功能。"
ruRU = "Поддержка стандартных платформ. Добавьте сверху дорожку для прохода. Стационарный пирс, а не плавучая конструкция; не предназначен для обслуживания лодок или обработки грузов."
jaJP = "標準のプラットフォームに対応。歩行用の通路として、上部に道を追加してください。固定式の桟橋で、浮遊構造物ではありません。ボートや貨物の取り扱いには対応していません。"
frFR = "Compatible avec les plateformes natives. Ajoutez un chemin sur le dessus pour y accéder à pied. Quai fixe, et non une structure flottante ; ne permet ni la gestion de bateaux ni la manutention de marchandises."
deDE = "Integrierte Plattformunterstützung. Füge oben einen Weg hinzu, damit man zu Fuß darauf gelangt. Fester Steg, keine schwimmende Konstruktion; keine Boots- oder Frachtabfertigung."
plPL = "Wbudowane podparcie platformy. Dodaj ścieżkę na górze, aby zapewnić dostęp pieszy. Stały pomost, nie pływająca konstrukcja; nie służy do obsługi łodzi ani ładunków."
ptBR = "Suporte nativo a plataformas. Adicione um caminho no topo para acesso a pé. Píer fixo, não uma estrutura flutuante; não oferece suporte a barcos nem ao manuseio de cargas."
koKR = "기본 플랫폼 기능을 지원합니다. 걸어서 접근할 수 있도록 위에 길을 놓으세요. 고정식 부두이며 부유 구조물이 아닙니다. 보트나 화물을 취급하지 않습니다."
trTR = "Yerleşik platform desteği. Yaya erişimi için üzerine bir yol ekleyin. Sabit bir iskeledir, yüzer bir yapı değildir; tekne veya kargo elleçleme işlevi yoktur."
esES = "Compatible con las plataformas nativas. Añade un camino encima para acceder a pie. Es un muelle fijo, no una estructura flotante; no gestiona barcos ni carga."
itIT = "Supporto nativo per piattaforme. Aggiungi un sentiero sopra per consentire l’accesso a piedi. Molo fisso, non è una struttura galleggiante; non gestisce imbarcazioni né merci."
ukUA = "Штатна підтримка платформи. Додайте зверху доріжку для проходу. Нерухомий причал, а не плавуча споруда; не обслуговує човни чи вантажі."
thTH = "มีแท่นรองรับในตัว เพิ่มทางเดินด้านบนเพื่อให้เดินเข้าถึงได้ เป็นท่าเทียบเรือแบบยึดอยู่กับที่ ไม่ใช่โครงสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativně podporuje plošiny. Nahoře přidejte cestu pro pěší přístup. Pevné molo, nikoli plovoucí konstrukce; bez obsluhy lodí či manipulace s nákladem."
viVN = "Hỗ trợ sàn gốc. Thêm lối đi trên đỉnh để tiếp cận bằng đường bộ. Cầu tàu cố định, không phải công trình nổi; không phục vụ thuyền hay xử lý hàng hóa."
caES = "Compatible de manera nativa amb plataformes. Afegeix-hi un camí al damunt per permetre-hi el pas a peu. Moll fix, no una estructura flotant; no permet gestionar embarcacions ni càrrega."
beBY = "Убудаваная падтрымка платформы. Дадайце зверху дарожку для пешага доступу. Стацыянарны пірс, а не плывучая канструкцыя; не прызначаны для абслугоўвання лодак ці грузаў."
roRO = "Platformă nativă. Adaugă o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite acostarea bărcilor sau manipularea mărfurilor."
huHU = "Natív platformtámogatás. A gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; nem szolgál hajók vagy rakomány kezelésére."
arSA = "دعم المنصات الأصلي. أضف مسارًا في الأعلى لإتاحة الوصول سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو البضائع."

