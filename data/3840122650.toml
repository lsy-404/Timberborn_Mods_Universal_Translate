roRO = "Suportă platformele native. Adăugați o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite manipularea bărcilor sau a mărfurilor."
huHU = "Beépített platformtámogatás. A gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; nem kezel hajókat vagy rakományt."
arSA = "يدعم المنصات بشكل أصلي. أضف مسارًا في الأعلى لإتاحة المرور سيرًا على الأقدام. رصيف ثابت، وليس بنية عائمة؛ لا يتعامل مع القوارب أو البضائع."

