roRO = "Suport nativ pentru platformă. Adaugă o cale deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite operarea bărcilor și nici manipularea mărfurilor."
huHU = "Natív platformtámogatás. A gyalogos megközelítéshez helyezz el egy ösvényt a tetején. Rögzített móló, nem úszó szerkezet; nincs csónak- vagy rakománykezelés."
arSA = "دعم مدمج للمنصات. أضف مسارًا فوقه لإتاحة الوصول سيرًا على الأقدام. رصيف ثابت، وليس منشأة عائمة؛ لا يتعامل مع القوارب أو البضائع."

