esES = "Soporte nativo para plataformas. Añade un camino encima para acceder a pie. Muelle fijo, no flotante; no permite el manejo de barcos ni de carga."
itIT = "Supporto nativo per piattaforme. Aggiungi un sentiero sopra per consentire l'accesso a piedi. Molo fisso, non galleggiante; non gestisce barche né merci."
ukUA = "Підтримує стандартні платформи. Додайте зверху шлях для пішого доступу. Стаціонарний пірс, а не плавуча споруда; не обслуговує човни й вантажі."
thTH = "รองรับแพลตฟอร์มดั้งเดิม วางทางเดินด้านบนเพื่อให้เดินเข้าได้ เป็นท่าเทียบเรือแบบยึดอยู่กับที่ ไม่ใช่สิ่งปลูกสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativní podpora plošin. Nahoru přidejte cestu, aby se po ní dalo chodit. Pevné molo, nikoli plovoucí konstrukce; neslouží k obsluze lodí ani manipulaci s nákladem."
viVN = "Có hỗ trợ sàn tích hợp sẵn. Thêm một lối đi phía trên để đi bộ tiếp cận. Cầu tàu cố định, không phải công trình nổi; không xử lý thuyền hay hàng hóa."
caES = "Compatibilitat amb les plataformes natives. Afegeix-hi un camí al damunt per accedir-hi a peu. Moll fix, no és una estructura flotant; no gestiona embarcacions ni càrrega."
beBY = "Падтрымка штатных платформаў. Зверху дадайце сцежку для пешага доступу. Стацыянарны пірс, а не плавучая канструкцыя; не абслугоўвае лодкі і не апрацоўвае грузы."
roRO = "Suport nativ pentru platformă. Adăugați o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; fără funcții de acostare a bărcilor sau de manipulare a mărfurilor."
huHU = "Beépített platformtámogatás. A gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; nem alkalmas hajók vagy rakomány kezelésére."
arSA = "دعم مدمج للمنصات. أضف مسارًا في الأعلى لإتاحة الوصول سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو البضائع."

