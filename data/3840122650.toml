["DockWorks.LoadingDeck.SageTimber.1.Description"]
status = "normal"
raw = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
enUS = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
zhCN = "原生平台支持。可在顶部铺设道路，供步行通行。固定式码头，并非浮动结构；不处理船只或货物。"
zhTW = "支援原生平台。可在頂部加設道路，供行人通行。固定式碼頭，並非浮動結構；不具備船隻或貨物裝卸功能。"
ruRU = "Поддерживает штатные платформы. Добавьте сверху дорожку для прохода. Стационарный причал, а не плавучая конструкция; не предназначен для лодок и обработки грузов."
jaJP = "標準プラットフォームに対応。歩行用に上部に道を敷いてください。固定式の桟橋で、浮体構造ではありません。船や貨物の取り扱いはできません。"
frFR = "Prise en charge native des plateformes. Ajoutez un chemin sur le dessus pour permettre le passage à pied. Quai fixe, pas une structure flottante ; ne sert ni aux bateaux ni au transport de marchandises."
deDE = "Native Plattformunterstützung. Lege oben einen Pfad für den Zugang zu Fuß an. Fester Steg, keine schwimmende Konstruktion; keine Boots- oder Frachtabfertigung."
plPL = "Natywne wsparcie dla platform. Dodaj ścieżkę na górze, aby zapewnić dostęp pieszy. Stały pomost, nie konstrukcja pływająca; bez obsługi łodzi ani przeładunku ładunków."
ptBR = "Suporte a plataformas nativas. Adicione um caminho no topo para acesso a pé. Píer fixo, não uma estrutura flutuante; não oferece suporte a barcos nem ao manuseio de cargas."
koKR = "기본 플랫폼 지원. 위에 길을 추가해 보행로로 이용할 수 있습니다. 고정식 부두이며 부유식 구조물이 아닙니다. 보트나 화물을 취급하지 않습니다."
trTR = "Platform desteği yerleşiktir. Yürüyerek erişim için üstüne bir yol ekleyin. Sabit iskeledir, yüzen bir yapı değildir; tekne veya yük elleçleme işlevi yoktur."
esES = "Compatible con plataformas de forma nativa. Añade un camino encima para permitir el acceso a pie. Muelle fijo, no una estructura flotante; no gestiona barcos ni carga."
itIT = "Supporto nativo per piattaforme. Aggiungi un sentiero sopra per consentire l'accesso a piedi. Molo fisso, non una struttura galleggiante; non gestisce barche né carichi."
ukUA = "Підтримує стандартні платформи. Додайте зверху доріжку для пішого доступу. Стаціонарний причал, а не плавуча споруда; не обслуговує човни й не обробляє вантажі."
thTH = "รองรับแพลตฟอร์มดั้งเดิม เพิ่มทางเดินด้านบนเพื่อให้เดินเข้าถึงได้ เป็นท่าเทียบเรือแบบอยู่กับที่ ไม่ใช่สิ่งปลูกสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativní podpora plošin. Nahoru přidejte cestu, která umožní přístup pěšky. Pevné molo, nikoli plovoucí konstrukce; neslouží k obsluze lodí ani manipulaci s nákladem."
viVN = "Hỗ trợ nền tảng tích hợp sẵn. Thêm lối đi phía trên để đi lại. Bến tàu cố định, không phải kết cấu nổi; không xử lý thuyền hoặc hàng hóa."
caES = "Suport natiu per a plataformes. Afegeix un camí a sobre per accedir-hi a peu. Moll fix, no és una estructura flotant; no gestiona vaixells ni càrrega."
beBY = "Убудаваная падтрымка платформаў. Дадайце зверху сцежку для пешаходнага доступу. Стацыянарны пірс, а не плывучая канструкцыя; лодкі не абслугоўвае і грузы не апрацоўвае."
roRO = "Suport nativ pentru platforme. Adaugă o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite acostarea bărcilor și nici manipularea mărfurilor."
huHU = "Natív platformtámogatás. Gyalogos megközelítéshez helyezz utat a tetejére. Rögzített móló, nem úszó építmény; nem kezel csónakot vagy rakományt."
arSA = "دعم المنصات الأصلية. أضف مسارًا فوقه لوصول المشاة. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو البضائع."

