["DockWorks.LoadingDeck.Cedar.1.Description"]
status = "normal"
raw = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
enUS = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
zhCN = "原生支持平台。可在顶部铺设道路，供步行通行。固定式栈桥，并非浮动结构；不具备船只或货物装卸功能。"
zhTW = "原生平台支援。在頂部加建道路，以供步行通行。固定式碼頭，並非浮動結構；不提供船隻或貨物裝卸功能。"
ruRU = "Совместима со штатными платформами. Добавьте сверху путь для пешего доступа. Стационарный причал, не плавучая конструкция; не обслуживает лодки и не обрабатывает грузы."
jaJP = "標準のプラットフォームに対応。上に道を敷くと歩いて通れます。固定式の桟橋で、浮遊構造物ではありません。ボートや貨物の取り扱いはできません。"
frFR = "Prise en charge native des plateformes. Ajoutez un chemin au-dessus pour y accéder à pied. Quai fixe, pas une structure flottante ; ne permet ni d'accueillir des bateaux ni de manutentionner des marchandises."
deDE = "Unterstützung für die native Plattform. Füge oben einen Pfad hinzu, um sie zu Fuß zu erreichen. Feststehender Pier, keine schwimmende Konstruktion; keine Boots- oder Frachtabfertigung."
plPL = "Obsługa natywnych platform. Dodaj ścieżkę na górze, aby zapewnić dostęp pieszy. Stały pomost, nie pływająca konstrukcja; nie obsługuje łodzi ani ładunków."
ptBR = "Suporte nativo para plataformas. Adicione um caminho no topo para acesso a pé. Cais fixo, não uma estrutura flutuante; não atende barcos nem movimenta cargas."
koKR = "기본 플랫폼 지원. 걸어서 접근할 수 있도록 위에 길을 놓으세요. 고정된 부두이며 부유 구조물이 아닙니다. 보트나 화물 취급 기능은 없습니다."
trTR = "Yerleşik platform desteği. Yaya erişimi için üstüne bir yol ekleyin. Sabit iskele; yüzen bir yapı değildir, tekne veya yük elleçleme işlevi yoktur."
esES = "Compatible de forma nativa con plataformas. Añade un camino encima para acceder a pie. Muelle fijo, no una estructura flotante; no permite el manejo de barcos ni de carga."
itIT = "Supporto nativo per piattaforme. Aggiungi un sentiero sopra per accedervi a piedi. Molo fisso, non galleggiante; non gestisce barche né merci."
ukUA = "Підтримує стандартні платформи. Додайте зверху доріжку для пішого доступу. Нерухомий пірс, а не плавуча споруда; не обслуговує човни й не обробляє вантажі."
thTH = "รองรับการก่อสร้างบนตัวอาคารโดยตรง เพิ่มทางเดินด้านบนเพื่อให้เดินเข้าถึง เป็นท่าเทียบเรือแบบติดตั้งตายตัว ไม่ใช่สิ่งปลูกสร้างลอยน้ำ และไม่มีการรองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativní podpora plošin. Přidejte nahoru cestu pro pěší přístup. Pevné molo, nikoli plovoucí konstrukce; neslouží k obsluze lodí ani manipulaci s nákladem."
viVN = "Hỗ trợ sàn tích hợp. Thêm đường đi phía trên để tiếp cận bằng cách đi bộ. Cầu tàu cố định, không phải kết cấu nổi; không xử lý thuyền hay hàng hóa."
caES = "Compatible amb les plataformes natives. Afegeix-hi un camí a sobre per accedir-hi a peu. Moll fix, no una estructura flotant; no gestiona embarcacions ni càrrega."
beBY = "Убудаваная апора-платформа. Дадайце зверху дарожку для праходу. Стацыянарны пірс, а не плывучая канструкцыя; лодкі не абслугоўвае і грузы не апрацоўвае."
roRO = "Suport nativ pentru platforme. Adaugă o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite gestionarea bărcilor sau a mărfurilor."
huHU = "Natív platformtámogatás. A gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; nincs hajó- vagy rakománykezelés."
arSA = "يدعم المنصات الأصلية. أضف مسارًا في الأعلى لإتاحة المرور سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو البضائع."

