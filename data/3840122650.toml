["DockWorks.StraightPier.Boardwalk.1.Description"]
status = "normal"
raw = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
enUS = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
zhCN = "支持原生平台。可在顶部铺设道路，供行人通行。固定式码头，并非浮动结构；不提供船只或货物装卸功能。"
zhTW = "支援原生平台。可在頂部加建道路以供通行。固定式碼頭，並非浮動結構；不提供船隻或貨物處理功能。"
ruRU = "Поддержка штатных платформ. Проложите сверху дорожку для прохода. Стационарный пирс, а не плавучая конструкция; не предназначен для лодок или обработки грузов."
jaJP = "標準でプラットフォームに対応。上に道を追加すると徒歩でアクセスできます。固定式の桟橋で、浮体構造ではありません。船や貨物の取り扱いには対応していません。"
frFR = "Prise en charge native des plateformes. Ajoutez un chemin sur le dessus pour permettre l'accès à pied. Quai fixe, et non une structure flottante ; ne permet ni l'accueil des bateaux ni la manutention des marchandises."
deDE = "Native Plattformunterstützung. Füge oben einen Pfad hinzu, damit man darauf laufen kann. Fester Steg, keine schwimmende Konstruktion; keine Boots- oder Frachtabfertigung."
plPL = "Wbudowane podparcie platformy. Dodaj ścieżkę na górze, aby umożliwić dostęp pieszy. Stały pomost, nie konstrukcja pływająca; nie służy do obsługi łodzi ani ładunków."
ptBR = "Suporte nativo a plataformas. Adicione um caminho no topo para acesso a pé. Píer fixo, não uma estrutura flutuante; não permite atracação de barcos nem movimentação de cargas."
koKR = "기본 플랫폼을 지원합니다. 보행 접근로로 위에 길을 추가하세요. 고정식 부두이며 부유 구조물이 아닙니다. 보트나 화물을 취급하지 않습니다."
trTR = "Yerel platform desteği. Yaya erişimi için üstüne bir yol ekleyin. Sabit iskele, yüzer bir yapı değildir; tekne veya yük elleçlemesi yapmaz."
esES = "Compatibilidad nativa con plataformas. Añade un camino en la parte superior para permitir el acceso a pie. Muelle fijo, no una estructura flotante; no gestiona embarcaciones ni mercancías."
itIT = "Supporto nativo alle piattaforme. Aggiungi un sentiero sopra per consentire il passaggio a piedi. Molo fisso, non una struttura galleggiante; non consente l’attracco di barche né la movimentazione di merci."
ukUA = "Підтримує стандартні платформи. Зверху можна прокласти доріжку для проходу. Стаціонарний причал, а не плавуча споруда; не призначений для обслуговування човнів чи вантажів."
thTH = "มีแท่นรองรับในตัว วางทางเดินด้านบนเพื่อให้เดินเข้าถึงได้ เป็นท่าเทียบเรือแบบยึดอยู่กับที่ ไม่ใช่โครงสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Podporuje nativní plošiny. Nahoře přidejte cestu pro pěší přístup. Pevné molo, nikoli plovoucí konstrukce; neslouží k manipulaci s loděmi ani nákladem."
viVN = "Hỗ trợ nền đỡ gốc. Thêm đường đi phía trên để có lối đi bộ. Cầu cảng cố định, không phải kết cấu nổi; không phục vụ thuyền hay xử lý hàng hóa."
caES = "Compatibilitat nativa amb plataformes. Afegeix un camí al damunt per accedir-hi a peu. Moll fix, no és una estructura flotant; no permet gestionar embarcacions ni càrrega."
beBY = "Падтрымка штатнай платформы. Дадайце зверху дарожку для пешаходнага доступу. Нерухомы пірс, а не плавучая канструкцыя; не прызначаны для лодак і апрацоўкі грузаў."
roRO = "Compatibilitate nativă cu platformele. Adaugă o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite manipularea bărcilor sau a mărfurilor."
huHU = "Beépített platformtámogatás. A gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó építmény; nem szolgál hajók vagy rakomány kezelésére."
arSA = "يدعم المنصات الأصلية. أضف مسارًا في الأعلى لإتاحة المرور سيرًا على الأقدام. رصيف ثابت، وليس منشأة عائمة؛ لا يتعامل مع القوارب أو البضائع."

