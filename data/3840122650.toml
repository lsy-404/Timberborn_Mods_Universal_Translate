esES = "Admite plataformas de forma nativa. Añade un camino en la parte superior para permitir el acceso a pie. Muelle fijo, no es una estructura flotante; no permite atracar barcos ni manipular carga."
itIT = "Supporto nativo per piattaforme. Aggiungi un sentiero sopra per consentire il passaggio a piedi. Molo fisso, non una struttura galleggiante; non consente la gestione di barche o merci."
ukUA = "Вбудована підтримка платформ. Додайте зверху доріжку для пішохідного доступу. Стаціонарний пірс, а не плавуча споруда; не обслуговує човни й не обробляє вантажі."
thTH = "มีพื้นแพลตฟอร์มรองรับในตัว เพิ่มทางเดินด้านบนเพื่อให้เดินเข้าถึงได้ เป็นท่าเรือแบบยึดอยู่กับที่ ไม่ใช่โครงสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativní podpora platforem. Navrch přidejte cestu pro pěší přístup. Pevné molo, nikoli plovoucí konstrukce; neslouží k obsluze lodí ani manipulaci s nákladem."
viVN = "Hỗ trợ nền tảng gốc. Thêm một lối đi phía trên để đi bộ. Cầu tàu cố định, không phải công trình nổi; không xử lý thuyền hay hàng hóa."
caES = "Suport natiu per a plataformes. Afegeix un camí a la part superior per accedir-hi a peu. Moll fix, no és una estructura flotant; no permet gestionar embarcacions ni càrrega."
beBY = "Падтрымка штатных платформаў. Дадайце зверху дарожку для пешага доступу. Стацыянарны пірс, не плывучая канструкцыя; не абслугоўвае лодкі і не апрацоўвае грузы."
roRO = "Compatibilitate nativă cu platformele. Adăugați o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite folosirea bărcilor sau manipularea mărfurilor."
huHU = "Natív platformtámogatás. A gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; nem kezel hajókat vagy rakományt."
arSA = "يدعم المنصات الأصلية. أضف مسارًا في الأعلى لإتاحة المرور سيرًا على الأقدام. رصيف ثابت، وليس منشأة عائمة؛ لا يتعامل مع القوارب أو البضائع."

