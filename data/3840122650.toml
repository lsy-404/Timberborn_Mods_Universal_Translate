ptBR = "Suporte nativo a plataformas. Adicione um caminho por cima para permitir acesso a pé. Píer fixo, não uma estrutura flutuante; não lida com barcos nem cargas."
koKR = "기본 플랫폼을 지원합니다. 위에 길을 추가해 걸어서 접근할 수 있습니다. 고정식 부두이며 부유식 구조물이 아닙니다. 보트나 화물 취급 기능은 없습니다."
trTR = "Yerleşik platform desteği. Yürüyerek erişim sağlamak için üzerine yol ekleyin. Sabit iskele, yüzen bir yapı değil; tekne veya kargo elleçleme işlevi yoktur."
esES = "Compatible con las plataformas nativas. Añade un camino encima para acceder a pie. Muelle fijo, no una estructura flotante; no permite atracar barcos ni manipular carga."
itIT = "Supporto nativo alle piattaforme. Aggiungi un sentiero sopra per consentire il passaggio a piedi. Pontile fisso, non una struttura galleggiante; non gestisce barche né merci."
ukUA = "Підтримка стандартних платформ. Прокладіть зверху доріжку для проходу. Стаціонарний причал, а не плавуча споруда; не обслуговує човни й вантажі."
thTH = "รองรับการวางแพลตฟอร์มโดยตรง เพิ่มทางเดินด้านบนเพื่อให้เข้าถึงได้ เป็นท่าเทียบเรือแบบยึดอยู่กับที่ ไม่ใช่สิ่งปลูกสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativní podpora plošin. Nahoru přidejte cestu pro pěší přístup. Pevné molo, nikoli plovoucí konstrukce; neslouží k obsluze lodí ani manipulaci s nákladem."
viVN = "Hỗ trợ nền tảng tích hợp sẵn. Thêm lối đi phía trên để có thể đi bộ tiếp cận. Cầu tàu cố định, không phải công trình nổi; không xử lý thuyền hay hàng hóa."
caES = "Compatibilitat nativa amb plataformes. Afegeix-hi un camí a sobre per accedir-hi a peu. Moll fix, no una estructura flotant; no permet l'embarcament de vaixells ni la manipulació de càrrega."
beBY = "Штатная падтрымка платформ. Дадайце зверху дарожку для пешага доступу. Стацыянарны пірс, а не плавучая канструкцыя; не абслугоўвае лодкі і грузы."
roRO = "Suport nativ pentru platforme. Adăugați o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite manipularea bărcilor sau a mărfurilor."
huHU = "Natív platformtámogatás. Gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; nem kezel hajókat vagy rakományt."
arSA = "يدعم المنصات الأصلية. أضف مسارًا في الأعلى لتوفير إمكانية الوصول سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو مناولة البضائع."

