jaJP = "標準のプラットフォームに対応。歩行用に上部に道を追加してください。固定式の桟橋であり、浮遊構造物ではありません。ボートや貨物の取り扱いはできません。"
frFR = "Prise en charge native des plateformes. Ajoutez un chemin sur le dessus pour y accéder à pied. Jetée fixe, pas une structure flottante ; elle ne permet ni l’accueil de bateaux ni la manutention de marchandises."
deDE = "Plattformen werden direkt unterstützt. Füge oben einen Weg hinzu, damit der Pier zu Fuß erreichbar ist. Fester Pier, keine schwimmende Konstruktion; keine Boots- oder Frachtabfertigung."
plPL = "Wbudowane podparcie platformy. Dodaj na górze ścieżkę, aby umożliwić przejście. Stały pomost, nie konstrukcja pływająca; nie obsługuje łodzi ani ładunków."
ptBR = "Suporte nativo para plataformas. Adicione um caminho no topo para acesso a pé. Píer fixo, não uma estrutura flutuante; não permite manuseio de barcos nem de cargas."
koKR = "플랫폼 기본 지원. 보행 접근을 위해 위에 길을 추가하세요. 고정식 부두이며 부유 구조물이 아닙니다. 보트나 화물 취급 기능은 없습니다."
trTR = "Yerleşik platform desteği. Yaya erişimi için üstüne bir yol ekleyin. Sabit iskele, yüzen bir yapı değildir; tekne veya yük elleçleme işlevi yoktur."
esES = "Admite plataformas de forma nativa. Añade un camino encima para acceder a pie. Muelle fijo, no una estructura flotante; no permite gestionar barcos ni carga."
itIT = "Supporto nativo per piattaforme. Aggiungi un sentiero sopra per consentire l’accesso a piedi. Molo fisso, non galleggiante; non gestisce imbarcazioni né merci."
ukUA = "Власна опора для платформ. Додайте зверху доріжку для пішохідного доступу. Стаціонарний пірс, не плавуча споруда; не призначений для обслуговування човнів чи вантажів."
thTH = "มีฐานรองรับสำหรับสร้างสิ่งก่อสร้างด้านบนในตัว เพิ่มทางเดินด้านบนเพื่อให้เดินเข้าถึงได้ เป็นท่าเรือแบบยึดอยู่กับที่ ไม่ใช่โครงสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativní podpora platforem. Nahoře přidejte cestu pro pěší přístup. Pevné molo, nikoli plovoucí konstrukce; neslouží k manipulaci s loděmi ani nákladem."
viVN = "Có sẵn chức năng làm bệ đỡ. Thêm đường đi phía trên để đi lại. Cầu tàu cố định, không phải công trình nổi; không xử lý thuyền hay hàng hóa."
caES = "Suport natiu per a plataformes. Afegeix-hi un camí a sobre per accedir-hi a peu. Moll fix, no és una estructura flotant; no permet la gestió de vaixells ni de càrrega."
beBY = "Апора для штатнай платформы. Дадайце зверху дарожку для пешага доступу. Нерухомы пірс, а не плавучая канструкцыя; не прызначаны для лодак і апрацоўкі грузаў."
roRO = "Suport pentru platforme native. Adăugați o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; fără manipularea bărcilor sau a mărfurilor."
huHU = "Natív platformtámogatás. A gyalogos megközelítéshez helyezz utat a tetejére. Rögzített móló, nem úszó szerkezet; nem kezel hajókat vagy rakományt."
arSA = "يدعم المنصات الأصلية. أضف مسارًا في الأعلى لإتاحة المرور سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو البضائع."

