viVN = "Có sẵn chức năng làm nền đỡ. Thêm một lối đi phía trên để đi bộ. Cầu tàu cố định, không phải công trình nổi; không phục vụ thuyền hay xử lý hàng hóa."
caES = "Compatibilitat amb les plataformes natives. Afegiu-hi un camí a sobre per accedir-hi a peu. Moll fix, no és una estructura flotant; no gestiona vaixells ni càrrega."
beBY = "Убудаваная апора-платформа. Дадайце зверху дарожку для пешага доступу. Стацыянарны пірс, а не плавучая канструкцыя; не абслугоўвае лодкі і не апрацоўвае грузы."
roRO = "Suport nativ pentru platforme. Adăugați o potecă deasupra pentru acces pietonal. Ponton fix, nu o structură plutitoare; nu permite manipularea bărcilor sau a mărfurilor."
huHU = "Natív platformtámogatás. Gyalogos megközelítéshez helyezz utat a tetejére. Rögzített móló, nem úszó építmény; hajók és rakomány kezelésére nem alkalmas."
arSA = "يدعم المنصات الأصلية. أضف مسارًا فوقه للوصول سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو البضائع."

