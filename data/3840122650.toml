["DockWorks.StraightPier.BrushedMetal.2.Description"]
status = "normal"
raw = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
enUS = "Native platform support. Add a path on top for walking access. Fixed pier, not a floating structure; no boat or cargo handling."
zhCN = "提供原生平台支撑。可在顶部铺设道路，供步行通行。固定式码头，并非浮动结构；不处理船只或货物。"
zhTW = "原生平台支援。在頂部加建道路，方便步行通行。固定式碼頭，並非浮動結構；不提供船隻或貨物處理功能。"
ruRU = "Поддерживает стандартные платформы. Добавьте сверху дорожку для прохода. Стационарный пирс, не плавучая конструкция; не обслуживает лодки и не обрабатывает грузы."
jaJP = "プラットフォームに標準対応。歩行用の通路として、上部に道を追加してください。固定式の桟橋で、浮体構造ではありません。ボートや貨物の取り扱いには対応していません。"
frFR = "Prise en charge native des plateformes. Ajoutez un chemin sur le dessus pour permettre le passage. Quai fixe, non flottant ; ne permet pas d'accueillir des bateaux ni de gérer des marchandises."
deDE = "Unterstützung nativer Plattformen. Für den Zugang zu Fuß oben einen Weg hinzufügen. Fester Pier, keine schwimmende Konstruktion; keine Boots- oder Frachtabfertigung."
plPL = "Natywna obsługa platform. Dodaj ścieżkę na górze, aby zapewnić dostęp pieszy. Stałe molo, nie konstrukcja pływająca; nie obsługuje łodzi ani ładunków."
ptBR = "Suporta plataformas nativamente. Adicione um caminho no topo para acesso a pé. Píer fixo, não uma estrutura flutuante; não oferece suporte a barcos nem ao manuseio de cargas."
koKR = "기본 플랫폼을 지원합니다. 위에 길을 추가해 보행로로 이용하세요. 고정식 부두이며 부유 구조물이 아닙니다. 보트나 화물을 취급하지 않습니다."
trTR = "Yerleşik platform desteği. Yaya erişimi için üstüne bir yol ekleyin. Sabit iskeledir, yüzen bir yapı değildir; tekne veya yük elleçleme işlevi yoktur."
esES = "Compatibilidad nativa con plataformas. Añade un camino encima para permitir el acceso a pie. Muelle fijo, no una estructura flotante; no gestiona barcos ni carga."
itIT = "Supporto nativo per le piattaforme. Aggiungi un sentiero sulla sommità per consentire il passaggio a piedi. Molo fisso, non una struttura galleggiante; non consente la movimentazione di imbarcazioni o merci."
ukUA = "Підтримка стандартних платформ. Додайте зверху доріжку для проходу. Стаціонарний причал, а не плавуча споруда; не обслуговує човни й не обробляє вантажі."
thTH = "รองรับแพลตฟอร์มในตัว เพิ่มทางเดินด้านบนเพื่อให้เดินเข้าถึงได้ เป็นท่าเทียบเรือแบบยึดอยู่กับที่ ไม่ใช่โครงสร้างลอยน้ำ และไม่รองรับเรือหรือการขนถ่ายสินค้า"
csCZ = "Nativní podpora platforem. Nahoru přidejte cestu pro pěší přístup. Pevné molo, nikoli plovoucí konstrukce; neslouží k obsluze lodí ani manipulaci s nákladem."
viVN = "Có hỗ trợ sàn tích hợp. Thêm đường đi phía trên để có lối đi bộ. Cầu cảng cố định, không phải công trình nổi; không xử lý thuyền hay hàng hóa."
caES = "Suport natiu per a plataformes. Afegeix un camí a la part superior per permetre-hi l'accés a peu. Moll fix, no una estructura flotant; no s'hi poden gestionar vaixells ni càrrega."
beBY = "Убудаваная падтрымка платформаў. Дадайце зверху сцежку для пешага доступу. Нерухомы пірс, а не плавучая канструкцыя; не прызначаны для лодак або апрацоўкі грузаў."
roRO = "Suport nativ pentru platforme. Adaugă o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite manipularea bărcilor sau a mărfurilor."
huHU = "Natív platformtámogatás. Gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; csónakok és rakomány kezelésére nem alkalmas."
arSA = "يدعم المنصات الأصلية. أضف مسارًا في الأعلى لإتاحة الوصول سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتعامل مع القوارب أو البضائع."

