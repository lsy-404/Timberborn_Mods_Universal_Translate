roRO = "Suport pentru platforme native. Adaugă o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite manipularea bărcilor sau a mărfurilor."
huHU = "Natív platformtámogatás. A gyalogos megközelítéshez építs utat a tetejére. Rögzített móló, nem úszó szerkezet; nem alkalmas hajók vagy rakomány kezelésére."
arSA = "يدعم بناء المنصات عليه بشكل أصلي. أضف مسارًا فوقه لإتاحة المرور سيرًا على الأقدام. رصيف ثابت، وليس منشأة عائمة؛ ولا يتعامل مع القوارب أو البضائع."

