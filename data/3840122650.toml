roRO = "Suport nativ pentru platforme. Adăugați o potecă deasupra pentru acces pietonal. Debarcader fix, nu o structură plutitoare; nu permite manipularea bărcilor sau a mărfurilor."
huHU = "Natív platformtámogatás. A gyalogos megközelítéshez építs ösvényt a tetejére. Rögzített móló, nem úszó szerkezet; hajók és rakomány kezelésére nem alkalmas."
arSA = "يوفّر دعمًا أصليًا للمنصات. أضف مسارًا في الأعلى للوصول سيرًا على الأقدام. رصيف ثابت، وليس هيكلًا عائمًا؛ لا يتولى التعامل مع القوارب أو البضائع."

