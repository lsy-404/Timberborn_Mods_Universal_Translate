ptBR = "Um depósito coberto para composto proveniente das latrinas. Escolha Composto como seu bem. Armazena 30."
koKR = "지붕이 있는 저장 상자로, 화장실에서 나온 퇴비를 보관합니다. 상품으로 퇴비를 선택하세요. 30개까지 보관할 수 있습니다."
trTR = "Tuvalet çukurlarından gelen kompost için çatılı bir depo. Malzemesi olarak Kompost seçin. 30 kapasiteli."
esES = "Un contenedor con techo para el compost de los retretes. Elige Compost como su bien. Almacena 30."
itIT = "Un deposito coperto per il compost proveniente dai gabinetti. Scegli Compost come bene. Contiene 30."
ukUA = "Криті контейнер для компосту з вбиралень. Оберіть Компост як товар для зберігання. Місткість: 30."
thTH = "ถังปิดฝาสำหรับเก็บปุ๋ยหมักจากห้องน้ำ เลือก Compost เป็นสินค้าของมัน จุได้ 30"
csCZ = "Krytý zásobník na kompost z latrín. Jako zboží vyberte Kompost. Pojme 30."
