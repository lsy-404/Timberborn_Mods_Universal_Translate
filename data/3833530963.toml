["Building.FertilizerSpreader.Description"]
status = "normal"
raw = "Spreads compost on growing crops and trees within 3 tiles. A plant fed every day grows 30% faster: a 3-day crop is ready in about 2.1 days, a 10-day tree in 7. Feeds up to 36 plants a day. Uses 6 compost a day; haulers bring it from a Compost Shed."
enUS = "Spreads compost on growing crops and trees within 3 tiles. A plant fed every day grows 30% faster: a 3-day crop is ready in about 2.1 days, a 10-day tree in 7. Feeds up to 36 plants a day. Uses 6 compost a day; haulers bring it from a Compost Shed."
zhCN = "在半径3格内的生长中作物和树木上撒施堆肥。每天获得充足施肥的植物生长速度提高30%：3天的作物约2.1天成熟，10天的树木约7天成熟。每天最多可为36株植物施肥。每天消耗6单位堆肥；搬运工会从堆肥棚取来堆肥。"
zhTW = "在 3 格內的生長中作物與樹木上撒布堆肥。每天都有施肥的植物生長速度加快 30%：3 天成熟的作物約 2.1 天即可收成，10 天成熟的樹木則約 7 天。每天最多可施肥 36 株植物。每天消耗 6 單位堆肥；搬運工會從堆肥棚取來堆肥。"
ruRU = "Распределяет компост по растущим культурам и деревьям в радиусе 3 клеток. Растение, которое получает удобрение каждый день, растёт на 30% быстрее: 3-дневная культура созревает примерно за 2,1 дня, 10-дневное дерево — за 7. Удобряет до 36 растений в день. Расходует 6 компоста в день; переносчики доставляют его из Компостного сарая."
jaJP = "堆肥を3マス以内の成長中の作物と木に散布する。毎日肥料を与えられた植物は30%速く成長する。3日の作物は約2.1日で、10日の木は7日で収穫可能になる。1日最大36本の植物に肥料を与える。1日6の堆肥を使用し、運搬作業員が堆肥小屋から堆肥を運ぶ。"
frFR = "Répand du compost sur les cultures et les arbres en croissance dans un rayon de 3 cases. Une plante nourrie chaque jour pousse 30 % plus vite : une culture de 3 jours est prête en environ 2,1 jours, un arbre de 10 jours en 7. Nourrit jusqu'à 36 plantes par jour. Consomme 6 compost par jour ; les porteurs l'apportent depuis un Hangar à compost."
deDE = "Verteilt Kompost auf wachsenden Feldfrüchten und Bäumen innerhalb von 3 Feldern. Eine Pflanze, die täglich gedüngt wird, wächst 30 % schneller: Eine Feldfrucht mit 3 Tagen Wachstumszeit ist in etwa 2,1 Tagen erntereif, ein Baum mit 10 Tagen in 7. Versorgt bis zu 36 Pflanzen pro Tag. Verbraucht 6 Kompost pro Tag; Transporteure bringen ihn aus einem Komposthaus."
plPL = "Rozsiewa kompost na rosnące uprawy i drzewa w promieniu 3 kafelków. Roślina nawożona codziennie rośnie o 30% szybciej: uprawa trwająca 3 dni jest gotowa w około 2,1 dnia, a drzewo trwające 10 dni – w około 7 dni. Obsługuje do 36 roślin dziennie. Zużywa 6 kompostu dziennie; transportujący dostarczają go ze Szopy na Kompost."
ptBR = "Espalha composto em plantações e árvores em crescimento dentro de 3 blocos. Uma planta alimentada todo dia cresce 30% mais rápido: uma plantação de 3 dias fica pronta em cerca de 2,1 dias, e uma árvore de 10 dias, em 7. Alimenta até 36 plantas por dia. Usa 6 de composto por dia; os transportadores trazem o composto de um Galpão de Composto."
koKR = "지정된 반경 3타일 안의 자라는 작물과 나무에 퇴비를 뿌립니다. 매일 비료를 받은 식물은 30% 더 빠르게 자랍니다. 3일짜리 작물은 약 2.1일 만에, 10일짜리 나무는 7일 만에 수확할 수 있습니다. 하루에 최대 36그루의 식물에 비료를 줄 수 있습니다. 하루에 퇴비 6개를 사용하며, 운반꾼이 퇴비 창고에서 퇴비를 가져옵니다."
trTR = "Üç kare içindeki yetişen mahsullere ve ağaçlara kompost serper. Her gün beslenen bir bitki %30 daha hızlı büyür: 3 günlük bir mahsul yaklaşık 2,1 günde hazır olur, 10 günlük bir ağaç ise 7 günde. Günde en fazla 36 bitkiyi besler. Günde 6 kompost kullanır; taşıyıcılar bunu bir Kompost Kulübesi'nden getirir."
esES = "Esparce compost sobre cultivos y árboles en crecimiento dentro de 3 casillas. Una planta alimentada cada día crece un 30 % más rápido: un cultivo de 3 días está listo en unos 2,1 días, y un árbol de 10 días, en 7. Alimenta hasta 36 plantas al día. Consume 6 de compost al día; los transportistas lo traen desde un Cobertizo de compost."
itIT = "Sparge il compost su colture e alberi in crescita entro 3 blocchi. Una pianta nutrita ogni giorno cresce il 30% più velocemente: una coltura di 3 giorni è pronta in circa 2,1 giorni, un albero di 10 giorni in 7. Nutre fino a 36 piante al giorno. Consuma 6 compost al giorno; i trasportatori lo portano da un Magazzino del Compost."
ukUA = "Розкидає компост на вирощуваних культурах і деревах у радіусі 3 клітинок. Рослина, яку годують щодня, росте на 30% швидше: 3-денна культура дозріває приблизно за 2,1 дня, 10-денне дерево — за 7. Годує до 36 рослин на день. Витрачає 6 компосту на день; переносники привозять його з Компостної шопи."
thTH = "โรยปุ๋ยหมักบนพืชผลและต้นไม้ที่กำลังเติบโตภายใน 3 ช่อง พืชที่ได้รับปุ๋ยทุกวันจะเติบโตเร็วขึ้น 30%: พืชผลที่ใช้เวลา 3 วันจะพร้อมเก็บเกี่ยวในประมาณ 2.1 วัน และต้นไม้ที่ใช้เวลา 10 วันจะพร้อมในประมาณ 7 วัน ให้อาหารพืชได้สูงสุด 36 ต้นต่อวัน ใช้ปุ๋ยหมัก 6 หน่วยต่อวัน โดยมีผู้ขนส่งนำปุ๋ยหมักมาจากโรงเก็บปุ๋ยหมัก"
csCZ = "Rozprostírá kompost na rostoucí plodiny a stromy v okruhu 3 dlaždic. Rostlina krmená každý den roste o 30 % rychleji: plodina s 3denním cyklem je připravena zhruba za 2,1 dne, 10denní strom za 7. Krmí až 36 rostlin denně. Spotřebuje 6 kompostu denně; kompost přivážejí přepravky z kompostárny."
viVN = "Rải phân trộn lên cây trồng và cây đang lớn trong phạm vi 3 ô. Cây được bón mỗi ngày sẽ lớn nhanh hơn 30%: cây trồng 3 ngày sẽ chín sau khoảng 2,1 ngày, cây 10 ngày sẽ chín sau 7 ngày. Bón cho tối đa 36 cây mỗi ngày. Tiêu thụ 6 phân trộn mỗi ngày; người vận chuyển sẽ mang phân từ Kho ủ phân."
caES = "Escampa compost sobre els cultius i arbres en creixement dins de 3 quadrats. Una planta alimentada cada dia creix un 30% més ràpid: un cultiu de 3 dies està llest en uns 2,1 dies, i un arbre de 10 dies en 7. Alimenta fins a 36 plantes al dia. Consumeix 6 compost al dia; els transportistes el porten des d'un Cobert de compost."
beBY = "Распаўсюджвае кампост на растучыя культуры і дрэвы ў радыусе 3 клетак. Расліна, якую кормяць кожны дзень, расце на 30% хутчэй: 3-дзённая культура гатовая прыблізна за 2,1 дня, 10-дзённае дрэва — за 7. Корміць да 36 раслін за дзень. Выкарыстоўвае 6 кампосту за дзень; пераносчыкі даставяць яго з кампостнага сарая."
roRO = "Împrăștie compost pe culturile și copacii aflați în creștere, în raza de 3 pătrate. O plantă hrănită în fiecare zi crește cu 30% mai repede: o cultură de 3 zile este gata în aproximativ 2,1 zile, iar un copac de 10 zile în 7. Hrănește până la 36 de plante pe zi. Consumă 6 compost pe zi; cărătorii îl aduc de la o Magazie de compost."
huHU = "Komposztot szór a 3 csempe távolságon belül lévő növekvő növényekre és fákra. Naponta egyszer etetett növény 30%-kal gyorsabban nő: a 3 napos termés körülbelül 2,1 nap alatt érik be, a 10 napos fa 7 nap alatt. Naponta legfeljebb 36 növényt képes ellátni. Naponta 6 komposztot használ fel; a szállítók a Komposztházból hozzák."
arSA = "يوزّع السماد على المحاصيل والأشجار النامية ضمن مسافة 3 بلاطات. النبات الذي يُغذّى كل يوم ينمو أسرع بنسبة 30%: فالمحصول الذي يحتاج 3 أيام ينضج خلال نحو 2.1 يوم، والشجرة التي تحتاج 10 أيام تنضج خلال 7 أيام. يغذّي حتى 36 نباتاً يومياً. يستهلك 6 وحدات سماد يومياً، ويجلبها الناقلون من مخزن السماد."

