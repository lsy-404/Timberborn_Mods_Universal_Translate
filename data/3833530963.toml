["Building.BathhouseSauna.Description"]
status = "normal"
raw = "A hot tub and a sauna under one roof for up to 8 beavers. A visit fills the Sauna, Wet Fur and Bathhouse needs. Burns 0.3 logs an hour."
enUS = "A hot tub and a sauna under one roof for up to 8 beavers. A visit fills the Sauna, Wet Fur and Bathhouse needs. Burns 0.3 logs an hour."
zhCN = "一间屋檐下同时设有热水浴池和桑拿房，最多可容纳8只海狸。每次使用都会满足桑拿、湿毛和澡堂的需求。每小时消耗0.3根原木。"
zhTW = "一間室內可容納最多 8 隻海狸的熱水池與三溫暖。使用一次可滿足三溫暖、濕毛與澡堂的需求。每小時消耗 0.3 根原木。"
ruRU = "Горячая ванна и сауна под одной крышей для до 8 бобров. Посещение удовлетворяет потребности «Сауна», «Мокрая шерсть» и «Баня». Сжигает 0,3 бревна в час."
jaJP = "サウナとホットタブを一つの屋根の下に備えた施設で、最大8匹のビーバーが利用できます。利用するとサウナ、濡れた毛皮、浴場の各ニーズが満たされます。1時間あたり0.3本の丸太を燃やします。"
frFR = "Un bain à remous et un sauna sous un même toit pour jusqu'à 8 castors. Une visite comble les besoins en Sauna, Pelage mouillé et Bains. Consomme 0,3 bûche par heure."
deDE = "Ein Whirlpool und eine Sauna unter einem Dach für bis zu 8 Biber. Ein Besuch deckt die Bedürfnisse nach Sauna, Nasses Fell und Badehaus. Verbraucht 0,3 Holzstämme pro Stunde."
plPL = "Gorąca balia i sauna pod jednym dachem dla do 8 bobrów. Wizyta zaspokaja potrzeby: Sauna, Wet Fur i Bathhouse. Spala 0,3 kłody na godzinę."
ptBR = "Uma banheira de hidromassagem e uma sauna sob o mesmo teto, para até 8 castores. Uma visita atende às necessidades de Sauna, Pelo Úmido e Casa de Banhos. Queima 0,3 toras por hora."
koKR = "한 지붕 아래 최대 8명의 비버를 위한 온수 욕조와 사우나. 방문 시 사우나, 젖은 털, 목욕탕 욕구가 채워진다. 시간당 통나무 0.3개를 소모한다."
trTR = "Tek bir çatı altında bir sıcak küvet ve bir sauna, en fazla 8 kunduz için. Bir ziyaret Sauna, Islak Kürk ve Hamam ihtiyaçlarını karşılar. Saatte 0,3 kütük yakar."
esES = "Un jacuzzi y una sauna bajo un mismo techo para hasta 8 castores. Una visita satisface las necesidades de Sauna, Pelaje mojado y Baño. Consume 0,3 troncos por hora."
itIT = "Una vasca idromassaggio e una sauna sotto lo stesso tetto per un massimo di 8 castori. Una visita soddisfa i bisogni di Sauna, Pelliccia Bagnata e Bagno. Consuma 0,3 tronchi all'ora."
ukUA = "Гаряча ванна та сауна під одним дахом для не більше 8 бобрів. Відвідування задовольняє потреби «Сауна», «Мокра шерсть» і «Лазня». Спалює 0,3 колоди на годину."
thTH = "อ่างน้ำร้อนและห้องซาวน่าอยู่ภายใต้หลังคาเดียวกัน รองรับบีเวอร์ได้สูงสุด 8 ตัว การเข้าใช้แต่ละครั้งจะตอบสนองความต้องการด้าน Sauna, Wet Fur และ Bathhouse เผาไหม้ท่อนไม้ 0.3 ท่อนต่อชั่วโมง"
csCZ = "Horká vana a sauna pod jednou střechou pro až 8 bobrů. Návštěva doplní potřeby Sauna, Wet Fur a Bathhouse. Spotřebuje 0,3 polena za hodinu."
viVN = "Một phòng tắm nước nóng và phòng xông hơi dưới cùng một mái nhà, phục vụ tối đa 8 hải ly. Mỗi lượt ghé thăm sẽ lấp đầy nhu cầu Xông hơi, Lông ướt và Nhà tắm. Tiêu thụ 0,3 khúc gỗ mỗi giờ."
caES = "Una banyera d'hidromassatge i una sauna sota un mateix sostre per a fins a 8 castors. Una visita satisfà les necessitats de Sauna, Pelatge humit i Banys. Crema 0,3 troncs per hora."
beBY = "Гарачая ванна і сауна пад адным дахам для да 8 бабраў. Візіт папаўняе патрэбы «Сауна», «Мокрае футра» і «Лазня». Спальвае 0,3 бервяна ў гадзіну."
roRO = "O cadă cu apă fierbinte și un saună sub același acoperiș, pentru până la 8 castori. O vizită satisface nevoile de saună, de blană umedă și de baie. Arde 0,3 bușteni pe oră."
huHU = "Egy fedél alatt forró kád és szauna, legfeljebb 8 hód számára. Egy látogatás kielégíti a Szauna, a Nedves szőrzet és a Fürdőház igényeit. Óránként 0,3 fát éget el."
arSA = "حمام ساخن وساونا تحت سقف واحد يتسع لما يصل إلى 8 من القنادس. تملأ الزيارة احتياجات الساونا والفرو المبلل وحمام البخار. يحرق 0.3 من الخشب في الساعة."

