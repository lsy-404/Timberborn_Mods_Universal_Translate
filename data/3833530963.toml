["Building.Outhouse.Description"]
status = "normal"
raw = "A small plank booth. Beavers who visit feel relieved, which adds to their wellbeing. Each visit leaves 1 compost for haulers to collect."
enUS = "A small plank booth. Beavers who visit feel relieved, which adds to their wellbeing. Each visit leaves 1 compost for haulers to collect."
zhCN = "一座小型木板厕所。来访的海狸会感到轻松，从而提升其福祉。每次来访都会留下 1 单位堆肥，供搬运工收集。"
zhTW = "一間小型木板廁所。來訪的海狸會感到安心，有助於提升其幸福感。每次造訪都會留下 1 份堆肥，供搬運工收集。"
ruRU = "Небольшая дощатая будка. Бобры, которые её посещают, испытывают облегчение, что повышает их благополучие. Каждое посещение оставляет 1 компост, который переносчики могут забрать."
jaJP = "小さな板張りの小屋。訪れたビーバーはほっとして、幸福度が上がる。訪問するたびに、運搬係が回収する堆肥が1つ残される。"
frFR = "Une petite cabine en planches. Les castors qui la visitent se sentent soulagés, ce qui améliore leur bien-être. Chaque visite laisse 1 compost que les transporteurs viennent récupérer."
deDE = "Eine kleine Holzhütte aus Brettern. Biber, die sie besuchen, fühlen sich erleichtert, was ihr Wohlbefinden steigert. Jeder Besuch hinterlässt 1 Kompost, den Transporteure abholen können."
plPL = "Mała drewniana budka z desek. Bobry, które ją odwiedzają, czują ulgę, co poprawia ich samopoczucie. Każda wizyta pozostawia 1 kompost, który transporterzy mogą odebrać."
ptBR = "Uma pequena cabine de tábuas. Castores que a visitam se sentem aliviados, o que aumenta o seu bem-estar. Cada visita deixa 1 composto para os transportadores recolherem."
koKR = "작은 널빤지 화장실 부스. 방문한 비버는 안도감을 느끼며, 이것이 비버의 행복도를 높입니다. 방문할 때마다 운반꾼이 수거할 퇴비 1개가 남습니다."
trTR = "Küçük bir tahta kulübe. Ziyaret eden kunduzlar rahatlar ve bu, refahlarına katkıda bulunur. Her ziyaret, taşıyıcıların toplayabileceği 1 kompost bırakır."
esES = "Una pequeña caseta de tablones. Los castores que la visitan se sienten aliviados, lo que aumenta su bienestar. Cada visita deja 1 de compost para que los transportistas lo recojan."
itIT = "Una piccola cabina di assi di legno. I castori che la visitano si sentono sollevati, il che contribuisce al loro benessere. Ogni visita lascia 1 compost da raccogliere per i trasportatori."
ukUA = "Невелика будка з дощок. Бобри, які її відвідують, почувають полегшення, що підвищує їхнє благополуччя. Кожен відвідувач залишає 1 компост, який можуть забрати перевізники."
thTH = "กระท่อมไม้กระดานขนาดเล็ก บีเวอร์ที่เข้ามาใช้จะรู้สึกโล่งใจ ซึ่งช่วยเพิ่มความเป็นอยู่ที่ดีของพวกมัน การใช้งานแต่ละครั้งจะทิ้งปุ๋ยหมัก 1 หน่วยไว้ให้ผู้ขนส่งมาเก็บ"
csCZ = "Malá dřevěná bouda z prken. Bobři, kteří ji navštíví, se cítí ulehčeně, což přispívá k jejich pohodě. Každá návštěva zanechá 1 kompost, který si odvážeči vyzvednou."
viVN = "Một gian nhà vệ sinh nhỏ bằng ván gỗ. Những hải ly ghé thăm cảm thấy nhẹ nhõm, điều này góp phần nâng cao hạnh phúc của chúng. Mỗi lần ghé thăm để lại 1 phân ủ để người vận chuyển thu gom."
caES = "Una petita cabina de fusta de taulons. Els castors que la visiten se senten alleujats, cosa que millora el seu benestar. Cada visita deixa 1 compost perquè els transportistes el recullin."
beBY = "Невялікі драўляны прыбіральня з дошак. Бабры, якія яе наведваюць, адчуваюць палёгку, што павялічвае іх дабрабыт. Кожнае наведванне пакідае 1 кампост, які перавозчыкі забіраюць."
roRO = "O cabină mică din scânduri. Castorii care o vizitează se simt uşuraţi, ceea ce le sporeşte bunăstarea. Fiecare vizită lasă 1 compost pe care cărăuşii îl pot colecta."
huHU = "Egy kis deszkából készült fülke. A látogató bávák megkönnyebbülnek, ami javítja a jóllétüket. Minden látogatás 1 komposztot hagy hátra, amelyet a szállítók összegyűjtenek."
arSA = "كشك صغير مصنوع من الألواح الخشبية. يشعر البيفرز الذين يزورونه بالارتياح، مما يزيد من رفاهيتهم. كل زيارة تترك سمادًا واحدًا (1) ليجمعه الناقلون."

