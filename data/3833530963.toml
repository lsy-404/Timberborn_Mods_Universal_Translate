["Building.DoubleOuthouse.Description"]
status = "normal"
raw = "Two booths side by side, one with a moon on the door and one with a star. Beavers who visit feel relieved, which adds to their wellbeing. Each visit leaves 1 compost for haulers to collect."
enUS = "Two booths side by side, one with a moon on the door and one with a star. Beavers who visit feel relieved, which adds to their wellbeing. Each visit leaves 1 compost for haulers to collect."
zhCN = "两间并排的厕所，一间门上画着月亮，另一间画着星星。来访的海狸会感到放松，从而提升其幸福感。每次使用都会留下 1 单位堆肥，供搬运工收集。"
zhTW = "兩間並排的廁所，一間門上畫著月亮，另一間畫著星星。來訪的海狸會感到安心，進而提升他們的幸福感。每次使用都會留下 1 單位堆肥，供搬運工收集。"
ruRU = "Две кабинки рядом: на одной двери нарисована луна, на другой — звезда. Бобры, которые их посещают, чувствуют облегчение, что повышает их благополучие. Каждое посещение оставляет 1 компост, который переносчики забирают."
jaJP = "2つの個室が並んでおり、一方のドアには月、もう一方には星が描かれている。訪れたビーバーは安堵し、その分だけ幸福度が上がる。利用のたびに堆肥が1つ残り、運搬員が回収する。"
frFR = "Deux cabines côte à côte, l'une avec une lune sur la porte et l'autre avec une étoile. Les castors qui les visitent se sentent soulagés, ce qui améliore leur bien-être. Chaque visite laisse 1 compost que les transporteurs viennent récupérer."
deDE = "Zwei Häuschen nebeneinander, eines mit einem Mond an der Tür und eines mit einem Stern. Biber, die sie besuchen, fühlen sich erleichtert, was ihr Wohlbefinden steigert. Jeder Besuch hinterlässt 1 Kompost, den Transporteure abholen können."
plPL = "Dwie kabiny obok siebie, jedna z księżycem na drzwiach, a druga z gwiazdą. Bobry, które ich używają, czują ulgę, co podnosi ich dobrostan. Każda wizyta zostawia 1 kompost, który transporterzy mogą odebrać."
ptBR = "Duas cabines lado a lado, uma com uma lua na porta e outra com uma estrela. Castores que as visitam se sentem aliviados, o que contribui para o bem-estar deles. Cada visita deixa 1 composto para os transportadores recolherem."
koKR = "두 개의 화장실 부스가 나란히 있습니다. 하나는 문에 달이, 다른 하나는 별이 그려져 있습니다. 방문한 비버들은 안도감을 느끼며, 이것은 그들의 행복도를 높입니다. 방문할 때마다 운반꾼이 수거할 퇴비 1개가 남습니다."
trTR = "Kapısında ay, diğerinde yıldız bulunan, yan yana iki kabin. Ziyaret eden kunduzlar rahatlar ve bu da refahlarını artırır. Her ziyaret, nakliyecilerin toplaması için 1 kompost bırakır."
esES = "Dos casetas una al lado de la otra, una con una luna en la puerta y otra con una estrella. Los castores que las visitan se sienten aliviados, lo que aumenta su bienestar. Cada visita deja 1 de compost para que los transportistas lo recojan."
itIT = "Due cabine affiancate, una con una luna sulla porta e l'altra con una stella. I castori che le visitano si sentono sollevati, il che contribuisce al loro benessere. Ogni visita lascia 1 compost da raccogliere per i trasportatori."
ukUA = "Два туалети поруч: один із місяцем на дверях, інший — із зіркою. Бобри, які їх відвідують, відчувають полегшення, що покращує їхнє самопочуття. Кожне відвідування залишає 1 компост, який перевізники можуть забрати."
thTH = "สองห้องน้ำวางเคียงข้างกัน ห้องหนึ่งมีรูปพระจันทร์ที่ประตู อีกห้องมีรูปดาว ชาวบีเวอร์ที่มาใช้บริการจะรู้สึกโล่งใจ ซึ่งช่วยเพิ่มความเป็นอยู่ที่ดีของพวกเขา ทุกครั้งที่มีการใช้บริการจะทิ้งปุ๋ยหมัก 1 หน่วยไว้ให้ผู้ขนส่งมาเก็บ"
csCZ = "Dvě kabinky vedle sebe, jedna s měsícem na dveřích a druhá s hvězdou. Obyvatelé bobrů, kteří je navštíví, se cítí ulehčeni, což přispívá k jejich pohodě. Každá návštěva zanechá 1 kompost, který roznášeči odvezou."
viVN = "Hai nhà vệ sinh đặt cạnh nhau, một cái có hình mặt trăng trên cửa và một cái có hình ngôi sao. Các hải ly đến thăm cảm thấy nhẹ nhõm, điều này góp phần nâng cao sức khỏe tinh thần của chúng. Mỗi lượt thăm để lại 1 phân compost cho người vận chuyển thu gom."
caES = "Dues cabines una al costat de l'altra, una amb una lluna a la porta i l'altra amb una estrella. Els castors que les visiten se senten alleujats, cosa que millora el seu benestar. Cada visita deixa 1 compost perquè els transportistes el recullin."
beBY = "Два прыбіральні побач: на дзвярах адной намалёваны месяц, на іншай — зорка. Бабры, якія ними карыстаюцца, адчуваюць палёгку, што павялічвае іх дабрабыт. Кожнае наведванне пакідае 1 кампост, які вазкі забіраюць."
roRO = "Două cabine una lângă alta, una cu o lună pe ușă și alta cu o stea. Castorii care le vizitează se simt ușurați, ceea ce le sporește bunăstarea. Fiecare vizită lasă 1 compost pe care transportatorii îl pot colecta."
huHU = "Két egymás melletti fülke, az egyik ajtaján hold, a másikén csillag. A látogató medvék megkönnyebbülnek, ami növeli a jólétüket. Minden látogatás 1 komposztot hagy hátra, amit a szállítók összegyűjtenek."
arSA = "كشكان متجاوران، أحدهما عليه صورة قمر على الباب والآخر عليه صورة نجمة. يشعر القنادس الذين يزورونهما بالارتياح، وهذا يزيد من رفاهيتهم. كل زيارة تترك 1 سماد لتجمعه الناقلات."

