jaJP = "「いつでも武装でき、長い遅延の後に爆発する安定化コア」"
frFR = "Un noyau stabilisé qui peut être armé à tout moment et qui explosera après un long délai."
deDE = "Ein stabilisierter Kern, der jederzeit bewaffnet werden kann und nach einer langen Verzögerung detoniert."
plPL = "Stabilizowane rdzenie, które można uzbroić w dowolnym momencie i które wybuchną po długim opóźnieniu."
ptBR = "Um núcleo estabilizado que pode ser armado a qualquer momento e detonará após um longo atraso."
koKR = "언제든지 장착할 수 있는 안정화된 코어로, 긴 지연 후 폭발합니다."
csCZ = "Stabilizované jádro, které může být kdykoli vyzbrojeno a po dlouhém zpoždění vybuchne."
viVN = "Một lõi ổn định có thể được kích hoạt bất cứ lúc nào và sẽ nổ sau một thời gian dài."
trTR = "Herhangi bir zamanda silahlandırılabilen ve uzun bir gecikmeden sonra patlayacak stabilize edilmiş bir çekirdek"
esES = "Un núcleo estabilizado que puede armarse en cualquier momento y detonará tras un largo retraso."
itIT = "Un nucleo stabilizzato che può essere armato in qualsiasi momento e detonerà dopo un lungo ritardo"
ukUA = "Стабілізоване ядро, яке можна будь-коли активувати та яке детонує після тривалої затримки"
thTH = "แกนที่มีเสถียรภาพซึ่งสามารถเปิดใช้งานได้ทุกเมื่อ และจะระเบิดหลังจากหน่วงเวลานาน"
