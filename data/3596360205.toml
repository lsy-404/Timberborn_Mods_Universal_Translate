["LV.StC.ArmDesc"]
raw = "After arming, the Stable Core will explode in {0:0.0} days. Once armed, the count-down cannot be stopped."
status = "normal"
enUS = "After arming, the Stable Core will explode in {0:0.0} days. Once armed, the count-down cannot be stopped."
zhCN = "激活后，稳定核心将在 {0:0.0} 天后爆炸。一旦激活，倒计时无法中止。"
zhTW = "武裝後，穩定核心將在 {0:0.0} 天內爆炸。一旦武裝，倒計時將無法停止。"
ruRU = "После вооружения Устойчивый Ядро взорвется через {0:0.0} дней. После вооружения обратный отсчет нельзя остановить."
