["LV.StC.StableCoreFlavor"]
raw = "'Still blows my mind how hoomans thought ‘unstable’ was a feature.' —xa0Beaverton"
status = "normal"
enUS = "'Still blows my mind how humans thought ‘unstable’ was a feature.' —xa0Beaverton"
zhCN = "“人类居然认为‘不稳定’是一种特性，真让我震惊。”——海狸顿"
zhTW = "「我仍然無法理解人類怎麼會認為『不穩定』是一個特性。」 — xa0比佛頓"
ruRU = "'Все еще поражает, как люди думали, что «нестабильность» — это особенность.' — Бивертон"
jaJP = "「『人間が「不安定」を特徴と考えていたとは、今でも私の心を驚かせる。』 — ビーバートン」」"
frFR = "« Ça me sidère toujours comment les hoomans pensaient que 'instable' était une fonctionnalité. » — Beaverton"
deDE = "„Es verblüfft mich immer noch, wie die Menschen dachten, ‚instabil‘ sei ein Merkmal.“ — Beaverton"
plPL = "'Wciąż mnie zadziwia, jak ludzie myśleli, że 'niestabilność' to funkcja.' — Beaverton"
ptBR = "\"Ainda me impressiona como os humanos pensavam que 'instável' era uma característica.\" — Beaverton"
koKR = "'불안정하다는 것이 특징이라고 인간들이 생각한 것이 아직도 믿기지가 않는다.' — 비버턴"
csCZ = "'Pořád mi to vyrazí dech, jak si lidé mysleli, že ‚nestabilní‘ je vlastnost.' —xa0Beaverton"
viVN = "'Vẫn khiến tôi sững sờ về cách loài người cho rằng ‘unstable’ là một đặc tính.' —xa0Beaverton"
trTR = "'Hoomanların 'dengesiz' bir özellik olduğunu düşündüklerine inanamıyorum.' —xa0Beaverton"
esES = "'Todavía me sorprende que los hoomans pensaran que ‘inestable’ fuera una característica.' —Beaverton"
itIT = "'Ancora mi stupisce come gli umani abbiano pensato che ‘instabile’ fosse una caratteristica.' —Beaverton"
ukUA = "«Досі не можу збагнути, як людці вирішили, що „нестабільність“ — це особливість.» —Beaverton"
thTH = "'ยังงงอยู่เลยว่าพวกฮูแมนคิดได้ยังไงว่า ‘ไม่เสถียร’ คือฟีเจอร์' —Beaverton"
caES = "\"Encara em sorprèn com els humans van pensar que «inestable» era una característica.\" —xa0Beaverton"
roRO = "„Încă mă uimește cum hoomanii au crezut că „instabil” este o caracteristică.” —xa0Beaverton"
huHU = "„Még mindig hihetetlen, hogy a hoomanok 'instabil' tulajdonságot gondoltak jellemzőnek.” —xa0Beaverton"
arSA = "\"ما زلت مندهشًا كيف فكّر البشر أن «غير مستقر» ميزة.» —xa0Beaverton"

