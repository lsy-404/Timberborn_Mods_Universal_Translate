koKR = "무장 후, 스테이블 코어는 {0:0.0}일 안에 폭발합니다. 무장한 이후에는 카운트다운을 중지할 수 없습니다."
csCZ = "Po vyzbrojení se Stabilní jádro exploduje za {0:0.0} dní. Jakmile je vyzbrojeno, odpočet nelze zastavit."
viVN = "Sau khi kích hoạt, Stable Core sẽ nổ sau {0:0.0} ngày. Khi đã kích hoạt, đếm ngược sẽ không thể bị dừng lại."
trTR = "Silahlandıktan sonra, Stabil Çekirdek {0:0.0} gün içinde patlayacak. Silahlandıktan sonra geri sayım durdurulamaz."
esES = "Tras armarse, el Núcleo Estable explotará en {0:0.0} días. Una vez armado, la cuenta atrás no puede detenerse."
itIT = "Dopo l'armamento, il Nucleo Stabile esploderà tra {0:0.0} giorni. Una volta armato, il conto alla rovescia non può essere interrotto."
ukUA = "Після активації Стабільне ядро вибухне через {0:0.0} дн. Після активації відлік зупинити неможливо."
thTH = "หลังจากเปิดใช้งาน Stable Core จะระเบิดภายใน {0:0.0} วัน เมื่อเปิดใช้งานแล้ว ไม่สามารถหยุดการนับถอยหลังได้"
caES = "Després d'armar-se, el Nucli Estable explotarà en {0:0.0} dies. Un cop armat, la compte enrere no es pot aturar."
beBY = "Пасля ўзбраення Стабільнае ядро выбухне праз {0:0.0} дня. Пасля ўзбраення адлік нельга спыніць."
roRO = "După armare, Nucleul Stabil va exploda peste {0:0.0} zile. Odată armat, numărătoarea inversă nu poate fi oprită."
huHU = "Az aktiválás után a Stabil Mag {0:0.0} nap múlva felrobban. Aktiválás után a visszaszámlálás nem állítható meg."
arSA = "بعد التفعيل، سينفجر النواة المستقرة خلال {0:0.0} يومًا. وبمجرد التفعيل، لا يمكن إيقاف العد التنازلي."

