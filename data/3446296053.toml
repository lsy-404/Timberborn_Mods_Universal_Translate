frFR = "Les contes folkloriques peuvent construire les maisons des Dents de Fer et vice versa. Ne pas travailler pour les maisons ajoutées par des mods. Par défaut du jeu : non."
deDE = "Folktails können die Häuser der Eisenbeißer bauen und umgekehrt. Arbeiten Sie nicht an Häusern, die durch Mods hinzugefügt wurden. Spielstandard: nein"
plPL = "Bajki mogą budować domy Żelaznych Zębów i vice versa. Nie działają dla domów dodanych przez mody. Domy domyślne w grze: nie"
ptBR = "Folktails podem construir as casas de Dentes de Ferro e vice-versa. Não funcionam para casas adicionadas por mods. Padrão do jogo: não."
koKR = "포크테일은 아이언 이빨의 집을 지을 수 있으며 그 반대도 가능합니다. 모드로 추가된 집에는 적용되지 않습니다. 게임 기본값: 아니오"
trTR = "Folktails, Demir Dişlerin evlerini inşa edebilir ve tam tersini de yapabilir. Modlar tarafından eklenen evler için geçerli değildir. Oyun varsayılanı: hayır"
esES = "Los Bucólicos pueden construir las casas de los Dienteférreos y viceversa. No funciona en las casas añadidas por mods. Valor predeterminado del juego: no"
itIT = "Le Codalesta possono costruire le case dei Denti di Ferro e viceversa. Non lavorare per le case aggiunte dalle mod. Impostazione predefinita del gioco: no"
ukUA = "Хвостонародці можуть будувати житло Залізнозубих і навпаки. Не працювати в житлі, доданому модами. Типове значення гри: ні"
thTH = "หางไม้สามารถสร้างบ้านของเขี้ยวเหล็กได้ และในทางกลับกันก็ได้ ห้ามทำงานให้กับบ้านที่เพิ่มโดยม็อด ค่าเริ่มต้นของเกม: ไม่"
csCZ = "Folktails mohou stavět domy Železných zubů a naopak. Nepracuje pro domy přidané modifikacemi. Výchozí hra: ne"
viVN = "Folktails có thể xây các căn nhà của Iron Teeth và ngược lại. Không áp dụng cho các căn nhà được thêm bởi các mod. Mặc định của trò chơi: không"
caES = "Els Folktails poden construir les cases dels Iron Teeth i viceversa. No treballis per a les cases afegides pels mods. Valor per defecte del joc: no"
beBY = "Фолктейлы могут строить дома Айрон Тиз, и наоборот. Не работать на домах, добавленных модами. Значение по умолчанию в игре: нет"
roRO = "Folktails pot construi casele Iron Teeth și invers. Nu lucra pentru casele adăugate de mod-uri. Setare implicită a jocului: nu"
huHU = "Folktailek építhetik az Iron Teeth házait, és fordítva. Ne dolgozzanak a modok által hozzáadott házakban. Játékalapérték: nem"
