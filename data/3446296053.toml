jaJP = "すべての入り口を1階に移動します（ダブルロッジのように）。また、MODによって追加された家にも対応します。グラフィックの変更はありません。ゲームのデフォルト: いいえ"
frFR = "Déplacez toutes les entrées au rez-de-chaussée (comme les Double Lodges). Fonctionne également pour les maisons ajoutées par des mods. Aucun changement graphique. Par défaut dans le jeu : non."
deDE = "Bewege alle Eingänge in das erste Obergeschoss (wie bei Doppelunterkünften). Funktioniert auch für Häuser, die durch Mods hinzugefügt wurden. Keine grafische Änderung. Spielstandard: nein"
plPL = "Przenieś wszystkie wejścia na pierwsze piętro (jak Double Lodges). Działa również dla domów dodanych przez mody. Brak zmian graficznych. Domyślne ustawienie gry: nie"
ptBR = "Mova todas as entradas para o primeiro andar (como os alojamentos duplos). Também funcione para casas adicionadas por mods. Sem alteração gráfica. Padrão do jogo: não"
koKR = "모든 입구를 1층으로 이동합니다(더블 로지와 같은). 모드로 추가된 집에도 적용됩니다. 그래픽 변화 없음. 게임 기본값: 아니오"
trTR = "Tüm girişleri birinci kata taşı (çift lojmanlar gibi). Modlarla eklenen evler için de geçerlidir. Görsel değişiklik yok. Oyun varsayılanı: hayır"
esES = "Mover todas las entradas al primer piso (como en los Dobles Alojamientos). También funciona con las casas añadidas por mods. Sin cambios gráficos. Valor predeterminado del juego: no"
itIT = "Sposta tutti gli ingressi al primo piano (come nelle Doppie Case). Funziona anche per le case aggiunte dalle mod. Nessuna modifica grafica. Impostazione predefinita di gioco: no"
ukUA = "Перемістити всі входи на перший поверх (як у подвійних житлах). Також працює для житлових будинків, доданих модами. Графічних змін немає. Типове значення в грі: ні"
thTH = "ย้ายทางเข้าทั้งหมดไปยังชั้นแรก (เช่นเดียวกับ Double Lodges) ใช้ได้กับบ้านที่เพิ่มโดยม็อดด้วย ไม่มีการเปลี่ยนแปลงทางกราฟิก ค่าเริ่มต้นของเกม: ไม่"
csCZ = "Přemístěte všechny vchody na první patro (jako u Dvojitých chatek). Funguje také pro domy přidané módy. Žádná grafická změna. Výchozí nastavení hry: ne"
viVN = "Di chuyển toàn bộ lối vào lên tầng một (giống như Double Lodges). Cũng áp dụng cho các căn nhà được thêm bởi các mod. Không có thay đổi đồ họa. Mặc định của trò chơi: không"
caES = "Mou totes les entrades al primer pis (com les Double Lodges). També funciona per a les cases afegides per mods. Sense canvis gràfics. Valor per defecte del joc: no"
beBY = "Перанесці ўсе ўваходы на першы паверх (як у падвойных жыллёвых будынках). Таксама працуе для дамоў, дададзеных модамі. Графічныя змены адсутнічаюць. Стандартна ў гульні: не"
roRO = "Mută toate intrările la primul etaj (ca la Double Lodges). Funcționează și pentru casele adăugate de moduri. Fără modificări grafice. Valoarea implicită a jocului: nu"
huHU = "Helyezze át az összes bejáratot az első emeletre (mint a Dupla Lakókban). Ez a házakra is vonatkozik, amelyeket modok adnak hozzá. Nincs grafikai változás. Alapértelmezett játékbeállítás: nem"
arSA = "نقل جميع المداخل إلى الطابق الأول (مثل المساكن المزدوجة). يعمل هذا الخيار أيضًا مع المساكن التي تضيفها المودات. لا يوجد تغيير في الرسومات. الإعداد الافتراضي للعبة: لا"

