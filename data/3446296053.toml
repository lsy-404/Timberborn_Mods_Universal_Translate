huHU = "Szorozza meg az alvásigény-kielégítettséget ezzel az értékkel. Játékbeli alapérték: 1, így óránként +0,2 (a Hód -0,2 és 0,8 alvás között lehet, naponta -0,6)."
arSA = "اضرب نسبة تلبية حاجة النوم في هذه القيمة. القيمة الافتراضية للعبة: 1، أي +0.2 في الساعة (يمكن أن يتراوح مستوى نوم الكائن بين -0.2 و0.8، أي -0.6 في اليوم)"

