["Lapantouflemagic.logstairs.Description"]
raw = "A bunch of logs arranged into primitive stairs\n<color=green>More variants available with the \"More groups\" mod </color>"
status = "normal"
enUS = "A bunch of logs arranged into primitive stairs  \n<color=green>More variants available with the \"More groups\" mod</color>"
zhCN = "用原木建造的简易楼梯。"
zhTW = "一堆原始階梯排列的木頭\n<color=green>更多變體可通過「更多群組」模組獲得</color>"
ruRU = "Группа бревен, уложенных в примитивные ступени  \n<color=green>Доступно больше вариантов с модом \"Больше групп\"</color>"
jaJP = "原始的な階段に並べられた一束の丸太  \n<color=green>「もっとグループ」モッドでより多くのバリアントが利用可能です</color>"
frFR = "Un tas de bûches disposées en escaliers primitifs  \n<color=green>Plus de variantes disponibles avec le mod \"Plus de groupes\"</color>"
deDE = "Ein Haufen von Stämmen, die zu primitiven Treppen angeordnet sind  \n<color=green>Weitere Varianten sind mit dem \"Mehr Gruppen\" Mod verfügbar</color>"
plPL = "Stos kłód ułożonych w prymitywne schody  \n<color=green>Więcej wariantów dostępnych z modyfikacją \"Więcej grup\" </color>"
ptBR = "Um monte de troncos organizados em escadas primitivas\n<color=green>Mais variantes disponíveis com o mod \"Mais grupos\"</color>"
koKR = "원시적인 계단으로 배열된 여러 개의 통나무\n<color=green>“더 많은 그룹” 모드로 더 많은 변형 사용 가능</color>"
trTR = "Bir dizi tomruk, ilkel merdivenler halinde düzenlenmiştir\n<color=green>“Daha fazla grup” modu ile daha fazla varyant mevcut</color>"
esES = "Un montón de troncos dispuestos como escalones primitivos\n<color=green>Hay más variantes disponibles con el mod \"More groups\" </color>"
itIT = "Un mucchio di tronchi disposti a formare una scala primitiva\n<color=green>Altre varianti disponibili con la mod \"More groups\" </color>"
ukUA = "Купа колод, складених у примітивні сходи\n<color=green>Більше варіантів доступно з модом \"More groups\" </color>"
thTH = "ท่อนไม้หลายท่อนถูกเรียงเป็นขั้นบันไดแบบดั้งเดิม\n<color=green>มีรูปแบบเพิ่มเติมให้เลือกเมื่อใช้มod \"More groups\"</color>"
csCZ = "Hromada kmenů uspořádaných do primitivních schodů\n<color=green>Více variant k dispozici s modem \"Více skupin\"</color>"
viVN = "Một đống khúc gỗ được xếp thành bậc thang sơ khai\n<color=green>Có nhiều biến thể khác có sẵn với mod \"More groups\"</color>"
caES = "Un conjunt de troncs disposats en forma d'escales primitives\n<color=green>Hi ha més variants disponibles amb el mod \"More groups\" </color>"
beBY = "Купа бервенняў, складзеных у першасныя прыступкі\n<color=green>Больш варыянтаў даступна з модам «More groups» </color>"
roRO = "O grămadă de bușteni așezate în forma unor trepte primitive\n<color=green>Mai multe variante disponibile cu modul „More groups” </color>"
huHU = "Egymásra rakott fatörzsekből összeállított, primitív lépcső\n<color=green>Több változat érhető el a „More groups” móddal </color>"
arSA = "مجموعة من الجذوع مرتبة على شكل درج بدائي\n<color=green>توجد متغيرات إضافية متاحة مع مود \"More groups\" </color>"

["Lapantouflemagic.logstairs.FlavorDescription"]
raw = "\"And <i>that</i> is why we need education\" \n—A scientist beaver"
status = "normal"
enUS = "\"And <i>that</i> is why we need education\" \n—A scientist beaver"
zhCN = "“这就是我们需要教育的原因。”——海狸学者"
zhTW = "「而<i>這</i>就是為什麼我們需要教育」  \n—科學家海狸"
ruRU = "«И <i>поэтому</i> нам нужно образование»  \n—Ученый бобер"
jaJP = "「そして<i>それ</i>が私たちに教育が必要な理由です」  \n—科学者ビーバー"
frFR = "\"Et <i>c'est</i> pourquoi nous avons besoin d'éducation.\" \n—Un castor scientifique"
deDE = "\"Und <i>deshalb</i> brauchen wir Bildung\"  \n—Ein wissenschaftlicher Biber"
plPL = "\"I <i>to</i> dlatego potrzebujemy edukacji\" \n—Naukowiec bóbr"
ptBR = "\"E <i>isso</i> é por isso que precisamos de educação\"  \n—Um castor cientista"
koKR = "\"그래서 <i>그것</i>이 우리가 교육이 필요한 이유입니다\"  \n—한 과학자 비버"
trTR = "\"Ve <i>işte</i> bu yüzden eğitime ihtiyacımız var\" \n—Bir bilimci kunduz"
esES = "«Y <i>por eso</i> necesitamos la educación»\n—Un castor científico"
itIT = "«E <i>questo</i> è il motivo per cui abbiamo bisogno dell'istruzione»\n—Un castoro scienziato"
ukUA = "\"І <i>ось</i> чому нам потрібна освіта\" \n—Бобер-науковець"
thTH = "\"และ<i>นั่นแหละ</i>คือเหตุผลที่เราต้องมีการศึกษา\"\n—นักวิทยาศาสตร์บีเวอร์"
csCZ = "\"A <i>to</i> je důvod, proč potřebujeme vzdělání.\" —Vědecký bobr"
viVN = "\"Và <i>đó</i> là lý do chúng ta cần giáo dục\"\n—Một nhà khoa học hải ly"
caES = "\"I aquesta <i>és</i> la raó per la qual necessitem educació\"\n—Un castor científic"
roRO = "\"Și <i>asta</i> este motivul pentru care avem nevoie de educație\"\n—Un castor savant"
huHU = "\"És <i>ezért</i> van szükségünk oktatásra\" \n—Egy tudós hód"
arSA = "\"وهذا بالضبط ما يُثبت أننا بحاجة إلى التعليم\" \"<i>ذلك</i>\n—قندس عالِم"

