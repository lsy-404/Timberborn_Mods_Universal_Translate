["Lapantouflemagic.Crappyplatform.Description"]
raw = "A sorry excuse of a platform, an embarassement to beaverkind.\n<color=green>More variants available with the \"More groups\" mod </color>"
status = "normal"
enUS = "A sorry excuse of a platform, an embarrassment to beaverkind. <color=green>More variants available with the \"More groups\" mod </color>"
zhCN = "用原木建造的简易平台，可以作为桥梁，或者其他建筑的地基。"
zhTW = "一個可悲的平台，對海狸族群的恥辱。<color=green>使用「更多組別」模組可獲得更多變體</color>"
ruRU = "Ужасное оправдание платформы, позор для бобров.  \n<color=green>Больше вариантов доступно с модом \"Больше групп\" </color>"
jaJP = "プラットフォームの申し訳ない言い訳であり、ビーバーの仲間にとって恥ずべき存在です。  \n<color=green>\"More groups\" モッドを使用すると、より多くのバリアントが利用可能です。</color>"
frFR = "Une triste excuse de plateforme, une honte pour le peuple castor.  \n<color=green>Plus de variantes disponibles avec le mod \"Plus de groupes\"</color>"
deDE = "Eine bedauerliche Ausrede für eine Plattform, eine Schande für die Biberart.  \n<color=green>Weitere Varianten sind mit dem \"Mehr Gruppen\"-Mod verfügbar</color>"
plPL = "Przykro mi, ale platforma jest żałosnym przykładem i hańbą dla bobrów. <color=green>Więcej wariantów dostępnych z modem \"Więcej grup\" </color>"
ptBR = "Uma desculpa miserável de plataforma, uma vergonha para a espécie dos castores.  \n<color=green>Mais variantes disponíveis com o mod \"Mais grupos\"</color>"
koKR = "미안한 변명의 플랫폼, 비버 종족에게 부끄러운 존재입니다.\n<color=green>“더 많은 그룹” 모드로 더 많은 변형이 가능합니다.</color>"
trTR = "Bir platforma için üzücü bir mazeret, kunduz türleri için bir utanç. <color=green>“Daha fazla grup” modu ile daha fazla varyant mevcut </color>"
esES = "Una plataforma miserable, una vergüenza para los castores.\n<color=green>Hay más variantes disponibles con el mod \"More groups\"</color>"
itIT = "A sorry excuse of a platform, un'autentica vergogna per la specie castorina.\n<color=green>Altre varianti disponibili con la mod \"More groups\" </color>"
ukUA = "Жалюгідна подобизна платформи, ганьба для бобриного роду.\n<color=green>Більше варіантів доступно з модом \"More groups\" </color>"
thTH = "แท่นไม้ที่แย่มาก น่าอับอายสำหรับเผ่าบีเวอร์\n<color=green>มีรูปแบบเพิ่มเติมให้เลือกใน mod \"More groups\" </color>"
csCZ = "Omlouvající se výmluva za platformu, ostuda pro bobří národ. \n<color=green>Další varianty k dispozici s modem \"Více skupin\" </color>"
viVN = "Một nền tảng tệ hại, một sự xấu hổ cho loài hải ly.\n<color=green>Có nhiều biến thể hơn có sẵn với mod \"More groups\"</color>"
caES = "Una pobra excusa de plataforma, una vergonya per a tots els castors.\n<color=green>Més variants disponibles amb el mod \"More groups\" </color>"
beBY = "Нікчэмная пляцоўка, ганьба для бабрыннага роду.\n<color=green>Больш варыянтаў даступна з модам \"More groups\" </color>"
roRO = "O scuză jalnică de platformă, o rușine pentru neamul castorilor.\n<color=green>Mai multe variante sunt disponibile cu modul „More groups” </color>"
arSA = "أداة منصة بائسة ومخزية، عار على جنس القنادس.\n<color=green>توجد متغيرات أكثر متاحة مع مود \"More groups\" </color>"

