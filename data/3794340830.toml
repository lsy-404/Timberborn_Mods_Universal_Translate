["LV.CrH.JibDesc"]
status = "normal"
raw = "A Crane Head that extends a Crane's working area from 3×3 to 5×5. Place it on top of a Crane Section."
enUS = "A Crane Head that extends a Crane’s working area from 3×3 to 5×5. Place it on top of a Crane Section."
zhCN = "一种起重机吊臂头，可将起重机的工作范围从 3×3 扩大到 5×5。将其放置在起重机节段顶部。"
zhTW = "起重機吊臂頭，可將起重機的作業範圍從 3×3 擴大至 5×5。請將其放置在起重機節段上方。"
ruRU = "Головка крана, увеличивающая рабочую зону крана с 3×3 до 5×5. Установите её на секцию крана."
jaJP = "クレーンの作業範囲を3×3から5×5に拡張するクレーンヘッドです。クレーンセクションの上に設置してください。"
frFR = "Une tête de grue qui étend la zone de travail d’une grue de 3×3 à 5×5. Placez-la au sommet d’un tronçon de grue."
deDE = "Ein Kranauslegerkopf, der den Arbeitsbereich eines Krans von 3×3 auf 5×5 erweitert. Platziere ihn oben auf einem Kranabschnitt."
plPL = "Głowica dźwigu, która zwiększa obszar roboczy dźwigu z 3×3 do 5×5. Umieść ją na sekcji dźwigu."
ptBR = "Uma Cabeça de Guindaste que amplia a área de trabalho de um Guindaste de 3×3 para 5×5. Coloque-a sobre uma Seção de Guindaste."
koKR = "크레인의 작업 범위를 3×3에서 5×5로 확장하는 크레인 헤드입니다. 크레인 섹션 위에 배치하세요."
csCZ = "Hlava jeřábu, která rozšíří pracovní oblast jeřábu z 3×3 na 5×5. Umístěte ji na horní část sekce jeřábu."
viVN = "Đầu cần cẩu giúp mở rộng phạm vi làm việc của Cần cẩu từ 3×3 lên 5×5. Đặt nó lên trên một Đoạn cần cẩu."
trTR = "Bir Vinç Kafası, vincin çalışma alanını 3×3'ten 5×5'e genişletir. Vinç Bölümü'nün üzerine yerleştirin."

["LV.CrH.JibFlavor"]
status = "normal"
raw = "Whoever designed this insisted the extra reach was for efficiency. The extra spinning was the real fun."
enUS = "Whoever designed this insisted the extra reach was for efficiency. The extra spinning was the real fun."
zhCN = "设计这玩意儿的人坚持说，加长臂展是为了提高效率。真正有趣的是多转几圈。"
zhTW = "設計這個的人堅稱，額外的伸展距離是為了提升效率。真正有趣的是多轉幾圈。"
ruRU = "Кто бы ни проектировал это, он настаивал, что дополнительный вылет нужен для эффективности. А настоящее удовольствие доставляло дополнительное вращение."
jaJP = "これを設計した者は、より長く届くのは効率のためだと言い張った。本当の楽しみは、余分に回転することだったのに。"
frFR = "La personne qui a conçu ça tenait à ce que la portée supplémentaire soit une question d’efficacité. Mais le vrai plaisir, c’était de faire tourner le tout davantage."
deDE = "Wer auch immer das entworfen hat, bestand darauf, dass die zusätzliche Reichweite der Effizienz diente. Der zusätzliche Drehspaß war das eigentliche Vergnügen."
plPL = "Kto zaprojektował to urządzenie, upierał się, że dodatkowy zasięg zwiększa wydajność. Prawdziwa frajda zaczynała się przy dodatkowym kręceniu."
ptBR = "Quem projetou isso insistiu que o alcance extra era para aumentar a eficiência. A verdadeira diversão estava no giro extra."
koKR = "이걸 설계한 사람은 추가로 닿는 거리가 효율성을 위한 거라고 고집했다. 하지만 진짜 재미는 더 많이 빙빙 도는 데 있었다."
csCZ = "Ten, kdo to navrhl, trval na tom, že větší dosah slouží k vyšší efektivitě. To pravé potěšení ale bylo v tom, že se točilo navíc."
viVN = "Người thiết kế thứ này khăng khăng rằng tầm với xa hơn là để tăng hiệu suất. Còn xoay thêm mới là phần vui thật sự."
trTR = "Bunu tasarlayan kişi, ekstra erişim mesafesinin verimlilik için olduğunda ısrar etti. Asıl eğlence, fazladan dönmekti."

