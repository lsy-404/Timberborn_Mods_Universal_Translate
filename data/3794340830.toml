zhCN = "沿弧形轨迹发射货物的起重机头。射程等于起重机节段的数量。"
zhTW = "沿弧形路徑發射貨物的吊臂頭。射程等於吊臂節的數量。"
ruRU = "Головка крана, запускающая товары по дуге. Дальность равна числу секций крана."
jaJP = "曲線軌道に沿って物資を発射するクレーンヘッド。射程はクレーンセクションの数と等しい。"
frFR = "Une tête de grue qui lance les marchandises selon une trajectoire courbe. Sa portée est égale au nombre de sections de grue."
deDE = "Ein Krankopf, der Waren entlang einer gekrümmten Bahn schleudert. Die Reichweite entspricht der Anzahl der Kranabschnitte."
plPL = "Głowica dźwigu, która wyrzuca towary po zakrzywionym torze. Zasięg jest równy liczbie sekcji dźwigu."
ptBR = "Uma Cabeça de Guindaste que lança mercadorias em uma trajetória curva. O alcance equivale ao número de Seções de Guindaste."
