frFR = "Une tête de grue qui projette des marchandises selon une trajectoire courbe. Sa portée est égale au nombre de sections de grue."
deDE = "Ein Krankopf, der Waren auf einer gekrümmten Bahn befördert. Die Reichweite entspricht der Anzahl der Kransegmente."
plPL = "Głowica dźwigu, która wyrzuca towary po zakrzywionym torze. Zasięg jest równy liczbie segmentów dźwigu."
