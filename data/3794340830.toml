beBY = "Галоўка крана, якая перамяшчае тавары па крывой траекторыі. Дальнасць роўная колькасці секцый крана."
roRO = "Un cap de macara care lansează bunuri pe o traiectorie curbată. Raza de acțiune este egală cu numărul de secțiuni ale macaralei."
huHU = "A Daru-fej olyan, amely az árukat ívelt pályán lövi ki. Hatótávolsága megegyezik a Daru-szakaszok számával."
