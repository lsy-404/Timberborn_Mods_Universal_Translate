["LV.CrH.WindmillDesc"]
status = "normal"
raw = "A Crane Head that turns the Crane into a wind-powered generator. Taller masts produce more HP."
enUS = "A Crane Head that turns the Crane into a wind-powered generator. Taller masts produce more HP."
zhCN = "一种可将起重机变成风力发电机的起重机头。桅杆越高，产生的 hp 越多。"
zhTW = "可將起重機改造成風力發電機的起重機頭。桅杆越高，產生的 hp 越多。"
ruRU = "Головка крана, превращающая кран в ветрогенератор. Чем выше мачта, тем больше мощности в hp."
jaJP = "クレーンを風力発電機に変えるクレーンヘッド。マストが高いほど、より多くの hp を発電します。"
frFR = "Une tête de grue qui transforme la grue en générateur éolien. Les mâts plus hauts produisent davantage de hp."
deDE = "Ein Krankopf, der den Kran in einen windbetriebenen Generator verwandelt. Höhere Masten erzeugen mehr hp."
plPL = "Głowica żurawia, która zamienia żuraw w napędzany wiatrem generator. Wyższe maszty wytwarzają więcej KM."
ptBR = "Uma Cabeça de Guindaste que transforma o Guindaste em um gerador movido a vento. Mastros mais altos produzem mais HP."
koKR = "크레인을 풍력 발전기로 바꾸는 크레인 헤드입니다. 돛대가 높을수록 더 많은 HP를 생산합니다."
csCZ = "Hlava jeřábu, která promění jeřáb ve větrný generátor. Vyšší stožáry produkují více hp."
viVN = "Đầu cần cẩu biến Cần cẩu thành máy phát điện chạy bằng sức gió. Cột buồm cao hơn tạo ra nhiều HP hơn."
trTR = "Vinç başlığını rüzgârla çalışan bir jeneratöre dönüştürür. Daha uzun direkler daha fazla HP üretir."

["LV.CrH.WindmillFlavor"]
status = "normal"
raw = "Whoever designed this insisted the extra height was for efficiency. The extra spinning was, once again, the real fun."
enUS = "Whoever designed this insisted the extra height was for efficiency. The extra spinning was, once again, the real fun."
zhCN = "设计它的人坚持说，额外的高度是为了提高效率。可真正有意思的，果然还是多转几圈。"
zhTW = "設計這玩意的人堅稱，多出來的高度是為了提升效率。再一次，真正有趣的是多轉的那幾圈。"
ruRU = "Тот, кто это спроектировал, настаивал, что дополнительная высота нужна для эффективности. А дополнительное вращение, как и прежде, оказалось настоящим весельем."
jaJP = "これを設計した者は、余分な高さは効率のためだと言い張った。やはり、本当のお楽しみは余分に回ることだった。"
frFR = "La personne qui a conçu ça insistait sur le fait que la hauteur supplémentaire améliorait le rendement. Le plaisir, une fois de plus, venait de la rotation supplémentaire."
deDE = "Wer auch immer das entworfen hat, bestand darauf, dass die zusätzliche Höhe der Effizienz dient. Das zusätzliche Drehen machte, wie so oft, in Wirklichkeit den Spaß aus."
plPL = "Ktokolwiek to zaprojektował, upierał się, że dodatkowa wysokość służy wydajności. Prawdziwą frajdę, jak zwykle, dawało dodatkowe kręcenie się."
ptBR = "Quem projetou isto insistiu que a altura extra era para aumentar a eficiência. Girar mais, mais uma vez, era a verdadeira diversão."
koKR = "이걸 설계한 사람은 높이를 더한 게 효율성을 위한 거라고 우겼다. 하지만 이번에도 진짜 재미는 더 많이 빙글빙글 도는 데 있었다."
csCZ = "Kdokoli to navrhl, trval na tom, že větší výška zvýší efektivitu. Točení navíc bylo opět tou pravou zábavou."
viVN = "Người thiết kế nó khăng khăng rằng chiều cao tăng thêm là để nâng cao hiệu suất. Còn việc quay tít thêm lần nữa mới là niềm vui thực sự."
trTR = "Bunu tasarlayan kişi, fazladan yüksekliğin verimlilik için gerekli olduğu konusunda ısrar etti. Fazladan dönmenin asıl eğlence olduğu ise yine ortaya çıktı."

