["LV.CrH.WindmillDesc"]
raw = "A Crane Head that turns the Crane into a wind-powered generator. Taller masts produce more HP."
status = "normal"
enUS = "A Crane Head that turns the Crane into a wind-powered generator. Taller masts produce more HP."
zhCN = "一种起重机头，可将起重机变成风力发电机。桅杆越高，产生的马力（HP）越多。"
zhTW = "將起重機轉變為風力發電機的起重機頭。桅杆越高，產生的 hp 越多。"
ruRU = "Головка крана, превращающая кран в ветрогенератор. Чем выше мачта, тем больше мощности в hp."
jaJP = "クレーンを風力発電機に変えるクレーンヘッド。マストが高いほど、より多くの hp を発電します。"
frFR = "Une tête de grue qui transforme la grue en générateur éolien. Les mâts plus hauts produisent davantage de hp."
deDE = "Ein Kranausleger, der den Kran in einen windbetriebenen Generator verwandelt. Höhere Masten erzeugen mehr hp."
plPL = "Głowica żurawia, która zamienia żuraw w generator napędzany wiatrem. Wyższe maszty wytwarzają więcej HP."
ptBR = "Uma Cabeça de Grua que transforma a Grua em um gerador movido a vento. Mastros mais altos produzem mais HP."
koKR = "크레인을 풍력 발전기로 바꾸는 크레인 헤드입니다. 돛대가 높을수록 더 많은 HP를 생산합니다."
csCZ = "Hlava jeřábu, která z jeřábu udělá větrný generátor. Vyšší stožáry produkují více HP."
viVN = "Đầu Cần cẩu biến Cần cẩu thành máy phát điện chạy bằng sức gió. Cột buồm càng cao thì tạo ra càng nhiều HP."
trTR = "Vinç Başlığı, Vinci rüzgârla çalışan bir jeneratöre dönüştürür. Daha uzun direkler daha fazla HP üretir."

["LV.CrH.WindmillFlavor"]
raw = "Whoever designed this insisted the extra height was for efficiency. The extra spinning was, once again, the real fun."
status = "normal"
enUS = "Whoever designed this insisted the extra height was for efficiency. The extra spinning was, once again, the real fun."
zhCN = "设计这东西的人坚持认为，额外的高度是为了提高效率。可真正有意思的，又一次是额外的旋转。"
zhTW = "設計這東西的人堅稱，多出來的高度是為了提升效率。再說一次，真正有趣的是多轉的那幾圈。"
ruRU = "Кто бы ни придумал эту конструкцию, он настаивал, что дополнительная высота нужна для эффективности. А настоящее удовольствие, как всегда, было в лишнем вращении."
jaJP = "これを設計した者は、余分な高さは効率のためだと言い張った。だが、今回も本当のお楽しみは余分に回ることだった。"
frFR = "La personne qui a conçu ça insistait sur le fait que la hauteur supplémentaire était nécessaire à l’efficacité. Le tourbillonnement supplémentaire était, une fois encore, le vrai plaisir."
deDE = "Wer auch immer das entworfen hat, bestand darauf, dass die zusätzliche Höhe der Effizienz diente. Das zusätzliche Drehen war, einmal mehr, der eigentliche Spaß."
plPL = "Ktokolwiek to zaprojektował, upierał się, że dodatkowa wysokość zwiększa wydajność. Jak zwykle, prawdziwą frajdę dawało dodatkowe kręcenie się."
ptBR = "Quem projetou isto insistiu que a altura extra era para aumentar a eficiência. A rotação extra, mais uma vez, é que era a verdadeira diversão."
koKR = "이걸 설계한 사람은 높이를 더한 게 효율을 위한 거라고 고집했다. 하지만 이번에도 진짜 재미는 더 많이 빙빙 도는 데 있었다."
csCZ = "Kdo to navrhl, trval na tom, že větší výška je kvůli účinnosti. To dodatečné otáčení bylo, jako obvykle, ta pravá zábava."
viVN = "Người thiết kế khăng khăng rằng chiều cao tăng thêm là để nâng cao hiệu suất. Còn quay thêm vòng nữa thì, một lần nữa, mới là niềm vui thật sự."
trTR = "Bunu tasarlayan kişi, fazladan yüksekliğin verimlilik için gerekli olduğu konusunda ısrar etmiş. Fazladan dönmenin asıl eğlence olduğuysa yine ortaya çıkmış."

