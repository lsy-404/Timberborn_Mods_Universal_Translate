csCZ = "Hlava jeřábu, která vrhá zboží po zakřivené dráze. Dosah se rovná počtu sekcí jeřábu."
viVN = "Đầu cần cẩu phóng hàng hóa theo đường cong. Tầm hoạt động bằng số Đoạn cần cẩu."
trTR = "Malların kavisli bir yörüngede fırlatılmasını sağlayan bir Vinç Başlığı. Menzili, Vinç Bölümü sayısına eşittir."

