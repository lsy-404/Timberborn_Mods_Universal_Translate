itIT = "Una Testa di Gru che lancia merci lungo una traiettoria curva. La portata è uguale al numero di Sezioni della Gru."
ukUA = "Голівка крана, яка запускає товари по вигнутій траєкторії. Дальність дорівнює кількості секцій крана."
thTH = "หัวเครน (Crane Head) ที่ส่งสินค้าไปตามเส้นทางโค้ง ระยะทำการเท่ากับจำนวนส่วนของเครน"
