viVN = "Đầu cần cẩu phóng hàng hóa theo đường cong. Tầm hoạt động bằng số Đoạn cần cẩu."
trTR = "Yükleri kavisli bir yörüngede fırlatan bir Vinç Başlığı. Menzili, Vinç Bölümü sayısına eşittir."

