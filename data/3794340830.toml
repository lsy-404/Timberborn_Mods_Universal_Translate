["LV.CrH.JibDesc"]
raw = "A Crane Head that extends a Crane's working area from 3×3 to 5×5. Place it on top of a Crane Section."
status = "normal"
enUS = "A Crane Head that extends a Crane's working area from 3×3 to 5×5. Place it on top of a Crane Section."
zhCN = "一种起重机头，可将起重机的工作区域从 3×3 扩大至 5×5。将其放置在起重机塔节顶部。"
zhTW = "可將起重機的作業範圍從 3×3 擴大至 5×5 的起重機吊臂。將其放置在起重機節段上方。"
ruRU = "Головка крана, увеличивающая рабочую область крана с 3×3 до 5×5. Установите её на секцию крана."
jaJP = "クレーンの作業範囲を3×3から5×5に広げるクレーンヘッド。クレーンセクションの上に設置してください。"
frFR = "Une tête de grue qui étend la zone de travail d’une grue de 3×3 à 5×5. Placez-la au sommet d’un segment de grue."
deDE = "Ein Kranausleger, der den Arbeitsbereich eines Krans von 3×3 auf 5×5 erweitert. Platziere ihn oben auf einem Kransegment."
plPL = "Głowica żurawia, która zwiększa obszar roboczy żurawia z 3×3 do 5×5. Umieść ją na szczycie sekcji żurawia."
ptBR = "Uma Cabeça de Guindaste que amplia a área de trabalho do Guindaste de 3×3 para 5×5. Coloque-a no topo de uma Seção de Guindaste."
koKR = "크레인의 작업 범위를 3×3에서 5×5로 확장하는 크레인 헤드입니다. 크레인 섹션 위에 배치하세요."
csCZ = "Hlava jeřábu, která rozšíří pracovní oblast jeřábu z 3×3 na 5×5. Umístěte ji na horní část segmentu jeřábu."
viVN = "Đầu cần cẩu mở rộng phạm vi hoạt động của Cần cẩu từ 3×3 lên 5×5. Đặt nó lên trên một Đoạn cần cẩu."
trTR = "Vinç çalışma alanını 3×3'ten 5×5'e genişleten bir Vinç Başlığı. Vinç Bölümünün üzerine yerleştirin."

["LV.CrH.JibFlavor"]
raw = "Whoever designed this insisted the extra reach was for efficiency. The extra spinning was the real fun."
status = "normal"
enUS = "Whoever designed this insisted the extra reach was for efficiency. The extra spinning was the real fun."
zhCN = "设计这个的人坚持说，额外的伸展范围是为了提高效率。真正有趣的是多转几圈。"
zhTW = "設計這東西的人堅稱，額外的延伸距離是為了提高效率。真正有趣的是多出來的旋轉。"
ruRU = "Тот, кто это спроектировал, настаивал, что дополнительный вылет нужен для эффективности. А настоящее удовольствие было в том, чтобы крутиться ещё больше."
jaJP = "これを設計した人は、追加のリーチは効率のためだと言い張っていた。本当のお楽しみは、余計に回転することだった。"
frFR = "La personne qui a conçu ça insistait sur le fait que la portée supplémentaire était là pour gagner en efficacité. C’est le tournoiement supplémentaire qui était vraiment amusant."
deDE = "Wer auch immer das entworfen hat, bestand darauf, dass die zusätzliche Reichweite der Effizienz diente. Das zusätzliche Drehen machte in Wirklichkeit Spaß."
plPL = "Ktoś, kto to zaprojektował, upierał się, że dodatkowy zasięg ma poprawiać wydajność. Prawdziwa frajda była z dodatkowego kręcenia się."
ptBR = "Quem projetou isso insistiu que o alcance extra era para aumentar a eficiência. A diversão de verdade estava em girar mais."
koKR = "이걸 설계한 사람은 더 멀리 닿는 게 효율을 위한 거라고 우겼다. 진짜 재미는 더 많이 빙글빙글 도는 데 있었다."
csCZ = "Ten, kdo to navrhl, trval na tom, že větší dosah slouží k efektivitě. To dodatečné otáčení bylo to pravé potěšení."
viVN = "Người thiết kế món này khăng khăng rằng tầm với xa hơn là để tăng hiệu suất. Nhưng xoay thêm mới là phần vui nhất."
trTR = "Bunu tasarlayan kişi, fazladan erişim mesafesinin verimlilik için olduğu konusunda ısrar etti. Asıl eğlence, fazladan dönmesiydi."

