["Building.AirLogisticsHub.Description"]
status = "normal"
raw = "Stores up to 1200 of every boxed good. A beaver helicopter rests on the roof helipad."
enUS = "Stores up to 1200 of every boxed good. A beaver helicopter rests on the rooftop helipad."
zhCN = "每种箱装货物最多可储存 1200 件。海狸直升机停在屋顶的直升机停机坪上。"
zhTW = "每種箱裝貨物最多可儲存 1200 個。海狸直升機會停在屋頂的直升機停機坪上。"
ruRU = "Хранит до 1200 единиц каждого товара в ящиках. На крыше расположена вертолётная площадка для бобров."
jaJP = "箱詰めされた各種物資を最大1200個まで保管します。ビーバー用ヘリコプターは屋上のヘリポートに着陸します。"
frFR = "Stocke jusqu’à 1200 unités de chaque marchandise en caisse. Un hélicoptère à castors se pose sur l’héliport du toit."
deDE = "Lagert bis zu 1200 von jeder verpackten Ware. Auf dem Hubschrauberlandeplatz auf dem Dach landet ein Biberhubschrauber."
plPL = "Przechowuje do 1200 sztuk każdego pakowanego towaru. Na lądowisku na dachu ląduje helikopter dla bobrów."
ptBR = "Armazena até 1200 de cada mercadoria encaixotada. Um helicóptero de castores fica no heliponto do telhado."
koKR = "상자에 담긴 모든 물품을 최대 1200개까지 저장합니다. 비버 헬리콥터는 옥상 헬기장에서 대기합니다."
csCZ = "Uskladní až 1200 kusů každého zboží v bednách. Na střešním heliportu přistává bobří vrtulník."
viVN = "Lưu trữ tối đa 1200 đơn vị mỗi loại hàng hóa đóng thùng. Trực thăng của hải ly đậu trên bãi đáp trực thăng trên mái nhà."
trTR = "Her tür kutulu üründen en fazla 1200 adet depolar. Çatıdaki helikopter pistinde bir kunduz helikopteri bulunur."

["Building.AirLogisticsHub.FlavorDescription"]
status = "normal"
raw = "The rotor is carved from a single plank and smells faintly of moss. Nobody has seen it fly yet, but the beavers keep polishing it."
enUS = "The rotor is carved from a single plank and smells faintly of moss. Nobody has seen it fly yet, but the beavers keep polishing it."
zhCN = "转子由一整块木板雕刻而成，隐约散发着苔藓的气味。还没人见过它飞起来，但海狸们仍在不停地打磨它。"
zhTW = "轉子是用一整塊木板雕成的，隱約散發著苔蘚的氣味。還沒有人看過它飛起來，但海狸們仍不斷把它擦得亮晶晶的。"
ruRU = "Ротор вырезан из цельной доски и слегка пахнет мхом. Пока никто не видел, как он летает, но бобры продолжают его полировать."
jaJP = "ローターは一枚の板から削り出され、かすかに苔の匂いがする。まだ飛ぶところを見た者はいないが、ビーバーたちはせっせと磨き続けている。"
frFR = "Le rotor est sculpté dans une seule planche et sent légèrement la mousse. Personne ne l’a encore vu voler, mais les castors continuent de le polir."
deDE = "Der Rotor ist aus einem einzigen Brett geschnitzt und riecht schwach nach Moos. Noch hat ihn niemand fliegen sehen, aber die Biber polieren ihn immer weiter."
plPL = "Wirnik wyrzeźbiono z jednej deski i delikatnie pachnie mchem. Nikt jeszcze nie widział, żeby latał, ale bobry wciąż go polerują."
ptBR = "O rotor é esculpido em uma única tábua e tem um leve cheiro de musgo. Ninguém ainda o viu voar, mas os castores continuam polindo-o."
koKR = "회전 날개는 나무판 한 장을 깎아 만들었고 이끼 냄새가 희미하게 난다. 아직 날아오르는 모습을 본 사람은 없지만, 비버들은 계속해서 윤을 낸다."
csCZ = "Rotor je vyřezaný z jediného prkna a slabě voní po mechu. Zatím ho nikdo neviděl létat, ale bobři ho pořád leští."
viVN = "Cánh quạt được đẽo từ một tấm ván duy nhất và thoang thoảng mùi rêu. Chưa ai thấy nó bay, nhưng các cư dân hải ly vẫn cứ đánh bóng nó."
trTR = "Rotor tek bir kalasın oyulmasıyla yapılmış ve hafifçe yosun kokuyor. Henüz uçtuğunu gören olmadı ama kunduzlar onu cilalamaya devam ediyor."

