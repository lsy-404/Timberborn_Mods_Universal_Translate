["Building.AirLogisticsHub.Description"]
raw = "Stores up to 1200 of every boxed good. A beaver helicopter rests on the roof helipad."
status = "normal"
enUS = "Stores up to 1200 of each boxed good. A beaver helicopter rests on the rooftop helipad."
zhCN = "每种装箱货物最多可储存 1200 件。屋顶停机坪可供海狸直升机停靠。"
zhTW = "每種裝箱貨物最多可儲存 1200 個。屋頂停機坪可供海狸直升機停放。"
ruRU = "Хранит до 1200 единиц каждого упакованного товара. На крыше находится вертолётная площадка для бобрового вертолёта."
jaJP = "箱入りの各種グッズを最大1200個まで保管します。ビーバー用ヘリコプターは屋上のヘリポートに着陸します。"
frFR = "Stocke jusqu’à 1200 unités de chaque marchandise conditionnée. Un hélicoptère à castors se pose sur l’héliport du toit."
deDE = "Lagert bis zu 1200 von jeder Art verpackter Ware. Auf dem Dachlandeplatz steht ein Biberhubschrauber."
plPL = "Przechowuje do 1200 sztuk każdego towaru pakowanego w skrzynie. Na lądowisku na dachu ląduje śmigłowiec z bobrem na pokładzie."
ptBR = "Armazena até 1200 unidades de cada mercadoria encaixotada. Um helicóptero de castor fica na plataforma de pouso no telhado."
koKR = "상자에 담긴 모든 물품을 최대 1200개까지 보관합니다. 비버 헬리콥터가 지붕의 헬리패드에 착륙합니다."
csCZ = "Uskladní až 1200 kusů každého zboží v bednách. Na střešním heliportu parkuje bobří vrtulník."
viVN = "Lưu trữ tối đa 1200 đơn vị mỗi loại hàng đóng hộp. Một chiếc trực thăng chở hải ly đỗ trên bãi đáp trực thăng trên mái nhà."
trTR = "Kutulanmış her tür üründen en fazla 1200 depolar. Çatısındaki helikopter pistine bir kunduz helikopteri iner."

["Building.AirLogisticsHub.FlavorDescription"]
raw = "The rotor is carved from a single plank and smells faintly of moss. Nobody has seen it fly yet, but the beavers keep polishing it."
status = "normal"
enUS = "The rotor is carved from a single plank and smells faintly of moss. Nobody has seen it fly yet, but the beavers keep polishing it."
zhCN = "转子由一整块木板雕刻而成，隐约散发着苔藓的气味。还没人见过它飞起来，不过海狸们一直在给它擦亮。"
zhTW = "這個轉子是用一整塊木板雕成的，隱約散發著苔蘚的氣味。還沒有人看過它飛起來，但海狸們仍不斷把它擦亮。"
ruRU = "Ротор вырезан из цельной доски и слегка пахнет мхом. Никто ещё не видел, чтобы он летал, но бобры продолжают его полировать."
jaJP = "ローターは一枚の板から削り出され、かすかに苔の匂いがする。まだ飛ぶところを見た者はいないが、ビーバーたちは磨き続けている。"
frFR = "Le rotor est taillé dans une seule planche et sent légèrement la mousse. Personne ne l’a encore vu voler, mais les castors continuent de le polir."
deDE = "Der Rotor ist aus einem einzigen Brett geschnitzt und riecht leicht nach Moos. Noch hat ihn niemand fliegen sehen, aber die Biber polieren ihn trotzdem ständig."
plPL = "Wirnik wyrzeźbiono z jednej deski i lekko pachnie mchem. Nikt jeszcze nie widział, żeby latał, ale bobry wciąż go polerują."
ptBR = "O rotor é esculpido em uma única tábua e tem um leve cheiro de musgo. Ninguém ainda o viu voar, mas os castores continuam polindo-o."
koKR = "회전날개는 널빤지 하나를 통째로 깎아 만들었으며 희미하게 이끼 냄새가 난다. 아직 날아가는 모습을 본 비버는 없지만, 비버들은 계속해서 회전날개를 닦고 있다."
csCZ = "Rotor je vyřezaný z jediného prkna a slabě voní po mechu. Ještě ho nikdo neviděl létat, ale bobři ho pořád leští."
viVN = "Cánh quạt được đẽo từ một tấm ván duy nhất và thoang thoảng mùi rêu. Chưa ai thấy nó bay cả, nhưng các cư dân hải ly vẫn cứ đánh bóng nó."
trTR = "Rotor tek bir kalas oyularak yapılmış ve hafifçe yosun kokuyor. Henüz uçtuğunu gören olmadı ama kunduzlar onu cilalamaya devam ediyor."

