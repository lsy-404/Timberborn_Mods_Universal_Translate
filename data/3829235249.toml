["Building.MoMoWalkableFloodgate.Description"]
status = "normal"
raw = "A stackable floodgate beavers can walk on. Stacks on other blocks; walkable on every level."
enUS = "A stackable floodgate that beavers can walk on. Stacks on other blocks; beavers can walk on every level."
zhCN = "可堆叠的水闸，海狸可以在上面行走。可叠放在其他方块上；每一层都可行走。"
zhTW = "可堆疊的水閘，海狸可以在上面行走。可堆疊於其他方塊上；每一層都可行走。"
ruRU = "Штабелируемый затвор, по которому могут ходить бобры. Можно ставить поверх других блоков; проходить можно на каждом уровне."
jaJP = "ビーバーが上を歩ける積み重ね可能な水門。他のブロックの上に積み重ねられ、どの階層も歩行可能。"
frFR = "Une vanne empilable sur laquelle les castors peuvent marcher. S'empile sur d'autres blocs ; praticable à chaque niveau."
deDE = "Ein stapelbares Fluttor, auf dem Biber laufen können. Kann auf anderen Blöcken gestapelt werden; auf jeder Ebene begehbar."
plPL = "Piętrowe wrota przeciwpowodziowe, po których bobry mogą chodzić. Można je ustawiać na innych blokach; po każdym poziomie można chodzić."
ptBR = "Comporta empilhável sobre a qual os castores podem andar. Empilha-se sobre outros blocos; pode-se andar em todos os níveis."
koKR = "비버가 걸어 다닐 수 있는 적층형 수문. 다른 블록 위에 쌓을 수 있으며 모든 층에서 걸어 다닐 수 있습니다."
csCZ = "Stohovatelný stavidlo, po kterém mohou bobři chodit. Lze stavět na jiných blocích; je průchozí na každé úrovni."
viVN = "Cửa phai có thể xếp chồng mà hải ly đi lại được. Xếp trên các khối khác; đi lại được ở mọi tầng."
trTR = "Üst üste yerleştirilebilen, kunduzların üzerinde yürüyebildiği bir savak. Diğer blokların üzerine istiflenir; her seviyesinde yürünebilir."

["Building.MoMoWalkableFloodgate.FlavorDescription"]
status = "normal"
raw = "Ol' kazko never foresaw that a beaver would like to stroll along the whole dam..."
enUS = "Ol' Kazko never foresaw that a beaver would like to stroll along the whole dam..."
zhCN = "老卡兹科从没料到海狸会喜欢沿着整座堤坝散步……"
zhTW = "老 kazko 從沒料到，竟會有海狸想沿著整座水壩散步……"
ruRU = "Старина Kazko и представить не мог, что бобру захочется прогуляться по всей плотине..."
jaJP = "カズコじいさんは、ビーバーがダム全体を散歩したがるとは思いもしなかった……"
frFR = "Le vieux Kazko n’avait jamais imaginé qu’un castor aimerait se promener tout le long du barrage..."
deDE = "Der alte Kazko hätte nie gedacht, dass ein Biber gern über den ganzen Damm spazieren würde..."
plPL = "Stary Kazko nigdy nie przewidział, że bóbr zechce przespacerować się wzdłuż całej tamy..."
ptBR = "O velho Kazko nunca imaginou que um castor gostaria de passear por toda a barragem..."
koKR = "늙은 카즈코는 비버가 댐 전체를 따라 산책하고 싶어 할 줄은 전혀 예상하지 못했다..."
csCZ = "Starý Kazko nikdy nepředvídal, že se bobr bude rád procházet po celé hrázi..."
viVN = "Lão Kazko chưa bao giờ ngờ rằng một chú hải ly lại thích đi dạo dọc suốt con đập..."
trTR = "İhtiyar Kazko, bir kunduzun barajın tamamı boyunca gezinmek isteyeceğini hiç öngörmemişti..."

