thTH = "ประตูระบายน้ำที่วางซ้อนกันได้และบีเวอร์เดินบนได้ รูปลักษณ์ทาสีขาว เดินได้ทุกระดับ"
caES = "Una comporta apilable per la qual els castors poden caminar. Aspecte emblanquinat. Es pot caminar per tots els nivells."
beBY = "Шлюзавы затвор, які можна ўкладваць адзін на адзін і па якім бабры могуць хадзіць. Пабелены выгляд. Хадзіць можна на кожным узроўні."
roRO = "Un stăvilar suprapunabil pe care castorii pot merge. Aspect văruit. Se poate merge pe fiecare nivel."
huHU = "Egymásra rakható zsilipkapu, amelyen a hódok járhatnak. Meszelt külsejű. Minden szinten járható."
arSA = "بوابة فيضان قابلة للتكديس، يمكن للقنادس السير عليها. بمظهر مطلي باللون الأبيض. يمكن السير عليها في كل المستويات."

