trTR = "Kunduzların üzerinde yürüyebildiği, üst üste yerleştirilebilir bir su kapısı. Beyaz badanalı görünüm. Her seviyesinde yürünebilir."
esES = "Compuerta apilable por la que pueden caminar los castores. Aspecto encalado. Se puede caminar sobre ella en todos los niveles."
itIT = "Una paratoia impilabile su cui i castori possono camminare. Aspetto imbiancato. Percorribile a ogni livello."
