["LV.CFac.AddPlantsDesc"]
raw = "You can grow crops and trees of other factions. You must add the Folktails' Aquatic Farmhouse to all other factions to prevent crash."
status = "normal"
enUS = "You can grow crops and trees from other factions. You must add the Folktails' Aquatic Farmhouse to all other factions to prevent a crash."
zhCN = "允许种植其他种族的作物和树木。<br>注意，必须将水生农屋添加到所有其他种族中，以防止游戏崩溃。"
zhTW = "您可以種植其他派系的農作物和樹木。您必須將Folktails的水生農舍添加到所有其他派系以防止崩潰。"
ruRU = "Вы можете выращивать культуры и деревья других фракций. Вы должны добавить Водное Фермерское Хозяйство Фольклейлов ко всем остальным фракциям, чтобы избежать сбоя."
jaJP = "他の派閥の作物や木を育てることができます。他のすべての派閥にフォークテイルの水生農家を追加する必要があります。クラッシュを防ぐためです。"
frFR = "Vous pouvez cultiver des récoltes et des arbres d'autres factions. Vous devez ajouter la Ferme Aquatique des Folktails à toutes les autres factions pour éviter les plantages."
deDE = "Sie können Pflanzen und Bäume anderer Fraktionen anbauen. Sie müssen das Aquatische Bauernhaus der Folktails zu allen anderen Fraktionen hinzufügen, um Abstürze zu vermeiden."
plPL = "Możesz uprawiać rośliny i drzewa innych frakcji. Musisz dodać Wodny Dom Folktails do wszystkich innych frakcji, aby zapobiec awarii."
ptBR = "Você pode cultivar plantas e árvores de outras facções. Você deve adicionar a Casa de Fazenda Aquática dos Folktails a todas as outras facções para evitar falhas."
koKR = "다른 세력의 작물과 나무를 재배할 수 있습니다. 충돌을 방지하려면 모든 다른 세력에 Folktails의 수생 농가를 추가해야 합니다."
trTR = "Diğer fraksiyonların mahsullerini ve ağaçlarını büyütebilirsiniz. Çöküşü önlemek için Folktails'in Su Kenarı Çiftliği'ni tüm diğer fraksiyonlara eklemelisiniz."
esES = "Puedes cultivar cultivos y árboles de otras facciones. Debes añadir la Granja Acuática de los Bucólicos a todas las demás facciones para evitar un fallo."
itIT = "Puoi coltivare colture e alberi di altre fazioni. Devi aggiungere la Casa Acquatica di Codalesta a tutte le altre fazioni per evitare un crash."
ukUA = "Ви можете вирощувати культури та дерева інших фракцій. Ви повинні додати Аквatiчну ферму Хвостонародців до всіх інших фракцій, щоб запобігти збою."
thTH = "คุณสามารถปลูกพืชผลและต้นไม้ของกลุ่มอื่นได้ คุณต้องเพิ่มเรือนเพาะปลูกน้ำของหางไม้ให้กับกลุ่มอื่นทั้งหมดเพื่อป้องกันการขัดข้อง"
csCZ = "Můžete pěstovat plodiny a stromy z jiných frakcí. Musíte přidat Vodní farmu Folktails k ostatním frakcím, abyste zabránili pádu hry."
viVN = "Bạn có thể trồng hoa màu và cây của các phái khác. Bạn phải thêm Trang trại thủy sinh Folktails vào tất cả các phái khác để tránh sự cố treo game."
caES = "Podeu conrear cultius i arbres d'altres faccions. Heu d'afegir la Granja Aquàtica dels Folktails a totes les altres faccions per evitar que el joc es bloquegi."
beBY = "Вы можаце вырошчваць культуры і дрэвы іншых фракцый. Вы павінны дадаць Аквататычную фермерскую хату фракцыі Folktails ва ўсе іншыя фракцыі, каб прадухіліць збой."
roRO = "Puteți cultiva culturi și copaci ale altor facțiuni. Trebuie să adăugați Ferma acvatică a Folktails-ilor la toate celelalte facțiuni pentru a preveni blocarea jocului."
huHU = "Más frakciók növényeit és fáit is termesztheted. Minden más frakciónál hozzá kell adnod a Folktails Vízi Farmházat, hogy elkerüld az összeomlást."
arSA = "يمكنك زراعة المحاصيل والأشجار الخاصة بالفصائل الأخرى. يجب إضافة \"مزرعة الفولكتيلز المائية\" إلى جميع الفصائل الأخرى لمنع الانهيار."

["LV.CFac.AddPlantsNotif"]
