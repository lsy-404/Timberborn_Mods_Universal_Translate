koKR = "모든 진영에 동일한 이름의 건물이 있을 경우(예: 경로 또는 플랫폼) 비슷한 이름을 가진 건물을 제거해 보세요."
trTR = "Tüm fraksiyonların sahip olduğu benzer isimli binaları kaldırmayı dene (yol veya platformlar gibi)"
esES = "Intenta eliminar edificios con nombres similares cuando todas las facciones los tengan (como Sendero o Plataformas)"
itIT = "Prova a rimuovere gli edifici con nomi simili quando tutte le fazioni li hanno (come Percorso o Piattaforme)"
ukUA = "Спробуйте прибрати будівлі з подібними назвами, якщо вони є у всіх фракцій (наприклад, Доріжка або Платформи)"
thTH = "ลองลบสิ่งปลูกสร้างที่มีชื่อคล้ายกันเมื่อทุกกลุ่มมีสิ่งปลูกสร้างเหล่านั้น (เช่น ทางเดินหรือแพลตฟอร์ม)"
csCZ = "Pokuste se odstranit budovy se podobnými názvy, když je mají všechny frakce (například Cesty nebo Plattformy)"
viVN = "Cố gắng loại bỏ các công trình có tên tương tự khi tất cả các phe đều có chúng (như Đường đi hoặc Nền tảng)"
caES = "Intenta eliminar els edificis amb noms similars quan totes les faccions en tinguin (com Path o Platforms)"
beBY = "Паспрабуйце выдаляць будынкі з аднолькавымі назвамі, калі яны ёсць у усіх фракцыях (напрыклад, Шлях або Платформы)"
roRO = "Încercați să eliminați clădirile cu nume similare atunci când toate facțiunile le au (cum ar fi Cale sau Platforme)"
huHU = "Próbáld meg eltávolítani a hasonló nevű épületeket, ha minden frakciónak van belőlük (például Ösvény vagy Platformok)"
arSA = "حاول إزالة المباني ذات الأسماء المتشابهة عندما تمتلكها جميع الفصائل (مثل Path أو Platforms)"

