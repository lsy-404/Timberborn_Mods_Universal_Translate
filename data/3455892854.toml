ukUA = "Ви маєте додати Aquatic Farmhouse до Залізнозубих, інакше гра вилетить під час завантаження для Залізнозубих."
thTH = "ต้องเพิ่ม Aquatic Farmhouse ให้กับเขี้ยวเหล็ก ไม่เช่นนั้นเกมจะค้างเมื่อโหลดสำหรับเขี้ยวเหล็ก"
csCZ = "Musíte přidat Vodní farmu k Železným zubům, jinak dojde při načítání pro Železné zuby k pádu."
viVN = "Bạn phải thêm Aquatic Farmhouse vào Iron Teeth, nếu không khi tải cho Iron Teeth sẽ bị treo."
caES = "Heu d'afegir Aquatic Farmhouse a Iron Teeth, o es bloquejarà en carregar-se per a Iron Teeth."
beBY = "Вы павінны дадаць Aquatic Farmhouse для Iron Teeth, інакш гульня аварыйна завершыцца пры загрузцы для Iron Teeth."
roRO = "Trebuie să adaugi Aquatic Farmhouse pentru Iron Teeth, altfel jocul se va bloca la încărcare pentru Iron Teeth."
huHU = "Hozzá kell adnod az Aquatic Farmhouse-t a Iron Teeth-hez, különben a játék betöltésekor összeomlik Iron Teeth esetén."
arSA = "يجب عليك إضافة \"Aquatic Farmhouse\" إلى Iron Teeth وإلا فسيتعطل اللعب عند التحميل لصالح Iron Teeth."

