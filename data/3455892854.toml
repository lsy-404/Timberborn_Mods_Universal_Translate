["LV.CFac.NoBotNeedsDesc"]
raw = "Don't add Bot's needs to other factions (Biofuel and Energy)\nYou must not add Biofuel production building (Refinery) to Iron Teeth or the game would crash on building it."
status = "normal"
enUS = "Don't add Bot's needs to other factions (Biofuel and Energy)\nYou must not add Biofuel production building (Refinery) to Iron Teeth or the game would crash on building it."
zhCN = "不添加其他种族的机关人需求（生物燃料、充电）。<br>注意，禁止将精炼厂添加到铁牙种族中，否则在建造时会游戏崩溃。"
zhTW = "不要將機器人的需求加入其他派系（生物燃料和能源）。  \n您必須不要將生物燃料生產建築（煉油廠）加入鐵牙派系，否則遊戲在建造時會崩潰。"
ruRU = "Не добавляйте потребности Бота к другим фракциям (Биотопливо и Энергия). Вы не должны добавлять здание производства биотоплива (Нефтеперерабатывающий завод) к Железным Зубам, иначе игра выйдет из строя при его строительстве."
jaJP = "他の派閥にボットのニーズを追加しないでください（バイオ燃料とエネルギー）。  \nアイアンティースにバイオ燃料生産建物（精製所）を追加しないでください。そうしないと、建設時にゲームがクラッシュします。"
frFR = "N'ajoutez pas les besoins des Bots aux autres factions (Biocarburant et Énergie). Vous ne devez pas ajouter le bâtiment de production de biocarburant (Raffinerie) aux Iron Teeth sous peine de faire planter le jeu lors de sa construction."
deDE = "Fügen Sie den Bedürfnissen des Bots keine anderen Fraktionen (Biokraftstoff und Energie) hinzu. Sie dürfen kein Biokraftstoffproduktionsgebäude (Raffinerie) zu den Iron Teeth hinzufügen, da das Spiel beim Bau abstürzen würde."
plPL = "Nie dodawaj potrzeb Bota do innych frakcji (Biopaliwo i Energia).\nNie wolno dodawać budynku produkcji biopaliwa (Rafineria) do Żelaznych Zębów, ponieważ gra zawiesi się przy jego budowie."
ptBR = "Não adicione as necessidades do Bot a outras facções (Biocombustível e Energia). Você não deve adicionar o edifício de produção de biocombustível (Refinaria) aos Dentes de Ferro ou o jogo travará ao construí-lo."
koKR = "봇의 필요를 다른 진영(바이오 연료와 에너지)에 추가하지 마세요. 철 이빨 진영에 바이오 연료 생산 건물(정제소)을 추가하면 건물 건설 시 게임이 충돌합니다."
trTR = "Bot ihtiyaçlarını diğer fraksiyonlara ekleme (Biyoyakıt ve Enerji)\nBiyoyakıt üretim binasını (Arıtma Tesisi) Demir Dişler'e eklememelisin, aksi takdirde bina inşa edilirken oyun çökebilir."
esES = "No añadas las necesidades de los Bots a otras facciones (Biocombustible y Energía)\nNo debes añadir el edificio de producción de biocombustible (Refinería) a los Dienteférreos, o el juego se bloqueará al construirlo."
itIT = "Non aggiungere i bisogni dei Bot ad altre fazioni (Biocarburante ed Energia)\nNon devi aggiungere l'edificio di produzione di biocarburante (Raffineria) ai Denti di Ferro, altrimenti il gioco andrebbe in crash alla costruzione di quell'edificio."
ukUA = "Не додавайте потреби Бота іншим фракціям (Біопаливо та Енергія)\nНе можна додавати будівлю виробництва біопалива (Переробний завод) до Залізнозубих, інакше гра вилетить під час її будівництва."
thTH = "อย่าเพิ่มความต้องการของ Bot ให้กับฝ่ายอื่น (Biofuel และ Energy)\nคุณต้องไม่เพิ่มอาคารผลิต Biofuel (Refinery) ให้กับเขี้ยวเหล็ก ไม่เช่นนั้นเกมจะค้างเมื่อสร้างอาคารนั้น"
csCZ = "Nepřidávejte potřeby Botů k jiným frakcím (Biopalivo a Energie)  \nNeměli byste přidávat budovu pro výrobu biopaliva (Rafinérie) k Železným zubům, jinak dojde k pádu hry při jejím stavbě."
viVN = "Đừng thêm nhu cầu của bot cho các phe khác (Nhiên liệu sinh học và Năng lượng)\nBạn không được thêm tòa nhà sản xuất nhiên liệu sinh học (nhà máy tinh chế) cho Iron Teeth hoặc trò chơi sẽ bị treo khi xây dựng nó."
caES = "No afegeixis les necessitats dels Bots a altres faccions (Biocombustible i Energia)\nNo has d'afegir l'edifici de producció de biocombustible (Refineria) als Dents de Ferro, o el joc es bloquejarà en construir-lo."
beBY = "Не дадавайце патрэбы Bot другім фракцыям (Biofuel і Energy)\nВы не павінны дадаваць будынак вытворчасці біяпаліва (Refinery) да Iron Teeth, інакш гульня аварыйна завершыцца пры спробе пабудаваць яго."
