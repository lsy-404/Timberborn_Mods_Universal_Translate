["Genese.Mode.Description"]
status = "normal"
raw = "Fixed challenge settings on any map. One adult, no food, a permanent zero-input breeding pod. No old-age deaths. The first beaver death or a blocked mandatory birth ends the run."
enUS = "Fixed challenge settings on any map. One adult, no food, a permanent zero-input breeding pod. No old-age deaths. The first beaver death or a blocked mandatory birth ends the run."
zhCN = "在任意地图上固定挑战设置。仅有一名成年海狸，没有食物，并配有一个永久零投入的繁殖舱。没有老死。第一只海狸死亡或一次强制出生被阻止，即结束本局游戏。"
zhTW = "固定任何地圖上的挑戰設定。只有一隻成年海狸、沒有食物，並有一個永久零投入的繁殖艙。沒有老死。第一隻海狸死亡，或一次強制出生被阻擋，都會結束此次遊戲。"
ruRU = "Фиксированные условия испытания на любой карте. Один взрослый, без еды, постоянно работающая капсула размножения без затрат ресурсов. Смерти от старости отсутствуют. Первая смерть бобра или заблокированное обязательное рождение завершает прохождение."
jaJP = "どの マップでも、固定のチャレンジ設定で遊べます。成体のビーバーは1匹のみ、食料は不要、投入資源ゼロで常時稼働する繁殖ポッドがあります。老衰による死亡はありません。最初のビーバーの死亡、または必須の出産が妨げられた場合に、ランは終了します。"
frFR = "Paramètres de défi fixes sur n'importe quelle carte. Un seul adulte, aucune nourriture, un cocon de reproduction permanent sans apport. Aucune mort par vieillesse. La première mort d'un castor ou une naissance obligatoire bloquée met fin à la partie."
deDE = "Feste Herausforderungseinstellungen auf jeder beliebigen Karte. Ein erwachsener Biber, kein Futter, eine dauerhaft eingabelose Brutkapsel. Keine Todesfälle durch Altersschwäche. Der erste Todesfall eines Bibers oder eine blockierte Pflichtgeburt beendet den Durchlauf."
plPL = "Ustalone wyzwanie z nastawami na dowolnej mapie. Jeden dorosły bóbr, bez jedzenia, stała kolebka rozrodu bez żadnych nakładów. Brak śmierci ze starości. Pierwsza śmierć bobra lub zablokowany obowiązkowy poród kończy rozgrywkę."
ptBR = "Configurações de desafio fixas em qualquer mapa. Um adulto, sem comida, um berçário permanente sem nenhum insumo. Sem mortes por velhice. A primeira morte de castor ou um nascimento obrigatório bloqueado encerra a partida."
koKR = "고정된 도전 설정을 모든 맵에서 사용합니다. 성체 비버 한 마리, 음식 없음, 투입 자원이 전혀 필요 없는 영구 번식 포드. 노화로 인한 사망은 없습니다. 첫 번째 비버 사망 또는 필수 출산이 막히면 런이 종료됩니다."
trTR = "Belirli bir haritada sabit zorluk ayarları. Tek bir yetişkin, yiyecek yok ve sürekli olarak girdisi olmayan bir üreme kapsülü. Yaşlılıktan ölüm yok. İlk kunduz ölümü veya engellenen zorunlu bir doğum, oyunu sona erdirir."
esES = "Ajustes de desafío fijos en cualquier mapa. Un solo adulto, sin comida, una cápsula de cría permanente sin consumo de recursos. Sin muertes por vejez. La primera muerte de un castor o un nacimiento obligatorio bloqueado termina la partida."
itIT = "Impostazioni di sfida fisse su qualsiasi mappa. Un solo adulto, nessun cibo, un nido di riproduzione permanente senza alcun input. Nessuna morte per vecchiaia. La prima morte di un castoro o una nascita obbligatoria bloccata termina la partita."
ukUA = "Фіксовані налаштування випробування на будь-якій карті. Один дорослий, без їжі, постійно нульовий вхід для розмноження в інкубаторі. Без смертей від старості. Перша смерть бобра або заблокований обов'язковий пологи завершують гру."
thTH = "ตั้งค่าท้าทายแบบกำหนดตายตัวบนแผนที่ใดก็ได้ มีบีเวอร์ผู้ใหญ่เพียงหนึ่งตัว ไม่มีอาหาร และมีรังเพาะพันธุ์ถาวรที่ไม่ต้องใช้ทรัพยากรเลย ไม่มีการตายจากวัยชรา การตายของบีเวอร์ตัวแรกหรือการเกิดที่จำเป็นแต่ถูกขัดขวาง จะทำให้เกมจบลง"
csCZ = "Pevná výzva s pevnými nastaveními na libovolné mapě. Jeden dospělý bobr, žádné jídlo, trvale bezvstupní líheň. Žádná smrt ve stáří. První úmrtí bobra nebo zablokovaný povinný porod run ukončí."
viVN = "Cài đặt thử thách cố định trên mọi bản đồ. Một con hải ly trưởng thành, không có thức ăn, một kén sinh sản không cần đầu vào và tồn tại vĩnh viễn. Không có cái chết do già yếu. Cái chết đầu tiên của một con hải ly hoặc một lần sinh bắt buộc bị chặn sẽ kết thúc ván chơi."
caES = "Configuració fixa de repte en qualsevol mapa. Un sol adult, sense menjar, un bressol permanent sense cap entrada. Sense morts per vellesa. La primera mort d'un castor o un naixement obligatori bloquejat acaba la partida."
beBY = "Фіксаваныя ўмовы выкліку на любой карце. Адзін дарослы бабёр, без ежы, пастаянны інкубатар з нулявым уваходам. Смерць ад старасці адсутнічае. Першая смерць бабра або заблакаванае абавязковае нараджэнне заканчвае гульню."
roRO = "Setări fixe de provocare pe orice hartă. Un singur adult, fără hrană, un bazin de reproducere permanent fără niciun consum. Fără decese din bătrânețe. Prima moarte a unui castor sau o naștere obligatorie blocată încheie partida."
huHU = "Rögzített kihívási beállítások bármely térképen. Egy felnőtt, nincs élelem, egy állandóan nulla bemenetű szaporodási kapszula. Nincs halál öregkor miatt. Az első bébaverhalál vagy egy blokkolt kötelező születés véget vet a játéknak."
arSA = "ميزات تحدٍّ ثابتة على أي خريطة. بالغ واحد، بلا طعام، ومفقس تكاثر دائم لا يحتاج إلى أي مدخلات. لا وفيات بسبب الشيخوخة. أول وفاة لأحد القنادس أو تعطّل ولادة إلزامية يُنهيان الجولة."

