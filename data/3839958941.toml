["Building.JapaneseEfficientDeepWaterPump.Description"]
status = "normal"
raw = "Pumps and filters water for beavers to drink. Badwater contamination slows down its pumping speed. Twin cylinders pump 5 water every 0.33 hours, or 10 while shafts on its sides or underneath deliver 100 hp of power. Power is optional."
enUS = "Pumps and filters water for beavers to drink. Badwater contamination slows down its pumping speed. Twin cylinders pump 5 water every 0.33 hours, or 10 while shafts on its sides or underneath deliver 100 hp of power. Power is optional."
zhCN = "抽水泵为海狸过滤并抽取饮用水。恶水污染会降低其抽水速度。双缸抽水泵每0.33小时抽取5单位水；若其侧面或底部的轴提供100 hp的动力，则可抽取10单位水。动力为可选。"
zhTW = "抽取並過濾水源供海狸飲用。受到惡水污染時，抽水速度會減慢。雙缸設計每 0.33 小時抽出 5 單位水；若側面或底部的軸桿提供 100 hp 動力，則可抽出 10 單位水。動力為選用。"
ruRU = "Качает и очищает воду для бобров. Загрязнение бадвотером замедляет скорость откачки. Двухцилиндровый насос перекачивает 5 воды каждые 0.33 часа, или 10, если валы с боков или снизу передают 100 hp мощности. Мощность необязательна."
jaJP = "ビーバーが飲めるように水をくみ上げ、ろ過します。汚染された水（バッドウォーター）は、くみ上げ速度を遅くします。ツインシリンダーは0.33時間ごとに5の水をくみ上げますが、側面または下部に接続されたシャフトから100 hpの動力が供給されると、10にまで増えます。動力は任意です。"
frFR = "Pompe et filtre l'eau pour que les castors puissent la boire. La contamination par l'eau mauvaise ralentit sa vitesse de pompage. Les deux cylindres pompent 5 d'eau toutes les 0,33 heure, ou 10 lorsque des arbres de transmission placés sur ses côtés ou en dessous fournissent 100 hp de puissance. La puissance est facultative."
deDE = "Pumpt und filtert Wasser, damit Biber es trinken können. Schlechtwasser-Verunreinigung verlangsamt die Pumpgeschwindigkeit. Doppelzylinder pumpen 5 Wasser alle 0,33 Stunden oder 10, während Wellen an ihren Seiten oder darunter 100 hp Leistung liefern. Leistung ist optional."
plPL = "Pompy i filtry dostarczają wodę bobrom do picia. Zanieczyszczenie złą wodą (badwater) spowalnia prędkość pompowania. Podwójne cylindry pompują 5 wody co 0,33 godziny, lub 10, gdy wały po bokach lub pod spodem dostarczają 100 hp mocy. Zasilanie jest opcjonalne."
ptBR = "Bombeia e filtra água para os castores beberem. A contaminação por água ruim reduz a velocidade de bombeamento. Dois cilindros bombeiam 5 de água a cada 0,33 hora, ou 10 quando eixos em seus lados ou embaixo fornecem 100 hp de potência. A potência é opcional."
koKR = "펌프는 비버가 마실 수 있도록 물을 끌어올리고 정화합니다. 나쁜 물에 오염되면 펌핑 속도가 느려집니다. 쌍기통 실린더는 0.33시간마다 물 5를 펌핑하며, 측면이나 하부의 축이 100hp의 동력을 전달하면 10을 펌핑합니다. 동력은 선택 사항입니다."
trTR = "Pompa ve filtreler, kunduracıların içmesi için suyu pompalar. Kötü su kirliliği pompalama hızını düşürür. İkiz silindirler her 0,33 saatte 5 su pompalar; yanlarındaki veya altındaki miller 100 hp güç ilettiğinde ise 10 su pompalar. Güç isteğe bağlıdır."
esES = "Bombea y filtra agua para que los castores la beban. La contaminación con aguamala reduce la velocidad de bombeo. Los cilindros gemelos bombean 5 de agua cada 0,33 horas, o 10 si los ejes situados a sus lados o debajo entregan 100 hp de potencia. La potencia es opcional."
itIT = "Le pompe filtrano l'acqua affinché i castori possano berla. La contaminazione da acqua cattiva rallenta la sua velocità di pompaggio. I cilindri gemelli pompano 5 unità d'acqua ogni 0,33 ore, oppure 10 se gli alberi sui lati o sotto di essa forniscono 100 hp di potenza. La potenza è facoltativa."
ukUA = "Насоси фільтрують воду та подають її бобрам для пиття. Забруднення бадводою сповільнює швидкість його перекачування. Здвоєні циліндри перекачують 5 води кожні 0,33 години, або 10, якщо вали з боків або знизу передають 100 hp потужності. Потужність є необов'язковою."
thTH = "ปั๊มและกรองน้ำให้บีเวอร์ดื่ม น้ำเสียที่ปนเปื้อนจะทำให้ความเร็วในการสูบน้ำลดลง กระบอกสูบคู่สูบน้ำ 5 หน่วยทุก 0.33 ชั่วโมง หรือ 10 หน่วยเมื่อเพลาที่ด้านข้างหรือด้านล่างจ่ายพลังงาน 100 hp พลังงานเป็นตัวเลือกเสริม"
csCZ = "Čerpá a filtruje vodu, aby ji bobři mohli pít. Kontaminace špinavou vodou (badwater) zpomaluje rychlost čerpání. Dvojité válce čerpají 5 vody každých 0,33 hodiny, nebo 10, pokud hřídele na jeho stranách nebo pod ním dodávají 100 hp výkonu. Výkon je volitelný."
viVN = "Máy bơm nước lọc và bơm nước cho hải ly uống. Nhiễm nước độc làm giảm tốc độ bơm của máy. Máy bơm xi-lanh đôi bơm 5 nước mỗi 0,33 giờ, hoặc 10 khi các trục bên hông hoặc bên dưới truyền 100 hp công suất. Công suất là tùy chọn."
caES = "Les bombes i filtres d'aigua per a que els castors beguin. La contaminació amb aigua dolenta alenteix la seva velocitat de bombament. Els dos cilindres bombegen 5 d'aigua cada 0,33 hores, o 10 quan els eixos situats als seus costats o per sota transmeten 100 hp de potència. La potència és opcional."
beBY = "Помпа і фільтр воды для бабраў, каб яны маглі піць. Забруджванне брудной вадой запавольвае хуткасць перакачкі. Здвоеныя цыліндры перакачваюць 5 адзінак вады кожныя 0,33 гадзіны, або 10, калі валы збоку ці знізу перадаюць 100 hp магутнасці. Магутнасць неабавязковая."
roRO = "Pompează și filtrează apa pentru ca castorii să bea. Contaminarea cu apă otrăvită (badwater) încetinește viteza de pompare. Cele două cilindre pompează 5 unități de apă la fiecare 0,33 ore sau 10 unități, dacă arborii de transmisie de pe laterale sau de dedesubt livrează 100 hp de putere. Puterea este opțională."
huHU = "Szűri és pumpálja a vizet, hogy a bítorok ihassanak. A mérgező víz szennyeződése lassítja a szivattyúzás sebességét. Az ikerhengerek 0,33 óránként 5 vizet pumpálnak, vagy 10-et, ha az oldalukon vagy alattuk lévő tengelyek 100 hp teljesítményt szolgáltatnak. A teljesítmény opcionális."
arSA = "تقوم بضخ الماء وتنقيته ليشربه الbackground beavers. تؤدي تلوث المياه السامة إلى إبطاء سرعة ضخها. يضخ الأسطوانتان التوأمتان 5 وحدات من الماء كل 0.33 ساعة، أو 10 وحدات عندما توفر الأعمدة الموجودة على جانبيه أو تحته قدرة قدرها 100 hp. القدرة اختيارية."

["Building.JapaneseEfficientDeepWaterPump.FlavorDescription"]
status = "normal"
raw = "Two cylinders, one air vessel, and a roof vent for when the engineers argue."
enUS = "Two cylinders, one air vessel, and a roof vent for when the engineers argue."
zhCN = "两个汽缸，一个储气罐，还有一个屋顶通风口，专门用来应对工程师们的争吵。"
zhTW = "兩個汽缸、一個空氣罐，還有一個屋頂排氣孔，用來應付工程師們吵架的時候。"
ruRU = "Два цилиндра, один воздушный резервуар и вентиляционный люк на крыше — на случай, когда инженеры начинают спорить."
jaJP = "2つのシリンダー、1つの空気タンク、そして技術者たちが言い争う時のための屋根の換気口。"
frFR = "Deux cylindres, une cuve à air et un évent sur le toit pour les moments où les ingénieurs se disputent."
deDE = "Zwei Zylinder, ein Luftbehälter und eine Dachentlüftung für die Momente, in denen die Ingenieure streiten."
plPL = "Dwa cylindry, jeden zbiornik powietrza i wywietrznik na dachu, na wypadek gdy inżynierowie zaczną się kłócić."
ptBR = "Dois cilindros, um reservatório de ar e uma saída de ventilação no teto para quando os engenheiros começarem a discutir."
koKR = "두 개의 실린더, 공기 탱크 하나, 그리고 기술자들이 말다툼할 때를 위한 지붕 환기구."
trTR = "İki silindir, bir hava haznesi ve mühendisler tartıştığında kullanılan bir çatı havalandırması."
esES = "Dos cilindros, un depósito de aire y una rejilla de ventilación en el techo para cuando los ingenieros discuten."
itIT = "Due cilindri, un serbatoio d'aria e una bocchetta sul tetto per quando gli ingegneri discutono."
ukUA = "Два циліндри, один повітряний резервуар і дахова вентиляція на випадок, коли інженери починають сперечатися."
thTH = "สองกระบอกสูบ ถังลมหนึ่งใบ และช่องระบายอากาศบนหลังคาไว้สำหรับตอนที่วิศวกรเถียงกัน"
csCZ = "Dva válce, jedna vzduchová nádoba a větrací otvor na střeše pro chvíle, kdy se inženýři začnou hádat."
viVN = "Hai xi lanh, một bình khí, và một lỗ thông hơi trên mái dành cho lúc các kỹ sư tranh cãi."
caES = "Dos cilindres, un dipòsit d'aire i una ventilació al sostre per quan els enginyers es posen a discutir."
beBY = "Два цыліндры, адна паветраная камера і вытворчы вентыль на даху для тых момантаў, калі інжынеры сварацца."
roRO = "Două cilindri, un rezervor de aer și o ventilație pe acoperiș pentru când inginerii se ceartă."
