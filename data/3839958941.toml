["Building.JapaneseDeepWaterPump.Description"]
status = "normal"
raw = "Pumps and filters water for beavers to drink. Badwater contamination slows down its pumping speed. Pumps as fast as a Deep Water Pump."
enUS = "Pumps and filters water for beavers to drink. Badwater contamination slows down its pumping speed. Pumps as fast as a Deep Water Pump."
zhCN = "抽取并过滤水源供海狸饮用。恶水污染会减慢其抽水速度。抽水速度与深水泵相同。"
zhTW = "抽取並過濾水源，供海狸飲用。劣質水（Badwater）污染會減慢其抽水速度。抽水速度與深水泵相同。"
ruRU = "Качает и очищает воду для бобров. Загрязнение плохой водой замедляет скорость её откачки. Качает так же быстро, как глубинный водяной насос."
jaJP = "ポンプは、ビーバーが飲めるように水を汲み上げてろ過します。汚水による汚染は、その汲み上げ速度を低下させます。深層水ポンプと同じ速さで汲み上げます。"
frFR = "Pompe et filtre l'eau pour que les castors puissent la boire. La contamination par eau toxique ralentit sa vitesse de pompage. Pompe aussi vite qu'une pompe à eau profonde."
deDE = "Pumpt und filtert Wasser für die Biber zum Trinken. Verunreinigtes Badewasser verlangsamt seine Pumpgeschwindigkeit. Pumpt so schnell wie eine Tiefwasserpumpe."
plPL = "Pompy i filtry wody dla bobrów do picia. Zanieczyszczenie zepsutą wodą spowalnia prędkość pompowania. Pompuje tak szybko jak Głęboka Pompa Wodna."
ptBR = "Bombeia e filtra água para os castores beberem. A contaminação por água ruim reduz a velocidade de bombeamento. Bombeia tão rápido quanto uma Bomba de Água Profunda."
koKR = "물을 펌핑하고 여과하여 비버가 마실 수 있게 합니다. 독성 물(badwater) 오염은 펌핑 속도를 느리게 합니다. 심층수 펌프(Deep Water Pump)와 같은 속도로 펌핑합니다."
trTR = "Pompalar ve filtreler, kunduzların içmesi için suyu pompalar ve arıtır. Kötü su kirliliği pompalama hızını düşürür. Derin Su Pompası kadar hızlı pompalar."
esES = "Las bombas extraen y filtran el agua para que los castores puedan beberla. La contaminación con agua tóxica reduce la velocidad de bombeo. Bombea tan rápido como una Bomba de Agua Profunda."
itIT = "Le pompe filtrano l'acqua e la rendono potabile per i castori. La contaminazione da acqua cattiva rallenta la velocità di pompaggio. Pompa alla stessa velocità di una Pompa per Acque Profonde."
ukUA = "Качає та фільтрує воду для бобрів. Забруднення поганою водою уповільнює швидкість качання. Качає так само швидко, як Глибинна помпа."
thTH = "ปั๊มและกรองน้ำให้บีเวอร์ดื่ม น้ำเสียที่ปนเปื้อนจะทำให้ความเร็วในการสูบของปั๊มลดลง ปั๊มนี้สูบได้เร็วเท่ากับปั๊มน้ำลึก"
csCZ = "Čerpá a filtruje vodu, aby ji bobři mohli pít. Kontaminace špatnou vodou zpomaluje jeho rychlost čerpání. Čerpá stejně rychle jako Čerpadlo hluboké vody."
viVN = "Máy bơm và lọc nước để hải ly uống. Nhiễm nước độc làm giảm tốc độ bơm của máy. Bơm nhanh như Máy bơm nước sâu."
caES = "Bombeja i filtra l'aigua perquè els castors la beguin. La contaminació amb aigua tòxica alenteix la seva velocitat de bombeig. Bombeja tan ràpid com una Bomba d'Aigua Profunda."
beBY = "Помпы і фільтруюць ваду для бабраў, каб тыя маглі піць. Забруджванне брудную ваду запавольвае хуткасць помпы. Помпа працуе з такой жа хуткасцю, як глыбакаводная помпа."
roRO = "Pompează și filtrează apa pentru ca castorii să poată bea. Contaminarea cu apă otrăvitoare încetinește viteza de pompare. Pompează la fel de repede ca o Pompă de Apă Adâncă."
huHU = "Szivattyúzza és szűri a vizet, hogy a bobrok ihassanak belőle. A mérgezett víz szennyeződése lassítja a szivattyúzás sebességét. Ugyanolyan gyorsan szivattyúz, mint a mély víz szivattyú."
arSA = "يضخ المضخة الماء ويرشّحه ليشربه القنادس. يؤدي تلوث الماء السيئ إلى إبطاء سرعة ضخها. تضخ بالسرعة نفسها التي تضخ بها مضخة المياه العميقة."

["Building.JapaneseDeepWaterPump.FlavorDescription"]
status = "normal"
