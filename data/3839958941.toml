["Building.JapaneseEfficientWaterPump.Description"]
status = "normal"
raw = "Pumps and filters water for beavers to drink. Badwater contamination slows down its pumping speed. Twin cylinders pump 5 water every 0.33 hours, or 10 while shafts on its sides or underneath deliver 100 hp of power. Power is optional."
enUS = "Pumps and filters water for beavers to drink. Badwater contamination slows down its pumping speed. Twin cylinders pump 5 water every 0.33 hours, or 10 while shafts on its sides or underneath deliver 100 hp of power. Power is optional."
zhCN = "抽水泵为海狸过滤并输送饮用水。恶水污染会降低其抽水速度。双缸结构每0.33小时抽取5单位水，若其侧面或下方的轴提供100 hp的动力，则可提升至每0.33小时10单位水。动力为可选。"
zhTW = "抽取並過濾水源供海狸飲用。惡水污染會減慢抽水速度。雙缸泵每 0.33 小時抽取 5 單位水；若側面或底部的軸提供 100 hp 動力，則可抽取 10 單位水。動力為選用。"
ruRU = "Качает и фильтрует воду для бобров. Загрязнение бадвотером замедляет скорость качания. Сдвоенные цилиндры качают 5 воды каждые 0,33 часа или 10, если валы на их боках или снизу передают 100 hp мощности. Мощность необязательна."
jaJP = "ビーバーが飲めるように水をくみ上げ、ろ過する。汚水による汚染はポンプの速度を低下させる。双シリンダーは0.33時間ごとに5の水をくみ上げるが、側面または下部のシャフトから100 hpの動力が供給されると10に増える。動力は任意。"
frFR = "Pompe et filtre l'eau pour que les castors puissent boire. La contamination par eau mauvaise ralentit sa vitesse de pompage. Les deux cylindres pompent 5 d'eau toutes les 0,33 heure, ou 10 lorsque des arbres de transmission sur ses côtés ou en dessous fournissent 100 hp de puissance. La puissance est facultative."
deDE = "Pumpt Wasser filtert es für Biber zum Trinken. Badwasser-Verunreinigung verlangsamt seine Pumpgeschwindigkeit. Doppelzylinder pumpen alle 0,33 Stunden 5 Wasser, oder 10, während Wellen an seinen Seiten oder unterhalb 100 hp Leistung liefern. Leistung ist optional."
plPL = "Pompy i filtry wody dla bobrów do picia. Skażenie zepsutą wodą spowalnia prędkość pompowania. Podwójne cylindry pompują 5 wody co 0,33 godziny lub 10, gdy wały po bokach lub pod spodem dostarczają 100 hp mocy. Moc jest opcjonalna."
ptBR = "Bombeia e filtra água para os castores beberem. A contaminação por água ruim reduz a velocidade de bombeamento. Os cilindros gêmeos bombeiam 5 de água a cada 0,33 hora, ou 10 se os eixos nas laterais ou embaixo fornecerem 100 hp de potência. A potência é opcional."
koKR = "펌프는 비버가 마실 수 있도록 물을 끌어올리고 정화합니다. 배드워터 오염은 펌프 속도를 늦춥니다. 쌍기통 펌프는 0.33시간마다 물 5를 퍼 올리며, 측면이나 아래쪽의 축이 100 hp의 동력을 전달하면 10을 퍼 올립니다. 동력은 선택 사항입니다."
trTR = "Pompalar, suyu içmeleri için filtreler ve pompalar. Kirli su (badwater) kirlenmesi pompalama hızını düşürür. İkiz silindirler, her 0.33 saatte 5 su pompalar; yan veya alt taraflarındaki miller 100 hp güç ilettiğinde ise 10 su pompalar. Güç isteğe bağlıdır."
esES = "Bombea y filtra el agua para que los castores puedan beberla. La contaminación con agua mala ralentiza su velocidad de bombeo. Los cilindros gemelos bombean 5 de agua cada 0,33 horas, o 10 si los ejes situados a sus lados o debajo suministran 100 hp de potencia. La potencia es opcional."
itIT = "Pompe e filtra l'acqua affinché i castori possano berla. La contaminazione da acqua cattiva rallenta la velocità di pompaggio. I cilindri gemelli pompano 5 unità d'acqua ogni 0,33 ore, oppure 10 se gli alberi collocati sui lati o sotto di essi forniscono 100 hp di potenza. La potenza è facoltativa."
ukUA = "Качає та фільтрує воду, щоб бобри могли її пити. Забруднення токсичною водою сповільнює швидкість накачування. Здвоєні циліндри качають 5 води кожні 0,33 години, або 10, якщо вали з боків або знизу передають 100 hp потужності. Потужність необов'язкова."
thTH = "ปั๊มและกรองน้ำให้บีเวอร์ดื่ม น้ำเสียที่ปนเปื้อนจะทำให้ความเร็วในการสูบน้ำลดลง ปั๊มแบบสองกระบอกสูบน้ำได้ 5 หน่วยทุกๆ 0.33 ชั่วโมง หรือ 10 หน่วยเมื่อเพลาที่อยู่ด้านข้างหรือด้านล่างส่งกำลัง 100 hp มาให้ การใช้กำลังเป็นทางเลือก"
csCZ = "Čerpá a filtruje vodu, aby ji bobři mohli pít. Kontaminace špinavou vodou zpomaluje rychlost čerpání. Dvojité válce čerpají 5 vody každých 0,33 hodiny, nebo 10, pokud hřídele na jeho stranách nebo pod ním dodávají 100 hp výkonu. Výkon je volitelný."
viVN = "Máy bơm và lọc nước để hải ly uống. Nước bẩn độc hại làm giảm tốc độ bơm. Xi-lanh đôi bơm 5 nước mỗi 0,33 giờ, hoặc 10 khi các trục ở hai bên hoặc bên dưới cung cấp 100 hp công suất. Công suất là tùy chọn."
caES = "Bomba i filtra l'aigua perquè els castors la beguin. La contaminació amb aigua tòxica alenteix la velocitat de bombament. Els cilindres bessons bomben 5 d'aigua cada 0,33 hores, o 10 si els eixos situats als seus costats o per sota transmeten 100 hp de potència. La potència és opcional."
beBY = "Помпа качае і фільтруе ваду для бабёраў, каб яны маглі піць. Забруджванне брудной вадой запавольвае хуткасць качання. Дзве цыліндры качаюць 5 адзінак вады кожныя 0,33 гадзіны, або 10, калі валы з бакоў ці знізу перадаюць 100 hp магутнасці. Магутнасць неабавязковая."
roRO = "Pompează și filtrează apa pentru ca castorii să bea. Contaminarea cu apă-otrăvită (badwater) îi încetinește viteza de pompare. Cilindrii gemeni pompează 5 unități de apă la fiecare 0,33 ore, sau 10 atunci când arborii de transmisie de pe laturi sau de dedesubt livrează 100 hp de putere. Puterea este opțională."
huHU = "Szivattyúk és szűrők víz tisztítására és szivattyúzására szolgálnak, hogy a bódák ihassanak. A mérgező víz szennyeződése lassítja a szivattyúzás sebességét. Az ikerhengerek 0,33 óránként 5 vizet szivattyúznak, vagy 10-et, ha az oldalukon vagy alatta lévő tengelyek 100 hp teljesítményt szolgáltatnak. A teljesítmény opcionális."
arSA = "يضخ المضخة ويرشح المياه لتشربها الكائنات القندسية. يؤدي تلوث المياه السامة إلى إبطاء سرعة ضخها. تضخ الأسطوانتان المزدوجتان 5 من المياه كل 0.33 ساعة، أو 10 عندما توفر الأعمدة الموجودة على جانبيها أو أسفلها قدرة قدرها 100 hp. القدرة اختيارية."

["Building.JapaneseEfficientWaterPump.FlavorDescription"]
status = "normal"
raw = "Two cylinders, one air vessel, and a roof vent for when the engineers argue."
enUS = "Two cylinders, one air vessel, and a roof vent for when the engineers argue."
zhCN = "两个气缸，一个空气罐，还有一个屋顶通风口，专门用来应对工程师们吵架的时候。"
zhTW = "雙缸、一個空氣儲罐，還有一個屋頂排氣口，專門用來應付工程師們吵架的時候。"
ruRU = "Два цилиндра, один воздушный резервуар и вентиляционный люк на крыше — на случай, когда инженеры начнут спорить."
jaJP = "2つのシリンダー、1つの空気タンク、そして技術者たちが言い争う時のための屋根の換気口。"
frFR = "Deux cylindres, un réservoir d'air et un évent sur le toit pour quand les ingénieurs se disputent."
deDE = "Zwei Zylinder, ein Luftbehälter und eine Dachentlüftung für die Momente, in denen die Ingenieure streiten."
plPL = "Dwa cylindry, jeden zbiornik powietrza i wentylator dachowy na wypadek, gdy inżynierowie zaczną się kłócić."
ptBR = "Dois cilindros, um reservatório de ar e uma saída de ventilação no telhado para quando os engenheiros começarem a discutir."
koKR = "두 개의 실린더, 공기 탱크 하나, 그리고 엔지니어들이 말다툼할 때를 위한 지붕 환기구."
trTR = "İki silindir, bir hava haznesi ve mühendisler tartışmaya başladığında kullanılan bir havalandırma bacası."
esES = "Dos cilindros, una cámara de aire y una ventilación en el techo para cuando los ingenieros discuten."
itIT = "Due cilindri, un serbatoio d'aria e uno sfiato sul tetto per quando gli ingegneri discutono."
ukUA = "Два циліндри, одна повітряна камера та вентиляційний отвір на даху для тих випадків, коли інженери сперечаються."
thTH = "สองกระบอกสูบ ถังลมหนึ่งใบ และช่องระบายอากาศบนหลังคาไว้สำหรับตอนวิศวกรเถียงกัน"
csCZ = "Dva válce, jedna vzduchová nádoba a větrací otvor na střeše pro chvíle, kdy se inženýři hádají."
