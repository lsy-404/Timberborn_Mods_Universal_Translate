["Building.JapaneseWaterPump.Description"]
status = "normal"
raw = "Pumps and filters water for beavers to drink. Badwater contamination slows down its pumping speed. Pumps as fast as a Water Pump."
enUS = "Pumps and filters water for beavers to drink. Badwater contamination slows its pumping speed. Pumps as fast as a Water Pump."
zhCN = "抽水并过滤水源，供海狸饮用。恶水污染会降低其抽水速度。抽水速度与水泵相同。"
zhTW = "抽取並過濾水源，供海狸飲用。毒水污染會減慢其抽水速度。抽水速度與水泵相同。"
ruRU = "Качает и фильтрует воду для бобров. Загрязнение плохой водой замедляет скорость её откачки. Качает так же быстро, как Водяной насос."
jaJP = "ポンプで水をろ過し、ビーバーが飲めるようにします。悪水による汚染は、ポンプの汲み上げ速度を低下させます。水ポンプと同じ速さで汲み上げます。"
frFR = "Pompe et filtre l'eau pour que les castors puissent la boire. La contamination par l'eau toxique ralentit sa vitesse de pompage. Pompe aussi vite qu'une pompe à eau."
deDE = "Pumpt Wasser und filtert es, damit die Biber es trinken können. Eine Verunreinigung durch Schlechtwasser verlangsamt die Pumpgeschwindigkeit. Pumpt so schnell wie eine Wasserpumpe."
plPL = "Pompuje i filtruje wodę, aby bobry miały co pić. Zanieczyszczenie złą wodą (badwater) spowalnia jej tempo pompowania. Pompuje tak szybko jak Pompa Wodna."
ptBR = "Bombeia e filtra água para os castores beberem. A contaminação por água ruim reduz a velocidade de bombeamento. Bombeia tão rápido quanto uma Bomba d'Água."
koKR = "물을 펌핑하고 여과하여 비버들이 마실 수 있게 합니다. 독성 물(badwater) 오염은 펌핑 속도를 늦춥니다. 물 펌프와 같은 속도로 펌핑합니다."
trTR = "Pompalar, içeceği için suyu pompalar ve filtreler. Kötü su kirlenmesi pompalama hızını düşürür. Bir Su Pompası kadar hızlı pompalar."
esES = "Bombea y filtra agua para que los castores la beban. La contaminación con agua tóxica reduce su velocidad de bombeo. Bombea tan rápido como una Bomba de Agua."
itIT = "Pompa e filtra l'acqua affinché i castori possano berla. La contaminazione da acqua cattiva rallenta la sua velocità di pompaggio. Pompa alla stessa velocità di una Pompa ad Acqua."
ukUA = "Насоси фільтрують воду та подають її бобрам для пиття. Забруднення поганою водою уповільнює швидкість їхньої роботи. Качає так само швидко, як водяний насос."
thTH = "ปั๊มช่วยสูบและกรองน้ำให้บีเวอร์ดื่ม การปนเปื้อนของน้ำเสีย (badwater) ทำให้ความเร็วในการสูบลดลง ปั๊มนี้สูบได้เร็วเท่ากับปั๊มน้ำ"
csCZ = "Čerpá a filtruje vodu, aby ji bobři mohli pít. Kontaminace špinavou vodou zpomaluje jeho rychlost čerpání. Čerpá stejně rychle jako vodní čerpadlo."
viVN = "Máy bơm lọc nước và bơm nước cho hải ly uống. Nhiễm nước bẩn độc hại làm giảm tốc độ bơm của máy. Bơm nhanh như Máy Bơm Nước."
caES = "Bombeja i filtra l'aigua perquè els castors la beguin. La contaminació amb aigua dolenta alenteix la seva velocitat de bombament. Bomba tan ràpid com una Bomba d'aigua."
beBY = "Помпа качае і фільтруеваду для бабраў, каб яны маглі піць. Забруджванне бадвадой запавольвае хуткасць качання. Качае з такой жа хуткасцю, як Водная помпа."
roRO = "Pompează și filtrează apa pentru ca castorii să bea. Contaminarea cu apă otrăvită (badwater) îi încetinește viteza de pompare. Pompează la fel de repede ca o Pompă de apă."
huHU = "Szivattyúzza és szűri a vizet, hogy a bódéosok ihassanak belőle. A mérgezett víz szennyeződése lassítja a szivattyúzás sebességét. Ugyanolyan gyorsan szivattyúz, mint a Vízszivattyú."
arSA = "يضخ هذا المبنى المياه ويرشحها ليشربها الكائنات. يؤدي تلوث المياه السامة (المياه الفاسدة) إلى إبطاء سرعة ضخه. يضخ بنفس سرعة مضخة المياه."

