zhCN = "灰泥制的泵房、一座码头，还有一个总也滴滴答答停不下来的飞轮。"
zhTW = "灰泥製的抽水屋、碼頭，還有一個總是滴個不停的飛輪。"
ruRU = "Глиняная насосная станция, причал и маховик, с которого вечно капает вода."
jaJP = "漆喰造りのポンプ小屋、桟橋、そしてなかなか水滴が止まらないフライホイール。"
