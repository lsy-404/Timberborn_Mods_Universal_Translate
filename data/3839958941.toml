deDE = "Ein Pumpenhaus aus Gips, ein Steg und ein Schwungrad, das nie ganz aufhört zu tropfen."
plPL = "Gipsowa pompownia, pomost i koło zamachowe, które nigdy do końca nie przestaje kapać."
ptBR = "Uma casa de bombeamento de gesso, um píer e um volante de inércia que nunca para totalmente de pingar."
koKR = "석고 펌프 하우스, 부두, 그리고 좀처럼 완전히 멈추지 않고 물방울을 떨어뜨리는 플라이휠."
trTR = "Alçı bir pompa evi, bir iskele ve bir türlü tamamen durmayan, damlayan bir volan."
esES = "Una caseta de bombeo de yeso, un embarcadero y un volante de inercia que nunca termina de gotear."
itIT = "A una casa delle pompe in intonaco, un pontile e un volano che non smette mai del tutto di gocciolare."
ukUA = "Глиняна насосна станція, пристань і маховик, який ніби ніколи до кінця не перестає капати."
thTH = "ปั๊มน้ำปูนปั้น ท่าเรือ และล้อช่วยแรงที่ไม่เคยหยุดหยดน้ำเลยสักที"
csCZ = "Sádrová čerpací stanice, molo a setrvačník, který nikdy úplně nepřestane kapat."
viVN = "Một trạm bơm bằng thạch cao, một bến tàu, và một bánh đà mãi không ngừng nhỏ giọt."
caES = "Una casa de bombament de guix, un moll i un volant d'inèrcia que mai acaba de deixar de degotar."
beBY = "Гліняная помпавая будка, прычал і маховік, які ніколі да канца не перастаюць капаць."
roRO = "O casă de pompare din tencuială, un debarcader și un volant care nu se oprește niciodată din picurat."
huHU = "Egy gipszből készült szivattyúház, egy móló, és egy lendkerék, amely sosem áll meg egészen a csöpögéstől."
arSA = "تضم مضخة مياه من الجص، ورصيفًا، وعجلة دوارة لا تتوقف أبدًا عن التقطير تقريبًا."

