esES = "¡Clima peligroso: el propio aire conspira contra ti! Consulta los modificadores de Skyblight y Badrain para ver sus efectos."
itIT = "Condizioni meteorologiche pericolose: l'aria stessa trama contro di te! Consulta i modificatori Skyblight e Badrain per conoscerne gli effetti."
ukUA = "Небезпечна погода: саме повітря змовляється проти вас! Див. модифікатори Skyblight та Badrain, щоб дізнатися про їхній вплив."
thTH = "อากาศอันตราย: แม้แต่อากาศเองก็ดูเหมือนจะคอยขัดขวางคุณ! ดูผลของ Skyblight และตัวปรับ Badrain ได้ที่นี่"
csCZ = "Nebezpečné počasí: Vzduch se sám proti vám spiknul! Podívejte se na modifikátory Skyblight a Badrain pro efekty."
viVN = "Thời tiết nguy hiểm: Không khí tự nó âm thầm chống lại bạn! Xem các chỉ số Skyblight và Badrain để biết hiệu ứng."
caES = "Clima perillós: l'aire mateixa conspira contra tu! Consulta els modificadors de Skyblight i Badrain per veure'n els efectes."
beBY = "Небяспечнае надвор'е: само паветра змаўляецца супраць вас! Глядзіце эфекты мадыфікатараў Skyblight і Badrain."
roRO = "Vreme periculoasă: Aerul însuși conspiră împotriva ta! Vezi modificatorii Skyblight și Badrain pentru efecte."
huHU = "Veszélyes időjárás: maga a levegő is ellened szövetkezik! A hatásokért lásd a Skyblight és a Badrain módosítókat."
arSA = "الطقس الخطير: الهواء نفسه يتآمر ضدك! راجع تعديلي Skyblight وBadrain لمعرفة التأثيرات."

["LV.MWSb.SkyblightModifierDesc"]
raw = "All water get contaminated over time. Does not affect waters in storage (Tanks)."
status = "normal"
enUS = "All water becomes contaminated over time. This does not affect stored water (Tanks)."
zhCN = "所有水会随着时间被污染。不会影响储存中的水（储水罐）。"
zhTW = "所有水源會隨著時間而受到污染。不會影響儲存中的水（儲水槽）。"
ruRU = "Вся вода загрязняется со временем. Не влияет на воду в хранилищах (резервуарах)."
jaJP = "すべての水は時間の経過とともに汚染されます。貯蔵されている水（タンク内の水）には影響しません。"
frFR = "Tous les eaux se contaminent avec le temps. N'affecte pas les eaux en stockage (Réservoirs)."
deDE = "„Alle Wasser verschmutzen im Laufe der Zeit. Beeinflusst kein Wasser in Lagern (Tanks).“"
plPL = "Wszystka woda z czasem ulega zanieczyszczeniu. Nie dotyczy wód w magazynie (zbiorniki)."
ptBR = "Toda a água se contamina com o tempo. Não afeta as águas em armazenamento (Tanques)."
koKR = "모든 물은 시간이 지남에 따라 오염됩니다. 저장소에 있는 물(탱크)에는 영향을 주지 않습니다."
trTR = "Tüm su zamanla kirlenir. Depolama alanındaki sulara (tanklar) etki etmez."
esES = "Toda el agua se contamina con el tiempo. No afecta al agua almacenada (en depósitos)."
itIT = "Tutta l'acqua viene contaminata col tempo. Non influisce sulle acque immagazzinate (Cisterne)."
ukUA = "Вся вода з часом забруднюється. Не впливає на воду в сховищах (резервуарах)."
thTH = "น้ำทั้งหมดจะปนเปื้อนไปตามเวลา ไม่มีผลต่อน้ำที่เก็บอยู่ในถัง (Tanks)"
csCZ = "Veškerá voda se postupem času kontaminuje. Nepůsobí na vodu ve skladu (nádrže)."
viVN = "Tất cả nước đều bị ô nhiễm theo thời gian. Không ảnh hưởng đến nước trong kho (Bồn chứa)."
caES = "Tota l'aigua es contamina amb el temps. No afecta l'aigua emmagatzemada (en dipòsits)."
beBY = "З часам уся вада забруджваецца. Не ўплывае на ваду ў сховішчах (цыстэрнах)."
roRO = "Toată apa se contaminează în timp. Nu afectează apa din depozitare (rezervoare)."
huHU = "Idővel minden víz szennyeződik. Nem befolyásolja a tárolóban lévő (Tartályokban tárolt) vizet."
arSA = "كل المياه تتلوث مع مرور الوقت. لا يؤثر ذلك على المياه المخزنة في الخزانات."

