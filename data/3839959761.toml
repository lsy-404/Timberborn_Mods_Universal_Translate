["Building.JapaneseEfficientFarmhouse.Description"]
status = "normal"
raw = "Farmers plant and harvest crops in the area around the building. Up to 4 farmers who work 50% faster than at a Farmhouse, or 75% faster while it gets 100 hp of power through its side or back shafts. Power is optional."
enUS = "Farmers plant and harvest crops in the area around the building. Up to 4 farmers who work 50% faster than at a Farmhouse, or 75% faster while it gets 100 hp of power through its side or back shafts. Power is optional."
zhCN = "在建筑周围的区域内，农夫种植和收获作物。最多可有4名农夫，其工作速度比农舍快50%；若其侧面或背面的轴从动力网络获得100 hp的动力，则速度可提升至75%。动力为可选。"
zhTW = "農夫會在建築周圍的區域種植與收割作物。最多可有 4 名農夫，工作速度比農舍快 50%；若其側面或背面的軸從動力網獲得 100 hp 動力，則速度可再提升至 75%。動力為選用。"
ruRU = "Фермеры сажают и собирают урожай на участке вокруг здания. Работают до 4 фермеров, которые трудятся на 50% быстрее, чем на обычной ферме, или на 75% быстрее, если здание получает 100 hp мощности через боковые или задние валы. Мощность необязательна."
jaJP = "農家の建物の周囲の区域で、作物の植え付けと収穫を行います。最大4人の農家が、通常の農家より50%速く作業します。さらに、側面または背面の軸から100 hpの動力を受けている間は、75%速く作業します。動力は任意です。"
frFR = "Les agriculteurs plantent et récoltent les cultures dans la zone autour du bâtiment. Jusqu'à 4 agriculteurs travaillent 50 % plus vite qu'à une ferme, ou 75 % plus vite lorsqu'il reçoit 100 hp de puissance par ses arbres de transmission latéraux ou arrière. L'alimentation en énergie est facultative."
deDE = "Landwirte pflanzen und ernten Feldfrüchte im Bereich um das Gebäude. Bis zu 4 Landwirte arbeiten 50 % schneller als in einem Bauernhaus oder 75 % schneller, solange es über seine seitlichen oder rückseitigen Wellen 100 hp Leistung erhält. Leistung ist optional."
plPL = "Rolnicy sadzą i zbierają plony na terenie wokół budynku. Do 4 rolników, którzy pracują o 50% szybciej niż w Farmie, lub o 75% szybciej, gdy otrzymuje 100 hp mocy przez boczne lub tylne wały. Moc jest opcjonalna."
ptBR = "Agricultores plantam e colhem plantações na área ao redor do edifício. Até 4 agricultores, que trabalham 50% mais rápido do que em uma Casa de Fazenda, ou 75% mais rápido enquanto recebe 100 hp de energia por seus eixos laterais ou traseiros. A energia é opcional."
koKR = "농부들은 건물 주변 지역에서 작물을 심고 수확합니다. 최대 4명의 농부가 일하며, 이들은 농가보다 50% 빠르게 작업합니다. 건물의 측면 또는 후면 축을 통해 100 hp의 동력을 받으면 75% 빠르게 작업합니다. 동력은 선택 사항입니다."
trTR = "Çevredeki alanda binanın etrafındaki ürünleri ekip biçer. En fazla 4 çiftçi çalışabilir; bunlar Çiftlik Evi'ndekinden %50 daha hızlı çalışır, ancak yan veya arka millerinden 100 hp güç aldığında %75 daha hızlı çalışırlar. Güç isteğe bağlıdır."
esES = "Los granjeros plantan y cosechan cultivos en la zona alrededor del edificio. Hasta 4 granjeros que trabajan un 50 % más rápido que en una Granja, o un 75 % más rápido mientras recibe 100 hp de energía a través de sus ejes laterales o traseros. La energía es opcional."
itIT = "Gli agricoltori piantano e raccolgono le colture nell'area attorno all'edificio. Fino a 4 agricoltori che lavorano il 50% più velocemente rispetto a una Fattoria, oppure il 75% più velocemente mentre riceve 100 hp di potenza tramite i suoi alberi laterali o posteriori. La potenza è facoltativa."
ukUA = "Фермери саджають і збирають урожай на ділянці навколо будівлі. До 4 фермерів, які працюють на 50% швидше, ніж на Фермі, або на 75% швидше, коли будівля отримує 100 hp потужності через бічні або задні вали. Потужність є необов'язковою."
thTH = "ชาวนาปลูกและเก็บเกี่ยวพืชผลในพื้นที่รอบอาคาร รองรับชาวนาได้สูงสุด 4 คน ทำงานเร็วกว่าที่ฟาร์มเฮาส์ 50% หรือเร็วกว่า 75% เมื่อได้รับพลังงาน 100 hp ผ่านเพลาด้านข้างหรือด้านหลัง การใช้พลังงานเป็นทางเลือก"
csCZ = "Farmáři sázejí a sklízejí plodiny v okolí budovy. Až 4 farmáři pracují o 50 % rychleji než u Farmhouse, nebo o 75 % rychleji, pokud dostává 100 hp výkonu přes své boční nebo zadní hřídele. Výkon je volitelný."
viVN = "Nông dân trồng và thu hoạch hoa màu trong khu vực xung quanh công trình. Tối đa 4 nông dân, làm việc nhanh hơn 50% so với Nhà nông trại, hoặc nhanh hơn 75% khi công trình nhận được 100 hp công suất qua trục bên hoặc trục phía sau. Công suất là tùy chọn."
caES = "Els agricultors planten i collen cultius a la zona al voltant de l'edifici. Fins a 4 agricultors que treballen un 50% més ràpid que en una Granja, o un 75% més ràpid mentre rep 100 hp de potència a través dels seus eixos laterals o posteriors. La potència és opcional."
beBY = "Фермеры сеюць і збіраюць урожай на тэрыторыі вакол будынка. Да 4 фермераў, якія працуюць на 50% хутчэй, чым у Фермерскім доме, або на 75% хутчэй, пакуль будынак атрымлівае 100 hp энергіі праз свае бакавыя або задняя валы. Энергія неабавязковая."
roRO = "Fermierii plantează și recoltează culturile în zona din jurul clădirii. Până la 4 fermieri care lucrează cu 50% mai rapid decât la o Fermă, sau cu 75% mai rapid cât timp primește 100 hp de putere prin arborii laterali sau din spate. Puterea este opțională."
huHU = "Gazdák ültetik és betakarítják a termést az épület körüli területen. Legfeljebb 4 gazda dolgozik, akik 50%-kal gyorsabban dolgoznak, mint egy Farmházban, vagy 75%-kal gyorsabban, ha az oldalsó vagy hátsó tengelyeken keresztül 100 hp teljesítményt kap. A teljesítmény opcionális."
arSA = "يزرع المزارعون المحاصيل ويحصدونها في المنطقة المحيطة بالمبنى. يعمل ما يصل إلى 4 مزارعين بسرعة أكبر بنسبة 50% من العمل في المزرعة العادية، أو بسرعة أكبر بنسبة 75% عندما يحصلون على 100 حصان من القدرة عبر أعمدة الدوران الجانبية أو الخلفية. القدرة اختيارية."

