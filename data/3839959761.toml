plPL = "Przekładnia niczego nie sadzi. Rolnicy upierają się, że pomaga."
ptBR = "O conjunto de engrenagens não planta nada. Os fazendeiros insistem que ele ajuda."
koKR = "기어박스는 아무것도 심지 않습니다. 농부들은 그래도 도움이 된다고 주장합니다."
trTR = "Dişli kutusu hiçbir şeyi ekmez. Çiftçiler ise yardımcı olduğunda ısrar ediyor."
esES = "El engranaje no planta nada. Los granjeros insisten en que ayuda."
itIT = "Il riduttore non pianta niente. Gli agricoltori insistono che aiuta."
ukUA = "Редуктор нічого не садить. Фермери наполягають, що він допомагає."
thTH = "เกียร์บ็อกซ์ไม่ได้ปลูกอะไรเลย แต่ชาวไร่ยืนยันว่ามันช่วยได้"
csCZ = "Převodovka nic nezasadí. Farmáři tvrdí, že pomáhá."
viVN = "Hộp số không trồng gì cả. Nông dân cứ khăng khăng rằng nó có ích."
caES = "El graner no planta res. Els agricultors insisteixen que ajuda."
beBY = "Перадача нічога не садзіць. Фермеры ўпэўнены, што яна дапамагае."
roRO = "Cutia de viteze nu seamănă nimic. Fermierii insistă că ajută."
huHU = "A főmű nem ültet semmit. A farmerek mégis kitartanak amellett, hogy segít."
arSA = "لا يزرع ترس التعشيق أي شيء. لكن المزارعين يصرّون على أنه يساعد."

["Building.JapaneseFarmhouse.Folktails.Description"]
status = "normal"
raw = "Farmers plant and harvest field crops (carrots, wheat, potatoes, sunflowers) in the area around the building. A smaller 2-farmer farmhouse; aquatic crops still need the Aquatic Farmhouse."
enUS = "Farmers plant and harvest field crops (carrots, wheat, potatoes, sunflowers) in the area around the building. A smaller 2-farmer farmhouse; aquatic crops still need the Aquatic Farmhouse."
zhCN = "农民在建筑周围的区域种植和收获大田作物（胡萝卜、小麦、土豆、向日葵）。这是一座较小的双农民农舍；水生作物仍需要水生农舍。"
zhTW = "農夫在建築周圍的區域種植和收穫田間作物（胡蘿蔔、小麥、馬鈴薯、向日葵）。這是較小型的雙農夫農舍；水生作物仍需要水生農舍。"
ruRU = "Фермеры сажают и собирают полевые культуры (морковь, пшеницу, картофель, подсолнухи) на участке вокруг здания. Меньший фермерский дом на 2 фермера; водные культуры по-прежнему требуют водного фермерского дома."
jaJP = "農家は建物の周囲にある区域で、ニンジン、小麦、ジャガイモ、ヒマワリなどの畑作物を植えて収穫します。農家が2人の小型の農家小屋です。水生作物には引き続き水生農家小屋が必要です。"
frFR = "Les fermiers plantent et récoltent des cultures de plein champ (carottes, blé, pommes de terre, tournesols) dans la zone autour du bâtiment. Une ferme plus petite pour 2 fermiers ; les cultures aquatiques nécessitent toujours la Ferme aquatique."
deDE = "Landwirte pflanzen und ernten Feldfrüchte (Karotten, Weizen, Kartoffeln, Sonnenblumen) im Bereich rund um das Gebäude. Ein kleineres Bauernhaus für 2 Landwirte; Wasserpflanzen benötigen weiterhin das Wasserbauernhaus."
plPL = "Rolnicy sadzą i zbierają uprawy polowe (marchew, pszenicę, ziemniaki, słoneczniki) na terenie wokół budynku. Mniejsza farma dla 2 rolników; uprawy wodne nadal wymagają Farmy Wodnej."
ptBR = "Agricultores plantam e colhem cultivos de campo (cenouras, trigo, batatas, girassóis) na área ao redor do edifício. Uma casa de fazenda menor, para 2 agricultores; cultivos aquáticos ainda precisam da Casa de Fazenda Aquática."
koKR = "농부들은 건물 주변 지역에서 밭작물(당근, 밀, 감자, 해바라기)을 심고 수확합니다. 농부 2명이 일하는 더 작은 농가이며, 수생 작물은 여전히 수생 농가가 필요합니다."
trTR = "Çiftçiler, binanın çevresindeki alanda tarla ürünlerini (havuç, buğday, patates, ayçiçeği) eker ve hasat eder. Daha küçük olan 2 çiftçilik çiftlik evi; su ürünleri yetiştirmek için yine de Su Ürünleri Çiftlik Evi gerekir."
esES = "Los granjeros plantan y cosechan cultivos de campo (zanahorias, trigo, patatas, girasoles) en la zona alrededor del edificio. Una granja más pequeña para 2 granjeros; los cultivos acuáticos aún necesitan la Granja Acuática."
itIT = "Gli agricoltori piantano e raccolgono colture da campo (carote, grano, patate, girasoli) nell'area intorno all'edificio. Una fattoria più piccola, con 2 agricoltori; le colture acquatiche richiedono comunque la Fattoria Acquatica."
ukUA = "Фермери садять і збирають польові культури (моркву, пшеницю, картоплю, соняшник) на ділянці навколо будівлі. Менша ферма на 2 фермери; водні культури все ще потребують Водної ферми."
thTH = "ชาวนาปลูกและเก็บเกี่ยวพืชไร่ (แครอต ข้าวสาลี มันฝรั่ง ดอกทานตะวัน) ในพื้นที่รอบอาคาร เป็นฟาร์มเฮาส์ขนาดเล็กที่ใช้ชาวนา 2 คน แต่พืชน้ำยังต้องใช้ Aquatic Farmhouse"
csCZ = "Farmáři sázejí a sklízejí polní plodiny (mrkev, pšenici, brambory, slunečnice) na pozemcích kolem budovy. Menší farma pro 2 farmáře; vodní plodiny stále vyžadují Vodní farmu."
viVN = "Nông dân trồng và thu hoạch các loại cây trồng trên đồng (cà rốt, lúa mì, khoai tây, hướng dương) trong khu vực xung quanh tòa nhà. Trang trại nhỏ hơn với 2 nông dân; cây trồng dưới nước vẫn cần Trang trại thủy sinh."
caES = "Els agricultors planten i collen cultius de camp (pastanagues, blat, patates, gira-sols) a la zona que envolta l'edifici. Una granja més petita per a 2 agricultors; els cultius aquàtics encara necessiten la Granja aquàtica."
beBY = "Фермеры высаждаюць і сабіраюць палявыя культуры (морква, пшаніца, бульба, сланечнік) на ўчастку вакол будынка. Меншая сямейная ферма на 2 фермеры; водныя культуры па-ранейшаму патрабуюць Водную ферму."
roRO = "Fermierii plantează și recoltează culturile de câmp (morcovi, grâu, cartofi, floarea-soarelui) în zona din jurul clădirii. O fermă mai mică, pentru 2 fermieri; culturile acvatice necesită în continuare Ferma acvatică."
huHU = "A farmerek az épület körüli területen szántóföldi növényeket (sárgarépát, búzát, burgonyát, napraforgót) ültetnek és aratnak. Egy kisebb, 2 farmeres farmház; a vízi növényekhez továbbra is az Aquatic Farmhouse szükséges."
arSA = "يزرع المزارعون المحاصيل الحقلية ويحصدونها (الجزر، والقمح، والبطاطس، وعباد الشمس) في المنطقة المحيطة بالمبنى. مزرعة أصغر يعمل بها 2 من المزارعين؛ أما المحاصيل المائية فما زالت تتطلب مزرعة المحاصيل المائية."

["Building.JapaneseEfficientFarmhouse.Folktails.Description"]
status = "normal"
raw = "Farmers plant and harvest field crops (carrots, wheat, potatoes, sunflowers) in the area around the building. Up to 4 farmers who work 50% faster, or 75% faster while it gets 100 hp of power through its side or back shafts. Power is optional. Aquatic crops still need the Aquatic Farmhouse."
enUS = "Farmers plant and harvest field crops (carrots, wheat, potatoes, sunflowers) in the area around the building. Up to 4 farmers who work 50% faster, or 75% faster while it gets 100 hp of power through its side or back shafts. Power is optional. Aquatic crops still need the Aquatic Farmhouse."
zhCN = "农夫在建筑周围种植和收获田间作物（胡萝卜、小麦、土豆、向日葵）。最多可容纳4名农夫，他们的工作速度提高50%；如果通过侧面或背面的轴从动力网络获得100 hp的动力，则提高75%。动力为可选项。水生作物仍需要水生农舍。"
zhTW = "農夫在建築周圍的區域種植和收穫田間作物（胡蘿蔔、小麥、馬鈴薯、向日葵）。最多可有 4 名農夫，工作速度加快 50%；若透過其側面或背面的軸接收到 100 hp 的動力，則加快 75%。動力為選用。水生作物仍需要水生農舍。"
ruRU = "Фермеры сажают и собирают полевые культуры (морковь, пшеницу, картофель, подсолнухи) на участке вокруг здания. До 4 фермеров работают на 50% быстрее или на 75% быстрее, пока получают 100 hp мощности через боковой или задний валы. Мощность необязательна. Водные культуры по-прежнему требуют водной фермы."
jaJP = "農夫は建物周辺の畑で作物（ニンジン、小麦、ジャガイモ、ヒマワリ）を植えて収穫します。最大4人の農夫が配置され、作業速度は50%向上します。側面または背面のシャフトから100 hpの動力を受けている間は、作業速度が75%向上します。動力は任意です。水生作物には引き続き水生農家が必要です。"
frFR = "Les agriculteurs plantent et récoltent des cultures de plein champ (carottes, blé, pommes de terre, tournesols) dans la zone autour du bâtiment. Jusqu'à 4 agriculteurs, qui travaillent 50 % plus vite, ou 75 % plus vite lorsqu'ils reçoivent 100 hp de puissance par leurs arbres latéraux ou arrière. La puissance est facultative. Les cultures aquatiques nécessitent toujours la Ferme aquatique."
deDE = "Landwirte pflanzen und ernten Feldfrüchte (Karotten, Weizen, Kartoffeln, Sonnenblumen) im Bereich rund um das Gebäude. Bis zu 4 Landwirte arbeiten 50 % schneller oder 75 % schneller, solange es über seine seitlichen oder hinteren Wellen 100 hp Leistung erhält. Leistung ist optional. Wasserpflanzen benötigen weiterhin das Wasserbauernhaus."
plPL = "Rolnicy sadzą i zbierają uprawy polowe (marchew, pszenicę, ziemniaki, słoneczniki) na terenie wokół budynku. Może tu pracować do 4 rolników, którzy pracują o 50% szybciej lub o 75% szybciej, gdy otrzymują 100 hp mocy przez boczne lub tylne wały. Moc jest opcjonalna. Uprawy wodne nadal wymagają Wodnej Farmy."
ptBR = "Agricultores plantam e colhem culturas de campo (cenoura, trigo, batata, girassol) na área ao redor do prédio. Até 4 agricultores que trabalham 50% mais rápido, ou 75% mais rápido enquanto recebem 100 hp de energia por seus eixos laterais ou traseiros. A energia é opcional. Culturas aquáticas ainda precisam da Casa de Fazenda Aquática."
koKR = "농부들은 건물 주변의 구역에서 밭작물(당근, 밀, 감자, 해바라기)을 심고 수확합니다. 최대 4명의 농부가 작업하며, 측면 또는 후면 축을 통해 100hp의 동력을 받으면 50%보다 빠른 75% 속도로 작업합니다. 동력은 선택 사항입니다. 수생 작물은 여전히 수생 농장이 필요합니다."
trTR = "Çiftçiler, binanın çevresindeki tarlalarda tarla bitkilerini (havuç, buğday, patates, ayçiçeği) eker ve hasat eder. En fazla 4 çiftçi çalışabilir; bunlar %50 daha hızlı çalışır, ancak yan veya arka millerinden 100 hp güç alıyorsa %75 daha hızlı çalışır. Güç isteğe bağlıdır. Su bitkileri için yine Su Çiftliği gerekir."
esES = "Los granjeros plantan y cosechan cultivos de campo (zanahorias, trigo, patatas, girasoles) en el área alrededor del edificio. Hasta 4 granjeros que trabajan un 50 % más rápido, o un 75 % más rápido mientras reciben 100 hp de potencia a través de sus ejes laterales o traseros. La potencia es opcional. Los cultivos acuáticos aún necesitan la Granja Acuática."
itIT = "Gli agricoltori piantano e raccolgono colture da campo (carote, grano, patate, girasoli) nell'area intorno all'edificio. Fino a 4 agricoltori che lavorano il 50% più velocemente, oppure il 75% più velocemente mentre ricevono 100 hp di potenza attraverso gli alberi laterali o posteriori. L'energia è facoltativa. Le colture acquatiche richiedono comunque la Fattoria Acquatica."
ukUA = "Фермери саджають і збирають польові культури (моркву, пшеницю, картоплю, соняшники) на ділянці навколо будівлі. До 4 фермерів, які працюють на 50% швидше, або на 75% швидше, коли отримують 100 hp потужності через бічні або задні вали. Потужність є необов'язковою. Водні культури все ще потребують Водної ферми."
thTH = "ชาวนาปลูกและเก็บเกี่ยวพืชไร่ (แครอต ข้าวสาลี มันฝรั่ง ดอกทานตะวัน) ในพื้นที่รอบอาคาร รองรับชาวนาได้สูงสุด 4 คน ซึ่งทำงานเร็วขึ้น 50% หรือเร็วขึ้น 75% เมื่อได้รับกำลัง 100 hp ผ่านเพลาด้านข้างหรือด้านหลัง การใช้กำลังเป็นทางเลือก พืชน้ำยังคงต้องใช้บ้านชาวนาน้ำ"
csCZ = "Farmáři sází a sklízejí polní plodiny (mrkev, pšenici, brambory, slunečnice) na pozemcích kolem budovy. Pracuje zde až 4 farmáři, kteří pracují o 50 % rychleji, nebo o 75 % rychleji, pokud do budovy přes své boční nebo zadní hřídele přichází 100 hp mechanické energie. Energie je volitelná. Vodní plodiny stále vyžadují Vodní farmu."
viVN = "Nông dân trồng và thu hoạch cây trồng trên đồng ruộng (cà rốt, lúa mì, khoai tây, hướng dương) trong khu vực xung quanh tòa nhà. Tối đa 4 nông dân, làm việc nhanh hơn 50%, hoặc nhanh hơn 75% khi nhận 100 hp công suất qua trục bên hoặc trục phía sau. Công suất là tùy chọn. Cây trồng dưới nước vẫn cần Nhà nông trại thủy sinh."
caES = "Els agricultors planten i collir cultius de camp (pastanagues, blat, patates, gira-sols) a la zona al voltant de l'edifici. Fins a 4 agricultors que treballen un 50% més ràpid, o un 75% més ràpid mentre reben 100 hp de potència a través dels seus eixos laterals o posteriors. La potència és opcional. Els cultius aquàtics encara necessiten la Granja Aquàtica."
beBY = "Фермеры сажают и собирают полевые культуры (морковь, пшеницу, картофель, подсолнечник) на участке вокруг здания. Вмещает до 4 фермеров, которые работают на 50% быстрее или на 75% быстрее, пока получают 100 hp мощности через боковые или задние валы. Мощность необязательна. Водные культуры по-прежнему требуют Водной фермы."
roRO = "Fermierii plantează și recoltează culturile de câmp (morcovi, grâu, cartofi, floarea-soarelui) în zona din jurul clădirii. Până la 4 fermieri care lucrează cu 50% mai repede sau cu 75% mai repede, cât timp clădirea primește 100 hp de putere prin arborii laterali sau din spate. Puterea este opțională. Culturile acvatice necesită în continuare Ferma acvatică."
huHU = "A gazdák az épület körüli területen szántóföldi növényeket (sárgarépát, búzát, burgonyát, napraforgót) ültetnek és takarítanak be. Legfeljebb 4 gazda dolgozik, akik 50%-kal gyorsabban dolgoznak, vagy 75%-kal gyorsabban, ha az oldalsó vagy hátsó tengelyen keresztül 100 hp teljesítményt kapnak. A teljesítmény opcionális. A vízi növényekhez továbbra is szükség van a Vízi gazdaházra."
arSA = "المزارعون يزرعون المحاصيل الحقلية ويحصدونها (الجزر والقمح والبطاطس وعباد الشمس) في المنطقة المحيطة بالمبنى. يعمل حتى 4 مزارعين أسرع بنسبة 50%، أو أسرع بنسبة 75% أثناء حصولهم على 100 hp من الطاقة عبر أعمدة الدوران الجانبية أو الخلفية. الطاقة اختيارية. المحاصيل المائية ما زالت تحتاج إلى مزرعة المائيات."
