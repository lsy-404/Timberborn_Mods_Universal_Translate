ukUA = "Фермери садять і збирають урожай на ділянці навколо будівлі. Працює точно так само, як Фермерський будинок."
thTH = "ชาวนาปลูกและเก็บเกี่ยวพืชผลในพื้นที่รอบอาคารนี้ ทำงานเหมือนฟาร์มเฮาส์ทุกประการ"
csCZ = "Farmáři sázejí a sklízejí plodiny v oblasti kolem budovy. Funguje přesně jako Farmhouse."
viVN = "Nông dân trồng và thu hoạch cây trồng trong khu vực xung quanh tòa nhà. Hoạt động giống hệt Nhà trang trại."
caES = "Els agricultors planten i collen cultius a la zona que envolta l'edifici. Funciona exactament com la Masia."
beBY = "Фермеры саджаюць і збіраюць урожай на тэрыторыі вакол будынка. Працуе зусім так жа, як Фермерскі дом."
roRO = "Fermierii plantează și recoltează culturile în zona din jurul clădirii. Funcționează exact ca Ferma."
huHU = "A farmerek a épület körüli területen ültetik és takarítják be a termést. Pontosan úgy működik, mint a Farmház."
arSA = "يقوم المزارعون بزراعة المحاصيل وحصادها في المنطقة المحيطة بالمبنى. يعمل تماماً مثل المزرعة."

