["Building.LureStake.Description"]
raw = "A wooden stake that holds a small store of Soothesop. Wyrms within range stop chewing through walls while the stake is stocked. Beavers in range still get eaten."
status = "normal"
enUS = "A wooden stake that holds a small supply of Soothesop. Wyrms within range will stop chewing through walls while the stake is stocked. Beavers in range can still be eaten."
zhCN = "“一个木桩，里面储存着少量的安抚草。在范围内的巨蜥停止啃墙壁，直到木桩被耗尽。范围内的海狸仍会被吃掉。”"
zhTW = "一根木製樁，裡面儲存著少量的安撫草。在範圍內的蟲龍會停止咬牆，期間樁內有物資。不過，範圍內的海狸仍然會被吃掉。"
ruRU = "Деревянный кол с небольшим запасом Успокаивающего корня. Черви в радиусе действия перестают грызть стены, пока кол запасываен. Бобры в радиусе все еще могут быть съедены."
jaJP = "「小さなソーズソップを保管する木製の杭。杭が補給されている間、範囲内のワームは壁をかじるのをやめる。しかし、範囲内のビーバーはやはり食べられてしまう。」"
frFR = "Un pieu en bois qui contient un petit stock de Soothesop. Les wyrms à portée cessent de ronger les murs tant que le pieu est approvisionné. Les castors à portée continuent d'être mangés."
deDE = "Ein Holzpfahl, der eine kleine Menge Soothesop enthält. Wyrms im Umkreis hören auf, durch Wände zu fressen, solange der Pfahl bestückt ist. Biber im Umkreis werden jedoch weiterhin gefressen."
plPL = "Drewniany słupek, który przechowuje niewielką ilość Soothesop. Wyrmy w zasięgu przestają gryźć ściany, gdy słupek jest uzupełniony. Bobry w zasięgu nadal są zjadane."
ptBR = "Uma estaca de madeira que contém um pequeno estoque de Soothesop. Wyrms dentro do alcance param de roer as paredes enquanto a estaca estiver abastecida. Castores na área ainda são comidos."
koKR = "작은 양의 소스합을 저장하는 나무 말뚝. 범위 내의 용들은 말뚝이 채워져 있는 동안 벽을 갉아먹는 것을 멈춘다. 범위 내의 비버는 여전히 잡아먹힌다."
trTR = "Bir miktar Soothesop tutan ahşap bir kazık. Menzildeki Wyrmlar, kazık doluyken duvarları çiğnemeyi durdurur. Menzildeki kunduzlar hala yenir."
esES = "Una estaca de madera que almacena una pequeña cantidad de Soothesop. Los wyrms dentro de su alcance dejan de roer las paredes mientras la estaca tenga existencias. Los castores que estén dentro del alcance siguen siendo devorados."
itIT = "Un paletto di legno che custodisce una piccola scorta di Soothesop. I wyrm nel raggio d’azione smettono di rosicchiare i muri finché il paletto è rifornito. I castori nel raggio d’azione vengono comunque divorati."
ukUA = "Дерев’яний кілок із невеликим запасом заспокійливого зілля. Вирми в радіусі дії перестають прогризати стіни, поки в кілку є запас. Бобрів у радіусі дії вони все одно з’їдають."
thTH = "หลักไม้ที่เก็บ Soothesop ไว้ได้เล็กน้อย Wyrms ที่อยู่ในระยะจะหยุดแทะกำแพงขณะที่หลักยังมี Soothesop อยู่ ส่วนบีเวอร์ในระยะยังคงถูกกิน"
csCZ = "Dřevěný kůl, který uchovává malé množství Soothesopu. Wyrmy v dosahu přestanou hrýzat do zdí, zatímco je kůl zásoben. Castorové v dosahu jsou stále sežráni."
viVN = "Cọc gỗ giữ một kho nhỏ Soothesop. Rồng trong phạm vi dừng gặm tường trong khi cọc được cung cấp. Lửng trong phạm vi vẫn bị ăn."
caES = "Una estaca de fusta que conté una petita reserva de Soothesop. Els wyrms dins del seu abast deixen de rosegar les parets mentre l’estaca en tingui. Els castors dins del seu abast continuen sent devorats."
beBY = "Драўляны кол для захоўвання невялікага запасу заспакаяльнага соку. Вірмы ў радыусе дзеяння перастаюць прагрызаць сцены, пакуль у коле ёсць запас. Баброў у зоне дзеяння ўсё роўна з'ядаюць."
roRO = "Un țăruș de lemn care păstrează o cantitate mică de Soothesop. Wyrmii din raza sa nu mai rod pereții cât timp țărușul are Soothesop în stoc. Castorii din rază sunt totuși mâncați."
huHU = "Fakaró, amely kis mennyiségű Soothesopot tárol. A hatótávolságán belüli sárkányok abbahagyják a falak átrágását, amíg van készlet a karóban. A hatótávolságon belüli hódokat továbbra is megeszik."
arSA = "وتد خشبي يحتفظ بكمية صغيرة من Soothesop. تتوقف كائنات Wyrms ضمن مداه عن قضم الجدران ما دام الوتد مزودًا بالمخزون. أما القنادس ضمن مداه، فستظل تُؤكل."

