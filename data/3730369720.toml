["WWW.Settings.HungerRatePercent.Tooltip"]
raw = "Multiplier on hunger accumulation. Higher = wyrms hunt sooner and chew walls more aggressively."
status = "normal"
enUS = "Multiplier on hunger accumulation. Higher = wyrms hunt sooner and chew walls more aggressively."
zhCN = "饥饿积累的倍数。更高的值 = 龙更早开始捕猎，并更具攻击性地啃咬墙壁。"
zhTW = "飢餓累積的倍數。數值越高 = 蛇龍會更快獵食並更具攻擊性地啃牆。"
ruRU = "Множитель на накопление голода. Чем выше = тем скорее драконы начинают охоту и агрессивнее грызут стены."
jaJP = "飢餓の蓄積に対する乗数。高いほど、ワームがより早く狩りを行い、壁をより攻撃的に噛む。"
frFR = "Multiplicateur sur l'accumulation de faim. Plus élevé = les wyrms chassent plus tôt et rongeront les murs de manière plus agressive."
deDE = "Multiplikator für die Hungerakkumulation. Höher = Wyrms jagen früher und nagen aggressiver an Wänden."
plPL = "Multiplikator na gromadzenie głodu. Wyższa wartość = smoki polują wcześniej i bardziej agresywnie gryzą ściany."
ptBR = "Multiplicador na acumulação de fome. Maior = wyrms caçam mais cedo e roem paredes de forma mais agressiva."
koKR = "허기 축적에 대한 배율. 높을수록 웜이 더 빨리 사냥하고 벽을 더 공격적으로 갉아먹습니다."
trTR = "Açlık birikiminde çarpan. Daha yüksek = yaratıklar daha hızlı avlanır ve duvarları daha agresif şekilde kemirir."
esES = "Multiplicador de acumulación del hambre. Cuanto mayor sea, antes cazan los wyrms y con más agresividad roen las paredes."
itIT = "Moltiplicatore dell’accumulo della fame. Più è alto, prima i wyrm vanno a caccia e più aggressivamente rosicchiano i muri."
ukUA = "Множник накопичення голоду. Що вище значення, то раніше вирми вирушають на полювання і агресивніше гризуть стіни."
thTH = "ตัวคูณการสะสมความหิว ยิ่งค่าสูง เวิร์มจะออกล่าเร็วขึ้นและแทะกำแพงอย่างดุดันยิ่งขึ้น"
csCZ = "Multiplikátor na akumulaci hladu. Vyšší = draci loví dříve a agresivněji okusují stěny."
viVN = "Thông số nhân cho việc tích lũy đói. Cao hơn = rồng săn sớm hơn và cắn tường mạnh mẽ hơn."
caES = "Multiplicador de l'acumulació de fam. Com més alt, abans cacen els wyrms i més agressivament roseguen les parets."
beBY = "Множнік назапашвання голаду. Чым вышэйшы, тым раней вірмы выходзяць на паляванне і тым агрэсіўней грызуць сцены."
roRO = "Multiplicator pentru acumularea foamei. O valoare mai mare = wyrmii vânează mai devreme și rod zidurile mai agresiv."
huHU = "Az éhség felhalmozódásának szorzója. Magasabb értéknél a wyrmek hamarabb kezdenek vadászni, és agresszívebben rágják a falakat."
arSA = "مُضاعِف تراكم الجوع. كلما ارتفع، بدأت الويرمز بالصيد في وقت أقرب ومضغت الجدران بشراسة أكبر."

