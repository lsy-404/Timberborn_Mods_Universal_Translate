ptBR = "Coloque onde você prefere que o dragão mastigue a isca em vez da sua barragem."
koKR = "늪지대에서 드래곤이 벌레를 물어가기를 원한다면, 방파제보다 이곳에 두세요."
trTR = "Bunu, wyrm'ın yem yerine, barajınızı kemirmesini istemediğiniz bir yere yerleştirin."
esES = "Colócala donde prefieras que el wyrm muerda el cebo en vez de tu dique."
