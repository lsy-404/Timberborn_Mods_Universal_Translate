["WWW.Settings.AutoScatterMode.Tooltip"]
raw = "Scatter Wyrm Husks and Wyrm Dens across a fresh map at world creation. Maps that already contain manually placed hazards are never touched. \nThis setting is locked once a game starts; it only takes effect when starting a new game. \nPairing tip: Light pairs well with Hard difficulty (long droughts force the deep wyrms awake), Heavy pairs well with Easy (short droughts give time to build a containment)."
status = "normal"
enUS = "Scatter Wyrm Husks and Wyrm Dens across a new map during world creation. Maps that already have manually placed hazards will not be affected. \nThis setting is locked once a game begins; it only takes effect when starting a new game. \nPairing tip: Light pairs well with Hard difficulty (long droughts awaken the deep wyrms), Heavy pairs well with Easy (short droughts allow time to build a containment)."
zhCN = "在世界创建时，将 Wyrm 残骸和 Wyrm 巢散布在新地图上。已经包含手动放置的危险的地图不会受到影响。\n一旦游戏开始，此设置将被锁定；它仅在开始新游戏时生效。\n配对提示：轻松模式适合困难模式（漫长的干旱迫使深层 Wyrm 醒来），重型模式适合简单模式（短暂的干旱提供了建设防护的时间）。"
zhTW = "在世界創建時，將 Wyrm 殼和 Wyrm 窩散佈於新的地圖上。已經包含手動放置的危險的地圖將不會受到影響。  \n一旦遊戲開始，此設定將鎖定；它僅在開始新遊戲時生效。  \n搭配提示：輕難度搭配困難難度效果良好（長期乾旱會使深層 Wyrm 醒來），重難度則與簡單難度搭配良好（短期乾旱提供建設容器的時間）。"
ruRU = "Раскидывайте оболочки Вырмов и логова Вырмов по новой карте при создании мира. Карты, которые уже содержат вручную размещённые опасности, никогда не трогаются. \nЭта настройка заблокирована после начала игры; она вступает в силу только при начале новой игры. \nСовет по сочетанию: Легкий режим хорошо сочетается с высокой сложностью (долгие засухи пробуждают глубоких Вырмов), Тяжёлый режим хорошо сочетается с лёгким (короткие засухи дают время для строительства заграждения)."
jaJP = "新しいマップの作成時に、ワームの殻とワームの巣を散らばせます。手動で配置された危険物を含むマップは決して影響を受けません。この設定はゲームが開始されるとロックされ、 新しいゲームを開始する際のみ効果があります。 ペアリングのヒント：ライトはハード難易度（長い干ばつで深いワームが目を覚ます）と相性が良く、ヘビーはイージー（短い干ばつで収容する時間が得られる）と相性が良いです。"
frFR = "Éparpillez les coques de wyrm et les tanières de wyrm sur une nouvelle carte lors de la création du monde. Les cartes contenant déjà des dangers placés manuellement ne sont jamais affectées. \nCe paramètre est verrouillé une fois que le jeu commence ; il n'entrera en vigueur qu'au début d'une nouvelle partie. \nConseil de combinaison : Léger se marie bien avec la difficulté Difficile (des sécheresses longues réveillent les wyrms profonds), Lourd se marie bien avec Facile (des sécheresses courtes permettent de construire une enceinte)."
deDE = "Verstreue Wyrm-Hülsen und Wyrm-Nester über eine frische Karte bei der Welterstellung. Karten, die bereits manuell platzierte Gefahren enthalten, bleiben unberührt. \nDiese Einstellung ist gesperrt, sobald ein Spiel gestartet wird; sie tritt nur bei Spielstart in Kraft. \nPaarungstipp: Hell passt gut zur Schwierigkeitsstufe Hart (lange Dürren zwingen die tiefen Wyrme zum Aufwachen), Schwer passt gut zur Stufe Einfach (kurze Dürren bieten Zeit zum Bau einer Eindämmung)."
plPL = "Rozrzucaj skorupy Wyrmów i Gniazda Wyrmów na nowej mapie podczas jej tworzenia. Mapy, które już zawierają ręcznie umieszczone niebezpieczeństwa, nie są dotykane. \nTo ustawienie jest zablokowane po rozpoczęciu gry; wchodzi w życie tylko przy rozpoczynaniu nowej gry. \nWskazówka dotycząca parowania: Lekki dobrze łączy się z poziomem trudności Trudnym (długie susze budzą głębokie wyrmy), a Ciężki dobrze łączy się z Łatwym (krótkie susze dają czas na budowę osłony)."
ptBR = "Espalhe Cascas de Wyrm e Tocas de Wyrm por um mapa novo na criação do mundo. Mapas que já contêm perigos colocados manualmente nunca são tocados. \nEsta configuração fica bloqueada uma vez que o jogo começa; ela só entra em efeito ao iniciar um novo jogo. \nDica de combinação: Leve combina bem com dificuldade Difícil (secas longas forçam os wyrms profundos a acordar), Pesado combina bem com Fácil (secas curtas dão tempo para construir um contenção)."
koKR = "세계 생성 시 새 맵에 Wyrm 껍데기와 Wyrm 둥지를 흩뿌립니다. 수동으로 배치된 위험 요소가 이미 포함된 맵은 절대 손대지 않습니다. \n이 설정은 게임이 시작되면 잠겨 있으며, 새로운 게임을 시작할 때만 효과를 발휘합니다. \n조합 팁: Light는 Hard 난이도와 잘 어울리고 (긴 가뭄이 깊은 Wyrm을 깨우게 함), Heavy는 Easy와 잘 어울립니다 (짧은 가뭄이 격리할 시간을 줌)."
trTR = "Yeni harita yaratıldığında Wyrm kabuklarını ve Wyrm yuvalarını yay. Zaten manuel olarak yerleştirilmiş tehlikeler içeren haritalar asla değiştirilmez. \nBu ayar bir oyun başladıktan sonra kilitlenir; sadece yeni bir oyun başlatıldığında etkili olur. \nEşleştirme ipucu: Hafif, Zor zorluk ile iyi eşleşir (uzun kuraklıklar derin wyrmlarını uyandırır), Ağırsı, Kolay ile iyi eşleşir (kısa kuraklıklar bir içerme inşa etmek için zaman tanır)."
esES = "Esparce restos de wyrm y guaridas de wyrm por un mapa nuevo al crear el mundo. Los mapas que ya contienen peligros colocados manualmente nunca se modifican. \nEste ajuste queda bloqueado una vez iniciada la partida; solo tiene efecto al empezar una partida nueva. \nConsejo para combinarlos: Ligero combina bien con la dificultad Difícil (las sequías largas obligan a despertar a los wyrms de las profundidades); Pesado combina bien con Fácil (las sequías cortas dan tiempo para construir un recinto de contención)."
itIT = "Spargi gusci di Wyrm e tane di Wyrm su una nuova mappa durante la creazione del mondo. Le mappe che contengono già pericoli posizionati manualmente non vengono mai modificate. \nQuesta impostazione si blocca all'avvio di una partita; ha effetto solo quando si inizia una nuova partita. \nConsiglio per l'abbinamento: Leggera si abbina bene alla difficoltà Difficile (le lunghe siccità svegliano i Wyrm degli abissi), Pesante si abbina bene a Facile (le brevi siccità lasciano il tempo di costruire un recinto)."
ukUA = "Розкидає Оболонки вирмів і Лігва вирмів по новій мапі під час створення світу. Мапи, на яких уже вручну розміщено небезпеки, не змінюються. \nЦе налаштування блокується після початку гри; воно діє лише під час початку нової гри. \nПорада щодо поєднання: Легкий режим добре пасує до високої складності (тривалі посухи пробуджують глибинних вирмів), а Важкий — до низької (короткі посухи дають час облаштувати місце для утримання)."
thTH = "กระจายซากเวิร์มและรังเวิร์มทั่วแผนที่ใหม่เมื่อสร้างโลก แผนที่ที่มีอันตรายซึ่งวางด้วยตนเองอยู่แล้วจะไม่ถูกเปลี่ยนแปลง  \nการตั้งค่านี้จะล็อกเมื่อเริ่มเกมแล้ว และมีผลเฉพาะเมื่อเริ่มเกมใหม่เท่านั้น  \nเคล็ดลับการจับคู่: แบบเบาเข้ากันได้ดีกับระดับความยากยาก (ภัยแล้งที่ยาวนานจะปลุกเวิร์มใต้ดินให้ตื่น) ส่วนแบบหนักเข้ากันได้ดีกับระดับความยากง่าย (ภัยแล้งที่สั้นทำให้มีเวลาสร้างที่กักกัน)"
csCZ = "Rozptýlení schráněk wyrmů a hnízd wyrmů na nové mapě při vytváření světa. Mapy, které již obsahují ručně umístěné nebezpečí, nejsou nikdy dotčeny.\nToto nastavení je uzamčeno, jakmile hra začne; má účinek pouze při zahájení nové hry.\nTip na párování: Světlá se dobře snoubí s obtížností Těžká (dlouhé sucha probouzí hluboké wyrmy), Těžká se dobře snoubí s obtížností Snadná (krátká sucha dávají čas na vybudování zadržení)."
viVN = "Rải xác Wyrm và ổ Wyrm trên một bản đồ mới khi tạo thế giới. Các bản đồ đã có những nguy hiểm được đặt thủ công sẽ không bị ảnh hưởng. \nCài đặt này sẽ bị khóa khi một trận đấu bắt đầu; nó chỉ có hiệu lực khi bắt đầu một trận đấu mới. \nMẹo ghép đôi: Cấp độ Nhẹ phối hợp tốt với độ khó Khó (các đợt hạn kéo dài buộc những con wyrm sâu phải thức dậy), Cấp độ Nặng phối hợp tốt với độ khó Dễ (các đợt hạn ngắn cho thời gian để xây dựng một khu vực chứa)."
caES = "Escampa closques de wyrm i caus de wyrm per un mapa nou durant la creació del món. Els mapes que ja continguin perills col·locats manualment no es modificaran mai.\nAquest paràmetre queda bloquejat un cop comença una partida; només té efecte en iniciar una partida nova.\nConsell de combinació: Lleuger combina bé amb la dificultat Difícil (les sequeres llargues obliguen els wyrms de les profunditats a despertar-se); Intens combina bé amb Fàcil (les sequeres curtes donen temps per construir un confinament)."
beBY = "Раскідвайце абалонкі вірмаў і логавішчы вірмаў па новай карце падчас стварэння свету. Карты, на якіх ужо ўручную размешчаны небяспечныя аб’екты, застаюцца некранутымі.\nГэты параметр блакуецца пасля пачатку гульні; ён дзейнічае толькі пры запуску новай гульні.\nПарада па спалучэнні: лёгкі рэжым добра спалучаецца з высокай складанасцю (працяглыя засухі абуджаюць глыбінных вірмаў), а цяжкі — з нізкай (кароткія засухі даюць час пабудаваць збудаванне для ўтрымання)."
roRO = "Răspândește carcase de Wyrm și bârloguri de Wyrm pe o hartă nouă la generarea lumii. Hărțile care conțin deja pericole plasate manual nu sunt niciodată modificate. \nAceastă setare se blochează odată ce începe o partidă; intră în vigoare doar la începerea unei partide noi. \nSfat de combinare: Dispersarea redusă se potrivește bine cu dificultatea Greu (secetele lungi trezesc wyrmii din adâncuri), iar dispersarea intensă se potrivește bine cu dificultatea Ușor (secetele scurte oferă timp pentru construirea unei incinte de izolare)."
huHU = "Új térképen Wyrm-maradványokat és Wyrm-odúkat szór szét a világ létrehozásakor. A már kézzel elhelyezett veszélyforrásokat tartalmazó térképekhez soha nem nyúl.\nEz a beállítás a játék indítása után zárolódik; csak új játék indításakor lép életbe.\nPárosítási tipp: Az Enyhe jól illik a Nehéz nehézségi fokozathoz (a hosszú aszályok felébresztik a mélyben élő wyrmöket), az Erős pedig a Könnyűhöz (a rövid aszályok alatt marad idő egy visszatartó létesítmény megépítésére)."
arSA = "انثر بقايا الويْرم وأوكار الويْرم في أرجاء خريطة جديدة عند إنشائها. لن تُمسّ الخرائط التي تحتوي مسبقًا على مخاطر وُضعت يدويًا.\nيُقفل هذا الإعداد بمجرد بدء اللعبة؛ ولا يسري إلا عند بدء لعبة جديدة.\nنصيحة للتوليف: يتناسب الإعداد الخفيف جيدًا مع الصعوبة العالية (ففترات الجفاف الطويلة توقظ الويْرم العميقة)، بينما يتناسب الإعداد الثقيل جيدًا مع الصعوبة السهلة (ففترات الجفاف القصيرة تتيح وقتًا لبناء منشأة احتواء)."

