["WWW.Settings.SandboxMode.Tooltip"]
raw = "When on, wyrms still wake and walk but never damage beavers or buildings. Useful for map authors testing layouts."
status = "normal"
enUS = "When enabled, wyrms will still wake and roam but will not harm beavers or buildings. Useful for map authors testing layouts."
zhCN = "“开启后，龙仍会苏醒并移动，但不会对海狸或建筑造成损害。这对测试布局的地图作者很有用。”"
zhTW = "啟用後，巨蟒仍然會醒來並行走，但不會對海狸或建築造成傷害。對於地圖創作者測試佈局非常有用。"
ruRU = "Когда включено, драконы все равно пробуждаются и передвигаются, но никогда не наносят повреждений бобрам или зданиям. Полезно для авторов карт при тестировании макетов."
jaJP = "「オンの場合、ワームは目覚めて歩きますが、ビーバーや建物にダメージを与えることはありません。マップ作成者がレイアウトをテストする際に便利です。」"
frFR = "Lorsque activé, les wyrms se réveillent et marchent mais ne causent jamais de dégâts aux castors ou aux bâtiments. Utile pour les auteurs de cartes testant les agencements."
deDE = "Wenn aktiviert, erwachen und wandern die Wyrme, fügen aber niemals Bibern oder Gebäuden Schaden zu. Nützlich für Kartenautoren, die Layouts testen."
plPL = "Po włączeniu, smoki nadal się budzą i spacerują, ale nigdy nie szkodzą bobrom ani budynkom. Przydatne dla autorów map testujących układy."
ptBR = "Quando ativado, os wyrms ainda acordam e andam, mas nunca causam dano a castores ou edifícios. Útil para autores de mapas testando layouts."
koKR = "활성화되면, 와름은 여전히 깨어나고 걸어다니지만 비버나 건물에 피해를 주지 않습니다. 레이아웃을 테스트하는 맵 저자에게 유용합니다."
trTR = "Açık olduğunda, ejderhalar uyanır ve yürür ancak aslanları veya binaları asla zarar vermez. Harita yazarlarının düzenleri test etmesi için faydalıdır."
esES = "Al activarlo, los wyrms siguen despertándose y caminando, pero nunca dañan a los castores ni a los edificios. Útil para que los autores de mapas prueben diseños."
itIT = "Quando è attiva, i wyrm continuano a svegliarsi e a camminare, ma non danneggiano mai i castori né gli edifici. Utile per gli autori di mappe che testano le configurazioni."
ukUA = "Коли ввімкнено, виверни все ще прокидаються й ходять, але ніколи не завдають шкоди бобрам або будівлям. Корисно для авторів мап, які тестують планування."
thTH = "เมื่อเปิดใช้งาน เวิร์มยังคงตื่นขึ้นและเดินไปมา แต่จะไม่ทำความเสียหายแก่บีเวอร์หรือสิ่งปลูกสร้าง มีประโยชน์สำหรับผู้สร้างแผนที่ที่ต้องการทดสอบผัง"
csCZ = "Když je zapnuto, draci se stále probouzí a chodí, ale nikdy nepoškozují bobry ani budovy. Užitečné pro autory map, kteří testují uspořádání."
viVN = "Khi bật, rồng vẫn thức dậy và đi lại nhưng không bao giờ gây hại cho nhím hoặc các công trình. Hữu ích cho các tác giả bản đồ thử nghiệm bố cục."
caES = "Quan està activat, els wyrms encara es desperten i caminen, però mai fan mal als castors ni als edificis. És útil per als creadors de mapes que provin distribucions."
beBY = "Калі ўключана, вірмы ўсё яшчэ прачынаюцца і ходзяць, але ніколі не пашкоджваюць баброў ці будынкі. Карысна аўтарам карт для тэставання планіровак."
roRO = "Când este activată, wyrmii se trezesc și se plimbă în continuare, dar nu le fac niciodată rău castorilor sau clădirilor. Utilă pentru creatorii de hărți care testează configurații."
huHU = "Bekapcsolt állapotban a wyrmek továbbra is felébrednek és járkálnak, de soha nem tesznek kárt a hódokban vagy az épületekben. Hasznos a pályakészítőknek az elrendezések teszteléséhez."
arSA = "عند تفعيل هذا الخيار، تظل التنانين تستيقظ وتمشي، لكنها لا تُلحق أي ضرر بالقنادس أو المباني مطلقًا. مفيد لمصممي الخرائط عند اختبار التخطيطات."

