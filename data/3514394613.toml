["LV.HF.TerrainBlockUpgrade1Lore"]
raw = "'Perfectly safe. Rigorously tested. Now, please sign this waiver before purchasing.' —xa0HydroForma™xa0Legal"
status = "abandoned"
enUS = "'Perfectly safe. Rigorously tested. Now, please sign this waiver before purchasing.' —xa0HydroForma™xa0Legal"
