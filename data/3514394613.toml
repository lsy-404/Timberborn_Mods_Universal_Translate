esES = "'Perfectly safe. Rigorously tested. Now, please sign this waiver before purchasing.' —xa0HydroForma™xa0Legal"
itIT = "'Assolutamente sicuro. Testato con rigore. Ora, firmi questa liberatoria prima dell'acquisto.' —xa0HydroForma™xa0Legal"
ukUA = "'Абсолютно безпечно. Ретельно перевірено. А тепер, будь ласка, підпишіть цю відмову від відповідальності перед покупкою.' —xa0HydroForma™xa0Legal"
thTH = "'ปลอดภัยโดยสมบูรณ์ ผ่านการทดสอบอย่างเข้มงวด ตอนนี้ กรุณาลงนามในเอกสารยกเว้นความรับผิดนี้ก่อนซื้อ' — ฝ่ายกฎหมาย HydroForma™"
csCZ = "'Dokonale bezpečné. Pečlivě testováno. Nyní, prosím, podepište tuto registrační doložku před zakoupením.' —xa0HydroForma™xa0Právní"
viVN = "'Hoàn toàn an toàn. Được thử nghiệm nghiêm ngặt. Xin vui lòng ký giấy miễn trừ trách nhiệm này trước khi mua.' —HydroForma™ Pháp lý"
caES = "\"Perfectament segur. Rigorosament provat. Ara, si us plau, signi aquest descàrrec abans de comprar.\" —xa0HydroForma™xa0Legal"
beBY = "«Цалкам бяспечна. Строга пратэставана. А цяпер, калі ласка, падпішыце гэтую адмову ад адказнасці перад пакупкай.» —xa0HydroForma™xa0Юрыдычны аддзел"
roRO = "'Perfect de sigur. Testat riguros. Acum, vă rugăm să semnați această declarație de exonerare înainte de a cumpăra.' —xa0HydroForma™xa0Legal"
huHU = "'Tökéletesen biztonságos. Alaposan tesztelve. Most pedig kérjük, a vásárlás előtt írja alá ezt a felelősségkizáró nyilatkozatot.' —xa0HydroForma™xa0Jogi osztály"
arSA = "\"مأمون تمامًا. خضع لاختبارات صارمة. الآن، يُرجى التوقيع على هذا الإعفاء قبل الشراء.\" —xa0HydroForma™xa0Legal"

