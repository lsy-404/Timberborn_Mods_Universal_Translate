["LV.HF.DirtExcavatorUpgradeLore"]
raw = "'Fired my last digger. The machine never chews sticks on the job.' —xa0Clayexa0Broadtail"
status = "normal"
enUS = "'Fired my last digger. The machine never chews sticks on the job.' — Clay Broadtail"
zhCN = "\"我把最后一个挖掘机解雇了。机器在工作时可从不啃木棍。\" — 亚历克斯·布罗德泰尔"
zhTW = "\"解僱了我最後一台挖掘機。這台機器在工作時從來不咬樹枝。\" — 克雷·布羅德泰爾"
ruRU = "«Уволил своего последнего экскаватора. Машина никогда не грызет палки во время работы.» — Клей Бродуэй"
jaJP = "「最後の掘削機をクビにした。仕事中に機械が棒を噛み砕くことはなかった。」 — クレイ・ブロードテイル"
frFR = "'J'ai licencié mon dernier pelleteur. La machine ne mâche jamais les bâtons au travail.' — Claye Broadtail"
deDE = "„Habe meinen letzten Bagger gefeuert. Die Maschine frisst nie die Äste bei der Arbeit.“ — Claye Broadtail"
plPL = "\"Zwalniam ostatniego kopacza. Maszyna nigdy nie zjada patyków w pracy.\" — Clay Broadtail"
ptBR = "\"Despedi meu último escavador. A máquina nunca mastiga gravetos durante o trabalho.\" — Claye Broadtail"
koKR = "'마지막 굴착기를 해고했어. 그 기계는 일하는 동안 나무를 씹지 않더군.' — 클레이 브로드테일"
trTR = "'Son kazıcıyı işten çıkardım. Makine işte asla çubukları yemiyor.' —xa0Clayexa0Broadtail"
esES = "«Despedí a mi última excavadora. La máquina nunca mastica palos en el trabajo.» — Clay Broadtail"
itIT = "'Ho licenziato il mio ultimo scavatore. La macchina non mastica mai bastoncini sul lavoro.' —Clay Broadtail"
ukUA = "«Звільнив свій останній екскаватор. Ця машина ніколи не жує палички на роботі.» — Клей Бродтейл"
thTH = "'ฉันเลิกจ้างคนขุดคนสุดท้ายไปแล้ว เครื่องจักรนั่นไม่เคยแทะไม้ระหว่างทำงานเลย' — เคลย์ บรอดเทล"
csCZ = "'Vypálil jsem svůj poslední bagr. Stroj nikdy nezačne žvýkat klacky při práci.' —xa0Clayexa0Broadtail"
viVN = "'Tôi đã sa thải thợ đào cuối cùng của mình. Chiếc máy không bao giờ nhai que gỗ khi làm việc.' —xa0Clayexa0Broadtail"
caES = "'He acomiadat el meu últim excavador. La màquina mai no mastega pals mentre treballa.' —xa0Clayexa0Broadtail"
beBY = "'Звольніў свайго апошняга экскаватара. Машына на працы ніколі не грызе палкі.' — Clay Broadtail"
roRO = "'Mi-am concediat ultimul excavator. Mașina nu mestecă niciodată bețe în timpul lucrului.' — Clay Broadtail"
huHU = "'Kirúgtam az utolsó ásógépemet. A gép munka közben sosem rágja a botokat.' — Clay Broadtail"
arSA = "'طردتُ آخر حفّار لديّ. الآلة لا تمضغ الأعواد أثناء العمل أبدًا.' — كلاي برودتيل"

