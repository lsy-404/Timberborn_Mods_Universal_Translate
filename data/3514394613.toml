["LV.HF.LeveeUpgradeLore"]
raw = "'A few copper rods and a lot of ingenuity. Now the current flows where the river can't.' —xa0Wattsonxa0Longtooth"
status = "normal"
enUS = "'A few copper rods and a lot of ingenuity. Now the current flows where the river can't.' — Wattson Longtooth"
zhCN = "“几根铜棒和大量的独创性。现在水流在河流无法到达的地方畅通无阻。” —瓦特森·长牙"
zhTW = "「幾根銅棒和大量的智慧。現在電流流向了河流無法到達的地方。」 — 瓦特森·長牙"
ruRU = "«Несколько медных стержней и много изобретательности. Теперь ток течет там, где река не может.» — Уатсон Лонгтоот"
jaJP = "「いくつかの銅の棒と多くの創意工夫。今、川が流れないところに電流が流れる。」 — ワットソン・ロングトゥース"
frFR = "« Quelques barres de cuivre et beaucoup d'ingéniosité. Maintenant, le courant circule là où la rivière ne le peut pas. » — Wattson Longtooth"
deDE = "„Ein paar Kupferstangen und viel Einfallsreichtum. Jetzt fließt der Strom dorthin, wo der Fluss nicht kann.“ — Wattson Langzahn"
plPL = "'Kilka miedzianych prętów i dużo pomysłowości. Teraz prąd płynie tam, gdzie rzeka nie może.' — Wattson Longtooth"
ptBR = "'Algumas barras de cobre e muita criatividade. Agora a corrente flui onde o rio não pode.' — Wattson Longtooth"
koKR = "'몇 개의 구리봉과 많은 독창성. 이제 강이 흐르지 못하는 곳에서 전류가 흐릅니다.' — 와슨 롱투스"
trTR = "'Birkaç bakır çubuk ve bolca yaratıcılık. Şimdi akıntı, nehrin akamadığı yerlerde akıyor.' —xa0Wattsonxa0Longtooth"
esES = "'Unas pocas varillas de cobre y mucho ingenio. Ahora la corriente fluye por donde el río no puede.' —xa0Wattsonxa0Longtooth"
itIT = "'Qualche asta di rame e tanta ingegnosità. Ora la corrente scorre dove il fiume non riesce.' —xa0Wattsonxa0Longtooth"
ukUA = "'Кілька мідних стрижнів і безліч винахідливості. Тепер струм тече там, де не може річка.' — Ваттсон Довгозуб"
thTH = "'ทองแดงแท่งไม่กี่แท่งกับความคิดสร้างสรรค์อีกมาก ตอนนี้กระแสน้ำไหลไปถึงจุดที่แม่น้ำไปไม่ถึง' —วัตต์สัน ลองทูธ"
csCZ = "'Několik měděných tyčí a spousta vynalézavosti. Teď proudí voda tam, kde řeka nemůže.' —xa0Wattsonxa0Longtooth"
viVN = "'Vài thanh đồng và vô số sáng kiến. Giờ đây dòng điện chảy ở nơi con sông không thể tới.' — Wattson Longtooth"
caES = "'Unes quantes barres de coure i molta ingenuïtat. Ara el corrent flueix on el riu no pot.' —Wattson Longtooth"
beBY = "'Некалькі медных стрыжняў і шмат вынаходлівасці. Цяпер ток цячэ там, дзе рака не можа.' —xa0Уотсан xa0Лонгтут"
roRO = "„Câteva tije de cupru și o grămadă de ingeniozitate. Acum curentul curge acolo unde râul nu poate.” —xa0Wattsonxa0Longtooth"
huHU = "'Néhány rézrúd és sok leleményesség. Most ott folyik az áram, ahol a folyó nem tud.' —xa0Wattsonxa0Longtooth"
arSA = "'القليل من قضبان النحاس وكثير من الذكاء. الآن يتدفق التيار حيث لا يستطيع النهر ذلك.' — واتسون لونغتوث"

