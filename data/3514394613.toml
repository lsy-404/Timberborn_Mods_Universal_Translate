["LV.HF.ImpermeableFloorUpgradeEff"]
raw = "Impermeable Floors can be built without support or attached directly to terrain. They function as paths with 4× movement speed. Due to anti-gravity behavior, you get no material refund when destroying floating ones, they just lift themselves up to space."
status = "normal"
enUS = "Impermeable Floors can be built without support or attached directly to terrain. They function as paths with 4× movement speed. Due to anti-gravity behavior, you get no material refund when destroying floating ones, they just lift themselves up to space."
zhCN = "防渗地板可以作为道路使用，大幅提高海狸的移动速度 +400%，而且建造完成后便无需支撑。但是拆除后无法回收任何材料。"
zhTW = "<YellowHighlight>目前沒有任何效果。</YellowHighlight> 早期支持者在該升級正式發布之前，能以折扣的科學成本解鎖此升級。"
ruRU = "<YellowHighlight>В настоящее время не имеет эффекта.</YellowHighlight> Ранние сторонники разблокируют это обновление с учетом скидки на научные затраты до его будущего выпуска."
jaJP = "<YellowHighlight>現在のところ効果はありません。</YellowHighlight> 早期サポーターは、将来のリリース前にこのアップグレードを割引価格で解放します。"
frFR = "<YellowHighlight>Actuellement, n'a aucun effet.</YellowHighlight> Les premiers soutiens débloquent cette amélioration à un coût scientifique réduit avant sa sortie future."
deDE = "<YellowHighlight>Hat derzeit keine Wirkung.</YellowHighlight> Frühe Unterstützer schalten dieses Upgrade zu einem reduzierten Forschungskostenpreis frei, bevor es in Zukunft veröffentlicht wird."
plPL = "<YellowHighlight>Obecnie nie ma żadnego efektu.</YellowHighlight> Wczesni zwolennicy odblokowują tę aktualizację po obniżonym koszcie naukowym przed jej przyszłym wydaniem."
ptBR = "Atualmente não tem efeito. Os primeiros apoiadores desbloqueiam esta atualização a um custo científico com desconto antes de seu lançamento futuro."
koKR = "방수 바닥은 지지 없이 건설할 수 있으며, 지형에 직접 연결할 수 있습니다. 이 바닥은 4배의 이동 속도를 가진 경로로 작동합니다. 반중력 특성 때문에, 떠 있는 바닥을 파괴할 때 자재 환급을 받을 수 없으며, 그들은 단순히 우주로 떠오릅니다."
trTR = "Su geçirmez zeminler destek olmadan veya doğrudan arazinin üzerine inşa edilebilir. 4× hareket hızıyla yollar gibi işlev görürler. Antigravitasyon davranışı nedeniyle, yüzenleri yok ettiğinizde malzeme geri ödemesi alamazsınız, sadece kendilerini uzaya kaldırırlar."
esES = "Los suelos impermeables pueden construirse sin soporte o colocarse directamente sobre el terreno. Funcionan como caminos con una velocidad de movimiento 4× mayor. Debido al comportamiento antigravedad, no se recupera ningún material al destruir los que están flotando, ya que simplemente se elevan hacia el espacio."
itIT = "Le Pavimentazioni Impermeabili possono essere costruite senza supporto o fissate direttamente al terreno. Funzionano come sentieri con una velocità di movimento 4× maggiore. A causa del comportamento antigravitazionale, non si ottiene alcun rimborso di materiali quando si demoliscono quelle sospese, che semplicemente si sollevano nello spazio."
ukUA = "Непроникні підлоги можна будувати без опори або прикріплювати безпосередньо до місцевості. Вони працюють як доріжки з 4× швидкістю руху. Через антигравітаційну поведінку ви не отримуєте повернення матеріалів під час знесення підлог, що висять у повітрі, — вони просто піднімаються у космос."
thTH = "แผ่นพื้นกันน้ำสามารถสร้างได้โดยไม่ต้องมีค้ำยันรองรับ หรือจะต่อเชื่อมกับพื้นดินโดยตรงก็ได้ แผ่นพื้นนี้ทำหน้าที่เป็นทางเดิน และทำให้การเคลื่อนที่เร็วขึ้น 4 เท่า เนื่องจากพฤติกรรมต้านแรงโน้มถ่วง เมื่อรื้อแผ่นพื้นที่ลอยอยู่กลางอากาศ คุณจะไม่ได้รับวัสดุคืน เพราะแผ่นพื้นจะลอยขึ้นสู่อวกาศเอง"
csCZ = "Impermabilní podlahy mohou být stavěny bez podpory nebo připojeny přímo k terénu. Fungují jako cesty s 4× rychlostí pohybu. Vzhledem k antigravitačnímu chování nedostanete žádný materiál při ničení plovoucích podlah, prostě se zvednou do vesmíru."
viVN = "Sàn không thấm có thể được xây mà không cần đỡ hoặc gắn trực tiếp vào địa hình. Chúng hoạt động như đường đi với tốc độ di chuyển gấp 4 lần. Do tính chất chống trọng lực, bạn sẽ không nhận được hoàn trả vật liệu khi phá hủy các sàn nổi, chúng chỉ tự nâng lên vào vũ trụ."
caES = "Els Terres Impermeables es poden construir sense suport o fixar-les directament al terreny. Funcionen com a camins amb una velocitat de moviment 4× superior. A causa del comportament antigravitatori, no obtens cap reemborsament de material en destruir les que estan surant, simplement s'enlairen cap a l'espai."
beBY = "Непранікальныя падлогі можна будаваць без апоры або мацаваць непасрэдна да рэльефу. Яны працуюць як сцежкі з хуткасцю перамяшчэння ў 4×. Праз антыгравітацыйнае паводзіны пры знішчэнні плавучых падлог матэрыял не вяртаецца: яны проста ўздымаюцца ў космас."
roRO = "Podelele impermeabile pot fi construite fără suport sau fixate direct pe teren. Funcționează ca cărări, cu viteză de deplasare de 4×. Din cauza comportamentului antigravitațional, nu primești nicio recuperare de materiale la distrugerea celor plutitoare, deoarece acestea se ridică singure în spațiu."
huHU = "Az átjárhatatlan padlók támasz nélkül is építhetők, vagy közvetlenül a terepre illeszthetők. Útként működnek, 4×-es mozgási sebességgel. A gravitáció-ellenes viselkedés miatt a lebegő padlók lebontásakor nem kapsz vissza anyagot, mert azok egyszerűen az űrbe emelkednek."
arSA = "عند بناء الأرضيات غير النافذة، لا يلزم وجود دعم أو يمكن تثبيتها مباشرةً على التضاريس. تعمل كمسارات بسرعة حركة تبلغ 4×. وبسبب سلوك انعدام الجاذبية، لا تحصل على أي استرداد للمواد عند تدمير الأرضيات العائمة، إذ ترتفع ذاتيًا نحو الفضاء."

["LV.HF.ImpermeableFloorUpgradeLore"]
raw = "Originally prototyped as a lightweight solar semiconductor panel, the material refused to stay put and floated into the air. HydroForma™ quickly rebranded the mishap as a cutting-edge high-speed walkway."
status = "normal"
enUS = "Originally prototyped as a lightweight solar semiconductor panel, the material refused to stay put and floated into the air. HydroForma™ quickly rebranded the mishap as a cutting-edge high-speed walkway."
zhCN = "据小道消息，该材料最初计划用于太阳能板，但随后发生严重事故，产生了无法理解的反重力性质。为了安抚广大赞助者，水力形构™公关部迅速将其包装成一种全新产品。"
zhTW = "「您的支持鋪平了道路——字面上。最終功能可能會有所變更。不予退款。是的，『贊助』是商標。」—xa0HydroForma™xa0公關部"
ruRU = "«Ваша поддержка прокладывает путь — в прямом смысле. Финальные функции могут подвергаться изменениям. Возврат средств не предусмотрен. И да, \"Sponsorship\" зарегистрированный товарный знак.» — ОтделPR HydroForma™"
jaJP = "「あなたのサポートが道を開きます — 文字通り。最終的な機能は変更される可能性があります。返金はありません。そして、はい、「スポンサーシップ」は商標登録されています。」 —xa0HydroForma™xa0広報部門"
frFR = "« Votre soutien ouvre la voie — littéralement. Les fonctionnalités finales sont susceptibles de changer. Aucun remboursement. Et oui, \"Sponsorship\" est une marque déposée. » — Département PR de HydroForma™"
deDE = "\"Ihre Unterstützung ebnet den Weg – buchstäblich. Endgültige Funktionen können Änderungen unterliegen. Keine Rückerstattungen. Und ja, 'Sponsorship' ist markenrechtlich geschützt.\" — HydroForma™ PR-Abteilung"
plPL = "'Twoje wsparcie toruje drogę — dosłownie. Ostateczne funkcje mogą ulec zmianie. Brak zwrotów. I tak, \"Sponsoring\" jest zastrzeżonym znakiem towarowym.' — Dział PR HydroForma™"
ptBR = "'Sua apoio abre o caminho — literalmente. Funcionalidades finais sujeitas a alteração. Sem reembolsos. E sim, \"Patrocínio\" é uma marca registrada.' — Departamento de PR da HydroForma™"
koKR = "원래 경량 태양열 반도체 패널로 개발되었으나, 이 재료는 제자리에 머무르기를 거부하고 공중으로 떠올랐습니다. HydroForma™는 이 사고를 빠르게 최첨단 고속 보도로 재브랜딩했습니다."
trTR = "Başlangıçta hafif bir güneş yarı iletken paneli olarak prototiplenmiş olan malzeme, yerinde kalmayı reddetti ve havaya yükseldi. HydroForma™, bu kazayı son teknoloji ürünü yüksek hızlı bir yaya yolu olarak hızla yeniden markaladı."
esES = "Originalmente prototipado como un panel solar semiconductor ligero, el material se negó a quedarse en su sitio y flotó en el aire. HydroForma™ no tardó en rebautizar el percance como una pasarela de alta velocidad de vanguardia."
itIT = "Originariamente prototipato come pannello semiconduttore solare leggero, il materiale si rifiutava di restare fermo e fluttuava in aria. HydroForma™ ha rapidamente ribattezzato l'incidente come una passerella ad alta velocità all'avanguardia."
ukUA = "Спочатку це був прототип легкої сонячної напівпровідникової панелі, але матеріал не хотів залишатися на місці й злетів у повітря. HydroForma™ швидко перейменувала цю невдачу на передову високошвидкісну пішохідну доріжку."
thTH = "เดิมทีวัสดุนี้ถูกออกแบบต้นแบบให้เป็นแผงเซมิคอนดักเตอร์พลังงานแสงอาทิตย์น้ำหนักเบา แต่วัสดุกลับไม่ยอมอยู่กับที่และลอยขึ้นไปในอากาศ HydroForma™ จึงรีแบรนด์เหตุการณ์ผิดพลาดนี้อย่างรวดเร็วให้กลายเป็นทางเดินความเร็วสูงล้ำสมัย"
csCZ = "Původně prototypováno jako lehká solární polovodičová deska, materiál se odmítal držet na místě a vznášel se do vzduchu. HydroForma™ rychle přejmenovala tuto nehodu na špičkovou vysoce rychlou chodbu."
viVN = "Ban đầu được thử nghiệm như một tấm pin mặt trời bán dẫn nhẹ, vật liệu không chịu cố định và bay lên trên không. HydroForma™ nhanh chóng biến sự cố này thành một lối đi tốc độ cao tiên tiến."
caES = "Originalment prototipat com un panell solar semiconductor lleuger, el material es negà a quedar-se quiet i s'enlairà. HydroForma™ va reanomenar ràpidament l'incident com una passarel·la d'alta velocitat d'avantguarda."
beBY = "Першапачткова створаны як лёгкая сонечная паўправадніковая панэль, матэрыял не жадаў заставацца на месцы і ўзняўся ў паветра. HydroForma™ хутка пераназвала гэты збой у перадавы хуткасны пешаходны пераход."
roRO = "Inițial prototipul unui panou solar semiconductor ușor, materialul a refuzat să rămână pe loc și a plutit în aer. HydroForma™ a redenumit rapid incidentul drept o pasarelă de mare viteză, de ultimă generație."
huHU = "Eredetileg könnyű napelemes félvezető panelnek szánták, de az anyag nem maradt a helyén, és a levegőbe emelkedett. A HydroForma™ gyorsan úgy nevezte át a balesetet, mint a legmodernebb, nagy sebességű sétányt."
arSA = "ذكرت النسخة الأولية من هذه المادة أنها لوح شمسي خفيف من أشباه الموصلات، لكنها رفضت البقاء في مكانها وطفت في الهواء. وسرعان ما أعادت شركة HydroForma™ تقديم هذا الخلل الطارئ على أنه ممر عالي السرعة من أحدث التقنيات."

