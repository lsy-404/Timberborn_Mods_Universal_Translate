["LV.BC.ToleranceDesc"]
status = "normal"
raw = "Allow births with this many extra homeless beavers.  May offset early game impacts."
enUS = "Allow births with this many extra homeless beavers. May offset early game impacts."
zhCN = "允许在无家可归的海狸多出这些数量时仍然进行繁殖。可用于抵消游戏前期的影响。"
zhTW = "允許在無家可歸的海狸多出這個數量時仍可誕生後代。這可能有助於抵銷遊戲前期的影響。"
ruRU = "Разрешать рождение детей при таком количестве дополнительных бездомных бобров. Это может компенсировать негативные последствия в начале игры."
jaJP = "ホームレスのビーバーがこの人数以上いる場合でも出産を許可します。序盤の影響を相殺できる場合があります。"
frFR = "Autoriser les naissances avec ce nombre de castors sans abri supplémentaires. Peut compenser les effets du début de partie."
deDE = "Geburten mit so vielen zusätzlichen obdachlosen Bibern zulassen. Kann die Auswirkungen in der frühen Spielphase ausgleichen."
plPL = "Zezwalaj na narodziny przy tej liczbie dodatkowych bezdomnych bobrów. Może to łagodzić skutki na wczesnym etapie gry."
ptBR = "Permitir nascimentos com este número extra de castores sem-teto. Pode compensar os impactos do início do jogo."
koKR = "노숙 비버가 이 수만큼 추가로 있어도 출생을 허용합니다. 초기 게임의 영향을 상쇄하는 데 도움이 될 수 있습니다."
trTR = "Bu sayıda evsiz kunduz varken doğumlara izin ver. Oyunun erken dönemindeki olumsuz etkileri dengeleyebilir."
esES = "Permitir nacimientos con este número de castores sin hogar adicionales. Puede compensar los efectos de las primeras etapas de la partida."
itIT = "Consenti le nascite con questo numero di castori senza casa in più. Può compensare gli effetti dei primi momenti di gioco."
ukUA = "Дозволити народження, якщо кількість бездомних бобрів не перевищує цього значення. Може компенсувати негативний вплив на початку гри."
thTH = "อนุญาตให้เกิดลูกได้เมื่อมีจำนวนบีเวอร์ไร้บ้านเพิ่มเติมเท่านี้ อาจช่วยลดผลกระทบในช่วงต้นเกม"
csCZ = "Povolit narození i s tímto počtem navíc bezdomovských bobrů. Může zmírnit dopady v rané fázi hry."
viVN = "Cho phép sinh con khi có thêm số hải ly vô gia cư này. Có thể bù đắp những tác động ở giai đoạn đầu trò chơi."
caES = "Permet naixements amb aquest nombre de castors sense llar addicionals. Pot compensar els impactes del inici de la partida."
beBY = "Дазваляць нараджэнні пры наяўнасці стольмі дадатковых бяздомных бабраў. Можа кампенсаваць негатыўны ўплыў на ранняй стадыі гульні."
roRO = "Permite nașteri și cu acest număr de castori fără adăpost în plus. Poate compensa efectele din faza timpurie a jocului."
huHU = "Engedélyezi a születéseket ennyi plusz hajléktalan hódnál is. Enyhítheti a korai játékszakasz hatásait."
arSA = "السماح بالولادات مع هذا العدد من الكائنات المشردة الإضافية. قد يساعد ذلك في تخفيف تأثيرات بداية اللعبة."

