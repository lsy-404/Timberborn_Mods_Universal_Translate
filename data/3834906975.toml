["LV.BC.AnnounceDesc"]
status = "normal"
raw = "Announce when a birth is prevented in the main message window. At most one message per district per day."
enUS = "Announce when a birth is prevented in the main message window. At most one message per district per day."
zhCN = "在主消息窗口中宣布阻止出生的事件。每个管理区每天最多一条消息。"
zhTW = "在主訊息視窗中宣布何時阻止生育。每個行政區每天最多只會顯示一則訊息。"
ruRU = "Сообщать в главном окне сообщений, когда рождение предотвращено. Не более одного сообщения на район в день."
jaJP = "メインのメッセージウィンドウで、出産が阻止されたときに通知します。通知は地区ごとに1日最大1件までです。"
frFR = "Annoncer lorsqu'une naissance est empêchée dans la fenêtre de messages principale. Au maximum un message par district et par jour."
deDE = "Melde in der Hauptnachrichtenleiste, wenn eine Geburt verhindert wird. Höchstens eine Meldung pro Distrikt und Tag."
plPL = "Ogłaszaj, gdy narodziny zostaną zapobieżone, w głównym oknie komunikatów. Najwyżej jeden komunikat na dystrykt dziennie."
ptBR = "Anunciar quando um nascimento for impedido na janela principal de mensagens. No máximo uma mensagem por distrito por dia."
koKR = "출생이 방지될 때 주요 메시지 창에 알림을 표시합니다. 구역당 하루에 최대 한 개의 메시지만 표시됩니다."
trTR = "Bir doğum engellendiğinde bu, ana mesaj penceresinde duyurulur. Her bölge için günde en fazla bir mesaj gösterilir."
esES = "Anunciar cuando se impida un nacimiento en la ventana principal de mensajes. Como máximo, un mensaje por distrito y por día."
itIT = "Annuncia quando una nascita viene impedita nella finestra dei messaggi principale. Al massimo un messaggio per distretto al giorno."
ukUA = "Повідомляти в головному вікні повідомлень, коли народження запобігається. Не більше одного повідомлення на район за день."
thTH = "แจ้งเตือนในหน้าต่างข้อความหลักเมื่อการให้กำเนิดถูกป้องกัน อย่างมากหนึ่งข้อความต่อเขตต่อวัน"
csCZ = "Oznámit, když je narození zabráněno, v hlavním okně zpráv. Nejvýše jedna zpráva za den v každém okrsku."
viVN = "Thông báo khi ngăn chặn một ca sinh trong cửa sổ thông báo chính. Tối đa một thông báo mỗi khu mỗi ngày."
caES = "Anuncia quan s'evita un naixement a la finestra principal de missatges. Com a màxim un missatge per districte al dia."
beBY = "Паведамляць, калі нараджэнне прадухілена, у асноўным акне паведамленняў. Не больш за адно паведамленне на раён за дзень."
roRO = "Anunță când o naștere este împiedicată în fereastra principală de mesaje. Cel mult un mesaj pe district pe zi."
huHU = "Értesítés megjelenítése a fő üzenetablakban, amikor egy születést megakadályoznak. Kerületenként naponta legfeljebb egy üzenet."
arSA = "الإعلان عند منع ولادة في نافذة الرسائل الرئيسية. رسالة واحدة على الأكثر لكل منطقة في اليوم."

