["LV.BC.DistrictMinimumDesc"]
status = "normal"
raw = "Never prevent births in districts with fewer beavers than this. 0 (default) means always check."
enUS = "Never prevent births in districts with fewer beavers than this. 0 (default) means always check."
zhCN = "永远不在海狸数量少于此值的区域中阻止出生。0（默认值）表示始终进行检查。"
zhTW = "永不在海狸數量少於此值的區域中阻止出生。0（預設值）表示總是進行檢查。"
ruRU = "Никогда не препятствовать рождению в районах с меньшим числом бобров, чем это значение. 0 (по умолчанию) означает, что проверка выполняется всегда."
jaJP = "地区内のビーバーがこの数より少ない場合は、出産を制限しないようにします。0（初期値）の場合は、常に確認します。"
frFR = "Ne jamais empêcher les naissances dans les districts comptant moins de castors que ce nombre. 0 (par défaut) signifie que la vérification est toujours effectuée."
deDE = "Verhindere niemals Geburten in Bezirken mit weniger Bbibern als diesem Wert. 0 (Standard) bedeutet, dass immer geprüft wird."
plPL = "Nigdy nie blokuj narodzin w dzielnicach z mniejszą liczbą bobrów niż ta wartość. 0 (domyślnie) oznacza, że zawsze sprawdzamy."
ptBR = "Nunca impedir nascimentos em distritos com menos castores que este número. 0 (padrão) significa sempre verificar."
koKR = "이 값보다 적은 수의 비버가 있는 구역에서는 출생을 막지 않습니다. 0(기본값)은 항상 확인함을 의미합니다."
trTR = "Bu sayıdan daha az kunduzu olan bölgelerde asla doğumları engelleme. 0 (varsayılan) her zaman kontrol edileceği anlamına gelir."
esES = "Nunca impidas los nacimientos en distritos con menos castores que esta cifra. 0 (predeterminado) significa que siempre se comprueba."
itIT = "Non impedire mai le nascite nei distretti con un numero di castori inferiore a questo valore. 0 (predefinito) significa controllare sempre."
ukUA = "Ніколи не блокувати народження в районах із меншою кількістю бобрів, ніж це значення. 0 (за замовчуванням) означає завжди перевіряти."
thTH = "ห้ามป้องกันการเกิดในเขตที่มีบีเวอร์น้อยกว่าจำนวนนี้เด็ดขาด 0 (ค่าเริ่มต้น) หมายความว่าจะตรวจสอบเสมอ"
csCZ = "Nikdy nebraň narozením v okresech s menším počtem bobrů, než je tato hodnota. 0 (výchozí) znamená, že se vždy kontroluje."
viVN = "Không bao giờ ngăn chặn sinh sản ở các khu vực có số lượng hải ly ít hơn mức này. 0 (mặc định) nghĩa là luôn kiểm tra."
caES = "Mai impedeixis els naixements en districtes amb menys castors que aquesta quantitat. 0 (per defecte) vol dir que sempre es comprova."
beBY = "Ніколі не перашкаджаць нараджэнням у раёнах, дзе баброў менш за гэту колькасць. 0 (па змаўчанні) азначае, што праверка выконваецца заўсёды."
roRO = "Nu împiedica niciodată nașterile în districtele cu mai puțini castori decât atât. 0 (implicit) înseamnă că verificarea se face întotdeauna."
huHU = "Soha ne akadályozza a születéseket olyan körzetekben, ahol ennél kevesebb a bébaver. 0 (alapértelmezett) esetén mindig ellenőrzi."
arSA = "لا تمنع الولادات أبدًا في المناطق التي يقل عدد سكانها من القنادس عن هذا العدد. القيمة 0 (الافتراضية) تعني التحقق دائمًا."

