["LV.BC.EnabledDesc"]
status = "normal"
raw = "When enabled, natural births are prevented in districts without free beds, accounting for homeless beavers.  No effect for Iron Teeth Breeding Pods."
enUS = "When enabled, natural births are prevented in districts without free beds, accounting for homeless beavers. No effect for Iron Teeth Breeding Pods."
zhCN = "启用后，在没有空闲床位的行政区中将阻止自然出生，并计入无家可归的海狸。对铁牙繁殖舱无效。"
zhTW = "當啟用時，若區域內沒有空閒床位，則會阻止自然出生，並將無家可歸的海狸納入考量。對鐵牙繁殖艙無效。"
ruRU = "Когда включено, естественное рождение бобров предотвращается в районах без свободных кроватей, с учётом бездомных бобров.  Не действует на инкубаторы Железных зубов."
jaJP = "有効にすると、空きベッドのない地区では自然出生が防止されます。ホームレスのビーバーも考慮されます。アイアン・ティースの繁殖ポッドには影響しません。"
frFR = "Lorsqu'elle est activée, les naissances naturelles sont empêchées dans les districts sans lits libres, en tenant compte des castors sans abri. Aucun effet pour les Cocons de reproduction des Dents de fer."
deDE = "Wenn aktiviert, werden natürliche Geburten in Bezirken ohne freie Betten verhindert, wobei obdachlose Biber mitgezählt werden.  Keine Wirkung auf Eisenzähne-Brutkapseln."
plPL = "Po włączeniu naturalne narodziny są zapobiegane w dzielnicach bez wolnych łóżek, z uwzględnieniem bezdomnych bobrów.  Brak efektu w przypadku Hodowli Żelazozębnych."
ptBR = "Quando ativado, os nascimentos naturais são impedidos em distritos sem camas livres, contabilizando os castores sem-teto. Sem efeito nas Cápsulas de Reprodução dos Dentes de Ferro."
koKR = "활성화하면, 노숙 비버를 고려하여 빈 침대가 없는 구역에서는 자연 출산이 방지됩니다. 강철 이빨 번식 포드에는 효과가 없습니다."
trTR = "Etkinleştirildiğinde, boş yatağı olmayan bölgelerde evsiz kunduzlar hesaba katılarak doğal doğumlar engellenir. Demir Dişler Üreme Kapsüllerinde herhangi bir etkisi yoktur."
esES = "Cuando está activado, se evitan los nacimientos naturales en los distritos sin camas libres, teniendo en cuenta a los castores sin hogar. No tiene efecto en las Cápsulas de Cría de Dienteférreos."
itIT = "Se attivato, le nascite naturali vengono impedite nei distretti senza letti liberi, tenendo conto dei castori senzatetto. Nessun effetto per le Capsule Riproduttive dei Denti di Ferro."
ukUA = "Коли ввімкнено, природжені народження блокуються в районах без вільних ліжок з урахуванням бездомних бобрів. Не діє на Інкубатори Залізнозубих."
thTH = "เมื่อเปิดใช้งาน การเกิดตามธรรมชาติจะถูกป้องกันในเขตที่ไม่มีเตียงว่าง โดยนับรวมบีเวอร์ที่ไร้บ้านด้วย ไม่มีผลกับ Iron Teeth Breeding Pods ของเขี้ยวเหล็ก"
csCZ = "Pokud je zapnuto, přirozené porody se zabrání v okresech bez volných lůžek, přičemž se počítají bezdomovci. Nemá žádný vliv na líhniště Iron Teeth."
viVN = "Khi được bật, việc sinh con tự nhiên sẽ bị ngăn lại ở các khu vực không còn giường trống, có tính đến những con hải ly vô gia cư. Không có tác dụng đối với Ổ sinh sản của Iron Teeth."
caES = "Quan està activat, els naixements naturals s'impedeixen als districtes sense llits lliures, tenint en compte els castors sense llar. No té cap efecte per als Iron Teeth Breeding Pods."
beBY = "Калі ўключана, натуральныя нараджэнні забараняюцца ў раёнах без вольных ложкаў, з улікам бяздомных бабраў. Не ўплывае на інкубатары Залезных Зубоў."
roRO = "Când este activat, nașterile naturale sunt împiedicate în districtele fără paturi libere, ținând cont de castorii fără adăpost. Fără efect pentru Iron Teeth Breeding Pods."
huHU = "Ha engedélyezve van, a természetes születések nem történnek meg azokon a körzetekben, ahol nincs szabad ágy, figyelembe véve a hajléktalan hódokat. Nincs hatása a Vasfogú Szaporodókapszulákra."
arSA = "عند التفعيل، يتم منع الولادات الطبيعية في المناطق التي لا تحتوي على أسرّة شاغرة، مع احتساب القنادس بلا مأوى. لا تأثير لذلك على حاضنات قطيع Iron Teeth."

