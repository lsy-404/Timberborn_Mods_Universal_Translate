["LV.NBR.MagicStructureDesc"]
raw = "Your building does not need any support at all. It can just float on the air. You may still need to build the scaffolding to be able to put the buildings, then remove them."
status = "normal"
enUS = "Your building does not need any support at all. It can just float in the air. You may still need to build the scaffolding to be able to place the buildings and then remove them."
zhCN = "勾选后，建筑不需要任何支撑结构（放置待建造建筑后，用于临时支撑的平台等建筑可以被拆除）。"
zhTW = "您的建築根本不需要任何支撐。它可以在空中漂浮。您可能仍然需要搭建腳手架，以便能夠放置建築物，然後再將其移除。"
ruRU = "Ваше здание вовсе не требует никакой поддержки. Оно может просто парить в воздухе. Вам все равно может потребоваться построить строительные леса, чтобы установить здания, а затем удалить их."
jaJP = "あなたの建物は全く支えを必要としません。空中に浮くことができます。ただし、建物を置くために足場を作り、その後取り除く必要があるかもしれません。"
frFR = "Votre bâtiment n'a pas besoin de support du tout. Il peut simplement flotter dans l'air. Vous pourriez néanmoins avoir besoin de construire un échafaudage pour pouvoir y placer les bâtiments, puis les retirer."
deDE = "Ihr Gebäude benötigt überhaupt keine Unterstützung. Es kann einfach in der Luft schweben. Sie müssen möglicherweise dennoch das Gerüst bauen, um die Gebäude zu platzieren und dann zu entfernen."
plPL = "Twój budynek nie potrzebuje żadnego wsparcia. Może po prostu unosić się w powietrzu. Może nadal musisz zbudować rusztowanie, aby móc postawić budynki, a następnie je usunąć."
ptBR = "Seu edifício não precisa de nenhum suporte. Ele pode simplesmente flutuar no ar. Você pode ainda precisar construir andaimes para poder colocar os edifícios e, em seguida, removê-los."
koKR = "당신의 건물은 전혀 지지대가 필요하지 않습니다. 공중에 떠 있을 수 있습니다. 건물을 설치하기 위해 비계를 먼저 세운 후, 이를 제거해야 할 수도 있습니다."
trTR = "Binanızın hiçbir destek ihtiyacı yok. Sadece havada yüzebilir. Binaları yerleştirebilmek için iskele inşa etmeniz gerekebilir, ardından bunları kaldırabilirsiniz."
esES = "Tu edificio no necesita ningún soporte. Puede flotar en el aire sin más. Aun así, es posible que necesites construir el andamiaje para poder colocar los edificios y luego retirarlo."
itIT = "Il tuo edificio non ha bisogno di alcun supporto. Può semplicemente galleggiare nell'aria. Potresti comunque dover costruire le impalcature per poter posizionare gli edifici, per poi rimuoverle."
ukUA = "Ваша будівля взагалі не потребує жодної опори. Вона може просто триматися в повітрі. Утім, вам може знадобитися спочатку побудувати риштування, щоб розмістити будівлі, а потім прибрати їх."
thTH = "อาคารของคุณไม่ต้องการฐานรองรับใด ๆ เลย สามารถลอยอยู่กลางอากาศได้ อย่างไรก็ตาม คุณอาจยังต้องสร้างนั่งร้านก่อนเพื่อวางอาคาร แล้วจึงรื้อนั่งร้านนั้นออกภายหลัง"
csCZ = "Vaše budova nepotřebuje žádnou podporu. Může prostě levitovat ve vzduchu. Možná budete muset postavit lešení, abyste mohli umístit budovy, a poté je odstranit."
viVN = "Công trình của bạn hoàn toàn không cần bất kỳ sự đỡ nào. Nó có thể chỉ bay lơ lửng trên không. Bạn có thể vẫn cần xây dựng dàn giáo để có thể đặt các tòa nhà, sau đó tháo chúng."
caES = "El teu edifici no necessita cap suport. Pot flotar a l'aire. Potser encara necessitaràs construir l'empostissat per poder col·locar els edificis i després l'eliminaràs."
beBY = "Ваш будынак не патрабуе ніякай апоры. Ён можа проста лунаць у паветры. Вам усё ж можа спатрэбіцца пабудаваць леса, каб размясціць будынкі, а потым прыбраць яго."
roRO = "Clădirea ta nu are nevoie de niciun fel de suport. Poate pur și simplu să plutească în aer. S-ar putea totuși să ai nevoie de schele pentru a putea amplasa clădirile, apoi le poți elimina."
huHU = "Az épületednek egyáltalán nincs szüksége alátámasztásra. Csak úgy lebeghet a levegőben. Az épületek elhelyezéséhez szükség lehet még állványzatra, amelyet utána el lehet távolítani."
arSA = "لا يحتاج مبناك إلى أي دعامة على الإطلاق، إذ يمكنه أن يطفو في الهواء ببساطة. قد تحتاج مع ذلك إلى بناء السقالات لتتمكن من وضع المباني، ثم إزالتها بعد ذلك."

