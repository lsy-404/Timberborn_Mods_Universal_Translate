[_meta]
name = "Deep Frontier"

["Building.DeepDrill.DisplayName"]
new = "Deep Drill"
status = "normal"

["Building.DeepDrill.Description"]
new = "Processes hauled raw ore using water. Requires metal blocks and treated planks. Pipes: valve set to Fill."
status = "normal"

["Building.DeepDrill.FlavorDescription"]
new = "The first machine to bore into the deep sector. It will not be the last."
status = "normal"

["Building.DeepMine.DisplayName"]
new = "Deep Mine"
status = "normal"

["Building.DeepMine.Description"]
new = "Mines deep ore without end. Build it over a Deep Ore Vein. Requires metal blocks and bricks. Pipes: valve set to Fill."
status = "normal"

["Building.DeepMine.FlavorDescription"]
new = "The vein is endless; the power bill is not."
status = "normal"

["Building.DeepProcessor.DisplayName"]
new = "Deep Ore Processor"
status = "normal"

["Building.DeepProcessor.Description"]
new = "Refines deep ore into deep iron, coal, crude oil and uranium ore. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.DeepProcessor.FlavorDescription"]
new = "The ore is useless until the surface factory learns how to tame it."
status = "normal"

["Building.DeepOreSource.DisplayName"]
new = "Deep Ore Outcrop"
status = "normal"

["Building.DeepOreSource.Description"]
new = "Scavengers collect raw ore here. Slowly recovers when empty."
status = "normal"

["Building.DeepOreSource.FlavorDescription"]
new = "It seeps back, but never fast enough."
status = "normal"

["Building.DeepOreVein.DisplayName"]
new = "Deep Ore Vein"
status = "normal"

["Building.DeepOreVein.Description"]
new = "An endless vein of deep ore. Build a Deep Mine over it."
status = "normal"

["Building.DeepOreVein.FlavorDescription"]
new = "It never runs out. Reaching it is the hard part."
status = "normal"

