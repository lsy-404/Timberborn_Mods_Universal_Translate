["Building.LaunchPad.DisplayName"]
new = "Launch pad"
status = "normal"

["Building.LaunchPad.Description"]
new = "Launches the colony's rockets. Select a mission in the recipe list: haulers stage one complete rocket (airframes, propulsion, guidance, payload and telemetry) and its liquid hydrogen and oxygen; workers then prepare it under a 27,000 hp load. Every launch consumes the whole rocket and fuel, and a launch can fail. Also produces guidance telemetry. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.LaunchPad.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.SteelMill.DisplayName"]
new = "Steel mill"
status = "normal"

["Building.SteelMill.Description"]
new = "An electric-arc melt shop and rolling mill. Makes steel from deep iron, coal and limestone flux, and alloy from steel and deep iron. Only 6 trained metallurgists can work here, and the work is extremely dangerous. Requires 3,100 hp. Its two smokestacks pollute the air nearby."
status = "normal"

["Building.SteelMill.FlavorDescription"]
new = "Every reactor, rocket and machine core starts as a white-hot pour on this floor."
status = "normal"

["Building.ArchiveExcavation.DisplayName"]
new = "Archive excavation"
status = "normal"

["Building.ArchiveExcavation.Description"]
new = "Opens human ruins anywhere with explosive charges and treated-plank shoring to recover artifacts and their sealed data drives, which Mission Control reads into guidance computers and telemetry. A Human Record Cache within 7 tiles can be surveyed for 12 extra artifacts. 4 workers, dangerous work. Requires 5,200 hp. Its stove chimney pollutes the air nearby."
status = "normal"

["Building.ArchiveExcavation.FlavorDescription"]
new = "The humans buried their warnings in the strata. Dig carefully."
status = "normal"

["Building.CryogenicTankFarm.DisplayName"]
new = "Cryogenic tank farm"
status = "normal"

["Building.CryogenicTankFarm.Description"]
new = "Stores up to 2,000 units of one cryogenic fuel, liquid hydrogen or liquid oxygen, delivered and drawn by pipes at its two front sockets or by haulers. Needs 6,500 hp to keep the fuel cold: without power the intake closes, and after 12 hours the stored fuel starts to vent. Pipes connect directly to its flat walls, without a valve."
status = "normal"

["Building.CryogenicTankFarm.FlavorDescription"]
new = "The coldest place in the colony, kept that way at great expense."
status = "normal"

["Building.SmogScrubber.DisplayName"]
new = "Smog scrubber"
status = "normal"

["Building.SmogScrubber.Description"]
new = "Removes all smog within 20 tiles while powered and not paused. No workers. Requires 2,000 hp."
status = "normal"

["Building.SmogScrubber.FlavorDescription"]
new = "What goes up the smokestack comes down in the scrubber."
status = "normal"

["Building.Bathhouse.DisplayName"]
new = "Bathhouse"
status = "normal"

["Building.Bathhouse.Description"]
new = "Steam baths for up to 12 beavers: a warm soak, a massage and a wash in one visit (Mud Bath, Massager and Wet Fur). Uses 1 water per hour, piped in at the boiler-room socket or carried by haulers, and 3,900 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.Bathhouse.FlavorDescription"]
new = "The boilers run hot so the colony can run warm."
status = "normal"

["Building.TownPlaza.DisplayName"]
new = "Town plaza"
status = "normal"

["Building.TownPlaza.Description"]
new = "A civic square for up to 15 beavers, who dance to the bandstand and gather round the fountain (Dance Pit and Campfire). Needs no power or supplies."
status = "normal"

["Building.TownPlaza.FlavorDescription"]
new = "Every frontier town needs one place where nothing is being built."
status = "normal"

["Building.ObservationDeck.DisplayName"]
new = "Observation deck"
status = "normal"

["Building.ObservationDeck.Description"]
new = "A viewing tower for up to 20 beavers on its deck: the climb up the helical stair is exercise and the view is a rooftop terrace (Exercise Plaza and Rooftop Terrace). Paths and platforms may be built on the deck."
status = "normal"

["Building.ObservationDeck.FlavorDescription"]
new = "From up here, the whole frontier fits in one look."
status = "normal"

["Building.NuclearReactor.DisplayName"]
new = "Nuclear Reactor"
status = "normal"

["Building.NuclearReactor.Description"]
new = "A 1,000,000 hp reactor that consumes enriched fuel and pipe-fed coolant water. Produces spent-fuel casks and radioactive water that must be shipped off the map. Its power output falls as its core heats. Without coolant, or with its radioactive waste or radioactive water storage full, a hot core keeps heating, running or stopped, as fast as it cools otherwise, so a reactor short of coolant or waste hauling more than half the time ends in a meltdown. Each cycle seals its spent fuel in a cask of Steel and Concrete. Fewer than 4 trained operators working or overdue maintenance (a 24-hour stop every 360 running hours, using 20 Steel and 40 Concrete) also heat it while it runs, up to 85%. At 100% it melts down: the reactor is destroyed, nearby beavers are killed or irradiated and the land and water around it stay radioactive for weeks. Pausing is a safe cold shutdown. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on. Liquids leave through a pipe valve placed against a flat wall, inlet facing the building, with its Outlet switched on."
status = "normal"

["Building.NuclearReactor.FlavorDescription"]
new = "The frontier makes power and consequences at the same scale."
status = "normal"

["Building.RadioactiveWasteVault.DisplayName"]
new = "Radioactive Waste Vault"
status = "normal"

["Building.RadioactiveWasteVault.Description"]
new = "Locked storage for radioactive waste; the contents must be processed or moved before demolition. Keep it below full: when full, 4 casks breach every 24 hours, spilling radioactive water and irradiating the soil within 3 tiles, which kills crops."
status = "normal"

["Building.RadioactiveWasteVault.FlavorDescription"]
new = "The frontier makes power and consequences at the same scale."
status = "normal"

["Building.CoalPowerPlant.DisplayName"]
new = "Coal power plant"
status = "normal"

["Building.CoalPowerPlant.Description"]
new = "A coal-fired steam plant. Produces 25,000 hp, day and night, burning 1 coal and 1 water per hour while the network draws power. No workers. Its chimney pollutes the air for a wide area while it runs. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.CoalPowerPlant.FlavorDescription"]
new = "Black smoke, white steam and the hum of every machine in the district."
status = "normal"

["Building.OilPowerPlant.DisplayName"]
new = "Oil power plant"
status = "normal"

["Building.OilPowerPlant.Description"]
new = "An oil-fired turbine plant. Produces 90,000 hp, day and night, burning 2 crude oil and 2 water per hour while the network draws power. No workers. Its two exhaust stacks pollute the air nearby while it runs, less than coal. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
