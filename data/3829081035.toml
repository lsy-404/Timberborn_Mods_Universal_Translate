["Building.FertilizerWorks.DisplayName"]
new = "Fertilizer works"
status = "normal"

["Building.FertilizerWorks.Description"]
new = "Deep Frontier fertilizer works production building. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.FertilizerWorks.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.FishHatchery.DisplayName"]
new = "Fish hatchery"
status = "normal"

["Building.FishHatchery.Description"]
new = "Breeds juvenile fish from fresh fish, algae and water. Only the front door row needs the bank; the deck stands on piles that reach the riverbed up to 6 m down, and clean water must stand at least 0.2 m up the marked pens. Stops during droughts or badwater contamination. Requires 55 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.FishHatchery.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.FisheryWorks.DisplayName"]
new = "Fishery works"
status = "normal"

["Building.FisheryWorks.Description"]
new = "Raises fresh fish from juveniles, algae and delivered water, or presses fish into oil. Its basins reflect stored water and its wheel runs during production. The wheel wing may stand out over water on piles up to 6 m deep. Requires 80 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on. Liquids leave through a pipe valve placed against a flat wall, inlet facing the building, with its Outlet switched on."
status = "normal"

["Building.FisheryWorks.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

