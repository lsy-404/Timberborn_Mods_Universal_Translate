["Building.RadioactiveWasteRefinery.DisplayName"]
new = "Radioactive waste refinery"
status = "normal"

["Building.RadioactiveWasteRefinery.Description"]
new = "Dissolves spent-fuel casks in water into radioactive water and recovered minerals, and cleans contaminated water. Requires 106,000 hp. Casks can also go straight to a Radioactive Waste Export. Haul its radioactive water to a Radioactive Water Outfall or Radioactive Waste Export: when its tanks are full, 6 radioactive water leaks every 24 hours and irradiates the soil within 3 tiles, killing crops. Pausing it seals the tanks. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on. Liquids leave through a pipe valve placed against a flat wall, inlet facing the building, with its Outlet switched on."
status = "normal"

["Building.RadioactiveWasteRefinery.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
