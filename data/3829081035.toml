["Building.FertilizerWorks.DisplayName"]
new = "Fertilizer Works"
status = "normal"

["Building.FertilizerWorks.Description"]
new = "Makes fertilizer from logs and algae for the Greenhouse. Pipes: valve set to Fill."
status = "normal"

["Building.FertilizerWorks.FlavorDescription"]
new = "Logs and algae go in. Nobody asks about the smell."
status = "normal"

["Building.FishHatchery.DisplayName"]
new = "Fish Hatchery"
status = "normal"

["Building.FishHatchery.Description"]
new = "Raises juvenile fish using algae and water. Its pens need clean river water beneath them. Pipes: valve set to Fill."
status = "normal"

["Building.FishHatchery.FlavorDescription"]
new = "Thousands of tiny fish and one very patient beaver."
status = "normal"

["Building.FisheryWorks.DisplayName"]
new = "Fishery Works"
status = "normal"

["Building.FisheryWorks.Description"]
new = "Raises juvenile fish into fresh fish, or presses fresh fish into fish oil. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.FisheryWorks.FlavorDescription"]
new = "Grow them big, then press the rest for oil."
status = "normal"

["Building.FoodPackagingWorks.DisplayName"]
new = "Food Packaging Works"
status = "normal"

["Building.FoodPackagingWorks.Description"]
new = "Cans fresh fish with fish oil in metal tins. Canned fish feeds beavers and stocks the Grocery Store. Pipes: valve set to Fill."
status = "normal"

["Building.FoodPackagingWorks.FlavorDescription"]
new = "Fish in a tin: the frontier lunch, whether it likes it or not."
status = "normal"

["Building.PublicHealthLab.DisplayName"]
new = "Public Health Lab"
status = "normal"

["Building.PublicHealthLab.Description"]
new = "Makes medicine from mushrooms and algae for the Hospital and the Technical School. Pipes: valve set to Fill."
status = "normal"

["Building.PublicHealthLab.FlavorDescription"]
new = "Mushrooms, algae and a great deal of careful stirring."
status = "normal"

["Building.GroceryStore.DisplayName"]
new = "Grocery Store"
status = "normal"

["Building.GroceryStore.Description"]
new = "A neighborhood shop for canned fish, rations and fermented food. Staffed and stocked with three or more foods, it gives nearby beavers up to +2 wellbeing."
status = "normal"

["Building.GroceryStore.FlavorDescription"]
new = "Everything a busy beaver needs, two paws from home."
status = "normal"

["Building.Restaurant.DisplayName"]
new = "Restaurant"
status = "normal"

["Building.Restaurant.Description"]
new = "Serves food at its tables and makes sweet berry cake and fermented food. A meal of fresh fish, berries, fermented mushrooms and an eggplant ration gives Fine dining. Pipes: valve set to Fill."
status = "normal"

["Building.Restaurant.FlavorDescription"]
new = "A good meal deserves a table, a view and good company."
status = "normal"

["Building.Hospital.DisplayName"]
new = "Hospital"
status = "normal"

["Building.Hospital.Description"]
new = "Treats injuries and chipped teeth; medicine treats contamination and radiation. Fully staffed, decontaminates twice as fast as a pod. Nearby beavers gain up to +2 wellbeing. Pipes: valve set to Fill."
status = "normal"

["Building.Hospital.FlavorDescription"]
new = "Rest, clean water and a very strict ward nurse."
status = "normal"

["Building.Greenhouse.DisplayName"]
new = "Greenhouse"
status = "normal"

["Building.Greenhouse.Description"]
new = "Grows eggplants, kohlrabi and coffee beans indoors with fertilizer. Aquaponics also raises fresh fish from juvenile fish. Pipes: valve set to Fill."
status = "normal"

["Building.Greenhouse.FlavorDescription"]
new = "Summer all year round, under glass."
status = "normal"

["Building.ChemicalWorks.DisplayName"]
new = "Chemical Works"
status = "normal"

["Building.ChemicalWorks.Description"]
new = "Makes chemicals and polymer from crude oil and extract, and cryocoolant from polymer and grease. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.ChemicalWorks.FlavorDescription"]
new = "Oil and extract go in, chemistry comes out, and the smell stays."
status = "normal"

["Building.PrecisionMachineWorks.DisplayName"]
new = "Precision Machine Works"
status = "normal"

["Building.PrecisionMachineWorks.Description"]
new = "Builds machine cores, electronics, power modules, bot parts and reinforced bot frames. Pipes: valve set to Fill."
status = "normal"

["Building.PrecisionMachineWorks.FlavorDescription"]
new = "Measure twice, file once, and never sneeze near the electronics."
status = "normal"

["Building.WaterTreatmentPlant.DisplayName"]
new = "Water Treatment Plant"
status = "normal"

["Building.WaterTreatmentPlant.Description"]
new = "Filters water into pure water, leaving concentrated waste, and makes filter media and reactor coolant water. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.WaterTreatmentPlant.FlavorDescription"]
new = "Every barrel tested, every filter changed on time."
status = "normal"

["Building.TechnicalSchool.DisplayName"]
new = "Technical School"
status = "normal"

["Building.TechnicalSchool.Description"]
new = "Beavers study here in their free time to become metallurgists, reactor operators or flight engineers. Each school teaches one, chosen in its panel."
status = "normal"

["Building.TechnicalSchool.FlavorDescription"]
new = "Night classes for beavers who want a dangerous job done properly."
status = "normal"

["Building.UraniumProcessingPlant.DisplayName"]
new = "Uranium Processing Plant"
status = "normal"

["Building.UraniumProcessingPlant.Description"]
new = "Makes yellowcake from uranium ore or recovered radioactive water, enriches fuel and makes reactor power cells. Enrichment leaves radioactive waste. Pipes: valve set to Fill."
status = "normal"

["Building.UraniumProcessingPlant.FlavorDescription"]
new = "Yellowcake is not for eating, however much it looks like it."
status = "normal"

["Building.RadioactiveWasteRefinery.DisplayName"]
new = "Radioactive Waste Refinery"
status = "normal"

["Building.RadioactiveWasteRefinery.Description"]
new = "Turns radioactive waste into radioactive water, cleans contaminated water and filters badwater. Haul its output away: full tanks leak. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.RadioactiveWasteRefinery.FlavorDescription"]
new = "It turns a problem you store into a problem you can ship."
status = "normal"

["Building.ElectrolysisPlant.DisplayName"]
new = "Electrolysis Plant"
status = "normal"

["Building.ElectrolysisPlant.Description"]
new = "Splits pure water into hydrogen gas and oxygen gas. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.ElectrolysisPlant.FlavorDescription"]
new = "Water goes in. Two very excitable gases come out."
status = "normal"

["Building.CryogenicLiquefactionPlant.DisplayName"]
new = "Cryogenic Liquefaction Plant"
status = "normal"

["Building.CryogenicLiquefactionPlant.Description"]
new = "Chills hydrogen and oxygen gas with cryocoolant into liquid hydrogen and liquid oxygen, the rocket fuel. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.CryogenicLiquefactionPlant.FlavorDescription"]
new = "So cold that the frost has frost."
status = "normal"

["Building.RocketAssemblyHangar.DisplayName"]
new = "Rocket Assembly Hangar"
status = "normal"

["Building.RocketAssemblyHangar.Description"]
new = "Builds rocket airframes and propulsion packages for the Launch Pad."
status = "normal"

["Building.RocketAssemblyHangar.FlavorDescription"]
new = "The tallest thing the colony has ever built, one piece at a time."
status = "normal"

["Building.MissionControl.DisplayName"]
new = "Mission Control"
status = "normal"

["Building.MissionControl.Description"]
new = "Turns recovered artifacts into guidance computers, mission payloads and telemetry. Staffed and powered, it lowers the launch risk. Pipes: valve set to Fill."
status = "normal"

["Building.MissionControl.FlavorDescription"]
new = "Old human drives, new beaver math and a lot of coffee."
status = "normal"

["Building.LaunchPad.DisplayName"]
new = "Launch Pad"
status = "normal"

["Building.LaunchPad.Description"]
new = "Launches the colony's rockets, staffed by trained flight engineers. Pick a mission as its recipe; each launch uses up the rocket and its fuel, and can fail. Pipes: valve set to Fill."
status = "normal"

["Building.LaunchPad.FlavorDescription"]
new = "Everything the colony has learned, pointed at the sky."
status = "normal"

["Building.SteelMill.DisplayName"]
new = "Steel Mill"
status = "normal"

["Building.SteelMill.Description"]
new = "Makes steel and alloy from deep iron, coal and limestone. Only trained metallurgists can work here, and the work is dangerous."
status = "normal"

["Building.SteelMill.FlavorDescription"]
new = "Every reactor, rocket and machine core starts as a white-hot pour on this floor."
status = "normal"

["Building.ArchiveExcavation.DisplayName"]
new = "Archive Excavation"
status = "normal"

["Building.ArchiveExcavation.Description"]
new = "Digs up recovered artifacts anywhere with explosives. Within 10 tiles of a Human Record Cache, it also surveys the cache for 12 more."
status = "normal"

["Building.ArchiveExcavation.FlavorDescription"]
new = "The humans buried their warnings in the strata. Dig carefully."
status = "normal"

["Building.CryogenicTankFarm.DisplayName"]
new = "Cryogenic Tank Farm"
status = "normal"

["Building.CryogenicTankFarm.Description"]
new = "Stores one fuel: liquid hydrogen or liquid oxygen. It takes fuel only while powered; without power the fuel starts to vent. Pipes: connect directly, no valve."
status = "normal"

["Building.CryogenicTankFarm.FlavorDescription"]
new = "The coldest place in the colony, kept that way at great expense."
status = "normal"

["Building.FisherFlag.DisplayName"]
new = "Fisher Flag"
status = "normal"

["Building.FisherFlag.Description"]
new = "Employs a fisher who catches fresh fish from the shore, where clean water at least 0.5 m deep lies no more than 1.25 m below the bank."
status = "normal"

["Building.FisherFlag.FlavorDescription"]
new = "A quiet bank, a long wait and a longer story about the one that got away."
status = "normal"

["Building.ModularWarehouse.DisplayName"]
new = "Modular Warehouse"
status = "normal"

["Building.ModularWarehouse.Description"]
new = "Stores 5 different goods with separate warehouse settings. Attached Warehouse Modules increase the shared storage capacity."
status = "normal"

["Building.ModularWarehouse.FlavorDescription"]
new = "One door, one ledger and a beaver who knows where everything is."
status = "normal"

["Building.WarehouseModule.DisplayName"]
new = "Warehouse Module"
status = "normal"

["Building.WarehouseModule.Description"]
new = "Adds storage to a Modular Warehouse when built beside it, on top of it, or on another attached module."
status = "normal"

["Building.WarehouseModule.FlavorDescription"]
new = "Another floor of crates, and the ledger grows a page."
status = "normal"

["DeepFrontier.ModularWarehouse.Network"]
new = "Modules: {0}. Capacity: {1}"
status = "normal"

["DeepFrontier.ModularWarehouse.ModuleUnattached"]
new = "Not attached to a Modular Warehouse"
status = "normal"

["Building.SmogScrubber.DisplayName"]
new = "Smog Scrubber"
status = "normal"

["Building.SmogScrubber.Description"]
new = "Cleans smog out of the air around it while powered. No workers."
status = "normal"

["Building.SmogScrubber.FlavorDescription"]
new = "What goes up the smokestack comes down in the scrubber."
status = "normal"

["Building.Bathhouse.DisplayName"]
new = "Bathhouse"
status = "normal"

["Building.Bathhouse.Description"]
new = "Steam baths that count as a Mud Bath and a Massager and give Wet fur, all in one visit. Uses water. Pipes: valve set to Fill."
status = "normal"

["Building.Bathhouse.FlavorDescription"]
new = "The boilers run hot so the colony can run warm."
status = "normal"

["Building.TownPlaza.DisplayName"]
new = "Town Plaza"
status = "normal"

["Building.TownPlaza.Description"]
new = "A square where beavers dance and gather: it counts as a Dance Pit and a Campfire. Needs no power or supplies."
status = "normal"

["Building.TownPlaza.FlavorDescription"]
new = "Every frontier town needs one place where nothing is being built."
status = "normal"

["Building.ObservationDeck.DisplayName"]
new = "Observation Deck"
status = "normal"

["Building.ObservationDeck.Description"]
new = "A viewing tower: the climb counts as an Exercise Plaza and the deck as a Rooftop Terrace."
status = "normal"

["Building.ObservationDeck.FlavorDescription"]
new = "From up here, the whole frontier fits in one look."
status = "normal"

["Building.NuclearReactor.DisplayName"]
new = "Nuclear Reactor"
status = "normal"

["Building.NuclearReactor.Description"]
new = "Huge power from enriched fuel, run by trained reactor operators. It melts down if its coolant water runs out or its waste is not hauled away; pausing it is safe. Pipes: valves set to Fill and Extract."
status = "normal"

["Building.NuclearReactor.FlavorDescription"]
new = "The frontier makes power and consequences at the same scale."
status = "normal"

["Building.RadioactiveWasteVault.DisplayName"]
new = "Radioactive Waste Vault"
status = "normal"

["Building.RadioactiveWasteVault.Description"]
new = "Shielded storage for radioactive waste or radioactive water. Select one good. A vault full of waste casks leaks radioactive water into the ground."
status = "normal"

["Building.RadioactiveWasteVault.FlavorDescription"]
new = "Labeled, logged and never, ever full."
status = "normal"

["Building.CoalPowerPlant.DisplayName"]
new = "Coal Power Plant"
status = "normal"

["Building.CoalPowerPlant.Description"]
new = "Burns coal and water for power day and night. No workers. Pipes: valve set to Fill."
status = "normal"

["Building.CoalPowerPlant.FlavorDescription"]
new = "Black smoke, white steam and the hum of every machine in the district."
status = "normal"

["Building.OilPowerPlant.DisplayName"]
new = "Oil Power Plant"
status = "normal"

["Building.OilPowerPlant.Description"]
new = "Burns crude oil and water for power day and night, with less smog than coal. No workers. Pipes: valve set to Fill."
status = "normal"

["Building.OilPowerPlant.FlavorDescription"]
new = "The deep ore gives up its oil, and the oil gives up its fire."
status = "normal"

["Recipe.CarbonFilterMedia.DisplayName"]
new = "Filter media from coal"
status = "normal"

["Recipe.BrineChemical.DisplayName"]
new = "Chemicals from concentrated waste"
status = "normal"

["Recipe.GreenhouseAquaponics.DisplayName"]
new = "Kohlrabi and fresh fish"
status = "normal"

["Recipe.FuelReprocessing.DisplayName"]
new = "Enriched fuel from radioactive waste"
status = "normal"

["Recipe.RecoveredYellowcake.DisplayName"]
new = "Yellowcake from radioactive water"
status = "normal"

["Recipe.ContaminatedWaterRefining.DisplayName"]
new = "Radioactive water from contaminated water"
status = "normal"

["Recipe.DecontaminateWater.DisplayName"]
new = "Water from contaminated water"
status = "normal"

["Recipe.BadwaterFiltering.DisplayName"]
new = "Water from badwater"
status = "normal"

["Need.PublicHealthcare.DisplayName"]
new = "Public healthcare"
status = "normal"

