["Building.FertilizerWorks.DisplayName"]
new = "Fertilizer works"
status = "normal"

["Building.FertilizerWorks.Description"]
new = "Deep Frontier fertilizer works production building. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.FertilizerWorks.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.FishHatchery.DisplayName"]
new = "Fish hatchery"
status = "normal"

["Building.FishHatchery.Description"]
new = "Breeds juvenile fish from fresh fish, algae and water. Only the front door row needs the bank; the deck stands on piles that reach the riverbed up to 6 m down, and clean water must stand at least 0.2 m up the marked pens. Stops during droughts or badwater contamination. Requires 55 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.FishHatchery.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.FisheryWorks.DisplayName"]
new = "Fishery works"
status = "normal"

["Building.FisheryWorks.Description"]
new = "Raises fresh fish from juveniles, algae and delivered water, or presses fish into oil. Its basins reflect stored water and its wheel runs during production. The wheel wing may stand out over water on piles up to 6 m deep. Requires 80 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on. Liquids leave through a pipe valve placed against a flat wall, inlet facing the building, with its Outlet switched on."
status = "normal"

["Building.FisheryWorks.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.FoodPackagingWorks.DisplayName"]
new = "Food packaging works"
status = "normal"

["Building.FoodPackagingWorks.Description"]
new = "Deep Frontier food packaging works production building. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.FoodPackagingWorks.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.PublicHealthLab.DisplayName"]
new = "Public health lab"
status = "normal"

["Building.PublicHealthLab.Description"]
new = "Deep Frontier public health lab production building. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.PublicHealthLab.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.GroceryStore.DisplayName"]
new = "Grocery store"
status = "normal"

["Building.GroceryStore.Description"]
new = "Stocks canned fish, packaged food, algae and corn rations, and fermented cassava and soybeans. Two clerks restock 100 of each food. With 100 hp, an attending clerk and at least three stocked foods, nearby beavers gain up to +2 wellbeing within eight cells. Food remains available during power cuts and off-duty hours."
status = "normal"

["Building.GroceryStore.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.Restaurant.DisplayName"]
new = "Restaurant"
status = "normal"

["Building.Restaurant.Description"]
new = "A 400 hp kitchen and dining hall. Workers serve fish, berries and prepared foods at tables, with coffee when stocked and water for thirsty diners. Ferments food and bakes sweet berry cake from berries, corn and water. Cake is cooked and eaten only here. Serves whichever main foods are in stock; a full meal of fish, berries, fermented mushrooms and eggplant rations also gives Fine Dining. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.Restaurant.FlavorDescription"]
new = "A good meal deserves a table, a view and good company."
status = "normal"

["Building.Hospital.DisplayName"]
new = "Hospital"
status = "normal"

["Building.Hospital.Description"]
new = "Houses 30 patients, who stay admitted until cured and are fed and watered from its own stock. An assigned crew of six and 600 hp treat injury 80% faster than a medical bed, plus chipped teeth, badwater contamination and 10-day radiation decontamination, day and night. Uses medicine, water and extract while treating or attended. Attending, supplied staff grant neighborhood care up to +2 wellbeing within ten cells. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.Hospital.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

