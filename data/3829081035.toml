["Building.LaunchPad.DisplayName"]
new = "Launch pad"
status = "normal"

["Building.LaunchPad.Description"]
new = "Launches the colony's rockets. Select a mission in the recipe list: haulers stage one complete rocket (airframes, propulsion, guidance, payload and telemetry) and its liquid hydrogen and oxygen; workers then prepare it under a 25000 hp load. Every launch consumes the whole rocket and fuel, and a launch can fail. Also produces guidance telemetry. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.LaunchPad.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
status = "normal"

["Building.SteelMill.DisplayName"]
new = "Steel mill"
status = "normal"

["Building.SteelMill.Description"]
new = "An electric-arc melt shop and rolling mill. Makes flux from scrap metal and deep ore, high-grade steel from metal blocks, coal and flux, and alloy from high-grade steel and deep alloy. Only 6 trained metallurgists can work here, and the work is extremely dangerous. Requires 2,500 hp. Its two smokestacks pollute the air nearby."
status = "normal"

["Building.SteelMill.FlavorDescription"]
new = "Every reactor, rocket and machine core starts as a white-hot pour on this floor."
status = "normal"

["Building.ArchiveExcavation.DisplayName"]
new = "Archive excavation"
status = "normal"

["Building.ArchiveExcavation.Description"]
new = "Opens human ruins anywhere with explosive charges and treated-plank shoring to recover artifacts, then restores their data drives into archive data with grease and metal parts. A Human Record Cache within 4 tiles can be surveyed for extra archive data. 4 workers, dangerous work. Requires 400 hp. Its stove chimney pollutes the air nearby. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.ArchiveExcavation.FlavorDescription"]
new = "The humans buried their warnings in the strata. Dig carefully."
status = "normal"

["Building.CryogenicTankFarm.DisplayName"]
new = "Cryogenic tank farm"
status = "normal"

["Building.CryogenicTankFarm.Description"]
new = "Stores up to 2,000 units of one cryogenic fuel, liquid hydrogen or liquid oxygen, delivered and drawn by pipes at its two front sockets or by haulers. Needs 1,000 hp to keep the fuel cold: without power the intake closes, and after 12 hours the stored fuel starts to vent. Pipes connect directly to its flat walls, without a valve."
status = "normal"

["Building.CryogenicTankFarm.FlavorDescription"]
new = "The coldest place in the colony, kept that way at great expense."
status = "normal"

["Building.SmogScrubber.DisplayName"]
new = "Smog scrubber"
status = "normal"

["Building.SmogScrubber.Description"]
new = "Removes 75% of the smog within 7 tiles while powered and not paused; scrubbers and trees together remove at most 90%. No workers. Requires 200 hp."
status = "normal"

["Building.SmogScrubber.FlavorDescription"]
new = "What goes up the smokestack comes down in the scrubber."
status = "normal"

["Building.Bathhouse.DisplayName"]
new = "Bathhouse"
status = "normal"

["Building.Bathhouse.Description"]
new = "Steam baths for up to 12 beavers: a warm soak, a massage and a wash in one visit (Mud Bath, Massager and Wet Fur). Uses 1 water per hour, piped in at the boiler-room socket or carried by haulers, and 300 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.Bathhouse.FlavorDescription"]
new = "The boilers run hot so the colony can run warm."
status = "normal"

["Building.TownPlaza.DisplayName"]
new = "Town plaza"
status = "normal"

["Building.TownPlaza.Description"]
new = "A civic square for up to 15 beavers, who dance to the bandstand and gather round the fountain (Dance Pit and Campfire). Needs no power or supplies."
status = "normal"

["Building.TownPlaza.FlavorDescription"]
new = "Every frontier town needs one place where nothing is being built."
status = "normal"

["Building.ObservationDeck.DisplayName"]
new = "Observation deck"
status = "normal"

["Building.ObservationDeck.Description"]
new = "A viewing tower for up to 20 beavers on its deck: the climb up the helical stair is exercise and the view is a rooftop terrace (Exercise Plaza and Rooftop Terrace). Paths and platforms may be built on the deck."
status = "normal"

["Building.ObservationDeck.FlavorDescription"]
new = "From up here, the whole frontier fits in one look."
status = "normal"

["Building.NuclearReactor.DisplayName"]
new = "Nuclear Reactor"
status = "normal"

["Building.NuclearReactor.Description"]
new = "A 750000 hp reactor that consumes enriched fuel and pipe-fed coolant water. Produces spent-fuel casks and radioactive sludge that must be shipped off the map. Its core overheats when coolant runs dry, fewer than 4 trained operators are working or maintenance is overdue (a 24-hour stop every 360 running hours). At 85% heat it trips an emergency shutdown; without coolant the core keeps heating for 72 hours after it stops, and at 100% it melts down: the reactor is destroyed, nearby beavers are killed or irradiated and the land and water around it stay radioactive for weeks. Pausing is a safe cold shutdown. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on. Liquids leave through a pipe valve placed against a flat wall, inlet facing the building, with its Outlet switched on."
status = "normal"

["Building.NuclearReactor.FlavorDescription"]
new = "The frontier makes power and consequences at the same scale."
status = "normal"

["Building.RadioactiveWasteVault.DisplayName"]
new = "Radioactive Waste Vault"
status = "normal"

["Building.RadioactiveWasteVault.Description"]
new = "Locked storage for radioactive waste; the contents must be processed or moved before demolition. Keep it below full: when full, 4 casks breach every 24 hours, spilling radioactive sludge and irradiating the soil within 3 tiles, which kills crops."
status = "normal"

["Building.RadioactiveWasteVault.FlavorDescription"]
new = "The frontier makes power and consequences at the same scale."
status = "normal"

["Building.CoalPowerPlant.DisplayName"]
new = "Coal power plant"
status = "normal"

["Building.CoalPowerPlant.Description"]
