["Building.RadioactiveWasteRefinery.DisplayName"]
new = "Radioactive waste refinery"
status = "normal"

["Building.RadioactiveWasteRefinery.Description"]
new = "Refines spent-fuel casks into radioactive sludge and recovered minerals, and cleans contaminated water. Requires 8000 hp. Haul its sludge to a Sludge Outfall or Radioactive Waste Export: when its sludge tanks are full, 6 sludge leaks every 24 hours and irradiates the soil within 3 tiles, killing crops. Pausing it seals the tanks. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on. Liquids leave through a pipe valve placed against a flat wall, inlet facing the building, with its Outlet switched on."
status = "normal"

["Building.RadioactiveWasteRefinery.FlavorDescription"]
new = "The colony's next industrial step is visible in every pipe and belt."
