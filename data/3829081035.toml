[_meta]
name = "Deep Frontier"

["Building.DeepDrill.DisplayName"]
new = "Deep Drill"
status = "normal"

["Building.DeepDrill.Description"]
new = "Extracts one unit of Deep Ore from an authored source stockpile using water and 1000 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.DeepDrill.FlavorDescription"]
new = "The first boring machine turns a finite deposit into a surface supply chain."
status = "normal"

["Building.DeepMine.DisplayName"]
new = "Deep Mine"
status = "normal"

["Building.DeepMine.Description"]
new = "Extracts four Deep Ore every cycle from a marked vein using water and 4000 hp. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on."
status = "normal"

["Building.DeepMine.FlavorDescription"]
new = "The vein is endless; the power bill is not."
status = "normal"

["Building.DeepProcessor.DisplayName"]
new = "Deep Ore Processor"
status = "normal"

["Building.DeepProcessor.Description"]
new = "Refines deep ore into a dense industrial alloy. Liquids enter through a pipe valve placed against a flat wall, outlet facing the building, with its Inlet switched on. Liquids leave through a pipe valve placed against a flat wall, inlet facing the building, with its Outlet switched on."
status = "normal"

["Building.DeepProcessor.FlavorDescription"]
new = "The ore is useless until the surface factory learns how to tame it."
status = "normal"

["Building.DeepOreSource.DisplayName"]
new = "Deep Ore Source"
status = "normal"

["Building.DeepOreSource.Description"]
new = "Map editor stockpile for a finite authored Deep Ore deposit."
status = "normal"

["Building.DeepOreSource.FlavorDescription"]
new = "Fill this marker with Deep Ore while authoring the map; the drill consumes that deposit."
status = "normal"

["Building.DeepOreVein.DisplayName"]
new = "Deep Ore Vein"
status = "normal"

["Building.DeepOreVein.Description"]
