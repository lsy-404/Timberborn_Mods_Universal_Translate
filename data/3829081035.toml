["Narrative.Stage.NotNatural.Title"]
new = "Something in the Water"
status = "normal"

["Narrative.Stage.NotNatural.Objective"]
new = "Study the badwater: finish a Public Health Lab, a Water Treatment Plant, a Deep Drill or a Chemical Works."
status = "normal"

["Narrative.Stage.NotNatural.Hint"]
new = "Public Health Lab (Wellbeing, 1,000 science), Deep Drill (Metal, 1,000), Water Treatment Plant (Water, 1,800) or Chemical Works (Metal, 4,000). Any one will do."
status = "normal"

["Narrative.Stage.NotNatural.Story.1"]
new = "Every beaver knows badwater: green, sour, and best admired from a distance. The old stories call it a sickness of the land."
status = "normal"

["Narrative.Stage.NotNatural.Story.2"]
new = "The colony is no longer sure the old stories are right. Badwater behaves the same everywhere, in every spring and every badtide, as if it were made to a recipe. Somebody, it seems, wrote that recipe down."
status = "normal"

["Narrative.Stage.NotNatural.Requirement.1"]
new = "Investigation building finished"
status = "normal"

["Narrative.Stage.NotNatural.Variant.PublicHealthLab"]
new = "The health lab's first badwater samples were meant to help the sick. The chemists came back with puzzled faces and a very long list of things that should not be in a river."
status = "normal"

["Narrative.Stage.NotNatural.Variant.WaterTreatmentPlant"]
new = "The treatment plant's first filter cakes came out of the press the wrong colour. The exact same wrong colour, every single time."
status = "normal"

["Narrative.Stage.NotNatural.Variant.DeepDrill"]
new = "The drill crew brought up a core with something round and hollow inside it: a pipe, far older than the colony and far too big for beavers."
status = "normal"

["Narrative.Stage.NotNatural.Variant.ChemicalWorks"]
new = "The chemists who turn badwater into feedstock noticed that it splits the same way, batch after batch, like a recipe someone followed carefully."
status = "normal"

["Narrative.Stage.UnderTheValley.Title"]
new = "Under the Valley"
status = "normal"

["Narrative.Stage.UnderTheValley.Objective"]
new = "Reach the deep sector: refine 20 deep alloy at a Deep Processor."
status = "normal"

["Narrative.Stage.UnderTheValley.Hint"]
new = "The Deep Drill brings up deep ore from a deep ore source; the Deep Processor turns ore and water into deep alloy, coal, crude oil and uranium ore."
status = "normal"

["Narrative.Stage.UnderTheValley.Story.1"]
new = "The deep sector is not empty. Below the old riverbed run tunnels lined with enormous pipes, all of them stamped with the same three letters, VWA, and all of them heading upriver."
status = "normal"

["Narrative.Stage.UnderTheValley.Story.2"]
new = "Painted on one pipe, with increasing underlining: NOT FOR DRINKING. Someone long ago took that very seriously."
status = "normal"

["Narrative.Stage.UnderTheValley.Requirement.1"]
new = "Deep alloy refined"
status = "normal"

["Narrative.Stage.WhatTheWaterCarries.Title"]
new = "What the Water Carries"
status = "normal"

["Narrative.Stage.WhatTheWaterCarries.Objective"]
new = "Trace what the water carries: purify 80 pure water and make 10 chemical from badwater."
status = "normal"

["Narrative.Stage.WhatTheWaterCarries.Hint"]
new = "Water Treatment Plants make pure water from water and filter media. Chemical Works make chemical from badwater and extract."
status = "normal"

["Narrative.Stage.WhatTheWaterCarries.Story.1"]
new = "Side by side, the filter residue and the chemical feedstock tell the same story. Badwater is a mixture: fine grit from deep rock, a stubborn green dye and a dozen compounds nothing in nature bothers to make."
status = "normal"

["Narrative.Stage.WhatTheWaterCarries.Story.2"]
new = "It is not a disease. It is runoff. Somewhere upriver, something is still leaking what the old deep pipes once carried, and the colony is going to find out what."
status = "normal"

["Narrative.Stage.WhatTheWaterCarries.Requirement.1"]
new = "Pure water purified"
status = "normal"

["Narrative.Stage.WhatTheWaterCarries.Requirement.2"]
new = "Chemical made from badwater"
status = "normal"

["Narrative.Stage.OpenTheRuins.Title"]
new = "Open the Ruins"
status = "normal"

["Narrative.Stage.OpenTheRuins.Objective"]
new = "Open the human ruins: recover 6 artifacts at an Archive Excavation."
status = "normal"

["Narrative.Stage.OpenTheRuins.Hint"]
new = "The Archive Excavation (Science menu, 9,000 science) opens human ruins with explosives and treated planks. Any Human Record Cache on the map can be surveyed by a nearby excavation for extra archive data."
status = "normal"

["Narrative.Stage.OpenTheRuins.Story.1"]
new = "The first finds are small and baffling: a hard hat big enough to bathe a kit in, a mug reading WORLD'S OKAYEST ENGINEER, and a sign that says HOLDING STATION 3 - AUTHORIZED PERSONNEL ONLY."
status = "normal"

["Narrative.Stage.OpenTheRuins.Story.2"]
new = "Underneath, in smaller letters: UNAUTHORIZED PERSONNEL ALSO ONLY. The humans, it turns out, had a sense of humour. They also had sealed data drives, which the excavation crews are now carefully drying out."
status = "normal"

["Narrative.Stage.OpenTheRuins.Requirement.1"]
new = "Artifacts recovered"
status = "normal"

["Narrative.Stage.TheArchiveWakes.Title"]
new = "The Archive Wakes"
status = "normal"

["Narrative.Stage.TheArchiveWakes.Objective"]
new = "Wake the archive: restore 10 archive data."
status = "normal"

["Narrative.Stage.TheArchiveWakes.Hint"]
new = "Archive data comes from 2 recovered artifacts, grease and a metal part at the Archive Excavation."
status = "normal"

["Narrative.Stage.TheArchiveWakes.Story.1"]
new = "The first restored drive belongs to the Valley Water Authority. Its records describe the Deepworks, the humans' great wells and drills, which pulled ancient water and ore up from under this valley for their factories."
status = "normal"

["Narrative.Stage.TheArchiveWakes.Story.2"]
new = "What the factories could not use went upriver into the Holding: a chain of sealed basins kept clean by a treatment works that ran day and night. Projected containment life: indefinite, subject to maintenance."
status = "normal"

["Narrative.Stage.TheArchiveWakes.Story.3"]
new = "A memo is attached. Re: containment maintenance. Postponed to next quarter. Previous note: postponed to next quarter."
status = "normal"

["Narrative.Stage.TheArchiveWakes.Requirement.1"]
new = "Archive data restored"
status = "normal"

["Narrative.Stage.TheLastShift.Title"]
new = "The Last Shift"
status = "normal"

["Narrative.Stage.TheLastShift.Objective"]
new = "Read the last shift's records: restore 30 archive data in total and finish a Mission Control."
status = "normal"

["Narrative.Stage.TheLastShift.Hint"]
new = "Mission Control unlocks at 14,000 science. Guidance computers and telemetry also need archive data, so keep the drives coming."
status = "normal"

["Narrative.Stage.TheLastShift.Story.1"]
new = "The newest drives are the saddest and the tidiest. The rains failed, then the wells, then the harvests. The humans decided to leave the valley for now and follow the rain north. Nobody wrote down when now would end."
status = "normal"

["Narrative.Stage.TheLastShift.Story.2"]
new = "The last shift did its best. It set the treatment works to automatic, put the Holding's flush valves on a schedule to run until further notice, and switched off the lights. No further notice was ever given."
status = "normal"

["Narrative.Stage.TheLastShift.Story.3"]
new = "Mission Control has found one more thing: an old orbital frequency. Something up there is still answering."
status = "normal"

["Narrative.Stage.TheLastShift.Requirement.1"]
new = "Archive data restored"
status = "normal"

["Narrative.Stage.TheLastShift.Requirement.2"]
new = "Mission Control finished"
status = "normal"

["Narrative.Stage.EyesAbove.Title"]
new = "Eyes Above"
status = "normal"

["Narrative.Stage.EyesAbove.Objective"]
new = "Launch the Orbital Observatory from a Launch Pad."
status = "normal"

["Narrative.Stage.EyesAbove.Hint"]
new = "A launch needs airframes, propulsion, guidance computers, telemetry and liquid hydrogen and oxygen. A staffed Mission Control lowers the risk. Nuclear power helps but is not required."
status = "normal"

["Narrative.Stage.EyesAbove.Story.1"]
new = "Laid over the Authority's maps, the orbital images settle the question. Every badwater spring in the valley sits on the line of an old pipe, and every pipe leads back to the Holding."
status = "normal"

["Narrative.Stage.EyesAbove.Story.2"]
new = "The badtides line up too: they arrive on the same schedule the last shift set for the flush valves. The humans never turned the Holding off. There was simply nobody left to give further notice."
status = "normal"

["Narrative.Stage.EyesAbove.Requirement.1"]
new = "Orbital Observatory mission"
status = "normal"

["Narrative.Stage.WhatTheStationKept.Title"]
new = "What the Station Kept"
status = "normal"

["Narrative.Stage.WhatTheStationKept.Objective"]
new = "Launch the Recovery Probe."
status = "normal"

["Narrative.Stage.WhatTheStationKept.Hint"]
new = "The Recovery Probe carries mission payloads: guidance computers packed with recovered artifacts."
status = "normal"

["Narrative.Stage.WhatTheStationKept.Story.1"]
new = "The station's data core holds the treatment works' full design and a final log from its crew: Turned the lights off. Left the telescope on. Someone should keep looking. Heading home, wherever that turns out to be."
status = "normal"

["Narrative.Stage.WhatTheStationKept.Story.2"]
new = "The design looks familiar. The colony's own water treatment plants already do, in beaver size, what the humans' works did before the filters ran out. The Holding still leaks, but it can be kept, as long as someone stays to keep it."
status = "normal"

["Narrative.Stage.WhatTheStationKept.Story.3"]
new = "Only one launch remains, and the colony must decide what that last rocket will say."
status = "normal"

["Narrative.Stage.WhatTheStationKept.Requirement.1"]
new = "Recovery Probe mission"
status = "normal"

["Narrative.Stage.TheMessage.Title"]
new = "What the Beacon Says"
status = "normal"

["Narrative.Stage.TheMessage.Objective"]
new = "Decide what the Long-Range Beacon will carry. Choose in this journal."
status = "normal"

["Narrative.Stage.TheMessage.Hint"]
new = "The choice changes the ending's story, not the rocket or its launch."
status = "normal"

["Narrative.Stage.TheMessage.Story.1"]
new = "After three evenings of debate, two votes and one very long speech about punctuation, the colony agreed on what the beacon will carry."
status = "normal"

["Narrative.Stage.TheMessage.Requirement.1"]
new = "Beacon message chosen"
status = "normal"

["Narrative.Stage.TheBeacon.Title"]
new = "The Long-Range Beacon"
status = "normal"

["Narrative.Stage.TheBeacon.Objective"]
new = "Launch the Long-Range Beacon."
status = "normal"

["Narrative.Stage.TheBeacon.Hint"]
new = "The beacon is the final launch. Its success completes the colony's story."
status = "normal"

["Narrative.Stage.TheBeacon.Story.1"]
new = "The Long-Range Beacon is aloft. Far upriver the Holding still seeps, but the colony's treatment works now do what the last shift could not: they keep running, and somebody changes the filters."
status = "normal"

["Narrative.Stage.TheBeacon.Story.2"]
new = "The badwater has a source, a reason and, at last, a caretaker."
status = "normal"

["Narrative.Stage.TheBeacon.Requirement.1"]
new = "Long-Range Beacon mission"
status = "normal"

["Narrative.Discovery.ClinicLog.Title"]
new = "The Doctors' Ledger"
status = "normal"

["Narrative.Discovery.ClinicLog.Objective"]
new = "Finish a Hospital."
status = "normal"

["Narrative.Discovery.ClinicLog.Story.1"]
new = "The hospital keeps a ledger of every badwater patient. After a season, the doctors notice the bad days arrive in a rhythm, like a schedule nobody remembers setting."
status = "normal"

["Narrative.Discovery.ClinicLog.Requirement.1"]
new = "Hospital finished"
status = "normal"

["Narrative.Discovery.CleanerThanTheRiver.Title"]
new = "Cleaner Than the River"
status = "normal"

["Narrative.Discovery.CleanerThanTheRiver.Objective"]
new = "Purify 500 pure water."
status = "normal"

["Narrative.Discovery.CleanerThanTheRiver.Story.1"]
new = "Five hundred barrels of water cleaner than the river has been in living memory. The treatment crews have started tasting it competitively."
status = "normal"

["Narrative.Discovery.CleanerThanTheRiver.Requirement.1"]
new = "Pure water purified"
status = "normal"

["Narrative.Discovery.HoldingOurOwn.Title"]
new = "Holding Our Own"
status = "normal"

["Narrative.Discovery.HoldingOurOwn.Objective"]
new = "Finish a Radioactive Waste Vault."
status = "normal"

["Narrative.Discovery.HoldingOurOwn.Story.1"]
new = "The colony now keeps a holding of its own. Unlike the humans' Holding, this one has a label, a ledger and a beaver whose whole job is reading both."
status = "normal"

["Narrative.Discovery.HoldingOurOwn.Requirement.1"]
new = "Radioactive Waste Vault finished"
status = "normal"

["Narrative.Discovery.CleanHands.Title"]
new = "Clean Hands"
status = "normal"

["Narrative.Discovery.CleanHands.Objective"]
new = "Decontaminate water once at a Radioactive Waste Refinery."
status = "normal"

["Narrative.Discovery.CleanHands.Story.1"]
new = "The first barrel of contaminated water made drinkable again. It is a small barrel, and the colony is very proud of it."
status = "normal"

["Narrative.Discovery.CleanHands.Requirement.1"]
new = "Water decontaminated"
status = "normal"

["Narrative.Discovery.CacheRoster.Title"]
new = "Record Cache: Shift Roster"
status = "normal"

["Narrative.Discovery.CacheRoster.Objective"]
new = "Survey 1 Human Record Cache from an Archive Excavation."
status = "normal"

["Narrative.Discovery.CacheRoster.Story.1"]
new = "A shift roster from Holding Station 3. The names have faded, but one column, headed BROUGHT SNACKS, is ticked every single day by the same person."
status = "normal"

["Narrative.Discovery.CacheRoster.Requirement.1"]
new = "Record caches surveyed"
status = "normal"

["Narrative.Discovery.CacheDrawing.Title"]
new = "Record Cache: A Child's Drawing"
status = "normal"

["Narrative.Discovery.CacheDrawing.Objective"]
new = "Survey 2 Human Record Caches from an Archive Excavation."
status = "normal"

["Narrative.Discovery.CacheDrawing.Story.1"]
new = "A drawing of the river, a sun, a very tall house and a small round animal with a flat tail. The label underneath says FRIEND."
status = "normal"

["Narrative.Discovery.CacheDrawing.Requirement.1"]
new = "Record caches surveyed"
status = "normal"

["Narrative.Discovery.CacheWeather.Title"]
new = "Record Cache: Weather Log"
status = "normal"

["Narrative.Discovery.CacheWeather.Objective"]
new = "Survey 3 Human Record Caches from an Archive Excavation."
status = "normal"

["Narrative.Discovery.CacheWeather.Story.1"]
new = "Day 41: no rain. Day 42: no rain. Day 43: no rain, but someone has drawn a cloud in the margin to cheer everyone up."
status = "normal"

["Narrative.Discovery.CacheWeather.Requirement.1"]
new = "Record caches surveyed"
status = "normal"

["Narrative.Discovery.CacheMemo.Title"]
new = "Record Cache: Memo 14-C"
status = "normal"

["Narrative.Discovery.CacheMemo.Objective"]
new = "Survey 4 Human Record Caches from an Archive Excavation."
status = "normal"

["Narrative.Discovery.CacheMemo.Story.1"]
new = "Filters for the treatment works are back-ordered. Please do not drink from the river until further notice. Please do not ask when further notice is."
status = "normal"

["Narrative.Discovery.CacheMemo.Requirement.1"]
new = "Record caches surveyed"
status = "normal"

["Narrative.Discovery.CachePostcard.Title"]
new = "Record Cache: Postcard"
status = "normal"

["Narrative.Discovery.CachePostcard.Objective"]
new = "Survey 5 Human Record Caches from an Archive Excavation."
status = "normal"

["Narrative.Discovery.CachePostcard.Story.1"]
new = "Arrived north. It rains here. Miss the valley terribly. I think somebody left the pumps on. - M."
status = "normal"

["Narrative.Discovery.CachePostcard.Requirement.1"]
new = "Record caches surveyed"
status = "normal"

["Narrative.Ending.Signal.Title"]
new = "We Are Here"
status = "normal"

["Narrative.Ending.Signal.Description"]
new = "Transmit a standing call: where the Holding is, how to keep it, and an open invitation to anyone still listening."
status = "normal"

["Narrative.Ending.Signal.Epilogue.1"]
new = "Every few hours the beacon repeats one message in every format the archive could find: a map, a list of numbers and a drawing of a beaver waving."
status = "normal"

["Narrative.Ending.Signal.Epilogue.2"]
new = "Nobody has answered yet. The colony has decided that 'yet' is the important word, and keeps a light on at the launch pad, just in case."
status = "normal"

["Narrative.Ending.Archive.Title"]
new = "The Whole Record"
status = "normal"

["Narrative.Ending.Archive.Description"]
new = "Preserve everything: the humans' records, the colony's own ledgers and the story of the badwater, safe in orbit for whoever comes next."
status = "normal"

["Narrative.Ending.Archive.Epilogue.1"]
new = "The beacon carries every drive the excavations restored and every ledger the colony ever kept, including the boring ones, because the boring ones turned out to matter most."
status = "normal"

["Narrative.Ending.Archive.Epilogue.2"]
new = "If anyone ever wonders how a valley went dry and came back, the answer is up there, filed under MAINTENANCE: DO NOT POSTPONE."
status = "normal"

["Narrative.Ending.Settlement.Title"]
new = "The Map Home"
status = "normal"

["Narrative.Ending.Settlement.Description"]
new = "Guide future settlers: clean-water maps, treatment designs and the safe routes the colony learned, so others can build where the land has healed."
status = "normal"

["Narrative.Ending.Settlement.Epilogue.1"]
new = "The beacon does not ask anyone to come. It simply explains, very clearly, where the water is clean, how to keep it that way and which roots are the tastiest."
status = "normal"

["Narrative.Ending.Settlement.Epilogue.2"]
new = "Somewhere, someday, a small band of travellers will follow it over the ridge and find a valley already waiting for them."
status = "normal"

