["Building.JapaneseSteamEngineII.Description"]
status = "normal"
raw = "Burns fuel to create power. A taller Meiji engine house with a clerestory roof: 900 hp, with 2.25x the fuel use of a Steam Engine."
enUS = "Burns fuel to create power. A taller Meiji engine house with a clerestory roof: 900 hp, with 2.25x the fuel use of a Steam Engine."
zhCN = "燃烧燃料产生动力。一座带高窗式屋顶的更高明治蒸汽机房：900 hp，燃料消耗为蒸汽机的 2.25 倍。"
zhTW = "燃燒燃料以產生動力。較高的明治式引擎屋，屋頂帶有高側窗：900 hp，燃料消耗為蒸汽引擎的 2.25 倍。"
ruRU = "Сжигает топливо для выработки энергии. Более высокий корпус паровой машины Мэйдзи с верхним окном: 900 hp, расход топлива в 2,25 раза выше, чем у паровой машины."
jaJP = "燃料を燃やして動力を生み出す。天窓付き屋根を備えた、より背の高い明治式機関庫。出力900 hp。蒸気機関の2.25倍の燃料を消費する。"
frFR = "Brûle du combustible pour produire de l'énergie. Un bâtiment de moteur Meiji plus haut, avec toit à lanterneau : 900 hp, avec une consommation de combustible 2,25 fois supérieure à celle d'un moteur à vapeur."
deDE = "Verbrennt Brennstoff zur Stromerzeugung. Ein höheres Meiji-Maschinenhaus mit Lichtgaden-Dach: 900 hp, mit dem 2,25-fachen Brennstoffverbrauch einer Dampfmaschine."
plPL = "Spala paliwo, aby wytwarzać energię. Wyższy budynek silnika Meiji z dachem z oknami wysokimi: 900 hp, zużywa 2,25 raza więcej paliwa niż Silnik parowy."
ptBR = "Queima combustível para gerar energia. Uma casa de motor Meiji mais alta, com telhado de clerestório: 900 hp, com 2,25x o consumo de combustível de uma Máquina a Vapor."
koKR = "연료를 태워 동력을 생성합니다. 클리어스토리 지붕을 갖춘 더 높은 명치 시대 엔진 하우스: 900hp, 증기 기관의 2.25배에 달하는 연료를 사용합니다."
trTR = "Yakıt yakarak güç üretir. Çatı penceresi (clerestory) olan, daha uzun bir Meiji motor binası: 900 hp, bir Buhar Motorunun 2,25 katı yakıt tüketimiyle."
esES = "Quema combustible para generar energía. Una casa de motor Meiji más alta, con techo de clerestorio: 900 hp, con 2,25 veces el consumo de combustible de una Máquina de vapor."
itIT = "Brucia combustibile per generare energia. Una sala macchine Meiji più alta con tetto a lucernario: 900 hp, con un consumo di combustibile pari a 2,25 volte quello di una Macchina a vapore."
ukUA = "Спалює паливо для отримання енергії. Вищий машинний зал Meiji з дахом із вікнами-надбудовами: 900 к. с., із витратою палива в 2,25 раза більшою, ніж у парової машини."
thTH = "เผาเชื้อเพลิงเพื่อผลิตพลังงาน โรงเครื่องยนต์ไมจิที่สูงกว่าพร้อมหลังคาคลีเรสตอรี: 900 hp ใช้เชื้อเพลิงมากกว่าเครื่องจักรไอน้ำ 2.25 เท่า"
csCZ = "Spaluje palivo k výrobě energie. Vyšší budova motoru Meiji s podokenním světlíkovým \u200b\u200bstřechou: 900 hp, se 2,25násobnou spotřebou paliva oproti parnímu motoru."
viVN = "Đốt nhiên liệu để tạo ra năng lượng. Một nhà máy động cơ Meiji cao hơn với mái có cửa sổ trên cao: 900 hp, tiêu thụ nhiên liệu gấp 2,25 lần so với Động cơ hơi nước."
caES = "Crema combustible per generar energia. Una casa de motor Meiji més alta amb teulada de finestral alt: 900 hp, amb 2,25 vegades el consum de combustible d'un motor de vapor."
beBY = "Спальвае паліва для вытворчасці энергіі. Вышэйшы будынак рухавіка Мэйдзі з верхнім асвятляльным дахам: 900 к.с., пры выкарыстанні паліва ў 2,25 раза больш, чым у паравога рухавіка."
roRO = "Arde combustibil pentru a produce energie. Un motor Meiji mai înalt, cu acoperiș de tip clerestoriu: 900 hp, cu de 2,25 ori mai mult consum de combustibil decât un Motor cu abur."
huHU = "Üzemanyagot éget energia előállításához. Magasabb Meiji gépház, felső világító ablaksorral: 900 le, a Gőzgép üzemanyag-fogyasztásának 2,25-szörösét használja."
arSA = "يحرق الوقود لتوليد الطاقة. محرك ميجي أطول بسقيفة مرتفعة بسقف ذي نوافذ علوية: 900 حصان، مع استهلاك للوقود يعادل 2.25 ضعف استهلاك محرك البخار."

["Building.JapaneseSteamEngineII.FlavorDescription"]
status = "normal"
raw = "The raised roof lets the steam out and the light in. Mostly the steam."
enUS = "The raised roof lets the steam out and the light in. Mostly the steam."
zhCN = "抬高的屋顶让蒸汽排出，也让光线进入。不过主要还是排蒸汽。"
zhTW = "抬高的屋頂讓蒸汽排出，也讓光線進來。主要是排蒸汽。"
ruRU = "Приподнятая крыша выпускает пар и впускает свет. В основном пар."
jaJP = "屋根を高くしたことで、蒸気が抜け、光が入るようになっている。主に蒸気が抜けるための造りだが。"
frFR = "Le toit surélevé laisse sortir la vapeur et entrer la lumière. Surtout la vapeur."
deDE = "Das erhöhte Dach lässt den Dampf hinaus und das Licht hinein. Meistens den Dampf."
plPL = "Podniesiony dach wypuszcza parę i wpuszcza światło. Głównie parę."
ptBR = "A cobertura elevada deixa o vapor sair e a luz entrar. Principalmente o vapor."
koKR = "높아진 지붕 덕분에 증기는 빠져나가고 빛은 들어옵니다. 대부분은 증기가 빠져나가는 쪽이지만요."
trTR = "Yükseltilmiş çatı buharı dışarı, ışığı içeri alır. Çoğunlukla buharı."
esES = "El techo elevado deja salir el vapor y entrar la luz. Sobre todo el vapor."
itIT = "Il tetto rialzato fa uscire il vapore e entrare la luce. Per lo più il vapore."
ukUA = "Піднятий дах випускає пару і впускає світло. Переважно пару."
thTH = "หลังคาที่ยกสูงช่วยให้ไอน้ำระบายออกไปและแสงสว่างเข้ามาได้ ส่วนใหญ่แล้วก็คือไอน้ำนั่นแหละ"
csCZ = "Zvednutá střecha pustí páru ven a světlo dovnitř. Hlavně páru."
viVN = "Mái nhà được nâng lên giúp hơi nước thoát ra và ánh sáng lọt vào. Chủ yếu là hơi nước thoát ra."
caES = "El sostre elevat deixa sortir el vapor i entrar la llum. Sobretot el vapor."
beBY = "Прыўзняты дах выпускае пару і ўпускае святло. Галоўным чынам пару."
roRO = "Acoperișul ridicat lasă aburul să iasă și lumina să intre. Mai ales aburul."
huHU = "A megemelt tető kiengedi a gőzt és beengedi a fényt. Főleg a gőzt."
arSA = "ترفع السقف يسمح للبخار بالخروج والضوء بالدخول. في الغالب البخار."

