roRO = "Arde combustibil pentru a produce energie. O centrală electrică Meiji pe două niveluri, cu doi cilindri: 1200 hp, cu un consum de combustibil de 3 ori mai mare decât cel al unui Motor cu abur."
huHU = "Tüzelőanyagot éget energia előállításához. Kétszintes Meidzsi erőmű ikerhengerekkel: 1200 hp, a gőzgépének háromszoros tüzelőanyag-fogyasztásával."
arSA = "يحرق الوقود لتوليد الطاقة. محطة طاقة ميجي من طابقين بمحركين توأم: 1200 hp، وتستهلك وقودًا أكثر بثلاث مرات من محرك البخار."

