["Building.JapaneseSteamEngineIII.Description"]
status = "normal"
raw = "Burns fuel to create power. A two-storey Meiji powerhouse with twin cylinders: 1200 hp, with 3x the fuel use of a Steam Engine."
enUS = "Burns fuel to create power. A two-storey Meiji powerhouse with twin cylinders: 1200 hp, with 3x the fuel use of a Steam Engine."
zhCN = "燃烧燃料以产生动力。这是一座两层的明治时代发电站，配有双缸设备：功率1200 hp，燃料消耗量是蒸汽机的3倍。"
zhTW = "燃燒燃料以產生動力。這是一座兩層樓高的明治時代發電廠，配備雙汽缸：輸出 1200 hp，燃料消耗量為蒸汽機的 3 倍。"
ruRU = "Сжигает топливо для выработки энергии. Двухэтажная электростанция Мэйдзи с двумя цилиндрами: 1200 hp, расход топлива в 3 раза выше, чем у паровой машины."
jaJP = "燃料を燃やして動力を生み出す。二階建ての明治時代の発電所で、双気筒を備える。出力は1200 hpで、蒸気機関の3倍の燃料を消費する。"
frFR = "Brûle du combustible pour produire de l'énergie. Une centrale électrique Meiji à deux étages, dotée de deux cylindres jumeaux : 1200 hp, avec une consommation de combustible 3 fois supérieure à celle d'une machine à vapeur."
deDE = "Verbrennt Brennstoff zur Stromerzeugung. Ein zweistöckiges Meiji-Kraftwerk mit zwei Zylindern: 1200 hp, mit dem 3-fachen Brennstoffverbrauch einer Dampfmaschine."
plPL = "Spala opał, aby wytwarzać energię. Dwupiętrowa elektrownia Meiji z dwoma cylindrami: 1200 hp, zużywa 3-krotnie więcej opału niż Maszyna parowa."
ptBR = "Queima combustível para gerar energia. Uma casa de força Meiji de dois andares com cilindros gêmeos: 1200 hp, com 3x o consumo de combustível de uma Máquina a Vapor."
