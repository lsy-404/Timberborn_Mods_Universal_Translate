["Building.JapaneseSteamEngineI.Description"]
status = "normal"
raw = "Burns fuel to create power. A timber-framed Meiji-style engine house: 600 hp, with 1.5x the fuel use of a Steam Engine."
enUS = "Burns fuel to create power. A timber-framed Meiji-style engine house: 600 hp, with 1.5x the fuel use of a Steam Engine."
zhCN = "燃烧燃料产生动力。木结构的明治风格引擎屋：600 hp，燃料消耗为蒸汽机的 1.5 倍。"
zhTW = "燃燒燃料以產生動力。一座木構架的明治風格引擎屋：600 hp，燃料消耗量為蒸汽引擎的 1.5 倍。"
ruRU = "Сжигает топливо для выработки энергии. Машинный зал в стиле эпохи Мэйдзи с деревянным каркасом: 600 hp, расход топлива в 1,5 раза выше, чем у паровой машины."
jaJP = "燃料を燃やして動力を生み出す。木造骨組みの明治様式の機関室：600 hp。蒸気機関の1.5倍の燃料を消費する。"
frFR = "Brûle du combustible pour produire de l'énergie. Un bâtiment de machine à vapeur de style Meiji à ossature en bois : 600 hp, avec une consommation de combustible 1,5 fois supérieure à celle d'une machine à vapeur."
deDE = "Verbrennt Brennstoff zur Stromerzeugung. Ein Maschinenhaus im Meiji-Stil mit Holzrahmenbau: 600 hp, mit dem 1,5-fachen Brennstoffverbrauch einer Dampfmaschine."
plPL = "Spala paliwo, aby wytwarzać energię. Drewniany budynek silnika w stylu Meiji o konstrukcji szkieletowej: 600 hp, przy zużyciu paliwa 1,5 razy większym niż w Maszynie parowej."
ptBR = "Queima combustível para gerar energia. Uma casa de máquinas no estilo Meiji, com estrutura de madeira: 600 hp, com 1,5x o consumo de combustível de uma Máquina a Vapor."
koKR = "연료를 태워 동력을 만듭니다. 목재 골조의 메이지 양식 기관실로, 600hp이며 증기 기관보다 연료 소모량이 1.5배입니다."
trTR = "Yakıt yakarak güç üretir. Ahşap karkaslı, Meiji tarzı bir motor evi: 600 hp, Buhar Motoru'nun 1,5 katı yakıt tüketimi ile."
esES = "Quema combustible para generar energía. Una casa de máquinas de estilo Meiji de entramado de madera: 600 hp, con 1,5 veces el consumo de combustible de una Máquina de vapor."
itIT = "Consuma combustibile per produrre energia. Una sala macchine in stile Meiji con struttura in legno: 600 hp, con un consumo di combustibile pari a 1,5 volte quello di una Macchina a vapore."
ukUA = "Спалює паливо для виробництва енергії. Дерев'яний будинок двигуна у стилі періоду Мейдзі: 600 hp, із витратою палива в 1,5 раза більшою, ніж у парової машини."
thTH = "ใช้เชื้อเพลิงเพื่อสร้างพลังงาน เป็นโรงเครื่องยนต์สไตล์เมจิที่โครงสร้างเป็นไม้ มีกำลัง 600 hp และใช้เชื้อเพลิงมากกว่าเครื่องจักรไอน้ำ 1.5 เท่า"
csCZ = "Spaluje palivo k výrobě energie. Dřevěný dům motoru ve stylu Meidži: 600 hp, se spotřebou paliva 1,5násobnou oproti parnímu motoru."
viVN = "Đốt nhiên liệu để tạo ra năng lượng. Một nhà máy động cơ kiểu Meiji với khung gỗ: 600 hp, tiêu thụ nhiên liệu gấp 1,5 lần so với Động cơ hơi nước."
caES = "Crema combustible per generar energia. Una casa de màquines d'estil Meiji de fusta i entramat: 600 hp, amb 1,5 vegades el consum de combustible d'una Màquina de vapor."
beBY = "Спальвае паліва для вытворчасці энергіі. Драўляны будынак рухавіка ў стылі Мэйдзі: 600 к.с., з выкарыстаннем паліва ў 1,5 раза больш, чым у паравога рухавіка."
roRO = "Arde combustibil pentru a produce energie. O casă a motorului în stil Meiji, cu structură din lemn: 600 hp, cu un consum de combustibil de 1,5 ori mai mare decât al unei Mașini cu abur."
huHU = "Tüzelőanyagot éget, hogy energiát termeljen. Faszerkezetű, Meidzsi-stílusú gépház: 600 hp, a gőzgép tüzelőanyag-felhasználásának 1,5-szeresével."
arSA = "يحرق الوقود لتوليد الطاقة. محرك على الطراز الميجي الياباني ذو هيكل خشبي: 600 حصان بخاري، ويستهلك وقودًا بمقدار 1.5 ضعف ما يستهلكه محرك البخار."

["Building.JapaneseSteamEngineI.FlavorDescription"]
status = "normal"
raw = "Tile roof, plaster walls, and a flywheel you can hear from three dams away."
enUS = "Tile roof, plaster walls, and a flywheel you can hear from three dams away."
zhCN = "瓦片屋顶、灰泥墙，还有一台三座堤坝外都能听见轰鸣声的飞轮。"
zhTW = "瓦片屋頂、灰泥牆，還有一台在三座水壩外都聽得見的飛輪。"
ruRU = "Черепичная крыша, оштукатуренные стены и маховик, который слышно за три плотины отсюда."
jaJP = "瓦屋根、漆喰の壁、そして三つのダム先まで聞こえるはずみ車。"
frFR = "Toit en tuiles, murs en plâtre, et un volant d'inertie que l'on peut entendre à trois barrages de distance."
deDE = "Ziegeldach, Putzwände und ein Schwungrad, das man aus drei Dämmen Entfernung hören kann."
plPL = "Dachówkowy dach, tynkowane ściany i koło zamachowe, które słychać z trzech tam dalej."
ptBR = "Telhado de telha, paredes de reboco e um volante de inércia que se ouve a três represas de distância."
koKR = "지붕은 기와, 벽은 회반죽이며, 세 개의 댐 너머에서도 들리는 플라이휠이 달려 있다."
trTR = "Kiremit çatı, sıva duvarlar ve üç baraj ötesinden duyulabilen bir volan."
esES = "Techo de teja, paredes de yeso y un volante de inercia que se oye desde tres presas de distancia."
itIT = "Tetto di tegole, muri di intonaco e un volano che si sente da tre dighe di distanza."
ukUA = "Черепичний дах, штукатурні стіни та маховик, який чути з трьох гребель звідси."
thTH = "หลังคากระเบื้อง ผนังฉาบปูน และล้อช่วยแรงที่ได้ยินเสียงจากเขื่อนสามแห่งห่างออกไป"
csCZ = "Střešní krytina z tašek, omítnuté stěny a setrvačník, který je slyšet ze vzdálenosti tří přehrad."
viVN = "Mái ngói, tường trát vữa, và một bánh đà ồn đến mức nghe được từ ba con đập cách đó."
caES = "Teulada de tella, parets d'arrebossat i un volant d'inèrcia que es pot sentir a tres preses de distància."
beBY = "Чарапічная дах, тынкаваныя сцены і маторнае кола, гул якога чуваць за тры плаціны адсюль."
roRO = "Acoperiș de țiglă, pereți tencuiți și un volant pe care îl auzi de la trei baraje distanță."
huHU = "Cseréptető, vakolt falak, és egy lendkerék, amelyet három gáttal arrébb is hallani."
arSA = "سقف من القرميد، وجدران مطلية بالجص، وعجلة طيران تسمع صوتها من على بعد ثلاثة سدود."

