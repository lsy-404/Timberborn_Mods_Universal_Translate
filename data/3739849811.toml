viVN = "Đánh dấu các hàng cây xen kẽ và để lại các hàng hạt giống nằm ngang đầy đủ giữa chúng. Cắt khoảng một nửa."
caES = "Marca files alternes d'arbres i deixa files horitzontals de llavors completes entre elles. Talla aproximadament la meitat."
beBY = "Пазначае чаргаванне радоў дрэў і пакідае паміж імі поўныя гарызантальныя радкі для насення. Выразае прыблізна палову."
roRO = "Marchează rânduri alternative de copaci și lasă între ele rânduri orizontale complete de semințe. Taie aproximativ jumătate."
huHU = "Megjelöli a fasorok váltakozó sorait, és közéjük teljes vízszintes magvetési sorokat hagy. Körülbelül a felét vágja ki."
arSA = "تُحدِّد صفوفًا متبادلة من الأشجار، وتترك صفوفًا أفقية كاملة من البذور بينها. تقطع نحو النصف."

