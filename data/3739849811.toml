koKR = "나무와 나뭇잎의 교차하는 줄을 표시하고 그 사이에 전체 수평 씨앗 줄을 생성합니다. 약 절반을 잘라냅니다."
trTR = "Ağaçların sırayla işaretlenmesini sağlar ve aralarına tam yatay tohum sıraları yerleştirir. Yaklaşık yarısını keser."
esES = "Marca filas alternas de árboles y deja filas horizontales de semillas completas entre ellas. Corta aproximadamente la mitad."
itIT = "Segna file alternate di alberi e lascia intere file orizzontali di semi tra di esse. Taglia circa la metà."
ukUA = "Позначає чергування рядів дерев і залишає між ними повні горизонтальні ряди для посіву. Вирубує приблизно половину."
