zhTW = "在四個位置標記三棵樹，並保持稀疏的種子網格完整。砍伐約四分之三。"
ruRU = "Ставит метки на три дерева в четыре и сохраняет редкую сетку семян. Обрезает около трех четвертей."
jaJP = "「4本の間に3本の木を印し、まばらな種のグリッドを維持します。約4分の3を切り取ります。」"
frFR = "Marque trois arbres dans quatre et maintient un modèle de semences clairsemé. Coupe environ les trois quarts."
deDE = "Markiert drei Bäume in vier und lässt ein spärliches Samenraster stehen. Schneidet etwa drei Viertel ab."
plPL = "Oznacza trzy drzewa w czwórce i utrzymuje rzadki siatkę nasion. Ścina około trzech czwartych."
ptBR = "Marca três árvores em quatro e mantém uma grade de sementes esparsa. Corta cerca de três quartos."
koKR = "네 그리드에서 세 그루의 나무를 표시하고 희박한 씨앗 그리드를 유지합니다. 약 3/4 가량을 자릅니다."
trTR = "Üç ağacı dörde işaretler ve seyrek bir tohum ızgarası ayakta tutar. Yaklaşık üçte birini keser."
esES = "Marca tres de cada cuatro árboles y deja en pie una cuadrícula de semillas dispersa. Corta alrededor de tres cuartas partes."
itIT = "Contrassegna tre alberi su quattro e lascia in piedi una griglia di semi sparsa. Taglia circa tre quarti."
ukUA = "Позначає три дерева з чотирьох і залишає рідку сітку насіння стоячою. Вирубує близько трьох чвертей."
thTH = "ทำเครื่องหมายต้นไม้สามใน\u200bทุกสี่ต้น และคงตารางเมล็ดพันธุ์แบบเบาบางไว้ตั้งอยู่ ตัดไปประมาณสามในสี่"
csCZ = "Vymezuje tři stromy ve čtyřech a udržuje řídkou síť osiva. Pokácí přibližně tři čtvrtiny."
viVN = "Đánh dấu ba cây trong bốn và giữ một lưới hạt thưa thớt. Cắt khoảng ba phần tư."
caES = "Marca tres de cada quatre arbres i deixa en peu una quadrícula d'llavors dispersa. Talla unes tres quartes parts."
beBY = "Пазначае тры дрэвы з чатырох і пакідае рэдкую сетку насаджэнняў. Выразае каля трох чвэрцяў."
roRO = "Marchează trei din patru copaci și păstrează o grilă rară de semințe în picioare. Taie aproximativ trei sferturi."
huHU = "Négyből három fát megjelöl, és ritka magrácsot hagy állva. Nagyjából háromnegyedét kivágja."
arSA = "يحدد ثلاث أشجار من كل أربع، ويُبقي على شبكة بذور متفرقة قائمة. ويقطع نحو ثلاثة أرباع الأشجار."

