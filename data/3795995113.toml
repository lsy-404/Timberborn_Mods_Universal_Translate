["Battery.Flywheels.SmallFlywheel.Description"]
raw = "A small and low-capacity flywheel built inline with a shaft. Platforms can be built over them similar to shafts."
status = "normal"
enUS = "A small, low-capacity flywheel built inline with a shaft. Platforms can be built over it, just like over shafts."
zhCN = "一种内联安装在传动轴上的小型飞轮，储能容量较低。可以像传动轴一样在其上方建造平台。"
zhTW = "一種沿著軸建造的小型飛輪，容量較低。和軸一樣，可以在其上方建造平台。"
ruRU = "Небольшой маховик малой ёмкости, встроенный в линию вала. Над ним можно строить платформы, как и над валами."
jaJP = "シャフトに直列に組み込む、小型で容量の小さいフライホイール。シャフトと同様に、その上にプラットフォームを建設できます。"
frFR = "Un volant d’inertie de petite taille et de faible capacité, intégré à un arbre. Des plateformes peuvent être construites au-dessus, comme pour les arbres."
deDE = "Ein kleines Schwungrad mit geringer Kapazität, das in eine Welle integriert ist. Wie über Wellen können auch über ihnen Plattformen gebaut werden."
plPL = "Małe koło zamachowe o niewielkiej pojemności, wbudowane w wał. Można nad nim budować platformy, podobnie jak nad wałami."
ptBR = "Um volante de baixa capacidade e tamanho pequeno, integrado em linha a um eixo. É possível construir plataformas sobre eles, assim como sobre os eixos."
koKR = "축과 일직선으로 설치하는 소형 저용량 플라이휠입니다. 축과 마찬가지로 위에 플랫폼을 건설할 수 있습니다."
csCZ = "Malý setrvačník s nízkou kapacitou, zabudovaný přímo do hřídele. Podobně jako nad hřídeli lze i nad nimi stavět plošiny."
viVN = "Một bánh đà nhỏ, dung lượng thấp được lắp thẳng hàng với trục truyền động. Có thể xây bục bên trên chúng, tương tự như với trục truyền động."
trTR = "Bir şafta hat üzerinde monte edilen, küçük ve düşük kapasiteli bir volan. Tıpkı şaftlarda olduğu gibi üzerlerine platform inşa edilebilir."

