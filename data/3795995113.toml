["Battery.Flywheels.SmallFlywheel.Description"]
status = "normal"
raw = "A small and low-capacity flywheel built inline with a shaft. Platforms can be built over them similar to shafts."
enUS = "A small, low-capacity flywheel built inline with a shaft. Platforms can be built over it, just like over shafts."
zhCN = "一种小型、容量较低的飞轮，与轴内联建造。其上方可以像轴一样建造平台。"
zhTW = "一種小型、容量較低，且與軸接成一直線的飛輪。和軸一樣，可以在其上方建造平台。"
ruRU = "Небольшой маховик малой ёмкости, устанавливаемый в линию с валом. Над ним, как и над валами, можно строить платформы."
jaJP = "シャフトに直結する、小型で容量の少ないフライホイール。シャフトと同様に、その上にプラットフォームを建設できます。"
frFR = "Un volant d’inertie petit et de faible capacité, intégré à un arbre. Des plateformes peuvent être construites au-dessus, comme pour les arbres."
deDE = "Ein kleines Schwungrad mit geringer Kapazität, das inline mit einer Welle eingebaut wird. Ähnlich wie bei Wellen können Plattformen darüber gebaut werden."
plPL = "Małe koło zamachowe o niewielkiej pojemności, montowane w linii wału. Można nad nim budować platformy, podobnie jak nad wałami."
ptBR = "Um volante de inércia pequeno e de baixa capacidade, instalado em linha com um eixo. É possível construir plataformas sobre ele, assim como sobre os eixos."
koKR = "축에 일렬로 연결되는 소형 저용량 플라이휠입니다. 축과 마찬가지로 위에 플랫폼을 건설할 수 있습니다."
csCZ = "Malý setrvačník s nízkou kapacitou, vestavěný přímo do hřídele. Podobně jako nad hřídelemi lze i nad nimi stavět plošiny."
viVN = "Bánh đà nhỏ, dung lượng thấp, được lắp thẳng hàng với trục truyền động. Có thể xây nền tảng phía trên chúng, tương tự như với trục truyền động."
trTR = "Bir mile aynı hizada yerleştirilen, küçük ve düşük kapasiteli bir volan. Tıpkı millerde olduğu gibi üzerlerine platformlar inşa edilebilir."

