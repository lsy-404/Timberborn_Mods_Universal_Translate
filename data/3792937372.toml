["Cadre.Motivatorium.Cite"]
raw = "\"Day after day, night after night, we struggle. It’s beautiful.\" —Ol'xa0Kazko"
status = "normal"
enUS = "\"Day after day, night after night, we struggle. It’s beautiful.\" —Ol'xa0Kazko"
zhCN = "“日复一日，夜复一夜，我们在挣扎。这是美丽的。”—Ol'xa0Kazko"
zhTW = "「日復一日，夜復一夜，我們在掙扎。這是美麗的。」—Ol'xa0Kazko"
ruRU = "\"День за днем, ночь за ночью, мы боремся. Это прекрасно.\" —Ол'ка0Казко"
jaJP = "「日に日に、夜ごとに、私たちは奮闘します。それは美しい。」 —オル'カズコ"
frFR = "« Jour après jour, nuit après nuit, nous luttons. C’est beau. » —Ol'xa0Kazko"
deDE = "„Tag für Tag, Nacht für Nacht kämpfen wir. Es ist wunderschön.“ —Ol'xa0Kazko"
plPL = "\"Każdego dnia, każdej nocy, zmagamy się. To jest piękne.\" —Ol'xa0Kazko"
ptBR = "\"Dia após dia, noite após noite, lutamos. É belo.\" —Ol'xa0Kazko"
koKR = "“하루하루, 밤마다 우리는 고군분투한다. 아름답다.” —올'카즈코"
csCZ = "\"Den za dnem, noc za nocí, bojujeme. Je to nádherné.\" —Ol'xa0Kazko"
viVN = "\"Mỗi ngày trôi qua, mỗi đêm trôi qua, chúng ta vật lộn. Thật đẹp.\" —Ol'xa0Kazko"
trTR = "\"Gün geçtikçe, gece geceye mücadele ediyoruz. Harika.\" —Ol'xa0Kazko"

