["Cadre.Scratcher.Cite"]
raw = "Even when relaxing, the Iron Teeth are itching to get back to work."
status = "normal"
enUS = "Even when relaxing, the Iron Teeth are itching to get back to work."
zhCN = "即使在放松时，铁牙也渴望回到工作中。"
zhTW = "即使在放鬆時，鐵牙依然渴望回到工作崗位。"
ruRU = "Даже во время отдыха Железные Зубы жаждут вернуться к работе."
jaJP = "「リラックスしているときでも、アイアンティースは仕事に戻りたくてうずうずしています。」"
frFR = "Même en se relaxant, les Dents de Fer ont hâte de retourner au travail."
deDE = "Selbst beim Entspannen drängt es die Eisenbeißer zurück zur Arbeit."
plPL = "Nawet podczas relaksu, Żelazne Zęby nie mogą się doczekać, aby wrócić do pracy."
ptBR = "Mesmo quando estão relaxando, os Dentes de Ferro estão ansiosos para voltar ao trabalho."
koKR = "휴식 중에도, 철이빨은 다시 일하고 싶어 안달이 나 있습니다."
csCZ = "I když si odpočívají, Železné zuby se nemohou dočkat, až se vrátí k práci."
viVN = "Ngay cả khi thư giãn, những chiếc Răng Sắt cũng cảm thấy ngứa ngáy muốn trở lại làm việc."
trTR = "Dinlenirken bile, Demir Dişler işe geri dönmek için can atıyor."

