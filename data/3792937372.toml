["Cadre.Metalsmith.Cite"]
raw = "\"If you want it to last, make it metal. That's one thing hoomans did well.\" —Ol'xa0Kazko"
status = "normal"
enUS = "\"If you want it to last, make it metal. That's one thing humans did well.\" —Ol'xa0Kazko"
zhCN = "“如果你想它持久，就用金属制作。这是人类做得很好的事。” —Ol'xa0Kazko"
zhTW = "\"如果你想讓它持久，那就用金屬做。這是人類做得好的事之一。\" —奧爾'薩0卡茲科"
ruRU = "\"Если хочешь, чтобы это прослужило долго, сделай это из металла. Это единственное, что люди делали хорошо.\" —Ол'хa0Казко"
jaJP = "「長持ちさせたいなら、金属にしろ。それが人間がうまくやったことの一つだ。」 —オル’ｘａ０カズコ"
frFR = "\"Si vous voulez que ça dure, faites-le en métal. C'est une des choses que les humains ont bien faites.\" —Ol'xa0Kazko"
deDE = "\"Wenn du willst, dass es hält, mach es aus Metall. Das ist eine Sache, die Menschen gut hinbekommen haben.\" —Ol'xa0Kazko"
plPL = "„Jeśli chcesz, aby to przetrwało, zrób to z metalu. To jedna rzecz, którą ludzie zrobili dobrze.” —Ol'xa0Kazko"
ptBR = "\"Se você quiser que dure, faça de metal. Isso é uma coisa que os hoomans fizeram bem.\" —Ol'xa0Kazko"
koKR = "\"지속되길 원한다면 금속으로 만들어라. 인간들이 잘했던 한 가지다.\" —올'엑사0카즈코"
csCZ = "\"Pokud to chceš, aby to vydrželo, udělej to z kovu. To je jedna věc, kterou lidé dělali dobře.\" —Ol'xa0Kazko"
viVN = "\"Nếu bạn muốn nó bền, hãy làm bằng kim loại. Đó là điều mà loài người làm tốt.\" —Ol'xa0Kazko"
trTR = "\"Eğer kalıcı olmasını istiyorsan, metal yap. Hoomanların iyi yaptığı tek şey bu.\" —Ol'xa0Kazko"

