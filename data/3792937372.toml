deDE = "Um die Dinge praktisch zu halten, sollten Dekorationen sowohl hübsch als auch schmackhaft sein."
plPL = "Aby utrzymać sprawy w praktyce, dekoracje powinny być zarówno ładne, jak i smaczne."
ptBR = "Para manter as coisas práticas, as decorações devem ser bonitas e saborosas."
koKR = "실용성을 유지하기 위해 장식은 아름답고 맛있어야 합니다."
csCZ = "Abychom zachovali praktičnost, měly by být dekorace jak hezké, tak chutné."
viVN = "Để giữ mọi thứ thực tế, trang trí nên vừa đẹp vừa ngon."
trTR = "Pratik kalmak için, süslemelerin hem güzel hem de lezzetli olması gerekir."

