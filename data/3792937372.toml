plPL = "Dwa bobry zderzające się czołowo są podawane jako źródło niektórych z najdziwniejszych wynalazków Żelaznych Zębów."
ptBR = "Dois castores colidindo de cabeça são citados como fonte de algumas das invenções mais malucas dos Dentes de Ferro."
koKR = "두 마리 비버가 정통으로 충돌하는 것은 가장 기발한 아이언 티스 발명의 출처로 언급됩니다."
csCZ = "Dva bobři se srážející čelem k čelu jsou uváděni jako zdroj některých z nejbláznivějších vynálezů Železných zubů."
viVN = "Hai con rái cá va chạm đầu tiên được trích dẫn là nguồn gốc của một số phát minh kì quặc nhất của Iron Teeth."
