["Cadre.Scrapper.Cite"]
raw = "Bringing metal to traditionally wooden settlements, scavengers earn respect from some and disdain from others."
status = "normal"
enUS = "Bringing metal to traditionally wooden settlements, scavengers earn respect from some and disdain from others."
zhCN = "“将金属带入传统的木质定居点， scavengers赢得了某些人的尊重，也受到其他人的轻蔑。”"
zhTW = "將金屬帶入傳統的木製聚落，拾荒者贏得了一些人的尊重，也招來了其他人的輕視。"
ruRU = "Принося металл в традиционно деревянные поселения, scavengers зарабатывают уважение одних и презрение других."
jaJP = "金属を伝統的な木製集落に持ち込むことで、スクラッパーたちは一部からの尊敬を、他からの軽蔑を得る。"
frFR = "Apportant du métal à des colonies traditionnellement en bois, les récupérateurs gagnent le respect de certains et le mépris d'autres."
deDE = "Indem sie Metall in traditionell hölzerne Siedlungen bringen, verdienen sich die Plünderer den Respekt von einigen und den Veracht von anderen."
plPL = "Wprowadzając metal do tradycyjnych, drewnianych osad, złomiarze zdobywają szacunek jednych i pogardę innych."
ptBR = "Levando metal para assentamentos tradicionalmente de madeira, os catadores conquistam respeito de alguns e desdém de outros."
koKR = "전통적으로 나무로 지어진 정착지에 금속을 가져오는 먹이사슬들은 일부에게는 존경을, 다른 이들에게는 경멸을 받습니다."
csCZ = "Zásobováním tradičně dřevěných sídel kovem si škrabky získávají respekt některých a pohrdání od jiných."
viVN = "Đem kim loại vào các khu định cư truyền thống bằng gỗ, những người khai thác kiếm được sự tôn trọng từ một số người và sự khinh bỉ từ những người khác."
trTR = "Metal getirerek geleneksel ahşap yerleşimlerine, hurda toplayıcılar bazı kişilerden saygı kazanırken bazılarından küçümseme görürler."

["Cadre.Scratcher.Desc"]
raw = "A machine for scratching those hard-to-reach itches."
