["Cadre.ReservePile.Cite"]
raw = "\"Old wood is the best. They grew it differently back then.\" —Ma'xa0Ngonel"
status = "normal"
enUS = "\"Old wood is the best. They grew it differently back then.\" —Ma'xa0Ngonel"
zhCN = "“旧木材是最好的。那时它们的生长方式不同。” —Ma'xa0Ngonel"
zhTW = "「舊木材是最好的。那時他們的生長方式不同。」—馬・哈希亞"
ruRU = "\"Старое дерево – лучшее. Тогда его выращивали по-другому.\" —Ма'кса0Нгонел"
jaJP = "「古い木材が一番だ。昔は違う方法で育てられていた。」 —マ'ハ×0ングネル"
frFR = "\"Le vieux bois est le meilleur. Ils le cultivaient différemment à l'époque.\" —Ma'xa0Ngonel"
deDE = "\"Altes Holz ist das Beste. Damals wurde es anders gezüchtet.\" —Ma'xa0Ngonel"
plPL = "\"Stare drewno jest najlepsze. Wtedy rosło w inny sposób.\" —Ma'xa0Ngonel"
ptBR = "\"Madeira velha é a melhor. Eles a cultivavam de maneira diferente naquela época.\" —Ma'xa0Ngonel"
koKR = "\"오래된 나무가 최고입니다. 그때 그들은 다르게 자랐습니다.\" —마'크사0응고넬"
csCZ = "\"Staré dřevo je nejlepší. Rostlo to tehdy jinak.\" —Ma'xa0Ngonel"
viVN = "\"Gỗ cũ là tốt nhất. Chúng đã trồng nó khác trước đây.\" —Ma'xa0Ngonel"
trTR = "\"Eski ağaç en iyisidir. O zamanlar farklı şekilde büyüyordu.\" —Ma'xa0Ngonel"

