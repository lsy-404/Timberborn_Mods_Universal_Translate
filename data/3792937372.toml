["Cadre.AdvancedBreedingPod.Cite"]
raw = "The idea came up when a kit fell into a cauldron full of extract and had a giant growth spurt after drinking it all."
status = "normal"
enUS = "The idea came up when a kit fell into a cauldron full of extract and had a giant growth spurt after drinking it all."
zhCN = "“这个想法是在一个小孩掉进一个装满提取物的锅里，喝光后发生了巨大的生长冲刺时产生的。”"
zhTW = "這個想法是在一個小組掉進充滿提取物的鍋子裡之後產生的，喝下所有的提取物後它發生了巨大的成長。"
ruRU = "Идея появилась, когда детеныш упал в котел, полный экстракта, и после того, как выпил его, резко вырос."
jaJP = "「このアイデアは、キットが抽出物がいっぱい入った大釜に落ちて、全て飲み干した後に巨大化した時に浮かび上がりました。」"
frFR = "Cette idée est née lorsqu'un kit est tombé dans un chaudron plein d'extrait et a connu une croissance géante après l'avoir tout bu."
deDE = "Die Idee entstand, als ein Kit in einen Kessel voller Extrakt fiel und nach dem Trinken alles einen gigantischen Wachstumsschub bekam."
plPL = "Pomysł pojawił się, gdy młode wpadło do kociołka pełnego ekstraktu i miało ogromny przyrost po wypiciu wszystkiego."
ptBR = "A ideia surgiu quando um filhote caiu em um caldeirão cheio de extrato e teve um enorme crescimento depois de bebê-lo todo."
koKR = "이 아이디어는 키트가 추출물이 가득한 가마솥에 빠졌다가 이를 모두 마신 후 거대한 성장 급증을 겪으면서 떠올랐습니다."
csCZ = "Nápad vznikl, když se mládě dostalo do kotle plného extraktu a po jeho vypití mělo obrovský růstový impuls."
viVN = "Ý tưởng này nảy ra khi một bộ kit rơi vào một cái vạc đầy tinh chất và đã có một đợt tăng trưởng khổng lồ sau khi uống hết."
trTR = "Fikir, bir kitin bir özle dolu kazan içine düşmesi ve hepsini içtikten sonra dev bir büyüme atlaması yaşamasıyla ortaya çıktı."

["Cadre.Agora.Desc"]
raw = "A large gathering place where beavers can discuss timber-related topics."
status = "normal"
enUS = "A large gathering place where beavers can discuss timber-related topics."
zhCN = "一个大型聚集地，让海狸可以讨论与木材相关的话题。"
zhTW = "一個大型聚集地，讓海狸們可以討論與木材相關的主題。"
ruRU = "Большое место для собраний, где бобры могут обсуждать темы, связанные с древесиной."
jaJP = "ビーバーが木材に関連するトピックについて話し合うことができる大きな集会所。"
frFR = "Un grand lieu de rassemblement où les castors peuvent discuter de sujets liés au bois."
deDE = "Ein großer Versammlungsort, an dem Biber über holzbezogene Themen diskutieren können."
plPL = "Wielkie miejsce spotkań, gdzie bobry mogą dyskutować o tematach związanych z drewnem."
ptBR = "Um grande local de encontro onde os castores podem discutir assuntos relacionados à madeira."
koKR = "비버들이 목재 관련 주제를 논의할 수 있는 대규모 모임 장소입니다."
csCZ = "Velké shromaždiště, kde si bobři mohou povídat o tématech souvisejících se dřevem."
viVN = "Một địa điểm tập trung lớn nơi các chú hải ly có thể thảo luận về các chủ đề liên quan đến gỗ."
trTR = "Kayıtlara bağlı konuların tartışılabileceği büyük bir toplanma yeri."

