["Grows.Thorns.Desc"]
raw = "An impenetrable obstacle that also blocks irrigation and contamination. It's difficult to demolish and can injure those who attempt it."
status = "normal"
enUS = "An impenetrable obstacle that also blocks irrigation and contamination. It's difficult to demolish and can injure those who attempt it."
zhCN = "一个无法穿透的障碍，同时阻挡灌溉和污染。难以拆除，且可能伤害尝试拆除的人。"
zhTW = "一道不可穿透的障礙，並且會阻止灌溉和污染。拆除它十分困難，可能會傷害到企圖拆除的人。"
ruRU = "Непроходимое препятствие, которое также блокирует орошение и загрязнение. Его трудно демонтировать, и оно может повредить тех, кто попытается это сделать."
jaJP = "「侵入できない障害物で、灌漑と汚染も防ぎます。解体するのは難しく、それを試みる者を傷つけることもあります。」"
frFR = "Un obstacle impénétrable qui bloque également l'irrigation et la contamination. Il est difficile à démolir et peut blesser ceux qui essaient de le faire."
deDE = "Ein undurchdringliches Hindernis, das auch Bewässerung und Kontamination blockiert. Es ist schwierig abzureißen und kann diejenigen verletzen, die es versuchen."
plPL = "Niepprzenikniona przeszkoda, która jednocześnie blokuje nawadnianie i zanieczyszczenie. Trudno ją zburzyć i może zranić tych, którzy się tego podejmą."
ptBR = "Um obstáculo impenetrável que também bloqueia a irrigação e a contaminação. É difícil de demolir e pode ferir aqueles que tentam."
koKR = "압도적인 장애물로, 관개와 오염도 차단합니다. 철거가 어려우며 이를 시도하는 자에게 부상을 입힐 수 있습니다."
csCZ = "Nepřekonatelná překážka, která také blokuje zavlažování a kontaminaci. Je obtížné ji zbořit a může zranit ty, kteří se o to pokusí."
viVN = "Một chướng ngại vật không thể xuyên thủng, cũng ngăn chặn việc tưới tiêu và ô nhiễm. Nó khó bị phá hủy và có thể gây thương tích cho những ai cố gắng."
trTR = "Su ve kontaminasyonu da engelleyen, geçilemez bir engel. Yıkması zor ve bunu denemeye çalışanlara zarar verebilir."

