["Cadre.NiceWater.DeepCollector.Cite"]
raw = "\"The water comes from the land down under, where cattails grow and beaver's a plumber.\" —Ironxa0Teethxa0workxa0song"
status = "normal"
enUS = "\"The water comes from the land down under, where cattails grow and beavers are plumbers.\" —Ironxa0Teethxa0workxa0song"
zhCN = "“水来自南方的土地，那里长着香蒲，海狸是水管工。” —Ironxa0Teethxa0workxa0song"
zhTW = "「水來自下方的土地，蒲公英生長，海狸是水管工。」—Ironxa0Teethxa0工作歌曲"
ruRU = "\"Вода поступает из страны далеко на юге, где растут рогозы, и бобры — сантехники.\" —Ironxa0Teethxa0рабочаяxa0песня"
jaJP = "「水はオーストラリアの土地から来ていて、ガマが育ち、ビーバーが配管工をしている。」—Ironxa0Teethxa0workxa0song"
frFR = "\"L'eau vient du pays en bas, où poussent les quenouilles et le castor est plombier.\" —Ironxa0Teethxa0workxa0song"
deDE = "\"Das Wasser kommt aus dem Land down under, wo Schilfrohre wachsen und der Biber ein Klempner ist.\" —Ironxa0Teethxa0workxa0song"
plPL = "\"Woda pochodzi z kraju na dole, gdzie rośnie trzcina i bobry są hydraulikami.\" —Ironxa0Teethxa0piosenka xa0robotnicza"
ptBR = "\"A água vem da terra lá embaixo, onde os juncos crescem e o castor é um encanador.\" —Ironxa0Teethxa0workxa0song"
koKR = "\"물은 아래 땅에서 오며, 그곳에는 부들과 비버가 배관공으로 일합니다.\" — 아이언사 Teeth 작업 노래"
csCZ = "\"Voda pochází ze země dole, kde rostou rákosí a bobr je instalatér.\" —Ironxa0Teethxa0workxa0song"
viVN = "\"Nước đến từ vùng đất dưới, nơi có cây sậy phát triển và những con hải ly là thợ sửa ống nước.\" —Ironxa0Teethxa0bài hátxa0làmxa0việc"
trTR = "\"Su, ortada, kamışların yetiştiği ve kunduzların tesisatçı olduğu yerden geliyor.\" —Ironxa0Teethxa0workxa0song"

