["Cadre.Stairs.Cite"]
raw = "With the invention of stairs, beavers ascended to the next level."
status = "normal"
enUS = "With the invention of stairs, beavers ascended to the next level."
zhCN = "“随着楼梯的发明，海狸们达到了一个新高度。”"
zhTW = "隨著樓梯的發明，河狸們登上了新的高度。"
ruRU = "С изобретением лестниц бобры поднялись на новый уровень."
jaJP = "階段の発明により、ビーバーたちは次のレベルに昇りました。"
frFR = "Grâce à l'invention des escaliers, les castors sont montés au niveau supérieur."
deDE = "Mit der Erfindung von Treppen kamen die Biber auf die nächste Stufe."
plPL = " Dzięki wynalazkowi schodów, bobry wznosiły się na wyższy poziom."
ptBR = "Com a invenção das escadas, os castores ascenderam para o próximo nível."
koKR = "계단의 발명으로, 비버들은 다음 단계로 올라갔습니다."
csCZ = "S vynálezem schodů se bobři dostali na další úroveň."
viVN = "Với sự phát minh của cầu thang, những con nhím đã lên cấp độ tiếp theo."
trTR = "Merdivenlerin icadıyla, kunduzlar bir üst seviyeye yükseldi."

