raw = "Pumps and filters large amounts of water for beavers to drink. Vile Water contamination slows down its pumping speed."
status = "normal"
enUS = "Pumps and filters large amounts of water for beavers to drink. Contamination from Vile Water slows down its pumping speed."
zhCN = "“为海狸提供大量饮用水的抽水和过滤设备。污染的污水会减缓其抽水速度。”"
zhTW = "為海狸抽取和過濾大量飲用水。污水污染會降低其抽水速度。"
