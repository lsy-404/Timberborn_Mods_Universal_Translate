["Cadre.Tubeway.Cite"]
raw = "Two beavers colliding headfirst is cited as a source of some of the wackiest Iron Teeth inventions."
status = "normal"
enUS = "Two beavers colliding headfirst is cited as a source of some of the wackiest Iron Teeth inventions."
zhCN = "“两只海狸头碰头被认为是一些最疯狂的铁牙发明的来源。”"
zhTW = "兩隻海狸頭部相撞被認為是一些最古怪的鐵牙發明的來源。"
ruRU = "Столкновение двух бобров головой на встречу считается источником некоторых из самых странных изобретений Железных Зубов."
jaJP = "「頭をぶつけ合う二匹のビーバーは、最も奇抜なアイアンティースの発明の源として引用されている。」"
