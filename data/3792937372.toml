["Cadre.ReserveTank.Cite"]
raw = "\"Yes, it was sealed. Yes, it is fine to drink. You first.\" —Pina"
status = "normal"
enUS = "\"Yes, it was sealed. Yes, it is fine to drink. You first.\" —Pina"
zhCN = "“是的，它被封住了。是的，可以喝。你先来。” —皮娜"
zhTW = "“是的，它已被封住。是的，喝是可以的。你先。” —皮娜"
ruRU = "\"Да, он был запечатан. Да, его можно пить. Сначала ты.\" —Пина"
jaJP = "「うん、封印されていた。うん、飲んでも大丈夫だ。まずは君から。」—ピナ"
frFR = "\"Oui, c'était scellé. Oui, c'est bon à boire. Vous d'abord.\" —Pina"
deDE = "„Ja, es war versiegelt. Ja, es ist in Ordnung zu trinken. Du zuerst.“ —Pina"
plPL = "\"Tak, był zapieczętowany. Tak, można go pić. Ty pierwszy.\" —Pina"
ptBR = "\"Sim, estava selado. Sim, é seguro para beber. Você primeiro.\" —Pina"
koKR = "\"네, 봉인되었습니다. 네, 마셔도 괜찮습니다. 먼저 드세요.\" —피나"
csCZ = "„Ano, bylo to uzavřeno. Ano, je to v pořádku k pití. Ty první.“ —Pina"
viVN = "\"Vâng, nó đã được niêm phong. Vâng, nó có thể uống được. Bạn trước đi.\" —Pina"
trTR = "\"Evet, kapatıldı. Evet, içmekte bir sakınca yok. Önce sen.\" —Pina"

