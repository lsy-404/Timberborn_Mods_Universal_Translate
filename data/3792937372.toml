["Cadre.NaturalDamWeir.Cite"]
raw = "It's hard to believe there were simpler times when mud with branches constituted a dam."
status = "normal"
enUS = "It's hard to believe there were simpler times when mud with branches made up a dam."
zhCN = "很难相信曾经有过更简单的时代，当时泥土和树枝构成了大坝。"
zhTW = "很難相信曾經有過簡單的時代，泥土和樹枝構成了一座水壩。"
ruRU = "Трудно представить, что были более простые времена, когда грязь с ветками составляла dam."
jaJP = "泥と木の枝で構成されたダムが存在したシンプルな時代があったとは信じがたい。"
frFR = "Il est difficile de croire qu'il y avait des temps plus simples où de la boue avec des branches constituait un barrage."
deDE = "Es ist schwer zu glauben, dass es einfachere Zeiten gab, in denen Schlamm mit Ästen einen Damm darstellte."
plPL = "Trudno uwierzyć, że były prostsze czasy, gdy błoto z gałęziami stanowiło tamę."
ptBR = "É difícil acreditar que houve tempos mais simples quando barro com galhos constituía uma represa."
koKR = "나뭇가지로 이루어진 진흙이 댐을 구성하던 더 단순한 시절이 있었다는 것을 믿기 어렵다."
csCZ = "Těžko uvěřit, že byly jednodušší časy, kdy bahno se větvemi představovalo přehradu."
viVN = "Thật khó để tin rằng đã có những thời đơn giản hơn khi bùn với cành cây tạo thành một con đập."
trTR = "Çamur ve dalların bir baraj oluşturduğu daha basit zamanların olduğunu inanmak zor."

