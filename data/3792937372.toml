["Cadre.GreaseFactory.Cite"]
raw = "\"Well, a bot could be systematic, hydromatic... Why couldn't it be greased?\" —Ol' Kazko"
status = "normal"
enUS = "\"Well, a bot could be systematic, hydromatic... Why couldn't it be greased?\" —Ol' Kazko"
zhCN = "“嗯，机器人可以是系统化的，液压的……为什么不能润滑呢？” —老卡兹科"
zhTW = "「好吧，一個機器人可以是系統化的、水力動力的……為什麼不可以上油呢？」——老卡茲科"
ruRU = "\"Ну, бот может быть систематичным, гидравлическим... Почему бы ему не быть смазанным?\" —Старый Казко"
jaJP = "「まあ、ボットは体系的で、ハイドロマティックでもある…なぜ潤滑油を使わない？」 —オル・カズコ"
frFR = "\"Eh bien, un robot pourrait être systématique, hydromatique... Pourquoi ne pourrait-il pas être graissé ?\" —Ol' Kazko"
deDE = "„Nun, ein Bot könnte systematisch, hydromatisch sein... Warum könnte er nicht geschmiert sein?“ —Ol' Kazko"
plPL = "„Cóż, bot może być systematyczny, hydromatyczny... Czemu nie mógłby być naoliwiony?” —Ol' Kazko"
ptBR = "\"Bem, um robô poderia ser sistemático, hidromático... Por que não poderia ser lubrificado?\" —Ol' Kazko"
koKR = "\"음, 로봇은 체계적이고, 수조적일 수 있지... 왜 윤활유를 바를 수 없겠어?\" —올 카즈코"
csCZ = "\"Nuže, robot by mohl být systémový, hydromatický... Proč by nemohl být namazaný?\" —Ol' Kazko"
viVN = "\"À, một con robot có thể có hệ thống, hyđrô... Tại sao nó không thể được bôi trơn?\" —Ol' Kazko"
trTR = "\"Eh, bir bot sistematik, hidromatik olabilir... Neden yağlanmış olmasın?\" —Ol' Kazko"

