["Cadre.WoodenDam.Wall.Cite"]
raw = "Balanced, reinforced, and shaped to perfection by generations of beaver water engineers, this is not \"just a block of wood\"."
status = "normal"
enUS = "Balanced, reinforced, and shaped to perfection by generations of beaver water engineers, this is not just a block of wood."
zhCN = "“经过几代海狸水利工程师的平衡、加固和完美塑形，这不仅仅是‘一块木头’。”"
zhTW = "這不是「只是一塊木頭」，而是經過幾代海狸水工平衡、強化並形狀完美的作品。"
ruRU = "Сбалансированное, усиленное и отшлифованное до совершенства поколениями бобровых водных инженеров, это не \"просто кусок дерева\"."
jaJP = "「バランスが取れ、強化され、世代にわたるビーバーの水面技術者によって完璧に形成された、これは「ただの木の塊」ではない。」"
frFR = "Équilibré, renforcé et façonné à la perfection par des générations d'ingénieurs de l'eau castors, ceci n'est pas \"juste un bloc de bois\"."
deDE = "Ausgewogen, verstärkt und von Generationen von Biber-Wasseringenieuren zur Perfektion geformt, ist dies nicht „einfach nur ein Stück Holz“."
plPL = "Wyważony, wzmocniony i uformowany do perfekcji przez pokolenia bobrowych inżynierów wodnych, to nie jest 'po prostu kawałek drewna'."
ptBR = "Equilibrado, reforçado e moldado à perfeição por gerações de engenheiros de água castores, isso não é \"apenas um bloco de madeira\"."
koKR = "균형 잡히고, 보강되었으며, 수세대에 걸친 비버 수리공들에 의해 완벽하게 형성된 이것은 '그냥 나무 블록'이 아니다."
csCZ = "Vyvážené, vyztužené a tvarované k dokonalosti generacemi bobřích vodních inženýrů, toto není \"jen kus dřeva\"."
viVN = "Cân bằng, được gia cố và định hình hoàn hảo qua nhiều thế hệ kỹ sư nước của những chú hải ly, đây không chỉ là \"một khối gỗ\"."
trTR = "Deneyimli kunduz su mühendisleri tarafından dengeli, güçlendirilmiş ve mükemmelliğe şekillendirilmiş bu, \"sadece bir odun bloğu değil\"."

