["Cadre.GravityBattery.Desc"]
raw = "Stores power surplus and gives it back when its network is underpowered. The higher it is built, the more power it can store."
status = "normal"
enUS = "Stores power surplus and gives it back when its network is underpowered. The higher it is built, the more power it can store."
zhCN = "储存电力盈余，并在其网络电力不足时释放。建筑越高，它能储存的电量就越多。"
zhTW = "儲存電力盈餘，並在其網絡電力不足時回饋。建造得越高，儲存的電力就越多。"
ruRU = "Хранит излишки энергии и возвращает их, когда сеть испытывает недостаток мощности. Чем выше он построен, тем больше энергии может сохранить."
jaJP = "「余剰な電力を蓄え、ネットワークが電力不足の際にそれを供給します。建設するほど、より多くの電力を蓄えることができます。」"
frFR = "Stocke l'excès d'énergie et le restitue lorsque son réseau est sous-alimenté. Plus il est construit haut, plus il peut stocker d'énergie."
deDE = "Speichert überschüssige Energie und gibt sie zurück, wenn sein Netzwerk unterversorgt ist. Je höher es gebaut wird, desto mehr Energie kann es speichern."
plPL = "Przechowuje nadwyżkę energii i oddaje ją, gdy jego sieć jest niedoładowana. Im wyżej jest zbudowana, tym więcej energii może przechować."
ptBR = "Armazena o excesso de energia e a devolve quando sua rede está com pouca energia. Quanto mais alto for construído, mais energia pode armazenar."
koKR = "전력 잉여를 저장하고 네트워크의 전력이 부족할 때 다시 제공합니다. 건설 높이가 높을수록 저장할 수 있는 전력이 더 많습니다."
