["Cadre.Dynamite.1.Cite"]
raw = "Some extreme measures were needed to adapt to the post-apocalyptic world."
status = "normal"
enUS = "Some extreme measures were needed to adapt to the post-apocalyptic world."
zhCN = "在后启示录的世界中，需要采取一些极端措施来适应。"
zhTW = "為適應後末日世界，需要採取一些極端措施。"
ruRU = "Для адаптации к постапокалиптическому миру были необходимы крайние меры."
jaJP = "終末後の世界に適応するためには、いくつかの極端な手段が必要でした。"
frFR = "Des mesures extrêmes étaient nécessaires pour s'adapter au monde post-apocalyptique."
deDE = "Einige extreme Maßnahmen waren notwendig, um sich an die post-apokalyptische Welt anzupassen."
plPL = "Niektóre skrajne środki były potrzebne, aby przystosować się do postapokaliptycznego świata."
ptBR = "Algumas medidas extremas foram necessárias para se adaptar ao mundo pós-apocalíptico."
koKR = "포스트 아포칼립스 세계에 적응하기 위해서는 극단적인 조치가 필요했다."
csCZ = "Bylo zapotřebí některých extrémních opatření, abychom se přizpůsobili postapokalyptickému světu."
viVN = "Cần có một số biện pháp cực đoan để thích ứng với thế giới hậu tận thế."
trTR = "Post-apokaliptik dünyaya uyum sağlamak için bazı aşırı önlemler almak gerekiyordu."

["Cadre.EarthRecultivator.Folktails.Desc"]
raw = "Distributes tree seeds across the Earth. When launched, makes the beavers in the area extra happy."
status = "normal"
enUS = "Distributes tree seeds across the Earth. When launched, it makes the beavers in the area extra happy."
zhCN = "“在大地上分发树种。发射时，会让该区域的海狸们更加快乐。”"
zhTW = "在地球上分發樹種。啟動時，會使該區域的海狸特別快樂。"
ruRU = "Распространяет семена деревьев по Земле. При запуске делает бобров в окрестностях особенно счастливыми."
jaJP = "「地球全体に樹木の種を配布します。発動すると、その地域のビーバーたちを特に幸せにします。」"
frFR = "Distribue des graines d'arbres à travers la Terre. Lors de son lancement, rend les castors de la zone particulièrement heureux."
deDE = "Verbreitet Baum-Samen über die Erde. Wenn es gestartet wird, macht es die Biber in der Umgebung besonders glücklich."
plPL = "Rozprowadza nasiona drzew po Ziemi. Po użyciu sprawia, że bobry w okolicy są szczególnie szczęśliwe."
ptBR = "Distribui sementes de árvores pela Terra. Quando ativado, deixa os castores na área ainda mais felizes."
koKR = "지구에 나무 씨앗을 분배합니다. 발동 시, 해당 지역의 비버들을 더욱 행복하게 만듭니다."
csCZ = "Rozmisťuje semena stromů po Zemi. Když je spuštěn, dělá bobry v oblasti extra šťastnými."
viVN = "Phân phối hạt giống cây trên khắp Trái Đất. Khi được khởi động, khiến những con gấu trong khu vực thêm phần hạnh phúc."
trTR = "Yeryüzüne ağaç tohumları dağıtır. Çalıştırıldığında, bölgedeki kunduzları ekstra mutlu eder."

