["Cadre.SteamEngine.Cite"]
raw = "As great as this invention is, it became a splinter in the side of beaver nations other than Iron Teeth."
status = "normal"
enUS = "As great as this invention is, it became a thorn in the side of beaver nations other than Iron Teeth."
zhCN = "“虽然这项发明非常出色，但它却成为了除了铁齿以外的海狸国家的一个刺。”"
zhTW = "儘管這項發明非常出色，但它成為了除鐵牙外的其他海狸國的刺痛。"
ruRU = "Какой бы великой ни была эта разработка, она стала занозой для бобровых наций, кроме Железных Зубов."
jaJP = "「この発明は素晴らしいが、アイアンティース以外のビーバー国家にとっては悩みの種となった。」"
frFR = "Aussi géniale que soit cette invention, elle est devenue une écharde dans le flanc des nations de castors autres que les Dents de Fer."
deDE = "So großartig diese Erfindung auch ist, sie wurde zum Dorn im Auge der Biber-Nationen außer den Eisenzähnen."
plPL = "Tak wspaniałe, jak to wynalazek, stało się cierniem w boku narodów bobrów innych niż Żelazne Zęby."
ptBR = "Por mais incrível que essa invenção seja, ela se tornou uma farpa no lado das nações de castores além dos Dentes de Ferro."
koKR = "이 발명품이 얼마나 훌륭하든, 그것은 철니 달린 비버 국가들 이외의 비버 국가들에게는 가시가 되었다."
csCZ = "Ať je tento vynález sebekrásnější, stal se trnem v oku bobřích národů kromě Železných Zubů."
viVN = "Mặc dù phát minh này thật tuyệt vời, nhưng nó đã trở thành một cái gai trong mắt các quốc gia beaver khác ngoài Bàn Chân Sắt."
trTR = "Bu icat ne kadar harika olsa da, Demir Dişler dışındaki kunduz uluslarının gözünde bir diken haline geldi."

