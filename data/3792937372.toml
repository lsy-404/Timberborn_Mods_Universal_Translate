["Cadre.Gearmill.Cite"]
raw = "\"Wooden gear's solid!\" was a catchphrase coined by Ol' Kazko as he pushed for rapid industrialization."
status = "normal"
enUS = "\"Wooden gear's solid!\" was a catchphrase coined by Ol' Kazko as he pushed for rapid industrialization."
zhCN = "“‘木制齿轮坚固！’是老卡兹科为了推动快速工业化而创造的口号。”"
zhTW = "「『木製齒輪堅固！』是老卡茲科推動快速工業化時所創造的口號。」"
ruRU = "«Деревянные шестеренки надежны!» — это слоган, придуманный Старым Казко, когда он выступал за быструю индустриализацию."
jaJP = "「木製のギアは頑丈だ！」は、オル・カズコが急速な工業化を推進する際に生み出したキャッチフレーズです。"
frFR = "« La solidité de l'engrenage en bois ! » était une phrase emblématique inventée par Ol' Kazko alors qu'il plaidait pour une industrialisation rapide."
deDE = "„Das Holzrad ist stabil!“ war ein geflügeltes Wort, das Ol' Kazko prägte, während er sich für eine schnelle Industrialisierung einsetzte."
plPL = "„Solidna drewniana zębatka!” to hasło wymyślone przez Ol' Kazko, gdy nawoływał do szybkiej industrializacji."
ptBR = "\"O engrenagem de madeira é sólida!\" foi um jargão criado pelo Velho Kazko enquanto ele defendia a rápida industrialização."
koKR = "\"목재 기어가 튼튼하다고!\"는 올 카즈코가 빠른 산업화를 촉구하며 만든 유행어였다."
csCZ = "„Dřevěné součástky jsou pevné!“ byla fráze, kterou vymyslel Ol' Kazko, když prosazoval rychlou industrializaci."
viVN = "\"Cái bánh răng gỗ chắc chắn!\" là một câu nói phổ biến do Ol' Kazko tạo ra khi ông thúc đẩy tốc độ công nghiệp hóa."
trTR = "\"Ahşap dişlinin sağlamdır!\" ifadesi, hızlı sanayileşmeyi savunan Ol' Kazko tarafından türetilmiştir."

