["Cadre.TradeCenter.Desc"]
raw = "Balances goods between the two connected towns. Each side has workers who distribute goods between the Town Crossing and the rest of the town."
status = "normal"
enUS = "Balances goods between the two connected towns. Each side has workers who distribute goods between the Town Crossing and the rest of the town."
zhCN = "“在两个相连的城镇之间平衡货物。每一侧都有工人，他们在城镇交叉口与城镇的其他部分之间分配货物。”"
zhTW = "在兩個連接的城鎮之間平衡商品。每一方都有工人負責在城鎮交匯處和城鎮的其他部分之間分配商品。"
ruRU = "Сбалансирует товары между двумя связанными городами. С каждой стороны есть работники, которые распределяют товары между Перекрёстком и остальной частью города."
jaJP = "「接続された2つの町の間で商品をバランスさせます。各側には、タウン・クロッシングと町の他の部分間で商品を配布する労働者がいます。」"
frFR = "Équilibre les biens entre les deux villes connectées. Chaque côté a des travailleurs qui distribuent les biens entre le Passage de la Ville et le reste de la ville."
deDE = "Balanciert Güter zwischen den beiden verbundenen Städten. Jede Seite hat Arbeiter, die Güter zwischen dem Stadtübergang und dem Rest der Stadt verteilen."
plPL = "Równoważy towary pomiędzy dwoma połączonymi miastami. Każda strona ma pracowników, którzy rozdzielają towary pomiędzy Przejściem Miejskim a resztą miasta."
ptBR = "Equilibra os bens entre as duas cidades conectadas. Cada lado possui trabalhadores que distribuem os bens entre a Travessia da Cidade e o restante da cidade."
koKR = "두 개의 연결된 마을 사이에서 상품의 균형을 맞춥니다. 각 쪽에는 마을 횡단과 나머지 마을 사이에서 상품을 분배하는 근로자가 있습니다."
csCZ = "Vyvažuje zboží mezi dvěma propojenými městy. Na každé straně jsou pracovníci, kteří distribují zboží mezi Městským přechodem a zbytkem města."
viVN = "Cân bằng hàng hóa giữa hai thị trấn kết nối. Mỗi bên đều có công nhân phân phối hàng hóa giữa Điểm Băng Chéo và phần còn lại của thị trấn."
trTR = "İki bağlı kasaba arasında malları dengeler. Her iki tarafın, Kasaba Geçidi ile kasabanın geri kalanı arasında malları dağıtan işçileri vardır."

