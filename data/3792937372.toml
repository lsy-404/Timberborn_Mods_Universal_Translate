ruRU = "Освежающий поток речной воды, чтобы намочить мех."
jaJP = "「毛を濡らすための川の水の爽快な噴射。」"
frFR = "Une rafale rafraîchissante d'eau de rivière pour mouiller son pelage."
deDE = "Ein erfrischender Wasserstrahl aus dem Fluss, um das Fell zu befeuchten."
plPL = "Orzeźwiający strumień wody rzeczej, aby zwilżyć futro."
ptBR = "Uma explosão refrescante de água do rio para molhar o pelo."
koKR = "털을 적시기 위한 신선한 강물의 폭발."
csCZ = "Osvěžující sprška říční vody, aby se navlhčila srst."
