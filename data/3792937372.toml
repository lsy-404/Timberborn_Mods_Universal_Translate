["Cadre.AdvancedBreedingPod.Desc"]
raw = "Utilizes an advanced breeding process to produce adult beavers, eager to get to work."
status = "normal"
enUS = "Utilizes an advanced breeding process to produce adult beavers, eager to get to work."
zhCN = "使用先进的繁殖过程生产成年海狸，热切准备投入工作。"
zhTW = "利用先進的繁殖過程來產生成年人類海狸，熱切準備投入工作。"
ruRU = "Использует продвинутый процесс размножения для получения взрослых бобров, готовых к работе."
jaJP = "高度な繁殖プロセスを利用して、働くことに意欲的な成獣のビーバーを生産します。"
frFR = "Utilise un processus de reproduction avancé pour produire des castors adultes, impatients de se mettre au travail."
deDE = "Nutzt einen fortschrittlichen Zuchtprozess, um erwachsene Biber zu produzieren, die bereit sind, an die Arbeit zu gehen."
plPL = "Wykorzystuje zaawansowany proces hodowlany do produkcji dorosłych bobrów, gotowych do pracy."
ptBR = "Utiliza um processo de reprodução avançado para produzir castores adultos, prontos para trabalhar."
koKR = "성숙한 비버를 생산하기 위해 고급 번식 과정을 활용하며, 일할 준비가 되어 있습니다."
csCZ = "Využívá pokročilý reprodukční proces k výrobě dospělých bobrů, kteří se chtějí pustit do práce."
viVN = "Sử dụng một quy trình sinh sản tiên tiến để sản xuất những con hải ly trưởng thành, sẵn sàng để bắt đầu làm việc."
trTR = "Yetişkin kunduzlar üretmek için gelişmiş bir üreme süreci kullanır, çalışmaya hazırlar."

