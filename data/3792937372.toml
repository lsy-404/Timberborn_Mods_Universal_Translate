["Cadre.VileWaterSource.Cite"]
raw = "\"Why do we have to clean up the hoomans' mess? Oh,xa0right, they're all dead.\" —Pina"
status = "normal"
enUS = "\"Why do we have to clean up the humans' mess? Oh, right, they're all dead.\" —Pina"
zhCN = "“我们为什么要清理人类的垃圾？哦，对了，他们都死了。” —皮纳"
zhTW = "「我們為什麼要清理人類的爛攤子？哦，對了，他們都死了。」—皮娜"
ruRU = "«Почему мы должны убирать за вредителями? О, точно, они все мертвы.» —Пина"
jaJP = "「なぜ私たちがホーマンズのゴミを掃除しなければならないの？ああ、そうか、彼らはみんな死んでしまった。」 — ピナ"
frFR = "\"Pourquoi devons-nous nettoyer le désordre des humains ? Oh, c'est vrai, ils sont tous morts.\" —Pina"
deDE = "„Warum müssen wir das Durcheinander der Menschen aufräumen? Oh, richtig, sie sind alle tot.“ —Pina"
plPL = "\"Dlaczego musimy sprzątać bałagan hoomanów? A, prawda, wszyscy nie żyją.\" —Pina"
ptBR = "\"Por que temos que limpar a bagunça dos humanos? Ah, certo, eles estão todos mortos.\" —Pina"
koKR = "\"왜 우리가 인간의 엉망진창을 치워야 하지? 아, 맞다, 그들은 모두 죽었지.\" —피나"
csCZ = "\"Proč musíme uklízet nepořádek po hoomech? Jo, jasně, jsou všichni mrtví.\" —Pina"
viVN = "\"Tại sao chúng ta phải dọn dẹp đống hỗn độn của bọn người? À, đúng rồi, bọn họ đều đã chết.\" —Pina"
trTR = "\"Neden insanların dağınıklığını temizlemek zorundayız? Ah, doğru, hepsi ölmüş.\" —Pina"

