frFR = "Bien sûr, nous mangeons du poisson. N'écoutez pas ce weirdo."
deDE = "Natürlich essen wir Fisch. Glaub nicht diesem Freak."
plPL = "Oczywiście, że jemy ryby. Nie słuchaj tego dziwaka."
ptBR = "Claro que comemos peixe. Não escute aquele esquisito."
koKR = "물론 우리는 물고기를 먹어요. 그런 이상한 사람 말은 듣지 마세요."
csCZ = "Samozřejmě jíme ryby. Neposlouchejte toho podivína"
viVN = "Chúng tôi tất nhiên ăn cá. Đừng nghe tên kỳ quặc đó."
trTR = "“Elbette balık yeriz. O tuhaf adama kulak asma.”"

