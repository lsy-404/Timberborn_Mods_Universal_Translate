ruRU = "Отправляет сигнал под управлением человека. Отличный первый шаг к автоматизации поселения."
jaJP = "手動で制御される信号を送ります。集落を自動化するための素晴らしい第一歩です。"
frFR = "Envoie un signal contrôlé manuellement. Un excellent premier pas vers l'automatisation d'un établissement."
deDE = "Sendet ein manuell gesteuertes Signal. Ein großartiger erster Schritt in Richtung Automatisierung einer Siedlung."
plPL = "Wysyła ręcznie kontrolowany sygnał. Doskonały pierwszy krok w kierunku automatyzacji osady."
ptBR = "Envia um sinal controlado manualmente. Um ótimo primeiro passo para automatizar um assentamento."
koKR = "수동으로 제어되는 신호를 보냅니다. 정착지를 자동화하기 위한 훌륭한 첫걸음입니다."
