["Cadre.Bakery.Cite"]
raw = "\"Nothing like a hot bun with a little sawdust sprinkled on top.\" —Ma' Ngonel"
status = "normal"
enUS = "\"Nothing like a hot bun with a little sawdust sprinkled on top.\" —Ma' Ngonel"
zhCN = "“没有什么比一块热乎乎的面包加上一点儿锯末更美味了。” —马·恩戈内尔"
zhTW = "「沒有什麼比熱乎乎的麵包上灑了一點木屑更好的了。」—馬·然戈奈爾"
ruRU = "\"Нет ничего лучше горячей булочки с немного опилок сверху.\" —Ма' Нгонел"
