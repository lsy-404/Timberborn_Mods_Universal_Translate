ptBR = "Bombeia e filtra grandes quantidades de água para os castores beberem. A contaminação por Água Vile reduz sua velocidade de bombeamento."
koKR = "비버가 마실 수 있도록 대량의 물을 펌핑하고 필터링합니다. 불결한 물의 오염은 펌핑 속도를 저하시킵니다."
csCZ = "Pumpy a filtry velké množství vody pro bobry k pití. Kontaminace odpornou vodou zpomaluje rychlost čerpání."
viVN = "Bơm và lọc một lượng lớn nước cho những chú rái cá uống. Ô nhiễm nước độc hại làm chậm tốc độ bơm nước."
