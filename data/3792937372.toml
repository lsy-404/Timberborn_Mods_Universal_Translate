["Cadre.Ruins.Cite"]
raw = "Scattered throughout the land, decrepit human ruins provided beavers with the unimaginable - a good superior to wood."
status = "normal"
enUS = "Scattered throughout the land, decrepit human ruins provided beavers with the unimaginable - a better alternative to wood."
zhCN = "遍布在土地上的破旧人类遗迹为海狸们提供了不可思议的东西——一种优于木材的良好材料。"
zhTW = "散佈在這片土地上，破舊的人類遺跡為海狸提供了不可想象的東西——一種優於木頭的良好材料。"
ruRU = "Рассеянные по всей земле, обветшалые человеческие руины предоставили бобрам невообразимое - хороший заменитель древесины."
jaJP = "「土地の至る所に散らばる古びた人間の遺跡は、ビーバーたちに想像を超えるものを提供した - 木を上回る良質な代物。」"
frFR = "Éparpillées à travers le pays, de décrépites ruines humaines ont offert aux castors l'impensable : un bien supérieur au bois."
deDE = "Über das Land verstreut bieten verfallene menschliche Ruinen den Bibern das Unvorstellbare - einen besseren Rohstoff als Holz."
plPL = "Rozrzucone po całym kraju, zniszczone ludzkie ruiny dostarczyły bobrom tego, co nie do pomyślenia - lepszego surowca niż drewno."
ptBR = "Espalhadas pela terra, ruínas humanas decrépitas proporcionaram aos castores o inimaginável - uma matéria-prima superior à madeira."
koKR = "땅 곳곳에 흩어져 있는 폐허가 된 인간 유적은 비버에게 상상할 수 없는 것을 제공했습니다 - 나무보다 더 나은 자원입니다."
csCZ = "Roztroušené po celé zemi, zchátralé lidské ruiny poskytly bobrům něco nepředstavitelného - kvalitnější surovinu než dřevo."
viVN = "Nằm rải rác khắp vùng đất, những tàn tích hư hỏng của con người đã mang đến cho những chú hải ly điều không tưởng - một nguồn vật liệu tốt hơn gỗ."
trTR = "Ülkenin dört bir yanına dağılmış, harabe halindeki insan kalıntıları, kunduzlara hayal edilemez bir şeyi sağladı - ahşaptan daha iyi bir malzeme."

["Cadre.Scarecrow.Desc"]
raw = "A field decoration once meant to scare birds now brings delight to young and old alike."
status = "normal"
enUS = "A field decoration once meant to scare birds now brings delight to young and old alike."
zhCN = "曾经用来吓跑鸟类的田间装饰，如今给老少带来了欢乐。"
zhTW = "這個曾經用來驅嚇鳥類的農田裝飾，現在卻給大小朋友帶來了喜悅。"
ruRU = "Полевое украшение, когда-то предназначавшееся для исп scare птиц, теперь приносит радость как молодым, так и старым."
jaJP = "「かつて鳥を scareるためのフィールド装飾が、今では若者も大人も喜ばせるものとなった。」"
frFR = "Une décoration de champ autrefois destinée à effrayer les oiseaux qui apporte maintenant de la joie aux jeunes comme aux moins jeunes."
deDE = "Eine Felddekoration, die einst dazu gedacht war, Vögel zu vertreiben, erfreut nun Jung und Alt gleichermaßen."
plPL = "Pole dekoracyjne, które kiedyś miało odstraszać ptaki, teraz przynosi radość zarówno młodym, jak i starszym."
ptBR = "Uma decoração de campo que antes servia para espantar pássaros agora traz alegria a jovens e idosos."
koKR = "한때 새들을 쫓기 위해 만들어진 들판 장식은 이제 어린이와 어른 모두에게 기쁨을 선사합니다."
csCZ = "Pole dekorace, která byla kdysi určena k zastrašování ptáků, nyní přináší radost mladým i starým."
viVN = "Một vật trang trí cánh đồng từng được dùng để dọa chim giờ đây mang lại niềm vui cho cả trẻ em và người lớn."
trTR = "Bir zamanlar kuşları korkutmak için tasarlanmış bir tarla süslemesi, şimdi gençten yaşlıya herkese keyif veriyor."

