["Cadre.SwimmingPoll.Cite"]
raw = "\"That's a really good time but we should work on your tailstroke!\" —Pina"
status = "normal"
enUS = "\"That's a really good time but we should work on your tailstroke!\" —Pina"
zhCN = "“这真是个好时机，但我们应该改善你的尾巴划水！” —皮娜"
zhTW = "「那真是個好時光，但我們應該改善你的尾划！」—皮娜"
