["Cadre.Carousel.Cite"]
raw = "\"Where do you think you're going, kit? These branches won't peel themselves.\" —Ma' Ngonel"
status = "normal"
enUS = "\"Where do you think you're going, kit? These branches won't peel themselves.\" —Ma' Ngonel"
zhCN = "“你觉得你要去哪儿，小家伙？这些树枝可不会自己剥落。”—马·恩贡尔"
zhTW = "「你以為你要去哪裡，小鬼？這些樹枝不會自己剝皮。」—瑪·恩戈內爾"
ruRU = "\"Куда ты, маленький, собираешься? Эти ветки сами себя не очистят.\" —Ма' Нгонель"
jaJP = "「どこに行くつもりなの、子供？この枝は自分で剥けないんだから。」 —マ・ンゴネル"
frFR = "\"Où crois-tu aller, petit ? Ces branches ne vont pas s'écorcer toutes seules.\" —Ma' Ngonel"
deDE = "\"Wo glaubst du, hingehen zu können, Kleine? Diese Äste schälen sich nicht von selbst.\" —Ma' Ngonel"
plPL = "\"Gdzie myślisz, że idziesz, maluchu? Te gałęzie same się nie obierają.\" —Ma' Ngonel"
ptBR = "\"Aonde você pensa que está indo, filhote? Esses galhos não vão se descascar sozinhos.\" —Ma' Ngonel"
koKR = "\"어디 가는 거니, 어린 것? 이 가지들은 저절로 벗겨지지 않아.\" —마 '응곤엘"
csCZ = "\"Kam myslíš, že jdeš, prcku? Tohle větve se nepohodí samy.\" —Ma' Ngonel"
viVN = "\"Bạn nghĩ mình đi đâu vậy, nhóc? Những cành cây này không tự lột ra đâu.\" —Ma' Ngonel"
trTR = "\"Nereye gittiğini sanıyorsun, yavru? Bu dallar kendiliğinden soyulmayacak.\" —Ma' Ngonel"

