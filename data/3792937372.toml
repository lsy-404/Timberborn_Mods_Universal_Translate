["Cadre.BotAssembler.Cite"]
raw = "It all started with a simple \"what if I didn't have to work today\". —Pina"
status = "normal"
enUS = "It all started with a simple 'what if I didn't have to work today.' —Pina"
zhCN = "“一切都始于一个简单的“如果今天我不必工作会怎么样”。 —皮纳”"
