enUS = "To keep things practical, decorations should be both attractive and delicious."
zhCN = "为了保持实用性，装饰既要美观又要美味。"
zhTW = "為了保持實用，裝飾應該既美觀又美味。"
ruRU = "Чтобы сохранить практичность, украшения должны быть как красивыми, так и вкусными."
