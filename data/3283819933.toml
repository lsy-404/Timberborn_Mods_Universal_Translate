["GreedyBuilders.description"]
raw = "The greed of these beavers leaves their tools in a mess..."
status = "normal"
enUS = "The greed of these beavers leaves their tools in a mess..."
zhCN = "经过友好磋商，神尾与铁牙决定建立共同居住示范区，尝试走出一条可持续发展的道路。<br>神尾种族的绿色环保与铁牙种族的科学工艺在这里实现了和谐交融。<br>座右铭：<i>绿水青山就是金山银山。</i>"
zhTW = "這些海狸的貪婪使他們的工具一團糟……"
ruRU = "Жадность этих бобров оставляет их инструменты в беспорядке..."
jaJP = "これらのビーバーの貪欲さが彼らの道具をめちゃくちゃにする…"
frFR = "La cupidité de ces castors laisse leurs outils en désordre..."
deDE = "Die Gier dieser Biber hinterlässt ihre Werkzeuge in einem Chaos..."
plPL = "Chciwość tych bobrów pozostawia ich narzędzia w bałaganie..."
ptBR = "A ganância desses castores deixa suas ferramentas em uma bagunça..."
koKR = "이 비버들의 탐욕은 그들의 도구를 엉망으로 남깁니다..."
trTR = "Bu kunduzların açgözlülüğü aletlerini bir karmaşaya bırakıyor..."
esES = "La avaricia de estos castores deja sus herramientas hechas un desastre..."
itIT = "L'avidità di questi castori lascia i loro attrezzi in un gran disordine..."
ukUA = "Жадібність цих бобрів залишає їхні інструменти в безладі..."
thTH = "ความโลภของบีเวอร์เหล่านี้ทำให้เครื่องมือของพวกมันรกรุงรัง..."
csCZ = "Chamtivost těchto bobrů zanechává jejich nástroje v chaosu..."
viVN = "Sự tham lam của những con hải ly này khiến dụng cụ của chúng trở nên lộn xộn..."
caES = "La cobdícia d'aquests castors deixa les seves eines fetes un desastre..."
beBY = "Жаднасць гэтых бабраў прывяла да таго, што іх інструменты ўсе ў бардаку..."
roRO = "Lăcomia acestor castori lasă uneltele lor într-o adevărată harababură..."
huHU = "A ezek a hódok kapzsisága miatt az eszközeik rendetlenül hevernek szerteszét..."
arSA = "جشع هؤلاء القنادس يترك أدواتهم في فوضى..."

