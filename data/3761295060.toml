["LV.CBlt.Update120"]
raw = "- This mod now requires Moddable Tool Groups. Moved conveyor buildings into their own group under Storage.\n- Belts can no longer transport liquids for either faction. Use Timber Pipe for liquids transportation.\n- Improved the processing code to match Timber Pipe, which should improve performance and support more buildings."
status = "normal"
enUS = "- This mod now requires Moddable Tool Groups. Conveyor buildings have been moved into their own group under Storage.\n- Belts can no longer transport liquids for either faction. Use Timber Pipe to transport liquids.\n- The processing code has been improved to match Timber Pipe, which should improve performance and support more buildings."
zhCN = "- 此模组现在需要 Moddable Tool Groups。输送带建筑已移至「储存」下的独立分组。\n- 两个派系的输送带都不再能运输液体。液体运输请使用 Timber Pipe。\n- 已改进处理代码，使其与 Timber Pipe 保持一致，这应该能提升性能并支持更多建筑。"
zhTW = "- 此模組現在需要 Moddable Tool Groups。已將輸送帶建築移至「儲存」下方的獨立群組。\n- 兩個派系的輸送帶都不再能運輸液體。液體運輸請使用 Timber Pipe。\n- 已改良處理程式碼，使其與 Timber Pipe 一致，應能提升效能並支援更多建築物。"
ruRU = "- Для этого мода теперь требуется Moddable Tool Groups. Здания с конвейерами перемещены в отдельную группу в разделе «Хранилища».\n- Конвейеры больше не могут перевозить жидкости ни у одной из фракций. Для перевозки жидкостей используйте Timber Pipe.\n- Код обработки улучшен и приведён в соответствие с Timber Pipe. Это должно повысить производительность и обеспечить поддержку большего числа зданий."
jaJP = "- この Mod の使用には Moddable Tool Groups が必要になりました。コンベヤーの建物を「貯蔵」内の専用グループに移動しました。\n- どちらの派閥でも、ベルトで液体を輸送できなくなりました。液体の輸送には Timber Pipe を使用してください。\n- 処理コードを Timber Pipe に合わせて改善しました。これにより、パフォーマンスが向上し、より多くの建物に対応できるはずです。"
frFR = "- Ce mod nécessite désormais Moddable Tool Groups. Les bâtiments de convoyage ont été déplacés dans leur propre groupe, sous Stockage.\n- Les tapis roulants ne peuvent plus transporter de liquides pour aucune des deux factions. Utilisez Timber Pipe pour le transport des liquides.\n- Le code de traitement a été amélioré pour correspondre à celui de Timber Pipe, ce qui devrait améliorer les performances et prendre en charge davantage de bâtiments."
deDE = "- Für diese Mod wird jetzt Moddable Tool Groups benötigt. Förderbandgebäude wurden in eine eigene Gruppe unter Lager verschoben.\n- Förderbänder können für keine der beiden Fraktionen mehr Flüssigkeiten transportieren. Verwende Timber Pipe für den Flüssigkeitstransport.\n- Der Verarbeitungscode wurde an Timber Pipe angepasst, was die Leistung verbessern und mehr Gebäude unterstützen sollte."
plPL = "- Ten mod wymaga teraz moda Moddable Tool Groups. Budynki związane z przenośnikami zostały przeniesione do osobnej grupy w sekcji Magazynowanie.\n- Taśmy nie mogą już transportować cieczy dla żadnej z frakcji. Do transportu cieczy użyj rur Timber Pipe.\n- Ulepszono kod przetwarzania, aby odpowiadał temu z moda Timber Pipe, co powinno poprawić wydajność i umożliwić obsługę większej liczby budynków."
ptBR = "- Este mod agora requer Moddable Tool Groups. Os edifícios de esteira foram movidos para um grupo próprio, em Armazenamento.\n- As esteiras não podem mais transportar líquidos para nenhuma das facções. Use Timber Pipe para transportar líquidos.\n- O código de processamento foi aprimorado para se alinhar ao Timber Pipe, o que deve melhorar o desempenho e oferecer suporte a mais edifícios."
koKR = "- 이제 이 모드에는 Moddable Tool Groups가 필요합니다. 컨베이어 건물을 저장소 아래의 별도 그룹으로 옮겼습니다.\n- 이제 어느 세력에서도 벨트로 액체를 운반할 수 없습니다. 액체를 운반하려면 Timber Pipe를 사용하세요.\n- 처리 코드를 Timber Pipe에 맞게 개선했습니다. 성능이 향상되고 더 많은 건물을 지원할 것입니다."
csCZ = "- Tento mod nyní vyžaduje Moddable Tool Groups. Budovy s dopravníky byly přesunuty do vlastní skupiny v kategorii Skladování.\n- Dopravní pásy už nemohou přepravovat kapaliny ani pro jednu z frakcí. K přepravě kapalin použijte Timber Pipe.\n- Kód zpracování byl vylepšen tak, aby odpovídal Timber Pipe. To by mělo zlepšit výkon a umožnit podporu více budov."
viVN = "- Bản mod này hiện yêu cầu Moddable Tool Groups. Các công trình băng chuyền đã được chuyển vào nhóm riêng bên dưới Kho chứa.\n- Băng chuyền không còn vận chuyển chất lỏng cho cả hai phe. Hãy dùng Timber Pipe để vận chuyển chất lỏng.\n- Đã cải thiện mã xử lý để khớp với Timber Pipe, giúp tăng hiệu năng và hỗ trợ nhiều công trình hơn."
trTR = "- Bu mod artık Moddable Tool Groups modunu gerektiriyor. Konveyör yapıları, Storage altında kendi gruplarına taşındı.\n- Bantlar artık hiçbir grup için sıvı taşıyamıyor. Sıvı taşımak için Timber Pipe kullanın.\n- İşleme kodu, Timber Pipe ile uyumlu olacak şekilde iyileştirildi; bu, performansı artırmalı ve daha fazla yapıyı desteklemeli."

