["LV.CBlt.ConveyorBeltFlavor"]
raw = "Folktail engineers say it was inspired by watching logs roll downhill."
status = "normal"
enUS = "Folktail engineers say it was inspired by watching logs roll downhill."
zhCN = "“民间工程师称这是受到观察木头下坡滚动的启发。”"
zhTW = "「民間工程師表示，這是受到看著原木下坡的啟發。」"
ruRU = "Инженеры Фолктейла говорят, что это было вдохновлено наблюдением за тем, как бревна катятся вниз по склону."
jaJP = "「フォークテイルの技術者たちは、丸太が坂を転がるのを見てインスパイアされたと言っています。」"
frFR = "Les ingénieurs folktail disent qu'il a été inspiré par l'observation des rondins rouler en descendant la colline."
deDE = "Die Ingenieure der Folktail sagen, dass es inspiriert wurde, indem sie zusahen, wie Baumstämme den Hang hinunterrollen."
plPL = "Inżynierowie Folktail twierdzą, że zainspirowała ich obserwacja toczących się w dół pni."
ptBR = "Os engenheiros Folktail dizem que foi inspirado ao ver troncos rolando ladeira abaixo."
koKR = "포크테일 엔지니어들은 이 아이디어가 나무가 경사면을 굴러 내려가는 모습을 보면서 영감을 받았다고 말합니다."
csCZ = "Inženýři z Folktailu říkají, že to bylo inspirováno tím, jak se klády kutálejí z kopce."
viVN = "Các kỹ sư Folktail nói rằng nó được lấy cảm hứng từ việc quan sát những khúc gỗ lăn xuống dốc."
trTR = "Folktail mühendisleri, bunun yokuş aşağı yuvarlanan tomrukları izlemekten ilham aldıklarını söylüyorlar."

["LV.CBlt.SmartConveyorBeltFlavor"]
raw = "The belt knows what it wants. The rejected goods take it personally."
status = "normal"
enUS = "The belt knows what it wants. The rejected goods take it personally."
zhCN = "“这条输送带知道它想要什么。被拒绝的货物对此感到很受伤。”"
zhTW = "這條傳送帶知道它想要什麼。被拒絕的貨物會因此感到受到冒犯。"
ruRU = "Лента знает, чего хочет. Отказанные товары воспринимают это на свой счёт."
jaJP = "ベルトは自分の望みを知っている。拒否された商品はそれを個人的に受け止める。"
frFR = "La ceinture sait ce qu'elle veut. Les marchandises rejetées le prennent personnellement."
deDE = "Das Band weiß, was es will. Die abgelehnten Waren nehmen es persönlich."
plPL = "Pasy wiedzą, czego chcą. Odrzucone towary traktują to osobiście."
ptBR = "A correia sabe o que quer. Os produtos rejeitados levam isso para o lado pessoal."
koKR = "벨트는 자신이 원하는 것을 알고 있습니다. 거부된 상품은 이를 개인적으로 받아들입니다."
csCZ = "Pás ví, co chce. Odmítnuté zboží to bere osobně."
viVN = "Băng chuyền biết nó muốn gì. Hàng hóa bị từ chối cảm thấy bị tổn thương."
trTR = "Bant ne istediğini biliyor. Reddedilen mallar bunu kişisel alıyor."

