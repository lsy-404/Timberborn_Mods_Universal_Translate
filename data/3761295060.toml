frFR = "Il crée des options. Bien choisir est le travail de quelqu'un d'autre."
deDE = "Es schafft Möglichkeiten. Gut zu wählen, ist die Aufgabe eines anderen."
plPL = "Tworzy opcje. Dobrze wybierać to zadanie kogoś innego."
ptBR = "Cria opções. Escolher bem é trabalho de outra pessoa."
koKR = "옵션을 생성합니다. 잘 선택하는 것은 다른 사람의 일입니다."
csCZ = "„Vytváří možnosti. Dobře vybírat je práce někoho jiného.“"
viVN = "Nó tạo ra các tùy chọn. Việc chọn lựa tốt là công việc của người khác."
trTR = "Seçenekler yaratır. İyi seçmek başkasının işidir."

["LV.CBlt.ConveyorLiftUpFlavor"]
