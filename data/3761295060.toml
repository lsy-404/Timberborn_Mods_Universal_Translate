plPL = "Jak na wynalazek Żelaznych Zębów, jest zaskakująco <i>podnoszący na duchu</i>."
ptBR = "Para uma invenção dos Dentes de Ferro, é surpreendentemente <i>encorajador</i>."
koKR = "철 이빨의 발명품치고는 놀랍도록 <i>고양되는</i> 느낌입니다."
csCZ = "U překvapení vynálezu Železných zubů je to <i>vzpružující</i>."
viVN = "Đối với một phát minh của Iron Teeth, nó thật sự <i>thúc đẩy</i>."
trTR = "Demir Dişler icadı için, şaşırtıcı bir şekilde <i>yükseltici</i>."

["LV.CBlt.ConveyorLiftDownFlavor"]
raw = "'Shouldn't this thing produce power instead of consuming it?'"
status = "normal"
enUS = "'Shouldn't this thing produce power instead of consuming it?'"
zhCN = "“这个东西不是应该产生能量而不是消耗能量吗？”"
zhTW = "「這東西不是應該產生能量而不是消耗它嗎？」"
ruRU = "'Не должно ли это устройство производить энергию, а не потреблять ее?'"
jaJP = "「この装置は消費するのではなく、電力を生み出すべきではないのですか？」"
frFR = "'Ne devrait-elle pas produire de l'énergie au lieu d'en consommer ?'"
deDE = "'Sollte dieses Ding nicht Energie erzeugen, anstatt sie zu verbrauchen?'"
plPL = "'Czy to nie powinno produkować energii zamiast ją konsumować?'"
ptBR = "'Não deveria essa coisa produzir energia em vez de consumi-la?'"
koKR = "이것은 전력을 소비하는 대신 생산해야 하는 것 아닙니까?"
csCZ = "'Neměl by tento stroj vyrábět energii místo toho, aby ji spotřebovával?'"
viVN = "'Lẽ nào cái này không nên sản xuất điện thay vì tiêu tốn nó?'"
trTR = "'Bu şey güç üretmek yerine tüketmemeli mi?'"

