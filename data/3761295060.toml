frFR = "Une solution paisible pour avoir trop de directions."
deDE = "Eine friedliche Lösung, um zu viele Richtungen zu haben."
plPL = "Spokojne rozwiązanie na zbyt wiele kierunków."
ptBR = "Uma solução pacífica para ter muitas direções."
koKR = "너무 많은 방향에 대한 평화로운 해결책."
csCZ = "Mírné řešení, jak mít příliš mnoho směrů."
viVN = "Một giải pháp hòa bình cho việc có quá nhiều hướng."
trTR = "Çok fazla yön olmasının barışçıl bir çözümü."

["LV.CBlt.ConveyorBeltSplitterFlavor"]
raw = "It creates options. Choosing well is someone else's job."
status = "normal"
enUS = "It creates options. Choosing well is someone else's job."
zhCN = "“它创造了选择。明智地选择是别人的工作。”"
zhTW = "這創造了選擇。做出正確的選擇是別人的工作。"
