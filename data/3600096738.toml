["LV.Pin.PinFlavor"]
raw = "'I don't remember why I put a pin here, I just know it's important.' —xa0Anonymous"
status = "normal"
enUS = "'I don't remember why I put a pin here, I just know it's important.' —xa0Anonymous"
zhCN = "“我不记得为什么在这里钉了个图钉，只知道它很重要。”——匿名"
zhTW = "「我不記得為什麼我把針放在這裡，我只知道它很重要。」— 匿名"
ruRU = "\"Я не помню, почему я поставил здесь булавку, я просто знаю, что это важно.\" — Аноним"
jaJP = "「ここにピンを置いた理由は覚えていない。ただ、それが重要であることは知っている。」— 匿名"
frFR = "« Je ne me souviens pas pourquoi j'ai mis une épingle ici, je sais juste que c'est important. » — Anonyme"
deDE = "„Ich erinnere mich nicht, warum ich hier eine Stecknadel gesetzt habe, ich weiß nur, dass es wichtig ist.“ — Anonym"
plPL = "'Nie pamiętam, czemu tu wbiłem pinezkę, po prostu wiem, że to ważne.' — Anonim"
ptBR = "'Não me lembro por que coloquei um alfinete aqui, só sei que é importante.' — Anônimo"
koKR = "'여기 핀을 꽂은 이유는 기억나지 않지만, 그것이 중요하다는 것만은 알고 있다.' —익명"
trTR = "'Buraya neden bir pim koyduğumu hatırlamıyorum, sadece bunun önemli olduğunu biliyorum.' —xa0Anonim"
esES = "'No recuerdo por qué puse un marcador aquí, solo sé que es importante.' —xa0Anónimo"
itIT = "'Non ricordo perché ho messo qui un segnaposto, so solo che è importante.' —xa0Anonimo"
ukUA = "«Не пам'ятаю, навіщо я поставив тут мітку, просто знаю, що це важливо.» —Анонім"
thTH = "'ฉันจำไม่ได้ว่าทำไมถึงปักหมุดตรงนี้ รู้แค่ว่ามันสำคัญ' —xa0Anonymous"
csCZ = "'Nepamatuji si, proč jsem sem dal špendlík, jen vím, že je to důležité.' —xa0Anonymní"
viVN = "'Tôi không nhớ tại sao tôi lại đặt một cái ghim ở đây, tôi chỉ biết nó quan trọng.' — Vô danh"
caES = "«No recordo per què vaig posar una xinxeta aquí, només sé que és important.» —xa0Anònim"
beBY = "'Не памятаю, навошта я паставіў тут шпільку, ведаю толькі, што гэта важна.' —xa0Anonymous"
roRO = "„Nu mai țin minte de ce am pus un ac aici, doar știu că e important.” —xa0Anonymous"
huHU = "„Nem emlékszem, miért tettem ide egy jelölőt, csak azt tudom, hogy fontos.” —xa0Névtelen"
arSA = "«لا أتذكر لماذا وضعتُ دبوساً هنا، أعرف فقط أنه مهم.» — مجهول"

