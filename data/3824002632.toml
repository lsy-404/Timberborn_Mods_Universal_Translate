["BotModes.Injury.Tooltip"]
status = "normal"
raw = "Mode 2 only. Percentage of durability lost at once when a bot gets hurt in a building that can injure workers (mine, explosives factory, smelter and similar). The bot breaks when durability reaches zero."
enUS = "Mode 2 only. Percentage of durability lost at once when a bot is injured in a building that can injure workers (mine, explosives factory, smelter, and similar buildings). The bot breaks when its durability reaches zero."
zhCN = "仅限模式 2。机器人在可能伤害工人的建筑（矿井、炸药厂、冶炼厂等）中受伤时，耐久度一次性损失的百分比。耐久度降至零时，机器人会损坏。"
zhTW = "僅限模式 2。機器人在會使工人受傷的建築（礦場、炸藥工廠、冶煉廠等）受傷時，一次損失的耐久度百分比。耐久度降至零時，機器人便會損壞。"
ruRU = "Только для режима 2. Процент прочности, теряемый за один раз, когда бот получает травму в здании, где могут пострадать рабочие (шахта, фабрика взрывчатки, плавильня и подобные здания). Бот ломается, когда прочность достигает нуля."
jaJP = "モード2のみ。有害な作業施設（鉱山、爆薬工場、製錬所など）でボットが負傷したとき、一度に失う耐久度の割合。耐久度がゼロになると、ボットは壊れる。"
frFR = "Mode 2 uniquement. Pourcentage de durabilité perdu d’un coup lorsqu’un automate est blessé dans un bâtiment pouvant blesser les ouvriers (mine, usine d’explosifs, fonderie, etc.). L’automate se casse lorsque sa durabilité atteint zéro."
deDE = "Nur Modus 2. Prozentsatz der Haltbarkeit, der auf einmal verloren geht, wenn ein Bot in einem Gebäude verletzt wird, das Arbeiter verletzen kann (Mine, Sprengstofffabrik, Schmelzhütte und Ähnliches). Der Bot geht kaputt, wenn seine Haltbarkeit null erreicht."
plPL = "Tylko tryb 2. Procent wytrzymałości tracony jednorazowo, gdy bot zostanie zraniony w budynku, który może ranić pracowników (kopalnia, fabryka materiałów wybuchowych, huta itp.). Bot psuje się, gdy jego wytrzymałość spadnie do zera."
ptBR = "Somente no modo 2. Porcentagem de durabilidade perdida de uma só vez quando um bot se machuca em um prédio que pode ferir trabalhadores (mina, fábrica de explosivos, fundição e similares). O bot quebra quando a durabilidade chega a zero."
koKR = "모드 2 전용. 작업자에게 부상을 입힐 수 있는 건물(광산, 폭발물 공장, 제련소 등)에서 봇이 다칠 때 한 번에 잃는 내구도의 비율입니다. 내구도가 0이 되면 봇은 파괴됩니다."
csCZ = "Pouze režim 2. Procento odolnosti, o které bot přijde najednou, když se zraní v budově, která může zranit pracovníky (důl, továrna na výbušniny, slévárna a podobně). Bot se rozbije, když jeho odolnost klesne na nulu."
viVN = "Chỉ chế độ 2. Phần trăm độ bền mất đi ngay lập tức khi robot bị thương trong một công trình có thể gây thương tích cho công nhân (mỏ, nhà máy thuốc nổ, lò luyện kim và các công trình tương tự). Robot sẽ hỏng khi độ bền về 0."
trTR = "Yalnızca Mod 2. Bir bot, işçilere zarar verebilen bir binada (maden, patlayıcı fabrikası, izabe tesisi ve benzeri) yaralandığında dayanıklılığından bir kerede kaybettiği yüzde. Dayanıklılığı sıfıra ulaştığında bot bozulur."

