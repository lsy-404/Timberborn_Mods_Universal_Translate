["BotModes.Power.Tooltip"]
status = "normal"
raw = "Mode 2 only. Percentage of durability lost every game day while Biofuel or Energy is depleted and the bot has stopped working. Vanilla wear is about 1.4% per day."
enUS = "Mode 2 only. Percentage of durability lost each game day while Biofuel or Energy is depleted and the bot has stopped working. Vanilla wear is about 1.4% per day."
zhCN = "仅限模式 2。生物燃料或能量耗尽且机器人停止工作时，每个游戏日损失的耐久度百分比。原版设定下，每天的损耗约为 1.4%。"
zhTW = "僅限模式 2。在生質燃料或能源耗盡且機器人停止工作的情況下，每個遊戲日損失的耐久度百分比。原版每天約損失 1.4% 的耐久度。"
ruRU = "Только режим 2. Процент прочности, теряемый за каждый игровой день, пока биотопливо или энергия исчерпаны и бот не работает. В оригинальной игре износ составляет около 1,4% в день."
jaJP = "モード2のみ。バイオ燃料またはエネルギーが枯渇してボットが停止している間、ゲーム内の1日ごとに失われる耐久度の割合。バニラ版では、摩耗は1日あたり約1.4%です。"
frFR = "Mode 2 uniquement. Pourcentage de durabilité perdu chaque jour de jeu lorsque le biocarburant ou l’énergie est épuisé et que le robot a cessé de fonctionner. L’usure du jeu de base est d’environ 1,4 % par jour."
deDE = "Nur Modus 2. Prozentsatz der Haltbarkeit, der pro Spieltag verloren geht, wenn Biokraftstoff oder Energie aufgebraucht ist und der Bot nicht mehr arbeitet. Im Grundspiel beträgt der Verschleiß etwa 1,4 % pro Tag."
plPL = "Tylko tryb 2. Procent trwałości tracony każdego dnia gry, gdy wyczerpie się biopaliwo lub energia, a bot przestanie działać. W podstawowej wersji gry zużycie wynosi około 1,4% dziennie."
ptBR = "Somente no modo 2. Porcentagem de durabilidade perdida por dia de jogo enquanto o biocombustível ou a energia estiverem esgotados e o robô tiver parado de trabalhar. O desgaste padrão é de cerca de 1,4% por dia."
koKR = "모드 2에서만 적용됩니다. 바이오연료 또는 에너지가 고갈되어 봇이 작동을 멈춘 동안 게임 내 하루마다 감소하는 내구도 비율입니다. 바닐라의 내구도 감소율은 하루 약 1.4%입니다."
csCZ = "Pouze režim 2. Procento trvanlivosti, o které se každý herní den sníží, když dojde biopalivo nebo energie a bot přestane pracovat. Ve výchozí hře je opotřebení přibližně 1,4 % za den."
viVN = "Chỉ ở Chế độ 2. Phần trăm độ bền bị hao hụt mỗi ngày trong trò chơi khi Nhiên liệu sinh học hoặc Năng lượng cạn kiệt và robot ngừng hoạt động. Mức hao mòn trong bản gốc là khoảng 1.4% mỗi ngày."
trTR = "Yalnızca Mod 2. Biyoyakıt veya Enerji tükendiğinde ve bot çalışmayı durdurduğunda, oyun günü başına kaybedilen dayanıklılık yüzdesi. Vanilla’da aşınma günde yaklaşık %1.4’tür."
