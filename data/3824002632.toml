["BotModes.Mode.Tooltip"]
status = "normal"
raw = "Mode 1: bots (including bots added by other mods) never deteriorate over time. Mode 2: no time-based deterioration, but bots take damage when they get hurt or when they run out of fuel or power. Mode 3: vanilla behaviour, bots wear out after about 70 days."
enUS = "Mode 1: Bots (including bots added by other mods) never deteriorate over time. Mode 2: No time-based deterioration, but bots take damage when they get hurt or run out of fuel or power. Mode 3: Vanilla behavior: bots wear out after about 70 days."
zhCN = "模式 1：机器人（包括其他模组添加的机器人）永远不会随时间损耗。模式 2：不会随时间损耗，但机器人受伤、燃料耗尽或动力耗尽时会受到损坏。模式 3：原版行为，机器人约 70 天后会磨损。"
zhTW = "模式 1：机器人（包括其他模组添加的机器人）永远不会随时间劣化。模式 2：不会随时间劣化，但机器人受伤或燃料或动力耗尽时会受到伤害。模式 3：原版行为，机器人约 70 天后会磨损。"
ruRU = "Режим 1: боты (в том числе добавленные другими модами) никогда не изнашиваются со временем. Режим 2: износа со временем нет, но боты получают урон, когда их повреждают или когда у них заканчиваются топливо или энергия. Режим 3: поведение по умолчанию — боты изнашиваются примерно через 70 дней."
jaJP = "モード1：ボット（他のMODで追加されたボットを含む）は、時間が経っても劣化しません。モード2：時間経過による劣化はありませんが、ボットは傷ついたとき、または燃料や電力が切れたときにダメージを受けます。モード3：バニラの動作です。ボットは約70日で消耗します。"
frFR = "Mode 1 : les robots (y compris ceux ajoutés par d’autres mods) ne se détériorent jamais avec le temps. Mode 2 : pas de détérioration liée au temps, mais les robots subissent des dégâts lorsqu’ils sont blessés ou à court de carburant ou d’énergie. Mode 3 : comportement par défaut, les robots s’usent au bout d’environ 70 jours."
deDE = "Modus 1: Bots (einschließlich Bots, die von anderen Mods hinzugefügt wurden) verschleißen mit der Zeit nie. Modus 2: kein zeitbedingter Verschleiß, aber Bots nehmen Schaden, wenn sie verletzt werden oder ihnen Treibstoff oder Energie ausgeht. Modus 3: Verhalten wie im Basisspiel, Bots verschleißen nach etwa 70 Tagen."
plPL = "Tryb 1: boty (w tym boty dodane przez inne mody) nigdy nie zużywają się z upływem czasu. Tryb 2: brak zużycia zależnego od czasu, ale boty otrzymują obrażenia, gdy zostaną uszkodzone lub gdy zabraknie im paliwa albo energii. Tryb 3: zachowanie z podstawowej wersji gry — boty zużywają się po około 70 dniach."
ptBR = "Modo 1: os bots (incluindo os adicionados por outros mods) nunca se deterioram com o tempo. Modo 2: não há deterioração baseada no tempo, mas os bots sofrem dano quando se machucam ou ficam sem combustível ou energia. Modo 3: comportamento padrão; os bots se desgastam após cerca de 70 dias."
koKR = "모드 1: 다른 모드에서 추가된 봇을 포함해 봇은 시간이 지나도 절대 노후화되지 않습니다. 모드 2: 시간에 따른 노후화는 없지만, 봇은 다치거나 연료 또는 동력이 떨어지면 피해를 입습니다. 모드 3: 바닐라 동작 방식으로, 봇은 약 70일이 지나면 마모됩니다."
csCZ = "Režim 1: roboti (včetně robotů přidaných jinými mody) se časem nikdy neopotřebovávají. Režim 2: žádné opotřebení v závislosti na čase, ale roboti utrpí poškození, když se zraní nebo jim dojde palivo či energie. Režim 3: chování jako ve vanille, roboti se opotřebují přibližně po 70 dnech."
viVN = "Chế độ 1: rô-bốt (bao gồm cả rô-bốt được thêm vào bởi các mod khác) không bao giờ bị xuống cấp theo thời gian. Chế độ 2: không xuống cấp theo thời gian, nhưng rô-bốt bị hư hại khi bị thương hoặc khi hết nhiên liệu hay năng lượng. Chế độ 3: hành vi mặc định của trò chơi, rô-bốt hao mòn sau khoảng 70 ngày."
trTR = "Mod 1: Botlar (diğer modların eklediği botlar dâhil) zamanla hiç yıpranmaz. Mod 2: Zamana bağlı yıpranma olmaz, ancak botlar yaralandıklarında ya da yakıtları veya güçleri tükendiğinde hasar alır. Mod 3: Vanilla davranışı; botlar yaklaşık 70 gün sonra yıpranır."

