["ClimateProgression.TemperateFloorDays.Tooltip"]
status = "normal"
raw = "Hard floor the good season never goes under, whatever the multiplier. This is what keeps the late game playable rather than unwinnable."
enUS = "The good season never lasts fewer than this many days, regardless of the multiplier. This is what keeps the late game playable rather than unwinnable."
zhCN = "良好季节的天数有硬性下限，不会因乘数而进一步减少。这能让游戏后期仍然可以玩下去，而不是变得无法取胜。"
zhTW = "良好季節的天數設有硬性下限，不會因乘數而低於此值。這能確保遊戲後期仍可玩，而不至於變得無法取勝。"
ruRU = "Минимальная продолжительность хорошего сезона: он никогда не станет короче этого срока, каким бы ни был множитель. Благодаря этому поздняя игра остаётся проходимой, а не безнадёжной."
jaJP = "倍率に関係なく、良季がこれを下回ることのない最低日数。これによって、終盤が攻略不可能ではなく、プレイ可能な状態に保たれる。"
frFR = "Plancher incompressible de jours de saison favorable, qui ne peut jamais être inférieur à cette valeur, quel que soit le multiplicateur. C’est ce qui permet de continuer à jouer en fin de partie au lieu de rendre la partie impossible à gagner."
deDE = "Feste Untergrenze: Die Dauer der guten Jahreszeit fällt unabhängig vom Multiplikator nie darunter. So bleibt das Endgame spielbar und wird nicht ungewinnbar."
plPL = "Twarda dolna granica długości dobrej pory roku — nigdy nie spada poniżej tej wartości, niezależnie od mnożnika. Dzięki temu późna faza gry pozostaje grywalna, zamiast stawać się niemożliwa do wygrania."
ptBR = "O piso mínimo de dias da estação boa nunca fica abaixo disso, independentemente do multiplicador. É isso que mantém o fim do jogo jogável, em vez de impossível de vencer."
koKR = "배율에 관계없이 좋은 계절이 이보다 짧아지지 않는 최소 일수입니다. 이 덕분에 후반 게임이 이길 수 없는 상태가 되지 않고 계속 플레이할 수 있습니다."
csCZ = "Pevná dolní hranice počtu dní dobrého období nikdy neklesne pod tuto hodnotu, bez ohledu na násobitel. Díky tomu zůstává pozdní fáze hry hratelná, místo aby se stala nevyhratelnou."
viVN = "Sàn cứng của mùa thuận lợi không bao giờ giảm thấp hơn, bất kể hệ số nhân là bao nhiêu. Đây chính là điều giúp giai đoạn cuối game vẫn có thể chơi được thay vì trở nên bất khả chiến bại."
trTR = "İyi mevsimin süresi çarpan ne olursa olsun bu taban değerin altına asla düşmez. Geç oyunun oynanabilir kalmasını, kazanılamaz hâle gelmemesini sağlayan şey budur."

