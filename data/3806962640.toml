zhTW = "升級完成後，乾旱時間會比你開始遊戲時設定的時間延長多少。下方圖表會顯示結果。"
ruRU = "Насколько дольше становятся засухи после завершения эскалации по сравнению с длительностью, заданной при начале игры. На графике ниже показан результат."
jaJP = "エスカレーション完了後の干ばつの期間が、ゲーム開始時に設定した期間よりどれだけ長くなるかを示します。下のグラフに結果が表示されます。"
frFR = "De combien les sécheresses s’allongent une fois l’escalade terminée, par rapport à la durée configurée au début de la partie. Le graphique ci-dessous montre le résultat."
deDE = "Um wie viel länger Dürren nach abgeschlossener Eskalation dauern als die beim Spielstart eingestellte Dauer. Das folgende Diagramm zeigt das Ergebnis."
plPL = "O ile dłuższe stają się susze po zakończeniu eskalacji w porównaniu z czasem trwania ustawionym podczas rozpoczynania gry. Poniższy wykres przedstawia wynik."
ptBR = "Quanto mais longas serão as secas após a conclusão da escalada, em comparação com a duração configurada ao iniciar o jogo. O gráfico abaixo mostra o resultado."
koKR = "기후 악화가 완료되면 게임을 시작할 때 설정한 가뭄 지속 시간보다 가뭄이 얼마나 더 길어지는지를 보여줍니다. 아래 차트에서 결과를 확인할 수 있습니다."
trTR = "Tırmanış tamamlandığında kuraklıkların, oyunu başlatırken ayarladığınız süreye kıyasla ne kadar daha uzun süreceği. Aşağıdaki grafik sonucu gösterir."
esES = "Cuánto más duran las sequías una vez completada la escalada, en comparación con la duración que configuraste al iniciar la partida. El gráfico siguiente muestra el resultado."
itIT = "Di quanto si allungano le siccità una volta completata l'escalation, rispetto alla durata che hai impostato all'avvio della partita. Il grafico sottostante mostra il risultato."
ukUA = "Наскільки довшими стають посухи після завершення ескалації порівняно з тривалістю, яку ви налаштували на початку гри. На діаграмі нижче показано результат."
thTH = "ระยะเวลาของภัยแล้งจะยาวนานขึ้นมากเพียงใดเมื่อการเพิ่มระดับความรุนแรงสิ้นสุดลง เมื่อเทียบกับระยะเวลาที่คุณกำหนดไว้ตอนเริ่มเกมใหม่ แผนภูมิด้านล่างแสดงผลลัพธ์"
csCZ = "O kolik déle trvají sucha po dokončení eskalace ve srovnání s délkou nastavenou při zahájení hry. Graf níže znázorňuje výsledek."
viVN = "Các đợt hạn hán sẽ kéo dài thêm bao lâu sau khi quá trình leo thang hoàn tất, so với thời lượng bạn đã thiết lập khi bắt đầu trò chơi. Biểu đồ bên dưới cho thấy kết quả."
caES = "Quant més duraran les sequeres una vegada completada l'escalada, en comparació amb la durada que vas configurar en iniciar la partida. El gràfic següent mostra el resultat."
beBY = "Наколькі даўжэйшымі становяцца засухі пасля завяршэння эскалацыі ў параўнанні з тэрміном, які вы задалі пры пачатку гульні. Ніжэй на дыяграме паказаны вынік."
roRO = "Cât de mult se prelungesc secetele după ce escaladarea este completă, comparativ cu durata configurată la începutul jocului. Graficul de mai jos arată rezultatul."
huHU = "A fokozatos növekedés befejeztével a aszályok mennyivel lesznek hosszabbak ahhoz képest, mint amilyen hosszúságot a játék indításakor beállítottál. Az alábbi diagram mutatja az eredményt."
arSA = "كم تطول مدة الجفاف بعد اكتمال التصعيد مقارنةً بالمدة التي ضبطتها عند بدء اللعبة. يوضح المخطط أدناه النتيجة."

