["ClimateProgression.Enabled.Tooltip"]
status = "normal"
raw = "Off means strictly vanilla weather: your configured durations stop growing once the early-game warm-up ends, as in the base game."
enUS = "Off means strictly vanilla weather: your configured durations stop increasing once the early-game warm-up ends, just as in the base game."
zhCN = "关闭意味着严格采用原版天气：早期游戏的暖机阶段结束后，你设置的持续时间便不再增长，与基础游戏相同。"
zhTW = "「關閉」代表嚴格遵循原版天氣：早期遊戲的暖身期結束後，你設定的持續時間就不會再增加，與原版遊戲相同。"
ruRU = "«Выкл.» означает строго стандартную погоду: заданная вами продолжительность перестаёт увеличиваться после завершения начального периода потепления, как и в базовой игре."
jaJP = "オフの場合、天候は完全にバニラ仕様になります。設定した期間は、序盤のウォームアップが終わると延長されなくなり、基本ゲームと同じになります。"
frFR = "Désactivé signifie que la météo est strictement celle du jeu de base : les durées configurées cessent d’augmenter à la fin de la période de réchauffement du début de partie."
deDE = "Aus bedeutet ausschließlich Vanilla-Wetter: Die von dir konfigurierten Dauern wachsen nicht weiter, sobald die Aufwärmphase zu Beginn des Spiels endet, wie im Basisspiel."
plPL = "Wyłączone oznacza wyłącznie pogodę z podstawowej wersji gry: skonfigurowane przez Ciebie czasy trwania przestają się wydłużać po zakończeniu rozgrzewki na początku gry, tak jak w podstawowej wersji gry."
ptBR = "Desativado significa clima estritamente padrão: as durações configuradas param de aumentar quando termina o aquecimento do início do jogo, como no jogo base."
koKR = "끔은 바닐라 날씨를 엄격히 따릅니다. 게임 초반의 예열 기간이 끝나면 설정한 지속 시간이 더 이상 늘어나지 않습니다. 기본 게임과 같습니다."
csCZ = "Vypnuto znamená výhradně počasí ze základní hry: nastavená délka období se přestane prodlužovat, jakmile skončí počáteční oteplovací fáze, stejně jako v základní hře."
viVN = "Tắt nghĩa là thời tiết thuần túy như trong game gốc: thời lượng đã cấu hình sẽ ngừng tăng sau khi giai đoạn khởi động ấm đầu game kết thúc, giống như trong game gốc."
trTR = "Kapalı, kesin olarak vanilya hava koşulları anlamına gelir: yapılandırdığınız süreler, temel oyundaki gibi, erken oyun ısınma dönemi sona erdiğinde uzamayı bırakır."

