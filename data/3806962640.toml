zhTW = "警告：豐水季已被鎖定在最低值。再降低溫和季節倍率也不會有任何變化；提高最低值可讓遊戲後期沒那麼艱難。"
ruRU = "Предупреждение: благоприятный сезон зафиксирован на минимальном значении. Дальнейшее снижение множителя умеренного климата ничего не изменит; повысьте минимум, чтобы смягчить позднюю игру."
jaJP = "警告：豊作期は下限値に固定されています。温暖期の倍率をさらに下げても変化はありません。終盤を緩和するには、下限値を上げてください。"
frFR = "Avertissement : la saison favorable est bloquée à son minimum. Baissez davantage le multiplicateur de température et rien ne changera ; relevez le minimum pour adoucir la fin de partie."
