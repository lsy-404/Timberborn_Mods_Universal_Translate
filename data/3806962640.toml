["ClimateProgression.Preview.WarnRatio"]
raw = "Warning: at the plateau there is less than one temperate day for five hazard days. A settlement is unlikely to survive that without very large reserves."
status = "normal"
enUS = "Warning: At the plateau, there is less than one temperate day for every five hazard days. A settlement is unlikely to survive that without very large reserves."
zhCN = "警告：在高原，5个灾害日中温和天气不足1天。没有非常充足的储备，定居点很难撑过这段时期。"
zhTW = "警告：高原的每五個危害日中，溫和天氣日不到一天。沒有非常大量的儲備，殖民地恐怕難以存活。"
ruRU = "Предупреждение: на плато на каждые пять опасных дней приходится меньше одного дня умеренного климата. Поселение вряд ли переживёт это без очень больших запасов."
jaJP = "警告：高原では、危険日が5日ある間に温暖な日は1日未満です。非常に大きな備蓄がなければ、集落がこれを乗り切るのは難しいでしょう。"
frFR = "Attention : sur le plateau, il y a moins d’une journée tempérée pour cinq jours de danger. Il est peu probable qu’une colonie survive sans de très grandes réserves."
deDE = "Warnung: Auf dem Plateau kommt auf fünf Gefahren-Tage weniger als ein gemäßigter Tag. Eine Siedlung wird das ohne sehr große Vorräte wahrscheinlich nicht überleben."
plPL = "Ostrzeżenie: na płaskowyżu na pięć dni zagrożenia przypada mniej niż jeden dzień umiarkowanego klimatu. Osada prawdopodobnie nie przetrwa tego bez bardzo dużych zapasów."
ptBR = "Aviso: no planalto, há menos de um dia temperado para cada cinco dias de perigo. É improvável que um assentamento sobreviva a isso sem reservas muito grandes."
koKR = "경고: 고원에서는 위험 기간 5일 동안 온화한 날씨가 하루도 채 되지 않습니다. 비축량이 매우 많지 않다면 정착지가 이를 견뎌내기 어려울 것입니다."
trTR = "Uyarı: Yaylada beş tehlike günü başına bir ılıman günden az süre var. Çok büyük rezervler olmadan bir yerleşimin hayatta kalması pek olası değil."
esES = "Advertencia: en la meseta hay menos de un día templado por cada cinco días peligrosos. Es poco probable que un asentamiento sobreviva a eso sin reservas muy grandes."
itIT = "Attenzione: sull'altopiano c'è meno di un giorno temperato ogni cinque giorni pericolosi. Un insediamento difficilmente sopravviverebbe a questa situazione senza riserve molto consistenti."
ukUA = "Попередження: на плато менше одного помірного дня припадає на п'ять небезпечних днів. Поселення навряд чи зможе вижити за таких умов без дуже великих запасів."
thTH = "คำเตือน: บนที่ราบสูงมีวันอากาศอบอุ่นน้อยกว่าหนึ่งวันต่อวันอันตรายห้าวัน การตั้งถิ่นฐานแทบไม่มีทางอยู่รอดได้หากไม่มีคลังสำรองจำนวนมากมาก"
csCZ = "Varování: na náhorní plošině připadá na pět dní s nebezpečnými podmínkami méně než jeden den s mírným klimatem. Osada to pravděpodobně nepřežije bez velmi velkých zásob."
viVN = "Cảnh báo: trên cao nguyên, cứ mỗi năm ngày hiểm họa lại có chưa đến một ngày ôn hòa. Một khu định cư khó có thể sống sót qua điều đó nếu không có lượng dự trữ rất lớn."
caES = "Avís: a l'altiplà hi ha menys d'un dia temperat per cada cinc dies de perill. És poc probable que un assentament sobrevisqui a això sense reserves molt grans."
beBY = "Увага: на плато менш за адзін спрыяльны дзень на пяць небяспечных дзён. Паселішча наўрад ці вытрымае гэта без вельмі вялікіх запасаў."
roRO = "Atenție: pe platou există mai puțin de o zi temperată pentru fiecare cinci zile periculoase. Este puțin probabil ca o așezare să supraviețuiască în aceste condiții fără rezerve foarte mari."
huHU = "Figyelmeztetés: a fennsíkon öt veszélyes nap jut kevesebb mint egy mérsékelt napra. Egy település valószínűleg nem vészeli át ezt nagyon nagy tartalékok nélkül."
arSA = "تحذير: في الهضبة يوجد أقل من يوم معتدل واحد مقابل كل خمسة أيام خطرة. من غير المرجح أن تنجو المستوطنة من ذلك دون احتياطات كبيرة جدًا."

["ClimateProgression.Preview.WarnFloor"]
raw = "Warning: the good season is pinned to its floor. Lower the temperate multiplier further and nothing will change; raise the floor to soften the late game."
status = "normal"
enUS = "Warning: the good season is pinned to its floor. Lower the temperate multiplier further and nothing will change; raise the floor to soften the late game."
zhCN = "警告：丰水期已固定在其下限。进一步降低温和季节倍率不会有任何变化；提高下限可以缓和游戏后期难度。"
zhTW = "警告：豐水季已被鎖定在最低值。再降低溫和季節倍率也不會有任何變化；提高最低值可讓遊戲後期沒那麼艱難。"
ruRU = "Предупреждение: благоприятный сезон зафиксирован на минимальном значении. Дальнейшее снижение множителя умеренного климата ничего не изменит; повысьте минимум, чтобы смягчить позднюю игру."
jaJP = "警告：豊作期は下限値に固定されています。温暖期の倍率をさらに下げても変化はありません。終盤を緩和するには、下限値を上げてください。"
frFR = "Avertissement : la saison favorable est bloquée à son minimum. Baissez davantage le multiplicateur de température et rien ne changera ; relevez le minimum pour adoucir la fin de partie."
deDE = "Warnung: Die gute Jahreszeit ist auf ihren Mindestwert festgelegt. Wenn du den Temperaturmultiplikator weiter senkst, ändert sich nichts; erhöhe den Mindestwert, um das Endspiel abzumildern."
plPL = "Ostrzeżenie: dobra pora roku jest zablokowana na swoim minimum. Dalsze obniżanie mnożnika umiarkowanego klimatu niczego nie zmieni; podnieś minimum, aby złagodzić końcową fazę gry."
ptBR = "Aviso: a estação favorável está fixada no seu limite mínimo. Reduza ainda mais o multiplicador de temperatura amena e nada mudará; aumente o limite mínimo para suavizar o fim do jogo."
koKR = "경고: 풍요로운 계절이 최저치에 고정되어 있습니다. 온대 계수를 더 낮춰도 아무것도 바뀌지 않습니다. 최저치를 높여 후반 게임의 난이도를 낮추세요."
trTR = "Uyarı: İyi mevsim alt sınırına sabitlenmiş. Ilıman mevsim çarpanını daha da düşürürsen hiçbir şey değişmez; oyun sonunu yumuşatmak için alt sınırı yükselt."
esES = "Advertencia: la buena temporada está fijada a su mínimo. Reducir aún más el multiplicador templado no cambiará nada; sube el mínimo para suavizar la fase final de la partida."
itIT = "Avvertenza: la stagione buona è bloccata sul suo minimo. Abbassare ulteriormente il moltiplicatore temperato non cambierà nulla; alza il minimo per attenuare la fase finale della partita."
ukUA = "Попередження: добрий сезон прив'язано до його нижньої межі. Подальше зниження множника помірного клімату нічого не змінить; щоб пом'якшити пізню гру, підвищте нижню межу."
thTH = "คำเตือน: ฤดูดีถูกตรึงไว้ที่ค่าขั้นต่ำ การลดตัวคูณอากาศอบอุ่นให้ต่ำลงอีกจะไม่ทำให้สิ่งใดเปลี่ยนแปลง ส่วนการเพิ่มค่าขั้นต่ำจะช่วยให้ช่วงปลายเกมผ่อนคลายลง"
csCZ = "Varování: příznivá sezóna je nastavena na své minimum. Pokud násobitel mírného počasí snížíte ještě víc, nic se nezmění; zvýšením minima zmírníte pozdní fázi hry."
viVN = "Cảnh báo: mùa thuận lợi bị ghim ở mức sàn. Giảm thêm hệ số ôn hòa cũng không thay đổi gì; tăng mức sàn để giảm độ khắc nghiệt ở giai đoạn cuối."
caES = "Avís: la bona temporada està fixada al seu mínim. Reduir encara més el multiplicador temperat no canviarà res; augmenta el mínim per suavitzar la fase final de la partida."
beBY = "Увага: добры сезон прывязаны да свайго мінімуму. Далейшае зніжэнне каэфіцыента памяркоўнага клімату нічога не зменіць; каб змякчыць позні этап гульні, павысьце мінімум."
roRO = "Atenție: sezonul bun este fixat la nivelul său minim. Scăderea în continuare a multiplicatorului temperat nu va schimba nimic; ridicați nivelul minim pentru a atenua etapa târzie a jocului."
huHU = "Figyelmeztetés: a jó évszak a alsó határához van rögzítve. A mérsékelt szorzó további csökkentésével semmi sem fog változni; a késői játékmenet enyhítéséhez emeld meg az alsó határt."
arSA = "تحذير: موسم الاعتدال مُقيَّد عند حدّه الأدنى. خفض مضاعف الاعتدال أكثر لن يُحدث أي تغيير، وارفع الحد الأدنى لتخفيف حدة المرحلة المتأخرة من اللعبة."

