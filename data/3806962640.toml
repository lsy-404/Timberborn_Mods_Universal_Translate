["ClimateProgression.DroughtIntensity.Tooltip"]
raw = "How much longer droughts get once escalation is complete, compared to the duration you configured when starting the game. The chart below shows the result."
status = "normal"
enUS = "How much longer droughts last after escalation is complete, compared to the duration you configured when starting the game. The chart below shows the result."
zhCN = "升级完成后，干旱时长会比你开始游戏时设置的时长延长多少。下方图表显示了结果。"
zhTW = "升級完成後，乾旱時間會比你開始遊戲時設定的時間延長多少。下方圖表會顯示結果。"
ruRU = "Насколько дольше становятся засухи после завершения эскалации по сравнению с длительностью, заданной при начале игры. На графике ниже показан результат."
jaJP = "エスカレーション完了後の干ばつの期間が、ゲーム開始時に設定した期間よりどれだけ長くなるかを示します。下のグラフに結果が表示されます。"
frFR = "De combien les sécheresses s’allongent une fois l’escalade terminée, par rapport à la durée configurée au début de la partie. Le graphique ci-dessous montre le résultat."
deDE = "Um wie viel länger Dürren nach abgeschlossener Eskalation dauern als die beim Spielstart eingestellte Dauer. Das folgende Diagramm zeigt das Ergebnis."
plPL = "O ile dłuższe stają się susze po zakończeniu eskalacji w porównaniu z czasem trwania ustawionym podczas rozpoczynania gry. Poniższy wykres przedstawia wynik."
ptBR = "Quanto mais longas serão as secas após a conclusão da escalada, em comparação com a duração configurada ao iniciar o jogo. O gráfico abaixo mostra o resultado."
koKR = "기후 악화가 완료되면 게임을 시작할 때 설정한 가뭄 지속 시간보다 가뭄이 얼마나 더 길어지는지를 보여줍니다. 아래 차트에서 결과를 확인할 수 있습니다."
csCZ = "O kolik déle trvají sucha po dokončení eskalace ve srovnání s délkou nastavenou při zahájení hry. Graf níže znázorňuje výsledek."
viVN = "Các đợt hạn hán sẽ kéo dài thêm bao lâu sau khi quá trình leo thang hoàn tất, so với thời lượng bạn đã thiết lập khi bắt đầu trò chơi. Biểu đồ bên dưới cho thấy kết quả."
trTR = "Tırmanış tamamlandığında kuraklıkların, oyunu başlatırken ayarladığınız süreye kıyasla ne kadar daha uzun süreceği. Aşağıdaki grafik sonucu gösterir."

