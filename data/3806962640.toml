["ClimateProgression.Enabled.Tooltip"]
raw = "Off means strictly vanilla weather: your configured durations stop growing once the early-game warm-up ends, as in the base game."
status = "normal"
enUS = "Off means strictly vanilla weather: your configured durations stop increasing once the early-game warm-up ends, just as in the base game."
zhCN = "关闭表示严格采用原版天气：早期游戏的预热阶段结束后，你设置的持续时间不再增长，与基础游戏一致。"
zhTW = "關閉代表嚴格採用原版天氣：早期遊戲的暖身期結束後，你設定的持續時間便不再增加，與原版遊戲相同。"
ruRU = "«Выкл.» означает строго стандартную погоду: заданная вами длительность перестаёт увеличиваться, когда заканчивается начальный период потепления, как и в базовой игре."
jaJP = "オフの場合、天候は完全にバニラ仕様になります。設定した期間は、序盤のウォームアップが終わるとそれ以上長くならず、ベースゲームと同じです。"
frFR = "Désactivé signifie que la météo est strictement celle du jeu de base : les durées que vous avez configurées cessent d’augmenter à la fin de la période de réchauffement du début de partie, comme dans le jeu de base."
deDE = "Aus bedeutet strikt Vanilla-Wetter: Die von dir eingestellten Zeitspannen wachsen nicht weiter, sobald die Aufwärmphase im frühen Spiel endet – wie im Basisspiel."
plPL = "Wyłączenie oznacza wyłącznie pogodę z podstawowej wersji gry: skonfigurowane czasy trwania przestają się wydłużać po zakończeniu rozgrzewki we wczesnej fazie gry, tak jak w podstawowej wersji gry."
ptBR = "Desativado significa clima estritamente padrão: as durações configuradas param de aumentar quando termina o aquecimento do início do jogo, como no jogo base."
koKR = "끄기는 바닐라 날씨만 적용된다는 뜻입니다. 설정한 지속 시간은 기본 게임처럼 초반 준비 기간이 끝나면 더 이상 늘어나지 않습니다."
csCZ = "Vypnuto znamená výhradně počasí jako ve vanille: nastavená délka trvání přestane růst, jakmile skončí zahřívací fáze na začátku hry, stejně jako v základní hře."
viVN = "Tắt nghĩa là thời tiết thuần vanilla: thời lượng bạn đã cấu hình sẽ ngừng tăng sau khi giai đoạn khởi động đầu game kết thúc, giống như trong trò chơi gốc."
trTR = "Kapalı, yalnızca temel oyundaki hava koşulları demektir: yapılandırdığınız süreler, temel oyundaki gibi, erken oyun ısınma dönemi sona erince uzamayı bırakır."

