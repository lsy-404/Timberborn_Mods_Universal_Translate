["ClimateProgression.Preview.SourceDefault"]
raw = "Based on the default game mode. Your own setup may use other durations; hazard warm-up is estimated from the chance for a badtide."
status = "normal"
enUS = "Based on the default game mode. Your setup may use different durations; hazard warm-up is estimated from the chance of a badtide."
zhCN = "基于默认游戏模式。你的设置可能采用不同的持续时间；灾害预热时间根据恶潮出现的概率估算。"
zhTW = "以預設遊戲模式為基準。你自己的設定可能採用其他持續時間；危害暖機時間是根據壞潮發生機率估算的。"
ruRU = "Основано на стандартном игровом режиме. В вашей настройке могут использоваться другие длительности; предварительная оценка опасности рассчитана исходя из вероятности плохого прилива."
jaJP = "デフォルトのゲームモードに基づいています。独自の設定では期間が異なる場合があります。災害のウォームアップ期間は、バッドタイドの発生確率から推定されます。"
frFR = "Basé sur le mode de jeu par défaut. Votre propre configuration peut utiliser d’autres durées ; la période de préparation aux catastrophes est estimée en fonction de la probabilité d’une marée toxique."
deDE = "Basiert auf dem Standard-Spielmodus. Deine eigene Konfiguration kann andere Zeitspannen verwenden; die Aufwärmphase der Gefahr wird anhand der Wahrscheinlichkeit einer Schadflut geschätzt."
plPL = "Na podstawie domyślnego trybu gry. Własna konfiguracja może zakładać inne czasy trwania; czas rozgrzewki zagrożenia oszacowano na podstawie prawdopodobieństwa wystąpienia zatrutej fali."
ptBR = "Com base no modo de jogo padrão. Sua configuração pode usar outras durações; o aquecimento do risco é estimado com base na chance de ocorrer uma maré tóxica."
koKR = "기본 게임 모드를 기준으로 합니다. 직접 설정한 구성에서는 지속 시간이 다를 수 있으며, 위험 요소의 예열 시간은 악물결이 발생할 확률을 기준으로 추정합니다."
trTR = "Varsayılan oyun moduna dayanır. Kendi kurulumunuzda farklı süreler kullanılabilir; tehlike ön hazırlık süresi, zehirli gelgit olasılığına göre tahmin edilir."
esES = "Basado en el modo de juego predeterminado. Tu propia configuración puede usar otras duraciones; el periodo de calentamiento del peligro se estima a partir de la probabilidad de una marea mala."
itIT = "Basato sulla modalità di gioco predefinita. La tua configurazione può usare durate diverse; il periodo di riscaldamento dei pericoli è stimato in base alla probabilità di una cattiva marea."
ukUA = "Базується на стандартному ігровому режимі. Ваші власні налаштування можуть мати інші тривалості; час підготовки небезпеки оцінюється на основі ймовірності поганого припливу."
thTH = "อ้างอิงจากโหมดเกมเริ่มต้น การตั้งค่าของคุณเองอาจใช้ระยะเวลาอื่น ระยะเวลาเตรียมการของภัยอันตรายจะคำนวณโดยประมาณจากโอกาสเกิด badtide"
csCZ = "Vychází z výchozího herního režimu. Vaše vlastní nastavení může používat jiné délky trvání; zahřívací fáze nebezpečí je odhadnuta podle pravděpodobnosti výskytu období toxické vody."
viVN = "Dựa trên chế độ chơi mặc định. Thiết lập của bạn có thể dùng thời lượng khác; thời gian khởi động của hiểm họa được ước tính dựa trên khả năng xảy ra đợt thủy triều độc hại."
caES = "Basat en el mode de joc per defecte. La teva configuració pot usar altres durades; l'escalfament del perill s'estima a partir de la probabilitat d'un badtide."
beBY = "На аснове стандартнага рэжыму гульні. Ваша ўласная настройка можа мець іншую працягласць; час разгону небяспекі ацэньваецца па шанцы на badtide."
roRO = "Bazat pe modul de joc implicit. Configurația ta poate folosi alte durate; perioada de încălzire a pericolelor este estimată din șansa unei badtide."
huHU = "Az alapértelmezett játékmódon alapul. A saját beállításaid más időtartamokat használhatnak; a veszélyek felmelegedési idejét a rossz áradás (badtide) valószínűségéből becsüljük."
arSA = "بناءً على وضع اللعب الافتراضي. قد تستخدم إعدادك الخاص مدداً أخرى؛ ويُقدَّر زمن تهيئة الأخطار استناداً إلى احتمالية حدوث \"موجة الفساد\" (badtide)."

