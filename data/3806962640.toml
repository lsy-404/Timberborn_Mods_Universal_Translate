["ClimateProgression.BadtideIntensity.Tooltip"]
raw = "How much longer badtides get at the plateau. Kept lower than droughts by default: a long badtide is harsher, since pumped water is badwater and soil degrades."
status = "normal"
enUS = "How much longer badtides last on the plateau. Lower than droughts by default: a long badtide is harsher because pumped water is badwater and soil degrades."
zhCN = "高原上的恶潮会持续多久。默认设置下，其时长低于干旱：恶潮持续越久，影响越严重，因为抽取的水是恶水，土壤也会退化。"
zhTW = "高原上的毒水潮會延長多少時間。預設比乾旱短：毒水潮持續越久，影響越嚴重，因為抽取的水是毒水，而且土壤會退化。"
ruRU = "Насколько дольше становятся периоды плохой воды на плато. По умолчанию их длительность меньше, чем у засух: долгий период плохой воды суровее, поскольку насосы качают токсичную воду, а почва деградирует."
jaJP = "高原で悪潮がどれだけ長くなるか。初期設定では干ばつより短くなっています。長い悪潮はより過酷です。ポンプで汲み上げた水が汚染水であり、土壌が劣化するためです。"
frFR = "Durée supplémentaire des marées toxiques sur le plateau. Par défaut, elle reste inférieure à celle des sécheresses : une longue marée toxique est plus rude, car l’eau pompée est de l’eau contaminée et le sol se dégrade."
deDE = "Um wie viel länger die Badwasserzeiten auf dem Plateau werden. Standardmäßig kürzer als Dürren: Eine lange Badwasserzeit ist härter, da gepumptes Wasser schlechtes Wasser ist und der Boden sich verschlechtert."
plPL = "O ile dłuższe stają się przypływy złej wody na płaskowyżu. Domyślnie krótsze niż susze: długi przypływ złej wody jest dotkliwszy, ponieważ pompowana woda to zła woda, a gleba ulega degradacji."
ptBR = "Quanto mais longas as marés de água contaminada ficam no planalto. Por padrão, são mais curtas que as secas: uma maré longa é mais severa, pois a água bombeada é água contaminada e o solo se degrada."
koKR = "고원에서 악취수가 얼마나 더 오래 지속되는지를 나타냅니다. 기본적으로 가뭄보다 짧게 설정됩니다. 악취수가 길어지면 펌프로 끌어올린 물이 오염수이고 토양이 황폐해지므로 피해가 더 심합니다."
csCZ = "O kolik se na plošině prodlouží období kontaminované vody. Ve výchozím nastavení je kratší než sucho: dlouhé období kontaminované vody je náročnější, protože čerpaná voda je kontaminovaná a půda se znehodnocuje."
viVN = "Badtide kéo dài thêm bao lâu khi tiến triển. Mặc định thời lượng badtide ngắn hơn hạn hán: badtide kéo dài khắc nghiệt hơn, vì nước được bơm lên là nước ô nhiễm và đất đai bị thoái hóa."
trTR = "Yayladaki zehirli gelgitlerin ne kadar daha uzun süreceği. Varsayılan olarak kuraklıklardan daha kısa tutulur: Uzun bir zehirli gelgit daha zorludur; çünkü pompalanan su zehirli sudur ve toprak bozulur."

