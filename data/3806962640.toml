["ClimateProgression.Preview.WarnRatio"]
raw = "Warning: at the plateau there is less than one temperate day for five hazard days. A settlement is unlikely to survive that without very large reserves."
status = "normal"
enUS = "Warning: At the plateau, there is less than one temperate day for every five hazard days. A settlement is unlikely to survive that without very large reserves."
zhCN = "警告：在高原，5个灾害日中温和天气不足1天。没有非常充足的储备，定居点很难撑过这段时期。"
zhTW = "警告：高原的每五個危害日中，溫和天氣日不到一天。沒有非常大量的儲備，殖民地恐怕難以存活。"
ruRU = "Предупреждение: на плато на каждые пять опасных дней приходится меньше одного дня умеренного климата. Поселение вряд ли переживёт это без очень больших запасов."
jaJP = "警告：高原では、危険日が5日ある間に温暖な日は1日未満です。非常に大きな備蓄がなければ、集落がこれを乗り切るのは難しいでしょう。"
frFR = "Attention : sur le plateau, il y a moins d’une journée tempérée pour cinq jours de danger. Il est peu probable qu’une colonie survive sans de très grandes réserves."
deDE = "Warnung: Auf dem Plateau kommt auf fünf Gefahren-Tage weniger als ein gemäßigter Tag. Eine Siedlung wird das ohne sehr große Vorräte wahrscheinlich nicht überleben."
plPL = "Ostrzeżenie: na płaskowyżu na pięć dni zagrożenia przypada mniej niż jeden dzień umiarkowanego klimatu. Osada prawdopodobnie nie przetrwa tego bez bardzo dużych zapasów."
ptBR = "Aviso: no planalto, há menos de um dia temperado para cada cinco dias de perigo. É improvável que um assentamento sobreviva a isso sem reservas muito grandes."
koKR = "경고: 고원에서는 위험 기간 5일 동안 온화한 날씨가 하루도 채 되지 않습니다. 비축량이 매우 많지 않다면 정착지가 이를 견뎌내기 어려울 것입니다."
csCZ = "Varování: na náhorní plošině připadá na pět dní s nebezpečnými podmínkami méně než jeden den s mírným klimatem. Osada to pravděpodobně nepřežije bez velmi velkých zásob."
viVN = "Cảnh báo: trên cao nguyên, cứ mỗi năm ngày hiểm họa lại có chưa đến một ngày ôn hòa. Một khu định cư khó có thể sống sót qua điều đó nếu không có lượng dự trữ rất lớn."
trTR = "Uyarı: Yaylada beş tehlike günü başına bir ılıman günden az süre var. Çok büyük rezervler olmadan bir yerleşimin hayatta kalması pek olası değil."

["ClimateProgression.Preview.WarnFloor"]
raw = "Warning: the good season is pinned to its floor. Lower the temperate multiplier further and nothing will change; raise the floor to soften the late game."
