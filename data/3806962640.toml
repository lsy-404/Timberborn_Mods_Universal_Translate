["ClimateProgression.StartCycle.Tooltip"]
status = "normal"
raw = "Up to this cycle nothing changes: droughts and badtides last exactly what you configured in the game setup. Escalation only begins afterwards."
enUS = "Up to this cycle, nothing changes: droughts and badtides last exactly as long as you configured in the game setup. Escalation begins only afterward."
zhCN = "在此周期之前，一切保持不变：干旱和恶水潮的持续时间完全按照你在游戏设置中配置的时长。之后才会开始升级。"
zhTW = "直到這個週期為止，一切都不會改變：乾旱和毒潮的持續時間完全依照你在遊戲設定中配置的時長。之後才會開始逐步升級。"
ruRU = "До этого цикла ничего не меняется: засухи и ядовитые приливы длятся ровно столько, сколько задано в настройках игры. Усложнение начинается только после этого."
jaJP = "このサイクルまでは何も変わりません。干ばつと毒水の潮は、ゲーム設定で指定した長さのままです。激化が始まるのはその後だけです。"
frFR = "Jusqu’à ce cycle, rien ne change : les sécheresses et les marées toxiques durent exactement le temps défini dans les paramètres de la partie. L’escalade ne commence qu’ensuite."
deDE = "Bis zu diesem Zyklus ändert sich nichts: Dürren und Flutwellen mit Schadwasser dauern genau so lange, wie du es in den Spieleinstellungen festgelegt hast. Die Eskalation beginnt erst danach."
plPL = "Do tego cyklu nic się nie zmienia: susze i toksyczne przypływy trwają dokładnie tyle, ile ustawiono w konfiguracji gry. Eskalacja rozpoczyna się dopiero później."
ptBR = "Até este ciclo, nada muda: as secas e as marés tóxicas duram exatamente o que você configurou na criação do jogo. A progressão só começa depois disso."
koKR = "이 주기까지는 아무것도 변하지 않습니다. 가뭄과 유독수위 상승은 게임 설정에서 지정한 시간만큼 정확히 지속됩니다. 이후에만 단계적 악화가 시작됩니다."
csCZ = "Až do tohoto cyklu se nic nemění: sucha a vlny znečištěné vody trvají přesně tak dlouho, jak jste nastavili při zakládání hry. Zvyšování obtížnosti začne až poté."
viVN = "Cho đến chu kỳ này, không có gì thay đổi: hạn hán và thủy triều ô nhiễm kéo dài đúng bằng thời gian bạn đã thiết lập trong phần cài đặt trò chơi. Quá trình leo thang chỉ bắt đầu sau đó."
trTR = "Bu döngüye kadar hiçbir şey değişmez: kuraklıklar ve kötü gelgitler, oyun kurulumunda ayarladığınız süre boyunca devam eder. Tırmanış ancak bundan sonra başlar."

