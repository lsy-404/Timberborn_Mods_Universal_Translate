["ClimateProgression.Preview.SourceDefault"]
status = "normal"
raw = "Based on the default game mode. Your own setup may use other durations; hazard warm-up is estimated from the chance for a badtide."
enUS = "Based on the default game mode. Your setup may use different durations; hazard warm-up is estimated based on the chance of a badtide."
zhCN = "基于默认游戏模式。你自己的设置可能采用其他时长；灾害预热时间是根据恶潮发生的概率估算的。"
zhTW = "以預設遊戲模式為基準。你的設定可能使用其他時長；危害暖機時間是根據壞潮的發生機率估算的。"
ruRU = "Основано на стандартном игровом режиме. В вашей игре длительность периодов может быть другой; прогрев перед опасным периодом оценён исходя из вероятности токсичного прилива."
jaJP = "デフォルトのゲームモードに基づいています。独自の設定では期間が異なる場合があります。ハザードの準備期間は、悪潮の発生確率から推定されています。"
frFR = "Basé sur le mode de jeu par défaut. Votre propre configuration peut utiliser d’autres durées ; la période de préparation au danger est estimée à partir de la probabilité d’une marée toxique."
deDE = "Basiert auf dem Standard-Spielmodus. Deine eigene Konfiguration kann andere Zeiträume verwenden; die Aufwärmzeit der Gefahr wird anhand der Wahrscheinlichkeit einer Schmutzflut geschätzt."
plPL = "Na podstawie domyślnego trybu gry. Własna konfiguracja może używać innych czasów trwania; rozgrzewkę zagrożenia oszacowano na podstawie prawdopodobieństwa wystąpienia złej fali."
ptBR = "Com base no modo de jogo padrão. Sua configuração pode usar outras durações; o aquecimento do perigo é estimado com base na chance de ocorrer uma maré tóxica."
koKR = "기본 게임 모드를 기준으로 합니다. 직접 설정한 경우 지속 시간이 다를 수 있으며, 재해 예열 시간은 독성 조수가 발생할 확률을 바탕으로 추정합니다."
csCZ = "Vychází z výchozího herního režimu. Vaše vlastní nastavení může používat jiné délky trvání; zahřátí nebezpečí je odhadnuto na základě pravděpodobnosti výskytu toxického přílivu."
viVN = "Dựa trên chế độ chơi mặc định. Thiết lập của bạn có thể dùng thời lượng khác; thời gian khởi động của hiểm họa được ước tính dựa trên khả năng xảy ra thủy triều độc hại."
trTR = "Varsayılan oyun moduna dayanır. Kendi kurulumunuz farklı süreler kullanabilir; tehlike hazırlık süresi, kötü gelgit olasılığına göre tahmin edilir."

