["ClimateProgression.BadtideIntensity.Tooltip"]
status = "normal"
raw = "How much longer badtides get at the plateau. Kept lower than droughts by default: a long badtide is harsher, since pumped water is badwater and soil degrades."
enUS = "How much longer badtides last at the plateau. Kept shorter than droughts by default: a long badtide is harsher, since pumped water is badwater and soil degrades."
zhCN = "高原地区恶潮持续时间的延长幅度。默认情况下，恶潮的持续时间短于干旱：恶潮持续时间过长会更加严酷，因为抽上来的水是恶水，而且土壤会退化。"
zhTW = "高原上的毒水潮會延長多久。預設值低於乾旱：毒水潮持續越久，影響越嚴重，因為抽上來的水是毒水，而且土壤會退化。"
ruRU = "Насколько дольше длятся токсичные половодья на плато. По умолчанию их длительность меньше, чем у засух: длительное токсичное половодье суровее, поскольку насосы качают токсичную воду, а почва деградирует."
jaJP = "高原での毒水潮の延長時間。初期設定では干ばつより短くなっています。毒水潮が長引くと、汲み上げた水は毒水で、土壌も劣化するため、より過酷になります。"
frFR = "De combien les marées toxiques s’allongent au plateau. La valeur par défaut est inférieure à celle des sécheresses : une longue marée toxique est plus dure, car l’eau pompée est de l’eau polluée et les sols se dégradent."
deDE = "Um wie viel länger die Badwasserfluten auf dem Plateau werden. Standardmäßig kürzer als Dürren: Eine lange Badwasserflut ist härter, da gepumptes Wasser schlechtes Wasser ist und der Boden verödet."
plPL = "O ile dłużej trwają przypływy skażonej wody na płaskowyżu. Domyślnie krócej niż susze: długi przypływ skażonej wody jest dotkliwszy, ponieważ pompowana woda jest skażona, a gleba ulega degradacji."
ptBR = "Por quanto tempo a mais as marés tóxicas duram no planalto. Por padrão, ficam abaixo das secas: uma maré tóxica longa é mais severa, pois a água bombeada é água contaminada e o solo se degrada."
koKR = "고원에서 독성 수위가 얼마나 더 오래 지속되는지를 나타냅니다. 기본적으로 가뭄보다는 짧게 설정되어 있습니다. 독성 수위가 길어지면 양수한 물이 오염수이고 토양이 황폐해지므로 더 가혹합니다."
csCZ = "O kolik déle trvají v pozdější fázi hry jedovaté přílivy. Ve výchozím nastavení jsou kratší než sucha: dlouhý jedovatý příliv je drsnější, protože čerpaná voda je zamořená a půda se znehodnocuje."
viVN = "Badtide kéo dài thêm bao lâu ở cao nguyên. Mặc định được giữ ngắn hơn hạn hán: badtide dài khắc nghiệt hơn, vì nước được bơm lên là nước ô nhiễm và đất bị thoái hóa."
trTR = "Yaylada kötü gelgitlerin ne kadar daha uzun süreceği. Varsayılan olarak kuraklıklardan daha kısa tutulur: uzun bir kötü gelgit daha zorludur, çünkü pompalanan su zehirli sudur ve toprak bozulur."

