["ClimateProgression.DroughtIntensity.Tooltip"]
status = "normal"
raw = "How much longer droughts get once escalation is complete, compared to the duration you configured when starting the game. The chart below shows the result."
enUS = "How much longer droughts last after escalation is complete compared to the duration you configured when starting the game. The chart below shows the result."
zhCN = "升级过程完成后，旱灾会比你开始游戏时设定的持续时间延长多少。下方图表展示了结果。"
zhTW = "升級完成後，乾旱會比你開始遊戲時設定的持續時間延長多久。下方圖表顯示結果。"
ruRU = "Насколько дольше становятся засухи после завершения эскалации по сравнению с длительностью, заданной при начале игры. На графике ниже показан результат."
jaJP = "エスカレーション完了後の干ばつの期間が、ゲーム開始時に設定した期間と比べてどれだけ長くなるかを示します。下のグラフはその結果を示しています。"
frFR = "De combien les sécheresses s’allongent une fois l’escalade terminée, par rapport à la durée que vous avez définie au démarrage de la partie. Le graphique ci-dessous montre le résultat."
deDE = "Um wie viel länger Dürren nach abgeschlossener Eskalation dauern, verglichen mit der beim Spielstart festgelegten Dauer. Das Diagramm unten zeigt das Ergebnis."
plPL = "O ile dłuższe stają się susze po zakończeniu eskalacji w porównaniu z czasem trwania ustawionym podczas rozpoczynania gry. Poniższy wykres pokazuje wynik."
ptBR = "Quanto mais longas ficam as secas após a conclusão da escalada, em comparação com a duração configurada ao iniciar o jogo. O gráfico abaixo mostra o resultado."
koKR = "기후 악화가 완료되면 가뭄이 얼마나 더 길어지는지, 게임 시작 시 설정한 지속 시간과 비교해 보여줍니다. 아래 차트에서 결과를 확인할 수 있습니다."
csCZ = "O kolik déle trvají sucha po dokončení eskalace ve srovnání s délkou nastavenou při zahájení hry. Výsledek ukazuje graf níže."
viVN = "Sau khi mức leo thang hoàn tất, hạn hán sẽ kéo dài hơn bao lâu so với thời lượng bạn đã thiết lập khi bắt đầu trò chơi. Biểu đồ bên dưới cho thấy kết quả."
trTR = "Kademeli artış tamamlandıktan sonra kuraklıkların, oyunu başlatırken ayarladığınız süreye kıyasla ne kadar daha uzun sürdüğünü gösterir. Aşağıdaki grafik sonucu gösterir."

