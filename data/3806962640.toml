["ClimateProgression.TemperateFloorDays.Tooltip"]
raw = "Hard floor the good season never goes under, whatever the multiplier. This is what keeps the late game playable rather than unwinnable."
status = "normal"
enUS = "The good season never goes below this hard floor, regardless of the multiplier. This is what keeps the late game playable rather than unwinnable."
zhCN = "丰水季的天数有硬性下限，不会因任何倍率而低于此值。正是这一点让游戏后期仍然可玩，而不至于变得无法取胜。"
zhTW = "良好季節的天數有固定下限，不會因任何倍率而低於此下限。這能讓遊戲後期仍可遊玩，而不至於變得無法取勝。"
ruRU = "Нижний предел продолжительности благоприятного сезона — он никогда не опустится ниже этого значения, каким бы ни был множитель. Благодаря этому поздняя игра остаётся проходимой, а не становится непобедимой."
jaJP = "どんな倍率でも、好天季の長さがこれを下回ることはありません。これがあるおかげで、終盤が勝ち目のない状態ではなく、プレイ可能な状態に保たれます。"
frFR = "Plancher minimal du nombre de jours de saison humide, quelle que soit la valeur du multiplicateur. C'est ce qui permet de continuer à jouer en fin de partie au lieu de rendre la partie impossible à gagner."
deDE = "Feste Untergrenze: Die Dauer der guten Jahreszeit sinkt unabhängig vom Multiplikator nie darunter. So bleibt das Endgame spielbar und wird nicht ungewinnbar."
plPL = "Minimalna długość dobrej pory roku nigdy nie spada poniżej tej wartości, niezależnie od mnożnika. Dzięki temu w późnej fazie gry rozgrywka pozostaje możliwa do wygrania."
ptBR = "O limite mínimo de dias da estação boa nunca fica abaixo disso, independentemente do multiplicador. É isso que mantém o jogo jogável no fim, em vez de impossível de vencer."
koKR = "승수가 얼마든 간에 좋은 계절이 이보다 짧아지지 않도록 하는 최저 일수입니다. 이 덕분에 후반 게임이 이길 수 없는 상황이 아니라 계속 플레이할 수 있는 상태로 유지됩니다."
csCZ = "Pevná spodní hranice: dobrá sezóna nikdy neklesne pod tuto hodnotu, bez ohledu na násobitel. Díky tomu zůstává pozdní fáze hry hratelná, nikoli nevyhratelná."
viVN = "Số ngày mùa tốt tối thiểu luôn được giữ nguyên, bất kể hệ số nhân là bao nhiêu. Nhờ vậy, giai đoạn cuối game vẫn có thể chơi được thay vì trở nên bất khả chiến thắng."
trTR = "İyi mevsimin süresi, çarpan ne olursa olsun hiçbir zaman bu sabit taban sürenin altına düşmez. Oyunun son aşamasını kazanılamaz kılmak yerine oynanabilir tutan şey budur."

