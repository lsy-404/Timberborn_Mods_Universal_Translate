["ClimateProgression.TemperateIntensity.Tooltip"]
raw = "How much shorter the good season gets at the plateau. Careful: shortening production time while lengthening hazards compounds, so difficulty rises much faster than the two settings suggest."
status = "normal"
enUS = "How much shorter the good season gets at the plateau. Careful: shortening production time while lengthening hazards compounds, so difficulty rises much faster than the two settings suggest."
zhCN = "到达高原期后，良好季节会缩短多少。注意：缩短生产时间的同时延长灾害持续时间，两者会叠加，使难度上升得远比这两个设置所显示的更快。"
zhTW = "到達高原時，豐水期會縮短多少。請注意：縮短生產時間的同時拉長災害時間，兩者會相互疊加，因此難度上升的速度遠比這兩項設定所暗示的快。"
ruRU = "Насколько короче становится благоприятный сезон на плато. Осторожно: сокращение производственного времени и одновременное увеличение длительности опасных периодов усиливают друг друга, поэтому сложность растёт гораздо быстрее, чем можно предположить по двум настройкам."
jaJP = "高原では好季節がどれほど短くなるかに注意。生産時間を短縮し、危険な季節を延長すると、その影響は重なり合うため、難易度は2つの設定値から想像するよりもはるかに速く上昇します。"
frFR = "De combien la saison favorable raccourcit au plateau. Attention : raccourcir le temps de production tout en allongeant les périodes de danger a un effet cumulatif, si bien que la difficulté augmente bien plus vite que ne le laissent penser les deux paramètres."
deDE = "Um wie viel sich die gute Jahreszeit auf dem Plateau verkürzt. Vorsicht: Wenn die Produktionszeit kürzer und die Gefahren länger werden, verstärkt sich der Effekt – der Schwierigkeitsgrad steigt also viel schneller, als die beiden Einstellungen vermuten lassen."
plPL = "O ile krótszy jest dobry sezon na płaskowyżu. Uwaga: skrócenie czasu produkcji przy jednoczesnym wydłużeniu okresów zagrożeń potęguje efekt, więc poziom trudności rośnie znacznie szybciej, niż sugerują te dwa ustawienia."
ptBR = "Quanto mais curta fica a estação boa no platô. Cuidado: encurtar o tempo de produção enquanto se prolongam os perigos tem um efeito cumulativo, então a dificuldade aumenta muito mais rápido do que os dois ajustes sugerem."
koKR = "고원에서는 풍요로운 계절이 얼마나 짧아지는지 확인하세요. 주의: 생산 시간을 줄이고 위험 요소의 지속 시간을 늘리면 효과가 누적되므로, 난이도가 두 설정만 보고 예상하는 것보다 훨씬 빠르게 상승합니다."
csCZ = "O kolik se na náhorní plošině zkrátí příznivé období. Pozor: zkrácení doby produkce a prodloužení nebezpečných období se násobí, takže obtížnost roste mnohem rychleji, než by naznačovala tato dvě nastavení."
viVN = "Mùa thuận lợi ngắn đi bao nhiêu khi lên cao nguyên. Hãy cẩn thận: rút ngắn thời gian sản xuất đồng thời kéo dài các hiểm họa sẽ cộng dồn tác động, khiến độ khó tăng nhanh hơn nhiều so với những gì hai cài đặt này gợi ý."
trTR = "Yayladaki iyi mevsim ne kadar kısalıyor. Dikkat: tehlikeler uzarken üretim süresinin kısalması etkileri katlar; bu yüzden zorluk, iki ayarın düşündürdüğünden çok daha hızlı artar."

