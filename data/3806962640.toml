["ClimateProgression.StartCycle.Tooltip"]
raw = "Up to this cycle nothing changes: droughts and badtides last exactly what you configured in the game setup. Escalation only begins afterwards."
status = "normal"
enUS = "Up to this cycle, nothing changes: droughts and badtides last exactly as long as you configured in the game setup. Escalation only begins afterward."
zhCN = "直到这个周期为止，一切都不会改变：干旱和恶水潮持续时间完全按照你在游戏设置中配置的时长。之后才会开始逐步升级。"
zhTW = "在這個週期之前，一切都不會改變：乾旱和毒潮的持續時間完全按照你在遊戲設定中配置的時間。之後才會開始逐步升級。"
ruRU = "До этого цикла ничего не меняется: засухи и токсичные приливы длятся ровно столько, сколько вы указали в настройках игры. Эскалация начинается только после этого."
jaJP = "このサイクルまでは何も変わりません。干ばつと毒水の増水は、ゲーム設定で指定した期間ちょうど続きます。その後にのみ、段階的な悪化が始まります。"
frFR = "Jusqu’à ce cycle, rien ne change : les sécheresses et les marées toxiques durent exactement le temps configuré dans les paramètres de la partie. L’escalade ne commence qu’ensuite."
deDE = "Bis zu diesem Zyklus ändert sich nichts: Dürren und Schadfluten dauern genau so lange, wie du es in den Spieleinstellungen festgelegt hast. Die Eskalation beginnt erst danach."
plPL = "Do tego cyklu nic się nie zmienia: susze i toksyczne przypływy trwają dokładnie tyle, ile ustawiono w konfiguracji gry. Eskalacja zaczyna się dopiero później."
ptBR = "Até este ciclo, nada muda: as secas e as marés tóxicas duram exatamente o tempo que você configurou na preparação do jogo. A progressão só começa depois disso."
koKR = "이 주기까지는 아무것도 바뀌지 않습니다. 가뭄과 유독수역은 게임 설정에서 지정한 기간만큼 정확히 지속됩니다. 이후부터만 악화가 시작됩니다."
csCZ = "Až do tohoto cyklu se nic nemění: sucha a vlny znečištěné vody trvají přesně tak dlouho, jak jste nastavili při zahájení hry. Zvyšování intenzity začíná až poté."
viVN = "Cho đến chu kỳ này, mọi thứ vẫn không thay đổi: hạn hán và đợt nước xấu kéo dài đúng như thời lượng bạn đã thiết lập khi bắt đầu trò chơi. Mức độ khắc nghiệt chỉ bắt đầu tăng sau đó."
trTR = "Bu döngüye kadar hiçbir şey değişmez: kuraklıklar ve kötü gelgitler, oyun kurulumunda ayarladığınız süre boyunca devam eder. Tırmanış ancak bundan sonra başlar."

