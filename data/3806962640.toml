["ClimateProgression.FullCycle.Tooltip"]
status = "normal"
raw = "Cycle at which the settings below are fully applied. Past this point difficulty stops rising: the curve holds a plateau instead of growing forever. Cannot sit before the start of the escalation; moving either slider pushes the other."
enUS = "Cycle at which the settings below are fully applied. After this point, difficulty stops rising: the curve plateaus instead of growing forever. Cannot be set before the start of the escalation; moving either slider moves the other."
zhCN = "下方设置完全生效时所处的周期。超过此点后，难度不再上升：曲线会保持平台，不会永无止境地增长。不能设在难度升级开始之前；移动任一滑块都会带动另一个滑块。"
zhTW = "下方設定完全生效的週期。超過此週期後，難度便不再上升：曲線會維持平緩，不會無止境地增長。不能設在難度開始提升之前；移動任一滑桿都會推動另一個滑桿。"
ruRU = "Цикл, к которому настройки ниже полностью вступают в силу. После этой точки сложность перестаёт расти: кривая выходит на плато, а не продолжает расти бесконечно. Нельзя установить значение раньше начала нарастания сложности; перемещение любого ползунка сдвигает и другой."
jaJP = "以下の設定が完全に適用されるサイクル。このサイクル以降は難易度の上昇が止まり、曲線は際限なく伸びずに横ばいになる。難易度上昇の開始前には設定できない。どちらかのスライダーを動かすと、もう一方も動く。"
frFR = "Cycle auquel les paramètres ci-dessous sont pleinement appliqués. Au-delà, la difficulté cesse d’augmenter : la courbe se stabilise au lieu de croître indéfiniment. Ne peut pas précéder le début de la montée en difficulté ; déplacer l’un des curseurs déplace l’autre."
deDE = "Zyklus, ab dem die unten aufgeführten Einstellungen vollständig angewendet werden. Ab diesem Punkt steigt der Schwierigkeitsgrad nicht weiter: Die Kurve bleibt auf einem Plateau, statt endlos weiter anzusteigen. Kann nicht vor dem Beginn der Eskalation liegen; wenn du einen der beiden Schieberegler verschiebst, wird der andere mitbewegt."
plPL = "Cykl, w którym poniższe ustawienia zostają w pełni zastosowane. Po tym punkcie poziom trudności przestaje rosnąć: krzywa przechodzi w plateau zamiast rosnąć bez końca. Nie może przypadać przed początkiem eskalacji; przesunięcie dowolnego z suwaków przesuwa drugi."
ptBR = "Ciclo em que as configurações abaixo são totalmente aplicadas. Depois desse ponto, a dificuldade para de aumentar: a curva se mantém em um platô, em vez de crescer para sempre. Não pode ficar antes do início da escalada; mover qualquer um dos controles deslizantes move o outro."
koKR = "아래 설정이 완전히 적용되는 주기입니다. 이 시점부터 난이도 상승이 멈춥니다. 난이도 곡선은 계속 높아지는 대신 정체 상태를 유지합니다. 난이도 상승이 시작되기 전으로 설정할 수 없습니다. 어느 한쪽 슬라이더를 움직이면 다른 쪽도 함께 움직입니다."
csCZ = "Cyklus, ve kterém se níže uvedená nastavení plně uplatní. Poté se obtížnost přestane zvyšovat: křivka dosáhne plató a už dál neroste. Nemůže být před začátkem zvyšování obtížnosti; posunutí kteréhokoli z posuvníků posune i ten druhý."
viVN = "Chu kỳ mà các thiết lập bên dưới được áp dụng đầy đủ. Sau mốc này, độ khó không tăng thêm: đường cong giữ nguyên ở mức ổn định thay vì tăng mãi. Không thể đặt trước thời điểm bắt đầu tăng độ khó; di chuyển một thanh trượt sẽ đẩy thanh còn lại."
trTR = "Aşağıdaki ayarların tamamen uygulandığı döngü. Bu noktadan sonra zorluk artmayı bırakır: eğri sonsuza kadar yükselmek yerine bir platoda sabit kalır. Zorluğun artmaya başladığı noktadan önce olamaz; kaydırıcılardan birini hareket ettirmek diğerini de hareket ettirir."

