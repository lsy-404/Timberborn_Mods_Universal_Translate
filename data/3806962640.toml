raw = "How much shorter the good season gets at the plateau. Careful: shortening production time while lengthening hazards compounds, so difficulty rises much faster than the two settings suggest."
enUS = "How much shorter the good season gets at the plateau. Careful: shortening production time while lengthening hazards compounds, so difficulty rises much faster than the two settings suggest."
zhCN = "良好季节在强度达到最高时会缩短多少。注意：缩短生产时间的同时延长灾害持续时间，影响会叠加，因此难度上升的速度远超这两个设置所暗示的程度。"
zhTW = "高原期時，豐水季會縮短多少。請注意：縮短生產時間、延長災害時間會產生疊加效果，因此難度上升的速度遠比這兩項設定所暗示的快。"
ruRU = "Насколько сокращается благоприятный сезон на плато. Осторожно: сокращение времени производства одновременно с увеличением продолжительности опасных периодов суммируется, поэтому сложность растёт гораздо быстрее, чем можно предположить по двум настройкам."
jaJP = "高原では、豊作期がどれだけ短くなるかを示します。注意：生産期間の短縮と危険期間の延長が重なるため、難易度は2つの設定から想像するよりはるかに急速に上昇します。"
frFR = "Dans quelle mesure la saison favorable raccourcit au plateau. Attention : raccourcir la durée de production tout en allongeant celle des dangers a un effet cumulatif ; la difficulté augmente donc bien plus rapidement que ne le laissent penser les deux paramètres."
deDE = "Wie viel kürzer die gute Jahreszeit auf dem Plateau wird. Vorsicht: Wenn die Produktionszeit verkürzt und gleichzeitig die Gefahren verlängert werden, verstärkt sich der Effekt – der Schwierigkeitsgrad steigt also viel stärker, als die beiden Einstellungen vermuten lassen."
plPL = "O ile krótszy staje się dobry sezon na płaskowyżu. Uwaga: skrócenie czasu produkcji przy jednoczesnym wydłużeniu okresów zagrożeń potęguje się, więc poziom trudności rośnie znacznie szybciej, niż sugerują te dwa ustawienia."
ptBR = "Quanto mais curta fica a estação favorável no nível máximo. Cuidado: encurtar o tempo de produção e prolongar os períodos de perigo se combinam, então a dificuldade aumenta muito mais rápido do que os dois ajustes sugerem."
koKR = "고원 단계에서는 좋은 계절이 얼마나 짧아지는지 보여 줍니다. 주의: 생산 시간을 줄이고 위험 기간을 늘리면 효과가 누적되므로, 난이도가 두 설정이 암시하는 것보다 훨씬 빠르게 상승합니다."
csCZ = "O kolik se na náhorní plošině zkrátí příznivé období. Pozor: zkrácení doby produkce a současné prodloužení nebezpečných období se vzájemně násobí, takže obtížnost roste mnohem rychleji, než by naznačovala tato dvě nastavení."
viVN = "Mùa thuận lợi bị rút ngắn đi bao nhiêu khi đạt đến mức cao nhất. Hãy cẩn thận: rút ngắn thời gian sản xuất đồng thời kéo dài thời gian hiểm họa sẽ cộng dồn tác động, khiến độ khó tăng nhanh hơn nhiều so với những gì hai thiết lập này gợi ý."
trTR = "Yaylada iyi mevsimin ne kadar kısaldığı. Dikkat: tehlikeleri uzatırken üretim süresini kısaltmak etkileri katlayarak artırır; bu yüzden zorluk, iki ayarın düşündürdüğünden çok daha hızlı yükselir."

