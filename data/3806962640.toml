["ClimateProgression.FullCycle.Tooltip"]
raw = "Cycle at which the settings below are fully applied. Past this point difficulty stops rising: the curve holds a plateau instead of growing forever. Cannot sit before the start of the escalation; moving either slider pushes the other."
status = "normal"
enUS = "Cycle at which the settings below are fully applied. After this point, difficulty stops rising: the curve plateaus instead of growing forever. Cannot be set before the start of the escalation; moving either slider moves the other."
zhCN = "以下设置完全生效的周期。超过此周期后，难度不再上升：曲线会保持平稳，而不是无限增长。不能设在难度开始升级之前；移动任一滑块都会带动另一个滑块。"
zhTW = "下方設定完全套用的週期。超過此週期後，難度便不再上升：曲線會維持平臺，而非無止境地增長。不能設在難度開始升高之前；移動任一滑桿都會帶動另一個滑桿。"
ruRU = "Цикл, к которому настройки ниже применяются в полной мере. После него сложность перестаёт расти: кривая выходит на плато, а не растёт бесконечно. Не может быть раньше начала эскалации; перемещение любого ползунка сдвигает другой."
jaJP = "以下の設定が完全に適用されるサイクル。この時点を過ぎると難易度の上昇は止まり、曲線は永遠に上がり続けるのではなく、横ばいになります。難易度上昇の開始前には設定できません。どちらかのスライダーを動かすと、もう一方も動きます。"
frFR = "Cycle auquel les paramètres ci-dessous sont pleinement appliqués. Au-delà de ce point, la difficulté n’augmente plus : la courbe atteint un plateau au lieu de croître indéfiniment. Ne peut pas être antérieur au début de la montée en difficulté ; déplacer l’un des curseurs déplace l’autre."
deDE = "Zyklus, ab dem die untenstehenden Einstellungen vollständig greifen. Ab diesem Punkt steigt der Schwierigkeitsgrad nicht weiter an: Die Kurve erreicht ein Plateau, statt unbegrenzt weiterzuwachsen. Kann nicht vor dem Beginn der Eskalation liegen; wenn du einen der Regler bewegst, wird der andere mitverschoben."
plPL = "Cykl, w którym poniższe ustawienia zostają w pełni zastosowane. Po tym punkcie poziom trudności przestaje rosnąć: krzywa przechodzi w plateau zamiast rosnąć bez końca. Nie może przypadać przed rozpoczęciem eskalacji; przesunięcie jednego suwaka przesuwa też drugi."
ptBR = "Ciclo em que as configurações abaixo são totalmente aplicadas. A partir desse ponto, a dificuldade para de aumentar: a curva fica em um platô em vez de crescer para sempre. Não pode ficar antes do início da escalada; mover qualquer um dos controles deslizantes desloca o outro."
koKR = "아래 설정이 완전히 적용되는 주기입니다. 이 시점부터는 난이도가 더 이상 오르지 않습니다. 난이도 곡선은 끝없이 상승하는 대신 평탄하게 유지됩니다. 난이도 상승이 시작되기 전으로 설정할 수 없습니다. 어느 한쪽 슬라이더를 움직이면 다른 쪽도 함께 움직입니다."
csCZ = "Cyklus, ve kterém se níže uvedená nastavení plně uplatní. Poté se obtížnost přestane zvyšovat: křivka se ustálí na plošině, místo aby rostla donekonečna. Nelze nastavit na dobu před začátkem zvyšování obtížnosti; posunutím jednoho posuvníku se posune i druhý."
viVN = "Chu kỳ mà các thiết lập bên dưới được áp dụng đầy đủ. Sau mốc này, độ khó không tăng nữa: đường cong giữ nguyên ở mức ổn định thay vì tăng mãi. Không thể đặt trước khi giai đoạn tăng độ khó bắt đầu; di chuyển một thanh trượt sẽ đẩy thanh còn lại."
trTR = "Aşağıdaki ayarların tamamen uygulandığı döngü. Bu noktadan sonra zorluk artışı durur: eğri sonsuza kadar yükselmek yerine sabit kalır. Zorluk artışının başlangıcından önce olamaz; kaydırıcılardan birini hareket ettirmek diğerini de hareket ettirir."

