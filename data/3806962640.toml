["ClimateProgression.Preview.WarnRatio"]
status = "normal"
raw = "Warning: at the plateau there is less than one temperate day for five hazard days. A settlement is unlikely to survive that without very large reserves."
enUS = "Warning: At the plateau, there is less than one temperate day for every five hazard days. A settlement is unlikely to survive that without very large reserves."
zhCN = "警告：在高原地区，每经历 5 天灾害天气，温和天气就不到 1 天。没有大量储备的话，定居点很难撑过去。"
zhTW = "警告：高原每五個災害日中，溫和日不到一天。沒有非常充足的儲備，聚落很難撐過去。"
ruRU = "Внимание: на плато на каждые пять опасных дней приходится меньше одного умеренного. Поселение вряд ли переживёт это без очень больших запасов."
jaJP = "警告：高原では、危険日が5日続く間に温暖な日は1日未満です。非常に大きな備蓄がなければ、入植地がこれを乗り切るのは難しいでしょう。"
frFR = "Avertissement : sur le plateau, il y a moins d’une journée tempérée pour cinq jours de danger. Une colonie a peu de chances de survivre sans de très grandes réserves."
deDE = "Warnung: Auf dem Plateau kommt auf fünf Gefahrentage weniger als ein gemäßigter Tag. Eine Siedlung wird das ohne sehr große Vorräte wahrscheinlich nicht überstehen."
plPL = "Ostrzeżenie: na płaskowyżu na każde pięć dni zagrożenia przypada mniej niż jeden umiarkowany dzień. Osada raczej nie przetrwa tego bez bardzo dużych zapasów."
ptBR = "Aviso: no planalto, há menos de um dia temperado para cada cinco dias de perigo. É improvável que um assentamento sobreviva a isso sem reservas muito grandes."
koKR = "경고: 고원에서는 위험일 5일당 온화한 날이 하루 미만입니다. 매우 많은 비축분이 없으면 정착지가 살아남기 어렵습니다."
csCZ = "Varování: na náhorní plošině připadá na pět nebezpečných dní méně než jeden mírný den. Je nepravděpodobné, že by osada bez velmi velkých zásob přežila."
viVN = "Cảnh báo: trên cao nguyên, cứ mỗi năm ngày nguy hiểm thì chưa đến một ngày ôn hòa. Khu định cư khó có thể sống sót nếu không có lượng dự trữ rất lớn."
trTR = "Uyarı: Platoda beş tehlike günü başına birden az ılıman gün var. Çok büyük rezervler olmadan bir yerleşimin hayatta kalması pek olası değil."

["ClimateProgression.Preview.WarnFloor"]
status = "normal"
raw = "Warning: the good season is pinned to its floor. Lower the temperate multiplier further and nothing will change; raise the floor to soften the late game."
enUS = "Warning: the good season is pinned to its floor. Lower the temperate multiplier further and nothing will change; raise the floor to soften the late game."
zhCN = "警告：丰水季已固定在其下限。进一步降低温和季节倍率不会有任何变化；提高下限可以缓和游戏后期的难度。"
zhTW = "警告：豐水期已被固定在其下限。再降低溫和氣候倍率也不會有任何變化；提高下限可讓遊戲後期不那麼艱難。"
ruRU = "Предупреждение: благоприятный сезон зафиксирован на минимальном значении. Если ещё снизить множитель умеренного климата, ничего не изменится; повысьте нижний предел, чтобы смягчить позднюю игру."
jaJP = "警告：好天の季節は最低値に固定されています。気温倍率をさらに下げても何も変わりません。終盤を緩やかにするには、最低値を上げてください。"
frFR = "Avertissement : la saison humide est bloquée à sa valeur minimale. Réduisez davantage le multiplicateur de température et rien ne changera ; augmentez la valeur minimale pour adoucir la fin de partie."
deDE = "Warnung: Die gute Jahreszeit ist an ihren Mindestwert gebunden. Senkst du den Temperaturmultiplikator weiter, ändert sich nichts; erhöhe den Mindestwert, um das späte Spiel abzumildern."
plPL = "Ostrzeżenie: dobra pora roku jest ograniczona od dołu. Dalsze obniżanie mnożnika temperatury niczego nie zmieni; podnieś dolny próg, aby złagodzić końcową fazę gry."
