[_meta]
name = "StairWorks"

["StairWorks.Straight.Description"]
raw = "Climbs one level in a straight line. Uses vanilla stair movement and support rules."
status = "normal"
enUS = "Climbs one level in a straight line. Uses vanilla stair movement and support rules."
zhCN = "沿直线攀升一层。使用原版楼梯移动与支撑规则。"
zhTW = "沿直線向上爬升一層。沿用原版的樓梯移動與支撐規則。"
ruRU = "Поднимается на один уровень по прямой. Использует стандартные правила движения по лестнице и опоры из игры."
jaJP = "直線方向に1階層上ります。標準の階段の移動と支持のルールを使用します。"
frFR = "Monte d'un niveau en ligne droite. Utilise les règles vanilla de déplacement et de soutien des escaliers."
deDE = "Steigt in einer geraden Linie um eine Ebene an. Verwendet die normalen Treppenbewegungs- und Stützregeln des Spiels."
plPL = "Wspina się o jeden poziom w linii prostej. Korzysta z domyślnych zasad ruchu i podparcia dla schodów z gry."
ptBR = "Sobe um nível em linha reta. Usa as regras de movimento e de apoio das escadas originais do jogo."
koKR = "한 칸 높이만큼 직선으로 올라갑니다. 기본 계단의 이동 및 지지 규칙을 그대로 사용합니다."
csCZ = "Stoupá o jedno patro v přímé linii. Používá standardní pohyb po schodech a pravidla pro podpěry ze hry."
viVN = "Leo lên một tầng theo đường thẳng. Sử dụng quy tắc di chuyển và đỡ của bậc thang mặc định trong trò chơi."
trTR = "Düz bir çizgide bir kat yukarı çıkar. Oyunun standart merdiven hareketi ve destek kurallarını kullanır."
esES = "Sube un nivel en línea recta. Usa las reglas de movimiento y soporte de escaleras originales del juego."
itIT = "Sale di un livello in linea retta. Utilizza le regole standard di movimento e di supporto delle scale del gioco."
ukUA = "Піднімається на один рівень по прямій. Використовує стандартні правила руху та опори для сходів з базової гри."
thTH = "ขึ้นหนึ่งระดับในแนวตรง ใช้กฎการเคลื่อนที่และการรองรับของบันไดแบบเดิมของเกม"
caES = "Puja un nivell en línia recta. Utilitza el moviment i les regles de suport d'escales originals del joc."
beBY = "Падымаецца на адзін узровень па прамой. Выкарыстоўвае стандартныя правілы руху па прыступках і апоры."
roRO = "Urcă un nivel în linie dreaptă. Folosește regulile standard de mișcare și sprijin ale scărilor din joc."
huHU = "Egy szintet emelkedik egyenes vonalban. A szokásos lépcsőmozgási és alátámasztási szabályokat használja."
arSA = "يتسلق مستوى واحدًا في خط مستقيم. يستخدم قواعد حركة الدرج والدعم الأصلية في اللعبة."

["StairWorks.Turn.Description"]
raw = "Climbs one level while turning 90 degrees. Can be flipped like vanilla spiral stairs."
status = "normal"
enUS = "Climbs one level while turning 90 degrees. Can be flipped like vanilla spiral stairs."
zhCN = "上升一层的同时转向90度。可像原版螺旋楼梯一样翻转。"
zhTW = "爬升一層的同時轉向 90 度。可以像原版螺旋樓梯一樣翻轉。"
ruRU = "Поднимается на один уровень с поворотом на 90 градусов. Можно перевернуть, как обычную винтовую лестницу из базовой игры."
jaJP = "1階層上がりながら90度回転します。バニラのらせん階段と同じように反転させることができます。"
frFR = "Monte d'un niveau tout en tournant de 90 degrés. Peut être retourné comme les escaliers en colimaçon d'origine."
deDE = "Steigt eine Ebene hoch und dreht sich dabei um 90 Grad. Kann wie die originale Wendeltreppe gespiegelt werden."
plPL = "Wznosi się o jeden poziom, skręcając o 90 stopni. Można ją odwrócić, tak jak standardowe schody spiralne."
ptBR = "Sobe um nível enquanto faz uma curva de 90 graus. Pode ser invertida como as escadas em espiral originais."
koKR = "한 단계 올라가며 90도 회전합니다. 바닐라 나선 계단처럼 뒤집을 수 있습니다."
csCZ = "Stoupá o jednu úroveň a přitom se otáčí o 90 stupňů. Lze ji převrátit stejně jako standardní točité schodiště."
viVN = "Leo lên một tầng trong khi xoay 90 độ. Có thể lật ngược như cầu thang xoắn ốc gốc của game."
trTR = "Bir seviye yükselir ve 90 derece döner. Vanilla spiral merdivenler gibi ters çevrilebilir."
esES = "Sube un nivel mientras gira 90 grados. Puede invertirse como las escaleras de caracol originales."
itIT = "Sale di un livello ruotando di 90 gradi. Può essere capovolta come le scale a chiocciola originali."
ukUA = "Піднімається на один рівень із поворотом на 90 градусів. Можна перевертати, як ванільні гвинтові сходи."
thTH = "ขึ้นหนึ่งระดับพร้อมหมุน 90 องศา สามารถพลิกทิศทางได้เหมือนบันไดวนของเกมหลัก"
caES = "Puja un nivell mentre gira 90 graus. Es pot invertir com les escales de caragol originals."
beBY = "Падымаецца на адзін узровень, паварочваючы на 90 градусаў. Можа быць адлюстравана, як ванільныя спіральныя прыступкі."
roRO = "Urcă un nivel în timp ce se rotește cu 90 de grade. Poate fi întoarsă, ca scările în spirală din jocul de bază."
huHU = "Egy szintet emelkedik, miközben 90 fokot fordul. A vanilla csigalépcsőhöz hasonlóan tükrözhető."
arSA = "يرتفع مستوى واحد مع الدوران بزاوية 90 درجة. يمكن قلبه تمامًا مثل الدرج الحلزوني الأصلي في اللعبة."

