enUS = "Claims the land around it while its brazier burns, preventing other players from building there. Its reach extends farther from high ground. Sends an automation signal while enemy troops are on its land."
zhCN = "只要火盆燃烧，就会占领周围的土地，阻止其他玩家在此建造。建在高处时，占领范围更远。敌方部队踏入其领地时，会发出自动化信号。"
zhTW = "只要火盆燃燒，就會宣示周圍土地的所有權，讓其他玩家無法在此建造。位置越高，宣示範圍越遠。敵軍在其土地上時，會發出自動化訊號。"
ruRU = "Заявляет права на окружающую территорию, пока горит жаровня, не позволяя другим игрокам строить там. С возвышенности охватывает большую территорию. Подаёт сигнал автоматизации, пока на его земле находятся вражеские войска."
jaJP = "火鉢が燃えている間、周囲の土地を領有し、他のプレイヤーがそこに建設できないようにします。高所にあるほど、より遠くまで届きます。敵軍が領有地にいる間、自動化信号を送ります。"
frFR = "S’approprie le terrain autour de lui tant que son brasero brûle, empêchant ainsi les autres joueurs d’y construire. Sa portée augmente en hauteur. Envoie un signal d’automatisation lorsque des troupes ennemies se trouvent sur son terrain."
deDE = "Beansprucht das umliegende Land, solange sein Kohlebecken brennt, sodass andere Spieler dort nicht bauen können. Reicht von höher gelegenem Gelände weiter. Sendet ein Automatisierungssignal, solange sich feindliche Truppen auf seinem Land befinden."
plPL = "Zajmuje teren wokół siebie, gdy płonie w nim koksownik, uniemożliwiając innym graczom budowanie na tym obszarze. Zajmuje większy obszar z wysoko położonego miejsca. Wysyła sygnał automatyzacji, gdy na zajętym terenie znajdują się wrogie oddziały."
ptBR = "Reivindica o terreno ao seu redor enquanto seu braseiro estiver aceso, impedindo que outros jogadores construam ali. Seu alcance aumenta em terrenos elevados. Envia um sinal de automação enquanto houver tropas inimigas em seu território."
koKR = "화로가 타오르는 동안 주변 땅을 점유해 다른 플레이어가 그곳에 건물을 지을 수 없게 합니다. 높은 지대에서는 더 멀리까지 땅을 점유합니다. 적군이 점유한 땅에 있는 동안 자동화 신호를 보냅니다."
csCZ = "Dokud hoří její ohniště, zabírá okolní území, takže na něm ostatní hráči nemohou stavět. Z vyvýšeného místa dosáhne dál. Vysílá automatizační signál, když se na jejím území nacházejí nepřátelské jednotky."
viVN = "Chiếm vùng đất xung quanh khi lò than của nó còn cháy, khiến người chơi khác không thể xây dựng tại đó. Tầm chiếm đất xa hơn khi đặt ở vị trí cao. Phát tín hiệu tự động hóa khi có quân địch trên vùng đất đó."
trTR = "Mangalı yandığı sürece çevresindeki araziyi sahiplenir ve diğer oyuncuların buraya inşa yapmasını engeller. Yüksek bir konumdan daha uzağa erişir. Düşman birlikleri arazisindeyken otomasyon sinyali gönderir."

