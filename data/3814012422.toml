trTR = "Eşyalarınız saldırıya uğradığında çalan ve oyunu bitiren kornaların sesini kapatır."
esES = "Silencia la bocina que suena cuando tus cosas son atacadas, y la que indica el final de una partida."
itIT = "Silenzia il corno che suona quando le tue cose vengono attaccate e quello che segnala la fine di una partita."
ukUA = "Вимикає ріг, що лунає, коли ваші споруди атакують, а також ріг, який сповіщає про завершення гри."
thTH = "ปิดเสียงแตรที่ดังขึ้นเมื่อสิ่งของของคุณถูกโจมตี และแตรที่ใช้จบเกม"
csCZ = "Ztlumí houkačku, která se ozve, když jsou vaše věci napadeny, i tu, která oznamuje konec hry."
viVN = "Tắt tiếng còi báo động khi công trình của bạn bị tấn công và còi báo kết thúc trò chơi."
caES = "Silencia la botzina que sona quan les teves coses són atacades, i també la que indica el final d'una partida."
