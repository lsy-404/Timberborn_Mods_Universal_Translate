["Building.TimberEmpires.SiegeTrebuchet.Description"]
status = "normal"
raw = "Hurls siege stones at a chosen target, hurting enemies and battering walls, gates and siege engines. Needs warriors aboard to turn and throw."
enUS = "Hurls siege stones at a chosen target, hurting enemies and battering walls, gates, and siege engines. Needs warriors aboard to turn and throw."
zhCN = "向选定目标投掷攻城石，伤害敌人并摧毁城墙、大门和攻城器械。需要有战士操作才能转向和投掷。"
zhTW = "向選定的目標投擲攻城石，傷害敵人並破壞城牆、城門和攻城器械。需要有戰士操作，才能轉向和投擲。"
ruRU = "Метает осадные камни в выбранную цель, нанося урон врагам и разрушая стены, ворота и осадные машины. Для поворота и метания нужны воины на борту."
jaJP = "選択した標的に攻城石を投げつけ、敵にダメージを与え、壁や門、攻城兵器を打ち壊す。旋回して投石するには、搭乗した戦士が必要。"
frFR = "Lance des pierres de siège sur une cible choisie, blessant les ennemis et endommageant les murs, les portes et les engins de siège. Nécessite des guerriers à bord pour pivoter et lancer."
deDE = "Schleudert Belagerungssteine auf ein ausgewähltes Ziel, verletzt Gegner und beschädigt Mauern, Tore und Belagerungsmaschinen. Benötigt Krieger an Bord, um es zu drehen und zu werfen."
plPL = "Miota kamieniami oblężniczymi w wybrany cel, raniąc wrogów i niszcząc mury, bramy oraz machiny oblężnicze. Do obracania się i miotania potrzebuje wojowników na pokładzie."
ptBR = "Arremessa pedras de cerco contra um alvo escolhido, ferindo inimigos e danificando muralhas, portões e máquinas de cerco. Precisa de guerreiros a bordo para girar e arremessar."
koKR = "선택한 대상을 향해 공성 투석을 던져 적에게 피해를 주고 성벽, 문, 공성 병기를 공격합니다. 방향을 돌려 투척하려면 전사가 탑승해야 합니다."
csCZ = "Vrhá obléhací kameny na zvolený cíl, zraňuje nepřátele a poškozuje hradby, brány a obléhací stroje. K otáčení a vrhání potřebuje obsluhu z řad bojovníků."
viVN = "Phóng đá công thành vào mục tiêu đã chọn, gây thương tích cho kẻ địch và phá hoại tường, cổng cùng máy công thành. Cần có chiến binh bên trong để xoay và ném đá."
trTR = "Seçilen hedefe kuşatma taşları fırlatarak düşmanlara zarar verir, duvarları, kapıları ve kuşatma makinelerini hırpalar. Döndürüp taş fırlatmak için içinde savaşçılar bulunmalıdır."

