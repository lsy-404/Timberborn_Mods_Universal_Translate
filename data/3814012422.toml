plPL = "Maksymalna liczba zombie-szopów rysowanych jednocześnie spośród tych widocznych dla kamery. Większa liczba zagęszcza hordę i zwiększa koszt każdej klatki."
ptBR = "O maior número de guaxinins zumbis renderizados de uma vez entre os que a câmera vê. Um número maior deixa a horda mais densa e custa mais a cada quadro."
koKR = "카메라에 보이는 좀비 너구리 중 한 번에 표시되는 최대 수입니다. 수가 많을수록 무리가 더 빽빽해지고 프레임마다 더 많은 비용이 듭니다."
trTR = "Kameranın gördükleri arasından aynı anda çizilen en fazla zombi rakun sayısı. Sayı arttıkça sürü yoğunlaşır ve her karede daha fazla işlem gücü gerekir."
esES = "El mayor número de mapaches zombis dibujados a la vez entre los que ve la cámara. Más hace una horda más densa y cuesta más en cada fotograma."
itIT = "Il numero massimo di procioni zombie disegnati contemporaneamente tra quelli visibili alla telecamera. Un numero maggiore crea un'orda più fitta, ma richiede più risorse a ogni fotogramma."
ukUA = "Найбільша кількість зомбованих єнотів, яких одночасно малює камера, серед тих, що вона бачить. Чим їх більше, тим гущий натовп, але кожен кадр це коштує дорожче."
thTH = "ซอมบี้แรคคูนที่มากที่สุดที่วาดพร้อมกันในหมู่ตัวที่กล้องมองเห็น ยิ่งมากก็ยิ่งทำให้ฝูงหนาแน่นขึ้น และใช้ทรัพยากรมากขึ้นในทุกเฟรม"
csCZ = "Maximální počet zombifikovaných mývalů zobrazených najednou v záběru kamery. Vyšší počet vytváří hustší hordu a zvyšuje nároky na výkon každého snímku."
viVN = "Số gấu mèo thây ma tối đa được hiển thị cùng lúc trong số những con mà camera nhìn thấy. Số lượng cao hơn tạo thành một bầy đông hơn và tốn nhiều tài nguyên hơn mỗi khung hình."
caES = "El nombre màxim de mapaches zombis dibuixats alhora, entre els que veu la càmera. Més en fa una munió més densa, i cada fotograma costa més."
beBY = "Найбольшая колькасць зомбі-енотаў, якія адначасова бачыць камера. Больш енотаў ствараюць больш шчыльную арду, і кожны кадр гэта каштуе больш."
roRO = "Cel mai mare număr de sperietori-zombi (raccoons) afișate simultan, dintre cei vizibili de cameră. Un număr mai mare face o hoardă mai densă și costă mai mult pe fiecare cadru."
huHU = "A kamerával látható egyidejűleg megjelenő legtöbb zombi mosómedve. Több mosómedve sűrűbb hordát eredményez, és minden képkockánál többe kerül."
arSA = "أكبر عدد من الراكونات الزومبي تُرسم في وقت واحد من بين تلك التي تراها الكاميرا. كلما زاد العدد، أصبح الحشد أكثف، وارتفعت تكلفته في كل إطار."

