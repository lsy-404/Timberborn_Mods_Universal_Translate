["TimberEmpires.Settings.SciencePerPlayer.Tooltip"]
status = "normal"
raw = "Each player has their own science points. Districts earn science for their owner, and whoever unlocks something pays for it. Districts with no owner earn science for everyone."
enUS = "Each player has their own science points. Districts earn science for their owner, and whoever unlocks something pays for it. Districts with no owner earn science for everyone."
zhCN = "每位玩家都有自己的科学点数。各区为其所属玩家赚取科学点数，解锁某项内容的玩家需支付相应点数。无所属玩家的区则为所有玩家赚取科学点数。"
zhTW = "每位玩家都有自己的科技點數。區域為其所屬玩家賺取科技點數，解鎖項目的玩家則由自己支付點數。沒有所屬玩家的區域會為所有人賺取科技點數。"
ruRU = "У каждого игрока свои очки науки. Районы приносят очки науки своему владельцу, а тот, кто открывает что-либо, платит за это. Районы без владельца приносят очки науки всем игрокам."
jaJP = "各プレイヤーはそれぞれ独自の科学ポイントを持ちます。各地区はその所有者の科学ポイントを獲得し、何かをアンロックしたプレイヤーがその費用を支払います。所有者のいない地区は、全員の科学ポイントを獲得します。"
frFR = "Chaque joueur dispose de ses propres points de science. Les districts rapportent des points de science à leur propriétaire, et c’est celui qui débloque quelque chose qui en paie le coût. Les districts sans propriétaire rapportent des points de science à tout le monde."
deDE = "Jeder Spieler hat eigene Wissenschaftspunkte. Bezirke sammeln Wissenschaftspunkte für ihren Besitzer, und wer etwas freischaltet, bezahlt dafür. Bezirke ohne Besitzer sammeln Wissenschaftspunkte für alle."
plPL = "Każdy gracz ma własne punkty nauki. Dzielnice zdobywają punkty nauki dla swojego właściciela, a za odblokowanie czegoś płaci ten, kto tego dokona. Dzielnice bez właściciela zdobywają punkty nauki dla wszystkich."
ptBR = "Cada jogador tem seus próprios pontos de ciência. Os distritos geram ciência para seu proprietário, e quem desbloquear algo paga por isso. Distritos sem proprietário geram ciência para todos."
koKR = "플레이어마다 각자의 과학 점수를 보유합니다. 각 구역은 소유자에게 과학 점수를 제공하며, 무언가를 해금하는 플레이어가 그 비용을 지불합니다. 소유자가 없는 구역은 모든 플레이어에게 과학 점수를 제공합니다."
csCZ = "Každý hráč má vlastní vědecké body. Obvody získávají vědecké body pro svého vlastníka a za odemknutí něčeho platí ten, kdo to odemkne. Obvody bez vlastníka získávají vědecké body pro všechny."
viVN = "Mỗi người chơi có điểm khoa học riêng. Các quận kiếm điểm khoa học cho chủ sở hữu của mình, và người mở khóa thứ gì đó sẽ trả điểm để mở khóa. Các quận không có chủ sở hữu kiếm điểm khoa học cho tất cả mọi người."
trTR = "Her oyuncunun kendine ait bilim puanları vardır. Bölgeler sahipleri için bilim puanı kazandırır ve bir şeyin kilidini kim açarsa bedelini o öder. Sahibi olmayan bölgeler herkes için bilim puanı kazandırır."

