["Building.TimberEmpires.WallTower.Description"]
raw = "Joins walls on any side and leads up to the wall walk. Sees far through the fog, further from high ground."
status = "normal"
enUS = "Connects to walls on any side and leads up to the wall walk. Sees far through the fog, and even farther from high ground."
zhCN = "可从任意一侧与墙壁相连，并通往城墙步道。在高处能穿透迷雾看得更远。"
zhTW = "可從任何一側連接城牆，並通往城牆步道。從高處能看得更遠，穿透迷霧的視野也更廣。"
ruRU = "Соединяется со стенами с любой стороны и ведёт наверх, к стенному проходу. Позволяет видеть далеко сквозь туман, а с возвышенности — ещё дальше."
jaJP = "あらゆる側面で壁とつながり、壁上通路へと続く。霧の中でも遠くまで見渡せ、高所からはさらに遠くまで見渡せる。"
frFR = "Se raccorde aux murs de tous les côtés et mène au chemin de ronde. Permet de voir loin dans le brouillard, encore plus loin depuis un point élevé."
deDE = "Verbindet sich an jeder Seite mit Mauern und führt hinauf zum Wehrgang. Bietet durch den Nebel eine weite Sicht, von erhöhtem Gelände aus noch weiter."
plPL = "Łączy się ze ścianami z dowolnej strony i prowadzi na górny chodnik muru. Zapewnia daleki widok przez mgłę, a z wysokości — jeszcze dalszy."
ptBR = "Conecta-se a muros por qualquer lado e dá acesso ao caminho sobre o muro. Enxerga longe através da névoa — ainda mais longe de um ponto elevado."
koKR = "어느 쪽에서든 벽과 연결되어 성벽 위 통로로 이어집니다. 안개 속을 멀리까지 볼 수 있으며, 높은 곳에서는 더 멀리 볼 수 있습니다."
csCZ = "Navazuje na zdi z kterékoli strany a vede na ochoz. Z vyvýšeného místa dohlédne dál skrz mlhu."
viVN = "Nối với tường ở mọi phía và dẫn lên lối đi trên tường. Có tầm nhìn xa xuyên qua sương mù, xa hơn khi ở trên cao."
trTR = "Duvarlara her yönden bağlanır ve duvar yürüyüş yoluna çıkar. Sislerin ötesini görür; yüksek bir konumdan daha uzağı görebilir."

["Building.TimberEmpires.WallTower.FlavorDescription"]
raw = "The best view in the district, mostly of trouble."
