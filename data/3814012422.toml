["Building.TimberEmpires.ResinPuddle.Description"]
raw = "Pine resin poured on the ground or a road. Archers by a lit Blazer set it alight with fire arrows. It burns for 6 hours and hurts everyone in it, your own too."
status = "normal"
enUS = "Pine resin poured onto the ground or a road. Archers near a lit Blazer ignite it with fire arrows. It burns for 6 hours and hurts everyone in it, including your own."
zhCN = "倒在地面或道路上的松脂。点燃的烈焰塔旁的弓箭手可用火箭将其引燃。它会燃烧 6 小时，并伤害其中的所有生物，包括你自己的居民。"
zhTW = "倒在地面或道路上的松脂。點燃的火炬旁的弓箭手會用火箭將其點燃。燃燒時間為 6 小時，會傷害其中的所有人，包括己方人員。"
ruRU = "Смола сосны, разлитая на земле или дороге. Лучники рядом с зажжённым жаровником поджигают её огненными стрелами. Горит 6 часов и наносит урон всем, кто в ней находится, в том числе вашим."
jaJP = "地面や道路に流した松脂。火のついたブレイザーのそばにいる射手が、火矢で火をつけます。6時間燃え続け、その中にいるすべての者にダメージを与えます。自分の仲間も例外ではありません。"
frFR = "Résine de pin répandue sur le sol ou une route. Les archers près d’un Brasero allumé y mettent le feu avec des flèches enflammées. Elle brûle pendant 6 heures et blesse tous ceux qui se trouvent dedans, y compris vos propres unités."
deDE = "Auf den Boden oder eine Straße gegossenes Kiefernharz. Bogenschützen neben einem angezündeten Brandwerfer entzünden es mit Feuerpfeilen. Es brennt 6 Stunden lang und verletzt alle darin, auch die eigenen."
plPL = "Żywica sosnowa wylana na ziemię lub drogę. Łucznicy stojący przy zapalonym Płomienniku podpalają ją ognistymi strzałami. Pali się przez 6 godzin i rani wszystkich, którzy się w niej znajdują — także twoich."
ptBR = "Resina de pinheiro derramada no chão ou em uma estrada. Arqueiros perto de um Braseiro aceso a incendeiam com flechas de fogo. Ela queima por 6 horas e fere todos que estiverem nela, inclusive os seus."
koKR = "땅이나 도로에 부은 소나무 송진입니다. 불이 켜진 블레이저 근처의 궁수들이 불화살로 불을 붙입니다. 6시간 동안 타오르며, 안에 있는 모든 이에게 피해를 줍니다. 아군도 예외가 아닙니다."
csCZ = "Borovicová pryskyřice vylitá na zem nebo na cestu. Lučištníci u zapáleného Blazeru ji zapálí ohnivými šípy. Hoří 6 hodin a zraňuje každého, kdo v ní je, i vaše vlastní."
viVN = "Nhựa thông đổ trên mặt đất hoặc đường. Cung thủ đứng cạnh một Lò đốt đang cháy có thể châm lửa đốt bằng tên lửa. Nó cháy trong 6 giờ và gây sát thương cho tất cả những ai ở trong đó, kể cả người của bạn."
trTR = "Yere veya bir yola dökülen çam reçinesi. Yanmakta olan bir Alevlendirici'nin yakınındaki okçular, ateşli oklarla reçineyi tutuşturur. 6 saat boyunca yanar ve içindeki herkese, sizinkilere de zarar verir."

