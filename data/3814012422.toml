["TimberEmpires.Troops.TrainsHint"]
status = "normal"
raw = "Changing it lets its troops go. New recruits walk here and train as the new kind."
enUS = "Changing it lets its troops leave. New recruits walk here and train to become the new kind."
zhCN = "更改此项即可让其部队出发。新招募的成员会来到这里，接受新兵种的训练。"
zhTW = "改變它就能讓部隊出發。新招募的成員會走到這裡，並接受訓練成為新兵種。"
ruRU = "Изменение этого параметра позволяет выпускать отряды. Здесь появляются новобранцы и проходят подготовку, чтобы стать бойцами нового типа."
jaJP = "変更すると、部隊が出ていきます。新兵はここを通って訓練し、新しい種類の兵士になります。"
frFR = "Le modifier permet à ses troupes de partir. Les nouvelles recrues viennent ici et s’entraînent pour devenir le nouveau type d’unité."
deDE = "Wenn du es änderst, können seine Truppen losziehen. Neue Rekruten kommen hierher und werden zur neuen Truppenart ausgebildet."
plPL = "Zmiana pozwala wypuścić jego oddziały. Nowi rekruci przychodzą tutaj i szkolą się na nowy rodzaj jednostki."
ptBR = "Alterá-lo permite que suas tropas partam. Novos recrutas vêm até aqui e treinam para se tornarem o novo tipo."
koKR = "이 설정을 바꾸면 병력을 보낼 수 있습니다. 신병은 이곳으로 와서 새로운 유형으로 훈련받습니다."
csCZ = "Změnou se její jednotky propustí. Noví rekruti sem přicházejí a cvičí se na nový typ."
viVN = "Thay đổi mục này sẽ cho phép quân lính của nó rời đi. Tân binh đi bộ đến đây và được huấn luyện thành loại quân mới."
trTR = "Bunu değiştirmek birliklerinin ayrılmasını sağlar. Yeni acemiler buraya yürür ve yeni tür olarak eğitilir."

