["Building.TimberEmpires.MineLauncher.Description"]
raw = "Releases floating mines that drift with the current and explode against the first building they hit."
status = "normal"
enUS = "Releases floating mines that drift with the current and explode when they hit the first building."
zhCN = "发射会随水流漂移的浮雷，并在撞上第一个建筑时爆炸。"
zhTW = "發射會隨水流漂移的浮動水雷，碰上第一座建築物時便會爆炸。"
ruRU = "Выпускает плавучие мины, которые дрейфуют по течению и взрываются при столкновении с первым попавшимся зданием."
jaJP = "浮遊機雷を放ち、流れに乗って漂流させ、最初に衝突した建物で爆発させます。"
frFR = "Largue des mines flottantes qui dérivent avec le courant et explosent au contact du premier bâtiment qu’elles heurtent."
deDE = "Setzt treibende Minen frei, die mit der Strömung treiben und beim Aufprall auf das erste Gebäude explodieren."
plPL = "Wystrzeliwuje pływające miny, które dryfują z prądem i wybuchają przy zderzeniu z pierwszym budynkiem."
ptBR = "Lança minas flutuantes que seguem a correnteza e explodem ao atingir o primeiro edifício."
koKR = "물살을 따라 떠내려가다 처음 부딪히는 건물에서 폭발하는 부유 지뢰를 발사합니다."
csCZ = "Vypouští plovoucí miny, které se nechávají unášet proudem a vybuchnou při nárazu do první budovy."
viVN = "Phóng ra các quả thủy lôi nổi trôi theo dòng nước và phát nổ khi va vào công trình đầu tiên."
trTR = "Akıntıyla sürüklenen ve çarptıkları ilk binada patlayan yüzen mayınlar bırakır."

["Building.TimberEmpires.MineLauncher.FlavorDescription"]
raw = "Rivers have always carried gifts downstream. Not always nice ones."
status = "normal"
enUS = "Rivers have always carried gifts downstream. Not always nice ones."
zhCN = "河流总是会把馈赠带向下游。但这些馈赠不一定都那么美好。"
zhTW = "河流總是會把禮物一路帶往下游。但不一定都是好東西。"
ruRU = "Реки всегда несли свои дары вниз по течению. Не всегда приятные."
jaJP = "川はいつだって下流へ贈り物を運んできた。いつも素敵な贈り物とは限らないが。"
frFR = "Les rivières ont toujours charrié des cadeaux vers l’aval. Pas toujours agréables."
deDE = "Flüsse haben schon immer Geschenke flussabwärts getragen. Nicht immer nette."
plPL = "Rzeki zawsze niosły w dół rzeki różne dary. Nie zawsze miłe."
ptBR = "Os rios sempre carregaram presentes rio abaixo. Nem sempre agradáveis."
koKR = "강은 언제나 선물을 하류로 실어 날랐다. 늘 반가운 선물만은 아니었지만."
csCZ = "Řeky vždycky nesly po proudu různé dary. Ne vždycky příjemné."
viVN = "Sông ngòi xưa nay vẫn mang quà xuôi dòng. Mà quà thì không phải lúc nào cũng dễ chịu."
trTR = "Nehirler hediyeleri hep akıntıyla aşağı taşımıştır. Bunlar her zaman hoş hediyeler olmaz."

