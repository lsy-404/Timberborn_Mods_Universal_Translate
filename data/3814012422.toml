["Building.TimberEmpires.WallTotemMounted.Description"]
raw = "A carved beaver on a shelf, hung on the outside of a wall or tower. Troops in the area round it hit 4% harder and take 3% less damage. Doesn't add up with another totem."
status = "normal"
enUS = "A carved beaver on a shelf, mounted on the outside of a wall or tower. Troops in the area around it hit 4% harder and take 3% less damage. Doesn't stack with another totem."
zhCN = "架子上的海狸雕像，可挂在墙或塔的外侧。周围的部队造成的伤害提高 4%，受到的伤害降低 3%。效果不会与另一个图腾叠加。"
zhTW = "雕刻成海狸模樣、放在架子上的擺飾，可掛在牆壁或塔樓外側。附近的部隊攻擊力提高 4%，承受的傷害降低 3%。不會與另一座圖騰疊加。"
ruRU = "Резной бобр на полке, который крепится снаружи стены или башни. Войска поблизости наносят на 4% больше урона и получают на 3% меньше урона. Эффект не складывается с эффектом другого тотема."
jaJP = "棚の上に置く、彫刻されたビーバー。壁や塔の外側に取り付けます。周囲の部隊は攻撃力が4%上がり、受けるダメージが3%減少します。別のトーテムとは効果が重複しません。"
frFR = "Un castor sculpté sur une étagère, accroché à l'extérieur d'un mur ou d'une tour. Les troupes dans les environs frappent 4 % plus fort et subissent 3 % de dégâts en moins. Ne se cumule pas avec un autre totem."
deDE = "Ein geschnitzter Biber auf einem Regal, der außen an einer Wand oder einem Turm angebracht wird. Truppen in seiner Nähe verursachen 4 % mehr Schaden und erleiden 3 % weniger Schaden. Wirkt nicht zusätzlich zu einem anderen Totem."
plPL = "Rzeźbiony bóbr na półce, zawieszanej na zewnętrznej stronie muru lub wieży. Oddziały w jego pobliżu zadają obrażenia większe o 4% i otrzymują o 3% mniej obrażeń. Nie kumuluje się z innym totemem."
ptBR = "Um castor entalhado em uma prateleira, pendurado na parte externa de uma parede ou torre. As tropas na área ao redor causam 4% mais dano e recebem 3% menos dano. Não acumula com outro totem."
koKR = "선반 위에 조각한 비버로, 벽이나 탑 바깥쪽에 걸어 둡니다. 주변 부대의 공격력이 4% 증가하고 받는 피해가 3% 감소합니다. 다른 토템의 효과와 중첩되지 않습니다."
csCZ = "Vyřezávaný bobr na polici, zavěšené na vnější straně zdi nebo věže. Jednotky v jeho okolí způsobují o 4 % větší poškození a utrpí o 3 % menší poškození. Účinky se nesčítají s dalším totemem."
viVN = "Một con hải ly được chạm khắc đặt trên kệ, treo bên ngoài tường hoặc tháp. Quân lính trong khu vực xung quanh nó đánh mạnh hơn 4% và chịu ít sát thương hơn 3%. Không cộng dồn với vật tổ khác."
trTR = "Duvarın veya kulenin dışına asılan, bir raf üzerindeki oyma kunduz. Çevresindeki birlikler %4 daha sert vurur ve %3 daha az hasar alır. Başka bir totemle etkisi birikmez."

