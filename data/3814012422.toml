["NaturalResource.Pumpkin.FlavorDescription"]
status = "normal"
raw = "Carved, it lights up the night. Eaten raw, it cures the badwater sickness from an undead raccoon's bite."
enUS = "Carved, it lights up the night. Eaten raw, it cures the badwater sickness caused by an undead raccoon’s bite."
zhCN = "雕刻后，它能照亮夜晚。生吃则能治愈被不死浣熊咬伤后染上的恶水病。"
zhTW = "雕刻後，能照亮夜晚。生吃則能治癒被不死浣熊咬傷後染上的污水病。"
ruRU = "Вырезанная, она освещает ночь. Съеденная сырой, она исцеляет от болезни из-за заражённого бэдвотером укуса ожившего енота."
jaJP = "彫れば夜を照らし、生で食べればアンデッドのアライグマに噛まれてかかる汚染水病を治す。"
frFR = "Sculptée, elle illumine la nuit. Mangée crue, elle guérit le mal des eaux toxiques causé par la morsure d’un raton laveur mort-vivant."
deDE = "Geschnitzt erhellt er die Nacht. Roh gegessen heilt er die Badwasserkrankheit, die ein Biss eines untoten Waschbären verursacht."
plPL = "Wydrążona rozświetla noc. Zjedzona na surowo leczy chorobę od skażonej wody wywołaną ugryzieniem nieumarłego szopa pracza."
ptBR = "Esculpida, ilumina a noite. Comida crua, cura a doença da água contaminada causada pela mordida de um guaxinim morto-vivo."
koKR = "조각하면 밤을 밝혀 줍니다. 날것으로 먹으면 언데드 너구리에게 물려 생긴 오염수병을 치료합니다."
csCZ = "Vydlabaná rozzáří noc. Syrová vyléčí nemoc z kontaminované vody způsobenou kousnutím nemrtvého mývala."
viVN = "Được khắc thành đèn, nó thắp sáng màn đêm. Ăn sống, nó chữa khỏi bệnh nhiễm nước độc do bị gấu mèo xác sống cắn."
trTR = "Oyulunca geceyi aydınlatır. Çiğ yenince, ölümsüz bir rakunun ısırığından kaynaklanan zehirli su hastalığını iyileştirir."

