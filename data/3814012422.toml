["Building.TimberEmpires.Gatehouse.Description"]
status = "normal"
raw = "A fortified gate with stairs up to the wall walk. Shuts when enemies or bandits come near."
enUS = "A fortified gate with stairs leading up to the wall walk. Closes when enemies or bandits approach."
zhCN = "带有通往城墙步道的楼梯的防御大门。敌人或强盗靠近时会关闭。"
zhTW = "設有通往城牆步道樓梯的堅固大門。敵人或強盜靠近時會關閉。"
ruRU = "Укреплённые ворота с лестницей, ведущей на стену. Закрываются, когда поблизости появляются враги или бандиты."
jaJP = "城壁上の通路へ続く階段を備えた防備の固い門。敵や盗賊が近づくと閉まる。"
frFR = "Une porte fortifiée avec des escaliers menant au chemin de ronde. Se ferme à l’approche d’ennemis ou de bandits."
deDE = "Ein befestigtes Tor mit Treppen hinauf zum Wehrgang. Schließt sich, wenn sich Feinde oder Banditen nähern."
plPL = "Wzmocniona brama ze schodami prowadzącymi na górny chodnik muru. Zamyka się, gdy w pobliżu pojawią się wrogowie lub bandyci."
ptBR = "Um portão fortificado com escadas que dão acesso ao caminho no alto da muralha. Fecha quando inimigos ou bandidos se aproximam."
koKR = "성벽 위 통로로 올라가는 계단이 있는 요새화된 문입니다. 적이나 도적이 가까이 오면 닫힙니다."
csCZ = "Opevněná brána se schodištěm na ochoz hradeb. Zavře se, když se přiblíží nepřátelé nebo bandité."
viVN = "Một cổng kiên cố có cầu thang dẫn lên lối đi trên tường thành. Đóng lại khi kẻ thù hoặc bọn cướp đến gần."
trTR = "Surların üzerindeki devriye yoluna çıkan merdivenleri olan tahkim edilmiş bir kapı. Düşmanlar veya haydutlar yaklaştığında kapanır."

["Building.TimberEmpires.Gatehouse.FlavorDescription"]
status = "normal"
raw = "Grand enough to welcome guests, sturdy enough not to."
enUS = "Grand enough to welcome guests, sturdy enough not to."
zhCN = "气派得足以迎接宾客，坚固得不至于……耐用。"
zhTW = "氣派得足以迎接賓客，卻不夠堅固，無法抵擋他們。"
ruRU = "Достаточно величественная, чтобы принимать гостей, и достаточно прочная, чтобы этого не делать."
jaJP = "客人を迎えるには十分立派だが、頑丈さは足りない。"
frFR = "Assez grand pour accueillir des invités, mais pas assez solide pour les retenir."
deDE = "Prunkvoll genug, um Gäste willkommen zu heißen, und robust genug, um das nicht zu tun."
plPL = "Dość okazała, by przyjmować gości, ale nie dość solidna, by ich zatrzymać."
ptBR = "Espaçoso o bastante para receber hóspedes, mas não robusto o bastante para isso."
koKR = "손님을 맞이하기엔 충분히 웅장하지만, 견고하진 않다."
csCZ = "Dost velkolepý, aby vítal hosty, a dost pevný, aby nevítal."
viVN = "Đủ bề thế để đón khách, nhưng không đủ vững chãi."
trTR = "Konukları ağırlayacak kadar görkemli, ama onları içeri almamaya yetecek kadar sağlam."

