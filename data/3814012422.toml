["TimberEmpires.Founding.Prompt"]
status = "normal"
raw = "Place your District Center anywhere to found your settlement. It's built at once, with beavers, food and water to start."
enUS = "Place your District Center anywhere to found your settlement. It’s built immediately, with beavers, food, and water to get you started."
zhCN = "在任意位置放置区中心，即可建立你的定居点。它会立即建成，并配有海狸、食物和水，供你起步。"
zhTW = "將區域中心放置在任意位置，即可建立你的殖民地。它會立即建成，並提供海狸、食物和水作為起步資源。"
ruRU = "Разместите центр района в любом месте, чтобы основать поселение. Он будет построен сразу, вместе с бобрами, едой и водой для начала."
jaJP = "地区センターを好きな場所に配置して、入植地を築きましょう。ビーバー、食料、水を備えた状態で、すぐに建設されます。"
frFR = "Placez votre centre de district où vous le souhaitez pour fonder votre colonie. Il est construit immédiatement, avec des castors, de la nourriture et de l’eau pour commencer."
deDE = "Platziere dein Bezirkszentrum an beliebiger Stelle, um deine Siedlung zu gründen. Es wird sofort errichtet und startet mit Bibern, Nahrung und Wasser."
plPL = "Umieść Centrum dzielnicy w dowolnym miejscu, aby założyć swoją osadę. Zostanie od razu zbudowane, a na początek otrzymasz bobry, żywność i wodę."
ptBR = "Coloque o Centro do Distrito em qualquer lugar para fundar seu assentamento. Ele é construído na hora, com castores, comida e água para começar."
koKR = "정착지를 세우려면 구역 중심지를 원하는 곳에 배치하세요. 비버와 식량, 물이 함께 제공되며 즉시 건설됩니다."
csCZ = "Umístěte centrum okrsku kamkoli a založte svou osadu. Postaví se okamžitě a dostanete bobry, jídlo a vodu na začátek."
viVN = "Đặt Trung tâm Quận ở bất kỳ đâu để thành lập khu định cư của bạn. Công trình được xây dựng ngay lập tức, có sẵn hải ly, thức ăn và nước uống để bắt đầu."
trTR = "Yerleşiminizi kurmak için Bölge Merkezinizi istediğiniz yere yerleştirin. Kunduzlarla, yiyecekle ve suyla birlikte anında inşa edilir."

