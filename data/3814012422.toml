["Building.TimberEmpires.Gatehouse.Description"]
raw = "A fortified gate with stairs up to the wall walk. Shuts when enemies or bandits come near."
status = "normal"
enUS = "A fortified gate with stairs leading up to the wall walk. Closes when enemies or bandits approach."
zhCN = "带楼梯的加固城门，可通往城墙上的巡逻道。敌人或强盗靠近时会关闭。"
zhTW = "設有通往城牆步道階梯的防禦大門。敵人或強盜靠近時會關閉。"
ruRU = "Укреплённые ворота с лестницей, ведущей на стену. Закрываются, когда враги или разбойники подходят близко."
jaJP = "壁上の通路へ続く階段を備えた、堅固な門。敵や盗賊が近づくと閉じます。"
frFR = "Une porte fortifiée avec des escaliers menant au chemin de ronde. Se ferme à l’approche d’ennemis ou de bandits."
deDE = "Ein befestigtes Tor mit Treppen zum Wehrgang. Schließt sich, wenn sich Feinde oder Banditen nähern."
plPL = "Ufortyfikowana brama ze schodami prowadzącymi na chodnik na murze. Zamyka się, gdy w pobliżu pojawiają się wrogowie lub bandyci."
ptBR = "Um portão fortificado com escadas que levam ao caminho no alto da muralha. Fecha quando inimigos ou bandidos se aproximam."
koKR = "성벽 위 통로로 올라가는 계단이 있는 요새화된 문입니다. 적이나 도적이 가까이 오면 닫힙니다."
csCZ = "Zpevněná brána se schody na ochoz hradeb. Zavře se, když se přiblíží nepřátelé nebo bandité."
viVN = "Một cổng thành kiên cố có cầu thang dẫn lên lối đi trên tường thành. Đóng lại khi kẻ thù hoặc bọn cướp đến gần."
trTR = "Duvar yoluna çıkan merdivenleri olan tahkim edilmiş bir kapı. Düşmanlar veya haydutlar yaklaştığında kapanır."

["Building.TimberEmpires.Gatehouse.FlavorDescription"]
raw = "Grand enough to welcome guests, sturdy enough not to."
status = "normal"
enUS = "Grand enough to welcome guests, sturdy enough not to."
zhCN = "气派到足以迎接宾客，坚固到不至于此。"
zhTW = "氣派得足以迎接賓客，堅固得足以……才怪。"
ruRU = "Достаточно величественные, чтобы принимать гостей, и достаточно прочные, чтобы их не принимать."
jaJP = "客人を迎えるには十分立派だが、頑丈さは十分ではない。"
frFR = "Assez grand pour accueillir des invités, assez solide pour ne pas les accueillir."
deDE = "Groß genug, um Gäste willkommen zu heißen, und stabil genug, es nicht zu tun."
plPL = "Dość okazała, by witać gości, ale nie dość solidna."
ptBR = "Grande o bastante para receber hóspedes, resistente o bastante para não recebê-los."
koKR = "손님을 맞이하기엔 충분히 웅장하지만, 튼튼하진 않다."
csCZ = "Dost velkolepá, aby přivítala hosty, a dost pevná, aby je nevpustila."
viVN = "Đủ bề thế để đón khách, nhưng không đủ vững chắc để làm vậy."
trTR = "Misafirleri ağırlayacak kadar görkemli, ama dayanamayacak kadar sağlam değil."

