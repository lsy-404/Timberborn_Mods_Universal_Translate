["TimberEmpires.Bandits.Description"]
status = "normal"
raw = "A bandit guarding its camp. It belongs to no colony and attacks any beaver that comes near."
enUS = "A bandit guarding its camp. It belongs to no colony and attacks any beaver that comes near."
zhCN = "守卫营地的强盗。它不属于任何殖民地，会攻击任何靠近的海狸。"
zhTW = "守衛營地的強盜。牠不屬於任何殖民地，並會攻擊任何靠近的海狸。"
ruRU = "Бандит, охраняющий свой лагерь. Он не принадлежит ни к одной колонии и нападает на любого бобра, который приблизится."
jaJP = "野営地を守る盗賊。どのコロニーにも属さず、近づいてくるビーバーを攻撃する。"
frFR = "Un bandit qui garde son camp. Il n’appartient à aucune colonie et attaque tout castor qui s’approche."
deDE = "Ein Bandit, der sein Lager bewacht. Er gehört zu keiner Kolonie und greift jeden Biber an, der sich nähert."
plPL = "Bandyta pilnujący swojego obozu. Nie należy do żadnej kolonii i atakuje każdego bobra, który się zbliży."
ptBR = "Um bandido que protege seu acampamento. Ele não pertence a nenhuma colônia e ataca qualquer castor que se aproxime."
koKR = "야영지를 지키는 산적입니다. 어느 식민지에도 속하지 않으며, 가까이 다가오는 비버를 공격합니다."
csCZ = "Bandita střežící svůj tábor. Nepatří k žádné kolonii a útočí na každého bobra, který se přiblíží."
viVN = "Một tên cướp canh giữ trại của nó. Nó không thuộc về thuộc địa nào và tấn công mọi hải ly đến gần."
