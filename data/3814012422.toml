frFR = "Installée par des bandits pour franchir une falaise. Ils la démontent en partant."
deDE = "Von Plünderern errichtet, um eine Klippe zu überwinden. Wenn sie weiterziehen, bauen sie sie wieder ab."
plPL = "Wzniesiona przez bandytów, by dostać się na szczyt klifu. Rozbierają ją, gdy odchodzą."
ptBR = "Erguida por bandoleiros invasores para subir um penhasco. Eles a desmontam quando vão embora."
koKR = "습격하는 도적들이 절벽을 넘기 위해 세웁니다. 떠날 때는 철거합니다."
csCZ = "Postavili ji bandité při nájezdu, aby se dostali přes útes. Když odcházejí, zase ji sundají."
viVN = "Được bọn cướp dựng lên để trèo qua vách đá. Chúng sẽ tháo dỡ nó khi rời đi."
trTR = "Haydutlar bir uçurumu aşmak için kurar. Ayrılırken kaldırırlar."

