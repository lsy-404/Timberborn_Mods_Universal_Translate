["Building.TimberEmpires.Cog.FlavorDescription"]
status = "normal"
raw = "“Grandpa sailed to the far island once. He came back with a hat and never said where he got it.” – Little Drizzik"
enUS = "“Grandpa sailed to the far island once. He came back with a hat and never said where he got it.” – Little Drizzik"
zhCN = "“爷爷曾经航行到远方的岛屿。他带回一顶帽子，却从没说过是从哪儿弄来的。” ——小细雨·德里兹克"
zhTW = "“爺爺曾經航行到遙遠的島嶼。他帶回一頂帽子，卻從不說是在哪裡得到的。” ——小德里茲克"
ruRU = "“Дедушка однажды плавал на далёкий остров. Вернулся с шляпой и так и не сказал, где её взял.” – Маленький Дризик"
jaJP = "「おじいちゃんは一度、遠くの島まで船で行ったんだ。帰ってきたときには帽子をかぶっていたけど、どこで手に入れたのかは一度も話さなかった。」――リトル・ドリズィク"
frFR = "“Grand-père a navigué une fois jusqu'à l'île lointaine. Il est revenu avec un chapeau et n'a jamais dit où il l'avait trouvé.” – Petit Drizzik"
deDE = "„Opa ist einmal zur fernen Insel gesegelt. Er kam mit einem Hut zurück und hat nie gesagt, woher er ihn hatte.“ – Kleiner Drizzik"
plPL = "“Dziadek raz popłynął na daleką wyspę. Wrócił z kapeluszem i nigdy nie powiedział, skąd go wziął.” – Mały Drizzik"
ptBR = "“O vovô navegou até a ilha distante uma vez. Voltou com um chapéu e nunca disse onde o conseguiu.” – Pequeno Drizzik"
koKR = "“할아버지는 한 번 먼 섬까지 배를 타고 가셨지. 모자를 하나 얻어 돌아오셨는데, 어디서 얻으셨는지는 끝내 말씀하지 않으셨어.” – 리틀 드리직"
trTR = "“Dedem bir keresinde uzak adaya yelken açmış. Bir şapkayla dönmüş ve onu nereden bulduğunu hiç söylememiş.” – Küçük Drizzik"
esES = "“El abuelo navegó una vez hasta la isla lejana. Volvió con un sombrero y nunca dijo dónde lo consiguió.” – Pequeño Drizzik"
itIT = "“Il nonno una volta navigò verso l'isola lontana. Tornò con un cappello e non disse mai dove lo aveva preso.” – Piccolo Drizzik"
ukUA = "“Дідусь колись плавав на далекий острів. Повернувся з капелюхом і ніколи не казав, де його взяв.” – Маленький Дрізик"
thTH = "“ปู่เคยล่องเรือไปเกาะไกลสักครั้ง กลับมาพร้อมหมวกใบหนึ่ง แต่ไม่เคยบอกว่าไปได้มาจากที่ไหน” – ดริซิกตัวน้อย"
csCZ = "„Dědeček jednou připlul na vzdálený ostrov. Vrátil se s kloboukem a nikdy neřekl, kde ho vzal.“ – Malý Drizzik"
viVN = "“Ông nội từng ra đảo xa một lần. Ông về với một cái mũ và chưa bao giờ nói ông lấy nó ở đâu.” – Drizzik nhỏ"
caES = "“L’avi va navegar fins a l’illa llunyana una vegada. Va tornar amb un barret i mai no va dir d’on l’havia tret.” – Petit Drizzik"
beBY = "“Дзядзька калісьці плаваў на далёкі востраў. Ён вярнуўся з капелюшом і так і не сказаў, дзе яго ўзяў.” – Маленькі Дрызык"
roRO = "„Bunicul a navigat odată spre insula îndepărtată. S-a întors cu o pălărie și n-a spus niciodată de unde o luase.” – Micul Drizzik"
huHU = "„Nagypapa egyszer elhajózott a távoli szigetre. Egy kalapot hozott vissza, és soha nem mondta el, honnan szerezte.” – Kis Szitaló"
arSA = "“جدي أبحر إلى الجزيرة البعيدة ذات مرة. عاد بقبعة ولم يقل قط من أين حصل عليها.” – دريزيك الصغير"

["Building.TimberEmpires.Cog.Description"]
status = "normal"
raw = "Sails between islands. Build it at a Shipyard, then send it to another island's coast to land there."
enUS = "Sails between islands. Build it at a Shipyard, then send it to another island's coast to land there."
zhCN = "在造船厂建造后，将其派往另一座岛屿的海岸即可在该岛登陆，从而在岛屿之间航行。"
zhTW = "在造船廠建造後，將其派往另一座島嶼的海岸即可登陸，航行於島嶼之間。"
ruRU = "Плывёт между островами. Постройте его на Верфи, затем отправьте к берегу другого острова, чтобы высадиться там."
jaJP = "島と島の間を航行します。造船所で建造し、別の島の岸に送ると、そこに上陸します。"
frFR = "Navigue entre les îles. Construisez-le dans un chantier naval, puis envoyez-le jusqu'à la côte d'une autre île pour y accoster."
deDE = "Segelt zwischen Inseln. Baue es an einer Werft und schicke es dann an die Küste einer anderen Insel, um dort anzulegen."
plPL = "Pływa między wyspami. Zbuduj ją w Stoczni, a następnie wyślij do wybrzeża innej wyspy, aby tam przybić."
ptBR = "Navega entre ilhas. Construa-o em um Estaleiro e depois envie-o para a costa de outra ilha para desembarcar ali."
koKR = "다른 섬 사이를 항해합니다. 조선소에서 건설한 뒤, 다른 섬의 해안으로 보내 그곳에 상륙시킵니다."
trTR = "Adalar arasında yelken açar. Bir Tersane'de inşa edilir, ardından karaya yanaşmak için başka bir adanın kıyısına gönderilir."
esES = "Navega entre islas. Constrúyelo en un Astillero y luego envíalo a la costa de otra isla para desembarcar allí."
itIT = "Salpa tra le isole. Costruiscila in un Cantiere navale, poi inviala sulla costa di un'altra isola per sbarcare lì."
ukUA = "Плаває між островами. Збудуйте її на верфі, а потім відправте до узбережжя іншого острова, щоб пристати там."
thTH = "แล่นระหว่างเกาะต่าง ๆ สร้างที่อู่ต่อเรือ จากนั้นส่งไปยังชายฝั่งของอีกเกาะหนึ่งเพื่อให้จอดเทียบที่นั่น"
csCZ = "Pluje mezi ostrovy. Postavte ji v loděnici a poté ji pošlete k pobřeží jiného ostrova, kde připlује."
viVN = "Di chuyển giữa các hòn đảo. Xây dựng tại Xưởng đóng tàu, sau đó gửi đến bờ của hòn đảo khác để cập bến."
caES = "Navega entre illes. Construeix-lo en un Drassana i després envia'l a la costa d'una altra illa per desembarcar-hi."
beBY = "Плыве паміж астравамі. Пабудуйце яе на верфі, затым адпраўце да ўзбярэжжа іншага вострава, каб высадзіцца там."
roRO = "Navighează între insule. Construiește-l la un Șantier naval, apoi trimite-l la țărmul altei insule pentru a acosta acolo."
huHU = "Hajózik a szigetek között. Hajógyárban építsd meg, majd küldd egy másik sziget partjára, hogy ott kikössön."
arSA = "تُبحر بين الجزر. ابنِها في حوض بناء السفن، ثم أرسلها إلى ساحل جزيرة أخرى لترسو هناك."

