frFR = "Un râtelier de boucliers placé dans un coin du chemin de ronde d'un mur ou d'une tour, ou posé au sol. Les troupes dans les environs subissent 8 % de dégâts en moins. Ne se cumule pas avec les autres boucliers."
deDE = "Ein Schildständer, der in einer Ecke des Wehrgangs einer Mauer oder eines Turms oder auf dem Boden steht. Truppen in seiner Nähe erleiden 8% weniger Schaden. Der Effekt ist nicht mit dem anderer Schildständer kumulierbar."
plPL = "Stojak z tarczami ustawiony w narożniku chodnika na murze lub wieży albo na ziemi. Oddziały w jego pobliżu otrzymują o 8% mniej obrażeń. Efekt nie kumuluje się z innymi tarczami."
ptBR = "Um suporte de escudos colocado no canto da passagem de uma muralha ou torre, ou no chão. As tropas na área ao redor recebem 8% menos dano. Não se acumula com outros escudos."
koKR = "벽이나 탑의 통로 모퉁이 또는 지면에 설치하는 방패 거치대입니다. 주변 부대는 피해를 8% 덜 받습니다. 다른 방패와 효과가 중첩되지 않습니다."
csCZ = "Stojan se štíty umístěný v rohu ochozu na hradbě nebo věži, případně na zemi. Jednotky v okolí utrpí o 8% menší poškození. Účinek se nesčítá s účinkem dalších štítů."
viVN = "Một giá đỡ khiên đặt ở góc lối đi trên tường hoặc tháp, hoặc trên mặt đất. Quân lính trong khu vực xung quanh chịu ít hơn 8% sát thương. Hiệu ứng không cộng dồn với các khiên khác."
trTR = "Bir duvarın veya kulenin yürüyüş yolunun köşesinde ya da yerde duran bir kalkan rafı. Yakınındaki birlikler %8 daha az hasar alır. Diğer kalkanlarla birikmez."

