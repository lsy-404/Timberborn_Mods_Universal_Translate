thTH = "ยิงลูกดอกหนักในแนวราบได้ไกล: ร้ายแรงต่อศัตรู แต่ไม่ค่อยได้ผลกับกำแพง"
csCZ = "Střílí těžké šipky naplocho a do dálky: pro nepřátele smrtící, proti hradbám slabé."
viVN = "Bắn các mũi tên nặng bay là là và xa: chí mạng với kẻ địch, nhưng kém hiệu quả trước tường."
caES = "Dispara projectils pesants en trajectòria plana i a gran distància: letal contra els enemics, poc eficaç contra els murs."
beBY = "Страляе цяжкімі арбалетнымі стрэламі нізка і далёка: смяротная для ворагаў, слабая супраць сцен."
roRO = "Trage proiectile grele pe o traiectorie joasă și la mare distanță: letală pentru inamici, dar ineficientă împotriva zidurilor."
huHU = "Nehéz nyílvesszőket lő lapos röppályán, messzire: halálos az ellenségekre, falak ellen gyenge."
arSA = "تطلق سهامًا ثقيلة بمسار منخفض ولمدى بعيد: فتاكة بالأعداء، وضعيفة أمام الجدران."

