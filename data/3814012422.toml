["TimberEmpires.Settings.SciencePerPlayer.Tooltip"]
raw = "Each player has their own science points. Districts earn science for their owner, and whoever unlocks something pays for it. Districts with no owner earn science for everyone."
status = "normal"
enUS = "Each player has their own science points. Districts earn science for their owner, and whoever unlocks something pays for it. Districts with no owner earn science for everyone."
zhCN = "每位玩家都有各自的科学点数。区划为其所属玩家赚取科学点数，解锁项目的玩家则由自己支付费用。没有所属玩家的区划会为所有人赚取科学点数。"
zhTW = "每位玩家都有自己的科學點數。各區域為其所屬玩家賺取科學點數，而解鎖項目的人必須支付費用。沒有所有者的區域則會為所有人賺取科學點數。"
ruRU = "У каждого игрока свои очки науки. Районы приносят очки науки своему владельцу, а тот, кто что-либо открывает, платит за это. Районы без владельца приносят очки науки всем."
jaJP = "科学ポイントはプレイヤーごとに個別に管理されます。各地区はその所有者のために科学ポイントを獲得し、何かをアンロックしたプレイヤーがその費用を支払います。所有者のいない地区は、全員のために科学ポイントを獲得します。"
frFR = "Chaque joueur dispose de ses propres points de science. Les districts rapportent des points de science à leur propriétaire, et celui qui débloque quelque chose en paie le coût. Les districts sans propriétaire rapportent des points de science à tout le monde."
deDE = "Jeder Spieler hat eigene Forschungspunkte. Bezirke sammeln Forschungspunkte für ihren Besitzer, und wer etwas freischaltet, bezahlt dafür. Bezirke ohne Besitzer sammeln Forschungspunkte für alle."
plPL = "Każdy gracz ma własne punkty nauki. Dzielnice zdobywają punkty nauki dla swojego właściciela, a koszt odblokowania czegoś ponosi gracz, który tego dokonał. Dzielnice bez właściciela zdobywają punkty nauki dla wszystkich."
ptBR = "Cada jogador tem seus próprios pontos de ciência. Os distritos geram ciência para seu proprietário, e quem desbloquear algo paga por isso. Distritos sem proprietário geram ciência para todos."
koKR = "플레이어마다 각자의 과학 점수를 보유합니다. 구역은 소유주를 위해 과학 점수를 획득하며, 무언가를 해금하는 플레이어가 그 비용을 지불합니다. 소유주가 없는 구역은 모든 플레이어를 위해 과학 점수를 획득합니다."
csCZ = "Každý hráč má vlastní vědecké body. Obvody získávají vědecké body pro svého vlastníka a ten, kdo něco odemkne, za to zaplatí. Obvody bez vlastníka získávají vědecké body pro všechny."
viVN = "Mỗi người chơi có điểm khoa học riêng. Các khu vực tích lũy điểm khoa học cho chủ sở hữu, và người mở khóa thứ gì sẽ phải trả điểm cho thứ đó. Các khu vực không có chủ sở hữu tích lũy điểm khoa học cho tất cả mọi người."
trTR = "Her oyuncunun kendine ait bilim puanları vardır. Bölgeler sahipleri için bilim puanı kazanır ve bir şeyin kilidini kim açarsa bedelini o öder. Sahibi olmayan bölgelerin kazandığı bilim puanları herkese yazılır."

