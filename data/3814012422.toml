["Building.TimberEmpires.Flamethrower.Description"]
raw = "Burns the horde in a cone in front of it, using up extract as it fires. Short range, deadly to zombies."
status = "normal"
enUS = "Burns the horde in a cone in front of it, using up extract as it fires. Short range, deadly to zombies."
zhCN = "向前方锥形范围内的尸群喷火，开火时会消耗提取物。射程较短，对僵尸杀伤力极强。"
zhTW = "將前方錐形範圍內的殭屍燒成一片，開火時會消耗萃取物。射程短，對殭屍殺傷力極強。"
ruRU = "Сжигает орду конусом перед собой, расходуя экстракт при стрельбе. Небольшая дальность, смертоносен для зомби."
jaJP = "前方の円錐状の範囲を焼き払い、発射するたびに抽出物を消費する。射程は短いが、ゾンビには致命的。"
frFR = "Brûle la horde dans un cône devant lui, en consommant de l’extrait à chaque tir. De courte portée, mais mortel pour les zombies."
deDE = "Verbrennt die Horde in einem Kegel vor sich und verbraucht beim Feuern Extrakt. Kurze Reichweite, tödlich für Zombies."
plPL = "Spala hordę w stożku przed sobą, zużywając ekstrakt podczas strzelania. Ma krótki zasięg i jest zabójczy dla zombie."
ptBR = "Queima a horda em um cone à sua frente, consumindo extrato enquanto dispara. Tem curto alcance e é mortal para zumbis."
koKR = "발사할 때마다 추출물을 소모해 전방의 원뿔 범위에 있는 무리를 불태웁니다. 사거리는 짧지만 좀비에게 치명적입니다."
trTR = "Ateş ederken özüt tüketerek önündeki koni şeklindeki alanda zombi sürüsünü yakar. Menzili kısadır, zombilere karşı ölümcüldür."
esES = "Quema a la horda en un cono frente a sí, consumiendo extracto al disparar. De corto alcance, mortal para los zombis."
itIT = "Brucia l’orda in un cono davanti a sé, consumando estratto mentre spara. A corto raggio, letale per gli zombi."
ukUA = "Випалює орду конусом перед собою, витрачаючи екстракт під час стрільби. Мала дальність, смертельний для зомбі."
thTH = "เผาฝูงซอมบี้เป็นบริเวณรูปกรวยด้านหน้า โดยใช้สารสกัดทุกครั้งที่ยิง ระยะสั้น แต่ร้ายแรงต่อซอมบี้"
csCZ = "Spaluje hordu v kuželu před sebou a při střelbě spotřebovává extrakt. Má krátký dostřel a je smrtící pro zombie."
viVN = "Thiêu đốt đám xác sống trong một hình nón phía trước, tiêu hao dịch chiết khi khai hỏa. Tầm bắn ngắn, cực kỳ nguy hiểm đối với xác sống."
caES = "Crema l'horda en un con davant seu i consumeix extracte mentre dispara. Curt abast, mortal per als zombis."
beBY = "Выпальвае арду конусам перад сабой, расходуючы экстракт падчас стральбы. Невялікая далёкасць дзеяння, смяротны для зомбі."
roRO = "Arde hoarda într-un con în fața sa, consumând extract pe măsură ce trage. Rază scurtă, letal pentru zombi."
huHU = "Az előtte lévő kúp alakú területen felégeti a hordát, tüzelés közben kivonatot fogyasztva. Rövid hatótávolságú, és halálos a zombikra."
arSA = "يحرق الحشد في مخروط أمامه، مستهلكًا المستخلص أثناء إطلاق النار. مداه قصير، لكنه فتاك بالزومبي."

