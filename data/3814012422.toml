["TimberEmpires.Settings.SharedColony.Tooltip"]
status = "normal"
raw = "Everyone builds one colony together, with the same goods and science. Off, each player starts their own."
enUS = "Everyone builds one colony together, sharing the same goods and science. When off, each player starts their own colony."
zhCN = "开启时，所有玩家共同建设一个殖民地，共享物资和科技。关闭时，每位玩家各自开始建设自己的殖民地。"
zhTW = "開啟時，所有人共同建造一個殖民地，共享相同的貨物和科學點數。關閉時，每位玩家都會建立自己的殖民地。"
ruRU = "Все вместе строят одну колонию, используя общие товары и науку. Если отключено, каждый игрок начинает свою колонию."
jaJP = "オンの場合、全員が同じ物資と科学を共有する1つのコロニーを一緒に築きます。オフの場合、各プレイヤーが自分のコロニーを築き始めます。"
frFR = "Activé, tout le monde construit une seule colonie ensemble, avec les mêmes biens et les mêmes recherches. Désactivé, chaque joueur commence avec sa propre colonie."
deDE = "Alle bauen gemeinsam eine Kolonie und teilen sich Waren und Forschung. Deaktiviert: Jeder Spieler beginnt mit einer eigenen Kolonie."
plPL = "Wszyscy wspólnie budują jedną kolonię, korzystając z tych samych towarów i nauki. Wyłączone: każdy gracz rozpoczyna własną kolonię."
ptBR = "Com esta opção ativada, todos constroem uma única colônia juntos, compartilhando os mesmos bens e conhecimentos científicos. Desativada, cada jogador começa com sua própria colônia."
koKR = "켜면 모든 플레이어가 같은 물자와 과학을 공유하는 하나의 식민지를 함께 건설합니다. 끄면 각 플레이어가 각자의 식민지에서 시작합니다."
csCZ = "Zapnuto: všichni společně budují jednu kolonii a sdílejí stejné zboží i vědu. Vypnuto: každý hráč začíná s vlastní kolonií."
viVN = "Mọi người cùng xây dựng một khu thuộc địa, dùng chung hàng hóa và điểm khoa học. Nếu tắt, mỗi người chơi sẽ bắt đầu khu thuộc địa riêng."
trTR = "Aynı malları ve bilimi paylaşarak herkes birlikte tek bir koloni kurar. Kapalıyken her oyuncu kendi kolonisini kurar."

