["TimberEmpires.Settings.HordeEvery.Tooltip"]
status = "normal"
raw = "How many nights apart the hordes come. The longer the wait, the bigger each horde and the more each sunrise brings. A badtide's first night always brings a super horde."
enUS = "How many nights between horde attacks. The longer the wait, the bigger each horde, and the more each sunrise brings. The first night of a badtide always brings a super horde."
zhCN = "成群来袭的间隔夜数。等待时间越长，每波敌群规模越大，每次日出带来的敌群也越多。恶潮的第一个夜晚总会带来一波超级敌群。"
zhTW = "兩波大軍來襲之間相隔的夜數。等待時間越長，每波大軍就越龐大，而且每次日出帶來的災禍也越多。惡潮的第一個夜晚必定會帶來超級大軍。"
ruRU = "Сколько ночей проходит между нашествиями орд. Чем дольше ждать, тем больше каждая орда и тем больше принесёт каждый рассвет. В первую ночь плохого прилива всегда приходит суперорда."
jaJP = "大群が何夜おきに襲来するかを設定します。待ち時間が長いほど、各大群は大きくなり、日の出のたびに得られるものも増えます。悪潮の初夜には、必ず超大群が襲来します。"
frFR = "Nombre de nuits entre les hordes. Plus l’attente est longue, plus chaque horde est importante et plus chaque lever de soleil en apporte. La première nuit d’une marée toxique apporte toujours une super horde."
deDE = "Wie viele Nächte zwischen den Horden liegen. Je länger die Wartezeit, desto größer ist jede Horde und desto mehr bringt jeder Sonnenaufgang. In der ersten Nacht einer Schadwelle kommt immer eine Superhorde."
plPL = "Co ile nocy nadciągają hordy. Im dłuższe oczekiwanie, tym większa każda horda i tym więcej przynosi każdy świt. Pierwsza noc złego przypływu zawsze przynosi superhordę."
ptBR = "Quantas noites separam a chegada das hordas. Quanto maior a espera, maior cada horda e mais cada nascer do sol traz. A primeira noite de uma maré tóxica sempre traz uma super-horda."
koKR = "무리들이 며칠 밤 간격으로 오는지를 설정합니다. 기다리는 기간이 길수록 각 무리는 더 커지고, 해가 뜰 때마다 더 많은 적이 나타납니다. 악류가 시작되는 첫날 밤에는 항상 초대형 무리가 나타납니다."
csCZ = "Kolik nocí uplyne mezi příchody hord. Čím delší čekání, tím větší je každá horda a tím více jich přinese každý východ slunce. První noc přílivu toxické vody vždy přinese superhordu."
viVN = "Số đêm cách nhau giữa các đợt bầy đàn. Thời gian chờ càng lâu, mỗi đợt bầy đàn càng lớn và mỗi lần bình minh mang đến càng nhiều. Đêm đầu tiên của mỗi đợt thủy triều độc luôn mang đến một siêu bầy đàn."
trTR = "Sürülerin kaç gece arayla geldiği. Bekleme süresi uzadıkça her sürü büyür ve her gün doğumunda daha fazlası gelir. Bir zehirli gelgitin ilk gecesi her zaman süper bir sürü getirir."

