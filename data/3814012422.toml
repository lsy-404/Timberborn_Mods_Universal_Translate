["Building.TimberEmpires.Monastery.Description"]
raw = "Trains monks. Instead of fighting, they convert enemy troops and siege machines to your side, then wait for their faith to return."
status = "normal"
enUS = "Trains monks. Instead of fighting, they convert enemy troops and siege machines to your side, then wait for their faith to return."
zhCN = "训练僧侣。他们不会战斗，而是将敌方部队和攻城器械转化为我方阵营，然后等待信仰恢复。"
zhTW = "訓練僧侶。他們不與敵人戰鬥，而是感化敵軍和攻城器械，使其倒戈加入我方，接著等待他們恢復信仰。"
ruRU = "Обучает монахов. Вместо того чтобы сражаться, они переманивают в ваши ряды вражеские войска и осадные машины, а затем ждут, пока те вернут свою веру."
jaJP = "修道士を訓練する。戦う代わりに、敵の兵士や攻城兵器を味方に改宗させ、彼らの信仰が戻るのを待つ。"
frFR = "Forme des moines. Au lieu de combattre, ils rallient à votre cause les troupes ennemies et les engins de siège, puis attendent qu’ils retrouvent la foi."
deDE = "Bildet Mönche aus. Statt zu kämpfen, bekehren sie feindliche Truppen und Belagerungsmaschinen auf eure Seite und warten dann, bis ihr Glaube zurückkehrt."
plPL = "Szkoli mnichów. Zamiast walczyć, nawracają wrogie oddziały i machiny oblężnicze na twoją stronę, a potem czekają, aż powróci ich wiara."
ptBR = "Treina monges. Em vez de lutar, eles convertem tropas inimigas e máquinas de cerco para o seu lado e, depois, esperam que a fé delas retorne."
koKR = "수도승을 훈련합니다. 적과 싸우는 대신 적 병력과 공성 기계를 아군으로 개종시킨 뒤, 신앙심을 되찾을 때까지 기다립니다."
trTR = "Keşiş yetiştirir. Savaşmak yerine düşman birliklerini ve kuşatma makinelerini kendi tarafına geçirir, ardından inançlarının geri dönmesini bekler."
esES = "Entrena monjes. En lugar de luchar, convierten a las tropas y máquinas de asedio enemigas a tu bando y luego esperan a que su fe regrese."
itIT = "Addestra monaci. Invece di combattere, convertono le truppe nemiche e le macchine d'assedio dalla loro parte, poi attendono che la loro fede ritorni."
ukUA = "Навчає ченців. Замість бою вони перетворюють ворожі війська та облогові машини на своїх союзників, а потім чекають, поки їхня віра повернеться."
thTH = "ฝึกพระสงฆ์ แทนที่จะสู้รบ พวกเขาจะเปลี่ยนทหารและเครื่องจักรปิดล้อมของศัตรูให้มาอยู่ข้างคุณ แล้วรอจนศรัทธาของพวกเขากลับคืนมา"
csCZ = "Vycvičí mnichy. Místo boje přetahují nepřátelské vojáky a obléhací stroje na vaši stranu a pak čekají, až se jim vrátí víra."
viVN = "Huấn luyện tu sĩ. Thay vì chiến đấu, họ cải đạo quân địch và máy công thành sang phe bạn, rồi chờ đức tin của họ trở lại."
caES = "Entrena monjos. En lloc de lluitar, converteixen les tropes enemigues i les màquines d'setge al teu bàndol i després esperen que la seva fe torni."
beBY = "Навучае манахаў. Замест таго каб змагацца, яны пераконваюць варожых воінаў і асадныя машыны перайсці на ваш бок, а потым чакаюць, пакуль іх вера вернецца."
roRO = "Antrenează călugări. În loc să lupte, ei convertesc trupele inamice și mașinăriile de asediu de partea ta, apoi așteaptă ca credința lor să revină."
huHU = "Szerzeteseket képez ki. Harc helyett átállítják az ellenséges csapatokat és ostromgépeket a te oldaladra, majd megvárják, amíg hitük visszatér."
arSA = "يدرّب الرهبان. فبدلاً من القتال، يحوّلون جنود العدو وآلات الحصار إلى صفّك، ثم ينتظرون عودة إيمانهم."

