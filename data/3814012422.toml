["NaturalResource.Pumpkin.FlavorDescription"]
raw = "Carved, it lights up the night. Eaten raw, it cures the badwater sickness from an undead raccoon's bite."
status = "normal"
enUS = "Carved, it lights up the night. Eaten raw, it cures the badwater sickness from an undead raccoon's bite."
zhCN = "雕刻后，它能照亮夜晚。生吃则能治愈被不死浣熊咬伤后患上的恶水病。"
zhTW = "雕刻後能照亮夜晚。生吃則能治癒被不死浣熊咬傷後感染的污水病。"
ruRU = "Если вырезать, освещает ночь. В сыром виде излечивает от болезни, вызванной заражённой водой, после укуса неживого енота."
jaJP = "彫れば夜を照らし、生で食べればアンデッドのアライグマに噛まれてかかったバッドウォーター病を治す。"
frFR = "Sculptée, elle illumine la nuit. Mangée crue, elle guérit le mal de l'eau contaminée causé par la morsure d'un raton laveur mort-vivant."
deDE = "Geschnitzt erhellt er die Nacht. Roh gegessen heilt er die Badwasserkrankheit, die ein untoter Waschbär mit seinem Biss verursacht."
plPL = "Wydrążona rozświetla noc. Zjedzona na surowo leczy chorobę od skażonej wody po ugryzieniu nieumarłego szopa pracza."
ptBR = "Quando entalhada, ilumina a noite. Comida crua, cura a doença da água contaminada causada pela mordida de um guaxinim morto-vivo."
koKR = "조각하면 밤을 밝혀 줍니다. 날것으로 먹으면 언데드 너구리에게 물려 생긴 오염수병을 치료합니다."
csCZ = "Vydlabaná osvětluje noc. Syrová vyléčí nemoc znečištěné vody způsobenou kousnutím nemrtvého mývala."
viVN = "Được khắc, nó thắp sáng màn đêm. Ăn sống, nó chữa khỏi bệnh nhiễm nước độc do bị gấu mèo xác sống cắn."
trTR = "Oyulunca geceyi aydınlatır. Çiğ yenince, yaşayan ölü bir rakunun ısırığından kaynaklanan kirli su hastalığını iyileştirir."

