["Building.TimberEmpires.Ballista.Description"]
new = "Shoots heavy bolts flat and far: deadly to enemies, weak against walls. Its crew moves and aims it."
status = "normal"
enUS = "Fires heavy bolts in a flat, far-reaching trajectory: deadly to enemies, but weak against walls. Its crew moves and aims it."
zhCN = "平射重型弩箭，射程远：对敌人致命，对墙体威力较弱。由操作人员移动并瞄准。"
ruRU = "Стреляет тяжёлыми болтами по прямой и на большое расстояние: смертельно опасна для врагов, но малоэффективна против стен. Расчёт перемещает её и наводит на цель."
jaJP = "重い矢を水平に遠くまで射出する。敵には致命的だが、壁には効果が薄い。乗組員が移動させ、照準を合わせる。"
frFR = "Tire des carreaux lourds à l’horizontale et à longue portée : mortels contre les ennemis, inefficaces contre les murs. Son équipage la déplace et la vise."
deDE = "Verschießt schwere Bolzen flach und weit: tödlich für Feinde, wirkungslos gegen Mauern. Die Besatzung bewegt und richtet sie aus."
plPL = "Wystrzeliwuje ciężkie bełty płasko i daleko: zabójcze dla wrogów, nieskuteczne przeciwko murom. Załoga przemieszcza ją i celuje z niej."
ptBR = "Dispara virotes pesados em linha reta e a longas distâncias: mortal contra inimigos, fraco contra muralhas. Sua equipe o movimenta e mira."
koKR = "무거운 쇠뇌 화살을 낮고 멀리 쏩니다. 적에게는 치명적이지만 벽에는 효과가 약합니다. 승무원이 이동하고 조준합니다."
csCZ = "Vystřeluje těžké šípy přímo a do dálky: proti nepřátelům je smrtící, proti zdem slabá. Obsluha s ní pohybuje a míří."
viVN = "Bắn những mũi tên nặng đi xa theo đường thẳng: chí mạng với kẻ địch, nhưng yếu trước tường thành. Kíp vận hành di chuyển và ngắm bắn bằng nó."
trTR = "Ağır cıvataları düz ve uzağa fırlatır: düşmanlara karşı ölümcül, duvarlara karşı etkisizdir. Mürettebatı onu hareket ettirip nişan alır."

