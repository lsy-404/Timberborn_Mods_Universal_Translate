["TimberEmpires.Settings.FogOfWar.Tooltip"]
status = "normal"
raw = "You only see the land around your land claims, buildings, beavers and bots. Outside it, other players' buildings, beavers, bots and cursors are hidden."
enUS = "You only see the land around your land claims, buildings, beavers, and bots. Outside it, other players’ buildings, beavers, bots, and cursors are hidden."
zhCN = "你只能看到领地、建筑、海狸和机器人周围的土地。视野之外，其他玩家的建筑、海狸、机器人和光标都会隐藏。"
zhTW = "你只能看見土地宣稱區、建築物、海狸和機器人周圍的土地。除此之外，其他玩家的建築物、海狸、機器人和游標都會隱藏。"
ruRU = "Вы видите только землю вокруг своих территориальных владений, построек, бобров и ботов. За их пределами скрыты постройки, бобры, боты и курсоры других игроков."
jaJP = "自分の領地、建物、ビーバー、ボットの周囲にある土地だけが見えます。その範囲外では、他のプレイヤーの建物、ビーバー、ボット、カーソルは隠されます。"
frFR = "Vous ne voyez que le terrain autour de vos revendications territoriales, de vos bâtiments, de vos castors et de vos robots. En dehors de cette zone, les bâtiments, les castors, les robots et les curseurs des autres joueurs sont cachés."
deDE = "Du siehst nur das Gelände rund um deine Landansprüche, Gebäude, Biber und Bots. Außerhalb davon sind die Gebäude, Biber, Bots und Cursor anderer Spieler verborgen."
plPL = "Widzisz tylko teren wokół swoich roszczeń do ziemi, budynków, bobrów i botów. Poza nim budynki, bobry, boty i kursory innych graczy są ukryte."
ptBR = "Você só vê o terreno ao redor das suas áreas reivindicadas, construções, castores e robôs. Fora dessa área, as construções, os castores, os robôs e os cursores dos outros jogadores ficam ocultos."
koKR = "자신의 영토 주장 구역, 건물, 비버와 봇 주변의 땅만 볼 수 있습니다. 그 밖에서는 다른 플레이어의 건물, 비버, 봇과 커서가 숨겨집니다."
csCZ = "Vidíte pouze území kolem svých nároků na půdu, budov, bobrů a robotů. Mimo něj jsou budovy, bobři, roboti a kurzory ostatních hráčů skryté."
viVN = "Bạn chỉ nhìn thấy khu vực quanh các vùng đất bạn đã tuyên bố chủ quyền, công trình, hải ly và rô-bốt của mình. Bên ngoài khu vực đó, công trình, hải ly, rô-bốt và con trỏ của người chơi khác sẽ bị ẩn."
trTR = "Yalnızca arazi hak taleplerinizin, binalarınızın, kunduzlarınızın ve botlarınızın çevresindeki araziyi görürsünüz. Bu alanın dışında diğer oyuncuların binaları, kunduzları, botları ve imleçleri gizlenir."

