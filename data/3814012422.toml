status = "normal"
raw = "Keep your tail clear."
enUS = "Keep your tail clear."
zhCN = "别挡着尾巴。"
zhTW = "別讓尾巴礙事。"
ruRU = "Держите хвост подальше."
jaJP = "しっぽに気をつけて。"
frFR = "Gardez votre queue dégagée."
deDE = "Halte deinen Schwanz frei."
plPL = "Nie trzymaj ogona w pobliżu."
ptBR = "Mantenha sua cauda desobstruída."
