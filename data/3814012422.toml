zhTW = "派遣補給車前往前線，讓部隊能吃喝，並在道路之外建造攻城器械。"
ruRU = "Отправляет обозы к передовой, чтобы войска могли есть, пить и строить осадные машины вдали от дорог."
jaJP = "補給カートを前線に送り、兵士たちが食事や水分補給をし、道路から離れた場所で攻城兵器を建造できるようにします。"
frFR = "Envoie des chariots de ravitaillement au front pour que les troupes puissent manger, boire et construire des engins de siège hors des routes."
deDE = "Schickt Versorgungskarren an die Front, damit Truppen essen, trinken und abseits der Straßen Belagerungsmaschinen bauen können."
plPL = "Wysyła wozy zaopatrzeniowe na front, aby żołnierze mogli jeść, pić i budować machiny oblężnicze poza drogami."
