thTH = "ฝ่ายที่คุณจะสร้างเมืองด้วยในเกมที่มีหลายฝ่าย หากฝ่ายของคุณยังไม่ปรากฏบนแผนที่ ศูนย์เขตแรกที่คุณสร้างจะเป็นจุดเริ่มต้นฟรี การตั้งค่านี้จะมีผลเมื่อโหลดเกม"
csCZ = "Frakce, za kterou hrajete ve hře se smíšenými frakcemi. Pokud vaše frakce na mapě ještě není, první centrum okrsku získáte zdarma. Projeví se při načtení hry."
viVN = "Phe phái bạn xây dựng trong trò chơi có nhiều phe phái. Nếu phe phái của bạn chưa có trên bản đồ, Trung tâm Quận đầu tiên sẽ được miễn phí. Có hiệu lực khi trò chơi tải."
caES = "La facció amb què construeixes en una partida de facions mixtes. Si la teva facció encara no és al mapa, el primer Centre de Districte és un inici gratuït. Té efecte quan es carrega la partida."
beBY = "Фракцыя, з якой вы пачынаеце ў гульні са змешанымі фракцыямі. Калі вашай фракцыі яшчэ няма на карце, ваш першы District Center — бясплатны старт. Набывае сілу пасля загрузкі гульні."
roRO = "Faction-ul cu care construiești într-un joc cu mai multe facțiuni. Dacă facțiunea ta nu se află încă pe hartă, primul tău Centru de District este un start gratuit. Intră în vigoare la încărcarea jocului."
huHU = "A vegyes frakciós játékban az a frakció, amellyel építkezel. Ha a frakciód még nincs a térképen, az első Körzetközpontod ingyenes kezdés. A változás a játék betöltésekor lép életbe."
arSA = "الفصيل الذي تبني به في الألعاب متعددة الفصائل. إذا لم يكن فصيلك موجودًا على الخريطة بعد، فإن مركز المنطقة الأول الذي تبنيه يكون بدايةً مجانية. يصبح ذلك ساريًا عند تحميل اللعبة."

