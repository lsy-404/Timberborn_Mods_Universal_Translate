["Building.TimberEmpires.Armory.Description"]
raw = "Makes swords for warriors, battle axes for berserkers, and muskets on Archipelago maps."
status = "normal"
enUS = "Makes swords for warriors, battle axes for berserkers, and muskets on Archipelago maps."
zhCN = "为战士制造剑，为狂战士制造战斧，并在群岛地图上制造火枪。"
zhTW = "為戰士製作劍，為狂戰士製作戰斧，並在群島地圖上製作火槍。"
ruRU = "Изготавливает мечи для воинов, боевые топоры для берсерков и мушкеты на картах Архипелага."
jaJP = "戦士のために剣を、狂戦士のために戦斧を作り、群島マップではマスケット銃も作ります。"
frFR = "Fabrique des épées pour les guerriers, des haches de bataille pour les berserkers et des mousquets sur les cartes de l'Archipel."
deDE = "Stellt Schwerter für Krieger, Streitäxte für Berserker und auf Archipel-Karten Musketen her."
plPL = "Wytwarza miecze dla wojowników, topory bojowe dla berserkerów oraz muszkiety na mapach Archipelagu."
ptBR = "Fabrica espadas para guerreiros, machados de batalha para berserkers e mosquetes nos mapas do Arquipélago."
koKR = "전사를 위한 검, 광전사를 위한 전투 도끼를 만들며, 아키펠라고 맵에서는 머스켓도 만듭니다."
trTR = "Savaşçılar için kılıç, berserkler için savaş baltası ve Takımada haritalarında musket üretir."
esES = "Fabrica espadas para los guerreros, hachas de batalla para los berserkers y mosquetes en los mapas del Archipiélago."
itIT = "Realizza spade per i guerrieri, asce da battaglia per i berserker e moschetti sulle mappe dell'Arcipelago."
ukUA = "Виготовляє мечі для воїнів, бойові сокири для берсерків і мушкети на картах Архіпелагу."
thTH = "ผลิตดาบสำหรับนักรบ ขวานศึกสำหรับเบอร์เซอร์เกอร์ และปืนคาบศิลาในแผนที่หมู่เกาะอาร์คิเพลาโก"
csCZ = "Vyrábí meče pro válečníky, bojové sekery pro berserkery a muškety na mapách Archipelago."
viVN = "Chế tạo kiếm cho chiến binh, rìu chiến cho cuồng chiến binh và súng hỏa mai trên bản đồ Archipelago."
caES = "Fabrica espases per a guerrers, destrals de batalla per a berserkers i mosquets en els mapes de l'Arxipèlag."
beBY = "Вырабляе мячы для воінаў, баявыя сякеры для берсеркаў і мушкеты на картах Архіпелага."
roRO = "Produce săbii pentru războinici, topoare de luptă pentru berserkeri și muschete pe hărțile Arhipelag."
huHU = "Kardokat készít harcosoknak, csatabárdokat berserkereknek, és muskétákat az Archipelago térképeken."
arSA = "يصنع السيوف للمحاربين والفؤوس الحربية للمقاتلين الهمجيين، والمسدسات الطويلة (البنادق) في خرائط الأرخبيل."

