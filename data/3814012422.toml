frFR = "Permet à vos guerriers et à vos charretiers de franchir une marche d'un niveau. Seuls les guerriers peuvent la construire."
deDE = "Ermöglicht deinen Kriegern und Karrenschiebern, eine Stufe zu erklimmen. Nur Krieger können sie bauen."
plPL = "Umożliwia wojownikom i woźnicom wspinanie się na jednopoziomowy stopień. Zbudować ją mogą tylko wojownicy."
ptBR = "Permite que seus guerreiros e carroceiros subam um degrau de um nível. Apenas guerreiros podem construí-la."
koKR = "전사와 운반꾼이 한 층 높이의 단차를 오를 수 있게 합니다. 전사만 건설할 수 있습니다."
csCZ = "Umožňuje tvým válečníkům a vozkařům překonat schod o jednu úroveň. Postavit ji mohou pouze válečníci."
viVN = "Cho phép chiến binh và người vận chuyển hàng leo lên bậc cao một tầng. Chỉ chiến binh mới có thể xây dựng công trình này."
trTR = "Savaşçılarınızın ve taşıyıcılarınızın tek katlı bir basamağı tırmanmasını sağlar. Bunu yalnızca savaşçılar inşa edebilir."

