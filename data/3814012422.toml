zhCN = "训练僧侣。他们不会战斗，而是将敌方部队和攻城器械转化为我方阵营，然后等待信仰恢复。"
zhTW = "訓練僧侶。他們不與敵人戰鬥，而是感化敵軍和攻城器械，使其倒戈加入我方，接著等待他們恢復信仰。"
ruRU = "Обучает монахов. Вместо того чтобы сражаться, они переманивают в ваши ряды вражеские войска и осадные машины, а затем ждут, пока те вернут свою веру."
jaJP = "修道士を訓練する。戦う代わりに、敵の兵士や攻城兵器を味方に改宗させ、彼らの信仰が戻るのを待つ。"
frFR = "Forme des moines. Au lieu de combattre, ils rallient à votre cause les troupes ennemies et les engins de siège, puis attendent qu’ils retrouvent la foi."
deDE = "Bildet Mönche aus. Statt zu kämpfen, bekehren sie feindliche Truppen und Belagerungsmaschinen auf eure Seite und warten dann, bis ihr Glaube zurückkehrt."
plPL = "Szkoli mnichów. Zamiast walczyć, nawracają wrogie oddziały i machiny oblężnicze na twoją stronę, a potem czekają, aż powróci ich wiara."
ptBR = "Treina monges. Em vez de lutar, eles convertem tropas inimigas e máquinas de cerco para o seu lado e, depois, esperam que a fé delas retorne."
koKR = "수도승을 훈련합니다. 적과 싸우는 대신 적 병력과 공성 기계를 아군으로 개종시킨 뒤, 신앙심을 되찾을 때까지 기다립니다."
csCZ = "Vycvičí mnichy. Místo boje přetahují nepřátelské vojáky a obléhací stroje na vaši stranu a pak čekají, až se jim vrátí víra."
viVN = "Huấn luyện tu sĩ. Thay vì chiến đấu, họ cải đạo quân địch và máy công thành sang phe bạn, rồi chờ đức tin của họ trở lại."
trTR = "Keşiş yetiştirir. Savaşmak yerine düşman birliklerini ve kuşatma makinelerini kendi tarafına geçirir, ardından inançlarının geri dönmesini bekler."

