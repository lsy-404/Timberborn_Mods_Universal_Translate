["Building.TimberEmpires.ArcheryRange.Description"]
status = "normal"
raw = "Trains its workers to shoot from a distance: archers, or the faction's own kind."
enUS = "Trains its workers to shoot from a distance: archers, or the faction's own kind."
zhCN = "训练工人远距离射击：弓箭手，或该派系自己的兵种。"
zhTW = "訓練工人遠距離射擊：成為弓箭手，或成為該派系自己的兵種。"
ruRU = "Обучает работников стрельбе на расстоянии: из луков или из собственного оружия фракции."
jaJP = "従業員に遠距離から射撃する訓練を行います。弓兵、または派閥独自の兵種を訓練できます。"
frFR = "Entraîne ses ouvriers au tir à distance : des archers, ou des tireurs propres à la faction."
deDE = "Trainiert seine Arbeiter im Fernkampf: als Bogenschützen oder mit der eigenen Waffenart der Fraktion."
plPL = "Szkoli swoich pracowników w strzelaniu z dystansu: na łuczników albo na własny rodzaj uzbrojenia frakcji."
ptBR = "Treina seus trabalhadores para atirar à distância: arqueiros ou membros da própria facção."
koKR = "일꾼들에게 원거리 사격을 훈련합니다. 궁수든, 세력 고유의 병종이든 말이죠."
csCZ = "Trénuje své pracovníky ve střelbě na dálku: z nich se stanou lučištníci, tedy jednotky vlastní frakce."
viVN = "Huấn luyện công nhân bắn từ xa: cung thủ, hoặc chính chủng loài của phe đó."
trTR = "İşçilerini uzaktan ateş etmek üzere eğitir: okçular ya da fraksiyonun kendi türünden olanlar."

["Building.TimberEmpires.ArcheryRange.FlavorDescription"]
status = "normal"
raw = "A beaver with a bow is still a beaver. A beaver with a bow and a grudge is an archer."
enUS = "A beaver with a bow is still a beaver. A beaver with a bow and a grudge is an archer."
zhCN = "一只拿着弓的海狸依然是海狸。一只拿着弓、心怀怨恨的海狸，就是弓箭手。"
zhTW = "拿著弓的海狸依然是海狸。拿著弓、心懷怨恨的海狸，就是弓箭手。"
ruRU = "Бобр с луком всё ещё бобр. Бобр с луком и зубом на кого-то — уже лучник."
jaJP = "弓を持ったビーバーも、やはりビーバーだ。弓と恨みを抱えたビーバーは、射手だ。"
frFR = "Un castor avec un arc reste un castor. Un castor avec un arc et une rancune est un archer."
deDE = "Ein Biber mit einem Bogen ist immer noch ein Biber. Ein Biber mit einem Bogen und einem Groll ist ein Bogenschütze."
plPL = "Bóbr z łukiem nadal jest bobrem. Bóbr z łukiem i urazą to już łucznik."
ptBR = "Um castor com um arco ainda é um castor. Um castor com um arco e um rancor é um arqueiro."
koKR = "활을 든 비버도 여전히 비버다. 활과 원한까지 품은 비버라면 궁수다."
csCZ = "Bobr s lukem je pořád bobr. Bobr s lukem a záští je lučištník."
viVN = "Một hải ly cầm cung vẫn là hải ly. Một hải ly cầm cung và ôm mối thù thì là cung thủ."
trTR = "Yay taşıyan bir kunduz da hâlâ kunduzdur. Yay taşıyan ve kin güden bir kunduz ise okçudur."

