["Building.TimberEmpires.TroopsCounter.Description"]
raw = "Counts your troops that are ready, in training, deployed, fighting or wounded. In district mode, it counts the troops of the district's barracks and ranges, wherever they are."
status = "normal"
enUS = "Counts your troops that are ready, in training, deployed, fighting, or wounded. In district mode, it counts the troops in the district’s barracks and ranges, wherever they are."
zhCN = "统计已就绪、正在训练、已部署、正在战斗或受伤的部队数量。在区划模式下，统计该区划的兵营和靶场中的部队数量，无论他们身在何处。"
zhTW = "計算已備戰、受訓中、已部署、正在戰鬥或受傷的部隊數量。在區域模式中，會計算該區域兵營和靶場的部隊，不論他們身在何處。"
ruRU = "Подсчитывает ваших бойцов, готовых к бою, проходящих подготовку, отправленных на задание, сражающихся или раненых. В режиме района учитывает бойцов из казарм и стрелковых тиров этого района, где бы они ни находились."
jaJP = "準備完了、訓練中、配備中、戦闘中、または負傷中の兵士を数えます。地区モードでは、地区内の兵舎と射撃場に所属する兵士を、どこにいても数えます。"
frFR = "Compte vos troupes prêtes, en entraînement, déployées, au combat ou blessées. En mode district, compte les troupes des casernes et des terrains de tir du district, où qu’elles se trouvent."
deDE = "Zählt deine Truppen, die einsatzbereit sind, trainiert werden, im Einsatz, im Kampf oder verwundet sind. Im Bezirksmodus zählt es die Truppen in den Kasernen und Schießständen des Bezirks, unabhängig davon, wo sie sich befinden."
plPL = "Zlicza twoje oddziały gotowe do walki, szkolone, rozmieszczone, walczące lub ranne. W trybie dzielnicowym zlicza oddziały z koszar i strzelnic w dzielnicy, niezależnie od tego, gdzie się znajdują."
ptBR = "Conta suas tropas que estão prontas, em treinamento, mobilizadas, lutando ou feridas. No modo de distrito, conta as tropas dos quartéis e campos de tiro do distrito, onde quer que estejam."
koKR = "대기 중, 훈련 중, 배치됨, 전투 중 또는 부상당한 병력의 수를 셉니다. 구역 모드에서는 병력이 어디에 있든 해당 구역의 병영과 사격장의 병력을 셉니다."
csCZ = "Počítá vaše jednotky, které jsou připravené, cvičí se, jsou nasazené, bojují nebo jsou zraněné. V režimu okrsku počítá jednotky z kasáren a střelnic daného okrsku bez ohledu na to, kde se nacházejí."
