["TimberEmpires.ShipArmament.Waiting"]
status = "normal"
raw = "{0}: waiting for haulers to bring it. They load the ship only while it lies at a shore or on its dock."
enUS = "{0}: waiting for haulers to bring it. They load the ship only while it lies at a shore or on its dock."
zhCN = "{0}：正在等待搬运工将货物运来。只有当船停靠在岸边或码头时，他们才会为船装货。"
zhTW = "{0}：正在等待搬運工將貨物運來。貨物只會在船隻停靠於岸邊或碼頭時才裝載上船。"
ruRU = "{0}: ожидание перевозчиков, которые привезут груз. Они загружают корабль только тогда, когда он стоит у берега или у своего причала."
jaJP = "{0}：運搬係が届けるのを待っています。船は岸に停泊しているか、ドックにいるときだけ積み込みを行います。"
frFR = "{0} : en attente que les transporteurs l'approvisionnent. Ils ne chargent le navire que lorsqu'il est accosté à un rivage ou à son quai."
deDE = "{0}: Wartet darauf, dass Transportarbeiter sie bringen. Sie beladen das Schiff nur, während es an einem Ufer oder an seinem Dock liegt."
plPL = "{0}: czeka, aż transportowcy dostarczą towar. Statek jest załadowywany tylko wtedy, gdy stoi przy brzegu lub przy swoim doku."
ptBR = "{0}: aguardando transportadores trazerem os itens. Eles carregam o navio somente enquanto ele estiver em uma margem ou em seu cais."
koKR = "{0}: 운반꾼이 물건을 가져오기를 기다리는 중입니다. 배는 해안이나 부두에 정박해 있을 때에만 짐을 싣습니다."
trTR = "{0}: Taşıyıcıların getirmesi bekleniyor. Gemi yalnızca kıyıda veya iskelesinde dururken yükleme yapılır."
esES = "{0}: esperando a que los transportistas lo traigan. Cargan el barco solo mientras está en una orilla o en su muelle."
itIT = "{0}: in attesa che i trasportatori la carichino. Il carico avviene solo mentre la nave si trova su una riva o sul suo molo."
ukUA = "{0}: очікує, поки переносники привезуть його. Вони завантажують корабель лише тоді, коли він стоїть біля берега або біля свого причалу."
thTH = "{0}: กำลังรอพาหนะขนส่งมาขนของขึ้น เรือจะถูกบรรทุกสินค้าก็ต่อเมื่อจอดอยู่ที่ชายฝั่งหรือที่ท่าเรือของตัวเองเท่านั้น"
csCZ = "{0}: čeká, až ho nosiči přinesou. Loď nakládají pouze tehdy, když stojí u břehu nebo na svém doku."
viVN = "{0}: đang chờ người vận chuyển mang hàng đến. Họ chỉ chất hàng lên tàu khi tàu đang neo ở bờ hoặc ở bến tàu."
caES = "{0}: esperant que els transportistes el carreguin. Només carreguen el vaixell mentre està a la costa o al seu moll."
beBY = "{0}: чакаем, пакуль грузчыкі прывязуць гэта. Яны загружаюць карабель толькі тады, калі ён стаіць ля берага або на прычале."
roRO = "{0}: așteaptă ca transportatorii să o încarce. Ea se încarcă doar cât timp se află la mal sau la dana sa."
huHU = "{0}: a szállítók arra várnak, hogy hozzák. Csak akkor rakodják be a hajót, amikor a parton vagy a kikötőjében van."
arSA = "{0}: في انتظار الناقلين لإحضاره. يقومون بتحميل السفينة فقط عندما تكون راسية عند الشاطئ أو على رصيفها."

["TimberEmpires.ShipArmament.Unmanned"]
status = "normal"
raw = "{0}: nobody to fire it. Each gun needs one of the crew, who then stops shooting their own weapon."
enUS = "{0}: nobody to fire it. Each gun needs one of the crew, who then stops shooting their own weapon."
zhCN = "{0}：没有人来操作它。每门火炮都需要一名船员，而该船员会停止操作自己的武器。"
zhTW = "{0}：沒有人可以開火。每門砲都需要一名砲組人員，而該人員會停止操作自己的武器。"
ruRU = "{0}: некому стрелять. Каждому орудию нужен один из членов экипажа, который при этом перестаёт стрелять из собственного оружия."
jaJP = "{0}：これを発射する乗員がいない。それぞれの砲には乗員が一人必要で、その乗員は自分の武器を撃つのをやめてしまう。"
frFR = "{0} : personne pour le servir. Chaque canon nécessite un membre de l'équipage, qui cesse alors de tirer avec sa propre arme."
deDE = "{0}: Niemand bedient es. Jede Kanone benötigt eine Besatzung, die dann aufhört, ihre eigene Waffe abzufeuern."
plPL = "{0}: nikt nie może jej obsługiwać. Każde działo wymaga jednego z członków załogi, który wtedy przestaje strzelać z własnej broni."
ptBR = "{0}: ninguém para disparar. Cada canhão precisa de um dos tripulantes, que então deixa de atirar com a própria arma."
koKR = "{0}: 발사할 사람이 없습니다. 각 포는 승무원 한 명이 필요하며, 그 승무원은 자신의 무기 사격을 멈추게 됩니다."
trTR = "{0}: ateşlemek için kimse yok. Her top, mürettebattan birinin kullanılmasını gerektirir; bu kişi de kendi silahıyla ateş etmeyi bırakır."
esES = "{0}: nadie para dispararlo. Cada cañón necesita a uno de la tripulación, que entonces deja de disparar su propia arma."
itIT = "{0}: nessuno per azionarlo. Ogni cannone richiede un membro dell'equipaggio, che smette quindi di usare la propria arma."
ukUA = "{0}: немає кому стріляти. Кожній гарматі потрібен один із членів екіпажу, який при цьому перестає стріляти зі своєї власної зброї."
thTH = "{0}: ไม่มีใครควบคุมให้ยิง ปืนแต่ละกระบอกต้องมีลูกเรือหนึ่งคนประจำการ และลูกเรือคนนั้นจะหยุดยิงจากอาวุธของตนเอง"
csCZ = "{0}: nikdo ji nemá na starosti. Každé dělo potřebuje jednoho z posádky, který pak přestane střílet ze své vlastní zbraně."
viVN = "{0}: không có ai điều khiển súng. Mỗi khẩu súng cần một thành viên thủy thủ đoàn, và người đó sẽ ngừng bắn bằng vũ khí của chính mình."
caES = "{0}: no hi ha ningú que la dispari. Cada canó necessita un membre de la tripulació, que aleshores deixa de disparar la seva pròpia arma."
beBY = "{0}: няма каго стрэляць з гэтай гарматы. Кожнай гарматы патрэбны адзін з экіпажу, які пасля гэтага перастае страляць са сваёй зброі."
roRO = "{0}: nu există nimeni care să o tragă. Fiecare tun are nevoie de unul dintre membrii echipajului, care apoi nu mai trage cu propria armă."
huHU = "{0}: nincs, aki tüzelne. Minden ágyúhoz szükség van egy legénységi tagra, aki ezután már nem a saját fegyverét lövi."
arSA = "{0}: لا يوجد أحد لإطلاق النار منه. كل مدفع يحتاج إلى أحد أفراد الطاقم، الذي يتوقف عندها عن إطلاق النار من سلاحه الخاص."

