["Building.TimberEmpires.SiegeTrebuchet.Description"]
raw = "Hurls siege stones at a chosen target, hurting enemies and battering walls, gates and siege engines. Needs troops aboard to turn and throw."
status = "normal"
enUS = "Hurls siege stones at a chosen target, damaging enemies and battering walls, gates, and siege engines. Requires troops aboard to turn and throw."
zhCN = "向选定目标投掷攻城石，伤害敌人并砸击城墙、城门和攻城器械。需要有士兵在上面操作才能转向和投掷。"
zhTW = "向選定目標投擲攻城石，傷害敵人並猛擊城牆、城門和攻城器械。需要有部隊搭乘才能轉向和投擲。"
ruRU = "Метает осадные камни в выбранную цель, раня врагов и повреждая стены, ворота и осадные машины. Для поворота и броска на борту должны находиться войска."
jaJP = "選択した標的に攻城石を投げつけ、敵にダメージを与え、城壁、門、攻城兵器を打ち壊す。旋回して投石するには、兵士が搭乗している必要がある。"
frFR = "Lance des pierres de siège sur une cible choisie, blessant les ennemis et endommageant les murs, les portes et les engins de siège. Nécessite des troupes à bord pour pivoter et lancer."
deDE = "Schleudert Belagerungssteine auf ein ausgewähltes Ziel, verletzt Gegner und beschädigt Mauern, Tore und Belagerungsmaschinen. Benötigt Truppen an Bord, um sich zu drehen und zu werfen."
plPL = "Miota kamieniami oblężniczymi w wybrany cel, raniąc wrogów i niszcząc mury, bramy oraz machiny oblężnicze. Do obracania i miotania potrzebuje żołnierzy na pokładzie."
ptBR = "Arremessa pedras de cerco contra um alvo escolhido, ferindo inimigos e danificando muros, portões e máquinas de cerco. Precisa de tropas a bordo para girar e arremessar."
koKR = "선택한 대상을 향해 공성용 돌을 던져 적에게 피해를 주고 성벽, 문, 공성 무기를 두드립니다. 방향을 돌리고 돌을 던지려면 병력이 탑승해야 합니다."
csCZ = "Vrhá obléhací kameny na zvolený cíl, zraňuje nepřátele a poškozuje hradby, brány a obléhací stroje. K otáčení a vrhání potřebuje vojáky na palubě."
viVN = "Ném đá công thành vào mục tiêu được chọn, gây thương tích cho kẻ địch và phá hoại tường thành, cổng cùng các cỗ máy công thành. Cần có quân lính trên máy để xoay và ném đá."
trTR = "Seçilen hedefe kuşatma taşları fırlatarak düşmanlara zarar verir; duvarları, kapıları ve kuşatma makinelerini döver. Döndürüp fırlatabilmesi için içinde askerler bulunması gerekir."

["Building.TimberEmpires.SiegeTrebuchet.FlavorDescription"]
raw = "What goes up must come down. Preferably on them."
status = "normal"
enUS = "What goes up must come down. Preferably on them."
zhCN = "凡是升上去的，终究都得落下来。最好砸在他们头上。"
zhTW = "凡是升上去的，終究都得落下來。最好是砸在他們身上。"
ruRU = "Что взлетело, то должно и упасть. Желательно им на голову."
jaJP = "上がったものは、必ず落ちてくる。できれば奴らの上に。"
frFR = "Tout ce qui monte doit redescendre. De préférence sur eux."
deDE = "Was nach oben fliegt, muss auch wieder runterkommen. Am besten auf ihnen."
plPL = "Co wzleci, musi spaść. Najlepiej na nich."
ptBR = "O que sobe tem que descer. De preferência, em cima deles."
koKR = "올라간 것은 반드시 내려오기 마련이다. 가능하면 저들 위로."
