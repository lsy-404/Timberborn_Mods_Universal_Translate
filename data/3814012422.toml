["Building.TimberEmpires.Ballista.Description"]
raw = "Shoots heavy bolts flat and far: deadly to enemies, weak against walls. Its crew moves and aims it."
status = "normal"
enUS = "Shoots heavy bolts in a flat, long-range trajectory: deadly to enemies, but weak against walls. Its crew moves and aims it."
zhCN = "平射重型弩箭，射程远：对敌人致命，对墙体效果不佳。由操作人员移动并瞄准。"
zhTW = "將重型弩箭平射至遠處：對敵人致命，對牆壁則效果不佳。由操作人員移動並瞄準。"
ruRU = "Метает тяжёлые болты по прямой и на большое расстояние: смертельно опасна для врагов, но малоэффективна против стен. Расчёт передвигает её и целится из неё."
jaJP = "重い矢を水平に遠くまで撃ち出す。敵には致命的だが、壁には効果が薄い。乗組員が移動させ、照準を合わせる。"
frFR = "Tire de lourds carreaux à l’horizontale et à longue distance : meurtriers contre les ennemis, peu efficaces contre les murs. Son équipage la déplace et la vise."
deDE = "Verschießt schwere Bolzen flach und weit: tödlich für Gegner, wirkungslos gegen Mauern. Die Besatzung bewegt und richtet sie aus."
plPL = "Wystrzeliwuje ciężkie bełty płasko i na dużą odległość: zabójcze dla wrogów, nieskuteczne przeciwko murom. Załoga przemieszcza ją i celuje z niej."
ptBR = "Dispara virotes pesados em trajetória reta e a grandes distâncias: mortais contra inimigos, mas fracos contra muralhas. Sua equipe a movimenta e mira."
koKR = "무거운 볼트를 낮고 멀리 쏩니다. 적에게는 치명적이지만 벽에는 약합니다. 승무원이 이동시키고 조준합니다."
csCZ = "Střílí těžké šipky vodorovně a do dálky: pro nepřátele smrtící, proti hradbám slabé. Její obsluha ji přemisťuje a míří s ní."
viVN = "Bắn các mũi tên lớn bay thẳng và xa: chí mạng với kẻ địch, nhưng yếu trước tường. Đội vận hành di chuyển và ngắm bắn vũ khí này."
trTR = "Ağır cıvataları düz ve uzağa fırlatır: düşmanlara karşı ölümcül, duvarlara karşı etkisizdir. Mürettebatı onu hareket ettirir ve nişan alır."

["Building.TimberEmpires.Ballista.FlavorDescription"]
raw = "One bolt, one problem solved."
status = "normal"
enUS = "One bolt, one problem solved."
