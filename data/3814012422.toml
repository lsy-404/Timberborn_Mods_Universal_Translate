["Building.TimberEmpires.LogHoarding.Description"]
raw = "A gallery on the wall where troops roll logs down at enemies, knocking over everyone in their path."
status = "normal"
enUS = "A gallery on the wall where troops roll logs down at enemies, knocking over everyone in their path."
zhCN = "墙上的廊道，士兵们可以将原木滚向敌人，撞倒沿途的所有人。"
zhTW = "建在牆上的走廊，士兵會從上面把原木滾向敵人，撞倒沿途所有人。"
ruRU = "Галерея на стене, откуда бойцы скатывают брёвна на врагов, сбивая всех на своём пути."
jaJP = "兵士たちが壁の上の回廊から敵に向けて丸太を転がし、進路上の全員をなぎ倒す。"
frFR = "Une galerie sur le mur, d'où les troupes font rouler des rondins sur les ennemis, renversant tous ceux qui se trouvent sur leur passage."
deDE = "Eine Galerie an der Mauer, von der aus Truppen Baumstämme auf Feinde hinabrollen und alle umwerfen, die ihnen in die Quere kommen."
plPL = "Galeria na murze, z której żołnierze staczają kłody na wrogów, przewracając wszystkich na swojej drodze."
ptBR = "Uma galeria na muralha de onde as tropas rolam troncos sobre os inimigos, derrubando todos em seu caminho."
koKR = "병사들이 통나무를 굴려 적에게 떨어뜨리는 성벽 위의 회랑입니다. 통나무는 지나가는 길에 있는 모든 것을 쓰러뜨립니다."
csCZ = "Galerie na hradbě, odkud vojáci pouštějí na nepřátele klády a srážejí každého, kdo jim stojí v cestě."
viVN = "Một hành lang trên tường, nơi quân lính lăn khúc gỗ xuống phía kẻ thù, quật ngã tất cả những ai trên đường đi của chúng."
trTR = "Askerlerin düşmanların üzerine kütük yuvarlayarak önlerine çıkan herkesi devirdiği bir duvar galerisi."

["Building.TimberEmpires.LogHoarding.FlavorDescription"]
raw = "\"Timber!\" is shouted out of courtesy, usually too late."
status = "normal"
enUS = "\"Timber!\" is shouted out of courtesy, usually too late."
zhCN = "“木头！”只是出于礼貌喊一声，通常喊得太晚了。"
zhTW = "「木頭要倒了！」是出於禮貌才喊的，通常喊得太遲。"
ruRU = "«Падаю!», — кричат из вежливости, обычно слишком поздно."
jaJP = "「ティンバー！」と礼儀として叫ぶが、たいてい手遅れ。"
frFR = "« Timber ! » est crié par politesse, généralement trop tard."
deDE = "„Baum fällt!“ wird aus Höflichkeit gerufen, meist zu spät."
plPL = "„Drzewo!” krzyczy się z grzeczności, zwykle zbyt późno."
ptBR = "“Madeira!” é gritado por cortesia, geralmente tarde demais."
koKR = "“나무 넘어간다!”라고 예의상 외치지만, 대개는 너무 늦다."
csCZ = "„Pozor, padá strom!“ se křičí ze slušnosti, obvykle však příliš pozdě."
viVN = "“Có cây đổ!” được hét lên như một phép lịch sự, thường là quá muộn."
trTR = "Nezaketen “Ağaç!” diye bağırılır, genellikle çok geç kalınır."

