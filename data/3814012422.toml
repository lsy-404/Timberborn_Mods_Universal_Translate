["TimberEmpires.Troops.TrainsHint"]
raw = "Changing it lets its troops go. New recruits walk here and train as the new kind."
status = "normal"
enUS = "Changing it releases its troops. New recruits walk here and train as the new kind."
zhCN = "改变它即可释放其中的部队。新招募的士兵会来到这里，接受训练，成为新兵种。"
zhTW = "更改此設定即可讓其部隊出發。新招募的成員會走到這裡，並接受訓練成為新兵種。"
ruRU = "Измените это, чтобы выпустить войска. Новобранцы приходят сюда и тренируются, чтобы стать бойцами нового типа."
jaJP = "変更すると、部隊を解散できます。新兵はここに来て、新しい種類の兵士として訓練を受けます。"
frFR = "Le modifier permet à ses troupes de partir. Les nouvelles recrues viennent ici et s’entraînent pour devenir le nouveau type."
deDE = "Wenn du es veränderst, können seine Truppen losziehen. Neue Rekruten kommen hierher und werden als neue Truppenart ausgebildet."
plPL = "Zmiana tego pozwala jego oddziałom wyruszyć. Nowi rekruci przychodzą tutaj i szkolą się na nowy rodzaj jednostek."
ptBR = "Alterá-lo permite que suas tropas partam. Novos recrutas vêm até aqui e treinam para se tornar o novo tipo."
koKR = "이 설정을 변경하면 병력이 이동합니다. 신병은 여기로 와서 새로운 유형의 병력으로 훈련받습니다."
csCZ = "Změnou toho umožníte svým jednotkám odejít. Noví rekruti sem přicházejí a cvičí se na nový druh."
viVN = "Thay đổi mục này cho phép quân lính của nó xuất phát. Tân binh đi đến đây và được huấn luyện thành loại quân mới."
trTR = "Değiştirmek askerlerinin ayrılmasını sağlar. Yeni askerler buraya gelip yeni tür olarak eğitilir."

