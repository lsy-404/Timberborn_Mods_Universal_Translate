["Tip.TimberEmpires.Supply"]
status = "normal"
raw = "Troops eat and drink from their packs. Keep a supply cart near the front so they don't have to walk home."
enUS = "Troops eat and drink from their packs. Keep a supply cart near the front so they don't have to walk home."
zhCN = "士兵从背包中获取食物和饮水。在前线附近放一辆补给车，这样他们就不用走回家了。"
zhTW = "部隊會從背包中取用食物和飲水。在前線附近放置補給車，這樣他們就不必走回家。"
ruRU = "Войска едят и пьют из своих запасов. Держите повозку со снабжением рядом с передовой, чтобы им не приходилось идти домой."
jaJP = "部隊は携行食料と飲料を消費します。帰還のために歩かなくて済むよう、前線近くに補給カートを置いてください。"
frFR = "Les troupes mangent et boivent dans leurs provisions. Gardez un chariot de ravitaillement près du front pour qu’elles n’aient pas à rentrer à pied."
deDE = "Truppen essen und trinken aus ihren Vorräten. Halte einen Versorgungskarren in der Nähe der Front bereit, damit sie nicht nach Hause laufen müssen."
plPL = "Oddziały jedzą i piją z własnych zapasów. Trzymaj wóz zaopatrzeniowy blisko frontu, żeby nie musiały wracać pieszo do domu."
ptBR = "As tropas comem e bebem de suas provisões. Mantenha um carro de suprimentos perto da linha de frente para que não precisem voltar a pé para casa."
koKR = "병력은 배낭에 든 식량과 물을 먹고 마십니다. 병력이 집까지 걸어갈 필요가 없도록 전선 가까이에 보급 수레를 두세요."
csCZ = "Vojáci jedí a pijí ze svých zásob. Držte zásobovací vůz poblíž fronty, aby nemuseli chodit domů."
viVN = "Quân lính ăn uống từ lương thực mang theo. Hãy để xe tiếp tế gần tiền tuyến để họ không phải đi bộ về nhà."
trTR = "Birlikler yiyecek ve içeceklerini erzak çantalarından tüketir. Eve kadar yürümek zorunda kalmamaları için cepheye yakın bir ikmal arabası bulundurun."

["Tip.TimberEmpires.ManWalls"]
status = "normal"
raw = "Select troops and click one of your walls. They line up along it there and hold it."
enUS = "Select troops and click one of your walls. They line up along it there and hold it."
zhCN = "选择士兵并点击你的一面墙。他们会在那里沿墙列队并坚守。"
zhTW = "選取士兵並點擊其中一道牆。他們會在那裡沿牆排開並守住它。"
ruRU = "Выберите отряды и щёлкните по одной из ваших стен. Они выстроятся вдоль неё и будут её удерживать."
jaJP = "部隊を選択し、自分の壁の1つをクリックします。部隊はそこに壁に沿って並び、陣地を守ります。"
frFR = "Sélectionnez les troupes et cliquez sur l'un de vos murs. Elles s'alignent le long de celui-ci et le tiennent."
deDE = "Wähle Truppen aus und klicke auf eine deiner Mauern. Sie stellen sich dort entlang der Mauer auf und halten sie."
plPL = "Zaznacz oddziały i kliknij jedną ze swoich ścian. Ustawią się wzdłuż niej i będą jej bronić."
ptBR = "Selecione as tropas e clique em uma das suas muralhas. Elas se alinharão ao longo dela e a defenderão."
koKR = "병력을 선택한 다음 아군 벽 중 하나를 클릭하세요. 병력이 그 벽을 따라 줄을 서서 지킵니다."
csCZ = "Vyberte jednotky a klikněte na jednu ze svých zdí. Seřadí se podél ní a budou ji bránit."
viVN = "Chọn quân và nhấp vào một trong các bức tường của bạn. Họ sẽ xếp hàng dọc theo tường tại đó và trấn giữ nó."
trTR = "Birlikleri seçin ve duvarlarınızdan birine tıklayın. Birlikler duvar boyunca dizilip onu savunur."

["Tip.TimberEmpires.Crew"]
status = "normal"
raw = "Siege machines and towers only work with troops aboard. Select warriors and click the machine to send them in."
enUS = "Siege machines and towers only work with troops aboard. Select warriors and click the machine to send them in."
zhCN = "攻城器械和箭塔只有在有士兵驻守时才能运作。选中战士并点击器械，即可派他们进去。"
zhTW = "攻城器械和箭塔只有在有士兵乘坐時才能運作。選取戰士並點擊器械，讓他們進入。"
ruRU = "Осадные машины и башни работают, только если в них есть экипаж. Выберите воинов и нажмите на машину, чтобы отправить их внутрь."
jaJP = "攻城兵器と塔は、兵士が乗っている場合にのみ機能します。戦士を選択し、兵器をクリックして乗り込ませてください。"
frFR = "Les engins de siège et les tours ne fonctionnent que si des troupes sont à bord. Sélectionnez des guerriers et cliquez sur l’engin pour les y envoyer."
deDE = "Belagerungsmaschinen und Türme funktionieren nur, wenn Truppen an Bord sind. Wähle Krieger aus und klicke auf die Maschine, um sie hineinzuschicken."
plPL = "Machiny oblężnicze i wieże działają tylko wtedy, gdy znajdują się w nich żołnierze. Zaznacz wojowników i kliknij machinę, aby ich tam wysłać."
