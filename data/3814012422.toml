["TimberEmpires.ShipArmament.Weight.Tooltip"]
status = "normal"
raw = "What the guns picked weigh, out of all the ship carries. Their weight takes room in the hold and makes the ship slower and less agile."
enUS = "What the guns pick weigh, out of all the ship carries. Their weight takes room in the hold and makes the ship slower and less agile."
zhCN = "这些火炮所选取的重量，占用了船只所载货物之外的空间。它们的重量占据货舱空间，并使船只速度变慢、机动性降低。"
zhTW = "這些火砲所挑選的重量，佔用了船上貨艙的空間，並使船隻變得更慢、更不靈活。"
ruRU = "Вес выбранного вами вооружения из всего, что перевозит корабль. Его масса занимает место в трюме и делает корабль медленнее и менее маневренным."
jaJP = "大砲が選んだ搭載物の重さは、船が積むもの全体のうちどれだけか。その重さは船倉のスペースを占め、船を遅くし、機動性も下げる。"
frFR = "Le poids des canons choisis, parmi tout ce que le navire transporte. Leur poids occupe de la place dans la cale et rend le navire plus lent et moins maniable."
deDE = "Was die Geschütze von allem, was das Schiff trägt, ausgewählt haben, wiegt. Ihr Gewicht belegt Platz im Laderaum und macht das Schiff langsamer und weniger wendig."
plPL = "Ciężar wybranych przez działa uzbrojenia, spośród całego ładunku statku. Ich masa zajmuje miejsce w ładowni i sprawia, że statek jest wolniejszy i mniej zwrotny."
ptBR = "Quanto pesam as armas escolhidas, de tudo o que o navio transporta. Esse peso ocupa espaço no porão e torna o navio mais lento e menos ágil."
koKR = "무기로 선택한 장비의 무게입니다. 배에 싣는 모든 것 중에서 이 무게는 선실 공간을 차지하고, 배의 속도와 기동성을 떨어뜨립니다."
trTR = "Seçilen silahların, geminin taşıdığı her şey arasında ağırlığı. Bu ağırlık ambarda yer kaplar ve gemiyi yavaşlatıp daha az çevik hale getirir."
esES = "Lo que pesan las armas elegidas, de todo lo que transporta el barco. Su peso ocupa espacio en la bodega y hace que el barco sea más lento y menos ágil."
itIT = "Quanto pesano le armi scelte, rispetto a tutto ciò che la nave trasporta. Il loro peso occupa spazio nella stiva e rende la nave più lenta e meno agile."
ukUA = "Вага обраної зброї з усього, що несе корабель. Вона займає місце у трюмі та робить корабель повільнішим і менш маневреним."
thTH = "ปืนที่เลือกไว้มีน้ำหนักเท่าไรเมื่อเทียบกับทั้งหมดที่เรือบรรทุก น้ำหนักของปืนเหล่านี้กินพื้นที่ในห้องเก็บของและทำให้เรือเคลื่อนที่ช้าลงและคล่องตัวน้อยลง"
csCZ = "Co zbraně z celkové nákladu lodi zabírají. Jejich hmotnost zabírá místo v podpalubí a dělá loď pomalejší a méně obratnou."
viVN = "Trọng lượng của các loại súng đã chọn, trong tổng số những gì con tàu chở. Trọng lượng này chiếm chỗ trong khoang chứa hàng và khiến con tàu di chuyển chậm hơn và kém linh hoạt hơn."
caES = "Què pesen les armes escollides, de tot el que el vaixell transporta. El seu pes ocupa espai a la bodega i fa que el vaixell sigui més lent i menys àgil."
beBY = "Тое, што ўзброеныя гарматы забіраюць з таго, што вязе карабель. Іх вага займае месца ў трыюме і робіць карабель павольнейшым і менш манеўравым."
roRO = "Greutatea armamentului ales din tot ce transportă nava. Greutatea lor ocupă spațiu în magazie și face nava mai lentă și mai puțin agilă."
huHU = "A fegyverek súlya, a hajó teljes rakományának része. Súlyuk helyet foglal a raktérben, és lassabbá és kevésbé manőverezhetővé teszi a hajót."
arSA = "ما تختاره المدافع من الوزن، من بين كل ما تحمله السفينة. وزنها يشغل مساحة في العنبر ويجعل السفينة أبطأ وأقل رشاقة."

