["TimberEmpires.Settings.FogQuality.Tooltip"]
raw = "Darkening costs next to nothing. Static fog only draws the mist again when the camera moves or what you see changes. Moving fog draws it every frame."
status = "normal"
enUS = "Darkening costs next to nothing. Static fog only draws the mist again when the camera moves or what you see changes. Moving fog draws it every frame."
zhCN = "降低亮度几乎不花成本。静态雾气只会在摄像机移动或视野内容发生变化时重新绘制。动态雾气则会在每一帧重新绘制。"
zhTW = "調暗幾乎不花成本。靜態霧氣只會在鏡頭移動或視野內容改變時重新繪製。動態霧氣則會在每一影格重新繪製。"
ruRU = "Затемнение почти ничего не стоит. Статичный туман перерисовывает дымку только при движении камеры или изменении видимого изображения. Движущийся туман перерисовывает её каждый кадр."
jaJP = "暗転のコストはほとんどかかりません。静的な霧は、カメラが動いたとき、または見える範囲が変わったときにのみ霧を描画し直します。動的な霧は毎フレーム描画し直します。"
frFR = "Assombrir ne coûte presque rien. Le brouillard statique ne redessine la brume que lorsque la caméra bouge ou que ce que vous voyez change. Le brouillard animé la redessine à chaque image."
deDE = "Das Abdunkeln kostet so gut wie nichts. Statischer Nebel zeichnet den Dunst nur dann erneut, wenn sich die Kamera bewegt oder sich das Sichtbare ändert. Beweglicher Nebel zeichnet ihn in jedem Frame neu."
plPL = "Przyciemnianie prawie nic nie kosztuje. Mgła statyczna rysuje ją ponownie tylko wtedy, gdy kamera się poruszy lub zmieni się to, co widzisz. Mgła ruchoma rysuje ją w każdej klatce."
ptBR = "Escurecer custa quase nada. A névoa estática só redesenha a neblina quando a câmera se move ou quando o que você vê muda. A névoa em movimento a redesenha a cada quadro."
koKR = "어둡게 하는 데 드는 비용은 거의 없습니다. 정적 안개는 카메라가 움직이거나 보이는 내용이 바뀔 때만 안개를 다시 그립니다. 움직이는 안개는 매 프레임마다 안개를 그립니다."
trTR = "Karartmanın maliyeti neredeyse sıfırdır. Statik sis, sisi yalnızca kamera hareket ettiğinde veya gördükleriniz değiştiğinde yeniden çizer. Hareketli sis ise her karede yeniden çizilir."
esES = "Oscurecer cuesta prácticamente nada. La niebla estática solo vuelve a dibujar la neblina cuando la cámara se mueve o cambia lo que se ve. La niebla móvil la dibuja en cada fotograma."
itIT = "Oscurare costa quasi nulla. La nebbia statica ridisegna la foschia solo quando la telecamera si muove o cambia ciò che si vede. La nebbia in movimento la ridisegna a ogni fotogramma."
ukUA = "Затемнення майже нічого не коштує. Статичний туман малює імлу знову лише тоді, коли камера рухається або змінюється те, що видно. Рухомий туман малює її щокадру."
thTH = "การทำให้มืดลงแทบไม่เสียค่าใช้จ่ายเลย หมอกแบบคงที่จะวาดหมอกใหม่ก็ต่อเมื่อกล้องเคลื่อนที่หรือสิ่งที่มองเห็นเปลี่ยนไปเท่านั้น ส่วนหมอกแบบเคลื่อนที่จะวาดใหม่ในทุกเฟรม"
csCZ = "Ztmavení nestojí skoro nic. Statická mlha se znovu vykreslí, jen když se pohne kamera nebo se změní to, co vidíte. Pohyblivá mlha se vykresluje každý snímek."
viVN = "Làm tối hầu như không tốn chi phí. Sương mù tĩnh chỉ vẽ lại màn sương khi camera di chuyển hoặc những gì bạn nhìn thấy thay đổi. Sương mù chuyển động được vẽ lại ở mỗi khung hình."
caES = "Enfosquir costa gairebé res. La boira estàtica només torna a dibuixar la boira quan es mou la càmera o canvia el que es veu. La boira en moviment la dibuixa a cada fotograma."
beBY = "Цемнаванне амаль нічога не каштуе. Статычны туман перамалёўвае імглу толькі тады, калі камера рухаецца або змяняецца тое, што вы бачыце. Рухомы туман перамалёўвае яе кожны кадр."
roRO = "Întunecarea costă aproape nimic. Ceața statică este desenată din nou doar când camera se mișcă sau când se schimbă ceea ce se vede. Ceața în mișcare este desenată la fiecare cadru."
huHU = "A sötétítés alig kerül valamibe. A statikus köd csak akkor rajzolja újra a ködöt, ha a kamera mozog, vagy ha megváltozik, amit látsz. A mozgó köd minden képkockánál újrarajzolja."
arSA = "التعتيم لا يكلّف شيئًا تقريبًا. الضباب الثابت لا يعيد رسم الضباب إلا عندما تتحرك الكاميرا أو يتغير ما تراه. أما الضباب المتحرك فيعيد رسمه في كل إطار."

