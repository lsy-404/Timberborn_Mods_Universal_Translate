["Building.TimberEmpires.Flamethrower.Description"]
status = "normal"
raw = "Burns the horde in a cone in front of it, using up extract as it fires. Short range, deadly to zombies. Its crew moves and aims it, on the ground or on a tower."
enUS = "Burns the horde in a cone in front of it, consuming extract as it fires. Short-range, deadly to zombies. Its crew moves and aims it, whether on the ground or on a tower."
zhCN = "向前方锥形区域喷射火焰，焚烧尸潮；开火时会消耗提取物。射程较短，对僵尸杀伤力极强。操作人员会在地面或塔上移动并瞄准。"
zhTW = "朝前方錐形範圍焚燒屍群，開火時會消耗萃取物。射程短，對殭屍十分致命。其操作人員會移動並瞄準它，無論是在地面上或塔上。"
ruRU = "Сжигает орду в конусе перед собой, расходуя экстракт при стрельбе. Небольшая дальность, смертоносен для зомби. Расчёт перемещает и наводит его с земли или с башни."
jaJP = "前方の円錐状の範囲に火炎を放ち、発射するたびに抽出物を消費して大群を焼き払う。射程は短いが、ゾンビには致命的。乗員が地上または塔の上で移動させ、照準を合わせる。"
frFR = "Brûle la horde dans un cône devant lui, en consommant de l’extrait à chaque tir. Portée courte, mortel contre les zombies. Son équipage le déplace et le vise, au sol ou sur une tour."
deDE = "Verbrennt die Horde in einem Kegel vor sich und verbraucht beim Feuern Extrakt. Kurze Reichweite, tödlich für Zombies. Die Besatzung bewegt und richtet den Flammenwerfer aus – am Boden oder auf einem Turm."
plPL = "Spala hordę w stożku przed sobą, zużywając ekstrakt podczas strzelania. Ma krótki zasięg i jest zabójczy dla zombie. Załoga przemieszcza go i celuje nim, zarówno na ziemi, jak i na wieży."
ptBR = "Queima a horda em um cone à sua frente, consumindo extrato ao disparar. Tem curto alcance e é mortal para zumbis. Sua equipe a movimenta e mira, no chão ou em uma torre."
koKR = "발사할 때마다 추출물을 소모하며, 전방의 원뿔 범위에 있는 좀비 무리를 불태웁니다. 사거리는 짧지만 좀비에게 치명적입니다. 승무원이 지상이나 탑 위에서 이동하며 조준합니다."
csCZ = "Spaluje hordu v kuželu před sebou a při střelbě spotřebovává extrakt. Má krátký dosah a je smrtící pro zombie. Obsluha jej přesouvá a míří s ním, ať už je na zemi, nebo na věži."
viVN = "Thiêu đốt đám xác sống trong một hình nón phía trước, tiêu hao dịch chiết khi khai hỏa. Tầm bắn ngắn, nhưng cực kỳ chết chóc với xác sống. Kíp vận hành di chuyển và ngắm bắn vũ khí này, dù đặt trên mặt đất hay trên tháp."
trTR = "Ateş ettikçe özüt tüketerek önündeki koni şeklindeki alanda zombi sürüsünü yakar. Menzili kısadır, zombilere karşı ölümcüldür. Mürettebatı, yerdeyken veya bir kule üzerindeyken silahı hareket ettirip nişan alır."

["Building.TimberEmpires.Flamethrower.FlavorDescription"]
