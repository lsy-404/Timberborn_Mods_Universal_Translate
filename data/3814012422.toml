status = "normal"
enUS = "Raises walls, gatehouses, towers, and hoardings above uneven ground, and stacks for a greater height. Cannot be hit while something is standing on it."
zhCN = "可在不平整的地面上抬高墙壁、门楼、塔楼和围挡，也可叠放以获得更高落差。上面有物体时不会受到攻击。"
zhTW = "可在不平整的地面上架高牆壁、門樓、塔樓和圍擋，也能堆疊以架得更高。上面有東西站著時，不會受到攻擊。"
ruRU = "Позволяет возводить стены, проходные башни, башни и ограждения над неровной землёй, а при установке друг на друга — на большую высоту. Его нельзя поразить, пока на нём что-то стоит."
jaJP = "起伏のある地面の上に壁、門楼、塔、仮囲いを持ち上げて設置でき、積み重ねればさらに高くできます。上に何かが立っている間は攻撃を受けません。"
frFR = "Surélève les murs, les maisons de garde, les tours et les palissades sur un terrain accidenté, et peut s'empiler pour gagner encore en hauteur. Ne peut pas être touché tant que quelque chose se trouve dessus."
deDE = "Hebt Mauern, Torhäuser, Türme und Palisaden über unebenem Gelände an und lässt sich für eine größere Höhe stapeln. Kann nicht getroffen werden, solange etwas darauf steht."
plPL = "Podnosi mury, bramy, wieże i blanki ponad nierówny teren, a także pozwala układać je piętrowo, by uzyskać większą wysokość. Nie można go trafić, gdy coś na nim stoi."
ptBR = "Eleva muros, guaritas, torres e tapumes em terrenos irregulares, e pode ser empilhada para alcançar alturas maiores. Não pode ser atingida enquanto houver algo sobre ela."
koKR = "고르지 않은 지형 위에 벽, 성문, 탑, 목책을 세우고, 여러 개를 쌓아 더 높이 올립니다. 위에 무언가가 서 있으면 공격받지 않습니다."
csCZ = "Zvedá zdi, brány, věže a palisády nad nerovným terénem a lze je skládat na sebe pro větší výšku. Nelze do ní udeřit, dokud na ní něco stojí."
viVN = "Nâng tường, cổng thành, tháp và hàng rào chắn lên trên mặt đất không bằng phẳng, đồng thời có thể chồng lên nhau để nâng cao hơn. Không thể bị phá hủy khi có vật gì đó đặt trên nó."
trTR = "Duvarları, kapı evlerini, kuleleri ve paravanları engebeli zeminin üzerine yükseltir; daha fazla yükselmek için üst üste dizilebilir. Üzerinde bir şey dururken vurulamaz."

