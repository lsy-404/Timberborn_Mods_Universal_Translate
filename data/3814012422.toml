["Building.TimberEmpires.FieldInfirmary.Description"]
raw = "A healing tub on wheels for after a battle. Once no enemy is in sight, wounded troops take turns lying in it and heal fast while its doses last. Its crew only moves it."
status = "normal"
enUS = "A healing tub on wheels for after a battle. Once no enemy is in sight, wounded troops take turns lying in it and heal quickly while its doses last. Its crew only moves it."
zhCN = "供战后使用的轮式治疗浴缸。视野内没有敌人后，受伤的士兵会轮流躺进去，在药剂耗尽前快速恢复。工作人员只负责移动它。"
zhTW = "戰後使用的輪式療傷浴桶。視野內沒有敵人時，受傷的士兵會輪流躺進桶裡，在藥劑用完前快速療傷。工作人員只負責移動它。"
ruRU = "Передвижная лечебная купель для восстановления после битвы. Когда врагов не видно, раненые бойцы по очереди ложатся в неё и быстро лечатся, пока хватает порций. Экипаж лишь перемещает её."
jaJP = "戦闘後に使う、車輪付きの治療槽。敵が視界にいなくなると、負傷した兵士たちが交代で横たわり、薬がある間はすばやく回復する。乗組員はこれを移動させるだけ。"
frFR = "Une baignoire de soins sur roues pour l’après-bataille. Dès qu’aucun ennemi n’est en vue, les troupes blessées s’y allongent à tour de rôle et guérissent rapidement tant qu’il reste des doses. Son équipage se contente de la déplacer."
deDE = "Eine rollende Heilwanne für die Zeit nach einer Schlacht. Sobald kein Feind mehr in Sicht ist, legen sich verwundete Truppen abwechselnd hinein und heilen schnell, solange die Dosen reichen. Die Besatzung bewegt sie nur."
plPL = "Mobilna balia lecznicza na kółkach na czas po bitwie. Gdy żaden wróg nie jest w zasięgu wzroku, ranni żołnierze kładą się w niej na zmianę i szybko się leczą, dopóki nie wyczerpią się dawki. Jej załoga tylko ją przemieszcza."
ptBR = "Uma banheira de cura sobre rodas para depois de uma batalha. Quando não houver inimigos à vista, as tropas feridas se revezam para se deitar nela e se curam rapidamente enquanto durarem as doses. A equipe só a transporta."
koKR = "전투 후를 위한 바퀴 달린 치료 욕조입니다. 시야에 적이 없으면 부상당한 병사들이 번갈아 욕조에 누워 치료약이 남아 있는 동안 빠르게 회복합니다. 승무원은 욕조를 옮기기만 합니다."
trTR = "Savaştan sonra kullanmak için tekerlekli bir şifa küveti. Görüş alanında düşman kalmadığında, yaralı askerler sırayla içine uzanıp dozları yettiği sürece hızla iyileşir. Mürettebatı yalnızca küveti hareket ettirir."
esES = "Una bañera curativa con ruedas para después de una batalla. Cuando no haya enemigos a la vista, los soldados heridos se turnan para tumbarse en ella y curarse rápidamente mientras le queden dosis. Su tripulación solo la mueve."
itIT = "Una vasca curativa su ruote per il dopobattaglia. Quando non ci sono nemici in vista, le truppe ferite vi si sdraiano a turno e guariscono rapidamente finché durano le dosi. Il suo equipaggio si limita a spostarla."
ukUA = "Лікувальна купіль на колесах після бою. Щойно жодного ворога не видно, поранені бійці по черзі лягають у неї та швидко зцілюються, доки вистачає доз. Її екіпаж лише переміщує її."
thTH = "อ่างรักษาพยาบาลติดล้อสำหรับหลังการต่อสู้ เมื่อไม่มีศัตรูอยู่ในสายตา ทหารที่บาดเจ็บจะผลัดกันลงไปนอนแช่และฟื้นฟูอย่างรวดเร็ว ตราบใดที่โดสยาที่ยังมีอยู่ไม่หมด ลูกเรือมีหน้าที่เพียงเคลื่อนย้ายมัน"
csCZ = "Pojízdná léčebná káď pro chvíle po bitvě. Jakmile není na dohled žádný nepřítel, zranění vojáci se v ní střídají a rychle se uzdravují, dokud vystačí její dávky. Její posádka ji pouze přesouvá."
viVN = "Một bồn chữa thương có bánh xe dùng sau trận chiến. Khi không còn kẻ địch nào trong tầm mắt, binh lính bị thương thay phiên nằm trong bồn và hồi phục nhanh chừng nào thuốc còn tác dụng. Đội ngũ vận hành chỉ di chuyển bồn."
caES = "Una tina de curació amb rodes per després d'una batalla. Quan no hi ha cap enemic a la vista, les tropes ferides s'hi estiren per torns i es recuperen ràpidament mentre li durin les dosis. La seva tripulació només la mou."
beBY = "Лячэбная купель на колах для выкарыстання пасля бітвы. Калі ў полі зроку няма ворагаў, параненыя байцы па чарзе кладуцца ў яе і хутка вылечваюцца, пакуль не скончацца дозы. Экіпаж толькі перасоўвае яе."
roRO = "O cadă de tratament pe roți, pentru după o bătălie. Când nu mai e niciun inamic la vedere, trupele rănite se întind pe rând în ea și se vindecă repede cât timp mai are doze. Echipajul ei doar o deplasează."
huHU = "Kerekeken guruló gyógyító dézsa csaták utánra. Amint nincs ellenség a látóhatáron, a sebesült katonák felváltva fekszenek bele, és gyorsan gyógyulnak, amíg tartanak az adagjai. A személyzet csak mozgatja."
arSA = "حوض استشفاء على عجلات لما بعد المعركة. عندما لا يكون أي عدو في مرمى البصر، يتناوب الجنود المصابون على الاستلقاء فيه ويتعافون بسرعة ما دامت جرعاته متوفرة. لا يفعل طاقمه سوى نقله."

