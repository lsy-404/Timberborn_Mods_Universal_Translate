["TimberEmpires.Settings.FogOfWar.Tooltip"]
raw = "Off shows you everything. Fog shows only the land around your land claims, buildings, beavers and bots, and hides other players' buildings, beavers, bots and cursors outside it. Black fog is the same, and land you haven't explored yet is black."
status = "normal"
enUS = "Off shows you everything. Fog shows only the land around your land claims, buildings, beavers, and bots, and hides other players' buildings, beavers, bots, and cursors outside that area. Black fog works the same way, and unexplored land is black."
zhCN = "关闭时可看到所有内容。迷雾模式下，只能看到领地、建筑、海狸和机器人的周边区域；该区域之外的其他玩家的建筑、海狸、机器人和光标都会被隐藏。黑雾模式也是如此，尚未探索过的土地会显示为黑色。"
zhTW = "關閉時會顯示所有內容。迷霧模式只會顯示土地宣告、建築物、海狸和機器人周圍的土地，並隱藏範圍以外其他玩家的建築物、海狸、機器人和游標。黑霧模式也是如此，尚未探索的土地會呈現黑色。"
ruRU = "В выключенном режиме видно всё. В режиме тумана видна только земля вокруг ваших земельных участков, зданий, бобров и ботов, а здания, бобры, боты и курсоры других игроков за её пределами скрыты. Чёрный туман работает так же, а ещё не исследованная вами земля отображается чёрным цветом."
jaJP = "オフではすべてが見えます。フォグでは、自分の領有地、建物、ビーバー、ボットの周囲の土地だけが見え、それ以外にある他のプレイヤーの建物、ビーバー、ボット、カーソルは隠されます。黒いフォグも同じですが、まだ探索していない土地は黒く表示されます。"
frFR = "Désactivé affiche tout. Le brouillard n’affiche que les terres autour de vos revendications territoriales, de vos bâtiments, de vos castors et de vos robots, et masque les bâtiments, les castors, les robots et les curseurs des autres joueurs en dehors de cette zone. Le brouillard noir fonctionne de la même manière, et les terres que vous n’avez pas encore explorées sont noires."
deDE = "„Aus“ zeigt dir alles. „Nebel“ zeigt nur das Land rund um deine Gebietsansprüche, Gebäude, Biber und Bots und blendet außerhalb davon die Gebäude, Biber, Bots und Cursor anderer Spieler aus. „Schwarzer Nebel“ funktioniert genauso, und noch nicht erkundetes Land ist schwarz."
plPL = "Wyłączone pokazuje wszystko. Mgła pokazuje tylko teren wokół twoich roszczeń do ziemi, budynków, bobrów i botów, a poza nim ukrywa budynki, bobry, boty i kursory innych graczy. Czarna mgła działa tak samo, a teren, którego jeszcze nie odkryto, jest czarny."
ptBR = "Desligada mostra tudo. Névoa mostra apenas o terreno ao redor das suas reivindicações de território, construções, castores e robôs, e oculta as construções, os castores, os robôs e os cursores dos outros jogadores fora dessa área. Névoa negra funciona da mesma forma, e o terreno que você ainda não explorou fica preto."
koKR = "끔 상태에서는 모든 것이 보입니다. 안개 상태에서는 토지 소유권, 건물, 비버, 봇 주변의 땅만 보이고, 그 밖에 있는 다른 플레이어의 건물, 비버, 봇, 커서는 숨겨집니다. 검은 안개도 동일하며, 아직 탐험하지 않은 땅은 검게 표시됩니다."
csCZ = "Vypnuto vám ukáže všechno. Mlha zobrazuje pouze území kolem vašich územních nároků, budov, bobrů a robotů a skrývá budovy, bobry, roboty a kurzory ostatních hráčů mimo něj. Černá mlha funguje stejně a dosud neprozkoumané území je černé."
viVN = "Tắt sẽ hiển thị mọi thứ. Sương mù chỉ hiển thị vùng đất xung quanh các khu đất đã tuyên bố chủ quyền, công trình, hải ly và bot của bạn, đồng thời ẩn công trình, hải ly, bot và con trỏ của những người chơi khác ở bên ngoài vùng đó. Sương mù đen cũng vậy, và vùng đất bạn chưa khám phá sẽ có màu đen."
trTR = "Kapalı seçeneği her şeyi gösterir. Sis, yalnızca arazi haklarınızın, binalarınızın, kunduzlarınızın ve botlarınızın çevresindeki araziyi gösterir; bu alanın dışındaki diğer oyuncuların binalarını, kunduzlarını, botlarını ve imleçlerini gizler. Kara sis de aynıdır ve henüz keşfetmediğiniz arazi siyahtır."

