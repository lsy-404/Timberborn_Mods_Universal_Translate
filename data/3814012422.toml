esES = "Los escudos de repuesto cuelgan del exterior de un muro o torre. Las tropas en el área alrededor reciben un 8% menos de daño. No se acumula con otros escudos."
itIT = "Gli scudi di ricambio sono appesi all'esterno di un muro o di una torre. Le truppe nell'area circostante subiscono l'8% di danni in meno. Non si somma con altri scudi."
ukUA = "Запасні щити висять на зовнішньому боці стіни або башти. Війська в зоні навколо неї отримують на 8% менше шкоди. Не сумується з іншими щитами."
thTH = "โล่สำรองถูกแขวนไว้ด้านนอกของกำแพงหรือหอคอย ทหารที่อยู่ในบริเวณรอบ ๆ จะได้รับความเสียหายน้อยลง 8% ไม่สามารถนำมารวมกับโล่อื่นได้"
csCZ = "Náhradní štíty zavěšené na vnější straně zdi nebo věže. Jednotky v okolí získávají o 8 % nižší poškození. Nesčítá se s účinkem ostatních štítů."
viVN = "Khiên dự phòng được treo bên ngoài tường hoặc tháp. Quân lính trong khu vực xung quanh chịu ít hơn 8% sát thương. Không cộng dồn với các loại khiên khác."
caES = "Escuts de recanvi penjats a l'exterior d'un mur o torre. Les tropes a l'àrea del voltant reben un 8% menys de dany. No se suma amb altres escuts."
beBY = "Запасныя шчыты вісяць на вонкавым баку сцяны або вежы. Войскі на прылеглай тэрыторыі атрымліваюць на 8% менш пашкоджанняў. Не складаецца з іншымі шчытамі."
roRO = "Scuturile de rezervă sunt agățate pe exteriorul unui zid sau al unui turn. Trupele din zona din jurul acestuia primesc cu 8% mai puține daune. Nu se cumulează cu alte scuturi."
huHU = "Tartalék pajzsok lógnak egy fal vagy torony külső oldalán. A körülötte lévő területen tartózkodó csapatok 8%-kal kevesebb sebzést szenvednek. Nem adódik össze más pajzsokkal."
arSA = "تُعلَّق الدروع الاحتياطية على الجهة الخارجية لسور أو برج. تتلقى القوات في المنطقة المحيطة بها ضررًا أقل بنسبة 8%. لا تتراكم فعاليتها مع الدروع الأخرى."

