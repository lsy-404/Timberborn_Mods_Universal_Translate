["TimberEmpires.Settings.DamPressure.Tooltip"]
status = "normal"
raw = "Water pushes on dams, levees and floodgates. Thin, tall or unbraced ones, or ones hit by strong currents, take damage and can give way."
enUS = "Water pushes against dams, levees, and floodgates. Thin, tall, or unbraced structures, and those hit by strong currents, take damage and can give way."
zhCN = "水会冲击堤坝、防洪堤和水闸。较薄、较高或缺乏支撑的结构，以及遭受强劲水流冲击的结构，都会受损并可能垮塌。"
zhTW = "水會對水壩、堤防和水閘施加壓力。較薄、較高或沒有支撐的結構，以及受到強勁水流衝擊的結構，會受到損壞，甚至可能潰決。"
ruRU = "Вода давит на плотины, дамбы и шлюзы. Тонкие, высокие или неукреплённые сооружения, а также те, на которые воздействует сильное течение, повреждаются и могут разрушиться."
jaJP = "水はダム、堤防、ゲートに圧力をかけます。薄いもの、高いもの、補強されていないもの、または強い流れを受けるものは損傷し、決壊することがあります。"
frFR = "L’eau exerce une pression sur les barrages, les digues et les vannes. Ceux qui sont minces, hauts ou non renforcés, ou qui sont soumis à de forts courants, subissent des dégâts et peuvent céder."
deDE = "Wasser übt Druck auf Dämme, Deiche und Fluttore aus. Dünne, hohe oder nicht abgestützte Bauwerke sowie solche, auf die starke Strömungen treffen, nehmen Schaden und können nachgeben."
plPL = "Woda napiera na tamy, groble i śluzy. Cienkie, wysokie lub niepodparte konstrukcje, a także te, na które działają silne prądy, ulegają uszkodzeniom i mogą się zawalić."
ptBR = "A água exerce pressão sobre barragens, diques e comportas. Estruturas finas, altas ou sem escoras, ou atingidas por correntes fortes, sofrem danos e podem ceder."
koKR = "물은 댐, 제방, 수문을 밀어냅니다. 얇거나 높거나 지지대가 없는 구조물, 또는 강한 물살을 받는 구조물은 피해를 입고 무너질 수 있습니다."
csCZ = "Voda tlačí na hráze, protipovodňové hráze a stavidla. Tenké, vysoké nebo nezpevněné stavby, stejně jako stavby zasažené silným proudem, se poškozují a mohou povolit."
viVN = "Nước tạo áp lực lên đập, bờ chắn và cửa xả lũ. Những công trình mỏng, cao hoặc không được gia cố, hay bị dòng chảy mạnh tác động, sẽ chịu hư hại và có thể bị vỡ."
trTR = "Su, barajlara, setlere ve savak kapaklarına baskı uygular. İnce, uzun veya payandasız olanlar ya da güçlü akıntılara maruz kalanlar hasar görür ve yıkılabilir."

