["Building.TimberEmpires.ResinPuddle.Description"]
status = "normal"
raw = "Pine resin poured on the ground or a road. Archers by a lit Blazer set it alight with fire arrows. It burns for 6 hours and hurts everyone in it, your own too."
enUS = "Pine resin poured on the ground or a road. Archers near a lit Blazer set it alight with fire arrows. It burns for 6 hours and hurts everyone in it, including your own."
zhCN = "泼洒在地面或道路上的松脂。点燃的火焰喷射器旁的弓箭手会用火箭将其引燃。它会燃烧 6 小时，并伤害其中的所有人，包括己方人员。"
zhTW = "倒在地面或道路上的松脂。點燃的火焰噴射器旁的弓箭手會用火箭將其點燃。燃燒 6 小時，並傷害其中的所有人，包括己方人員。"
ruRU = "Смола сосны, вылитая на землю или дорогу. Лучники рядом с горящим жаровней поджигают её огненными стрелами. Она горит 6 часов и наносит урон всем, кто находится в ней, в том числе вашим бобрам."
jaJP = "地面や道路に流した松脂。火のついたブレイザーのそばにいる射手が、火矢で着火する。6時間燃え続け、その中にいる者全員にダメージを与える。自分の仲間も例外ではない。"
frFR = "Résine de pin déversée sur le sol ou une route. Les archers près d’un Brasero allumé y mettent le feu avec des flèches enflammées. Elle brûle pendant 6 heures et blesse tous ceux qui se trouvent dedans, y compris les vôtres."
deDE = "Kiefernharz, das auf den Boden oder eine Straße gegossen wird. Bogenschützen neben einem brennenden Flammenwerfer entzünden es mit Brandpfeilen. Es brennt 6 Stunden lang und verletzt alle darin, auch die eigenen."
plPL = "Żywica sosnowa rozlana na ziemi lub drodze. Łucznicy stojący przy zapalonym Podpalaczu podpalają ją ognistymi strzałami. Pali się przez 6 godzin i rani wszystkich, którzy się w niej znajdą, także twoich."
ptBR = "Resina de pinheiro derramada no chão ou em uma estrada. Arqueiros próximos a um Incendiador aceso ateiam fogo nela com flechas incendiárias. Ela queima por 6 horas e machuca todos que estiverem nela, inclusive os seus."
koKR = "땅이나 도로에 붓는 소나무 수지입니다. 불이 켜진 블레이저 옆의 궁수들이 불화살로 불을 붙입니다. 6시간 동안 타오르며, 그 안에 있는 모든 이에게 피해를 줍니다. 아군도 예외는 아닙니다."
csCZ = "Borovicová pryskyřice vylitá na zem nebo na cestu. Lučištníci u zapáleného Blazera ji zapálí ohnivými šípy. Hoří 6 hodin a zraňuje všechny, kdo se v ní nacházejí, i vaše vlastní."
viVN = "Nhựa thông được đổ trên mặt đất hoặc đường. Cung thủ ở gần một Blazer đang cháy có thể châm lửa đốt nó bằng tên lửa. Nó cháy trong 6 giờ và gây sát thương cho tất cả những ai ở trong đó, kể cả người của bạn."
trTR = "Yere veya yola dökülmüş çam reçinesi. Yanan bir Alevleyici'nin yanındaki okçular, ateşli oklarla reçineyi tutuşturur. Reçine 6 saat boyunca yanar ve içindeki herkese, sizinkiler de dâhil, zarar verir."

["Building.TimberEmpires.ResinPuddle.FlavorDescription"]
status = "normal"
raw = "Sticky now, worse later."
enUS = "Sticky now, worse later."
zhCN = "现在黏糊糊的，以后会更糟。"
zhTW = "現在黏黏的，以後更糟。"
ruRU = "Сейчас липкая, позже станет ещё хуже."
jaJP = "今はべたべた、後でもっとひどくなる。"
frFR = "Collant maintenant, pire plus tard."
deDE = "Jetzt klebrig, später schlimmer."
plPL = "Teraz lepkie, później jeszcze gorzej."
ptBR = "Grudento agora, pior depois."
koKR = "지금은 끈적하고, 나중엔 더 심해진다."
csCZ = "Teď lepkavé, později ještě horší."
viVN = "Giờ thì dính nhớp, sau này còn tệ hơn."
trTR = "Şimdi yapış yapış, sonra daha beter."

