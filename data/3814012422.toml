["Building.TimberEmpires.BanditCamp.Description"]
raw = "Houses bandits who attack any beaver that comes near and guard their loot."
status = "normal"
enUS = "Houses bandits who attack any beaver that comes near and guard their loot."
zhCN = "容纳土匪，他们会攻击任何靠近的海狸，并守卫自己的战利品。"
zhTW = "收容會攻擊任何靠近的海狸並守護其戰利品的強盜。"
ruRU = "Вмещает бандитов, которые нападают на любого бобра, приблизившегося к лагерю, и охраняют свою добычу."
jaJP = "近づいてくるビーバーを誰でも襲い、戦利品を守る盗賊たちの住処。"
frFR = "Abrite des bandits qui attaquent tout castor qui s’approche et gardent leur butin."
deDE = "Beherbergt Banditen, die jeden Biber angreifen, der sich nähert, und ihre Beute bewachen."
plPL = "Mieszkają tu bandyci, którzy atakują każdego bobra, który się zbliży, i pilnują swoich łupów."
ptBR = "Abriga bandidos que atacam qualquer castor que se aproxime e protegem seu saque."
koKR = "근처에 오는 비버는 누구든 공격하고 전리품을 지키는 도적들이 머무는 곳입니다."
trTR = "Yakınına gelen her kunduz kolonisi sakinine saldıran haydutları barındırır ve ganimetlerini korur."
esES = "Alberga a bandidos que atacan a cualquier castor que se acerque y protegen su botín."
itIT = "Ospita banditi che attaccano qualsiasi castoro si avvicini e custodiscono il loro bottino."
ukUA = "У ньому живуть бандити, які нападають на будь-якого бобра, що наближається, і охороняють свою здобич."
thTH = "เป็นที่พักของโจรที่โจมตีบีเวอร์ทุกตัวที่เข้าใกล้ และเฝ้าปกป้องของที่ปล้นมา"
csCZ = "Ukrývá bandity, kteří napadnou každého bobra, jenž se přiblíží, a střeží svou kořist."
viVN = "Là nơi ở của bọn cướp, chúng tấn công bất kỳ hải ly nào đến gần và canh giữ chiến lợi phẩm."
caES = "Acull bandits que ataquen qualsevol castor que s'hi acosti i protegeixen el seu botí."
beBY = "Тут жывуць бандыты, якія нападаюць на любога бабра, што наблізіцца, і ахоўваюць сваю здабычу."
roRO = "Adăpostește bandiți care atacă orice castor care se apropie și își păzesc prada."
huHU = "Banditáknak ad otthont, akik megtámadnak minden közelükbe kerülő hódot, és őrzik a zsákmányukat."
arSA = "يأوي قطاع الطرق الذين يهاجمون أي قندس يقترب ويحرسون غنائمهم."

