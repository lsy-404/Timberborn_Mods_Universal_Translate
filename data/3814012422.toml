zhCN = "劫掠的强盗搭建它以翻越悬崖。他们离开时会将它拆除。"
zhTW = "由襲擊的強盜架設，用來翻越懸崖。他們離開時會把它拆掉。"
ruRU = "Устанавливается бандитами, чтобы взобраться на утёс. Они разбирают её, когда уходят."
