["TimberEmpires.Settings.TopBarShowsOwnDistricts.Tooltip"]
status = "normal"
raw = "With no district selected, the top bar, the well-being panel and the population graphs only count the districts you own. If you own none, they count the whole settlement."
enUS = "With no district selected, the top bar, well-being panel, and population graphs count only the districts you own. If you own none, they count the whole settlement."
zhCN = "未选中任何区块时，顶部栏、幸福度面板和人口图表只统计你拥有的区块。如果你一个区块都没有，则会统计整个定居点。"
zhTW = "未選取任何區域時，頂端列、幸福度面板和人口圖表只會統計你擁有的區域。若你沒有任何區域，則會統計整個聚落。"
ruRU = "Если район не выбран, в верхней панели, панели благополучия и графиках населения учитываются только принадлежащие вам районы. Если у вас нет ни одного района, учитывается всё поселение."
jaJP = "地区を選択していない場合、トップバー、幸福度パネル、人口グラフには、自分が所有する地区のみが集計されます。所有する地区がない場合は、入植地全体が集計されます。"
frFR = "Lorsqu'aucun district n'est sélectionné, la barre supérieure, le panneau de bien-être et les graphiques de population ne prennent en compte que les districts que vous possédez. Si vous n'en possédez aucun, ils prennent en compte toute la colonie."
deDE = "Wenn kein Bezirk ausgewählt ist, berücksichtigen die obere Leiste, die Wohlbefindensanzeige und die Bevölkerungsdiagramme nur die Bezirke, die dir gehören. Wenn dir keine gehören, berücksichtigen sie die gesamte Siedlung."
plPL = "Gdy nie wybrano żadnej dzielnicy, górny pasek, panel dobrostanu i wykresy populacji uwzględniają tylko należące do ciebie dzielnice. Jeśli nie masz żadnej, uwzględniają całe osiedle."
ptBR = "Sem nenhum distrito selecionado, a barra superior, o painel de bem-estar e os gráficos da população contam apenas os distritos que você possui. Se você não possuir nenhum, eles contarão toda a colônia."
koKR = "구역을 선택하지 않으면 상단 표시줄, 행복도 패널, 인구 그래프에는 보유한 구역만 집계됩니다. 보유한 구역이 없으면 정착지 전체가 집계됩니다."
csCZ = "Když není vybrána žádná čtvrť, horní lišta, panel spokojenosti a grafy populace započítávají pouze čtvrti, které vlastníte. Pokud nevlastníte žádnou, započítávají celou osadu."
viVN = "Khi không có khu vực nào được chọn, thanh trên cùng, bảng phúc lợi và các biểu đồ dân số chỉ tính các khu vực bạn sở hữu. Nếu bạn không sở hữu khu vực nào, chúng sẽ tính toàn bộ khu định cư."
trTR = "Seçili bir bölge yokken üst çubuk, refah paneli ve nüfus grafikleri yalnızca sahip olduğunuz bölgeleri sayar. Hiç bölgeniz yoksa tüm yerleşimi sayarlar."

