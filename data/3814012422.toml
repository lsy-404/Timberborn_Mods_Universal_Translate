["Building.TimberEmpires.WallTotem.Description"]
raw = "A carved beaver on a pole, standing in a corner of a wall's or tower's walk, or on the ground. Troops in the area round it hit 4% harder and take 3% less damage. Doesn't add up with another totem."
status = "normal"
enUS = "A carved beaver on a pole, placed in a corner of a wall or tower walkway, or on the ground. Troops in the area around it hit 4% harder and take 3% less damage. Does not stack with another totem."
zhCN = "一只雕刻的海狸立在杆上，可放置于墙壁或塔楼的步道拐角，也可放在地面上。附近区域内的部队造成的伤害提高 4%，受到的伤害降低 3%。效果不会与其他图腾叠加。"
zhTW = "立在柱子上的雕刻海狸，可放置在牆上或塔樓走道的角落，或地面上。附近的部隊造成的傷害提高 4%，受到的傷害降低 3%。效果不會與另一座圖騰疊加。"
ruRU = "Резной бобр на шесте, устанавливается в углу прохода на стене или башне либо на земле. Войска поблизости наносят на 4% больше урона и получают на 3% меньше урона. Эффект не суммируется с эффектом другого тотема."
jaJP = "柱に彫られたビーバー像。壁や塔の通路の隅、または地面に設置できます。周囲の部隊は与えるダメージが4%増加し、受けるダメージが3%減少します。別のトーテムとは効果が重複しません。"
frFR = "Un castor sculpté sur un poteau, placé dans un coin du chemin de ronde d'un mur ou d'une tour, ou au sol. Les troupes dans sa zone infligent 4 % de dégâts supplémentaires et en subissent 3 % de moins. Ne se cumule pas avec un autre totem."
deDE = "Ein geschnitzter Biber auf einem Pfahl, der in einer Ecke eines Wehrgangs an einer Mauer oder einem Turm oder auf dem Boden steht. Truppen in seiner Umgebung schlagen 4 % härter zu und erleiden 3 % weniger Schaden. Der Effekt ist nicht mit einem weiteren Totem kumulierbar."
plPL = "Rzeźbiony bóbr na palu, stojący w narożniku przejścia na murze lub wieży albo na ziemi. Oddziały w pobliżu zadają o 4% więcej obrażeń i otrzymują o 3% mniej obrażeń. Efekt nie kumuluje się z innym totemem."
ptBR = "Um castor esculpido em um poste, colocado em um canto do passadiço de uma muralha ou torre, ou no chão. As tropas na área ao redor causam 4% mais dano e recebem 3% menos dano. O efeito não se acumula com o de outro totem."
koKR = "기둥에 새긴 비버 조각상으로, 성벽이나 탑의 보행로 모퉁이 또는 지면에 세웁니다. 주변 병력은 공격력이 4% 증가하고 받는 피해가 3% 감소합니다. 다른 토템과 효과가 중첩되지 않습니다."
csCZ = "Vyřezávaný bobr na sloupu, který stojí v rohu ochozu na zdi či věži nebo na zemi. Jednotky v jeho okolí zasahují o 4 % silněji a utrpí o 3 % menší poškození. Bonus se nesčítá s dalším totemem."
viVN = "Một con hải ly được chạm khắc trên cột, đặt ở góc lối đi trên tường hoặc tháp, hoặc trên mặt đất. Quân lính trong khu vực xung quanh gây sát thương mạnh hơn 4% và chịu ít sát thương hơn 3%. Không cộng dồn hiệu ứng với một cột tổ vật khác."
trTR = "Bir duvarın ya da kulenin yürüyüş yolunun köşesine veya yere dikilmiş bir direk üzerindeki oyma kunduz. Çevresindeki birlikler %4 daha sert vurur ve %3 daha az hasar alır. Başka bir totemle etkisi birikmez."

