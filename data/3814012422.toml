["Building.TimberEmpires.Catapult.Description"]
status = "normal"
raw = "Hurls stones at a chosen target, hurting enemies and battering walls and siege engines. Its crew moves and aims it."
enUS = "Hurls stones at a chosen target, damaging enemies and battering walls and siege engines. Its crew moves and aims it."
zhCN = "向选定目标投掷石块，伤害敌人并破坏墙壁和攻城器械。由其乘员移动并瞄准。"
zhTW = "將石頭投向指定目標，傷害敵人並破壞城牆和攻城器械。由操作人員移動並瞄準。"
ruRU = "Метает камни в выбранную цель, нанося урон врагам и разрушая стены и осадные орудия. Расчёт перемещает её и наводит на цель."
jaJP = "選択した標的に石を投げつけ、敵にダメージを与え、壁や攻城兵器を破壊します。乗組員が移動させ、照準を合わせます。"
frFR = "Lance des pierres sur une cible choisie, blessant les ennemis et endommageant les murs et les engins de siège. Son équipage la déplace et la vise."
deDE = "Schleudert Steine auf ein gewähltes Ziel, verletzt Gegner und beschädigt Mauern und Belagerungsmaschinen. Die Besatzung bewegt und richtet es aus."
plPL = "Miota kamieniami w wybrany cel, raniąc wrogów i uszkadzając mury oraz machiny oblężnicze. Załoga przemieszcza ją i celuje z niej."
ptBR = "Arremessa pedras contra um alvo escolhido, ferindo inimigos e danificando muralhas e máquinas de cerco. Sua tripulação a move e mira."
koKR = "지정한 대상을 향해 돌을 던져 적에게 피해를 주고 성벽과 공성 무기를 공격합니다. 운용병이 투석기를 이동하고 조준합니다."
csCZ = "Vrhá kameny na zvolený cíl, zraňuje nepřátele a poškozuje hradby i obléhací stroje. Obsluha s ním pohybuje a míří."
viVN = "Phóng đá vào mục tiêu được chọn, gây thương tích cho kẻ địch và phá hủy tường thành cũng như máy công thành. Kíp vận hành di chuyển và ngắm bắn máy bắn đá."
trTR = "Seçilen hedefe taş fırlatarak düşmanlara zarar verir, duvarları ve kuşatma makinelerini hırpalar. Mürettebatı mancınığı hareket ettirir ve nişan alır."

["Building.TimberEmpires.Catapult.FlavorDescription"]
status = "normal"
raw = "\"Took them long enough.\" —Ma' Ngonel"
enUS = "\"Took them long enough.\" —Ma' Ngonel"
zhCN = "“他们可真够慢的。”——Ma' Ngonel"
zhTW = "「他們還真是慢吞吞的。」——Ma' Ngonel"
ruRU = "«Наконец-то дождались». — Ма' Нгонел"
jaJP = "「ずいぶん時間がかかったな。」—マ・ンゴネル"
frFR = "« Ça leur a pris assez longtemps. » —Ma' Ngonel"
deDE = "„Das hat lange genug gedauert.“ —Ma' Ngonel"
plPL = "„Trochę im to zajęło.” —Ma' Ngonel"
ptBR = "“Até que enfim.” —Ma' Ngonel"
koKR = "\"참 오래도 걸렸네.\" —마 응고넬"
csCZ = "„To jim to ale trvalo.“ —Ma' Ngonel"
