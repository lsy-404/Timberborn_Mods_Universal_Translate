["Building.TimberEmpires.FieldInfirmary.Description"]
status = "normal"
raw = "A healing tub on wheels for after a battle. Once no enemy is in sight, wounded troops take turns lying in it and heal fast while its doses last. A dose is 1 extract and 2 berries. Its crew only moves it."
enUS = "A healing tub on wheels for after a battle. Once no enemies are in sight, wounded troops take turns lying in it and heal quickly while its doses last. Each dose requires 1 extract and 2 berries. Its crew only moves it."
zhCN = "战后使用的车载治疗浴盆。视野中没有敌人时，受伤的部队会轮流躺进去，只要药剂还没用完，就能快速疗伤。每剂药剂由 1 份提取物和 2 颗浆果制成。工作人员只负责移动它。"
zhTW = "戰後使用的輪式治療浴缸。只要視野內沒有敵人，受傷的士兵就會輪流躺進去，在藥劑用完前快速療傷。每劑需要 1 份萃取物和 2 顆莓果。工作人員只負責移動它。"
ruRU = "Передвижная лечебная ванна для бойцов после сражения. Когда поблизости не видно врагов, раненые бойцы по очереди ложатся в неё и быстро восстанавливаются, пока не закончатся дозы. Одна доза — это 1 экстракт и 2 ягоды. Экипаж только передвигает её."
jaJP = "戦闘後に使う、車輪付きの治療槽。敵が視界にいなくなると、負傷した兵士たちは順番に中に横たわり、薬剤がある間はすばやく回復する。薬剤1回分はエキス1個とベリー2個。乗組員はこれを移動させるだけ。"
frFR = "Une baignoire de soins sur roues pour après une bataille. Dès qu’aucun ennemi n’est en vue, les troupes blessées s’y installent à tour de rôle et guérissent rapidement, tant qu’il reste des doses. Une dose contient 1 extrait et 2 baies. Son équipage ne fait que la déplacer."
deDE = "Eine rollende Heilwanne für die Zeit nach einer Schlacht. Sobald kein Feind mehr in Sicht ist, legen sich verwundete Truppen abwechselnd hinein und heilen schnell, solange die Dosen reichen. Eine Dosis besteht aus 1 Extrakt und 2 Beeren. Die Besatzung bewegt sie nur."
plPL = "Mobilna balia lecznicza na czas po bitwie. Gdy w zasięgu wzroku nie ma już wroga, ranni żołnierze kładą się w niej na zmianę i szybko się leczą, dopóki wystarczają dawki. Jedna dawka to 1 ekstrakt i 2 jagody. Załoga tylko ją przemieszcza."
ptBR = "Uma banheira de cura sobre rodas para depois da batalha. Quando não houver inimigos à vista, as tropas feridas se revezam para se deitar nela e se curam rapidamente enquanto durarem as doses. Cada dose consiste em 1 extrato e 2 frutas silvestres. Sua equipe apenas a move."
koKR = "전투 후를 위한 바퀴 달린 치료 욕조입니다. 시야에 적이 더 이상 없으면, 부상당한 병사들이 번갈아 욕조에 누워 약제가 남아 있는 동안 빠르게 치료받습니다. 약제 1회분에는 추출물 1개와 열매 2개가 듭니다. 승무원은 이 시설을 이동시키기만 합니다."
csCZ = "Léčebná káď na kolečkách pro chvíle po bitvě. Jakmile není na dohled žádný nepřítel, zranění vojáci se v ní střídají a rychle se léčí, dokud vystačí její dávky. Jedna dávka obsahuje 1 výtažek a 2 bobule. Její posádka ji pouze přemisťuje."
viVN = "Một bồn chữa trị có bánh xe, dùng sau trận chiến. Khi không còn kẻ địch nào trong tầm mắt, những binh lính bị thương sẽ lần lượt nằm vào bồn và hồi phục nhanh trong khi thuốc còn. Mỗi liều cần 1 dịch chiết và 2 quả mọng. Đội vận hành chỉ di chuyển bồn."
trTR = "Savaştan sonra kullanılmak üzere tekerlekli bir şifa küveti. Görüş alanında düşman kalmadığında, yaralı askerler sırayla içine uzanır ve dozlar tükenene kadar hızla iyileşir. Bir doz, 1 özüt ve 2 yemişten oluşur. Mürettebatı yalnızca küveti hareket ettirir."

