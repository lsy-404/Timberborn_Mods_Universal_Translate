["Building.TimberEmpires.MineLauncher.Description"]
raw = "Releases floating mines that drift with the current and explode on contact."
status = "normal"
enUS = "Releases floating mines that drift with the current and explode on contact."
zhCN = "发射随水流漂移、接触时爆炸的浮雷。"
zhTW = "釋放會隨水流漂移、接觸時便會爆炸的浮動水雷。"
