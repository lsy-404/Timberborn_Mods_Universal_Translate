["Building.TimberEmpires.SiegeRamp.Description"]
status = "normal"
raw = "A long timber ramp up a one-level step for warriors, carters and siege machines. Only warriors can build it."
enUS = "A long timber ramp up a one-level step for warriors, carters, and siege machines. Only warriors can build it."
zhCN = "一段长木坡道，可供战士、车夫和攻城器械跨越一级台阶。只有战士可以建造它。"
zhTW = "一座長木坡道，可供戰士、運貨者和攻城器械爬上一層高的台階。只有戰士能建造此坡道。"
ruRU = "Длинный деревянный пандус для подъёма на один уровень — для воинов, возчиков и осадных машин. Строить его могут только воины."
jaJP = "戦士、運搬人、攻城兵器用の、1段分の段差を上る長い木製スロープ。建設できるのは戦士のみ。"
frFR = "Une longue rampe en bois pour franchir une marche d'un niveau, destinée aux guerriers, aux charretiers et aux machines de siège. Seuls les guerriers peuvent la construire."
deDE = "Eine lange Holzrampe für Krieger, Karrenfahrer und Belagerungsmaschinen, die eine Stufe von einer Ebene überwindet. Nur Krieger können sie bauen."
plPL = "Długa drewniana pochylnia wznosząca się o jeden poziom, przeznaczona dla wojowników, woźniców i machin oblężniczych. Mogą ją budować tylko wojownicy."
ptBR = "Uma longa rampa de madeira para subir um desnível de um nível, destinada a guerreiros, carroceiros e máquinas de cerco. Apenas guerreiros podem construí-la."
koKR = "전사, 운반꾼, 공성 병기가 한 층 높이를 오를 수 있도록 만든 긴 목재 경사로입니다. 전사만 건설할 수 있습니다."
csCZ = "Dlouhá dřevěná rampa překonávající jeden výškový stupeň pro válečníky, vozky a obléhací stroje. Postavit ji mohou pouze válečníci."
viVN = "Một đường dốc gỗ dài giúp chiến binh, người vận chuyển và máy công thành vượt lên một bậc cao. Chỉ chiến binh mới có thể xây dựng nó."
trTR = "Savaşçılar, yük taşıyıcılar ve kuşatma makineleri için tek katlık bir basamağa çıkan uzun ahşap rampa. Yalnızca savaşçılar inşa edebilir."

["Building.TimberEmpires.SiegeRamp.FlavorDescription"]
status = "normal"
raw = "Ladders are for beavers. Battering rams need something gentler."
