["Building.TimberEmpires.WallFoundation.Description"]
status = "normal"
raw = "Lifts walls, gatehouses, towers and hoardings over uneven ground, and stacks for a bigger rise. Can't be hit while something stands on it."
enUS = "Raises walls, gatehouses, towers, and hoardings over uneven ground, and can be stacked for a greater height. Can't be hit while something is standing on it."
zhCN = "可在不平整的地面上抬高墙体、门楼、塔楼和围挡，也可叠放以抬得更高。上面有东西时不会受到攻击。"
zhTW = "可在不平整的地面上架高牆壁、門樓、塔樓和圍板，並可堆疊以架得更高。上面有東西站著時不會受到攻擊。"
ruRU = "Поднимает стены, ворота, башни и заграждения над неровной поверхностью; при установке друг на друга обеспечивает больший подъём. Нельзя попасть под удар, пока на платформе что-то стоит."
jaJP = "起伏のある地面の上に壁、門楼、塔、防壁を持ち上げて設置でき、積み重ねればさらに高くできます。上に何かが建っている間は攻撃を受けません。"
frFR = "Surélève les murs, les corps de garde, les tours et les palissades sur un terrain irrégulier, et s’empile pour gagner encore en hauteur. Ne peut pas être touché tant que quelque chose se trouve dessus."
deDE = "Hebt Mauern, Torhäuser, Türme und Palisaden über unebenes Gelände und lässt sich für einen größeren Höhenunterschied stapeln. Kann nicht getroffen werden, solange etwas darauf steht."
plPL = "Podnosi mury, bramy, wieże i blanki ponad nierówny teren, a ustawianie kolejnych pięter pozwala zwiększyć wysokość. Nie można go trafić, gdy coś na nim stoi."
ptBR = "Eleva muros, guaritas, torres e tapumes em terrenos irregulares, e pode ser empilhado para alcançar alturas maiores. Não pode ser atingido enquanto houver algo sobre ele."
koKR = "고르지 않은 지면 위에 벽, 성문, 탑, 가림막을 높여 세울 수 있으며, 여러 개를 쌓아 더 높이 올릴 수 있습니다. 위에 무언가가 놓여 있는 동안에는 공격받지 않습니다."
csCZ = "Zvedá zdi, brány, věže a palisády nad nerovný terén a lze je skládat na sebe, aby dosáhly větší výšky. Nelze ji zasáhnout, pokud na ní něco stojí."
viVN = "Nâng tường, nhà cổng, tháp và hàng rào lên trên mặt đất không bằng phẳng, đồng thời có thể xếp chồng để nâng cao hơn. Không thể bị tấn công khi có vật gì đứng trên đó."
trTR = "Duvarları, kapı evlerini, kuleleri ve palankaları engebeli zeminde yükseltir; daha fazla yükseltmek için üst üste yerleştirilebilir. Üzerinde bir şey dururken vurulamaz."

["Building.TimberEmpires.WallFoundation.FlavorDescription"]
status = "normal"
raw = "Even a wall needs a leg up."
enUS = "Even a wall needs a leg up."
zhCN = "就连墙也需要垫高一点。"
zhTW = "就連牆也需要墊高一點。"
ruRU = "Даже стене нужна опора."
jaJP = "壁にだって、支えが必要だ。"
frFR = "Même un mur a besoin d’un coup de pouce."
deDE = "Selbst eine Mauer braucht manchmal eine Stütze."
plPL = "Nawet ściana potrzebuje czasem podpórki."
ptBR = "Até uma parede precisa de uma ajudinha."
koKR = "벽도 다리를 뻗을 곳은 필요하다."
csCZ = "I zeď potřebuje oporu."
viVN = "Ngay cả bức tường cũng cần được nâng đỡ."
trTR = "Bir duvarın bile desteğe ihtiyacı vardır."

