["TimberEmpires.Ammo.Refill"]
raw = "Its crew fetches more from a store or supply cart within {0} tiles. Haulers also bring it when it's within {1} tiles of your roads."
status = "normal"
enUS = "Its crew fetches more from a store or supply cart within {0} tiles. Haulers also bring it when it's within {1} tiles of your roads."
zhCN = "如果仓库或补给车在 {0} 格范围内，其工作人员会从中取来更多弹药。若搬运工在距道路 {1} 格范围内，也会将弹药送来。"
zhTW = "若儲藏處或補給車在 {0} 格範圍內，其工作人員會從中取得更多彈藥。若它距離道路在 {1} 格以內，搬運工也會將彈藥送來。"
ruRU = "Его экипаж забирает боеприпасы со склада или из тележки снабжения в радиусе {0} клеток. Грузчики также доставляют их, если оно находится в радиусе {1} клеток от ваших дорог."
jaJP = "乗組員は、{0}タイル以内にある倉庫または補給カートから、さらに物資を運びます。道路から{1}タイル以内にある場合は、運搬人も物資を運んできます。"
frFR = "Son équipage en récupère davantage dans un entrepôt ou un chariot de ravitaillement situé à moins de {0} cases. Les transporteurs lui en apportent aussi s’il se trouve à moins de {1} cases de vos routes."
deDE = "Die Besatzung holt mehr Munition aus einem Lager oder Versorgungskarren in einer Entfernung von {0} Feldern. Träger bringen ebenfalls Munition, wenn es höchstens {1} Felder von deinen Straßen entfernt ist."
plPL = "Załoga pobiera więcej ze składu lub wózka zaopatrzeniowego znajdującego się w odległości do {0} pól. Tragarze również przynoszą mu zaopatrzenie, jeśli znajduje się w odległości do {1} pól od dróg."
ptBR = "Sua equipe busca mais munição em um depósito ou carrinho de suprimentos a até {0} quadrados. Os carregadores também a trazem quando ela está a até {1} quadrados das suas estradas."
koKR = "작업자들은 {0}타일 이내에 있는 창고나 보급 카트에서 더 많이 가져옵니다. 운반꾼들도 도로에서 {1}타일 이내에 있으면 탄약을 가져옵니다."
csCZ = "Jeho posádka přinese další zásoby ze skladu nebo zásobovacího vozíku ve vzdálenosti {0} polí. Přepravci je také přinesou, pokud se nachází ve vzdálenosti {1} polí od vašich cest."
viVN = "Đội vận hành sẽ lấy thêm từ kho hoặc xe tiếp tế trong phạm vi {0} ô. Người vận chuyển cũng sẽ mang thêm đến nếu nó nằm trong phạm vi {1} ô tính từ đường của bạn."
trTR = "Mürettebatı, {0} kare içindeki bir depodan veya ikmal arabasından daha fazlasını getirir. Ayrıca taşıyıcılar, yollarınızın {1} kare yakınındaysa mühimmatı buraya getirir."

