["TimberEmpires.Bandits.Description"]
raw = "A bandit guarding its camp. It belongs to no colony and attacks any beaver that comes near."
status = "normal"
enUS = "A bandit guarding its camp. It belongs to no colony and attacks any beaver that comes near."
zhCN = "守卫营地的强盗。它不属于任何殖民地，会攻击任何靠近的海狸。"
zhTW = "守衛營地的匪徒。牠不屬於任何殖民地，會攻擊任何靠近的海狸。"
ruRU = "Бандит охраняет свой лагерь. Он не принадлежит ни к одной колонии и нападает на любого бобра, который подойдёт близко."
jaJP = "キャンプを守る盗賊。どのコロニーにも属さず、近づいてくるビーバーを攻撃する。"
frFR = "Un bandit qui garde son camp. Il n’appartient à aucune colonie et attaque tout castor qui s’approche."
deDE = "Ein Bandit, der sein Lager bewacht. Er gehört zu keiner Kolonie und greift jeden Biber an, der sich nähert."
plPL = "Bandyta strzegący swojego obozu. Nie należy do żadnej kolonii i atakuje każdego bobra, który się zbliży."
ptBR = "Um bandido que protege seu acampamento. Ele não pertence a nenhuma colônia e ataca qualquer castor que se aproxime."
koKR = "야영지를 지키는 도적입니다. 어떤 식민지에도 속하지 않으며, 가까이 오는 비버를 모두 공격합니다."
trTR = "Kampını koruyan bir haydut. Hiçbir koloniye bağlı değildir ve yakınına gelen her kunduzu saldırır."
esES = "Un bandido que protege su campamento. No pertenece a ninguna colonia y ataca a cualquier castor que se acerque."
itIT = "Un bandito che sorveglia il suo accampamento. Non appartiene a nessuna colonia e attacca qualsiasi castoro che si avvicini."
ukUA = "Бандит, що охороняє свій табір. Він не належить до жодної колонії та нападає на кожного бобра, який наближається."
thTH = "โจรที่เฝ้าค่ายของตน มันไม่ได้สังกัดอาณานิคมใด และจะโจมตีบีเวอร์ทุกตัวที่เข้ามาใกล้"
csCZ = "Bandita střežící svůj tábor. Nepatří k žádné kolonii a útočí na každého bobra, který se přiblíží."
viVN = "Một tên cướp canh gác trại của nó. Nó không thuộc về thuộc địa nào và tấn công mọi hải ly đến gần."
caES = "Un bandoler que protegeix el seu campament. No pertany a cap colònia i ataca qualsevol castor que s'hi apropi."
beBY = "Бандыт, які ахоўвае свой лагер. Ён не належыць ні да адной калоніі і нападае на любога бабра, які набліжаецца."
roRO = "Un bandit care își păzește tabăra. Nu aparține niciunei colonii și atacă orice castor care se apropie."
huHU = "A táborát őrző bandita. Egyik kolóniához sem tartozik, és megtámad minden hódot, aki a közelébe merészkedik."
arSA = "قاطع طريق يحرس معسكره. لا ينتمي إلى أي مستعمرة، ويهاجم أي قندس يقترب منه."

