deDE = "Die Arbeiter hier bekommen extra Lohn und werden gebeten, draußen zu niesen."
plPL = "Pracownicy otrzymują tu dodatkowe wynagrodzenie i są proszeni o kichanie na zewnątrz."
ptBR = "Os trabalhadores daqui recebem um pagamento extra e são orientados a espirrar do lado de fora."
koKR = "이곳의 노동자들은 추가 수당을 받고 밖에서 재채기하라는 요청을 받습니다."
csCZ = "Pracovníci zde dostávají příplatek a jsou žádáni, aby kýchali venku."
viVN = "Công nhân ở đây được trả thêm lương và được yêu cầu hắt hơi bên ngoài."
trTR = "Buradaki işçilere ekstra ücret ödeniyor ve dışarıda hapşırmaları isteniyor."

