["TimberEmpires.Settings.FogQuality.Tooltip"]
status = "normal"
raw = "Darkening costs next to nothing. Static fog only draws the mist again when the camera moves or what you see changes. Moving fog draws it every frame."
enUS = "Darkening costs next to nothing. Static fog only redraws the mist when the camera moves or what you see changes. Moving fog redraws it every frame."
zhCN = "加深几乎不花成本。静态雾只有在摄像机移动或视野内容发生变化时才会重新绘制。动态雾则每帧都会绘制。"
zhTW = "調暗幾乎不花成本。靜態霧氣只會在攝影機移動或視野內容改變時重新繪製。動態霧氣則會在每一影格重新繪製。"
ruRU = "Затемнение почти ничего не стоит. Статичный туман перерисовывает дымку только при движении камеры или изменении видимого изображения. Движущийся туман перерисовывается каждый кадр."
jaJP = "暗くする処理のコストはほとんどかかりません。静的な霧は、カメラが動くか、見えているものが変化したときだけ霧を再描画します。動的な霧は毎フレーム再描画します。"
frFR = "L’assombrissement ne coûte presque rien. Le brouillard statique ne redessine la brume que lorsque la caméra bouge ou que ce que vous voyez change. Le brouillard animé la redessine à chaque image."
deDE = "Das Abdunkeln kostet so gut wie nichts. Statischer Nebel zeichnet den Dunst nur dann neu, wenn sich die Kamera bewegt oder sich das Sichtfeld ändert. Bewegter Nebel zeichnet ihn in jedem Frame neu."
plPL = "Przyciemnianie prawie nic nie kosztuje. Mgła statyczna rysuje się ponownie tylko wtedy, gdy kamera się poruszy lub zmieni się to, co widzisz. Ruchoma mgła jest rysowana w każdej klatce."
ptBR = "Escurecer custa quase nada. A névoa estática só redesenha a névoa quando a câmera se move ou o que você vê muda. A névoa em movimento a redesenha a cada quadro."
koKR = "어둡게 처리하는 데는 거의 비용이 들지 않습니다. 정적 안개는 카메라가 움직이거나 보이는 화면이 바뀔 때만 안개를 다시 그립니다. 움직이는 안개는 매 프레임마다 안개를 그립니다."
csCZ = "Ztmavení nestojí téměř nic. Statická mlha se znovu vykreslí, jen když se pohne kamera nebo se změní to, co vidíte. Pohyblivá mlha se vykresluje každý snímek."
