zhTW = "一架盾牌架，設置在牆面或塔樓走道的角落，或地面上。附近區域內的部隊受到的傷害減少 8%。效果不會與其他盾牌疊加。"
ruRU = "Стойка со щитами, которую можно разместить в углу прохода на стене или башне либо на земле. Войска поблизости получают на 8% меньше урона. Эффект не складывается с эффектом других щитов."
