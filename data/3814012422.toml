["TimberEmpires.Settings.BanditRaids.Tooltip"]
status = "normal"
raw = "From the cycle picked below, bandit camps raid players now and then, more often as the game goes on. Raiders put up ladders over cliffs and take them down when they leave. Camps left alone gain a bandit every cycle."
enUS = "Based on the cycle selected below, bandit camps raid players from time to time, more often as the game progresses. Raiders build ladders over cliffs and take them down when they leave. Camps left alone gain one bandit each cycle."
zhCN = "根据下方所选周期，土匪营地会时不时袭击玩家，且随着游戏进程推进，袭击会越来越频繁。袭击者会在悬崖上架起梯子，并在离开时将其拆除。无人干扰的营地每周期会增加一名土匪。"
zhTW = "根據下方選定的週期，土匪營地會不時襲擊玩家，且遊戲進行得越久，襲擊就越頻繁。襲擊者會在懸崖上架起梯子，離開時再拆掉。無人干預的營地每個週期都會增加一名土匪。"
ruRU = "Начиная с выбранного ниже цикла, лагеря бандитов время от времени совершают набеги на игроков, причём со временем игры — всё чаще. Налётчики устанавливают лестницы на скалах и убирают их, когда уходят. В каждом цикле в нетронутые лагеря прибывает по одному бандиту."
jaJP = "下で選択したサイクル以降、盗賊キャンプは時折プレイヤーを襲撃し、ゲームが進むにつれてその頻度が上がります。襲撃者は崖に梯子を設置し、立ち去る際に撤去します。放置されたキャンプには、サイクルごとに盗賊が1人増えます。"
frFR = "À partir du cycle choisi ci-dessous, les camps de bandits pillent les joueurs de temps à autre, et plus souvent au fil de la partie. Les pillards dressent des échelles sur les falaises et les démontent en partant. Les camps laissés à l’abandon gagnent un bandit à chaque cycle."
deDE = "Ab dem unten ausgewählten Zyklus überfallen Banditenlager von Zeit zu Zeit die Spieler, und im Laufe des Spiels immer häufiger. Die Räuber errichten Leitern über Klippen und nehmen sie wieder ab, wenn sie fortgehen. Unbehelligte Lager erhalten pro Zyklus einen Banditen dazu."
plPL = "Od wybranego poniżej cyklu obozy bandytów co jakiś czas najeżdżają graczy, a z upływem czasu coraz częściej. Najeźdźcy stawiają drabiny na klifach i zabierają je, gdy odchodzą. W obozach, których nikt nie niepokoi, w każdym cyklu przybywa jeden bandyta."
ptBR = "A partir do ciclo selecionado abaixo, os acampamentos de bandidos atacam os jogadores de vez em quando, com mais frequência conforme o jogo avança. Os invasores montam escadas sobre os penhascos e as desmontam quando vão embora. Acampamentos deixados em paz ganham um bandido a cada ciclo."
koKR = "아래에서 선택한 주기부터 산적 야영지가 가끔 플레이어를 습격하며, 게임이 진행될수록 습격이 더 잦아집니다. 습격자들은 절벽 위로 사다리를 놓고 떠날 때 사다리를 철거합니다. 내버려 둔 야영지에는 주기마다 산적이 한 명씩 늘어납니다."
csCZ = "Od níže zvoleného cyklu budou banditské tábory čas od času přepadat hráče, přičemž postupem hry budou útoky častější. Nájezdníci staví přes útesy žebříky a při odchodu je zase odstraňují. V opuštěných táborech každým cyklem přibude jeden bandita."
viVN = "Từ chu kỳ được chọn bên dưới, các trại cướp thỉnh thoảng sẽ tấn công người chơi, và càng về sau trong trò chơi thì càng thường xuyên. Những kẻ cướp dựng thang qua các vách đá rồi tháo xuống khi rời đi. Các trại không bị động đến sẽ có thêm một tên cướp sau mỗi chu kỳ."
trTR = "Aşağıda seçilen döngüden itibaren haydut kampları oyunculara ara sıra baskın düzenler; oyun ilerledikçe baskınlar daha sık gerçekleşir. Akıncılar uçurumların üzerine merdivenler kurar ve ayrılırken bunları kaldırır. Kendi hâline bırakılan kamplara her döngüde bir haydut katılır."

