csCZ = "Ztlumí houkačku, která se ozve, když jsou vaše věci napadeny, i tu, která oznamuje konec hry."
viVN = "Tắt tiếng còi báo động khi công trình của bạn bị tấn công và còi báo kết thúc trò chơi."
