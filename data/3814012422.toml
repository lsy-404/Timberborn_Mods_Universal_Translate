["Building.TimberEmpires.Catapult.Description"]
raw = "Hurls stones at a chosen target, hurting enemies and battering walls and siege engines. Its crew moves and aims it."
status = "normal"
enUS = "Hurls stones at a chosen target, hurting enemies and battering walls and siege engines. Its crew moves and aims it."
zhCN = "向选定目标投掷石块，伤害敌人并破坏城墙和攻城器械。由操作人员移动并瞄准。"
zhTW = "向選定的目標投擲石塊，傷害敵人並破壞城牆和攻城器械。由操作人員移動並瞄準。"
ruRU = "Метает камни в выбранную цель, раня врагов и разрушая стены и осадные машины. Расчёт перемещает и наводит катапульту."
jaJP = "選択した標的に石を投げつけ、敵にダメージを与え、城壁や攻城兵器を破壊します。乗組員が移動させ、照準を合わせます。"
frFR = "Projette des pierres sur une cible choisie, blessant les ennemis et endommageant les murs et les engins de siège. Son équipage la déplace et la vise."
deDE = "Schleudert Steine auf ein ausgewähltes Ziel, verletzt Gegner und beschädigt Mauern und Belagerungsmaschinen. Die Besatzung bewegt und richtet es aus."
plPL = "Miota kamieniami w wybrany cel, raniąc wrogów i obijając mury oraz machiny oblężnicze. Załoga przemieszcza ją i celuje nią."
ptBR = "Arremessa pedras contra um alvo escolhido, ferindo inimigos e danificando muros e máquinas de cerco. Sua equipe a movimenta e mira."
koKR = "선택한 목표에 돌을 던져 적에게 피해를 주고 성벽과 공성 병기를 공격합니다. 승무원이 이동시키고 조준합니다."
csCZ = "Vrhá kameny na zvolený cíl, zraňuje nepřátele a poškozuje zdi a obléhací stroje. Obsluha ji přemisťuje a míří s ní."
viVN = "Phóng đá vào mục tiêu được chọn, gây sát thương cho kẻ địch và phá hoại tường thành cùng máy công thành. Kíp vận hành di chuyển và ngắm bắn máy bắn đá."
trTR = "Seçilen hedefe taş fırlatarak düşmanlara zarar verir, duvarları ve kuşatma makinelerini hırpalar. Mürettebatı onu hareket ettirip nişan alır."

