status = "normal"
raw = "Its crew fetches more from a store or supply cart within {0} tiles. Haulers also bring it when it's within {1} tiles of your roads."
enUS = "Its crew fetches more from a store or supply cart within {0} tiles. Haulers also bring it when it's within {1} tiles of your roads."
