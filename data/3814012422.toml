["Building.TimberEmpires.WallBrazier.Description"]
status = "normal"
raw = "A fire basket on a wall, burning pine resin. Archers on the wall within two pieces of it shoot fire arrows at resin puddles. Now and then one gets burned."
enUS = "A fire basket mounted on a wall, burning pine resin. Archers on the wall within two pieces of it shoot fire arrows at resin puddles. Now and then, one gets burned."
zhCN = "墙上的火盆，燃烧着松脂。墙上距离火盆两格以内的弓箭手会向松脂积水处射出火箭。偶尔会有人被烧伤。"
zhTW = "牆上的火盆，燃燒著松脂。牆上距離它兩格以內的弓箭手會朝松脂水窪射出火箭。偶爾會有人被燒傷。"
ruRU = "Жаровня на стене, в которой горит сосновая смола. Лучники на стене в пределах двух её секций стреляют огненными стрелами по лужам смолы. Время от времени кто-нибудь обжигается."
jaJP = "壁に設置する、松脂を燃やす火鉢。壁の上でこの火鉢から2マス以内にいる弓兵は、松脂の水たまりに向けて火矢を放つ。ときどき、火傷する弓兵もいる。"
frFR = "Un brasero fixé à un mur, où brûle de la résine de pin. Les archers sur le mur, à deux segments ou moins du brasero, tirent des flèches enflammées sur les flaques de résine. De temps en temps, l’un d’eux se brûle."
deDE = "Ein Feuerkorb an der Mauer, in dem Kiefernharz brennt. Bogenschützen auf der Mauer schießen innerhalb von zwei Bauteilen davon Brandpfeile auf Harzpfützen. Hin und wieder verbrennt sich jemand."
plPL = "Kosz ogniowy na murze, w którym pali się żywica sosnowa. Łucznicy na murze, znajdujący się w odległości do dwóch elementów od niego, strzelają ognistymi strzałami w kałuże żywicy. Od czasu do czasu ktoś się poparzy."
ptBR = "Um braseiro na muralha, queimando resina de pinheiro. Arqueiros na muralha, a até duas peças de distância, disparam flechas incendiárias contra poças de resina. De vez em quando, alguém acaba queimado."
koKR = "벽에 설치하는 솔송진 화로입니다. 벽 위에서 이 화로와 두 칸 이내에 있는 궁수는 화염 화살을 쏴 송진 웅덩이에 불을 붙입니다. 가끔 화로에 불에 타기도 합니다."
csCZ = "Nástěnný koš na oheň, ve kterém hoří borovicová pryskyřice. Lučištníci na hradbě do vzdálenosti dvou dílů od něj střílejí ohnivé šípy na louže pryskyřice. Čas od času se někdo popálí."
viVN = "Một giỏ lửa trên tường, đốt nhựa thông. Các cung thủ trên tường trong phạm vi hai đoạn tường tính từ nó bắn tên lửa vào những vũng nhựa. Thỉnh thoảng, có người bị bỏng."
trTR = "Çam reçinesi yakan duvar üzerindeki bir ateş sepeti. Duvarın üzerinde, ateş sepetine iki parça mesafede bulunan okçular reçine birikintilerine ateşli oklar atar. Ara sıra biri yanar."

