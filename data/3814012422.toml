["TimberEmpires.Settings.BuiltExpansion.Tooltip"]
status = "normal"
raw = "Builders lay roads at no material cost, and build every District Center after the first, for materials and science."
enUS = "Builders lay roads at no material cost and build every District Center after the first using materials and science."
zhCN = "建造者铺设道路无需消耗材料，并会建造首个区中心之后的所有区中心，以获取材料和科学值。"
zhTW = "建築工人鋪設道路不需材料，並會建造第一個區域中心以外的所有區域中心，藉此取得材料和科學點數。"
ruRU = "Строители прокладывают дороги бесплатно и строят каждый Центр района после первого, используя материалы и очки науки."
jaJP = "建設作業員は資材を消費せずに道路を敷設し、最初のもの以降のすべての地区センターを、資材と科学ポイントを消費して建設します。"
frFR = "Les bâtisseurs construisent les routes sans coût en matériaux, ainsi que tous les centres de district après le premier, contre des matériaux et des points de science."
deDE = "Bauarbeiter legen Straßen ohne Materialkosten an und bauen jedes Bezirkszentrum nach dem ersten für Materialien und Wissenschaft."
plPL = "Budowniczowie układają drogi bez kosztów materiałów i budują każde Centrum dzielnicy po pierwszym, zużywając materiały i punkty nauki."
ptBR = "Construtores constroem estradas sem custo de materiais e constroem todos os Centros distritais após o primeiro usando materiais e ciência."
koKR = "건설자는 재료 비용 없이 도로를 깔고, 첫 번째 이후의 모든 구역 중심지를 재료와 과학 점수를 들여 건설합니다."
csCZ = "Stavitelé pokládají cesty bez nákladů na materiál a každý okresní úřad po prvním staví za materiál a vědu."
viVN = "Thợ xây dựng đường sá không tốn vật liệu, và xây dựng mọi Trung tâm Khu vực sau trung tâm đầu tiên để đổi lấy vật liệu và khoa học."
trTR = "İnşaatçılar yolları malzeme harcamadan döşer ve ilkinden sonraki her Bölge Merkezi’ni malzeme ve bilim karşılığında inşa eder."

