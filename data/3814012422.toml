["Building.TimberEmpires.WarBoat.Description"]
raw = "Carries troops across the sea. Build it at a Shipyard. Once crewed, send it to another island's coast to land them."
status = "normal"
enUS = "Carries troops across the sea. Build it at a Shipyard. Once crewed, send it to another island's coast to land them."
zhCN = "可搭载部队渡海。需在造船厂建造。配备船员后，将其派往另一座岛屿的海岸即可让部队登陆。"
zhTW = "載運部隊渡海。請在造船廠建造它。配備船員後，將它派往另一座島嶼的海岸，讓部隊登陸。"
ruRU = "Перевозит войска по морю. Постройте его на верфи. После постройки и укомплектования экипажем отправьте его к берегу другого острова, чтобы высадить войска."
jaJP = "海を越えて部隊を運びます。造船所で建造してください。乗組員が配置されたら、別の島の沿岸へ送り、部隊を上陸させてください。"
frFR = "Transportez des troupes à travers la mer. Construisez-le dans un chantier naval. Une fois équipé d’un équipage, envoyez-le sur la côte d’une autre île pour y débarquer les troupes."
deDE = "Transportiert Truppen über das Meer. Auf einer Werft bauen. Sobald es gebaut und bemannt ist, zur Küste einer anderen Insel schicken, um die Truppen dort an Land zu bringen."
plPL = "Przewozi wojska przez morze. Buduj go w Stoczni. Po obsadzeniu załogą wyślij go do wybrzeża innej wyspy, aby wysadzić żołnierzy."
ptBR = "Transporta tropas pelo mar. Construa-o em um Estaleiro. Depois de tripulado, envie-o até a costa de outra ilha para desembarcar as tropas."
koKR = "병력을 바다 건너로 실어 나릅니다. 조선소에 건설하세요. 승무원이 배치되면 다른 섬의 해안으로 보내 병력을 상륙시키세요."
trTR = "Birlikleri denizin ötesine taşır. Bir Tersane'de inşa edin. Mürettebatı tamamlandığında, birlikleri karaya çıkarmak için başka bir adanın kıyısına gönderin."
esES = "Transporta tropas a través del mar. Constrúyelo en un Astillero. Una vez construido y tripulado, envíalo a la costa de otra isla para desembarcarlas."
itIT = "Trasporta truppe attraverso il mare. Costruiscila in un Cantiere navale. Una volta equipaggiata, inviala alla costa di un'altra isola per sbarcarle."
ukUA = "Перевозить військових через море. Будуйте його на верфі. Після будівництва та укомплектування з екіпажем відправте його до берега іншого острова, щоб висадити війська."
thTH = "ใช้ขนส่งทหารข้ามทะเล สร้างที่อู่ต่อเรือ เมื่อมีลูกเรือประจำการแล้ว ให้ส่งเรือไปยังชายฝั่งของอีกเกาะหนึ่งเพื่อขนทหารขึ้นฝั่ง"
csCZ = "Převáží vojáky přes moře. Postavte ho v loděnici. Jakmile bude posádka na palubě, pošlete ho k pobřeží jiného ostrova, aby tam vojáky vylodil."
viVN = "Vận chuyển binh lính qua biển. Xây dựng thuyền tại Xưởng Đóng Tàu. Khi đã có đủ thủy thủ đoàn, hãy điều thuyền đến bờ biển của một hòn đảo khác để đổ quân lên bờ."
caES = "Transporta tropes per mar. Construeix-la en un Astiller. Un cop tripulada, envia-la a la costa d'una altra illa per desembarcar-les."
beBY = "Перавозіць войскі праз мора. Будуецца на верфі. Пасля ўкамплектавання экіпажам адпраўце яго да ўзбярэжжа іншага вострава, каб высадзіць войскі."
roRO = "Transportă trupe peste mare. Construiește-l la un Șantier naval. Odată echipat cu echipaj, trimite-l la coasta unei alte insule pentru a debarca trupele."
huHU = "Szállítja a csapatokat a tengeren át. Hajógyárban építsd meg. Miután elkészült és legénységet kapott, küldd egy másik sziget partjára, hogy partra szállíthassa őket."
arSA = "نقل القوات عبر البحر. ابنِه في حوض بناء السفن. بعد اكتمال بنائه وتزويده بالطاقم، أرسله إلى ساحل جزيرة أخرى لإنزال القوات هناك."

["Building.TimberEmpires.WarBoat.Folktails.FlavorDescription"]
status = "normal"
raw = "“It's two boats tied together, and it has never once tipped over.” – Shipwright Mirelle"
enUS = "“It's two boats tied together, and it has never once tipped over.” – Shipwright Mirelle"
zhCN = "“这是两条绑在一起的船，它从来没有翻过一次。”——造船师米雷尔"
zhTW = "“這是兩艘綁在一起的船，從來沒有翻過一次。」――造船匠米蕾爾"
ruRU = "«Это две лодки, привязанные друг к другу, и они ни разу не перевернулись». – корабельный мастер Мирель"
jaJP = "「2隻の船を縛り合わせただけだが、一度も転覆したことはない」――造船技師ミレル"
frFR = "«C'est deux bateaux attachés ensemble, et il ne s'est jamais renversé une seule fois.» – Charpentière de marine Mirelle"
deDE = "„Es sind zwei Boote, die zusammengebunden wurden, und es ist noch nie einmal gekentert.“ – Schiffbauerin Mirelle"
plPL = "„To dwa statki przywiązane do siebie i jeszcze ani razu się nie wywróciło.” – Stoczniowiec Mirelle"
ptBR = "“É como se fossem dois barcos amarrados juntos, e ele nunca virou uma vez sequer.” – Carpinteira naval Mirelle"
koKR = "“두 척의 배를 묶어 놓은 것이에요. 지금까지 한 번도 뒤집힌 적이 없답니다.” – 조선공 미렐"
trTR = "“Birbirine bağlanmış iki tekne bu, ve bir kez bile devrilmedi.” – Gemi yapımcısı Mirelle"
esES = "“Son dos barcos atados entre sí, y nunca han volcado ni una sola vez.” – Carpintera de ribera Mirelle"
itIT = "“È come avere due barche legate insieme, e non si è mai ribaltata nemmeno una volta.” – Costruttrice di navi Mirelle"
ukUA = "“Це два човни, зв’язані разом, і вони жодного разу не перекидалися.” – корабельний майстер Мірель"
thTH = "“มันคือเรือสองลำที่ผูกติดกัน และยังไม่เคยพลิกคว่ำสักครั้งเดียว” – ช่างต่อเรือเมียเรล"
csCZ = "„Je to dvě lodě svázané dohromady a ještě se nikdy nepřevrátila.“ – Loďař Mirelle"
viVN = "“Đó là hai chiếc thuyền buộc vào nhau, và chưa từng lật lần nào.” – Thợ đóng thuyền Mirelle"
caES = "“És un parell de vaixells lligats junts, i mai no s'ha bolcat ni una sola vegada.” – Mestra de construcció naval Mirelle"
beBY = "«Гэта два човны, прывязаныя адзін да аднаго, і ён ніколі не перакульгваўся.» – Карабельны майстар Мірэл"
roRO = "„Sunt două bărci legate între ele și nu s-a răsturnat niciodată.” – Constructoarea de bărci Mirelle"
huHU = "„Két csónak össze van kötve, és egyszer sem borult fel.” – Mirelle hajóács"
arSA = "ـــ \"إنها قاربان مربوطان معًا، ولم ينقلب أيٌّ منهما ولو مرة واحدة.\" – الحرفية ميريل"

["Building.TimberEmpires.WarBoat.IronTeeth.FlavorDescription"]
status = "normal"
raw = "The wind takes days off. The boiler doesn't."
enUS = "The wind takes days off. The boiler doesn't."
zhCN = "风也会休息。锅炉可不会。"
zhTW = "風神今天放假，鍋爐可沒有。"
ruRU = "Ветер берёт выходные. Котёл — нет."
jaJP = "風は休みを取るが、ボイラーは休まない。"
frFR = "Le vent prend des jours de congé. La chaudière, elle, non."
deDE = "Der Wind macht sich einen freien Tag. Der Kessel nicht."
plPL = "Wiatr bierze wolne dni. Kocioł nie."
ptBR = "O vento tira folga. A caldeira não."
koKR = "바람은 쉬는 날이 있지만, 보일러는 쉬지 않는다."
trTR = "Rüzgâr günü tatil eder. Kazan etmez."
esES = "El viento se toma días libres. La caldera, no."
itIT = "Il vento si prende dei giorni di riposo. La caldaia no."
ukUA = "Вітер бере вихідні. Котел — ні."
thTH = "ลมพัดเอาวันหยุดไปจากเรา แต่หม้อต้มไม่ยอมหยุดเลย"
csCZ = "Vítr bere dny volna. Kotel ne."
viVN = "Gió nghỉ ngày. Lò hơi thì không."
caES = "El vent et treu dies lliures. La caldera no."
beBY = "Вецер адпачывае ад працы. Катёл — не."
roRO = "Vântul ia zile libere. Cazanul nu."
huHU = "A szél szabadnapot vesz ki. A kazán nem."
arSA = "الرياح تأخذ أيام عطلة. أما الغلاية فلا."

