["TimberEmpires.ShipArmament.Hold.Tooltip"]
status = "normal"
raw = "What the ship carries out of what it can: its guns, cannonballs and other goods together."
enUS = "What the ship carries out of what it can: its guns, cannonballs and other goods together."
zhCN = "船只从其可承载的物资中携带的内容：火炮、炮弹及其他货物的总和。"
zhTW = "船隻從其可載運的貨物中實際攜帶的部分：包括火砲、砲彈及其他貨物。"
ruRU = "Что корабль везёт из того, что может: его пушки, ядра и прочие товары вместе."
jaJP = "船が積載できる量のうち、搭載している砲、砲弾、その他の物資の合計。"
frFR = "Ce que le navire transporte parmi ce qu'il peut contenir : ses canons, ses boulets de canon et autres marchandises ensemble."
deDE = "Was das Schiff von dem tragen kann, was es kann: seine Kanonen, Kanonenkugeln und andere Waren zusammen."
plPL = "Co statek przewozi z tego, co może: jego działa, kule armatnie i inne towary razem."
ptBR = "O que o navio transporta dentro da sua capacidade: seus canhões, balas de canhão e outros bens, juntos."
koKR = "대포, 포탄, 그 밖의 화물을 합쳐서, 배가 실을 수 있는 것 중 실제로 싣는 양."
trTR = "Geminin taşıyabildiklerinden taşıdığı miktar: topları, top gülleleri ve diğer mallar birlikte."
esES = "Lo que el barco transporta de lo que puede: sus cañones, balas de cañón y otros bienes juntos."
itIT = "Ciò che la nave trasporta di ciò che può: i suoi cannoni, le palle di cannone e le altre merci insieme."
ukUA = "Що корабель перевозить із того, що може: його гармати, ядра та інші товари разом."
thTH = "สิ่งที่เรือบรรทุกไปได้จากทั้งหมดที่มีความสามารถ ได้แก่ ปืนใหญ่ ลูกปืนใหญ่ และสินค้าอื่น ๆ รวมกัน"
csCZ = "Co loď nese z toho, co unese: její děla, dělové koule a další zboží dohromady."
viVN = "Những gì con tàu mang theo trong số những gì nó có thể chở: súng, đạn pháo và các hàng hóa khác cộng lại."
caES = "Què du el vaixell del que pot transportar: els seus canons, bales de canó i altres mercaderies juntament."
beBY = "Што карабель вязе са свайго магчымага: гарматы, ядры і іншыя тавары разам."
roRO = "Ce transportă nava din ceea ce poate: tunurile, ghiulelele și celelalte bunuri, împreună."
huHU = "A hajó abból szállítja, amit a rakterében elbír: ágyúit, ágyúgolyóit és egyéb áruit együtt."
arSA = "ما تحمله السفينة من حمولتها القصوى: أسلحتها وكرات المدافع والبضائع الأخرى مجتمعةً."

