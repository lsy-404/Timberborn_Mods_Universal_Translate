["Building.TimberEmpires.TroopsCounter.Description"]
status = "normal"
raw = "Counts your troops that are ready, in training, deployed, fighting or wounded. In district mode, it counts the troops of the district's barracks and ranges, wherever they are."
enUS = "Counts your troops that are ready, in training, deployed, fighting, or wounded. In district mode, it counts the troops in the district's barracks and ranges, wherever they are."
zhCN = "统计待命、训练中、已部署、正在战斗或受伤的部队数量。在区划模式下，统计该区划兵营和靶场的部队数量，无论他们身在何处。"
zhTW = "統計已準備就緒、正在訓練、已部署、正在戰鬥或受傷的部隊。在區域模式中，統計該區域兵營和靶場的部隊，不論他們身在何處。"
ruRU = "Подсчитывает число ваших отрядов, готовых к бою, проходящих обучение, развёрнутых, сражающихся или раненых. В режиме района учитывает отряды в казармах и на стрельбищах этого района, где бы они ни находились."
jaJP = "待機中、訓練中、配備中、戦闘中、または負傷中の兵士の数を数えます。地区モードでは、場所を問わず、その地区の兵舎と射撃場に所属する兵士の数を数えます。"
frFR = "Compte vos troupes prêtes, en formation, déployées, au combat ou blessées. En mode district, compte les troupes des casernes et des champs de tir du district, où qu'elles se trouvent."
deDE = "Zählt deine Truppen, die bereit, in Ausbildung, im Einsatz, im Kampf oder verwundet sind. Im Bezirksmodus zählt es die Truppen der Kasernen und Schießstände des Bezirks, unabhängig davon, wo sie sich befinden."
plPL = "Zlicza twoje oddziały gotowe do walki, szkolone, rozmieszczone, walczące lub ranne. W trybie dzielnicowym zlicza oddziały z koszar i strzelnic danej dzielnicy, niezależnie od tego, gdzie się znajdują."
ptBR = "Conta suas tropas que estão prontas, em treinamento, mobilizadas, em combate ou feridas. No modo de distrito, conta as tropas dos quartéis e estandes de tiro do distrito, onde quer que estejam."
koKR = "대기 중이거나 훈련 중이거나 배치되어 있거나 전투 중이거나 부상당한 병력의 수를 셉니다. 구역 모드에서는 해당 구역의 병영과 사격장의 병력을 어디에 있든 모두 셉니다."
csCZ = "Počítá vaše jednotky připravené k boji, ve výcviku, nasazené, bojující nebo zraněné. V režimu okrsku počítá jednotky z kasáren a střelnic v daném okrsku bez ohledu na to, kde se nacházejí."
viVN = "Đếm số quân đang sẵn sàng, được huấn luyện, đã triển khai, đang chiến đấu hoặc bị thương. Ở chế độ quận, bộ đếm tính quân của doanh trại và trường bắn trong quận, bất kể họ đang ở đâu."
trTR = "Hazır, eğitimde, konuşlandırılmış, savaşan veya yaralı askerlerinizi sayar. Bölge modunda, nerede olurlarsa olsunlar, bölgedeki kışla ve atış poligonlarında bulunan askerleri sayar."

