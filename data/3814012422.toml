["Tip.TimberEmpires.Supply"]
raw = "Troops eat and drink from their packs. Keep a supply cart near the front so they don't have to walk home."
status = "normal"
enUS = "Troops eat and drink from their packs. Keep a supply cart near the front so they don't have to walk home."
zhCN = "士兵从随身补给中取食物和水。把补给车停在前线附近，这样他们就不用走回家了。"
zhTW = "部隊會從背包中取用食物和飲水。請在前線附近放置補給車，免得他們得走回家。"
ruRU = "Войска едят и пьют из своих запасов. Держите телегу с припасами рядом с передовой, чтобы им не приходилось идти домой."
jaJP = "兵士は携行食料と水を消費します。家まで歩いて戻らなくて済むよう、前線の近くに補給カートを置きましょう。"
frFR = "Les troupes mangent et boivent dans leurs provisions. Gardez un chariot de ravitaillement près du front pour qu’elles n’aient pas à rentrer à pied."
deDE = "Truppen essen und trinken aus ihren Vorräten. Halte einen Versorgungskarren in der Nähe der Front, damit sie nicht bis nach Hause laufen müssen."
plPL = "Żołnierze jedzą i piją z zapasów, które niosą ze sobą. Trzymaj wóz zaopatrzeniowy blisko frontu, żeby nie musieli wracać do domu."
ptBR = "As tropas comem e bebem de suas mochilas. Mantenha um carro de suprimentos perto da linha de frente para que não precisem voltar para casa a pé."
koKR = "병력은 휴대품에서 음식과 물을 먹고 마십니다. 집까지 걸어갈 필요가 없도록 전선 가까이에 보급 수레를 두세요."
trTR = "Birlikler yiyecek ve içeceklerini çantalarından tüketir. Eve kadar yürümek zorunda kalmamaları için cepheye yakın bir ikmal arabası bulundurun."
esES = "Las tropas comen y beben de sus mochilas. Mantén un carro de suministros cerca del frente para que no tengan que volver caminando a casa."
itIT = "Le truppe mangiano e bevono dalle provviste nei loro zaini. Tieni un carro di rifornimenti vicino al fronte, così non dovranno tornare a casa a piedi."
ukUA = "Вояки їдять і п’ють із припасів у своїх наплічниках. Тримайте віз постачання поблизу передової, щоб їм не доводилося йти додому."
thTH = "ทหารกินและดื่มจากเสบียงที่พกติดตัว วางเกวียนเสบียงไว้ใกล้แนวหน้า เพื่อไม่ให้พวกเขาต้องเดินกลับบ้าน"
csCZ = "Vojáci jedí a pijí ze svých zásob. Držte zásobovací vůz poblíž fronty, aby nemuseli chodit domů."
viVN = "Quân lính ăn uống từ đồ tiếp tế mang theo. Hãy để xe tiếp tế gần tiền tuyến để họ không phải đi bộ về nhà."
