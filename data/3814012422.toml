["TimberEmpires.NeedsCoOpPvPEdition"]
raw = "Timber Empires needs BeaverBuddies Co-Op/PvP Edition, but the original BeaverBuddies is running. Disable it and subscribe to the Co-Op/PvP Edition, or multiplayer games will go out of sync."
status = "normal"
enUS = "Timber Empires requires BeaverBuddies Co-Op/PvP Edition, but the original BeaverBuddies is running. Disable it and subscribe to the Co-Op/PvP Edition, or multiplayer games will go out of sync."
zhCN = "《海狸浮生记：帝国》需要 BeaverBuddies Co-Op/PvP Edition，但当前运行的是原版 BeaverBuddies。请禁用原版并订阅 Co-Op/PvP Edition，否则多人游戏将出现不同步。"
zhTW = "《海狸帝國》需要《海狸好友》合作／PvP 版，但目前啟用的是原版《海狸好友》。請停用原版並訂閱合作／PvP 版，否則多人遊戲會不同步。"
ruRU = "Для Timber Empires требуется BeaverBuddies Co-Op/PvP Edition, но сейчас запущена исходная версия BeaverBuddies. Отключите её и подпишитесь на Co-Op/PvP Edition, иначе в многопользовательских играх возникнет рассинхронизация."
jaJP = "Timber EmpiresにはBeaverBuddies Co-Op/PvP Editionが必要ですが、元のBeaverBuddiesが有効になっています。これを無効にしてCo-Op/PvP Editionをサブスクライブしてください。そうしないと、マルチプレイのゲームで同期ずれが発生します。"
frFR = "Timber Empires nécessite BeaverBuddies Co-Op/PvP Edition, mais la version originale de BeaverBuddies est active. Désactivez-la et abonnez-vous à Co-Op/PvP Edition, sinon les parties multijoueur ne seront plus synchronisées."
deDE = "Timber Empires benötigt BeaverBuddies Co-Op/PvP Edition, aber die ursprüngliche Version von BeaverBuddies ist aktiv. Deaktiviere sie und abonniere Co-Op/PvP Edition, sonst geraten Mehrspielerpartien aus dem Gleichlauf."
plPL = "Timber Empires wymaga wersji Co-Op/PvP moda BeaverBuddies, ale oryginalny BeaverBuddies jest uruchomiony. Wyłącz go i zasubskrybuj wersję Co-Op/PvP, w przeciwnym razie rozgrywki wieloosobowe utracą synchronizację."
ptBR = "Timber Empires precisa da edição Co-Op/PvP do BeaverBuddies, mas a versão original do BeaverBuddies está ativa. Desative-a e assine a edição Co-Op/PvP, ou as partidas multijogador ficarão dessincronizadas."
koKR = "Timber Empires를 사용하려면 BeaverBuddies Co-Op/PvP Edition이 필요하지만, 원본 BeaverBuddies가 실행 중입니다. 원본을 비활성화하고 Co-Op/PvP Edition을 구독하세요. 그렇지 않으면 멀티플레이어 게임에서 동기화가 어긋납니다."
csCZ = "Timber Empires vyžaduje BeaverBuddies Co-Op/PvP Edition, ale původní BeaverBuddies je spuštěný. Vypněte ho a přihlaste se k odběru Co-Op/PvP Edition, jinak se hry pro více hráčů rozjedou."
viVN = "Timber Empires cần BeaverBuddies Co-Op/PvP Edition, nhưng BeaverBuddies bản gốc đang chạy. Hãy tắt mod đó và đăng ký BeaverBuddies Co-Op/PvP Edition, nếu không các trận chơi nhiều người sẽ mất đồng bộ."
trTR = "Timber Empires, BeaverBuddies Co-Op/PvP Edition modunu gerektiriyor, ancak orijinal BeaverBuddies çalışıyor. Orijinalini devre dışı bırakıp Co-Op/PvP Edition moduna abone olun; aksi takdirde çok oyunculu oyunların eşzamanı bozulur."

