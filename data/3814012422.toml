frFR = "Les échelles sont faites pour les castors. Les béliers ont besoin de quelque chose de plus doux."
deDE = "Leitern sind für Biber. Rammböcke brauchen etwas Sanfteres."
plPL = "Drabiny są dla bobrów. Tarany potrzebują czegoś łagodniejszego."
ptBR = "Escadas são para castores. Aríetes precisam de algo mais suave."
koKR = "사다리는 비버를 위한 거야. 공성추에는 좀 더 부드러운 게 필요하지."
csCZ = "Žebříky jsou pro bobry. Beranidla potřebují něco šetrnějšího."
viVN = "Thang dành cho hải ly. Máy phá thành cần thứ gì đó nhẹ nhàng hơn."
trTR = "Merdivenler kunduzlar içindir. Koçbaşlarına daha nazik bir şey gerekir."

