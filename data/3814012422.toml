["Building.TimberEmpires.WagonYard.Description"]
status = "normal"
raw = "Sends supply carts to the front so warriors can eat, drink and build siege engines off the roads."
enUS = "Sends supply carts to the front so warriors can eat, drink, and build siege engines off the roads."
zhCN = "向前线派遣补给车，让战士们能够吃喝，并在道路之外建造攻城器械。"
zhTW = "派遣補給車前往前線，讓戰士能吃喝，並在道路旁建造攻城器械。"
ruRU = "Отправляет обозы к фронту, чтобы воины могли есть, пить и строить осадные машины вдали от дорог."
jaJP = "補給カートを前線へ送り、戦士たちが食事や水分補給をし、道路脇で攻城兵器を建造できるようにする。"
frFR = "Envoie des chariots de ravitaillement au front pour que les guerriers puissent manger, boire et construire des engins de siège à l’écart des routes."
deDE = "Schickt Versorgungskarren an die Front, damit Krieger essen, trinken und abseits der Straßen Belagerungsmaschinen bauen können."
plPL = "Wysyła wozy zaopatrzeniowe na front, aby wojownicy mogli jeść, pić i budować machiny oblężnicze poza drogami."
ptBR = "Envia carroças de suprimentos para a linha de frente, para que os guerreiros possam comer, beber e construir máquinas de cerco fora das estradas."
koKR = "보급 수레를 전선으로 보내 전사들이 도로에서 벗어나 먹고 마시며 공성 무기를 만들 수 있게 합니다."
csCZ = "Posílá zásobovací vozy na frontu, aby se válečníci mohli najíst, napít a stavět obléhací stroje mimo cesty."
viVN = "Gửi xe tiếp tế ra tiền tuyến để các chiến binh có thể ăn uống và chế tạo máy công thành mà không cản trở đường sá."
