trTR = "Akıntıyla sürüklenen ve temas ettiklerinde patlayan yüzen mayınlar bırakır."
esES = "Libera minas flotantes que se desplazan con la corriente y explotan al entrar en contacto."
itIT = "Rilascia mine galleggianti che seguono la corrente ed esplodono al contatto."
ukUA = "Випускає плавучі міни, що дрейфують за течією та вибухають при контакті."
thTH = "ปล่อยทุ่นระเบิดลอยน้ำให้ลอยไปตามกระแสน้ำและระเบิดเมื่อสัมผัสสิ่งใดก็ตาม"
csCZ = "Vypouští plovoucí miny, které se nechávají unášet proudem a vybuchnou při kontaktu."
viVN = "Phóng ra các quả thủy lôi nổi trôi theo dòng nước và phát nổ khi va chạm."
caES = "Allibera mines flotants que es deixen portar pel corrent i exploten en entrar en contacte."
beBY = "Выпускае плывучыя міны, якія дрэйфуюць па плыні і выбухаюць пры кантакце."
roRO = "Eliberează mine plutitoare care sunt purtate de curent și explodează la contact."
huHU = "Úszó aknákat bocsát ki, amelyek az áramlattal sodródnak, és érintkezéskor felrobbannak."
arSA = "تطلق ألغامًا عائمة تنجرف مع التيار وتنفجر عند التلامس."

["Building.TimberEmpires.MineLauncher.FlavorDescription"]
raw = "Rivers have always carried gifts downstream. Not always nice ones."
status = "normal"
enUS = "Rivers have always carried gifts downstream. Not always nice ones."
zhCN = "河流总是会把馈赠带向下游。但这些馈赠不一定都那么美好。"
zhTW = "河流總是會把禮物一路帶往下游。但不一定都是好東西。"
ruRU = "Реки всегда несли свои дары вниз по течению. Не всегда приятные."
jaJP = "川はいつだって下流へ贈り物を運んできた。いつも素敵な贈り物とは限らないが。"
frFR = "Les rivières ont toujours charrié des cadeaux vers l’aval. Pas toujours agréables."
deDE = "Flüsse haben schon immer Geschenke flussabwärts getragen. Nicht immer nette."
plPL = "Rzeki zawsze niosły w dół rzeki różne dary. Nie zawsze miłe."
ptBR = "Os rios sempre carregaram presentes rio abaixo. Nem sempre agradáveis."
koKR = "강은 언제나 선물을 하류로 실어 날랐다. 늘 반가운 선물만은 아니었지만."
trTR = "Nehirler hediyeleri hep akıntıyla aşağı taşımıştır. Bunlar her zaman hoş hediyeler olmaz."
esES = "Los ríos siempre han llevado regalos aguas abajo. No siempre agradables."
itIT = "I fiumi hanno sempre portato doni a valle. Non sempre graditi."
ukUA = "Річки завжди несли вниз за течією свої дари. Не завжди приємні."
thTH = "แม่น้ำพัดพาของขวัญลงสู่ท้ายน้ำมาเสมอ แต่ของขวัญก็ไม่ได้ดีเสมอไป"
csCZ = "Řeky vždycky nesly po proudu různé dary. Ne vždycky příjemné."
viVN = "Sông ngòi xưa nay vẫn mang quà xuôi dòng. Mà quà thì không phải lúc nào cũng dễ chịu."
caES = "Els rius sempre han dut regals riu avall. No sempre són agradables."
beBY = "Рэкі заўсёды неслі дары ўніз па плыні. Не заўсёды прыемныя."
roRO = "Râurile au purtat dintotdeauna daruri în aval. Nu întotdeauna daruri plăcute."
huHU = "A folyók mindig is ajándékokat sodortak lefelé. Nem mindig kellemeseket."
arSA = "لطالما حملت الأنهار الهدايا إلى المصب. ولم تكن كلها هدايا لطيفة."

