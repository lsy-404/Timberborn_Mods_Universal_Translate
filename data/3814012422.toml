["TimberEmpires.GameMode.Horde.Description"]
raw = "The undead raccoons rise from the ruins every few nights, more each time, and in a great swarm when the badtide comes. Ally with your neighbours or fight them, hold out till dawn, and seal every ruin to end it."
status = "normal"
enUS = "The undead raccoons rise from the ruins every few nights, more each time, and in a great swarm when the badtide comes. Ally with your neighbors or fight them, hold out till dawn, and seal every ruin to end it."
zhCN = "不死浣熊每隔几晚就会从废墟中爬出，每次数量都更多；恶潮来临时，更会成群涌出。与邻居结盟或与它们战斗，坚持到黎明，并封住所有废墟，彻底终结这一切。"
zhTW = "不死浣熊每隔幾個夜晚就會從廢墟中爬起來，每次都比上次更多；壞潮來襲時，更會大舉成群湧現。與鄰居結盟或與牠們戰鬥，撐到黎明，並封住每一處廢墟，徹底終結這一切。"
ruRU = "Мертвецкие еноты поднимаются из руин раз в несколько ночей, и с каждым разом их становится больше, а с приходом токсичного прилива они являются огромным роем. Объединитесь с соседями или сразитесь с ними, продержитесь до рассвета и запечатайте все руины, чтобы покончить с этим."
jaJP = "アンデッドのアライグマは数夜ごとに廃墟から這い出し、そのたびに数が増え、悪潮が来ると大群で押し寄せる。近隣の仲間と同盟を結ぶか、彼らと戦い、夜明けまで持ちこたえ、すべての廃墟を封印して終わらせよう。"
frFR = "Les ratons laveurs morts-vivants surgissent des ruines toutes les quelques nuits, toujours plus nombreux, et en une immense horde lorsque la marée toxique arrive. Alliez-vous à vos voisins ou combattez-les, tenez bon jusqu’à l’aube et scellez toutes les ruines pour en finir."
deDE = "Die untoten Waschbären erheben sich alle paar Nächte aus den Ruinen, jedes Mal werden es mehr, und wenn die Schadflut kommt, fallen sie in riesigen Schwärmen ein. Verbündet euch mit euren Nachbarn oder bekämpft sie, harrt bis zum Morgengrauen aus und versiegelt jede Ruine, um dem ein Ende zu setzen."
plPL = "Nieumarłe szopy pracze powstają z ruin co kilka nocy, za każdym razem w większej liczbie, a gdy nadchodzi fala skażonej wody, ruszają wielkim rojem. Zawrzyjcie sojusz z sąsiadami albo walczcie z nimi, wytrwajcie do świtu i zapieczętujcie każdą ruinę, by położyć temu kres."
ptBR = "Os guaxinins mortos-vivos se erguem das ruínas a cada poucas noites, em maior número a cada vez e em um grande enxame quando chega a maré tóxica. Aliem-se aos vizinhos ou lutem contra eles, resistam até o amanhecer e lacrem todas as ruínas para acabar com isso."
koKR = "언데드 너구리들이 며칠 밤마다 폐허에서 일어나며, 매번 그 수가 늘어납니다. 독성 역류가 닥치면 거대한 무리를 이루어 몰려옵니다. 이웃과 동맹을 맺거나 맞서 싸우고, 새벽까지 버틴 뒤 모든 폐허를 봉인해 사태를 끝내세요."
csCZ = "Nemrtví mývalové vstávají z ruin každých pár nocí a pokaždé jich je víc. Když přijde zlá vlna, vyrojí se v obrovském hejnu. Spojte se se sousedy, nebo s nimi bojujte, vydržte až do úsvitu a zapečeťte všechny ruiny, abyste tomu učinili přítrž."
viVN = "Cứ vài đêm, lũ gấu mèo xác sống lại trỗi dậy từ đống đổ nát, mỗi lần một đông hơn, và sẽ kéo đến thành đàn lớn khi triều nước độc ập đến. Hãy liên minh với các khu lân cận hoặc chiến đấu với chúng, cầm cự đến bình minh và phong kín mọi tàn tích để chấm dứt chuyện này."
trTR = "Ölü rakunlar birkaç gecede bir harabelerden yükseliyor, her seferinde sayıları artıyor; zehirli gelgit geldiğinde ise büyük bir sürü hâlinde geliyorlar. Komşularınızla ittifak kurun ya da onlarla savaşın, şafağa kadar dayanın ve bunu sona erdirmek için tüm harabeleri mühürleyin."

["TimberEmpires.GameMode.PvE.Description.Alone"]
status = "normal"
raw = "Your colony against the bandits. Clear every camp to win."
enUS = "Your colony against the bandits. Clear every camp to win."
zhCN = "你的殖民地对抗土匪。清除所有营地即可获胜。"
zhTW = "你的殖民地對抗土匪。清除所有營地即可獲勝。"
ruRU = "Ваша колония против бандитов. Зачистите все лагеря, чтобы победить."
jaJP = "盗賊に立ち向かうあなたのコロニー。勝利するには、すべての野営地を制圧してください。"
frFR = "Votre colonie contre les bandits. Détruisez tous les camps pour gagner."
deDE = "Deine Kolonie gegen die Banditen. Räume alle Lager, um zu gewinnen."
plPL = "Twoja kolonia przeciwko bandytom. Zniszcz wszystkie obozy, aby wygrać."
ptBR = "Sua colônia contra os bandidos. Elimine todos os acampamentos para vencer."
koKR = "도적단에 맞서는 당신의 거점입니다. 승리하려면 모든 야영지를 정리하세요."
csCZ = "Vaše kolonie proti banditům. Vyčistěte všechny tábory a vyhrajte."
viVN = "Thuộc địa của bạn chống lại bọn cướp. Hãy dọn sạch mọi trại để giành chiến thắng."
trTR = "Koloniniz haydutlara karşı. Kazanmak için tüm kampları temizleyin."

["TimberEmpires.GameMode.PvP.Description.Alone"]
status = "normal"
raw = "Your empire against the bandits and any AI opponents you add. Ally with them or besiege them."
enUS = "Your empire against the bandits and any AI opponents you add. Ally with them or besiege them."
zhCN = "你的帝国将对抗强盗和你添加的任何 AI 对手。与他们结盟或围攻他们。"
zhTW = "你的帝國將對抗強盜，以及你加入的任何 AI 對手。與他們結盟或圍攻他們。"
ruRU = "Ваша империя против бандитов и любых добавленных вами противников под управлением ИИ. Заключайте с ними союзы или осаждайте их."
jaJP = "盗賊や、追加したAIの対戦相手に立ち向かうあなたの帝国。彼らと同盟を結ぶか、包囲するかはあなた次第です。"
frFR = "Votre empire face aux bandits et à tous les adversaires contrôlés par l’IA que vous ajoutez. Alliez-vous à eux ou assiégez-les."
deDE = "Dein Imperium gegen die Banditen und alle KI-Gegner, die du hinzufügst. Verbünde dich mit ihnen oder belagere sie."
plPL = "Twoje imperium przeciwko bandytom i wszystkim dodanym przez ciebie przeciwnikom AI. Zawieraj z nimi sojusze lub oblegaj ich."
ptBR = "Seu império contra os bandidos e quaisquer adversários de IA que você adicionar. Alie-se a eles ou sitie-os."
koKR = "도적과 추가한 모든 AI 상대에 맞서는 제국을 세우세요. 이들과 동맹을 맺거나 포위 공격을 가하세요."
csCZ = "Vaše říše proti banditům a všem protivníkům s umělou inteligencí, které přidáte. Spojte se s nimi, nebo je oblehněte."
viVN = "Đế chế của bạn đối đầu với bọn cướp và bất kỳ đối thủ AI nào bạn thêm vào. Hãy liên minh với họ hoặc bao vây họ."
trTR = "İmparatorluğunuz haydutlara ve eklediğiniz tüm yapay zekâ rakiplerine karşı. Onlarla ittifak kurun ya da onları kuşatın."

["TimberEmpires.GameMode.Horde.Description.Alone"]
status = "normal"
raw = "The undead raccoons rise from the ruins every few nights, more each time, and in a great swarm when the badtide comes. Hold out till dawn, with AI opponents beside you if you add them, and seal every ruin to end it."
enUS = "The undead raccoons rise from the ruins every few nights, more each time, and in a great swarm when the badtide comes. Hold out till dawn, with AI opponents beside you if you add them, and seal every ruin to end it."
zhCN = "每隔几晚，不死浣熊就会从废墟中爬出，而且每次数量都会更多；恶潮来袭时，它们还会成群涌来。坚持到黎明吧；如果加入 AI 对手，他们也会与你并肩作战。封住所有废墟，就能终结这一切。"
zhTW = "不死浣熊每隔幾個夜晚便會從廢墟中爬出來，每次數量都更多；壞潮來襲時，更會成群湧現。撐到黎明吧；若你加入 AI 對手，他們也會與你並肩作戰。封住所有廢墟，就能結束這一切。"
ruRU = "Неживые еноты восстают из руин каждые несколько ночей, и с каждым разом их становится всё больше, а с приходом скверного прилива они являются огромным роем. Продержитесь до рассвета, а если добавите противников под управлением ИИ — сражайтесь рядом с ними, и запечатайте все руины, чтобы положить этому конец."
jaJP = "アンデッドのアライグマは数夜ごとに廃墟から現れ、そのたびに数が増えていきます。そしてバッドタイドが来ると、大群となって押し寄せます。AIの対戦相手を追加すれば彼らも味方に加わります。夜明けまで持ちこたえ、すべての廃墟を封鎖して終わらせましょう。"
frFR = "Les ratons laveurs morts-vivants sortent des ruines toutes les quelques nuits, toujours plus nombreux, et en une immense horde lorsque la marée toxique arrive. Tenez jusqu’à l’aube, avec des adversaires contrôlés par l’IA à vos côtés si vous les ajoutez, et scellez toutes les ruines pour mettre fin à cette menace."
deDE = "Die untoten Waschbären erheben sich alle paar Nächte aus den Ruinen, jedes Mal werden es mehr, und wenn die Schadflut kommt, bilden sie einen riesigen Schwarm. Halte bis zum Morgengrauen durch, mit KI-Gegnern an deiner Seite, wenn du welche hinzufügst, und versiegle jede Ruine, um dem Ganzen ein Ende zu setzen."
plPL = "Nieumarłe szopy wychodzą z ruin co kilka nocy, za każdym razem w większej liczbie, a gdy nadciąga fala skażonej wody — całymi hordami. Przetrwaj do świtu, z przeciwnikami SI u boku, jeśli ich dodasz, i zapieczętuj wszystkie ruiny, aby położyć temu kres."
ptBR = "Os guaxinins mortos-vivos surgem das ruínas a cada poucas noites, em número cada vez maior, e em um enxame gigantesco quando chega a maré tóxica. Resista até o amanhecer, com oponentes de IA ao seu lado se você os adicionar, e sele todas as ruínas para acabar com isso."
koKR = "언데드 너구리들이 몇 밤마다 폐허에서 일어나며, 그 수는 매번 늘어나고 나쁜 물결이 닥치면 거대한 무리를 이룹니다. AI 상대를 추가했다면 그들과 함께 버티며 새벽까지 살아남고, 모든 폐허를 봉인해 사태를 끝내세요."
csCZ = "Nemrtví mývalové se každých pár nocí zvedají z ruin a pokaždé jich přibývá. Když přijde příliv zkažené vody, vyrazí v obrovském hejnu. Vydržte až do svítání, případně s AI protivníky po boku, pokud je přidáte, a uzavřete všechny ruiny, abyste tomu učinili přítrž."
viVN = "Lũ gấu mèo xác sống trỗi dậy từ đống đổ nát sau mỗi vài đêm, mỗi lần lại đông hơn, và kéo đến thành một bầy khổng lồ khi triều độc ập đến. Cầm cự đến bình minh, có các đối thủ AI sát cánh nếu bạn thêm họ vào, rồi phong ấn mọi tàn tích để chấm dứt mọi chuyện."
trTR = "Yaşayan ölü rakunlar birkaç gecede bir harabelerden yükselir; her seferinde sayıları artar ve kötü gelgit geldiğinde büyük bir sürü hâlinde ortaya çıkarlar. Şafak sökene kadar dayanın; eklerseniz yanınızda yapay zekâ rakipleri de olur. Bunu sona erdirmek için tüm harabeleri kapatın."

