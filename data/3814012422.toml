["Building.TimberEmpires.Barracks.FlavorDescription"]
raw = "Beavers were made for chewing, not fighting. These ones chew angrily."
status = "normal"
enUS = "Beavers were made for chewing, not fighting. These ones chew angrily."
zhCN = "海狸天生就是用来啃东西的，不是用来打架的。这些海狸啃得气势汹汹。"
zhTW = "海狸天生擅長啃咬，不擅長打架。這些海狸啃得氣呼呼的。"
ruRU = "Бобры созданы грызть, а не драться. Эти грызут со злостью."
jaJP = "ビーバーは戦うためではなく、かじるために生まれてきた。こいつらは怒りながらかじる。"
frFR = "Les castors sont faits pour ronger, pas pour se battre. Ceux-ci rongent avec colère."
deDE = "Biber sind zum Nagen gemacht, nicht zum Kämpfen. Diese hier nagen wütend."
plPL = "Bobry stworzono do gryzienia, nie do walki. Te gryzą ze złością."
ptBR = "Os castores foram feitos para roer, não para lutar. Estes roem com raiva."
koKR = "비버는 싸우는 게 아니라 갉아먹도록 만들어졌다. 이 비버들은 화가 난 채로 갉아먹는다."
csCZ = "Bobři byli stvořeni k okusování, ne k boji. Tihle okusují vztekle."
viVN = "Hải ly sinh ra để gặm nhấm, không phải để chiến đấu. Nhưng những con này gặm nhấm trong cơn giận dữ."
trTR = "Kunduzlar savaşmak için değil, kemirmek için yaratılmıştır. Bunlar öfkeyle kemiriyor."

