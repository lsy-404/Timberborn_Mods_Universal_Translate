["Building.TimberEmpires.RoundTower.Description"]
raw = "Taller than a wall tower, with an open top for a catapult, ballista or trebuchet. With a crew aboard, the machine on it shoots the nearest enemy in reach on its own."
status = "normal"
enUS = "Taller than a wall tower, with an open top for a catapult, ballista, or trebuchet. With a crew aboard, the machine on top automatically shoots the nearest enemy in range."
zhCN = "比墙塔更高，顶部敞开，可架设投石机、弩炮或配重投石机。配备人员后，上面的器械会自动射击射程内最近的敌人。"
zhTW = "比城牆塔更高，頂部為投石機、弩砲或配重式投石機留有開口。只要有船員駐守，上面的機械就會自動射擊射程內最近的敵人。"
ruRU = "Выше башни на стене, с открытым верхом для катапульты, баллисты или требушета. Если на ней есть экипаж, установленная машина самостоятельно стреляет по ближайшему противнику в пределах досягаемости."
jaJP = "壁塔より高く、カタパルト、バリスタ、またはトレビュシェットを設置できる開放型の頂部を備える。乗組員が乗り込むと、設置された兵器が射程内で最も近い敵を自動で攻撃する。"
frFR = "Plus haute qu’une tour murale, avec un sommet ouvert pour accueillir une catapulte, une baliste ou un trébuchet. Avec un équipage à bord, la machine installée dessus tire automatiquement sur l’ennemi le plus proche à portée."
deDE = "Höher als ein Mauerturm, mit einer offenen Oberseite für ein Katapult, eine Balliste oder ein Trebuchet. Mit einer Besatzung an Bord schießt die darauf befindliche Maschine selbstständig auf den nächsten erreichbaren Gegner."
plPL = "Wyższa niż wieża na murze, z otwartym szczytem, na którym można ustawić katapultę, balistę lub trebusz. Jeśli na pokładzie jest załoga, umieszczona na niej machina samodzielnie ostrzeliwuje najbliższego wroga w swoim zasięgu."
ptBR = "Mais alta que uma torre de muralha, com o topo aberto para uma catapulta, balista ou trebuchet. Com uma tripulação a bordo, a máquina instalada nela atira por conta própria no inimigo mais próximo ao seu alcance."
koKR = "성벽 탑보다 높으며, 투석기, 발리스타 또는 트레뷰셋을 올릴 수 있도록 꼭대기가 열려 있습니다. 승무원이 탑승하면, 탑에 설치된 무기가 사정거리 안에서 가장 가까운 적을 자동으로 공격합니다."
csCZ = "Vyšší než věž na hradbách, s otevřeným vrškem pro katapult, balistu nebo trebuchet. Když je na ní posádka, stroj na věži sám střílí na nejbližšího nepřítele v dosahu."
viVN = "Cao hơn tháp tường, có phần đỉnh mở để đặt máy bắn đá, nỏ lớn hoặc máy bắn đá đối trọng. Khi có kíp vận hành, cỗ máy trên tháp sẽ tự bắn kẻ địch gần nhất trong tầm bắn."
trTR = "Bir sur kulesinden daha yüksek, mancınık, arbalet veya trabuşet için açık bir üst bölüme sahip. Mürettebatı olduğunda, üzerindeki makine menzilindeki en yakın düşmana kendi kendine ateş eder."

