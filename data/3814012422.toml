["Building.TimberEmpires.TripWire.Description"]
raw = "Build two and join them with a wire. Sends a pulse when someone crosses it: enemies, allies, only yours, or anybody. Both ends send it."
status = "normal"
enUS = "Build two and connect them with a wire. Sends a pulse when someone crosses it: enemies, allies, your own, or anyone. Both ends send it."
zhCN = "建造两个并用导线连接。有人穿过时会发送脉冲：敌人、盟友、仅你方人员，或任何人。两端都会发送脉冲。"
zhTW = "建造兩個並用導線連接。有人經過時會發送脈衝：敵人、盟友、只有你方的人，或任何人都會觸發。兩端都會發送脈衝。"
ruRU = "Постройте два и соедините их проводом. Посылает импульс, когда кто-нибудь пересекает его: враги, союзники, только ваши или кто угодно. Импульс посылают оба конца."
jaJP = "2つ建設して、ワイヤーで接続します。敵、味方、自分の勢力の者だけ、または誰であっても、誰かが通過するとパルスを送ります。両端ともパルスを送ります。"
frFR = "Construisez-en deux et reliez-les avec un fil. Envoie une impulsion lorsqu'une personne le franchit : ennemis, alliés, uniquement les vôtres ou n'importe qui. Les deux extrémités envoient une impulsion."
deDE = "Baue zwei davon und verbinde sie mit einem Draht. Sendet einen Impuls, wenn jemand darüberläuft: Feinde, Verbündete, nur deine Leute oder alle. Beide Enden senden ihn."
plPL = "Zbuduj dwa i połącz je przewodem. Wysyła impuls, gdy ktoś przez niego przejdzie: wróg, sojusznik, tylko twoi albo ktokolwiek. Oba końce go wysyłają."
ptBR = "Construa dois e conecte-os com um fio. Envia um pulso quando alguém o atravessa: inimigos, aliados, apenas os seus ou qualquer pessoa. As duas extremidades enviam o pulso."
koKR = "두 개를 건설하고 전선으로 연결하세요. 적, 아군, 자기 편만 또는 누구든 누군가가 지나가면 신호를 보냅니다. 양쪽 끝 모두 신호를 보냅니다."
csCZ = "Postavte dvě a spojte je drátem. Odešle impuls, když ji někdo překročí: nepřátelé, spojenci, jen vaši, nebo kdokoli. Impuls odesílají oba konce."
viVN = "Xây hai cái và nối chúng bằng một sợi dây. Phát tín hiệu khi có ai đó đi qua: kẻ địch, đồng minh, chỉ phe bạn hoặc bất kỳ ai. Cả hai đầu đều phát tín hiệu."
trTR = "İki tane inşa edip bir kabloyla birbirine bağlayın. Biri üzerinden geçtiğinde darbe gönderir: düşmanlar, müttefikler, yalnızca sizinkiler veya herkes. Her iki uç da darbe gönderir."

