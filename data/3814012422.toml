koKR = "게임이 직접 플레이하는 상대이며, 각각 선택한 난이도로 진행합니다. 상대도 플레이어와 동일한 전장의 안개를 적용받으며, 수집한 자원으로 건물을 짓습니다."
csCZ = "Hráči ovládaní hrou, každý na zvolené obtížnosti. Mají stejnou mlhu války jako vy a staví z toho, co nasbírají."
viVN = "Các đối thủ do trò chơi điều khiển, mỗi đối thủ ở mức độ khó đã chọn cho mình. Họ có cùng vùng sương mù chiến tranh như bạn và xây dựng bằng những gì họ thu thập được."
trTR = "Oyuncular oyun tarafından yönetilir ve her biri kendisi için seçilen zorluk seviyesinde oynar. Seninle aynı savaş sisine sahiptirler ve topladıkları kaynaklarla inşaat yaparlar."

