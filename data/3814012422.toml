["TimberEmpires.Settings.BanditCamps.Tooltip"]
status = "normal"
raw = "On a map without bandit camps, camps are placed away from player starts and out of the water, clearing trees from their spots. The further from a start, the stronger the camp and the richer its loot."
enUS = "On a map without bandit camps, camps are placed away from player starts and out of the water, clearing trees from their spots. The farther a camp is from a start, the stronger it is and the richer its loot."
zhCN = "在没有土匪营地的地图上，营地会放置在远离玩家起始位置且不在水中的地方，并清除营地位置上的树木。营地离起始位置越远，就越强大，战利品也越丰富。"
zhTW = "在沒有土匪營地的地圖上，營地會設置在遠離玩家起始位置且不在水中的地方，並清除營地位置上的樹木。營地離起始位置越遠，就越強大，戰利品也越豐厚。"
ruRU = "На карте без лагерей бандитов лагеря размещаются вдали от стартовых позиций игроков и вне воды, а деревья на этих местах убираются. Чем дальше лагерь от стартовой позиции, тем он сильнее и тем богаче добыча."
jaJP = "山賊のキャンプがないマップでは、キャンプはプレイヤーの開始地点から離れた水の外に配置され、設置場所の木は取り除かれます。開始地点から遠いほど、キャンプは強力になり、戦利品も豊富になります。"
frFR = "Sur une carte sans campements de bandits, ceux-ci sont placés loin des points de départ des joueurs et hors de l’eau, après avoir défriché les arbres à leur emplacement. Plus un camp est éloigné d’un point de départ, plus il est puissant et plus son butin est riche."
deDE = "Auf einer Karte ohne Banditenlager werden die Lager abseits der Startpunkte der Spieler und außerhalb des Wassers platziert. Dabei werden die Bäume an ihren Standorten entfernt. Je weiter ein Lager von einem Startpunkt entfernt ist, desto stärker ist es und desto reicher fällt seine Beute aus."
plPL = "Na mapie bez obozów bandytów obozy są rozmieszczane z dala od początkowych pozycji graczy i poza wodą, a drzewa w tych miejscach są usuwane. Im dalej od pozycji początkowej, tym silniejszy obóz i tym bogatszy łup."
ptBR = "Em um mapa sem acampamentos de bandidos, eles são posicionados longe dos pontos de início dos jogadores e fora da água, removendo as árvores de seus locais. Quanto mais longe de um ponto de início, mais forte é o acampamento e mais valioso é o saque."
koKR = "도적 야영지가 없는 맵에서는 야영지를 플레이어 시작 지점에서 떨어진 물 밖에 배치하고, 자리에 있는 나무를 제거합니다. 시작 지점에서 멀수록 야영지는 더 강해지고 전리품도 더 풍성해집니다."
csCZ = "Na mapě bez táborů banditů se tábory umisťují dál od výchozích pozic hráčů a mimo vodu, přičemž se z jejich míst odstraní stromy. Čím dál jsou od výchozí pozice, tím silnější je tábor a tím bohatší je jeho kořist."
viVN = "Trên bản đồ không có trại cướp, các trại được đặt cách xa vị trí khởi đầu của người chơi và ở ngoài mặt nước, dọn cây khỏi vị trí đặt trại. Trại càng xa vị trí khởi đầu thì càng mạnh và chiến lợi phẩm càng phong phú."
trTR = "Haydut kampları olmayan bir haritada kamplar, oyuncuların başlangıç noktalarından uzağa ve suyun dışına yerleştirilir; konumlarındaki ağaçlar temizlenir. Bir başlangıç noktasından ne kadar uzaktalarsa kamp o kadar güçlü, ganimetleri o kadar zengin olur."

