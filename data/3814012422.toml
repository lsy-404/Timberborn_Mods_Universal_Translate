zhTW = "調暗幾乎不花成本。靜態霧氣只會在鏡頭移動或視野內容改變時重新繪製。動態霧氣則會在每一影格重新繪製。"
ruRU = "Затемнение почти ничего не стоит. Статичный туман перерисовывает дымку только при движении камеры или изменении видимого изображения. Движущийся туман перерисовывает её каждый кадр."
jaJP = "暗転のコストはほとんどかかりません。静的な霧は、カメラが動いたとき、または見える範囲が変わったときにのみ霧を描画し直します。動的な霧は毎フレーム描画し直します。"
frFR = "Assombrir ne coûte presque rien. Le brouillard statique ne redessine la brume que lorsque la caméra bouge ou que ce que vous voyez change. Le brouillard animé la redessine à chaque image."
deDE = "Das Abdunkeln kostet so gut wie nichts. Statischer Nebel zeichnet den Dunst nur dann erneut, wenn sich die Kamera bewegt oder sich das Sichtbare ändert. Beweglicher Nebel zeichnet ihn in jedem Frame neu."
plPL = "Przyciemnianie prawie nic nie kosztuje. Mgła statyczna rysuje ją ponownie tylko wtedy, gdy kamera się poruszy lub zmieni się to, co widzisz. Mgła ruchoma rysuje ją w każdej klatce."
ptBR = "Escurecer custa quase nada. A névoa estática só redesenha a neblina quando a câmera se move ou quando o que você vê muda. A névoa em movimento a redesenha a cada quadro."
koKR = "어둡게 하는 데 드는 비용은 거의 없습니다. 정적 안개는 카메라가 움직이거나 보이는 내용이 바뀔 때만 안개를 다시 그립니다. 움직이는 안개는 매 프레임마다 안개를 그립니다."
csCZ = "Ztmavení nestojí skoro nic. Statická mlha se znovu vykreslí, jen když se pohne kamera nebo se změní to, co vidíte. Pohyblivá mlha se vykresluje každý snímek."
viVN = "Làm tối hầu như không tốn chi phí. Sương mù tĩnh chỉ vẽ lại màn sương khi camera di chuyển hoặc những gì bạn nhìn thấy thay đổi. Sương mù chuyển động được vẽ lại ở mỗi khung hình."
trTR = "Karartmanın maliyeti neredeyse sıfırdır. Statik sis, sisi yalnızca kamera hareket ettiğinde veya gördükleriniz değiştiğinde yeniden çizer. Hareketli sis ise her karede yeniden çizilir."

