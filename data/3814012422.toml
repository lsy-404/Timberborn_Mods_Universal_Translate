["TimberEmpires.Settings.Raids.Tooltip"]
status = "normal"
raw = "The cycle bandit camps start raiding players in, more often as the game goes on. All the way to the left, they never raid."
enUS = "Bandit camps start raiding players at increasingly frequent intervals as the game goes on. At the far left, they never raid."
zhCN = "随着游戏进程推进，周期性强盗营地会更频繁地袭击玩家。滑块调到最左侧时，他们永远不会袭击。"
zhTW = "隨著遊戲進行，循環劫掠者營地開始襲擊玩家，頻率也會越來越高。調到最左側時，他們永遠不會發動襲擊。"
ruRU = "Лагеря налётчиков начинают совершать набеги на игроков с заданной периодичностью, которая со временем увеличивается. В крайнем левом положении они никогда не совершают набегов."
jaJP = "サイクルバンディットのキャンプは、ゲームが進むにつれてプレイヤーへの襲撃を開始し、襲撃の頻度も高くなります。最も左に設定すると、襲撃は発生しません。"
frFR = "Les camps de bandits des cycles commencent à attaquer les joueurs de plus en plus souvent au fil de la partie. Tout à gauche, ils n’attaquent jamais."
deDE = "Die Lager der Zyklusbanditen beginnen mit Raubzügen gegen Spieler, und im Laufe des Spiels werden diese häufiger. Ganz links führen sie niemals Raubzüge durch."
plPL = "Obozy bandytów z danego cyklu zaczynają najeżdżać graczy po jego rozpoczęciu, a w miarę postępów w grze robią to coraz częściej. Gdy suwak jest ustawiony maksymalnie w lewo, nigdy nie najeżdżają."
ptBR = "Os acampamentos de saqueadores atacam os jogadores com a frequência definida pela faixa do ciclo, e os ataques ficam mais frequentes conforme o jogo avança. No extremo esquerdo, eles nunca atacam."
koKR = "사이클 밴디트 야영지는 게임이 진행될수록 더 자주 플레이어를 습격하기 시작합니다. 맨 왼쪽으로 설정하면 습격하지 않습니다."
csCZ = "Tábory banditů z cyklu začnou hráče přepadávat v nastaveném intervalu, který se s postupem hry zkracuje. Úplně vlevo nikdy nepřepadávají."
viVN = "Các trại cướp bắt đầu tập kích người chơi theo chu kỳ, và càng về sau trong trò chơi thì càng thường xuyên. Đặt về hết cỡ bên trái thì chúng sẽ không bao giờ tập kích."
trTR = "Döngü haydut kampları, oyun ilerledikçe daha sık olmak üzere, oyunculara baskın yapmaya başlar. En soldaki ayarda hiç baskın yapmazlar."

