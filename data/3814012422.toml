["Building.TimberEmpires.GatehouseDrawbridge.Description"]
raw = "A gatehouse on a foundation, with a bridge two tiles out from its passage. The bridge raises when the gate shuts. Needs open space under the bridge."
status = "normal"
enUS = "A gatehouse on a foundation, with a bridge extending two tiles from its passage. The bridge raises when the gate closes. Requires open space beneath the bridge."
zhCN = "建在地基上的门楼，通道外两格处设有一座桥。门关闭时，桥会升起。桥下方需要留出空地。"
zhTW = "建在地基上的門樓，通道外延伸兩格的橋會在門關閉時升起。橋下需要留出空間。"
ruRU = "Сторожка на фундаменте с мостом, выступающим на две клетки от прохода. Мост поднимается, когда ворота закрываются. Под мостом должно быть свободное пространство."
jaJP = "基礎の上に建つ門番所で、通路から2タイル先に橋がある。門が閉まると橋が上がる。橋の下には空きスペースが必要。"
frFR = "Un poste de garde sur une fondation, avec un pont qui s’étend sur deux cases à partir de son passage. Le pont se relève lorsque la porte se ferme. Nécessite un espace libre sous le pont."
deDE = "Ein Torhaus auf einem Fundament mit einer Brücke, die zwei Felder vor seinem Durchgang liegt. Die Brücke hebt sich, wenn sich das Tor schließt. Unter der Brücke muss Platz frei sein."
plPL = "Bramownica na fundamencie, z mostem wysuniętym o dwa pola od jej przejścia. Most podnosi się, gdy brama się zamyka. Pod mostem musi być wolne miejsce."
ptBR = "Uma guarita sobre uma fundação, com uma ponte que se estende por dois espaços a partir de sua passagem. A ponte se ergue quando o portão se fecha. Precisa de espaço livre sob a ponte."
koKR = "기초 위에 세우는 문루로, 통로에서 2타일 떨어진 곳에 다리가 있습니다. 문이 닫히면 다리가 올라갑니다. 다리 아래에 빈 공간이 필요합니다."
csCZ = "Vrátnice na základu s mostem, který se táhne dva dílce od jejího průchodu. Most se zvedne, když se vrata zavřou. Pod mostem musí být volný prostor."
viVN = "Một cổng gác đặt trên nền móng, với cầu kéo vươn ra hai ô từ lối đi qua cổng. Cầu nâng lên khi cổng đóng. Cần có khoảng trống bên dưới cầu."
trTR = "Temel üzerine kurulan, geçidinden iki kare dışarı uzanan bir köprüye sahip kapı binası. Kapı kapandığında köprü yükselir. Köprünün altında boş alan olmalıdır."

