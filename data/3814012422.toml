esES = "Fabrica arcabuces y cargas explosivas, y mosquetes en los mapas del Archipiélago."
itIT = "Produce archibugi e cariche esplosive, e moschetti sulle mappe Arcipelago."
ukUA = "Виготовляє аркебузи та вибухові заряди, а на картах Архіпелагу — мушкети."
thTH = "ผลิตปืนคาบชุดและวัตถุระเบิดสำหรับการทำลาย และปืนคาบศิลาในแผนที่ Archipelago"
csCZ = "Vyrábí arkebuzy a trhavé náplně a na mapách Archipelago také muškety."
viVN = "Chế tạo súng hỏa mai và thuốc nổ phá đá, cũng như súng hỏa mai nòng dài trên bản đồ Archipelago."
caES = "Fabrica arcabusos i càrregues explosives, i mosquets als mapes de l'Arxipèlag."
beBY = "Вырабляе аркебузы і зараднікі для падрыўных зарадаў, а на картах Архіпелага — мушкеты."
roRO = "Produce arquebuze și încărcături explozive și, pe hărțile Arhipelag, mușchete."
