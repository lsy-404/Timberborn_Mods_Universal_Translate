beBY = "Умацаваная брама з лесвіцамі, што вядуць на баявы ход сцяны. Зачыняецца, калі паблізу з'яўляюцца ворагі або бандыты."
roRO = "O poartă fortificată cu scări care urcă până la drumul de strajă de pe zid. Se închide când inamicii sau bandiții se apropie."
