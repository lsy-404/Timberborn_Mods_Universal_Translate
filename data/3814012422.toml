frFR = "Les escaliers menaient les castors au niveau supérieur. Les tours de siège les mènent chez quelqu’un d’autre."
deDE = "Treppen brachten die Biber auf die nächste Ebene. Belagerungstürme bringen sie auf die eines anderen."
plPL = "Schody prowadziły bobry na kolejny poziom. Wieże oblężnicze prowadzą je do kogoś innego."
