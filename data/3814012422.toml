["Building.TimberEmpires.Forge.Description"]
raw = "Makes spears, bows, shields and ballista bolts, plus swords for the Iron Teeth and slings for the Folktails."
status = "normal"
enUS = "Makes spears, bows, shields, and ballista bolts, plus swords for the Iron Teeth and slings for the Folktails."
zhCN = "制造长矛、弓、盾牌和弩炮弩箭，还为铁牙制造剑，为神尾制造投石索。"
zhTW = "製作長矛、弓、盾牌和弩砲箭矢，另外也為鐵牙製作劍，為神尾製作彈弓。"
ruRU = "Изготавливает копья, луки, щиты и болты для баллист, а также мечи для Железных зубов и пращи для Хвостов мира."
jaJP = "槍、弓、盾、バリスタの矢に加え、アイアン・ティース用の剣とフォークテイル用のスリングを作ります。"
frFR = "Fabrique des lances, des arcs, des boucliers et des carreaux de baliste, ainsi que des épées pour les Dents de fer et des frondes pour les Rustiqueues."
deDE = "Stellt Speere, Bögen, Schilde und Ballistabolzen her, außerdem Schwerter für die Eisenzähne und Schleudern für die Rustikalruten."
plPL = "Wytwarza włócznie, łuki, tarcze i bełty do balist, a także miecze dla Żelazozębnych i proce dla Folkogonów."
ptBR = "Fabrica lanças, arcos, escudos e virotes de balista, além de espadas para os Dentes de Ferro e fundas para os Caudas-do-mato."
koKR = "창, 활, 방패, 발리스타용 화살을 만들며, 강철 이빨을 위한 검과 나무꼬리를 위한 새총도 만듭니다."
csCZ = "Vyrábí kopí, luky, štíty a šipky do balist, navíc meče pro Železné zuby a praky pro Lidovce."
viVN = "Chế tạo giáo, cung, khiên và tên cho nỏ lớn, cùng kiếm cho tộc Răng Sắt và ná cho tộc Đuôi Lá."
trTR = "Mızrak, yay, kalkan ve balista oklarının yanı sıra Demir Dişler için kılıç, Köykuyruklar için sapan üretir."

["Building.TimberEmpires.Forge.FlavorDescription"]
raw = "Every beaver can chew. Only a few can temper steel."
status = "normal"
enUS = "Every beaver can chew. Only a few can temper steel."
zhCN = "每只海狸都会啃东西。可只有少数海狸会锻钢。"
zhTW = "每隻海狸都會啃東西。只有少數海狸會淬鍊鋼鐵。"
ruRU = "Грызть умеет каждый бобр. Закаливать сталь — лишь немногие."
jaJP = "どのビーバーも噛むことはできる。鋼を鍛えられるビーバーはほんの一握りだ。"
frFR = "Tous les castors peuvent mâcher. Seuls quelques-uns savent tremper l’acier."
deDE = "Jeder Biber kann nagen. Nur wenige können Stahl härten."
plPL = "Każdy bóbr potrafi gryźć. Tylko nieliczne potrafią hartować stal."
ptBR = "Todo castor sabe roer. Poucos sabem temperar aço."
koKR = "모든 비버는 씹을 수 있다. 하지만 강철을 벼릴 수 있는 비버는 극소수뿐이다."
csCZ = "Každý bobr umí hlodat. Jen málokterý dokáže kalit ocel."
viVN = "Hải ly nào cũng biết gặm. Chỉ một số ít mới có thể tôi thép."
trTR = "Her kunduz çiğneyebilir. Yalnızca birkaçı çeliğe su verebilir."

