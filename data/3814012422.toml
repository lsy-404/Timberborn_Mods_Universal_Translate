ptBR = "Um estandarte pendurado na parte externa de uma muralha ou torre. As tropas na área ao redor dele causam 6% mais dano. Não se acumula com outro estandarte."
koKR = "벽이나 탑의 바깥쪽에 거는 깃발입니다. 주변 지역의 병력은 6% 더 강하게 공격합니다. 다른 깃발의 효과와 중첩되지 않습니다."
trTR = "Duvarın veya kulenin dışına asılan bir sancak. Yakındaki birlikler %6 daha sert vurur. Başka bir sancakla etkisi birikmez."
esES = "Un estandarte colgado en el exterior de un muro o torre. Las tropas en el área a su alrededor infligen un 6% más de daño. No se acumula con otro estandarte."
