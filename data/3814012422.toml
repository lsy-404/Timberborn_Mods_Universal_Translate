["TimberEmpires.Settings.DamPressure.Tooltip"]
raw = "Water pushes on dams, levees and floodgates. Thin, tall or unbraced ones, or ones hit by strong currents, take damage and can give way."
status = "normal"
enUS = "Water pushes against dams, levees, and floodgates. Thin, tall, or unbraced structures, or those hit by strong currents, take damage and can give way."
zhCN = "水会对堤坝、护堤和闸门施加压力。较薄、较高或没有支撑的结构，以及受到强劲水流冲击的结构，会受到损坏，甚至可能崩塌。"
zhTW = "水會對水壩、堤防和水閘施加壓力。較薄、較高或未加支撐的結構，或受到強勁水流衝擊的結構，會受損並可能潰決。"
ruRU = "Вода давит на плотины, дамбы и шлюзы. Тонкие, высокие или неукреплённые конструкции, а также конструкции, на которые воздействует сильное течение, получают повреждения и могут разрушиться."
jaJP = "水はダム、堤防、洪水ゲートを押します。薄いもの、高いもの、支えのないもの、または強い流れを受けるものは損傷し、決壊することがあります。"
frFR = "L’eau exerce une pression sur les barrages, les digues et les vannes. Les ouvrages minces, hauts ou non renforcés, ainsi que ceux soumis à de forts courants, subissent des dégâts et peuvent céder."
deDE = "Wasser übt Druck auf Dämme, Deiche und Fluttore aus. Dünne, hohe oder nicht abgestützte Bauwerke sowie solche, auf die starke Strömungen treffen, werden beschädigt und können nachgeben."
plPL = "Woda napiera na tamy, wały i śluzy. Cienkie, wysokie lub niepodparte konstrukcje, a także te, na które działają silne prądy, ulegają uszkodzeniom i mogą się zawalić."
ptBR = "A água exerce pressão sobre barragens, diques e comportas. Estruturas finas, altas ou sem escoras, ou atingidas por correntes fortes, sofrem danos e podem ceder."
koKR = "물은 댐, 제방, 수문을 밀어냅니다. 얇거나 높거나 보강되지 않은 구조물, 또는 강한 물살을 받는 구조물은 피해를 입고 무너질 수 있습니다."
csCZ = "Voda tlačí na hráze, protipovodňové hráze a stavidla. Tenké, vysoké nebo nezpevněné stavby a stavby zasažené silným proudem se poškozují a mohou povolit."
viVN = "Nước tạo áp lực lên đập, đê và cửa cống. Những công trình mỏng, cao hoặc không được chống đỡ, cũng như những công trình chịu dòng chảy mạnh, sẽ bị hư hại và có thể vỡ."
trTR = "Su, barajlara, setlere ve savak kapaklarına baskı uygular. İnce, yüksek veya desteklenmemiş olanlar ya da güçlü akıntılara maruz kalanlar hasar görür ve yıkılabilir."

