["Building.TimberEmpires.TripWire.Description"]
status = "normal"
raw = "Build two and join them with a wire. Sends a pulse when someone crosses it: enemies, allies, only yours, or anybody. Both ends send it."
enUS = "Build two and connect them with a wire. Sends a pulse when someone crosses it: enemies, allies, only your beavers, or anyone. Both ends send a pulse."
zhCN = "建造两个并用导线将它们连接起来。有人经过时会发送脉冲：敌人、盟友、仅你方成员，或任何人。两端都会发送脉冲。"
zhTW = "建造兩個並用導線連接。有人穿越時會發出脈衝：敵人、盟友、只有你方的人，或任何人都會觸發。兩端都會發出脈衝。"
ruRU = "Постройте два и соедините их проводом. Посылает сигнал, когда кто-нибудь пересекает его: враг, союзник, только ваши или кто угодно. Сигнал посылается с обоих концов."
jaJP = "2つ建設して、ワイヤーでつなぎます。敵、味方、自分の勢力の者だけ、または誰かが通過するとパルスを送信します。両端から送信されます。"
frFR = "Construisez-en deux et reliez-les avec un fil. Envoie une impulsion lorsque quelqu’un le franchit : ennemis, alliés, les vôtres uniquement ou n’importe qui. Les deux extrémités l’envoient."
deDE = "Baue zwei davon und verbinde sie mit einem Draht. Sendet einen Impuls, wenn jemand sie überquert: Feinde, Verbündete, nur deine Leute oder jeder. Beide Enden senden ihn."
plPL = "Zbuduj dwa i połącz je przewodem. Wysyłają impuls, gdy ktoś przez nie przejdzie: wrogowie, sojusznicy, tylko twoi lub ktokolwiek. Oba końce wysyłają impuls."
ptBR = "Construa duas e conecte-as com um fio. Envia um pulso quando alguém cruza o fio: inimigos, aliados, apenas os seus ou qualquer pessoa. As duas extremidades enviam o pulso."
koKR = "두 개를 건설하고 전선으로 연결하세요. 누군가가 선을 넘으면 신호를 보냅니다. 적, 아군, 내 편만 또는 누구나 감지할 수 있습니다. 양쪽 끝에서 신호를 보냅니다."
csCZ = "Postavte dva kusy a propojte je drátem. Pošle impulz, když přes něj někdo přejde: nepřátelé, spojenci, jen vaši, nebo kdokoli. Impulz vysílají oba konce."
viVN = "Xây hai cái và nối chúng bằng dây. Phát xung khi có ai đó băng qua: kẻ địch, đồng minh, chỉ phe bạn hoặc bất kỳ ai. Cả hai đầu đều phát xung."
trTR = "İki tane inşa edip bir telle birbirine bağlayın. Biri üzerinden geçtiğinde darbe gönderir: düşmanlar, müttefikler, yalnızca sizinkiler veya herkes. Her iki uç da darbe gönderir."

