viVN = "Một hành lang trên tường, nơi quân lính lăn khúc gỗ xuống phía kẻ thù, quật ngã tất cả những ai trên đường đi của chúng."
caES = "Una galeria a la muralla des d’on les tropes fan rodolar troncs cap als enemics, fent caure tothom que troben al seu pas."
beBY = "Галерэя на сцяне, з якой войскі скочваюць бярвенні ўніз на ворагаў, збіваючы ўсіх на сваім шляху."
roRO = "O galerie pe zid de unde trupele rostogolesc bușteni spre inamici, doborând pe toți cei aflați în calea lor."
huHU = "A falra épített galéria, ahonnan a katonák rönköket görgetnek le az ellenségre, fellökve mindenkit, aki az útjukba kerül."
