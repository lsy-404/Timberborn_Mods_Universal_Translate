["Building.TimberEmpires.MineLauncher.Description"]
status = "normal"
raw = "Releases floating mines that drift with the current and explode against the first building they hit."
enUS = "Releases floating mines that drift with the current and explode when they hit the first building."
zhCN = "发射随水流漂移的漂浮水雷，水雷撞上遇到的第一座建筑时便会爆炸。"
zhTW = "發射會隨水流漂移的水雷，並在撞上第一棟建築物時爆炸。"
ruRU = "Выпускает плавучие мины, которые дрейфуют по течению и взрываются при столкновении с первым зданием."
jaJP = "浮遊機雷を放ち、流れに乗って漂流し、最初に衝突した建物に当たると爆発します。"
frFR = "Lance des mines flottantes qui dérivent avec le courant et explosent au contact du premier bâtiment qu’elles heurtent."
deDE = "Setzt treibende Minen frei, die mit der Strömung treiben und beim Aufprall auf das erste Gebäude explodieren."
plPL = "Wystrzeliwuje pływające miny, które unoszą się z nurtem i wybuchają przy zderzeniu z pierwszym budynkiem."
ptBR = "Lança minas flutuantes que são levadas pela correnteza e explodem ao atingir o primeiro edifício."
koKR = "물살을 따라 떠내려가다 처음 부딪히는 건물에서 폭발하는 부유 기뢰를 발사합니다."
csCZ = "Vypouští plovoucí miny, které se nechávají unášet proudem a explodují při nárazu do první budovy."
viVN = "Phóng ra các quả mìn nổi trôi theo dòng nước và phát nổ khi va vào công trình đầu tiên chúng gặp phải."
trTR = "Akıntıyla sürüklenen ve çarptıkları ilk binaya karşı patlayan yüzen mayınlar fırlatır."

["Building.TimberEmpires.MineLauncher.FlavorDescription"]
status = "normal"
raw = "Rivers have always carried gifts downstream. Not always nice ones."
enUS = "Rivers have always carried gifts downstream. Not always nice ones."
zhCN = "河流总是把馈赠带向下游。但这些馈赠不总是那么友好。"
zhTW = "河流總是會把禮物帶往下游。但不見得每份禮物都討人喜歡。"
ruRU = "Реки всегда приносили дары вниз по течению. Не всегда приятные."
jaJP = "川はいつだって、贈り物を下流へ運んできた。いつも嬉しい贈り物とは限らないが。"
frFR = "Les rivières ont toujours charrié des cadeaux vers l’aval. Pas toujours des cadeaux agréables."
deDE = "Flüsse haben schon immer Gaben flussabwärts getragen. Nicht immer nette."
plPL = "Rzeki od zawsze niosły dary w dół swojego biegu. Nie zawsze miłe."
ptBR = "Os rios sempre levaram dádivas correnteza abaixo. Nem sempre agradáveis."
koKR = "강은 언제나 선물을 하류로 실어 날랐습니다. 늘 반가운 선물만은 아니었지만요."
csCZ = "Řeky odjakživa přinášejí po proudu dary. Ne vždycky příjemné."
viVN = "Từ xưa đến nay, sông luôn mang quà xuôi dòng. Chỉ là không phải món nào cũng dễ chịu."
trTR = "Nehirler hediyelerini hep akıntıyla aşağı taşımıştır. Hediyeler her zaman güzel olmayabilir."

