["Building.TimberEmpires.Flamethrower.Description"]
raw = "Burns the horde in a cone in front of it, using up extract as it fires. Short range, deadly to zombies. Its crew moves and aims it, on the ground or on a tower."
status = "normal"
enUS = "Burns the horde in a cone in front of it, using up extract as it fires. Short range, deadly to zombies. Its crew moves and aims it, on the ground or on a tower."
zhCN = "向前方锥形范围内的尸群喷火，每次开火都会消耗提取物。射程较短，对僵尸杀伤力极强。由操作人员在地面或塔楼上移动并瞄准。"
zhTW = "朝前方錐形範圍噴射火焰，並在開火時消耗萃取物。射程短，對殭屍殺傷力強。由操作人員在地面或塔上移動並瞄準。"
ruRU = "Сжигает орду конусом перед собой, расходуя экстракт при стрельбе. Небольшая дальность, смертоносен для зомби. Расчёт перемещает его и наводит на цель как на земле, так и на башне."
jaJP = "前方の円錐状の範囲を焼き払い、発射するたびに抽出物を消費する。射程は短いが、ゾンビにとっては致命的。乗組員が地上または塔の上で移動・照準を行う。"
frFR = "Brûle la horde dans un cône devant lui, en consommant de l’extrait à chaque tir. Portée courte, mais mortel contre les zombies. Son équipage le déplace et le vise, au sol ou sur une tour."
deDE = "Verbrennt die Horde in einem Kegel vor sich und verbraucht beim Feuern Extrakt. Kurze Reichweite, tödlich für Zombies. Die Besatzung bewegt und richtet den Flammenwerfer aus, am Boden oder auf einem Turm."
plPL = "Spala hordę w stożku przed sobą, zużywając ekstrakt podczas strzelania. Ma krótki zasięg i jest zabójczy dla zombie. Załoga przemieszcza go i celuje nim, zarówno na ziemi, jak i na wieży."
ptBR = "Queima a horda em um cone à sua frente, consumindo extrato enquanto dispara. Tem curto alcance e é mortal para zumbis. Sua equipe o movimenta e mira, seja no chão ou em uma torre."
koKR = "발사할 때마다 추출물을 소모해 전방 원뿔 범위의 무리를 불태웁니다. 사거리는 짧지만 좀비에게 치명적입니다. 승무원이 지상이나 탑 위에서 이동하고 조준합니다."
csCZ = "Spaluje hordu v kuželu před sebou a při střelbě spotřebovává extrakt. Má krátký dostřel a je smrtící pro zombie. Jeho obsluha s ním pohybuje a míří, ať už stojí na zemi, nebo na věži."
viVN = "Thiêu đốt đám xác sống trong một hình nón phía trước, tiêu hao dịch chiết khi khai hỏa. Tầm bắn ngắn, cực kỳ nguy hiểm đối với xác sống. Kíp vận hành di chuyển và ngắm bắn vũ khí này, dù đặt trên mặt đất hay trên tháp."
trTR = "Ateş ederken özüt tüketerek önündeki koni şeklindeki alanda zombi sürüsünü yakar. Menzili kısadır, zombilere karşı ölümcüldür. Mürettebatı, ister yerde ister bir kulede olsun, silahı hareket ettirip nişan alır."

