["TimberEmpires.ShipArmament.Ammo.Tooltip"]
status = "normal"
raw = "Cannonballs aboard. Every gun fires them, a few a shot: set them to load in the hold above so haulers bring them."
enUS = "Cannonballs aboard. Every gun fires them, a few a shot: set them to load in the hold above so haulers bring them."
zhCN = "炮弹已装载。每门炮每次开火都会消耗数枚炮弹：请设置其在上层货舱中装载，以便搬运工运送。"
zhTW = "火炮彈藥已就位。每門火炮每次發射都需要消耗數發彈藥，請設定其在上方的貨艙中裝載，讓搬運工運送過來。"
ruRU = "Ядра на борту. Каждое орудие стреляет ими, по несколько за выстрел: настройте загрузку в трюме выше, чтобы перевозчики доставляли их."
jaJP = "大砲の弾薬も積み込みます。各砲は一度の発射に数発ずつ使うため、上の船倉に積み込み設定をしておくと運搬員が弾を運んでくれます。"
frFR = "Boulets de canon à bord. Chaque canon les tire, quelques-uns à chaque tir : réglez-les pour qu'ils soient chargés dans la cale au-dessus afin que les transporteurs les apportent."
deDE = "Kanonenkugeln an Bord. Jede Kanone feuert sie, einige pro Schuss: Stelle sie so ein, dass sie im Laderaum darüber geladen werden, damit Transporter sie herbeibringen."
plPL = "Na statku znajdują się kule armatnie. Każde działo wystrzeliwuje ich kilka za każdym strzałem, więc ustaw ich ładowanie w ładowni powyżej, aby tragarze je dostarczali."
ptBR = "Balas de canhão a bordo. Cada canhão as dispara, algumas por tiro: configure para carregá-las no porão acima para que os transportadores as tragam."
koKR = "포탄 탑재. 모든 대포는 발사할 때마다 여러 발을 사용하므로, 위 적재고에서 포탄을 불러오도록 설정하면 운반자가 이를 실어 옵니다."
trTR = "Gemiler üzerinde top güllesi var. Her top birkaç atışta bir tane kullanır; bunları üstteki ambarda yüklenecek şekilde ayarlayın ki taşıyıcılar getirsin."
esES = "Balas de cañón a bordo. Cada cañón las dispara, algunas por disparo: configúralas para cargarse en la bodega de arriba para que los transportistas las traigan."
itIT = "Palle di cannone a bordo. Ogni cannone le spara, alcune per ogni colpo: impostale per essere caricate nella stiva superiore così che i trasportatori le portino."
ukUA = "Гарматні ядра на борту. Кожна гармата стріляє ними, по кілька за залп: налаштуйте завантаження їх у трюм вище, щоб вантажники їх доставляли."
thTH = "กระสุนปืนใหญ่บนเรือ ปืนทุกกระบอกยิงกระสุนเหล่านี้ กระบอกละไม่กี่นัด ตั้งค่าให้โหลดกระสุนในช่องเก็บของชั้นบน เพื่อให้เฮาเลอร์นำกระสุนมาส่ง"
csCZ = "Dělostřelecké koule na palubě. Každé dělo je vystřeluje, několik na jeden výstřel: nastavte jejich nakládání do nákladového prostoru výše, aby je nosiči přivezli."
viVN = "Đạn đại bác đã được nạp. Mỗi khẩu pháo đều bắn loại đạn này, mỗi phát tốn vài viên: hãy đặt chúng nạp từ kho hàng phía trên để các xe vận chuyển mang đến."
caES = "Projectils de canó a bord. Cada canó els dispara, alguns per tret: configura'ls perquè es carreguin al magatzem de dalt perquè els transportadors els portin."
beBY = "Гарматныя ядры на борце. Кожная гармата страляе імі, па некалькі за залп: налаштуйце загрузку ў трюм вышэй, каб гандляры іх дастаўлялі."
roRO = "Ghiulele la bord. Fiecare tun le trage, câte câteva la fiecare lovitură: setează-le să fie încărcate în magazia de deasupra, ca transportatorii să le aducă."
huHU = "Ágyúgolyók a fedélzeten. Minden ágyú lő velük, lövésenként néhányat: állítsd be, hogy a fölötte lévő raktárban töltsék be őket, hogy a szállítók hozzák."
arSA = "ذخيرة المدافع على متن السفينة. كل مدفع يطلقها، بعدد قليل في كل طلقة: اضبطها للتحميل في الحجرة العلوية كي ينقلها الناقلون."

