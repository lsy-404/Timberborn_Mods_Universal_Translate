["Building.TimberEmpires.WallTower.Description"]
status = "normal"
raw = "Joins walls on any side and leads up to the wall walk. Sees far through the fog, further from high ground."
enUS = "Connects to walls on any side and leads up to the wall walk. Sees far through the fog, and even farther from high ground."
zhCN = "可与任意一侧的墙体相连，并通向墙上步道。视野可远远穿透迷雾；地势越高，视野越远。"
zhTW = "可從任意一側連接牆壁，並通往城牆步道。從高處能看得更遠，穿透迷霧的視野也更遠。"
ruRU = "Соединяется со стенами с любой стороны и ведёт на верх стены. Обеспечивает обзор сквозь туман на большее расстояние с возвышенности."
jaJP = "あらゆる側の壁とつながり、壁上通路へ続く。高所からは霧の中をより遠くまで見渡せる。"
frFR = "Se raccorde aux murs de n’importe quel côté et mène au chemin de ronde. Permet de voir loin à travers le brouillard, et encore plus loin depuis les hauteurs."
deDE = "Verbindet Mauern auf jeder Seite und führt zum Wehrgang hinauf. Sieht weit durch den Nebel und von erhöhtem Gelände aus noch weiter."
plPL = "Łączy się ze ścianami z każdej strony i prowadzi na koronę muru. Zapewnia daleki zasięg widzenia we mgle, a z wysokiego terenu — jeszcze większy."
ptBR = "Conecta-se às paredes por qualquer lado e leva ao caminho no alto da muralha. Enxerga longe através da neblina, ainda mais longe quando está em terreno elevado."
koKR = "어느 쪽으로든 벽과 연결되며 성벽 통로로 이어집니다. 안개 너머를 멀리 내다보며, 높은 곳에서는 더 멀리까지 볼 수 있습니다."
csCZ = "Navazuje na zdi z kterékoli strany a vede na ochoz. Z výšky dohlédne dál skrz mlhu."
viVN = "Nối với tường ở bất kỳ cạnh nào và dẫn lên lối đi trên tường. Có thể nhìn xa xuyên qua sương mù, xa hơn khi ở trên cao."
trTR = "Duvarlara her yönden bağlanır ve duvar yürüyüş yoluna çıkar. Sisin içini uzakları görebilir; yüksek bir konumdan daha da uzağı görür."

["Building.TimberEmpires.WallTower.FlavorDescription"]
new = "The best view in the district, mostly of trouble."
status = "normal"
enUS = "The best view in the district, mostly of trouble."
zhTW = "區域內最棒的景色，雖然大多是麻煩事。"
ruRU = "Лучший вид в округе — в основном на неприятности."
jaJP = "地区で最高の眺め。ただし、ほとんど見えるのは厄介ごと。"
frFR = "La meilleure vue du district, surtout sur les ennuis."
deDE = "Die beste Aussicht im Bezirk, meistens auf Ärger."
plPL = "Najlepszy widok w dystrykcie, głównie na kłopoty."
ptBR = "A melhor vista do distrito, principalmente de problemas."
koKR = "지구에서 경치가 가장 좋은 곳. 대부분 골칫거리뿐이지만."
csCZ = "Nejlepší výhled v okrese, většinou na potíže."
viVN = "Tầm nhìn đẹp nhất trong khu, chủ yếu là nhìn thấy rắc rối."
trTR = "Bölgedeki en iyi manzara; çoğunlukla da baş belası şeyler."

