["TimberEmpires.Settings.BanditRaids.Tooltip"]
raw = "From the cycle picked below, bandit camps raid players now and then, more often as the game goes on. Raiders put up ladders over cliffs and take them down when they leave. Camps left alone gain a bandit every cycle."
status = "normal"
enUS = "Starting with the cycle selected below, bandit camps occasionally raid players, with raids becoming more frequent as the game progresses. Raiders build ladders over cliffs and take them down when they leave. Camps left alone gain one bandit each cycle."
zhCN = "根据下方选定的周期，土匪营地会不时袭击玩家，且随着游戏进程推进，袭击会越来越频繁。袭击者会在悬崖上架起梯子，离开时则会将其拆除。放任营地不管，每个周期都会新增一名土匪。"
zhTW = "土匪營地會依照下方選擇的週期，時不時襲擊玩家；遊戲進行得越久，襲擊就越頻繁。襲擊者會在懸崖上架起梯子，離開時再拆掉。放任不管的營地每個週期都會增加一名土匪。"
ruRU = "Начиная с выбранного ниже цикла, лагеря бандитов время от времени совершают набеги на игроков, и по мере развития игры — всё чаще. Налётчики устанавливают лестницы на скалах и разбирают их, когда уходят. В лагерях, оставленных без внимания, каждый цикл появляется новый бандит."
jaJP = "下で選択した周期に基づいて、盗賊の野営地は時折プレイヤーを襲撃し、ゲームが進むにつれて襲撃の頻度が高くなります。襲撃者は崖にハシゴを設置し、立ち去る際に撤去します。放置された野営地には、毎周期盗賊が1人増えます。"
frFR = "À partir du cycle sélectionné ci-dessous, les camps de bandits attaquent parfois les joueurs, et de plus en plus souvent au fil du jeu. Les pillards installent des échelles pour franchir les falaises et les démontent en partant. Les camps laissés à l’abandon gagnent un bandit à chaque cycle."
deDE = "Ausgehend vom unten ausgewählten Zyklus überfallen Banditenlager von Zeit zu Zeit die Spieler, im weiteren Spielverlauf immer häufiger. Die Räuber errichten Leitern über Klippen und bauen sie wieder ab, wenn sie gehen. Unbehelligte Lager erhalten in jedem Zyklus einen Banditen dazu."
plPL = "Od wybranego poniżej cyklu obozy bandytów będą co jakiś czas najeżdżać graczy, a wraz z postępem gry — coraz częściej. Najeźdźcy stawiają drabiny na klifach i zabierają je, gdy odchodzą. W obozach, których nikt nie atakuje, przybywa jeden bandyta w każdym cyklu."
ptBR = "A partir do ciclo selecionado abaixo, os acampamentos de bandidos atacam os jogadores de vez em quando, com mais frequência conforme o jogo avança. Os invasores instalam escadas sobre os penhascos e as desmontam quando vão embora. Acampamentos deixados sem vigilância ganham um bandido a cada ciclo."
koKR = "아래에서 선택한 주기마다 산적 야영지가 플레이어를 습격하며, 게임이 진행될수록 습격이 잦아집니다. 습격자들은 절벽에 사다리를 세우고 떠날 때 철거합니다. 방치된 야영지에는 주기마다 산적이 한 명씩 늘어납니다."
csCZ = "V cyklu zvoleném níže nájezdnické tábory čas od času přepadnou hráče, přičemž s postupem hry častěji. Nájezdníci staví žebříky přes útesy a při odchodu je zase odstraňují. V opuštěných táborech každým cyklem přibude jeden bandita."
viVN = "Kể từ chu kỳ được chọn bên dưới, các trại cướp thỉnh thoảng sẽ đột kích người chơi, và tần suất tăng dần theo tiến trình trò chơi. Quân đột kích dựng thang vượt qua vách đá rồi tháo xuống khi rời đi. Mỗi chu kỳ, các trại bị bỏ mặc sẽ có thêm một tên cướp."
trTR = "Aşağıdan seçilen döngüden itibaren haydut kampları oyunculara ara sıra baskın düzenler; oyun ilerledikçe bu baskınlar daha sık gerçekleşir. Akıncılar kayalıkların üzerine merdivenler kurar ve ayrılırken bunları kaldırır. Dokunulmayan kamplara her döngüde bir haydut daha katılır."

