["TimberEmpires.Shelter.Tooltip"]
status = "normal"
raw = "How much the shore shelters this boat from a storm. It takes full damage in open water, less near land and least inside a bay."
enUS = "How much the shore shelters this boat from a storm. It takes full damage in open water, less damage near land, and the least damage inside a bay."
zhCN = "海岸对这艘船抵御风暴的庇护程度。船在开阔水域会承受全部伤害，靠近陆地时受伤较轻，在海湾内受到的伤害最少。"
zhTW = "海岸對這艘船的風暴遮蔽程度。它在開闊水域會受到全額傷害，靠近陸地時傷害較少，在海灣內則最少。"
ruRU = "Насколько берег защищает эту лодку от шторма. В открытой воде она получает полный урон, рядом с сушей — меньше, а в бухте — меньше всего."
jaJP = "岸がこのボートを嵐からどれだけ守るか。開けた水域ではダメージをすべて受け、陸地の近くでは少なくなり、湾内では最も少なくなる。"
frFR = "Dans quelle mesure le rivage protège ce bateau d'une tempête. Il subit des dégâts complets en pleine eau, moins près des terres et le moins possible dans une baie."
deDE = "Wie stark das Ufer dieses Boot vor einem Sturm schützt. Auf offenem Wasser erleidet es vollen Schaden, in Landnähe weniger und in einer Bucht am wenigsten."
plPL = "Stopień, w jakim brzeg osłania tę łódź przed sztormem. Na otwartej wodzie otrzymuje pełne obrażenia, mniejsze w pobliżu lądu, a najmniejsze w zatoce."
ptBR = "O quanto a costa protege este barco de uma tempestade. Ele sofre dano completo em águas abertas, menos dano perto da terra e o mínimo dentro de uma baía."
koKR = "해안이 폭풍으로부터 이 배를 얼마나 보호하는지 나타냅니다. 탁 트인 바다에서는 피해를 전부 입고, 육지 근처에서는 덜 입으며, 만 안에서는 가장 적게 입습니다."
trTR = "Kıyının bu tekneyi fırtınadan ne kadar koruduğu. Açık suda tam hasar alır, karaya yakınken daha az, bir koyun içindeyken ise en az hasarı alır."
esES = "Cuánto protege la costa a este barco de una tormenta. Sufre todo el daño en aguas abiertas, menos cerca de tierra y el mínimo dentro de una bahía."
itIT = "Quanto la costa protegge questa barca da una tempesta. Subisce tutti i danni in mare aperto, meno vicino alla terraferma e ancora meno all’interno di una baia."
ukUA = "Наскільки берег захищає цей човен від шторму. На відкритій воді він зазнає повної шкоди, біля суші — меншої, а в затоці — найменшої."
thTH = "ชายฝั่งช่วยกำบังเรือลำนี้จากพายุได้มากน้อยเพียงใด เรือจะได้รับความเสียหายเต็มจำนวนในทะเลเปิด น้อยลงเมื่ออยู่ใกล้แผ่นดิน และน้อยที่สุดเมื่ออยู่ในอ่าว"
csCZ = "Jak moc břeh chrání tuto loď před bouří. Na otevřené vodě utrpí plné poškození, poblíž pevniny menší a v zátoce nejmenší."
viVN = "Bờ biển che chắn cho thuyền này khỏi bão tốt đến mức nào. Thuyền chịu toàn bộ sát thương ở vùng nước trống, ít hơn khi gần bờ và ít nhất khi ở trong vịnh."
caES = "Fins a quin punt la costa protegeix aquest vaixell d'una tempesta. Rep el dany complet en aigües obertes, menys a prop de terra i encara menys dins d'una badia."
beBY = "Наколькі бераг абараняе гэтую лодку ад шторму. На адкрытай вадзе лодка атрымлівае поўны ўрон, каля сушы — меншы, а ў бухце — найменшы."
roRO = "Cât de bine adăpostește țărmul această barcă de furtună. În ape deschise, primește daune complete, mai puține lângă uscat și cele mai puține în interiorul unui golf."
huHU = "Mennyire védi meg a part ezt a hajót a vihartól. Nyílt vízen teljes sebzést szenved, szárazföld közelében kevesebbet, öbölben pedig a legkevesebbet."
arSA = "مقدار حماية الشاطئ لهذا القارب من العاصفة. يتلقى الضرر كاملًا في المياه المفتوحة، وضررًا أقل بالقرب من اليابسة، وأقل قدر من الضرر داخل خليج."

