["TimberEmpires.GameMode.Horde.Description"]
status = "normal"
raw = "The undead raccoons rise from the ruins every few nights, more each time, and in a great swarm when the badtide comes. Stand together, hold out till dawn, and seal every ruin to end it."
enUS = "The undead raccoons rise from the ruins every few nights, more each time, and in a great swarm when the badtide comes. Stand together, hold out until dawn, and seal every ruin to end it."
zhCN = "不死浣熊每隔几个夜晚便会从废墟中爬出，每次数量都会增加；恶潮来临时，更会成群结队地涌来。团结起来，坚守到黎明，并封住所有废墟，结束这一切。"
zhTW = "不死浣熊每隔幾夜就會從廢墟中爬起來，每次數量都更多；腐水潮來襲時，更會成群湧出。團結一致，堅守到黎明，並封住所有廢墟，才能終結這一切。"
ruRU = "Неживые еноты восстают из руин раз в несколько ночей, и с каждым разом их становится всё больше, а во время плоховодного прилива они являются целым роем. Держитесь вместе, продержитесь до рассвета и запечатайте все руины, чтобы положить этому конец."
jaJP = "アンデッドのアライグマは数夜おきに廃墟から現れ、そのたびに数が増え、悪潮が来ると大群で押し寄せる。仲間と力を合わせて夜明けまで持ちこたえ、すべての廃墟を封鎖して終わらせよう。"
frFR = "Les ratons laveurs morts-vivants sortent des ruines toutes les quelques nuits, toujours plus nombreux, et en une immense horde lorsque survient la marée toxique. Faites front, tenez jusqu’à l’aube et scellez toutes les ruines pour mettre fin à la menace."
deDE = "Die untoten Waschbären erheben sich alle paar Nächte aus den Ruinen, jedes Mal werden es mehr, und wenn die Giftflut kommt, bilden sie einen gewaltigen Schwarm. Haltet zusammen, harrt bis zum Morgengrauen aus und versiegelt jede Ruine, um dem ein Ende zu setzen."
plPL = "Nieumarłe szopy wychodzą z ruin co kilka nocy, za każdym razem w większej liczbie, a gdy nadciąga toksyczna fala — całym stadem. Trzymajcie się razem, przetrwajcie do świtu i zapieczętujcie wszystkie ruiny, by temu zapobiec."
ptBR = "Os guaxinins mortos-vivos saem das ruínas a cada poucas noites, em número cada vez maior, e em um grande enxame quando chega a maré tóxica. Permaneçam unidos, resistam até o amanhecer e lacrem todas as ruínas para acabar com isso."
koKR = "언데드 너구리들이 며칠 밤마다 폐허에서 일어나며, 그 수는 매번 늘어나고 독성 홍수가 닥치면 거대한 무리를 이룹니다. 힘을 합쳐 새벽까지 버티고, 모든 폐허를 봉쇄해 이들을 끝내세요."
csCZ = "Nemrtví mývalové vstávají z trosek každých pár nocí, pokaždé v hojnějším počtu a při příchodu zlé přílivové vlny v obrovském hejnu. Držte při sobě, vydržte až do úsvitu a zapečeťte všechny ruiny, abyste tomu učinili přítrž."
viVN = "Cứ vài đêm, lũ gấu mèo xác sống lại trỗi dậy từ đống đổ nát, mỗi lần lại đông hơn, và sẽ kéo đến thành một đàn khổng lồ khi thủy triều độc ập đến. Hãy đoàn kết, cầm cự đến bình minh và phong kín mọi tàn tích để chấm dứt chuyện này."
trTR = "Yaşayan ölü rakunlar birkaç gecede bir harabelerden yükseliyor; her seferinde sayıları artıyor, zehirli gelgit geldiğindeyse büyük bir sürü hâlinde saldırıyorlar. Birlikte durun, şafağa kadar dayanın ve bu saldırıları sona erdirmek için tüm harabeleri mühürleyin."

["TimberEmpires.Alliances.Horde"]
status = "normal"
raw = "Against the horde there are no rivals. Every colony stands with the others."
enUS = "Against the horde, there are no rivals. Every colony stands with the others."
zhCN = "在这群敌人面前，没有对手能与之抗衡。每个殖民地都与其他殖民地并肩作战。"
zhTW = "面對大群敵人，無人能與我們匹敵。每個殖民地都與其他殖民地並肩作戰。"
ruRU = "Орде нет равных. Каждая колония стоит плечом к плечу с остальными."
jaJP = "大群に敵う者はいない。すべてのコロニーが互いに支え合う。"
frFR = "Face à la horde, il n’y a pas de rivaux. Chaque colonie se tient aux côtés des autres."
deDE = "Gegen die Horde gibt es keine Rivalen. Jede Kolonie steht den anderen bei."
plPL = "W obliczu hordy nie ma rywali. Każda kolonia stoi u boku pozostałych."
ptBR = "Contra a horda, não há rivais. Cada colônia está ao lado das outras."
koKR = "호드에 맞설 경쟁자는 없습니다. 모든 거점이 서로 힘을 합칩니다."
csCZ = "Proti hordě nemají soupeře. Každá kolonie stojí po boku těch ostatních."
viVN = "Trước bầy đàn, không ai là đối thủ. Mọi thuộc địa đều sát cánh bên nhau."
trTR = "Sürüye karşı rakibi yok. Her koloni diğerlerinin yanında durur."

["TimberEmpires.Victory.Won.Ruins"]
status = "normal"
raw = "The last ruin is sealed. The nights are quiet again."
enUS = "The last ruin is sealed. The nights are quiet again."
zhCN = "最后一处废墟已封存。夜晚又恢复了宁静。"
zhTW = "最後一座遺跡已封存。夜晚再次歸於寧靜。"
ruRU = "Последние руины запечатаны. Ночи снова тихие."
jaJP = "最後の遺跡は封印された。夜は再び静けさを取り戻した。"
frFR = "La dernière ruine est scellée. Les nuits sont à nouveau calmes."
deDE = "Die letzte Ruine ist versiegelt. Nachts ist es wieder ruhig."
plPL = "Ostatnie ruiny są zapieczętowane. Noce znów są spokojne."
ptBR = "A última ruína está selada. As noites voltaram a ser tranquilas."
koKR = "마지막 폐허가 봉인되었습니다. 다시 밤이 고요해졌습니다."
csCZ = "Poslední ruina je zapečetěná. Noci jsou opět klidné."
viVN = "Tàn tích cuối cùng đã được phong kín. Những đêm yên bình trở lại."
trTR = "Son harabenin mührü açıldı. Geceler yeniden sakin."

["TimberEmpires.Victory.Lost.Ruins"]
status = "normal"
