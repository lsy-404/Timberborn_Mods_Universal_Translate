["TimberEmpires.Settings.BanditCamps.Tooltip"]
raw = "On a map without bandit camps, camps are placed away from player starts and out of the water, clearing trees from their spots. The further from a start, the stronger the camp and the richer its loot."
status = "normal"
enUS = "On a map without bandit camps, camps are placed away from player starts and out of the water, clearing trees from their spots. The farther from a start, the stronger the camp and the richer its loot."
zhCN = "在没有强盗营地的地图上，营地会放置在远离玩家起始位置且不在水中的地方，并清除营地位置上的树木。营地距离起始位置越远，就越强大，战利品也越丰富。"
zhTW = "在沒有強盜營地的地圖上，營地會放置在遠離玩家起始位置且不在水中的地方，並清除營地位置上的樹木。營地距離起始位置越遠，就越強大，戰利品也越豐富。"
ruRU = "На карте без лагерей бандитов лагеря размещаются вдали от стартовых позиций игроков и вне воды, а деревья на этих местах вырубаются. Чем дальше лагерь от стартовой позиции, тем он сильнее и тем богаче его добыча."
jaJP = "盗賊キャンプがないマップでは、キャンプはプレイヤーの開始地点から離れた水のない場所に配置され、その場所の木々が取り除かれます。開始地点から遠いほど、キャンプは強力になり、戦利品も豊かになります。"
frFR = "Sur une carte sans campements de bandits, les campements sont placés à l’écart des points de départ des joueurs et hors de l’eau, après avoir dégagé les arbres de leur emplacement. Plus ils sont éloignés d’un point de départ, plus ils sont puissants et plus leur butin est riche."
deDE = "Auf einer Karte ohne Banditenlager werden die Lager abseits der Spielerstarts und außerhalb des Wassers platziert, wobei die Bäume an ihren Standorten entfernt werden. Je weiter ein Lager von einem Start entfernt ist, desto stärker ist es und desto reicher fällt seine Beute aus."
plPL = "Na mapie bez obozów bandytów obozy są rozmieszczane z dala od początkowych pozycji graczy i poza wodą, a drzewa w ich miejscach są usuwane. Im dalej od pozycji początkowej, tym silniejszy obóz i tym bogatszy łup."
ptBR = "Em um mapa sem acampamentos de bandidos, eles são posicionados longe dos pontos iniciais dos jogadores e fora da água, removendo as árvores dos locais escolhidos. Quanto mais longe de um ponto inicial, mais forte o acampamento e mais valioso o saque."
koKR = "산적 야영지가 없는 지도에서는 야영지를 플레이어 시작 지점에서 떨어지고 물이 없는 곳에 배치하며, 자리를 차지한 나무는 제거합니다. 시작 지점에서 멀수록 야영지는 더 강해지고 전리품도 더 풍부해집니다."
csCZ = "Na mapě bez táborů banditů jsou tábory umístěny dál od počátečních pozic hráčů a mimo vodu, přičemž se z jejich míst odstraní stromy. Čím dál jsou od počáteční pozice, tím silnější je tábor a tím bohatší je jeho kořist."
viVN = "Trên bản đồ không có trại cướp, các trại được đặt cách xa điểm xuất phát của người chơi và không nằm dưới nước; cây cối ở vị trí đặt trại sẽ bị dọn đi. Trại càng xa điểm xuất phát thì càng mạnh và chiến lợi phẩm càng phong phú."
trTR = "Haydut kampı bulunmayan bir haritada kamplar, oyuncuların başlangıç noktalarından uzağa ve su dışında bir yere yerleştirilir; bulundukları yerdeki ağaçlar temizlenir. Başlangıç noktasından ne kadar uzaktalarsa kamp o kadar güçlü, ganimetleri de o kadar zengin olur."

