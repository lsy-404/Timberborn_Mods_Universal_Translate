ukUA = "Будівельники прокладають дороги без витрат матеріалів і будують усі Центри району, починаючи з другого, заради матеріалів і науки."
thTH = "ช่างก่อสร้างวางถนนโดยไม่เสียค่าวัสดุ ส่วนศูนย์เขตทุกแห่งหลังแห่งแรกต้องใช้วัสดุและวิทยาศาสตร์ในการก่อสร้าง"
csCZ = "Stavitelé staví cesty bez nákladů na materiál a každé další centrum okrsku po prvním postaví za materiál a vědu."
viVN = "Thợ xây dựng đường sá không tốn vật liệu, và xây dựng mọi Trung tâm Quận sau trung tâm đầu tiên để nhận vật liệu và khoa học."
caES = "Els constructors construeixen carreteres sense cost de materials i construeixen cada Centre de districte a partir del segon, a canvi de materials i ciència."
beBY = "Будаўнікі пракладваюць дарогі без выдаткаў матэрыялаў і будуюць кожны Цэнтр раёна пасля першага за матэрыялы і навуку."
roRO = "Constructorii construiesc drumuri fără costuri de materiale și construiesc fiecare Centru al districtului după primul, pentru materiale și știință."
huHU = "Az építők anyagköltség nélkül fektetik le az utakat, és az első után minden körzetközpontot megépítenek anyagokért és tudományért cserébe."
arSA = "يمهّد البناؤون الطرق دون تكلفة مواد، ويبنون كل مركز منطقة بعد الأول مقابل المواد والعلوم."

