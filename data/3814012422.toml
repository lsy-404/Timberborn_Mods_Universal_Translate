zhCN = "随着游戏进程推进，周期性强盗营地开始袭击玩家，袭击也会越来越频繁。调至最左侧时，他们永远不会发动袭击。"
zhTW = "隨著遊戲進行，週期越短，強盜營地襲擊玩家的頻率就越高。調到最左邊時，他們永遠不會發動襲擊。"
ruRU = "Лагеря налётчиков начинают совершать набеги на игроков с заданной периодичностью, которая со временем увеличивается. В крайнем левом положении они никогда не совершают набегов."
jaJP = "このサイクルの設定に応じて、バンディットのキャンプがプレイヤーへの襲撃を開始します。ゲームが進むほど、襲撃の頻度が上がります。設定を一番左にすると、襲撃は一切ありません。"
frFR = "Les camps de bandits cyclistes commencent à attaquer les joueurs, et leurs raids deviennent plus fréquents au fil de la partie. Tout à gauche, ils ne lancent jamais de raid."
deDE = "Die Bandenlager überfallen die Spieler in regelmäßigen Abständen, und im Laufe des Spiels immer häufiger. Ganz links überfallen sie nie."
plPL = "Obozy bandytów z cyklu zaczynają najeżdżać graczy w coraz krótszych odstępach w miarę postępów w grze. Ustawienie całkiem w lewo oznacza, że nigdy nie najeżdżają."
ptBR = "Os acampamentos de saqueadores começam a atacar os jogadores dentro do ciclo, com mais frequência à medida que o jogo avança. Na extremidade esquerda, eles nunca atacam."
koKR = "주기 값이 낮을수록 도적 캠프가 플레이어를 더 자주 습격하며, 게임이 진행될수록 습격 빈도가 높아집니다. 맨 왼쪽으로 설정하면 습격하지 않습니다."
csCZ = "Tábory banditů začnou hráče přepadat v nastaveném cyklu, který se v průběhu hry zkracuje. Úplně vlevo nikdy nepřepadají."
viVN = "Các trại cướp bắt đầu đột kích người chơi theo chu kỳ; càng về sau trong trò chơi, chúng càng đột kích thường xuyên hơn. Kéo hết sang trái để chúng không bao giờ đột kích."
