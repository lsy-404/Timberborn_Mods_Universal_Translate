["Building.TimberEmpires.WagonYard.Description"]
raw = "Sends supply carts to the front so troops can eat, drink and build siege engines off the roads."
status = "normal"
enUS = "Sends supply carts to the front so troops can eat, drink, and build siege engines off the roads."
