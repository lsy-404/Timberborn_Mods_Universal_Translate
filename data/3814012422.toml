["TimberEmpires.Settings.HordeDetail.Tooltip"]
raw = "The most zombie raccoons drawn at once, among those the camera sees. More makes a thicker horde and costs more each frame."
status = "normal"
enUS = "The maximum number of zombie raccoons drawn at once among those visible to the camera. Higher values create a denser horde and cost more each frame."
zhCN = "镜头可见范围内同时绘制的僵尸浣熊数量上限。数量越多，尸群越密集，每帧的开销也越大。"
zhTW = "鏡頭所見範圍內，同時繪製的殭屍浣熊數量上限。數量越多，殭屍群越密集，每影格的運算成本也越高。"
ruRU = "Максимальное количество енотов-зомби, одновременно отрисовываемых в поле зрения камеры. Чем их больше, тем гуще орда и тем выше нагрузка на каждом кадре."
jaJP = "カメラに映っているゾンビアライグマのうち、一度に描画する最大数。数を増やすと大群が密集し、フレームごとの処理負荷も増える。"
frFR = "Nombre maximal de ratons laveurs zombies affichés simultanément parmi ceux visibles par la caméra. Plus ce nombre est élevé, plus la horde est dense et plus chaque image coûte cher."
deDE = "Die maximale Anzahl an Zombie-Waschbären, die gleichzeitig unter den von der Kamera erfassten zu sehen sind. Mehr davon sorgen für eine dichtere Horde und kosten pro Frame mehr Leistung."
plPL = "Maksymalna liczba zombie-szopów rysowanych jednocześnie spośród tych widocznych dla kamery. Większa liczba zagęszcza hordę i zwiększa koszt każdej klatki."
ptBR = "O maior número de guaxinins zumbis renderizados de uma vez entre os que a câmera vê. Um número maior deixa a horda mais densa e custa mais a cada quadro."
koKR = "카메라에 보이는 좀비 너구리 중 한 번에 표시되는 최대 수입니다. 수가 많을수록 무리가 더 빽빽해지고 프레임마다 더 많은 비용이 듭니다."
csCZ = "Maximální počet zombifikovaných mývalů zobrazených najednou v záběru kamery. Vyšší počet vytváří hustší hordu a zvyšuje nároky na výkon každého snímku."
viVN = "Số gấu mèo thây ma tối đa được hiển thị cùng lúc trong số những con mà camera nhìn thấy. Số lượng cao hơn tạo thành một bầy đông hơn và tốn nhiều tài nguyên hơn mỗi khung hình."
trTR = "Kameranın gördükleri arasından aynı anda çizilen en fazla zombi rakun sayısı. Sayı arttıkça sürü yoğunlaşır ve her karede daha fazla işlem gücü gerekir."

