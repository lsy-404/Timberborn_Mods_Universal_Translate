["Building.TimberEmpires.BanditCamp.Description"]
status = "normal"
raw = "Houses bandits who attack any beaver that comes near and guard their loot."
enUS = "Houses bandits who attack any beaver that comes near and guard their loot."
zhCN = "供土匪居住；他们会攻击任何靠近的海狸，并守卫自己的战利品。"
zhTW = "收留會攻擊任何靠近的海狸並守護戰利品的強盜。"
ruRU = "Здесь живут бандиты, которые нападают на любого бобра, подошедшего близко, и охраняют свою добычу."
jaJP = "近づいてくるビーバーを誰でも襲い、略奪品を守る盗賊たちの住処。"
frFR = "Abrite des bandits qui attaquent tout castor qui s’approche et gardent leur butin."
deDE = "Beherbergt Banditen, die jeden Biber angreifen, der sich nähert, und ihre Beute bewachen."
plPL = "Mieszkają tu bandyci, którzy atakują każdego bobra, który się zbliży, i pilnują swoich łupów."
ptBR = "Abriga bandidos que atacam qualquer castor que se aproxime e protegem seu saque."
koKR = "근처에 오는 비버는 누구든 공격하고 전리품을 지키는 도적들이 머무는 곳입니다."
csCZ = "Ubytuje bandity, kteří napadnou každého bobra, který se přiblíží, a střeží svou kořist."
viVN = "Là nơi ở của bọn cướp, chúng tấn công bất kỳ hải ly nào đến gần và canh giữ chiến lợi phẩm của mình."
trTR = "Yakınına gelen her kunduz sakinine saldıran ve ganimetlerini koruyan haydutlara ev sahipliği yapar."

