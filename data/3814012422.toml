["Building.TimberEmpires.BatteringRam.Description"]
status = "normal"
raw = "Batters the wall, gate or dam in front of it, faster with more warriors aboard."
enUS = "Batters the wall, gate, or dam in front of it faster when carrying more warriors."
zhCN = "撞击前方的墙壁、闸门或堤坝；搭载的战士越多，撞击速度越快。"
zhTW = "衝撞前方的牆、閘門或水壩；船上戰士越多，衝撞速度越快。"
ruRU = "Таранит стену, ворота или плотину перед собой; чем больше воинов на борту, тем быстрее."
jaJP = "前方にある壁、ゲート、またはダムを破壊する。乗っている戦士が多いほど速く破壊できる。"
frFR = "Frappe le mur, la porte ou le barrage devant lui, d’autant plus vite qu’il transporte de guerriers."
deDE = "Rammt die Mauer, das Tor oder den Damm vor ihm. Mit mehr Kriegern an Bord geht es schneller."
plPL = "Uderza w znajdujący się przed nim mur, bramę lub tamę; im więcej wojowników na pokładzie, tym szybciej."
ptBR = "Ataca a muralha, o portão ou a represa à sua frente, mais rápido com mais guerreiros a bordo."
koKR = "앞에 있는 벽, 문 또는 댐을 두드립니다. 전사가 더 많이 타고 있을수록 더 빠르게 두드립니다."
csCZ = "Naráží do zdi, brány nebo přehrady před sebou, čím více bojovníků je na palubě, tím rychleji."
viVN = "Tấn công tường, cổng hoặc đập ở phía trước; càng nhiều chiến binh trên xe, tốc độ càng nhanh."
trTR = "Önündeki duvara, kapıya veya baraja vurur; içinde daha fazla savaşçı olduğunda daha hızlı vurur."

["Building.TimberEmpires.BatteringRam.FlavorDescription"]
status = "normal"
raw = "\"Knock knock.\" \"Who's there?\" \"Not your gate anymore.\""
enUS = "\"Knock knock.\" \"Who's there?\" \"Not your gate anymore.\""
zhCN = "“咚咚咚。”“谁啊？”“你的大门已经不是你的了。”"
zhTW = "「叩叩。」 「誰啊？」 「你的大門已經不是你的了。」"
ruRU = "«Тук-тук». «Кто там?» «Твоих ворот больше нет»."
jaJP = "「コンコン」「誰？」「もうお前の門じゃないよ。」"
frFR = "« Toc, toc. » « Qui est là ? » « Ce n’est plus votre porte. »"
deDE = "„Klopf, klopf.“ „Wer ist da?“ „Dein Tor jedenfalls nicht mehr.“"
plPL = "„Puk, puk”. „Kto tam?” „To już nie twoja brama”."
ptBR = "“ Toc, toc.” “Quem é?” “Não é mais o seu portão.”"
koKR = "“똑똑.” “누구세요?” “이제 네 문이 아니야.”"
csCZ = "„Ťuk, ťuk.“ „Kdo je tam?“ „Už ne tvoje brána.“"
viVN = "“Cốc cốc.” “Ai đấy?” “Cổng của ngươi không còn nữa rồi.”"
trTR = "“Tak tak.” “Kim o?” “Artık senin kapın değil.”"

