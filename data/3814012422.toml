["Building.TimberEmpires.GatehouseDrawbridge.Description"]
status = "normal"
raw = "A gatehouse on a foundation, with a bridge two tiles out from its passage. The bridge raises when the gate shuts. Needs open space under the bridge."
enUS = "A gatehouse on a foundation, with a bridge extending two tiles from its passage. The bridge raises when the gate closes. Requires open space beneath the bridge."
zhCN = "建在地基上的门楼，通道外延伸两格的桥会在门关闭时升起。桥下方需要留出空地。"
zhTW = "建在地基上的門樓，通道外延伸兩格的橋會在閘門關閉時升起。橋下需要留出空間。"
ruRU = "Сторожка на фундаменте с мостом, выступающим на две клетки от прохода. Мост поднимается, когда ворота закрываются. Под мостом должно быть свободное пространство."
jaJP = "基礎の上に建つ門楼で、通路から2タイル先に橋が架かっています。門が閉まると橋が上がります。橋の下には空きスペースが必要です。"
frFR = "Un poste de garde sur une fondation, avec un pont qui s’étend sur deux cases à partir de son passage. Le pont se lève lorsque la porte se ferme. Il faut laisser un espace libre sous le pont."
deDE = "Ein Torhaus auf einem Fundament, mit einer Brücke, die zwei Felder vom Durchgang entfernt ist. Die Brücke hebt sich, wenn sich das Tor schließt. Unter der Brücke muss Platz frei sein."
plPL = "Bramownica na fundamencie, z mostem wysuniętym o dwa pola przed jej przejście. Most podnosi się, gdy brama się zamyka. Pod mostem musi być wolna przestrzeń."
ptBR = "Uma guarita sobre uma fundação, com uma ponte que se estende por dois quadrados a partir de sua passagem. A ponte se ergue quando a guarita fecha. Precisa de espaço livre sob a ponte."
koKR = "기초 위에 세운 문루이며, 통로에서 타일 두 칸 떨어진 곳에 다리가 있습니다. 문이 닫히면 다리가 올라갑니다. 다리 아래에 빈 공간이 필요합니다."
csCZ = "Vrátnice na základu s mostem, který přesahuje dva dílky od jejího průchodu. Most se při zavření brány zvedne. Pod mostem musí být volný prostor."
viVN = "Một nhà cổng đặt trên nền móng, có cầu vươn ra 2 ô tính từ lối đi. Cầu nâng lên khi cổng đóng. Cần khoảng trống bên dưới cầu."
trTR = "Temel üzerine kurulan, geçidinden iki kare uzakta bir köprüsü bulunan kapı binası. Kapı kapandığında köprü kalkar. Köprünün altında boş alan bulunmalıdır."

