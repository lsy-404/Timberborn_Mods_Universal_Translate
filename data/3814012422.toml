plPL = "Włócznie stawia się ostrzem do góry. Ktoś przekonał się o tym na własnej skórze."
ptBR = "As lanças ficam com a ponta para cima. Alguém aprendeu isso da pior maneira."
koKR = "창은 끝이 위를 향하게 꽂아 두세요. 누군가 뼈저리게 깨달은 사실이죠."
trTR = "Mızrakların ucu yukarı bakar. Biri bunu acı bir şekilde öğrenmiş."
esES = "Las lanzas van con la punta hacia arriba. Alguien lo aprendió por las malas."
itIT = "Le lance vanno con la punta verso l'alto. Qualcuno l'ha imparato a proprie spese."
ukUA = "Списи тримають вістрям догори. Хтось дізнався це на власному досвіді."
thTH = "หอกต้องชี้ขึ้นด้านบนเสมอ มีคนเคยเรียนรู้เรื่องนี้มาแล้วด้วยความยากลำบาก"
csCZ = "Kopí míří hrotem vzhůru. Někdo se to naučil tvrdou cestou."
viVN = "Giáo được cắm mũi nhọn hướng lên. Có người đã phải trả giá đắt để học được điều đó."
caES = "Les llances van amb la punta cap amunt. Algú ho va aprendre per les malifetes."
beBY = "Коп'і ставяць вострыём уверх. Нехта пра гэта даведаўся на ўласным досвядзе."
roRO = "Lăncile se înfig cu vârful în sus. Cineva a aflat asta pe cale grea."
huHU = "A lándzsák hegyükkel felfelé állnak. Valaki ezt a nehéz úton tanulta meg."
arSA = "الرماح تُوضع رأسها إلى الأعلى. شخص ما تعلّم ذلك بالطريقة الصعبة."

