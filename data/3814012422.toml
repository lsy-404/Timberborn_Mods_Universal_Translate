["Building.TimberEmpires.LogHoarding.Description"]
status = "normal"
raw = "A gallery on the wall where warriors roll logs down at enemies, knocking over everyone in their path."
enUS = "A gallery on the wall where warriors roll logs down at enemies, knocking over everyone in their path."
zhCN = "墙上的一处廊台，战士们可以从那里把原木滚向敌人，撞倒沿途所有人。"
zhTW = "設置在牆上的廊台，戰士會從上面把原木滾向敵人，撞倒沿途所有人。"
ruRU = "Галерея на стене, откуда воины скатывают брёвна на врагов, сбивая всех на своём пути."
jaJP = "戦士たちが敵に向かって丸太を転がし、進路上の者をなぎ倒す、壁の上の通路。"
frFR = "Une galerie sur le mur d’où les guerriers font rouler des rondins sur les ennemis, renversant tous ceux qui se trouvent sur leur passage."
deDE = "Eine Galerie an der Mauer, von der aus Krieger Baumstämme auf Feinde hinabrollen lassen und jeden umwerfen, der ihnen in die Quere kommt."
plPL = "Galeria na murze, z której wojownicy staczają kłody na wrogów, przewracając wszystkich na swojej drodze."
ptBR = "Uma galeria na muralha de onde os guerreiros rolam troncos contra os inimigos, derrubando todos em seu caminho."
koKR = "전사들이 적을 향해 통나무를 굴려 내려보내며, 경로에 있는 모든 이를 쓰러뜨리는 벽 위의 회랑입니다."
csCZ = "Galerie na zdi, odkud válečníci pouštějí klády na nepřátele a porážejí každého, kdo jim stojí v cestě."
viVN = "Một hành lang trên tường để các chiến binh lăn khúc gỗ xuống phía kẻ địch, quật ngã tất cả những ai trên đường đi của chúng."
trTR = "Savaşçıların düşmanların üzerine kütük yuvarlayarak yollarına çıkan herkesi devirdiği bir sur galerisi."

["Building.TimberEmpires.LogHoarding.FlavorDescription"]
status = "normal"
raw = "\"Timber!\" is shouted out of courtesy, usually too late."
enUS = "\"Timber!\" is shouted out of courtesy, usually too late."
zhCN = "出于礼貌，人们会喊一声“木头！”，但通常已经太迟了。"
zhTW = "「木頭要倒了！」是出於禮貌而喊的，通常喊得太遲。"
ruRU = "«Бревно!» кричат из вежливости, обычно слишком поздно."
jaJP = "「ティンバー！」と礼儀として叫ぶが、たいてい手遅れだ。"
frFR = "« Timber ! » est crié par politesse, généralement trop tard."
deDE = "„Timber!“ ruft man aus Höflichkeit – meist zu spät."
plPL = "„Drzewo!” krzyczy się z grzeczności, zwykle za późno."
ptBR = "“Timber!” é gritado por educação, geralmente tarde demais."
koKR = "예의를 갖추려 “나무 쓰러진다!”라고 외치지만, 대개 너무 늦다."
csCZ = "„Pozor, padá strom!“ se křičí ze zdvořilosti, obvykle příliš pozdě."
viVN = "“Có cây đổ!” được hô lên như một lời lịch sự, thường là quá muộn."
trTR = "“Timber!” diye bağırılır, nezaketen tabii; genellikle çok geç kalınmıştır."

