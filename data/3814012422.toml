deDE = "Vom Spiel gesteuerte Spieler, jeder mit dem für ihn gewählten Schwierigkeitsgrad. Sie haben denselben Kriegsnebel wie du und bauen mit dem, was sie sammeln."
plPL = "Gracze sterowani przez grę, każdy na wybranym dla niego poziomie trudności. Mają taką samą mgłę wojny jak ty i budują z tego, co zbiorą."
