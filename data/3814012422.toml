beBY = "Транспарант, павешаны звонку на сцяне або вежы. Войскі ў яго радыусе наносяць на 6% больш пашкоджанняў. Не складваецца з іншым транспарантам."
roRO = "O pancartă atârnată pe exteriorul unui zid sau al unui turn. Trupele din zona din jurul ei lovesc cu 6% mai puternic. Nu se cumulează cu o altă pancartă."
huHU = "Egy zászló, amely egy fal vagy torony külső oldalán lóg. A közelében lévő csapatok 6%-kal erősebben ütnek. Nem halmozódik egy másik zászlóval."
arSA = "يُعلَّق اللواء على الجانب الخارجي للجدار أو البرج. ترفع القوات في المنطقة المحيطة به قوتها القتالية بنسبة 6%. لا يتراكم تأثيره مع لواء آخر."

