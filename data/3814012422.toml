ruRU = "Стойка со щитами, которую можно разместить в углу прохода на стене или башне либо на земле. Войска поблизости получают на 8% меньше урона. Эффект не складывается с эффектом других щитов."
jaJP = "壁や塔の通路の隅、または地面に設置する盾のラック。周囲の部隊が受けるダメージを8%軽減する。他の盾の効果とは重複しない。"
frFR = "Un râtelier de boucliers placé dans un coin du chemin de ronde d'un mur ou d'une tour, ou posé au sol. Les troupes dans les environs subissent 8 % de dégâts en moins. Ne se cumule pas avec les autres boucliers."
deDE = "Ein Schildständer, der in einer Ecke des Wehrgangs einer Mauer oder eines Turms oder auf dem Boden steht. Truppen in seiner Nähe erleiden 8% weniger Schaden. Der Effekt ist nicht mit dem anderer Schildständer kumulierbar."
plPL = "Stojak z tarczami ustawiony w narożniku chodnika na murze lub wieży albo na ziemi. Oddziały w jego pobliżu otrzymują o 8% mniej obrażeń. Efekt nie kumuluje się z innymi tarczami."
ptBR = "Um suporte de escudos colocado no canto da passagem de uma muralha ou torre, ou no chão. As tropas na área ao redor recebem 8% menos dano. Não se acumula com outros escudos."
koKR = "벽이나 탑의 통로 모퉁이 또는 지면에 설치하는 방패 거치대입니다. 주변 부대는 피해를 8% 덜 받습니다. 다른 방패와 효과가 중첩되지 않습니다."
trTR = "Bir duvarın veya kulenin yürüyüş yolunun köşesinde ya da yerde duran bir kalkan rafı. Yakınındaki birlikler %8 daha az hasar alır. Diğer kalkanlarla birikmez."
esES = "Un estante de escudos colocado en un rincón del adarve de un muro o torre, o en el suelo. Las tropas en el área a su alrededor reciben un 8 % menos de daño. No se acumula con otros escudos."
itIT = "Una rastrelliera di scudi posta in un angolo del camminamento di un muro o di una torre, oppure a terra. Le truppe nell'area circostante subiscono l'8% di danni in meno. Non si somma con altri scudi."
ukUA = "Стійка зі щитами, що стоїть у кутку настилу стіни чи вежі або на землі. Війська в її радіусі отримують на 8% менше пошкоджень. Не сумується з іншими щитами."
thTH = "กองโล่ที่ตั้งอยู่ตามมุมของทางเดินบนกำแพงหรือหอคอย หรือวางบนพื้นดิน ทหารที่อยู่ในบริเวณรอบ ๆ จะได้รับความเสียหายน้อยลง 8% ไม่สามารถรวมผลกับโล่ชนิดอื่นได้"
csCZ = "Stojan se štíty umístěný v rohu ochozu na hradbě nebo věži, případně na zemi. Jednotky v okolí utrpí o 8% menší poškození. Účinek se nesčítá s účinkem dalších štítů."
viVN = "Một giá đỡ khiên đặt ở góc lối đi trên tường hoặc tháp, hoặc trên mặt đất. Quân lính trong khu vực xung quanh chịu ít hơn 8% sát thương. Hiệu ứng không cộng dồn với các khiên khác."
caES = "Un suport de escuts situat en un racó del passeig d'un mur o d'una torre, o a terra. Les tropes a la zona que l'envolta reben un 8% menys de dany. No s'acumula amb altres escuts."
beBY = "Стойка са шчытамі ў куце сцяны ці вежы, на сцежцы аховы або на зямлі. Войскі ў радыусе дзеяння атрымліваюць на 8% менш пашкоджанняў. Не складваецца з іншымі шчытамі."
roRO = "Un raft de scuturi amplasat într-un colț al pasajului unui zid sau turn, sau pe sol. Trupele din zona din jurul lui primesc cu 8% mai puține daune. Nu se adună cu alte scuturi."
huHU = "A falon vagy torony járófelületének sarkában, vagy a földön álló pajzsállvány. A közelében lévő csapatok 8%-kal kevesebb sebzést szenvednek. Más pajzsokkal nem adódik össze."
arSA = "وضعٌ لرفوف الدروع تُوضع في زاوية ممر السور أو البرج، أو على الأرض. تتلقى الوحدات في المنطقة المحيطة بها ضررًا أقل بنسبة 8%. لا تتراكم مع الدروع الأخرى."

