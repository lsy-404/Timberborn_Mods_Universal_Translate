["Building.TimberEmpires.Monastery.Description"]
status = "normal"
raw = "Trains monks. Instead of fighting, they convert enemy troops and siege machines to your side, then wait for their faith to return."
enUS = "Trains monks. Instead of fighting, they convert enemy troops and siege machines to your side, then wait for their faith to return."
zhCN = "训练僧侣。他们不会战斗，而是将敌方部队和攻城器械转化为我方阵营，然后等待他们恢复信仰。"
zhTW = "訓練僧侶。他們不會戰鬥，而是感化敵軍和攻城器械，讓其轉而效忠你方，接著等待他們恢復信仰。"
ruRU = "Обучает монахов. Вместо того чтобы сражаться, они переманивают в ваши ряды вражеских солдат и осадные машины, а затем ждут, пока к ним вернётся вера."
jaJP = "僧侶を育成する。戦う代わりに、敵の兵士や攻城兵器を味方に引き入れ、信仰心が戻るのを待つ。"
frFR = "Forme des moines. Au lieu de combattre, ils rallient à votre cause les troupes ennemies et les machines de siège, puis attendent que leur foi revienne."
deDE = "Bildet Mönche aus. Statt zu kämpfen, bekehren sie feindliche Truppen und Belagerungsmaschinen zu deiner Seite und warten dann, bis ihr Glaube zurückkehrt."
plPL = "Szkoli mnichów. Zamiast walczyć, nawracają wrogie oddziały i machiny oblężnicze na twoją stronę, a potem czekają, aż powróci ich wiara."
ptBR = "Treina monges. Em vez de lutar, eles convertem as tropas e máquinas de cerco inimigas para o seu lado e depois esperam que a fé delas retorne."
koKR = "수도승을 훈련합니다. 적과 싸우는 대신 적군과 공성 병기를 아군으로 전향시키고, 신앙이 돌아올 때까지 기다립니다."
csCZ = "Vychovává mnichy. Místo boje obracejí nepřátelské vojáky a obléhací stroje na vaši stranu, pak čekají, až se jim vrátí víra."
viVN = "Huấn luyện các nhà sư. Thay vì chiến đấu, họ cải hóa quân lính và máy công thành của kẻ địch sang phe bạn, rồi chờ đức tin của họ trở lại."
trTR = "Keşişler yetiştirir. Savaşmak yerine düşman birliklerini ve kuşatma makinelerini kendi tarafına geçirir, ardından inançlarının geri dönmesini beklerler."

