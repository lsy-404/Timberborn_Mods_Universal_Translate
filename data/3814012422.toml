ukUA = "Травники Хвостонародців лікують бійців просто під час бою. Бійці Залізнозубих швидко одужують у польовому лазареті, щойно бій припиняється."
thTH = "นักสมุนไพรของหางไม้รักษาทหารระหว่างการต่อสู้ ส่วนทหารเขี้ยวเหล็กจะฟื้นตัวได้เร็วในสถานพยาบาลสนามเมื่อการต่อสู้ยุติลง"
csCZ = "Bylinkáři Folktails léčí jednotky přímo v boji. Jednotky Iron Teeth se rychle zotaví v polní ošetřovně, jakmile boje skončí."
viVN = "Các thầy thuốc Folktails chữa trị cho quân lính ngay giữa trận chiến. Quân lính Iron Teeth hồi phục nhanh trong bệnh xá dã chiến sau khi giao tranh kết thúc."
caES = "Els herbolaris dels Folktails curen les tropes durant el combat. Les tropes dels Iron Teeth es curen ràpidament en una infermeria de campanya quan s'acaba la lluita."
beBY = "Травнікі Фолктэйлаў лечаць войскі падчас бою. Войскі Жалезных Зубоў хутка вылечваюцца ў палявым лазарэце, калі бой скончыцца."
roRO = "Fitoterapeuții Folktails vindecă trupele în toiul luptei. Trupele Iron Teeth se vindecă rapid într-o infirmerie de campanie după ce luptele se încheie."
huHU = "A Népfarok gyógynövényesei harc közben gyógyítják a csapatokat. A Vasfogak csapatai gyorsan gyógyulnak a tábori gyengélkedőn, amint véget ér a harc."
arSA = "يعالج المعالجون بالأعشاب لدى فولكتيلز الجنود أثناء المعركة. وتتعافى قوات آيرون تيث بسرعة في مستوصف ميداني بعد توقف القتال."

