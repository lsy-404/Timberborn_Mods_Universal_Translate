zhCN = "每隔几晚，不死浣熊就会从废墟中爬出，而且每次数量都会更多；恶潮来袭时，它们还会成群涌来。坚持到黎明吧；如果加入 AI 对手，他们也会与你并肩作战。封住所有废墟，就能终结这一切。"
zhTW = "不死浣熊每隔幾個夜晚便會從廢墟中爬出來，每次數量都更多；壞潮來襲時，更會成群湧現。撐到黎明吧；若你加入 AI 對手，他們也會與你並肩作戰。封住所有廢墟，就能結束這一切。"
ruRU = "Неживые еноты восстают из руин каждые несколько ночей, и с каждым разом их становится всё больше, а с приходом скверного прилива они являются огромным роем. Продержитесь до рассвета, а если добавите противников под управлением ИИ — сражайтесь рядом с ними, и запечатайте все руины, чтобы положить этому конец."
jaJP = "アンデッドのアライグマは数夜ごとに廃墟から現れ、そのたびに数が増えていきます。そしてバッドタイドが来ると、大群となって押し寄せます。AIの対戦相手を追加すれば彼らも味方に加わります。夜明けまで持ちこたえ、すべての廃墟を封鎖して終わらせましょう。"
frFR = "Les ratons laveurs morts-vivants sortent des ruines toutes les quelques nuits, toujours plus nombreux, et en une immense horde lorsque la marée toxique arrive. Tenez jusqu’à l’aube, avec des adversaires contrôlés par l’IA à vos côtés si vous les ajoutez, et scellez toutes les ruines pour mettre fin à cette menace."
deDE = "Die untoten Waschbären erheben sich alle paar Nächte aus den Ruinen, jedes Mal werden es mehr, und wenn die Schadflut kommt, bilden sie einen riesigen Schwarm. Halte bis zum Morgengrauen durch, mit KI-Gegnern an deiner Seite, wenn du welche hinzufügst, und versiegle jede Ruine, um dem Ganzen ein Ende zu setzen."
plPL = "Nieumarłe szopy wychodzą z ruin co kilka nocy, za każdym razem w większej liczbie, a gdy nadciąga fala skażonej wody — całymi hordami. Przetrwaj do świtu, z przeciwnikami SI u boku, jeśli ich dodasz, i zapieczętuj wszystkie ruiny, aby położyć temu kres."
ptBR = "Os guaxinins mortos-vivos surgem das ruínas a cada poucas noites, em número cada vez maior, e em um enxame gigantesco quando chega a maré tóxica. Resista até o amanhecer, com oponentes de IA ao seu lado se você os adicionar, e sele todas as ruínas para acabar com isso."
koKR = "언데드 너구리들이 몇 밤마다 폐허에서 일어나며, 그 수는 매번 늘어나고 나쁜 물결이 닥치면 거대한 무리를 이룹니다. AI 상대를 추가했다면 그들과 함께 버티며 새벽까지 살아남고, 모든 폐허를 봉인해 사태를 끝내세요."
trTR = "Yaşayan ölü rakunlar birkaç gecede bir harabelerden yükselir; her seferinde sayıları artar ve kötü gelgit geldiğinde büyük bir sürü hâlinde ortaya çıkarlar. Şafak sökene kadar dayanın; eklerseniz yanınızda yapay zekâ rakipleri de olur. Bunu sona erdirmek için tüm harabeleri kapatın."
esES = "Los mapaches no muertos surgen de las ruinas cada pocas noches, cada vez más, y en un gran enjambre cuando llega la marea de mal tiempo. Aguanta hasta el amanecer, con oponentes IA a tu lado si los añades, y sella cada ruina para acabar con ello."
itIT = "Gli zombi procioni emergono dalle rovine ogni poche notti, sempre più numerosi ogni volta, e in un grande sciame quando arriva la marea malefica. Resisti fino all'alba, con avversari IA al tuo fianco se ne aggiungi, e sigilla ogni rovina per porre fine alla minaccia."
ukUA = "Нежиті єноти піднімаються з руїн майже кожної кілька ночей, щоразу дедалі більше, а коли настає badtide, їх виходить величезний рій. Тримайтеся до світанку, поруч із вами стоятимуть ШІ-гравці, якщо ви їх додасте. Щоб покінчити з цим, запечатайте кожну руїну."
thTH = "แร็กคูนอมตะผุดขึ้นจากซากปรักหักพังทุกสองสามคืน และจำนวนจะมากขึ้นทุกครั้ง เมื่อ badtide มาถึง พวกมันจะรวมตัวกันเป็นฝูงใหญ่ จงยืนหยัดให้ถึงรุ่งสาง โดยมี AI ที่เข้าร่วมอยู่เคียงข้างคุณหากคุณเพิ่มเข้ามา และปิดผนึกซากปรักหักพังทุกแห่งเพื่อยุติเหตุการณ์นี้"
csCZ = "Nemrtví mývalové se každých pár nocí zvedají z ruin a pokaždé jich přibývá. Když přijde příliv zkažené vody, vyrazí v obrovském hejnu. Vydržte až do svítání, případně s AI protivníky po boku, pokud je přidáte, a uzavřete všechny ruiny, abyste tomu učinili přítrž."
viVN = "Lũ gấu mèo xác sống trỗi dậy từ đống đổ nát sau mỗi vài đêm, mỗi lần lại đông hơn, và kéo đến thành một bầy khổng lồ khi triều độc ập đến. Cầm cự đến bình minh, có các đối thủ AI sát cánh nếu bạn thêm họ vào, rồi phong ấn mọi tàn tích để chấm dứt mọi chuyện."
caES = "Els mapatxes morts sorgeixen de les ruïnes cada poques nits, cada cop més, i en un gran eixam quan arriba la marea dolenta. Aguanta fins a l'alba, amb jugadors IA al teu costat si n'afegeixes, i segella totes les ruïnes per acabar-ho."
beBY = "Нежывыя енотаў паўстаюць з руін кожныя некалькі начэй, з кожным разам ўсё больш, а пры надыходзе бядотаў — вялікім роем. Вытрымайце да світання; калі дадаяце ШІ-супернікаў, яны будуць побач з вамі. Каб спыніць гэта, запячатайце кожную руіну."
roRO = "Raconii nemorti se ridică din ruine la fiecare câteva nopți, din ce în ce mai mulți de fiecare dată, și într-un mare roi când vine badtide-ul. Rezistă până în zori, cu jucători AI alături de tine dacă îi adaugi, și sigilează fiecare ruină ca să pui capăt acestui lucru."
huHU = "Az élőhalott mosómedvék néhány éjszakánként felemelkednek a romokból, minden alkalommal többen, a badtide érkezésekor pedig hatalmas rajban. Tartsatok ki hajnalig – ha AI-ellenfeleket is hozzáadtatok, mellettetek fognak harcolni –, és zárjatok le minden romot, hogy véget vessetek neki."
arSA = "تظهر الراكونات الميتة الحية من الأنقاض كل بضع ليالٍ، وتزداد عددًا في كل مرة، وتأتي في سرب ضخم عند قدوم الفيضان الملوث. اصمد حتى الفجر، ومعك لاعبو الذكاء الاصطناعي بجانبك إن أضفتهم، وأغلق كل الأنقاض لإنهاء الأمر."

["TimberEmpires.Alliances.Horde"]
raw = "Against the horde there are no rivals. Every colony stands with the others."
status = "normal"
enUS = "Against the horde, there are no rivals. Every colony stands with the others."
zhCN = "面对这支大军，无人能与之抗衡。每个殖民地都与其他殖民地并肩作战。"
zhTW = "面對這群暴徒，沒有任何對手。每個殖民地都與其他殖民地並肩作戰。"
ruRU = "Перед ордой нет соперников. Каждая колония стоит плечом к плечу с остальными."
jaJP = "大群に敵う者はいない。すべてのコロニーが互いに手を取り合う。"
frFR = "Face à la horde, aucun rival ne fait le poids. Chaque colonie soutient les autres."
deDE = "Gegen die Horde gibt es keine Rivalen. Jede Kolonie steht den anderen bei."
plPL = "Przeciwko hordzie nie ma równych. Każda kolonia stoi po stronie pozostałych."
ptBR = "Contra a horda, não há rivais. Todas as colônias estão unidas."
koKR = "이 무리를 상대할 경쟁자는 없다. 모든 식민지가 서로를 지지한다."
trTR = "Horda karşısında rakip yoktur. Her koloni diğerlerinin yanındadır."
esES = "Contra la horda no hay rivales. Cada colonia se mantiene junto a las demás."
itIT = "Contro l'orda non esistono rivali. Ogni colonia si schiera con le altre."
ukUA = "Проти орди немає суперників. Кожна колонія стоїть поруч з іншими."
thTH = "ต่อกรกับฝูงอสูรแล้ว ไม่มีคู่แข่งอีกต่อไป ทุกอาณานิคมยืนเคียงข้างกันเสมอ"
csCZ = "Proti hordě není žádný soupeř. Každá kolonie stojí po boku ostatních."
viVN = "Trước bầy đàn, không ai là đối thủ. Mọi thuộc địa đều sát cánh bên nhau."
caES = "Contra la massa no hi ha rivals. Cada colònia es posa al costat de les altres."
beBY = "Перад ордай няма супернікаў. Кожная калонія стаіць разам з іншымі."
roRO = "Împotriva hoardei nu există rivali. Fiecare colonie stă alături de celelalte."
huHU = "A horda ellen nincsenek riválisok. Minden kolónia a többiek mellett áll."
arSA = "ضد الحشد لا توجد منافسة. كل مستعمرة تقف إلى جانب الأخريات."

