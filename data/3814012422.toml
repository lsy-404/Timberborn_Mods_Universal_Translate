frFR = "Des boucliers de rechange accrochés à l'extérieur d'un mur ou d'une tour. Les troupes à proximité subissent 8 % de dégâts en moins. Ne se cumule pas avec d'autres boucliers."
deDE = "Ersatzschilde, die außen an einer Mauer oder einem Turm hängen. Truppen in der Umgebung erleiden 8 % weniger Schaden. Der Effekt addiert sich nicht mit anderen Schilden."
plPL = "Zapasowe tarcze zawieszone na zewnętrznej stronie muru lub wieży. Oddziały w pobliżu otrzymują o 8% mniej obrażeń. Efekt nie kumuluje się z innymi tarczami."
