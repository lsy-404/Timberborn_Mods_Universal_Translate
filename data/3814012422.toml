["TimberEmpires.Founding.Prompt"]
raw = "Place your District Center anywhere to found your settlement. It's built at once, with beavers, food and water to start."
status = "normal"
enUS = "Place your District Center anywhere to found your settlement. It’s built immediately, with beavers, food, and water to get you started."
zhCN = "在任意位置放置区中心，即可建立你的殖民地。放置后立即建成，并配有海狸居民、食物和初始用水。"
zhTW = "將你的行政中心放置在任意位置，即可建立聚落。它會立即建成，並配有海狸、食物和水，讓你開始發展。"
ruRU = "Разместите центр района где угодно, чтобы основать своё поселение. Он будет построен сразу, а вместе с ним появятся бобры, еда и вода для начала."
jaJP = "入植地を開くには、地区センターを好きな場所に設置してください。ビーバー、食料、水とともに、すぐに建設されます。"
frFR = "Placez votre centre de district où vous le souhaitez pour fonder votre colonie. Il est construit immédiatement, avec des castors, de la nourriture et de l’eau pour commencer."
deDE = "Platziere dein Bezirkszentrum an einem beliebigen Ort, um deine Siedlung zu gründen. Es wird sofort errichtet, mit Bibern, Nahrung und Wasser für den Start."
plPL = "Umieść Centrum dzielnicy w dowolnym miejscu, aby założyć swoją osadę. Zostanie zbudowane natychmiast, wraz z bobrami, żywnością i wodą na początek."
ptBR = "Coloque seu Centro do Distrito em qualquer lugar para fundar seu assentamento. Ele é construído na hora, com castores, comida e água para começar."
koKR = "정착지를 세우려면 구역 중심지를 원하는 곳에 배치하세요. 비버와 식량, 물이 함께 즉시 건설됩니다."
csCZ = "Umístěte centrum okrsku kamkoli a založte svou osadu. Postaví se okamžitě, spolu s bobry, jídlem a vodou na začátek."
viVN = "Đặt Trung tâm Quận ở bất kỳ đâu để lập khu định cư của bạn. Công trình được xây dựng ngay lập tức, kèm theo hải ly, thức ăn và nước để bắt đầu."
trTR = "Yerleşiminizi kurmak için Bölge Merkezinizi istediğiniz yere yerleştirin. Kunduzlar, yiyecek ve suyla birlikte hemen inşa edilir."

