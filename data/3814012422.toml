frFR = "Son équipage en récupère davantage dans un entrepôt ou un chariot de ravitaillement situé à moins de {0} cases. Les transporteurs en apportent aussi si le bâtiment se trouve à moins de {1} cases de vos routes."
deDE = "Die Besatzung holt mehr aus einem Lager oder Versorgungskarren in einem Umkreis von {0} Feldern. Transportarbeiter bringen ebenfalls Nachschub, wenn es höchstens {1} Felder von deinen Straßen entfernt ist."
plPL = "Jego załoga przynosi więcej z magazynu lub wózka z zaopatrzeniem w promieniu {0} pól. Tragarze również je dostarczają, jeśli znajduje się w odległości {1} pól od dróg."
ptBR = "Sua equipe busca mais munição em um depósito ou carrinho de suprimentos a até {0} blocos de distância. Os carregadores também a trazem quando ela está a até {1} blocos das suas estradas."
koKR = "승무원은 {0}타일 이내에 있는 창고나 보급 수레에서 더 가져옵니다. 운반꾼도 도로에서 {1}타일 이내에 있으면 탄약을 가져옵니다."
csCZ = "Jeho posádka si přinese další zásoby ze skladu nebo zásobovacího vozíku do vzdálenosti {0} polí. Nosiči mu je také přinesou, pokud se nachází do vzdálenosti {1} polí od vašich cest."
viVN = "Đội ngũ của công trình sẽ lấy thêm đạn từ kho hoặc xe tiếp tế trong phạm vi {0} ô. Người vận chuyển cũng sẽ mang đạn đến nếu công trình nằm trong phạm vi {1} ô tính từ đường của bạn."
