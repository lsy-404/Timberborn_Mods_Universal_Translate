["Building.TimberEmpires.WallBanner.Description"]
raw = "A banner standing in a corner of a wall's or tower's walk, or on the ground. Troops in the area round it hit 6% harder. Doesn't add up with another banner."
status = "normal"
enUS = "A banner placed in a corner of a wall or tower walkway, or on the ground. Troops in the area around it hit 6% harder. Does not stack with another banner."
zhCN = "一面旗帜，可立在墙体或塔楼走道的角落，也可立在地面上。附近区域内的部队造成的伤害提高 6%。效果不会与其他旗帜叠加。"
zhTW = "可立於牆壁或塔樓走道角落，也可立在地面。附近的部隊造成的傷害提高 6%。效果不會與其他旗幟疊加。"
ruRU = "Знамя, которое можно установить в углу прохода на стене или башне либо на земле. Отряды поблизости наносят на 6% больше урона. Эффект не суммируется с эффектом другого знамени."
jaJP = "壁や塔の歩道の隅、または地面に立てる旗。この周囲にいる部隊の攻撃力が6%上昇する。別の旗とは効果が重複しない。"
frFR = "Une bannière installée dans un angle de la coursive d'un mur ou d'une tour, ou au sol. Les troupes à proximité infligent 6 % de dégâts supplémentaires. Ne se cumule pas avec une autre bannière."
deDE = "Ein Banner, das in einer Ecke des Wehrgangs einer Mauer oder eines Turms oder auf dem Boden steht. Truppen in seiner Umgebung schlagen 6 % härter zu. Der Bonus lässt sich nicht mit dem eines anderen Banners kumulieren."
plPL = "Sztandar stojący w narożniku muru lub na chodniku wieży albo na ziemi. Oddziały w pobliżu zadają o 6% większe obrażenia. Nie kumuluje się z innym sztandarem."
ptBR = "Um estandarte que fica num canto do caminho sobre uma muralha ou torre, ou no chão. As tropas na área ao redor dele causam 6% mais dano. O efeito não se acumula com o de outro estandarte."
koKR = "벽이나 탑의 통로 모서리 또는 지면에 세우는 깃발입니다. 주변 부대는 6% 더 강하게 공격합니다. 다른 깃발과 효과가 중첩되지 않습니다."
csCZ = "Prapor umístěný v rohu ochozu zdi či věže nebo na zemi. Jednotky v jeho okolí udělují o 6 % vyšší poškození. S účinkem jiného praporu se nesčítá."
viVN = "Một biểu ngữ được dựng ở góc lối đi trên tường hoặc tháp, hoặc trên mặt đất. Quân lính trong khu vực quanh biểu ngữ gây sát thương mạnh hơn 6%. Hiệu ứng không cộng dồn với biểu ngữ khác."
trTR = "Bir duvarın veya kulenin yürüyüş yolunun köşesine ya da yere dikilen bir sancak. Yakınındaki birlikler %6 daha sert vurur. Başka bir sancakla etkisi birikmez."

["Building.TimberEmpires.WallBanner.FlavorDescription"]
raw = "Beavers fight better under a flag they can see."
status = "normal"
enUS = "Beavers fight better under a flag they can see."
zhCN = "海狸在能看到旗帜时战斗力更强。"
zhTW = "海狸在看得見的旗幟下戰鬥時會更英勇。"
ruRU = "Бобры лучше сражаются под знаменем, которое видят."
jaJP = "ビーバーは、自分たちに見える旗の下ではより勇敢に戦う。"
frFR = "Les castors se battent mieux sous un drapeau qu’ils peuvent voir."
deDE = "Biber kämpfen besser unter einer Flagge, die sie sehen können."
plPL = "Bobry walczą lepiej pod flagą, którą widzą."
ptBR = "Os castores lutam melhor sob uma bandeira que conseguem ver."
koKR = "비버들은 볼 수 있는 깃발 아래에서 더 잘 싸운다."
csCZ = "Bobři bojují lépe pod vlajkou, kterou vidí."
viVN = "Hải ly chiến đấu tốt hơn dưới lá cờ mà chúng nhìn thấy."
