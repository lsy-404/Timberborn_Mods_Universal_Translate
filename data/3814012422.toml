["TimberEmpires.Settings.SharedColony.Tooltip"]
raw = "Everyone builds one colony together, with the same goods and science. Off, each player starts their own."
status = "normal"
enUS = "Everyone builds one colony together, sharing the same goods and science. When off, each player starts their own colony."
zhCN = "开启时，所有玩家共同建设一个殖民地，共享货物和科技点数。关闭时，每位玩家各自开始建设自己的殖民地。"
zhTW = "開啟時，所有人共同建設同一個殖民地，共用物資與科學點數。關閉時，每位玩家都會建立自己的殖民地。"
ruRU = "Все вместе строят одну колонию, используя общие товары и науку. Если отключить эту настройку, каждый игрок начинает собственную колонию."
jaJP = "オンの場合、全員で同じ物資と科学を共有する1つのコロニーを建設します。オフの場合、各プレイヤーがそれぞれ自分のコロニーを開始します。"
frFR = "Tout le monde construit une colonie commune, avec les mêmes marchandises et les mêmes points de science. Désactivé, chaque joueur commence avec sa propre colonie."
deDE = "Alle bauen gemeinsam eine Kolonie mit denselben Waren und derselben Wissenschaft. Aus: Jeder Spieler beginnt mit einer eigenen Kolonie."
plPL = "Wszyscy wspólnie budują jedną kolonię i korzystają z tych samych towarów oraz punktów nauki. Po wyłączeniu tej opcji każdy gracz zaczyna z własną kolonią."
ptBR = "Todos constroem uma única colônia juntos, com os mesmos bens e pontos de ciência. Desativado: cada jogador começa com sua própria colônia."
koKR = "활성화하면 모두가 같은 물자와 과학을 공유하며 하나의 식민지를 함께 건설합니다. 비활성화하면 각 플레이어가 자신만의 식민지를 시작합니다."
trTR = "Açıkken herkes aynı malları ve bilimi paylaşarak tek bir koloniyi birlikte kurar. Kapalıyken her oyuncu kendi kolonisini kurar."
esES = "Todos construyen una sola colonia juntos, con los mismos bienes y ciencia. Desactivado, cada jugador empieza la suya propia."
itIT = "Tutti costruiscono un'unica colonia insieme, condividendo gli stessi beni e la stessa scienza. Se disattivata, ogni giocatore avvia la propria."
ukUA = "Усі будують одну колонію разом, з однаковими товарами та наукою. Якщо вимкнено, кожен гравець починає власну."
thTH = "ทุกคนสร้างอาณานิคมเดียวร่วมกัน ใช้สินค้าและการวิจัยเดียวกัน เมื่อปิดใช้งาน ผู้เล่นแต่ละคนจะเริ่มอาณานิคมของตนเอง"
csCZ = "Zapnuto: všichni společně budují jednu kolonii se stejnými zásobami zboží a vědeckými body. Vypnuto: každý hráč začíná s vlastní kolonií."
viVN = "Bật: Mọi người cùng xây dựng một khu định cư, dùng chung hàng hóa và điểm khoa học. Tắt: Mỗi người chơi bắt đầu khu định cư riêng."
caES = "Tothom construeix una sola colònia junts, amb els mateixos béns i la mateixa ciència. Desactivat, cada jugador comença la seva pròpia."
beBY = "Усе гулец будуе адну калонію разам, з агульнымі таварамі і навукай. Калі выключана, кожны гулец пачынае сваю ўласную."
roRO = "Toată lumea construiește o singură colonie împreună, cu aceleași bunuri și aceeași știință. Dezactivat, fiecare jucător începe propria colonie."
huHU = "Mindenki közösen egy kolóniát épít, közös árukkal és tudománnyal. Kikapcsolva mindenki a saját kolóniáját kezdi."
arSA = "الجميع يبني مستعمرة واحدة معًا، بنفس الموارد والعلوم. عند الإيقاف، يبدأ كل لاعب مستعمرته الخاصة."

