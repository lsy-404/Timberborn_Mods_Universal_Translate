trTR = "Sürüler, onlarla iyi başa çıktığınızda büyür, kayıplar verdiğinizde ise azalır. Kapalı olması bu özelliği devre dışı bırakır."
esES = "Las hordas crecen cuando las gestionas bien y disminuyen cuando sufres bajas. Desactivado lo apaga."
itIT = "Le orde diventano più numerose quando le gestisci bene e rallentano quando subisci perdite. Off lo disattiva."
ukUA = "Зграї стають більшими, якщо ви добре з ними справляєтеся, і зменшуються, коли несете втрати. Вимкнено вимикає цю функцію."
thTH = "ฝูงจะขยายใหญ่ขึ้นเมื่อคุณจัดการได้ดี และจะลดขนาดลงเมื่อคุณสูญเสียกำลังพล ตั้งค่าเป็นปิดเพื่อปิดการทำงานของฟีเจอร์นี้"
csCZ = "Hordy se zvětšují, když se s nimi dobře vypořádáte, a po vašich ztrátách polevují. Vypnuto je deaktivuje."
viVN = "Đàn thú đông hơn khi bạn xử lý chúng tốt và giảm bớt khi bạn chịu tổn thất. Tắt để vô hiệu hóa tính năng này."
caES = "Les hordes creixen quan les gestiones bé i es redueixen quan pateixes pèrdues. Desactivat ho desactiva."
beBY = "Арды растуць, калі вы добра з імі спраўляецеся, і зніжаюцца пасля страт. Выключана адключае гэту функцыю."
roRO = "Hoardele devin mai mari când le gestionezi bine și se domolesc când suferi pierderi. Dezactivat oprește această funcție."
huHU = "A hordák nagyobbak lesznek, ha jól bánsz velük, és kisebbek, ha veszteségeket szenvedsz el. Az Ki kikapcsolja ezt."
arSA = "ترتفع أعداد الجحافل عندما تُحسن إدارتها، وتنخفض عندما تتكبد خسائر. وإيقاف الخيار يعطله."

