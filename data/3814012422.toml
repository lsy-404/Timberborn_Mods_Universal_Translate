["Building.TimberEmpires.SiegeTower.Description"]
new = "Rolls up to a wall and lets the warriors aboard out onto its walk."
status = "normal"
enUS = "Rolls up to a wall and lets the warriors aboard out onto its walkway."
zhCN = "滚到墙边，让里面的战士从塔上走出去。"
ruRU = "Подкатывает к стене и выпускает находящихся внутри воинов на стену."
jaJP = "壁まで進み、搭乗している戦士たちを壁の上の通路へ降ろす。"
frFR = "Se déplace jusqu’à un mur et permet aux guerriers à son bord d’accéder au chemin de ronde."
deDE = "Fährt bis an eine Mauer heran und lässt die Krieger an Bord auf ihren Wehrgang steigen."
plPL = "Podjeżdża pod mur i wypuszcza znajdujących się na pokładzie wojowników na jego chodnik."
ptBR = "Aproxima-se de uma muralha e permite que os guerreiros a bordo saiam para cima dela."
koKR = "벽까지 굴러가 전사들이 탑에 올라 벽의 통로로 나갈 수 있게 합니다."
csCZ = "Dojede až ke zdi a vypustí válečníky na palubě na ochoz zdi."
viVN = "Di chuyển đến sát tường rồi cho các chiến binh bên trong đi ra lối đi trên tường."
trTR = "Bir duvarın yanına yanaşır ve içindeki savaşçıların duvar yoluna çıkmasını sağlar."

["Building.TimberEmpires.SiegeTower.FlavorDescription"]
status = "normal"
raw = "Stairs took beavers to the next level. Siege towers take them to someone else's."
enUS = "Stairs took beavers to the next level. Siege towers take them to someone else’s."
zhCN = "楼梯能把海狸带到上一层。攻城塔则能把它们送到别人家那边。"
zhTW = "樓梯能帶海狸前往下一層。攻城塔則能帶牠們前往別人的地盤。"
ruRU = "Лестницы поднимали бобров на следующий уровень. Осадные башни поднимают их на чужой."
jaJP = "階段はビーバーたちを次の階へ導いた。攻城塔は、よその誰かのところへ連れて行く。"
frFR = "Les escaliers menaient les castors au niveau supérieur. Les tours de siège les mènent chez quelqu’un d’autre."
deDE = "Treppen brachten Biber auf die nächste Ebene. Belagerungstürme bringen sie auf die eines anderen."
plPL = "Schody prowadzą bobry na kolejny poziom. Wieże oblężnicze — do kogoś innego."
ptBR = "As escadas levavam os castores ao próximo nível. As torres de cerco os levam até o território de outra pessoa."
koKR = "계단은 비버들을 다음 층으로 데려갔습니다. 공성탑은 남의 층으로 데려갑니다."
csCZ = "Schody vedou bobry do dalšího patra. Obléhací věže je zavedou k někomu jinému."
viVN = "Cầu thang đưa hải ly lên tầng tiếp theo. Tháp công thành đưa chúng đến chỗ của người khác."
trTR = "Merdivenler kunduzları bir sonraki kata çıkarır. Kuşatma kuleleriyse onları başkasınınkine çıkarır."

