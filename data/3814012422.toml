ruRU = "Даже стене нужна опора."
jaJP = "壁だって、支えが必要だ。"
frFR = "Même un mur a besoin d’un coup de pouce."
deDE = "Selbst eine Mauer braucht manchmal Unterstützung."
plPL = "Nawet ściana potrzebuje podparcia."
ptBR = "Até uma parede precisa de uma mãozinha."
koKR = "벽도 받쳐 줄 다리가 필요하다."
