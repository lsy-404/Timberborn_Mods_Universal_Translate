["TimberEmpires.Settings.TopBarShowsOwnDistricts.Tooltip"]
raw = "With no district selected, the top bar, the well-being panel and the population graphs only count the districts you own. If you own none, they count the whole settlement."
status = "normal"
enUS = "With no district selected, the top bar, well-being panel, and population graphs count only the districts you own. If you own none, they count the entire settlement."
zhCN = "未选中任何区划时，顶部栏、幸福度面板和人口图表只统计你拥有的区划。如果你一个区划都没有，则统计整个定居点。"
zhTW = "未選取任何區域時，頂端列、幸福感面板和人口圖表只會統計你所擁有的區域。如果你沒有任何區域，就會統計整個聚落。"
ruRU = "Если район не выбран, верхняя панель, панель благополучия и графики населения учитывают только районы, которыми вы владеете. Если у вас нет ни одного района, они учитывают всё поселение."
jaJP = "地区を選択していない場合、トップバー、幸福度パネル、人口グラフには、自分が所有する地区のみが集計されます。地区を所有していない場合は、集落全体が集計されます。"
frFR = "Lorsqu’aucun district n’est sélectionné, la barre supérieure, le panneau de bien-être et les graphiques de population ne prennent en compte que les districts que vous possédez. Si vous n’en possédez aucun, ils prennent en compte toute la colonie."
deDE = "Wenn kein Bezirk ausgewählt ist, berücksichtigen die obere Leiste, die Wohlbefindensanzeige und die Bevölkerungsdiagramme nur die Bezirke, die dir gehören. Wenn dir keine gehören, berücksichtigen sie die gesamte Siedlung."
plPL = "Gdy nie wybrano żadnej dzielnicy, pasek u góry, panel dobrostanu i wykresy populacji uwzględniają tylko dzielnice, które posiadasz. Jeśli nie posiadasz żadnej, uwzględniają całą osadę."
ptBR = "Sem nenhum distrito selecionado, a barra superior, o painel de bem-estar e os gráficos populacionais contabilizam apenas os distritos que você possui. Se você não possuir nenhum, eles contabilizam todo o assentamento."
koKR = "지구를 선택하지 않으면 상단 표시줄, 행복도 패널, 인구 그래프에는 보유한 지구만 집계됩니다. 보유한 지구가 하나도 없으면 정착지 전체가 집계됩니다."
csCZ = "Není-li vybrána žádná čtvrť, horní lišta, panel blahobytu a grafy populace započítávají pouze čtvrti, které vlastníte. Pokud nevlastníte žádnou, započítávají celou osadu."
viVN = "Khi không có khu định cư nào được chọn, thanh trên cùng, bảng phúc lợi và biểu đồ dân số chỉ tính các khu định cư bạn sở hữu. Nếu bạn không sở hữu khu định cư nào, chúng sẽ tính toàn bộ khu định cư."
trTR = "Hiçbir bölge seçili değilken üst çubuk, refah paneli ve nüfus grafikleri yalnızca sahip olduğunuz bölgeleri sayar. Hiçbir bölgeniz yoksa tüm yerleşimi sayarlar."

