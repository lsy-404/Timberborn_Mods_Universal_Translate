trTR = "İşçilerini birlikler olarak eğitir: savaşçılar, mızraklılar veya fraksiyona özgü tür."

["Building.TimberEmpires.Barracks.FlavorDescription"]
status = "normal"
raw = "Beavers were made for chewing, not fighting. These ones chew angrily."
enUS = "Beavers were made for chewing, not fighting. These ones chew angrily."
zhCN = "海狸天生会啃东西，不会打架。这些家伙啃得很愤怒。"
zhTW = "海狸天生就會啃東西，不會打架。這些傢伙啃得氣呼呼的。"
ruRU = "Бобры созданы для того, чтобы грызть, а не драться. Эти грызут со злостью."
jaJP = "ビーバーは戦うためではなく、かじるために生まれた。この連中は怒りながらかじる。"
frFR = "Les castors sont faits pour ronger, pas pour se battre. Ceux-là rongent avec rage."
deDE = "Biber sind zum Nagen geschaffen, nicht zum Kämpfen. Diese hier nagen wütend."
plPL = "Bobry stworzono do gryzienia, nie do walki. Te gryzą ze złością."
ptBR = "Os castores foram feitos para roer, não para lutar. Estes roem com raiva."
koKR = "비버는 싸움이 아니라 갉아먹도록 만들어졌다. 이 녀석들은 화가 난 채로 갉아먹는다."
csCZ = "Bobři jsou stvoření k hlodání, ne k boji. Tihle hlodají vztekle."
viVN = "Hải ly sinh ra để gặm nhấm, chứ không phải chiến đấu. Đám này gặm nhấm trong cơn giận dữ."
trTR = "Kunduzlar savaşmak için değil, kemirmek için yaratılmıştır. Bunlar öfkeyle kemirir."

