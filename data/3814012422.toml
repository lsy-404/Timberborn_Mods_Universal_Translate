jaJP = "浮遊機雷を放ち、流れに乗って漂流させ、接触すると爆発します。"
frFR = "Largue des mines flottantes qui dérivent avec le courant et explosent au contact."
deDE = "Setzt schwimmende Minen frei, die mit der Strömung treiben und bei Berührung explodieren."
plPL = "Wypuszcza pływające miny, które dryfują z prądem i wybuchają przy kontakcie."
