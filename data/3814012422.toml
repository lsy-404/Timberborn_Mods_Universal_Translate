koKR = "“나무 넘어간다!”라고 예의상 외치지만, 대개는 너무 늦다."
trTR = "Nezaketen “Ağaç!” diye bağırılır, genellikle çok geç kalınır."
esES = "\"¡Madera!\" se grita por cortesía, normalmente demasiado tarde."
itIT = "«Albero!» si grida per cortesia, di solito troppo tardi."
ukUA = "«Дерево!» вигукують із ввічливості, зазвичай надто пізно."
thTH = "ตะโกนว่า “ไม้ล้ม!” เพื่อเตือนด้วยความหวังดี ซึ่งมักจะสายเกินไป."
csCZ = "„Pozor, padá strom!“ se křičí ze slušnosti, obvykle však příliš pozdě."
viVN = "“Có cây đổ!” được hét lên như một phép lịch sự, thường là quá muộn."
caES = "«Fusta!» se sol cridar per cortesia, normalment massa tard."
beBY = "«Дрэва падае!» крычаць з ветлівасці, звычайна ўжо занадта позна."
roRO = "„Copac!” se strigă din politețe, de obicei prea târziu."
huHU = "A „Dől a fa!” kiáltás udvariasságból hangzik el, általában túl későn."
arSA = "«خشب!» يُصرخ بها من باب المجاملة، وغالبًا ما يكون ذلك بعد فوات الأوان."

