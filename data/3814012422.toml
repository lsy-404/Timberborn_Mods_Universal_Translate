["Building.TimberEmpires.ClaimFlag.Description"]
raw = "Claims the land around it while its brazier burns, so other players can't build there. Reaches further from high ground. Sends an automation signal while enemy troops are on its land."
status = "normal"
enUS = "Claims the land around it while its brazier burns, preventing other players from building there. Reaches farther from high ground. Sends an automation signal while enemy troops are on its land."
zhCN = "只要火盆燃烧，就会宣示其周围的土地所有权，阻止其他玩家在此建造。建在高处时，宣示范围更远。敌方部队进入其领地时，会发送自动化信号。"
zhTW = "只要火盆燃燒，就會宣告周圍土地的所有權，讓其他玩家無法在那裡建造。建在高處時，宣告範圍會更遠。敵方部隊在其領地上時，會傳送自動化訊號。"
ruRU = "Пока жаровня горит, объявляет окружающую территорию своей, не позволяя другим игрокам строить на ней. С возвышенности охватывает большую площадь. Подаёт сигнал автоматизации, когда на его территории находятся войска противника."
jaJP = "火鉢が燃えている間、その周囲の土地を領有し、他のプレイヤーがそこに建設できないようにする。高所に建てると、より遠くまで届く。敵の部隊が領有地にいる間、自動化信号を送る。"
frFR = "Revendiquer le terrain autour de lui tant que son brasero brûle, empêchant ainsi les autres joueurs d’y construire. Sa portée augmente lorsqu’il est placé en hauteur. Envoie un signal d’automatisation lorsque des troupes ennemies se trouvent sur son terrain."
deDE = "Beansprucht das umliegende Land, solange sein Kohlebecken brennt, sodass andere Spieler dort nicht bauen können. Reicht von höher gelegenem Gelände aus weiter. Sendet ein Automatisierungssignal, solange sich feindliche Truppen auf seinem Land befinden."
plPL = "Zajmuje teren wokół siebie, gdy płonie w nim koksownik, uniemożliwiając innym graczom budowanie na tym obszarze. Zasięg zwiększa się na wyżej położonym terenie. Wysyła sygnał automatyzacji, gdy na jego terenie znajdują się wrogie oddziały."
ptBR = "Reivindica o território ao seu redor enquanto seu braseiro estiver aceso, impedindo que outros jogadores construam ali. Seu alcance aumenta em terrenos elevados. Envia um sinal de automação enquanto houver tropas inimigas em seu território."
koKR = "화로가 타오르는 동안 주변 땅을 점유해 다른 플레이어가 그곳에 건물을 지을 수 없게 합니다. 높은 지대에서는 더 멀리까지 땅을 점유합니다. 적군이 점유한 땅에 있으면 자동화 신호를 보냅니다."
csCZ = "Zabírá okolní území, dokud hoří jeho ohniště, takže tam ostatní hráči nemohou stavět. Z vyvýšeného místa dosáhne dál. Vysílá automatizační signál, když se na jeho území nacházejí nepřátelské jednotky."
viVN = "Chiếm vùng đất xung quanh khi lò than của nó còn cháy, ngăn người chơi khác xây dựng tại đó. Tầm chiếm đất xa hơn khi đặt ở nơi cao. Phát tín hiệu tự động hóa khi có quân địch trên vùng đất của nó."
trTR = "Meşalesi yandığı sürece çevresindeki araziyi sahiplenir ve diğer oyuncuların oraya inşa etmesini engeller. Yüksek bir konumdan daha uzağa ulaşır. Düşman birlikleri arazisindeyken bir otomasyon sinyali gönderir."

