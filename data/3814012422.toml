["TimberEmpires.NeedsCoOpPvPEdition"]
status = "normal"
raw = "Timber Empires needs BeaverBuddies Co-Op/PvP Edition, but the original BeaverBuddies is running. Disable it and subscribe to the Co-Op/PvP Edition, or multiplayer games will go out of sync."
enUS = "Timber Empires requires BeaverBuddies Co-Op/PvP Edition, but the original BeaverBuddies is running. Disable it and subscribe to the Co-Op/PvP Edition, or multiplayer games will go out of sync."
zhCN = "《海狸帝国》需要《海狸伙伴联机/PvP 版》，但目前运行的是原版《海狸伙伴》。请禁用原版并订阅联机/PvP 版，否则多人游戏将会失去同步。"
zhTW = "「木材帝國」需要《海狸夥伴：合作／PvP 版》，但目前正在執行原版《海狸夥伴》。請停用原版並訂閱合作／PvP 版，否則多人遊戲將會不同步。"
ruRU = "Для Timber Empires требуется BeaverBuddies Co-Op/PvP Edition, но запущена оригинальная версия BeaverBuddies. Отключите её и подпишитесь на Co-Op/PvP Edition, иначе в сетевой игре возникнут рассинхронизации."
jaJP = "Timber EmpiresにはBeaverBuddies Co-Op/PvP Editionが必要ですが、元のBeaverBuddiesが有効になっています。元のBeaverBuddiesを無効にして、Co-Op/PvP Editionをサブスクライブしてください。そうしないと、マルチプレイヤーゲームで同期ずれが発生します。"
frFR = "Timber Empires nécessite BeaverBuddies Co-Op/PvP Edition, mais la version originale de BeaverBuddies est en cours d’exécution. Désactivez-la et abonnez-vous à Co-Op/PvP Edition, sinon les parties multijoueur se désynchroniseront."
deDE = "Timber Empires benötigt BeaverBuddies Co-Op/PvP Edition, aber das ursprüngliche BeaverBuddies ist aktiv. Deaktiviere es und abonniere die Co-Op/PvP Edition, sonst geraten Mehrspielerpartien außer Sync."
plPL = "Timber Empires wymaga wersji BeaverBuddies Co-Op/PvP Edition, ale uruchomiona jest oryginalna wersja BeaverBuddies. Wyłącz ją i zasubskrybuj wersję Co-Op/PvP Edition, w przeciwnym razie gry wieloosobowe utracą synchronizację."
ptBR = "Timber Empires precisa da edição Co-Op/PvP do BeaverBuddies, mas o BeaverBuddies original está em execução. Desative-o e assine a edição Co-Op/PvP, ou as partidas multijogador ficarão dessincronizadas."
koKR = "Timber Empires에는 BeaverBuddies 협동/PvP 에디션이 필요하지만, 원본 BeaverBuddies가 실행 중입니다. 원본을 비활성화하고 협동/PvP 에디션을 구독하세요. 그렇지 않으면 멀티플레이어 게임의 동기화가 어긋납니다."
csCZ = "Timber Empires vyžaduje BeaverBuddies Co-Op/PvP Edition, ale původní BeaverBuddies je aktivní. Vypněte ho a přihlaste se k odběru Co-Op/PvP Edition, jinak se hry pro více hráčů rozjedou."
viVN = "Timber Empires cần BeaverBuddies Co-Op/PvP Edition, nhưng BeaverBuddies bản gốc đang chạy. Hãy tắt bản đó và đăng ký BeaverBuddies Co-Op/PvP Edition, nếu không các trò chơi nhiều người chơi sẽ bị mất đồng bộ."
trTR = "Timber Empires, BeaverBuddies Co-Op/PvP Edition'ı gerektiriyor, ancak orijinal BeaverBuddies etkin. Onu devre dışı bırakıp Co-Op/PvP Edition'a abone olun; aksi takdirde çok oyunculu oyunların eşitlemesi bozulur."

