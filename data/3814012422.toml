["Building.TimberEmpires.FieldInfirmary.Description"]
raw = "A healing tub on wheels for after a battle. Once no enemy is in sight, wounded troops take turns lying in it and heal fast while its doses last. A dose is 1 extract and 2 berries. Its crew only moves it."
status = "normal"
enUS = "A healing tub on wheels for after a battle. Once no enemy is in sight, wounded troops take turns lying in it and heal quickly while its doses last. Each dose is 1 extract and 2 berries. Its crew only moves it."
zhCN = "战后使用的轮式治疗浴缸。视野内没有敌人后，受伤的部队会轮流躺进去，只要药剂还有剩余，就能快速恢复。一剂药剂需要 1 份提取物和 2 颗浆果。工作人员只负责移动它。"
zhTW = "戰後使用的輪式療傷浴桶。視野內沒有敵人時，受傷的士兵會輪流躺進桶裡，在藥劑用完前快速療傷。每劑需要 1 份萃取物和 2 顆莓果。工作人員只負責移動它。"
ruRU = "Передвижная лечебная купель для восстановления после битвы. Когда врагов не видно, раненые бойцы по очереди ложатся в неё и быстро лечатся, пока не закончатся снадобья. Одно снадобье состоит из 1 экстракта и 2 ягод. Экипаж только перемещает купель."
jaJP = "戦闘後のための車輪付き治療槽。敵が視界にいなくなると、負傷した兵士たちが交代で横たわり、薬がある間はすばやく回復する。薬1回分は抽出物1個とベリー2個。乗組員はこれを移動させるだけ。"
frFR = "Une baignoire de soins sur roues pour l’après-bataille. Dès qu’aucun ennemi n’est en vue, les troupes blessées s’y allongent à tour de rôle et guérissent rapidement tant qu’il reste des doses. Une dose coûte 1 extrait et 2 baies. Son équipage ne fait que la déplacer."
deDE = "Eine rollende Heilwanne für die Zeit nach einer Schlacht. Sobald kein Feind mehr in Sicht ist, legen sich verwundete Truppen abwechselnd hinein und heilen schnell, solange die Dosen reichen. Eine Dosis besteht aus 1 Extrakt und 2 Beeren. Die Besatzung bewegt sie nur."
plPL = "Mobilna balia lecznicza na czas po bitwie. Gdy w zasięgu wzroku nie ma już wrogów, ranne oddziały kładą się w niej na zmianę i szybko się leczą, dopóki wystarczą dawki. Jedna dawka to 1 ekstrakt i 2 jagody. Załoga tylko ją przemieszcza."
ptBR = "Uma banheira de cura sobre rodas para depois de uma batalha. Quando não há inimigos à vista, as tropas feridas se revezam para se deitar nela e se curam rapidamente enquanto durarem as doses. Cada dose custa 1 extrato e 2 frutas silvestres. A equipe só a transporta."
koKR = "전투 후를 위한 바퀴 달린 치료 욕조입니다. 적이 보이지 않으면 부상당한 병사들이 번갈아 욕조에 누워, 약제가 남아 있는 동안 빠르게 회복합니다. 약제 1회분은 추출물 1개와 열매 2개입니다. 승무원은 이 욕조를 옮기기만 합니다."
csCZ = "Pojízdná léčebná káď pro chvíle po bitvě. Jakmile není na dohled žádný nepřítel, zranění vojáci se v ní střídají a rychle se uzdravují, dokud nedojdou dávky. Jedna dávka spotřebuje 1 extrakt a 2 bobule. Její posádka ji pouze přesouvá."
viVN = "Một bồn chữa thương có bánh xe dùng sau trận chiến. Khi không còn kẻ địch nào trong tầm mắt, binh lính bị thương thay phiên nằm trong bồn và hồi phục nhanh khi vẫn còn liều thuốc. Mỗi liều gồm 1 tinh chất và 2 quả mọng. Đội ngũ của bồn chỉ di chuyển nó."
trTR = "Savaştan sonra kullanmak için tekerlekli bir şifa küveti. Görüş alanında düşman kalmadığında, yaralı askerler sırayla küvete girip dozlar sürdüğü müddetçe hızla iyileşir. Bir doz 1 özüt ve 2 yemişten oluşur. Mürettebatı yalnızca küveti hareket ettirir."

