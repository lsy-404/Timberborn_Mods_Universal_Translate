["Building.TimberEmpires.WallBrazier.Description"]
raw = "A fire basket on a wall, burning pine resin. Archers on the wall within two pieces of it shoot fire arrows at resin puddles. Now and then one gets burned."
status = "normal"
enUS = "A fire basket on a wall, burning pine resin. Archers on the wall within two pieces of it shoot fire arrows at resin puddles. Now and then one gets burned."
zhCN = "墙上的火盆，燃烧着松脂。墙上距离火盆两格以内的弓箭手会向松脂积液射出火箭。偶尔会有人被烧伤。"
zhTW = "牆上的火盆，燃燒著松脂。牆上距離火盆兩格以內的弓箭手會向松脂水窪射出火箭。偶爾會有人被燒傷。"
ruRU = "Жаровня на стене, в которой горит сосновая смола. Лучники на стене в пределах двух её секций стреляют огненными стрелами по лужам смолы. Время от времени кто-нибудь обжигается."
jaJP = "松脂を燃やす壁掛けの火かご。壁の上でこれから2区画以内にいる射手は、松脂の水たまりに火矢を放つ。時々、誰かが火傷する。"
frFR = "Un brasero mural alimenté à la résine de pin. Les archers postés sur le mur à moins de deux segments tirent des flèches enflammées sur les flaques de résine. De temps à autre, l’un d’eux se brûle."
deDE = "Ein Feuerkorb an einer Wand, in dem Kiefernharz brennt. Bogenschützen auf der Wand innerhalb von zwei Teilen davon schießen Feuerpfeile auf Harzpfützen. Ab und zu verbrennt sich jemand."
plPL = "Kosz ogniowy na murze, w którym pali się żywica sosnowa. Łucznicy na murze, znajdujący się w odległości nie większej niż dwa elementy od kosza, strzelają ognistymi strzałami w kałuże żywicy. Od czasu do czasu któryś się poparzy."
ptBR = "Um braseiro na muralha, queimando resina de pinheiro. Arqueiros na muralha a até duas peças dele disparam flechas incendiárias contra poças de resina. De vez em quando, alguém se queima."
koKR = "소나무 수지를 태우는 벽걸이 화로입니다. 화로에서 두 칸 이내의 벽에 있는 궁수들은 수지 웅덩이를 향해 불화살을 쏩니다. 가끔 궁수 한 명이 불에 타기도 합니다."
csCZ = "Nástěnný koš s ohněm, v němž hoří borovicová pryskyřice. Lučištníci na hradbě do dvou dílů od něj střílejí ohnivé šípy do louží pryskyřice. Čas od času se někdo popálí."
viVN = "Một giỏ lửa trên tường, đốt nhựa thông. Cung thủ trên tường trong phạm vi hai đoạn tường tính từ nó bắn tên lửa vào các vũng nhựa thông. Thỉnh thoảng, có người bị bỏng."
trTR = "Duvar üzerinde çam reçinesi yakan bir ateş sepeti. Ateş sepetinin iki parça uzağındaki duvarlarda bulunan okçular, reçine birikintilerine ateşli oklar atar. Arada sırada biri yanar."

