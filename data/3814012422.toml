["Building.TimberEmpires.BatteringRam.Description"]
raw = "Batters the wall, gate or dam in front of it, faster with more troops aboard."
status = "normal"
enUS = "Batters the wall, gate, or dam in front of it, faster with more troops aboard."
zhCN = "冲击前方的墙壁、闸门或堤坝；车上的士兵越多，冲击速度越快。"
zhTW = "撞擊前方的牆壁、閘門或水壩；搭載的士兵越多，撞擊速度越快。"
ruRU = "Таранит находящиеся перед ним стены, ворота или плотины. Чем больше бойцов на борту, тем быстрее."
jaJP = "前方にある壁、ゲート、またはダムに突撃します。乗っている兵士が多いほど、速く突撃します。"
frFR = "Frappe le mur, la porte ou le barrage devant lui, plus rapidement avec davantage de soldats à bord."
deDE = "Rammt die Mauer, das Tor oder den Damm davor – mit mehr Truppen an Bord schneller."
plPL = "Uderza w znajdujący się przed nim mur, bramę lub tamę; im więcej żołnierzy na pokładzie, tym szybciej."
ptBR = "Golpeia a parede, o portão ou a barragem à sua frente, mais rápido com mais tropas a bordo."
koKR = "앞에 있는 벽, 문 또는 댐을 들이받으며, 탑승 인원이 많을수록 더 빠르게 공격합니다."
csCZ = "Naráží do zdi, brány nebo hráze před sebou; čím více osadníků je na něm, tím rychleji."
viVN = "Húc vào tường, cổng hoặc đập phía trước; càng có nhiều quân trên xe, xe càng húc nhanh."
trTR = "Önündeki duvara, kapıya veya baraja vurur; üzerinde daha fazla asker varsa daha hızlı vurur."

["Building.TimberEmpires.BatteringRam.FlavorDescription"]
raw = "\"Knock knock.\" \"Who's there?\" \"Not your gate anymore.\""
status = "normal"
enUS = "\"Knock knock.\" \"Who's there?\" \"Not your gate anymore.\""
zhCN = "“咚咚咚。”“谁啊？”“你的大门已经不是你的了。”"
zhTW = "「叩叩。」 「誰啊？」 「你的大門已經不是你的了。」"
ruRU = "«Тук-тук». «Кто там?» «Твои ворота уже не твои»."
jaJP = "「コンコン」「どなた？」「もうあなたの門じゃないよ。」"
frFR = "« Toc toc. » « Qui est là ? » « Plus ta porte, en tout cas. »"
deDE = "„Klopf, klopf.“ „Wer ist da?“ „Dein Tor gehört dir nicht mehr.“"
plPL = "„Puk, puk”. „Kto tam?”. „Już nie twoja brama”."
ptBR = "“Toc, toc.” “Quem é?” “Não é mais o seu portão.”"
koKR = "“똑똑.” “누구세요?” “이젠 네 문이 아니야.”"
csCZ = "„Ťuk, ťuk.“ „Kdo je tam?“ „Už ne tvoje brána.“"
viVN = "“Cốc cốc.” “Ai đấy?” “Cổng của ngươi không còn nữa đâu.”"
trTR = "“Tak tak.” “Kim o?” “Artık senin kapın değil.”"

