["Building.TimberEmpires.RoundTower.Description"]
status = "normal"
raw = "Taller than a wall tower, with an open top for a catapult, ballista or trebuchet. With a crew aboard, the machine on it shoots the nearest enemy in reach on its own."
enUS = "Taller than a wall tower, with an open top for a catapult, ballista, or trebuchet. With a crew aboard, the machine on top automatically shoots the nearest enemy within range."
zhCN = "比墙塔更高，顶部敞开，可供弹射器、弩炮或投石机使用。配备乘员后，塔上的机器会自动射击射程内最近的敌人。"
zhTW = "比城牆塔高，頂部開放，可供投石機、弩砲或配重式投石機使用。搭載船員後，上面的機械會自動射擊射程內最近的敵人。"
ruRU = "Выше башни на стене, с открытым верхом для катапульты, баллисты или требушета. Если на башне есть экипаж, установленная на ней машина сама стреляет по ближайшему врагу в пределах досягаемости."
jaJP = "壁塔より高く、カタパルト、バリスタ、またはトレビュシェットを設置できるよう上部が開いている。乗組員が乗り込むと、搭載した兵器が射程内で最も近い敵を自動で攻撃する。"
frFR = "Plus haute qu’une tour murale, avec un sommet ouvert pour accueillir une catapulte, une baliste ou un trébuchet. Avec un équipage à bord, la machine qui s’y trouve tire automatiquement sur l’ennemi le plus proche à portée."
deDE = "Höher als ein Mauerturm, mit offenem Dach für ein Katapult, eine Balliste oder ein Trebuchet. Mit einer Besatzung an Bord schießt die darauf befindliche Maschine selbstständig auf den nächstgelegenen Gegner in Reichweite."
plPL = "Wyższa niż wieża na murze, z otwartym szczytem na katapultę, balistę lub trebusz. Gdy załoga jest na pokładzie, umieszczona na niej maszyna samodzielnie ostrzeliwuje najbliższego wroga w zasięgu."
ptBR = "Mais alta que uma torre de muralha, com o topo aberto para uma catapulta, balista ou trabuco. Com uma tripulação a bordo, a máquina sobre ela dispara automaticamente contra o inimigo mais próximo ao alcance."
koKR = "성벽 탑보다 높으며, 투석기, 쇠뇌 또는 트레뷰셋을 설치할 수 있도록 위쪽이 열려 있습니다. 승무원이 탑승하면, 그 위의 기계가 사정거리 내에서 가장 가까운 적을 자동으로 공격합니다."
csCZ = "Vyšší než věž na hradbě, s otevřeným vrškem pro katapult, balistu nebo trebuchet. Pokud je obsluhována posádkou, střílí stroj na ní automaticky po nejbližším nepříteli v dosahu."
viVN = "Cao hơn tháp tường, có phần đỉnh mở để đặt máy bắn đá, nỏ lớn hoặc máy bắn đá đối trọng. Khi có kíp điều khiển, cỗ máy trên tháp sẽ tự bắn kẻ địch gần nhất trong tầm bắn."
trTR = "Bir sur kulesinden daha yüksek, mancınık, balista veya trebuşet için üstü açık. Mürettebatı olduğunda üzerindeki makine, menziline giren en yakın düşmana kendi kendine ateş eder."

["Building.TimberEmpires.RoundTower.FlavorDescription"]
status = "normal"
raw = "No roof. Plenty of rocks."
enUS = "No roof. Plenty of rocks."
zhCN = "没有屋顶。石头倒是不少。"
zhTW = "沒有屋頂。石頭倒是不少。"
ruRU = "Нет крыши. Камней в избытке."
jaJP = "屋根はない。岩はたっぷりある。"
frFR = "Pas de toit. Beaucoup de pierres."
deDE = "Kein Dach. Jede Menge Felsen."
plPL = "Bez dachu. Mnóstwo kamieni."
ptBR = "Sem teto. Muitas pedras."
koKR = "지붕은 없다. 바위는 충분하다."
csCZ = "Bez střechy. Spousta kamenů."
viVN = "Không có mái. Rất nhiều đá."
trTR = "Çatı yok. Bolca kaya var."

