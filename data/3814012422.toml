["TimberEmpires.NeedsCoOpPvPEdition"]
raw = "Multiplayer in Timber Empires needs BeaverBuddies Co-Op/PvP Edition, but the original BeaverBuddies is running. Disable it and subscribe to the Co-Op/PvP Edition, or multiplayer games will go out of sync."
status = "normal"
enUS = "Multiplayer in Timber Empires needs BeaverBuddies Co-Op/PvP Edition, but the original BeaverBuddies is running. Disable it and subscribe to the Co-Op/PvP Edition, or multiplayer games will go out of sync."
zhCN = "《海狸浮生记：帝国》需要 BeaverBuddies Co-Op/PvP Edition，但当前运行的是原版 BeaverBuddies。请禁用原版并订阅 Co-Op/PvP Edition，否则多人游戏将出现不同步。"
zhTW = "《海狸帝國》的多人遊戲需要《海狸好友》合作／PvP 版，但目前啟用的是原版《海狸好友》。請停用原版並訂閱合作／PvP 版，否則多人遊戲會不同步。"
ruRU = "Многопользовательская игра в Timber Empires требует BeaverBuddies Co-Op/PvP Edition, но сейчас запущена исходная версия BeaverBuddies. Отключите её и подпишитесь на Co-Op/PvP Edition, иначе в многопользовательских играх возникнет рассинхронизация."
jaJP = "Timber Empiresのマルチプレイには BeaverBuddies Co-Op/PvP Edition が必要ですが、元の BeaverBuddies が実行中です。元の BeaverBuddies を無効にして Co-Op/PvP Edition をサブスクライブしてください。そうしないと、マルチプレイのゲームが同期しなくなります。"
frFR = "Le multijoueur de Timber Empires nécessite BeaverBuddies Co-Op/PvP Edition, mais la version originale de BeaverBuddies est active. Désactivez-la et abonnez-vous à Co-Op/PvP Edition, sinon les parties multijoueur ne seront plus synchronisées."
deDE = "Mehrspieler in Timber Empires benötigt BeaverBuddies Co-Op/PvP Edition, aber das ursprüngliche BeaverBuddies läuft gerade. Deaktiviere es und abonniere die Co-Op/PvP Edition, sonst geraten Mehrspielerpartien aus dem Takt."
plPL = "Tryb wieloosobowy w Timber Empires wymaga wersji Co-Op/PvP moda BeaverBuddies, ale działa oryginalny BeaverBuddies. Wyłącz go i zasubskrybuj wersję Co-Op/PvP, w przeciwnym razie gry wieloosobowe utracą synchronizację."
ptBR = "Multijogador em Timber Empires precisa da BeaverBuddies Co-Op/PvP Edition, mas o BeaverBuddies original está em execução. Desative-o e assine a Co-Op/PvP Edition, ou as partidas multijogador ficarão dessincronizadas."
koKR = "Timber Empires에서 멀티플레이를 하려면 BeaverBuddies Co-Op/PvP Edition이 필요하지만, 원본 BeaverBuddies가 실행 중입니다. 원본을 비활성화하고 Co-Op/PvP Edition을 구독하세요. 그렇지 않으면 멀티플레이 게임이 동기화되지 않습니다."
trTR = "Timber Empires'da çok oyunculu mod, BeaverBuddies Co-Op/PvP Edition gerektirir, ancak orijinal BeaverBuddies çalışıyor. Orijinalini devre dışı bırakın ve Co-Op/PvP Edition'a abone olun; aksi takdirde çok oyunculu oyunlar senkronizasyondan çıkar."
esES = "El modo multijugador de Timber Empires necesita BeaverBuddies Co-Op/PvP Edition, pero el BeaverBuddies original está activo. Desactívalo y suscríbete a Co-Op/PvP Edition, o las partidas multijugador se desincronizarán."
itIT = "Il multigiocatore in Timber Empires richiede BeaverBuddies Co-Op/PvP Edition, ma è attivo il BeaverBuddies originale. Disattivalo e iscriviti alla Co-Op/PvP Edition, altrimenti le partite multigiocatore andranno fuori sincronia."
ukUA = "Мультиплеєр у Timber Empires потребує BeaverBuddies Co-Op/PvP Edition, але працює оригінальний BeaverBuddies. Вимкніть його та підпишіться на Co-Op/PvP Edition, інакше ігри в мультиплеєрі розсинхронізуються."
thTH = "มัลติเพลเยอร์ใน Timber Empires ต้องใช้ BeaverBuddies Co-Op/PvP Edition แต่ตอนนี้ BeaverBuddies รุ่นดั้งเดิมกำลังทำงานอยู่ ให้ปิดการใช้งานรุ่นดั้งเดิมและติดตาม Co-Op/PvP Edition ไม่เช่นนั้นเกมมัลติเพลเยอร์จะไม่ซิงค์กัน"
csCZ = "Multiplayer v Timber Empires vyžaduje BeaverBuddies Co-Op/PvP Edition, ale je spuštěn původní BeaverBuddies. Vypněte jej a přihlaste se k odběru Co-Op/PvP Edition, jinak hry pro více hráčů přestanou být synchronizované."
viVN = "Timber Empires cần BeaverBuddies Co-Op/PvP Edition, nhưng BeaverBuddies bản gốc đang chạy. Hãy tắt mod đó và đăng ký BeaverBuddies Co-Op/PvP Edition, nếu không các trận nhiều người chơi sẽ bị mất đồng bộ."
caES = "El multijugador de Timber Empires necessita BeaverBuddies Co-Op/PvP Edition, però l'original BeaverBuddies està en execució. Desactiva'l i subscriu-te a la Co-Op/PvP Edition, o les partides multijugador es desincronitzaran."
beBY = "Мультыплеер у Timber Empires патрабуе BeaverBuddies Co-Op/PvP Edition, але працуе арыгінальны BeaverBuddies. Адключыце яго і падпішыцеся на Co-Op/PvP Edition, інакш мультыплеерныя гульні зваротна не сінхранізуюцца."
roRO = "Multiplayer în Timber Empires necesită BeaverBuddies Co-Op/PvP Edition, dar originalul BeaverBuddies este activ. Dezactivează-l și abonează-te la Co-Op/PvP Edition, altfel jocurile multiplayer se vor desincroniza."
huHU = "Többjátékos mód a Timber Empires-ben a BeaverBuddies Co-Op/PvP Edition modot igényli, de az eredeti BeaverBuddies fut. Kapcsold ki, és iratkozz fel a Co-Op/PvP Editionre, különben a többjátékos játékok szinkronon kívül kerülnek."
arSA = "تتطلب ميزة اللعب الجماعي في Timber Empires وجود BeaverBuddies Co-Op/PvP Edition، لكن النسخة الأصلية من BeaverBuddies تعمل حالياً. عطّلها واشترك في Co-Op/PvP Edition، وإلا فستخرج ألعاب اللعب الجماعي عن التزامن."

