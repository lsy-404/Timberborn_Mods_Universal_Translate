thTH = "ดั่งนกฟีนิกซ์ ให้พวกมันเกิดใหม่จากไฟและเถ้าถ่าน"
csCZ = "Jako Fénix, ať se znovu narodí z ohně a popela."
viVN = "Giống như Phượng Hoàng, hãy để chúng được tái sinh từ ngọn lửa và tro tàn."
caES = "Com un Fènix, que renaixin del foc i de les cendres."
beBY = "Як фенікс, хай яны адродзяцца з вогню і попелу."
roRO = "Ca o pasăre Phoenix, lasă-i să renască din foc și cenușă."
