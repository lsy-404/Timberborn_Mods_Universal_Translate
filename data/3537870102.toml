plPL = "Edytowana pogoda została zapisana. Czy chcesz załadować tę zapis? (Kontynuowanie rozgrywki w tej sesji może powodować problemy)"
ptBR = "O tempo editado foi salvo. Você quer carregar essa salva? (Continuar jogando nesta sessão pode causar problemas)"
koKR = "편집된 날씨가 저장되었습니다.\n이 저장을 불러오시겠습니까?\n(현재 세션으로 계속 플레이하면 문제가 발생할 수 있습니다.)"
trTR = "Düzenlenen hava durumu kaydedildi.\nBu kaydı yüklemek istiyor musun?\n(Bu oturumla oynamaya devam etmek sorunlara yol açabilir)"
esES = "El clima editado se guardó.\n¿Quieres cargar ese guardado?\n(Seguir jugando con esta sesión puede causar problemas)"
itIT = "La previsione meteo modificata è stata salvata.\nVuoi caricare quel salvataggio?\n(Continuare a giocare con questa sessione potrebbe causare problemi)"
ukUA = "Редагована погода була збережена.\nБажаєте завантажити це збереження?\n(Продовження гри в цій сесії може призвести до проблем)"
thTH = "การตั้งค่าสภาพอากาศที่แก้ไขได้ถูกบันทึกแล้ว\nคุณต้องการโหลดการบันทึกนั้นหรือไม่\n(การเล่นต่อในเซสชันนี้อาจทำให้เกิดปัญหา)"
csCZ = "Upravené počasí bylo uloženo.  \nChcete načíst tuto uloženou pozici?  \n(Pokračování v hraní s touto relací může způsobit problémy)"
viVN = "Thời tiết đã được chỉnh sửa và lưu.\nBạn có muốn tải bản lưu đó không?\n(Tiếp tục chơi với phiên này có thể gây ra sự cố)"
