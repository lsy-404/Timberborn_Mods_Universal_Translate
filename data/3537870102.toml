zhTW = "編輯的天氣已儲存。  \n您想要載入該儲存檔嗎？  \n（繼續在此會話中遊玩可能會導致問題）"
ruRU = "Отредактированная погода была сохранена. Вы хотите загрузить это сохранение? (Продолжение игры в этой сессии может вызвать проблемы)"
jaJP = "編集された天候が保存されました。  \nそのセーブをロードしますか？  \n（このセッションでのプレイを続けると問題が発生する可能性があります）"
frFR = "Le temps modifié a été sauvegardé. Voulez-vous charger cette sauvegarde ? (Continuer à jouer avec cette session peut causer des problèmes)"
