ukUA = "Кожна велика залізниця потребує місця, де можна розвантажити вантаж."
thTH = "ทางรถไฟที่ยอดเยี่ยมทุกเส้นย่อมต้องมีจุดสำหรับขนถ่ายสินค้าลง"
