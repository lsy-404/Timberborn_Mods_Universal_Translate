["Tobbert.TrackOneWay.Description"]
raw = "A Track Piece that goes straight. Can be changed to be a one way signal using the toggle when clicking on it. Creates a track section between one ways that allow a single train to be on it (indicated by the colors)."
status = "abandoned"
enUS = "A straight track piece. Can be changed to a one-way signal using the toggle when clicked. Creates a track section between one-way signals that allows a single train on it (indicated by the colors)."
zhCN = "一段直线轨道。点击时可通过切换选项将其改为单向信号。它会在两个单向信号之间创建一段轨道区段，该区段只允许一列火车通行（以颜色标示）。"
zhTW = "一種直線軌道。點擊時可使用切換按鈕將其改為單向號誌。它會在兩個單向號誌之間建立一段軌道，讓單一列車行駛（以顏色表示）。"
ruRU = "Прямой участок пути. Щёлкните по нему, чтобы переключателем сделать его односторонним сигналом. Создаёт участок пути между односторонними сигналами, на котором может находиться только один поезд (это показывают цвета)."
jaJP = "直線の線路パーツです。クリック時に表示される切り替えボタンで、一方通行信号に変更できます。一方通行信号の間に線路区間を作り、その区間には列車が1編成だけ入れるようにします（色で示されます）。"
frFR = "Un tronçon de voie rectiligne. Peut être transformé en signal à sens unique à l’aide de l’interrupteur qui apparaît quand on clique dessus. Crée une section de voie entre deux signaux à sens unique, sur laquelle un seul train peut se trouver (comme l’indiquent les couleurs)."
deDE = "Ein gerades Gleisstück. Kann über den Umschalter beim Anklicken in ein Einwegsignal geändert werden. Bildet einen Gleisabschnitt zwischen Einwegsignalen, auf dem sich jeweils nur ein Zug befinden darf (durch die Farben angezeigt)."
plPL = "Prosty odcinek torów. Można go zmienić w sygnalizator jednokierunkowy za pomocą przełącznika widocznego po kliknięciu. Tworzy odcinek torów między sygnalizatorami jednokierunkowymi, na którym może znajdować się tylko jeden pociąg (wskazują to kolory)."
ptBR = "Uma peça de trilho reto. Pode ser alterada para se tornar um sinal de sentido único usando a opção de alternância ao clicar nela. Cria um trecho de trilho entre sinais de sentido único que permite a passagem de apenas um trem por vez (indicado pelas cores)."
koKR = "직선으로 이어지는 선로입니다. 클릭할 때 표시되는 토글을 사용해 일방통행 신호로 바꿀 수 있습니다. 일방통행 신호 사이에 선로 구간을 만들어 열차 한 대만 진입할 수 있게 합니다(색상으로 표시)."
csCZ = "Rovný díl koleje. Kliknutím na něj a přepnutím lze nastavit jednosměrný signál. Vytváří úsek koleje mezi jednosměrnými signály, na kterém může být vždy jen jeden vlak (označeno barvami)."
viVN = "Một đoạn đường ray đi thẳng. Có thể chuyển thành tín hiệu một chiều bằng cách bật/tắt khi nhấp vào đoạn đường ray. Tạo một đoạn đường ray giữa các tín hiệu một chiều, cho phép một đoàn tàu duy nhất đi trên đó (được biểu thị bằng màu sắc)."
trTR = "Düz giden bir Ray Parçası. Üzerine tıkladığınızda çıkan açma-kapama düğmesiyle tek yönlü sinyale dönüştürülebilir. Tek bir trenin girebildiği bir ray bölümü oluşturmak için iki tek yönlü sinyal arasına yerleştirilir (renklerle gösterilir)."

