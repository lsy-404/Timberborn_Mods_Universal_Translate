["Tobbert.GoodsStation.Description"]
raw = "Loads and unloads goods carried by trains. Set, good by good, what the station sends and what it receives; workers take from and drop off at it directly, while haulers shuttle goods to and from the district's storage."
status = "abandoned"
enUS = "Loads and unloads goods carried by trains. Set, goods by good, what the station sends and receives; workers take goods from and drop them off directly at the station, while haulers shuttle goods to and from the district's storage."
zhCN = "装卸列车运载的货物。可以逐种货物设置车站发出和接收的货物；工人会直接从车站取货或将货物送到车站，而搬运工则负责往返于车站和区内仓库之间运送货物。"
zhTW = "裝卸火車運送的貨物。可逐項設定車站要送出和接收哪些貨物；工人會直接從車站取放貨物，而搬運工則負責往返於車站和區域倉庫運送貨物。"
ruRU = "Загружает и разгружает товары, перевозимые поездами. Настройте отдельно для каждого товара, что станция отправляет и что принимает; рабочие доставляют товары прямо на станцию и забирают их оттуда, а грузчики перевозят товары между станцией и складом района."
jaJP = "列車が運ぶ品物を積み降ろします。品物ごとに、駅が送るものと受け取るものを設定します。作業員は駅から直接品物を受け取り、駅に品物を置きます。一方、運搬人は地区の保管庫との間で品物を運びます。"
frFR = "Charge et décharge les marchandises transportées par les trains. Définissez, marchandise par marchandise, ce que la gare expédie et reçoit ; les ouvriers y prennent et y déposent directement les marchandises, tandis que les transporteurs les acheminent depuis et vers les réserves du district."
deDE = "Lädt Güter, die von Zügen transportiert werden, ab und auf. Lege für jede Ware fest, was der Bahnhof versendet und empfängt. Arbeiter holen Waren direkt dort ab und liefern sie dort ab, während Transportarbeiter Waren zum Lager des Bezirks bringen und von dort abholen."
plPL = "Załadowuje i rozładowuje towary przewożone pociągami. Dla każdego towaru osobno ustaw, co stacja wysyła, a co przyjmuje; pracownicy bezpośrednio pobierają towary ze stacji i odkładają je na niej, a tragarze przewożą towary do magazynów w dzielnicy i z powrotem."
ptBR = "Carrega e descarrega mercadorias transportadas por trens. Defina, mercadoria por mercadoria, o que a estação envia e recebe; os trabalhadores retiram e deixam mercadorias diretamente nela, enquanto os carregadores transportam mercadorias de e para o armazenamento do distrito."
koKR = "열차가 운반하는 물품을 싣고 내립니다. 물품별로 역에서 보낼 것과 받을 것을 설정하세요. 작업자는 역에서 직접 물품을 가져가거나 내려놓으며, 운반꾼은 구역의 저장고와 역 사이로 물품을 나릅니다."
csCZ = "Nakládá a vykládá zboží přepravované vlaky. U každého druhu zboží nastavte, co stanice odesílá a co přijímá; pracovníci zboží přímo odebírají a odkládají ve stanici, zatímco nosiči je převážejí do skladiště okrsku a zpět."
viVN = "Bốc và dỡ hàng hóa do tàu chở. Thiết lập riêng cho từng loại hàng hóa những gì nhà ga gửi đi và nhận về; công nhân trực tiếp lấy hàng và giao hàng tại đây, còn người vận chuyển đưa hàng hóa đến và đi từ kho của khu vực."
trTR = "Trenlerin taşıdığı malları yükler ve boşaltır. İstasyonun ne gönderip ne alacağını her mal için ayrı ayrı belirleyin; işçiler malları doğrudan istasyondan alıp istasyona bırakırken taşıyıcılar malları bölgenin deposuna götürüp depodan getirir."

["Tobbert.GoodsStation.FlavorDescription"]
raw = "Every great railway needs a place to drop off the cargo."
