esES = "Termina su tarea actual, regresa a una estación y la aparca (la estación queda pausada). Reanuda la estación para continuar."
itIT = "Termina il compito attuale, torna a una stazione e la parcheggia (la stazione viene messa in pausa). Riattiva la stazione per riprendere."
ukUA = "Завершує поточне завдання, повертається до станції та паркується на ній (станцію призупинено). Відновіть роботу станції, щоб продовжити."
thTH = "เสร็จสิ้นงานปัจจุบัน จากนั้นกลับไปยังสถานีและจอดรถ (สถานีจะถูกหยุดชั่วคราว) ยกเลิกการหยุดชั่วคราวของสถานีเพื่อดำเนินการต่อ"
csCZ = "Dokončí svůj aktuální úkol, vrátí se na stanici a zaparkuje tam (stanice se pozastaví). Zrušením pozastavení stanice se provoz obnoví."
viVN = "Hoàn thành công việc hiện tại, quay về một ga và dừng lại ở đó (ga sẽ bị tạm dừng). Bỏ tạm dừng ga để tiếp tục."
caES = "Acaba la tasca actual, torna a una estació i l'aparca (l'estació es posa en pausa). Reprèn l'estació per tornar a posar-la en marxa."
beBY = "Завяршае бягучае заданне, вяртаецца да станцыі і стаіць там (станцыя прыпыняецца). Зніміце прыпыненне са станцыі, каб аднавіць работу."
roRO = "Termină sarcina curentă, se întoarce la o stație și o parchează (stația este pusă în pauză). Anulează pauza stației pentru a relua."
huHU = "Befejezi az aktuális feladatát, visszatér egy állomásra, és ott parkol (az állomás szüneteltetve lesz). A folytatáshoz szüntesse meg az állomás szüneteltetését."
