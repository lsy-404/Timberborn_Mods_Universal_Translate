["Tobbert.TrainYard.Description"]
raw = "Builds trains and doubles as a fuel depot. Keep it stocked with logs and water so dry trains can come here to refuel."
status = "abandoned"
enUS = "Builds trains and doubles as a fuel depot. Keep it stocked with logs and water so trains running low on fuel can come here to refuel."
zhCN = "建造火车，同时兼作燃料补给站。储备好原木和水，让缺少燃料的火车可以来此补给。"
zhTW = "建造列車，也兼作燃料補給站。備妥原木和水，讓燃料耗盡的列車可以來這裡補給。"
ruRU = "Строит поезда и служит топливным складом. Держите здесь запас брёвен и воды, чтобы поезда могли приезжать сюда на дозаправку."
jaJP = "列車を建造し、燃料補給所としても機能します。燃料切れの列車が補給に来られるよう、丸太と水を備蓄しておきましょう。"
frFR = "Construit des trains et sert aussi de dépôt de carburant. Gardez-le approvisionné en rondins et en eau pour que les trains à court de carburant puissent venir se ravitailler."
deDE = "Baut Züge und dient gleichzeitig als Treibstoffdepot. Halte es mit Baumstämmen und Wasser gefüllt, damit Züge mit leerem Tank hier auftanken können."
plPL = "Buduje pociągi i pełni też funkcję składu paliwa. Trzymaj tu zapas kłód i wody, aby pociągi z pustymi zbiornikami mogły tu zatankować."
ptBR = "Constrói trens e também serve como depósito de combustível. Mantenha-o abastecido com toras e água para que os trens sem combustível possam vir reabastecer."
koKR = "기차를 건설하며 연료 보급소 역할도 합니다. 통나무와 물을 채워 두면 연료가 떨어진 기차가 이곳에 와서 보급할 수 있습니다."
csCZ = "Vyrábí vlaky a zároveň slouží jako sklad paliva. Udržujte v něm zásobu klád a vody, aby sem mohly přijet vlaky, kterým dochází palivo, a doplnit si zásoby."
viVN = "Chế tạo các đoàn tàu và đồng thời làm kho nhiên liệu. Hãy dự trữ gỗ khúc và nước để các đoàn tàu cạn nhiên liệu có thể đến đây tiếp nhiên liệu."
trTR = "Trenleri inşa eder ve aynı zamanda yakıt deposu olarak işlev görür. Kuru trenlerin gelip yakıt ikmali yapabilmesi için odun ve su stoklayın."

