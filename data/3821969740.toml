deDE = "Beendet seine aktuelle Aufgabe, kehrt zu einem Bahnhof zurück und stellt den Zug dort ab (der Bahnhof wird pausiert). Hebe die Pause des Bahnhofs auf, um den Betrieb fortzusetzen."
plPL = "Kończy bieżące zadanie, wraca na stację i parkuje na niej (stacja zostaje wstrzymana). Wznów działanie stacji, aby kontynuować."
ptBR = "Conclui a tarefa atual, retorna a uma estação e estaciona nela (a estação é pausada). Despause a estação para retomar."
koKR = "현재 작업을 마치고 역으로 돌아가 정차합니다(역이 일시 정지됩니다). 역의 일시 정지를 해제하면 다시 운행합니다."
