zhTW = "放置在貨物站旁的筒倉，可為貨物站增加貨物欄位——每個欄位都能讓貨物站多儲存一種貨物。筒倉本身不儲存任何貨物。"
ruRU = "Силос, размещаемый вплотную к товарной станции, чтобы добавить ей места для товаров: каждое место позволяет станции хранить ещё один вид товаров. Сам силос товары не хранит."
jaJP = "Goods Stationに隣接して設置すると、追加の商品スロットを付与するサイロです。スロット1つにつき、Goods Stationが在庫として扱える商品の種類が1つ増えます。このサイロ自体は商品を保管しません。"
frFR = "Un silo placé contre une station de marchandises lui accorde des emplacements de marchandises supplémentaires — chaque emplacement permet à la station de stocker un type de marchandises supplémentaire. Ne stocke aucune marchandise lui-même."
deDE = "Ein Silo, das neben einer Güterstation platziert wird, um ihr zusätzliche Güterplätze zu gewähren – jeder Platz ermöglicht der Station, eine weitere Güterart auf Vorrat zu halten. Lagert selbst keine Güter."
plPL = "Silos ustawiony przy stacji towarowej zapewnia jej dodatkowe miejsca na towary — każde z nich pozwala stacji przechowywać jeszcze jeden rodzaj towarów. Sam nie przechowuje żadnych towarów."
ptBR = "Um silo colocado junto a uma Estação de Mercadorias para conceder a ela espaços extras para mercadorias — cada espaço permite que a estação armazene mais um tipo de mercadoria. Não armazena mercadorias próprias."
koKR = "상품역에 붙여 설치하면 추가 상품 슬롯을 제공하는 사일로입니다. 슬롯 하나당 역에 비축할 수 있는 상품 종류가 하나 늘어납니다. 자체적으로 상품을 보관하지는 않습니다."
trTR = "Goods Station'a bitişik yerleştirilerek istasyona ek mal yuvaları kazandıran bir silo — her yuva, istasyonun bir tür daha mal stoklamasını sağlar. Kendisi mal depolamaz."
esES = "Un silo colocado junto a una Estación de mercancías para darle ranuras de mercancías adicionales; cada ranura permite que la estación almacene un tipo más de mercancía. No almacena mercancías por sí mismo."
itIT = "Un silo posizionato accanto a una Stazione Merci per aggiungere alla stazione slot merci extra: ogni slot consente alla stazione di immagazzinare un tipo di merce in più. Non contiene merci di per sé."
ukUA = "Силос, що розміщується поруч із Складом товарів і дає йому додаткові слоти для товарів — кожен слот дозволяє станції зберігати ще один вид товарів. Сам по собі товарів не зберігає."
thTH = "ไซโลที่วางติดกับสถานีสินค้าเพื่อเพิ่มช่องเก็บสินค้าให้สถานี โดยแต่ละช่องช่วยให้สถานีเก็บสินค้าได้อีกหนึ่งประเภท ตัวไซโลไม่เก็บสินค้าใดๆ ด้วยตัวเอง"
csCZ = "Silo umístěné vedle nákladové stanice jí přidá další sloty na zboží — každý slot umožňuje stanici skladovat o jeden druh zboží navíc. Samo žádné zboží neskladuje."
viVN = "Một silo đặt sát Trạm Hàng hóa để bổ sung chỗ chứa hàng hóa — mỗi chỗ cho phép trạm dự trữ thêm một loại hàng hóa. Bản thân silo không chứa hàng hóa nào."
caES = "Un sitjar col·locat contra una Estació de Mercaderies per concedir-li ranures de mercaderies addicionals: cada ranura permet a l'estació emmagatzemar un tipus més de mercaderies. No conté mercaderies pròpies."
beBY = "Сілас, размешчаны каля станцыі тавараў, дае ёй дадатковыя слоты для тавараў: кожны слот дазваляе станцыі захоўваць яшчэ адзін від тавараў. Сам ён тавараў не захоўвае."
roRO = "Un siloz amplasat lângă o Stație de Mărfuri pentru a-i acorda sloturi suplimentare de marfă — fiecare slot permite stației să depoziteze încă un tip de marfă. Nu deține niciun fel de marfă propriu."
huHU = "Egy siló, amelyet egy Árukiadó-állomáshoz illesztenek, hogy extra árutárolóhelyeket biztosítson neki – minden hely lehetővé teszi, hogy az állomás még egy árufajtát tároljon. Saját árut nem tartalmaz."
arSA = "صومعة توضع بجانب محطة البضائع لمنحها فتحات بضائع إضافية، حيث تتيح كل فتحة للمحطة تخزين نوع إضافي واحد من البضائع. لا تحتفظ بأي بضائع بذاتها."

