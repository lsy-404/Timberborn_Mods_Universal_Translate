["Tobbert.GoodsStationWarehouseMedium.Description"]
raw = "A warehouse placed against a Goods Station, or under it, to grant it extra goods slots — each slot lets the station stock one more kind of goods. Holds no goods of its own."
status = "abandoned"
enUS = "A warehouse placed against or beneath a Goods Station grants it extra goods slots — each slot lets the station stock one more kind of goods. Holds no goods of its own."
zhCN = "紧贴货物站建造或建在其下方的仓库，可为货物站增加货物槽位——每个槽位都能让货物站多储存一种货物。自身不储存任何货物。"
zhTW = "緊鄰或建在貨物站下方的倉庫，可為貨物站增加貨物欄位——每個欄位可讓貨物站多存放一種貨物。自身不儲存任何貨物。"
ruRU = "Склад, размещённый вплотную к товарной станции или под ней, добавляет ей ячейки для товаров — каждая ячейка позволяет станции хранить ещё один вид товара. Сам склад товары не хранит."
jaJP = "Goods Stationの横または下に設置すると、Goods Stationに追加の貨物スロットを与える倉庫。スロット1つにつき、駅が保管できる貨物の種類が1つ増える。この倉庫自体は貨物を保管しない。"
frFR = "Un entrepôt placé contre une gare de marchandises, ou en dessous, lui ajoute des emplacements pour les marchandises : chaque emplacement permet à la gare de stocker un type de marchandises supplémentaire. Ne stocke lui-même aucune marchandise."
deDE = "Ein Lagerhaus, das an einer Güterstation oder unter ihr platziert wird, um ihr zusätzliche Güterplätze zu geben – jeder Platz ermöglicht es der Station, eine weitere Güterart zu lagern. Lagert selbst keine Güter."
plPL = "Magazyn umieszczony przy stacji towarowej lub pod nią, zapewniający jej dodatkowe miejsca na towary — każde miejsce pozwala stacji przechowywać jeden dodatkowy rodzaj towarów. Sam nie przechowuje żadnych towarów."
ptBR = "Um armazém colocado ao lado de uma Estação de Mercadorias ou embaixo dela, para conceder a ela espaços extras para mercadorias — cada espaço permite que a estação armazene mais um tipo de mercadoria. Não armazena mercadorias próprias."
koKR = "상품역에 붙여서 또는 아래에 배치하면 역의 상품 슬롯을 추가해 주는 창고입니다. 슬롯 하나당 역에 비축할 수 있는 상품 종류가 하나씩 늘어납니다. 자체적으로는 상품을 보관하지 않습니다."
trTR = "Goods İstasyonu’na bitişik veya altına yerleştirildiğinde istasyona ek eşya yuvaları sağlar — her yuva, istasyonun stoklayabileceği eşya türü sayısını bir artırır. Kendi içinde eşya depolamaz."
esES = "Un almacén colocado junto a una Estación de mercancías, o debajo de ella, para concederle ranuras de mercancías adicionales; cada ranura permite a la estación almacenar un tipo más de mercancía. No contiene mercancías por sí mismo."
itIT = "Un magazzino posizionato accanto a una Stazione Merci, o sotto di essa, per concederle slot merci extra: ogni slot permette alla stazione di immagazzinare un tipo di merce in più. Non contiene merci proprie."
ukUA = "Склад, розташований поруч із Товарною станцією або під нею, що додає станції додаткові слоти для товарів — кожен слот дозволяє станції зберігати ще один вид товарів. Власних товарів не зберігає."
thTH = "คลังสินค้าที่วางติดกับสถานีสินค้า หรือวางไว้ใต้สถานีสินค้า เพื่อเพิ่มช่องสินค้าให้สถานี โดยแต่ละช่องทำให้สถานีเก็บสินค้าได้อีกหนึ่งประเภท ตัวคลังไม่เก็บสินค้าใดๆ ด้วยตัวเอง"
csCZ = "Sklad umístěný vedle stanice zboží nebo pod ní jí poskytuje další sloty na zboží — každý slot umožňuje stanici skladovat o jeden druh zboží navíc. Sám žádné zboží neskladuje."
viVN = "Một nhà kho được đặt sát hoặc bên dưới Ga Hàng hóa để tăng thêm ô chứa hàng cho ga — mỗi ô cho phép ga lưu trữ thêm một loại hàng hóa. Bản thân nhà kho không chứa hàng hóa."
caES = "Un magatzem situat al costat d'una Estació de mercaderies, o per sota, per donar-li places de mercaderies addicionals: cada plaça permet que l'estació emmagatzemi un tipus més de mercaderia. No conté cap mercaderia pròpia."
beBY = "Склад, размешчаны побач з Станцыяй тавараў або пад ёй, які дае ёй дадатковыя слоты для тавараў: кожны слот дазваляе станцыі захоўваць яшчэ адзін від тавараў. Уласных тавараў не захоўвае."
roRO = "Un depozit amplasat lângă o Stație de mărfuri sau sub aceasta, pentru a-i acorda sloturi suplimentare de mărfuri — fiecare slot permite stației să depoziteze încă un tip de marfă. Nu deține niciun fel de marfă propriu."
huHU = "Egy raktár, amely egy Áruállomáshoz közvetlenül mellé vagy alá kerül, extra áruhelyeket biztosítva számára – minden hely lehetővé teszi, hogy az állomás még egy fajta árut tároljon. Saját árut nem tartalmaz."
arSA = "مستودع يُوضع بجوار محطة البضائع أو تحتها، ليمنحها خانات بضائع إضافية؛ فكل خانة تتيح للمحطة تخزين نوع إضافي واحد من البضائع. لا يحتوي على أي بضائع خاصة به."

