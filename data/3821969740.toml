jaJP = "ここから到達できる待機駅または車両基地がありません。線路をつなぐか、戻る道がその先にある場合は折り返しループを設置してください。"
frFR = "Aucune gare d'attente ni aucun dépôt ferroviaire n'est accessible depuis ici — posez une voie de raccordement ou une boucle de retournement si le retour se trouve derrière vous."
deDE = "Von hier aus ist kein Wartebahnhof und kein Rangierbahnhof erreichbar – lege ein Verbindungsgleis oder eine Wendeschleife an, falls der Rückweg dahinter liegt"
plPL = "Nie można stąd dotrzeć do żadnej stacji ani zajezdni kolejowej — ułóż łączący tor lub pętlę do zawracania, jeśli droga powrotna znajduje się za nią."
ptBR = "Não é possível chegar a nenhuma Estação de Espera ou Pátio Ferroviário daqui — construa uma linha conectando-os ou um circuito de retorno, caso o caminho de volta fique depois dela."
koKR = "여기서 도달할 수 있는 대기역이나 기차 야적장이 없습니다 — 연결 선로를 놓거나, 돌아가는 길이 그 너머에 있다면 회차 선로를 놓으세요."
csCZ = "Odtud není dosažitelná žádná čekací stanice ani nádraží — položte spojovací kolej, nebo objízdnou smyčku, pokud je cesta zpět za nimi"
viVN = "Không thể tiếp cận Ga chờ hoặc Bãi tàu từ đây — hãy đặt đường ray nối vào, hoặc làm một vòng quay đầu nếu đường về nằm phía sau công trình đó."
trTR = "Buradan ulaşılabilecek bir Bekleme İstasyonu veya Tren Garı yok — bağlantı yolu ya da dönüş yolu geride kalıyorsa bir dönüş döngüsü döşe."

["Tobbert.TrackLineTool.Prompt"]
raw = "Drag to lay a line of one-way track. Turn once to add a junction. Press R or Shift+R to cycle the junction piece (corner / T / crossing)."
status = "abandoned"
enUS = "Drag to lay a line of one-way track. Turn once to add a junction. Press R or Shift+R to cycle the junction piece (corner / T / crossing)."
zhCN = "拖动以铺设一段单向轨道。转弯一次以添加一个道岔。按 R 或 Shift+R 切换道岔类型（弯道 / T 形道岔 / 十字道岔）。"
zhTW = "拖曳以鋪設單向軌道。轉向一次即可新增道岔。按 R 或 Shift+R 可切換道岔類型（彎道／T 字形／十字交叉）。"
ruRU = "Перетащите, чтобы проложить линию одностороннего пути. Поверните один раз, чтобы добавить стрелку. Нажимайте R или Shift+R, чтобы переключать тип стрелки (угловая / Т-образная / перекрёстная)."
jaJP = "ドラッグして一方通行の線路を敷きます。1回曲がると分岐器を追加します。R または Shift+R を押すと、分岐器の種類（カーブ／T字／十字）を切り替えます。"
frFR = "Faites glisser pour poser une ligne de voie à sens unique. Tournez une fois pour ajouter une jonction. Appuyez sur R ou Maj+R pour faire défiler les pièces de jonction (angle / T / croisement)."
deDE = "Ziehe, um eine einspurige Strecke zu verlegen. Drehe einmal, um eine Weiche hinzuzufügen. Drücke R oder Umschalt+R, um das Weichenstück durchzuschalten (Kurve / T-Stück / Kreuzung)."
plPL = "Przeciągnij, aby wytyczyć jednokierunkowy tor. Obróć raz, aby dodać rozjazd. Naciśnij R lub Shift+R, aby zmienić element rozjazdu (zakręt / T / skrzyżowanie)."
ptBR = "Arraste para traçar uma linha de trilhos de mão única. Vire uma vez para adicionar uma junção. Pressione R ou Shift+R para alternar a peça da junção (curva / T / cruzamento)."
koKR = "드래그하여 일방통행 선로를 놓으세요. 한 번 회전하면 분기 선로가 추가됩니다. R 또는 Shift+R을 눌러 분기 선로 조각(모서리 / T자 / 교차로)을 순환하세요."
csCZ = "Tažením položte jednosměrnou kolej. Jednou zatočte a přidejte výhybku. Stisknutím R nebo Shift+R přepínejte mezi díly výhybky (roh / T / křížení)."
viVN = "Kéo để đặt một đoạn đường ray một chiều. Rẽ một lần để thêm một nút giao. Nhấn R hoặc Shift+R để chuyển đổi kiểu nút giao (góc / chữ T / giao cắt)."
trTR = "Tek yönlü ray hattı döşemek için sürükleyin. Bir kez döndürerek makas ekleyin. Makas parçasını (köşe / T / kesişim) değiştirmek için R veya Shift+R tuşlarına basın."

