["Tobbert.GoodsStationWarehouseSmall.Description"]
raw = "A warehouse placed against a Goods Station, or under it, to grant it extra goods slots — each slot lets the station stock one more kind of goods. Holds no goods of its own."
status = "abandoned"
enUS = "A warehouse placed against or beneath a Goods Station grants it extra goods slots—each slot lets the station stock one more kind of goods. Holds no goods of its own."
zhCN = "紧贴货物站或建在其下方的仓库，可为货物站增加额外的货物槽位——每个槽位让货物站多存放一种货物。自身不储存任何货物。"
zhTW = "放置在貨物站旁邊或下方的倉庫，可為貨物站增加貨物欄位——每個欄位讓貨物站多儲存一種貨物。自身不儲存任何貨物。"
ruRU = "Склад, размещённый вплотную к товарной станции или под ней, даёт ей дополнительные слоты для товаров — каждый слот позволяет станции хранить ещё один вид товара. Сам склад товары не хранит."
jaJP = "Goods Stationに隣接またはその下に配置すると、駅の商品のスロット数を増やす倉庫。スロット1つにつき、駅に在庫できる商品の種類が1つ増える。この倉庫自体は商品を保管しない。"
frFR = "Un entrepôt placé contre une gare de marchandises, ou en dessous, lui octroie des emplacements de marchandises supplémentaires — chaque emplacement permet à la gare de stocker une sorte de marchandises en plus. Ne stocke lui-même aucune marchandise."
deDE = "Ein Lagerhaus, das an eine Güterstation oder unter ihr platziert wird, um ihr zusätzliche Güterplätze zu gewähren – jeder Platz ermöglicht es der Station, eine weitere Güterart vorrätig zu halten. Lagert selbst keine Güter."
plPL = "Magazyn umieszczony przy stacji towarowej lub pod nią, aby zapewnić jej dodatkowe miejsca na towary — każde miejsce pozwala stacji przechowywać jeszcze jeden rodzaj towaru. Sam nie przechowuje żadnych towarów."
ptBR = "Um armazém colocado ao lado ou embaixo de uma Estação de Mercadorias concede a ela espaços extras para mercadorias — cada espaço permite que a estação armazene mais um tipo de mercadoria. Não armazena mercadorias por conta própria."
koKR = "Goods Station에 붙이거나 아래에 배치하면 Goods Station에 상품 슬롯을 추가해 줍니다. 슬롯 하나당 Goods Station에 비축할 수 있는 상품 종류가 하나 늘어납니다. 자체적으로는 상품을 보관하지 않습니다."
csCZ = "Sklad umístěný vedle nebo pod stanicí zboží jí poskytuje další skladovací sloty – každý slot umožňuje stanici skladovat o jeden druh zboží více. Sám žádné zboží neskladuje."
viVN = "Một nhà kho đặt sát hoặc bên dưới Trạm Hàng hóa để tăng thêm ô chứa hàng cho trạm — mỗi ô cho phép trạm lưu trữ thêm một loại hàng hóa. Bản thân nhà kho không chứa hàng hóa nào."
trTR = "Goods Station’ın yanına veya altına yerleştirilerek ona ek mal yuvaları sağlar — her yuva, istasyonun bir tür daha mal stoklamasına olanak tanır. Kendi içinde mal depolamaz."

