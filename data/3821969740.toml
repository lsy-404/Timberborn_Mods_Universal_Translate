["Tobbert.ExchangeStation.Description"]
raw = "Balances goods between districts connected by rail, following their distribution settings. Beavers also use it to migrate from one district to another."
status = "abandoned"
enUS = "Balances goods between districts connected by rail, following their distribution settings. Beavers also use it to migrate from one district to another."
zhCN = "根据物资分配设置，在由铁路连接的地区之间平衡物资。海狸也会利用它从一个地区迁移到另一个地区。"
zhTW = "在以鐵路連接的區域之間，依照各區域的分配設定平衡物資。海狸也會利用它從一個區域遷徙到另一個區域。"
ruRU = "Распределяет товары между районами, соединёнными железной дорогой, согласно настройкам распределения. Бобры также используют её, чтобы переселяться из одного района в другой."
jaJP = "鉄道で接続された地区間で、各地区の分配設定に従って物資のバランスを調整します。ビーバーは、ある地区から別の地区へ移住する際にもここを利用します。"
frFR = "Équilibre les marchandises entre les districts reliés par le rail, selon leurs paramètres de distribution. Les castors l'utilisent également pour migrer d'un district à un autre."
deDE = "Gleicht Waren zwischen per Schiene verbundenen Bezirken gemäß ihren Verteilungseinstellungen aus. Biber nutzen sie außerdem, um von einem Bezirk in einen anderen zu ziehen."
plPL = "Równoważy przepływ towarów między połączonymi koleją dzielnicami zgodnie z ustawieniami ich dystrybucji. Bobry mogą też korzystać z niego, by migrować z jednej dzielnicy do drugiej."
ptBR = "Equilibra os bens entre distritos conectados por ferrovia, seguindo as configurações de distribuição. Os castores também a usam para migrar de um distrito para outro."
koKR = "설정된 분배 방식에 따라 철도로 연결된 구역 간에 물자를 균형 있게 분배합니다. 비버는 이곳을 이용해 다른 구역으로 이주할 수도 있습니다."
csCZ = "Vyrovnává množství zboží mezi okresy propojenými železnicí podle jejich nastavení distribuce. Bobři ji také používají k migraci z jednoho okresu do druhého."
viVN = "Cân bằng hàng hóa giữa các khu được kết nối bằng đường ray, theo các thiết lập phân phối của chúng. Hải ly cũng dùng ga này để di cư từ khu này sang khu khác."
trTR = "Rayla birbirine bağlanan bölgeler arasında, dağıtım ayarlarına göre malları dengeler. Kunduzlar da bir bölgeden diğerine göç etmek için burayı kullanır."

