csCZ = "Pevná jednopatrová vodní zábrana s vanilkovým skládáním hrází a pravidly vlhkosti. Žlutá linie umístění označuje její plnou výšku blokování. Odpovídá dokončení Works; vzhled nemění chování vody."
viVN = "Tường chắn nước đặc một tầng, có thể xếp chồng như đê vanilla và tuân theo các quy tắc về độ ẩm. Vạch đặt màu hổ phách đánh dấu chiều cao chặn nước tối đa. Lớp hoàn thiện phù hợp với Works; ngoại hình không làm thay đổi hành vi của nước."
caES = "Barrera d'aigua sòlida d'un sol nivell amb apilament de rescloses com al joc original i regles d'humitat. La línia de col·locació ambar marca la seva altura de bloqueig completa. Acabat a joc amb els Works; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльная аднаяруснаяя водная перагародка з ваніллевым накладаннем дамбы і правіламі вільготнасці. Бурштынавая лінія размяшчэння паказвае яе поўную вышыню блакавання. Адпаведная аздоба Works; выгляд не мяняе паводзіны вады."
