zhTW = "單層實心水障壁，具備原版堤壩的堆疊與潮濕規則。琥珀色的放置線標示其完整阻擋高度。外觀與原版工藝相符，但不會改變水的行為。"
ruRU = "Сплошной однослойный водяной барьер с обычным складыванием дамб и правилами влажности. Жёлтая линия размещения показывает его полную высоту блокировки. Отделка соответствует Works; внешний вид не меняет поведение воды."
jaJP = "単層の固体水障壁です。堤防の通常の積み重ね規則と湿気のルールに従います。琥珀色の設置ラインが、遮断する高さの全体を示します。仕上げは「Matching Works」に合わせますが、見た目は水の挙動を変えません。"
frFR = "Barrière d'eau solide d'un seul niveau, avec empilement de digues vanilla et règles d'humidité. La ligne de placement ambrée indique sa hauteur de blocage complète. Finition assortie aux Works ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Solide, einstöckige Wassersperre mit der Stapelregeln und Feuchtigkeitsregeln des Originaldamms. Die bernsteinfarbene Platzierungslinie markiert ihre volle Sperrhöhe. Die passende Werkoberfläche ändert das Aussehen, nicht das Wasserverhalten."
plPL = "Solidna, jednopoziomowa bariera wodna o standardowym układaniu wałów i zasadach wilgotności. Bursztynowa linia montażu oznacza jej pełną wysokość blokowania. Wykończenie pasuje do Works; wygląd nie zmienia zachowania wody."
ptBR = "Barreira sólida de água de um nível, com empilhamento de diques do jogo base e regras de umidade. A linha de colocação âmbar marca sua altura total de bloqueio. Acabamento compatível com Works; a aparência não altera o comportamento da água."
koKR = "단일 층 높이의 고체 물막이 벽으로, 바닐라 둑과 같은 쌓기 방식과 습기 규칙을 따릅니다. 노란색 설치선이 차단 가능한 전체 높이를 표시합니다. 마감은 Works 제품과 일치하며, 외형은 물의 작용을 바꾸지 않습니다."
trTR = "Tek seviyeli, katı bir su bariyeri; vanilla set dizilimi ve nem kurallarıyla çalışır. Kehribar yerleştirme çizgisi, tam engelleme yüksekliğini gösterir. Görünümü Works ile eşleşen bir yüzeye sahiptir; görünüm su davranışını değiştirmez."
esES = "Barrera sólida de agua de un solo nivel, con apilamiento de diques de serie y reglas de humedad. La línea de colocación ámbar marca su altura de bloqueo total. Acabado a juego de Works; el aspecto no cambia el comportamiento del agua."
itIT = "Barriera idrica solida a un solo livello con impilamento come i argini vanilla e regole di umidità. La linea di posizionamento ambra indica la sua altezza di blocco completa. Finitura coordinata con Works; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Суцільний однорівневий водний бар'єр із сумісним укладанням дамб за ванільними правилами та правилами вологості. Бурштиновий лінія розміщення позначає його повну висоту блокування. Оздоблення відповідає іншим роботам LeveeWorks; зовнішній вигляд не змінює поведінку води."
thTH = "กำแพงกั้นน้ำแบบทึบความสูงชั้นเดียว มีกฎการซ้อนของคันกั้นน้ำแบบดั้งเดิมและกฎความชื้น เส้นสีอำพันตอนวางจะแสดงความสูงเต็มที่ใช้กั้นน้ำ ผิวสำเร็จตรงกับงานไม้ของ Works แต่รูปลักษณ์ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Pevná jednopatrová vodní zeď s vanilkovým skládáním hrází a pravidly pro vlhkost. Oranžová čára umístění označuje její plnou výšku blokování. Odpovídá dokončení Works; vzhled nemění chování vody."
viVN = "Tường chắn nước đặc một tầng bằng gạch, xếp chồng như đê vanilla và tuân theo quy tắc độ ẩm. Đường đánh dấu màu hổ phách khi đặt cho biết chiều cao chặn nước tối đa của tường. Lớp hoàn thiện đồng bộ với Works; ngoại hình không làm thay đổi hành vi của nước."
caES = "Barrera d'aigua sòlida d'un sol nivell, amb apilament de dics com al joc base i regles d'humitat. La línia de col·locació de color ambre marca la seva alçada completa de bloqueig. Acabat coincident amb les obres; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльная аднаярусная водная перагародка з ванільным укладаннем дамбаў і правіламі вільготнасці. Жоўтая лінія размяшчэння паказвае яе поўную вышыню блакіроўкі. Адпаведная аддзелка ад Works; выгляд не змяняе паводзіны вады."
roRO = "Baraj solid de apă, cu un singur nivel, care se așază ca un dig obișnuit și respectă regulile de umiditate. Linia de amplasare chihlimbarie marchează înălțimea sa totală de blocare. Finisajul corespunde cu cel al Works; aspectul nu modifică comportamentul apei."
huHU = "Tömör, egy szintes vízgát a vanilla gáttal azonos egymásra helyezési szabályokkal és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelöli teljes zárómagasságát. A Works-bevonat illeszkedik, a megjelenés nem változtatja meg a víz viselkedését."
arSA = "جدار مائي صلب بارتفاع طابق واحد، يتراص مع السدود الأساسية ويتفاعل مع قواعد الرطوبة. يحدد الخط البرتقالي اللون على الأرض ارتفاع الحجب الكامل. يتطابق التشطيب مع أعمال \"LeveeWorks\"، والمظهر لا يغير سلوك الماء."

