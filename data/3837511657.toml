["LeveeWorks.PlankWall.IvoryTimber.Description"]
status = "normal"
raw = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
enUS = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
zhCN = "单层实心挡水墙，具有原版堤坝的堆叠与湿度规则。琥珀色放置线标示其完整的阻挡高度。外观与原版工艺相匹配；外观不影响水的行为。"
zhTW = "單層實心的水障壁，具備原版堤防堆疊與濕度規則。琥珀色的放置線標示其完整阻擋高度。外觀與 Works 系列的完成面一致；外觀不會改變水的行為。"
ruRU = "Сплошной однояростный водяной барьер с обычным наращиванием дамб и правилами влажности. Янтарная линия установки отмечает его полную высоту перекрытия. Отделка соответствует Matching Works; внешний вид не меняет поведение воды."
jaJP = "単層の固体水流遮断壁です。バニラの堤防の積み重ね仕様と湿気のルールに従います。琥珀色の設置線が、遮断できる高さ全体を示します。仕上げは既存の作品に合わせてあり、見た目は水の挙動を変えません。"
frFR = "Barrière d'eau pleine d'un seul niveau, avec empilement de digues et règles d'humidité identiques à celles du jeu de base. La ligne de placement ambre indique sa hauteur de blocage complète. Finition assortie à celle des Travaux ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Solide, einstöckige Wasserbarriere mit den Stapelregeln und Feuchtigkeitsregeln des Originaldamms. Die bernsteinfarbene Platzierungslinie markiert ihre volle Sperrhöhe. Die passende Werkstatt-Oberfläche ändert das Aussehen, nicht das Wasserverhalten."
plPL = "Solidna jednopoziomowa zapora wodna z piętrzeniem wałów zgodnym z wanilią oraz zasadami wilgotności. Bursztynowa linia rozmieszczenia oznacza jej pełną wysokość blokowania. Wykończenie zgodne z LeveeWorks; wygląd nie zmienia zachowania wody."
ptBR = "Barreira de água sólida de um nível, com empilhamento de diques de baunilha e regras de umidade. A linha de colocação âmbar marca sua altura total de bloqueio. Acabamento compatível com Works; a aparência não altera o comportamento da água."
koKR = "단일 층 높이의 견고한 물막이 벽으로, 바닐라 둑 쌓기 방식과 습기 규칙을 따릅니다. 호박색 설치선은 차단이 가능한 전체 높이를 표시합니다. 마감은 Matching Works와 맞으며, 외관은 물의 작동 방식을 바꾸지 않습니다."
trTR = "Tek seviyelik, katı bir su bariyeri; vanilla set dizilimi ve nem kurallarını kullanır. Kehribar yerleştirme çizgisi tam engelleme yüksekliğini gösterir. Görünümü Works ile eşleşir; görünüm su davranışını değiştirmez."
esES = "Barrera sólida de un solo nivel con apilamiento de diques de serie y reglas de humedad. La línea de colocación ámbar marca su altura de bloqueo completa. Acabado a juego con Works; el aspecto no cambia el comportamiento del agua."
itIT = "Barriera d'acqua solida a un solo livello, con impilamento come gli argini di base e regole di umidità. La linea di posizionamento ambra indica la sua altezza di blocco completa. Finitura coordinata con Works; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Суцільний одноярусний водяний бар'єр зі стандартним укладанням дамб і правилами вологості. Бурштиновий лінія розміщення позначає його повну висоту блокування. Оздоблення відповідає Matching Works; зовнішній вигляд не змінює поведінку води."
thTH = "กำแพงกั้นน้ำแบบทึบหนึ่งระดับ ใช้การซ้อนคันกั้นน้ำแบบดั้งเดิมและกฎความชื้นเดิม เส้นวางสีเหลืองอำพันแสดงความสูงเต็มที่ใช้กั้นน้ำ ผิวงานที่ตรงกันช่วยให้ดูกลมกลืน แต่รูปลักษณ์ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Pevná jednopatrová vodní zeď s možností skládání hrází podle standardních pravidel a pravidel vlhkosti. Jantarová čára pro umístění označuje její plnou blokovací výšku. Povrchová úprava odpovídá stavbám z Works; vzhled však nemění chování vody."
viVN = "Tường chắn nước đặc một tầng với cách xếp đê như bản gốc và quy tắc độ ẩm. Đường đặt màu hổ phách đánh dấu chiều cao chặn nước tối đa. Lớp hoàn thiện khớp với Works; diện mạo không thay đổi cách nước vận hành."
caES = "Barrera d'aigua sòlida d'un sol nivell, amb apilament de rescloses de la versió base i regles d'humitat. La línia de col·locació ambre marca la seva altura de bloqueig completa. L'acabat coincideix amb Works; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльны аднаярусны водны бар'ер з ванільxadным складаннем дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння адзначае яго поўную вышыню блакіроўкі. Аздабленне адпавядае Works; выгляд не змяняе паводзіны вады."
roRO = "Barieră solidă de apă, de un nivel, cu stivuire de diguri ca în versiunea standard și reguli de umiditate. Linia de plasare de culoare chihlimbar marchează înălțimea totală de blocare. Finisajul corespunde lucrărilor Matching; aspectul nu schimbă comportamentul apei."
huHU = "Tömör, egyszintes vízgát a szokásos gát-egymásra rakási és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelzi a teljes záró magasságát. Az illeszkedő Works-kivitel; a megjelenés nem változtatja meg a víz viselkedését."
arSA = "جدار مائي صلب بمستوى واحد، يتكدّس مع السدود الأصلية ويخضع لقواعد الرطوبة نفسها. يشير الخط الكهرماني عند وضع البناء إلى ارتفاع الحجب الكامل له. يتطابق التشطيب مع الأعمال الأخرى، والمظهر لا يغيّر سلوك المياه."

