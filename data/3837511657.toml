["LeveeWorks.StackedLogs.Boardwalk.Description"]
status = "normal"
raw = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
enUS = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
zhCN = "坚固的单层水障，遵循原版堤坝堆叠与湿度规则。琥珀色的放置线标示其完整阻挡高度。与堤坝工坊的饰面相配，外观不会改变水的行为。"
zhTW = "單層實心的水障壁，具備原版堤防堆疊與濕度規則。琥珀色的放置線標示其完整阻擋高度。外觀與原版工藝相符，但外觀不會改變水的行為。"
ruRU = "Сплошной одноуровневый водяной барьер с обычным наращиванием дамбы и правилами влажности. Жёлтая линия установки обозначает его полную высоту перекрытия. Отделка соответствует Works; внешний вид не меняет поведение воды."
jaJP = "固体の単層水barrierではなく、堤防の標準的な積み重ね規則と湿度ルールを備えた一段式の水の仕切りです。琥珀色の設置ラインが、その遮断の全高を示します。LeveeWorks仕上げに合わせてあり、見た目を変えても水の挙動は変わりません。"
frFR = "Barrière d'eau pleine d'un seul niveau, avec empilement de digue standard et règles d'humidité. La ligne de placement ambrée indique sa hauteur de blocage complète. Finition assortie aux Travaux ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Solide einstöckige Wassersperre mit der Standard-Stapelung von Deichen und den Feuchtigkeitsregeln. Die bernsteinfarbene Platzierungslinie markiert ihre volle Sperrhöhe. Passende Works-Oberfläche; das Aussehen ändert das Wasserverhalten nicht."
plPL = "Solidna jednopoziomowa zapora wodna o układaniu jak w standardowych wałach i zasadach wilgotności. Bursztynowa linia montażu oznacza jej pełną wysokość blokowania. Wykończenie zgodne z Works; wygląd nie zmienia działania wody."
ptBR = "Barreira de água sólida de um nível, com empilhamento de diques no padrão do jogo e regras de umidade. A linha âmbar de posicionamento marca a altura total de bloqueio. Acabamento compatível com o Works; a aparência não altera o comportamento da água."
koKR = "단일 층으로 된 견고한 물막이 벽으로, 바닐라 둑의 쌓기 방식과 습기 규칙을 따릅니다. 호박색 설치선은 차단이 가능한 전체 높이를 표시합니다. 외관은 Works 마감과 일치하지만, 외형이 물의 작동 방식을 바꾸지는 않습니다."
trTR = "Tek seviyeli, katı bir su bariyeri; vanilya set yığma ve nem kurallarına sahiptir. Kehribar yerleştirme çizgisi tam engelleme yüksekliğini gösterir. Works ile eşleşen bir yüzey kaplaması vardır; görünüm su davranışını değiştirmez."
esES = "Barrera de agua sólida de un solo nivel, con apilado de diques al estilo original y reglas de humedad. La línea de colocación ámbar marca su altura completa de bloqueo. Acabado a juego con Works; la apariencia no cambia el comportamiento del agua."
itIT = "Barriera solida per l'acqua di un solo livello, con impilamento di argini standard e regole di umidità. La linea di posizionamento ambra indica la sua altezza di blocco completa. Finitura corrispondente alle opere; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Суцільний одноярусний водний бар'єр зі стандартним укладанням дамб і правилами вологості. Бурштиновий лінійний маркер розміщення позначає його повну висоту блокування. Оздоблення відповідає іншим елементам Works; зовнішній вигляд не змінює поведінку води."
thTH = "กำแพงกั้นน้ำแบบทึบขนาดหนึ่งชั้น ใช้กฎการซ้อนของคันกั้นน้ำมาตรฐานและกฎเรื่องความชื้น เส้นสีอำพันตอนวางจะแสดงความสูงเต็มที่ที่มันปิกั้นน้ำ ผิวงานที่ตรงกับ Works ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Pevná jednopatrová vodní zábrana s vanilkovým skládáním hrází a pravidly vlhkosti. Jantarová čára umístění označuje její plnou blokovací výšku. Povrch odpovídá dokončení Works; vzhled nemění chování vody."
viVN = "Rào chắn nước đặc một tầng, xếp chồng như đê vanilla và tuân theo quy tắc độ ẩm. Đường đánh dấu màu hổ phách cho biết chiều cao chặn nước tối đa của nó. Lớp hoàn thiện tương ứng với Works; diện mạo không thay đổi cách nước hoạt động."
caES = "Barrera d'aigua sòlida d'un sol nivell amb apilament de rescloses com a l'original i regles d'humitat. La línia de col·locació ambre marca la seva alçada total de bloqueig. L'acabat coincideix amb les obres; l'aparença no canvia el comportament de l'aigua."
beBY = "Суцэльны аднаўзроўневы водны бар'ер са стандартным складаннем дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яго поўную блакавальную вышыню. Адпаведная аддзелка вырабу; выгляд не змяняе паводзіны вады."
roRO = "Barieră solidă de apă, cu un singur nivel, care se așază ca digul din joc și respectă regulile de umiditate. Linia de plasare chihlimbarie marchează înălțimea completă de blocare. Finisajul corespunde cu cel al Works; aspectul nu schimbă comportamentul apei."
huHU = "Tömör, egyszintes vízzáró gát, amely a vanilla gáttal azonos egymásra helyezést és nedvességi szabályokat követi. A borostyánsárga lerakási vonal jelzi teljes záró magasságát. A Works-kivitelezés megegyezik, a megjelenés nem változtat a víz viselkedésén."
arSA = "حاجز مائي صلب بمستوى واحد، يتكدس مثل السدود الأصلية ويخضع لقواعد الرطوبة نفسها. يُظهر الخط البرتقالي الكهرماني عند وضعه ارتفاع الحجب الكامل. يطابق التشطيب تشطيب المنشآت الأخرى، ولا يغيّر المظهر سلوك الماء."

