["LeveeWorks.MasonryWall.MossyStone.Description"]
status = "normal"
raw = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
enUS = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
zhCN = "单层实心挡水墙，采用原版堤坝的堆叠与潮湿规则。琥珀色放置线标示其完整的挡水高度。外观与原版工艺一致，但不会改变水的行为。"
zhTW = "單層實心水障，具備原版堤壩堆疊與濕度規則。琥珀色的放置線標示其完整阻擋高度。外觀與 Works 系列的完工風格相符；外觀不會改變水的行為。"
ruRU = "Одноуровневый сплошной водяной барьер с обычной укладкой дамб и правилами влажности. Жёлтая линия размещения показывает его полную высоту перекрытия. Отделка соответствует другим сооружениям Works; внешний вид не меняет поведение воды."
jaJP = "単層の固い水の障壁です。バニラの堤防の積み重ねルールと湿気のルールに従います。琥珀色の配置線が、完全に水を遮る高さを示します。仕上げは既存の作業に合わせてあり、見た目を変えても水の挙動は変わりません。"
frFR = "Barrière d'eau solide d'un seul niveau avec empilement de digue vanilla et règles d'humidité. La ligne de placement ambrée indique sa hauteur de blocage complète. Finition assortie aux Travaux ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Massive einstöckige Wasserbarriere mit den Stapelregeln und Feuchtigkeitsregeln des Originaldamms. Die bernsteinfarbene Platzierungslinie markiert ihre volle Sperrhöhe. Passendes Works-Finish; das Aussehen verändert das Wasserverhalten nicht."
plPL = "Solidna, jednopoziomowa zapora wodna z możliwością układania w stosy jak standardowe wały oraz z zasadami wilgotności. Bursztynowa linia rozmieszczenia oznacza jej pełną wysokość blokowania. Wykończenie pasuje do Works; wygląd nie zmienia zachowania wody."
ptBR = "Barreira de água sólida de um nível, com regras de empilhamento e umidade de diques do jogo base. A linha de colocação âmbar marca sua altura total de bloqueio. Acabamento compatível com Works; a aparência não altera o comportamento da água."
koKR = "단일 층 높이의 고체 물막이로, 기본 둑 쌓기 및 습기 규칙을 따릅니다. 호박색 배치선은 전체 차단 높이를 표시합니다. 마감은 Works와 일치하며, 외관은 물의 동작을 바꾸지 않습니다."
trTR = "Tek katmanlı, katı bir su bariyeri; vanilya set yığılması ve nem kurallarına sahiptir. Kehribar yerleştirme çizgisi tam engelleme yüksekliğini gösterir. Görünümü Works ile eşleşir; görünüm su davranışını değiştirmez."
esES = "Barrera de agua sólida de un solo nivel, con apilamiento de diques de serie y reglas de humedad. La línea ámbar de colocación marca su altura completa de bloqueo. Acabado a juego con Works; el aspecto no cambia el comportamiento del agua."
itIT = "Barriera d'acqua solida a un solo livello con regole di impilamento e umidità della diga vanilla. La linea ambra di posizionamento indica la sua altezza di blocco completa. Finitura corrispondente alle opere; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Суцільний одноярусний водяний бар'єр із ванільним укладанням дамб і правилами вологості. Бурштинова лінія розміщення позначає його повну висоту блокування. Оздоблення відповідає іншим роботам; зовнішній вигляд не змінює поведінку води."
thTH = "สิ่งกีดขวางน้ำทึบแบบชั้นเดียวที่ซ้อนกันได้เหมือนคันกั้นน้ำมาตรฐาน และรับความชื้นตามกฎเดียวกัน เส้นสีอำพันตอนวางจะแสดงความสูงเต็มที่ใช้กั้นน้ำ การตกแต่งให้ผิวที่ตรงกับงานก่อผนัง แต่รูปลักษณ์ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Jednopatrová pevná vodní zábrana s vanilkovým skládáním hrází a pravidly vlhkosti. Oranžová čára umístění označuje její plnou výšku zadržování vody. Odpovídá dokončení z Works; vzhled nemění chování vody."
viVN = "Bức tường chắn nước đặc một tầng bằng đá, xếp chồng như đê vanilla và tuân theo quy tắc độ ẩm. Vạch đường đặt màu hổ phách đánh dấu toàn bộ chiều cao chặn nước. Lớp hoàn thiện khớp với Works; diện mạo không thay đổi cách nước hoạt động."
caES = "Barrera d'aigua sòlida d'un sol nivell amb apilament de rec vanilla i regles d'humitat. La línia d'ubicació ambre marca la seva alçada completa de bloqueig. Acabat coincident amb Works; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльная аднаярусная водазахісная сцяна з ванільным укладаннем дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яе поўную вышыню перакрыцця. Аздабленне адпавядае Works; выгляд не змяняе паводзіны вады."
roRO = "Zid solid de apă dintr-un singur nivel, cu așezare pe nivel ca la digurile standard și reguli de umiditate. Linia de amplasare galbenă marchează înălțimea totală de blocare. Finisajul corespunde cu cel al lucrărilor Matching; aspectul nu schimbă comportamentul apei."
huHU = "Egyszintes, tömör vízi gát a vanilla gátpalánk-egymásra rakási szabályokkal és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelöli a teljes elzárási magasságát. Az illeszkedő Works kivitelezés; a megjelenés nem változtat a vízi viselkedésen."
arSA = "جدار مائي صلب بارتفاع طبقة واحدة، يتراص مع السدود الأصلية ويخضع لقواعد الرطوبة. يحدد الخط البرتقالي المائل المخصص للتثبيت ارتفاع الحجب الكامل. يتطابق التشطيب مع أعمال الجدران، ولا يغيّر المظهر سلوك المياه."

