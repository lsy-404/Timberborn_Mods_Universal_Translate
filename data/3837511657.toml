viVN = "Tường chắn nước đặc một tầng bằng gỗ, dùng cách xếp đê tiêu chuẩn và quy tắc độ ẩm. Vạch đặt màu hổ phách đánh dấu chiều cao chặn nước tối đa. Lớp hoàn thiện khớp với các công trình LeveeWorks khác; diện mạo không làm thay đổi cách nước vận hành."
caES = "Barrera d'aigua sòlida d'un sol nivell amb apilament de rescloses de la versió base i regles d'humitat. La línia de col·locació ambre marca la seva altura bloquejant completa. L'acabat coincideix amb Works; l'aparença no canvia el comportament de l'aigua."
beBY = "Суцэльны аднаярусны водны бар'ер з ваніль-укладкай дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яго поўную вышыню блакавання. Адпавядае гатоўцы Works; выгляд не змяняе паводзіны вады."
roRO = "Barieră solidă de apă, dintr-un singur nivel, cu stivuire de diguri ca în versiunea standard și reguli de umiditate. Linia de amplasare chihlimbarie marchează înălțimea sa completă de blocare. Finisajul corespunde cu cel al Works; aspectul nu schimbă comportamentul apei."
huHU = "Egyszintes, szilárd vízgát, a vanilla gátak egymásra rakásának és a nedvességszabályoknak megfelelően. A borostyánsárga lerakási vonal jelzi teljes gátmagasságát. A Works-befejezéssel egyezik; a megjelenés nem változtatja meg a víz viselkedését."
