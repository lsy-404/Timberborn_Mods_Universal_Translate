["LeveeWorks.PlankWall.Boardwalk.Description"]
status = "normal"
raw = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
enUS = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
zhCN = "单层实心挡水结构，遵循原版堤坝的堆叠与湿度规则。琥珀色的放置线标示其完整挡水高度。外观与原版工艺一致，但外观不影响水的行为。"
zhTW = "單層實心水壩，具備原版堤壩堆疊與濕度規則。琥珀色的放置線標示其完整阻擋高度。外觀與原版工藝一致，但外觀不會改變水的行為。"
ruRU = "Сплошной однoуровневый водяной барьер с вертикальной укладкой дамбы по стандартным правилам и правилами влажности. Янтарная линия установки отмечает его полную высоту блокировки. Отделка соответствует Works; внешний вид не меняет поведение воды."
jaJP = "単一階層の固体の水堰で、通常の堰の積み重ね規則と湿気の規則に従います。琥珀色の設置線が、堰全体の遮断高さを示します。仕上げは同じくWorksの仕上げに合わせてあり、外観は水の挙動を変えません。"
frFR = "Barrière d'eau pleine d'un seul niveau, avec empilement de digues et règles d'humidité identiques à celles du jeu de base. La ligne de placement ambrée indique sa hauteur de blocage complète. Finition assortie aux Travaux ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Solide, einstöckige Wasserbarriere mit den Stapelregeln und Feuchtigkeitsregeln des Originaldamms. Die bernsteinfarbene Platzierungslinie markiert ihre volle Sperrhöhe. Passende Oberflächenbearbeitung; das Aussehen verändert das Wasserverhalten nicht."
plPL = "Solidna, jednopoziomowa zapora wodna z vanilla'owym układaniem wałów i zasadami wilgotności. Bursztynowa linia umieszczania oznacza jej pełną wysokość blokowania. Wykończenie zgodne z Works; wygląd nie zmienia zachowania wody."
ptBR = "Barreira de água sólida de um nível, com empilhamento de diques do jogo base e regras de umidade. A linha de colocação âmbar marca sua altura total de bloqueio. Acabamento compatível com Works; a aparência não altera o comportamento da água."
koKR = "단일 층 높이의 견고한 수문 장벽으로, 기본 제방과 같은 쌓기 방식과 습기 규칙을 따릅니다. 호박색 설치선은 차단 높이 전체를 표시합니다. 마감은 Works 계열과 맞으며, 외관은 물의 작동 방식을 바꾸지 않습니다."
trTR = "Tek seviyelik, katı bir su bariyeri; vanilya set yığma ve nem kurallarına sahip. Kehribar yerleştirme çizgisi tam engelleme yüksekliğini gösterir. Yapım Works kaplamasıyla eşleşir; görünüm su davranışını değiştirmez."
esES = "Barrera de agua sólida de un solo nivel con apilamiento de diques de serie y reglas de humedad. La línea de colocación ámbar marca su altura de bloqueo completa. Acabado a juego de Works; la apariencia no cambia el comportamiento del agua."
itIT = "Barriera d'acqua solida a un solo livello con impilamento come gli argini originali e regole di umidità. La linea di posizionamento ambra indica la sua altezza di blocco completa. Finitura coordinata con Works; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Суцільний однорівневий водний бар'єр із ванільним укладанням дамб і правилами вологості. Бурштинова лінія розміщення позначає його повну висоту блокування. Відповідає обробці Works; зовнішній вигляд не змінює поведінку води."
thTH = "กำแพงกั้นน้ำแบบทึบความสูงหนึ่งชั้น ใช้กฎการซ้อนคันกั้นน้ำมาตรฐานและกฎความชื้นเช่นเดียวกับของเกม เส้นสีอำพันตอนวางจะแสดงความสูงเต็มที่ที่สามารถกั้นน้ำได้ ผิวเสร็จแบบ Matching Works ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Jednopatrová pevná vodní zábrana s rovnými úrovněmi hrází a pravidly vlhkosti. Jantarová čára umístění označuje její plnou výšku blokování. Odpovídající povrchová úprava; vzhled nemění chování vody."
viVN = "Bức tường chắn nước đặc một tầng, được xếp chồng như đê vanilla và tuân theo quy tắc độ ẩm. Đường đánh dấu màu hổ phách khi đặt cho biết chiều cao chặn nước tối đa của nó. Phần hoàn thiện khớp với Works; diện mạo không thay đổi cách nước hoạt động."
caES = "Barrera d'aigua sòlida d'un sol nivell, amb apilament de rescloses (levee) de vainilla i regles d'humitat. La línia de col·locació ambre marca l'alçada total de bloqueig. L'acabat coincideix amb Works; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльны аднаярусны водны бар'ер з вanilla-укладкай дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яго поўную вышыню блакіравання. Адпавядае аздабленню Works; выгляд не змяняе паводзіны вады."
roRO = "Baraj solid de apă, cu un singur nivel, cu stivuire de dig din vanilla și reguli de umiditate. Linia de plasare chihlimbarie marchează înălțimea sa completă de blocare. Finisaj compatibil cu Works; aspectul nu schimbă comportamentul apei."
huHU = "Egyszintes, szilárd vízzáró gát a vanilla töltésállási és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelöli teljes zárómagasságát. Az anyag megegyezik a Works-kivitelezéssel; a megjelenés nem változtat a víz viselkedésén."
arSA = "حاجز مائي صلب بمستوى واحد، يتكدس مع السدود الأساسية ويتبع قواعد الرطوبة نفسها. يحدد الخط الكهرماني للتركيب ارتفاع الحجب الكامل. يتطابق التشطيب مع أعمال الخشب، لكن المظهر لا يغير سلوك الماء."

