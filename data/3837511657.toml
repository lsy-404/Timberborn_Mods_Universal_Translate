ruRU = "Сплошной однояростный водяной барьер с ванильным укладыванием дамб и правилами влажности. Жёлтая линия размещения показывает его полную высоту блокировки. Отделка соответствует Works; внешний вид не меняет поведение воды."
jaJP = "単層の固体水堰で、通常の堰と同じ積み重ね規則と湿度規則に従います。琥珀色の設置ラインが、遮断する高さの全体を示します。仕上げは同じ「Works」仕上げに合わせてあり、見た目を変えても水の挙動は変わりません。"
frFR = "Barrière d'eau solide d'un seul niveau, avec empilement de digue identique à la version de base et règles d'humidité. La ligne de placement ambre indique sa hauteur de blocage complète. Finition assortie aux Œuvres ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Massive, einstöckige Wasserbarriere mit vanilla Deichstapelung und Feuchtigkeitsregeln. Die bernsteinfarbene Platzierungslinie markiert ihre volle Sperrhöhe. Passende Works-Oberfläche; das Aussehen ändert das Wasserverhalten nicht."
plPL = "Solidna, jednopoziomowa zapora wodna z zasadami układania wałów i wilgotności, zgodnymi z oryginalną grą. Bursztynowa linia umieszczania oznacza jej pełną wysokość blokowania. Wykończenie pasuje do Works; wygląd nie zmienia zachowania wody."
ptBR = "Barreira de água sólida de um nível, com empilhamento de diques no estilo original e regras de umidade. A linha âmbar de posicionamento marca sua altura total de bloqueio. Acabamento compatível com Works; a aparência não altera o comportamento da água."
