thTH = "กำแพงกั้นน้ำแบบทึบความสูงหนึ่งชั้น ใช้กฎการซ้อนคันกั้นน้ำและความชื้นแบบมาตรฐาน เส้นสีอำพันตอนวางจะบอกความสูงเต็มที่ใช้กั้นน้ำ ผิวสำเร็จเป็นแบบ Matching Works แต่รูปลักษณ์ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Pevná jednopatrová vodní bariéra s běžným skládáním hrází a pravidly vlhkosti. Jantarová čára umístění označuje její plnou výšku blokování. Odpovídá povrchové úpravě Works; vzhled nemění chování vody."
viVN = "Tường chắn nước một tầng đặc, xếp chồng như đê vanilla và tuân theo quy tắc độ ẩm. Đường đánh dấu màu hổ phách khi đặt cho biết chiều cao chặn nước tối đa của nó. Lớp hoàn thiện khớp với Works; diện mạo không thay đổi cách nước vận hành."
caES = "Barrera d'aigua sòlida d'un sol nivell, amb l'apilament de rierols (levee) de vainilla i les regles d'humitat. La línia de col·locació ambre marca la seva alçada completa de bloqueig. L'acabat coincideix amb Works; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльная аднаяруснай водная перагародка з ванільным укладаннем дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яе поўную вышыню блакіроўкі. Адпавядае аздабленню Works; выгляд не мяняе ўзаемадзеянне з вадой."
roRO = "Barieră solidă de apă, de un singur nivel, cu stivuire de diguri ca în versiunea standard și reguli de umiditate. Linia de plasare chihlimbarie marchează înălțimea sa completă de blocare. Finisajul corespunde lucrărilor Matching; aspectul nu schimbă comportamentul apei."
huHU = "Egyszintes, tömör vízgát a vanilla gátrakásolási és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelzi teljes gátmagasságát. Megegyezik a Works-kivitelezéssel; a megjelenés nem változtatja meg a vízviselkedést."
arSA = "جدار مائي صلب بمستوى واحد، يتراص مع السدود الأصلية ويخضع لقواعد الرطوبة. يُظهر الخط الكهرماني لموضع البناء ارتفاع الحجب الكامل. يتطابق التشطيب مع أعمال الأخشاب، والمظهر لا يغيّر سلوك الماء."

