viVN = "Tường chắn nước đặc một tầng, dùng cách xếp đê tiêu chuẩn của trò chơi và quy tắc về độ ẩm. Đường đánh dấu màu hổ phách khi đặt cho biết chiều cao chặn nước tối đa. Lớp hoàn thiện khớp với Works; diện mạo không làm thay đổi cách nước hoạt động."
caES = "Barrera d'aigua sòlida d'un sol nivell amb apilament de rescloses com al joc base i regles d'humitat. La línia de col·locació ambre marca la seva altura bloquejadora completa. Acabat a joc amb Works; l'aparença no canvia el comportament de l'aigua."
beBY = "Суцэльны аднаярусны водны бар'ер з стандартным укладаннем дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння паказвае яго поўную вышыню блакіроўкі. Аздабленне ад Matching Works; знешні выгляд не змяняе паводзіны вады."
roRO = "Barieră solidă de apă, cu un singur nivel, care se așază ca un dig obișnuit și respectă regulile de umiditate. Linia de plasare chihlimbarie marchează înălțimea completă de blocare. Finisajul corespunde lucrărilor Works; aspectul nu schimbă comportamentul apei."
huHU = "Tömör, egyszintes vízzáró fal, a vanilla gátakhoz hasonló egymásra helyezéssel és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelöli a teljes záró magasságát. Az illeszkedő Works-kivitel csak a megjelenést érinti; a vízre gyakorolt hatása nem változik."
arSA = "الحاجز المائي الصلب ذو المستوى الواحد يتراص مع الجدران الحاجزة الأصلية ويخضع لقواعد الرطوبة. يحدد الخط البرتقالي الكهرماني ارتفاع الحجب الكامل له. يطابق التشطيب المعدني المصقول الأعمال الأخرى، والمظهر لا يغير سلوك الماء."
