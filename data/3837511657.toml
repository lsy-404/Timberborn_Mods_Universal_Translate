trTR = "Tek seviyeli, katı bir su bariyeri; vanilya seddi istiflenme ve nem kurallarına sahiptir. Kehribar yerleştirme çizgisi tam engelleme yüksekliğini gösterir. Eşleşen Works kaplaması; görünüm su davranışını değiştirmez."
esES = "Barrera de agua sólida de un solo nivel con apilamiento de diques de vainilla y reglas de humedad. La línea de colocación ámbar marca su altura de bloqueo completa. Acabado a juego con Works; la apariencia no cambia el comportamiento del agua."
itIT = "Barriera d'acqua solida a un solo livello con impilamento come da argine standard e regole di umidità. La linea di posizionamento ambra indica la sua altezza di blocco completa. Finitura coordinata con Works; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Суцільний однорівневий водний бар'єр із ванільним укладанням дамб і правилами вологості. Бурштиновий лінійний маркер розміщення показує його повну висоту блокування. Відповідає обробці Works; зовнішній вигляд не змінює поведінку води."
