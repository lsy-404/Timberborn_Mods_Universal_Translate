["LeveeWorks.MasonryWall.Cobblestone.Description"]
status = "normal"
raw = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
enUS = "Solid one-level water barrier with vanilla levee stacking and moisture rules. The amber placement line marks its full blocking height. Matching Works finish; appearance does not change water behaviour."
zhCN = "单层实心挡水墙，与原版堤坝的堆叠规则及湿度规则一致。琥珀色的放置线标示其完整挡水高度。采用匹配的工坊外观；外观不会改变水的行为。"
zhTW = "單層實心水障，具備原版堤防疊放與濕度規則。琥珀色放置線標示其完整阻擋高度。與 Works 系列裝修相符；外觀不會改變水的行為。"
ruRU = "Сплошной однояростный водяной барьер с обычным наращиванием дамб и правилами влажности. Жёлтая линия установки обозначает его полную высоту блокировки. Отделка соответствует Works; внешний вид не меняет поведение воды."
jaJP = "単層の固体水遮断壁です。バニラの堤防の積み重ねルールと湿気のルールに従います。琥珀色の設置ラインは、遮断が有効となる全高を示します。仕上げは対応する「Works」仕上げです。見た目を変えても水の挙動は変わりません。"
frFR = "Barrière d'eau solide d'un seul niveau, avec l'empilement de digues et les règles d'humidité de base. La ligne de placement ambrée indique sa hauteur de blocage complète. Finition assortie aux Travaux ; l'apparence ne modifie pas le comportement de l'eau."
deDE = "Solide einstöckige Wassersperre mit den Stapelregeln und Feuchtigkeitsregeln des Originaldamms. Die bernsteinfarbene Platzierungslinie markiert ihre volle Sperrhöhe. Das Aussehen entspricht dem Werk von Matching Works, verändert aber nicht das Verhalten des Wassers."
plPL = "Solidna, jednopoziomowa bariera wodna z zasadami układania wałów z gry podstawowej oraz zasadami wilgoci. Bursztynowa linia rozmieszczenia oznacza jej pełną wysokość blokowania. Wykończenie pasuje do Works; wygląd nie zmienia zachowania wody."
ptBR = "Barreira sólida de água de um nível, com empilhamento de diques do jogo base e regras de umidade. A linha âmbar de posicionamento marca sua altura total de bloqueio. Acabamento compatível com as Obras; a aparência não altera o comportamento da água."
koKR = "단일 층 높이의 고체 물막이 벽으로, 기본 제방 쌓기와 습기 규칙을 따릅니다. 노란색 배치선은 차단 높이 전체를 표시합니다. 마감은 Works와 일치하며, 외관은 물의 동작을 바꾸지 않습니다."
trTR = "Tek seviyeli, katı bir su bariyeri; vanilya set yığılması ve nem kurallarını kullanır. Kehribar yerleştirme çizgisi tam engelleme yüksekliğini gösterir. Görünüm Works bitişine uygundur; görünüm su davranışını değiştirmez."
esES = "Barrera de agua sólida de un solo nivel con apilamiento de diques estándar y reglas de humedad. La línea ámbar de colocación marca su altura total de bloqueo. Acabado a juego de LeveeWorks; la apariencia no cambia el comportamiento del agua."
itIT = "Barriera solida per l'acqua a un solo livello, con impilamento come gli argini standard e regole di umidità. La linea di posizionamento ambra indica la sua altezza completa di blocco. Finitura coerente con le opere; l'aspetto non modifica il comportamento dell'acqua."
ukUA = "Суцільний однорівневий водний бар'єр із ванільним укладанням дамб і правилами вологості. Бурштиновий лінійний маркер на розміщенні позначає його повну висоту блокування. Оздоблення відповідає іншим роботам Matching Works; зовнішній вигляд не змінює поведінку води."
thTH = "กำแพงกั้นน้ำแบบทึบความสูงชั้นเดียว รองรับการซ้อนคันกั้นน้ำแบบเดิมและกฎเรื่องความชื้น เส้นสีอำพันที่วางจะแสดงความสูงเต็มที่ของการกั้นน้ำ ผิวเสร็จตรงกับงานก่ออิฐ แต่รูปลักษณ์ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Pevná jednopatrová vodní hráz s běžným skládáním hrází a pravidly vlhkosti. Jantarová čára pro umístění označuje její plnou výšku blokování. Dokončení odpovídá ostatním dílům Works; vzhled nemění chování vody."
viVN = "Tường chắn nước đặc một tầng, bằng đá, dùng cách xếp đê và quy tắc độ ẩm giống bản gốc. Vạch đặt màu hổ phách cho biết chiều cao chắn nước tối đa. Hoàn thiện tương ứng với Works; vẻ ngoài không thay đổi hành vi của nước."
caES = "Barrera d'aigua sòlida d'un sol nivell, amb apilament de dics estàndard i regles d'humitat. La línia de col·locació ambre marca la seva altura completa de bloqueig. El acabat coincideix amb Works; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльны аднаярусны водны бар'ер са стандартным складаннем дамбаў і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яго поўную вышыню блакавання. Адпавядае аддзелцы Works; знешні выгляд не змяняе паводзіны вады."
roRO = "Barieră solidă de apă, dintr-un singur nivel, cu așezare de diguri din joc și reguli de umiditate. Linia de plasare chihlimbarie marchează înălțimea completă de blocare. Finisajul corespunde celorlalte lucrări Works; aspectul nu schimbă comportamentul apei."
huHU = "Egyszintes, szilárd vízgát a vanília töltésrakási szabályokkal és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelöli a teljes elzáró magasságát. Az építmény kivitelezése illeszkedik a Works stílusához; a megjelenés nem változtatja meg a víz viselkedését."
arSA = "حاجز مائي صلب بمستوى واحد، يتكدس مع السدود الأصلية ويتأثر بقواعد الرطوبة. يحدد الخط البرتقالي الكهرماني في أثناء الوضع ارتفاع الحجب الكامل. يطابق التشطيب تشطيب الأعمال، ولا يغيّر المظهر سلوك الماء."

