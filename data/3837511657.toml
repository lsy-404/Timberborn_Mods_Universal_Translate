csCZ = "Jednopatrová pevná vodní bariéra s vanilkovým skládáním hrází a pravidly vlhkosti. Jantarová čára umístění označuje její plnou výšku zadržování. Odpovídající povrchová úprava; vzhled nemění chování vody."
viVN = "Tường chắn nước đặc một tầng bằng gạch, xếp chồng giống đê tiêu chuẩn và tuân theo quy tắc độ ẩm. Đường ranh màu hổ phách khi đặt đánh dấu chiều cao chặn nước tối đa. Lớp hoàn thiện khớp với Works; ngoại hình không thay đổi cách nước hoạt động."
caES = "Barrera d'aigua sòlida d'un sol nivell amb apilament de rec vanilla i regles d'humitat. La línia de col·locació ambar marca la seva alçada de bloqueig completa. L'acabat coincideix amb els Works; l'aspecte no canvia el comportament de l'aigua."
beBY = "Суцэльны аднаярусны водны бар'ер з вanilla-правілам укладкі дамбы і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яго поўную блакавальную вышыню. Адпавядае аздабленню Works; знешні выгляд не змяняе паводзіны вады."
roRO = "Perete solid de apă, cu un singur nivel, cu regulile vanilla de suprapunere a digurilor și de umiditate. Linia de plasare de culoare chihlimbarie marchează înălțimea sa completă de blocare. Finisajul corespunde cu cel al Works; aspectul nu schimbă comportamentul apei."
huHU = "Egyszintes, tömör vízgát a vanilla gáttal azonos egymásra építési és nedvességi szabályokkal. A borostyánsárga lerakási vonal jelöli teljes záróműszaki magasságát. A Works-befejezés illeszkedik, a megjelenés nem változtat a víz viselkedésén."
arSA = "جدار مائي صلب بمستوى واحد، يتراص مع السدود الأصلية وفق قواعد الرطوبة نفسها. يُظهر الخط البرتقالي عند الوضع أقصى ارتفاع لحجب الماء بالكامل. يتطابق التشطيب مع أعمال الورش، لكن المظهر لا يغيّر سلوك الماء."

