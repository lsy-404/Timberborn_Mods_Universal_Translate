ukUA = "Суцільний одноярусний водний бар'єр з ванільним штабелюванням дамб і правилами вологості. Бурштинова лінія розміщення позначає його повну висоту блокування. Оздоблення відповідає іншим виробам; зовнішній вигляд не змінює поведінку води."
thTH = "สิ่งกีดขวางน้ำแบบทึบขนาดหนึ่งชั้น ใช้กฎการซ้อนคันกั้นน้ำมาตรฐานและกฎความชื้น เส้นตั้งวางสีอำพันแสดงความสูงเต็มที่ของการกั้นน้ำ ผิวสำเร็จตรงกับงานไม้ แต่รูปลักษณ์ไม่เปลี่ยนพฤติกรรมของน้ำ"
csCZ = "Jednoúrovňová pevná vodní zábrana s vanilkovým pravidlem skládání hrází a pravidly vlhkosti. Jantarová čára umístění označuje její plnou výšku blokování. Odpovídá dokončení Works; vzhled nemění chování vody."
viVN = "Tường chắn nước đặc một tầng, có thể xếp chồng như đê vanilla và tuân theo quy tắc độ ẩm. Vạch đặt màu hổ phách đánh dấu chiều cao chặn nước tối đa của nó. Hoàn thiện theo Works phù hợp; diện mạo không thay đổi hành vi của nước."
caES = "Barrera d'aigua sòlida d'un sol nivell, amb apilament de rescloses com a l'original i regles d'humitat. La línia de col·locació ambre marca la seva alçada total de bloqueig. L'acabat coincideix amb Works; l'aparença no canvia el comportament de l'aigua."
beBY = "Суцэльная аднаярусная вадзяная перагародка з усталёўкай, як у ванільнага вала, і правіламі вільготнасці. Бурштынавая лінія размяшчэння пазначае яе поўную вышыню блакавання. Адпавядае аздабленню Works; выгляд не змяняе паводзіны вады."
roRO = "Barieră solidă de apă, cu un singur nivel, care se împachetează ca digul clasic și respectă regulile de umiditate. Linia de plasare de culoare chihlimbar marchează înălțimea totală de blocare. Finisajul corespunde cu Works; aspectul nu modifică comportamentul apei."
huHU = "Egyszintes, tömör vízzáró gát, a vanilla gátegymásra rakás és nedvesség-szabályok szerint. A borostyánsárga lerakási vonal jelzi teljes záró magasságát. Az anyagszín illeszkedik a Works kivitelezéséhez; a megjelenés nem változtat a víz viselkedésén."
arSA = "حاجز مائي صلب بمستوى واحد يتكدس بنفس طريقة السدود الأصلية ويخضع لقواعد الرطوبة. يحدد الخط البرتقالي المائل عند الوضع ارتفاع الحجب الكامل. يطابق التشطيب أعمال الخشب، لكن المظهر لا يغيّر سلوك الماء."

