["Building.Market.Description"]
raw = "Workers haul food from nearby storage to the market, where beavers can come and grab any food they need."
status = "normal"
enUS = "Workers transport food from nearby storage to the market, where beavers can come and take any food they need."
zhCN = "工人将食物从附近的储存处运输到市场，海狸可以在这里取走他们需要的任何食物。"
zhTW = "工作者將食物從附近的儲藏室運送到市場，海狸可以來這裡取用他們需要的食物。"
ruRU = "Рабочие переносят еду из ближайшего склада на рынок, где бобры могут прийти и забрать любую еду, которая им нужна."
jaJP = "「作業員は近くの倉庫から市場へ食料を運び、そこではビーバーたちが必要な食料を取りに来ることができます。」"
frFR = "Les ouvriers transportent de la nourriture depuis les entrepôts voisins vers le marché, où les castors peuvent venir prendre la nourriture dont ils ont besoin."
deDE = "Arbeiter transportieren Nahrung aus nahegelegenen Lagern zum Markt, wo Biber kommen und sich die benötigte Nahrung holen können."
plPL = "Pracownicy transportują jedzenie z pobliskich magazynów do rynku, gdzie bobry mogą przyjść i wziąć dowolne jedzenie, którego potrzebują."
ptBR = "Os trabalhadores transportam comida do armazenamento próximo para o mercado, onde os castores podem vir e pegar qualquer comida de que precisem."
koKR = "제작자들이 인근 저장소에서 시장으로 음식을 운반하며, 그곳에서 비버들이 필요한 음식을 가져갈 수 있습니다."
trTR = "İşçiler, yakındaki depolardan yiyecekleri pazar yerine taşır, burada kunduzlar ihtiyaç duydukları yiyecekleri alabilir."
esES = "Los trabajadores transportan comida desde los almacenes cercanos hasta el mercado, donde los castores pueden acercarse y tomar la comida que necesiten."
itIT = "I lavoratori trasportano il cibo dai magazzini vicini al mercato, dove i castori possono venire a prendere il cibo di cui hanno bisogno."
ukUA = "Працівники переносять їжу з найближчих складів на ринок, де бобри можуть підійти й узяти будь-яку потрібну їм їжу."
thTH = "คนงานขนส่งอาหารจากคลังสินค้าใกล้เคียงไปยังตลาด ซึ่งบีเวอร์สามารถมาหยิบอาหารที่ต้องการได้"
csCZ = "Pracovníci nosí jídlo z blízkého skladu na trh, kde si bobři mohou vzít jakékoli jídlo, které potřebují."
viVN = "Công nhân vận chuyển thực phẩm từ kho gần đó đến chợ, nơi các chú beaver có thể đến và lấy bất kỳ thực phẩm nào mà họ cần."
caES = "Els treballadors porten el menjar des de l'magatzem proper fins al mercat, on els castors poden venir i agafar qualsevol menjar que necessitin."
beBY = "Работнікі пераносяць ежу з бліжняга склада на рынак, дзе бабры могуць прыходзіць і браць любую ежу, якая ім патрэбна."
roRO = "Muncitorii transportă hrana de la depozitele din apropiere până la piață, unde castorii pot veni și lua orice hrană au nevoie."
huHU = "Munkások szállítják az élelmiszert a közeli raktárakból a piacra, ahol a bódék bármelyik bóbita számára elérhetővé teszik a szükséges élelmet."
arSA = "يقوم العمال بنقل الطعام من المخازن القريبة إلى السوق، حيث يمكن للقنادس الحضور والحصول على أي طعام يحتاجونه."

["Building.Market.FlavorDescription"]
raw = "On market days, the freshest berries, breads and water from across the settlement are gathered under one roof."
status = "normal"
enUS = "On market days, the freshest berries, breads, and water from across the settlement are gathered under one roof."
zhCN = "在集市日，来自整个定居点最新鲜的浆果、面包和水汇聚在一处。"
zhTW = "在市集日，整個定居點最新鮮的莓果、麵包和水都集中在同一個屋簷下。"
ruRU = "В дни рынка самые свежие ягоды, хлеб и вода со всего поселения собираются под одной крышей."
jaJP = "「マーケットの日には、集落のあらゆる所から集められた新鮮なベリー、パン、水が一つの屋根の下に集められます。」"
frFR = "Lors des journées de marché, les baies, pains et eaux les plus frais de tout le peuplement sont rassemblés sous un même toit."
deDE = "An Markttagen werden die frischesten Beeren, Brote und Wasser aus der ganzen Siedlung unter einem Dach gesammelt."
plPL = "W dni targowe najświeższe jagody, pieczywo i woda z całego osiedla są zbierane pod jednym dachem."
ptBR = "Nos dias de mercado, as frutas mais frescas, pães e água de toda a colônia são reunidos sob um único teto."
koKR = "시장 날에는 정착지 곳곳에서 가장 신선한 베리, 빵, 그리고 물이 한곳에 모입니다."
trTR = "Pazar günlerinde, yerleşimin dört bir yanından en taze meyveler, ekmekler ve sular tek bir çatı altında toplanır."
esES = "Los días de mercado, las bayas más frescas, el pan y el agua de todo el asentamiento se reúnen bajo un mismo techo."
itIT = "Nei giorni di mercato, le bacche più fresche, il pane e l'acqua di tutto l'insediamento vengono raccolti sotto un unico tetto."
ukUA = "У дні ярмарку найсвіжіші ягоди, хліби та вода з усього поселення збираються під одним дахом."
thTH = "ในวันตลาด ผลเบอร์รี่สด ขนมปัง และน้ำที่ดีที่สุดจากทั่วทั้งชุมชนจะถูกนำมารวบรวมไว้ภายใต้หลังคาเดียวกัน"
csCZ = "V tržních dnech se pod jednu střechu shromažďují ty nejčerstvější bobule, chleby a voda z celého osídlení."
viVN = "Vào những ngày chợ, những quả mọng tươi nhất, bánh mì và nước từ khắp nơi trong khu định cư được tập hợp dưới một mái nhà."
caES = "Els dies de mercat, les baies, el pa i l'aigua més frescos de tot l'assentament es reuneixen sota un mateix sostre."
beBY = "У дні кірмашу найсвежыя ягады, хлеб і вада з усяго пасялення зносяцца пад адзіны дах."
roRO = "În zilele de târg, cele mai proaspete fructe de pădure, pâini și apă din toată așezarea sunt adunate sub un singur acoperiș."
huHU = "Piaci napokon a település legfrissebb bogyói, kenyerei és vize egy fedél alatt gyűlnek össze."
arSA = "في أيام السوق، تُجمع أفضل التوت والخبز والمياه من أنحاء المستوطنة كلها تحت سقف واحد."
