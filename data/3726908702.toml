["Keystone.Settings.Overgrowth.Density.Tooltip"]
raw = "How quickly trees get overgrown with weeds, bushes, and moss. Purely visual — it does not change how fast dead trees are replaced.\n\n0% turns overgrowth visuals off entirely.\n100% is the default rate.\n200% is twice as fast."
status = "normal"
enUS = "How quickly trees get overgrown with weeds, bushes, and moss. Purely visual — it does not change how fast dead trees are replaced.\n\n0% turns overgrowth visuals off entirely.\n100% is the default rate.\n200% is twice as fast."
zhCN = "“树木被杂草、灌木和苔藓覆盖的速度。纯粹是视觉效果——不会影响枯死树木的更替速度。\n\n0% 完全关闭覆盖视觉效果。\n100% 是默认速率。\n200% 是两倍的速度。”"
zhTW = "樹木被雜草、灌木和苔蘚覆蓋的速度。純粹為視覺效果——不會改變枯死樹木的更替速度。\n\n0% 會完全關閉過度生長的視覺效果。\n100% 是默認速率。\n200% 是兩倍速。"
ruRU = "Насколько быстро деревья заррастают сорняками, кустарниками и мхом. Чисто визуально — это не влияет на скорость замены мёртвых деревьев.\n\n0% полностью отключает визуальный эффект зарастания.\n100% — это стандартный уровень.\n200% — в два раза быстрее."
jaJP = "樹木が雑草や草むら、苔に覆われる速さ。純粋にビジュアル面でのものであり、枯れた木が置き換えられる速さには影響しません。\n\n0%はオーバーグロースのビジュアルを完全にオフにします。\n100%がデフォルトの速度です。\n200%は2倍の速さです。"
frFR = "À quelle vitesse les arbres sont envahis par les mauvaises herbes, les buissons et la mousse. Purement visuel — cela ne change pas la vitesse à laquelle les arbres morts sont remplacés.\n\n0 % désactive complètement les visuels de surcroissance.\n100 % est le taux par défaut.\n200 % est deux fois plus rapide."
deDE = "„Wie schnell Bäume mit Unkraut, Büschen und Moos überwuchert werden. Rein visuell – es ändert sich nichts daran, wie schnell tote Bäume ersetzt werden.\n\n0 % schaltet die Überwucherungseffekte vollständig aus.\n100 % ist die Standardrate.\n200 % ist doppelt so schnell.“"
plPL = "Jak szybko drzewa pokrywają się chwastami, krzewami i mchem. Całkowicie wizualne — nie wpływa na to, jak szybko martwe drzewa są zastępowane.\n\n0% całkowicie wyłącza wizualizację nadmiernego wzrostu.\n100% to domyślny wskaźnik.\n200% jest dwa razy szybsze."
ptBR = "Quão rapidamente as árvores são cobertas por ervas daninhas, arbustos e musgos. Puramente visual — não altera a rapidez com que árvores mortas são substituídas.\n\n0% desliga completamente as visuais de supercrescimento.\n100% é a taxa padrão.\n200% é duas vezes mais rápido."
koKR = "나무가 잡초, 덤불, 이끼로 얼마나 빨리 덮이는지를 결정합니다. 순전히 시각적인 효과로, 죽은 나무가 교체되는 속도에는 영향을 주지 않습니다.\n\n0%는 덮임 효과를 완전히 끕니다.\n100%는 기본 비율입니다.\n200%는 두 배 빠른 속도입니다."
trTR = "Ağaçların ne kadar hızlı şekilde yabani otlar, çalılar ve yosunlarla kaplandığı. Tamamen görsel - ölü ağaçların ne kadar hızlı değiştirileceğini etkilemez.\n\n%0, aşırı büyüme görselliğini tamamen kapatır.\n%100, varsayılan hızdır.\n%200, iki kat daha hızlıdır."
esES = "Qué tan rápido los árboles se cubren de malezas, arbustos y musgo. Es puramente visual: no cambia la velocidad con la que se reemplazan los árboles muertos.\n\n0% desactiva por completo los efectos visuales de la maleza.\n100% es la tasa predeterminada.\n200% es el doble de rápido."
itIT = "Quanto rapidamente gli alberi si ricoprono di erbacce, cespugli e muschio. Puramente visivo: non modifica la velocità con cui gli alberi morti vengono sostituiti.\n\n0% disattiva completamente gli effetti visivi della vegetazione infestante.\n100% è la velocità predefinita.\n200% è due volte più veloce."
ukUA = "Наскільки швидко дерева зарастають бур'янами, кущами та мохом. Суто візуальний ефект — він не змінює того, як швидко замінюються мертві дерева.\n\n0% повністю вимикає візуальні ефекти заростання.\n100% — це стандартна швидкість.\n200% — удвічі швидше."
thTH = "ความเร็วที่ต้นไม้จะถูกปกคลุมด้วยวัชพืช พุ่มไม้ และตะไคร่ มีผลเพียงด้านภาพเท่านั้น และไม่เปลี่ยนความเร็วในการแทนที่ต้นไม้ที่ตายแล้ว\n\n0% คือการปิดภาพการปกคลุมด้วยวัชพืชทั้งหมด\n100% คือค่าเริ่มต้น\n200% คือเร็วเป็นสองเท่า"
csCZ = "Jak rychle se stromy pokrývají plevelem, keři a mechem. Pouze vizuální — nemění to, jak rychle jsou nahrazovány mrtvé stromy.\n\n0 % zcela vypíná vizuály přerůstání.\n100 % je výchozí rychlost.\n200 % je dvakrát rychlejší."
viVN = "Cây cối bị phát triển tươi tốt như thế nào với cỏ dại, bụi rậm và rêu. Hoàn toàn chỉ mang tính chất hình ảnh - nó không thay đổi tốc độ thay thế cây chết.\n\n0% tắt hoàn toàn hình ảnh phát triển tươi tốt.\n100% là tốc độ mặc định.\n200% là nhanh gấp đôi."
caES = "Amb quina rapidesa els arbres es cobreixen de mala herba, arbusts i molsa. És només visual: no canvia la rapidesa amb què es reemplacen els arbres morts.\n\n0% desactiva completament els efectes visuals de la vegetació envaïdora.\n100% és la velocitat per defecte.\n200% és el doble de ràpida."
beBY = "Наколькі хутка дрэвы зарастаюць пустазеллем, кустамі і мохам. Чыста візуальны эфект — ён не змяняе тое, як хутка мёртвыя дрэвы замяняюцца.\n\n0% цалкам адключае візуальныя эфекты зарастання.\n100% — стандартная хуткасць.\n200% — удвая хутчэй."
roRO = "Cât de repede sunt copacii acoperiți de buruieni, tufișuri și mușchi. Este strict vizual — nu schimbă viteza cu care copacii morți sunt înlocuiți.\n\n0% dezactivează complet elementele vizuale ale acoperirii cu vegetație.\n100% este rata implicită.\n200% este de două ori mai rapid."
huHU = "Milyen gyorsan nőnek be a fák gazzal, bokrokkal és mohával. Ez csak vizuális hatás – nem változtatja meg, hogy milyen gyorsan pótolják a kidőlt fákat.\n\nA 0% teljesen kikapcsolja a beborítottság megjelenítését.\nA 100% az alapértelmezett sebesség.\nA 200% kétszer olyan gyors."
arSA = "يمدّ هذا الإعداد مدى سرعة نمو الأعشاب الضارة والشجيرات والطحالب على الأشجار. وهو تأثير بصري فقط، ولا يغيّر سرعة استبدال الأشجار الميتة.\n\nتُلغي نسبة 0% تأثيرات النمو المفرط بالكامل.\nتمثل نسبة 100% المعدل الافتراضي.\nتعني نسبة 200% أنه أسرع بمرتين."

