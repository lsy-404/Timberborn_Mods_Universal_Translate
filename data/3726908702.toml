zhCN = "开启后，将凯斯通的砍伐规划工具添加到森林砍伐菜单中。下次打开该菜单时会出现按钮。默认开启；在这里关闭以隐藏按钮。"
zhTW = "開啟後，將Keystone的砍伐規劃畫筆添加到樹木砍伐菜單中。下次打開該菜單時，按鈕會出現。默認為開啟狀態；在此關閉以隱藏按鈕。"
ruRU = "При включении добавляет кисть планировщика вырубки Keystone в меню вырубки деревьев лесника. Кнопка появится при следующем открытии этого меню. Включено по умолчанию; отключите здесь, чтобы скрыть кнопку."
jaJP = "「オンにすると、林業の木の伐採メニューにKeystoneの伐採計画ブラシが追加されます。次回そのメニューを開いたときにボタンが表示されます。デフォルトではオンになっており、ここでオフにするとボタンが隠れます。」"
