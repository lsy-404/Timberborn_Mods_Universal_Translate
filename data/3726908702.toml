["Keystone.Settings.Overgrowth.ReplacementRate.Tooltip"]
raw = "How quickly mature dead trees are replaced by new saplings — leaving wood on the ground to haul, like a felled tree. Works whether or not the tree is overgrown.\n\n0% means dead trees are never replaced.\n100% is the default speed.\n200% is twice as fast."
status = "normal"
enUS = "How quickly mature dead trees are replaced by new saplings — leaving wood on the ground to haul, like a felled tree. Works whether or not the tree is overgrown.\n\n0% means dead trees are never replaced.\n100% is the default speed.\n200% is twice as fast."
zhCN = "成熟的枯树被新幼苗替代的速度——留在地上的木材可以收集，就像倒下的树一样。无论树木是否过度生长都有作用。\n\n0% 表示枯树永不被替代。\n100% 是默认速度。\n200% 是速度的两倍。"
zhTW = "成熟的枯死樹木被新樹苗替代的速度—留下可以搬運的木材，像是一棵倒下的樹。不管該樹木是否過度生長都適用。\n\n0% 表示枯死樹木永遠不會被替代。\n100% 是默認速度。\n200% 是兩倍速度。"
ruRU = "Как быстро зрелые мертвые деревья заменяются новыми саженцами — оставляя древесину на земле для транспортировки, как упавшее дерево. Работает независимо от того, покрыто ли дерево растительностью.\n\n0% означает, что мертвые деревья никогда не заменяются.\n100% — это скорость по умолчанию.\n200% — вдвое быстрее."
jaJP = "成熟した枯れ木が新しい苗に置き換えられる速度 - 伐採された木のように地面に木材が残る。木が成長しているかどうかに関係なく機能します。\n\n0%は枯れ木が決して置き換えられないことを意味します。\n100%がデフォルトの速度です。\n200%は2倍の速さです。"
frFR = "À quelle vitesse les arbres morts matures sont remplacés par de nouveaux jeunes plants — laissant du bois au sol à transporter, comme un arbre abattu. Fonctionne que l'arbre soit envahi ou non.\n\n0 % signifie que les arbres morts ne sont jamais remplacés.\n100 % est la vitesse par défaut.\n200 % est deux fois plus rapide."
deDE = "Wie schnell reife, abgestorbene Bäume durch neue Setzlinge ersetzt werden – wobei Holz auf dem Boden zum Abtransport liegt, wie bei einem gefällten Baum. Funktioniert unabhängig davon, ob der Baum überwuchert ist.\n\n0 % bedeutet, dass tote Bäume niemals ersetzt werden.\n100 % ist die standardmäßige Geschwindigkeit.\n200 % ist doppelt so schnell."
plPL = "Jak szybko dojrzałe martwe drzewa są zastępowane nowymi sadzonkami - pozostawiając na ziemi drewno do zabrani, jak przewrócone drzewo. Działa niezależnie od tego, czy drzewo jest zarośnięte.\n\n0% oznacza, że martwe drzewa nigdy nie zostaną zastąpione.\n100% to domyślna prędkość.\n200% to dwa razy szybciej."
ptBR = "Quão rapidamente árvores mortas maduras são substituídas por novas mudas — deixando madeira no chão para ser transportada, como uma árvore caída. Funciona independentemente de a árvore estar supercrescida.\n\n0% significa que árvores mortas nunca são substituídas.\n100% é a velocidade padrão.\n200% é duas vezes mais rápido."
koKR = "성숙한 고사목이 새로운 어린 묘목으로 교체되는 속도 — 땅에 나무를 남겨두어 수확할 수 있습니다, 베어진 나무처럼. 나무가 과잉 자란 경우에도 작동합니다.\n\n0%는 고사목이 결코 교체되지 않음을 의미합니다.\n100%는 기본 속도입니다.\n200%는 두 배 빠릅니다."
trTR = "Olgun kuru ağaçların ne kadar hızlı bir şekilde yeni fidelerle değiştirileceği — yerde taşımak için odun bırakır, tıpkı devrilmiş bir ağaç gibi. Ağacın aşırı büyüyüp büyümemesi fark etmeksizin çalışır.\n\n%0, kuru ağaçların asla değiştirilmediği anlamına gelir.\n%100, varsayılan hızdır.\n%200, iki kat daha hızlıdır."
esES = "Qué tan rápido los árboles muertos maduros son reemplazados por nuevos brotes, dejando madera en el suelo para acarrear, como con un árbol talado. Funciona independientemente de si el árbol está sobrecrecido.\n\n0% significa que los árboles muertos nunca son reemplazados.\n100% es la velocidad predeterminada.\n200% es el doble de rápido."
itIT = "Quanto rapidamente gli alberi morti maturi vengono sostituiti da nuovi germogli — lasciando legname a terra da trasportare, come per un albero abbattuto. Funziona indipendentemente dal fatto che l'albero sia invecchiato o meno.\n\n0% significa che gli alberi morti non vengono mai sostituiti.\n100% è la velocità predefinita.\n200% è due volte più veloce."
ukUA = "Наскільки швидко зрілі мертві дерева замінюються новими саджанцями — при цьому деревина лишається на землі для перевезення, як і у випадку зрубаного дерева. Працює незалежно від того, чи дерево заросло.\n\n0% означає, що мертві дерева ніколи не замінюються.\n100% — швидкість за замовчуванням.\n200% — удвічі швидше."
thTH = "ความเร็วที่ต้นไม้ตายที่โตเต็มที่จะถูกแทนที่ด้วยต้นกล้าใหม่ โดยทิ้งไม้ไว้บนพื้นให้ลากไป เหมือนต้นไม้ที่ถูกโค่น ใช้ได้ไม่ว่าต้นไม้นั้นจะรกหรือไม่ก็ตาม\n\n0% หมายถึงต้นไม้ตายจะไม่ถูกแทนที่เลย\n100% คือความเร็วเริ่มต้น\n200% คือเร็วเป็นสองเท่า"
csCZ = "Jak rychle jsou dospělé mrtvé stromy nahrazovány novými sazenicemi — zanechávají dřevo na zemi k odvozu, jako když je pokácený strom. Funguje to bez ohledu na to, zda je strom přerostlý.\n\n0 % znamená, že mrtvé stromy nejsou nikdy nahrazovány.\n100 % je výchozí rychlost.\n200 % je dvakrát rychlejší."
viVN = "Tốc độ thay thế cây chết trưởng thành bằng cây non mới — để lại gỗ trên mặt đất để thu dọn, giống như một cái cây đã bị đốn hạ. Có hiệu lực cho dù cây có bị mọc um tùm hay không.\n\n0% có nghĩa là cây chết không bao giờ được thay thế.\n100% là tốc độ mặc định.\n200% là nhanh gấp đôi."
caES = "Amb quina rapidesa els arbres morts madurs són substituïts per plançons nous, deixant la fusta a terra perquè es transporti, com un arbre talat. Funciona tant si l'arbre està cobert de vegetació com si no ho està.\n\n0% vol dir que els arbres morts mai no es substitueixen.\n100% és la velocitat predeterminada.\n200% és el doble de ràpid."
beBY = "Наколькі хутка спелыя мёртвыя дрэвы замяняюцца новымі саджанцамі — пры гэтым драўніна застаецца на зямлі для перавозкі, як пасля зрубленага дрэва. Працуе незалежна ад таго, зарасло дрэва ці не.\n\n0% азначае, што мёртвыя дрэвы ніколі не замяняюцца.\n100% — стандартная хуткасць.\n200% — удвая хутчэй."
roRO = "Cât de repede sunt înlocuiți copacii morți cu puieți noi, lăsând lemnul pe jos pentru a fi transportat, ca după doborârea unui copac. Funcționează indiferent dacă arborele este supracrescut sau nu.\n\n0% înseamnă că arborii morți nu sunt niciodată înlocuiți.\n100% este viteza implicită.\n200% este de două ori mai rapid."
huHU = "Milyen gyorsan pótolódnak az elhalt fák új facsemetékkel, ha már beértek — a kidőlt fa módjára a földön maradt fát el kell szállítani. Akkor is működik, ha a fa el van burjánzva vagy nincs.\n\n0% azt jelenti, hogy az elhalt fákat soha nem pótolják.\n100% az alapértelmezett sebesség.\n200% kétszer olyan gyors."
arSA = "كم السرعة التي تُستبدل بها الأشجار الميتة الناضجة بشتلات جديدة، مع ترك الخشب على الأرض لنقله كما في الشجرة المقطوعة. يعمل ذلك سواء كانت الشجرة متضخمة النمو أم لا.\n\n0% تعني أن الأشجار الميتة لا تُستبدل أبدًا.\n100% هي السرعة الافتراضية.\n200% تعني أنها أسرع بمرتين."

