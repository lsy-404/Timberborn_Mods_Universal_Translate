trTR = "Açık olduğunda, Keystone'un kesme planlayıcı fırçasını ağaç kesme menüsüne ekler. Buton, o menüyü bir sonraki açışınızda görünür. Varsayılan olarak açıktır; butonu gizlemek için burada kapatın."
esES = "Cuando está activado, añade la herramienta de planificación de tala de Keystone al menú de tala del silvicultor. El botón aparece la próxima vez que abras ese menú. Está activado de forma predeterminada; desactívalo aquí para ocultar el botón."
itIT = "Quando attivata, aggiunge lo strumento di pianificazione del taglio di Keystone al menu di abbattimento degli alberi del silvicoltore. Il pulsante compare la prossima volta che apri quel menu. Attivata per impostazione predefinita; disattivala qui per nascondere il pulsante."
ukUA = "Коли увімкнено, додає інструмент планування вирубки Keystone до меню вирубки лісника. Кнопка з'явиться наступного разу, коли ви відкриєте це меню. За замовчуванням увімкнено; вимкніть її тут, щоб приховати кнопку."
thTH = "เมื่อเปิดใช้งาน จะเพิ่มแปรงวางแผนการตัดของ Keystone เข้าไปในเมนูตัดต้นไม้ของคนดูแลป่า ปุ่มนี้จะปรากฏในครั้งถัดไปที่คุณเปิดเมนูนั้น เปิดใช้งานเป็นค่าเริ่มต้น หากต้องการซ่อนปุ่ม ให้ปิดตัวเลือกนี้"
csCZ = "Když je zapnuto, přidá štětec plánovače kácení Keystone do nabídky kácení stromů lesníka. Tlačítko se objeví příští čas, kdy otevřete tuto nabídku. Ve výchozím nastavení zapnuto; vypněte ho zde, abyste tlačítko skryli."
viVN = "Khi bật, thêm công cụ lập kế hoạch cắt của Keystone vào menu cắt cây của người trồng cây. Nút sẽ xuất hiện lần tiếp theo bạn mở menu đó. Mặc định bật; tắt nó ở đây để ẩn nút."
caES = "Quan està activat, afegeix la brotxa del planificador de tala de Keystone al menú de tala del silvicultor. El botó apareix la propera vegada que obriu aquest menú. Està activat per defecte; desactiveu-lo aquí per amagar el botó."
beBY = "Калі ўключана, дадае інструмент планавання рубкі Keystone у меню рубкі дрэў лесніка. Кнопка з'явіцца пры наступным адкрыцці гэтага меню. Уключана па змаўчанні; выключыце тут, каб схаваць кнопку."
roRO = "Când este activată, adaugă instrumentul de planificare a tăierii de la Keystone în meniul de tăiere a copacilor al silvicultorului. Butonul apare data viitoare când deschizi acel meniu. Este activată implicit; dezactiveaz-o aici pentru a ascunde butonul."
huHU = "Ha be van kapcsolva, a Keystone vágástervező ecsetét hozzáadja az erdész fakivágási menüjéhez. A gomb a menü következő megnyitásakor jelenik meg. Alapértelmezés szerint be van kapcsolva; ha el szeretnéd rejteni a gombot, kapcsold ki itt."
arSA = "عند التفعيل، يضيف فرشاة مخطط القطع الخاصة بـ Keystone إلى قائمة قطع الأشجار في الحراج. يظهر الزر في المرة التالية التي تفتح فيها تلك القائمة. مفعّل افتراضياً؛ أوقفه هنا لإخفاء الزر."
