["Tool.Keystone.DeadTree.Description"]
raw = "Force-places the KeystoneDeadPine1 flourish — a vanilla dead-pine trunk wrapped in the Keystone PineIvy mesh — at the clicked tile, bypassing biome/score gates. Smoke test for the dead-tree + fitted-ivy composition."
status = "normal"
enUS = "Force-places the KeystoneDeadPine1 flourish — a vanilla dead-pine trunk wrapped in the Keystone PineIvy mesh — at the clicked tile, bypassing biome/score gates. Smoke test for the dead-tree + fitted-ivy composition."
zhCN = "强制在点击的瓷砖上放置KeystoneDeadPine1装饰——一个用Keystone PineIvy网格包裹的香榧树干，绕过生态/得分限制。对死树与合适的常春藤组合进行烟雾测试。"
zhTW = "強制在點擊的磚塊上放置KeystoneDeadPine1裝飾——一個包裹在Keystone PineIvy網格中的香樹枯樹幹——繞過生物群系/分數門檻。對於枯樹和擬合常春藤組合的煙霧測試。"
ruRU = "Принудительно размещает цветок KeystoneDeadPine1 — ствол обычной сухостойной сосны, обвёрнутый сеткой Keystone PineIvy — на выбранной плитке, обходя биомные/оценочные препятствия. Дымовой тест для композиции мёртвого дерева + подходящего плюща."
jaJP = "「クリックしたタイルに、バイオーム/スコアゲートを無視して、KeystoneDeadPine1フローリッシュ（Keystone PineIvyメッシュでラップされたバニラの枯れ松の幹）を強制的に配置します。枯れ木とフィットしたアイビーの組み合わせのスモークテスト。」"
frFR = "Force-implante la végétation KeystoneDeadPine1 — un tronc de pin mort standard enveloppé dans le maillage de Keystone PineIvy — sur la tuile cliquée, contournant les portes de biomes/de score. Test de fumée pour la composition arbre mort + lierre ajusté."
deDE = "Erzwingt das Platzieren des KeystoneDeadPine1-Fleurons — einem normalen toten Kiefernstamm, der im Keystone PineIvy-Netz eingewickelt ist — auf dem angeklickten Feld, wobei Biome/Score-Grenzen umgangen werden. Rauchtest für die Zusammensetzung des toten Baums + angepasstem Efeu."
plPL = "Wymusza umiejscowienie ozdoby KeystoneDeadPine1 — standardowego zespołu martwego sosnowego pnia otoczonego siatką Keystone PineIvy — na klikniętej płytce, omijając bariery biomu/punktacji. Test dymny dla kompozycji martwego drzewa i dopasowanej bluszczu."
ptBR = "Coloca forçosamente o florestar KeystoneDeadPine1 — um tronco de pinheiro morto da versão padrão coberto pela malha Keystone PineIvy — no tile clicado, ignorando as barreiras de bioma/pontuação. Teste de fumaça para a composição de árvore morta + hera ajustada."
koKR = "KeystoneDeadPine1 플로리시를 강제로 배치합니다. 이는 Keystone PineIvy 메시로 감싸진 기본 고사목입니다. 클릭된 타일에 배치되며, 생물 군계/점수 게이트를 우회합니다. 고사목 + 적합한 아이비 조합에 대한 연기 테스트입니다."
trTR = "KeystoneDeadPine1 süslemesini zorla yerleştirir — Keystone PineIvy ağında sarılı bir vanilya ölü çam gövdesi — tıklanan alana, biyom/puan engellerini aşarak. Ölü ağaç + uyumlu sarmaşık kompozisyonu için duman testi."
esES = "Coloca a la fuerza el adorno KeystoneDeadPine1 (un tronco de pino muerto de Timberborn original, envuelto en la malla de hiedra PineIvy de Keystone) en la casilla pulsada, sin tener en cuenta los requisitos de bioma ni de puntuación. Prueba de humo para la combinación de árbol muerto y hiedra ajustada."
itIT = "Posiziona forzatamente la decorazione KeystoneDeadPine1 — un tronco di pino morto della versione base, avvolto nella mesh Keystone PineIvy — nella casella cliccata, ignorando i vincoli di bioma e punteggio. Test di funzionamento per la combinazione tra albero morto ed edera adattata."
ukUA = "Примусово розміщує декоративний елемент KeystoneDeadPine1 — стовбур мертвої сосни зі стандартної гри, обплетений сіткою PineIvy з Keystone — на клікнутій клітинці, оминаючи обмеження біому та оцінки. Тестова перевірка для поєднання мертвого дерева та підігнаного плюща."
thTH = "วางองค์ประกอบ KeystoneDeadPine1 แบบบังคับ ซึ่งเป็นลำต้นต้นสนตายของ Vanilla ที่พันด้วยตาข่ายไอวี่ PineIvy ของ Keystone ลงบนช่องที่คลิก โดยข้ามเงื่อนไขไบโอมและคะแนน ใช้สำหรับทดสอบการทำงานร่วมกันของต้นไม้ตายและไอวี่ที่ติดตั้งแล้ว"
csCZ = "Nutí umístit KeystoneDeadPine1 květinu — kmen mrtvé borovice obalený v síti Keystone PineIvy — na kliknutou dlaždici, obcházející biome/score brány. Kouřová zkouška pro mrtvý strom + přizpůsobenou břečťanovou kompozici."
viVN = "Buộc đặt cây KeystoneDeadPine1 - một thân cây thông chết nguyên bản được bọc bởi lưới Keystone PineIvy - tại ô đã nhấp chuột, vượt qua các cổng sinh thái/điểm. Kiểm tra khói cho sự kết hợp giữa cây chết và ivy phù hợp."
caES = "Força la col·locació de l'adorn KeystoneDeadPine1 —un tronc de pi mort de Timberborn embolcallat amb la malla d'heura PineIvy de Keystone— a la casella clicada, saltant-se les restriccions de bioma i puntuació. Prova de fum per a la composició d'arbre mort amb heura ajustada."
beBY = "Прымусова ставіць упрыгожванне KeystoneDeadPine1 — ствол мёртвай сасны са стандартнай гульні, абцягнуты сеткай плюшча PineIvy з Keystone — на пазначаную клетку, абыходзячы абмежаванні біёма і ачкоў. Тэст для праверкі спалучэння мёртвага дрэва і прыладнага плюшча."
roRO = "Plasează forțat înflorirea KeystoneDeadPine1 — un trunchi de pin mort din vanilla, învelit în plasa PineIvy din Keystone — pe plitla făcută clic, ocolind restricțiile de biom/scor. Test de fum pentru compoziția dintre arborele mort și iedera montată."
huHU = "Kényszerítve elhelyezi a KeystoneDeadPine1 díszítőelemet – egy alap elhalt fenyőtörzset, amelyet a Keystone PineIvy hálója borít – a megkattintott mezőre, megkerülve a bioma- és pontszámkorlátozásokat. Füstteszt az elhalt fa és az illeszkedő borostyán összeállításához."
arSA = "يضع هذا الأداة زخرفة KeystoneDeadPine1 قسرًا على المربع الذي تنقر عليه، متجاوزةً شروط المنطقة الحيوية والتقييم. وهي اختبار دخاني لتركيب شجرة الصنوبر الميتة مع نبات اللبلاب المُركَّب."

