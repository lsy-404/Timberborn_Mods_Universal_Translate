["Keystone.Settings.Fauna.DeerAbundance.Tooltip"]
raw = "How many deer appear in suitable areas.\n\n0% removes deer entirely.\n100% is the default amount.\n200% doubles the population."
status = "normal"
enUS = "How many deer appear in suitable areas.\n\n0% removes deer entirely.\n100% is the default amount.\n200% doubles the population."
zhCN = "在适宜的区域内会出现多少只鹿。\n\n0% 完全移除鹿。\n100% 是默认数量。\n200% 是人口的两倍。"
zhTW = "“適合區域出現多少隻鹿。\n\n0% 完全移除鹿。\n100% 為預設數量。\n200% 則將數量翻倍。”"
ruRU = "Сколько оленей появляется в подходящих районах.\n\n0% полностью убирает оленей.\n100% - это стандартное количество.\n200% удваивает популяцию."
jaJP = "「適した地域に現れる鹿の数。\n\n0%は鹿を完全に排除します。\n100%がデフォルトの量です。\n200%は人口を倍増させます。」"
frFR = "Combien de cerfs apparaissent dans des zones adaptées.\n\n0 % supprime complètement les cerfs.\n100 % est la quantité par défaut.\n200 % double la population."
deDE = "Wie viele Rehe in geeigneten Gebieten erscheinen.\n\n0 % entfernt die Rehe vollständig.\n100 % ist die Standardmenge.\n200 % verdoppelt die Population."
plPL = "Ilość jelenia występujących w odpowiednich obszarach.\n\n0% całkowicie usuwa jelenie.\n100% to domyślna ilość.\n200% podwaja populację."
ptBR = "Quantos cervos aparecem em áreas adequadas.\n\n0% remove os cervos completamente.\n100% é a quantidade padrão.\n200% dobra a população."
koKR = "적합한 지역에 나타나는 사슴의 수입니다.\n\n0%는 사슴을 완전히 제거합니다.\n100%는 기본 수치입니다.\n200%는 인구를 두 배로 증가시킵니다."
trTR = "Uygun alanlarda kaç tane geyik göründüğü.\n\n0% kesinlikle geyikleri kaldırır.\n100% varsayılan miktardır.\n200% popülasyonu iki katına çıkarır."
esES = "Cuántos ciervos aparecen en las zonas adecuadas.\n\n0% elimina por completo a los ciervos.\n100% es la cantidad predeterminada.\n200% duplica la población."
itIT = "Quanti cervi compaiono nelle aree adatte.\n\n0% rimuove completamente i cervi.\n100% è la quantità predefinita.\n200% raddoppia la popolazione."
ukUA = "Скільки оленів з'являється у придатних зонах.\n\n0% повністю прибирає оленів.\n100% — це значення за замовчуванням.\n200% подвоює популяцію."
thTH = "จำนวนกวางที่ปรากฏในพื้นที่ที่เหมาะสม\n\n0% จะลบกวางออกทั้งหมด\n100% คือค่าเริ่มต้น\n200% จะเพิ่มประชากรเป็นสองเท่า"
csCZ = "Kolik jelenců se objevuje v vhodných oblastech.\n\n0 % odstraní jeleni úplně.\n100 % je výchozí množství.\n200 % zdvojnásobí populaci."
viVN = "Số lượng hươu xuất hiện ở các khu vực phù hợp.\n\n0% loại bỏ hoàn toàn hươu.\n100% là số lượng mặc định.\n200% gấp đôi dân số."
caES = "Quants cérvols apareixen en àrees adequades.\n\n0% elimina els cérvols completament.\n100% és la quantitat predeterminada.\n200% duplica la població."
beBY = "Колькі алянёў з'яўляецца ў прыдатных месцах.\n\n0% цалкам выдаляе алянёў.\n100% — стандартная колькасць.\n200% удвая павялічвае папуляцыю."
roRO = "Câte căprioare apar în zonele potrivite.\n\n0% elimină complet căprioarele.\n100% este valoarea implicită.\n200% dublează populația."
huHU = "Hány szarvas jelenik meg a megfelelő területeken.\n\n0% teljesen eltávolítja a szarvasokat.\n100% az alapértelmezett mennyiség.\n200% megduplázza a populációt."
arSA = "كم عدد الغزلان التي تظهر في المناطق المناسبة.\n\nتؤدي نسبة 0% إلى إزالة الغزلان تمامًا.\nنسبة 100% هي الكمية الافتراضية.\nتضاعف نسبة 200% عدد السكان."

