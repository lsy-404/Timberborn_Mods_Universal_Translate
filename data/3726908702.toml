["Tool.Keystone.Overgrowth.Description"]
raw = "Click a tree to cycle its overgrowth: barren -> overgrown -> reseeded (the tree is replaced by a new seedling that drops the felled wood and comes out overgrown). Validates the overgrowth overlay and the reseed mechanism by hand; bypasses the natural maturity/dead-tree gates."
status = "normal"
enUS = "Click a tree to cycle its overgrowth: barren -> overgrown -> reseeded (the tree is replaced by a new seedling that drops the felled wood and comes out overgrown). Validates the overgrowth overlay and the reseed mechanism manually; bypasses the natural maturity/dead-tree gates."
zhCN = "单击一棵树以循环其过度生长：荒芜 -> 过度生长 -> 重新播种（树木被一棵新幼苗替代，掉落砍伐的木头并变为过度生长）。通过手动验证过度生长覆盖层和重新播种机制；绕过自然成熟/死亡树木的限制。"
zhTW = "單擊樹木以循環其過度生長狀態：荒蕪 -> 繁茂 -> 重新播種（樹木被新的幼苗取代，掉落砍伐的木材並變為繁茂）。手動驗證過度生長的覆蓋層和重新播種機制；繞過自然成熟/枯死樹木的限制。"
ruRU = "Щелкните по дереву, чтобы изменить его разрастание: пустое -> заросшее -> пересаженное (дерево заменяется новым саженцем, который сбрасывает срубленное дерево и выходит в заросшем виде). Вручную проверяет наложение разрастания и механизм пересадки; обходя естественные стадии зрелости/мертвого дерева."
jaJP = "木をクリックすると、そのオーバーグロースをサイクルします：不毛 -> オーバーグロウン -> 再播種（木は新しい苗木に置き換えられ、伐採された木材を落とし、オーバーグロウンになります）。オーバーグロースオーバーレイと再播種メカニズムを手動で検証します；自然の成熟/枯れ木のゲートを回避します。"
frFR = "Cliquez sur un arbre pour faire défiler sa surcroissance : stérile -> envahie -> resement (l'arbre est remplacé par une nouvelle plantule qui laisse tomber le bois abattu et devient envahie). Valide la superposition de surcroissance et le mécanisme de resement à la main ; contourne les barrières de maturité naturelle/arbre mort."
deDE = "Klicke auf einen Baum, um sein Überwuchs zu wechseln: kahl -> überwuchert -> nachgesät (der Baum wird durch ein neues Pflänzchen ersetzt, das das gefällte Holz abwirft und überwuchert herauskommt). Überprüft manuell die Überwuchs-Overlay und den Nachsaat-Mechanismus; umgeht die natürlichen Reife-/Totholz-Schranken."
plPL = "Kliknij drzewo, aby zmienić jego nadmiar roślinności: jałowe -> bujne -> ponownie zasiane (drzewo jest zastępowane nowym siewką, która wyrzuca ścięte drewno i staje się bujne). Waliduje nakładkę nadmiaru roślinności oraz mechanizm ponownego siewu ręcznie; omija naturalne bramy dojrzałości/drzewa umarłe."
ptBR = " clique em uma árvore para alternar seu crescimento excessivo: árido -> denso -> replantado (a árvore é substituída por uma nova muda que solta a madeira derrubada e cresce descontroladamente). Valida a sobreposição de crescimento excessivo e o mecanismo de replantio manualmente; contorna as portas naturais de maturidade/árvore morta."
koKR = "나무를 클릭하여 과성장을 순환시킵니다: 황폐해진 상태 -> 과성장 상태 -> 다시 씨앗을 뿌린 상태 (나무가 잘려 나가고 새로운 묘목으로 대체되어 잘라낸 나무를 떨어뜨리며 과성장 상태가 됩니다). 과성장 오버레이 및 다시 씨앗 뿌리기 메커니즘을 수동으로 검증합니다; 자연적인 성숙/죽은 나무의 제한을 우회합니다."
trTR = "Bir ağaca tıklayarak onun aşırı büyümesini döngüye al: çıplak -> aşırı büyümüş -> yeniden tohumlanmış (ağaç, kesilen odunu bırakan ve aşırı büyümüş olarak çıkan yeni bir fidana dönüşür). Aşırı büyüme katmanını ve yeniden tohumlama mekanizmasını elle doğrular; doğal olgunluk/ölü ağaç geçitlerini atlar."
esES = "Haz clic en un árbol para alternar su crecimiento excesivo: sin vegetación -> sobrecrecido -> resembrado (el árbol se sustituye por una nueva plántula que suelta la madera talada y aparece sobrecrecida). Valida a mano la superposición de sobrecrecimiento y el mecanismo de resembrado; omite las comprobaciones naturales de madurez y de árbol muerto."
itIT = "Fai clic su un albero per far avanzare il suo stato di sovracrescita: spoglio -> sovracresciuto -> riseminato (l'albero viene sostituito da una nuova piantina che lascia il legno dell'albero abbattuto e si presenta già sovracresciuta). Serve a verificare manualmente la sovrapposizione della sovracrescita e il meccanismo di risemina; ignora i normali requisiti di maturità e di albero morto."
ukUA = "Натисніть на дерево, щоб перемикати його стан заростання: без заростання -> заростає -> відновлене (дерево замінюється новим саджанцем, який скидає зрубану деревину і з'являється вже заростаючим). Дозволяє вручну перевіряти накладку заростання та механізм відновлення; обходить природні обмеження зрілості та мертвих дерев."
thTH = "คลิกที่ต้นไม้เพื่อวนสถานะการเติบโตเกินของมัน: ไม่มีพืชพรรณ (barren) -> เติบโตเกิน (overgrown) -> ปลูกใหม่ (reseeded) (ต้นไม้จะถูกแทนที่ด้วยต้นกล้าใหม่ที่ทิ้งไม้ที่ถูกโค่นและเริ่มต้นในสถานะเติบโตเกิน) ใช้ตรวจสอบการซ้อนทับของการเติบโตเกินและกลไกการปลูกใหม่ด้วยมือ โดยข้ามเงื่อนไขการเจริญเติบโตตามธรรมชาติและต้นไม้ตาย"
csCZ = "Klikněte na strom a cyklujte jeho přerostlost: holý -> přerostlý -> znovu zasazený (strom je nahrazen novým sazeničkem, který uvolňuje pokácené dřevo a je přerostlý). Ověřuje překryv přerostlosti a mechanismus znovu zasazení ručně; obchází přirozené brány zralosti/mrtvých stromů."
viVN = "Nhấp vào một cái cây để thay đổi trạng thái phát triển của nó: trống trải -> phát triển quá mức -> tái gieo (cái cây sẽ được thay thế bằng một cây non mới mà rơi xuống gỗ đã bị chặt và xuất hiện ở trạng thái phát triển quá mức). Xác thực lớp phủ phát triển quá mức và cơ chế tái gieo một cách thủ công; bỏ qua các cổng trưởng thành/tầng cây chết tự nhiên."
caES = "Feu clic en un arbre per canviar-ne el creixement excessiu: erm -> cobert de vegetació -> resembrat (l'arbre és substituït per una nova plàntula que deixa la fusta talada i surt ja cobert de vegetació). Valida a mà la superposició del creixement excessiu i el mecanisme de resembrat; evita les condicions naturals de maduresa i d'arbre mort."
beBY = "Клікніце на дрэва, каб перайсці па стадыях росту: голае -> парослае -> з новай пасадкай (дрэва замяняецца новым саджанцам, які пакідае зрубленую драўніну і з'яўляецца парослым). Дазваляе ўручную правяраць накладанне паросласці і механізм пасадкі; абыходзіць натуральныя ўмовы сталасці і мёртвых дрэў."
roRO = "Faceți clic pe un copac pentru a parcurge starea de supracrestere: neacoperit -> supracrescut -> recoltat și reinsămânțat (copacul este înlocuit cu un nou puiet, care lasă lemnul tăiat și apare deja supracrescut). Validează manual stratul de supracrestere și mecanismul de reinsămânțare; ocolește verificările naturale ale maturității/copacilor morți."
huHU = "Kattints egy fára, hogy végigléptesd a túlnövés állapotain: kopár -> túlnőtt -> újravetett (a fát új csemete váltja fel, amely ledobja a kivágott fát, és túlnőtt állapotban jelenik meg). Kézzel ellenőrzi a túlnövés rétegét és az újravetés mechanizmusát; megkerüli a természetes érettségi/elhalt fa feltételeit."
arSA = "انقر على شجرة لتبديل حالة نموّها المفرط بالتسلسل: خالية -> متضخمة النمو -> معاد زرعها (تُستبدل الشجرة بشتلة جديدة تُسقط الخشب المقطوع وتظهر متضخمة النمو). يُستخدم للتحقق يدويًا من طبقة النمو المفرط وآلية إعادة الزراعة؛ ويتجاوز شروط النضج الطبيعي وشروط الشجرة الميتة."

