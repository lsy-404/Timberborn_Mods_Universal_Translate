["Tool.Keystone.FishSmokeTest.Description"]
raw = "Spawns a KeystoneFish1 static prop at the cursor and starts looping its Default animation clip. Gated on water depth: click a dry tile and nothing spawns; click a water tile and a fish appears just above the water surface, swimming in place. No agent, no pathfinding, no despawn — pure visual verification of the fish mesh + Default clip. Reload to clear accumulated fish."
status = "normal"
enUS = "Spawns a KeystoneFish1 static prop at the cursor and starts looping its Default animation clip. Gated on water depth: click a dry tile and nothing spawns; click a water tile and a fish appears just above the water surface, swimming in place. No agent, no pathfinding, no despawn — pure visual verification of the fish mesh + Default clip. Reload to clear accumulated fish."
zhCN = "产生一个KeystoneFish1静态物体在光标处，并开始循环其默认动画剪辑。受水深限制：点击干燥的瓦片则什么都不会产生；点击水面瓦片则一条鱼会出现在水面上，静止游动。没有代理，没有寻路，没有消失——仅仅是对鱼网格和默认剪辑的可视验证。重新加载以清除已累积的鱼。"
zhTW = "在游標處生成一個 KeystoneFish1 靜態道具並開始循環其默認動畫片段。根據水深進行限制：點擊乾燥的瓷磚什麼都不會生成；點擊水面的瓷磚則會在水面上方顯示一條魚，保持原地游動。無代理，無路徑尋找，無消失——純粹用於視覺驗證魚的模型 + 默認片段。重新加載以清除累積的魚。"
ruRU = "Создает статический объект KeystoneFish1 в позиции курсора и начинает цикл его стандартной анимации. Ограничено глубиной воды: кликните по сухому тайлу и ничего не появится; кликните по водному тайлу, и рыба появится прямо над поверхностью воды, плавая на месте. Нет агента, нет поиска пути, нет исчезновения — чистая визуальная проверка сетки рыбы + стандартный клип. Перезагрузите, чтобы очистить накопившиеся рыбы."
jaJP = "カーソルの位置にKeystoneFish1の静的プロップを生成し、そのデフォルトアニメーションクリップをループします。水深によって制限されます：乾燥したタイルをクリックすると何も生成されず、水タイルをクリックすると水面のすぐ上に魚が現れ、その場で泳ぎます。エージェントなし、経路探索なし、消失なし — 魚のメッシュとデフォルトクリップの純粋な視覚確認です。蓄積された魚をクリアするにはリロードしてください。"
frFR = "Fait apparaître un prop statique KeystoneFish1 au curseur et commence à boucler son clip d'animation par défaut. Dépend de la profondeur de l'eau : cliquez sur un carreau sec et rien ne s'affiche ; cliquez sur un carreau d'eau et un poisson apparaît juste au-dessus de la surface de l'eau, nageant sur place. Pas d'agent, pas de recherche de chemin, pas de disparition — simple vérification visuelle du maillage du poisson + clip par défaut. Rechargez pour effacer les poissons accumulés."
deDE = "Erzeugt ein KeystoneFish1 statisches Objekt am Cursor und beginnt, seine Standard-Animationsclip zu wiederholen. Abhängig von der Wassertiefe: Klicken Sie auf ein trockenes Feld, und es erscheint nichts; klicken Sie auf ein Wasserfeld, und ein Fisch erscheint direkt über der Wasseroberfläche und schwimmt an derselben Stelle. Kein Agent, keine Pfadfindung, kein Verschwinden – rein visuelle Überprüfung des Fisch-Mesh + Standard-Clip. Neu laden, um angesammelte Fische zu löschen."
plPL = "Generuje statyczny obiekt KeystoneFish1 w miejscu kursora i zaczyna odtwarzać jego domyślną animację w pętli. Ograniczone przez głębokość wody: kliknij na suchym kafelku a nic się nie pojawi; kliknij na kafelku z wodą a ryba pojawi się tuż nad powierzchnią wody, pływając w miejscu. Brak agenta, brak wyszukiwania ścieżki, brak znikania — czysta wizualna weryfikacja siatki ryby + klip domyślny. Przeładuj, aby usunąć zgromadzone ryby."
ptBR = "Cria uma propriedade estática KeystoneFish1 na posição do cursor e começa a repetir seu clipe de animação padrão. Restrição de profundidade de água: clique em um bloco seco e nada aparece; clique em um bloco de água e um peixe surge logo acima da superfície, nadando no lugar. Sem agente, sem busca de caminho, sem desaparecimento — verificação visual pura da malha do peixe + clipe padrão. Recarregue para limpar os peixes acumulados."
koKR = "커서 위치에 KeystoneFish1 정적 소품을 생성하고 기본 애니메이션 클립을 루프합니다. 수심에 따라 제한됩니다: 마른 타일을 클릭하면 아무것도 생성되지 않고, 물 타일을 클릭하면 물 표면 바로 위에 물고기가 나타나며 제자리에서 수영합니다. 에이전트 없음, 경로 탐색 없음, 사라짐 없음 — 물고기 메시 + 기본 클립의 순수 시각적 확인. 축적된 물고기를 제거하려면 리로드하세요."
trTR = "İmleçte bir KeystoneFish1 statik nesnesi oluşturur ve varsayılan animasyon klibini döngüye sokar. Su derinliğine bağlı olarak: kuru bir karoya tıklayınca hiçbir şey oluşturulmaz; suyun üzerindeki bir karoya tıklayınca balık, su yüzeyinin hemen üzerinde görünerek yerinde yüzmeye başlar. Hiçbir ajan yok, yol bulma yok, yok olma yok — balık ağının ve varsayılan klibin sadece görsel doğrulaması. Biriken balıkları temizlemek için yeniden yükleyin."
esES = "Genera un prop estático KeystoneFish1 en el cursor y comienza a reproducir en bucle su clip de animación Default. Solo funciona según la profundidad del agua: si haces clic en una casilla seca, no aparece nada; si haces clic en una casilla con agua, aparece un pez justo encima de la superficie del agua, nadando en el mismo sitio. No hay agente, ni búsqueda de rutas, ni desaparición: es solo una verificación visual de la malla del pez y del clip Default. Recarga el juego para eliminar los peces acumulados."
itIT = "Genera un oggetto statico KeystoneFish1 sotto il cursore e avvia la riproduzione in loop della clip di animazione Default. Il comando dipende dalla profondità dell'acqua: se si clicca su una casella asciutta non appare nulla; se si clicca su una casella d'acqua, compare un pesce appena sopra la superficie, che nuota sul posto. Non ci sono agenti, pathfinding né rimozione automatica: è solo una verifica visiva della mesh del pesce e della clip Default. Ricarica il gioco per eliminare i pesci accumulati."
ukUA = "Створює статичний об'єкт KeystoneFish1 на місці курсора та запускає циклічне відтворення його анімаційного кліпу Default. Залежить від глибини води: якщо клацнути по сухій клітинці, нічого не з'являється; якщо клацнути по клітинці з водою, риба з'являється трохи над поверхнею води і плаває на місці. Немає агента, пошуку шляху чи видалення — лише візуальна перевірка моделі риби та кліпу Default. Перезавантаження очищає накопичених риб."
thTH = "ฟังก์ชันนี้สร้างโมเดลปลาแบบ static ชื่อ KeystoneFish1 ที่ตำแหน่งเคอร์เซอร์ และเริ่มเล่นแอนิเมชัน Default แบบวนซ้ำ มีเงื่อนไขตามความลึกของน้ำ: หากคลิกบนพื้นแห้ง จะไม่มีอะไรเกิดขึ้น หากคลิกบนไทล์ที่เป็นน้ำ ปลาจะปรากฏเหนือผิวน้ำเล็กน้อยและว่ายอยู่กับที่ ไม่มี agent ไม่มีการหาเส้นทาง และไม่มีการลบออก ใช้สำหรับตรวจสอบภาพของโมเดลปลาและแอนิเมชัน Default เท่านั้น รีโหลดเกมเพื่อล้างปลาที่สะสมไว้"
csCZ = "Vytváří statický objekt KeystoneFish1 na kurzoru a spouští smyčku jeho výchozí animační klip. Závisí na hloubce vody: klikněte na suchou dlaždici a nic se nevytvoří; klikněte na dlaždici s vodou a ryba se objeví těsně nad vodní hladinou, plavoucí na místě. Žádný agent, žádné vyhledávání cesty, žádné zmiznutí — čistá vizuální kontrola rybí sítě + výchozí klip. Znovu načtěte pro vymazání nahromaděných ryb."
viVN = "Tạo ra một vật thể tĩnh KeystoneFish1 tại vị trí chuột và bắt đầu phát lại đoạn hoạt hình mặc định của nó. Bị giới hạn bởi độ sâu của nước: nhấp vào ô khô và sẽ không có gì xuất hiện; nhấp vào ô nước và một con cá sẽ xuất hiện ngay trên bề mặt nước, bơi tại chỗ. Không có tác nhân, không tìm đường, không tự hủy - chỉ là xác minh hình ảnh thuần túy của lưới cá + đoạn hoạt hình mặc định. Tải lại để xóa cá đã tích lũy."
caES = "Genera un objecte estàtic KeystoneFish1 al cursor i comença a reproduir en bucle el clip d'animació Default. Només funciona segons la profunditat de l'aigua: si feu clic en una casella seca, no apareix res; si feu clic en una casella amb aigua, apareix un peix just per sobre de la superfície de l'aigua, nedant en el mateix lloc. No hi ha agent, ni cerca de camí, ni desaparició: és només una verificació visual de la malla del peix i del clip Default. Recarregueu el joc per eliminar els peixos acumulats."
beBY = "Стварае статычны аб'ект KeystoneFish1 на месцы курсора і запускае цыклічнае прайграванне яго анімацыі Default. Спрацоўвае толькі пры наяўнасці вады: пстрыканне па сушы нічога не стварае; пстрыканне па плітцы з вадой з'яўляецца рыба непасрэдна над паверхняй вады, якая плыве на месцы. Без агента, без пошуку шляху і без выдалення — чыста візуальная праверка сеткі рыбы і кліпа Default. Перазагрузіце гульню, каб ачысціць назапашаныя рыбы."
roRO = "Generează un obiect static KeystoneFish1 la cursor și pornește redarea în buclă a clipului de animație Default. Funcționează doar pe apă: dacă dai clic pe un plasture uscat, nu apare nimic; dacă dai clic pe un plasture cu apă, apare un pește deasupra suprafeței apei, care înoată pe loc. Nu există agent, căutare de traseu sau dispariție automată: este doar o verificare vizuală a modelului peștelui și a clipului Default. Reîncarcă jocul pentru a șterge peștii acumulați."
huHU = "At the cursor, spawns a KeystoneFish1 static prop and starts looping its Default animation clip. Spawning is gated on water depth: clicking a dry tile spawns nothing, while clicking a water tile makes a fish appear just above the water surface, swimming in place. There is no agent, no pathfinding, and no despawn; this is purely a visual check of the fish mesh and the Default clip. Reload to clear accumulated fish."
arSA = "يُنشئ هذا الأداة نموذج الأسماك الثابت KeystoneFish1 عند مؤشر الفأرة، ويبدأ تشغيل مقطع الحركة Default بشكل متكرر. يعتمد الإنشاء على عمق الماء: إذا نقرت على بلاطة جافة فلن يظهر شيء، وإذا نقرت على بلاطة مائية فستظهر سمكة فوق سطح الماء مباشرة وتسبح في مكانها. لا يوجد وكيل ولا تخطيط مسار ولا إزالة تلقائية، فالغرض فقط هو التحقق البصري من نموذج السمكة ومقطع Default. أعد تحميل اللعبة لإزالة الأسماك المتراكمة."

