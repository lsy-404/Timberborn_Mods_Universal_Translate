ruRU = "Если включено, добавляет кисть для смешанного посева культуры Keystone в меню полей/посева. Кнопка появится в следующий раз, когда вы откроете это меню. Включено по умолчанию; отключите здесь, чтобы скрыть кнопку."
jaJP = "オンにすると、Keystoneの混合作物植え付けブラシがフィールド/作物植え付けメニューに追加されます。次にそのメニューを開いたときにボタンが表示されます。デフォルトでオン; ここでオフにするとボタンが隠れます。"
frFR = "Lorsque c'est activé, ajoute le pinceau de plantation de cultures mélangées de Keystone au menu de plantation de champs/cultures. Le bouton apparaîtra la prochaine fois que vous ouvrirez ce menu. Activé par défaut ; désactivez-le ici pour cacher le bouton."
deDE = "„Wenn aktiviert, fügt das Mischkultur-Pflanzwerkzeug von Keystone dem Feld-/Pflanzmenü hinzu. Der Button erscheint beim nächsten Öffnen dieses Menüs. Standardmäßig aktiviert; hier ausschalten, um den Button zu verbergen.“"
plPL = "Kiedy włączone, dodaje pędzel do sadzenia roślin mieszanych Keystone'a do menu pol./sadzenia upraw. Przycisk pojawi się przy następnym otwarciu tego menu. Domyślnie włączone; wyłącz to tutaj, aby ukryć przycisk."
ptBR = "Quando ativado, adiciona o pincel de plantio de mistura de culturas do Keystone ao menu de campo/plantio de culturas. O botão aparecerá na próxima vez que você abrir esse menu. Ativado por padrão; desative aqui para ocultar o botão."
koKR = "활성화하면 Keystone의 혼합 작물 심기 브러시가 밭/작물 심기 메뉴에 추가됩니다. 다음 번에 해당 메뉴를 열면 버튼이 표시됩니다. 기본적으로 활성화되어 있으며, 여기에서 끄면 버튼이 숨겨집니다."
trTR = "Açık olduğunda, Keystone'un karışık bitki ekme fırçasını alan/bitki ekme menüsüne ekler. Buton, o menüyü bir sonraki kez açtığınızda görünür. Varsayılan olarak açıktır; butonu gizlemek için burada kapatın."
esES = "Cuando está activado, añade el pincel de siembra de cultivos mixtos de Keystone al menú de siembra de campos y cultivos. El botón aparecerá la próxima vez que abras ese menú. Activado de forma predeterminada; desactívalo aquí para ocultar el botón."
itIT = "Quando attivo, aggiunge il pennello di semina di colture miste di Keystone al menu di semina di campi/colture. Il pulsante compare la prossima volta che apri quel menu. Attivo per impostazione predefinita; disattivalo qui per nascondere il pulsante."
ukUA = "Коли увімкнено, додає інструмент змішаного висаджування культур Keystone до меню висаджування на полі та культур. Кнопка з'являється під час наступного відкриття цього меню. Увімкнено за замовчуванням; вимкніть її тут, щоб приховати кнопку."
thTH = "เมื่อเปิดใช้งาน จะเพิ่มแปรงปลูกพืชผสมของ Keystone ลงในเมนูปลูกพืช/พืชผลในทุ่ง ปุ่มนี้จะปรากฏในครั้งถัดไปที่คุณเปิดเมนูดังกล่าว เปิดใช้งานเป็นค่าเริ่มต้น หากต้องการซ่อนปุ่มนี้ ให้ปิดการตั้งค่าตรงนี้"
csCZ = "Když je zapnuto, přidá do nabídky pole/sázení plodin štětec pro smíšené sázení plodin od Keystone. Tlačítko se objeví při dalším otevření této nabídky. Ve výchozím nastavení zapnuto; vypněte to zde, abyste tlačítko skryli."
viVN = "Khi bật, sẽ thêm bàn chải trồng cây trộn của Keystone vào menu trồng cây/lúa. Nút sẽ xuất hiện lần tiếp theo bạn mở menu đó. Mặc định là bật; tắt ở đây để ẩn nút."
caES = "Quan està activat, afegeix l'eina de plantació de cultius mixtos de Keystone al menú de plantació de camps i cultius. El botó apareix la propera vegada que obriu aquest menú. Està activat per defecte; desactiveu-lo aquí per amagar el botó."
beBY = "Калі ўключана, дадае інструмент пасадкі змешаных культур Keystone у меню пасадкі палёў і культур. Кнопка з'явіцца пры наступным адкрыцці гэтага меню. Уключана па змаўчанні; выключыце тут, каб схаваць кнопку."
roRO = "Când este activată, adaugă instrumentul de plantare cu culturi mixte al Keystone în meniul de plantare a câmpurilor/culturilor. Butonul apare la următoarea deschidere a acestui meniu. Este activată implicit; dezactivează-o aici pentru a ascunde butonul."
huHU = "Ha bekapcsolva, a Keystone vegyes növénytelepítő ecsetét hozzáadja a mező/növény ültetési menühöz. A gomb legközelebb akkor jelenik meg, amikor legközelebb megnyitod ezt a menüt. Alapértelmezés szerint be van kapcsolva; ha el szeretnéd rejteni a gombot, kapcsold ki itt."
arSA = "عند التفعيل، يضيف أداة زراعة المحاصيل المختلطة من Keystone إلى قائمة زراعة الحقول/المحاصيل. يظهر الزر في المرة التالية التي تفتح فيها تلك القائمة. مفعّل افتراضيًا؛ أوقفه هنا لإخفاء الزر."

