["Keystone.Settings.UI.MixedForestPlantingTool.Tooltip"]
raw = "When on, adds Keystone's mixed tree and bush planting brush to the forester planting menu. The button appears the next time you open that menu. On by default; turn it off here to hide the button."
status = "normal"
enUS = "When enabled, adds Keystone's mixed tree and bush planting brush to the forester planting menu. The button will appear the next time you open that menu. Enabled by default; turn it off here to hide the button."
zhCN = "开启后，将密钥的混合树木和灌木种植工具添加到林务员的种植菜单中。下次打开该菜单时，按钮将出现。默认开启；在此处关闭以隐藏按钮。"
zhTW = "啟用時，會將 Keystone 的混合樹木和灌木種植工具加入樹林種植菜單中。下一次打開該菜單時，按鈕將會顯示。預設為啟用；在此關閉以隱藏按鈕。"
ruRU = "При включении добавляет кисть для смешанной посадки деревьев и кустарников Keystone в меню посадки лесника. Кнопка появится при следующем открытии этого меню. Включено по умолчанию; отключите здесь, чтобы скрыть кнопку."
jaJP = "「オンにすると、フォレスター植林メニューにKeystoneの混合樹木および茂み植え付けブラシを追加します。次回そのメニューを開くとボタンが表示されます。デフォルトではオンになっています。ここでオフにするとボタンが非表示になります。」"
frFR = "Lorsqu'il est activé, ajoute le pinceau de plantation d'arbres et d'arbustes mélangés de Keystone au menu de plantation du forestier. Le bouton apparaîtra la prochaine fois que vous ouvrirez ce menu. Activé par défaut ; désactivez-le ici pour cacher le bouton."
deDE = "Wenn aktiviert, fügt es den Mischbaum- und Strauchpflanzpinsel von Keystone zum Pflanzmenü des Forstmeisters hinzu. Der Knopf erscheint beim nächsten Öffnen dieses Menüs. Standardmäßig aktiviert; hier ausschalten, um den Knopf auszublenden."
plPL = "Gdy włączone, dodaje narzędzie do sadzenia mieszanych drzew i krzewów Keystone do menu sadzenia leśnika. Przycisk pojawi się następnym razem, gdy otworzysz to menu. Domyślnie włączone; wyłącz tutaj, aby ukryć przycisk."
ptBR = "Quando ativado, adiciona o pincel de plantio misto de árvores e arbustos do Keystone ao menu de plantio do lenhador. O botão aparecerá na próxima vez que você abrir esse menu. Ativado por padrão; desative aqui para esconder o botão."
koKR = "활성화하면 Keystone의 혼합 나무 및 덤불 식재 브러시가 산림 관리자의 식재 메뉴에 추가됩니다. 버튼은 다음에 해당 메뉴를 열 때 나타납니다. 기본적으로 활성화되어 있으며, 여기서 끄면 버튼이 숨겨집니다."
trTR = "Açık olduğunda, Keystone'un karışık ağaç ve çalı ekim fırçasını orman işçisinin ekim menüsüne ekler. Buton bir sonraki kez o menüyü açtığınızda görünür. Varsayılan olarak açıktır; butonu gizlemek için buradan kapatın."
esES = "Cuando está activado, añade la herramienta de plantación mixta de árboles y arbustos de Keystone al menú de plantación del silvicultor. El botón aparece la próxima vez que abra ese menú. Activado de forma predeterminada; desactívelo aquí para ocultar el botón."
itIT = "Quando attivo, aggiunge lo strumento di piantagione misto di alberi e arbusti di Keystone al menu di piantagione del guardaboschi. Il pulsante compare la prossima volta che apri quel menu. È attivo per impostazione predefinita; disattivalo qui per nascondere il pulsante."
ukUA = "Коли увімкнено, додає інструмент Keystone для посадки змішаних дерев і кущів до меню посадки лісника. Кнопка з'являється наступного разу, коли ви відкриєте це меню. За замовчуванням увімкнено; вимкніть тут, щоб приховати кнопку."
thTH = "เมื่อเปิดใช้งาน จะเพิ่มเครื่องมือปลูกป่าผสมต้นไม้และพุ่มไม้ของ Keystone ลงในเมนูปลูกของนักปลูกป่า ปุ่มนี้จะปรากฏในครั้งถัดไปที่คุณเปิดเมนูนั้น เปิดใช้งานเป็นค่าเริ่มต้น หากต้องการซ่อนปุ่ม ให้ปิดตัวเลือกนี้ที่นี่"
csCZ = "Pokud je aktivováno, přidá do nabídky sázení pro dřevaře štětec pro sázení smíšených stromů a keřů od Keystone. Tlačítko se objeví při dalším otevření této nabídky. Ve výchozím nastavení je zapnuto; zde jej můžete vypnout a skrýt tlačítko."
viVN = "Khi bật, sẽ thêm công cụ trồng cây và bụi cây hỗn hợp của Keystone vào menu trồng cây của người làm rừng. Nút sẽ xuất hiện lần tiếp theo khi bạn mở menu đó. Mặc định bật; tắt ở đây để ẩn nút."
caES = "Quan està activat, afegeix l'eina de plantació mixta de boscos i arbusts de Keystone al menú de plantació del silvicultor. El botó apareix la propera vegada que obris aquest menú. Està activat per defecte; desactiva'l aquí per amagar el botó."
beBY = "Калі ўключана, дадае інструмент пасадкі змешаных дрэў і кустоў Keystone у меню пасадкі лесніка. Кнопка з'явіцца пры наступным адкрыцці гэтага меню. Уключана па змаўчанні; выключыце тут, каб схаваць кнопку."
roRO = "Când este activată, adaugă instrumentul de plantare mixtă de copaci și arbuști al Keystone în meniul de plantare al pădurarului. Butonul apare data următoare când deschideți acel meniu. Este activată implicit; dezactivați-o aici pentru a ascunde butonul."
huHU = "Ha be van kapcsolva, a Keystone vegyes fa- és bokorültető eszközét hozzáadja az erdész ültetési menüjéhez. A gomb a menü következő megnyitásakor jelenik meg. Alapértelmezés szerint be van kapcsolva; ha el szeretnéd rejteni a gombot, kapcsold ki itt."
arSA = "عند التفعيل، تُضيف أداة زراعة الغابات المختلطة والشجيرات من Keystone إلى قائمة زراعة الحراج. يظهر الزر في المرة التالية التي تفتح فيها تلك القائمة. مُفعّل افتراضيًا؛ أوقفه هنا لإخفاء الزر."

