["Building.PoweredRoof.FlavorDescription"]
raw = "These roofs embed a shaft making them transfer energy !"
status = "normal"
enUS = "These roofs embed a shaft making them transfer energy !"
zhCN = "这些屋顶加装了传动轴，可能会有……一点点吵？"
zhTW = "這些屋頂內嵌有通道，使它們能夠傳輸能量！"
ruRU = "Эти крыши содержат шахту, что позволяет им передавать энергию!"
jaJP = "これらの屋根はシャフトを埋め込んでおり、エネルギーを転送します！"
frFR = "Ces toits intègrent un tube leur permettant de transférer de l'énergie !"
deDE = "Diese Dächer enthalten einen Schacht, der es ihnen ermöglicht, Energie zu übertragen!"
plPL = "Te dachy zawierają szyb, dzięki czemu przekazują energię!"
ptBR = "Esses telhados incorporam um tubo que os faz transferir energia!"
koKR = "이 지붕에는 에너지를 전송할 수 있는 샤프트가 내장되어 있습니다!"
trTR = "Bu çatılar, enerji transferi sağlayan bir boşluk içerir!"
esES = "Estos tejados incorporan un eje, ¡así que transmiten energía!"
itIT = "Questi tetti incorporano un albero di trasmissione che li rende in grado di trasferire energia!"
ukUA = "Ці дахи мають вбудований вал, тож передають енергію!"
thTH = "หลังคาเหล่านี้ฝังเพลาไว้ข้างใน ทำให้มันส่งถ่ายพลังงานได้!"
csCZ = "Tyto střechy obsahují hřídel, díky čemuž přenášejí energii!"
viVN = "Những mái này chứa một trục giúp chúng truyền năng lượng!"
caES = "Aquestes teulades incorporen un eix, així que transmeten energia!"
beBY = "Гэтыя дахі ўбудаваны вал, таму яны перадаюць энергію!"
roRO = "Aceste acoperișuri încorporează un ax, făcându-le să transfere energie!"
huHU = "Ezek a tetők tengelyt rejtenek, ezért energiát továbbítanak!"
arSA = "هذه الأسطح تحتوي على عمود نقل، مما يجعلها تنقل الطاقة!"

