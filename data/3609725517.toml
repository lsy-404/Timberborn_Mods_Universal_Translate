viVN = "Cài đặt đã được đặt lại. Xin hãy khởi động lại trò chơi để mod có thể khởi tạo lại đúng cách."
caES = "Les opcions s'han restablert. Reinicieu el joc perquè el mod es pugui reinicialitzar correctament."
