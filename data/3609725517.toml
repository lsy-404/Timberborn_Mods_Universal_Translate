["LV.CTB.ResetNotice"]
raw = "Settings was reset. Please restart the game so the mod can reinitialize properly."
status = "normal"
enUS = "Settings was reset. Please restart the game so the mod can reinitialize properly."
zhCN = "所有设置已重置。请重启游戏以便模组重新初始化。"
zhTW = "設定已重置。請重新啟動遊戲以便模組能夠正確重新初始化。"
