koKR = "설정이 초기화되었습니다. 모드가 제대로 재초기화할 수 있도록 게임을 재시작해 주세요."
trTR = "Seçenekler sıfırlandı. Lütfen modun doğru bir şekilde yeniden başlatılması için oyunu yeniden başlatın."
esES = "Se restableció la configuración. Reinicia el juego para que el mod se reinicialice correctamente."
itIT = "Le impostazioni sono state ripristinate. Riavvia il gioco affinché la mod possa reinizializzarsi correttamente."
