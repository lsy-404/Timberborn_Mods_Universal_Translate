[_meta]
name = "LadderWorks"

["LadderWorks.Freestanding.Description"]
status = "normal"
raw = "One-level ladder. Stack on ground, platforms or another supported section. Connect a supported path or aligned entrance at either level. Half normal travel speed. Movement prototype."
enUS = "One-level ladder. Stack on ground, platforms, or another supported section. Connect to a supported path or aligned entrance at either level. Half normal travel speed. Movement prototype."
zhCN = "单层梯子。可堆叠在地面、平台或另一段有支撑的结构上。在任一层连接有支撑的通道或对齐的入口。移动速度为正常速度的一半。移动原型。"
zhTW = "單層梯。可堆疊於地面、平台或另一段有支撐的區段上方。在任一層可連接有支撐的通道或對齊的入口。移動速度為一般的一半。移動原型。"
ruRU = "Одноуровневая лестница. Устанавливается на земле, платформах или на другом опорном участке. Подключается к опорному пути или выровненному входу на любом из двух уровней. Скорость передвижения вдвое ниже обычной. Прототип движения."
jaJP = "一段のはしご。地面、足場、または別の支持された区画の上に重ねて設置する。どちらの階層でも、支持された通路または位置が合うは入口に接続する。通常の移動速度の半分。移動機能の試作版。"
frFR = "Échelle d'un niveau. Empilable sur le sol, des plateformes ou une autre section soutenue. Reliez-la à un chemin soutenu ou à une entrée alignée à l'un ou l'autre niveau. Vitesse de déplacement réduite de moitié. Prototype de déplacement."
deDE = "Einstöckige Leiter. Auf dem Boden, auf Plattformen oder einem anderen gestützten Abschnitt aufstellen. Mit einem gestützten Weg oder einem ausgerichteten Eingang auf einer der beiden Ebenen verbinden. Halbe normale Bewegungsgeschwindigkeit. Bewegungsprototyp."
plPL = "Drabina jednopoziomowa. Ustawiana na ziemi, platformach lub innym podpartym elemencie. Połącz z podpartą ścieżką lub wejściem wyrównanym na dowolnym z dwóch poziomów. Połowa normalnej prędkości poruszania się. Prototyp ruchu."
ptBR = "Escada de um nível. Empilhe no chão, em plataformas ou em outra seção apoiada. Conecte a um caminho apoiado ou a uma entrada alinhada em qualquer um dos níveis. Metade da velocidade normal de deslocamento. Protótipo de movimentação."
koKR = "단일 층 사다리. 지면, 발판 또는 다른 지지된 구간 위에 쌓을 수 있습니다. 양쪽 층 중 어느 한쪽에서 지지된 통로나 정렬된 입구에 연결합니다. 일반 이동 속도의 절반. 이동 프로토타입."
trTR = "Tek seviyeli merdiven. Zemin, platform veya başka bir destekli bölümün üzerine yerleştirilebilir. Her iki seviyede de desteklenen bir yol veya hizalı bir giriş bağlanabilir. Normal hareket hızının yarısı. Hareket prototipi."
esES = "Escalera de un nivel. Apílela sobre el suelo, plataformas u otra sección soportada. Conecte un camino soportado o una entrada alineada en cualquiera de los dos niveles. Velocidad de desplazamiento a la mitad de la normal. Prototipo de movimiento."
itIT = "Scala a una rampa. Impilabile sul terreno, su piattaforme o su un'altra sezione di supporto. Collegare un percorso supportato o un ingresso allineato a uno dei due livelli. Velocità di spostamento pari alla metà di quella normale. Prototipo di movimento."
ukUA = "Одноярусні драбини. Встановлюються на землі, платформах або на іншій опорній секції. Підключаються до опорного шляху або до вирівняного входу на будь-якому з двох рівнів. Швидкість руху вдвічі нижча за звичайну. Прототип руху."
thTH = "บันไดหนึ่งชั้น วางซ้อนบนพื้นดิน แพลตฟอร์ม หรือส่วนที่รองรับอีกส่วนหนึ่งได้ เชื่อมต่อกับเส้นทางที่รองรับหรือทางเข้าที่อยู่ในแนวเดียวกันที่ระดับใดระดับหนึ่ง ความเร็วในการเคลื่อนที่เป็นครึ่งหนึ่งของปกติ ต้นแบบการเคลื่อนที่"
csCZ = "Jednopatrový žebřík. Staví se na zemi, na plošinách nebo na jiném podporovaném úseku. Na kterékoli z obou úrovní se připojí k podporované cestě nebo zarovnanému vstupu. Poloviční normální rychlost pohybu. Prototyp pohybu."
viVN = "Thang một tầng. Xếp lên mặt đất, sàn hoặc một đoạn được hỗ trợ khác. Kết nối với một lối đi được hỗ trợ hoặc lối vào thẳng hàng ở một trong hai tầng. Tốc độ di chuyển bằng một nửa bình thường. Nguyên mẫu di chuyển."
caES = "Escala d'un nivell. Apila-la sobre el terra, plataformes o una altra secció subjecta. Connecta un camí subjecte o una entrada alineada en qualsevol dels dos nivells. Velocitat de desplaçament la meitat de la normal. Prototip de moviment."
beBY = "Аднамаршавая лесвіца. Ставіцца на зямлю, платформы або іншую падтрымальную секцыю. Злучаецца з падтрымальным шляхам або выраўнаным уваходам на любым з двух узроўняў. Хуткасць перамяшчэння ўдвая меншая за звычайную. Прататып руху."
roRO = "Scară cu un singur nivel. Se așază pe sol, pe platforme sau pe o altă secțiune susținută. Se conectează la o cale susținută sau la o intrare aliniată, la oricare dintre niveluri. Viteza de deplasare este jumătate din cea normală. Prototip de mișcare."
huHU = "Egyszintes létra. Talajra, platformokra vagy egy másik támasztott szakaszra építhető. Bármelyik szinten csatlakoztatható támasztott útvonalhoz vagy egymással egy vonalban lévő bejárathoz. Normál mozgási sebesség fele. Mozgásprototípus."
arSA = "سلم بمستوى واحد. يُكدَّس على الأرض أو على المنصات أو على قسم مدعوم آخر. يُوصَل بمسار مدعوم أو بمدخل متراصف عند أي من المستويين. نصف سرعة التنقل العادية. نموذج أولي للحركة."

["LadderWorks.Attached.Description"]
status = "normal"
raw = "One-level ladder anchored over the top edge of a wall or platform. The bracket tile requires solid support below. Four-way lower and upper landings. Half normal travel speed. Movement prototype."
enUS = "One-level ladder anchored over the top edge of a wall or platform. The bracket tile requires solid support below. Four-way lower and upper landings. Half normal travel speed. Movement prototype."
zhCN = "单层梯子，固定在墙体或平台的顶部边缘上方。支架方块下方需要有坚固的支撑。上方和下方各有四向平台。移动速度为正常速度的一半。移动原型。"
zhTW = "單層梯子，固定在牆或平台的頂緣上方。支架方塊下方需要堅實的支撐。四向的下層與上層平台。移動速度為一般速度的一半。移動原型。"
ruRU = "Лестница в один уровень, закреплённая над верхним краем стены или платформы. Кронштейн требует прочной опоры снизу. Четырёхсторонние нижняя и верхняя площадки. Половина обычной скорости перемещения. Прототип движения."
jaJP = "1階分のはしごで、壁またはプラットフォームの上端に固定されます。ブラケットタイルは下に十分な支持がある必要があります。上下の着地点は四方向に対応しています。移動速度は通常の半分です。移動プロトタイプ。"
frFR = "Échelle d'un seul niveau fixée au-dessus du bord supérieur d'un mur ou d'une plateforme. La console nécessite un support solide en dessous. Paliers inférieur et supérieur dans quatre directions. Moitié de la vitesse de déplacement normale. Prototype de déplacement."
deDE = "Einstöckige Leiter, die über der oberen Kante einer Wand oder Plattform befestigt wird. Die Halterung benötigt darunter eine stabile Unterstützung. Vier Zugänge zum unteren und oberen Ende. Halbe normale Bewegungsgeschwindigkeit. Bewegungsprototyp."
plPL = "Drabina jednopoziomowa, zamocowana na górnej krawędzi ściany lub platformy. Wspornik wymaga solidnego podparcia od dołu. Czterokierunkowe lądowiska dolne i górne. Połowa normalnej prędkości poruszania się. Prototyp ruchu."
ptBR = "Escada de um nível ancorada sobre a borda superior de uma parede ou plataforma. O suporte requer apoio sólido abaixo. Patamares de quatro direções, inferior e superior. Metade da velocidade normal de deslocamento. Protótipo de movimentação."
koKR = "한 층 높이의 사다리로, 벽이나 플랫폼의 윗모서리 너머에 고정됩니다. 브래킷 타일은 아래쪽에 견고한 지지물이 있어야 합니다. 아래쪽과 위쪽 착지점은 사방으로 연결됩니다. 이동 속도는 일반 속도의 절반입니다. 이동 프로토타입."
trTR = "Bir seviyelik merdiven, duvarın veya platformun üst kenarının üzerine sabitlenir. Bu braket karosunun altında sağlam bir destek bulunmalıdır. Dört yönlü alt ve üst bağlantı noktaları vardır. Normal hareket hızının yarısı kadardır. Hareket prototipi."
esES = "Escalera de un nivel anclada sobre el borde superior de una pared o plataforma. La pieza de soporte requiere un apoyo sólido debajo. Descansos inferiores y superiores en cuatro direcciones. Velocidad de desplazamiento de la mitad de la normal. Prototipo de movimiento."
itIT = "Scala a un livello, ancorata sopra il bordo superiore di un muro o di una piattaforma. La tessera di supporto richiede un appoggio solido sotto. Pianerottoli inferiori e superiori su quattro lati. Velocità di spostamento dimezzata rispetto a quella normale. Prototipo di movimento."
ukUA = "Одноривневі драбина, прикріплена до верхнього краю стіни або платформи. Плитка-кронштейн потребує міцної опори знизу. Чотиристоронні нижні та верхні майданчики. Половина звичайної швидкості руху. Прототип для переміщення."
thTH = "บันไดขั้นเดียวที่ยึดเหนือขอบบนของกำแพงหรือแพลตฟอร์ม ไทล์ยึดต้องมีที่รองรับที่มั่นคงอยู่ด้านล่าง มีจุดพักแบบสี่ทิศทางทั้งด้านล่างและด้านบน ความเร็วในการเคลื่อนที่เป็นครึ่งหนึ่งของปกติ เป็นต้นแบบการเคลื่อนที่"
csCZ = "Jednopatrový žebřík připevněný přes horní hranu zdi nebo plošiny. Držák musí mít pod sebou pevnou oporu. Čtyřsměrná spodní a horní podesta. Poloviční normální rychlost pohybu. Prototyp pohybu."
viVN = "Thang một tầng, được gắn lên trên mép của tường hoặc bệ. Ô giá đỡ cần có nền đỡ chắc chắn bên dưới. Có bệ đáp ở cả bốn hướng, phía dưới và phía trên. Tốc độ di chuyển bằng một nửa bình thường. Nguyên mẫu di chuyển."
caES = "Escala d'un sol nivell ancorada sobre la vora superior d'una paret o plataforma. La peça de suport requereix un suport sòlid a sota. Replans d'entrada i sortida en les quatre direccions. Velocitat de desplaçament la meitat de la normal. Prototip de moviment."
beBY = "Аднаруўнёвая лесвіца, замацаваная над верхнім краем сцяны або платформы. Кронштэйн-пліта патрабуе надзейнай апоры знізу. Чатыры напрамкі для нізкіх і верхніх пляцовак. Хуткасць перамяшчэння ўдвая меншая за звычайную. Прататып руху."
roRO = "Scară cu un singur nivel, ancorată peste marginea superioară a unui perete sau a unei platforme. Piesa de consolă necesită suport solid dedesubt. Paliere de coborâre și de urcare în patru direcții. Viteza de deplasare este jumătate din cea normală. Prototip de mișcare."
huHU = "Egyszintes létra, amely egy fal vagy platform felső széléhez rögzül. A konzol csempéje alatt szilárd alátámasztás szükséges. Négy irányba nyíló alsó és felső leszállóhely. A normál mozgási sebesség fele. Mozgásprototípus."
arSA = "سُلَّم بطابق واحد مثبَّت فوق الحافة العلوية لجدار أو منصة. تتطلب قطعة الدعامة وجود دعم صلب أسفلها. منصات هبوط سفلية وعلوية تعمل في الاتجاهات الأربعة. سرعة الحركة نصف السرعة العادية. نموذج أولي للحركة."

["LadderWorks.WallMounted.Description"]
status = "normal"
raw = "One-level ladder bolted to a completed building wall directly behind it. Aim at a completed building side; brackets face it automatically. Drag vertically for up to 25 sections. Each section needs a wall; top connects to paths or building entrances."
enUS = "One-level ladder bolted to a completed building wall directly behind it. Aim at a completed building side; brackets face it automatically. Drag vertically for up to 25 sections. Each section needs a wall; top connects to paths or building entrances."
zhCN = "单层梯子，直接固定在已完工建筑墙体的背面。瞄准已完工建筑的一侧即可，托架会自动朝向该墙面。可垂直拖动，最多延伸25节。每节都需要有墙体支撑；顶端需连接到道路或建筑入口。"
zhTW = "單層梯子，用螺栓固定在已完成建築的牆面上，且緊貼於其後方。請瞄準已完成建築的一側，支架會自動朝向該側。垂直拖曳最多可建造 25 節。每一節都需要一面牆；頂端可連接至路徑或建築入口。"
ruRU = "Одноуровневая лестница, прикреплённая болтами к стене готового здания прямо за ней. Направьте её на готовую боковую сторону здания; кронштейны автоматически обращаются к ней. Протяните вертикально до 25 секций. Каждая секция требует стену; верх соединяется с тропинками или входами в здания."
jaJP = "完成した建物の壁の直後に、壁に固定された1階分のはしご。建物の完成した側面を狙って設置すると、ブラケットは自動的にその壁に向きます。縦方向にドラッグすると最大25区画まで設置できます。各区画には壁が必要で、最上部は通路または建物の入口に接続します。"
frFR = "Échelle d'un niveau fixée par boulons à un mur de bâtiment terminé, directement derrière elle. Visez un côté de bâtiment terminé ; les supports s'orientent automatiquement vers lui. Faites glisser verticalement pour jusqu'à 25 sections. Chaque section nécessite un mur ; le haut se raccorde aux chemins ou aux entrées de bâtiments."
deDE = "Einstöckige Leiter, die direkt hinter einer fertiggestellten Gebäudewand an dieser befestigt wird. Auf eine fertiggestellte Gebäudeseite zielen; die Halterungen zeigen automatisch zu ihr. Vertikal ziehen für bis zu 25 Abschnitte. Jeder Abschnitt benötigt eine Wand; das obere Ende verbindet sich mit Pfaden oder Gebäudeeingängen."
plPL = "Jednopoziomowa drabina przymocowana do ściany ukończonego budynku, bezpośrednio za nią. Wskaż bok ukończonego budynku; wsporniki automatycznie skierują się w jego stronę. Przeciągnij w pionie, aby dodać do 25 sekcji. Każda sekcja wymaga ściany; góra łączy się ze ścieżkami lub wejściami do budynków."
ptBR = "Escada de um nível presa à parede de um edifício concluído, diretamente atrás dela. Mire em um lado de edifício concluído; os suportes ficam voltados para ele automaticamente. Arraste na vertical para até 25 seções. Cada seção precisa de uma parede; o topo se conecta a caminhos ou entradas de edifícios."
koKR = "완성된 건물 벽에 바로 뒤쪽으로 고정하는 1층 높이 사다리입니다. 완성된 건물 측면을 조준하면 받침대가 자동으로 그 면을 향합니다. 세로로 드래그하여 최대 25개 구간까지 설치할 수 있습니다. 각 구간마다 벽이 필요하며, 맨 위는 길이나 건물 출입구와 연결됩니다."
trTR = "Tamamlanmış bir bina duvarının doğrudan arkasına cıvatalanmış tek katlı merdiven. Tamamlanmış bir bina yüzüne nişan alın; tutucular otomatik olarak buna doğru yönelir. Dikey olarak en fazla 25 bölüm sürükleyin. Her bölüm bir duvara ihtiyaç duyar; en üst kısım yollara veya bina girişlerine bağlanır."
esES = "Escalera de un nivel fijada a la pared de un edificio terminado, directamente detrás de ella. Apunte a un lateral de un edificio terminado; los soportes se orientan hacia él automáticamente. Arrástrela verticalmente hasta 25 secciones. Cada sección necesita una pared; la parte superior se conecta a caminos o a entradas de edificios."
itIT = "Scala a un livello fissata a una parete di un edificio completato, direttamente dietro di essa. Punta a un lato di un edificio completato; le staffe si orientano automaticamente verso di esso. Trascina verticalmente per un massimo di 25 sezioni. Ogni sezione richiede una parete; la parte superiore si collega a sentieri o ingressi degli edifici."
ukUA = "Одноярусна драбина, прикріплена до стіни завершеної будівлі безпосередньо позаду неї. Наведіть на бічну сторону завершеної будівлі; кронштейни автоматично спрямовуються до неї. Перетягуйте по вертикалі до 25 секцій. Кожна секція потребує стіни; верхній кінець з'єднується зі шляхами або входами до будівель."
thTH = "บันไดชั้นเดียวที่ยึดติดกับผนังอาคารที่สร้างเสร็จแล้วโดยตรงด้านหลังบันได เล็งไปยังด้านข้างของอาคารที่สร้างเสร็จแล้ว ตัวยึดจะหันเข้าหาด้านนั้นโดยอัตโนมัติ ลากในแนวตั้งได้สูงสุด 25 ส่วน แต่ละส่วนต้องมีผนัง ส่วนบนเชื่อมต่อกับทางเดินหรือทางเข้าอาคาร"
csCZ = "Jednopatrový žebřík připevněný šrouby přímo na zeď dokončené budovy za ním. Zaměřte se na boční stranu dokončené budovy; konzoly se k ní automaticky natočí. Táhněte svisle až do 25 úseků. Každý úsek potřebuje zeď; horní konec se připojuje k cestám nebo ke vstupům do budov."
viVN = "Thang một tầng gắn chặt vào tường của công trình đã hoàn thành ngay phía sau nó. Nhắm vào một mặt của công trình đã hoàn thành; các giá đỡ tự động quay về phía đó. Kéo theo chiều dọc để xây tối đa 25 đoạn. Mỗi đoạn cần có một bức tường; đỉnh thang kết nối với lối đi hoặc lối vào công trình."
caES = "Escala d'un sol nivell fixada a la paret d'un edifici acabat, just darrere seu. Apunta a un costat d'edifici acabat; els suports hi miren automàticament. Arrossega verticalment fins a 25 seccions. Cada secció necessita una paret; la part superior es connecta a camins o a entrades d'edificis."
beBY = "Аднаўзроўневая лесвіца, прыкручаная да сцяны гатовага будынка проста за ёй. Цэльцеся ў бок гатовага будынка; кронштэйны аўтаматычна павернуцца да яго. Цягніце па вертыкалі да 25 секцый. Кожная секцыя патрабуе сцяну; верхняя частка злучаецца з сцежкамі або ўваходамі ў будынкі."
roRO = "Scară cu un singur nivel, fixată pe peretele unei clădiri finalizate, direct în spatele ei. Îndreptați-o spre latura unei clădiri finalizate; consolele se orientează automat spre ea. Trageți pe verticală pentru până la 25 de secțiuni. Fiecare secțiune necesită un perete; partea de sus se conectează la cărări sau la intrările clădirilor."
huHU = "Egyszintes létra, amely közvetlenül egy elkészült épületfal mögé van csavarozva. Céloz egy elkészült épületoldalra; a tartókonzolok automatikusan ráfordulnak. Függőlegesen húzva legfeljebb 25 szakasz építhető. Minden szakasznak szüksége van falra; a teteje utakhoz vagy épületbejáratokhoz csatlakozik."
arSA = "سلم من مستوى واحد مثبت بالبراغي على جدار مبنى مكتمل مباشرةً خلفه. وجّهه نحو أحد جوانب مبنى مكتمل؛ تتجه الأقواس نحوه تلقائياً. اسحب عمودياً لإضافة ما يصل إلى 25 قسماً. يحتاج كل قسم إلى جدار، ويتصل الطرف العلوي بالممرات أو بمداخل المباني."

