[_meta]
name = "LadderWorks"

["LadderWorks.Freestanding.Description"]
new = "One-level ladder. Stack on ground, platforms or another supported section. Connect a supported path or aligned entrance at either level. Half normal travel speed. Movement prototype."
status = "normal"

["LadderWorks.Attached.Description"]
new = "One-level ladder anchored over the top edge of a wall or platform. The bracket tile requires solid support below. Four-way lower and upper landings. Half normal travel speed. Movement prototype."
status = "normal"

["LadderWorks.WallMounted.Description"]
new = "One-level ladder bolted to a completed building wall directly behind it. Aim at a completed building side; brackets face it automatically. Drag vertically for up to 25 sections. Each section needs a wall; top connects to paths or building entrances."
status = "normal"

["LadderWorks.WallMounted.RequiresWall"]
new = "Rotate brackets toward a completed building wall behind this section."
status = "normal"

