["LV.FCS.CapacityMultiplerDesc"]
raw = "The multiplier applied to the capacity of all the storage buildings. Settings it below 1 to make the game harder by reducing the capacity. You will not lose the items in the storage when reducing the capacity but you have to remove the excess items manually."
status = "normal"
enUS = "The multiplier applied to the capacity of all the storage buildings. Setting it below 1 makes the game harder by reducing the capacity. You will not lose the items in storage when reducing the capacity, but you have to remove the excess items manually."
zhCN = "可以将仓储建筑的容量更改为原本的N倍（游戏默认：1）。"
zhTW = "應用於所有儲存建築容量的乘數。將其設置為低於1以通過減少容量來提高遊戲難度。減少容量時，你不會失去儲存中的物品，但必須手動移除多餘的物品。"
ruRU = "Множитель, применяемый к ёмкости всех складских зданий. Установите его ниже 1, чтобы усложнить игру, уменьшив ёмкость. Вы не потеряете предметы на складе при уменьшении ёмкости, но вам нужно будет вручную удалить лишние предметы."
jaJP = "すべてのストレージビルの容量に適用される倍率。ゲームを難しくするために容量を減少させて1未満に設定することができます。容量を減少させてもストレージ内のアイテムは失われませんが、余分なアイテムは手動で取り除く必要があります。"
frFR = "Le multiplicateur appliqué à la capacité de tous les bâtiments de stockage. Réglez-le en dessous de 1 pour rendre le jeu plus difficile en réduisant la capacité. Vous ne perdrez pas les objets dans le stockage en réduisant la capacité, mais vous devrez retirer manuellement les objets excédentaires."
deDE = "DerMultiplikator, der auf die Kapazität aller Lagergebäude angewendet wird. Stellen Sie ihn unter 1 ein, um das Spiel schwieriger zu machen, indem Sie die Kapazität verringern. Sie verlieren die Gegenstände im Lager nicht, wenn Sie die Kapazität reduzieren, aber Sie müssen die überschüssigen Gegenstände manuell entfernen."
plPL = "Mnożnik zastosowany do pojemności wszystkich budynków magazynowych. Ustawiając go poniżej 1, możesz utrudnić grę, zmniejszając pojemność. Nie stracisz przedmiotów w magazynie, zmniejszając pojemność, ale musisz ręcznie usunąć nadmiarowe przedmioty."
ptBR = "O multiplicador aplicado à capacidade de todos os edifícios de armazenamento. Ajustá-lo abaixo de 1 para tornar o jogo mais difícil, reduzindo a capacidade. Você não perderá os itens no armazenamento ao reduzir a capacidade, mas terá que remover os itens em excesso manualmente."
koKR = "모든 저장 건물의 용량에 적용되는 배율입니다. 용량을 줄여 게임을 더 어렵게 만들기 위해 1 미만으로 설정하세요. 용량을 줄일 때 저장소의 항목이 손실되지는 않지만 여분의 항목은 수동으로 제거해야 합니다."
trTR = "Tüm depolama binalarının kapasitesine uygulanan çarpan. Kapasiteyi azaltarak oyunu daha zor hale getirmek için 1'in altına ayarlayın. Kapasiteyi düşürdüğünüzde depodaki eşyaları kaybetmeyeceksiniz, ancak fazla eşyaları manuel olarak çıkarmanız gerekiyor."
esES = "El multiplicador aplicado a la capacidad de todos los edificios de almacenamiento. Configurarlo por debajo de 1 hace el juego más difícil al reducir la capacidad. No perderás los objetos del almacén al reducir la capacidad, pero tendrás que retirar manualmente los objetos sobrantes."
itIT = "Il moltiplicatore applicato alla capacità di tutti gli edifici di stoccaggio. Impostandolo a un valore inferiore a 1 si rende il gioco più difficile, riducendo la capacità. Riducendo la capacità non si perdono gli oggetti presenti nello stoccaggio, ma è necessario rimuovere manualmente quelli in eccesso."
ukUA = "Множник, що застосовується до місткості всіх складів. Встановлення значення нижче 1 ускладнює гру, зменшуючи місткість. Предмети на складі не втрачаються при зменшенні місткості, але надлишок потрібно прибрати вручну."
thTH = "ตัวคูณที่ใช้กับความจุของอาคารจัดเก็บทั้งหมด การตั้งค่าให้ต่ำกว่า 1 จะทำให้เกมยากขึ้นโดยลดความจุ เมื่อลดความจุ คุณจะไม่สูญเสียสิ่งของที่เก็บอยู่ในคลัง แต่ต้องนำสิ่งของส่วนเกินออกเองด้วยตนเอง"
csCZ = "Multiplier aplikovaný na kapacitu všech skladových budov. Nastavením pod hodnotu 1 ztížíte hru snížením kapacity. Neztratíte položky ve skladu při snižování kapacity, ale musíte ručně odstranit nadbytečné položky."
viVN = "Hệ số nhân được áp dụng cho dung lượng của tất cả các công trình lưu trữ. Đặt nó dưới 1 để làm cho trò chơi khó hơn bằng cách giảm dung lượng. Bạn sẽ không bị mất các vật phẩm trong kho lưu trữ khi giảm dung lượng nhưng bạn phải tự loại bỏ các món đồ thừa."
caES = "El multiplicador aplicat a la capacitat de tots els edificis d'emmagatzematge. Establiu-lo per sota de 1 per fer el joc més difícil reduint la capacitat. No perdreu els articles de l'emmagatzematge en reduir la capacitat, però haureu d'eliminar manualment l'excés d'articles."
beBY = "Множнік ёмістасці, які прымяняецца да ёмістасці ўсіх складоў. Калі ўсталяваць яго меншым за 1, гульня стане складанейшай, бо ёмістасць зменшыцца. Прадметы са склада пры зніжэнні ёмістасці не знікаюць, але лішкі трэба выдаліць уручную."
roRO = "Multiplicatorul aplicat capacității tuturor clădirilor de depozitare. Setarea lui sub 1 face jocul mai dificil, deoarece reduce capacitatea. Nu vei pierde produsele din depozit când reduci capacitatea, dar trebuie să scoți manual surplusul de produse."
huHU = "A tárolóépületek összes kapacitására alkalmazott szorzó. 1 alatti értékre állítva nehezebbé teszi a játékot, mivel csökkenti a kapacitást. A kapacitás csökkentésekor nem veszíted el a tárolóban lévő árukat, de a felesleges árukat kézzel kell eltávolítanod."
arSA = "المضاعف المطبّق على سعة جميع المباني التخزينية. اضبطه على قيمة أقل من 1 لجعل اللعبة أصعب عن طريق تقليل السعة. لن تفقد العناصر الموجودة في المخزن عند تقليل السعة، لكن عليك إزالة العناصر الزائدة يدويًا."
