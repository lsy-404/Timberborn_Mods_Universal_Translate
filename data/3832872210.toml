deDE = "Ein gebundener Baumstamm auf zwei Baumstumpf-Beinen, auf einer Grasfläche. Zwei Biber können hier sitzen und sich ausruhen."
plPL = "Opaska z kłody na dwóch pieńkach, na kawałku trawy. Tutaj mogą usiąść i odpocząć dwa bobry."
ptBR = "Um tronco com faixas apoiado em dois tocos, sobre um trecho de grama. Dois castores podem sentar e descansar aqui."
koKR = "통나무 벤치는 그루터기 두 개를 다리 삼아 풀밭 위에 놓인 띠무늬 통나무입니다. 비버 두 마리가 여기에 앉아 쉴 수 있습니다."
trTR = "Bağlı bir kütük, iki kütük ayağının üzerinde, bir çim parçasında. Burada iki kunduz oturup dinlenebilir."
esES = "Un tronco con bandas sobre dos patas de tocón, en un parche de hierba. Dos castores pueden sentarse y descansar aquí."
itIT = "Un tronco con anelli su due gambe di ceppo, su un lembo d'erba. Qui possono sedersi e riposare due castori."
