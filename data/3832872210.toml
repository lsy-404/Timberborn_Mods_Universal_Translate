zhTW = "一根綁著箍帶的原木，以兩段樹樁為腳，架設在一片草地上。兩隻海狸可以在此坐下休息。"
ruRU = "Бревно с обручами на двух пнях-ножках, на участке травы. Здесь могут сидеть и отдыхать два бобра."
jaJP = "丸太の上に鉄の帯が巻かれた、切り株の脚付きのベンチ。草の生えた地面に置かれている。ここでは2匹のビーバーが座って休憩できる。"
