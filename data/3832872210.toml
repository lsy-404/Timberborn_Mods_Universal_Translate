["Building.RopeSwing.Description"]
status = "normal"
raw = "A plank seat on two ropes under a wooden A-frame, on a patch of grass. One beaver can sit and rest here."
enUS = "A plank seat on two ropes under a wooden A-frame, on a patch of grass. One beaver can sit and rest here."
zhCN = "一块木板座椅用两根绳索悬挂在木制人字架下，位于一片草地上。一只海狸可以在此坐下休息。"
zhTW = "在草地上，一處木製人字架下方懸掛著兩條繩索，繩索上架著一塊木板座椅。一隻海狸可以在此坐下休息。"
ruRU = "Доска-сиденье на двух верёвках под деревянной А-образной рамой, на участке травы. Один бобр может сесть здесь и отдохнуть."
jaJP = "木製のA字型フレームの下、草地に二本のロープで吊るされた板張りのブランコです。ビーバー一匹が座って休憩できます。"
frFR = "Un siège en planches suspendu à deux cordes, sous un cadre en A en bois, sur une parcelle d'herbe. Un castor peut s'asseoir et se reposer ici."
deDE = "Ein Holzbrett als Sitz an zwei Seilen unter einem hölzernen A-Rahmen, auf einer Grasfläche. Ein Biber kann hier sitzen und sich ausruhen."
plPL = "Deska siedziska zawieszona na dwóch linach pod drewnianą konstrukcją w kształcie litery A, na trawiastym skrawku ziemi. Może tu usiąść i odpocząć jeden bóbr."
ptBR = "Um assento de tábua preso por duas cordas sob uma estrutura triangular de madeira, sobre um pedaço de grama. Um castor pode sentar e descansar aqui."
koKR = "나무 A자 틀 아래 두 개의 밧줄에 매달린 널빤지 의자가 잔디밭 위에 놓여 있습니다. 비버 한 마리가 여기에 앉아 쉴 수 있습니다."
trTR = "Ahşap bir A çerçevenin altında, iki ip üzerinde asılı bir tahta oturak, çimenli bir alanda. Burada bir kunduz oturup dinlenebilir."
esES = "Un asiento de tablas colgado de dos cuerdas bajo un marco de madera en forma de A, sobre un parche de hierba. Un castor puede sentarse y descansar aquí."
itIT = "Un sedile di tavole appeso a due corde sotto una struttura di legno a forma di A, su un tratto d'erba. Un castoro può sedersi e riposare qui."
ukUA = "Дошка-сидіння на двох мотузках під дерев'яним A-подібним каркасом, на ділянці трави. Один бобер може тут сидіти й відпочивати."
thTH = "แผ่นไม้นั่งที่แขวนด้วยเชือกสองเส้นใต้โครงไม้รูปตัวเอ บนพื้นหญ้า บีเวอร์หนึ่งตัวสามารถนั่งพักผ่อนที่นี่ได้"
csCZ = "Prkenné sedadlo na dvou provazech pod dřevěným A-rámem, na trávníku. Jeden bobr se zde může posadit a odpočinout si."
viVN = "Một chiếc ghế gỗ treo trên hai sợi dây, dưới khung chữ A bằng gỗ, đặt trên một bãi cỏ. Một hải ly có thể ngồi nghỉ ở đây."
caES = "Un seient de fusta sobre dues cordes, sota un marc de fusta en forma d'A, en un tros d'herba. Un castor pot seure i descansar aquí."
beBY = "Дошка-сядзенне на дзвюх вяроўках пад драўлянай А-падобнай рамай, на ўчастку травы. Адзін бабёр можа сесці тут і адпачыць."
roRO = "O bancă din scânduri, suspendată de două funii sub un cadru triunghiular de lemn, pe o porțiune de iarbă. Un castor poate sta și se poate odihni aici."
huHU = "Egy deszkaülés két kötélen, fából készült A-keret alatt, egy füves foltban. Egy búvár itt leülhet és pihenhet."
arSA = "مقعد خشبي مسطح معلّق بحبلين أسفل إطار خشبي على شكل حرف A، فوق قطعة من العشب. يستطيع بيفر واحد الجلوس هنا والاستراحة."

