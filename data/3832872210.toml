csCZ = "Polená lavička z pruhovaného kmene na dvou pařezových nohách, na trávě. Můžou zde sedět a odpočívat dva bobři."
viVN = "Một khúc gỗ có đai buộc đặt trên hai chân gốc cây, nằm trên một mảng cỏ. Hai hải ly có thể ngồi và nghỉ ngơi ở đây."
caES = "Un tronc amb anelles sobre dues cames de soca, en un tros d'herba. Aquí hi poden seure i descansar dos castors."
beBY = "Бярвенне з абручамі на дзвюх пнявых ножках, на ўчастку травы. Тут могуць адпачыць і сесці два бабры."
roRO = "O bancă dintr-un buștean cu cercuri, pe două picioare de cioate, pe o porțiune de iarbă. Doi castori pot sta jos și se pot odihni aici."
huHU = "Egy kötegelt rönk két tuskólábon, egy fűfoltra helyezve. Itt két bóbita leülhet és pihenhet."
arSA = "مقعد من جذع خشبي مربوط بالأحزمة، يرتكز على ساقين من جذوع الأشجار المقطوعة، فوق قطعة من العشب. يتسع لجلوس اثنين من القنادس للراحة هنا."

