ukUA = "Дерев'яний стіл із дошок з лавкою з кожного боку, накритий кошиком і кухлем, на ділянці трави. Тут можуть сидіти й відпочивати четверо бобрів."
thTH = "โต๊ะไม้แผ่นพร้อมม้านั่งสองข้าง วางตะกร้าและแก้วน้ำไว้บนแปลงหญ้า ที่นี่รองรับบีเวอร์สี่ตัวให้นั่งพักผ่อนได้"
csCZ = "Dřevěný stůl z prken s lavicí na každé straně, prostřený košíkem a hrnkem, na trávníku. Čtyři bobři si zde mohou sednout a odpočinout."
viVN = "Một chiếc bàn gỗ ván với ghế dài hai bên, trên bàn có giỏ và cốc, đặt trên một bãi cỏ. Bốn hải ly có thể ngồi nghỉ ở đây."
caES = "Una taula de fusta amb un banc a cada costat, parada amb una cistella i una tassa, sobre un tros d'herba. Quatre castors hi poden seure i descansar."
beBY = "Дошка для пікніка з лаўкамі з кожнага боку, на траве стаяць кошык і кубак. За гэтым сталом могуць адпачываць чатыры бабры."
roRO = "O masă din scânduri de lemn cu câte o bancă pe fiecare parte, așezată pe o petică de iarbă, cu un coș și o cană pe ea. Patru castori pot sta și se pot odihni aici."
huHU = "Egy deszkából készült asztal, mindkét oldalán egy-egy padgal, kosárral és bögrével megterítve, egy fűfolton. Négy bóbita itt üldögélhet és pihenhet."
arSA = "طاولة نزهة من ألواح خشبية مع مقعد على كل جانب، مُجهّزة بسلة وكوب، في قطعة من العشب. يمكن لأربعة بيفر الجلوس هنا والاستراحة."

