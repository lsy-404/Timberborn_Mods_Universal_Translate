["ZOS.HearingRadiusTooltip"]
status = "normal"
raw = "How far from the centre of the screen sounds can be heard. Game default is 10. Higher lets you hear more of the view when zoomed out."
enUS = "How far from the center of the screen sounds can be heard. The game default is 10. A higher value lets you hear more of the view when zoomed out."
zhCN = "从屏幕中心多远处的声音可以被听见。游戏默认值为 10。数值越高，缩小视图时能听到的范围越广。"
zhTW = "從螢幕中心往外多遠的範圍內可以聽見聲音。遊戲預設值為 10。數值越高，縮小畫面時能聽見的範圍越大。"
ruRU = "Расстояние от центра экрана, на котором слышны звуки. Значение по умолчанию в игре — 10. Чем оно выше, тем большую часть обзора можно слышать при отдалении камеры."
jaJP = "画面の中心からどのくらい離れた音まで聞こえるかを設定します。ゲームのデフォルトは10です。値を大きくすると、ズームアウト時により広い範囲の音が聞こえるようになります。"
frFR = "Distance maximale à laquelle les sons peuvent être entendus depuis le centre de l’écran. La valeur par défaut du jeu est 10. Une valeur plus élevée permet d’entendre davantage de ce qui se passe à l’écran lorsque le zoom est déloigné."
deDE = "Wie weit vom Bildschirmzentrum entfernt Geräusche zu hören sind. Der Spielstandard ist 10. Ein höherer Wert lässt dich bei herausgezoomter Ansicht mehr hören."
plPL = "Jak daleko od środka ekranu słychać dźwięki. Domyślna wartość w grze to 10. Wyższa wartość pozwala słyszeć więcej dźwięków z widoku po oddaleniu kamery."
ptBR = "A que distância do centro da tela os sons podem ser ouvidos. O padrão do jogo é 10. Um valor maior permite ouvir uma área maior da tela quando a câmera está afastada."
koKR = "화면 중앙에서 얼마나 멀리 떨어진 곳의 소리까지 들을 수 있는지를 정합니다. 게임 기본값은 10입니다. 값을 높이면 축소했을 때 더 넓은 화면의 소리를 들을 수 있습니다."
csCZ = "Jak daleko od středu obrazovky je slyšet zvuky. Výchozí hodnota ve hře je 10. Vyšší hodnota umožňuje slyšet zvuky z větší části záběru při oddálení."
viVN = "Khoảng cách tính từ tâm màn hình mà âm thanh có thể nghe được. Mặc định trong trò chơi là 10. Giá trị cao hơn cho phép bạn nghe được nhiều âm thanh hơn khi thu nhỏ góc nhìn."
trTR = "Seslerin ekranın merkezinden ne kadar uzaktan duyulabileceği. Varsayılan oyun ayarı 10'dur. Değeri artırmak, uzaklaştırılmış görünümde daha geniş bir alanın seslerini duymanızı sağlar."

