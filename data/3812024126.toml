["ZOS.BuildingReachTooltip"]
raw = "How far the camera can be from the ground before building sounds fade to silence. Game default is 60, which goes silent a little past the starting zoom. Full zoom-out is about 155 (about 440 with unlocked zoom)."
status = "normal"
enUS = "How far the camera can be from the ground before building sounds fade to silence. The game default is 60, which goes silent a little past the starting zoom. Full zoom-out is about 155 (about 440 with unlocked zoom)."
zhCN = "镜头距离地面多远时，建造音效会逐渐减弱直至无声。游戏默认值为 60，稍微超过初始缩放距离时，音效就会完全消失。最大缩放距离约为 155（解锁缩放后约为 440）。"
zhTW = "鏡頭距離地面多遠時，建築聲音會逐漸淡出至無聲。遊戲預設值為 60，稍微超出初始縮放範圍後就會完全無聲。完全縮至最遠時約為 155（解鎖縮放後約為 440）。"
ruRU = "На каком расстоянии от земли может находиться камера, прежде чем звуки строительства полностью затихнут. По умолчанию в игре установлено значение 60: звуки затихают чуть дальше начального уровня приближения. При максимальном отдалении камеры значение составляет около 155 (около 440 при разблокированном отдалении)."
jaJP = "建設音がフェードアウトして無音になる、カメラと地面の距離。ゲームのデフォルト値は60で、開始時のズーム位置を少し超えると無音になります。ズームアウトの最大値は約155です（ズーム制限を解除している場合は約440）。"
frFR = "Distance maximale de la caméra par rapport au sol avant que les sons de construction ne s'estompent jusqu'au silence. La valeur par défaut du jeu est de 60 : le son disparaît un peu au-delà du zoom initial. Le zoom maximal est d'environ 155 (environ 440 avec le zoom déverrouillé)."
deDE = "Wie weit die Kamera vom Boden entfernt sein kann, bevor Baugeräusche allmählich verstummen. Der Spielstandardwert ist 60; ab einer Entfernung etwas über der anfänglichen Zoomstufe sind die Geräusche nicht mehr zu hören. Bei maximalem Zoom-out beträgt der Wert etwa 155 (etwa 440 bei freigeschaltetem Zoom)."
plPL = "Jak daleko kamera może znajdować się od ziemi, zanim dźwięki budowania ucichną. Domyślna wartość w grze to 60 — dźwięki zanikają nieco powyżej początkowego oddalenia kamery. Maksymalne oddalenie to około 155 (około 440 przy odblokowanym oddaleniu)."
ptBR = "Até que distância do chão a câmera pode ficar antes que os sons de construção diminuam até ficarem silenciosos. O padrão do jogo é 60, valor em que os sons ficam silenciosos um pouco depois do zoom inicial. O zoom máximo é de aproximadamente 155 (aproximadamente 440 com o zoom desbloqueado)."
koKR = "건물 소리가 완전히 사라지기 전에 카메라가 지면에서 얼마나 멀리 떨어질 수 있는지를 설정합니다. 게임 기본값은 60이며, 시작 줌보다 약간 더 멀리 줌아웃하면 소리가 들리지 않습니다. 최대 줌아웃은 약 155입니다(줌 잠금 해제 시 약 440)."
csCZ = "Jak daleko může být kamera od země, než zvuky stavění postupně utichnou. Výchozí hodnota ve hře je 60, což znamená, že zvuky zcela utichnou kousek za počáteční úrovní přiblížení. Při maximálním oddálení je hodnota přibližně 155 (přibližně 440 při odemčeném oddálení)."
viVN = "Khoảng cách tối đa giữa camera và mặt đất trước khi âm thanh xây dựng nhỏ dần rồi im bặt. Giá trị mặc định của trò chơi là 60; âm thanh sẽ im bặt khi phóng to ra xa hơn một chút so với mức thu phóng ban đầu. Mức thu phóng tối đa khoảng 155 (khoảng 440 khi mở khóa thu phóng)."
trTR = "Yapı seslerinin tamamen kesilmeden önce kameranın yerden ne kadar uzaklaşabileceği. Oyunun varsayılan değeri 60'tır; bu değerde sesler, başlangıç yakınlaştırma seviyesinin biraz ötesinde kesilir. Tam uzaklaştırma yaklaşık 155'tir (kilidi açılmış yakınlaştırmayla yaklaşık 440)."

