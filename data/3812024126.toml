["ZOS.AllTooltip"]
raw = "Turns every sound in this section up or down together. The sliders below fine-tune each one. 100 is the game's normal volume."
status = "normal"
enUS = "Turns every sound in this section up or down together. The sliders below fine-tune each one. 100 is the game's normal volume."
zhCN = "同时调高或调低此部分中的所有声音。下方的滑块可分别微调每种声音。100 是游戏的正常音量。"
zhTW = "將此區段中的所有音效一同調高或調低。下方的滑桿可微調個別音效。100 是遊戲的正常音量。"
ruRU = "Одновременно увеличивает или уменьшает громкость всех звуков в этом разделе. Ползунки ниже позволяют настроить громкость каждого звука отдельно. 100 — обычная громкость в игре."
jaJP = "このセクションのすべてのサウンド音量をまとめて上げたり下げたりします。下のスライダーで個別に微調整できます。100はゲームの通常の音量です。"
frFR = "Augmente ou baisse ensemble le volume de tous les sons de cette section. Les curseurs ci-dessous permettent de régler chacun d'eux plus précisément. 100 correspond au volume normal du jeu."
deDE = "Regelt alle Geräusche in diesem Bereich gemeinsam lauter oder leiser. Mit den Schiebereglern unten lässt sich jedes einzeln feinabstimmen. 100 entspricht der normalen Lautstärke im Spiel."
plPL = "Reguluje głośność wszystkich dźwięków w tej sekcji jednocześnie. Poniższe suwaki pozwalają precyzyjnie dostosować głośność każdego z nich. 100 oznacza normalną głośność w grze."
ptBR = "Aumenta ou diminui juntos todos os sons desta seção. Os controles deslizantes abaixo ajustam cada um individualmente. 100 é o volume normal do jogo."
koKR = "이 구역의 모든 소리 크기를 함께 높이거나 낮춥니다. 아래 슬라이더로 각 소리의 크기를 세밀하게 조정할 수 있습니다. 100은 게임의 기본 음량입니다."
csCZ = "Zesiluje nebo zeslabuje všechny zvuky v této sekci společně. Níže uvedené posuvníky umožňují jemně doladit hlasitost každého z nich. Hodnota 100 odpovídá běžné hlasitosti ve hře."
viVN = "Tăng hoặc giảm đồng thời âm lượng của mọi âm thanh trong mục này. Các thanh trượt bên dưới cho phép tinh chỉnh từng âm thanh. 100 là mức âm lượng thông thường của trò chơi."
trTR = "Bu bölümdeki tüm seslerin seviyesini birlikte artırır veya azaltır. Aşağıdaki kaydırıcılar her birini ayrı ayrı ayarlar. 100, oyunun normal ses seviyesidir."

