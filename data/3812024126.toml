["ZOS.AmbientZoomedOutTooltip"]
status = "normal"
raw = "Volume of background sounds (day and night ambience, water, sleeping beavers) at full zoom-out, as a percent of the close-up volume. Game default is 0."
enUS = "Volume of background sounds (day and night ambience, water, sleeping beavers) at full zoom-out, as a percentage of the close-up volume. The game default is 0."
zhCN = "完全缩至最远视角时背景音（昼夜环境音、水声、海狸睡觉声）的音量，占近景音量的百分比。游戏默认值为 0。"
zhTW = "縮放至最遠時背景音效（晝夜環境音、水聲、睡覺的海狸）的音量，相對於近距離音量的百分比。遊戲預設值為 0。"
ruRU = "Громкость фоновых звуков (дневная и ночная атмосфера, вода, спящие бобры) при максимальном отдалении камеры, в процентах от громкости при крупном плане. Значение по умолчанию в игре — 0."
jaJP = "最大までズームアウトしたときの環境音（昼夜の環境音、水音、眠っているビーバー）の音量。クローズアップ時の音量に対する割合（％）で指定します。ゲームのデフォルト値は0です。"
frFR = "Volume des sons d’ambiance (ambiances diurnes et nocturnes, eau, castors endormis) au zoom arrière maximal, en pourcentage du volume en gros plan. La valeur par défaut du jeu est 0."
deDE = "Lautstärke der Hintergrundgeräusche (Tag- und Nachtatmosphäre, Wasser, schlafende Biber) bei maximal herausgezoomter Ansicht, als Prozentsatz der Lautstärke in der Nahansicht. Der Spielstandardwert ist 0."
plPL = "Głośność dźwięków otoczenia (odgłosów dnia i nocy, wody, śpiących bobrów) przy maksymalnym oddaleniu, jako procent głośności przy zbliżeniu. Domyślna wartość w grze: 0."
ptBR = "Volume dos sons de fundo (ambiente diurno e noturno, água, castores dormindo) no zoom mais afastado, como porcentagem do volume no zoom aproximado. O padrão do jogo é 0."
koKR = "최대 축소 시 배경음(낮과 밤의 분위기 소리, 물소리, 잠자는 비버)의 음량을 확대 화면 음량 대비 백분율로 설정합니다. 게임 기본값은 0입니다."
csCZ = "Hlasitost zvuků prostředí (denní a noční atmosféra, voda, spící bobři) při maximálním oddálení, jako procento hlasitosti při přiblížení. Výchozí nastavení hry je 0."
viVN = "Âm lượng âm thanh nền (không khí ban ngày và ban đêm, nước, hải ly đang ngủ) khi thu nhỏ hết cỡ, tính theo phần trăm so với âm lượng khi phóng to gần. Giá trị mặc định trong game là 0."
trTR = "Tamamen uzaklaştırılmış görünümdeki arka plan seslerinin (gündüz ve gece ambiyansı, su, uyuyan kunduzlar) ses düzeyi; yakından görünümdeki ses düzeyinin yüzdesi olarak belirtilir. Oyunun varsayılan değeri 0'dır."

