["ZOS.HearingRadiusTooltip"]
raw = "How far from the centre of the screen sounds can be heard. Game default is 10. Higher lets you hear more of the view when zoomed out."
status = "normal"
enUS = "The distance from the center of the screen at which sounds can be heard. The game default is 10. A higher value lets you hear more of the view when zoomed out."
zhCN = "声音可从屏幕中心多远处被听见。游戏默认值为 10。数值越高，缩小视角时能听到的画面范围越大。"
zhTW = "從螢幕中心算起，聲音可以被聽見的距離。遊戲預設值為 10。數值越高，縮小畫面時就能聽見視野中更多地方的聲音。"
ruRU = "На каком расстоянии от центра экрана слышны звуки. Значение по умолчанию в игре — 10. При большем значении слышно больше звуков в кадре при отдалении камеры."
jaJP = "画面中央からどのくらい離れた音まで聞こえるかを設定します。ゲームのデフォルトは10です。値を大きくすると、ズームアウト時により広い範囲の音が聞こえます。"
frFR = "Distance à laquelle les sons peuvent être entendus depuis le centre de l’écran. La valeur par défaut du jeu est 10. Une valeur plus élevée permet d’entendre davantage de ce qui se passe à l’écran lorsque l’on dézoome."
deDE = "Wie weit vom Bildschirmzentrum entfernt Geräusche hörbar sind. Der Standardwert im Spiel ist 10. Ein höherer Wert lässt dich bei herausgezoomter Ansicht mehr hören."
plPL = "Jak daleko od środka ekranu słychać dźwięki. Domyślna wartość w grze to 10. Wyższa wartość pozwala słyszeć dźwięki z większej części widoku po oddaleniu kamery."
ptBR = "A que distância do centro da tela os sons podem ser ouvidos. O padrão do jogo é 10. Um valor maior permite ouvir mais do que está na tela quando o zoom está afastado."
koKR = "화면 중앙에서 얼마나 멀리 떨어진 곳의 소리까지 들을 수 있는지를 설정합니다. 게임 기본값은 10입니다. 값을 높이면 축소했을 때 더 넓은 화면 영역의 소리를 들을 수 있습니다."
csCZ = "Jak daleko od středu obrazovky jsou slyšet zvuky. Výchozí hodnota ve hře je 10. Vyšší hodnota umožňuje slyšet zvuky z větší části zobrazené oblasti při oddálení."
viVN = "Khoảng cách từ tâm màn hình mà âm thanh có thể nghe được. Mặc định trong trò chơi là 10. Giá trị cao hơn giúp bạn nghe được nhiều âm thanh hơn khi thu nhỏ khung nhìn."
trTR = "Ekranın merkezinden ne kadar uzaktaki seslerin duyulabileceği. Oyunun varsayılan değeri 10'dur. Daha yüksek bir değer, uzaklaştırılmış görünümde daha geniş bir alanın seslerini duymanızı sağlar."

