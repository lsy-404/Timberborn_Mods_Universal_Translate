["ZOS.BuildingReachTooltip"]
status = "normal"
raw = "How far the camera can be from the ground before building sounds fade to silence. Game default is 60, which goes silent a little past the starting zoom. Full zoom-out is about 155 (about 440 with unlocked zoom)."
enUS = "How far the camera can be from the ground before building sounds fade to silence. The game default is 60, which goes silent a little past the starting zoom. Full zoom-out is about 155 (about 440 with unlocked zoom)."
zhCN = "镜头距离地面多远时，建筑音效会逐渐减弱直至完全静音。游戏默认值为 60，在略微超过初始缩放距离时就会静音。完全缩至最远时约为 155（解锁缩放后约为 440）。"
zhTW = "鏡頭距離地面多遠時，建造音效會逐漸減弱至無聲。遊戲預設值為 60，稍微超過初始縮放距離時，音效就會變得無聲。完全縮至最遠時約為 155（解鎖縮放後約為 440）。"
ruRU = "На каком расстоянии от земли может находиться камера, прежде чем звуки строительства затихнут до полной тишины. Значение по умолчанию в игре — 60: звуки затихают чуть дальше начального уровня приближения. При максимальном отдалении камеры значение составляет около 155 (около 440 при разблокированном приближении)."
jaJP = "建物の音がフェードアウトして無音になる、カメラと地面の距離。ゲームのデフォルトは60で、開始時のズームを少し超えると無音になります。ズームアウト最大時は約155（ズーム制限解除時は約440）です。"
frFR = "Distance à laquelle la caméra peut se trouver du sol avant que les sons de construction ne s’atténuent jusqu’au silence. La valeur par défaut du jeu est de 60 ; le son devient alors inaudible un peu au-delà du zoom initial. Le zoom arrière maximal est d’environ 155 (environ 440 avec le zoom déverrouillé)."
deDE = "Wie weit die Kamera vom Boden entfernt sein kann, bevor die Baugeräusche verstummen. Der Spielstandardwert ist 60; die Geräusche verstummen etwas jenseits der anfänglichen Zoomstufe. Bei maximalem Herauszoomen liegt der Wert bei etwa 155 (mit freigeschaltetem Zoom bei etwa 440)."
plPL = "Jak daleko kamera może znajdować się od ziemi, zanim odgłosy budowania ucichną. Domyślna wartość w grze to 60 — dźwięki cichną tuż za początkowym poziomem przybliżenia. Pełne oddalenie to około 155 (około 440 przy odblokowanym oddaleniu)."
ptBR = "A que distância do chão a câmera pode ficar antes de os sons de construção desaparecerem por completo. O padrão do jogo é 60, valor em que os sons desaparecem um pouco além do zoom inicial. O zoom máximo para fora é de cerca de 155 (cerca de 440 com o zoom desbloqueado)."
koKR = "건물 소리가 완전히 사라지기 전에 카메라가 지면에서 얼마나 멀리 떨어질 수 있는지를 나타냅니다. 게임 기본값은 60이며, 시작 확대 수준을 조금 넘으면 소리가 들리지 않습니다. 최대 축소 시 약 155입니다(축소 한도 해제 시 약 440)."
csCZ = "Jak daleko může být kamera od země, než zvuky stavění zcela utichnou. Výchozí hodnota hry je 60; při tomto nastavení zvuky utichnou krátce za výchozí úrovní přiblížení. Při maximálním oddálení je to přibližně 155 (přibližně 440 při odemčeném oddálení)."
viVN = "Khoảng cách tối đa từ mặt đất mà camera có thể ở trước khi âm thanh xây dựng nhỏ dần rồi tắt hẳn. Giá trị mặc định của trò chơi là 60, khi đó âm thanh sẽ tắt ngay sau mức thu phóng ban đầu một chút. Thu nhỏ hết cỡ là khoảng 155 (khoảng 440 khi mở khóa mức thu phóng)."
trTR = "Yapı sesleri tamamen kesilmeden önce kameranın yerden ne kadar uzaklaşabileceği. Varsayılan oyun değeri 60'tır; sesler, başlangıç yakınlaştırmasını biraz geçince kesilir. Tamamen uzaklaştırma yaklaşık 155'tir (yakınlaştırma sınırı kaldırıldığında yaklaşık 440)."

