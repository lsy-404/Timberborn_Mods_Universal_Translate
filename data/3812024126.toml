["ZOS.AmbientZoomedOutTooltip"]
raw = "Volume of background sounds (day and night ambience, water, sleeping beavers) at full zoom-out, as a percent of the close-up volume. Game default is 0."
status = "normal"
enUS = "Volume of background sounds (day and night ambience, water, sleeping beavers) at full zoom-out, as a percentage of the close-up volume. The game default is 0."
zhCN = "完全缩至最远视角时背景音（昼夜环境音、水声、睡觉的海狸）的音量，相对于近景音量的百分比。游戏默认值为 0。"
zhTW = "背景音效（白天與夜晚的環境音、水聲、睡覺的海狸）在縮放至最遠時的音量，以近距離音量的百分比表示。遊戲預設值為 0。"
ruRU = "Громкость фоновых звуков (дневная и ночная атмосфера, вода, спящие бобры) при максимальном отдалении камеры, в процентах от громкости при крупном плане. Значение по умолчанию в игре — 0."
jaJP = "最大までズームアウトしたときの環境音（昼夜の環境音、水音、眠っているビーバーの音）の音量。クローズアップ時の音量に対する割合で表示されます。ゲームのデフォルト値は0です。"
frFR = "Volume des sons d’ambiance (ambiances de jour et de nuit, eau, castors endormis) au zoom maximal, en pourcentage du volume au zoom rapproché. La valeur par défaut du jeu est 0."
deDE = "Lautstärke der Hintergrundgeräusche (Tag- und Nachtatmosphäre, Wasser, schlafende Biber) bei maximal herausgezoomter Ansicht, als Prozentsatz der Lautstärke in der Nahansicht. Der Spielstandardwert ist 0."
plPL = "Głośność dźwięków tła (odgłosy dnia i nocy, woda, śpiące bobry) przy maksymalnym oddaleniu, jako procent głośności z bliska. Domyślna wartość w grze to 0."
ptBR = "Volume dos sons de fundo (ambiente diurno e noturno, água, castores dormindo) com o zoom totalmente afastado, como porcentagem do volume em close. O padrão do jogo é 0."
koKR = "최대 축소 시 배경음(낮과 밤의 환경음, 물소리, 잠자는 비버)의 음량을 근접 화면 음량에 대한 백분율로 설정합니다. 게임 기본값은 0입니다."
csCZ = "Hlasitost zvuků prostředí (denní a noční atmosféra, voda, spící bobři) při maximálním oddálení, jako procento hlasitosti při přiblížení. Výchozí hodnota ve hře je 0."
viVN = "Âm lượng âm thanh nền (âm thanh ban ngày và ban đêm, tiếng nước, tiếng hải ly ngủ) khi thu nhỏ hết cỡ, tính theo phần trăm âm lượng khi phóng to cận cảnh. Mặc định của trò chơi là 0."
trTR = "En uzaklaştırılmış yakınlaştırma düzeyinde arka plan seslerinin (gündüz ve gece ambiyansı, su, uyuyan kunduzlar) ses düzeyi; yakından duyulan ses düzeyinin yüzdesi olarak. Oyunun varsayılan değeri 0'dır."

