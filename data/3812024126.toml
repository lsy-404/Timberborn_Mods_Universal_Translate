["ZOS.AllTooltip"]
status = "normal"
raw = "Turns every sound in this section up or down together. The sliders below fine-tune each one. 100 is the game's normal volume."
enUS = "Turns every sound in this section up or down together. The sliders below fine-tune each one. 100 is the game's normal volume."
zhCN = "同时调高或调低此部分中的所有声音。下方的滑块可单独微调每种声音。100 是游戏的正常音量。"
zhTW = "將此區域中的所有音效一併調高或調低。下方的滑桿可微調個別音效。100 是遊戲的正常音量。"
ruRU = "Одновременно увеличивает или уменьшает громкость всех звуков в этом разделе. Ползунки ниже позволяют настроить громкость каждого звука отдельно. 100 — обычная громкость игры."
jaJP = "このセクションのすべての音量をまとめて上げ下げします。下のスライダーで個別に微調整できます。100はゲームの通常の音量です。"
frFR = "Augmente ou diminue ensemble le volume de tous les sons de cette section. Les curseurs ci-dessous permettent de régler chacun d’eux avec précision. 100 correspond au volume normal du jeu."
deDE = "Regelt die Lautstärke aller Sounds in diesem Abschnitt gemeinsam nach oben oder unten. Mit den Schiebereglern darunter lässt sich jeder einzelne fein einstellen. 100 entspricht der normalen Lautstärke im Spiel."
plPL = "Jednocześnie zwiększa lub zmniejsza głośność wszystkich dźwięków w tej sekcji. Suwaki poniżej pozwalają precyzyjnie dostosować głośność każdego z nich. 100 to normalna głośność w grze."
ptBR = "Aumenta ou diminui o volume de todos os sons desta seção ao mesmo tempo. Os controles deslizantes abaixo ajustam cada um individualmente. 100 é o volume normal do jogo."
koKR = "이 구역의 모든 소리를 함께 키우거나 줄입니다. 아래 슬라이더로 각 소리의 음량을 세부 조정할 수 있습니다. 100은 게임의 기본 음량입니다."
csCZ = "Zvyšuje nebo snižuje hlasitost všech zvuků v této sekci najednou. Níže uvedené posuvníky umožňují doladit hlasitost jednotlivých zvuků. Hodnota 100 odpovídá běžné hlasitosti ve hře."
viVN = "Tăng hoặc giảm đồng thời âm lượng của mọi âm thanh trong mục này. Các thanh trượt bên dưới cho phép tinh chỉnh từng âm thanh. 100 là mức âm lượng bình thường của trò chơi."
trTR = "Bu bölümdeki tüm sesleri birlikte açar veya kısar. Aşağıdaki kaydırıcılar her birini ayrı ayrı ince ayarlar. 100, oyunun normal ses düzeyidir."

