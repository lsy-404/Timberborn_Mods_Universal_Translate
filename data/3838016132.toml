["Glass.AreaTool.Description"]
status = "normal"
raw = "Drag over glass blocks to edit their look together. Press R to switch between Horizontal (one level), Vertical (a wall: drag sideways and up/down) and Both (a box: drag from one corner block to the opposite one). Right-click or Esc to cancel."
enUS = "Drag over glass blocks to edit their look together. Press R to switch between Horizontal (one level), Vertical (a wall: drag sideways and up/down) and Both (a box: drag from one corner block to the opposite one). Right-click or Esc to cancel."
zhCN = "按住拖动玻璃方块可一起编辑其外观。按R键可在以下模式间切换：水平（单层）、垂直（墙面：可左右拖动，并上下拖动）以及整体（立方体：从一个角落方块拖动到对角的方块）。右键单击或按Esc键可取消。"
zhTW = "拖曳玻璃方塊即可一起編輯其外觀。按 R 可在水平（單一層）、垂直（牆面：可左右拖曳並上下移動）與全部（方塊：從一個角落方塊拖曳到對角方塊）之間切換。按右鍵或 Esc 可取消。"
ruRU = "Перетаскивайте над стеклянными блоками, чтобы изменить их вид сразу всех. Нажмите R, чтобы переключаться между режимами: Горизонтальный (один уровень), Вертикальный (стена: перетаскивание в стороны и вверх/вниз) и Оба (коробка: перетаскивание от одного угложного блока к противоположному). Щелчок правой кнопкой мыши или Esc отменяет действие."
jaJP = "ガラスブロックの上でドラッグすると、まとめて外観を編集できます。Rキーで「水平」（1階層）、「垂直」（壁：横方向と上下方向にドラッグ）、「両方」（箱：一方の角ブロックから反対側の角ブロックまでドラッグ）を切り替えます。右クリックまたはEscキーでキャンセルします。"
frFR = "Faites glisser sur les blocs de verre pour modifier leur apparence ensemble. Appuyez sur R pour basculer entre Horizontal (un niveau), Vertical (un mur : faites glisser latéralement et vers le haut/bas) et Les deux (un cube : faites glisser depuis un bloc de coin jusqu'au bloc de coin opposé). Clic droit ou Échap pour annuler."
deDE = "Ziehe über Glasblöcke, um ihr Aussehen gemeinsam zu bearbeiten. Drücke R, um zwischen Horizontal (eine Ebene), Vertikal (eine Wand: seitlich sowie nach oben/unten ziehen) und Beide (ein Kasten: vom einen Eckblock zum gegenüberliegenden ziehen) zu wechseln. Rechtsklick oder Esc zum Abbrechen."
plPL = "Przeciągnij po blokach szkła, aby edytować ich wygląd razem. Naciśnij R, aby przełączać między trybami: Poziomo (jeden poziom), Pionowo (ściana: przeciągaj w bok oraz w górę i w dół) oraz Obie (prostopadłościan: przeciągnij od jednego narożnego bloku do przeciwległego). Kliknij prawym przyciskiem myszy lub naciśnij Esc, aby anulować."
ptBR = "Arraste sobre os blocos de vidro para editar a aparência deles em conjunto. Pressione R para alternar entre Horizontal (um nível), Vertical (uma parede: arraste para os lados e para cima/baixo) e Ambos (uma caixa: arraste de um bloco de canto até o bloco de canto oposto). Clique com o botão direito ou pressione Esc para cancelar."
koKR = "유리 블록 위를 드래그하면 여러 블록의 모양을 함께 편집할 수 있습니다. R 키를 누르면 가로(한 层 단위), 세로(벽: 좌우로 드래그한 뒤 위아래로 드래그), 양방향(상자: 한쪽 모서리 블록에서 반대편 모서리 블록까지 드래그) 모드를 전환할 수 있습니다. 취소하려면 마우스 오른쪽 버튼을 클릭하거나 Esc를 누르세요."
trTR = "Cam bloklarının üzerinden sürükleyerek görünümlerini birlikte düzenleyin. Yatay (tek kat), Dikey (duvar: yana ve yukarı/aşağı sürükleyin) ve Her İkisi (kutu: bir köşe bloktan karşı köşedeki bloğa sürükleyin) arasında geçiş yapmak için R tuşuna basın. İptal etmek için sağ tıklayın veya Esc tuşuna basın."
esES = "Arrastra sobre los bloques de cristal para editar su aspecto en conjunto. Pulsa R para cambiar entre Horizontal (un nivel), Vertical (un muro: arrastra hacia los lados y arriba/abajo) y Ambos (una caja: arrastra desde un bloque de una esquina hasta el bloque de la esquina opuesta). Haz clic derecho o pulsa Esc para cancelar."
itIT = "Trascina sopra i blocchi di vetro per modificarne insieme l'aspetto. Premi R per passare tra Orizzontale (un solo livello), Verticale (una parete: trascina lateralmente e su/giù) e Entrambi (un cubo: trascina da un blocco d'angolo fino a quello opposto). Clic destro o Esc per annullare."
ukUA = "Перетягніть курсор над скляними блоками, щоб разом змінити їх вигляд. Натисніть R, щоб перемикатися між режимами Горизонтально (один рівень), Вертикально (стіна: перетягуйте вбік і вгору/вниз) і Обидва (коробка: перетягніть від одного кутового блока до протилежного). Клацніть правою кнопкою миші або натисніть Esc, щоб скасувати."
thTH = "ลากทับบล็อกกระจกเพื่อแก้ไขลักษณะของบล็อกเหล่านั้นพร้อมกัน กด R เพื่อสลับระหว่างโหมดแนวนอน (ระดับเดียว) แนวตั้ง (ผนัง: ลากไปทางข้างและขึ้น/ลง) และทั้งสองแบบ (กล่อง: ลากจากบล็อกมุมหนึ่งไปยังบล็อกมุมตรงข้าม) คลิกขวาหรือกด Esc เพื่อยกเลิก"
csCZ = "Přetažením přes skleněné bloky je upravíte najednou. Stiskněte R pro přepínání mezi režimy Vodorovně (jedna úroveň), Svisle (stěna: táhněte do stran a nahoru/dolů) a Obojí (krabice: táhněte od jednoho rohového bloku k protějšímu). Pravým tlačítkem myši nebo klávesou Esc zrušíte výběr."
viVN = "Kéo qua các khối kính để chỉnh sửa diện mạo của chúng cùng lúc. Nhấn R để chuyển đổi giữa Ngang (một tầng), Dọc (một bức tường: kéo sang hai bên và lên/xuống) và Cả hai (một hộp: kéo từ một khối ở góc này đến khối ở góc đối diện). Nhấp chuột phải hoặc nhấn Esc để hủy."
caES = "Arrossega sobre els blocs de vidre per editar-ne l'aspecte conjuntament. Prem R per canviar entre Horitzontal (un nivell), Vertical (una paret: arrossega lateralment i amunt/avall) i Ambdós (una caixa: arrossega des d'un bloc de cantonada fins al bloc de la cantonada oposada). Fes clic dret o prem Esc per cancel·lar."
beBY = "Перацягніце па шкляных блоках, каб разам змяніць іх выгляд. Націсніце R, каб пераключацца паміж Horizontal (адзін узровень), Vertical (сцяна: перацягвайце ўбок і ўверх/уніз) і Both (скрыня: перацягніце ад аднаго вуглавога блока да процілеглага). Пстрыкніце правай кнопкай мышы або націсніце Esc, каб скасаваць."
roRO = "Trage peste blocurile de sticlă pentru a le modifica aspectul împreună. Apasă R pentru a comuta între Orizontal (un singur nivel), Vertical (un perete: trage lateral și sus/jos) și Ambele (o cutie: trage de la un bloc de colț până la cel opus). Click dreapta sau Esc pentru a anula."
huHU = "Húzzon át üvegblokkok fölött, hogy együtt szerkeszthesse a megjelenésüket. Nyomja meg az R billentyűt a váltáshoz a Vízszintes (egy szint), Függőleges (fal: húzzon oldalra, majd fel/le) és Mindkettő (doboz: húzzon az egyik sarokblokktól a szemközti sarokblokkig) módok között. Jobb klikk vagy Esc a megszakításhoz."
arSA = "اسحب فوق كتل الزجاج لتعديل مظهرها معًا. اضغط على R للتبديل بين الوضع الأفقي (مستوى واحد)، والوضع العمودي (جدار: اسحب جانبيًا ولأعلى/لأسفل)، والوضع الكامل (صندوق: اسحب من كتلة إحدى الزوايا إلى الكتلة المقابلة لها). انقر بالزر الأيمن أو اضغط على Esc للإلغاء."

