["Building.GlassBlock.Description"]
status = "normal"
raw = "Works exactly like a levee: holds back water, can be stacked and walked on. Mostly see-through."
enUS = "Works exactly like a levee: holds back water, can be stacked and walked on. Mostly see-through."
zhCN = "与堤防完全相同：可以阻挡水流，可以叠放，也可以在上面行走。基本是透明的。"
zhTW = "與堤壩完全相同：可阻擋水流，可堆疊，也能行走其上。大多為透明。"
ruRU = "Работает точно так же, как дамба: сдерживает воду, может складываться в стопку и по нему можно ходить. Почти прозрачная."
jaJP = "水門のように機能します。水をせき止め、積み重ねたり、上を歩いたりできます。ほとんど透けて見えます。"
frFR = "Fonctionne exactement comme une digue : retient l'eau, peut être empilée et marchée dessus. Presque transparente."
deDE = "Funktioniert genau wie ein Deich: hält Wasser zurück, kann gestapelt und betreten werden. Größtenteils durchsichtig."
plPL = "Działa dokładnie jak wał: zatrzymuje wodę, można je układać w stosy i chodzić po nich. Prawie całkowicie przezroczysty."
ptBR = "Funciona exatamente como um dique: retém a água, pode ser empilhado e pisado. Quase transparente."
koKR = "레벨리(levee)와 정확히 같이 작동합니다: 물을 막아 두고, 쌓을 수 있으며, 그 위를 걸을 수 있습니다. 대부분 투명합니다."
trTR = "Tam olarak bir sedde gibi çalışır: suyu tutar, üst üste konabilir ve üzerinde yürünebilir. Çoğunlukla saydamdır."
esES = "Funciona exactamente como un dique: retiene el agua, puede apilarse y caminarse encima. Casi transparente."
itIT = "Funziona esattamente come un argine: trattiene l'acqua, può essere impilato e calpestato. Per lo più trasparente."
ukUA = "Працює точно як дамба: утримує воду, може складатися в стос і по ньому можна ходити. Майже прозорий."
thTH = "ทำงานเหมือนคันกั้นน้ำทุกประการ: กักน้ำไว้ได้ สามารถวางซ้อนกันและเดินบนมันได้ และส่วนใหญ่มองทะลุได้"
csCZ = "Funguje přesně jako hráz: zadržuje vodu, lze ji skládat a chodit po ní. Je téměř průhledná."
viVN = "Hoạt động giống hệt đê chắn: giữ nước lại, có thể xếp chồng và đi lên trên. Gần như trong suốt."
caES = "Funciona exactament com un dic: conté l'aigua, es pot apilar i caminar-hi a sobre. Gairebé transparent."
beBY = "Працуе дакладна як дамба: утрымлівае ваду, можа складвацца ў некалькі ярусаў і па ёй можна хадзіць. Амаль празрыстая."
roRO = "Funcționează exact ca un dig: reține apa, poate fi suprapus și poate fi călcat. Este în mare parte transparent."
huHU = "Pontosan úgy működik, mint a gát: visszatartja a vizet, egymásra rakható és rajta lehet járni. Nagyrészt átlátszó."
arSA = "يعمل تماماً مثل السد الترابي: يحجز المياه، ويمكن تكديسه والمشي عليه. وهو شفاف إلى حد كبير."

