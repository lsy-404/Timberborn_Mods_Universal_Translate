["Glass.Settings.Frost.Tooltip"]
status = "normal"
raw = "Milky haze over the glass. Separate from opacity: frosted glass can still be bright and light-colored."
enUS = "Milky haze over the glass. Separate from opacity: frosted glass can still be bright and light-colored."
zhCN = "玻璃上有一层乳白色雾状朦胧感。这与不透明度不同：磨砂玻璃仍可以很明亮、颜色较浅。"
zhTW = "玻璃上會有乳白色的霧面。這與不透明度不同：霧面玻璃仍可以很明亮、顏色淺。"
ruRU = "Молочная мутность стекла. Не путать с непрозрачностью: матовое стекло может быть ярким и светлым."
jaJP = "ガラスに乳白色のくもりがかかる。不透明度とは別物で、すりガラスは明るく淡い色でもかまいません。"
frFR = "Voile laiteux sur le verre. À distinguer de l'opacité : le verre dépoli peut rester lumineux et de couleur claire."
deDE = "Milchiger Schleier über dem Glas. Getrennt von der Undurchsichtigkeit: Mattiertes Glas kann dennoch hell und hellfarbig sein."
plPL = "Mleczna mgiełka na szkle. Nie mylić z nieprzezroczystością: matowe szkło może być jasne i jasnej barwy."
ptBR = "Névoa leitosa sobre o vidro. Diferente de opacidade: vidro fosco pode continuar claro e de cor clara."
koKR = "유리 위에 뿌연 흐림이 낀다. 불투명도와는 별개이며, 서리 낀 유리도 여전히 밝고 옅은 색일 수 있다."
trTR = "Cam üzerinde süt gibi bulanık bir sis. Opaklıktan ayrıdır: buzlu cam yine de parlak ve açık renkli olabilir."
esES = "Neblina lechosa sobre el cristal. Distinta de la opacidad: el cristal esmerilado puede seguir siendo brillante y de tono claro."
itIT = "Velatura lattiginosa sul vetro. Da non confondere con l'opacità: il vetro smerigliato può comunque essere luminoso e di colore chiaro."
ukUA = "Молочна мутність на склі. Не плутайте з непрозорістю: матове скло може бути яскравим і світлим."
thTH = "ฝ้าขุ่นบนกระจก แยกจากความทึบแสง: กระจกฝ้าอาจยังคงสว่างและมีสีอ่อนได้"
csCZ = "Mléčný zákal na skle. Neplést s neprůhledností: matné sklo může být stále světlé a světle zbarvené."
viVN = "Một lớp mờ đục như sữa phủ trên kính. Cần phân biệt với độ đục: kính mờ sương vẫn có thể sáng và có màu nhạt."
caES = "Una boira lletosa sobre el vidre. Diferent de l'opacitat: el vidre esmerilat pot seguir sent brillant i de color clar."
beBY = "Малочнае памутненне на шкле. Не плутаць з непразрыстасцю: матавае шкло можа быць таксама яскравым і светлым."
roRO = "Ceață lăptoasă peste sticlă. Nu se confundă cu opacitatea: sticla mată poate fi totuși luminoasă și de culoare deschisă."
huHU = "Tejszerű homály az üvegen. Ne tévesszük össze az átlátszatlansággal: a matt üveg lehet világos és fényes is."
arSA = "ضباب حليبي فوق الزجاج. يختلف هذا عن العتامة: فالزجاج المصنفر قد يظل ساطعًا وفاتح اللون."

