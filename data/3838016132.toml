["Glass.Settings.Opacity.Tooltip"]
status = "normal"
raw = "How strongly the glass tint covers what is behind it. 0 is clear, 100 is solid tint."
enUS = "How strongly the glass tint covers what is behind it. 0 is clear, 100 is solid tint."
zhCN = "玻璃染色遮挡后方物体的强度。0为完全透明，100为完全不透明的染色。"
zhTW = "玻璃染色覆蓋背後景物的強度。0 為完全透明，100 為完全不透明的染色。"
ruRU = "Насколько сильно оттенок стекла закрывает то, что находится за ним. 0 — полностью прозрачно, 100 — сплошной оттенок."
jaJP = "ガラスの色合いが背後のものをどの程度覆うかを示します。0は透明、100は完全に色付きで覆われます。"
frFR = "Intensité avec laquelle la teinte du verre recouvre ce qui se trouve derrière lui. 0 signifie transparent, 100 signifie teinte opaque."
deDE = "Wie stark die Glastönung dahinterliegendes verdeckt. 0 ist klar, 100 ist vollständig getönt."
plPL = "Stopień, w jakim szklane zabarwienie zasłania to, co znajduje się za nim. 0 oznacza przezroczystość, 100 oznacza pełne zabarwienie."
ptBR = "Intensidade com que a tonalidade do vidro cobre o que está atrás dele. 0 é transparente, 100 é tonalidade sólida."
koKR = "유리 색조가 뒤에 있는 것을 얼마나 강하게 가리는지 나타냅니다. 0은 투명, 100은 완전히 불투명한 색조입니다."
trTR = "Cam tonunun arkasındakileri ne kadar kapattığı. 0 tamamen şeffaf, 100 ise tamamen opak tondur."
esES = "Qué tan intensamente el tinte del cristal cubre lo que hay detrás de él. 0 es transparente, 100 es tinte sólido."
itIT = "Quanto la tinta del vetro copre ciò che si trova dietro di esso. 0 è trasparente, 100 è tinta piena."
ukUA = "Наскільки сильно скляне тонування закриває те, що знаходиться за ним. 0 — прозоре, 100 — повністю затоноване."
thTH = "ระดับความทึบของสีกระจกที่บดบังสิ่งที่อยู่ด้านหลัง 0 คือโปร่งใส 100 คือทึบแสงเต็มที่"
csCZ = "Jak silně barevné sklo zakrývá to, co je za ním. 0 znamená čiré, 100 znamená plně neprůhledný barevný nátěr."
viVN = "Mức độ kính phủ màu che khuất vật phía sau nó. 0 là trong suốt hoàn toàn, 100 là màu đặc hoàn toàn."
caES = "Com de fort és el tint del vidre que cobreix el que hi ha darrere. 0 és transparent, 100 és tint sòlid."
beBY = "Наколькі моцна шкельнае адценне засланяе тое, што знаходзіцца за ім. 0 — празрыстае, 100 — суцэльнае адценне."
roRO = "Cât de puternic acoperă nuanța de sticlă ceea ce se află în spatele ei. 0 înseamnă transparent, 100 înseamnă nuanță complet opacă."
huHU = "Az üveg színezésének erőssége, azaz mennyire takarja el a mögötte lévőt. 0 teljesen átlátszó, 100 teljesen átlátszatlan színezés."
arSA = "مدى كثافة تلوين الزجاج لما يقع خلفه. 0 يعني شفافًا تمامًا، و100 يعني تلوينًا كاملًا معتمًا."

