["GreedyCoats.description"]
raw = "These Leafcoats were so greedy for veriety, they learned to love water and joined a split in the GreedyBuilders...who promptly changed their name to GreedyCoats :D"
status = "abandoned"
enUS = "These Leafcoats were so greedy for veriety, they learned to love water and joined a split in the GreedyBuilders...who promptly changed their name to GreedyCoats :D"
zhCN = "在参观了示范区后，叶纹认为应该加入这项合作计划，兼容并济、全面发展。<br>叶纹种族学习了亲族们的科技，与神尾、铁牙一起，尝试更加和谐的发展道路。<br>座右铭：<i>水与木的交融艺术。</i>"
zhTW = "這些葉皮因為過於渴望多樣性，學會了喜愛水域，並加入了貪婪建造者的分支……他們隨即改名為貪婪外套 :D"
ruRU = "Эти Листокоты были так жадны к разнообразию, что научились любить воду и присоединились к расколу в ЖадныхСтроителях... которые незамедлительно сменили свое имя на ЖадныеКоты :D"
jaJP = "「これらのリーフコートたちは多様性に対して非常に貪欲で、水を愛することを学び、貪欲なビルダーたちの中で分裂しました…彼らはすぐに自分たちの名前をグリーディコートに変更しました :D」"
frFR = "Ces Leafcoats étaient si avides de variété qu'ils ont appris à aimer l'eau et ont rejoint une scission chez les GreedyBuilders... qui ont rapidement changé leur nom en GreedyCoats :D"
deDE = "Diese Blattmäntel waren so gierig nach Vielfalt, dass sie lernten, Wasser zu lieben und sich einem Teil der GierigenBauer anschlossen... die prompt ihren Namen in GierigeMäntel änderten :D"
plPL = "Te Leafcoaty były tak chciwe różnorodności, że nauczyły się kochać wodę i dołączyły do podziału w GreedyBuilders... którzy szybko zmienili swoją nazwę na GreedyCoats :D"
ptBR = "Esses Leafcoats eram tão gananciosos por variedade, que aprenderam a amar a água e se juntaram a uma divisão dos GreedyBuilders... que imediatamente mudaram seu nome para GreedyCoats :D"
koKR = "이 리프코트들은 다양성을 위해 너무 탐욕스러워서 물을 사랑하게 되었고, 탐욕스러운 건축가들 중 한 그룹에 합류했습니다... 그들은 즉시 이름을 탐욕스러운 코트로 바꾸었습니다 :D"
trTR = "Bu Yaprakpelerin çeşitlilik tutkusu o kadar güçlüydü ki, suyu sevmeyi öğrendiler ve GreedyBuilders'ta bir bölünmeye katıldılar... hemen adlarını GreedyCoats olarak değiştirdiler :D"
esES = "Estos Hojacoras estaban tan ávidos de variedad que aprendieron a amar el agua y se unieron a una escisión de los GreedyBuilders... que de inmediato cambiaron su nombre a GreedyCoats :D"
itIT = "Questi Leafcoats erano così avidi di varietà che imparavano ad amare l'acqua e si unirono a una scissione dei GreedyBuilders... che subito cambiarono nome in GreedyCoats :D"
ukUA = "Ці Leafcoats були настільки жадібні до різноманітності, що навчилися любити воду та приєдналися до розколу серед GreedyBuilders... які миттєво змінили своє ім'я на GreedyCoats :D"
thTH = "Leafcoats เหล่านี้โลภในความหลากหลายมากจนเรียนรู้ที่จะรักน้ำ และเข้าร่วมกลุ่มที่แตกแยกออกมาจาก GreedyBuilders... ซึ่งต่อมาก็เปลี่ยนชื่อตัวเองเป็น GreedyCoats :D"
csCZ = "Tato Listová pláště byla tak chamtivá po různorodosti, že se naučila milovat vodu a připojila se k rozdělení v Chamtivých Stavitelích... kteří se okamžitě přejmenovali na Chamtivé Pláště :D"
viVN = "Những Leafcoats này quá ham mê sự đa dạng, họ học được cách yêu nước và gia nhập một nhánh ly khai của GreedyBuilders...những người này ngay lập tức đổi tên thành GreedyCoats :D"
caES = "Aquests Fulles-Abrigs eren tan golafres de varietat que van aprendre a estimar l'aigua i es van unir a una escissió dels GreedyBuilders... que de seguida van canviar el seu nom a GreedyCoats :D"
beBY = "Гэтыя Лістакоты былі настолькі прагныя да разнастайнасці, што навучыліся любіць ваду і далучыліся да раскалу ў GreedyBuilders... які неадкладна змяніў сваю назву на GreedyCoats :D"
roRO = "Leafcoats acești castori erau atât de lacomi după varietate, încât au învățat să iubească apa și s-au alăturat unei facțiuni desprinse din GreedyBuilders... care și-au schimbat imediat numele în GreedyCoats :D"
huHU = "Ezek a Levélkabátok annyira mohók voltak a változatosságra, hogy megtanultak szeretni a vizet, és csatlakoztak a GreedyBuilders egyik szakadásához... akik azonnal GreedyCoats-ra változtatták a nevüket :D"
arSA = "كان هؤلاء Leafcoats شرهين جداً للتنوّع، فتعلّموا حب الماء وانضموا إلى انشقاقٍ في GreedyBuilders... ثم سارعوا إلى تغيير اسمهم إلى GreedyCoats :D"

