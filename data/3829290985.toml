["NaturalResource.Spurge.FlavorDescription"]
status = "normal"
raw = "\"It drinks what we won't,\" said Pina, from a sensible distance."
enUS = "\"It drinks what we won't,\" said Pina, from a sensible distance."
zhCN = "“它喝我们不喝的东西。”皮娜隔着一段明智的距离说道。"
zhTW = "「它喝我們不喝的東西，」皮娜站在一個明智的距離外說道。"
ruRU = "«Оно пьёт то, чего мы не станем», — сказала Пина, предусмотрительно держась на расстоянии."
jaJP = "「私たちが飲まないものを飲むんだ」と、ピナは十分な距離を取って言った。"
frFR = "« Elle boit ce que nous ne voulons pas », dit Pina, à une distance prudente."
deDE = "„Es trinkt, was wir nicht trinken würden“, sagte Pina aus vernünftigem Abstand."
plPL = "„Pije to, czego my nie tknęlibyśmy” — powiedziała Pina z rozsądnej odległości."
ptBR = "“Ele bebe o que nós não beberíamos”, disse Pina, a uma distância sensata."
koKR = "“우리가 마시지 않을 걸 마시네.” 피나가 적당히 거리를 두고 말했다."
trTR = "\"Bizim içmeyeceğimiz şeyi içiyor,\" dedi Pina, güvenli bir mesafeden."
esES = "«Bebe lo que nosotros no beberíamos», dijo Pina, desde una distancia prudente."
itIT = "«Beve quello che noi non berremmo», disse Pina, mantenendosi a una distanza prudente."
ukUA = "«Воно п'є те, чого ми не питимемо», — сказала Піна, тримаючись на обачній відстані."
thTH = "\"มันดื่มสิ่งที่พวกเราไม่ยอมดื่ม\" พีนากล่าว โดยเว้นระยะห่างอย่างสมเหตุสมผล."
csCZ = "„Pije to, co my nebudeme,“ řekla Pina z rozumné vzdálenosti."
viVN = "“Nó uống thứ chúng ta không uống,” Pina nói, từ một khoảng cách đủ khôn ngoan."
caES = "«Beu el que nosaltres no beurem», va dir la Pina, des d'una distància prudent."
beBY = "«Яно п'е тое, чаго мы не станем піць», — сказала Піна, трымаючыся на разумнай адлегласці."
roRO = "„Bea ce nu bem noi”, a spus Pina, de la o distanță prudentă."
huHU = "„Azt issza, amit mi nem fogunk” – mondta Pina, kellő távolságból."
arSA = "«إنه يشرب ما لا نشربه»، قالت بينا من مسافة معقولة."
