["Knatte.DE_SMDoubleInvSlopeW.Description"]
raw = "Smooth Metal Square that sticks out on both sides. \nPlacment hex block all water other blocks only from top/bottom like a built in Impermeable Floor"
status = "abandoned"
enUS = "Smooth metal square that protrudes on both sides. Placement hex block allows water on all sides while other blocks only interact from the top/bottom, similar to a built-in impermeable floor."
zhCN = "不同形状的防洪堤，部分悬空，能完全阻断水流。"
zhTW = "光滑的金屬方塊，兩側突出。 \n放置六邊形區塊，所有水只能從上/下進入，像一個內建的防水地板。"
ruRU = "Гладкий металлический квадрат, который выступает с обеих сторон. Размещение шестигранного блока, вся вода, другие блоки только сверху/снизу, как встроенный непроницаемый пол."
jaJP = "両側に突き出た滑らかな金属の四角形。\n配置六角ブロックはすべての水、他のブロックは上下からのみ、水密の床のように配置されます。"
frFR = "Carré en métal lisse qui dépasse des deux côtés. \nBloc hexagonal de placement, toutes les eaux, les autres blocs uniquement par le haut/le bas comme un sol imperméable intégré."
deDE = "Glattes Metallquadrat, das auf beiden Seiten herausragt. Platzierungshexagonblock, der allen Wasser blockiert, andere Blöcke nur von oben/unten wie ein eingebauter impermeabler Boden."
plPL = "Gładki metalowy kwadrat, który wystaje z obu stron. \nBlok sześciokątny umiejscowiony tak, aby woda była blokowana, a inne bloki tylko z góry/dół, jak wbudowana nieprzepuszczalna podłoga."
ptBR = "Quadrado de metal liso que se projeta de ambos os lados. Bloco hexagonal de colocação que permite água, outros blocos apenas de cima/embaixo, como um piso impermeável embutido."
koKR = "양쪽으로 튀어나온 매끄러운 금속 사각형. 배치용 헥스 블록은 모든 물을 포함하고 다른 블록은 위/아래에서만 접촉 가능하며 내구성이 있는 바닥처럼 작동합니다."
trTR = "Her iki tarafta da dışarıya çıkan Düz Metal Kare. \nYerleşim altıgen bloğu, sadece üstten/alta su ve diğer blokları gibi yerleşik su geçirmez zemin."
esES = "Bloque de metal liso y cuadrado que sobresale por ambos lados.\nColocación: el bloque hexagonal bloquea todo el agua; los demás bloques solo desde arriba o abajo, como un suelo impermeable integrado."
itIT = "Quadrato di metallo liscio che sporge da entrambi i lati.\nPosizionamento: il blocco esagonale blocca tutta l'acqua; gli altri blocchi bloccano l'acqua solo dall'alto e dal basso, come un Impermeable Floor integrato."
ukUA = "Гладкий металевий квадрат, що виступає з обох боків.\nРозміщення: гексагональний блок блокує всю воду; інші блоки лише зверху або знизу, як вбудована Непроникна підлога."
thTH = "บล็อกโลหะเรียบรูปสี่เหลี่ยมที่ยื่นออกมาทั้งสองด้าน\nการวางบล็อกหกเหลี่ยมจะกั้นน้ำทั้งหมด ส่วนบล็อกอื่นจะกั้นน้ำได้เฉพาะจากด้านบนและด้านล่าง เหมือน Impermeable Floor ในตัว"
csCZ = "Hladký kovový čtverec, který vyčnívá na obou stranách. Umístění hexagonálního bloku, který zadržuje vodu, jiné bloky pouze shora/dola, jako vestavěná nepropustná podlaha."
viVN = "Hình vuông kim loại trơn nhô ra ở cả hai bên.\nKhối hình lục giác được bố trí, nước và các khối khác chỉ từ trên xuống dưới như một mặt sàn không thấm nước tích hợp."
caES = "Quadrat de metal llis que sobresurt pels dos costats.\nCol·locació: aquest bloc hexagonal bloqueja tota l'aigua; els altres blocs només es poden col·locar des de dalt o des de baix, com un Impermeable Floor integrat."
beBY = "Гладкі металічны квадрат, які выступае з двух бакоў.\nРазмяшчэнне: гексагональны блок блакуе ўсю ваду, іншыя блокі — толькі зверху/знізу, як убудаваная Непранікальная падлога."
roRO = "Pătrat metalic neted care iese în afară pe ambele laturi.\nBloc hexagonal de plasare care blochează toată apa; celelalte blocuri doar de sus/jos, ca o Podea impermeabilă încorporată."
huHU = "Sima fém négyzet, amely mindkét oldalán kiáll.\nElhelyezés: a hatszögletű blokk minden vizet blokkol; a többi blokk csak felülről vagy alulról, a beépített Vízhatlan padlóhoz hasonlóan."
arSA = "مربع معدني أملس يبرز على الجانبين.\nوضع الكتلة السداسية يحجب الماء كله، بينما تحجب الكتل الأخرى الماء من الأعلى والأسفل فقط، مثل أرضية غير منفذة مدمجة."

