["Knatte.DE_A_RMInvSlopeW.Description"]
raw = "Ribbed Metal Square that can stick out. \nPlacment hex block all water other blocks only from top/bottom like a built in Impermeable Floor\nIn Aqueduct Style."
status = "abandoned"
enUS = "Ribbed metal square that can protrude.  \nPlacement hex block allows water, while other blocks only accept it from the top/bottom, like a built-in impermeable floor.  \nIn aqueduct style."
zhCN = "不同形状的防洪堤，部分悬空，能完全阻断水流。"
zhTW = "可以突出來的凹槽金屬方塊。\n在水道風格中，放置的六角塊可以讓水流入，其他方塊僅限於從上下進入，就像一個內建的防水地板。"
ruRU = "Ребристый металлический квадрат, который может выступать. \nРазмещение гексагонального блока, вся вода, остальные блоки только сверху/снизу, как встроенный непроницаемый пол \nВ стиле акведука."
jaJP = "出っ張ることができるリブ付き金属スクエア。 \n取り付けは六角ブロック、全ての水、他のブロックは上/下からのみ、内蔵の不透過床のように。 \nアクアダクトスタイル。"
frFR = "Carré en métal cannelé qui peut dépasser. Bloc hexagonal de placement, toutes les eaux, autres blocs uniquement par le haut / le bas comme un sol imperméable intégré. Dans le style aqueduc."
deDE = "Riffelmetallquadrat, das herausragen kann. Platzierungshexblock, der mit Wasser gefüllt ist, andere Blöcke nur von oben/unten wie ein integrierter wasserdichter Boden im Aquäduktstil."
plPL = "Rybkowany metalowy kwadrat, który może wystawać. \nMiejsce na heksagonalny blok, aby woda mogła przepływać tylko z góry/dół, jak wbudowana nieprzepuszczalna podłoga. \nW stylu akweduktu."
ptBR = "Quadrado de Metal Estriado que pode se destacar. Bloco hexagonal de colocação, toda a água e outros blocos apenas de cima/embaixo, como um piso impermeável embutido. No estilo de aqueduto."
koKR = "튀어나올 수 있는 주름진 금속 사각형. \n배치 헥스 블록은 위/아래에서만 다른 블록과 물을 허용하며, 내구성이 있는 바닥처럼 작용합니다.\n수로 스타일로."
trTR = "İçinde su tutabilen, dışarı çıkabilen oluklu metal kare.\nYerleştirme altıgen bloğu, suyu diğer bloklardan üstten/ alttan engelleyen, yerleşik su geçirmez zemin gibi.\nAkvadük tarzında."
esES = "Cuadrado de metal acanalado que puede sobresalir.\nLa colocación de este bloque hexagonal bloquea todo el agua; los demás bloques solo desde arriba o abajo, como un suelo impermeable integrado.\nEstilo Acueducto."
itIT = "Quadrato di metallo scanalato che può sporgere.\nPosizionamento: il blocco esagonale blocca tutta l'acqua; gli altri blocchi bloccano l'acqua solo dall'alto o dal basso, come un Impermeable Floor integrato.\nIn stile Acquedotto."
ukUA = "Квадратний ребристий металевий блок, що може виступати.\nРозміщення: шестикутний блок блокує всю воду, інші блоки лише зверху/знизу, як вбудована непроникна підлога.\nУ стилі акведука."
thTH = "บล็อกโลหะสี่เหลี่ยมมีร่อง ที่สามารถยื่นออกมาได้\nการวางบล็อกเฮกซ์จะกั้นน้ำทั้งหมด ส่วนบล็อกอื่นๆ จะกั้นน้ำได้เฉพาะจากด้านบนและด้านล่าง เหมือนพื้นกันน้ำซึมที่มีมาในตัว\nในสไตล์ Aqueduct"
csCZ = "Žebrovaný kovový čtverec, který může vyčnívat. \nUmístění hexagonálního bloku, veškerá voda, ostatní bloky pouze z vrchu/spodu jako vestavěná nepropustná podlaha \nve stylu akvaduktu."
viVN = "Hình vuông kim loại có rãnh có thể nhô ra.\nKhối hình lục giác ngăn nước ở mọi phía; các khối khác chỉ từ trên xuống dưới, như một mặt sàn ngăn nước tích hợp sẵn.\nKiểu Aqueduct."
caES = "Quadrat de metall acanalat que pot sobresortir. \nBloc hexagonal que bloqueja tota l'aigua; els altres blocs només des de dalt o des de sota, com un Terra Impermeable integrat.\nEn estil d'aqüeducte."
beBY = "Рыфлёны металічны квадрат, які можа выступаць.\nРазмяшчэнне: шасцікутны блок затрымлівае ўсю ваду; іншыя блокі — толькі зверху або знізу, як убудаваная непранікальная падлога.\nУ стылі акведука."
roRO = "Pătrat metalic cu nervuri, care poate ieși în afară.\nPlasare: bloc hexagonal care blochează toată apa; celelalte blocuri doar de sus/jos, ca o Podea impermeabilă încorporată.\nÎn stil de apeduct."
huHU = "Bordázott fémnégyzet, amely kiállhat.\nA hatszögletű blokk lerakásakor minden vizet blokkol; más blokkok csak felülről vagy alulról helyezhetők el, akárcsak a beépített vízhatlan padló.\nVízvezeték stílusban."
arSA = "مربع معدني مضلّع يمكنه أن يبرز.\nيحجب الكتلة السداسية كل المياه، وتحجب الكتل الأخرى المياه فقط من الأعلى والأسفل، كأرضية غير منفذة مدمجة.\nبنمط القناة المائية."

