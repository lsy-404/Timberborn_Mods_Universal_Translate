["Knatte.DE_SMInvSlopeW.Description"]
raw = "Smooth Metal Square that can stick out. \nPlacment hex block all water other blocks only from top/bottom like a built in Impermeable Floor"
status = "abandoned"
enUS = "Smooth metal square that can protrude. Placement hex block for all water, other blocks only from the top/bottom like a built-in impermeable floor."
zhCN = "不同形状的防洪堤，部分悬空，能完全阻断水流。"
zhTW = "光滑金屬方塊可以突出。 \n放置六角塊，所有水和其他方塊僅能從上下進入，就像一個內建的防水地板。"
ruRU = "Гладкий металлический квадрат, который может выступать. Размещение гексагональных блоков с водой, другие блоки только сверху/снизу, как встроенный непроницаемый пол."
jaJP = "滑らかな金属の四角形が突き出すことができます。配置された六角形のブロックは水を受け入れ、他のブロックは上/下からのみ、まるで内蔵の防水床のように機能します。"
frFR = "Carré en métal lisse qui peut dépasser. Bloc hexagonal de placement, toutes les eaux, les autres blocs uniquement par le haut/le bas comme un sol imperméable intégré."
deDE = "Glatte Metallplatte, die herausragen kann. Platzierung des Sechseckblocks, der Wasser an anderen Blöcken nur von oben/unten erlaubt, wie ein eingebauter wasserdichter Boden."
plPL = "Gładki metalowy kwadrat, który może wystawać. \nBlok hexowy do umieszczenia, cały wodny, inne bloki tylko z góry/dół jak wbudowana nieprzepuszczalna podłoga."
ptBR = "Quadrado de Metal Liso que pode se destacar. Bloco hexagonal de colocação, toda água, outros blocos somente do topo/fundo, como um piso impermeável embutido."
koKR = "매끈한 금속 정사각형으로, 튀어나올 수 있습니다. \n위치 여유 공간은 모든 물 블록에서 헥스 블록으로, 다른 블록은 오직 상단/하단에서만 적용됩니다. 내장형 불침투성 바닥처럼요."
trTR = "Pürüzsüz Metal Kare, dışarı çıkabilir. \nYerleştirme altıgen bloğu tüm su, diğer bloklar sadece üstten/alttan, entegre Su Geçirmez Zemin gibi."
esES = "Cuadrado de metal liso que puede sobresalir. \nAl colocarlo, este bloque hexagonal bloquea todo el agua; los demás bloques solo pueden conectarse desde arriba o desde abajo, como un Suelo Impermeable integrado."
itIT = "Quadrato di metallo liscio che può sporgere.\nBlocco esagonale per il posizionamento: blocca tutta l'acqua; gli altri blocchi possono essere collegati solo dall'alto o dal basso, come un Pavimento Impermeabile integrato."
ukUA = "Гладкий металевий квадратний блок, який може виступати.\nШестикутний блок розміщення блокує всю воду; інші блоки блокують воду лише зверху та знизу, як вбудована Непроникна підлога."
thTH = "บล็อกโลหะเรียบทรงสี่เหลี่ยมจัตุรัสที่สามารถยื่นออกมาได้\nการวางบล็อกหกเหลี่ยมจะกั้นน้ำทั้งหมด ส่วนบล็อกอื่นจะกั้นน้ำได้เฉพาะจากด้านบนและด้านล่าง เหมือน Impermeable Floor ที่มีในตัวเกม"
csCZ = "Hladký kovový čtverec, který může vyčnívat. \nUmístění hexagonální bloky mohou být všechny vodní, ostatní bloky pouze z vrchu/spodu jako vestavěná impermeabilní podlaha."
viVN = "Hình vuông kim loại mịn có thể nhô ra.\nKhối lục giác dùng để bố trí, cho nước và các khối khác chỉ di chuyển từ trên xuống dưới, giống như một mặt sàn không thấm nước tích hợp."
caES = "Quadrat de metall llis que pot sobresortir.\nBloc hexagonal de col·locació que bloqueja tota l'aigua; els altres blocs només des de dalt/baix, com un Terra impermeable integrat."
beBY = "Гладкі металічны квадрат, які можа выступаць. \nРазмяшчэнне: шасцігранны блок стрымлівае ўсю ваду, іншыя блокі — толькі зверху/знізу, як убудаваная непранікальная падлога."
roRO = "Pătrat metalic neted care poate ieși în afară.\nPlasarea hexagonală blochează toată apa; alte blocuri doar de sus/jos, ca o Podea impermeabilă încorporată"
huHU = "Sima fém négyzet, amely kilóghat.\nElhelyezés: a hatszögletű blokk minden vizet feltart, a többi blokk csak felülről/alulról, mint a beépített Impermeable Floor."
arSA = "مربع معدني أملس يمكن أن يبرز للخارج.\nوضع الكتلة السداسية يمنع كل المياه، أما الكتل الأخرى فتُوضع من الأعلى أو الأسفل فقط، مثل أرضية غير منفذة مدمجة."

