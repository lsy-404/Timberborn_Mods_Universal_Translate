zhCN = "不同形状的防洪堤，部分悬空，能完全阻断水流。"
zhTW = "凸出的肋狀金屬方塊。\n放置六角塊，所有水只能從上下進入，像是內建的防水地板。\n以水道風格設計。"
ruRU = "Рифленый металлический квадрат, который выступает с обеих сторон. \nРазмещение шестиугольного блока для воды, другие блоки только сверху/снизу, как встроенный непроницаемый пол \nв стиле акведука."
jaJP = "両側が飛び出したリブ付き金属の四角形。 \n配置はヘキサゴンブロックで、他のブロックは上/下からのみ水を受けるように、内蔵の不透過フロアのように設計されています。 \nアクアダクトスタイルで。"
frFR = "Carré en métal nervuré qui dépasse des deux côtés. \nBloc hexagonal de placement, toute l'eau, les autres blocs uniquement par le haut/le bas comme un sol imperméable intégré. \nDans le style aqueduc."
deDE = "Geripptes Metallquadrat, das auf beiden Seiten herausragt. \nPlatzierung von Sechseckblöcken, die Wasser abhalten, andere Blöcke nur von oben/unten, wie ein integrierter wasserdichter Boden \nIm Aquädukt-Stil."
plPL = "Klejony metalowy kwadrat, który wystaje po obu stronach. \nBlok sześciokątny umieszczony w taki sposób, że woda może przepływać tylko z góry/dolny, jak wbudowana nieprzemakalna podłoga w stylu akweduktu."
ptBR = "Quadrado de metal sulcado que se projeta em ambos os lados. \nBloco hexagonal de colocação que permite água e outros blocos apenas de cima/embaixo, como um piso impermeável embutido. \nNo estilo aqueduto."
koKR = "양면이 protruding된 리브 메탈 스퀘어입니다. 배치 시 육각형 블록은 모든 물이 흘러내리도록 하고, 다른 블록은 위/아래에서만 작동하여 내장형 불투수 바닥처럼 기능합니다. 수로 스타일입니다."
trTR = "Her iki tarafı dışarıda kalan oluklu metal kare. \nHex blok olarak yerleştirilir, suyu tüm diğer bloklardan sadece yukarıdan/aşağıdan alır, entegre Su Geçirmeyen Zemin gibi. \nAqueduct Tarzında."
esES = "Cuadrado de metal acanalado que sobresale por ambos lados. \nColocación: el bloque hexagonal bloquea toda el agua; los demás bloques solo desde arriba o abajo, como un suelo impermeable integrado.\nEstilo acueducto."
itIT = "Quadrato di metallo a nervature che sporge su entrambi i lati. \nBlocco esagonale da posizionare che blocca tutta l'acqua; gli altri blocchi bloccano l'acqua solo dall'alto e dal basso, come un Pavimento Impermeabile integrato\nIn stile Acquedotto."
ukUA = "Ребристий металевий квадрат, що виступає з обох боків. \nРозміщення: шестигранний блок блокує всю воду, інші блоки — лише зверху/знизу, як вбудована Impermeable Floor\nУ стилі Aqueduct."
thTH = "บล็อกโลหะสี่เหลี่ยมมีร่องที่ยื่นออกมาทั้งสองด้าน\nบล็อกหกเหลี่ยมที่วางได้นี้กั้นน้ำทั้งหมด ส่วนบล็อกอื่นวางได้เฉพาะจากด้านบนหรือด้านล่างเท่านั้น เหมือน Impermeable Floor ที่มีมาในตัว\nในสไตล์ท่อส่งน้ำ"
csCZ = "Žebrovaný kovový čtverec, který vyčnívá na obou stranách. \nUmístění hex bloku, veškerá voda, ostatní bloky pouze z vrchu/dolů, jako vestavěná nepropustná podlaha v akvaduktovém stylu."
viVN = "Hình vuông kim loại có gờ, nhô ra ở cả hai bên.\nKhối lục giác được đặt để chặn nước khỏi các khối khác, nước chỉ đi từ trên xuống dưới, như một mặt sàn không thấm nước tích hợp.\nTheo phong cách Aqueduct."
caES = "Quadrat de metall estriat que sobresurt pels dos costats.\nBloc hexagonal de col·locació que bloqueja tota l'aigua; els altres blocs només des de dalt o des de baix, com un Terra Impermeable integrat.\nA l'estil Aqüeducte."
beBY = "Рыфляваны металічны квадрат, які выступае з абодвух бакоў.\nРазмяшчэнне гексагональнага блока: блакуе ваду ўсімі бакамі; іншыя блокі — толькі зверху або знізу, як убудаваная непранікальная падлога.\nУ стылі акведука."
roRO = "Pătrat metalic cu nervuri, care iese în afară pe ambele laturi.\nPlasarea: blocul hexagonal blochează toată apa, iar celelalte blocuri doar de sus sau de jos, ca o podea impermeabilă încorporată.\nÎn stil de apeduct."
huHU = "Bordázott fémnégyzet, amely mindkét oldalán kiáll.\nElhelyezés: a hatszögletű blokk minden vizet megfog, a többi blokk csak felülről/alulról helyezhető el, mint a beépített Impermeable Floor.\nAkvadukt stílusban."
arSA = "مربع معدني مضلّع يبرز من الجانبين.\nكتلة سداسية للتركيب تحجب كل أنواع الماء، بينما تحجب الكتل الأخرى الماء من الأعلى والأسفل فقط، مثل أرضية مدمجة غير منفذة للماء.\nعلى طراز Aqueduct."

