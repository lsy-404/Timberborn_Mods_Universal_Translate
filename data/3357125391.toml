["Knatte.DE_RMDoubleInvSlopeW.Description"]
raw = "Ribbed Metal Square that sticks out on both sides. \nPlacment hex block all water other blocks only from top/bottom like a built in Impermeable Floor"
status = "abandoned"
enUS = "Ribbed metal square that extends on both sides. Placement hex block allows water, while other blocks are only accessible from top/bottom like a built-in impermeable floor."
zhCN = "不同形状的防洪堤，部分悬空，能完全阻断水流。"
zhTW = "兩側突出帶肋金屬方塊。放置六角塊的所有水，其他方塊僅從上/下方，如同內建的防水地板。"
ruRU = "Рифленый металлический квадрат, который выступает с обеих сторон. \nРазмещение гексагонального блока: вся вода, остальные блоки только сверху/снизу, как встроенный непроницаемый пол."
jaJP = "両側に突き出したリブ付き金属の四角。 \n配置されたヘックスブロックは、他のブロックからの水を上下からのみ受け入れる、まるで組み込みの不浸透床のように。"
frFR = "Carré en métal nervuré qui dépasse des deux côtés. Bloc hexagonal de placement, toute l'eau et les autres blocs seulement par le haut/bas comme un sol imperméable intégré."
deDE = "Rippierter Metallquadrat, der auf beiden Seiten hervorsteht. \nPlatzierung hexagonal Block, der Wasser von allen anderen Blöcken nur von oben/unten zulässt, wie ein eingebauter wasserdichter Boden."
plPL = "Pofalowany metalowy kwadrat, który wystaje po obu stronach. Blok heksagonalny, który pozwala na przepływ wody tylko z góry/dolny, jak wbudowana nieprzepuszczalna podłoga."
ptBR = "Quadro de metal estriado que se projeta de ambos os lados. \nBloco hexagonal de colocação, toda a água, outros blocos apenas de cima/embaixo, como um piso impermeável embutido."
koKR = "양쪽으로 튀어나온 홈이 있는 금속 정사각형입니다. 배치hex 블록은 모든 물 블록과 상단/하단에서만 작동하며, 내수성 바닥이 내장되어 있는 것처럼 작동합니다."
trTR = "Her iki tarafta dışarıda olan ribaneli metal kare. \nYerleştirme hex bloğu tüm su, diğer bloklar sadece üstten/alttan gibi entegre bir su geçirmez zemin."
esES = "Cuadrado de metal acanalado que sobresale por ambos lados.\nColocación: el bloque hexagonal bloquea todo el agua; los demás bloques solo desde arriba/abajo, como un suelo impermeable integrado."
itIT = "Quadrato in metallo scanalato che sporge su entrambi i lati.\nPosizionamento del blocco esagonale: blocca tutta l'acqua; gli altri blocchi solo dall'alto/dal basso, come un Pavimento Impermeabile integrato."
ukUA = "Рифлений металевий квадрат, що виступає з обох боків.\nРозміщення: блокує всю воду; інші блоки блокують воду лише зверху та знизу, як вбудована Непроникна підлога."
thTH = "แผ่นโลหะมีร่องรูปสี่เหลี่ยมที่ยื่นออกมาทั้งสองด้าน \nบล็อกหกเหลี่ยมที่วางได้จะกั้นน้ำทั้งหมด ส่วนบล็อกอื่นจะกั้นน้ำได้เฉพาะจากด้านบนและด้านล่างเท่านั้น เหมือนพื้นกันน้ำซึม (Impermeable Floor) ที่มาในตัว"
csCZ = "Žebrovaný kovový čtverec, který vyčnívá na obou stranách. \nUmístění hexagonové bloky veškerou vodu, ostatní bloky pouze z vrchu/spodu jako vestavěná nepropustná podlaha."
viVN = "Hình vuông kim loại có rãnh nhô ra ở cả hai bên.\nLắp đặt khối lục giác ngăn nước hoàn toàn; các khối khác chỉ từ trên xuống dưới, như một mặt sàn ngăn nước tích hợp."
caES = "Quadrat de metall acanalat que sobresurt pels dos costats.\nBloc hexagonal de col·locació que impedeix el pas de l'aigua per tots els altres blocs només des de dalt o des de baix, com un Terra impermeable integrat."
beBY = "Рыфлёны металічны квадрат, які выступае з абодвух бакоў.\nРазмяшчэнне: шасцігранны блок блакуе ваду, іншыя блокі — толькі зверху і знізу, як убудаваная непранікальная падлога."
roRO = "Pătrat de metal striat care iese în afară pe ambele laturi.\nBlocul hexagonal de plasare împiedică trecerea apei; celelalte blocuri se pot plasa doar pe partea de sus sau de jos, ca o Podea Impermeabilă încorporată."
huHU = "Bordázott fémnégyzet, amely mindkét oldalon kiáll.\nLerakáskor a hatszögletű blokk minden vizet blokkol, a többi blokk pedig csak felülről vagy alulról, mint a beépített Áthatolhatatlan padló."
arSA = "ساحة معدنية مضلّعة تبرز على الجانبين.\nتحدّد كتلة الوضع السداسية أن الماء لا يمر عبرها، وأن الكتل الأخرى تتصل بها من الأعلى أو الأسفل فقط، تماماً كأرضية غير منفذة مدمجة."

