["Knatte.DE_RMInvSlopeW.Description"]
raw = "Ribbed Metal Square that can stick out. \nPlacment hex block all water other blocks only from top/bottom like a built in Impermeable Floor"
status = "abandoned"
enUS = "Ribbed metal square that can protrude. Placement hex block allows water to flow in; other blocks can only interact from the top/bottom like a built-in impermeable floor."
zhCN = "不同形状的防洪堤，部分悬空，能完全阻断水流。"
zhTW = "可以突出顯示的橫紋金屬方塊。 \n放置的六邊形方塊可從上方/下方排水，其他方塊則類似於內建的不透水地板。"
ruRU = "Рифленый металлический квадрат, который может выступать. \nУстановка шестигранного блока со всей водой, другие блоки только сверху/снизу, как встроенный непроницаемый пол."
jaJP = "リブ付き金属製の四角形で突き出すことができます。 \n配置は六角ブロックで、すべての水は上/下からのみ入れられ、他のブロックはまるで内蔵の防水床のようです。"
frFR = "Carré en métal nervuré qui peut dépasser. Bloc hexagonal de placement, toute l'eau, les autres blocs uniquement par le haut/le bas comme un sol imperméable intégré."
deDE = "Rippiertes Metallquadrat, das herausragen kann. Platzierung des Sechsblocks, damit Wasser aus anderen Blöcken nur von oben/unten kommt, wie ein eingebauter impermeabler Boden."
plPL = "Rybko metalowe kwadrat, które może wystawać. Blok sześciokątny do umieszczenia, woda tylko z góry/dół, jak wbudowana nieprzepuszczalna podłoga."
ptBR = "Quadrado de Metal Estriado que pode se destacar.  \nBloco hexagonal de colocação impermeável, todos os outros blocos apenas de cima/embaixo, como um piso impermeável embutido."
koKR = "돌출될 수 있는 리브 메탈 사각형. \n위쪽/아래쪽에서만 다른 블록들이 놓여지는 수압 블록 배치, 내구성이 있는 바닥처럼"
trTR = "Çıkıntı yapabilen Ribbed Metal Kare. \nYerleştirme altıgen bloğu, suyu tüm diğer bloklardan yalnızca üstten/altan alır, entegre su geçirmez zemin gibi."
esES = "Cuadrado de metal acanalado que puede sobresalir.\nBloque hexagonal de colocación que bloquea todo el agua; los demás bloques solo desde arriba o abajo, como un suelo impermeable integrado."
itIT = "Quadrato di metallo a coste che può sporgere.\nBlocco esagonale di posizionamento che blocca tutta l'acqua; gli altri blocchi solo dall'alto/dal basso, come un Pavimento Impermeabile integrato."
ukUA = "Рифлений металевий квадрат, який може виступати. \nРозміщення: шестикутний блок блокує всю воду, а інші блоки лише зверху або знизу, як вбудована Непроникна підлога."
thTH = "บล็อกโลหะสี่เหลี่ยมมีร่องที่สามารถยื่นออกมาได้ \nการวาง: บล็อกหกเหลี่ยมกั้นน้ำทั้งหมด ส่วนบล็อกอื่นกั้นน้ำได้เฉพาะจากด้านบนและด้านล่าง เหมือนพื้นกันน้ำในตัว"
csCZ = "Žebrovaný kovový čtverec, který může vyčnívat. \nUmístění šestiúhelníkového bloku, veškerá voda, ostatní bloky pouze z horní/dolní strany, jako vestavěná nepropustná podlaha"
viVN = "Hình vuông kim loại có gờ có thể nhô ra.\nLắp đặt khối lục giác ngăn nước; các khối khác chỉ từ trên xuống dưới như một mặt sàn chắn nước tích hợp."
caES = "Quadrat de metall acanalat que pot sobresortir.\nBloc hexagonal de col·locació que bloqueja tota l'aigua; els altres blocs només des de dalt/baix, com un Terra impermeable integrat."
beBY = "Рыфлёны металічны квадрат, які можа выступаць.\nБлок шасцікутнага размяшчэння блакуе ваду з усіх бакоў; іншыя блокі — толькі зверху і знізу, як убудаваная Непранікальная падлога."
roRO = "Pătrat metalic cu nervuri care poate ieși în afară.\nBloc hexagonal de plasare care blochează toată apa; celelalte blocuri se pot plasa doar de sus/jos, ca o Podea Impermeabilă încorporată."
huHU = "Bordázatos fémnégyzet, amely kiállhat.\nLerakási hatszög-blokk, amely minden vizet megakadályoz; más blokkok csak felülről vagy alulról, mint a beépített Áthatolhatatlan padló."
arSA = "مربع معدني ذو أضلاع يمكن أن يبرز للخارج. \nعند الوضع، تحجب هذه الكتلة السداسية كل المياه، بينما تحجب الكتل الأخرى المياه من الأعلى والأسفل فقط، مثل الأرضية غير النافذة المدمجة."

