["LV.Pkg.PackagerFlavor"]
raw = "Born from necessity, perfected by neat freaks. Where there's clutter, there's a Bundler."
status = "normal"
enUS = "Born from necessity, perfected by neat freaks. Where there's clutter, there's a Bundler."
zhCN = "因需求而生，为整洁而精。杂乱所在处，必有打包机。"
zhTW = "源於需求，由愛整潔的人完善。雜亂之處，就有打包工具。"
ruRU = "Рожденный из необходимости, усовершенствованный фанатиками порядка. Где есть беспорядок, там и Бандлер."
jaJP = "必要から生まれ、きちん好きによって完成された。散らかりがあるところには、バンドラーがいる。"
frFR = "Né de la nécessité, perfectionné par des maniaques du rangement. Là où il y a du désordre, il y a un Bundler."
deDE = "Aus der Not geboren, von Ordnungsfanatikern perfektioniert. Wo Unordnung herrscht, ist ein Bundler nicht weit."
plPL = "Zrodzone z potrzeby, udoskonalone przez pedantów. Gdzie jest bałagan, tam jest Bundler."
ptBR = "Nascido da necessidade, aperfeiçoado por obsessivos por organização. Onde há desordem, há um Bundler."
koKR = "필요에서 태어나, 깔끔한 사람들에 의해 완성되었다. 어지럽혀진 곳에는 항상 번들러가 있다."
trTR = "Zorunluluktan doğmuş, titiz ruhlar tarafından mükemmelleştirilmiştir. Dağınıklığın olduğu yerde, bir Paketleyici vardır."
esES = "Nacido de la necesidad, perfeccionado por fanáticos del orden. Donde hay desorden, hay un empaquetador."
itIT = "Nato per necessità, perfezionato dai maniaci dell’ordine. Dove c’è disordine, c’è un Bundler."
ukUA = "Народжений із необхідності, доведений до досконалості фанатиками порядку. Де безлад, там і Пакувальник."
thTH = "ถือกำเนิดจากความจำเป็น และได้รับการขัดเกลาโดยพวกเจ้าระเบียบ ที่ไหนมีของรก ที่นั่นก็มีเครื่องมัดรวม"
csCZ = "Zrozen z nutnosti, zdokonalen pedanty. Kde je nepořádek, tam je Balíček."
viVN = "Sinh ra từ nhu cầu, được hoàn thiện bởi những kẻ nghiêm ngặt về sự ngăn nắp. Ở đâu có lộn xộn, ở đó có Bundler."
caES = "Nascut de la necessitat, perfeccionat pels maniàtics de l’ordre. Allà on hi ha desordre, hi ha un empaquetador."
beBY = "Узнік з неабходнасці, удасканалены педантамі. Дзе беспарадак, там і ўпакоўшчык."
roRO = "Născut din necesitate, perfecționat de obsedații de ordine. Unde-i dezordine, e un Ambalator."
huHU = "A szükség szülte, a rendmániások tökéletesítették. Ahol rendetlenség van, ott Bundler is van."
arSA = "وُلد من رحم الضرورة، وأتقنه مهووسو الترتيب. حيثما وُجدت الفوضى، وُجد المُجمِّع."

