["LV.TAT.DefaultWaterSourceStrengthDesc"]
raw = "The default water source strength when placing water sources in the Map Editor. This applies to both fresh and bad water sources."
status = "normal"
enUS = "The default water source strength when placing water sources in the Map Editor. This applies to both fresh and contaminated water sources."
zhCN = "在地图编辑器中放置水源时的默认水力大小，适用于水源石和恶水源。"
zhTW = "在地圖編輯器中放置水源時的預設水源強度。這適用於新鮮水源和劣質水源。"
ruRU = "Стандартная сила источника воды при размещении водных источников в Редакторе карт. Это относится как к пресным, так и к загрязнённым источникам воды."
jaJP = "マップエディタで水源を配置する際のデフォルトの水源の強さ。これは淡水と汚水の両方の水源に適用されます。"
frFR = "La force par défaut des sources d'eau lors de la placement des sources d'eau dans l'Éditeur de Carte. Cela s'applique aux sources d'eau douce et polluée."
deDE = "Die Standardstärke der Wasserquelle beim Platzieren von Wasserquellen im Karteneditor. Dies gilt sowohl für frische als auch für schlechte Wasserquellen."
plPL = "Domyślna siła źródła wody przy umieszczaniu źródeł wody w edytorze map. Dotyczy to zarówno świeżych, jak i złych źródeł wody."
ptBR = "A força da fonte de água padrão ao posicionar fontes de água no Editor de Mapas. Isso se aplica tanto a fontes de água potável quanto a fontes de água contaminada."
koKR = "지도 편집기에 물 공급원을 배치할 때의 기본 물 공급원 강도입니다. 이는 신선한 물과 오염된 물 공급원 모두에 적용됩니다."
trTR = "Harita Düzenleyicisinde su kaynakları yerleştirildiğinde varsayılan su kaynağı gücü. Bu hem tatlı hem de kirli su kaynakları için geçerlidir."
