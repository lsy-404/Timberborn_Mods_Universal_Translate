["LV.TAT.GameToMapDesc"]
raw = "Allow using your normal game to be saved into maps. The buttons will show up on the top-left corner when you play the game. You can also upload that map to Steam Workshop. NOT in Map Editor."
status = "normal"
enUS = "Allow saving your normal game into maps. The buttons will appear in the top-left corner while you play the game. You can also upload that map to the Steam Workshop. NOT in Map Editor."
zhCN = "勾选后，游玩时会在左上角显示相关按钮，可以将正常游戏保存为带有建筑的地图，其他玩家游玩此地图时无需安装此模组。<br>注意，保存的地图不适用于地图编辑器。"
zhTW = "允許將您正常的遊戲儲存到地圖中。當您玩遊戲時，按鈕將顯示在左上角。您也可以將該地圖上傳到 Steam 工作坊。不是在地圖編輯器中。"
ruRU = "Позвольте сохранять вашу обычную игру в карты. Кнопки появятся в верхнем левом углу, когда вы будете играть в игру. Вы также можете загрузить эту карту в Steam Workshop. НЕ в редакторе карт."
jaJP = "ゲームを通常の状態で保存してマップにすることを許可します。ゲームをプレイしていると、左上隅にボタンが表示されます。そのマップをSteamワークショップにアップロードすることもできます。マップエディターではありません。"
frFR = "Permettez d'utiliser votre jeu normal pour être sauvegardé dans des cartes. Les boutons apparaîtront dans le coin supérieur gauche lorsque vous jouez au jeu. Vous pouvez également télécharger cette carte sur Steam Workshop. PAS dans l'éditeur de cartes."
deDE = "Erlaube es, dein normales Spiel in Karten zu speichern. Die Tasten erscheinen oben links, während du das Spiel spielst. Du kannst diese Karte auch im Steam Workshop hochladen. NICHT im Karten-Editor."
plPL = "Pozwól na zapisanie swojej normalnej gry do map. Przyciski pojawią się w lewym górnym rogu, gdy będziesz grać. Możesz również przesłać tę mapę do Steam Workshop. NIE w Edytorze Map."
ptBR = "Permita salvar seu jogo normal em mapas. Os botões aparecerão no canto superior esquerdo quando você jogar o jogo. Você também pode enviar esse mapa para o Steam Workshop. NÃO no Editor de Mapas."
koKR = "게임을 맵으로 저장할 수 있도록 허용합니다. 게임을 플레이할 때 좌측 상단에 버튼이 표시됩니다. 해당 맵을 Steam Workshop에 업로드할 수도 있습니다. 맵 편집기에서는 사용할 수 없습니다."
trTR = "Normal oyunuzu haritalara kaydetmenize izin verin. Oyun oynarken butonlar sol üst köşede görünecek. Bu haritayı Steam Workshop'a da yükleyebilirsiniz. Harita editöründe değil."
esES = "Permitir guardar la partida normal en mapas. Los botones aparecerán en la esquina superior izquierda cuando juegues. También puedes subir ese mapa al Taller de Steam. NO en el Editor de mapas."
itIT = "Consenti di salvare la partita normale come mappa. I pulsanti compariranno nell'angolo in alto a sinistra quando giochi. Puoi anche caricare quella mappa nel Workshop di Steam. NON nell'Editor di mappe."
ukUA = "Дозволити збереження звичайної гри як карти. Кнопки з'являтимуться у верхньому лівому куті під час гри. Цю карту також можна завантажити до Steam Workshop. НЕ у редакторі карт."
thTH = "อนุญาตให้บันทึกเกมปกติของคุณลงในแผนที่ได้ ปุ่มจะปรากฏที่มุมบนซ้ายเมื่อคุณเล่นเกม คุณยังสามารถอัปโหลดแผนที่นั้นไปยัง Steam Workshop ได้ ไม่รองรับในตัวแก้ไขแผนที่"
csCZ = "Povolit ukládání vaší normální hry do map. Tlačítka se objeví v levém horním rohu, když hrajete hru. Tuto mapu můžete také nahrát do Steam Workshopu. NE v editoru map."
viVN = "Cho phép lưu trò chơi bình thường của bạn vào các bản đồ. Các nút sẽ hiển thị ở góc trên bên trái khi bạn chơi trò chơi. Bạn cũng có thể tải bản đồ đó lên Steam Workshop. Không có trong Trình chỉnh sửa bản đồ."
caES = "Permet desar la partida normal com a mapa. Els botons apareixeran a la cantonada superior esquerra quan jugues. També pots pujar aquest mapa al Taller de Steam. NO a l'Editor de mapes."
beBY = "Дазваляе захаваць вашу звычайную гульню ў выглядзе карт. Кнопкі з'явяцца ў верхнім левым куце, калі вы гуляеце. Гэтую карту таксама можна загрузіць у Steam Workshop. НЕ ў рэдактары карт."
roRO = "Permite salvarea jocului normal în hărți. Butoanele vor apărea în colțul din stânga sus când joci. De asemenea, poți încărca harta în Steam Workshop. NU în Editorul de hărți."
huHU = "Lehetővé teszi, hogy a normál játékmenet közben mentett állapotot térképekbe mentsd. A gombok a játék során a bal felső sarokban jelennek meg. Ezt a térképet a Steam Workshopba is feltöltheted. NEM a Térképszerkesztőben."
arSA = "السماح بحفظ لعبتك العادية كخريطة. ستظهر الأزرار في الزاوية العلوية اليسرى عند اللعب. يمكنك أيضًا رفع هذه الخريطة إلى ورشة عمل Steam. ليس في محرر الخرائط."

