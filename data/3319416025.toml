["Building.TimHortons.Description"]
raw = "Where beavers gather to enjoy freshly made Timberbits"
status = "normal"
enUS = "Where beavers gather to enjoy freshly made Timberbits"
zhCN = "制作各种新式甜点。"
zhTW = "海狸們聚集在一起享受剛製作好的木塊點心。"
ruRU = "Где бобры собираются, чтобы насладиться свежеприготовленными Timberbits"
jaJP = "ビーバーが新鮮なティンバー ビッツを楽しむために集まる場所"
frFR = "Où les castors se rassemblent pour déguster des Timberbits fraîchement préparés."
deDE = "Wo Biber sich versammeln, um frisch zubereitete Timberbits zu genießen."
plPL = "Gdzie bobry zbierają się, aby cieszyć się świeżo przygotowanymi Timberbits"
ptBR = "Onde os castores se reúnem para desfrutar de Timberbits recém-feitos."
koKR = "비버들이 갓 만든 팀버비트를 즐기기 위해 모이는 곳"
trTR = "Kunduzların taze yapılmış Timberbits'in tadını çıkarmak için toplandığı yer"
esES = "Donde los castores se reúnen para disfrutar de Timberbits recién hechos"
itIT = "Dove i castori si radunano per gustare Timberbits appena preparati"
ukUA = "Там, де бобри збираються, щоб насолодитися свіжозробленими Timberbits"
thTH = "ที่ที่บีเวอร์มารวมตัวเพื่อเพลิดเพลินกับทิมเบอร์บิตส์ที่เพิ่งทำใหม่ๆ"
csCZ = "Kde se bobři scházejí, aby si vychutnali čerstvé Timberbits"
viVN = "Nơi những chú hải ly tụ tập để thưởng thức Timberbits vừa làm ra"
caES = "On el lloc on els castors es reuneixen per gaudir de Timberbits acabats de preparar"
beBY = "Там, дзе бобры збіраюцца, каб насалодзіцца свежымі Timberbits"
roRO = "Unde castorii se adună pentru a savura Timberbits proaspăt preparate"
huHU = "Ahol a bobrok összegyűlnek, hogy élvezzék a frissen készült Timberbiteket"
arSA = "حيث يتجمع القنادس للاستمتاع بـ Timberbits الطازجة المحضّرة لتوّها"

["Building.TimHortons.FlavorDescription"]
raw = "\"If you ain't munching Timberbits, are you even a beaver?\" —Ma' Ngonel"
status = "normal"
enUS = "\"If you aren't munching Timberbits, are you even a beaver?\" —Ma' Ngonel"
zhCN = "不吃甜趣球，不是好海狸！"
zhTW = "「如果你不在吃 Timberbits，你還算是海狸嗎？」—馬·恩戈內爾"
ruRU = "\"Если ты не ешь Timberbits, ты вообще бобр?\" —Ма' Нгонел"
jaJP = "「ティンバービッツを食べていないなら、あなたは本当にビーバーなの？」 —マ・ンゴネル"
frFR = "\"Si tu ne croques pas des Timberbits, es-tu même un castor ?\" —Ma' Ngonel"
deDE = "„Wenn du keine Timberbits knabberst, bist du dann überhaupt ein Biber?“ —Ma' Ngonel"
plPL = "\"Jeśli nie chrupiesz Timberbits, to czy naprawdę jesteś bobrem?\" —Ma' Ngonel"
ptBR = "\"Se você não está comendo Timberbits, você realmente é um castor?\" —Ma' Ngonel"
koKR = "\"티머빗을 먹지 않으면, 너는 심지어 비버도 아닌 건가?\" —마' 응곤엘"
trTR = "\"Eğer Timberbits yemiyorsan, gerçekten bir kunduz musun?\" —Ma' Ngonel"
esES = "\"¿Si no estás masticando Timberbits, eres siquiera un castor?\" —Ma' Ngonel"
itIT = "\"Se non stai sgranocchiando Timberbits, sei davvero un castoro?\" —Ma' Ngonel"
ukUA = "\"Якщо ти не наминаєш Timberbits, то ти взагалі бобер?\" —Ма' Нгонел"
thTH = "\"ถ้าไม่ได้แทะทิมเบอร์บิตส์ แล้วจะเป็นบีเวอร์ได้ยังไงกัน?\" —แม่งอนีล"
csCZ = "\"Pokud nežvýkáte Timberbits, jste vůbec bobr?\" —Ma' Ngonel"
viVN = "\"Nếu mày không ăn Timberbits, mày có phải là một con hải ly không?\" —Ma' Ngonel"
caES = "«Si no estàs mastegant Timberbits, ets ni tan sols un castor?» —Ma' Ngonel"
beBY = "«Калі ты не грызеш Timberbits, ты наогул бабёр?» — Ма' Нгонел"
roRO = "„Dacă nu mănânci Timberbits, mai ești măcar castor?\" —Ma' Ngonel"
huHU = "„Ha nem rágcsálsz Timberbitset, akkor igazán hód vagy?\" —Ma' Ngonel"
arSA = "\"إذا لم تكن تقضم Timberbits، فهل أنت حتى قندس؟\" —ما نغونيل"
