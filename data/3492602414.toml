["GreedyEmbers.description"]
raw = "These emberpelts were so greedy for fun, they learned to love water and joined a split in the GreedyBuilders...who promptly changed their name to GreedyEmbers :D"
status = "normal"
enUS = "These emberpelts were so greedy for fun, they learned to love water and joined a split in the GreedyBuilders...who promptly changed their name to GreedyEmbers :D"
zhCN = "在参观了示范区后，火绒认为应该加入这项合作计划，兼容并济、全面发展。<br>火绒种族学习了亲族们的科技，与神尾、铁牙一起，尝试更加和谐的发展道路。<br>座右铭：<i>水与火的交融艺术。</i>"
zhTW = "這些渴望樂趣的火焰毛皮對水的熱愛使他們加入了貪婪建造者的一個分支……他們隨即更名為貪婪火焰 :D"
ruRU = "Эти искрящиеся шкурки были так жадны до веселья, что научились любить воду и объединились в группу ЖадныхСтроителей... которые быстро изменили своё название на ЖадныеИскры :D"
jaJP = "このエンバーペルトたちは楽しみを渇望しすぎて、水を愛することを学び、貪欲な建設者たちの仲間になりました...彼らはすぐに名前を貪欲なエンバーズに変更しました :D"
frFR = "Ces fourrures d'ember étaient tellement avares de plaisir qu'elles ont appris à aimer l'eau et ont rejoint une faction des GreedyBuilders... qui ont rapidement changé leur nom en GreedyEmbers :D"
deDE = "Diese Glutpelze waren so gierig nach Spaß, dass sie gelernt haben, Wasser zu lieben und sich einer Spaltung bei den GierigenBauern anschlossen... die prompt ihren Namen in GierigeGluten änderten :D"
plPL = "Te ogniste futra były tak chciwe zabawy, że nauczyły się kochać wodę i dołączyły do podziału w ChciwychBudowniczych... którzy natychmiast zmienili swoją nazwę na ChciweOgnie :D"
ptBR = "Essas peles de brasa eram tão gananciosas por diversão que aprenderam a amar a água e se juntaram a uma divisão dos Construtores Gananciosos... que prontamente mudaram seu nome para Brases Gananciosas :D"
koKR = "이 에머펠트들은 재미를 위해 너무나 탐욕스러워서 물을 사랑하는 법을 배웠고, 그리디 빌더스의 분파에 합류하게 되었습니다... 그들은 즉시 이름을 그리디 엠버스(GreedyEmbers)로 바꿨습니다 :D"
trTR = "Bu ateş postları o kadar eğlenceye açtı ki, suyu sevmeyi öğrendiler ve GreedyBuilders'ta bir bölünmeye katıldılar... hemen isimlerini GreedyEmbers olarak değiştirdiler :D"
esES = "Estos emberpelts estaban tan ansiosos por divertirse que aprendieron a amar el agua y se unieron a una escisión de los GreedyBuilders... que de inmediato cambió su nombre a GreedyEmbers :D"
itIT = "Questi emberpelli erano così avidi di divertimento che hanno imparato ad amare l'acqua e si sono uniti a una scissione dei GreedyBuilders... che subito hanno cambiato nome in GreedyEmbers :D"
ukUA = "Ці емберпелти були такими охочими до розваг, що навчилися любити воду й приєдналися до розколу в GreedyBuilders... які миттєво перейменувалися на GreedyEmbers :D"
thTH = "พวก Emberpelts เหล่านี้โลภความสนุกมากจนเรียนรู้ที่จะรักน้ำ แล้วก็ไปเข้าร่วมกับกลุ่มที่แยกตัวออกมาจาก GreedyBuilders... ซึ่งพวกเขาก็รีบเปลี่ยนชื่อเป็น GreedyEmbers :D"
csCZ = "Tito ohniví kožešináci byli tak dychtiví po zábavě, že se naučili milovat vodu a připojili se k rodu v GreedyBuilders... kteří ihned změnili své jméno na GreedyEmbers :D"
viVN = "Những emberpelts này tham lam quá mức để vui chơi, họ học cách thích nước và gia nhập một phe trong GreedyBuilders... và ngay sau đó đổi tên thành GreedyEmbers :D"
caES = "Aquests emberpelts eren tan ansiosos de diversió que van aprendre a estimar l'aigua i es van unir a una escissió dels GreedyBuilders... que de seguida van canviar el seu nom a GreedyEmbers :D"
beBY = "Гэтыя вугальныя бабры были настолькі ненасытныя да весялосці, што palюбілі ваду і далучыліся да раскольніцкай групы GreedyBuilders... якая неадкладна змяніла сваю назву на GreedyEmbers :D"
roRO = "Acești blănoși de jar erau atât de lacomi după distracție, încât au învățat să iubească apa și s-au alăturat unei scindări din GreedyBuilders... care și-a schimbat imediat numele în GreedyEmbers :D"
huHU = "Ezek a parázsbundások annyira mohón vágytak a szórakozásra, hogy megszerették a vizet, és csatlakoztak a GreedyBuilders egyik szakadárcsoportjához… akik azonnal GreedyEmbers-re nevezték át magukat :D"
arSA = "هؤلاء الـ\"إمبرباتس\" كانوا جشعين للمرح إلى درجة أنهم تعلّموا حب الماء وانضمّوا إلى انشقاق في GreedyBuilders... الذين غيّروا اسمهم فورًا إلى GreedyEmbers :D"

