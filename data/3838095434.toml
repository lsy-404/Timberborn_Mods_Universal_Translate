["MadreBobry.HomesNearWork.Tooltip"]
status = "normal"
raw = "A free slot in a home goes to the beaver working closest to it. Once per game hour (daytime) working beavers move to free slots closer to work or swap homes if that shortens the home-to-work distance by at least 8 tiles."
enUS = "A free slot in a home goes to the beaver working closest to it. Once per game hour (daytime), working beavers move to free slots closer to work or swap homes if that shortens the home-to-work distance by at least 8 tiles."
zhCN = "空闲的住所床位会分配给离它最近的工作海狸。每个游戏小时（白天）内，工作中的海狸会搬到离工作地点更近的空闲床位，或者如果交换住所能使住所到工作地点的距离至少缩短8格，也会交换住所。"
zhTW = "空閒的住所床位會分配給離它最近的工作中海狸。每個遊戲小時（白天）時，工作中的海狸會移動到較接近工作地點的空閒床位，或交換住所，前提是這樣能使住所到工作地點的距離至少縮短 8 格。"
ruRU = "Свободное место в доме достаётся бобру, который работает ближе всего к нему. Раз в игровой час (днём) работающие бобры переходят на свободные места, которые ближе к их работе, или меняются домами, если это сокращает расстояние от дома до работы как минимум на 8 клеток."
jaJP = "空いている住居の枠は、そこから最も近い場所で働くビーバーに割り当てられます。ゲーム内の1時間ごと（日中）に、働いているビーバーは、仕事場により近い空きの枠へ移動するか、住居を入れ替えることで住居から仕事場までの距離を少なくとも8タイル短縮できる場合にそれを行います。"
frFR = "Une place libre dans un foyer revient au castor qui travaille le plus près de celui-ci. Une fois par heure de jeu (en journée), les castors au travail changent pour une place libre plus proche de leur lieu de travail, ou échangent de foyer si cela réduit la distance foyer-travail d'au moins 8 cases."
deDE = "Ein freier Platz in einem Zuhause wird dem Biber zugewiesen, der am nächsten bei seiner Arbeit ist. Einmal pro Spielstunde (tagsüber) ziehen arbeitende Biber in freie Plätze, die näher an ihrer Arbeit liegen, oder tauschen ihr Zuhause, wenn dadurch die Strecke von Zuhause zur Arbeit um mindestens 8 Kacheln verkürzt wird."
plPL = "Wolne miejsce w domu przypada bobrowi, który pracuje najbliżej niego. Raz na godzinę gry (w ciągu dnia) bobry pracujące przenoszą się na wolne miejsca bliżej pracy lub zamieniają się domami, jeśli dzięki temu odległość od domu do pracy skróci się co najmniej o 8 kafelków."
ptBR = "Uma vaga livre em um lar é destinada ao castor que trabalha mais perto dele. Uma vez por hora de jogo (durante o dia), os castores que trabalham se mudam para vagas livres mais próximas do trabalho ou trocam de lar se isso reduzir a distância entre lar e trabalho em pelo menos 8 blocos."
koKR = "빈 집 자리는 가장 가까운 곳에서 일하는 비버에게 배정됩니다. 게임 시간 1시간마다(낮 시간에만) 일하는 비버들은, 집에서 직장까지의 거리가 최소 8타일 이상 줄어든다면 더 가까운 빈 자리로 이사하거나 집을 맞바꿉니다."
trTR = "Boş bir ev yuvası, kendisine en yakın çalışan bobra verilir. Her oyun saatinde (gündüz), çalışan bobralar, iş yerine daha yakın boş yuvalara taşınır veya ev-iş mesafesini en az 8 kare kısaltacaksa evlerini değiştirir."
esES = "Una plaza libre en un hogar se asigna al bobro que trabaja más cerca de él. Una vez por hora de juego (de día), los bobros que trabajan se trasladan a plazas libres más cercanas a su lugar de trabajo o intercambian hogares si eso reduce la distancia entre hogar y trabajo en al menos 8 casillas."
itIT = "Un posto libero in una casa va al castoro che lavora più vicino ad essa. Una volta per ora di gioco (di giorno), i castori al lavoro si spostano verso posti liberi più vicini al lavoro oppure scambiano le case, se questo riduce la distanza casa-lavoro di almeno 8 riquadri."
ukUA = "Вільне місце в житлі отримує бобер, який працює найближче до нього. Раз на ігрову годину (у денний час) бобри, що працюють, переходять до вільних місць ближче до роботи або міняються житлом, якщо це скорочує відстань від житла до роботи щонайменше на 8 клітинок."
thTH = "ช่องว่างที่ว่างในบ้านจะจัดให้บีเวอร์ที่ทำงานอยู่ใกล้บ้านที่สุด ทุกหนึ่งชั่วโมงในเกม (ช่วงกลางวัน) บีเวอร์ที่ทำงานอยู่จะย้ายไปยังช่องว่างที่ใกล้ที่ทำงานมากขึ้น หรือสลับบ้านกัน หากการทำเช่นนั้นทำให้ระยะจากบ้านถึงที่ทำงานสั้นลงอย่างน้อย 8 ช่อง"
csCZ = "Volný slot v domově připadne bobrovi, který pracuje nejblíže k němu. Jednou za herní hodinu (ve dne) se pracující bobři přesunou do volných slotů blíže k práci nebo si vymění domovy, pokud se tím vzdálenost mezi domovem a prací zkrátí alespoň o 8 dlaždic."
viVN = "Chỗ trống trong nhà sẽ được giao cho chú hải ly làm việc gần nhà nhất. Mỗi giờ trong game (ban ngày), các hải ly đang làm việc sẽ chuyển sang chỗ trống gần nơi làm việc hơn, hoặc đổi nhà với nhau nếu cách này rút ngắn khoảng cách từ nhà đến nơi làm việc ít nhất 8 ô."
caES = "Un espai lliure en una casa va al castor que treballa més a prop d'ella. Una vegada per hora de joc (durant el dia), els castors que treballen es mouen a espais lliures més a prop de la feina o intercanvien cases si això redueix la distància entre casa i feina en almenys 8 caselles."
beBY = "Вольнае месца ў доме дастаецца бобру, які працуе бліжэй за ўсіх да яго. Раз на гадзіну гульнявога часу (у дзённы час) бабры, якія працуюць, пераходзяць на вольныя месцы бліжэй да працы або мяняюцца дамамі, калі гэта скарачае адлегласць ад дома да працы як мінімум на 8 клетак."
roRO = "Un loc liber dintr-o casă revine bobrului care lucrează cel mai aproape de ea. O dată pe oră de joc (ziua), bobrii care lucrează se mută în locurile libere mai apropiate de locul de muncă sau își schimbă casele dacă aceasta scurtează distanța dintre casă și locul de muncă cu cel puțin 8 plăci."
huHU = "A szabad hely egy lakóházban annak a bobornak jut, aki a legközelebb dolgozik hozzá. Játéknaponként egyszer (nappal) a dolgozó bobrok átköltöznek olyan szabad helyekre, amelyek közelebb vannak a munkahelyükhöz, vagy házat cserélnek, ha ezzel a lakóház és a munkahely közötti távolság legalább 8 csempével csökken."
arSA = "لا يُمنح الفرد الحر في المنزل إلا للبنّاء الذي يعمل الأقرب إليه. مرةً واحدة في كل ساعة من ساعات اللعبة (في النهار)، ينتقل البنّاء العامل إلى مواضع شاغرة أقرب إلى مكان عمله، أو يتبادل المنازل إذا كان ذلك يقلّل المسافة بين المنزل ومكان العمل بمقدار 8 بلاطات على الأقل."

