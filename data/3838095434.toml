["MadreBobry.NearestWork.Tooltip"]
status = "normal"
raw = "Builders pick the construction site, demolition and recovered stack closest to themselves instead of the oldest one on the list. Construction priorities work as before."
enUS = "Builders pick the construction site, demolition and recovered stack closest to themselves instead of the oldest one on the list. Construction priorities work as before."
zhCN = "建造者会优先选择离自己最近的建造工地、拆除任务和回收堆，而不是列表中最早的那一个。建造优先级的运作方式与以前相同。"
zhTW = "建造者會選擇離自己最近的建造工地、拆除工地與回收堆，而不是清單中最早的一項。建造優先順序的運作方式與以前相同。"
ruRU = "Строители выбирают строительную площадку, снос и найденную стопку ресурсов, ближайшие к себе, а не самые старые в списке. Приоритеты строительства работают как прежде."
jaJP = "ビルダーは、リストの中で最も古いものではなく、自分に最も近い建設現場、解体作業、回収済みの山を選択します。建設の優先度は従来どおりに機能します。"
frFR = "Les bâtisseurs choisissent le chantier de construction, la démolition et la pile récupérée les plus proches d'eux, au lieu de la plus ancienne de la liste. Les priorités de construction fonctionnent comme auparavant."
deDE = "Bauarbeiter wählen die Baustelle, den Abriss und den geborgenen Stapel, die ihnen am nächsten liegen, statt den ältesten auf der Liste. Bauprioritäten funktionieren wie zuvor."
plPL = "Budowniczowie wybierają plac budowy, rozbiórkę i zebrany stos najbliżej siebie, zamiast najstarszego na liście. Priorytety budowy działają jak dotychczas."
ptBR = "Os construtores escolhem o local de construção, a demolição e a pilha recuperada mais próximos deles, em vez da mais antiga da lista. As prioridades de construção funcionam como antes."
koKR = "건설자는 목록에서 가장 오래된 작업 대신, 자신과 가장 가까운 건설 현장, 철거 대상, 회수 더미를 선택합니다. 건설 우선순위는 이전과 동일하게 적용됩니다."
trTR = "Yapımcılar, listedeki en eski işi değil, kendilerine en yakın inşaat alanını, yıkım işini ve toplanacak yığını seçer. İnşaat öncelikleri eskisi gibi çalışır."
esES = "Los constructores eligen el sitio de construcción, la demolición y la pila recuperada más cercanos a sí mismos en lugar de la más antigua de la lista. Las prioridades de construcción funcionan como antes."
itIT = "I costruttori scelgono il cantiere, la demolizione e la pila di materiali recuperati più vicini a sé, invece di quella più vecchia nell'elenco. Le priorità di costruzione funzionano come prima."
ukUA = "Будівельники обирають ділянку для будівництва, знесення та зібраний запас, найближчі до себе, а не найстаріші в списку. Пріоритети будівництва працюють, як і раніше."
thTH = "ผู้สร้างจะเลือกจุดก่อสร้าง งานรื้อถอน และกองทรัพยากรที่กู้คืนมาซึ่งอยู่ใกล้ตัวพวกมันที่สุด แทนที่จะเลือกอันที่เก่าที่สุดในรายการ ลำดับความสำคัญของการก่อสร้างยังทำงานเหมือนเดิม"
csCZ = "Stavitelé vybírají staveniště, demolici a shromážděnou hromadu nejblíže k sobě, namísto té nejstarší v seznamu. Priority stavby fungují jako dříve."
viVN = "Thợ xây sẽ chọn công trường xây dựng, công trình phá dỡ và đống tài nguyên thu hồi gần chúng nhất thay vì mục cũ nhất trong danh sách. Thứ tự ưu tiên xây dựng vẫn hoạt động như trước."
caES = "Els constructors trien el lloc de construcció, de demolició i la pila recuperada més propers a ells mateixos, en lloc del més antic de la llista. Les prioritats de construcció funcionen com abans."
beBY = "Будаўнікі выбіраюць месца будаўніцтва, зносу і сабранага запасу, найбліжэйшыя да сябе, а не самы стары ў спісе. Прыярытэты будаўніцтва працуюць, як і раней."
roRO = "Constructorii aleg șantierul de construcție, demolarea și grămada recuperată cea mai apropiată de ei, în loc de cea mai veche din listă. Prioritățile de construcție funcționează ca înainte."
huHU = "A építők a listán a legrégebbi helyett a hozzájuk legközelebbi építkezési helyet, bontást és összegyűjtött készletet választják. Az építési prioritások a korábbiak szerint működnek."
arSA = "يختار البنّاؤون موقع البناء وكومة الهدم والكومة المستردة الأقرب إليهم، بدلاً من الأقدم في القائمة. وتعمل أولويات البناء كما كانت من قبل."

