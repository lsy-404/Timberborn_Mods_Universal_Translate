["MadreBobry.IdleHaulersHelp.Tooltip"]
status = "normal"
raw = "A hauler with no haul job carries materials to construction sites and moves recovered stacks to storage instead of waiting at the hauling post. Haulers don't build."
enUS = "A hauler with no haul job carries materials to construction sites and moves recovered stacks to storage instead of waiting at the hauling post. Haulers don't build."
zhCN = "没有搬运任务的搬运工会把材料运到建筑工地，并把回收的堆叠物运往仓库，而不是在搬运站等待。搬运工不会参与建造。"
zhTW = "沒有搬運工作的搬運工會把材料運送到建造工地，並把回收的堆疊移至倉庫，而不是在搬運站待命。搬運工不負責建造。"
ruRU = "Переносчик без задания на перенос доставляет материалы на строительные площадки и перемещает собранные стопки на склад вместо того, чтобы ждать на посту переноски. Переносчики не строят."
jaJP = "運搬作業のない運搬係は、建設現場へ資材を運び、回収した積み荷を倉庫へ移します。運搬係は建設はしません。"
frFR = "Un transporteur sans tâche de transport achemine les matériaux vers les chantiers de construction et déplace les piles récupérées vers le entrepôt au lieu d'attendre au poste de transport. Les transporteurs ne construisent pas."
deDE = "Ein Transporteur ohne Transportauftrag bringt Materialien zu Baustellen und schafft geborgene Stapel ins Lager, anstatt am Transportposten zu warten. Transporteure bauen nicht."
plPL = "Transportujący bez zlecenia przewozu zanosi materiały na place budowy i przenosi odzyskane stosy do magazynów, zamiast czekać przy punkcie transportu. Transportujące nie budują."
ptBR = "Um transportador sem tarefa de transporte leva materiais para canteiros de obras e move pilhas recolhidas para o armazenamento, em vez de esperar no posto de transporte. Transportadores não constroem."
koKR = "짐꾼이 할당된 운반 작업이 없을 때는 운반 장소에서 기다리는 대신 건설 현장에 자재를 나르고, 회수한 더미를 창고로 옮깁니다. 짐꾼은 건설하지 않습니다."
trTR = "Bir nakliye işi olmayan bir nakliyeci, malzemeleri inşaat alanlarına taşır ve toplanan yığınları nakliye noktasında beklemek yerine depoya götürür. Nakliyeciler inşaat yapmaz."
esES = "Un acarreador sin trabajo de acarreo lleva materiales a las obras de construcción y traslada las pilas recuperadas al almacén en lugar de esperar en el puesto de acarreo. Los acarreadores no construyen."
itIT = "Un trasportatore senza incarichi di trasporto porta materiali ai cantieri e sposta le pile recuperate nei magazzini, invece di aspettare presso il posto di trasporto. I trasportatori non costruiscono."
ukUA = "Вантажник без вантажних завдань переносить матеріали на будівельні майданчики та відносить зібрані стоси на склад замість того, щоб чекати на пості вантажників. Вантажники не будують."
