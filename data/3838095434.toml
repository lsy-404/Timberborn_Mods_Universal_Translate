["MadreBobry.HaulDistanceWeight.Tooltip"]
status = "normal"
raw = "A haul job at a building 60 or more tiles away from the hauler loses this many percentage points of urgency (proportionally less when closer). 0 = vanilla, only urgency counts. Haul priority always wins."
enUS = "A haul job at a building 60 or more tiles away from the hauler loses this many percentage points of urgency (proportionally less when closer). 0 = vanilla, only urgency counts. Haul priority always wins."
zhCN = "在距离搬运工60格或更远的建筑上，搬运任务的紧迫度会降低此处设定的百分点（距离越近，降低幅度按比例越小）。0 = 原版设定，仅计算紧迫度。搬运优先级始终优先。"
zhTW = "運送工作的建築物若距離搬運工60格或以上，會降低此數值的緊急度百分點（距離越近，降低越少）。0 = 原版，僅計算緊急度。運送優先度始終優先。"
ruRU = "Работа по перевозке к зданию, расположенному в 60 или более клетках от перевозчика, теряет столько процентных пунктов срочности (при меньшем расстоянии — пропорционально меньше). 0 = как в оригинале, учитывается только срочность. Приоритет перевозки всегда важнее."
jaJP = "60マス以上離れた場所にいる運搬者への運搬作業は、緊急度がこの値の分だけパーセンテージポイント減少します（近いほど減少量は比例して小さくなります）。0 = バニラ（緊急度のみで判断）。運搬の優先度は常に優先されます。"
frFR = "Un travail de transport vers un bâtiment situé à 60 cases ou plus du transporteur perd ce nombre de points de pourcentage d'urgence (proportionnellement moins lorsqu'il est plus proche). 0 = comportement d'origine, seule l'urgence compte. La priorité de transport l'emporte toujours."
deDE = "Ein Transportauftrag bei einem Gebäude, das 60 oder mehr Felder vom Transporteur entfernt liegt, verliert so viele Prozentpunkte Dringlichkeit (bei geringerer Entfernung proportional weniger). 0 = Vanilla, nur die Dringlichkeit zählt. Transportpriorität gewinnt immer."
plPL = "Zadanie transportowe do budynku oddalonego o 60 lub więcej kafelków od transportera traci tyle punktów procentowych pilności, ile wynosi ta wartość (proporcjonalnie mniej, gdy budynek jest bliżej). 0 = wersja podstawowa, liczy się wyłącznie pilność. Priorytet transportu zawsze wygrywa."
ptBR = "A tarefa de transporte em um edifício a 60 ou mais blocos de distância do transportador perde este número de pontos percentuais de urgência (proporcionalmente menos quando está mais perto). 0 = padrão do jogo, somente a urgência conta. A prioridade de transporte sempre prevalece."
koKR = "60타일 이상 떨어진 건물로 향하는 운반 작업은 운반자로부터의 거리에 따라 긴급도가 이 값만큼 퍼센트 포인트 감소합니다(가까울수록 감소량이 비례하여 줄어듭니다). 0 = 바닐라 방식으로, 긴급도만 적용됩니다. 운반 우선순위는 항상 우선합니다."
trTR = "60 veya daha fazla karo uzaklıktaki bir bina için taşıma işi, taşıyıcıya olan mesafeye bağlı olarak bu kadar yüzde puan aciliyet kaybeder (yakın olduğunda orantılı olarak daha az). 0 = oyun varsayılanı, yalnızca aciliyet dikkate alınır. Taşıma önceliği her zaman önce gelir."
esES = "A un trabajo de acarreo en un edificio situado a 60 o más casillas del acarreador se le resta esta cantidad de puntos porcentuales de urgencia (proporcionalmente menos cuanto más cerca esté). 0 = vanilla, solo cuenta la urgencia. La prioridad de acarreo siempre gana."
itIT = "A un lavoro di trasporto (haul) verso un edificio distante 60 o più tile dal trasportatore viene sottratto questo numero di punti percentuali di urgenza (in misura proporzionalmente minore quando è più vicino). 0 = comportamento originale, conta solo l'urgenza. La priorità di trasporto prevale sempre."
ukUA = "Вантаж, що доставляється до будівлі на відстані 60 або більше плиток від переносника, втрачає стільки відсоткових пунктів терміновості (пропорційно менше, якщо ближче). 0 = ванілька поведінка, враховується лише терміновість. Пріоритет доставки завжди має перевагу."
thTH = "งานขนส่งที่อาคารอยู่ห่างจากผู้ขนส่ง 60 ช่องขึ้นไปจะลดค่าความเร่งด่วนลงเท่ากับจำนวนเปอร์เซ็นต์ที่กำหนดนี้ (หากอยู่ใกล้กว่านั้นจะลดลงน้อยตามสัดส่วน) 0 = ค่าเริ่มต้นของเกม โดยพิจารณาเฉพาะค่าความเร่งด่วนเท่านั้น ลำดับความสำคัญของการขนส่งจะมาก่อนเสมอ"
csCZ = "Úloha přepravy k budově vzdálené 60 nebo více dlaždic od přepravce ztrácí tolik procentních bodů naléhavosti (při menší vzdálenosti úměrně méně). 0 = výchozí chování, počítá se pouze naléhavost. Priorita přepravy má vždy přednost."
viVN = "Một tác vụ vận chuyển tại công trình cách người vận chuyển từ 60 ô trở lên sẽ bị giảm mức khẩn cấp đi số điểm phần trăm này (cách càng gần thì giảm càng ít theo tỷ lệ). 0 = mặc định của trò chơi, chỉ tính mức khẩn cấp. Ưu tiên vận chuyển luôn được ưu tiên hơn."
caES = "A una tasca de transport a un edifici situat a 60 o més caselles del transportista es resta aquest nombre de punts percentuals d'urgència (proporcionalment menys quan està més a prop). 0 = vanilla, només compta l'urgència. La prioritat de transport sempre preval."
beBY = "Заданне на перанос у будынак, які знаходзіцца на адлегласці 60 або больш клетак ад носьбіта, губіць столькі працэнтных пунктаў тэрміновасці (чым бліжэй, тым менш). 0 = ванільная гульня, улічваецца толькі тэрміновасць. Прыярытэт пераносу заўсёды перамагае."
roRO = "Un job de transport la o clădire aflată la 60 sau mai multe plăci de distanță de cărăuș pierde această cantitate de puncte procentuale din urgență (proporțional mai puțin când este mai aproape). 0 = vanilla, doar urgența contează. Prioritatea transportului are întotdeauna prioritate."
huHU = "A 60 vagy több csempe távolságra lévő épülethez tartozó szállítási feladat ennyi százalékpontnyi sürgősséget veszít (közelebb arányosan kevesebbet). 0 = vanilla, csak a sürgősség számít. A szállítási prioritás mindig nyer."
arSA = "لكل مهمة نقل تتعلق بمبنى يقع على بُعد 60 بلاطة أو أكثر من الناقل، تُخفَّض أولويتها الإلحاحية بهذا العدد من النقاط المئوية (وتقل الخسارة تناسبياً كلما كان المبنى أقرب). 0 = الإعداد الأصلي، حيث تُحتسب الإلحاحية وحدها. أولوية النقل تتغلب دائماً."

