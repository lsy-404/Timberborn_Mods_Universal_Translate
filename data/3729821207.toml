beBY = "Прапанова з'яўляецца ў наяўнасці: забеспячэнне павінна перавышаць прагназаваны попыт на гэту мяжу, перш чым будынак узнавіць працу. Прадухіляе міганне на мяжы максімальнага забеспячэння."
