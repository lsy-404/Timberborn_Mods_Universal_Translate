deDE = "Nachdem der Koordinator dieses Gebäude pausiert hat, muss es mindestens so lange warten, bevor es für die Wiederaufnahme in Betracht gezogen wird. Glättet wackelige Gitter."
plPL = "Po wstrzymaniu budynku przez koordynatora musi on odczekać przynajmniej tak długo, zanim zostanie uznany za gotowy do wznowienia. Wygładza niestabilne siatki."
ptBR = "Depois que o coordenador pausa este edifício, ele deve esperar pelo menos este tempo antes de ser considerado para retomar. Suaviza grades instáveis."
koKR = "조정자가 이 건물을 일시중지한 후 재개 대상으로 간주되기까지 최소 이 시간만큼 기다려야 합니다. 흔들리는 그리드가 부드러워집니다."
trTR = "Koordinatör bu binayı duraklattıktan sonra yeniden başlatılmak için değerlendirilmeden önce en az bu kadar beklemesi gerekmektedir. Dengesiz ızgaraları düzeltir."
esES = "Después de que el coordinador pausa este edificio, debe esperar al menos este tiempo antes de considerar reanudarlo. Suaviza las redes eléctricas inestables."
itIT = "Dopo che il coordinatore ha messo in pausa questo edificio, deve attendere almeno questo tempo prima di essere preso in considerazione per la ripresa. Riduce le oscillazioni delle reti."
ukUA = "Після того як координатор призупиняє цю будівлю, вона має чекати щонайменше stільки часу, перш ніж її знову можна буде розглянути для відновлення. Це згладжує коливання в мережах."
thTH = "หลังจากผู้ประสานงานหยุดอาคารนี้ อาคารต้องรออย่างน้อยเท่านี้ก่อนจะได้รับการพิจารณาให้กลับมาทำงานอีกครั้ง ช่วยทำให้กริดที่ผันผวนมีเสถียรภาพขึ้น"
csCZ = "Po pozastavení této budovy koordinátorem musí čekat alespoň tak dlouho, než bude znovu zvažována k obnovení. Zmenšuje chvění mřížek."
viVN = "Sau khi điều phối viên tạm dừng tòa nhà này, nó phải chờ ít nhất khoảng thời gian này trước khi được xem xét để tiếp tục. Làm mượt các lưới không ổn định."
caES = "Després que el coordinador aturi aquest edifici, ha d'esperar almenys aquest temps abans de ser considerat per a la represa. Suavitza les xarxes inestables."
beBY = "Пасля таго, як каардынатар прыпыніць гэты будынак, яму трэба пачакаць не менш за гэты час, перш чым ён будзе разгледжаны для ўзнаўлення. Згладжвае няроўныя сеткі."
roRO = "După ce coordonatorul oprește această clădire, aceasta trebuie să aștepte cel puțin atât de mult înainte de a fi luată în considerare pentru reluare. Netezește rețelele instabile."
huHU = "Miután a koordinátor szüneteltette ezt az épületet, legalább ennyi ideig kell várnia, mielőtt újraindítás céljából ismét figyelembe vennék. Csillapítja az ingadozó hálózatokat."
arSA = "بعد أن يوقف المنسّق هذا المبنى، يجب أن ينتظر مدة لا تقل عن هذه المدة قبل النظر في استئنافه. يساعد على تهدئة الشبكات المتذبذبة."
