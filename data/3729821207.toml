["SmartProductionControl.PauseDelay.Tooltip.Delay"]
raw = "Pause is delayed by this duration after the condition first triggers. Resume is immediate. Resolution ~0.5 s."
status = "normal"
enUS = "Pause is delayed by this duration after the condition first triggers. Resume is immediate. Resolution ~0.5 s."
zhCN = "“在条件首次触发后，暂停将延迟此持续时间。恢复为即时。分辨率约为0.5秒。”"
zhTW = "“當條件首次觸發後，暫停會延遲這段時間。恢復是立即的。解析度約為 0.5 秒。”"
ruRU = "Пауза задерживается на это время после первого срабатывания условия. Возобновление происходит немедленно. Разрешение ~0,5 с."
jaJP = "「この条件が最初にトリガーされた後、ポーズはこの期間だけ遅延します。再開は即時です。解像度は約0.5秒です。」"
frFR = "La pause est retardée d'une durée de cette durée après que la condition se déclenche pour la première fois. La reprise est immédiate. Résolution ~0,5 s."
deDE = "Die Pause wird um diese Dauer verzögert, nachdem die Bedingung erstmals ausgelöst wurde. Die Fortsetzung erfolgt sofort. Auflösung ~0,5 s."
plPL = "Opóźnienie wstrzymania wynosi ten czas po pierwszym spełnieniu warunku. Wznawianie jest natychmiastowe. Rozdzielczość ~0,5 s."
ptBR = "A pausa é atrasada por esta duração após a condição ser acionada pela primeira vez. A retomada é imediata. Resolução ~0,5 s."
koKR = "조건이 처음 발생한 후 이 시간 동안 일시 정지가 지연됩니다. 재개는 즉시 발생합니다. 해결 시간 ~0.5초."
trTR = "Duraklatma, koşul ilk tetiklendiğinde bu süre kadar gecikir. Yeniden başlama anidir. Çözünürlük ~0.5 s."
esES = "Pausar se retrasa esta duración después de que la condición se active por primera vez. Reanudar es inmediato. Resolución ~0,5 s."
itIT = "La pausa è ritardata di questa durata dopo che la condizione si attiva per la prima volta. La ripresa è immediata. Risoluzione ~0,5 s."
ukUA = "Пауза наступає з затримкою, що дорівнює цій тривалості, після першого спрацьовування умови. Відновлення відбувається миттєво. Роздільна здатність ~0.5 с."
thTH = "Pause จะล่าช้าไปตามระยะเวลานี้หลังจากเงื่อนไขทำงานครั้งแรก ส่วน Resume ทำงานทันที ความละเอียด ~0.5 s"
csCZ = "Pauza je zpožděna o tuto dobu po prvním vyvolání podmínky. Obnovení je okamžité. Rozlišení ~0,5 s."
viVN = "Thời gian tạm dừng bị trì hoãn trong khoảng thời gian này sau khi điều kiện lần đầu tiên được kích hoạt. Tiếp tục ngay lập tức. Thời gian ~0.5 giây."
caES = "La pausa es retarda aquesta durada després que la condició s'activi per primera vegada. La represa és immediata. Resolució ~0,5 s."
beBY = "Прыпынак затрымліваецца на гэты інтэрвал пасля таго, як умова ўпершыню спрацуе. Узнаўленне адбываецца імгненна. Дазвол ~0.5 с."
roRO = "Pauza este amânată cu această durată după ce condiția se declanșează prima dată. Reluarea este imediată. Rezoluție ~0,5 s."
huHU = "A szüneteltetés késleltetése a feltétel első kiváltódása után ezzel az időtartammal történik. A folytatás azonnali. Felbontás ~0,5 s."
arSA = "يتأخر الإيقاف المؤقت بهذه المدة بعد أن يُفعَّل الشرط للمرة الأولى. أما الاستئناف فيتم فورًا. الدقة ~0.5 ثانية."

