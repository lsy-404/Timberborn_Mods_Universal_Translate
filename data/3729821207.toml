ruRU = "Минимальная скорость заполнения входа (запасы района / мощность). Рецепты с несколькими ингредиентами могут выбрать, приостанавливать ли процесс, как только один товар окажется ниже этой нормы (Любой) или только когда все окажутся ниже (Все)."
jaJP = "最小入力充填率（地区の在庫 / 容量）。複数の材料を必要とするレシピでは、1つの材料がこのレートを下回った時点で一時停止するか（いずれか）、すべての材料がこのレートを下回った時点で一時停止するか（すべて）を選択できます。"
frFR = "Taux de remplissage d'entrée minimum (stock de district / capacité). Les recettes avec plusieurs ingrédients peuvent choisir s'il faut faire une pause dès qu'un produit est en dessous de ce taux (Tout) ou seulement lorsque tous le sont (Tous)."
deDE = "Minimale Eingabefüllrate (Lagerbestand / Kapazität des Bezirks). Rezepte mit mehreren Zutaten können wählen, ob sie pausieren, sobald ein Gut unter diesen Wert fällt (Alle) oder erst wenn alle unter diesem Wert liegen (Alle)."
plPL = "Minimalna wartość napełnienia wejściowego (zapasy okręgu / pojemność). Przepisy z kilkoma składnikami mogą wybrać, czy wstrzymać pracę, gdy jedno dobro spadnie poniżej tej wartości (Jakiekolwiek), czy dopiero gdy wszystkie będą poniżej (Wszystkie)."
ptBR = "Taxa mínima de preenchimento de entrada (estoque do distrito / capacidade). Receitas com vários ingredientes podem escolher se pausam assim que um bom ficar abaixo dessa taxa (Qualquer) ou somente quando todos estiverem abaixo (Todos)."
koKR = "최소 입력 채움 비율 (구역 재고 / 용량). 여러 재료가 있는 레시피는 하나의 품목이 이 비율 이하로 떨어질 때 즉시 일시 중지할지 (모두) 아니면 모든 품목이 이 비율 이하로 떨어질 때까지 기다릴지를 선택할 수 있습니다."
trTR = "Minimum girdi dolum oranı (bölge stoğu / kapasite). Birden fazla bileşen içeren tarifler, bir malzeme bu oranın altına düştüğünde hemen duraklatılıp duraklatılmayacağını (Herhangi) veya tüm malzemeler bu oranın altına düştüğünde mi duraklatılacağını (Hepsi) seçebilir."
esES = "Tasa mínima de llenado de entrada (existencias del distrito / capacidad). Las recetas con varios ingredientes pueden elegir si pausar en cuanto un bien esté por debajo de esta tasa (Cualquiera) o solo cuando todos estén por debajo (Todos)."
itIT = "Tasso minimo di riempimento degli input (scorta del distretto / capacità). Le ricette con più ingredienti possono scegliere se fermarsi non appena un bene scende sotto questo tasso (Qualsiasi) oppure solo quando tutti scendono sotto di esso (Tutti)."
ukUA = "Мінімальний рівень наповнення входу (запаси округу / місткість). Рецепти з кількома інгредієнтами можуть вибрати, чи призупиняти виробництво, щойно один ресурс опиниться нижче цього рівня (Будь-який), чи лише тоді, коли всі ресурси будуть нижче (Усі)."
thTH = "อัตราการเติมวัตถุดิบขั้นต่ำ (สต็อกของเขต / ความจุ) สูตรที่ต้องใช้วัตถุดิบหลายชนิดสามารถเลือกได้ว่าจะหยุดทันทีเมื่อวัตถุดิบใดชนิดหนึ่งต่ำกว่าอัตรานี้ (ใดก็ได้) หรือจะหยุดเฉพาะเมื่อวัตถุดิบทุกชนิดต่ำกว่าอัตรานี้ (ทั้งหมด)"
csCZ = "Minimální rychlost plnění vstupu (sklad/dostupnost okresu). Recepty s několika ingrediencemi si mohou vybrat, zda se pozastaví, jakmile je jedno zboží pod touto rychlostí (Jakékoliv) nebo pouze když jsou všechna pod (Všechna)."
viVN = "Tốc độ điền đầu vào tối thiểu (hàng tồn kho khu phố / sức chứa). Các công thức với nhiều nguyên liệu có thể chọn tạm dừng ngay khi một hàng hóa thấp hơn tốc độ này (Bất kỳ) hoặc chỉ khi tất cả đều thấp hơn (Tất cả)."
caES = "Taxa mínima d'omplert d'entrada (estoc del districte / capacitat). Les receptes amb diversos ingredients poden triar si es pausen tan bon punt un bé està per sota d'aquesta taxa (Qualsevol) o només quan tots estan per sota (Tots)."
beBY = "Мінімальны ўзровень запаўнення ўваходу (запас раёна / ёмістасць). Рэцэпты з некалькімі інгрэдыентамі могуць выбіраць, ці прыпыняцца, калі адзін тавар ніжэй за гэты ўзровень (Any), ці толькі калі ўсе тавары ніжэй за яго (All)."
roRO = "Rata minimă de umplere a intrărilor (stocul districtului / capacitate). Rețetele cu mai mulți ingredienți pot alege dacă să se oprească imediat ce un bun este sub această rată (Oricare) sau doar atunci când toate sunt sub ea (Toate)."
huHU = "Minimális bemeneti feltöltési arány (körzeti készlet / kapacitás). Több összetevős receptek eldönthetik, hogy szünetelnek-e már akkor, amikor egy árú az arány alá esik (Bármely), vagy csak akkor, amikor mindegyik az arány alá esik (Mind)."
arSA = "الحد الأدنى لمعدل تعبئة المدخلات (مخزون المنطقة / السعة). يمكن للوصفات التي تحتوي على عدة مكونات أن تختار ما إذا كانت ستتوقف عند انخفاض أي مورد واحد عن هذا المعدل (أي)، أو فقط عندما ينخفض جميع الموارد عنه (الكل)."

