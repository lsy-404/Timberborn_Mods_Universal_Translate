thTH = "ทางอุโมงค์ที่มีรางท่อแต่ไม่มีการค้ำยันพื้นดิน\n● <RedHighlight>คำเตือน!</RedHighlight> อาจทำให้พื้นดินหรืออาคารที่ไม่มีการค้ำยันพังถล่มได้ โปรดใช้ด้วยความระมัดระวัง"
csCZ = "tunel s tubovou trasou, ale bez podpory ze země. ● <RedHighlight>Upozornění!</RedHighlight> Může způsobit zřícení nepodporovaného terénu nebo budov. Používejte opatrně."
viVN = "Một đường hầm có đường ống nhưng không có hỗ trợ mặt đất.  \n● <RedHighlight>Cảnh báo!</RedHighlight> Có thể gây sập các khu vực hoặc công trình không được hỗ trợ. Sử dụng cẩn thận."
caES = "Un túnel amb una via de tub però sense suport al terreny.\n● <RedHighlight>Atenció!</RedHighlight> Pot causar el col·lapse del terreny o dels edificis sense suport. Useu-lo amb cura."
beBY = "Тунэль з тубавэем, але без апоры на грунт.\n● <RedHighlight>Увага!</RedHighlight> Можа выклікаць абвал незакрепленага грунту або пабудоў. Carefully: ужывайце з асцярожнасцю."
roRO = "Un tunel cu tubulatură, dar fără suport pentru teren.\n● <RedHighlight>Atenție!</RedHighlight> Poate provoca prăbușirea terenului sau a clădirilor nesusținute. Folosiți-l cu grijă."
huHU = "A tubeway-os, de talajtámasz nélküli alagút.\n● <RedHighlight>Figyelem!</RedHighlight> Támasz nélküli talaj vagy épületek beomlását okozhatja. Óvatosan használja."
arSA = "نفق مع ممر أنبوبي دون دعم أرضي.\n● <RedHighlight>تحذير!</RedHighlight> قد يتسبب في انهيار الأرض أو المباني غير المدعومة. استخدمه بحذر."
