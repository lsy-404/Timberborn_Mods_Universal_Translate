[_meta]
name = "More Mines, More Tunnels"

["Building.PathPlatformTunnel.Description"]
raw = "Tunnel through terrain, replacing it with mine timbers and a Path. Use the layer tool to see under terrain or structures."
status = "normal"
enUS = "Tunnel through terrain, replacing it with mine timbers and a Path. Use the layer tool to see under terrain or structures."
zhCN = "穿过地形的隧道，用矿木和路径替换它。使用层级工具查看地下地形或结构。"
zhTW = "在地形中挖掘隧道，用礦材和小徑替代。使用層級工具查看地形或結構下方。"
ruRU = "Пронесите тоннель через местность, заменив её шахтными брусами и путём. Используйте инструмент слоя, чтобы увидеть под местностью или структурами."
jaJP = "地形をトンネルで貫通し、鉱山の木材と道で置き換えます。レイヤーツールを使用して地形や構造物の下を確認してください。"
frFR = "Tunnel à travers le terrain, le remplaçant par des bois de mine et un chemin. Utilisez l'outil couche pour voir sous le terrain ou les structures."
deDE = "Tunneln Sie durch das Terrain und ersetzen Sie es durch Minenholz und einen Weg. Verwenden Sie das Ebenenwerkzeug, um unter Terrain oder Strukturen zu sehen."
plPL = "Przeprowadzaj tunel przez teren, zastępując go drewnami kopalnianymi i ścieżką. Użyj narzędzia warstwy, aby zobaczyć pod terenem lub strukturami."
ptBR = "Tunnel através do terreno, substituindo-o por madeiras de mina e um Caminho. Use a ferramenta de camada para ver sob o terreno ou estruturas."
koKR = "지형을 관통하는 터널을 만들어 광산 나무와 길로 대체합니다. 레이어 도구를 사용하여 지형이나 구조물 아래를 확인하세요."
trTR = "Zemin boyunca tünel açın, bunu maden kütükleri ve bir Yol ile değiştirin. Zemin veya yapılar altındaki bölgeyi görmek için katman aracını kullanın."
esES = "Excave a través del terreno, reemplazándolo con vigas de mina y un sendero. Use la herramienta de capas para ver debajo del terreno o de las estructuras."
itIT = "Scava gallerie attraverso il terreno, sostituendolo con travi da miniera e un Sentiero. Usa lo strumento livelli per vedere sotto il terreno o le strutture."
ukUA = "Прокопуйте тунелі крізь ґрунт, замінюючи його шахтними кріпленнями та стежкою. Використовуйте інструмент шарів, щоб бачити під ґрунтом або спорудами."
thTH = "เจาะผ่านพื้นดิน โดยแทนที่ด้วยค้ำยันเหมืองและเส้นทางเดิน ใช้เครื่องมือเลเยอร์เพื่อดูด้านล่างพื้นดินหรือสิ่งปลูกสร้าง"
csCZ = "Tunelujte terénem, nahraďte ho dřevěnými prvky z dolu a cestou. Použijte nástroj pro vrstvy, abyste viděli pod terénem nebo strukturami."
viVN = "Đường hầm xuyên qua địa hình, thay thế nó bằng gỗ mỏ và một Con đường. Sử dụng công cụ lớp để nhìn thấy bên dưới địa hình hoặc công trình."
caES = "Excaveu el terreny, substituint-lo per fustes de mina i un camí. Useu l'eina de capes per veure sota el terreny o les estructures."
beBY = "Пракопвайце праз рэльеф, замяняючы яго крэплёнымі брусамі шахты і сцежкай. Выкарыстоўвайце інструмент слаёў, каб бачыць пад рэльефам або пабудовамі."
roRO = "Săpați prin teren, înlocuindu-l cu buștenii de sprijin ale minei și o cale. Folosiți instrumentul de straturi pentru a vedea sub teren sau sub structuri."
huHU = "Alagútépítés a terepen át, a talajt bányatámasztékkal és ösvénnyel helyettesítve. A talaj vagy szerkezetek alá látáshoz használd a rétegeszközt."
arSA = "حفر نفق عبر التضاريس، مع استبدالها بدعائم خشبية للمناجم وممر. استخدم أداة الطبقات لرؤية ما تحت التضاريس أو المنشآت."

