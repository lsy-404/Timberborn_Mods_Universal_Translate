enUS = "<RedHighlight>Pause and save first. This writes a new save, and this session will likely crash if you keep playing.</RedHighlight>"
zhCN = "<RedHighlight>请先暂停并保存。这会创建一个新的存档；如果继续游玩，当前会话很可能会崩溃。</RedHighlight>"
zhTW = "<RedHighlight>請先暫停並儲存。這會建立一個新的存檔，若繼續遊玩，此遊戲工作階段很可能會崩潰。</RedHighlight>"
ruRU = "<RedHighlight>Сначала приостановите игру и сохранитесь. Будет создано новое сохранение, и если продолжить играть, эта сессия, вероятно, завершится сбоем.</RedHighlight>"
jaJP = "<RedHighlight>まず一時停止してセーブしてください。新しいセーブデータが作成され、このままプレイを続けると、このセッションはクラッシュする可能性があります。</RedHighlight>"
frFR = "<RedHighlight>Faites d’abord une pause et sauvegardez. Cela crée une nouvelle sauvegarde, et cette session risque de planter si vous continuez à y jouer.</RedHighlight>"
deDE = "<RedHighlight>Pausiere und speichere zuerst. Dadurch wird ein neuer Spielstand erstellt, und wenn du weiterspielst, stürzt diese Sitzung wahrscheinlich ab.</RedHighlight>"
plPL = "<RedHighlight>Najpierw wstrzymaj grę i zapisz ją. Spowoduje to utworzenie nowego zapisu, a dalsza gra w tej sesji prawdopodobnie zakończy się awarią.</RedHighlight>"
ptBR = "<RedHighlight>Pause e salve primeiro. Isso criará um novo salvamento, e esta sessão provavelmente vai travar se você continuar jogando.</RedHighlight>"
koKR = "<RedHighlight>먼저 일시 정지하고 저장하세요. 새 저장 파일이 생성되며, 계속 플레이하면 이 세션이 충돌할 가능성이 높습니다.</RedHighlight>"
csCZ = "<RedHighlight>Nejprve hru pozastavte a uložte. Tím se vytvoří nová uložená pozice a pokud budete pokračovat ve hře, tato herní relace pravděpodobně spadne.</RedHighlight>"
viVN = "<RedHighlight>Tạm dừng và lưu trước. Thao tác này sẽ tạo một bản lưu mới, và phiên chơi này có thể sẽ gặp sự cố nếu bạn tiếp tục chơi.</RedHighlight>"
trTR = "<RedHighlight>Önce duraklatıp kaydedin. Bu işlem yeni bir kayıt oluşturur ve oynamaya devam ederseniz bu oturum muhtemelen çökecektir.</RedHighlight>"

["LV.MTr.GameDisclaimer"]
status = "normal"
raw = "<RedHighlight>Beavers and buildings are moved. Some operations besides basic resize may make objects behave strangely and there is no guarantee.</RedHighlight>"
enUS = "<RedHighlight>Beavers and buildings are moved. Some operations beyond basic resizing may cause objects to behave strangely, and there is no guarantee.</RedHighlight>"
zhCN = "<RedHighlight>海狸和建筑会被移动。除了基本的调整大小之外，某些操作可能会导致物体表现异常，且无法保证结果。</RedHighlight>"
zhTW = "<RedHighlight>海狸和建築物已移動。除了基本的調整大小之外，某些操作可能會導致物件行為異常，且無法保證一切正常。</RedHighlight>"
ruRU = "<RedHighlight>Бобры и здания перемещаются. Некоторые операции, помимо простого изменения размера, могут привести к странному поведению объектов, и никаких гарантий нет.</RedHighlight>"
jaJP = "<RedHighlight>ビーバーと建物が移動します。基本的なサイズ変更以外の操作を行うと、オブジェクトが予期しない動作をすることがあります。動作は保証されません。</RedHighlight>"
frFR = "<RedHighlight>Les castors et les bâtiments sont déplacés. Certaines opérations autres qu’un simple redimensionnement peuvent entraîner un comportement étrange des objets, sans garantie.</RedHighlight>"
deDE = "<RedHighlight>Biber und Gebäude werden verschoben. Einige Aktionen außer der einfachen Größenänderung können dazu führen, dass sich Objekte seltsam verhalten. Es gibt keine Garantie.</RedHighlight>"
plPL = "<RedHighlight>Bobra i budynki można przenosić. Niektóre operacje, poza podstawową zmianą rozmiaru, mogą powodować dziwne zachowanie obiektów i nie ma żadnej gwarancji.</RedHighlight>"
ptBR = "<RedHighlight>Castores e edifícios são movidos. Algumas operações além do redimensionamento básico podem fazer os objetos se comportarem de forma estranha, e não há garantia.</RedHighlight>"
koKR = "<RedHighlight>비버와 건물이 이동됩니다. 기본 크기 조정 외의 일부 작업은 물체가 이상하게 작동하게 할 수 있으며, 이를 보장할 수 없습니다.</RedHighlight>"
csCZ = "<RedHighlight>Bobři a budovy se přesouvají. Některé operace kromě základní změny velikosti mohou způsobit podivné chování objektů a jejich správné fungování není zaručeno.</RedHighlight>"
viVN = "<RedHighlight>Hải ly và các công trình sẽ được di chuyển. Một số thao tác ngoài việc thay đổi kích thước cơ bản có thể khiến các vật thể hoạt động bất thường và không được đảm bảo.</RedHighlight>"
trTR = "<RedHighlight>Kunduzlar ve binalar taşınır. Temel boyut değiştirme dışındaki bazı işlemler nesnelerin garip davranmasına neden olabilir ve hiçbir garanti verilmez.</RedHighlight>"

