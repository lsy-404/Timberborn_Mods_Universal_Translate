["LV.MTr.SaveWarning"]
raw = "<RedHighlight>Pause and save first. This writes a new save and this session will likely crash if you keep playing it.</RedHighlight>"
status = "normal"
enUS = "<RedHighlight>Pause and save first. This writes a new save, and this session will likely crash if you keep playing.</RedHighlight>"
zhCN = "<RedHighlight>请先暂停并保存。这会创建一个新的存档；如果继续使用当前会话，游戏很可能会崩溃。</RedHighlight>"
zhTW = "<RedHighlight>請先暫停並儲存。這會建立一個新的存檔；如果繼續遊玩，這個工作階段很可能會崩潰。</RedHighlight>"
ruRU = "<RedHighlight>Сначала приостановите игру и сохранитесь. Будет создано новое сохранение, и если продолжить играть, этот сеанс, скорее всего, завершится сбоем.</RedHighlight>"
jaJP = "<RedHighlight>まず一時停止してセーブしてください。新しいセーブデータが作成され、このままプレイを続けるとこのセッションはクラッシュする可能性があります。</RedHighlight>"
frFR = "<RedHighlight>Mettez le jeu en pause et sauvegardez d’abord. Cela crée une nouvelle sauvegarde, et cette session risque de planter si vous continuez à jouer.</RedHighlight>"
deDE = "<RedHighlight>Pausiere und speichere zuerst. Dadurch wird ein neuer Spielstand erstellt, und diese Sitzung stürzt wahrscheinlich ab, wenn du weiterspielst.</RedHighlight>"
plPL = "<RedHighlight>Najpierw wstrzymaj grę i zapisz ją. Spowoduje to utworzenie nowego zapisu, a dalsza gra w tej sesji prawdopodobnie doprowadzi do awarii.</RedHighlight>"
ptBR = "<RedHighlight>Pare e salve primeiro. Isso criará um novo arquivo de salvamento, e esta sessão provavelmente vai travar se você continuar jogando.</RedHighlight>"
koKR = "<RedHighlight>먼저 일시 정지하고 저장하세요. 새 저장 파일이 생성되며, 계속 플레이하면 이 세션이 충돌할 가능성이 높습니다.</RedHighlight>"
csCZ = "<RedHighlight>Nejprve hru pozastavte a uložte. Tím se vytvoří nová uložená pozice a pokud budete pokračovat ve hře, tato herní relace pravděpodobně spadne.</RedHighlight>"
viVN = "<RedHighlight>Trước tiên hãy tạm dừng và lưu trò chơi. Thao tác này sẽ tạo một bản lưu mới, và phiên chơi này có thể sẽ gặp sự cố nếu bạn tiếp tục chơi.</RedHighlight>"
trTR = "<RedHighlight>Önce oyunu duraklatıp kaydedin. Bu işlem yeni bir kayıt oluşturur; oynamaya devam ederseniz bu oturum büyük olasılıkla çökecektir.</RedHighlight>"

["LV.MTr.GameDisclaimer"]
raw = "<RedHighlight>Beavers and buildings are moved. Some operations besides basic resize may make objects behave strangely and there is no guarantee.</RedHighlight>"
status = "normal"
enUS = "<RedHighlight>Beavers and buildings are moved. Some operations beyond basic resizing may make objects behave strangely, and there is no guarantee.</RedHighlight>"
zhCN = "<RedHighlight>海狸和建筑物会被移动。除基本调整大小外，某些操作可能会导致对象行为异常，且不作任何保证。</RedHighlight>"
zhTW = "<RedHighlight>海狸和建築物都會被移動。除了基本調整大小以外，某些操作可能會導致物件行為異常，且不保證一切正常。</RedHighlight>"
ruRU = "<RedHighlight>Бобры и здания перемещаются. Некоторые действия, помимо обычного изменения размера, могут привести к неправильной работе объектов. Гарантий нет.</RedHighlight>"
jaJP = "<RedHighlight>ビーバーと建物が移動します。基本的なサイズ変更以外の操作を行うと、オブジェクトが予期しない動作をする場合があり、保証はありません。</RedHighlight>"
frFR = "<RedHighlight>Les castors et les bâtiments sont déplacés. Certaines opérations autres qu'un simple redimensionnement peuvent entraîner un comportement étrange des objets, sans aucune garantie.</RedHighlight>"
deDE = "<RedHighlight>Biber und Gebäude werden verschoben. Einige Vorgänge über die einfache Größenänderung hinaus können dazu führen, dass sich Objekte ungewöhnlich verhalten. Es gibt keine Garantie.</RedHighlight>"
plPL = "<RedHighlight>Bobry i budynki są przenoszone. Niektóre operacje inne niż podstawowa zmiana rozmiaru mogą powodować dziwne zachowanie obiektów i nie ma żadnej gwarancji.</RedHighlight>"
ptBR = "<RedHighlight>Castores e edifícios são movidos. Algumas operações além do redimensionamento básico podem fazer os objetos se comportarem de maneira estranha, e não há garantia.</RedHighlight>"
koKR = "<RedHighlight>비버와 건물이 이동됩니다. 기본 크기 조정 외의 일부 작업은 오브젝트가 이상하게 작동하게 만들 수 있으며, 이를 보장할 수 없습니다.</RedHighlight>"
csCZ = "<RedHighlight>Bobři a budovy se přesouvají. Některé operace kromě základní změny velikosti mohou způsobit, že se objekty budou chovat podivně, a nic není zaručeno.</RedHighlight>"
viVN = "<RedHighlight>Hải ly và công trình sẽ được di chuyển. Một số thao tác ngoài việc thay đổi kích thước cơ bản có thể khiến các đối tượng hoạt động bất thường và không được đảm bảo.</RedHighlight>"
trTR = "<RedHighlight>Kunduzlar ve binalar taşınır. Temel boyutlandırma dışında bazı işlemler nesnelerin tuhaf davranmasına yol açabilir ve hiçbir garanti verilmez.</RedHighlight>"

