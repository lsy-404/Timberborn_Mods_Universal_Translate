["LV.CI.VerticalSpreadCostMultiplierDesc"]
raw = "The cost multiplier for upward spread. Game default: 6, meaning it generally costs 6 times more to spread water up."
status = "normal"
enUS = "The cost multiplier for upward spread. Game default: 6, meaning it generally costs 6 times more to spread water upward."
zhCN = "可以更改灌溉向上传播的代价倍数（游戏默认：6，即灌溉距离向上传播1格等于水平传播6格）。<br>注意，向下传播不受此倍数影响。"
zhTW = "向上擴散的成本倍數。遊戲預設：6，這意味著向上擴散水的成本通常是原來的6倍。"
ruRU = "Множитель стоимости для верхнего распространения. По умолчанию в игре: 6, что означает, что в целом стоимость распространения воды вверх в 6 раз выше."
jaJP = "上方拡張のコスト倍率。ゲームのデフォルト：6、つまり水を上に広げるためには一般的に6倍のコストがかかります。"
frFR = "Le multiplicateur de coût pour l'étalement vers le haut. Valeur par défaut du jeu : 6, ce qui signifie qu'il coûte généralement 6 fois plus cher d'étendre l'eau vers le haut."
deDE = "Der Kostenmultiplikator für die Aufwärtsverbreitung. Spielstandard: 6, was bedeutet, dass es im Allgemeinen 6-mal mehr kostet, Wasser nach oben zu verbreiten."
plPL = "Współczynnik kosztów dla rozprzestrzeniania w górę. Domyślne ustawienie gry: 6, co oznacza, że zazwyczaj kosztuje to 6 razy więcej, aby rozprzestrzenić wodę w górę."
ptBR = "O multiplicador de custo para a disseminação para cima. Valor padrão do jogo: 6, o que significa que geralmente custa 6 vezes mais para espalhar água para cima."
koKR = "위쪽 확산을 위한 비용 배수기. 게임 기본값: 6, 즉 물을 위로 확산하는 데 일반적으로 6배의 비용이 듭니다."
trTR = "Aşağı yayılma için maliyet çarpanı. Oyun varsayılanı: 6, bu da suyu yukarı yaymanın genellikle 6 kat daha pahalı olduğu anlamına geliyor."
esES = "El multiplicador de coste para la propagación hacia arriba. Valor predeterminado del juego: 6, lo que significa que, por lo general, propagar el agua hacia arriba cuesta 6 veces más."
itIT = "Il moltiplicatore del costo per la diffusione verso l'alto. Impostazione predefinita del gioco: 6, il che significa che di norma diffondere l'acqua verso l'alto costa 6 volte di più."
ukUA = "Множник вартості для поширення води вгору. Типове значення гри: 6, тобто поширення води вгору зазвичай коштує в 6 разів більше."
thTH = "ตัวคูณต้นทุนสำหรับการแผ่กระจายขึ้นด้านบน ค่าเริ่มต้นของเกม: 6 หมายความว่าโดยทั่วไปการแผ่กระจายน้ำขึ้นด้านบนจะมีต้นทุนสูงกว่าเป็น 6 เท่า"
csCZ = "Nákladový multiplikátor pro vertikální rozšíření. Výchozí hodnota ve hře: 6, což znamená, že obvykle stojí 6krát více rozšířit vodu nahoru."
viVN = "Hệ số chi phí cho việc lan nước lên. Mặc định của trò chơi: 6, có nghĩa là nói chung nó tốn thêm gấp 6 lần để lan nước lên."
caES = "El multiplicador de cost per a l'expansió cap amunt. Valor per defecte del joc: 6, cosa que vol dir que generalment costa 6 vegades més fer pujar l'aigua."
beBY = "Множнік кошту для распаўсюджвання вады ўверх. Стандартнае значэнне гульні: 6, гэта значыць, як правіла, распаўсюджванне вады ўверх каштуе ў 6 разоў даражэй."
roRO = "Multiplicatorul costului pentru răspândirea în sus. Valoarea implicită a jocului: 6, ceea ce înseamnă că, în general, răspândirea apei în sus costă de 6 ori mai mult."
huHU = "A felfelé terjedés költségszorzója. Játékbeli alapérték: 6, ami azt jelenti, hogy a víz felfelé terjesztése általában 6-szor annyiba kerül."
arSA = "مضاعف تكلفة الانتشار نحو الأعلى. الإعداد الافتراضي للعبة: 6، ويعني أن نشر الماء نحو الأعلى يكلّف عادةً أكثر بـ 6 أضعاف."

