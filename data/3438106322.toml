["LV.CI.MaximumWaterContaminationDesc"]
raw = "The maximum water contamination % where water stops irrigating. Game default: 0.53, meaning if your water is 53% contaminated or above, it will not irrigate."
status = "normal"
enUS = "The maximum percentage of water contamination where irrigation stops. Game default: 0.53, meaning if your water is 53% contaminated or above, it will not irrigate."
zhCN = "可以更改水的灌溉距离被降低至零的污染程度阈值（游戏默认：0.53，即污染程度高于53%时完全无法灌溉）。"
zhTW = "最大水污染百分比，超過此值將停止灌溉。遊戲默認值：0.53，意味著如果你的水污染率達到或超過53%，將不會進行灌溉。"
ruRU = "Максимальный процент загрязнения воды, при котором водоснабжение прекращается. Значение по умолчанию в игре: 0,53, что означает, что если ваша вода загрязнена на 53% или больше, полив не будет производиться."
jaJP = "水が灌漑を停止する最大水質汚染率。ゲームのデフォルト: 0.53、つまり水が53%以上汚染されている場合、灌漑を行いません。"
frFR = "Le pourcentage maximum de contamination de l'eau au-delà duquel l'irrigation s'arrête. Par défaut dans le jeu : 0,53, ce qui signifie que si votre eau est contaminée à 53 % ou plus, elle n'irriguera pas."
deDE = "Der maximale Wasserverunreinigungsprozentsatz, bei dem das Bewässern stoppt. Standardwert im Spiel: 0,53, was bedeutet, dass Ihr Wasser bei 53 % oder mehr verunreinigt ist, es nicht bewässert."
plPL = "Maksymalny procent zanieczyszczenia wody, przy którym nawadnianie przestaje działać. Domyślnie w grze: 0,53, co oznacza, że jeśli woda jest zanieczyszczona w 53% lub więcej, nawadnianie nie będzie działać."
ptBR = "A porcentagem máxima de contaminação da água onde a irrigação para. Padrão do jogo: 0,53, o que significa que se sua água estiver 53% contaminada ou mais, não irrigará."
koKR = "최대 물 오염 %로, 물이 관개를 중단하는 지점입니다. 게임 기본값: 0.53, 즉 물이 53% 오염되거나 그 이상일 경우 관개가 이루어지지 않습니다."
trTR = "Su sulama işleminin durduğu maksimum su kirliliği %. Oyun varsayılanı: 0.53, yani suyunuz %53 veya daha fazla kirlenmişse sulama yapmayacaktır."
esES = "El porcentaje máximo de contaminación del agua en el que el agua deja de regar. Valor predeterminado del juego: 0,53, lo que significa que si el agua está contaminada en un 53 % o más, no regará."
itIT = "La percentuale massima di contaminazione dell'acqua oltre la quale l'acqua smette di irrigare. Valore predefinito del gioco: 0,53, il che significa che se l'acqua è contaminata al 53% o oltre, non irrigherà."
ukUA = "Максимальний відсоток забруднення води, при якому вода ще зрошує. Стандартне значення гри: 0.53, тобто якщо ваша вода забруднена на 53% або більше, вона не зрошуватиме."
thTH = "ค่าการปนเปื้อนของน้ำสูงสุดเป็นเปอร์เซ็นต์ที่น้ำจะหยุดรดน้ำพืช ค่าเริ่มต้นของเกมคือ 0.53 หมายความว่าหากน้ำมีการปนเปื้อน 53% ขึ้นไป น้ำนั้นจะไม่ถูกใช้รดน้ำ"
csCZ = "Maximální procento znečištění vody, při kterém se zavlažování zastaví. Výchozí hodnota hry: 0,53, což znamená, že pokud je vaše voda znečištěna na 53 % nebo více, nebude zavlažovat."
viVN = "Mức ô nhiễm nước tối đa mà nước sẽ ngừng tưới. Mặc định trong trò chơi: 0,53, có nghĩa là nếu nước của bạn bị ô nhiễm 53% trở lên, nó sẽ không được tưới."
caES = "El percentatge màxim de contaminació de l'aigua en què l'aigua deixa de regar. Valor predeterminat del joc: 0,53, és a dir, si l'aigua està contaminada en un 53% o més, no regarà."
beBY = "Максімальны ўзровень забруджвання вады ў працэнтах, пры якім вада перастае паліваць. Стандартнае значэнне гульні: 0.53, гэта значыць, калі вада забруджана на 53% або больш, яна не будзе паліваць."
roRO = "Procentul maxim de contaminare a apei la care apa încetează să mai irige. Valoarea implicită a jocului: 0,53, ceea ce înseamnă că, dacă apa este contaminată în proporție de 53% sau mai mult, nu va iriga."
huHU = "A víz szennyezettségének legmagasabb százaléka, amelynél a víz már nem öntöz. Alapértelmezett érték: 0,53, vagyis ha a víz 53%-ban vagy annál szennyezettebb, nem fog öntözni."
arSA = "الحد الأقصى لنسبة تلوث المياه التي يتوقف عندها الري. القيمة الافتراضية في اللعبة: 0.53، أي أنه إذا كانت المياه ملوثة بنسبة 53% أو أكثر، فلن يتم الري بها."

