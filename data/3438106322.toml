["LV.CI.MinimumWaterContaminationDesc"]
raw = "The minimum water contamination % where water stops giving full irrigation. Game default: 0.01, meaning if your water is 1% contaminated or below, it will give full irrigation."
status = "normal"
enUS = "The minimum water contamination percentage at which water stops providing full irrigation. Default in the game: 0.01, meaning if your water is 1% contaminated or below, it will provide full irrigation."
zhCN = "可以更改水的灌溉距离开始受影响的污染程度阈值（游戏默认：0.01，即污染程度高于1%时灌溉距离会受污染程度影响）。"
zhTW = "水的最低污染百分比，當水的污染程度超過此值時，將無法提供完整的灌溉。遊戲預設值：0.01，這意味著如果你的水污染達到1%或以下，則將提供完整的灌溉。"
ruRU = "Минимальный процент загрязнения воды, при котором вода перестает обеспечивать полноценный полив. Значение по умолчанию в игре: 0.01, что означает, что если ваша вода загрязнена на 1% или меньше, она будет обеспечивать полный полив."
jaJP = "水が完全な灌漑を提供しなくなる最小水質汚染%: ゲームのデフォルトは0.01で、つまり水が1%以下の汚染であれば、完全な灌漑を提供します。"
frFR = "Le pourcentage minimum de contamination de l'eau où l'eau cesse de fournir une irrigation complète. Par défaut du jeu : 0,01, ce qui signifie que si votre eau est contaminée à 1 % ou moins, elle fournira une irrigation complète."
deDE = "Der minimale % Wasserverunreinigung, bei dem Wasser keine volle Bewässerung mehr bietet. Spielstandard: 0,01, was bedeutet, dass Ihr Wasser bei 1 % Verunreinigung oder darunter volle Bewässerung bietet."
plPL = "Minimalny procent zanieczyszczenia wody, przy którym woda przestaje zapewniać pełne nawodnienie. Domyślnie w grze: 0,01, co oznacza, że jeśli twoja woda ma zanieczyszczenie na poziomie 1% lub poniżej, zapewni pełne nawodnienie."
ptBR = "O percentual mínimo de contaminação da água onde a irrigação plena para de funcionar. Padrão do jogo: 0,01, o que significa que se a sua água estiver 1% contaminada ou menos, ela proporcionará irrigação plena."
koKR = "최소 물 오염 %는 물이 완전한 관개를 제공하는 것을 멈추는 지점을 나타냅니다. 게임 기본값: 0.01, 즉 물이 1% 오염되었거나 그 이하일 경우 완전한 관개를 제공합니다."
trTR = "Tam sulama vermenin durduğu minimum su kirliliği %. Oyun varsayılanı: 0.01, yani suyunuz %1 veya daha az kirlenmişse, tam sulama sağlar."
esES = "El porcentaje mínimo de contaminación del agua a partir del cual el agua deja de proporcionar riego completo. Valor predeterminado del juego: 0.01, lo que significa que si tu agua está contaminada en un 1% o menos, proporcionará riego completo."
itIT = "La percentuale minima di contaminazione dell'acqua oltre la quale l'acqua smette di fornire un'irrigazione completa. Valore predefinito di gioco: 0,01, il che significa che se l'acqua è contaminata all'1% o meno, fornirà un'irrigazione completa."
ukUA = "Мінімальний відсоток забруднення води, при якому вода перестає давати повний обсяг зрошення. Типове значення гри: 0.01, тобто якщо ваша вода забруднена на 1% або менше, вона даватиме повне зрошення."
thTH = "ระดับการปนเปื้อนของน้ำขั้นต่ำเป็น % ที่น้ำจะเริ่มให้การชลประทานไม่เต็มประสิทธิภาพ ค่าเริ่มต้นของเกม: 0.01 หมายความว่าหากน้ำของคุณปนเปื้อนอยู่ที่ 1% หรือต่ำกว่า น้ำจะให้การชลประทานเต็มประสิทธิภาพ"
csCZ = "Minimální procento znečištění vody, při kterém přestane voda poskytovat plné zavlažování. Výchozí hodnota hry: 0,01, což znamená, že pokud je vaše voda znečištěna na 1 % nebo méně, poskytne plné zavlažování."
viVN = "Độ ô nhiễm nước tối thiểu tại mức khiến nước ngừng tưới tiêu đầy đủ. Mặc định của trò chơi: 0.01, có nghĩa là nước ô nhiễm 1% hoặc thấp hơn sẽ cho tưới tiêu đầy đủ."
caES = "El percentatge mínim de contaminació de l'aigua a partir del qual l'aigua deixa de proporcionar reg complet. Valor per defecte del joc: 0,01, cosa que vol dir que, si l'aigua està contaminada en un 1% o menys, proporcionarà reg complet."
beBY = "Мінімальны ўзровень забруджвання вады ў % , пры якім вада перастае забяспечваць поўнае арашэнне. Стандартнае значэнне гульні: 0.01, гэта значыць, калі ваша вада забруджана на 1% або менш, яна будзе забяспечваць поўнае арашэнне."
roRO = "Procentul minim de contaminare a apei la care apa nu mai oferă irigare completă. Valoarea implicită a jocului: 0,01, ceea ce înseamnă că, dacă apa este contaminată în proporție de 1% sau mai puțin, va oferi irigare completă."
huHU = "A szennyezettség minimális százaléka, amelytől kezdve a víz már nem ad teljes öntözést. Alapértelmezett érték: 0,01, ami azt jelenti, hogy ha a víz legfeljebb 1%-ban szennyezett, teljes öntözést ad."
arSA = "الحد الأدنى لنسبة تلوث الماء التي يتوقف عندها الماء عن توفير الري الكامل. القيمة الافتراضية في اللعبة: 0.01، أي أنه إذا كانت نسبة تلوث مياهك 1% أو أقل، فسيوفر الري الكامل."

