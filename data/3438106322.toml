["LV.CI.ContaMinimumWaterContaminationDesc"]
raw = "The minimum water contamination % where water starts contaminate soil. Game default: 0.5, meaning if your water is 50% contaminated or above, it will start contaminating soil."
status = "normal"
enUS = "The minimum water contamination percentage at which water begins to contaminate soil is 0.5%, meaning if your water is 50% contaminated or above, it will start contaminating the soil."
zhCN = "可以更改水的污染距离开始生效的污染程度阈值（游戏默认：0.5，即污染程度高于50%时开始污染土地）。"
zhTW = "水開始污染土壤的最低污染百分比。遊戲默認值：0.5，這意味著如果你的水污染達到50%或以上，它將開始污染土壤。"
ruRU = "Минимальный процент загрязнения воды, при котором вода начинает загрязнять почву. Значение по умолчанию в игре: 0.5, что означает, что если ваша вода загрязнена на 50% или более, она начнет загрязнять почву."
jaJP = "水が土壌を汚染し始める最低水質汚染率%。ゲームのデフォルト: 0.5、つまり、水が50%汚染されるかそれ以上になると、土壌が汚染し始めます。"
frFR = "Le pourcentage minimum de contamination de l'eau où l'eau commence à contaminer le sol. Par défaut dans le jeu : 0,5, ce qui signifie que si votre eau est contaminée à 50 % ou plus, elle commencera à contaminer le sol."
deDE = "Der minimale Verschmutzungsgrad des Wassers, ab dem Wasser den Boden zu kontaminieren beginnt. Standard im Spiel: 0,5, das bedeutet, wenn dein Wasser zu 50 % oder mehr verschmutzt ist, beginnt es, den Boden zu kontaminieren."
plPL = "Minimalny procent zanieczyszczenia wody, przy którym woda zaczyna zanieczyszczać glebę. Domyślnie w grze: 0,5, co oznacza, że jeśli twoja woda jest zanieczyszczona w 50% lub więcej, zacznie zanieczyszczać glebę."
ptBR = "A porcentagem mínima de contaminação da água onde a água começa a contaminar o solo. Padrão do jogo: 0,5, ou seja, se a sua água estiver 50% contaminada ou mais, começará a contaminar o solo."
koKR = "물 오염이 토양을 오염시키기 시작하는 최소 물 오염 %입니다. 게임 기본값: 0.5로, 물이 50% 오염되거나 그 이상일 경우 토양을 오염시키기 시작합니다."
trTR = "Toprağın kirlenmeye başladığı minimum su kirliliği %. Oyun varsayılanı: 0.5, yani eğer suyunuz %50 veya daha fazla kirlenmişse, toprağı kirletmeye başlayacaktır."
esES = "El porcentaje mínimo de contaminación del agua a partir del cual el agua empieza a contaminar el suelo. Valor predeterminado del juego: 0,5, lo que significa que si tu agua está contaminada al 50 % o más, empezará a contaminar el suelo."
itIT = "La percentuale minima di contaminazione dell'acqua a partire dalla quale l'acqua inizia a contaminare il suolo. Valore predefinito del gioco: 0,5, il che significa che se l'acqua è contaminata al 50% o oltre, inizierà a contaminare il suolo."
ukUA = "Мінімальний відсоток забруднення води, при якому вода починає забруднювати ґрунт. Стандартне значення гри: 0.5, тобто якщо ваша вода забруднена на 50% або більше, вона почне забруднювати ґрунт."
thTH = "ระดับการปนเปื้อนของน้ำขั้นต่ำเป็นเปอร์เซ็นต์ที่น้ำเริ่มทำให้ดินปนเปื้อน ค่าเริ่มต้นของเกม: 0.5 หมายความว่าหากน้ำของคุณปนเปื้อน 50% ขึ้นไป น้ำจะเริ่มทำให้ดินปนเปื้อน"
csCZ = "Minimální procento kontaminace vody, při kterém voda začíná kontaminovat půdu. Výchozí hodnota ve hře: 0,5, což znamená, že pokud je vaše voda kontaminována z 50 % nebo více, začne kontaminovat půdu."
viVN = "Tỷ lệ ô nhiễm nước tối thiểu để nước bắt đầu làm ô nhiễm đất. Mặc định của trò chơi: 0,5, có nghĩa là nếu nước của bạn bị ô nhiễm ở mức 50% hoặc cao hơn, nó sẽ bắt đầu làm ô nhiễm đất."
caES = "El percentatge mínim de contaminació de l'aigua a partir del qual l'aigua comença a contaminar el sòl. Valor per defecte del joc: 0,5, és a dir, si l'aigua està contaminada en un 50% o més, començarà a contaminar el sòl."
beBY = "Мінімальны працэнт забруджвання вады, пры якім вада пачынае забруджваць глебу. Стандартнае значэнне гульні: 0,5, гэта значыць, калі ваша вада забруджана на 50% або больш, яна пачне забруджваць глебу."
roRO = "Procentul minim de contaminare a apei de la care apa începe să contamineze solul. Valoarea implicită a jocului: 0,5, ceea ce înseamnă că, dacă apa este contaminată în proporție de 50% sau mai mult, va începe să contamineze solul."
huHU = "A víz szennyezésének minimális százaléka, amelytől a víz elkezdi szennyezni a talajt. Alapértelmezett érték: 0,5, vagyis ha a víz 50%-ban vagy annál jobban szennyezett, elkezdi szennyezni a talajt."
arSA = "الحد الأدنى لنسبة تلوث المياه التي تبدأ عندها المياه بتلويث التربة. القيمة الافتراضية للعبة: 0.5، أي أنه إذا كانت مياهك ملوثة بنسبة 50% أو أكثر، فستبدأ بتلويث التربة."

