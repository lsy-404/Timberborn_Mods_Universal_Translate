["ModSetting.TWSimpleWorkshopControl.ShowUserControlDesc"]
raw = "Enables the old user-control behavior. This gives more specific control and allows controling some additional building types, but has been mostly replaced by the auto behaviors"
status = "normal"
enUS = "Enables the old user-control behavior. This gives more specific control and allows controlling some additional building types, but has been mostly replaced by the auto behaviors."
zhCN = "启用旧的用户控制行为。这提供了更具体的控制，并允许控制一些额外的建筑类型，但大部分已经被自动行为所取代。"
zhTW = "啟用舊版用戶控制行為。這提供了更具體的控制並允許控制一些額外的建築類型，但已大部分被自動行為取代。"
ruRU = "Включает старое поведение управления пользователем. Это предоставляет более специфичный контроль и позволяет управлять некоторыми дополнительными типами зданий, но в основном было заменено автоматическим поведением."
jaJP = "古いユーザーコントロールの動作を有効にします。これにより、より具体的な制御が可能になり、追加の建物タイプを操作できるようになりますが、ほとんどは自動動作に置き換えられています。"
frFR = "Active le comportement de contrôle utilisateur ancien. Cela permet un contrôle plus spécifique et permet de contrôler certains types de bâtiments supplémentaires, mais a été principalement remplacé par les comportements automatiques."
deDE = "Aktiviert das alte Benutzersteuerungsverhalten. Dies ermöglicht eine spezifischere Steuerung und erlaubt das Steuern einiger zusätzlicher Gebäudetypen, wurde jedoch größtenteils durch die automatischen Verhaltensweisen ersetzt."
plPL = "Włącza starą obsługę użytkownika. Daje to bardziej szczegółową kontrolę i umożliwia kontrolę dodatkowych typów budynków, ale zostało w dużej mierze zastąpione przez automatyczne zachowania."
ptBR = "Ativa o comportamento antigo de controle do usuário. Isso proporciona um controle mais específico e permite controlar alguns tipos de construções adicionais, mas foi em grande parte substituído pelos comportamentos automáticos."
koKR = "구 사용자의 제어 동작을 활성화합니다. 이것은 보다 구체적인 제어를 제공하고 일부 추가 건물 유형을 제어할 수 있도록 하지만 대부분 자동 동작으로 대체되었습니다."
trTR = "Eski kullanıcı kontrol davranışını etkinleştirir. Bu, daha spesifik kontrol sağlar ve bazı ek bina türlerini kontrol etmeye olanak tanır, ancak çoğunlukla otomatik davranışlarla değiştirilmiştir."
esES = "Habilita el antiguo comportamiento de control manual. Esto ofrece un control más específico y permite controlar algunos tipos de edificios adicionales, pero ha sido reemplazado en su mayoría por los comportamientos automáticos"
itIT = "Abilita il vecchio comportamento di controllo manuale. Questo offre un controllo più specifico e permette di controllare alcuni tipi di edifici aggiuntivi, ma è stato in gran parte sostituito dai comportamenti automatici."
ukUA = "Вмикає стару поведінку керування користувачем. Це забезпечує точніший контроль і дозволяє керувати деякими додатковими типами будівель, але здебільшого замінено автоматичними режимами поведінки"
thTH = "เปิดใช้งานพฤติกรรมการควบคุมด้วยตนเองแบบเดิม ซึ่งให้การควบคุมที่เจาะจงมากขึ้นและช่วยให้ควบคุมอาคารบางประเภทเพิ่มเติมได้ แต่ส่วนใหญ่ถูกแทนที่ด้วยพฤติกรรมอัตโนมัติแล้ว"
csCZ = "Povoluje staré chování ovládání uživatele. To poskytuje specifické ovládání a umožňuje ovládat některé další typy budov, ale bylo převážně nahrazeno automatickými chováními."
viVN = "Kích hoạt hành vi điều khiển bằng người dùng cũ. Điều này mang lại sự kiểm soát chi tiết hơn và cho phép điều khiển một số loại công trình bổ sung, nhưng phần lớn đã được thay thế bởi các hành vi tự động"
caES = "Activa el comportament antic de control manual. Això permet un control més específic i permet controlar alguns tipus de construccions addicionals, però ha estat substituït en gran part pels comportaments automàtics."
beBY = "Уключае стары рэжым кіравання карыстальніка. Ён дае больш дакладнае кіраванне і дазваляе кіраваць некаторымі дадатковымі тыпамі будынкаў, але большасцю заменены аўтаматычнымі рэжымамі."
roRO = "Activează vechiul comportament de control manual. Acesta oferă un control mai specific și permite controlul unor tipuri suplimentare de clădiri, dar a fost în mare parte înlocuit de comportamentele automate."
huHU = "Engedélyezi a régi, felhasználó által vezérelt működést. Ez pontosabb vezérlést tesz lehetővé, és néhány további épülettípus irányítását is támogatja, de nagyrészt már az automatikus működési módok váltották fel."
arSA = "يفعّل سلوك التحكم اليدوي القديم. يتيح هذا تحكمًا أدق ويسمح بالتحكم في بعض أنواع المباني الإضافية، لكنه استُبدل إلى حد كبير بالسلوكيات التلقائية."

