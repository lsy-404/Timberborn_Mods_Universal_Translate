["ModSetting.TWSimpleWorkshopControl.PerBuildingAutoSlidersDesc"]
raw = "When checked, the start/stop values for each building can be chosen in-game. When unchecked, all buildings will use the mod-setting defaults."
status = "abandoned"
enUS = "When checked, the start/stop values for each building can be chosen in-game. When unchecked, all buildings will use the mod-setting defaults."
zhCN = "勾选后，可以单独设置每栋建筑的启用/关停阈值。如果未勾选，则所有建筑将使用模组设置的默认阈值。"
zhTW = "當勾選時，可以在遊戲中為每座建築選擇啟動/停止值。當未勾選時，所有建築將使用模組設定的預設值。"
ruRU = "Когда отмечено, значения начала/остановки для каждого здания можно выбрать в игре. Когда не отмечено, все здания будут использовать стандартные настройки мода."
jaJP = "チェックすると、各建物の開始/停止値をゲーム内で選択できます。チェックを外すと、すべての建物はモッド設定のデフォルトを使用します。"
frFR = "Lorsque cette option est activée, les valeurs de début/arrêt pour chaque bâtiment peuvent être choisies en jeu. Lorsque cette option est désactivée, tous les bâtiments utiliseront les paramètres par défaut du mod."
deDE = "Wenn aktiviert, können die Start-/Stoppwerte für jedes Gebäude im Spiel ausgewählt werden. Wenn deaktiviert, verwenden alle Gebäude die Standardwerte des Mods."
plPL = "Po zaznaczeniu, wartości startowe/zatrzymania dla każdego budynku mogą być wybierane w grze. Po odznaczeniu, wszystkie budynki będą korzystać z domyślnych ustawień moda."
ptBR = "Quando marcado, os valores de início/parada para cada prédio podem ser escolhidos no jogo. Quando desmarcado, todos os prédios usarão os padrões da configuração do mod."
koKR = "체크하면, 각 건물의 시작/중지 값을 게임 내에서 선택할 수 있습니다. 체크 해제 시, 모든 건물은 모드 설정 기본값을 사용합니다."
trTR = "Seçildiğinde, her bina için başlangıç/durdurma değerleri oyunda seçilebilir. Seçili olmadığında, tüm binalar mod ayarlarının varsayılan değerlerini kullanacaktır."
esES = "Cuando está marcado, los valores de inicio/parada de cada edificio pueden elegirse en el juego. Cuando no está marcado, todos los edificios usarán los valores predeterminados de la configuración del mod."
itIT = "Se selezionata, i valori di avvio/arresto per ogni edificio possono essere scelti in gioco. Se deselezionata, tutti gli edifici useranno i valori predefiniti delle impostazioni della mod."
ukUA = "Коли ввімкнено, значення початку та зупинки для кожної будівлі можна вибрати в грі. Коли вимкнено, усі будівлі використовуватимуть типові значення з налаштувань моду."
thTH = "เมื่อเลือกไว้ สามารถเลือกค่าเริ่มต้นและค่าหยุดสำหรับอาคารแต่ละหลังได้ในเกม เมื่อไม่ได้เลือก อาคารทั้งหมดจะใช้ค่าเริ่มต้นจากการตั้งค่าของม็อด"
csCZ = "Když je zaškrtnuto, lze v hře vybrat hodnoty pro spuštění/zastavení pro každou budovu. Když není zaškrtnuto, všechny budovy budou používat výchozí nastavení modifikace."
viVN = "Khi được bật, các giá trị bắt đầu và kết thúc cho từng công trình có thể được chọn trong trò chơi. Khi được tắt, tất cả các công trình sẽ sử dụng các thiết lập mặc định của mod."
caES = "Quan està marcat, els valors d'inici i aturada de cada edifici es poden triar durant la partida. Quan no està marcat, tots els edificis utilitzaran els valors predeterminats de la configuració del mod."
beBY = "Калі ўключана, значэнні пуску і прыпынку для кожнага будынка можна абраць у гульні. Калі выключана, усе будынкі будуць выкарыстоўваць стандартныя значэнні з налад мода."
roRO = "Când este bifat, valorile de pornire și oprire pentru fiecare clădire pot fi alese în joc. Când nu este bifat, toate clădirile vor folosi valorile implicite din setările modificării."
huHU = "Ha be van jelölve, minden épülethez a játékon belül lehet kiválasztani az indítási/leállítási értékeket. Ha nincs bejelölve, minden épület a modbeállításokban megadott alapértékeket használja."
arSA = "عند التحديد، يمكن اختيار قيم البدء والإيقاف لكل مبنى داخل اللعبة. عند إلغاء التحديد، ستستخدم جميع المباني القيم الافتراضية المحددة في إعدادات المود."
