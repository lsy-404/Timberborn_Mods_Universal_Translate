["UI.TW.SimpleWorkshopControl.TT.PowerLevelIsBatteryAwareToggle"]
raw = "Power level will include battery power. Workshops will turn on if there is battery available, and generators will attempt to keep battery above zero."
status = "normal"
enUS = "Power level includes battery power. Workshops will turn on if there is battery available, and generators will attempt to keep the battery above zero."
zhCN = "电力水平将包含电池电量。工坊将开启，如果有可用的电池，发电机将努力保持电池电量在零以上。"
zhTW = "電力水平將包含電池電力。若有電池可用，工坊將啟動，發電機將嘗試將電池電量維持在 0 以上。"
ruRU = "Уровень энергии будет учитывать заряд батареи. Цеха будут включаться, если доступна батарея, а генераторы будут пытаться поддерживать заряд батареи выше нуля."
jaJP = "電力レベルにはバッテリー電力を含みます。バッテリーが利用可能な場合、ワークショップは作動します。発電機はバッテリーを0を超える状態に保つよう努めます。"
frFR = "Le niveau de puissance tiendra compte de l'énergie de la batterie. Les ateliers s'allumeront s'il y a une batterie disponible, et les générateurs tenteront de maintenir la batterie au-dessus de zéro."
deDE = "Die Leistungsstufe berücksichtigt Batterieleistung. Werkstätten werden eingeschaltet, wenn eine Batterie verfügbar ist, und Generatoren versuchen, die Batterie über Null zu halten."
plPL = "Poziom zasilania będzie uwzględniał energię z baterii. Warsztaty włączą się, jeśli bateria będzie dostępna, a generatory będą starać się utrzymać poziom baterii powyżej zera."
ptBR = "O nível de energia incluirá a energia da bateria. As oficinas ligarão se houver bateria disponível, e os geradores tentarão manter a bateria acima de zero."
koKR = "전력 수준에는 배터리 전력이 포함됩니다. 배터리가 남아 있으면 작업장들이 켜지며, 발전기는 배터리 잔량이 0보다 크도록 유지하려고 시도합니다."
