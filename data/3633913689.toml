status = "normal"
enUS = "Power level is supply divided by total demand (then normalized to a 0-100 scale).\nIf battery-aware is checked, supply will have available battery power added to it.\nActive demand is buildings currently on. Total demand is buildings that would like to be on, if they had enough power.\nThe power percentage shown in the vanilla GUI and used to control workshop speed is supply / active demand."
zhCN = "电力水平等于供给除以总需求（然后归一化到0-100的区间）。\n如果勾选了电池感知，供给将增加可用的电池电力。\n活动需求是当前正在开启的建筑。总需求是如果有足够的电力就想要开启的建筑。\n在原版 GUI 中显示的电力百分比并用于控制工作坊速度的是 供给 / 活动需求。"
zhTW = "電力水平等於供給除以總需求（再歸一化為 0-100 的刻度）。\n如果勾選了電池感知，供給將會加上可用的電池電力。\n實際需求是目前正在運作的建築物。總需求是那些如果有足夠電力就想要開啟的建築物。\n在原版 GUI 中顯示的電力百分比，並用於控制工作坊速度，其計算方式為 供給 / 實際需求。"
ruRU = "Уровень мощности равен отношению поставки к общему спросу (затем нормализуется до шкалы от 0 до 100).\nЕсли включён флажок «Учёт батареи», подача энергии будет дополнена доступной мощностью батареи.\nАктивный спрос — здания, которые включены в данный момент. Общий спрос — здания, которые хотели бы быть включёнными, если бы у них хватило энергии.\nПроцент мощности, отображаемый в стандартном графическом интерфейсе и используемый для управления скоростью мастерской, равен отношению поставки к активному спросу."
jaJP = "電力レベルは、供給量を総需要で割った値を、0〜100のスケールに正規化した値です。\nバッテリー対応が有効になっている場合、供給量に利用可能なバッテリーパワーが加算されます。\nアクティブ需要は現在オンになっている建物を指します。総需要は、十分な電力があればオンにしたいと考えている建物の数です。\n標準の GUI に表示され、ワークショップの速度を制御するのに使用される電力の割合は、供給量 / アクティブ需要です。"
frFR = "Le niveau de puissance est l'approvisionnement divisé par la demande totale (puis normalisé sur une échelle de 0 à 100).\nSi l'option prise en compte de la batterie est cochée, l'approvisionnement bénéficiera de l'énergie disponible de la batterie qui lui est ajoutée.\nLa demande active correspond aux bâtiments actuellement en fonctionnement. La demande totale correspond aux bâtiments qui aimeraient être allumés, s'ils disposaient de suffisamment d'énergie.\nLe pourcentage de puissance affiché dans l'interface graphique d'origine et utilisé pour contrôler la vitesse de l'atelier est l'approvisionnement / la demande active."
deDE = "Die Leistungsstufe ergibt sich aus der Versorgung geteilt durch die Gesamtnachfrage (dann auf eine Skala von 0 bis 100 normalisiert).\nWenn die Batterieberücksichtigung aktiviert ist, wird der Versorgung zusätzliche verfügbare Batterieleistung hinzugefügt.\nAktive Nachfrage sind aktuell eingeschaltete Gebäude. Gesamtnachfrage sind Gebäude, die eingeschaltet sein würden, wenn sie genügend Strom hätten.\nDer im Vanilla-GUI angezeigte Leistungsprozentsatz, der zur Steuerung der Werkstattgeschwindigkeit verwendet wird, ist Versorgung / aktive Nachfrage."
plPL = "Poziom mocy to stosunek zasilania do całkowitego zapotrzebowania (następnie znormalizowany do zakresu 0-100).\nJeśli opcja battery-aware jest zaznaczona, dostawa zostanie powiększona o dostępną moc baterii.\nAktywne zapotrzebowanie to budynki, które są obecnie włączone.\nCałkowite zapotrzebowanie to budynki, które chciałyby być włączone, gdyby miały wystarczającą moc.\nProcent mocy wyświetlany w domyślnym GUI i używany do sterowania prędkością warsztatu to zasilanie / aktywne zapotrzebowanie."
ptBR = "Nível de energia é o fornecimento dividido pela demanda total (em seguida normalizado para uma escala de 0 a 100).\nSe a opção considerar bateria estiver marcada, o fornecimento terá a energia disponível da bateria adicionada a ele.\nA demanda ativa são os edifícios que estão ligados no momento. A demanda total são os edifícios que gostariam de estar ligados, se tivessem energia suficiente.\nA porcentagem de potência mostrada na GUI original e usada para controlar a velocidade da oficina é fornecimento / demanda ativa."
koKR = "전력 수준은 공급량을 총 수요량으로 나눈 값이며(0~100 스케일로 정규화됩니다).\n배터리 인식이 활성화되면 이용 가능한 배터리 전력이 공급에 더해집니다.\n활성 수요는 현재 켜져 있는 건물들입니다. 총 수요는 충분한 전력이 있다면 켜고 싶어하는 건물들입니다.\n기본 GUI에 표시되며 작업장 속도 제어에 사용되는 전력 비율은 공급량 / 활성 수요입니다."
trTR = "Güç seviyesi, arzın toplam talebe bölünmesiyle hesaplanır (sonrasında 0-100 ölçeğine normalize edilir). \nEğer batarya farkındalığı etkinse, arzın üzerine mevcut batarya gücü eklenecektir. \nAktif talep, şu anda açık olan binalardır. Toplam talep, yeterli güç olursa açılmak isteyen binalardır. \nVanilla GUI'de gösterilen ve atölye hızını kontrol etmek için kullanılan güç yüzdesi, arz / aktif talep şeklindedir."
esES = "Nivel de energía es el suministro dividido entre la demanda total (luego normalizado a una escala de 0-100).\nSi la opción de considerar baterías está marcada, al suministro se le sumará la energía disponible de las baterías.\nLa demanda activa son los edificios que están encendidos actualmente. La demanda total son los edificios que querrían estar encendidos si tuvieran energía suficiente.\nEl porcentaje de energía que muestra la interfaz original y que se usa para controlar la velocidad del taller es suministro / demanda activa."
itIT = "Il livello di potenza è l'offerta divisa per la domanda totale (poi normalizzato su una scala da 0 a 100).\nSe è selezionata l'opzione con batteria, all'offerta viene aggiunta la potenza disponibile nelle batterie.\nLa domanda attiva è costituita dagli edifici attualmente accesi. La domanda totale è costituita dagli edifici che vorrebbero essere accesi, se avessero abbastanza energia.\nLa percentuale di potenza mostrata nell'interfaccia originale e usata per controllare la velocità dei laboratori è offerta / domanda attiva."
ukUA = "Рівень потужності — це постачання, поділене на загальний попит (потім нормалізоване до шкали 0–100).\nЯкщо позначено «враховувати батарею», до постачання додається доступна потужність батарей.\nАктивний попит — це будівлі, які зараз увімкнені. Загальний попит — це будівлі, які хотіли б бути увімкненими, якби мали достатньо потужності.\nВідсоток потужності, який показано у стандартному інтерфейсі та який використовується для керування швидкістю майстерні, — це постачання / активний попит."
thTH = "ระดับพลังงานคำนวณจากกำลังผลิตทั้งหมดหารด้วยความต้องการพลังงานทั้งหมด (จากนั้นปรับให้อยู่ในช่วง 0-100)\nหากเลือกตัวเลือก \"คำนึงถึงแบตเตอรี่\" กำลังผลิตจะรวมพลังงานที่มีอยู่ในแบตเตอรี่เข้าไปด้วย\nความต้องการพลังงานที่กำลังใช้งาน คืออาคารที่เปิดทำงานอยู่ในขณะนี้ ส่วนความต้องการพลังงานทั้งหมด คืออาคารที่ต้องการเปิดทำงาน หากมีพลังงานเพียงพอ\nเปอร์เซ็นต์พลังงานที่แสดงในอินเตอร์เฟซเดิมของเกม และใช้ควบคุมความเร็วของโรงงาน คือกำลังผลิตหารด้วยความต้องการพลังงานที่กำลังใช้งาน"
csCZ = "Úroveň napájení je poměr dodávky k celkové poptávce (poté normalizováno na škálu 0–100). Pokud je zaškrtnuto 'battery-aware', dodávka bude zahrnovat dostupnou energii z baterie. Aktivní poptávka jsou budovy, které jsou právě zapnuté. Celková poptávka jsou budovy, které by chtěly být zapnuté, kdyby měly dostatek energie. Podíl napájení zobrazený ve vanilkovém GUI a použitý k řízení rychlosti dílny je dodávka / aktivní poptávka."
viVN = "Mức công suất bằng nguồn cung chia cho tổng nhu cầu (sau đó được chuẩn hóa về thang 0-100).\nNếu bật chế độ nhận biết pin, nguồn cung sẽ được cộng thêm công suất có sẵn từ pin.\nNhu cầu hoạt động hiện tại là các tòa nhà đang được bật. Tổng nhu cầu là các tòa nhà sẽ muốn được bật, nếu chúng có đủ công suất.\nTỷ lệ phần trăm công suất được hiển thị trong giao diện gốc và được dùng để điều khiển tốc độ của workshop là nguồn cung chia cho nhu cầu hoạt động."
caES = "El nivell d'energia és el subministrament dividit entre la demanda total (després normalitzat a una escala de 0-100).\nSi l'opció de tenir en compte la bateria està marcada, al subministrament s'hi afegirà l'energia disponible de les bateries.\nLa demanda activa són els edificis que estan encesos en aquest moment. La demanda total són els edificis que voldrien estar encesos, si tinguessin prou energia.\nEl percentatge d'energia que es mostra a la interfície original del joc i que s'utilitza per controlar la velocitat del taller és subministrament / demanda activa."
beBY = "Узровень магутнасці — гэта запас энергіі, падзелены на агульны попыт (затым нармалізаваны да шкалы 0–100).\nКалі пазначана «Улічваць батарэі», да запасу дадаецца даступная энергія батарэй.\nАктыўны попыт — гэта будынкі, якія зараз уключаны. Агульны попыт — гэта будынкі, якія хацелі б працаваць, калі б мелі дастатковую энергію.\nПрацэнт магутнасці, які паказваецца ў стандартным інтэрфейсе і выкарыстоўваецца для кіравання хуткасцю майстэрні, — гэта запас / актыўны попыт."
roRO = "Nivelul de energie este oferta împărțită la cererea totală (apoi normalizat la o scară de 0-100).\nDacă este bifată opțiunea „battery-aware”, la ofertă se adaugă energia disponibilă din baterii.\nCererea activă este clădirile care sunt pornite în prezent. Cererea totală este clădirile care ar dori să fie pornite, dacă ar avea suficientă energie.\nProcentul de energie afișat în interfața vanilla și folosit pentru a controla viteza atelierelor este oferta / cererea activă."
huHU = "Az energiaszint a termelés és a teljes igény hányadosa (majd 0-100 skálára normalizálva).\nHa az akkumulátor-figyelembevétel be van jelölve, a rendelkezésre álló akkumulátor-energia hozzáadódik a termeléshez.\nAktív igény azok az épületek, amelyek jelenleg be vannak kapcsolva. Teljes igény azok az épületek, amelyek szeretnének működni, ha lenne elegendő energiájuk.\nA vanilla felületen megjelenített energiaszázalék, amellyel a műhelyek sebességét szabályozzák, a termelés / aktív igény hányados."
arSA = "مستوى الطاقة هو الإمداد مقسومًا على إجمالي الطلب (ثم يُسوّى إلى مقياس من 0 إلى 100).\nإذا كان خيار \"مراعاة البطاريات\" محددًا، فستُضاف طاقة البطاريات المتاحة إلى الإمداد.\nالطلب النشط هو المباني التي تعمل حاليًا. أما إجمالي الطلب فهو المباني التي تريد العمل لو توفر لها طاقة كافية.\nنسبة الطاقة الظاهرة في الواجهة الأصلية، والمستخدمة للتحكم في سرعة ورشة العمل، هي الإمداد / الطلب النشط."

["UI.TW.SimpleWorkshopControl.PowerLevelGeneratorWarning"]
raw = "! Building is generator. Will only turn off if power level is above Stop AND if turning off will not reduce power level below Start."
status = "normal"
enUS = "This building is a generator. It will only turn off if the power level is above Stop and if turning off will not reduce the power level below Start."
zhCN = "! 该建筑是发电机。只有当电力水平高于 Stop 且关闭不会使电力水平降至 Start 以下时，才会关闭。"
zhTW = "! 此建築物為發電機。只有當電力水平高於 Stop，且關閉不會使電力水平降至 Start 以下時，才會關閉。"
ruRU = "! Здание является генератором. Выключаться будет только если уровень мощности выше порога Stop и если выключение не снизит уровень мощности ниже порога Start."
jaJP = "! この建物は発電機です。電力レベルが Stop を上回っている場合にのみオフになります。かつ、オフにすると電力レベルが Start を下回らない場合に限ります。"
frFR = "! Le bâtiment est un générateur. Il ne s'éteindra que si le niveau de puissance est supérieur à Stop et si l'arrêt ne réduira pas le niveau de puissance en dessous de Start."
deDE = "! Das Gebäude ist ein Generator. Wird nur ausgeschaltet, wenn die Leistung über Stop liegt UND wenn das Ausschalten die Leistung nicht unter Start senken würde."
plPL = "! Budynek jest generatorem. Wyłączy się tylko wtedy, gdy poziom energii będzie powyżej Stop ORAZ jeśli wyłączenie nie obniży poziomu energii poniżej Start."
ptBR = "! A construção é geradora. Só desligará se o nível de energia estiver acima de Parar E se desligar não reduzir o nível de energia abaixo de Iniciar."
koKR = "! 이 건물은 발전기입니다. 전력 레벨이 Stop 이상일 때만 꺼지며, 꺼져도 전력 레벨이 Start보다 아래로 떨어지지 않는 경우에만 꺼집니다."
trTR = "! Bina jeneratördür. Sadece güç seviyesi Stop'un üzerinde ise ve kapatmanın güç seviyesini Start'ın altına düşürmeyeceğinden emin olunursa kapatılacaktır."
esES = "¡El edificio es un generador! Solo se apagará si el nivel de energía está por encima de Stop Y si apagarlo no reducirá el nivel de energía por debajo de Start."
itIT = "! L'edificio è un generatore. Si spegnerà solo se il livello di potenza è superiore a Stop E se spegnerlo non riduce il livello di potenza al di sotto di Start."
ukUA = "! Будівля є генератором. Вона вимкнеться лише тоді, коли рівень потужності перевищує значення «Зупинка», і якщо вимкнення не знизить рівень потужності нижче значення «Старт»."
thTH = "! อาคารนี้เป็นเครื่องกำเนิดพลังงาน จะปิดก็ต่อเมื่อระดับพลังงานสูงกว่าค่าหยุด และการปิดจะไม่ทำให้ระดับพลังงานต่ำกว่าค่าเริ่มต้น"
csCZ = "! Budova je generátor. Vypne se pouze tehdy, když je úroveň napájení nad Stop a pokud vypnutí nezpůsobí, že by úroveň napájení klesla pod Start."
viVN = "! Tòa nhà là máy phát điện. Sẽ chỉ tắt khi mức công suất vượt quá Stop và nếu việc tắt sẽ không làm giảm mức công suất xuống dưới Start."
caES = "Aquest edifici és un generador. Només es desactivarà si el nivell d'energia està per sobre de Stop i si desactivar-lo no fa baixar el nivell d'energia per sota de Start."
beBY = "! Будынак - гэта генератар. Ён будзе выключацца толькі тады, калі ўзровень магутнасці вышэйшы за Stop, і калі выключэнне не знізіць узровень магутнасці ніжэй за Start."
roRO = "! Clădirea este un generator. Se va opri doar dacă nivelul de putere este peste Stop ȘI dacă oprirea nu va reduce nivelul de putere sub Start."
huHU = "! Az épület generátor. Csak akkor kapcsol ki, ha a teljesítményszint meghaladja a Leállítás értékét, ÉS a kikapcsolás nem csökkenti a teljesítményszintet a Indítás értéke alá."
arSA = "ملاحظة: هذا المبنى مولّد. لن يتوقف إلا إذا كان مستوى الطاقة أعلى من مستوى الإيقاف، وإذا كان إيقافه لن يخفض مستوى الطاقة إلى ما دون مستوى التشغيل."

