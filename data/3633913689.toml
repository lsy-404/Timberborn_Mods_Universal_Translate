["ModSetting.TWSimpleWorkshopControl.SingleCycleHeader"]
raw = "This setting adds a button which turns the building on for a single recipe cycle. It also has an option to lock buildings, so pressing the button is the only way they will run.\nThis is intended for use with my Markets mod, where precise control is important.\nBy default, it only works for markets. Checking 'All buildings' will make it available on most other workshops."
status = "normal"
enUS = "This setting adds a button that activates the building for a single recipe cycle. It also has an option to lock buildings, so pressing the button is the only way for them to operate. This is intended for use with my Markets mod, where precise control is important. By default, it only works for markets. Checking 'All buildings' will make it available on most other workshops."
zhCN = "此设置添加了一个按钮，可以让建筑物在单个配方周期内运行。它还有一个锁定建筑物的选项，因此按下按钮是它们运行的唯一方式。\n这旨在与我的市场模组一起使用，在这种情况下，精确控制非常重要。\n默认为仅适用于市场。选中“所有建筑”将使其在大多数其他工坊中可用。"
zhTW = "此設定添加了一個按鈕，可以將建築開啟一個單一食譜循環。它還有一個鎖定建築的選項，因此按下按鈕是它們運行的唯一方式。這是為了與我的市場模組一起使用，精確控制非常重要。默認情況下，它僅適用於市場。勾選「所有建築」將使其在大多數其他工坊中可用。"
ruRU = "Эта настройка добавляет кнопку, которая включает здание на один цикл рецепта. Также есть возможность заблокировать здания, так что нажатие кнопки - это единственный способ их запуска. Это предназначено для использования с моим модом для рынков, где точный контроль важен. По умолчанию это работает только для рынков. Установка галочки 'Все здания' сделает функцию доступной на большинстве других мастерских."
jaJP = "この設定は、建物を単一のレシピサイクルの間オンにするボタンを追加します。また、ボタンを押すことだけで動作するように建物をロックするオプションもあります。これは、正確な制御が重要な私のマーケットモッドと一緒に使用することを目的としています。デフォルトでは、マーケットのみに機能します。「すべての建物」をチェックすると、ほとんどの他の作業場でも利用できるようになります。"
frFR = "Ce paramètre ajoute un bouton qui active le bâtiment pour un seul cycle de recette. Il dispose également d'une option pour verrouiller les bâtiments, de sorte que presser le bouton soit la seule façon de les faire fonctionner. Cela est conçu pour être utilisé avec mon mod Marchés, où un contrôle précis est important. Par défaut, cela ne fonctionne que pour les marchés. Cocher 'Tous les bâtiments' le rendra disponible sur la plupart des autres ateliers."
deDE = "Diese Einstellung fügt einen Button hinzu, der das Gebäude für einen einzelnen Rezeptzyklus einschaltet. Es gibt auch eine Option, um Gebäude zu sperren, sodass das Drücken des Buttons die einzige Möglichkeit ist, wie sie betrieben werden. Dies ist für die Verwendung mit meinem Marktplatz-Mod gedacht, wo präzise Kontrolle wichtig ist. Standardmäßig funktioniert es nur für Märkte. Das Aktivieren von 'Alle Gebäude' macht es in den meisten anderen Werkstätten verfügbar."
plPL = "To ustawienie dodaje przycisk, który włącza budynek na pojedynczy cykl receptury. Zawiera również opcję zablokowania budynków, dzięki czemu naciśnięcie przycisku jest jedynym sposobem, aby zaczęły działać. \nJest to przeznaczone do użytku z moim modem Rynków, gdzie precyzyjna kontrola jest ważna. \nDomyślnie działa tylko dla rynków. Zaznaczenie 'Wszystkie budynki' sprawi, że będzie dostępne w większości innych warsztatów."
ptBR = "Essa configuração adiciona um botão que liga o edifício por um ciclo único de receita. Também há uma opção para bloquear os edifícios, então pressionar o botão é a única maneira de eles funcionarem. Isso é destinado ao uso com meu mod Mercados, onde o controle preciso é importante. Por padrão, funciona apenas para mercados. Marcar 'Todos os edifícios' tornará disponível na maioria das outras oficinas."
koKR = "이 설정은 건물을 단일 레시피 주기로 작동시키는 버튼을 추가합니다. 또한 버튼을 눌러야만 작동하도록 건물을 잠글 수 있는 옵션이 있습니다. 이는 정밀한 제어가 중요한 제 시장 모드와 함께 사용하기 위한 것입니다. 기본적으로 이는 시장에만 작동합니다. '모든 건물'을 선택하면 대부분의 다른 작업장에서도 사용할 수 있습니다."
trTR = "Bu ayar, binayı tek bir tarif döngüsü için açan bir düğme ekler. Ayrıca, binaları kilitleme seçeneği de vardır, bu nedenle düğmeye basmak, onların çalışması için tek yolu olacaktır. Bu, hassas kontrolün önemli olduğu Pazar modumla kullanım için tasarlanmıştır. Varsayılan olarak sadece pazarlar için çalışır. 'Tüm binaları' işaretlemek, bunu çoğu diğer atölyede kullanılabilir hale getirecektir."
esES = "Esta opción añade un botón que enciende el edificio durante un único ciclo de receta. También incluye una opción para bloquear los edificios, de modo que pulsar el botón sea la única forma de que funcionen.\nEstá pensada para usarse con mi mod Markets, donde es importante un control preciso.\nDe forma predeterminada, solo funciona con mercados. Si marcas \"Todos los edificios\", estará disponible en la mayoría de los otros talleres."
itIT = "Questa impostazione aggiunge un pulsante che attiva l'edificio per un singolo ciclo di produzione. Include anche un'opzione per bloccare gli edifici, così premere il pulsante sarà l'unico modo in cui funzioneranno.\nQuesta funzione è pensata per essere usata con il mio mod Markets, dove è importante un controllo preciso.\nIn modo predefinito funziona solo per i mercati. Selezionando \"Tutti gli edifici\" la funzione sarà disponibile per la maggior parte degli altri laboratori."
ukUA = "Ця опція додає кнопку, яка вмикає будівлю на один цикл рецепта. Також є параметр блокування будівель, тому запустити їх можна лише натисканням цієї кнопки.\nЦе призначено для використання з моїм модом Markets, де важливий точний контроль.\nЗа замовчуванням це працює лише для ринків. Якщо позначити «Усі будівлі», кнопка стане доступною для більшості інших майстерень."
thTH = "การตั้งค่านี้จะเพิ่มปุ่มที่เปิดอาคารให้ทำงานเพียงหนึ่งรอบการผลิตของสูตร นอกจากนี้ยังมีตัวเลือกล็อกอาคาร ซึ่งทำให้การกดปุ่มเป็นวิธีเดียวที่อาคารจะทำงานได้\nมอดนี้ตั้งใจให้ใช้ร่วมกับมอด Markets ของฉัน ซึ่งต้องการการควบคุมที่แม่นยำ\nตามค่าเริ่มต้น ปุ่มนี้ใช้ได้เฉพาะกับตลาดเท่านั้น หากเลือก 'All buildings' ปุ่มนี้จะใช้ได้กับโรงงานอื่นส่วนใหญ่ด้วย"
csCZ = "Toto nastavení přidává tlačítko, které zapne budovu na jeden cyklus receptu. Má také možnost zamknout budovy, takže stisknutí tlačítka je jediný způsob, jak budou fungovat. \nToto je určeno k použití s mým módem Trhy, kde je přesná kontrola důležitá. \nVe výchozím nastavení funguje pouze pro trhy. Zaškrtnutí \"Všechny budovy\" jej zpřístupní většině dalších dílen."
viVN = "Thiết lập này thêm một nút bấm để bật công trình cho một chu trình chế biến duy nhất. Nó cũng có một tùy chọn khóa các công trình, để việc nhấn nút là cách duy nhất để chúng hoạt động.\nĐiều này được thiết kế để sử dụng với mod Markets của tôi, nơi kiểm soát chính xác là rất quan trọng.\nTheo mặc định, nó chỉ hoạt động với Markets. Đánh dấu 'Tất cả công trình' sẽ làm cho nó có sẵn trên hầu hết các xưởng khác."
caES = "Aquesta opció afegeix un botó que activa l'edifici durant un únic cicle de recepta. També té una opció per bloquejar els edificis, de manera que prémer el botó és l'única manera que funcionin.\nAixò està pensat per usar-se amb el meu mod Markets, on el control precís és important.\nPer defecte, només funciona per als mercats. Si marqueu \"Tots els edificis\", estarà disponible a la majoria dels altres tallers."
beBY = "Гэтая налада дадае кнопку, якая ўключае будынак на адзін цыкл рэцэпту. Таксама ёсць опцыя блакіроўкі будынкаў, таму будынкі будуць працаваць толькі пасля націску кнопкі.\nГэта прызначана для выкарыстання з маім модам Markets, дзе важны дакладны кантроль.\nПа змаўчанні яна працуе толькі для рынкаў. Калі паставіць адзнаку «All buildings», кнопка стане даступнай на большасці іншых майстэрань."
roRO = "Această setare adaugă un buton care pornește clădirea pentru un singur ciclu de rețetă. Are și o opțiune de blocare a clădirilor, astfel încât apăsarea butonului este singurul mod în care acestea vor funcționa.\nEste destinată utilizării împreună cu modul meu Markets, unde controlul precis este important.\nImplicit, funcționează doar pentru piețe. Bifarea opțiunii „All buildings” o va face disponibilă pentru majoritatea celorlalte ateliere."
huHU = "Ez a beállítás egy gombot ad hozzá, amellyel az épületet egyetlen receptciklusra be lehet kapcsolni. Van benne egy zárolási lehetőség is, így az épületek csak a gomb megnyomására fognak működni.\nEzt elsősorban a Markets modommal való használatra szántam, ahol a pontos vezérlés fontos.\nAlapértelmezés szerint csak piacoknál működik. Ha bejelöli az „Összes épület” opciót, a gomb a legtöbb más műhelyen is elérhető lesz."
arSA = "هذا الإعداد يضيف زرًا يشغّل المبنى لدورة إنتاج واحدة فقط. كما يتضمن خيارًا لقفل المباني، بحيث يكون الضغط على الزر الطريقة الوحيدة لتشغيلها.\nهذا الخيار مخصص للاستخدام مع مود \"Markets\" الخاص بي، حيث يكون التحكم الدقيق مهمًا.\nافتراضيًا، يعمل هذا الخيار للأسواق فقط. وعند تفعيل \"All buildings\" سيصبح متاحًا لمعظم ورش العمل الأخرى."

