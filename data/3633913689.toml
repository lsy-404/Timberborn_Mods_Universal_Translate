zhCN = "<b><YellowHighlight>单次循环按钮已被按下。建筑将在配方完成之前保持激活，或按下单次循环取消按钮。所有其他设置将被忽略。</YellowHighlight></b>"
zhTW = "<b><YellowHighlight>已按下單次循環按鈕。建築物將保持啟用狀態，直到配方完成或按下單次循環取消按鈕。其他設定將被忽略。</YellowHighlight></b>"
ruRU = "<b><YellowHighlight>Кнопка однократного цикла была нажата. Здание останется активным до тех пор, пока не завершится рецепт или не будет нажата кнопка отмены однократного цикла. Все остальные настройки будут проигнорированы.</YellowHighlight></b>"
jaJP = "<b><YellowHighlight>単発サイクルボタンが押されました。建物はレシピが完了するまで、または単発サイクルキャンセルボタンが押されるまで稼働を続けます。その他の設定はすべて無視されます。</YellowHighlight></b>"
frFR = "<b><YellowHighlight>Le bouton à cycle unique a été appuyé. Le bâtiment restera actif jusqu'à ce qu'une recette se termine ou que le bouton d'annulation du cycle unique soit appuyé. Tous les autres réglages seront ignorés.</YellowHighlight></b>"
deDE = "<b><YellowHighlight>Eine Einzelzyklus-Taste wurde gedrückt. Das Gebäude bleibt aktiv, bis ein Rezept abgeschlossen ist oder die Einzelzyklus-Abbruchtaste gedrückt wird. Alle anderen Einstellungen werden ignoriert.</YellowHighlight></b>"
plPL = "<b><YellowHighlight>Przycisk pojedynczego cyklu został naciśnięty. Budynek pozostanie aktywny do momentu zakończenia przepisu lub do naciśnięcia przycisku anulowania pojedynczego cyklu. Wszystkie inne ustawienia zostaną zignorowane.</YellowHighlight></b>"
ptBR = "<b><YellowHighlight>O botão de ciclo único foi pressionado. A edificação permanecerá ativa até que uma receita seja concluída ou até que o botão de cancelamento do ciclo único seja pressionado. Todas as outras configurações serão ignoradas.</YellowHighlight></b>"
koKR = "<b><YellowHighlight>단일 사이클 버튼이 눌렸습니다. 레시피가 완료될 때까지 건물이 활성 상태를 유지합니다. 단일 사이클 취소 버튼이 눌리면 활성 상태가 해제됩니다. 다른 모든 설정은 무시됩니다.</YellowHighlight></b>"
trTR = "<b><YellowHighlight>Tek döngü butonuna basıldı. Bina, bir tarif tamamlanana veya tek döngü iptal butonuna basılana kadar aktif kalacaktır. Diğer tüm ayarlar göz ardı edilecektir.</YellowHighlight></b>"
esES = "<b><YellowHighlight>Se ha pulsado el botón de ciclo único. El edificio permanecerá activo hasta que se complete una receta o se pulse el botón de cancelar ciclo único. Todos los demás ajustes se ignorarán.</YellowHighlight></b>"
itIT = "<b><YellowHighlight>È stato premuto il pulsante a ciclo singolo. L'edificio resterà attivo finché una ricetta non sarà completata o non verrà premuto il pulsante di annullamento del ciclo singolo. Tutte le altre impostazioni verranno ignorate.</YellowHighlight></b>"
ukUA = "<b><YellowHighlight>Натиснуто кнопку одноциклового режиму. Будівля залишатиметься активною, доки не завершиться рецепт або не буде натиснуто кнопку скасування одноциклового режиму. Усі інші налаштування ігноруватимуться.</YellowHighlight></b>"
thTH = "<b><YellowHighlight>ปุ่มรอบเดียวถูกกดแล้ว อาคารจะยังคงทำงานต่อไปจนกว่าสูตรการผลิตจะเสร็จสิ้น หรือกดปุ่มยกเลิกรอบเดียว การตั้งค่าอื่นทั้งหมดจะถูกละเว้น</YellowHighlight></b>"
csCZ = "<b><YellowHighlight>Jednorázové tlačítko bylo stisknuto. Budova zůstane aktivní, dokud nedojde k dokončení receptu, nebo dokud nebude stisknuto tlačítko pro zrušení jednorázového cyklu. Ostatní nastavení budou ignorována.</YellowHighlight></b>"
viVN = "<b><YellowHighlight>Xưởng sẽ vẫn hoạt động cho đến khi một công thức hoàn tất hoặc nút hủy chu kỳ đơn được nhấn. Tất cả thiết lập khác sẽ bị bỏ qua.</YellowHighlight></b>"
caES = "<b><YellowHighlight>S'ha premut el botó de cicle únic. L'edifici romandrà actiu fins que es completi una recepta o es premi el botó de cancel·lació del cicle únic. Tots els altres ajustos s'ignoraran.</YellowHighlight></b>"
beBY = "<b><YellowHighlight>Была натиснута кнопка аднаго цыкла. Будынак застанецца актыўным, пакуль не будзе завершаны рэцэпт або не будзе націснута кнопка скасавання аднаго цыкла. Усе іншыя налады будуць ігнаравацца.</YellowHighlight></b>"
roRO = "<b><YellowHighlight>Butonul de ciclu unic a fost apăsat. Clădirea va rămâne activă până când o rețetă se finalizează sau până când este apăsat butonul de anulare a ciclului unic. Toate celelalte setări vor fi ignorate.</YellowHighlight></b>"
huHU = "<b><YellowHighlight>Az egyciklusos gomb meg lett nyomva. Az épület aktív marad, amíg egy recept be nem fejeződik, vagy amíg meg nem nyomják az egyciklusos megszakító gombot. Minden más beállítás figyelmen kívül lesz hagyva.</YellowHighlight></b>"
arSA = "<b><YellowHighlight>تم الضغط على زر الدورة الواحدة. سيبقى المبنى نشطًا حتى يكتمل وصفة ما أو يتم الضغط على زر إلغاء الدورة الواحدة. سيتم تجاهل جميع الإعدادات الأخرى.</YellowHighlight></b>"

