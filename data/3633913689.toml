["ModSetting.TWSimpleWorkshopControl.AutoIngredientsZeroCapMultiplierDesc"]
raw = "When there is no storage capacity for a resource, auto ingredients will check available stock against the recipe amount multipled by this number (rather than against a percentage of storage capacity)."
status = "normal"
enUS = "When there is no storage capacity for a resource, auto ingredients will check available stock against the recipe amount multiplied by this number (rather than against a percentage of storage capacity)."
zhCN = "“当没有资源存储容量时，自动材料将根据配方数量乘以该数字检查可用库存（而不是根据存储容量的百分比进行检查）。”"
zhTW = "當資源沒有儲存容量時，自動原料將根據這個數字（而不是根據儲存容量的百分比）檢查可用庫存是否符合食譜數量的倍數。"
ruRU = "Когда нет емкости для хранения ресурса, автоингредиенты будут проверять доступные запасы по отношению к количеству рецепта, умноженному на это число (вместо процента от емкости хранения)."
jaJP = "リソースの保管容量がない場合、自動材料はレシピの量にこの数値を掛けたものに対して利用可能な在庫をチェックします（ストレージ容量のパーセンテージに対してではなく）。"
frFR = "Lorsqu'il n'y a pas de capacité de stockage pour une ressource, les ingrédients automatiques vérifieront le stock disponible par rapport à la quantité de la recette multipliée par ce chiffre (plutôt que par rapport à un pourcentage de la capacité de stockage)."
deDE = "Wenn keine Lagerkapazität für eine Ressource vorhanden ist, überprüfen die automatischen Zutaten den verfügbaren Bestand im Verhältnis zur Rezeptmenge multipliziert mit dieser Zahl (anstatt im Verhältnis zu einem Prozentsatz der Lagerkapazität)."
plPL = "Kiedy nie ma pojemności magazynowej dla surowca, automatyczne składniki będą sprawdzać dostępny zapas w odniesieniu do ilości przepisu pomnożonej przez tę liczbę (zamiast w odniesieniu do procentu pojemności magazynu)."
ptBR = "Quando não há capacidade de armazenamento para um recurso, os ingredientes automáticos verificarão o estoque disponível em relação à quantidade da receita multiplicada por este número (em vez de em relação a uma porcentagem da capacidade de armazenamento)."
koKR = "자원에 대한 저장 용량이 없을 때, 자동 재료는 해당 숫자와 곱해진 레시피 양에 대해 사용 가능한 재고를 확인합니다(저장 용량의 백분율에 대해 확인하는 것이 아닙니다)."
trTR = "Bir kaynak için depolama kapasitesi olmadığında, otomatik malzemeler mevcut stokları bu sayı ile çarpılan tarif miktarına karşı kontrol edecektir (depolama kapasitesinin yüzdesine karşı değil)."
esES = "Cuando no hay capacidad de almacenamiento para un recurso, los ingredientes automáticos comprobarán el stock disponible frente a la cantidad de la receta multiplicada por este número (en lugar de frente a un porcentaje de la capacidad de almacenamiento)."
itIT = "Quando non c'è capacità di stoccaggio per una risorsa, gli ingredienti automatici verificheranno le scorte disponibili rispetto alla quantità della ricetta moltiplicata per questo numero (anziché rispetto a una percentuale della capacità di stoccaggio)."
ukUA = "Коли для ресурсу немає місткості сховища, авто-інгредієнти перевірятимуть наявний запас щодо кількості за рецептом, помноженої на це число (а не на відсоток від місткості сховища)."
thTH = "เมื่อไม่มีความจุการจัดเก็บสำหรับทรัพยากรใด ส่วนผสมอัตโนมัติจะตรวจสอบสต็อกที่มีอยู่เทียบกับปริมาณในสูตรคูณด้วยตัวเลขนี้ (แทนที่จะเทียบกับเปอร์เซ็นต์ของความจุการจัดเก็บ)"
csCZ = "Když není storage capacity pro zdroj, automatické ingredience zkontrolují dostupný zásobník oproti množství receptu vynásobenému tímto číslem (spíše než proti procentuálnímu podílu skladovací kapacity)."
viVN = "Khi không còn dung lượng lưu trữ cho một nguồn tài nguyên, nguyên liệu tự động sẽ so sánh số lượng có sẵn trong kho với lượng theo công thức được nhân với con số này (thay vì so với một phần trăm dung lượng lưu trữ)."
caES = "Quan no hi ha capacitat d'emmagatzematge per a un recurs, els ingredients automàtics comprovaran l'estoc disponible segons la quantitat de la recepta multiplicada per aquest número (en lloc de per un percentatge de la capacitat d'emmagatzematge)."
beBY = "Калі для рэсурсу няма ёмістасці захоўвання, аўтаматычныя інгрэдыенты будуць правяраць наяўны запас у параўнанні з колькасцю па рэцэпце, памножанай на гэты лік (а не на працэнт ад ёмістасці захоўвання)."
roRO = "Când nu există capacitate de stocare pentru o resursă, ingredientele automate vor verifica stocul disponibil în raport cu cantitatea din rețetă înmulțită cu acest număr (în loc să verifice în raport cu un procentaj din capacitatea de stocare)."
huHU = "Ha nincs tárolókapacitás egy erőforráshoz, az automatikus alapanyagok a meglévő készletet a recept mennyiségének és ennek a számnak a szorzatához hasonlítják (nem pedig a tárolókapacitás egy százalékához)."
arSA = "عندما لا تكون هناك سعة تخزين لمورد ما، ستتحقق خانة المكونات التلقائية من المخزون المتاح مقارنةً بكمية الوصفة مضروبةً في هذا الرقم (بدلاً من مقارنته بنسبة مئوية من سعة التخزين)."

