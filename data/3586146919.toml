["LV.BL.BeavlineBalancerDesc"]
raw = "Automatically evens out goods of the same type across all connected storages. Works independently from Beavline Input and Output. It runs every hour with no limit on the amount of goods moved."
status = "normal"
enUS = "Automatically evens out goods of the same type across all connected storages. Works independently from Beavline Input and Output. It runs every hour with no limit on the amount of goods moved."
zhCN = "自动在所有连接的仓库之间平衡相同类型的物品。独立于Beavline输入和输出。每小时运行一次，移动物品的数量没有限制。"
zhTW = "自動平衡所有連接儲存中相同類型的貨物。與 Beavline 輸入和輸出獨立運行。每小時進行一次，且移動的貨物數量不受限制。"
ruRU = "Автоматически выравнивает товары одного типа во всех связанных складах. Работает независимо от ввода и вывода Beavline. Срабатывает каждый час и нет ограничения на количество перемещаемых товаров."
jaJP = "同種の物品をすべての接続された倉庫に自動的に均等に分配します。ビーバーラインの入力および出力から独立して動作します。毎時実行され、移動できる物品の量に制限はありません。"
frFR = "Égalise automatiquement les biens du même type dans tous les entrepôts connectés. Fonctionne indépendamment de l'entrée et de la sortie Beavline. Cela fonctionne chaque heure sans limite sur la quantité de biens déplacés."
deDE = "Automatische Gleichmäßigkeit von Waren desselben Typs über alle verbundenen Lager. Funktioniert unabhängig von Beavline Eingabe und Ausgabe. Es läuft jede Stunde, ohne Begrenzung für die Menge der bewegten Waren."
plPL = "Automatycznie wyrównuje towary tego samego typu we wszystkich połączonych magazynach. Działa niezależnie od wejścia i wyjścia Beavline. Działa co godzinę bez limitu na ilość przenoszonych towarów."
ptBR = "Equilibra automaticamente os bens do mesmo tipo em todos os armazéns conectados. Funciona independentemente da Entrada e Saída Beavline. Ele é executado a cada hora sem limite na quantidade de bens movidos."
koKR = "연결된 모든 저장소에서 같은 종류의 물품을 자동으로 균형을 맞춥니다. Beavline 입출력과는 독립적으로 작동합니다. 매 시간마다 실행되며 이동할 수 있는 물품의 양에 제한이 없습니다."
trTR = "Bağlı depolar arasında aynı tür malları otomatik olarak dengeler. Beavline Giriş ve Çıkışından bağımsız olarak çalışır. Taşınan mal miktarı üzerinde bir sınır olmaksızın her saat çalışır."
esES = "Equilibra automáticamente los bienes del mismo tipo entre todos los almacenes conectados. Funciona de forma independiente de Beavline Input y Output. Se ejecuta cada hora, sin límite en la cantidad de bienes movidos."
itIT = "Bilancia automaticamente i beni dello stesso tipo tra tutti i magazzini collegati. Funziona in modo indipendente da Beavline Input e Output. Viene eseguita ogni ora, senza alcun limite alla quantità di beni spostati."
ukUA = "Автоматично вирівнює кількість товарів одного типу у всіх підключених складах. Працює незалежно від Beavline Input і Output. Виконується щогодини без обмеження на кількість переміщуваних товарів."
thTH = "ปรับสมดุลสินค้าชนิดเดียวกันระหว่างคลังเก็บทั้งหมดที่เชื่อมต่ออยู่โดยอัตโนมัติ ทำงานแยกจาก Beavline Input และ Output ทำงานทุกหนึ่งชั่วโมง โดยไม่จำกัดปริมาณสินค้าที่ถูกย้าย"
csCZ = "Automaticky vyrovnává zboží stejného typu ve všech připojených skladech. Pracuje nezávisle na Beavline Input a Output. Funguje každou hodinu bez omezení na množství přesunutého zboží."
viVN = "Tự động cân bằng số lượng hàng hóa cùng loại giữa tất cả các kho được kết nối. Hoạt động độc lập với Beavline Input và Beavline Output. Chạy mỗi giờ mà không giới hạn số lượng hàng được vận chuyển."
caES = "Equilibra automàticament els béns del mateix tipus entre tots els magatzems connectats. Funciona de manera independent de l'Entrada i la Sortida de Beavline. S'executa cada hora sense cap límit en la quantitat de béns que es mouen."
beBY = "Аўтаматычна выроўвае колькасць тавараў аднаго тыпу ва ўсіх падключаных складах. Працуе незалежна ад уваходу і выхаду Beavline. Выконваецца кожную гадзіну без абмежавання на колькасць перамешчаных тавараў."
roRO = "Egalizează automat bunurile de același tip între toate depozitele conectate. Funcționează independent de Beavline Input și Output. Rulează în fiecare oră, fără limită la cantitatea de bunuri mutate."
huHU = "Automatikusan egyenletesen elosztja az azonos típusú árukat az összes csatlakoztatott raktár között. Függetlenül működik a Beavline bemenettől és kimenettől. Óránként fut, és a mozgatott áruk mennyiségére nincs korlát."
arSA = "يقوم تلقائيًا بموازنة الكميات من السلع من النوع نفسه عبر جميع المخازن المتصلة. يعمل بشكل مستقل عن مدخلات ومخرجات Beavline. يعمل كل ساعة دون أي حد لكمية السلع المنقولة."

