[_meta]
name = "DecoWorks"

["DecoWorks.Description"]
new = "Cosmetic decoration. Place beside a path on ground or a platform; no wellbeing bonus."
status = "normal"

["DecoWorks.Arch.Description"]
new = "Three tiles wide. Both outer posts require support; the center tile is clear for a separate path. No wellbeing bonus."
status = "normal"

["DecoWorks.Bench.Description"]
new = "A resting place for two beavers. Connect the front entrance to a path."
status = "normal"

["DecoWorks.Market.Description"]
new = "Decorative market display. Does not employ beavers, produce goods or provide storage."
status = "normal"

["DecoWorks.Edging.Description"]
new = "Low connecting border. Place on its own ground or platform tiles beside a path; matching finishes join automatically."
status = "normal"

["DecoWorks.Props.Description"]
new = "Decorative prop only; no storage, fishing or district-management function."
status = "normal"

