["LV.Cr.CraneDesc"]
raw = "A stationary builder. The builder works from inside and reaches surrounding construction sites. It can build, demolish and gather rubble. Can be expanded upwards with more Crane Sections."
status = "normal"
enUS = "A stationary builder. The builder works from inside and reaches surrounding construction sites. It can build, demolish, and gather rubble. Can be expanded upwards with more Crane Sections."
zhCN = "一座静止不动的建筑工。建筑工从内部工作，能够覆盖周围的建筑工地。它可以建造、拆除和收集碎石。可以通过增加更多的起重机部分向上扩展。"
zhTW = "一個固定的建築機。建築機從內部工作，能夠到達周圍的建築工地。它可以建造、拆除並收集瓦礫。可以通過增加更多的起重機部件向上擴展。"
ruRU = "Стационарный строитель. Строитель работает изнутри и достигает окружающих строительных площадок. Он может строить, сносить и собирать rubble. Может быть расширен вверх с помощью дополнительных секций крана."
jaJP = "静止型の建設機。建設機は内部から作業し、周囲の建設現場に到達します。建設、解体、ゴミの収集が可能です。クレーンセクションを追加することで、上方に拡張できます。"
frFR = "Un constructeur stationnaire. Le constructeur travaille de l'intérieur et atteint les chantiers environnants. Il peut construire, démolir et ramasser des débris. Peut être étendu vers le haut avec plus de sections de grue."
deDE = "Ein stationärer Bauarbeiter. Der Bauarbeiter arbeitet von innen und erreicht die umliegenden Baustellen. Er kann bauen, abreißen und Schutt sammeln. Kann nach oben mit weiteren Kranabschnitten erweitert werden."
plPL = "Stacjonarny budowniczy. Budowniczy pracuje z wnętrza i dociera do okolicznych placów budowy. Może budować, burzyć i zbierać gruz. Może być rozbudowywany w górę o dodatkowe sekcje dźwigu."
ptBR = "Um construtor estacionário. O construtor trabalha de dentro e alcança os locais de construção ao redor. Pode construir, demolir e coletar entulho. Pode ser expandido para cima com mais Seções de Guindaste."
koKR = "정지된 건축기. 건축기는 내부에서 작업하며 주변 건설 현장에 도달합니다. 건축, 철거 및 잔해를 수집할 수 있습니다. 더 많은 크레인 섹션으로 수직으로 확장할 수 있습니다."
csCZ = "Stacionární stavitel. Stavitel pracuje zevnitř a dosahuje k okolním stavebním místům. Může stavět, bourat a sbírat suť. Lze rozšiřovat nahoru o další sekce jeřábu."
viVN = "Một người xây dựng tĩnh. Người xây dựng làm việc từ bên trong và với tới các công trường xung quanh. Nó có thể xây dựng, phá dỡ và thu gom đống đổ nát. Có thể mở rộng lên trên với nhiều phần Cần Cẩu hơn."
trTR = "Statik bir inşaat makinesi. İnşaat makinesi, iç kısmından çalışır ve çevresindeki inşaat alanlarına ulaşır. İnşa edebilir, yıkım yapabilir ve moloz toplayabilir. Daha fazla Kran Bölümü ile yukarıya doğru genişletilebilir."

["LV.Cr.CraneFlavor"]
raw = "Apparently the hoomans used a giant bird for this job. Ours doesn't need feeding."
status = "normal"
enUS = "Apparently, the humans used a giant bird for this job. Ours doesn't need feeding."
zhCN = "“显然，人类用一只巨大的鸟来完成这个工作。我们的不需要喂养。”"
zhTW = "顯然，人類曾經用一隻巨鳥來完成這項工作。我們的則不需要餵食。"
ruRU = "Похоже, люди использовали гигантскую птицу для этой работы. Наша не нуждается в кормлении."
jaJP = "「どうやら人間はこの仕事に巨大な鳥を使っていたようです。私たちのものは餌を必要としません。」"
frFR = "Apparemment, les humains utilisaient un oiseau géant pour ce travail. Le nôtre n'a pas besoin d'être nourri."
deDE = "„Offenbar haben die Hoomans einen riesigen Vogel für diesen Job verwendet. Unserer braucht kein Futter.“"
plPL = "Podobno hoomans używali dużego ptaka do tej pracy. Nasz nie potrzebuje karmienia."
ptBR = "Aparentemente, os hoomans usavam um pássaro gigante para esse trabalho. O nosso não precisa de comida."
koKR = "분명히 인간들은 이 작업을 위해 거대한 새를 사용했습니다. 우리의 것은 먹이를 필요로 하지 않습니다."
csCZ = "Zřejmě lidé používali obrovského ptáka na tuto práci. Náš se krmení nevyžaduje."
viVN = "Có vẻ như bọn người đã sử dụng một con chim khổng lồ cho công việc này. Còn của chúng ta thì không cần phải cho ăn."
trTR = "Görünüşe göre insanlar bu iş için dev bir kuş kullandı. Bizimkine beslenmesine gerek yok."

