["LV.Cr.CraneSectionDesc"]
raw = "Extends a Crane upward. Placed from a base Crane. Fully refunded when destroyed."
status = "normal"
enUS = "Extends a Crane upward. Placed from a base Crane. Fully refunded when destroyed."
zhCN = "“向上延伸起重机。从基础起重机放置。被摧毁时全额退款。”"
zhTW = "將起重機向上延伸。從基礎起重機安裝。摧毀時全額退款。"
ruRU = "Увеличивает высоту крана. Устанавливается на базе крана. Полностью возмещается при разрушении."
jaJP = "クレーンを上に延長します。ベースクレーンから設置されます。破壊された場合は全額返金されます。"
frFR = "Prolonge une grue vers le haut. Placée depuis une grue de base. Remboursée intégralement lorsqu'elle est détruite."
deDE = "Erweitert einen Kran nach oben. Von einem Basis-Kran aus platziert. Vollständig zurückerstattet, wenn er zerstört wird."
plPL = "Rozszerza Żurawia w górę. Umieszczany na podstawie Żurawia. W pełni zwracany po zniszczeniu."
ptBR = "Estende um Guindaste para cima. Colocado a partir de um Guindaste base. Totalmente reembolsado quando destruído."
koKR = "크레인 위로 확장합니다. 기본 크레인에서 배치됩니다. 파괴되면 전액 환불됩니다."
csCZ = "Rozšiřuje jeřáb nahoru. Umístěno z základního jeřábu. Plně vráceno při zničení."
viVN = "Mở rộng cần cẩu lên trên. Đặt từ một cần cẩu cơ bản. Hoàn lại đầy đủ khi bị phá hủy."
trTR = "Bir Crane'i yukarıya uzatır. Bir temel Crane'den yerleştirilir. Yok edildiğinde tamamen geri ödenir."

