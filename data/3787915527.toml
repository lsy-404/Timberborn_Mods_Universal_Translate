ruRU = "Для изобретения Железных Зубов это действительно ободряюще."
jaJP = "「アイアンティースの発明としては、本当に高揚感があります。」"
frFR = "Pour une invention Dent de Fer, c'est vraiment réjouissant."
deDE = "Für eine Erfindung der Eisenzähne ist es wirklich ermutigend."
plPL = "Jak na wynalazek Żelaznych Zębów, to naprawdę podnosi na duchu."
ptBR = "Para uma invenção dos Dentes de Ferro, é realmente inspirador."
koKR = "철 이빨의 발명으로서 정말 고양됩니다."
csCZ = "Pro vynález Železných zubů je to opravdu povzbudivé."
viVN = "Đối với một phát minh của Răng Sắt, đây thực sự là một điều phấn chấn."
