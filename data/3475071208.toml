["LV.CLt.BotLifeMulDesc"]
raw = "Bots' deterioration is multiplied by this value, similar to a \"Life expectancy\" bonus.\nNote: higher is harder as bots will deteriorate faster.\nSetting to 0 means bots will never deteriorate."
status = "normal"
enUS = "Bots' deterioration is multiplied by this value, similar to a \"Life expectancy\" bonus.\nNote: higher is harder as bots will deteriorate faster.\nSetting to 0 means bots will never deteriorate."
zhCN = "可以将机关人的毁坏速度更改为原本的N倍，使其更快毁坏，设为0则永不毁坏。"
zhTW = "機器人的衰退速度會乘以這個數值，類似於「壽命預期」的獎勵。\n注意：數值越高，難度越大，因為機器人會更快衰退。\n設定為0則意味著機器人將永遠不會衰退。"
ruRU = "Ухудшение ботов умножается на это значение, аналогично бонусу \"Ожидаемая продолжительность жизни\". Примечание: чем выше значение, тем сложнее, так как боты будут ухудшаться быстрее. Установка значения 0 означает, что боты никогда не будут ухудшаться."
jaJP = "ボットの劣化は、この値によって倍増されます。これは「寿命ボーナス」のようなものです。\n注：値が高いほど、ボットはより早く劣化します。\n0に設定すると、ボットは決して劣化しません。"
frFR = "La détérioration des bots est multipliée par cette valeur, similaire à un bonus de \"Espérance de vie\". Remarque : plus la valeur est élevée, plus il est difficile, car les bots se détérioreront plus rapidement. Un réglage à 0 signifie que les bots ne se détérioreront jamais."
deDE = "Die Verschlechterung der Bots wird mit diesem Wert multipliziert, ähnlich einem \"Lebensdauer\"-Bonus. Hinweis: Höher bedeutet schwieriger, da die Bots schneller deteriorieren. Eine Einstellung auf 0 bedeutet, dass die Bots sich niemals verschlechtern werden."
plPL = "Degradacja botów jest mnożona przez tę wartość, podobnie jak bonus do \"oczekiwanej długości życia\". \nUwaga: wyższa wartość oznacza większą trudność, ponieważ boty będą się degradować szybciej. \nUstawienie na 0 oznacza, że boty nigdy się nie zepsują."
ptBR = "A deterioração dos robôs é multiplicada por este valor, semelhante a um bônus de \"Expectativa de vida\".  \nNota: quanto maior, mais difícil, pois os robôs irão se deteriorar mais rapidamente.  \nDefinir para 0 significa que os robôs nunca se deteriorarão."
koKR = "봇의 소멸 속도가 이 값에 의해 곱해지며, 이는 '기대 수명' 보너스와 유사합니다.  \n참고: 값이 높을수록 어려워지며, 봇이 더 빨리 소멸합니다.  \n0으로 설정하면 봇은 절대 소멸하지 않습니다."
trTR = "Robotların bozulması bu değerle çarpılır, \"Yaşam beklentisi\" bonusuna benzer. Daha yüksek ayar, robotların daha hızlı bozulacağı anlamına geldiği için daha zordur. 0'a ayarlamak, robotların asla bozulmayacağı anlamına gelir."
esES = "Esta multiplicación afecta el deterioro de los robots, de forma similar a un bonificador de \"Esperanza de vida\".\nNota: un valor mayor hace el juego más difícil, ya que los robots se deterioran más rápido.\nSi se establece en 0, los robots nunca se deteriorarán."
itIT = "Il deterioramento dei bot viene moltiplicato per questo valore, in modo simile a un bonus di \"Aspettativa di vita\".\nNota: un valore più alto rende il gioco più difficile, poiché i bot si deterioreranno più velocemente.\nImpostando il valore a 0, i bot non si deterioreranno mai."
ukUA = "Зношування ботів множиться на це значення, подібно до бонусу «Очікувана тривалість життя».\nПримітка: чим вище значення, тим складніше, оскільки боти зношуватимуться швидше.\nВстановлення значення 0 означає, що боти ніколи не зношуватимуться."
thTH = "ความเสื่อมสภาพของบอตจะถูกคูณด้วยค่านี้ คล้ายกับโบนัส \"อายุขัย\"\nหมายเหตุ: ค่าที่สูงขึ้นจะยากขึ้น เพราะบอตจะเสื่อมสภาพเร็วขึ้น\nการตั้งค่าเป็น 0 หมายความว่าบอตจะไม่เสื่อมสภาพเลย"
csCZ = "Zhoršení robotů je násobeno touto hodnotou, podobně jako bonus \"Očekávaná délka života\".\nPoznámka: čím vyšší, tím obtížnější, protože roboty budou zhoršovat rychleji.\nNastavení na 0 znamená, že roboty se nikdy nebudou zhoršovat."
viVN = "Sự xuống cấp của các bot được nhân lên bởi giá trị này, tương tự như một lợi ích về 'tuổi thọ'.\nLưu ý: giá trị càng cao càng khó khăn vì các bot sẽ xuống cấp nhanh hơn.\nĐặt ở mức 0 có nghĩa là các bot sẽ không xuống cấp."
caES = "La degradació dels bots es multiplica per aquest valor, de manera similar a un bonus de \"Esperança de vida\".\nNota: com més alt, més difícil, ja que els bots es degradaran més ràpidament.\nSi ho establiu a 0, els bots no es degradaran mai."
beBY = "Пашкоджанне батоў памнажаецца на гэта значэнне, падобна да бонусу «Працягласць жыцця».\nЗаўвага: чым вышэйшае значэнне, тым цяжэй, бо боты будуць псавацца хутчэй.\nУстаноўка на 0 азначае, што боты ніколі не будуць псавацца."
roRO = "Deteriorarea roboților este înmulțită cu această valoare, similar unui bonus de „Speranță de viață\".\nNotă: o valoare mai mare înseamnă dificultate mai mare, deoarece roboții se vor deteriora mai repede.\nSetarea la 0 înseamnă că roboții nu se vor deteriora niciodată."
huHU = "A botok romlásának sebességét ez az érték szorozza meg, hasonlóan a „Várható élettartam” bónuszhoz.\nMegjegyzés: magasabb érték nehezebb, mivel a botok gyorsabban romlanak.\nA 0-ra állítás azt jelenti, hogy a botok soha nem romlanak le."
arSA = "يُضرب تدهور الروبوتات في هذه القيمة، على غرار مكافأة \"متوسط العمر المتوقع\".\nملاحظة: كلما ارتفعت القيمة زادت الصعوبة، لأن الروبوتات ستتدهور بسرعة أكبر.\nضبط القيمة على 0 يعني أن الروبوتات لن تتدهور أبداً."
