["LV.CLt.ChildhoodDaysMulDesc"]
raw = "Children Beavers' childhood growth is multiplied by this value, similar to a \"Growth speed\" bonus.\nNote: higher is easier as young beavers will grow faster.\nSetting to 0 means children will never grow."
status = "normal"
enUS = "Children Beavers' childhood growth is multiplied by this value, similar to a \"Growth speed\" bonus.\nNote: higher is easier as young beavers will grow faster.\nSetting to 0 means children will never grow."
zhCN = "可以将幼年海狸的成长速度更改为原本的N倍，使其更快成长，设为0则永不成长。"
zhTW = "小兒童海狸的成長速度會乘以這個值，類似於一個「成長速度」的獎勵。  \n注意：較高的數值會使年輕的海狸成長得更快。  \n設置為 0 意味著小孩將永遠不會成長。"
ruRU = "Рост детёнышей бобров умножается на это значение, подобно бонусу «Скорость роста». Примечание: чем выше значение, тем легче, так как молодые бобры будут расти быстрее. Установка значения на 0 означает, что детёныши никогда не будут расти."
jaJP = "子ビーバーの成長は、この値によって倍増されます。これは「成長速度」ボーナスに似ています。\n注意：値が高いほど、若いビーバーはより速く成長します。\n0に設定すると、子供は決して成長しません。"
frFR = "La croissance de l'enfance des castors est multipliée par cette valeur, semblable à un bonus de \"vitesses de croissance\". Note : plus la valeur est élevée, plus il est facile pour les jeunes castors de grandir rapidement. Un réglage à 0 signifie que les enfants ne grandiront jamais."
deDE = "Die Kindheit von Bibern wird mit diesem Wert multipliziert, ähnlich einem \"Wachstumsgeschwindigkeits\"-Bonus. Hinweis: Höhere Werte erleichtern es, da junge Biber schneller wachsen. Eine Einstellung auf 0 bedeutet, dass Kinder niemals wachsen werden."
plPL = "Wzrost dzieci bobrów jest mnożony przez tę wartość, podobnie jak bonus \"szybkości wzrostu\".  \nUwaga: wyższa wartość oznacza, że młodsze bobry będą rosły szybciej.  \nUstawienie na 0 oznacza, że dzieci nigdy nie urosną."
ptBR = "O crescimento da infância dos Castores é multiplicado por este valor, semelhante a um bônus de \"velocidade de crescimento\".  \nNota: quanto maior o valor, mais fácil será, pois os jovens castores crescerão mais rápido.  \nDefinir para 0 significa que as crianças nunca crescerão."
koKR = "어린 비버의 성장률은 이 값에 의해 배가 되며, 이는 '성장 속도' 보너스와 유사합니다. \n참고: 수치가 높을수록 어린 비버들이 더 빨리 성장하게 됩니다. \n0으로 설정하면 어린 비버는 절대 성장하지 않습니다."
trTR = "Çocuk Koyunlarının çocukluk büyümesi bu değerin katı ile çarpılır, bu da bir \"Büyüme hızı\" bonusuna benzer. \nNot: Daha yüksek değerler, genç bebek koyunlarının daha hızlı büyümesini sağlar. \n0 olarak ayarlamak, çocukların asla büyümeyeceği anlamına gelir."
esES = "Este valor multiplica el crecimiento de la infancia de los castores jóvenes, de forma similar a un bonificador de \"Velocidad de crecimiento\".\nNota: un valor más alto es más fácil, ya que los castores jóvenes crecerán más rápido.\nSi se establece en 0, los niños nunca crecerán."
itIT = "Questo valore moltiplica la crescita dei Castori bambini durante l'infanzia, in modo simile a un bonus \"Velocità di crescita\".\nNota: un valore più alto rende le cose più facili, perché i giovani castori cresceranno più velocemente.\nImpostando il valore a 0, i bambini non cresceranno mai."
ukUA = "Цей множник застосовується до тривалості дитинства бобрів, подібно до бонусу «Швидкість росту».\nПримітка: чим вище значення, тим легше, оскільки молоді бобри ростуть швидше.\nЯкщо встановити 0, діти ніколи не підростуть."
thTH = "ค่านี้จะคูณระยะเวลาวัยเด็กของบีเวอร์ลูก คล้ายกับโบนัส \"ความเร็วในการเติบโต\"\nหมายเหตุ: ค่าที่สูงขึ้นจะง่ายขึ้น เพราะบีเวอร์วัยเยาว์จะเติบโตเร็วขึ้น\nการตั้งค่าเป็น 0 หมายความว่าลูกบีเวอร์จะไม่เติบโตเลย"
csCZ = "Dětská růstová míra bobrů se násobí touto hodnotou, podobně jako bonus k „růstové rychlosti“. \nPoznámka: vyšší hodnota usnadňuje, protože mladí bobři porostou rychleji. \nNastavení na 0 znamená, že děti nikdy nevyrostou."
viVN = "Sự tăng trưởng thời thơ ấu của hải ly con được nhân lên bởi giá trị này, tương tự như một phần thưởng \"Tốc độ tăng trưởng\".\nLưu ý: giá trị càng cao thì càng dễ dàng vì hải ly con sẽ lớn nhanh hơn.\nĐặt ở giá trị 0 có nghĩa là hải ly con sẽ không bao giờ lớn lên."
caES = "Aquest valor multiplica el creixement de la infància dels castors infants, de manera similar a un bonus de \"Velocitat de creixement\".\nNota: com més alt, més fàcil és, ja que els castors joves creixeran més ràpidament.\nSi s'estableix a 0, els infants no creixeran mai."
beBY = "Гэтае значэнне памножвае час дзяцінства бабрoў, падобна да бонусу «Хуткасць росту».\nЗаўвага: чым вышэйшае значэнне, тым лягчэй, бо маладыя бабры будуць расці хутчэй.\nКалі ўсталяваць 0, дзеці ніколі не будуць расці."
roRO = "Această valoare înmulțește durata copilăriei castorilor, similar unui bonus de tip „Viteză de creștere”.\nNotă: o valoare mai mare înseamnă un nivel mai ușor, deoarece castorii tineri vor crește mai repede.\nDacă este setată la 0, copiii nu vor crește niciodată."
huHU = "Ezt az értéket megszorozza a gyermek-békák gyermekkori növekedési sebessége, hasonlóan a „Növekedési sebesség” bónuszhoz.\nMegjegyzés: minél magasabb az érték, annál könnyebb, mert a fiatal békák gyorsabban nőnek fel.\nA 0-ra állítás azt jelenti, hogy a gyermekek soha nem nőnek fel."
arSA = "يُضرب نمو الكائنات الصغيرة (أطفال القنادس) في عمر الطفولة بهذه القيمة، على غرار مكافأة \"سرعة النمو\".\nملاحظة: كلما زادت القيمة كان الأمر أسهل، لأن القنادس الصغيرة ستنمو بسرعة أكبر.\nتعيين القيمة إلى 0 يعني أن الأطفال لن ينموا أبدًا."

