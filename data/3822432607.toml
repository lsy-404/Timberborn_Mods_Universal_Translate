["FairWarning.Reveal.ShowTooltip"]
raw = "Only used for Random maps.\\nShows what the map rolled: a difficulty\\nprofile, or Zero Notice and its level."
status = "normal"
enUS = "Only used for random maps.\\nShows what the map rolled: a difficulty\\nprofile, or Zero Notice and its level."
zhCN = "仅用于随机地图。\\\\n显示地图掷出的结果：难度\\\\n配置，或“零预警”及其等级。"
zhTW = "僅用於隨機地圖。\\\\n顯示地圖抽出的結果：難度\\\\n設定檔，或零預警及其等級。"
ruRU = "Используется только для случайных карт.\\\\nПоказывает, что выпало при генерации карты: профиль сложности\\\\nили режим «Без предупреждения» и его уровень."
jaJP = "ランダムマップでのみ使用。\\\\nマップで生成されたものを表示：難易度\\\\nプロファイル、または「ゼロ・ノーティス」とそのレベル。"
frFR = "Utilisé uniquement pour les cartes aléatoires.\\\\nIndique ce que la carte a tiré : un profil\\\\nde difficulté ou Zéro avertissement et son niveau."
deDE = "Nur für zufällige Karten verwendet.\\\\nZeigt, was für die Karte ausgewürfelt wurde: ein\\\\nSchwierigkeitsprofil oder „Keine Vorwarnung“ und dessen Stufe."
plPL = "Używane tylko dla map losowych.\\nPokazuje, co wylosowano dla mapy: profil\\\\ntrudności albo Zero Notice i jego poziom."
ptBR = "Usado apenas em mapas aleatórios.\\\\nMostra o que foi sorteado para o mapa: um perfil de dificuldade\\\\nou Zero Aviso e seu nível."
koKR = "무작위 지도에서만 사용됩니다.\\n지도가 뽑은 내용을 표시합니다: 난이도\\n프로필 또는 무경고와 그 단계."
trTR = "Yalnızca Rastgele haritalar için kullanılır.\\nHaritanın ne getirdiğini gösterir: bir zorluk profili\\\\nveya Sıfır Uyarı ve seviyesi."
esES = "Solo se usa para mapas aleatorios.\\nMuestra lo que obtuvo el mapa: un perfil de dificultad\\no Zero Notice y su nivel."
itIT = "Usato solo per le mappe casuali.\\nMostra cosa ha generato la mappa: un profilo di difficoltà\\noppure Nessun Preavviso e il suo livello."
ukUA = "Використовується лише для випадкових мап.\\nПоказує, яку карту було згенеровано: профіль складності\\nабо Zero Notice та його рівень."
thTH = "ใช้เฉพาะกับแผนที่แบบสุ่ม\\nแสดงค่าที่แผนที่สุ่มได้: ระดับความยากของ\\nโปรไฟล์ หรือ Zero Notice พร้อมระดับของมัน"
csCZ = "Používá se pouze pro náhodné mapy.\\\\nUkazuje, co mapa vylosovala: profil\\\\nobtížnosti, nebo Zero Notice a jeho úroveň."
viVN = "Chỉ dùng cho bản đồ Ngẫu nhiên.\\nHiển thị kết quả gieo của bản đồ: một hồ sơ độ khó,\\nhoặc Không Báo Trước và cấp độ của nó."
caES = "Només s'utilitza per als mapes aleatoris.\\nMostra què ha resultat el mapa: un perfil de dificultat\\no Zero Notice i el seu nivell."
beBY = "Выкарыстоўваецца толькі для выпадковых карт.\\nПаказвае, што выпала для карты: профіль складанасці\\nабо «Без папярэджання» і яго ўзровень."
roRO = "Folosit doar pentru hărțile aleatorii.\\nAfișează ce a generat harta: un profil de dificultate\\nsau Fără Avertisment și nivelul său."
huHU = "Csak véletlenszerű térképeknél használható.\\nMegmutatja, mit sorsolt a térkép: egy nehézségi\\nprofilt, vagy a Nulla Figyelmeztetést és annak szintjét."
arSA = "المستخدم فقط للخرائط العشوائية.\\nيعرض ما اختارته الخريطة: ملف صعوبة\\nمحدد، أو \"بلا إنذار\" ومستواه."

