["FairWarning.Level.Tooltip"]
status = "normal"
raw = "Only used when Mode is Zero Notice.\\nAlarm Bells: no warning; hazard start and end are still announced.\\nRadio Silence: also hides those popups and sounds.\\nTotal Blackout: also keeps the weather panel and date icon normal."
enUS = "Only used when Mode is Zero Notice.\\nAlarm Bells: no warning; hazard start and end are still announced.\\nRadio Silence: also hides those popups and sounds.\\nTotal Blackout: also keeps the weather panel and date icon normal."
zhCN = "仅在模式为“零通知”时使用。\\\\n警报铃：不发出警告；仍会播报危险的开始和结束。\\\\n无线电静默：还会隐藏这些弹窗和声音。\\\\n全面停电：还会使天气面板和日期图标保持正常。"
zhTW = "僅在模式為「零通知」時使用。\\\\n警鐘：不會發出警告；仍會公告危險的開始與結束。\\\\n無線電靜默：也會隱藏這些彈出訊息與音效。\\\\n全面斷訊：也會讓天氣面板和日期圖示維持正常。"
ruRU = "Используется только в режиме «Без предварительного уведомления».\\nТревожные колокола: предупреждений нет, но начало и конец опасности всё равно объявляются.\\nРадиомолчание: эти всплывающие окна и звуки тоже скрыты.\\nПолное отключение: панель погоды и значок даты также остаются без изменений."
jaJP = "「事前通知なし」モードの場合のみ使用されます。\\nアラームベル：警告なし。ただし、危険の開始と終了は引き続き通知されます。\\n無線封鎖：これらのポップアップと音も非表示になります。\\n完全停電：天気パネルと日付アイコンも通常のままになります。"
frFR = "Utilisé uniquement lorsque le mode est « Sans préavis ».\\\\nAlarmes : aucun avertissement ; le début et la fin du danger sont tout de même annoncés.\\\\nSilence radio : ces fenêtres contextuelles et ces sons sont également masqués.\\\\nObscurité totale : le panneau météo et l’icône de date restent également normaux."
deDE = "Wird nur verwendet, wenn der Modus „Null Vorwarnung“ ist.\\nAlarmsignal: keine Warnung; Beginn und Ende der Gefahr werden weiterhin angekündigt.\\nFunkstille: Auch diese Pop-ups und Geräusche werden ausgeblendet.\\nTotaler Blackout: Auch Wetteranzeige und Datumssymbol bleiben unverändert."
plPL = "Używane tylko wtedy, gdy tryb to „Zero Notice”.\\nDzwonki alarmowe: brak ostrzeżenia; ogłaszane są jednak rozpoczęcie i koniec zagrożenia.\\nCisza radiowa: dodatkowo ukrywa te wyskakujące powiadomienia i dźwięki.\\nCałkowite zaciemnienie: dodatkowo pozostawia panel pogody i ikonę daty bez zmian."
ptBR = "Usado apenas quando o Modo é Aviso Zero.\\nSinos de Alarme: sem aviso; o início e o fim do perigo ainda são anunciados.\\nSilêncio no Rádio: também oculta esses pop-ups e sons.\\nApagão Total: também mantém o painel do clima e o ícone da data normais."
koKR = "모드가 ‘완전 무공지’일 때만 사용됩니다.\\n경보음: 경고는 없지만, 위험 시작과 종료는 계속 알립니다.\\n무전 침묵: 위험 알림 팝업과 소리도 숨깁니다.\\n완전 암전: 날씨 패널과 날짜 아이콘도 평소대로 표시합니다."
csCZ = "Používá se pouze při režimu Zero Notice.\\nPoplašné zvony: bez varování; začátek a konec nebezpečí se stále oznamují.\\nRádiové ticho: skryje také tato vyskakovací oznámení a zvuky.\\nÚplný výpadek: panel počasí a ikona data zůstanou také beze změny."
viVN = "Chỉ được dùng khi Chế độ là Không báo trước.\\nChuông báo động: không cảnh báo; thời điểm bắt đầu và kết thúc hiểm họa vẫn được thông báo.\\nIm lặng vô tuyến: còn ẩn cả những cửa sổ bật lên và âm thanh đó.\\nMất điện hoàn toàn: còn giữ bảng thời tiết và biểu tượng ngày ở trạng thái bình thường."
trTR = "Yalnızca Mod Sıfır Uyarı olduğunda kullanılır.\\nAlarm Zilleri: uyarı yok; tehlikenin başlangıcı ve bitişi yine de duyurulur.\\nRadyo Sessizliği: bu açılır pencereleri ve sesleri de gizler.\\nTam Karartma: hava durumu paneli ve tarih simgesi de normal kalır."

