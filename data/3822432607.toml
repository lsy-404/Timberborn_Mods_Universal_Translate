["FairWarning.Preset.Tooltip"]
raw = "Fills this section's sliders from a built-in profile.\\nDays: {0}.\\nCopies ranges only; Hard and Brutal also favor shorter warnings.\\nOnly changes these sliders, never a map you already have."
status = "normal"
enUS = "Fills this section's sliders from a built-in profile.\\nDays: {0}.\\nCopies ranges only; Hard and Brutal also favor shorter warnings.\\nOnly changes these sliders, never a map you already have."
zhCN = "根据内置预设填充此部分的滑块。\\\\n天数：{0}。\\\\n仅复制范围；“困难”和“残酷”还会倾向于采用较短的警告时间。\\\\n只会更改这些滑块，不会更改已有地图。"
zhTW = "使用內建設定檔填入此區段的滑桿。\\\\n天數：{0}。\\\\n只複製範圍；Hard 和 Brutal 也會偏好較短的警告時間。\\\\n只會變更這些滑桿，不會變更你已有的地圖。"
ruRU = "Заполняет ползунки этого раздела настройками из встроенного профиля.\\nДней: {0}.\\nКопирует только диапазоны; для уровней «Сложный» и «Жестокий» также предпочтительны более короткие предупреждения.\\nИзменяет только эти ползунки, никогда — уже существующую карту."
jaJP = "このセクションのスライダーに、組み込みプロファイルの値を設定します。\\n日数：{0}。\\n範囲のみをコピーします。HardとBrutalでは、警告期間も短めになります。\\nこれらのスライダーのみを変更し、すでにあるマップは変更しません。"
frFR = "Remplit les curseurs de cette section à partir d’un profil prédéfini.\\nJours : {0}.\\nNe copie que les plages ; les modes Difficile et Brutal privilégient aussi des avertissements plus courts.\\nNe modifie que ces curseurs, jamais une carte que vous avez déjà."
deDE = "Füllt die Schieberegler dieses Abschnitts anhand eines integrierten Profils aus.\\\\nTage: {0}.\\\\nKopiert nur die Bereiche; bei „Schwer“ und „Brutal“ werden außerdem kürzere Warnungen bevorzugt.\\\\nÄndert nur diese Schieberegler, niemals eine bereits vorhandene Karte."
plPL = "Wypełnia suwaki tej sekcji na podstawie wbudowanego profilu.\\nDni: {0}.\\nKopiuje tylko zakresy; tryby Trudny i Brutalny dodatkowo preferują krótsze ostrzeżenia.\\nZmienia tylko te suwaki, nigdy mapę, którą już masz."
ptBR = "Preenche os controles deslizantes desta seção com um perfil integrado.\\nDias: {0}.\\nCopia apenas os intervalos; Difícil e Brutal também favorecem avisos mais curtos.\\nAltera apenas estes controles deslizantes, nunca um mapa que você já tenha."
koKR = "내장 프로필에 따라 이 섹션의 슬라이더를 설정합니다.\\n일수: {0}.\\n범위만 복사하며, 어려움과 잔혹함에서는 경고 시간도 더 짧게 설정합니다.\\n이 슬라이더만 변경하며, 이미 보유한 지도는 변경하지 않습니다."
trTR = "Bu bölümün kaydırıcılarını yerleşik bir profilden doldurur.\\nGün sayısı: {0}.\\nYalnızca aralıkları kopyalar; Zor ve Acımasız ayrıca daha kısa uyarıları tercih eder.\\nYalnızca bu kaydırıcıları değiştirir, mevcut haritanızı asla değiştirmez."
esES = "Rellena los controles deslizantes de esta sección con un perfil integrado.\\nDías: {0}.\\nCopia solo los rangos; Difícil y Brutal también favorecen advertencias más cortas.\\nSolo cambia estos controles deslizantes, nunca un mapa que ya tengas."
itIT = "Riempie i cursori di questa sezione con un profilo predefinito.\\nGiorni: {0}.\\nCopia solo gli intervalli; Difficile e Brutale privilegiano anche avvisi più brevi.\\nModifica solo questi cursori, mai una mappa già esistente."
ukUA = "Заповнює повзунки цього розділу за вбудованим профілем.\\nДні: {0}.\\nКопіює лише діапазони; «Складно» та «Жорстко» також віддають перевагу коротшим попередженням.\\nЗмінює лише ці повзунки, ніколи не карту, яка у вас уже є."
thTH = "เติมค่าของตัวเลื่อนในส่วนนี้จากโปรไฟล์ที่มาในตัว\\nวัน: {0}.\\nคัดลอกเฉพาะช่วงค่า; โหมดยากและโหมดโหดร้ายยังเอื้อให้การแจ้งเตือนสั้นลงด้วย\\nเปลี่ยนแปลงเฉพาะตัวเลื่อนเหล่านี้เท่านั้น ไม่เปลี่ยนแผนที่ที่คุณมีอยู่แล้ว"
csCZ = "Vyplní posuvníky v této sekci podle přednastaveného profilu.\\nDní: {0}.\\nKopíruje pouze rozsahy; režimy Těžký a Brutální navíc upřednostňují kratší varování.\\nMění pouze tyto posuvníky, nikdy již existující mapu."
viVN = "Điền các thanh trượt của mục này theo cấu hình có sẵn.\\nSố ngày: {0}.\\nChỉ sao chép các phạm vi; chế độ Khó và Tàn khốc cũng ưu tiên cảnh báo ngắn hơn.\\nChỉ thay đổi các thanh trượt này, không bao giờ thay đổi bản đồ bạn đã có."
caES = "Omple els control lliscants d'aquesta secció amb un perfil integrat.\\nDies: {0}.\\nCopia només els intervals; Difícil i Brutal també afavoreixen advertències més curtes.\\nNomés canvia aquests control lliscants, mai un mapa que ja tinguis."
beBY = "Запаўняе паўзункі гэтага раздзела з убудаванага профілю.\\nДні: {0}.\\nКапіруе толькі дыяпазоны; «Складана» і «Брутальна» таксама аддаюць перавагу карацейшым папярэджанням.\\nЗмяняе толькі гэтыя паўзункі, ніколі не карту, якая ўжо ў вас ёсць."
roRO = "Completează glisoarele acestei secțiuni dintr-un profil încorporat.\\nZile: {0}.\\nCopiază doar intervalele; Hard și Brutal favorizează și avertismente mai scurte.\\nModifică doar aceste glisoare, niciodată o hartă pe care o ai deja."
huHU = "Kitölti ennek a szakasznak a csúszkáit egy beépített profilból.\\nNapok: {0}.\\nCsak a tartományokat másolja; a Kemény és a Brutális szint emellett rövidebb figyelmeztetéseket is részesít előnyben.\\nCsak ezeket a csúszkákat módosítja, soha nem a már meglévő térképet."
arSA = "تملأ منزلقات هذا القسم من ملف إعداد مدمج مسبقًا.\\nالأيام: {0}.\\nتنسخ النطاقات فقط؛ ويُفضّل وضعا \"الصعب\" و\"الوحشي\" أيضًا تحذيرات أقصر.\\nتغيّر هذه المنزلقات فقط، ولا تغيّر أي خريطة لديك بالفعل."

