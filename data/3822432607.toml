ruRU = "Заполняет ползунки этого раздела настройками из встроенного профиля.\\nДней: {0}.\\nКопирует только диапазоны; для уровней «Сложный» и «Жестокий» также предпочтительны более короткие предупреждения.\\nИзменяет только эти ползунки, никогда — уже существующую карту."
jaJP = "このセクションのスライダーに、組み込みプロファイルの値を設定します。\\n日数：{0}。\\n範囲のみをコピーします。HardとBrutalでは、警告期間も短めになります。\\nこれらのスライダーのみを変更し、すでにあるマップは変更しません。"
frFR = "Remplit les curseurs de cette section à partir d’un profil prédéfini.\\nJours : {0}.\\nNe copie que les plages ; les modes Difficile et Brutal privilégient aussi des avertissements plus courts.\\nNe modifie que ces curseurs, jamais une carte que vous avez déjà."
deDE = "Füllt die Schieberegler dieses Abschnitts anhand eines integrierten Profils aus.\\\\nTage: {0}.\\\\nKopiert nur die Bereiche; bei „Schwer“ und „Brutal“ werden außerdem kürzere Warnungen bevorzugt.\\\\nÄndert nur diese Schieberegler, niemals eine bereits vorhandene Karte."
plPL = "Wypełnia suwaki tej sekcji na podstawie wbudowanego profilu.\\nDni: {0}.\\nKopiuje tylko zakresy; tryby Trudny i Brutalny dodatkowo preferują krótsze ostrzeżenia.\\nZmienia tylko te suwaki, nigdy mapę, którą już masz."
ptBR = "Preenche os controles deslizantes desta seção com um perfil integrado.\\nDias: {0}.\\nCopia apenas os intervalos; Difícil e Brutal também favorecem avisos mais curtos.\\nAltera apenas estes controles deslizantes, nunca um mapa que você já tenha."
koKR = "내장 프로필에 따라 이 섹션의 슬라이더를 설정합니다.\\n일수: {0}.\\n범위만 복사하며, 어려움과 잔혹함에서는 경고 시간도 더 짧게 설정합니다.\\n이 슬라이더만 변경하며, 이미 보유한 지도는 변경하지 않습니다."
