["FairWarning.Mode.Tooltip"]
status = "normal"
raw = "The mode for new maps. Each map keeps the mode it started with,\\nso changing this won't affect maps you already have."
enUS = "The mode for new maps. Each map keeps the mode it started with,\\nso changing this won't affect maps you already have."
zhCN = "新地图的模式。每张地图都会保留其创建时的模式，\\\\n因此更改此项不会影响已有地图。"
zhTW = "新地圖的模式。每張地圖會保留建立時的模式，\\\\n所以變更此設定不會影響你現有的地圖。"
ruRU = "Режим для новых карт. Каждая карта сохраняет режим, с которым она была создана,\\\\nпоэтому его изменение не повлияет на уже имеющиеся карты."
jaJP = "新しいマップのモードです。各マップは開始時のモードを維持するため、\\\\nこれを変更しても、すでにあるマップには影響しません。"
frFR = "Le mode des nouvelles cartes. Chaque carte conserve le mode avec lequel elle a été créée,\\\\ndonc ce changement n’affectera pas les cartes que vous avez déjà."
deDE = "Der Modus für neue Karten. Jede Karte behält den Modus, mit dem sie erstellt wurde,\\\\ndie Änderung wirkt sich also nicht auf bereits vorhandene Karten aus."
plPL = "Tryb dla nowych map. Każda mapa zachowuje tryb, z którym została rozpoczęta,\\nwięc jego zmiana nie wpłynie na już istniejące mapy."
ptBR = "O modo para mapas novos. Cada mapa mantém o modo com que foi iniciado,\\nentão mudar isso não afetará os mapas que você já tem."
koKR = "새 지도에 적용되는 모드입니다. 각 지도는 처음 시작할 때의 모드를 유지하므로, 이 설정을 변경해도 기존 지도에는 영향을 주지 않습니다.\\n"
csCZ = "Režim pro nové mapy. Každá mapa si zachovává režim, se kterým začala,\\ntakže změna této možnosti neovlivní mapy, které už máte."
viVN = "Chế độ dành cho bản đồ mới. Mỗi bản đồ giữ nguyên chế độ khi bắt đầu,\\\\nvì vậy thay đổi này sẽ không ảnh hưởng đến các bản đồ bạn đã có."
trTR = "Yeni haritalar için mod. Her harita başladığı modu korur,\\\\nbu nedenle bunu değiştirmek mevcut haritalarınızı etkilemez."

