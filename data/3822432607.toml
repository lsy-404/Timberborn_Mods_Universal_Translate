["FairWarning.IncludeZero.Tooltip"]
status = "normal"
raw = "Only used when Mode is Random.\\nWhen on, a new Random map can also roll Zero Notice (1 in 5),\\nwith its level picked at random.\\nYou may then get no warning at all - the Random Reveal\\nsection shows what was rolled."
enUS = "Only used when Mode is Random.\\nWhen on, a new Random map can also roll Zero Notice (1 in 5),\\nwith its level picked at random.\\nYou may then get no warning at all - the Random Reveal\\nsection shows what was rolled."
zhCN = "仅在模式为“随机”时使用。\\n启用后，新的随机地图也有可能随机出现“零预警”（五分之一的概率），\\n其等级也会随机决定。\\n届时你可能完全收不到警告——“随机揭晓”\\n部分会显示随机结果。"
zhTW = "僅在模式為隨機時使用。\\\\n啟用後，新的隨機地圖也可能隨機抽中零提示（1/5 機率），\\\\n其等級也會隨機選定。\\\\n這樣一來，你可能完全不會收到警告——隨機揭示\\\\n區段會顯示抽中的結果。"
ruRU = "Используется только в режиме «Случайный».\\\\nЕсли включено, на новой случайной карте также может выпасть «Без предупреждения» (1 из 5),\\\\nпричём его уровень выбирается случайным образом.\\\\nВ таком случае вы можете вовсе не получить предупреждения — в разделе «Случайное открытие»\\\\nпоказано, что выпало."
jaJP = "モードがランダムの場合のみ使用されます。\\nオンにすると、新しいランダムマップでは「予告なし」（5回に1回）も抽選され、\\nそのレベルはランダムに選ばれます。\\nその場合、警告が一切表示されないことがあります。抽選結果は「ランダム公開」\\nセクションに表示されます。"
frFR = "Utilisé uniquement lorsque le mode est Aléatoire.\\\\nLorsque cette option est activée, une nouvelle carte aléatoire peut aussi générer Zéro préavis (1 sur 5),\\\\navec un niveau choisi au hasard.\\\\nVous pouvez alors ne recevoir aucun avertissement - la section Révélation aléatoire\\\\nindique ce qui a été généré."
deDE = "Wird nur verwendet, wenn „Modus“ auf „Zufällig“ eingestellt ist.\\nIst diese Option aktiviert, kann eine neue Zufallskarte auch „Keine Vorwarnung“ (1 von 5) auslosen,\\nmit zufällig bestimmter Stärke.\\nEs kann dann sein, dass du überhaupt keine Warnung erhältst – im Abschnitt „Zufällige Enthüllung“\\nsiehst du, was ausgelost wurde."
plPL = "Używane tylko wtedy, gdy tryb to Losowy.\\nPo włączeniu na nowej losowej mapie może też wylosować się Brak ostrzeżenia (1 na 5),\\na jego poziom zostanie wybrany losowo.\\nMożesz wtedy nie otrzymać żadnego ostrzeżenia —\\nsekcja Losowe odkrycie pokazuje, co wylosowano."
ptBR = "Usado apenas quando o Modo está definido como Aleatório.\\nQuando ativado, um novo mapa Aleatório também pode sortear Aviso Zero (1 em 5),\\ncom o nível escolhido aleatoriamente.\\nVocê pode então não receber nenhum aviso - a seção Revelação Aleatória\\nmostra o que foi sorteado."
koKR = "모드가 무작위일 때만 사용됩니다.\\n켜면 새로운 무작위 지도에서 무경고(5분의 1)가 나올 수도 있으며,\\n단계는 무작위로 선택됩니다.\\n그러면 경고가 전혀 표시되지 않을 수도 있습니다. 무작위 공개\\n섹션에서 어떤 결과가 나왔는지 확인할 수 있습니다."
csCZ = "Používá se pouze tehdy, když je režim nastaven na Náhodný.\\nKdyž je zapnuto, může se na nové náhodné mapě vylosovat také Nulové upozornění (1 z 5),\\njehož úroveň se vybere náhodně.\\nPak se může stát, že nedostanete vůbec žádné varování –\\nsekce Náhodné odhalení ukazuje, co se vylosovalo."
viVN = "Chỉ được dùng khi Chế độ là Ngẫu nhiên.\\nKhi bật, bản đồ Ngẫu nhiên mới cũng có thể nhận Zero Notice (xác suất 1/5),\\nvới cấp độ được chọn ngẫu nhiên.\\nKhi đó, bạn có thể không nhận được cảnh báo nào - mục Tiết lộ Ngẫu nhiên\\ncho biết kết quả đã chọn."
trTR = "Yalnızca Mod Rastgele olduğunda kullanılır.\\nAçıkken, yeni bir Rastgele harita Sıfır Uyarı (5'te 1) da getirebilir;\\nseviyesi rastgele seçilir.\\nBöylece hiç uyarı almayabilirsiniz - Rastgele Açığa Çıkarma\\nbölümü ne çıktığını gösterir."

