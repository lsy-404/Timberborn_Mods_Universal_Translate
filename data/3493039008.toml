trTR = "Oyun varsayılan tehlikeli kuraklık havası, su kaynakları su üretmeyi durdurur."
esES = "El clima de sequía peligrosa predeterminado del juego: las fuentes de agua dejan de producir agua."
itIT = "Nella modalità predefinita del gioco, durante la siccità pericolosa, le fonti d'acqua smettono di produrre acqua."
ukUA = "За замовчуванням у грі під час небезпечної посухи джерела води припиняють виробляти воду."
thTH = "ภัยแล้งอันตรายตามค่าเริ่มต้นของเกม แหล่งน้ำจะหยุดผลิตน้ำ"
csCZ = "Výchozí nebezpečné počasí sucha ve hře, vodní zdroje přestanou produkovat vodu."
viVN = "Thời tiết hạn hán nguy hiểm mặc định của trò chơi, các nguồn nước ngừng cung cấp nước."
caES = "La sequera perillosa predeterminada del joc fa que les fonts d'aigua deixin de produir aigua."
beBY = "Засуха — небяспечнае надвор'е па змаўчанні ў гульні: крыніцы вады перастаюць вырабляць ваду."
roRO = "În timpul secetei periculoase, implicită în joc, sursele de apă încetează să mai producă apă."
huHU = "Az alapértelmezett veszélyes aszályidőjárásban a vízforrások leállnak, és nem termelnek vizet."
arSA = "تُوقف مصادر المياه إنتاج المياه أثناء الجفاف الخطير للطقس الافتراضي في اللعبة."

["LV.MW.BadtideDesc"]
raw = "The game default hazardous bad tide weather, all water sources produce badwater."
status = "normal"
enUS = "The game default hazardous bad tide weather, all water sources produce badwater."
zhCN = "游戏默认的恶劣类天气，地下的恶水发生渗漏，干净的水源亦被污染。<br>- 所有水源都会流出恶水。"
zhTW = "遊戲預設的危險壞潮天氣，所有水源產生壞水。"
ruRU = "Ключ названия: LV.MW.BadtideDesc - Новый текст для перевода: \"Игровая дефолтная опасная погода с плохим приливом, все водные источники производят загрязненную воду.\""
jaJP = "ゲームのデフォルトの危険な悪潮天候、すべての水源は悪水を生成します。"
frFR = "Le jeu a une tempête de marée dangereuse par défaut, toutes les sources d'eau produisent de l'eau contaminée."
deDE = "Der standardmäßige gefährliche schlechte Gezeitenwetter im Spiel, alle Wasserquellen produzieren Schlechtes Wasser."
plPL = "Domyślny niebezpieczny efekt złej pływającej pogody w grze, wszystkie źródła wody produkują złą wodę."
ptBR = "O clima perigoso de maré negativa padrão do jogo, todas as fontes de água produzem água ruim."
koKR = "게임 기본 위험한 나쁜 조수 날씨, 모든 수원에서 나쁜 물이 생성됩니다."
trTR = "Oyun varsayılan tehlikeli kötü gelgit hava durumu, tüm su kaynakları kötü su üretir."
esES = "El clima peligroso de marea mala predeterminado del juego: todas las fuentes de agua producen agua mala."
itIT = "Di default del gioco, il meteo pericoloso di marea cattiva fa sì che tutte le sorgenti d'acqua producano acqua cattiva."
ukUA = "Стандартна небезпечна погода «лихий приплив» у грі: усі джерела води виробляють неякісну воду."
thTH = "สภาพอากาศน้ำเสียอันตรายตามค่าเริ่มต้นของเกม ทำให้แหล่งน้ำทุกแห่งผลิตน้ำเสีย"
csCZ = "Hazardní špatný přílivový počasí, všechny vodní zdroje produkují špatnou vodu."
viVN = "Thời tiết thủy triều nguy hiểm mặc định của trò chơi, tất cả nguồn nước đều sinh ra badwater."
caES = "El clima de marea negra perillosa predeterminat del joc fa que totes les fonts d'aigua produeixin aigua tòxica."
beBY = "Па змаўчанні ў гульні надвор'е «небяспечны брудны прылiў» робіць так, што ўсе крыніцы вады выдаюць брудную ваду."
roRO = "Implicit vremea periculoasă de val toxic din joc, toate sursele de apă produc apă toxică."
huHU = "A játék alapértelmezett veszélyes mérgezőár időjárásában minden vízforrás mérgesvizet termel."
arSA = "الطقس الافتراضي في اللعبة هو المد السام الخطير، حيث تنتج جميع مصادر المياه مياهًا فاسدة."

["LV.MW.RainDesc"]
raw = "Temperate weather:\n- All tiles are watered and no land contamination occurs.\n- Applies Wet Fur when Beavers are not in the buildings.\n- 25% shorter than the usual temperate reason (default settings)"
status = "normal"
enUS = "Temperate weather:\n- All tiles are watered and no land contamination occurs.\n- Applies Wet Fur when Beavers are not in the buildings.\n- 25% shorter than the usual temperate reason (default settings)"
zhCN = "模组扩展的温和类天气，清澈的雨水带来希望，也带来欢乐。<br>- 所有土地都被灌溉，而且不会受到恶水污染。<br>- 海狸在室外时会增加“湿润的毛发”康乐值。"
zhTW = "溫帶天氣：\n- 所有格子都會被灑水，且不會發生土地污染。\n- 當海狸不在建築物內時，會給予濕毛皮效果。\n- 比通常的溫帶季節短 25%（默認設置）。"
ruRU = "Умеренный климат:\n- Все участки поливаются, и загрязнение земли не происходит.\n- Применяется Влажный Мех, когда Бобры не находятся в зданиях.\n- На 25% короче, чем обычный умеренный сезон (настройки по умолчанию)."
jaJP = "温帯気候：\n- 全てのタイルが水やりされ、土地の汚染は発生しません。\n- ビーバーが建物にいないとき、湿った毛皮が適用されます。\n- 通常の温帯季節より25%短くなります（デフォルト設定）。"
frFR = "Météo tempérée :\n- Tous les carrés sont arrosés et aucune contamination des terres ne se produit.\n- Applique la fourrure humide lorsque les castors ne sont pas dans les bâtiments.\n- 25 % plus court que la raison tempérée habituelle (paramètres par défaut)"
deDE = "Gemäßes Wetter:\n- Alle Fliesen sind bewässert und es tritt keine Bodenverschmutzung auf.\n- Wendet Nasses Fell an, wenn Biber sich nicht in den Gebäuden befinden.\n- 25% kürzer als die übliche gemäßigte Saison (Standardeinstellungen)"
plPL = "Temperate weather:\n- Wszystkie kafelki są nawadniane, a zanieczyszczenie gruntów nie występuje.\n- Zastosowanie Mokrego Futra, gdy Bobry nie znajdują się w budynkach.\n- O 25% krótszy niż zwykły umiarkowany sezon (ustawienia domyślne)"
ptBR = "Clima temperado:\n- Todos os tiles são regados e não ocorre contaminação do solo.\n- Aplica Pelo Úmido quando os Castores não estão nos edifícios.\n- 25% mais curto do que o motivo temperado usual (configurações padrão)"
koKR = "온대 날씨:\n- 모든 타일에 물이 공급되고 토양 오염이 발생하지 않습니다.\n- 비버가 건물에 없으면 젖은 모피 효과가 적용됩니다.\n- 일반적인 온대 사유보다 25% 짧습니다 (기본 설정)."
trTR = "Ilıman hava:\n- Tüm karo alanları sulanır ve arazi kirliliği meydana gelmez.\n- Koyunların binaların içinde olmadığı zamanlarda Islak Kürk uygulanır.\n- Normal ılıman sezondan %25 daha kısadır (varsayılan ayarlar)."
esES = "Clima templado:\n- Todas las casillas reciben agua y no se produce contaminación del terreno.\n- Aplica Pelaje Húmedo cuando los castores no están en los edificios.\n- 25% más corto que la razón templada habitual (ajustes predeterminados)"
itIT = "Clima temperato:\n- Tutte le piastrelle sono irrigate e non si verifica alcuna contaminazione del terreno.\n- Applica Pelliccia Bagnata quando i Castori non si trovano negli edifici.\n- Dura il 25% in meno rispetto al normale clima temperato (impostazioni predefinite)"
ukUA = "Помірна погода:\n- Усі плитки зрошені, і забруднення землі не відбувається.\n- Застосовує «Мокре хутро», коли бобри не перебувають у будівлях.\n- На 25% коротша за звичайну помірну погоду (стандартні налаштування)"
thTH = "สภาพอากาศอบอุ่น:\n- ทุกช่องพื้นที่ได้รับน้ำ และไม่เกิดการปนเปื้อนของพื้นดิน\n- ให้ผล ขนเปียก เมื่อบีเวอร์ไม่อยู่ในอาคาร\n- สั้นกว่าสาเหตุสภาพอากาศอบอุ่นตามปกติ 25% (ค่าเริ่มต้น)"
csCZ = "Mírnému počasí:\n- Všechny dlaždice jsou zavlažovány a nedochází k znečištění půdy.\n- Používá Mokrou srst, když bobři nejsou v budovách.\n- O 25 % kratší než obvyklé mírné období (výchozí nastavení)"
viVN = "Thời tiết ôn hòa:\n- Tất cả các ô đất được tưới nước và không xảy ra ô nhiễm đất.\n- Áp dụng Lông ướt khi hải ly không ở trong các công trình.\n- Ngắn hơn 25% so với mùa ôn hòa thông thường (cài đặt mặc định)"
caES = "Clima temperat:\n- Totes les caselles reben aigua i no es produeix contaminació del terreny.\n- Aplica Pelatge Humit quan els castors no són als edificis.\n- 25% més curt que el motiu temperat habitual (configuració predeterminada)"
beBY = "Умераны клімат:\n- Усе плыткі палітыя, і забруджвання зямлі не адбываецца.\n- Прымяняе «мокрае футра», калі бабры не знаходзяцца ў будынках.\n- На 25% карацейшы за звычайны ўмераны перыяд (стандартныя налады)"
roRO = "Vreme temperat:\n- Toate parcelele sunt irigate și nu apare contaminare a terenului.\n- Aplică Blana Umedă atunci când Castorii nu se află în clădiri.\n- Cu 25% mai scurt decât motivul temperat obișnuit (setări implicite)"
huHU = "Mérsékelt időjárás:\n- Minden csempe öntözött, és nem keletkezik talajszennyeződés.\n- Nedves szőrzetet ad, amikor a búvárok nincsenek az épületekben.\n- 25%-kal rövidebb, mint a szokásos mérsékelt időjárási ok (alapértelmezett beállítások)"
arSA = "الطقس المعتدل:\n- جميع البلاطات مروية ولا يحدث أي تلوث للأرض.\n- يطبق \"الفرو المبلل\" عندما لا يكون القنادس داخل المباني.\n- أقصر بنسبة 25% من سبب الطقس المعتدل المعتاد (الإعدادات الافتراضية)"

["LV.MW.MonsoonDesc"]
raw = "Hazardous weather:\n- All water sources increase their output, at 350% (or configurable) maximum.\n- Handicap applies to the extra output as well."
status = "normal"
enUS = "Hazardous weather:\n- All water sources increase their output, at 350% (or configurable) maximum.\n- Handicap applies to the extra output as well."
zhCN = "模组扩展的恶劣类天气，洪水自河流上游奔涌而来，四处泛滥。<br>- 所有水源的水力都会额外增加250%（模组默认，可更改），但不超过游戏限制。"
zhTW = "危險天氣：\n- 所有水源的產出提高至350%（或可配置）的最大值。\n- 這一減益也適用於額外的產出。"
ruRU = "Опасная погода:\n- Все источники воды увеличивают свою продуктивность до 350% (или настраиваемого) максимума.\n- Ухудшение условий также применяется к дополнительному выходу."
jaJP = "危険な天候：\n- すべての水源は出力を350%（または設定可能）最大で増加します。\n- ハンデは追加出力にも適用されます。"
frFR = "Conditions météorologiques dangereuses :\n- Toutes les sources d'eau augmentent leur production, à 350% (ou configurable) maximum.\n- Le handicap s'applique également à la production supplémentaire."
deDE = "Gefährliches Wetter:\n- Alle Wasserquellen steigern ihre Produktion auf 350% (oder konfigurierbar) Maximum.\n- Die Einschränkung gilt auch für die zusätzliche Produktion."
plPL = "Niebezpieczna pogoda:\n- Wszystkie źródła wody zwiększają swoją produkcję do 350% (lub konfigurowanej) maksymalnie.\n- Utrudnienia dotyczą również dodatkowej produkcji."
ptBR = "Tempo perigoso:\n- Todas as fontes de água aumentam sua produção em 350% (ou configurável) no máximo.\n- A penalização se aplica à produção extra também."
koKR = "위험한 날씨:\n- 모든 수원에서 최대 350% (또는 설정 가능)로 산출량이 증가합니다.\n- 추가 산출량에도 불리한 조건이 적용됩니다."
trTR = "Tehlikeli hava:\n- Tüm su kaynakları, %350 (veya yapılandırılabilir) maksimumda çıktılarını artırır.\n- Ekstra çıktılar için engel uygulanır."
esES = "Clima peligroso:\n- Todas las fuentes de agua aumentan su producción, hasta un máximo del 350 % (o configurable).\n- La dificultad también se aplica a la producción adicional."
itIT = "Eventi meteorologici pericolosi:\n- Tutte le fonti d'acqua aumentano la propria produzione, fino al 350% (o al valore configurabile) come massimo.\n- Anche la produzione extra è soggetta alla penalità di handicap."
ukUA = "Небезпечна погода:\n- Усі джерела води збільшують свій видобуток максимум на 350% (або на значення, яке можна налаштувати).\n- Обмеження також поширюється на додатковий видобуток."
thTH = "สภาพอากาศอันตราย:\n- แหล่งน้ำทั้งหมดจะเพิ่มผลผลิตได้สูงสุดถึง 350% (หรือตามที่ตั้งค่าไว้)\n- ข้อจำกัดความสามารถ (Handicap) ก็ใช้กับผลผลิตที่เพิ่มขึ้นเช่นกัน"
csCZ = "Nebezpečné počasí:\n- Všechny vodní zdroje zvyšují svůj výstup na 350 % (nebo konfigurovatelný) maximálně.\n- Handicap se také vztahuje na extra výstup."
viVN = "Thời tiết nguy hiểm:\n- Tất cả nguồn nước tăng sản lượng lên tối đa 350% (hoặc có thể cấu hình).\n- Handicap cũng áp dụng cho phần sản lượng tăng thêm."
caES = "Clima perillós:\n- Totes les fonts d'aigua augmenten la seva producció fins a un màxim del 350% (o configurable).\n- La penalització per discapacitat també s'aplica a la producció addicional."
beBY = "Небяспечнае надвор'е:\n- Усе крыніцы вады павялічваюць сваю выхадную магутнасць максімум на 350% (або з магчымасцю налады).\n- Абмежаванне (handicap) распаўсюджваецца і на дадатковую выхадную магутнасць."
roRO = "Vreme periculoasă:\n- Toate sursele de apă își cresc producția, până la maximum 350% (sau valoare configurabilă).\n- Handicapul se aplică și producției suplimentare."
huHU = "Veszélyes időjárás:\n- Minden vízforrás kimenete legfeljebb 350%-kal (vagy konfigurálható értékkel) nő.\n- A hátrány a plusz kimenetre is vonatkozik."
arSA = "الطقس الخطير:\n- ترتفع مخرجات جميع مصادر المياه، حتى حد أقصى قدره 350% (أو قابل للتعديل).\n- ينطبق الإعاقة على الناتج الإضافي أيضًا."

["LV.MW.ShortTemperateDesc"]
raw = "Temperate weather: a very short Temperate season so you will need to deal with two hazardous seasons in a row."
status = "normal"
enUS = "Temperate weather: a very short Temperate season so you will need to deal with two hazardous seasons in a row."
zhCN = "模组扩展的温和类天气，晴天转瞬即逝，预兆着连续的天灾。<br>- 持续时间极短，只有1~2天（模组默认，可更改）。"
zhTW = "溫帶天氣：一個非常短的溫帶季節，因此你需要連續面對兩個危險的季節。"
ruRU = "Умеренный климат: очень короткий умеренный сезон, поэтому вам придется справляться с двумя опасными сезонами подряд."
jaJP = "温暖な気候：非常に短い温暖季があるため、連続して2つの危険な季節に対処する必要があります。"
frFR = "Temps tempéré : une saison tempérée très courte, vous devrez donc faire face à deux saisons dangereuses consécutives."
deDE = "Gemäßigte Wetter: Eine sehr kurze gemäßigte Saison, sodass Sie mit zwei gefährlichen Jahreszeiten hintereinander umgehen müssen."
plPL = "Pogoda umiarkowana: bardzo krótki sezon umiarkowany, więc będziesz musiał stawić czoła dwóm niebezpiecznym sezonowi z rzędu."
ptBR = "Clima temperado: uma temporada temperada muito curta, então você precisará lidar com duas temporadas perigosas seguidas."
koKR = "온대 날씨: 매우 짧은 온대 계절이므로 두 개의 위험한 계절을 연속으로 경험해야 합니다."
trTR = "Ilıman hava: çok kısa bir Ilıman mevsim, bu nedenle ardı ardına iki tehlikeli mevsimle başa çıkmanız gerekecek."
esES = "Clima templado: una temporada templada muy corta, por lo que tendrás que afrontar dos temporadas peligrosas seguidas."
itIT = "Clima temperato: una stagione temperata molto breve, quindi dovrai affrontare due stagioni pericolose di seguito."
ukUA = "Помірна погода: дуже короткий помірний сезон, тож доведеться впоратися з двома небезпечними сезонами поспіль."
thTH = "สภาพอากาศแบบอบอุ่น: ฤดูอบอุ่นจะสั้นมาก ดังนั้นคุณจะต้องรับมือกับฤดูอันตรายสองฤดูติดกัน"
csCZ = "Mírné počasí: velmi krátké mírné období, takže se budete muset vypořádat se dvěma nebezpečnými obdobími po sobě."
viVN = "Thời tiết ôn đới: mùa ôn đới rất ngắn nên bạn sẽ phải đối mặt với hai mùa nguy hiểm liên tiếp."
caES = "Clima temperat: una temporada temperada molt curta, de manera que caldrà afrontar dues temporades perilloses seguides."
beBY = "Умераны клімат: вельмі кароткі ўмераны сезон, таму давядзецца справіцца з двума небяспечнымі сезонамі запар."
roRO = "Vremea temperată: un anotimp temperat foarte scurt, astfel încât va trebui să faci față a două anotimpuri periculoase la rând."
huHU = "Mérsékelt időjárás: nagyon rövid mérsékelt évszak, így két veszélyes évszakkal kell egymás után megbirkóznod."
arSA = "الطقس المعتدل: فصل معتدل قصير جدًا، لذا ستحتاج إلى التعامل مع فصلين خطيرين متتاليين."

["LV.MW.ProgressiveTemperateDesc"]
raw = "Temperate weather that starts like the game's normal one but it gets shorter and shorter."
status = "normal"
enUS = "Temperate weather that starts like the game's normal one but it gets shorter and shorter."
zhCN = "模组扩展的温和类天气，平静的日子逐渐缩短，留下气候变化的痕迹。<br>- 持续时间随周期变短（不建议与温和天气同时启用）。"
zhTW = "溫帶天氣一開始與遊戲的正常天氣相似，但逐漸變得越來越短。"
