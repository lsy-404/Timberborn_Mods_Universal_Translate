["LV.MW.MonsoonMultiplierDesc"]
raw = "The maximum additional multiplier for the monsoon weather at maximum (no handicap).\nThis value is affected by handicap like Duration.\nDefault value: 2.5 (250%) meaning when no handicap is applied (default cycle 5),\nall water sources strength is at 350%."
status = "normal"
enUS = "The maximum additional multiplier for the monsoon weather at maximum (no handicap).\nThis value is affected by handicap like Duration.\nDefault value: 2.5 (250%) meaning when no handicap is applied (default cycle 5),\nall water sources strength is at 350%."
zhCN = "洪涝期时水源的额外水力倍率，即水源的水力会变为“水力×(基础倍率+额外倍率)”。<br>注意，此数值受天气初始强度值、适应频次数影响。"
zhTW = "季風天氣的最大額外乘數（不考慮手牌）。  \n此值會受到手牌如持續時間的影響。  \n預設值：2.5（250%），這意味著當沒有應用手牌（預設週期5）時，所有水源的強度為350%。"
ruRU = "Максимальный дополнительный множитель для муссонной погоды при максимуме (без штрафа). Это значение зависит от таких штрафов, как Продолжительность. Значение по умолчанию: 2.5 (250%), что означает, что при отсутствии штрафа (по умолчанию цикл 5) вся сила источников воды составляет 350%."
jaJP = "モンスーン天候における最大追加乗数（ハンディキャップなし）。  \nこの値は、持続時間のようなハンディキャップの影響を受けます。  \nデフォルト値：2.5（250％）、つまりハンディキャップが適用されない場合（デフォルトサイクル5）、すべての水源の強さは350％になります。"
frFR = "Le multiplicateur additionnel maximum pour la météo de la mousson au maximum (sans handicap). Cette valeur est affectée par des handicaps comme la durée. Valeur par défaut : 2,5 (250 %), ce qui signifie que lorsqu'aucun handicap n'est appliqué (cycle par défaut 5), toute la force des sources d'eau est à 350 %."
deDE = "Der maximale zusätzliche Multiplikator für das Monsunwetter beträgt maximal (kein Handicap). Dieser Wert wird durch Handicap wie Dauer beeinflusst. Standardwert: 2,5 (250 %), was bedeutet, dass bei Nichtanwendung von Handicap (Standardzyklus 5) die Stärke aller Wasserquellen bei 350 % liegt."
plPL = "Maksymalny dodatkowy mnożnik dla warunków monsunowych przy maksimum (bez handicapu). Ta wartość jest wpływana przez handicap, taki jak Czas trwania. Wartość domyślna: 2,5 (250%), co oznacza, że przy braku zastosowanego handicapu (domyślny cykl 5) siła wszystkich źródeł wody wynosi 350%."
ptBR = "O multiplicador adicional máximo para o clima de monção no máximo (sem penalização). Este valor é afetado por penalizações como Duração. Valor padrão: 2,5 (250%), o que significa que, quando nenhuma penalização é aplicada (ciclo padrão 5), a força de todas as fontes de água está em 350%."
koKR = "최대 추가 곱셈 비율은 장애물 없이 최대 몬순 날씨에 대한 것입니다. 이 값은 지속 시간과 같은 장애물의 영향을 받습니다. 기본값: 2.5 (250%)는 장애물이 적용되지 않을 때 (기본 사이클 5) 모든 수원 강도가 350%임을 의미합니다."
trTR = "Muson havası için maksimum ek çarpan (handikapsız) maksimumda. Bu değer, Süre gibi handikaplardan etkilenir. Varsayılan değer: 2.5 (250%), yani handikap uygulanmadığında (varsayılan döngü 5), tüm su kaynaklarının gücü %350'dir."
esES = "El multiplicador adicional máximo para el clima de monzón en su nivel máximo (sin desafío).\nEste valor se ve afectado por el desafío, como la duración.\nValor predeterminado: 2,5 (250 %), lo que significa que, cuando no se aplica ningún desafío (ciclo predeterminado 5),\nla intensidad de todas las fuentes de agua es del 350 %."
itIT = "Il moltiplicatore aggiuntivo massimo per il clima monsonico al massimo (nessun handicap).\nQuesto valore è influenzato dall'handicap come la Durata.\nValore predefinito: 2,5 (250%); quando non viene applicato alcun handicap (ciclo predefinito 5),\nla potenza di tutte le fonti d'acqua è pari al 350%."
ukUA = "Максимально можливий додатковий множник для погоди мусонів на максимальному рівні (без обмеження).\nЦе значення змінюється обмеженням так само, як і тривалість.\nЗначення за замовчуванням: 2.5 (250%), тобто коли обмеження не застосовано (стандартний цикл 5),\nсила всіх джерел води становить 350%."
thTH = "ตัวคูณเพิ่มเติมสูงสุดสำหรับสภาพอากาศมรสุมที่ระดับสูงสุด (ไม่มีตัวปรับความยาก)\nค่านี้ได้รับผลจากตัวปรับความยากเช่นเดียวกับระยะเวลา\nค่าเริ่มต้น: 2.5 (250%) หมายความว่าเมื่อไม่มีการใช้ตัวปรับความยาก (รอบเริ่มต้น 5)\nกำลังของแหล่งน้ำทั้งหมดอยู่ที่ 350%"
csCZ = "Maximální dodatečný multiplikátor pro monzunové počasí na maximální úrovni (bez handicapu). Tato hodnota je ovlivněna handicapem, jako je Doba. Výchozí hodnota: 2,5 (250%), což znamená, že když není aplikován žádný handicap (výchozí cyklus 5), síla všech vodních zdrojů je na 350%."
viVN = "Hệ số nhân bổ sung tối đa cho thời tiết gió mùa ở mức tối đa (không có hạn chế).\nGiá trị này bị ảnh hưởng bởi các hạn chế như Thời lượng.\nGiá trị mặc định: 2.5 (250%) có nghĩa là khi không áp dụng handicap (chu kỳ mặc định 5),\nsức mạnh của tất cả nguồn nước đạt 350%."
caES = "El multiplicador addicional màxim per al clima de monsó en el seu nivell màxim (sense handicap).\nAquest valor es veu afectat pel handicap igual que la Durada.\nValor predeterminat: 2,5 (250%), la qual cosa significa que, quan no s'aplica cap handicap (cicle predeterminat 5),\nla força de totes les fonts d'aigua és del 350%."
beBY = "Максімальны дадатковы множнік для надвор'я мусонаў на максімальным узроўні (без абмежавання).\nГэта значэнне змяняецца абмежаваннем, як і тэрмін дзеяння.\nЗначэнне па змаўчанні: 2.5 (250%), што азначае: калі абмежаванне не ўжываецца (стандартны цыкл 5),\nсіла ўсіх крыніц вады складае 350%."
roRO = "Multiplicatorul suplimentar maxim pentru vremea de musonuri la intensitatea maximă (fără handicap).\nAceastă valoare este afectată de handicap, la fel ca Durata.\nValoare implicită: 2.5 (250%), ceea ce înseamnă că, atunci când nu se aplică niciun handicap (ciclu implicit 5),\nintensitatea tuturor surselor de apă este de 350%."
huHU = "The maximális többletszorzó a monszunidőjárásnál, maximális értéken (nincs nehezítés).\nEzt az értéket a nehezítés ugyanúgy befolyásolja, mint a időtartamot.\nAlapértelmezett érték: 2,5 (250%), ami azt jelenti, hogy ha nincs nehezítés alkalmazva (alapértelmezett ciklus: 5),\nminden vízforrás erőssége 350%."
arSA = "الحد الأقصى للمضاعف الإضافي لطقس الموسم المطير عند أقصى شدة (بدون إعاقة).\nتتأثر هذه القيمة بالإعاقة مثل المدة.\nالقيمة الافتراضية: 2.5 (250%)، أي أنه عند عدم تطبيق أي إعاقة (الدورة الافتراضية 5)،\nتكون قوة جميع مصادر المياه 350%."

