["Building.PowerDam.Description"]
raw = "A Dam with a built in Water Wheel to generate Power.\nPower Shaft connections are only at the sides opposite expected water flow direction."
status = "normal"
enUS = "A Dam with a built-in Water Wheel to generate Power. Power Shaft connections are only on the sides opposite the expected water flow direction."
zhCN = "带有内置水轮的水坝以产生能量。动力轴连接仅位于与预期水流方向相对的两侧。"
zhTW = "「一座配備水輪的水壩，用於發電。動力軸連接僅在與預期水流方向相反的側面。」"
ruRU = "Плотина с встроенной водяной мельницей для генерации энергии. Соединения мощностных валов только с боков, противоположных ожидаемому направлению течения воды."
jaJP = "「水流の流れに対して反対側のみにパワーシャフト接続があります。」"
frFR = "Une digue avec une roue à eau intégrée pour générer de l'énergie. Les connexions de l'arbre de puissance ne sont que sur les côtés opposés à la direction attendue du flux d'eau."
deDE = "Ein Damm mit einem integrierten Wasserrad zur Stromerzeugung. Die Verbindungen zum Antriebswellen sind nur an den Seiten gegenüber der erwarteten Fließrichtung des Wassers."
plPL = "Nowy tekst do przetłumaczenia: \"Tama z wbudowaną turbiną wodną do generowania energii. Połączenia wału mocy znajdują się tylko po stronach przeciwnych do oczekiwanej kierunku przepływu wody.\""
ptBR = "Conexões de Eixo de Energia estão disponíveis apenas nos lados opostos à direção do fluxo de água esperado."
koKR = "전력을 생성하기 위한 수차가 내장된 댐입니다. 전력 축 연결은 예상되는 물 흐름 방향과 반대편의 측면에만 있습니다."
csCZ = "Jez s vestavěným vodním kolem pro generování energie. Připojení pohonného hřídele je pouze na stranách opačných od očekávaného směru toku vody."
viVN = "Một đập có bánh xe nước tích hợp để phát điện.\nCác kết nối trục nguồn chỉ ở hai bên ngược với hướng dòng nước dự kiến."
trTR = "Bir enerji üretmek için entegre su tekerleği bulunan bir baraj.\nGüç şaftı bağlantıları yalnızca beklenen su akış yönüne zıt olan kenarlardadır."

