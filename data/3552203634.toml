["Building.SeepCover.Description"]
raw = "A cover that can built on top of a Water Seep or Bad Water Seep to seal it. Can be opened or closed at will."
status = "normal"
enUS = "A cover that can be built on top of a Water Seep or Bad Water Seep to seal it. Can be opened or closed at will."
zhCN = "“一个可以建在水渗或污水渗上方的盖子，用以封闭它。可以随意打开或关闭。”"
zhTW = "可以建造在水滲透或污水滲透上方的蓋子，以密封它。可以隨意開啟或關閉。"
ruRU = "Крышка, которую можно построить над водяной трещиной или плохой водяной трещиной для ее герметизации. Можно открывать или закрывать по желанию."
jaJP = "水の滲みや悪水の滲みの上に設置して封印するためのカバー。自由に開閉できる。"
