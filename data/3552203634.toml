deDE = "Eine Abdeckung, die auf einem Wasser- oder Schlechtwasserquell gebaut werden kann, um ihn zu versiegeln. Kann nach Belieben geöffnet oder geschlossen werden."
plPL = "Pokrywa, którą można zbudować na powierzchni Wody Przepływowej lub Złej Wody Przepływowej, aby ją uszczelnić. Może być otwierana lub zamykana według potrzeb."
ptBR = "Uma cobertura que pode ser construída em cima de uma Fonte de Água ou Fonte de Água Ruim para vedá-la. Pode ser aberta ou fechada à vontade."
koKR = "물 스며드는 곳이나 나쁜 물 스며드는 곳 위에 세울 수 있는 덮개로, 그것을 밀봉합니다. 원하는 대로 열거나 닫을 수 있습니다."
trTR = "Bir su sızıntısının veya kirli su sızıntısının üstüne inşa edilebilen bir kapak. İstediğiniz zaman açılabilir veya kapatılabilir."
esES = "Una cubierta que puede construirse encima de una filtración de agua o de una filtración de agua malograda para sellarla. Puede abrirse o cerrarse a voluntad."
itIT = "Una copertura che può essere costruita sopra una Infiltrazione d'Acqua o un'Infiltrazione di Acqua Cattiva per sigillarla. Può essere aperta o chiusa a piacere."
ukUA = "Кришка, яку можна встановити поверх Джерела просочування або Джерела просочування отруйної води, щоб його герметизувати. Її можна відкривати та закривати за потреби."
thTH = "ฝาปิดที่สามารถสร้างทับบนน้ำซึม (Water Seep) หรือน้ำซึมเสีย (Bad Water Seep) เพื่อปิดผนึกได้ สามารถเปิดหรือปิดได้ตามต้องการ"
csCZ = "Pokrytí, které lze postavit na vrch vodního prosaku nebo špatného vodního prosaku, aby se uzavřel. Může být otevřeno nebo zavřeno podle potřeby."
viVN = "Một tấm che có thể được xây trên một Chỗ thấm nước hoặc Chỗ thấm nước bẩn để bịt lại. Có thể mở hoặc đóng theo ý muốn."
caES = "Una tapa que es pot construir sobre una Filtració d'aigua o una Filtració d'aigua contaminada per segellar-la. Es pot obrir o tancar quan es vulgui."
beBY = "Накрыўка, якую можна ўсталяваць на Водную просачку або Брудную просачку, каб запячатаць яе. Можа адчыняцца і зачыняцца па жаданні."
roRO = "O cutie care poate fi construită deasupra unei Infiltrații de apă sau a unei Infiltrații de apă otrăvită, pentru a o sigila. Poate fi deschisă sau închisă după dorință."
huHU = "Fedél, amely a Vízszivárgás vagy a Mérgezett vízszivárgás tetejére építhető, hogy lezárja azt. Tetszés szerint nyitható vagy zárható."
arSA = "غطاء يمكن بناؤه فوق نبع تسرب للمياه أو نبع تسرب للمياه الملوثة لإغلاقه. يمكن فتحه أو إغلاقه متى شاء."

