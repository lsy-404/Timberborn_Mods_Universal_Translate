["Building.Branch.Description"]
raw = "A Branch. It can connect to the side of many Tree-style buildings. Some buildings will want to connect to Branches rather than Paths."
status = "normal"
enUS = "A Branch. It can connect to the side of many Tree-style buildings. Some buildings will want to connect to Branches rather than Paths."
zhCN = "连接树干建筑的通道，连接处会自动开门。<br><color=#FFA500>部分建筑倾向于与杈道连接，而非道路。</color>"
zhTW = "一個分支。它可以連接到許多樹型建築的側面。一些建築會希望連接到分支而不是小路。"
ruRU = "Ветвь. Она может соединяться с боковой частью многих зданий в стиле Дерева. Некоторые здания предпочтут соединяться с Ветвями, а не с Путями."
jaJP = "枝。多くの木のスタイルの建物の側面に接続することができます。一部の建物は、道ではなく枝に接続したいと考えるでしょう。"
frFR = "Une Branche. Elle peut se connecter au côté de nombreux bâtiments de style Arbre. Certains bâtiments préféreront se connecter aux Branches plutôt qu'aux Chemins."
deDE = "Ein Ast. Er kann sich mit der Seite vieler Baumstil-Gebäude verbinden. Einige Gebäude möchten sich lieber mit Ästen als mit Wegen verbinden."
plPL = "Gałąź. Może łączyć się z bokiem wielu budynków stylu drzewo. Niektóre budynki mogą chcieć łączyć się z Gałęziami zamiast ze Ścieżkami."
ptBR = "Uma Ramificação. Pode se conectar ao lado de muitos edifícios estilo Árvore. Alguns edifícios preferirão se conectar a Ramificações ao invés de Caminhos."
koKR = "가지입니다. 많은 나무 스타일 건물의 측면에 연결될 수 있습니다. 일부 건물은 경로보다 가지에 연결되기를 원할 것입니다."
csCZ = "Větev. Může se napojit na stranu mnoha budov ve stylu stromu. Některé budovy se chtějí napojit na větve spíše než na cesty."
viVN = "Một nhánh. Nó có thể kết nối với mặt bên của nhiều tòa nhà kiểu cây. Một số tòa nhà sẽ muốn kết nối với các nhánh thay vì các đường đi."
trTR = "Bir Dal. Birçok Ağaç tarzı binanın yanına bağlanabilir. Bazı binalar, Yollar yerine Dallara bağlanmak isteyecektir."

