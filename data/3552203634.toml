["Building.TreeTrunk.Branch.Description"]
raw = "A Treetrunk Side Block with a Door on one side, and Branch connection on the other. This allows beavers to pass between Paths (or the tree central access shaft) and a Branch."
status = "normal"
enUS = "A Treetrunk Side Block with a Door on one side, and Branch connection on the other. This allows beavers to pass between Paths (or the tree central access shaft) and a Branch."
zhCN = "带有内部通道，背面可以与杈道连接，互相通行。"
zhTW = "樹幹側塊，單側有門，另一側有樹枝連接。這使得海狸可以在小路（或樹木中央通道）和樹枝之間通行。"
ruRU = "Боковой блок ствола дерева с дверью с одной стороны и соединением ветки с другой. Это позволяет бобрам проходить между путями (или центральным доступом к дереву) и веткой."
jaJP = "「片側にドアがあり、もう一方にブランチ接続のある木の幹のサイドブロックです。これにより、ビーバーは道（または木の中央アクセスシャフト）とブランチの間を移動できます。」"
frFR = "Un bloc latéral de tronc d'arbre avec une porte d'un côté et une connexion de branche de l'autre. Cela permet aux castors de passer entre les chemins (ou la colonne d'accès centrale de l'arbre) et une branche."
deDE = "Ein Stammseitenblock mit einer Tür auf einer Seite und einer Astverbindung auf der anderen. Dies ermöglicht den Bibern, zwischen Wegen (oder dem zentralen Zugangsschacht des Baumes) und einem Ast zu passieren."
plPL = "Blok boczny pnia drzewa z drzwiami z jednej strony i połączeniem gałęzi z drugiej. Dzięki temu bobry mogą przechodzić między ścieżkami (lub centralnym szybem dostępowym drzewa) a gałęzią."
ptBR = "Um Bloco Lateral de Tronco de Árvore com uma Porta de um lado e conexão de Galho do outro. Isso permite que os castores passem entre os Caminhos (ou o eixo de acesso central da árvore) e um Galho."
koKR = "한쪽에는 문이 있는 나무 줄기 측면 블록이며, 다른 한쪽에는 가지 연결이 있습니다. 이를 통해 비버는 경로(또는 나무 중앙 접근 샤프트)와 가지 사이를 이동할 수 있습니다."
csCZ = "Boční blok kmene s dveřmi na jedné straně a napojením na větev na druhé straně. To umožňuje bobrům přecházet mezi cestami (nebo centrálním přístupovým šachtě stromu) a větví."
viVN = "Một khối bên thân cây có một cửa ở một bên và kết nối với một nhánh ở bên kia. Điều này cho phép hải ly đi qua giữa các lối đi (hoặc trục truy cập trung tâm của cây) và một nhánh."
