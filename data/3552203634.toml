trTR = "''Ama eşyalarını nasıl tutacaklar?'' -Pmduda"
esES = "''¿Pero cómo se supone que sostengan sus cosas?'' -Pmduda"
itIT = "''Ma come fanno a tenere in mano i loro oggetti?'' -Pmduda"
ukUA = "''Але як же вони мають тримати свої речі?'' -Pmduda"
thTH = "''แต่พวกมันควรจะถือของของตัวเองยังไงกันแน่?'' -Pmduda"
csCZ = "''Ale jak mají držet své věci?'' -Pmduda"
viVN = "''Nhưng làm sao họ có thể giữ đồ của mình được?'' -Pmduda"
caES = "«Però com se suposa que han de subjectar les seves coses?» -Pmduda"
beBY = "«Але як жа яны павінны трымаць свае рэчы?» —Pmduda"
roRO = "„Dar cum ar trebui să-și țină lucrurile?” -Pmduda"
huHU = "''De hogyan kellene nekik tartaniuk a holmijukat?'' -Pmduda"
arSA = "''لكن كيف من المفترض أن يمسكوا بأغراضهم؟'' -Pmduda"

