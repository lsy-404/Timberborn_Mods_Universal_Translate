["Building.Floodgate.Flat.Description"]
raw = "Blocks water up to an adjustable height. A new more compact design to allow you to build on top of them."
status = "normal"
enUS = "Blocks water up to an adjustable height. A new more compact design to allow you to build on top of them."
zhCN = "改进的闸门，去掉了多余的顶部结构，可以在上面建造其他建筑。"
zhTW = "可以阻擋水上升至可調整的高度。新的更緊湊設計，允許您在其上方建造。"
ruRU = "Блокирует воду до регулируемой высоты. Новый более компактный дизайн позволяет строить на них."
jaJP = "水を調整可能な高さまでブロックします。上に建設できるように、よりコンパクトな新デザインです。"
frFR = "Bloque l'eau jusqu'à une hauteur réglable. Un nouveau design plus compact pour vous permettre de construire dessus."
deDE = "Blockiert Wasser bis zu einer einstellbaren Höhe. Ein neues, kompakteres Design, das es Ihnen ermöglicht, oben auf ihnen zu bauen."
plPL = "Zatrzymuje wodę do regulowanej wysokości. Nowy, bardziej kompaktowy projekt pozwala na budowanie na nich."
ptBR = "Bloqueia a água até uma altura ajustável. Um novo design mais compacto que permite que você construa em cima deles."
koKR = "조정 가능한 높이까지 물을 막습니다. 그 위에 건설할 수 있도록 더 작고 새로워진 디자인입니다."
csCZ = "Zablokuje vodu až do nastavitelné výšky. Nový kompaktnější design, který vám umožní stavět na jejich vrchu."
viVN = "Chặn nước lên tới độ cao có thể điều chỉnh. Một thiết kế mới nhỏ gọn hơn cho phép bạn xây dựng trên chúng."
trTR = "Suya ayarlanabilir bir yükseklik boyunca engel olur. Üzerinde inşa etmenizi sağlayacak daha kompakt bir tasarım."

