["Building.BotAssembler.Description.LeafCoats"]
raw = "Assembles autonomous bots, who can assist beavers in their everyday tasks.\nDesigned to be placed on top of the Bot Part Factory when built in the tree."
status = "normal"
enUS = "Assembles autonomous bots, who can assist beavers in their everyday tasks.\nDesigned to be placed on top of the Bot Part Factory when built in the tree."
zhCN = "组装自动机关人，其可以协助海狸完成日常的工作。<br><color=#FFA500>建造树状结构时，可以与机关人部件工厂组合。</color>"
zhTW = "組裝自動化機器人，能協助海狸處理日常任務。建造時設計為放置在機器零件工廠上方。"
ruRU = "Собирает автономных роботов, которые могут помогать бобрам в их повседневных задачах. Предназначен для установки сверху на Фабрику Частей Роботов после постройки на дереве."
jaJP = "「自律型ロボットを組み立て、ビーバーの日常業務を支援します。設置する際は、木に建設されたボットパーツ工場の上に配置するように設計されています。」"
frFR = "Assemble des bots autonomes, qui peuvent aider les castors dans leurs tâches quotidiennes. Conçu pour être placé au sommet de l'usine de pièces de bots lorsqu'il est construit dans l'arbre."
deDE = "Stellt autonome Bots zusammen, die den Bibern bei ihren täglichen Aufgaben helfen können. Entwickelt, um auf der Bot-Teile-Fabrik platziert zu werden, wenn sie im Baum gebaut wird."
plPL = "Składa autonomiczne boty, które mogą wspierać bobry w ich codziennych zadaniach. Zaprojektowany do umieszczenia na szczycie Fabryki Części Botów po zbudowaniu na drzewie."
ptBR = "Montadora de Bots autônomos, que podem ajudar os castores em suas tarefas diárias. Projetada para ser colocada em cima da Fábrica de Peças de Bots quando construída na árvore."
koKR = "자율 봇을 조립하여 비버들이 일상적인 작업을 도와줄 수 있습니다.\n나무에 건설할 때 봇 부품 공장 위에 배치하도록 설계되었습니다."
csCZ = "Montuje autonomní roboty, kteří mohou pomáhat bobrům v jejich každodenních úkolech. Navrženo k umístění na vrchol továrny na robotí části, když je postaveno na stromě."
viVN = "Lắp ráp các bot tự động, có thể hỗ trợ hải ly trong các công việc hàng ngày của chúng.\nĐược thiết kế để đặt trên đỉnh của Nhà máy Bộ phận Bot khi được xây dựng trên cây."
trTR = "Otonom botlar toplar, bunlar kunduzlara günlük görevlerinde yardımcı olabilir. İnşa edildiğinde ağaçtaki Bot Parça Fabrikasının üstüne yerleştirilmek üzere tasarlanmıştır."

