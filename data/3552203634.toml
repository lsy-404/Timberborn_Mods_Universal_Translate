["Faction.LeafCoats.Description"]
raw = "The Leaf Coats have an affinity for trees and plantlife in general. They like to build in a way that mimics nature, including an expansive structure that resembles a giant tree.\nTheir motto: <i>The way of the Tree.</i>"
status = "normal"
enUS = "The Leaf Coats have an affinity for trees and plantlife in general. They like to build in a way that mimics nature, including an expansive structure that resembles a giant tree. Their motto: <i>The way of the Tree.</i>"
zhCN = "叶衣种族对树木和植物有着天然的亲和力。他们喜欢以模仿自然的方式来建造，创造出类似巨树的扩展结构。<br>座右铭：<i>树的道路。</i>"
zhTW = "葉衣族對樹木和植物生命有著深厚的情感。他們喜歡以模仿自然的方式建造，包括一個類似於巨樹的宏大結構。  \n他們的座右銘：<i>樹之道。</i>"
ruRU = "Листокожие имеют склонность к деревьям и растительности в целом. Они любят строить так, чтобы это имитировало природу, включая обширное сооружение, которое напоминает гигантское дерево. Их девиз: <i>Путь Дерева.</i>"
jaJP = "リーフコーツは、樹木や植物全般に親しみを持っています。彼らは自然を模した方法で建設することを好み、巨大な木に似た広大な構造物を含みます。  \n彼らのモットー：<i>木の道。</i>"
frFR = "Les Pelages de Feuille ont une affinité pour les arbres et la végétation en général. Ils aiment construire d'une manière qui imite la nature, y compris une structure expansive qui ressemble à un immense arbre.  \nLeur devise : <i>La voie de l'Arbre.</i>"
deDE = "Die Blattmäntel haben eine Affinität zu Bäumen und Pflanzenleben im Allgemeinen. Sie bauen gerne auf eine Weise, die die Natur nachahmt, einschließlich einer ausgedehnten Struktur, die einem riesigen Baum ähnelt. Ihr Motto: <i>Der Weg des Baumes.</i>"
plPL = "Liściaste Mantele mają zamiłowanie do drzew i roślinności ogólnie. Lubię budować w sposób, który naśladuje naturę, w tym rozległą strukturę przypominającą wielkie drzewo.  \nIch motto: <i>Droga Drzewa.</i>"
ptBR = "As Folhas de Pelagem têm uma afinidade por árvores e pela flora em geral. Elas gostam de construir de maneira que imita a natureza, incluindo uma estrutura expansiva que se assemelha a uma enorme árvore.  \nSeu lema: <i>O caminho da Árvore.</i>"
koKR = "리프코트는 나무와 식물에 대한 친화력이 있습니다. 그들은 자연을 모방하는 방식으로 건물을 짓는 것을 좋아하며, 거대한 나무와 닮은 광범위한 구조물을 포함합니다.  \n그들의 모토: <i>나무의 길.</i>"
csCZ = "Listové pláště mají affinity k stromům a rostlinám obecně. Rádi staví způsobem, který napodobuje přírodu, včetně rozsáhlé stavby, která připomíná obrovský strom. Jejich motto: <i>Cesta stromu.</i>"
viVN = "Leaf Coats có sự đồng cảm với cây cối và đời sống thực vật nói chung. Họ thích xây dựng theo cách mô phỏng tự nhiên, bao gồm một cấu trúc rộng lớn giống như một cây khổng lồ.\nPhương châm của họ: <i>Con đường của cây.</i>"
trTR = "Yaprak Kıyafetleri, ağaçlara ve bitki örtüsüne karşı bir bağlılığa sahiptir. Doğayı taklit eden bir şekilde inşa etmeyi severler, büyük bir ağacı andıran geniş yapılar da dâhildir.  \nSloganları: <i>Ağacın Yolu.</i>"

["Faction.LeafCoats.GameOver.Message"]
raw = "Your Leaf Coats met the sad fate of their human predecessors. This is the end."
status = "normal"
enUS = "Your Leaf Coats met the sad fate of their human predecessors. This is the end."
zhCN = "“你的叶外套遭遇了它们人类前身的悲惨命运。这就是结局。”"
zhTW = "你的葉子外套遭遇了前人類的悲慘命運。這就是結局。"
ruRU = "Ваши Листья Костюмы встретили печальную судьбу своих человеческих предшественников. Это конец."
jaJP = "あなたのリーフコートは、彼らの人間の前任者と同じ悲しい運命を迎えました。これが終わりです。"
frFR = "Vos Leaf Coats ont rencontré le triste destin de leurs prédécesseurs humains. C'est la fin."
deDE = "Deine Blättermäntel erlitten das traurige Schicksal ihrer menschlichen Vorgänger. Das ist das Ende."
plPL = "Twoje Liściaste Płaszczyzny spotkały smutny los swoich ludzkich poprzedników. To koniec."
ptBR = "Seus Leaf Coats encontraram o triste destino de seus predecessores humanos. Este é o fim."
koKR = "당신의 리프 코트는 인간 선조들의 슬픈 운명과 같은 길을 걸었습니다. 이것이 끝입니다."
csCZ = "Vaše Listové Pláště potkala smutná smrt jejich lidských předchůdců. To je konec."
viVN = "Các Leaf Coats của bạn đã gặp số phận buồn thảm giống như các tổ tiên con người của chúng. Đây là điểm kết thúc."
trTR = "Yaprak Kıyafetleriniz, insan öncülerinin üzücü kaderiyle karşılaştı. Bu son."

["Faction.LeafCoats.WonderCompletionFlavor"]
raw = "Having collected great wealth and knowledge, your beavers have decided to celebrate the success of the new colony with a party. Time to dance at the Disco! Though most of the settlement just gets to watch the colorful lights."
status = "normal"
enUS = "Having collected great wealth and knowledge, your beavers have decided to celebrate the success of the new colony with a party. Time to dance at the Disco! Though most of the settlement just gets to watch the colorful lights."
zhCN = "在积累了丰富的财富和知识后，你的海狸决定以一场派对来庆祝新殖民地的成功。是时候在迪斯科舞厅跳舞了！虽然大部分居民只能眼睁睁看着五光十色的灯光。"
zhTW = "在收集了大量的財富和知識之後，你的海狸們決定舉辦一場派對，以慶祝新殖民地的成功。是時候在迪斯可舞池裡跳舞了！雖然大多數居民只是觀看色彩斑斕的燈光。"
ruRU = "Собрав огромное богатство и знания, ваши бобры решили отпраздновать успех новой колонии вечеринкой. Время танцевать на диско! Хотя большая часть поселения просто наблюдает за цветными огнями."
jaJP = "「豊富な富と知識を集めたビーバーたちは、新しいコロニーの成功を祝うためにパーティーを開くことに決めました。ディスコで踊る時間です！ただし、定住者のほとんどは色とりどりの光を見ているだけです。」"
frFR = "Ayant collecté une grande richesse et connaissance, vos castors ont décidé de célébrer le succès de la nouvelle colonie avec une fête. Il est temps de danser au Disco ! Bien que la plupart des habitants de la colonie se contentent de regarder les lumières colorées."
deDE = "Nachdem sie großen Reichtum und Wissen angehäuft haben, haben Ihre Biber beschlossen, den Erfolg der neuen Kolonie mit einer Feier zu feiern. Zeit, in der Disco zu tanzen! Obwohl der Großteil der Siedlung nur die bunten Lichter beobachten kann."
plPL = "Zgromadziwszy wielkie bogactwa i wiedzę, twoje bobry postanowiły uczcić sukces nowej kolonii imprezą. Czas tańczyć na Dyskotece! Chociaż większość osady tylko przygląda się kolorowym światłom."
ptBR = "Após coletar grande riqueza e conhecimento, seus castores decidiram celebrar o sucesso da nova colônia com uma festa. Hora de dançar no Disco! Embora a maioria da aldeia só tenha a oportunidade de assistir às luzes coloridas."
koKR = "막대한 부와 지식을 모은 당신의 비버들은 새로운 식민지의 성공을 축하하기 위해 파티를 열기로 결정했습니다. 디스코에서 춤을 출 시간입니다! 하지만 대부분의 정착민들은 화려한 조명을 지켜보는 것뿐입니다."
csCZ = "Po nasbírání velkého bohatství a znalostí se vaši bobři rozhodli oslavit úspěch nové kolonie párty. Je čas tančit na Disku! I když většina osady jen sleduje barevná světla."
viVN = "Với sự giàu có và kiến thức lớn, những chú thú gỗ của bạn đã quyết định tổ chức một bữa tiệc để ăn mừng thành công của thuộc địa mới. Đã đến lúc khiêu vũ tại Disco! Tuy nhiên, hầu hết cư dân trong khu định cư chỉ có thể xem những ánh đèn màu sắc."
trTR = "Büyük zenginlik ve bilgi toplayan kunduzlarınız, yeni koloninin başarısını bir partiyle kutlamaya karar verdiler. Disko'da dans etme zamanı! Ancak yerleşimin çoğu sadece renkli ışıkları izlemeye fırsat buluyor."

["Faction.LeafCoats.WonderCompletionMessage"]
raw = "Congratulations! You mastered Leaf Coats' nature-oriented ways and used this map's resources to build the faction's wonder."
status = "normal"
enUS = "Congratulations! You mastered Leaf Coats' nature-oriented ways and used this map's resources to build the faction's wonder."
zhCN = "恭喜！你掌握了Leaf Coats的自然导向方法，并利用这个地图的资源建造了该派系的奇迹。"
zhTW = "恭喜！你掌握了 Leaf Coats 的自然導向方式，並利用這張地圖的資源建造了該派系的奇觀。"
ruRU = "Поздравляем! Вы освоили природные методы Листоков и использовали ресурсы этой карты для строительства чуда фракции."
jaJP = "おめでとうございます！あなたはLeaf Coatsの自然志向の方法をマスターし、このマップの資源を使って派閥のワンダーを築きました。"
frFR = "Félicitations ! Vous avez maîtrisé les méthodes axées sur la nature des Leaf Coats et utilisé les ressources de cette carte pour construire la merveille de la faction."
deDE = "Herzlichen Glückwunsch! Du hast die naturorientierten Wege von Leaf Coats gemeistert und die Ressourcen dieser Karte genutzt, um das Wunder der Fraktion zu erbauen."
plPL = "Gratulacje! Opanowałeś przyrodnicze sposoby Listowców i wykorzystałeś zasoby tej mapy, aby zbudować cud frakcji."
ptBR = "Parabéns! Você dominou os modos voltados para a natureza dos Leaf Coats e usou os recursos deste mapa para construir a maravilha da facção."
koKR = "축하합니다! 당신은 Leaf Coats의 자연 중심 방식을 마스터하고 이 맵의 자원을 사용하여 파벌의 기적을 지었습니다."
csCZ = "Gratulujeme! Ovládli jste přírodní způsoby listových plášťů a využili zdroje této mapy k vybudování zázraku frakce."
viVN = "Chúc mừng! Bạn đã thành thạo các phương pháp hướng về thiên nhiên của Leaf Coats và sử dụng tài nguyên của bản đồ này để xây dựng kỳ quan của phe."
trTR = "Tebrikler! Leaf Coats'ın doğa odaklı yöntemlerini ustalıkla öğrendin ve bu haritanın kaynaklarını kullanarak fraksiyonun harikasını inşa ettin."

