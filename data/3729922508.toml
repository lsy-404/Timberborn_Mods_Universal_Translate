["blight.settings.allowhazardousweather.tooltip"]
raw = "When checked, spore cloud events can occur during droughts and bad tides."
status = "normal"
enUS = "When checked, spore cloud events can occur during droughts and bad tides."
zhCN = "“勾选后，孢子云事件可以在干旱和潮汐不良时发生。”"
zhTW = "選取後，孢子雲事件可以在乾旱和不良潮汐期間發生。"
ruRU = "Если отмечено, события с облаками спор могут происходить во время засухи и неблагоприятных приливов."
jaJP = "「チェックを入れると、干ばつや悪潮の際に胞子雲イベントが発生する可能性があります。」"
frFR = "Lorsqu'elle est cochée, des événements de nuages de spores peuvent se produire pendant les sécheresses et les mauvaises marées."
deDE = "Wenn aktiviert, können Sporenwolkenereignisse während Dürren und ungünstigen Gezeiten auftreten."
plPL = "Gdy zaznaczone, wydarzenia z chmurami zarodników mogą występować podczas suszy i złych przypływów."
ptBR = "Quando marcado, eventos de nuvens de esporos podem ocorrer durante secas e marés ruins."
koKR = "체크하면, 가뭄과 나쁜 조수 동안 포자 구름 이벤트가 발생할 수 있습니다."
csCZ = "Když je zaškrtnuto, mohou během sucha a špatných přílivů nastat události spojené s oblaky spor."
viVN = "Khi được chọn, các sự kiện mây bào tử có thể xảy ra trong thời kỳ hạn hán và triều cường."
trTR = "Seçili olduğunda, kuraklık ve kötü gelgitler sırasında spor bulutu olayları gerçekleşebilir."
esES = "Si está marcada, pueden producirse eventos de nubes de esporas durante las sequías y las mareas tóxicas."
itIT = "Se selezionata, gli eventi di nubi di spore possono verificarsi durante le siccità e le maree tossiche."
ukUA = "Якщо позначено, події хмар спор можуть відбуватися під час посух і поганих припливів."
thTH = "เมื่อเลือกไว้ เหตุการณ์เมฆสปอร์สามารถเกิดขึ้นในช่วงภัยแล้งและช่วงน้ำเสียไหลบ่าได้"
caES = "Si està marcat, poden produir-se esdeveniments de núvols d’espores durant les sequeres i les marees tòxiques."
beBY = "Калі пастаўлена галачка, падчас засух і таксічных прыліваў могуць адбывацца падзеі з воблакамі спор."
roRO = "Când este bifată, pot avea loc evenimente cu nori de spori în timpul secetelor și al mareelor toxice."
huHU = "Bejelölése esetén spórafelhő-események fordulhatnak elő aszályok és rossz árapályok idején."
arSA = "عند تحديد هذا الخيار، يمكن أن تحدث أحداث السحب البوغية أثناء فترات الجفاف والمدّ السيئ."
