["Building.CaravanPost.FlavorDescription"]
status = "normal"
raw = "\"Whatever you can spare, someone beyond the horizon wants.\""
enUS = "\"Whatever you can spare, someone beyond the horizon wants.\""
zhCN = "\"你能抽出的任何东西，地平线之外总有人想要。\""
zhTW = "「你能勻出的東西，地平線另一端總有人需要。」"
ruRU = "«Всё, что можешь уделить, кому-то за горизонтом обязательно понадобится.»"
jaJP = "「余っているものは、地平線の向こうの誰かが欲しがっている。」"
frFR = "« Tout ce que vous pouvez vous permettre, quelqu'un au-delà de l'horizon le désire. »"
deDE = "\"Was du entbehren kannst, will jemand jenseits des Horizonts haben.\""
plPL = "\"Cokolwiek możesz oddać, ktoś za horyzontem tego potrzebuje.\""
ptBR = "\"Tudo que você puder dispensar, alguém além do horizonte deseja.\""
koKR = "\"여유가 있는 건 무엇이든, 지평선 너머의 누군가가 원하고 있다.\""
trTR = "\"Elinde fazla ne varsa, ufkun ötesinde biri onu istiyor.\""
esES = "\"Lo que puedas prescindir, alguien más allá del horizonte lo quiere.\""
itIT = "\"Qualunque cosa tu possa offrire, qualcuno oltre l'orizzonte la desidera.\""
ukUA = "\"Усе, чим можете поділитися, комусь за обрієм потрібно.\""
thTH = "\"สิ่งที่พอจะแบ่งได้ ใครบางคนไกลออกไปเหนือขอบฟ้าก็อยากได้\""
csCZ = "\"Cokoli můžeš postrádat, někdo za obzorem to chce.\""
viVN = "\"Bất cứ thứ gì bạn có thể đóng góp, đều có người ở tận chân trời xa xôi mong muốn.\""
caES = "\"Tot el que puguis prescindir, algú més enllà de l'horitzó ho vol.\""
beBY = "«Усё, без чаго можаш абысціся, хтосьці за гарызонтам ужо хоча.»"
roRO = "\"Orice poți lăsa, cineva de dincolo de orizont își dorește.\""
huHU = "„Bármit is tudsz nélkülözni, valaki a horizonton túl azt szeretné.\""
arSA = "\"مهما كان ما يمكنك التخلي عنه، ثمة من يتوق إليه وراء الأفق.\""

