["Building.FogTower.FogTowerSmall.Description"]
status = "normal"
raw = "A custom timber base and basin below and a diamond timber frame with cloth above, leaning slightly backwards. Yields 1 water per hour, holds up to 15, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
enUS = "A custom timber base and basin below and a diamond timber frame with cloth above, leaning slightly backwards. Yields 1 water per hour, holds up to 15, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
zhCN = "自定义木质底座和水池位于下方，上方是钻石形木框架并覆盖布料，略微向后倾斜。每小时产出1单位水，最多可储存15单位，无需工人。仅在温和天气的夜间工作；干旱和恶水潮期间停止运行，并且建造得越高、风力越强，工作速度越快。"
zhTW = "底部为自定义木制底座和水盆，上方为带布料的菱形木框架，略微向后倾斜。每小时产出 1 水，最多可储存 15 水，无需工人。仅在温和天气的夜间运作；干旱和坏水潮期间会停止运作。风越大、建造位置越高，运作速度越快。"
ruRU = "Нижняя часть из особой деревянной основы и чаши, а сверху каркас из ромбовидных брусьев с тканевым покрытием, слегка наклонённый назад. Производит 1 воду в час, вмещает до 15 и не требует рабочего. Работает только ночью в умеренную погоду; останавливается во время засух и плохих приливов, а чем выше построено здание и чем сильнее ветер, тем быстрее работает."
jaJP = "下部には特注の木製の基礎と水盤があり、上部には布を張った菱形の木枠がやや後方に傾いている。1時間あたり水を1生成し、最大15まで貯蔵できる。作業員は不要。温帯の天候の夜間にのみ稼働し、干ばつとバッドタイド中は停止する。高く建てるほど、風が強いほど速く稼働する。"
frFR = "A base et un bassin en bois sur mesure en dessous, et une structure en bois en losange avec tissu au-dessus, légèrement inclinée vers l'arrière. Produit 1 eau par heure, en contient jusqu'à 15, et ne nécessite aucun travailleur. Ne fonctionne que la nuit par temps tempéré ; s'arrête pendant les sécheresses et les marées noires, et fonctionne d'autant plus vite que la structure est haute et que le vent est fort."
deDE = "Ein maßgefertigter Holzsockel und ein Becken darunter sowie ein rautenförmiges Holzgerüst mit Stoff darüber, leicht nach hinten geneigt. Erzeugt 1 Wasser pro Stunde, fasst bis zu 15 und benötigt keinen Arbeiter. Funktioniert nur nachts bei gemäßigtem Wetter; stoppt bei Dürren und Schlechtwasser-Fluten und arbeitet umso schneller, je höher es gebaut ist und je stärker der Wind weht."
plPL = "Niestandardowa drewniana podstawa i zbiornik poniżej, diamentowa drewniana rama z tkaniną powyżej, lekko odchylona do tyłu. Daje 1 wodę na godzinę, magazynuje do 15 i nie wymaga pracownika. Działa tylko nocą przy umiarkowanej pogodzie; zatrzymuje się podczas susz i zatrutych przypływów, a im wyżej jest zbudowana i im silniejszy wiatr, tym działa szybciej."
ptBR = "A base de madeira personalizada e a bacia embaixo, e uma estrutura de madeira em losango com tecido em cima, levemente inclinada para trás. Produz 1 água por hora, armazena até 15 e não precisa de trabalhador. Funciona apenas à noite em clima temperado; para em secas e marés ruins, e funciona mais rápido quanto mais alto for construída e quanto mais forte for o vento."
koKR = "아래에는 맞춤형 목재 받침대와 물받이가 있고, 위에는 천을 씌운 다이아몬드 형태의 목재 틀이 있으며 살짝 뒤로 기울어져 있습니다. 시간당 물 1을 생산하며, 최대 15까지 저장할 수 있고, 일꾼이 필요하지 않습니다. 온화한 날씨의 밤에만 작동하며, 가뭄과 배드타이드 중에는 멈춥니다. 높이 지을수록, 바람이 강할수록 더 빠르게 작동합니다."
trTR = "A altta özel bir kereste tabanı ve havuz, üstte ise kumaş kaplı elmas biçimli bir kereste çerçeve bulunur ve hafifçe geriye yaslanır. Saatte 1 su üretir, en fazla 15 su depolar ve işçi gerektirmez. Yalnızca ılıman havada geceleri çalışır; kuraklıklarda ve kötü gelgitlerde durur. Ne kadar yüksek inşa edilirse ve rüzgâr ne kadar güçlüyse o kadar hızlı çalışır."
esES = "A base y cuenca de madera personalizada abajo y un armazón de madera en forma de diamante con tela arriba, ligeramente inclinado hacia atrás. Produce 1 agua por hora, almacena hasta 15 y no necesita ningún trabajador. Solo funciona de noche con clima templado; se detiene durante sequías y malas mareas, y funciona más rápido cuanto más alto esté construido y cuanto más fuerte sea el viento."
itIT = "A base e bacino in legno su misura sotto e una struttura a telaio di legno a diamante con tessuto sopra, leggermente inclinata all'indietro. Produce 1 acqua all'ora, ne contiene fino a 15 e non richiede alcun lavoratore. Funziona solo di notte con clima temperato; si ferma durante siccità e badtide, e lavora più velocemente quanto più è costruita in alto e quanto più forte è il vento."
ukUA = "Нижня частина — спеціальна дерев'яна основа та басейн, а верхня — ромбоподібна дерев'яна рама з тканиною, злегка відхилена назад. Виробляє 1 воду на годину, вміщує до 15 і не потребує працівника. Працює лише вночі за помірної погоди; зупиняється під час посухи та бедтайдів, а чим вище її збудовано і чим сильніший вітер, тим швидше вона працює."
thTH = "ฐานและอ่างเก็บน้ำแบบไม้ซุงสั่งทำพิเศษอยู่ด้านล่าง ส่วนโครงไม้เพชรที่หุ้มด้วยผ้าอยู่ด้านบน และเอนไปข้างหลังเล็กน้อย ผลิตน้ำได้ 1 หน่วยต่อชั่วโมง เก็บได้สูงสุด 15 หน่วย และไม่ต้องใช้คนงาน ทำงานได้เฉพาะตอนกลางคืนในสภาพอากาศอบอุ่นเท่านั้น จะหยุดทำงานในช่วงภัยแล้งและช่วงน้ำเสีย และยิ่งสร้างไว้สูงเท่าไร และลมยิ่งแรงเท่าไร ก็จะยิ่งทำงานเร็วขึ้น"
csCZ = "Vlastní dřevěná základna a nádrž dole a diamantový dřevěný rám s plátnem nahoře, mírně nakloněný dozadu. Vyrábí 1 vodu za hodinu, pojme až 15 a nepotřebuje žádného pracovníka. Funguje pouze v noci při mírném počasí; zastaví se při suchu a badtides a pracuje tím rychleji, čím je postaven výš a čím silnější je vítr."
viVN = "Đế và bồn chứa bằng gỗ tùy chỉnh ở phía dưới, khung gỗ hình thoi có phủ vải ở phía trên, nghiêng nhẹ về phía sau. Tạo ra 1 nước mỗi giờ, chứa tối đa 15, và không cần công nhân. Chỉ hoạt động vào ban đêm khi thời tiết ôn hòa; ngừng hoạt động trong hạn hán và thủy triều độc, và hoạt động càng nhanh khi được xây càng cao và gió càng mạnh."
caES = "Una base i un bassal de fusta personalitzats a sota i una estructura de fusta en forma de diamant amb tela a dalt, lleugerament inclinada cap enrere. Produeix 1 unitat d'aigua per hora, emmagatzema fins a 15 i no necessita cap treballador. Només funciona de nit en temps temperat; s'atura durant les sequeres i les marees dolentes, i funciona més ràpidament com més alt estigui construïda i com més fort sigui el vent."
beBY = "Унізу — індывідуальная драўляная аснова і басейн, уверсе — ромбападобны драўляны каркас з тканінай, злёгку нахілены назад. Вырабляе 1 адзінку вады за гадзіну, утрымлівае да 15 і не патрабуе работніка. Працуе толькі ўночы ў умераным надвор'і; спыняецца падчас засухі і благіх прылівaў, а чым вышэй пабудаваны і чым мацнейшы вецер, тым хутчэй працуе."
roRO = "O bază personalizată din lemn și un bazin dedesubt, precum și un cadru romboidal din lemn cu pânză deasupra, înclinat ușor spre spate. Produce 1 apă pe oră, poate stoca până la 15 și nu necesită niciun lucrător. Funcționează doar noaptea, pe vreme temperată; se oprește în timpul secetelor și al badtide-urilor și funcționează mai repede cu cât este construit mai sus și cu cât bate vântul mai tare."
huHU = "Alul egyedi faalap és medence, felül vászonnal borított gyémánt alakú fakeret, enyhén hátrafelé dőlve. Óránként 1 vizet termel, legfeljebb 15 vizet tárol, és nem igényel munkást. Csak éjszaka működik mérsékelt időjárás esetén; aszályok és szennyezett vízáradások idején leáll, és minél magasabbra épül, valamint minél erősebb a szél, annál gyorsabban dolgozik."
arSA = "قاعدة خشبية مخصصة وحوض في الأسفل، وإطار خشبي معيّن الشكل مع قماش في الأعلى، مائل قليلاً إلى الخلف. ينتج 1 ماء في الساعة، ويخزن حتى 15، ولا يحتاج إلى أي عامل. يعمل فقط ليلاً في الطقس المعتدل؛ ويتوقف أثناء الجفاف والمدّ السيء، ويعمل بسرعة أكبر كلما كان مرتفعاً أكثر وكانت الرياح أقوى."

