["Building.FogTower.FogTowerLarge.Description"]
new = "The whole tower, bucket and base included, is scaled uniformly two times (x2), with the diamond net NOT rotated (same facing and lean as the small one). It fits a 2 x 2 footprint exactly, with the tower centred and no overhang onto neighbouring ground. Cloth stretched across. Yields 3 water per hour, holds up to 50, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
status = "normal"
enUS = "The whole tower, bucket and base included, is scaled uniformly two times (x2), with the diamond net NOT rotated (same facing and lean as the small one). It fits a 2 x 2 footprint exactly, with the tower centred and no overhang onto neighbouring ground. Cloth stretched across. Yields 3 water per hour, holds up to 50, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
zhCN = "整座塔（包括水桶和底座）等比例放大两倍（x2），钻石形网面未旋转（朝向和倾斜角度与小型相同）。它恰好占据 2 x 2 的地基，塔身居中，不会悬挑到相邻地面上。布料已展开铺设。每小时产出 3 单位水，最多可储存 50 单位，无需工作人员。仅在温带天气的夜间工作；干旱和恶水潮期间停止运作。塔建得越高、风越强，工作速度越快。"
zhTW = "整座塔（包括水桶與底座）統一放大為兩倍（x2），鑽石網保持不旋轉（朝向與傾斜角度與小型版本相同）。它恰好符合 2 x 2 的佔地範圍，塔身置中，不會延伸到相鄰的地面上方。網布已拉展覆蓋。每小時產出 3 單位水，最多可儲存 50 單位，不需要工人。僅在溫帶天氣的夜間運作；乾旱與壞水潮期間會停止，建造得越高、風越強，運作速度越快。"
ruRU = "Вся башня, включая ведро и основание, масштабирована равномерно в два раза (x2), сетка из ромбов НЕ повёрнута (та же ориентация и наклон, что у малой версии). Она точно занимает площадь 2 x 2, башня расположена по центру и не выступает над соседними участками. Ткань натянута поперёк. Производит 3 воды в час, вмещает до 50 и не требует рабочего. Работает только ночью в умеренную погоду; останавливается во время засухи и плохих приливов, а работает быстрее, чем выше она построена и чем сильнее ветер."
jaJP = "タワー全体（バケツと土台を含む）を縦横とも2倍（x2）に拡大しています。ダイヤモンド型の網は回転させていません（小型版と同じ向きと傾き）。タワーは中央に配置され、隣接する土地にはみ出すことなく、ちょうど2 x 2の占有面積に収まります。布が張られています。1時間あたり3の水を生成し、最大50まで貯蔵でき、作業員は不要です。温帯の天候の夜間のみ稼働し、干ばつやバッドタイドの間は停止します。建設された高さが高いほど、また風が強いほど、より速く稼働します。"
frFR = "Toute la tour, seau et base compris, est mise à l'échelle uniformément par deux (x2), le filet en diamant n'étant PAS pivoté (même orientation et même inclinaison que la petite). Elle occupe exactement une emprise de 2 x 2, la tour étant centrée et ne débordant sur aucun terrain voisin. Un tissu est tendu en travers. Produit 3 eau par heure, peut contenir jusqu'à 50 unités, et ne nécessite aucun travailleur. Ne fonctionne que la nuit par temps tempéré ; s'arrête pendant les sécheresses et les marées noires, et fonctionne d'autant plus vite que la tour est haute et que le vent est fort."
deDE = "Der gesamte Turm, einschließlich Eimer und Sockel, ist gleichmäßig zweifach (x2) skaliert, wobei das Diamantnetz NICHT gedreht ist (gleiche Ausrichtung und Neigung wie beim kleinen). Er passt exakt auf eine Grundfläche von 2 x 2, der Turm steht zentriert und ragt nicht über benachbartes Gelände hinaus. Darüber ist Stoff gespannt. Liefert 3 Wasser pro Stunde, speichert bis zu 50 und benötigt keinen Arbeiter. Arbeitet nur nachts bei gemäßigtem Wetter; hält bei Dürren und Schlechtwasserereignissen an und arbeitet umso schneller, je höher er gebaut ist und je stärker der Wind weht."
plPL = "Cała wieża, wraz z wiadrem i podstawą, jest skalowana równomiernie dwukrotnie (x2), a diamentowa siatka nie jest obrócona (ma ten sam kierunek i nachylenie co mała wersja). Budynek dokładnie mieści się w obszarze 2 x 2, wieża jest wyśrodkowana i nie wystaje nad sąsiedni teren. Tkanina jest naciągnięta w poprzek. Produkuje 3 wody na godzinę, pomieści do 50 i nie wymaga pracownika. Działa tylko w nocy przy umiarkowanej pogodzie; zatrzymuje się podczas suszy i badtide, a im wyżej jest zbudowany i im silniejszy wiatr, tym szybciej działa."
ptBR = "The whole tower, bucket and base included, is scaled uniformly two times (x2), with the diamond net NOT rotated (same facing and lean as the small one). It fits a 2 x 2 footprint exactly, with the tower centred and no overhang onto neighbouring ground. Cloth stretched across. Yields 3 water per hour, holds up to 50, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
koKR = "전체 타워(물통과 기반 포함)를 가로세로 2배(x2) 균일하게 확대했으며, 다이아몬드 그물은 회전하지 않았습니다(작은 버전과 같은 방향과 기울기). 2 x 2 설치 면적에 정확히 맞고, 타워는 가운데에 위치하며 인접한 땅으로 튀어나오지 않습니다. 천이 펼쳐져 있습니다. 시간당 물 3을 생산하고, 최대 50까지 저장하며, 작업자는 필요하지 않습니다. 온화한 날씨의 밤에만 작동하며, 가뭄과 나쁜 물때에는 멈춥니다. 타워가 높이 지어질수록, 그리고 바람이 강할수록 더 빠르게 작동합니다."
trTR = "Tüm yapı, kova ve taban dahil, iki kat (x2) oranında eşit şekilde büyütülmüş; elmas ağ ise döndürülmemiş (küçük olanla aynı yöne bakar ve aynı eğimdedir). Tam olarak 2 x 2 alana sığar; kule ortalanmıştır ve komşu zemine taşmaz. Üzerine gerilmiş bez. Saatte 3 su üretir, 50'ye kadar depolar ve işçi gerektirmez. Yalnızca gece ve ılıman havada çalışır; kuraklıklarda ve kötü su baskınlarında durur. Ne kadar yüksek inşa edilirse ve rüzgar ne kadar güçlüyse o kadar hızlı çalışır."
esES = "The whole tower, bucket and base included, is scaled uniformly two times (x2), with the diamond net NOT rotated (same facing and lean as the small one). It fits a 2 x 2 footprint exactly, with the tower centred and no overhang onto neighbouring ground. Cloth stretched across. Yields 3 water per hour, holds up to 50, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
itIT = "Tutta la torre, secchio e base inclusi, è scalata uniformemente di due volte (x2), con la rete di diamante NON ruotata (stesso orientamento e inclinazione di quella piccola). Occupa esattamente un'area di 2 x 2, con la torre centrata e senza sporgere sul terreno circostante. Tessuto teso attraverso. Produce 3 acqua all'ora, ne contiene fino a 50, e non richiede alcun lavoratore. Funziona solo di notte con clima temperato; si ferma durante siccità e maree nere, e funziona più velocemente quanto più è alta la costruzione e quanto più forte è il vento."
ukUA = "Уся вежа, включно з відром і основою, масштабована вдвічі (x2), а діамантова сітка НЕ повернута (та сама орієнтація і нахил, що й у малої). Вона точно вміщується в ділянку 2 x 2, вежа розташована по центру і не виступає на сусідні ділянки. Тканина натягнута поперек. Виробляє 3 води на годину, утримує до 50 і не потребує працівника. Працює лише вночі за помірної погоди; зупиняється під час посух і токсичних припливів, а чим вище її побудовано і чим сильніший вітер, тим швидше вона працює."
csCZ = "Celá věž, včetně kbelíku a základny, je dvakrát (2×) zvětšena rovnoměrně, přičemž diamantová síť NENÍ otočena (stejná orientace a náklon jako u malé verze). Přesně se vejde na půdorys 2 × 2, věž je vycentrována a nepřesahuje na sousední pozemky. Látka je napnutá napříč. Vyrábí 3 vody za hodinu, pojme až 50 a nevyžaduje žádného pracovníka. Funguje pouze v noci při mírném počasí; zastaví se při suchu a při špatných přílivech a čím je postavena výše a čím silnější je vítr, tím rychleji pracuje."
viVN = "Toàn bộ tháp, bao gồm thùng và đế, được phóng to đều gấp hai lần (x2), còn lưới kim cương KHÔNG được xoay (cùng hướng và độ nghiêng với tháp nhỏ). Công trình vừa khít một nền 2 x 2, tháp nằm giữa và không nhô ra khỏi nền đất bên cạnh. Lưới vải được căng ngang. Tạo ra 3 nước mỗi giờ, chứa tối đa 50, và không cần thợ. Chỉ hoạt động vào ban đêm trong thời tiết ôn hòa; ngừng hoạt động khi hạn hán và triều độc, và hoạt động càng nhanh khi tháp được xây càng cao và gió càng mạnh."
caES = "La torre sencera, incloent-hi el dipòsit i la base, està escalada uniformement dues vegades (x2), amb la xarxa de rombes NO girada (mateixa orientació i inclinació que la petita). Encaixa exactament en una petjada de 2 x 2, amb la torre centrada i sense cap sobresortida sobre el terreny veí. Teixit estès a través. Produeix 3 d'aigua per hora, emmagatzema fins a 50 i no necessita cap treballador. Només funciona de nit en clima temperat; s'atura durant les sequeres i les marees tòxiques, i funciona més ràpid com més alta és la torre i més fort és el vent."
beBY = "Уся вежа, разам з вядром і асновай, маштабавана раўнамерна ў два разы (x2), пры гэтым ромбавідная сетка НЕ павернута (той жа напрамак і нахіл, што і ў малога). Вежа дакладна ўпісваецца ў плошчу 2 x 2, цэнтрыравана і не выступае на суседнюю зямлю. Тканіна натянута па ўсёй канструкцыі. Дае 3 вады ў гадзіну, утрымлівае да 50 і не патрабуе работніка. Працуе толькі ночы ў умераным надвор'і; спыняецца падчас засух і благіх прыліваў, а чым вышэй яна пабудаваная і чым мацнейшы вецер, тым хутчэй працуе."
roRO = "Întregul turn, inclusiv găleata și baza, este scalat uniform de două ori (x2), cu plasa de romb NEROTITĂ (aceeași orientare și înclinare ca cea mică). Se încadrează exact într-o amprentă de 2 x 2, turnul fiind centrat și fără să depășească pe terenul vecin. Pânză întinsă peste. Produce 3 apă pe oră, stochează până la 50 și nu necesită niciun lucrător. Funcționează doar noaptea, în vreme temperată; se oprește în secete și în valuri de ape otrăvite, iar cu cât este construit mai înalt și cu cât bate vântul mai tare, cu atât lucrează mai repede."
huHU = "A teljes torony, beleértve a vödröt és az alapot is, kétszeresére van méretezve (x2), a gyémánt alakú háló pedig NEM lett elforgatva (ugyanúgy néz és dől, mint a kicsi). Pontosan illeszkedik a 2 x 2-es alapterületbe, a torony középen áll, és nem nyúlik át a szomszédos területre. Vászon feszül rajta. Óránként 3 vizet termel, legfeljebb 50-et tárol, és nincs szüksége munkásra. Csak éjszaka működik, mérsékelt időjárás esetén; aszályok és mérgezett árapály idején leáll, a magasabbra épített és az erősebb szélben gyorsabban dolgozik."
arSA = "البرج كاملًا، بما فيه الدلو والقاعدة، مُكبَّر بمقدار مرتين (×2) بشكل متناسب، مع عدم تدوير الشبكة الماسية (نفس الاتجاه والميل كما في النسخة الصغيرة). يتسع تمامًا لمساحة 2 × 2، مع توسيط البرج وعدم تجاوزه إلى الأرض المجاورة. القماش ممدود عبره. ينتج 3 وحدات مياه في الساعة، ويحتفظ بما يصل إلى 50، ولا يحتاج إلى عامل. يعمل فقط ليلًا في الطقس المعتدل؛ ويتوقف أثناء الجفاف والمدّ السام، ويعمل بسرعة أكبر كلما كان أعلى بناءً وكانت الرياح أقوى."

