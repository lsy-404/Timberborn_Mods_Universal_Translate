["Building.FogTower.FogTowerLarge.Description"]
new = "The whole tower, bucket and base included, is scaled uniformly two times (x2), with the diamond net NOT rotated (same facing and lean as the small one). It fits a 2 x 2 footprint exactly, with the tower centred and no overhang onto neighbouring ground. Cloth stretched across. Yields 3 water per hour, holds up to 50, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
status = "normal"
enUS = "The whole tower, bucket and base included, is scaled uniformly two times (x2), with the diamond net NOT rotated (same facing and lean as the small one). It fits a 2 x 2 footprint exactly, with the tower centred and no overhang onto neighbouring ground. Cloth stretched across. Yields 3 water per hour, holds up to 50, and needs no worker. Only works at night in temperate weather; stops in droughts and badtides, and works faster the higher it is built and the stronger the wind."
zhCN = "整座塔（包括水桶和底座）等比例放大两倍（x2），钻石形网面不旋转（朝向和倾斜与小型版本相同）。它恰好占用 2 x 2 的地基，塔身居中，不会悬出到相邻地面之上。布料张开覆盖其上。每小时产出 3 单位水，最多可储存 50 单位，无需工人。仅在温带天气的夜间工作；干旱和恶水潮期间停止工作。塔建得越高、风越强，工作速度越快。"
zhTW = "整座塔（包括水桶和底座）等比例放大兩倍（x2），鑽石網不旋轉（朝向和傾斜與小型版本相同）。它正好佔用 2 x 2 的範圍，塔身置中，且不會懸空延伸到相鄰地面。布料拉伸覆蓋其上。每小時產出 3 單位水，最多可儲存 50 單位，不需要工作者。僅在溫和天氣的夜間運作；乾旱和壞潮期間會停止，且建造得越高、風越強，運作速度越快。"
ruRU = "Вся башня, включая ведро и основание, увеличена в два раза (x2), при этом сетка из алмазного плетения НЕ повёрнута (та же ориентация и наклон, что у маленькой). Она точно занимает площадь 2 x 2, башня расположена по центру и не выступает над соседними участками. Ткань натянута поперёк. Производит 3 воды в час, вмещает до 50 и не требует рабочего. Работает только ночью в умеренную погоду; останавливается во время засух и плохих приливов, а чем выше построена башня и чем сильнее ветер, тем быстрее она работает."
jaJP = "塔全体(バケツと土台を含む)は均一に2倍(x2)に拡大されており、ダイヤモンド型の網は回転していません(小型版と同じ向きと傾き)。2 x 2 の占有面積にちょうど収まり、塔は中央に配置され、隣接する地面にはみ出しません。布が張られています。1時間あたり3の水を生産し、最大50まで貯蔵でき、作業員は不要です。夜間かつ温帯の天候のときのみ稼働し、干ばつとバッドタイドの間は停止します。また、高く建設するほど、風が強いほど速く稼働します。"
frFR = "La tour entière, seau et base compris, est mise à l'échelle uniformément par deux (x2), le filet en losange n'étant PAS pivoté (même orientation et même inclinaison que la petite). Elle s'inscrit exactement dans une empreinte de 2 x 2, la tour étant centrée et ne débordant sur aucun terrain voisin. Tissu tendu en travers. Produit 3 eau par heure, peut contenir jusqu'à 50, et ne nécessite aucun travailleur. Ne fonctionne que la nuit par temps tempéré ; s'arrête pendant les sécheresses et les marées de boue, et fonctionne d'autant plus vite que la tour est haute et que le vent est fort."
deDE = "Der gesamte Turm, einschließlich Eimer und Sockel, ist gleichmäßig zweifach skaliert (x2), wobei das Diamantnetz NICHT gedreht ist (gleiche Ausrichtung und Neigung wie das kleine). Es passt exakt auf eine Grundfläche von 2 x 2, der Turm steht zentriert und ragt nicht über den angrenzenden Boden hinaus. Darüber ist Stoff gespannt. Liefert 3 Wasser pro Stunde, speichert bis zu 50 und benötigt keinen Arbeiter. Funktioniert nur nachts bei gemäßigtem Wetter; hält bei Dürren und Badewellen an und arbeitet umso schneller, je höher er gebaut ist und je stärker der Wind weht."
plPL = "Cała wieża, wraz z wiadrem i podstawą, jest skalowana równomiernie dwukrotnie (x2), a diamentowa siatka NIE jest obrócona (ten sam kierunek i pochylenie co w małej wersji). Dokładnie mieści się na powierzchni 2 x 2, przy czym wieża stoi centralnie i nie wychodzi poza sąsiedni teren. Rozciągnięty materiał. Produkuje 3 wody na godzinę, mieści do 50 i nie potrzebuje pracownika. Działa tylko w nocy przy pogodzie umiarkowanej; zatrzymuje się podczas susz i zalań złą wodą, a im wyżej jest zbudowana i im silniejszy wiatr, tym szybciej działa."
ptBR = "A torre inteira, incluindo o balde e a base, é escalada uniformemente em duas vezes (x2), com a rede de diamante NÃO girada (mesma orientação e inclinação da menor). Ela se encaixa exatamente em uma área de 2 x 2, com a torre centralizada e sem avançar sobre o terreno vizinho. Tecido esticado por toda a estrutura. Produz 3 de água por hora, armazena até 50 e não precisa de trabalhador. Só funciona à noite em clima temperado; para durante secas e marés ruins, e funciona mais rápido quanto mais alta for a construção e quanto mais forte for o vento."
koKR = "탑 전체(물통과 기반 포함)를 2배(x2)로 균일하게 확대했으며, 다이아몬드 그물은 회전하지 않았습니다(작은 버전과 같은 방향과 기울기). 2 x 2 면적에 정확히 맞고, 탑은 가운데에 위치하며 이웃한 땅을 침범하지 않습니다. 천이 가로질러 팽팽하게 펼쳐져 있습니다. 시간당 물 3을 생산하고, 최대 50까지 보관하며, 일꾼이 필요 없습니다. 온화한 날씨의 밤에만 작동하며, 가뭄과 배드타이드 동안에는 멈춥니다. 높이 지을수록, 바람이 강할수록 더 빠르게 작동합니다."
trTR = "Tüm kule, kova ve taban dahil, iki kat (x2) ölçeklendirilmiştir; elmas ağ ise döndürülmemiştir (küçük olanla aynı yön ve eğim). 2 x 2 alana tam olarak sığar; kule ortalanmıştır ve komşu zemine taşma yoktur. Üzerine gerilmiş kumaş bulunur. Saatte 3 su üretir, en fazla 50 su depolar ve işçi gerektirmez. Yalnızca gece ve ılıman havada çalışır; kuraklıklarda ve kötü su dalgalarında durur. Daha yüksek inşa edildikçe ve rüzgar güçlendikçe daha hızlı çalışır."
esES = "La torre completa, incluidos el depósito y la base, está escalada uniformemente por dos (x2), con la red de rombos NO girada (misma orientación e inclinación que la pequeña). Encaja exactamente en una superficie de 2 x 2, con la torre centrada y sin sobresalir sobre el terreno vecino. Tela estirada por toda la estructura. Produce 3 de agua por hora, almacena hasta 50 y no necesita ningún trabajador. Solo funciona de noche con clima templado; se detiene durante las sequías y las mareas malas, y funciona más rápido cuanto más alta esté construida y cuanto más fuerte sople el viento."
itIT = "L'intera torre, comprese secchio e base, è scalata uniformemente di due volte (x2), con la rete di diamante NON ruotata (stessa direzione e inclinazione della versione piccola). Si adatta esattamente a un'impronta di 2 x 2, con la torre centrata e senza sporgere sul terreno circostante. Tessuto teso sopra. Produce 3 acqua all'ora, ne contiene fino a 50 e non richiede lavoratori. Funziona solo di notte con clima temperato; si ferma durante siccità e maree cattive, e funziona più velocemente quanto più è costruita in alto e quanto più forte è il vento."
ukUA = "Уся вежа, включно з відром і основою, масштабована рівномірно у два рази (x2), а алмазна сітка НЕ повернута (та сама орієнтація й нахил, що й у малої). Вона точно займає ділянку 2 x 2, вежа розташована по центру і не заходить над сусідньою землею. Тканина натягнута поперек. Виробляє 3 води на годину, утримує до 50 і не потребує робітника. Працює лише вночі за помірної погоди; зупиняється під час посух і бедтайдів, а чим вища вона збудована і чим сильніший вітер, тим швидше працює."
csCZ = "Celá věž, včetně kbelíku a základny, je zvětšena dvakrát (x2), přičemž diamantová síť NENÍ otočena (stejná orientace a náklon jako u malé verze). Přesně se vejde do půdorysu 2 x 2, věž je vycentrována a nepřesahuje na sousední pozemek. Látka je natažena přes konstrukci. Vyrábí 3 vody za hodinu, pojme až 50 a nepotřebuje žádného pracovníka. Funguje pouze v noci za mírného počasí; zastavuje se při suchu a špatných přílivech a čím výše je postavena a čím silnější je vítr, tím rychleji pracuje."
viVN = "Toàn bộ tháp, bao gồm thùng chứa và phần đế, được phóng to đều theo tỷ lệ x2, còn lưới kim cương không xoay (cùng hướng và độ nghiêng với tháp nhỏ). Công trình vừa khít diện tích 2 x 2, tháp nằm giữa và không nhô ra đất lân cận. Vải được căng ngang. Cho ra 3 nước mỗi giờ, chứa tối đa 50, và không cần thợ. Chỉ hoạt động vào ban đêm trong thời tiết ôn hòa; dừng lại khi có hạn hán và thủy triều độc, và hoạt động càng nhanh khi tháp được xây càng cao và gió càng mạnh."
caES = "La torre sencera, incloent-hi el cubell i la base, està escalada uniformement per dos (x2), amb la xarxa de diamant NO girada (mateixa orientació i inclinació que la petita). Encaixa exactament en una petjada de 2 x 2, amb la torre centrada i sense cap part que sobresurti sobre el terreny veí. Teixit estirat per sobre. Produeix 3 aigua per hora, n'emmagatzema fins a 50 i no necessita cap treballador. Només funciona de nit en clima temperat; s'atura durant les sequeres i les marees tòxiques, i funciona més ràpid com més alta és la construcció i com més fort és el vent."
beBY = "Уся вежа, разам з вядром і асновай, маштабавана ў два разы (x2), а сетка-ромб не паварочаная (такі ж напрамак і нахіл, як у малой). Будынак dакладна займае плошчу 2 x 2, вежа ўсталяваная па цэнтры, без нахілу над суседнім грунтам. Тканіна натянутая. Дае 3 вады за гадзіну, утрымлівае да 50 адзінак і не патрабуе працаўніка. Працуе толькі ўночы ў умераным надвор'і; спыняецца падчас засухі і благіх хваляў, а чым вышэй пабудавана вежа і чым мацнейшы вецер, тым хутчэй яна працуе."
roRO = "Întregul turn, inclusiv găleata și baza, este scalat uniform de două ori (x2), iar plasa de diamant NU este rotită (aceeași orientare și înclinare ca cea mică). Se potrivește exact pe o suprafață de 2 x 2, turnul fiind centrat, fără să se extindă peste terenul vecin. Pânză întinsă pe toată structura. Produce 3 apă pe oră, poate reține până la 50 și nu necesită niciun lucrător. Funcționează doar noaptea, pe vreme temperată; se oprește în timpul secetelor și al valurilor de apă toxică, iar cu cât este construit mai înalt și cu cât bate vântul mai tare, cu atât funcționează mai repede."
huHU = "A teljes torony, a vödörrel és az alappal együtt, kétszeresére van méretezve (x2), a gyémánt alakú háló pedig NEM lett elforgatva (ugyanaz az irány és dőlés, mint a kicsinyé). Pontosan 2 x 2-es alapterületbe illeszkedik, a torony középen áll, és nem nyúlik be a szomszédos talajra. Ponyva van kifeszítve rajta. Óránként 3 vizet termel, legfeljebb 50-et tárol, és nincs szüksége munkásra. Csak éjszaka, mérsékelt időjárásban működik; aszályok és rossz árapályok idején leáll, és minél magasabbra épül, illetve minél erősebb a szél, annál gyorsabban dolgozik."
arSA = "يُبنى البرج بأكمله، بما في ذلك الدلو والقاعدة، بتكبير موحّد بمقدار ضعفين (×2)، مع عدم تدوير الشبكة الماسية (بنفس الاتجاه والميل كما في النسخة الصغيرة). يتسع بالضبط لمساحة 2 × 2، مع توسيط البرج وعدم تجاوزه إلى الأرض المجاورة. قماش ممدود عبره. ينتج 3 وحدات ماء في الساعة، ويخزن حتى 50 وحدة، ولا يحتاج إلى عامل. يعمل فقط ليلاً في الطقس المعتدل، ويتوقف أثناء الجفاف وفترات المد السام، ويعمل أسرع كلما كان أعلى بناءً وكانت الرياح أقوى."

