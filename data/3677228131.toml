itIT = "Sul serio!? Quanto deve essere scarso un castoro nell'agricoltura per far seccare i cavoli!?"
ukUA = "Серйозно!? Наскільки ж погано треба вміти займатися землеробством, щоб виростити сухі капустини!?"
thTH = "จริงเหรอเนี่ย!? บีเวอร์ต้องห่วยแค่ไหนถึงจะปลูกกะหล่ำปลีจนแห้งได้!?"
