["Grows.Birch.Cite"]
raw = "Better than nothing, occasionally the bad tide takes long enough to come that these actually grow"
status = "normal"
enUS = "Better than nothing, sometimes the bad tide takes long enough to arrive that these actually grow."
zhCN = "“总比没有好，有时坏潮水来的慢，这些实际上会生长。”"
zhTW = "總比沒有好，有時壞潮來得太慢，這些樹實際上會生長。"
ruRU = "Лучше чем ничего, иногда плохой поток приходит достаточно долго, чтобы эти действительно росли"
jaJP = "「何もないよりはましで、時々悪い潮が来るまでに時間がかかると、これらは実際に育つ。」"
frFR = "Mieux que rien, il arrive parfois que la mauvaise marée mette suffisamment de temps à arriver pour que ceux-ci poussent réellement."
deDE = "Besser als nichts, gelegentlich dauert es so lange, bis die schlechte Flut kommt, dass diese tatsächlich wachsen."
plPL = "Lepiej niż nic, czasami zły przypływ przychodzi na tyle długo, że te rzeczywiście rosną"
ptBR = "Melhor do que nada, ocasionalmente a maré ruim demora o suficiente para chegar que essas realmente crescem"
koKR = "아무것도 없는 것보다는 낫다. 가끔은 나쁜 조류가 오는 데 시간이 너무 걸리기 때문에 이들이 실제로 자란다."
trTR = "Hiç yoktan iyi, bazen kötü gelgit o kadar uzun sürer ki bunlar gerçekten büyür."
esES = "Mejor que nada; de vez en cuando la marea mala tarda lo suficiente en llegar como para que estos crezcan."
itIT = "Meglio di niente: a volte la marea cattiva impiega abbastanza tempo ad arrivare che queste piante riescono a crescere."
ukUA = "Краще, ніж нічого: іноді погана хвиля б'ється досить довго, щоб ці рослини справді виростали."
