["Grows.AppleTree.Cite"]
raw = "Eureka! There is another force, I shall name it Gravity!"
status = "normal"
enUS = "Eureka! There is another force, I shall name it Gravity!"
zhCN = "“ Eureka！还有一种力量，我把它称为重力！”"
zhTW = "“啊哈！還有另一種力量，我稱之為重力！”"
ruRU = "Эврика! Есть еще одна сила, я назову её Гравитация!"
jaJP = "「ユリカ！もう一つの力がある、私はそれを重力と呼ぶことにしよう！」"
frFR = "Eureka ! Il y a une autre force, je vais l'appeler Gravité !"
deDE = "Eureka! Es gibt eine andere Kraft, ich werde sie Schwerkraft nennen!"
plPL = "Eureka! Jest inna siła, nazwę ją Grawitacja!"
ptBR = "Eureka! Existe uma outra força, eu a chamarei de Gravidade!"
koKR = "유레카! 또 다른 힘이 있다, 나는 그것을 중력이라 부르겠다!"
trTR = "Eureka! Başka bir güç var, ona Yerçekimi adını vereceğim!"
esES = "¡Eureka! ¡Existe otra fuerza, a la que llamaré Gravedad!"
itIT = "Eureka! Esiste un'altra forza, la chiamerò Gravità!"
ukUA = "Еврика! Існує ще одна сила, я назву її Гравітацією!"
thTH = "ยูเรกา! มีแรงอีกอย่างหนึ่ง ข้าจะตั้งชื่อมันว่า แรงโน้มถ่วง!"
csCZ = "Eureka! Existuje další síla, nazvu ji Gravitace!"
viVN = "Eureka! Có một lực khác, tôi sẽ gọi nó là Trọng lực!"
caES = "Eureka! Hi ha una altra força, la batejaré com a Gravetat!"
beBY = "Эўрыка! Ёсць яшчэ адна сіла, я назаву яе Гравітацыяй!"
roRO = "Eureka! Există o altă forță, o voi numi Gravitație!"
huHU = "Eureka! Van egy másik erő is, Gravitációnak fogom nevezni!"
arSA = "وجدتُ ذلك! هناك قوة أخرى، سأسميها الجاذبية!"

