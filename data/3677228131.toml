viVN = "Thật sao!? Một con thú gỗ tệ đến mức nào để làm ra bắp cải khô vậy!?"
caES = "Seriosament?! Quin castor tan dolent en l'agricultura cal que sigui per fer col seca?!"
beBY = "Сур'ёзна?! Наколькі дрэнна павінен працаваць бабёр на полі, каб вырасціць сухую капусту?!"
roRO = "Serios?! Cât de prost trebuie să fie un castor la agricultură ca să usuce verzele!?"
huHU = "Komolyan!? Mennyire kell rossz gazdának lennie egy hódnak, hogy száraz káposztát termeljen!?"
