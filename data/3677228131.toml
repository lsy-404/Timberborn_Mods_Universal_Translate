frFR = "Sérieusement !? À quel point un castor doit-il être mauvais en agriculture pour faire des choux secs !?"
deDE = "Im Ernst!? Wie schlecht muss ein Biber im Bauer sein, um trockene Kohlen zu machen!?"
plPL = "Serio!? Jak zły w uprawie musi być bóbr, żeby robić suche kapusty!?"
ptBR = "Sério!? Quão ruim um castor tem que ser na agricultura para fazer repolhos secos!?"
koKR = "정말!? 비버가 마른 양배추를 만들려면 농사에 얼마나 무능해야 하는 거야!?"
trTR = "Ciddi misin!? Bir kunduzun kurumuş lahana yapmak için tarımda ne kadar kötü olması gerekiyor!?"
esES = "¡¿En serio!? ¿Qué tan malo tiene que ser un castor en la agricultura para conseguir repollos secos!?"
itIT = "Sul serio!? Quanto deve essere incapace un castoro in agricoltura per far seccare i cavoli!?"
ukUA = "Серйозно?! Наскільки ж погано треба вміти займатися землеробством, щоб перетворити капусту на суху!?"
thTH = "จริงเหรอเนี่ย!? บีเวอร์ต้องห่วยเรื่องการทำเกษตรขนาดไหนกันนะ ถึงได้ปลูกกะหล่ำปลีจนแห้งได้!?"
csCZ = "Doopravdy!? Jak špatný farmář musí být bobr, aby vyráběl suché zelí!?"
viVN = "Thật sao!? Một con hải ly phải tồi tệ đến mức nào trong việc trồng trọt mới có thể làm ra bắp cải khô chứ!?"
caES = "Seriosament!? Quin castor de mala collita ha de ser per fer col seca!?"
beBY = "Сур'ёзна?! Наколькі дрэнна бабёр павінен працаваць на полі, каб вырасціць сухую капусту?!"
roRO = "Serios?! Cât de prost în agricultură trebuie să fie un castor ca să ajungă să facă varză uscată!?"
huHU = "Komolyan?! Mennyire kell rosszul művelnie a földet egy hódnak ahhoz, hogy száraz káposztát termeljen?!"
arSA = "جدّيًا!؟ ما مدى سوء الزراعة الذي يجب أن يكون عليه القندس حتى يُنتج ملفوف احمر جافًّا!؟"

