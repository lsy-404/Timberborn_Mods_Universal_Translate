["Grows.Parsnips.Cite"]
raw = "It's meh, good thing too otherwise all the leafcoats would have to decide between having no parsnips or being hated by their own kind 😅"
status = "normal"
enUS = "It's okay, good thing too otherwise all the leafcoats would have to choose between having no parsnips or being hated by their own kind 😅"
zhCN = "“这也就一般般，幸好如此，否则所有的叶外套就不得不在没有胡萝卜种子和被自己人讨厌之间做出选择😅”"
zhTW = "「這還好，還好不然所有的葉子外套都得在沒有胡蘿蔔或被自己人討厭之間作出選擇😅」"
ruRU = "Это так себе, хорошо, что иначе всем листокожим пришлось бы решать между отсутствием пастернаков и ненавистью со стороны своих сородичей 😅"
jaJP = "「まあまあだね、それに葉のコートたちはパースニップなしか、自分たちの仲間に嫌われるかの選択をしなければならなかったから、良かったよ😅」"
frFR = "C'est moyen, heureusement sinon tous les feuillets de feuilles devraient choisir entre ne pas avoir de panais ou être haïs par les leurs 😅"
deDE = "Ist okay, gut ist auch, sonst müssten alle Blattmäntel sich entscheiden, ob sie keine Pastinaken haben oder von ihren eigenen Leuten gehasst werden 😅"
plPL = "Jest średnio, dobrze, że tak, w przeciwnym razie wszystkie liściożercy musiałyby wybierać między brakiem pietruszki a byciem nienawidzonym przez własny gatunek 😅"
ptBR = "É mediano, ainda bem, caso contrário, todos os vegetais folhosos teriam que decidir entre não ter pastinacas ou serem odiados por seu próprio tipo 😅"
koKR = "별로야, 그렇지 않으면 모든 리프코트가 파슬리를 가지지 않거나 자기 동족에게 미움을 받을 것인지 선택해야 했을 거야 😅"
trTR = "Eh işte, iyi bir şey çünkü aksi takdirde tüm yaprak giysilerinin ya hiç yer elması olmaması ya da kendi türleri tarafından nefret edilmesi arasında bir seçim yapmaları gerekecekti 😅"
esES = "Es regular, menos mal, si no, todos los hojaverdes tendrían que elegir entre quedarse sin chirivías o ser odiados por los suyos 😅"
itIT = "Non è un granché, per fortuna, altrimenti tutti i leafcoat dovrebbero scegliere tra non avere pastinache o essere odiati dai propri simili 😅"
ukUA = "Так собі, але й добре, інакше всім листошерстим довелося б вибирати між відсутністю пастернаку або ненавистю з боку власних собратів 😅"
thTH = "ก็พอใช้ได้นะ ดีแล้วที่เป็นแบบนี้ ไม่งั้นพวก Leafcoats ทั้งหมดคงต้องเลือกระหว่างการไม่มีพาร์สนิปกับการถูกคนในเผ่าเดียวกันเกลียด 😅"
csCZ = "Není to nic moc, naštěstí by jinak všichni listáči museli rozhodnout, jestli budou mít bez brambor nebo budou nenáviděni svými vlastními lidmi 😅"
viVN = "Thế cũng tàm tạm, cũng may là nếu không thì tất cả những người mặc áo lá sẽ phải chọn giữa việc không có củ cải đường hoặc bị ghét bởi chính đồng loại của họ 😅"
caES = "Està bé, és el millor, perquè si no tots els leafcoats haurien de triar entre no tenir pastanagues blanques o ser odiats pels seus propis. 😅"
beBY = "Гэта так сабе, і добра, што інакш усім лістакотам давялося б выбіраць паміж тым, каб не мець пастарнаку, і тым, каб іх ненавідзелі свае 😅"
roRO = "Este mediocru, dar bine că nu e altfel, pentru că atunci toți frunzosii ar trebui să aleagă între a nu avea păstârnac sau a fi urâți de proprii lor semeni 😅"
huHU = "Hát, nem nagy durranás, de jó is, különben a leafcoatoknak vagy paszternák nélkül kellene maradniuk, vagy a saját fajtársaik utálnák őket 😅"
arSA = "ليس بالأمر المهم، والحمد لله، وإلا لكان على جميع \"أوراق الخس\" أن يختاروا بين عدم الحصول على الجزر الأبيض أو أن يكرههم أبناء جنسهم 😅"

