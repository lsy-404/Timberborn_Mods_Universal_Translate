["LV.MA.LaunchAllWonders.Desc"]
raw = "As a faction with multiple Wonders (modded Greedy or Configurable Factions), launch every faction's Wonder within a single cycle."
status = "normal"
enUS = "As a faction with multiple Wonders (modded Greedy or Configurable Factions), launch every faction's Wonder within a single cycle."
zhCN = "作为拥有多个奇迹的派系（修改后的贪婪派系或可配置派系），在一个循环内启动每个派系的奇迹。"
zhTW = "作為擁有多個奇蹟的派系（模組化的貪婪或可配置派系），在單一週期內啟動每個派系的奇蹟。"
ruRU = "Запустите Чудо каждой фракции за один цикл, играя за фракцию с несколькими Чудесами (модифицированные Жадные или Настраиваемые Фракции)."
jaJP = "「複数のワンダーを持つ派閥（改造された貪欲な派閥または設定可能な派閥）として、単一のサイクル内で全ての派閥のワンダーを発動します。」"
frFR = "En tant que faction avec plusieurs merveilles (factions modifiées, avares ou configurables), lancez la merveille de chaque faction au cours d'un seul cycle."
deDE = "„Als eine Fraktion mit mehreren Wundern (modifizierte Gierige oder Konfigurierbare Fraktionen) starte das Wunder jeder Fraktion innerhalb eines einzigen Zyklus.“"
plPL = "Jako frakcja posiadająca wiele Cudów (zmodyfikowane Chciwe lub Konfigurowalne Frakcje), uruchom każdy Cud frakcji w jednym cyklu."
ptBR = "Como uma facção com múltiplas Maravilhas (facções modificadas Gananciosas ou Configuráveis), lance a Maravilha de cada facção em um único ciclo."
koKR = "여러 개의 경이를 가진 진영(모드된 욕심 많은 진영 또는 구성 가능한 진영)으로서, 단일 사이클 내에 모든 진영의 경이를 발사하세요."
trTR = "Birden fazla Harikası olan bir fraksiyon olarak (modlu Açgözlü veya Yapılandırılabilir Fraksiyonlar), tek bir döngü içinde her fraksiyonun Harikasını başlatın."
esES = "Como facción con múltiples maravillas (facciones modificadas Greedy o Configurable Factions), lanza la maravilla de cada facción dentro de un mismo ciclo."
itIT = "Come fazione con più Meraviglie (fazioni modificate Greedy o Configurable Factions), lancia la Meraviglia di ogni fazione entro un singolo ciclo."
ukUA = "Як фракція з кількома Чудесами (модифіковані фракції Greedy або Configurable Factions), запустіть Чудо кожної фракції протягом одного циклу."
thTH = "ในฐานะฝ่ายที่มีปาฏิหาริย์หลายอย่าง (จากฝ่ายที่ปรับแต่งเพิ่มเติม เช่น Greedy หรือ Configurable Factions) ให้ปล่อยปาฏิหาริย์ของทุกฝ่ายภายในรอบเดียว"
csCZ = "Jako frakce s několika divy (modifikované Chamtivé nebo Konfigurovatelné frakce) spusťte každé divo frakce v rámci jednoho cyklu."
viVN = "Là một phái có nhiều Kỳ Quan (phái tham lam hoặc phái tùy chỉnh), khởi động Kỳ Quan của mọi phái trong một chu kỳ duy nhất."
caES = "Com a facció amb diverses Meravelles (facció Avariciosa o Configurable modificada), llança la Meravella de cada facció dins d'un mateix cicle."
beBY = "Як фракцыя з некалькімі цудамі (мадыфікаваныя фракцыі Greedy або Configurable Factions), запусціце цуды кожнай фракцыі працягам аднаго цыклу."
roRO = "Ca facțiune cu mai multe Minuni (facțiuni modificate Greedy sau Configurable Factions), lansează Minunea fiecărei facțiuni într-un singur ciclu."
huHU = "Csoportként több csodával rendelkező frakcióként (módosított Greedy vagy Configurable Factions) indíts el minden frakció csodáját egyetlen cikluson belül."
arSA = "إذا كانت لديك عدة عجائب بسبب الفصائل (في الفصائل الجشعة أو القابلة للتهيئة من المود)، فأطلق عجائب كل الفصائل خلال دورة واحدة."

