esES = "La modificación se ha exportado.\nDesactiva <b>esta modificación</b> y usa la modificación exportada '{0}'.\nSi quieres volver a configurar esta modificación, recuerda desactivar esa modificación."
itIT = "La mod è stata esportata.\nTi preghiamo di <b>disattivare questa mod</b> e di usare la mod esportata '{0}'.\nSe vuoi riconfigurare questa mod, ricordati di disattivare quella mod."
ukUA = "Мод було експортовано.\nБудь ласка, <b>вимкніть цей мод</b> і використовуйте експортований мод '{0}'.\nЯкщо ви хочете перенастроїти цей мод, не забудьте вимкнути той мод."
