["LV.CFac.NeedPlanter"]
raw = "You have chosen a plant or crop in the group {0} but did not choose any building to grow it.\nPlease make sure to choose such building (usually in the Food or Wood group) to add or the game will crash."
status = "normal"
enUS = "You have chosen a plant or crop in the group {0} but did not choose any building to grow it.\nPlease make sure to choose such building (usually in the Food or Wood group) to add or the game will crash."
zhCN = "当前选择的植物属于 {0} 分组，但未选择对应的种植建筑。<br>请确保选择对应的种植建筑（通常在“建筑”对象的“食物”或“木材”类别中），否则会导致游戏崩溃。"
zhTW = "您已選擇了{0}組中的植物或作物，但未選擇任何建築來種植它。請確保選擇這樣的建築（通常在食品或木材組中）以添加，否則遊戲將崩潰。"
ruRU = "Вы выбрали растение или урожай из группы {0}, но не выбрали ни одно здание для его выращивания. Пожалуйста, убедитесь, что вы выбрали такое здание (обычно в группе Продукты или Дерево), чтобы добавить его, иначе игра может зависнуть."
jaJP = "{0}のグループで植物または作物を選択しましたが、それを育てるための建物を選択していません。建物（通常は食品または木材のグループ）を選択して追加してください。さもないと、ゲームがクラッシュします。"
frFR = "Vous avez choisi une plante ou une culture dans le groupe {0} mais n'avez choisi aucun bâtiment pour la cultiver. Veuillez vous assurer de choisir un tel bâtiment (généralement dans le groupe Nourriture ou Bois) à ajouter, sinon le jeu risque de planter."
deDE = "Sie haben eine Pflanze oder ein Feld im Bereich {0} ausgewählt, aber kein Gebäude gewählt, um sie anzubauen. Bitte stellen Sie sicher, dass Sie ein solches Gebäude (normalerweise in der Gruppe Nahrung oder Holz) auswählen, um es hinzuzufügen, sonst wird das Spiel abstürzen."
plPL = "Wybrałeś roślinę lub uprawę w grupie {0}, ale nie wybrałeś żadnego budynku do jej uprawy. Proszę upewnij się, że wybierzesz taki budynek (zwykle w grupie Żywności lub Drewna), aby go dodać, inaczej gra się zawiesi."
ptBR = "Você escolheu uma planta ou cultura do grupo {0}, mas não escolheu nenhum prédio para cultivá-la. Por favor, certifique-se de escolher um prédio desse tipo (geralmente no grupo Alimentos ou Madeira) para adicionar, ou o jogo irá travar."
koKR = "당신은 그룹 {0}에서 식물이나 농작물을 선택했지만, 재배할 건물을 선택하지 않았습니다. \n식량 또는 목재 그룹에 있는 그러한 건물을 선택해야 추가할 수 있습니다. 그렇지 않으면 게임이 크래시됩니다."
trTR = "Gruplardan {0} içinde bir bitki veya mahsul seçtiniz ancak onu büyütmek için herhangi bir bina seçmediniz. Lütfen eklemek için böyle bir bina seçtiğinizden emin olun (genellikle Gıda veya Ahşap grubunda) yoksa oyun çökebilir."
esES = "Has elegido una planta o cultivo del grupo {0}, pero no elegiste ningún edificio para cultivarlo.\nAsegúrate de elegir un edificio de este tipo (normalmente en el grupo Alimentos o Madera) para añadirlo, o el juego se bloqueará."
itIT = "Hai scelto una pianta o una coltura nel gruppo {0}, ma non hai scelto alcun edificio per coltivarla.\nScegli un edificio di questo tipo (di solito nel gruppo Cibo o Legno) da aggiungere, altrimenti il gioco si bloccherà."
ukUA = "Ви вибрали рослину або культуру в групі {0}, але не вибрали будівлю, яка б її вирощувала.\nБудь ласка, виберіть таку будівлю (зазвичай у групі «Їжа» або «Деревина»), щоб додати її, інакше гра вилетить."
thTH = "คุณเลือกพืชหรือพืชผลในกลุ่ม {0} แต่ยังไม่ได้เลือกอาคารสำหรับปลูกพืชเหล่านั้น\nโปรดตรวจสอบให้แน่ใจว่าได้เลือกอาคารดังกล่าว (โดยปกติอยู่ในกลุ่มอาหารหรือไม้) เพื่อเพิ่มเข้าไป มิฉะนั้นเกมจะขัดข้อง"
csCZ = "Vybrali jste rostlinu nebo plodinu ve skupině {0}, ale nevybrali jste žádnou budovu pro její pěstování. Prosím, ujistěte se, že vybíráte takovou budovu (obvykle ve skupině Jídlo nebo Dřevo), jinak hra spadne."
viVN = "Bạn đã chọn một cây trồng hoặc vụ mùa trong nhóm {0} nhưng lại chưa chọn bất kỳ tòa nhà nào để trồng nó.\nVui lòng đảm bảo chọn một tòa nhà như vậy (thường ở nhóm Thực phẩm hoặc Gỗ) để thêm nó, nếu không trò chơi sẽ bị treo."
caES = "Heu escollit una planta o cultiu del grup {0}, però no has escollit cap edifici per cultivar-la.\nSi us plau, assegura't d'escollir un edifici d'aquest tipus (normalment del grup Menjar o Fusta) per afegir-lo, o el joc fallarà."
beBY = "Вы выбралі расліну або культуру ў групе {0}, але не выбралі ніводнай пабудовы для іх вырошчвання.\nКалі ласка, абярыце такую пабудову (звычайна ў групе «Ежа» або «Драўніна»), каб дадаць яе, інакш гульня аварыйна завершыцца."
roRO = "Ați ales o plantă sau o cultură din grupul {0}, dar nu ați ales nicio clădire în care să fie cultivată.\nVă rugăm să alegeți o astfel de clădire (de obicei din grupul Alimente sau Lemn) pentru a o adăuga, altfel jocul se va bloca."
huHU = "Ön olyan növényt vagy terményt választott a(z) {0} csoportban, amelyhez nem választott épületet a termesztéséhez.\nKérjük, válasszon ilyen épületet (általában az Élelmiszer vagy a Fa csoportból), különben a játék összeomlik."
arSA = "إلقد اخترت نباتًا أو محصولًا في المجموعة {0} لكنك لم تختر أي مبنى لزراعته.\nيرجى التأكد من اختيار مبنى من هذا النوع (عادةً في مجموعة الغذاء أو الخشب) لإضافته، وإلا فسيتعطل اللعب."

