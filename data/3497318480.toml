csCZ = "Mod byl exportován.  \nProsím <b>deaktivujte tento mod</b> a použijte exportovaný '{0}' mod.  \nPokud chcete tento mod znovu nakonfigurovat, nezapomeňte deaktivovat ten mod."
viVN = "Mod đã được xuất ra.\nVui lòng <b>vô hiệu hóa mod này</b> và sử dụng mod '{0}' đã được xuất.\nNếu bạn muốn cấu hình lại mod này, hãy nhớ vô hiệu hóa mod đó."
caES = "L'estil s'ha exportat.\nSi us plau, <b>desactiveu aquest mod</b> i useu el mod exportat '{0}'.\nSi voleu tornar a configurar aquest mod, recordeu desactivar aquell mod."
beBY = "Мод быў экспартаваны.\nКалі ласка, <b>адключыце гэты мод</b> і выкарыстоўвайце экспартаваны мод '{0}'.\nКалі вы хочаце перанастроіць гэты мод, не забудзьцеся адключыць той мод."
roRO = "Modul a fost exportat.\nTe rugăm să <b>dezactivezi acest mod</b> și să folosești modul exportat '{0}'.\nDacă vrei să reconfigurezi acest mod, ține minte să dezactivezi acel mod."
huHU = "A mod exportálása megtörtént.\nKérjük, <b>tiltsa le ezt a modot</b>, és használja a exportált „{0}” modot helyette.\nHa újra szeretné konfigurálni ezt a modot, ne felejtse el letiltani azt a modot."
arSA = "تم تصدير المود.\nيرجى <b>تعطيل هذا المود</b> واستخدام المود '{0}' المُصدَّر.\nإذا كنت تريد إعادة ضبط هذا المود، فتذكر تعطيل ذلك المود."

["LV.CFac.Update730"]
raw = "This mod now support exporting into a standalone mod if you have the optional mod <b>TimberMod Builder</b>.\nThe intention is to support mods like TimberApi. Please read the updated mod description for more info.\nIf you do not care about that, you can ignore this message, there is no change to the current functionality."
status = "abandoned"
enUS = "This mod now supports exporting into a standalone mod if you have the optional mod <b>TimberMod Builder</b>. The intention is to support mods like TimberApi. Please read the updated mod description for more info. If you do not care about that, you can ignore this message; there is no change to the current functionality."
zhCN = "此模组现在支持导出为独立模组，如果您安装了可选模组 <b>TimberMod Builder</b>。\n此举的目的是支持像 TimberApi 这样的模组。请查看更新后的模组描述以获取更多信息。\n如果您对此不感兴趣，可以忽略此消息，目前的功能没有变化。"
zhTW = "此模組現在支持導出為獨立模組，前提是您安裝了可選模組 <b>TimberMod Builder</b>。  \n這樣做的目的是為了支持像 TimberApi 這樣的模組。請閱讀更新後的模組描述以獲取更多資訊。  \n如果您對此不在意，可以忽略此消息，當前功能不會有所改變。"
ruRU = "Этот мод теперь поддерживает экспорт в отдельный мод, если у вас установлен дополнительный мод <b>TimberMod Builder</b>.\nЦель - поддерживать такие моды, как TimberApi. Пожалуйста, ознакомьтесь с обновленным описанием мода для получения дополнительной информации.\nЕсли вам это не интересно, вы можете проигнорировать это сообщение, функциональность текущей версии не изменена."
jaJP = "このモッドは、オプションのモッド<b>TimberMod Builder</b>を持っている場合、スタンドアロンモッドへのエクスポートをサポートするようになりました。  \n意図は、TimberApiのようなモッドをサポートすることです。詳細については更新されたモッドの説明をお読みください。  \nそれに興味がない場合は、このメッセージを無視してください。現在の機能には変更はありません。"
frFR = "Ce mod prend désormais en charge l'exportation en un mod autonome si vous avez le mod optionnel <b>TimberMod Builder</b>. L'intention est de prendre en charge des mods comme TimberApi. Veuillez lire la description mise à jour du mod pour plus d'informations. Si cela ne vous intéresse pas, vous pouvez ignorer ce message, il n'y a aucun changement dans les fonctionnalités actuelles."
deDE = "Dieser Mod unterstützt jetzt den Export in einen eigenständigen Mod, wenn Sie den optionalen Mod <b>TimberMod Builder</b> haben. \nDie Absicht ist, Mods wie TimberApi zu unterstützen. Bitte lesen Sie die aktualisierte Mod-Beschreibung für weitere Informationen. \nWenn Ihnen das egal ist, können Sie diese Nachricht ignorieren, es gibt keine Änderungen an der aktuellen Funktionalität."
plPL = "Nazwa klucza: LV.CFac.Update730 - Nowy tekst do przetłumaczenia: \"Ten mod teraz wspiera eksportowanie do samodzielnego modu, jeśli masz opcjonalny mod <b>TimberMod Builder</b>. \nIntencją jest wspieranie modów takich jak TimberApi. Proszę przeczytać zaktualizowany opis modu w celu uzyskania dalszych informacji. \nJeśli cię to nie interesuje, możesz zignorować tę wiadomość, nie ma zmian w obecnej funkcjonalności.\""
ptBR = "Este mod agora suporta exportação para um mod autônomo se você tiver o mod opcional <b>TimberMod Builder</b>.\nA intenção é dar suporte a mods como o TimberApi. Por favor, leia a descrição atualizada do mod para mais informações.\nSe você não se importa com isso, pode ignorar esta mensagem, não há alteração na funcionalidade atual."
koKR = "이 모드는 선택적 모드 <b>TimberMod Builder</b>가 있는 경우 독립 실행형 모드로 내보내기를 지원합니다.\n목적은 TimberApi와 같은 모드를 지원하는 것입니다. 더 많은 정보는 업데이트된 모드 설명을 읽어주시기 바랍니다.\n그에 대해 신경 쓰지 않으신다면 이 메시지를 무시하셔도 됩니다. 현재 기능에는 변화가 없습니다."
trTR = "Bu mod artık isteğe bağlı olan <b>TimberMod Builder</b> modunu kullanıyorsanız, bağımsız bir mod olarak dışa aktarmayı destekliyor.\nAmaç, TimberApi gibi modları desteklemektir. Daha fazla bilgi için güncellenmiş mod açıklamasını okuyun.\nEğer bununla ilgilenmiyorsanız, bu mesajı görmezden gelebilirsiniz, mevcut işlevsellikte bir değişiklik yoktur."
esES = "Este mod ahora admite la exportación como un mod independiente si tienes el mod opcional <b>TimberMod Builder</b>.\nLa intención es admitir mods como TimberApi. Lee la descripción actualizada del mod para más información.\nSi no te interesa, puedes ignorar este mensaje, ya que no hay ningún cambio en la funcionalidad actual."
itIT = "Questa mod ora supporta l'esportazione come mod autonoma se hai la mod opzionale <b>TimberMod Builder</b>.\nL'obiettivo è supportare mod come TimberApi. Leggi la descrizione aggiornata della mod per maggiori informazioni.\nSe non ti interessa, puoi ignorare questo messaggio: non ci sono modifiche alla funzionalità attuale."
ukUA = "Цей мод тепер підтримує експорт у самостійний мод, якщо у вас встановлено необов'язковий мод <b>TimberMod Builder</b>.\nМета — підтримати такі моди, як TimberApi. Будь ласка, прочитайте оновлений опис мода, щоб дізнатися більше.\nЯкщо вас це не цікавить, можете ignorувати це повідомлення: поточна функціональність не змінилася."
thTH = "ม็อดนี้รองรับการส่งออกเป็นมอดอิสระแล้ว หากคุณมีมอดเสริม <b>TimberMod Builder</b>\nเจตนาคือรองรับมอดอย่าง TimberApi โปรดอ่านคำอธิบายมอดฉบับปรับปรุงเพื่อดูข้อมูลเพิ่มเติม\nหากคุณไม่สนใจเรื่องนี้ ก็สามารถเพิกเฉยข้อความนี้ได้ ฟังก์ชันการทำงานปัจจุบันไม่มีการเปลี่ยนแปลง"
csCZ = "Tento mod nyní podporuje export do samostatného modu, pokud máte volitelný mod <b>TimberMod Builder</b>.\nCílem je podpora modů jako TimberApi. Prosím, přečtěte si aktualizovaný popis modu pro více informací.\nPokud o to nestojíte, můžete tuto zprávu ignorovat, není zde žádná změna v aktuální funkčnosti."
viVN = "Mod này hiện hỗ trợ xuất ra thành một mod độc lập nếu bạn có mod tùy chọn <b>TimberMod Builder</b>.\nÝ định của nó là hỗ trợ các mod như TimberApi. Vui lòng đọc mô tả mod được cập nhật để biết thêm thông tin.\nNếu bạn không quan tâm đến điều đó, bạn có thể bỏ qua thông báo này; không có sự thay đổi nào đối với chức năng hiện tại."
caES = "Aquest mod ara admet exportar-se com a mod independent si tens el mod opcional <b>TimberMod Builder</b>.\nLa intenció és donar suport a mods com TimberApi. Llegeix la descripció actualitzada del mod per obtenir més informació.\nSi no t'importa, pots ignorar aquest missatge; no hi ha cap canvi en la funcionalitat actual."
beBY = "Гэты мод цяпер падтрымлівае экспарт у асобны мод, калі ў вас ёсць дадатковы мод <b>TimberMod Builder</b>.\nМэта — падтрымаць такія моды, як TimberApi. Калі ласка, прачытайце абноўлены апіс мода, каб атрымаць больш інфармацыі.\nКалі вас гэта не цікавіць, можаце праігнараваць гэта паведамленне: бягучая функцыянальнасць не змянілася."
roRO = "Acest mod acceptă acum exportul într-un mod independent, dacă ai instalat modul opțional <b>TimberMod Builder</b>.\nScopul este sprijinirea unor moduri precum TimberApi. Citește descrierea modului actualizată pentru mai multe informații.\nDacă nu te interesează acest lucru, poți ignora acest mesaj, deoarece nu există nicio modificare a funcționalității actuale."
huHU = "Ez a mod mostly már támogatja az exportálást önálló modként, ha telepítve van a nem kötelező <b>TimberMod Builder</b> mod.\nA cél a TimberApi-hoz hasonló modok támogatása. Kérjük, olvasd el a frissített mod-leírást a további információkért.\nHa ez nem érdekel, nyugodtan figyelmen kívül hagyhatod ezt az üzenetet, a jelenlegi működésen nincs változás."
arSA = "هذا المود يدعم الآن التصدير كمود مستقل إذا كان لديك المود الاختياري <b>TimberMod Builder</b>.\nالهدف هو دعم مودات مثل TimberApi. يُرجى قراءة وصف المود المحدَّث للحصول على مزيد من المعلومات.\nإذا لم يهمّك ذلك، يمكنك تجاهل هذه الرسالة، فلا يوجد أي تغيير في الوظائف الحالية."

