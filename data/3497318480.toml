["LV.CFac.ExportToModDesc"]
raw = "Click the above button to export the current configuration into a standalone mod.\nThat mod would then work by itself without this mod.\nIn fact, you must disable either this mod or the exported mod to avoid conflicts."
status = "normal"
enUS = "Click the above button to export the current configuration into a standalone mod. That mod would then work by itself without this mod. In fact, you must disable either this mod or the exported mod to avoid conflicts."
zhCN = "点击上面的按钮将当前配置导出为独立的模组。\n该模组可以独立工作，而无需这个模组。\n实际上，您必须禁用此模组或导出的模组之一，以避免冲突。"
zhTW = "點擊上面的按鈕將當前配置導出為獨立的模組。該模組將單獨運作，而不需要這個模組。實際上，您必須禁用這個模組或導出的模組，以避免發生衝突。"
ruRU = "Нажмите кнопку выше, чтобы экспортировать текущую конфигурацию в отдельный мод. Этот мод будет работать самостоятельно без этого мода. На самом деле, вам необходимо отключить либо этот мод, либо экспортированный мод, чтобы избежать конфликтов."
jaJP = "「上のボタンをクリックして、現在の設定をスタンドアロンのMODにエクスポートします。このMODは、単独で機能するようになります。実際、このMODまたはエクスポートされたMODのいずれかを無効にして、競合を避ける必要があります。」"
frFR = "Cliquez sur le bouton ci-dessus pour exporter la configuration actuelle dans un mod autonome. Ce mod fonctionnerait ensuite seul sans ce mod. En fait, vous devez désactiver soit ce mod, soit le mod exporté pour éviter les conflits."
deDE = "Klicken Sie auf die oben stehende Schaltfläche, um die aktuelle Konfiguration in ein eigenständiges Mod zu exportieren. \nDieses Mod würde dann eigenständig funktionieren, ohne dieses Mod. \nTatsächlich müssen Sie entweder dieses Mod oder das exportierte Mod deaktivieren, um Konflikte zu vermeiden."
plPL = "Kliknij powyższy przycisk, aby wyeksportować bieżącą konfigurację do samodzielnego moda. Ten mod będzie działał samodzielnie, bez potrzeby używania tego moda. W rzeczywistości musisz wyłączyć jeden z tych modów, aby uniknąć konfliktów."
ptBR = "Clipe o botão acima para exportar a configuração atual para um mod autônomo. Esse mod funcionará de forma independente, sem precisar deste mod. Na verdade, você deve desabilitar este mod ou o mod exportado para evitar conflitos."
koKR = "위 버튼을 클릭하여 현재 구성을 독립형 모드로 내보내십시오.  \n그 모드는 이 모드 없이도 작동합니다.  \n사실, 충돌을 피하기 위해서는 이 모드나 내보낸 모드 중 하나를 비활성화해야 합니다."
trTR = "Mevcut yapılandırmayı bağımsız bir moda aktarmak için yukarıdaki düğmeye tıklayın. \nBu mod, bu mod olmadan kendi başına çalışacaktır. \nAslında, çatışmaları önlemek için ya bu modu ya da aktarılan modu devre dışı bırakmalısınız."
esES = "Haga clic en el botón de arriba para exportar la configuración actual a un mod independiente.\nEse mod funcionaría por sí solo, sin necesidad de este mod.\nDe hecho, debe desactivar este mod o el mod exportado para evitar conflictos."
itIT = "Fai clic sul pulsante qui sopra per esportare la configurazione attuale in una mod autonoma.\nTale mod funzionerebbe da sola, senza questa mod.\nAnzi, devi disattivare questa mod o la mod esportata per evitare conflitti."
ukUA = "Натисніть вищевказану кнопку, щоб експортувати поточну конфігурацію в окремий мод.\nЦей мод працюватиме самостійно, без цього моду.\nНасправді вам потрібно вимкнути або цей мод, або експортований мод, щоб уникнути конфліктів."
thTH = "คลิกปุ่มด้านบนเพื่อส่งออกการตั้งค่าปัจจุบันเป็นม็อดอิสระ\nม็อดนั้นจะทำงานได้ด้วยตัวเองโดยไม่ต้องใช้ม็อดนี้\nอันที่จริง คุณต้องปิดใช้งานม็อดนี้หรือม็อดที่ส่งออกอย่างใดอย่างหนึ่ง เพื่อหลีกเลี่ยงความขัดแย้ง"
csCZ = "Klikněte na tlačítko výše pro export aktuální konfigurace do samostatného módu. \nTento mód by poté fungoval sám o sobě bez tohoto módu. \nVe skutečnosti musíte buď zakázat tento mód, nebo exportovaný mód, abyste se vyhnuli konfliktům."
viVN = "Nhấp nút ở trên để xuất cấu hình hiện tại thành một mod độc lập.\nMod đó sau đó sẽ hoạt động độc lập mà không cần mod này.\nTrên thực tế, bạn phải tắt mod này hoặc mod được xuất ra để tránh xung đột."
caES = "Feu clic al botó de dalt per exportar la configuració actual en un mod independent.\nAquest mod funcionaria llavors per si sol, sense aquest mod.\nDe fet, cal desactivar aquest mod o el mod exportat per evitar conflictes."
beBY = "Націсніце кнопку вышэй, каб экспартаваць бягучую канфігурацыю ў самастойны мод.\nГэты мод затым будзе працаваць сам па сабе, без гэтага мода.\nНасамрэч, вам трэба адключыць або гэты мод, або экспартаваны мод, каб пазбегнуць конфліктаў."
roRO = "Apăsați butonul de mai sus pentru a exporta configurația curentă într-un mod independent.\nAcel mod ar funcționa apoi singur, fără acest mod.\nDe fapt, trebuie să dezactivați fie acest mod, fie modul exportat, pentru a evita conflictele."
huHU = "Kattintson a fenti gombra a jelenlegi konfiguráció önálló modba exportálásához.\nEz a mod ezután önmagában, ezen mod nélkül is működne.\nSőt, a ütközések elkerülése érdekében vagy ezt a modot, vagy az exportált modot le kell tiltania."
arSA = "انقر على الزر أعلاه لتصدير الإعدادات الحالية إلى مود مستقل.\nسيعمل ذلك المود لاحقًا بمفرده دون الحاجة إلى هذا المود.\nفي الواقع، يجب تعطيل هذا المود أو المود المُصدَّر، أيهما، لتجنب التعارض."

["LV.CFac.ConflictWarning"]
raw = "<b>WARNING:</b> You have both this mod and an exported mod active.\nPlease use only one because you will have conflicting data no matter which purpose/mod you need"
status = "normal"
enUS = "<b>WARNING:</b> You have both this mod and an exported mod active. Please use only one because you will have conflicting data no matter which purpose/mod you need."
zhCN = "<b>警告：</b> 您同时启用了该模组和一个导出的模组。请只使用一个，因为无论您需要哪个模组，都会存在数据冲突。"
zhTW = "<b>警告：</b> 您同時啟用了此模組和一個已匯出的模組。請只使用其中一個，因為無論您需要哪個目的/模組，都會有衝突的數據。"
ruRU = "<b>ПРЕДУПРЕЖДЕНИЕ:</b> У вас активны как этот мод, так и экспортированный мод. Пожалуйста, используйте только один, так как у вас будут конфликтующие данные независимо от того, для какой цели/мода вы его используете."
jaJP = "<b>警告：</b> あなたはこのモッドとエクスポートされたモッドの両方をアクティブにしています。どちらか一方だけを使用してください。目的やモッドに関係なく、データの競合が発生します。"
frFR = "<b>AVERTISSEMENT :</b> Vous avez à la fois ce mod et un mod exporté activés. Veuillez n'en utiliser qu'un seul, car vous aurez des données conflictuelles, quel que soit le but/mod dont vous avez besoin."
deDE = "<b>WARNUNG:</b> Sie haben sowohl dieses Mod als auch ein exportiertes Mod aktiviert. Bitte verwenden Sie nur eines, da es zu widersprüchlichen Daten kommen wird, egal für welchen Zweck/Mod Sie es benötigen."
plPL = "<b>OSTRZEŻENIE:</b> Masz aktywne zarówno tę modyfikację, jak i wyeksportowaną modyfikację. Użyj tylko jednej, ponieważ będziesz mieć sprzeczne dane, niezależnie od celu/modyfikacji, której potrzebujesz."
ptBR = "<b>AVISO:</b> Você tem este mod e um mod exportado ativos.  \nPor favor, use apenas um, pois você terá dados conflitantes, independentemente do propósito/mod que você precisar."
koKR = "<b>경고:</b> 이 모드와 내보낸 모드가 모두 활성화되어 있습니다. 필요에 따라 어떤 모드를 사용하든지 간에 충돌하는 데이터가 발생하므로 한 가지만 사용해 주시기 바랍니다."
trTR = "<b>UYARI:</b> Hem bu modu hem de bir dışa aktarılmış modu aktif ettiniz. Lütfen yalnızca birini kullanın çünkü hangi amaç/modu kullanırsanız kullanın çelişen verilerle karşılaşacaksınız."
esES = "<b>ADVERTENCIA:</b> Tienes activos a la vez este mod y un mod exportado.\nUsa solo uno, porque tendrás datos en conflicto sin importar qué propósito o mod necesites"
itIT = "<b>AVVISO:</b> Hai attivi sia questa mod sia una mod esportata.\nUsane solo una, perché avrai dati in conflitto indipendentemente dallo scopo o dalla mod di cui hai bisogno"
ukUA = "<b>ПОПЕРЕДЖЕННЯ:</b> Одночасно активні і цей мод, і експортований мод.\nБудь ласка, використовуйте лише один із них, адже дані будуть конфліктувати незалежно від того, який мод або яка мета вам потрібні."
thTH = "<b>คำเตือน:</b> คุณเปิดใช้งานทั้งม็อดนี้และม็อดที่ส่งออกแล้วพร้อมกัน\nโปรดใช้เพียงอย่างเดียว เพราะข้อมูลจะขัดแย้งกันไม่ว่าคุณต้องการจุดประสงค์หรือม็อดใดก็ตาม"
csCZ = "<b>UPOZORNĚNÍ:</b> Máte aktivní jak tento mod, tak exportovaný mod. Používejte prosím pouze jeden, protože budete mít konfliktní data, ať už potřebujete jakýkoli účel/mod."
viVN = "<b>CẢNH BÁO:</b> Bạn đang kích hoạt cả mod này và một mod đã được xuất.\nVui lòng chỉ sử dụng một trong hai, vì bạn sẽ gặp dữ liệu mâu thuẫn cho dù mục đích hoặc mod bạn cần là gì."
caES = "<b>AVÍS:</b> Tens actius tant aquest mod com un mod exportat.\nUtilitza'n només un, perquè hi haurà dades en conflicte independentment del propòsit o del mod que necessitis."
beBY = "<b>ПАПЯРЭДЖАННЕ:</b> У вас адначасова актыўныя гэты мод і экспартаваны мод.\nВыкарыстоўвайце толькі адзін з іх, таму што ў любым выпадку з'явяцца канфліктуючыя даныя, незалежна ад таго, для якой мэты/якога мода вам патрэбны."
roRO = "<b>AVERTISMENT:</b> Aveți activ atât acest mod, cât și un mod exportat.\nVă rugăm să folosiți doar unul, deoarece veți avea date în conflict, indiferent de scopul/modul de care aveți nevoie"
huHU = "<b>FIGYELMEZTETÉS:</b> Ez a mod és egy exportált mod is aktív.\nKérjük, használjon csak egyet, mert ellentmondó adatok lesznek, függetlenül attól, hogy melyik célra vagy moddal van szükséged."
arSA = "<b>تحذير:</b> لديك هذا المود ومود مُصدَّر مفعّلين معاً.\nيُرجى استخدام واحد فقط لأنك ستحصل على بيانات متعارضة أياً كان الغرض/المود الذي تحتاجه."

