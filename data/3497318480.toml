plPL = "Nastąpiła istotna zmiana w tym modzie. Proszę przeczytać opis moda w celu zapoznania się z nowymi instrukcjami. Dziękuję!"
ptBR = "Houve uma mudança significativa neste mod. Por favor, leia a descrição do mod para as novas instruções. Obrigado!"
koKR = "이 모드에 중요한 변경 사항이 있었습니다. 새로운 지침은 모드 설명을 읽어주시기 바랍니다. 감사합니다!"
trTR = "Bu modda büyük bir değişiklik oldu. Lütfen yeni talimatlar için mod açıklamasını okuyun. Teşekkür ederim!"
esES = "Hubo un cambio importante en este mod. Lee la descripción del mod para ver las nuevas instrucciones. ¡Gracias!"
itIT = "Questa mod ha subito una modifica importante. Ti preghiamo di leggere la descrizione della mod per le nuove istruzioni. Grazie!"
ukUA = "Це мод змінився суттєво. Будь ласка, прочитайте опис мода, щоб дізнатися про нові інструкції. Дякуємо!"
thTH = "มีการเปลี่ยนแปลงครั้งใหญ่กับม็อดนี้ โปรดอ่านคำอธิบายของม็อดเพื่อดูคำแนะนำใหม่ ขอบคุณ!"
csCZ = "Došlo k významné změně tohoto módu. Prosím, přečtěte si popis módu pro nové pokyny. Děkujeme!"
viVN = "Có một sự thay đổi lớn đối với mod này. Vui lòng đọc mô tả của mod để biết các hướng dẫn mới. Cảm ơn!"
caES = "Hi ha hagut un canvi important en aquest mod. Si us plau, llegiu la descripció del mod per veure les noves instruccions. Gràcies!"
beBY = "Адбылася вялікая змена ў гэтым модзе. Калі ласка, прачытайце апісанне мода, каб даведацца пра новыя інструкцыі. Дзякуй!"
roRO = "Această modificare a suferit o schimbare majoră. Te rugăm să citești descrierea modificării pentru noile instrucțiuni. Mulțumim!"
huHU = "Ennek a modnak jelentős változása volt. Kérjük, olvasd el a mod leírását az új utasításokért. Köszönjük!"
arSA = "تم إجراء تغيير كبير على هذا المود. يُرجى قراءة وصف المود للاطلاع على التعليمات الجديدة. شكرًا لك!"
