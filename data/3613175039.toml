["LV.MTA.LockAchConfirm"]
raw = "Are you sure you want to lock this achievement again? This will show this achievement as locked and you can attempt to unlock it again.\n<RedHighlight>Please make a save and reload it to fully take effect.</RedHighlight>"
status = "normal"
enUS = "Are you sure you want to lock this achievement again? This will show this achievement as locked and you can attempt to unlock it again. <RedHighlight>Please make a save and reload it to fully take effect.</RedHighlight>"
zhCN = "您确定要再次锁定这个成就吗？这将显示该成就为锁定状态，您可以再次尝试解锁它。  \n<RedHighlight>请保存并重新加载以使其完全生效。</RedHighlight>"
zhTW = "您確定要再次鎖定這個成就嗎？這將顯示此成就已被鎖定，您可以嘗試再次解鎖它。<RedHighlight>請先保存遊戲並重新載入以完全生效。</RedHighlight>"
ruRU = "Вы уверены, что хотите снова заблокировать это достижение? Это отобразит это достижение как заблокированное, и вы сможете попытаться разблокировать его снова.  \n<RedHighlight>Пожалуйста, сделайте сохранение и перезагрузите игру, чтобы изменения полностью вступили в силу.</RedHighlight>"
jaJP = "「この実績を再度ロックしてもよろしいですか？これにより、この実績がロックされ、再度アンロックを試みることができます。\n<RedHighlight>効果を完全に反映させるために、セーブして再ロードしてください。</RedHighlight>」"
frFR = "Êtes-vous sûr de vouloir verrouiller cet exploit à nouveau ? Cela affichera cet exploit comme verrouillé et vous pourrez essayer de le débloquer à nouveau.  \n<RedHighlight>Veuillez faire une sauvegarde et la recharger pour que cela prenne pleinement effet.</RedHighlight>"
deDE = "Bist du sicher, dass du diesen Erfolg erneut sperren möchtest? Dadurch wird dieser Erfolg als gesperrt angezeigt und du kannst versuchen, ihn erneut freizuschalten.\n<RoteHervorhebung>Bitte mache ein Speicherstand und lade ihn, um die Änderungen vollständig wirksam zu machen.</RoteHervorhebung>"
plPL = "Czy na pewno chcesz ponownie zablokować to osiągnięcie? To pokaże to osiągnięcie jako zablokowane i możesz spróbować je odblokować ponownie.  \n<RedHighlight>Proszę, zrób zapisz i załaduj go, aby w pełni to zadziałało.</RedHighlight>"
ptBR = "Você tem certeza de que deseja trancar esta conquista novamente? Isso mostrará esta conquista como trancada e você poderá tentar desbloqueá-la novamente.  \n<DestaqueVermelho>Por favor, faça um salvamento e recarregue-o para que tenha efeito total.</DestaqueVermelho>"
koKR = "이 업적을 다시 잠그시겠습니까? 이 업적은 잠금 상태로 표시되며, 다시 잠금 해제를 시도할 수 있습니다.\n<RedHighlight>변경 사항을 완전히 적용하려면 저장하고 다시 로드해 주십시오.</RedHighlight>"
trTR = "Bu başarıyı tekrar kilitlemek istediğinize emin misiniz? Bu, başarıyı kilitli olarak gösterecek ve tekrar açmayı deneyebilirsiniz.  \n<KırmızıVurgu>Lütfen bir kayıt yapın ve tam anlamıyla etkili olması için yeniden yükleyin.</KırmızıVurgu>"
esES = "¿Seguro que quieres volver a bloquear este logro? Esto mostrará el logro como bloqueado y podrás intentar desbloquearlo de nuevo.\n<RedHighlight>Guarda la partida y vuelve a cargarla para que el cambio surta efecto por completo.</RedHighlight>"
itIT = "Sei sicuro di voler bloccare di nuovo questo obiettivo? Così facendo, l'obiettivo risulterà di nuovo bloccato e potrai tentare di sbloccarlo nuovamente.\n<RedHighlight>Salva la partita e ricaricala per rendere la modifica pienamente effettiva.</RedHighlight>"
ukUA = "Ви впевнені, що хочете знову заблокувати це досягнення? Його буде показано як заблоковане, і ви зможете спробувати розблокувати його знову.\n<RedHighlight>Щоб зміни повністю набули чинності, зробіть збереження та завантажте його.</RedHighlight>"
thTH = "คุณแน่ใจหรือไม่ว่าต้องการล็อกความสำเร็จนี้อีกครั้ง การดำเนินการนี้จะแสดงความสำเร็จนี้เป็นถูกล็อก และคุณสามารถลองปลดล็อกอีกครั้งได้\n<RedHighlight>โปรดบันทึกเกมและโหลดใหม่เพื่อให้มีผลสมบูรณ์</RedHighlight>"
csCZ = "Opravdu chcete tuto trofej znovu zamknout? Tím se tato trofej zobrazí jako zamknutá a můžete se pokusit o její odemčení znovu.  \n<RedHighlight>Pro úplné uplatnění prosím vytvořte uloženou hru a načtěte ji.</RedHighlight>"
viVN = "Bạn có chắc chắn muốn khóa lại thành tích này không? Điều này sẽ hiển thị thành tích này là đã bị khóa và bạn có thể thử mở khóa nó lần nữa.\n<RedHighlight>Vui lòng lưu và tải lại để có hiệu lực hoàn toàn.</RedHighlight>"
caES = "Estàs segur que vols tornar a bloquejar aquest assoliment? Això mostrarà l'assoliment com a bloquejat i podràs intentar desbloquejar-lo de nou.\n<RedHighlight>Fes un desat i torna'l a carregar perquè tingui efecte complet.</RedHighlight>"
beBY = "Вы ўпэўнены, što хочаце zablakavać гэтае дасягненне паўторна? Гэта пакажа дасягненне як заблакаванае, і вы зможаце спрабаваць разблакаваць яго зноў.\n<RedHighlight>Калі ласка, захавайце гульню і загрузіце яе, каб змены цалкам набылі сілу.</RedHighlight>"
roRO = "Sigur vrei să blochezi din nou acest obiectiv? Acesta va fi afișat ca blocat, iar tu vei putea să îl deblochezi din nou.\n<RedHighlight>Te rugăm să salvezi jocul și să îl încarci din nou pentru ca modificarea să intre complet în vigoare.</RedHighlight>"
huHU = "Biztosan újra zárolni szeretnéd ezt a teljesítményt? Ezzel a teljesítmény zároltként jelenik meg, és később ismét megpróbálhatod feloldani.\n<RedHighlight>A teljes hatás érvényesítéséhez kérjük, készíts mentést, és töltsd be újra.</RedHighlight>"
arSA = "هل أنت متأكد من أنك تريد قفل هذا الإنجاز مرة أخرى؟ سيظهر هذا الإنجاز على أنه مقفل، ويمكنك محاولة فتحه مرة أخرى.\n<RedHighlight>يرجى حفظ اللعبة وإعادة تحميلها لكي يسري التغيير بالكامل.</RedHighlight>"

