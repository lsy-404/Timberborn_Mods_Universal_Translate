["Building.HoneyHive.Description"]
raw = "Polination is one thing. But honey is honey. Everybobee to work!"
status = "normal"
enUS = "Polination is one thing. But honey is honey. Everybobee to work!"
zhCN = "养殖蜜蜂，获取酿造的蜂蜜。"
zhTW = "授粉是一回事，但蜂蜜就是蜂蜜。大家一起工作吧！"
ruRU = "Опыление — это одно. Но мед — это мед. Всем на работу!"
jaJP = "受粉は一つのことですが、蜂蜜は蜂蜜です。さあ、みんな働こう！"
frFR = "La pollinisation est une chose. Mais le miel, c'est du miel. Tout le monde au travail !"
deDE = "Bestäubung ist das Eine. Aber Honig ist Honig. Alle zur Arbeit!"
plPL = "Zapylanie to jedno. Ale miód to miód. Do pracy wszyscy!"
ptBR = "A polinização é uma coisa. Mas o mel é mel. Todos para o trabalho!"
koKR = "수분작용도 중요하지만, 꿀은 꿀이다. 모두 일하자!"
csCZ = "Opylování je jedna věc. Ale med je med. Všichni do práce!"
viVN = "Thụ phấn là một chuyện. Nhưng mật ong vẫn là mật ong. Mọi chú ong hãy làm việc!"
trTR = "Polinasyon bir şeydir. Ama bal, baldır. Herkes işe!"

