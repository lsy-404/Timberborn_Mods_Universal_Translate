viVN = "\"Thật tuyệt khi bước qua cuộc sống với đôi tay dính mật ong!\" —những chú hải ly con"
trTR = "\"Yapışkan parmaklarla yaşayarak dolaşmak güzel!\" — Kunduz yavruları"

