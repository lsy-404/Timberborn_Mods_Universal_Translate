["Building.AdvancedMedicalBed.FlavorDescription"]
raw = "\"Through advancement in beekeeping we support our own health\" —Beavercrates"
status = "normal"
enUS = "\"Through advancement in beekeeping we support our own health\" —Beavercrates"
zhCN = "\"通过养蜂技术的进步，我们支持自己的健康。\" —海狸箱"
zhTW = "\"透過養蜂技術的進步，我們支持自己的健康\" —比佛克雷茲"
ruRU = "\"Посредством разработки пчеловодства мы поддерживаем собственное здоровье\" — Beavercrates"
jaJP = "「養蜂の進歩を通じて、私たちは自分自身の健康をサポートします」 —ビーバークレーツ"
frFR = "\"Grâce aux avancées dans l'apiculture, nous soutenons notre propre santé.\" —Beavercrates"
deDE = "\"Durch Fortschritte in der Imkerei unterstützen wir unsere eigene Gesundheit.\" —Beavercrates"
plPL = "\"Dzięki postępowi w pszczelarstwie wspieramy nasze zdrowie\" —Beaverkraty"
ptBR = "\"Através do avanço na apicultura, apoiamos nossa própria saúde.\" —Beavercrates"
koKR = "\"벌꿀 양식의 발전을 통해 우리는 우리의 건강을 지원합니다.\" —비버크레이트"
trTR = "\"Arıcılıktaki ilerlemeler sayesinde kendi sağlığımızı destekliyoruz\" —Beyaz Ayı Kutuları"
esES = "\"Gracias a los avances en apicultura, cuidamos nuestra propia salud\" —Beavercrates"
itIT = "\"Attraverso i progressi nell'apicoltura sosteniamo la nostra salute\" —Beavercrates"
ukUA = "«Завдяки вдосконаленню бджільництва ми піклуємося про власне здоров'я» —Beavercrates"
thTH = "\"ด้วยความก้าวหน้าในการเลี้ยงผึ้ง เราจึงดูแลสุขภาพของเราเอง\" —Beavercrates"
csCZ = "\"Pokrokem v včelařství podporujeme své vlastní zdraví\" —Beavercrates"
viVN = "Nhờ sự tiến bộ trong nuôi ong, chúng ta chăm sóc sức khỏe của bản thân —Beavercrates"
caES = "\"Gràcies als avenços en apicultura, cuidem la nostra pròpia salut\" —Beavercrates"
beBY = "«Дзякуючы развіццю пчалярства мы падтрымліваем уласнае здароўе» — Beavercrates"
roRO = "\"Prin progresele în apicultură ne susținem propria sănătate\" —Beavercrates"
huHU = "„A méhészet fejlesztésével saját egészségünket támogatjuk\" —Beavercrates"
arSA = "\"من خلال التقدم في تربية النحل نحافظ على صحتنا\" —Beavercrates"

