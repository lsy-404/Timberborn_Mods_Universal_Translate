["Building.HoneyHive.Description"]
raw = "Polination is one thing. But honey is honey. Everybobee to work!"
status = "normal"
enUS = "Polination is one thing. But honey is honey. Everybobee to work!"
zhCN = "养殖蜜蜂，获取酿造的蜂蜜。"
zhTW = "授粉是一回事，但蜂蜜就是蜂蜜。大家一起工作吧！"
ruRU = "Опыление — это одно. Но мед — это мед. Всем на работу!"
jaJP = "受粉は一つのことですが、蜂蜜は蜂蜜です。さあ、みんな働こう！"
frFR = "La pollinisation est une chose. Mais le miel, c'est du miel. Tout le monde au travail !"
deDE = "Bestäubung ist das Eine. Aber Honig ist Honig. Alle zur Arbeit!"
plPL = "Zapylanie to jedno. Ale miód to miód. Do pracy wszyscy!"
ptBR = "A polinização é uma coisa. Mas o mel é mel. Todos para o trabalho!"
koKR = "수분작용도 중요하지만, 꿀은 꿀이다. 모두 일하자!"
trTR = "Polinasyon bir şeydir. Ama bal, baldır. Herkes işe!"
esES = "Polinización es una cosa. Pero la miel es miel. ¡Todos a trabajar!"
itIT = "Il polline è una cosa. Ma il miele è miele. Tutti al lavoro, ape per ape!"
ukUA = "Запилення — це одне. Але мед є медом. Усібобри до роботи!"
thTH = "การผสมเกสรเป็นเรื่องหนึ่ง แต่น้ำผึ้งก็คือน้ำผึ้ง ผึ้งทุกตัวไปทำงานได้แล้ว!"
csCZ = "Opylování je jedna věc. Ale med je med. Všichni do práce!"
viVN = "Thụ phấn là một chuyện. Nhưng mật ong vẫn là mật ong. Mọi chú ong hãy làm việc!"
caES = "Pol·linització és una cosa. Però la mel és mel. Tothom a treballar!"
beBY = "Апыленне — гэта адно, але мёд ёсць мёд. Усе да працы!"
roRO = "Polenizarea este un lucru. Dar mierea este miere. Toți la muncă!"
huHU = "Beporzás az egyik dolog. De a méz méz. Mindenki dolgozni!"
arSA = "التلقيح شيء، لكن العسل عسلٌ. هيا أيها النحل، الجميع إلى العمل!"

["Building.HoneyHive.FlavorDescription"]
raw = "\"It's nice to walk through live with sticky fingers!\" —Beaver kits"
status = "normal"
enUS = "\"It's nice to walk through life with sticky fingers!\" —Beaver kits"
zhCN = "“穿越生活时手指黏黏的感觉真不错！”——海狸宝宝"
zhTW = "「有黏黏的手指走過生活真好！」—海獺幼仔"
ruRU = "\"Хорошо идти по жизни с липкими пальцами!\" —Ласки бобров"
jaJP = "「粘り気のある指で生きるのは素晴らしい！」—ビーバーの子供たち"
frFR = "\"C'est agréable de traverser la vie avec des doigts collants !\" —Bébés castors"
deDE = "\"Es ist schön, mit klebrigen Fingern durch das Leben zu gehen!\" —Biberjungen"
plPL = "\"Miło jest przechodzić przez życie z lepkimi palcami!\" —Młode bobry"
ptBR = "\"É bom passar pela vida com dedos pegajosos!\" —Filhotes de castor"
koKR = "\"끈적끈적한 손으로 살아가는 것은 정말 멋져요!\" —비버 키트"
trTR = "\"Yapışkan parmaklarla yaşayarak dolaşmak güzel!\" — Kunduz yavruları"
esES = "\"¡Qué bien se siente caminar por aquí con los dedos pegajosos!\" —Castores pequeños"
itIT = "\"È bello camminare dal vivo con le dita appiccicose!\" —Cuccioli di castoro"
ukUA = "«Приємно проходити наскрізь, коли пальці липкі!» —бобреня"
thTH = "\"การเดินผ่านไปแบบมือเหนียวๆ ก็น่ารักดีนะ!\" —ลูกบีเวอร์"
csCZ = "\"Je hezké chodit životem se lepkavými prsty!\" —Bobří mláďata"
viVN = "\"Thật tuyệt khi bước qua cuộc sống với đôi tay dính mật ong!\" —những chú hải ly con"
caES = "\"Està bé caminar per aquí amb els dits enganxosos!\" —Cries de castor"
beBY = "«Прыемна ісці праз жывую прыроду з ліпкімі пальцамі!» —бабраняты"
roRO = "„Ce plăcut e să treci prin viață cu degetele lipicioase!” —Pui de castor"
huHU = "„Jó sétálni élő, ragacsos ujjakkal!\" —Bébi hódok"
arSA = "\"من الجميل أن نمشي بين الأشياء بأصابع لزجة!\" —صغار القنادس"

