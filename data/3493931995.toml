frFR = "\"C'est agréable de traverser la vie avec des doigts collants !\" —Bébés castors"
deDE = "\"Es ist schön, mit klebrigen Fingern durch das Leben zu gehen!\" —Biberjungen"
plPL = "\"Miło jest przechodzić przez życie z lepkimi palcami!\" —Młode bobry"
ptBR = "\"É bom passar pela vida com dedos pegajosos!\" —Filhotes de castor"
koKR = "\"끈적끈적한 손으로 살아가는 것은 정말 멋져요!\" —비버 키트"
