["Building.BarkimedesScrew.Description"]
status = "normal"
raw = "Lifts water or badwater two levels up a slope. Needs mechanical power. The intake must sit in water."
enUS = "Lifts water or badwater up a slope by two levels. Requires mechanical power. The intake must be submerged."
zhCN = "将水或恶水提升至上坡两层高处。需要机械动力。进水口必须位于水中。"
zhTW = "將水或污水沿斜坡提升兩個高度。需要機械動力。進水口必須位於水中。"
ruRU = "Поднимает воду или грязную воду на два уровня вверх по склону. Требует механической энергии. Водозабор должен находиться в воде."
jaJP = "水または汚染水を斜面に沿って2段分くみ上げます。機械動力が必要です。取水口は水中に設置してください。"
frFR = "Remonte l’eau ou l’eau polluée de deux niveaux sur une pente. Nécessite une alimentation mécanique. La prise d’eau doit se trouver dans l’eau."
deDE = "Fördert Wasser oder Schadwasser zwei Höhenstufen eine Steigung hinauf. Benötigt mechanische Energie. Der Einlass muss im Wasser liegen."
plPL = "Podnosi wodę lub skażoną wodę o dwa poziomy w górę zbocza. Wymaga zasilania mechanicznego. Wlot musi znajdować się w wodzie."
ptBR = "Eleva água ou água contaminada em dois níveis por uma encosta. Precisa de energia mecânica. A entrada deve ficar na água."
koKR = "물이나 오염수를 경사면 위로 2층 높이까지 끌어올립니다. 기계 동력이 필요합니다. 흡입구는 물속에 있어야 합니다."
csCZ = "Čerpá vodu nebo znečištěnou vodu o dvě úrovně výše po svahu. Vyžaduje mechanickou energii. Sací otvor musí být ve vodě."
viVN = "Nâng nước hoặc nước ô nhiễm lên cao hơn hai tầng trên một con dốc. Cần có năng lượng cơ học. Cửa hút phải đặt trong nước."
trTR = "Suyu veya kirli suyu bir yokuşta iki seviye yukarı taşır. Mekanik güç gerektirir. Su girişi suyun içinde olmalıdır."

["Building.BarkimedesScrew.FlavorDescription"]
status = "normal"
raw = "For us natural science is the Archimedes' screw that alone can turn the world to face the sun of reason. - Maxim Gorky"
enUS = "For us, natural science is the Archimedes’ screw that alone can turn the world to face the sun of reason. - Maxim Gorky"
zhCN = "对我们来说，自然科学就是阿基米德螺旋，唯有它能让世界转向理性的太阳。——马克西姆·高尔基"
zhTW = "對我們而言，自然科學就是阿基米德螺旋，唯有它能讓世界轉向理性的太陽。——馬克西姆·高爾基"
ruRU = "Для нас естествознание — это винт Архимеда, который один лишь способен повернуть мир лицом к солнцу разума. — Максим Горький"
jaJP = "私たちにとって自然科学とは、世界を理性の太陽に向けられる唯一のアルキメデスのねじである。— マクシム・ゴーリキー"
frFR = "Pour nous, les sciences naturelles sont la vis d’Archimède, seule capable de faire tourner le monde vers le soleil de la raison. - Maxime Gorki"
deDE = "Für uns ist die Naturwissenschaft die archimedische Schraube, die allein die Welt der Sonne der Vernunft zuwenden kann. – Maxim Gorki"
plPL = "Dla nas nauki przyrodnicze są śrubą Archimedesa, która jako jedyna może obrócić świat ku słońcu rozumu. – Maksim Gorki"
ptBR = "Para nós, a ciência natural é o parafuso de Arquimedes que, sozinho, pode fazer o mundo voltar-se para o sol da razão. — Maxim Gorky"
koKR = "우리에게 자연과학은 이성의 태양을 향해 세상을 돌릴 수 있는 유일한 아르키메데스 나사다. - 막심 고리키"
csCZ = "Pro nás je přírodní věda Archimédův šroub, který jediný dokáže otočit svět tváří ke slunci rozumu. – Maxim Gorkij"
viVN = "Đối với chúng ta, khoa học tự nhiên là chiếc vít Archimedes duy nhất có thể xoay chuyển thế giới để hướng về mặt trời của lý trí. - Maxim Gorky"
trTR = "Bizim için doğa bilimi, dünyayı aklın güneşine çevirebilecek tek şey olan Arşimet vidasıdır. - Maksim Gorki"
