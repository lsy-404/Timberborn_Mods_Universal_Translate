["Building.BarkimedesScrew.Description"]
status = "normal"
raw = "Lifts water or badwater two levels up a slope. Needs mechanical power. The intake must sit in water."
enUS = "Lifts water or badwater two levels up a slope. Requires mechanical power. The intake must be in water."
zhCN = "将水或恶水提升至坡上高两层的位置。需要机械动力。进水口必须位于水中。"
zhTW = "可將水或污水沿斜坡向上提升兩個高度。需要機械動力。進水口必須位於水中。"
ruRU = "Поднимает воду или грязную воду на два уровня вверх по склону. Требует механической энергии. Водозабор должен находиться в воде."
jaJP = "水または汚水を斜面の上へ2段分くみ上げます。機械動力が必要です。取水口は水中に設置する必要があります。"
frFR = "Remonte l’eau ou l’eau toxique de deux niveaux le long d’une pente. Nécessite une puissance mécanique. La prise d’eau doit être immergée."
deDE = "Hebt Wasser oder Schadwasser zwei Ebenen einen Hang hinauf. Benötigt mechanische Energie. Der Einlass muss im Wasser liegen."
plPL = "Podnosi wodę lub toksyczną wodę o dwa poziomy w górę zbocza. Wymaga zasilania mechanicznego. Wlot musi znajdować się w wodzie."
ptBR = "Eleva água ou água tóxica dois níveis acima em uma encosta. Precisa de energia mecânica. A entrada deve ficar na água."
koKR = "물이나 오염수를 경사면을 따라 두 단계 위로 끌어올립니다. 기계 동력이 필요합니다. 흡입구가 물속에 있어야 합니다."
csCZ = "Čerpá vodu nebo zkaženou vodu o dvě úrovně výš po svahu. Vyžaduje mechanickou energii. Vtok musí být umístěn ve vodě."
viVN = "Nâng nước hoặc nước ô nhiễm lên hai tầng dốc. Cần có năng lượng cơ học. Cửa hút phải nằm trong nước."
trTR = "Suyu veya kirli suyu yokuşta iki seviye yukarı taşır. Mekanik güç gerektirir. Su girişi suyun içinde olmalıdır."

["Building.BarkimedesScrew.FlavorDescription"]
status = "normal"
raw = "For us natural science is the Archimedes' screw that alone can turn the world to face the sun of reason. - Maxim Gorky"
enUS = "For us, natural science is the Archimedes' screw that alone can turn the world to face the sun of reason. - Maxim Gorky"
zhCN = "对我们而言，自然科学是阿基米德螺旋，唯有它能让世界转向理性之光。——马克西姆·高尔基"
zhTW = "對我們而言，自然科學就是阿基米德螺旋泵，唯有它能讓世界轉向理性的太陽。——馬克西姆·高爾基"
ruRU = "Для нас естествознание — это винт Архимеда, который один лишь способен повернуть мир лицом к солнцу разума. — Максим Горький"
jaJP = "私たちにとって自然科学とは、理性の太陽に世界を向けることのできる唯一のアルキメデスのねじである。―マクシム・ゴーリキー"
frFR = "Pour nous, les sciences naturelles sont la vis d’Archimède, seule capable de faire tourner le monde vers le soleil de la raison. — Maxime Gorki"
deDE = "Für uns ist die Naturwissenschaft die archimedische Schraube, die allein die Welt der Sonne der Vernunft zuwenden kann. – Maxim Gorki"
plPL = "Dla nas nauki przyrodnicze są śrubą Archimedesa, która jako jedyna może obrócić świat ku słońcu rozumu. – Maksim Gorki"
ptBR = "Para nós, a ciência natural é o parafuso de Arquimedes, o único capaz de fazer o mundo se voltar para o sol da razão. - Maxim Gorky"
koKR = "우리에게 자연과학은 세상이 이성의 태양을 마주 보도록 돌릴 수 있는 유일한 아르키메데스 나선 펌프다. - 막심 고리키"
csCZ = "Přírodní věda je pro nás Archimédův šroub, který jediný dokáže obrátit svět tváří ke slunci rozumu. – Maxim Gorkij"
viVN = "Đối với chúng ta, khoa học tự nhiên là chiếc đinh vít Archimedes duy nhất có thể xoay chuyển thế giới để hướng về mặt trời của lý trí. - Maxim Gorky"
trTR = "Bizim için doğa bilimi, dünyayı aklın güneşine çevirebilecek tek Arşimet vidasıdır. - Maksim Gorki"
