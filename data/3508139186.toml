["LV.MWRS.RedsurgeMultiplierDesc"]
raw = "The maximum additional multiplier for the Redsurge weather at maximum (no handicap).\nThis value is affected by handicap like Duration.\nDefault value: 2.5 (250%) meaning when no handicap is applied (default cycle 5),\nall water sources strength is at 350%."
status = "normal"
enUS = "The maximum additional multiplier for the Redsurge weather at maximum (no handicap).\nThis value is affected by handicap like Duration.\nDefault value: 2.5 (250%) meaning when no handicap is applied (default cycle 5),\nall water sources strength is at 350%."
zhCN = "血汛潮时水源的额外水力倍率，即水源的水力会变为“水力×(基础倍率+额外倍率)”。<br>注意，此数值受天气初始强度值、适应周期数影响。"
zhTW = "在最大情況下，紅潮天氣的最大額外乘數（無障礙）。這個數值會受到像持續時間這樣的障礙影響。默認值：2.5（250%），這意味著當不應用障礙時（默認周期為5），所有水源的強度為350%。"
ruRU = "Максимальный дополнительный множитель для погодного явления Redsurge на максимуме (без штрафа). Это значение зависит от штрафа, как и длительность. Значение по умолчанию: 2.5 (250%), что означает, что при отсутствии штрафа (цикл по умолчанию 5) вся сила водных источников составляет 350%."
jaJP = "レッドサージ天候の最大追加乗数（ハンディキャップなし）について。  \nこの値は、持続時間のようなハンディキャップの影響を受けます。  \nデフォルト値：2.5（250%）は、ハンディキャップが適用されていない場合（デフォルトサイクル5）に、すべての水源の強さが350%になることを意味します。"
frFR = "Le multiplicateur additionnel maximum pour le temps de Redsurge au maximum (sans handicap). Cette valeur est affectée par le handicap comme la Durée. Valeur par défaut : 2,5 (250 %) ce qui signifie que lorsque aucun handicap n'est appliqué (cycle par défaut 5), toute la force des sources d'eau est à 350 %."
deDE = "Der maximale zusätzliche Multiplikator für das Redsurge-Wetter bei maximaler Stufe (ohne Handicap). \nDieser Wert wird durch Handicap wie Dauer beeinflusst. \nStandardwert: 2,5 (250%), was bedeutet, dass bei nicht angewendetem Handicap (Standardzyklus 5) alle Wasserquellenstärken bei 350% liegen."
plPL = "Maksymalny dodatkowy mnożnik dla pogody Redsurge przy maksymalnym (bez handicapu). Ta wartość jest wpływana przez handicap, taki jak Czas trwania. Wartość domyślna: 2,5 (250%), co oznacza, że gdy handicap nie jest stosowany (domyślny cykl 5), siła wszystkich źródeł wody wynosi 350%."
ptBR = "O multiplicador adicional máximo para o clima Redsurge no máximo (sem handicap). Este valor é afetado por handicap como Duração. Valor padrão: 2,5 (250%), o que significa que quando nenhum handicap é aplicado (ciclo padrão 5), a força de todas as fontes de água está em 350%."
koKR = "레드서지 날씨에서 최대 추가 배율 (핸디캡 없음)입니다.\n이 값은 지속시간과 같은 핸디캡의 영향을 받습니다.\n기본값: 2.5 (250%)로, 핸디캡이 적용되지 않을 때 (기본 주기 5) 모든 물 공급원의 힘이 350%에 해당합니다."
trTR = "Redsurge hava durumu için maksimum ek çarpan, maksimumda (handikapsız). Bu değer, Süre gibi handikaplardan etkilenir. Varsayılan değer: 2.5 (%250), yani handikap uygulanmadığında (varsayılan döngü 5), tüm su kaynaklarının gücü %350'dir."
esES = "El multiplicador adicional máximo para el clima Redsurge en su valor máximo (sin penalización).\nEste valor se ve afectado por la penalización, igual que la duración.\nValor predeterminado: 2.5 (250%), lo que significa que, cuando no se aplica ninguna penalización (ciclo predeterminado 5),\nla intensidad de todas las fuentes de agua es del 350%."
itIT = "Il moltiplicatore aggiuntivo massimo per il meteo Redsurge al massimo (senza handicap).\nQuesto valore è influenzato dall'handicap come la Durata.\nValore predefinito: 2.5 (250%), il che significa che quando non viene applicato alcun handicap (ciclo predefinito 5),\nla potenza di tutte le fonti d'acqua è al 350%."
ukUA = "Максимальний додатковий множник для погоди Redsurge на максимумі (без гандикапу).\nНа це значення впливає гандикап, так само як і на Тривалість.\nЗначення за замовчуванням: 2.5 (250%), що означає: коли гандикап не застосовано (стандартний цикл 5),\nсила всіх джерел води становить 350%."
thTH = "ตัวคูณเพิ่มเติมสูงสุดสำหรับสภาพอากาศ Redsurge ในระดับสูงสุด (ไม่มีตัวปรับความยาก)\nค่านี้ได้รับผลจากตัวปรับความยากเช่นเดียวกับระยะเวลา\nค่าเริ่มต้น: 2.5 (250%) หมายความว่าเมื่อไม่มีการใช้ตัวปรับความยาก (รอบเริ่มต้น 5)\nความแรงของแหล่งน้ำทั้งหมดจะอยู่ที่ 350%"
csCZ = "Maximální dodatečný multiplikátor pro počasí Redsurge na maximální úrovni (bez handicapu). Tato hodnota je ovlivněna handicapem, jako je Délka. Výchozí hodnota: 2,5 (250 %), což znamená, že při aplikaci žádného handicapu (výchozí cyklus 5) je síla všech zdrojů vody na 350 %."
viVN = "Hệ số nhân bổ sung tối đa cho thời tiết Redsurge ở mức tối đa (không có handicap). Giá trị này bị ảnh hưởng bởi handicap như Thời lượng. Giá trị mặc định: 2.5 (250%) nghĩa là khi không áp dụng handicap (chu kỳ mặc định là 5), tất cả nguồn nước có sức mạnh đạt 350%."
caES = "Multiplicador addicional màxim del temps Redsurge al màxim (sense desavantatge).\nAquest valor es veu afectat pel desavantatge, igual que la durada.\nValor per defecte: 2,5 (250%), és a dir, quan no s'aplica cap desavantatge (cicle per defecte 5),\nla intensitat de totes les fonts d'aigua és del 350%."
beBY = "Максімальны дадатковы множнік для надзвычайнай сілы Redsurge пры максімальным значэнні (без складанасці).\nНа гэта значэнне ўплывае складанасць, як і на Працягласць.\nЗначэнне па змаўчанні: 2,5 (250%), што азначае, што пры адсутнасці складанасці (стандартны цыкл 5),\nсіла ўсіх крыніц вады складае 350%."
roRO = "The multiplicatorul suplimentar maxim pentru vremea Redsurge la intensitate maximă (fără handicap).\nAceastă valoare este afectată de handicap, la fel ca Durata.\nValoare implicită: 2,5 (250%), ceea ce înseamnă că, atunci când nu se aplică niciun handicap (ciclu implicit 5),\nputerea tuturor surselor de apă este de 350%."
huHU = "A Redsurge időjárás maximális további szorzója maximális értéken (hátrány nélkül).\nEzt az értéket a hátrány az Időtartamhoz hasonlóan befolyásolja.\nAlapértelmezett érték: 2.5 (250%), ami azt jelenti, hogy hátrány alkalmazása nélkül (5-ös alapértelmezett ciklus esetén),\naz összes vízforrás erőssége 350%."
arSA = "أقصى مُضاعِف إضافي لطقس الاندفاع الأحمر عند الحد الأقصى (من دون إعاقة).\nتتأثر هذه القيمة بالإعاقة مثل المدة.\nالقيمة الافتراضية: 2.5 (250%)، وهذا يعني أنه عند عدم تطبيق أي إعاقة (الدورة الافتراضية 5)،\nتكون قوة جميع مصادر المياه عند 350%."

