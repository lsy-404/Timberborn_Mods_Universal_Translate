["Building.SEE.SteamBoiler.Description"]
status = "normal"
raw = "Consumes fuel and water to produce power. Requires periodic maintenance."
enUS = "Consumes fuel and water to produce power. Requires periodic maintenance."
zhCN = "消耗燃料和水来产生动力。需要定期维护。"
zhTW = "消耗燃料與水來產生動力。需要定期維護。"
ruRU = "Потребляет топливо и воду для производства энергии. Требует периодического техобслуживания."
jaJP = "燃料と水を消費して動力を生み出します。定期的なメンテナンスが必要です。"
frFR = "Consomme du combustible et de l'eau pour produire de l'énergie. Nécessite un entretien périodique."
deDE = "Verbraucht Brennstoff und Wasser, um Strom zu erzeugen. Benötigt regelmäßige Wartung."
plPL = "Zużywa paliwo i wodę, aby wytwarzać energię. Wymaga okresowej konserwacji."
ptBR = "Consome combustível e água para produzir energia. Requer manutenção periódica."
koKR = "연료와 물을 소비하여 동력을 생성합니다. 주기적인 정비가 필요합니다."
trTR = "Yakıt ve su tüketerek güç üretir. Periyodik bakım gerektirir."
esES = "Consume combustible y agua para producir energía. Requiere mantenimiento periódico."
itIT = "Consuma carburante e acqua per produrre energia. Richiede manutenzione periodica."
ukUA = "Споживає паливо та воду для виробництва енергії. Потребує періодичного технічного обслуговування."
thTH = "ใช้เชื้อเพลิงและน้ำเพื่อผลิตพลังงาน ต้องได้รับการบำรุงรักษาเป็นระยะ"
csCZ = "Spotřebovává palivo a vodu k výrobě energie. Vyžaduje pravidelnou údržbu."
viVN = "Tiêu thụ nhiên liệu và nước để tạo ra năng lượng. Cần bảo trì định kỳ."
caES = "Consumeix combustible i aigua per produir energia. Necessita manteniment periòdic."
beBY = "Спажывае паліва і ваду для выпрацоўкі энергіі. Патрабуе перыядычнага тэхнічнага абслугоўвання."
roRO = "Consumă combustibil și apă pentru a produce energie. Necesită întreținere periodică."
huHU = "Üzemanyagot és vizet fogyaszt energia termeléséhez. Időszakos karbantartást igényel."
arSA = "يستهلك الوقود والماء لإنتاج الطاقة. يتطلب صيانة دورية."

["Building.SEE.SteamBoiler.Flavor.T1"]
status = "normal"
raw = "A humble boiler that asks for a little wood and a little water."
enUS = "A humble boiler that asks for a little wood and a little water."
zhCN = "一台谦逊的锅炉，只需要一点木材和一点水。"
zhTW = "一台謙遜的鍋爐，只需要一點木材和一點水。"
ruRU = "Скромный котёл, который просит немного дров и немного воды."
jaJP = "控えめなボイラーで、少しの木材と少量の水を要求する。"
frFR = "Une chaudière modeste qui demande un peu de bois et un peu d'eau."
deDE = "Ein bescheidener Kessel, der nach etwas Holz und ein wenig Wasser verlangt."
plPL = "Skromny kocioł, który prosi o trochę drewna i odrobinę wody."
ptBR = "Uma caldeira humilde que pede um pouquinho de lenha e um pouquinho de água."
koKR = "소박한 보일러로, 나무 약간과 물 약간만 달라고 합니다."
trTR = "Mütevazı bir kazan; biraz odun ve biraz su istiyor."
esES = "Una caldera humilde que pide un poco de leña y un poco de agua."
itIT = "Una caldaia umile che chiede un po' di legna e un po' d'acqua."
ukUA = "Скромний котел, який просить трохи дров і трохи води."
thTH = "หม้อไอน้ำเรียบง่ายที่ขอไม้เพียงเล็กน้อยและน้ำเพียงเล็กน้อย"
csCZ = "Skromný kotel, který chce trochu dřeva a trochu vody."
viVN = "Một cái nồi hơi khiêm tốn, chỉ đòi một chút gỗ và một chút nước."
caES = "Una caldera humil que demana una mica de fusta i una mica d'aigua."
beBY = "Сціплая катлавіна, якая просіць трошкі дроў і трошкі вады."
roRO = "O cazan modest care cere puțin lemn și puțină apă."
huHU = "Egy szerény kazán, amely egy kevés fát és egy kis vizet kér."
arSA = "ديغٍ متواضع يطلب قليلاً من الخشب وقليلاً من الماء."

["Building.SEE.SteamBoiler.Flavor.T2"]
status = "normal"
raw = "Pressure, timber and brass—now with a gauge."
