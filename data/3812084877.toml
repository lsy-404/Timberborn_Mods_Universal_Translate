itIT = "ATTIVO: trascinando un'area di semina si segnano solo i terreni umidi e verdi (le piante grasse: solo i terreni asciutti). Clicca per disattivare."
ukUA = "ВКЛ: перетягування ділянки для посадки позначає лише вологий зелений ґрунт (для сукулентів: лише сухий ґрунт). Натисніть, щоб вимкнути."
thTH = "เปิดอยู่: เมื่อลากพื้นที่ปลูก จะทำเครื่องหมายเฉพาะพื้นที่ที่ชื้นและเป็นสีเขียว (พืชอวบน้ำ: เฉพาะพื้นที่แห้งเท่านั้น) คลิกเพื่อปิด"
csCZ = "ZAPNUTO: Tažením vyznačíte oblast pro výsadbu pouze na vlhké, zelené půdě (sukulenty: pouze na suché půdě). Kliknutím funkci vypnete."
viVN = "BẬT: Kéo vùng trồng chỉ đánh dấu đất ẩm, màu xanh (cây mọng nước: chỉ đất khô). Nhấp để tắt."
caES = "ACTIVAT: en arrossegar una zona de plantació només es marca el terreny humit i verd (les suculentes: només terreny sec). Feu clic per desactivar-ho."
beBY = "ВКЛ: перацягванне ўчастка пасадкі пазначае толькі вільготны, зялёны грунт (сукулентам — толькі сухі грунт). Націсніце, каб выключыць."
roRO = "ACTIVAT: trăgând o zonă de plantare se marchează doar terenul umed și verde (plante suculente: doar terenul uscat). Apasă pentru a dezactiva."
huHU = "BE: húzással egy ültetési terület kijelölésekor csak nedves, zöld talaj jelölődik ki (pozsgások: csak száraz talaj). Kikapcsoláshoz kattintson."
arSA = "تشغيل: عند سحب منطقة زراعة، يتم تحديد الأرض الرطبة الخضراء فقط (والعصاريات: الأرض الجافة فقط). انقر للإيقاف."

