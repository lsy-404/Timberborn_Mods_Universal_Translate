plPL = "WŁ.: przeciąganie zaznacza obszar sadzenia tylko na wilgotnym, zielonym terenie (sukulenty: tylko na suchym terenie). Kliknij, aby wyłączyć."
ptBR = "ATIVADO: arrastar para selecionar uma área de plantio só marca terrenos verdes e úmidos (suculentas: só terrenos secos). Clique para desativar."
koKR = "켜짐: 심기 구역을 드래그하면 습하고 푸른 땅만 표시됩니다(다육식물은 마른 땅만 표시). 클릭하면 꺼집니다."
trTR = "AÇIK: Dikim alanını sürükleyerek yalnızca nemli, yeşil zemini işaretler (sukulentler: yalnızca kuru zemini). Kapatmak için tıklayın."
