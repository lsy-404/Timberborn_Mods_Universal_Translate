["DistributionGroups.SelectAllTooltip"]
raw = "Tick or untick every good in this district. With two or more goods ticked, editing one ticked good's export threshold or import option applies the same change to all of them."
status = "normal"
enUS = "Tick or untick every good in this district. With two or more goods ticked, editing one ticked good's export threshold or import option applies the same change to all of them."
zhCN = "“选中或取消选中该地区的所有物品。如果选中两个或更多物品，则对一个已选物品的出口阈值或进口选项进行编辑，会将相同的更改应用于所有物品。”"
zhTW = "勾選或取消勾選此區域的所有商品。勾選兩個或以上商品後，編輯其中一個勾選商品的出口門檻或進口選項將會對所有商品應用相同的更改。"
ruRU = "Установите или снимите отметку со всех товаров в этом районе. При установленных двух и более товарах изменение порога экспорта или параметра импорта одного отмеченного товара применяет то же самое изменение ко всем."
jaJP = "この地区のすべての物品にチェックを入れたり、チェックを外したりします。2つ以上の物品にチェックが入っている場合、チェックが入っている物品の輸出閾値または輸入オプションを編集すると、それらすべてに同じ変更が適用されます。"
frFR = "Cochez ou décochez chaque produit dans ce district. Avec deux ou plusieurs produits cochés, modifier le seuil d'exportation ou l'option d'importation d'un produit coché applique le même changement à tous."
deDE = "Markup oder entfernen Sie jedes Gut in diesem Bezirk. Wenn zwei oder mehr Güter ausgewählt sind, wird eine Änderung der Exporteinstellungen oder der Importoption eines markierten Gutes auf alle von ihnen angewendet."
plPL = "Zaznacz lub odznacz każdy towar w tym okręgu. Gdy zaznaczone są dwa lub więcej towarów, edytowanie progu eksportu lub opcji importu jednego zaznaczonego towaru wprowadza tę samą zmianę dla wszystkich."
ptBR = "Marque ou desmarque todos os bens neste distrito. Com dois ou mais bens marcados, editar o limite de exportação ou a opção de importação de um bem marcado aplica a mesma alteração a todos eles."
koKR = "이 구역의 모든 자원을 선택하거나 선택 해제합니다. 두 가지 이상의 자원을 선택한 경우, 선택된 자원의 수출 한계 또는 수입 옵션을 편집하면 모든 자원에 동일한 변경 사항이 적용됩니다."
trTR = "Bu bölgede bulunan her malı işaretleyin veya işaretini kaldırın. İki veya daha fazla mal işaretliyken, işaretli bir malın ihracat eşiğini veya ithalat seçeneğini düzenlemek, hepsine aynı değişikliği uygular."
esES = "Marque o desmarque cada bien de este distrito. Con dos o más bienes marcados, al editar el umbral de exportación o la opción de importación de uno de los bienes marcados, el mismo cambio se aplica a todos ellos."
itIT = "Seleziona o deseleziona ogni merce in questo distretto. Con due o più merci selezionate, modificare la soglia di esportazione o l'opzione di importazione di una merce selezionata applica la stessa modifica a tutte."
ukUA = "Позначте або знімiть позначку з кожного товару в цьому районі. Якщо позначено два або більше товарів, зміна порогу експорту чи параметра імпорту для одного з позначених товарів застосовується до всіх них."
thTH = "ทำเครื่องหมายหรือยกเลิกเครื่องหมายสินค้าทุกชนิดในเขตนี้ เมื่อมีสินค้าที่ถูกทำเครื่องหมายตั้งแต่สองชนิดขึ้นไป การแก้ไขเกณฑ์การส่งออกหรือตัวเลือกการนำเข้าของสินค้าที่ถูกทำเครื่องหมายชนิดใดชนิดหนึ่ง จะใช้การเปลี่ยนแปลงเดียวกันกับสินค้าที่ถูกทำเครื่องหมายทั้งหมด"
csCZ = "Zaškrtněte nebo zrušte zaškrtnutí každého zboží v tomto obvodu. Při zaškrtnutí dvou nebo více zboží platí úprava exportního prahu nebo importní možnosti pro jedno zaškrtnuté zboží na všechna."
viVN = "Đánh dấu hoặc bỏ đánh dấu mọi hàng hóa trong khu vực này. Với hai hoặc nhiều hàng hóa đã được đánh dấu, việc chỉnh sửa ngưỡng xuất khẩu hoặc tùy chọn nhập khẩu của một hàng hóa đã đánh dấu sẽ áp dụng thay đổi tương tự cho tất cả chúng."
caES = "Marqueu o desmarqueu tots els béns d'aquest districte. Amb dos o més béns marcats, editar el llindar d'exportació o l'opció d'importació d'un dels béns marcats aplica el mateix canvi a tots ells."
beBY = "Адзначце або знімце адзнаку з усіх тавараў у гэтым раёне. Калі пазначаны два або больш тавараў, змена порога экспарту або параметра імпарту для аднаго з іх прымяняе тую ж змену да ўсіх астатніх."
roRO = "Bifați sau debifați fiecare bun din acest district. Cu două sau mai multe bunuri bifate, modificarea pragului de export sau a opțiunii de import pentru unul dintre bunurile bifate se aplică tuturor acestora."
huHU = "Jelölj be vagy jelölj ki minden árucikket ebben a körzetben. Ha két vagy több árucikk be van jelölve, a bejelölt árucikkek egyikének exportküszöbét vagy importbeállítását módosítva ugyanaz a változtatás mindegyikre vonatkozik."
arSA = "حدد أو ألغِ تحديد كل سلعة في هذه المنطقة. عند تحديد سلعتين أو أكثر، فإن تعديل حد التصدير أو خيار الاستيراد لإحدى السلع المحددة يطبّق التغيير نفسه على جميعها."
