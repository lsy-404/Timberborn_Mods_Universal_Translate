["Building.JamStove.FlavorDescription"]
raw = "The pot had to be closed up after too many sweet-toothed beavers have been tempted by the delicious jam."
status = "normal"
enUS = "The pot had to be sealed after too many sweet-toothed beavers were tempted by the delicious jam."
zhCN = "太多嗜甜的海狸都被美味的果酱诱惑了，锅只好盖起来。"
zhTW = "太多愛吃甜食的海狸被美味的果醬誘惑後，這個鍋子只好封起來。"
ruRU = "Горшок пришлось закрыть после того, как слишком много сладкоежек-бобров соблазнились вкуснейшим вареньем."
jaJP = "甘いもの好きのビーバーたちが、おいしいジャムの誘惑にあまりにも多く負けてしまったため、鍋は閉じられることになった。"
frFR = "La marmite a dû être fermée après que trop de castors gourmands ont été tentés par la délicieuse confiture."
deDE = "Der Topf musste verschlossen werden, nachdem zu viele Naschkatzen unter den Bibern der köstlichen Marmelade nicht widerstehen konnten."
plPL = "Garnek trzeba było zamknąć, gdyż zbyt wiele łasuchów wśród bobrów skusiło się na pyszny dżem."
ptBR = "O pote precisou ser fechado depois que muitos castores gulosos foram tentados pela deliciosa geleia."
koKR = "달콤한 것을 좋아하는 비버들이 맛있는 잼의 유혹에 너무 많이 넘어가서, 냄비를 닫아 두어야 했다."
trTR = "Çok fazla tatlı düşkünü kunduzun nefis reçele kanmasının ardından tencerenin kapağını kapatmak gerekti."
esES = "El bote tuvo que cerrarse después de que demasiados castores golosos cayeran en la tentación de la deliciosa mermelada."
itIT = "La pentola doveva essere chiusa dopo che troppi castori golosi erano stati tentati dalla deliziosa marmellata."
ukUA = "Горщик довелося закрити, бо занадто багато ласих бобрів спокусилися смачним варенням."
thTH = "ต้องปิดหม้อนี้ไว้หลังจากมีบีเวอร์ที่ชอบของหวานถูกแยมอันแสนอร่อยล่อใจไปมากเกินไป"
csCZ = "Hrnec musel být uzavřen poté, co lahodný džem zlákal příliš mnoho bobrů na sladké."
viVN = "Chiếc nồi đã phải được đậy kín sau khi quá nhiều hải ly hảo ngọt bị món mứt thơm ngon cám dỗ."
caES = "El pot s'havia d'haver tancat després que massa castors amb debilitat pel dolç es deixessin temptar per la deliciosa melmelada."
