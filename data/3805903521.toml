frFR = "La marmite a dû être fermée après que trop de castors gourmands ont été tentés par la délicieuse confiture."
deDE = "Der Topf musste verschlossen werden, nachdem zu viele Naschkatzen unter den Bibern der köstlichen Marmelade nicht widerstehen konnten."
plPL = "Garnek trzeba było zamknąć, gdyż zbyt wiele łasuchów wśród bobrów skusiło się na pyszny dżem."
ptBR = "O pote precisou ser fechado depois que muitos castores gulosos foram tentados pela deliciosa geleia."
koKR = "달콤한 것을 좋아하는 비버들이 맛있는 잼의 유혹에 너무 많이 넘어가서, 냄비를 닫아 두어야 했다."
csCZ = "Hrnec musel být uzavřen poté, co lahodný džem zlákal příliš mnoho bobrů na sladké."
viVN = "Chiếc nồi đã phải được đậy kín sau khi quá nhiều hải ly hảo ngọt bị món mứt thơm ngon cám dỗ."
trTR = "Çok fazla tatlı düşkünü kunduzun nefis reçele kanmasının ardından tencerenin kapağını kapatmak gerekti."

