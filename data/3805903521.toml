["Building.JamStove.FlavorDescription"]
raw = "The pot had to be closed up after too many sweet-toothed beavers have been tempted by the delicious jam."
status = "normal"
enUS = "The pot had to be sealed after too many sweet-toothed beavers were tempted by the delicious jam."
zhCN = "太多嗜甜的海狸都被美味的果酱诱惑了，锅只好盖起来。"
zhTW = "太多愛吃甜食的海狸被美味的果醬誘惑後，這個鍋子只好封起來。"
ruRU = "Горшок пришлось закрыть после того, как слишком много сладкоежек-бобров соблазнились вкуснейшим вареньем."
