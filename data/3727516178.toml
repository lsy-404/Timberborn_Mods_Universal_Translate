["Building.LargeBadwaterPump.Description"]
raw = "Pumps and filters large amounts of badwater for beavers to drink. Low badwater contamination slows down its pumping speed."
status = "normal"
enUS = "Pumps and filters large amounts of bad water for beavers to drink. Low bad water contamination slows down its pumping speed."
zhCN = "泵和过滤大量的废水供海狸饮用。低废水污染会降低其抽水速度。"
zhTW = "抽取和過濾大量的污水供海狸飲用。低污水污染會減慢其抽水速度。"
ruRU = "Выкачивает и фильтрует большие объемы загрязненной воды для бобров. Низкое загрязнение плохой воды замедляет скорость ее откачки."
jaJP = "「ビーバーが飲むために大量の汚水を汲み上げてろ過します。汚水の汚染が低いほど、汲み上げ速度が遅くなります。」"
frFR = "Pompe et filtre de grandes quantités d'eau polluée pour que les castors puissent boire. Une faible contamination de l'eau polluée ralentit sa vitesse de pompage."
deDE = "Pumpt und filtert große Mengen an schmutzigem Wasser, damit die Biber trinken können. Eine niedrige Kontamination des schmutzigen Wassers verlangsamt die Pumpgeschwindigkeit."
plPL = "Pompuje i filtruje duże ilości zanieczyszczonej wody dla bobrów do picia. Niska kontaminacja zanieczyszczonej wody spowalnia prędkość pompowania."
ptBR = "Bombeia e filtra grandes quantidades de água poluída para os castores beberem. A baixa contaminação da água poluída diminui a velocidade de bombeamento."
koKR = "비버가 마실 수 있도록 많은 양의 불량수를 펌프 및 필터링합니다. 낮은 불량수 오염은 펌프 속도를 느리게 합니다."
trTR = "Kayaların içme suyu için büyük miktarda kirli suyu pompalayan ve filtreleyen bir pompa. Düşük kirli su kontaminasyonu pompa hızını yavaşlatır."
esES = "Bombea y filtra grandes cantidades de agua envenenada para que los castores la beban. La baja contaminación del agua envenenada reduce su velocidad de bombeo."
itIT = "Pompa e filtra grandi quantità di acqua cattiva affinché i castori possano berla. Una bassa contaminazione dell'acqua cattiva rallenta la sua velocità di pompaggio."
ukUA = "Перекачує та фільтрує великі обсяги поганої води, яку можуть пити бобри. Низьке забруднення поганою водою уповільнює швидкість її перекачування."
thTH = "ปั๊มนี้สูบและกรองน้ำเสียปริมาณมากให้บีเวอร์ดื่ม การปนเปื้อนน้ำเสียในระดับต่ำจะทำให้ความเร็วในการสูบของปั๊มลดลง"
csCZ = "Čerpá a filtruje velké množství znečištěné vody pro bobry k pití. Nízké znečištění vody zpomaluje rychlost čerpání."
viVN = "Bơm và lọc lượng lớn nước ô nhiễm cho beaver uống. Mức ô nhiễm nước thấp làm chậm tốc độ bơm của nó."
caES = "Bombeja i filtra grans quantitats d'aigua dolenta perquè els castors la beguin. Una contaminació baixa de l'aigua dolenta alenteix la seva velocitat de bombament."
beBY = "Помпа перапампоўвае і фільтруе вялікія аб'ёмы брудной вады для баброў, каб тыя маглі піць. Нізкае забруджванне брудной вадой запавольвае хуткасць перакачвання."
roRO = "Pompează și filtrează cantități mari de apă otrăvită pentru ca castorii să bea. Contaminarea scăzută cu apă otrăvită încetinește viteza de pompare."
huHU = "Nagy mennyiségű mérgezett vizet szűr és pumpál, hogy a hódok inni tudjanak belőle. Az alacsony mérgezett víz-szennyezettség lassítja a pumpálás sebességét."
arSA = "يضخ ويرشح كميات كبيرة من المياه الفاسدة لكي يشربها القنادس. تؤدي انخفاض نسبة التلوث في المياه الفاسدة إلى إبطاء سرعة ضخها."

