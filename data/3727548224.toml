["ModSetting.SleepDecayMultiplier.Tooltip"]
raw = "How quickly beavers drain their energy under the influence of rice powder. Lower values mean beavers will get tired slower."
status = "normal"
enUS = "How quickly beavers drain their energy under the influence of rice powder. Lower values mean beavers will get tired slower."
zhCN = "“在米粉影响下，海狸消耗能量的速度。较低的数值意味着海狸会更慢感到疲累。”"
zhTW = "浸泡米粉時，河狸消耗能量的速度。數值越低表示河狸會更慢地感到疲倦。"
ruRU = "Насколько быстро бобры теряют свою энергию под воздействием рисовой муки. Более низкие значения означают, что бобры устанут медленнее."
jaJP = "「米粉の影響でビーバーがエネルギーをどれだけ速く消耗するか。値が低いほど、ビーバーは疲れにくくなります。」"
frFR = "À quelle vitesse les castors épuisent leur énergie sous l'influence de la poudre de riz. Des valeurs plus faibles signifient que les castors se fatigueront plus lentement."
deDE = "Wie schnell Biber ihre Energie unter dem Einfluss von Reispulver abbauen. Niedrigere Werte bedeuten, dass Biber langsamer müde werden."
plPL = "Jak szybko bobry tracą energię pod wpływem ryżowego proszku. Niższe wartości oznaczają, że bobry będą męczyć się wolniej."
ptBR = "Quão rapidamente os castores esgotam sua energia sob a influência do pó de arroz. Valores mais baixos significam que os castores ficarão cansados mais devagar."
koKR = "쌀가루의 영향을 받으며 비버가 에너지를 소진하는 속도. 값이 낮을수록 비버가 피로해지는 속도가 느려집니다."
trTR = "Riz pudrasının etkisi altında kunduzların enerjilerini ne kadar hızlı tükettiği. Daha düşük değerler, kunduzların daha yavaş yorulacağı anlamına gelir."
esES = "Qué tan rápido los castores agotan su energía bajo los efectos del polvo de arroz. Valores más bajos significan que los castores se cansarán más lentamente."
itIT = "Quanto rapidamente i castori consumano la loro energia sotto l'effetto della polvere di riso. Valori più bassi significano che i castori si stancheranno più lentamente."
ukUA = "Наскільки швидко бобри витрачають енергію під впливом рисового порошку. Менші значення означають, що бобри втомлюватимуться повільніше."
thTH = "ความเร็วที่บีเวอร์สูญเสียพลังงานภายใต้อิทธิพลของผงข้าว ค่าที่ต่ำกว่าหมายความว่าบีเวอร์จะเหนื่อยช้าลง"
csCZ = "Jak rychle bobři vyčerpávají svou energii pod vlivem rýžového prášku. Nižší hodnoty znamenají, že bobři se unaví pomaleji."
viVN = "Cách nhanh chóng mà những con thú gỗ tiêu hao năng lượng của chúng dưới ảnh hưởng của bột gạo. Giá trị thấp hơn có nghĩa là thú gỗ sẽ không bị mệt mỏi nhanh."
caES = "Amb quina rapidesa els castors perden la seva energia sota la influència de la pols d'arròs. Valors més baixos signifiquen que els castors es cansaran més lentament."
beBY = "Тое, наколькі хутка бабры вычэрпваюць сваю энергію пад уплывам рысавага пылу. Меншыя значэнні азначаюць, што бабры будуць стамляцца павольней."
roRO = "Cât de repede castorii își consumă energia sub influența pudrei de orez. Valorile mai mici înseamnă că castorii se vor obosi mai încet."
huHU = "A rizspor hatása alatt milyen gyorsan merítik ki energiájukat a bóbiták. Alacsonyabb értékek esetén a bóbiták lassabban fáradnak el."
arSA = "بأي سرعة يستنزف البناة طاقتهم تحت تأثير مسحوق الأرز. القيم الأقل تعني أن البناة سيتعبون ببطء أكبر."

