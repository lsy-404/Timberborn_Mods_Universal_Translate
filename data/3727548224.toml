status = "normal"
enUS = "How much the addiction level decreases per day. Higher values mean beavers will recover faster from the effects of addiction and withdrawal."
zhCN = "“成瘾水平每日减少的量。更高的数值意味着海狸会更快从成瘾和戒断的影响中恢复。”"
zhTW = "每日成癮程度下降的數量。較高的數值意味著海狸將更快從成癮和戒斷的影響中恢復。"
ruRU = "На сколько уровень зависимости уменьшается за день. Более высокие значения означают, что бобры быстрее восстанавливаются от последствий зависимости и абстиненции."
jaJP = "「依存度が1日あたりどれだけ減少するか。数値が高いほど、ビーバーは依存症や禁断症状の影響からより早く回復します。」"
frFR = "Combien le niveau d'addiction diminue par jour. Des valeurs plus élevées signifient que les castors se rétabliront plus rapidement des effets de l'addiction et du sevrage."
deDE = "Wie stark das Suchtlevel pro Tag abnimmt. Höhere Werte bedeuten, dass die Biber schneller von den Auswirkungen der Sucht und Entzugserscheinungen erholen."
plPL = "Jak bardzo poziom uzależnienia spada na dzień. Wyższe wartości oznaczają, że bobry będą szybciej wracać do siebie po skutkach uzależnienia i objawach odstawienia."
ptBR = "Quanto o nível de dependência diminui por dia. Valores mais altos significam que os castores se recuperarão mais rapidamente dos efeitos da dependência e da abstinência."
koKR = "중독 수준이 하루에 얼마나 감소하는지. 더 높은 수치는 비버가 중독 및 금단의 영향에서 더 빨리 회복됨을 의미합니다."
trTR = "Bağımlılık seviyesinin günde ne kadar azaldığı. Daha yüksek değerler, kunduzların bağımlılık ve yoksunluk etkilerinden daha hızlı toparlanacağı anlamına gelir."
esES = "Cuánto disminuye el nivel de adicción por día. Los valores más altos significan que los castores se recuperarán más rápido de los efectos de la adicción y de la abstinencia."
itIT = "Quantità di riduzione giornaliera del livello di dipendenza. Valori più alti significano che i castori si riprenderanno più rapidamente dagli effetti della dipendenza e dell'astinenza."
ukUA = "Скільки рівень залежності зменшується щодня. Вищі значення означають, що бобри швидше відновлюються від наслідків залежності та абстиненції."
thTH = "ระดับการเสพติดลดลงในแต่ละวันเท่าไร ค่าที่สูงขึ้นหมายความว่าบีเวอร์จะฟื้นตัวจากผลของการเสพติดและอาการถอนได้เร็วขึ้น"
csCZ = "Kolik se úroveň závislosti snižuje za den. Vyšší hodnoty znamenají, že bobři se rychleji zotaví z účinků závislosti a abstinenčních příznaků."
viVN = "Mức độ nghiện giảm bao nhiêu mỗi ngày. Giá trị cao hơn có nghĩa là những con thủy lực sẽ hồi phục nhanh hơn từ tác động của nghiện và cắt cơn."
caES = "Quant baixa el nivell d'addicció cada dia. Els valors més alts fan que els castors es recuperin més ràpidament dels efectes de l'addicció i de l'abstinència."
beBY = "Колькі ўзровень залежнасці зніжаецца за дзень. Большыя значэнні азначаюць, што бабры будуць хутчэй адыходзіць ад наступстваў залежнасці і абстіненцыі."
roRO = "Cât de mult scade nivelul de dependență pe zi. Valorile mai mari înseamnă că castorii își vor reveni mai repede de pe urma efectelor dependenței și ale sevrajului."
huHU = "Mennyivel csökken naponta a függőségi szint. A magasabb értékek azt jelentik, hogy a bobrok gyorsabban felépülnek a függőség és a megvonási tünetek hatásaiból."
arSA = "كم يقل مستوى الإدمان كل يوم. القيم الأعلى تعني أن القنادس ستتعافى أسرع من آثار الإدمان والانسحاب."

