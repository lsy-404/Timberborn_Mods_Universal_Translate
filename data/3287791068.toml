["KyP.Use.IndividualPumpSettingsTooltip"]
raw = "Enabling this will give settings for all pumps on next reload. It can slowdown loading the game by few seconds."
enUS = "Enabling this will give settings for all pumps on next reload. It can slowdown loading the game by few seconds."
zhCN = "勾选后，将在下次加载时为所有水泵提供独立设置。<br>注意，与“全局水泵调整”冲突；勾选后需重启游戏，在此处对各类水泵设置最大深度后，再开始游玩。"
zhTW = "啟用此選項將在下次重新載入時為所有泵提供設置。這可能會使遊戲載入速度變慢幾秒鐘。"
ruRU = "Включение этой функции предоставит настройки для всех насосов при следующей загрузке. Это может замедлить загрузку игры на несколько секунд."
jaJP = "この設定を有効にすると、次回のリロード時にすべてのポンプの設定が適用されます。ゲームの読み込みが数秒遅くなる可能性があります。"
frFR = "Activer cela donnera des paramètres pour toutes les pompes lors du prochain chargement. Cela peut ralentir le chargement du jeu de quelques secondes."
deDE = "Wenn Sie dies aktivieren, erhalten Sie Einstellungen für alle Pumpen beim nächsten Laden. Es kann das Laden des Spiels um einige Sekunden verlangsamen."
plPL = "Włączenie tego spowoduje, że na następnym załadunku będą dostępne ustawienia dla wszystkich pomp. Może to spowolnić ładowanie gry o kilka sekund."
ptBR = "Ativar isso fornecerá configurações para todas as bombas na próxima recarga. Isso pode atrasar o carregamento do jogo por alguns segundos."
koKR = "이 옵션을 활성화하면 다음 로드 시 모든 펌프에 대한 설정을 제공합니다. 게임 로딩 속도가 몇 초 느려질 수 있습니다."
trTR = "Bunu etkinleştirmek, sonraki yüklemede tüm pompalar için ayarları sağlayacaktır. Oyun yükleme süresini birkaç saniye yavaşlatabilir."
esES = "Al activar esta opción se mostrarán ajustes para todas las bombas en la próxima recarga. Puede ralentizar la carga del juego durante unos segundos."
itIT = "Abilitando questa opzione verranno applicate impostazioni specifiche per tutte le pompe al successivo riavvio. Il caricamento del gioco potrebbe rallentare di alcuni secondi."
ukUA = "Увімкнення цього параметра додасть налаштування для всіх насосів після наступного перезавантаження. Це може уповільнити завантаження гри на кілька секунд."
thTH = "เมื่อเปิดใช้งานตัวเลือกนี้ การตั้งค่าสำหรับปั๊มทั้งหมดจะปรากฏหลังจากโหลดใหม่ครั้งถัดไป อาจทำให้การโหลดเกมช้าลงไม่กี่วินาที"
csCZ = "Povolení tohoto nastavení poskytne konfiguraci pro všechny pumpy při příštím načtení. Může to zpomalit načítání hry o několik sekund."
viVN = "Kích hoạt tùy chọn này sẽ áp dụng cài đặt cho tất cả các máy bơm ở lần tải lại tiếp theo. Nó có thể làm chậm quá trình tải trò chơi thêm vài giây."
caES = "Activar aquesta opció mostrarà la configuració de totes les bombes en reiniciar la partida. Pot alentir la càrrega del joc durant uns quants segons."
beBY = "Уключэнне гэтай опцыі адкрые налады для ўсіх помпаў пасля наступнай перазагрузкі. Гульня можа пачынаць загружацца на некалькі секунд даўжэй."
roRO = "Activarea acestei opțiuni va afișa setările pentru toate pompele la următoarea reîncărcare. Poate încetini încărcarea jocului cu câteva secunde."
huHU = "Ennek engedélyezése a következő újratöltéskor beállításokat ad az összes szivattyúhoz. Néhány másodperccel lassíthatja a játék betöltését."
arSA = "تفعيل هذا الخيار سيُظهر إعدادات لجميع المضخات عند إعادة التحميل التالية. وقد يؤدي ذلك إلى إبطاء تحميل اللعبة لبضع ثوانٍ."
