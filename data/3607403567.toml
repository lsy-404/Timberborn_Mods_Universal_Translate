["LV.CPl.ReproducibleChanceMultiplierDesc"]
raw = "Adjusts the chance for trees to reproduce each hour (default: 1–3% depending on type).\nDefault: ×1. ×0 disables reproduction. Example: ×2 makes a Pine with a base 3% chance reproduce at 6% chance."
status = "normal"
enUS = "Adjusts the chance for trees to reproduce each hour (default: 1–3% depending on type).\nDefault: ×1. ×0 disables reproduction. Example: ×2 makes a Pine with a base 3% chance reproduce at 6% chance."
zhCN = "可以将树木的蔓延概率更改为原来的N倍（游戏默认：x1，即每小时有1-3%的概率蔓延至相邻方格，具体概率取决于树木种类）。"
zhTW = "調整每小時樹木繁殖的機率（預設：根據樹種在1%至3%之間）。  \n預設：×1。×0禁用繁殖。範例：×2使得基礎繁殖機率為3%的松樹繁殖機率提升至6%。"
ruRU = "Регулирует шансы на воспроизведение деревьев каждый час (по умолчанию: 1–3% в зависимости от типа). По умолчанию: ×1. Значение ×0 отключает воспроизведение. Пример: ×2 делает так, что сосна с базовым шансом 3% воспроизводит с шансом 6%."
jaJP = "キー名: LV.CPl.ReproducibleChanceMultiplierDesc - 翻訳する新しいテキスト: 「毎時間の木の繁殖確率を調整します (デフォルト: タイプに応じて1～3%)。デフォルト: ×1。×0は繁殖を無効にします。例: ×2は基礎3%の確率を持つ松を6%の確率で繁殖させます。」"
frFR = "Adjuste la chance pour les arbres de se reproduire chaque heure (par défaut : 1 à 3 % selon le type).\nPar défaut : ×1. ×0 désactive la reproduction. Exemple : ×2 permet à un pin avec une chance de base de 3 % de se reproduire avec une chance de 6 %."
deDE = "Passt die Chance an, dass Bäume jede Stunde reproduzieren (Standard: 1–3% je nach Typ). Standard: ×1. ×0 deaktiviert die Reproduktion. Beispiel: ×2 lässt eine Fichte mit einer Basischance von 3% mit 6% Chance reproduzieren."
plPL = "Dostosowuje szansę na rozmnażanie drzew co godzinę (domyślnie: 1–3% w zależności od rodzaju). Domyślnie: ×1. ×0 wyłącza rozmnażanie. Przykład: ×2 sprawia, że Sosna z podstawową szansą 3% rozmnaża się przy 6% szansie."
ptBR = "Ajusta a chance de as árvores reproduzirem a cada hora (padrão: 1–3% dependendo do tipo).  \nPadrão: ×1. ×0 desativa a reprodução. Exemplo: ×2 faz com que um Pinheiro com uma chance base de 3% reproduza com 6% de chance."
koKR = "각 시간마다 나무의 번식 확률을 조정합니다(기본값: 유형에 따라 1–3%).\n기본값: ×1. ×0은 번식을 비활성화합니다. 예: ×2는 기본 3% 확률을 가진 솔방울나무가 6% 확률로 번식하게 합니다."
trTR = "Her saat ağaçların üreme şansını ayarlar (varsayılan: türe bağlı olarak %1–%3). \nVarsayılan: ×1. ×0 üremeyi devre dışı bırakır. Örnek: ×2, temel %3 üreme şansına sahip bir Çam'ın üreme şansını %6 yapar."
esES = "Ajusta la probabilidad de que los árboles se reproduzcan cada hora (predeterminado: 1–3 % según el tipo).\nPredeterminado: ×1. ×0 desactiva la reproducción. Ejemplo: ×2 hace que un Pino con una probabilidad base del 3 % se reproduzca con una probabilidad del 6 %."
itIT = "Modifica la probabilità che gli alberi si riproducano ogni ora (predefinita: 1–3% a seconda del tipo).\nPredefinito: ×1. ×0 disattiva la riproduzione. Esempio: ×2 fa sì che un Pino con una probabilità base del 3% si riproduca con una probabilità del 6%."
ukUA = "Коригує ймовірність того, що дерева розмножуватимуться щогодини (за замовчуванням: 1–3% залежно від типу).\nЗа замовчуванням: ×1. ×0 вимикає розмноження. Приклад: ×2 робить так, що Сосна з базовою ймовірністю 3% розмножуватиметься з ймовірністю 6%."
thTH = "ปรับโอกาสที่ต้นไม้จะขยายพันธุ์ในแต่ละชั่วโมง (ค่าเริ่มต้น: 1–3% ขึ้นอยู่กับชนิด)\nค่าเริ่มต้น: ×1 ค่า ×0 จะปิดการขยายพันธุ์ ตัวอย่าง: ×2 ทำให้ Pine ที่มีโอกาสพื้นฐาน 3% ขยายพันธุ์ด้วยโอกาส 6%"
csCZ = "Upravuje šanci, že stromy se rozmnoží každou hodinu (výchozí: 1–3 % v závislosti na typu).\nVýchozí: ×1. ×0 zakáže reprodukci. Příklad: ×2 způsobí, že borovice s základní 3% šancí se rozmnoží se 6% šancí."
viVN = "Điều chỉnh xác suất cây sinh sản mỗi giờ (mặc định: 1–3% tùy loại).\nMặc định: ×1. ×0 vô hiệu hóa sinh sản. Ví dụ: ×2 làm cho một cây thông có cơ hội sinh sản cơ bản là 3% lên thành 6%."
caES = "Ajusta la probabilitat que els arbres es reprodueixin cada hora (per defecte: 1–3% segons el tipus).\nPer defecte: ×1. ×0 desactiva la reproducció. Exemple: ×2 fa que un Pi amb una probabilitat base del 3% es reprodueixi amb una probabilitat del 6%."
beBY = "Змяняе шанец на размнажэнне дрэў кожную гадзіну (стандартна: 1–3% у залежнасці ад тыпу).\nСтандартна: ×1. ×0 адключае размнажэнне. Прыклад: ×2 дазваляе сасне з базавым шанцам 3% размнажацца з шанцам 6%."
roRO = "Ajustează șansa ca arborii să se reproducă în fiecare oră (implicit: 1–3%, în funcție de tip).\nImplicit: ×1. ×0 dezactivează reproducerea. Exemplu: ×2 face ca un Pin cu o șansă de bază de 3% să se reproducă cu o șansă de 6%."
huHU = "Módosítja annak esélyét, hogy a fák óránként szaporodjanak (alapértelmezés: 1–3%, a fajtától függően).\nAlapértelmezett érték: ×1. A ×0 kikapcsolja a szaporodást. Példa: a ×2 szorzó hatására az alapesélyű 3%-os Lucfenyő 6%-os eséllyel szaporodik."
arSA = "يعدّل احتمالية تكاثر الأشجار كل ساعة (الافتراضي: 1–3% حسب النوع).\nالافتراضي: ×1. القيمة ×0 تعطّل التكاثر. مثال: القيمة ×2 تجعل شجرة الصنوبر ذات الاحتمالية الأساسية 3% تتكاثر باحتمالية 6%."
