["LV.CPl.NoConUpDesc"]
raw = "Prevents land contamination from being brought up. Enables planting trees or crops on platforms even if the land below is unsuitable."
status = "normal"
enUS = "Prevents land contamination from being brought up. Enables planting trees or crops on platforms even if the land below is unsuitable."
zhCN = "勾选后，在建筑上种植的植物默认被灌溉，不再受正下方土地影响。"
zhTW = "防止土地污染被帶上來。即使下方土地不合適，也能在平台上種植樹木或作物。"
ruRU = "Предотвращает загрязнение земли. Позволяет сажать деревья или культуры на платформах, даже если земля внизу неподходящая."
jaJP = "土地汚染の持ち上げを防ぎます。下の土地が不適切であっても、プラットフォーム上に木や作物を植えることができます。"
frFR = "Empêche la contamination des terres d'être soulevée. Permet de planter des arbres ou des cultures sur des plateformes même si le sol en dessous est inapproprié."
deDE = "Verhindert, dass Bodenverunreinigungen angehoben werden. Ermöglicht das Pflanzen von Bäumen oder Feldfrüchten auf Plattformen, auch wenn der Boden darunter ungeeignet ist."
plPL = "Zapobiega przenoszeniu zanieczyszczeń na powierzchnię. Umożliwia sadzenie drzew lub upraw na platformach, nawet jeśli grunt poniżej jest nieodpowiedni."
ptBR = "Previne que a contaminação do solo seja levantada. Permite o plantio de árvores ou culturas em plataformas, mesmo que o solo abaixo seja inadequado."
koKR = "토양 오염이 발생하는 것을 방지합니다. 아래의 토지가 부적합하더라도 플랫폼에서 나무나 농작물을 심을 수 있게 합니다."
trTR = "Toprak kirliliğinin ortaya çıkmasını engeller. Aşağıdaki arazi uygun olmasa bile platformlara ağaç veya mahsul dikmeyi sağlar."
esES = "Evita que se arrastre la contaminación del suelo hacia arriba. Permite plantar árboles o cultivos sobre plataformas aunque el terreno de abajo no sea apto."
itIT = "Impedisce che la contaminazione del terreno venga portata in superficie. Consente di piantare alberi o colture sulle piattaforme anche se il terreno sottostante non è adatto."
ukUA = "Запобігає підняттю забруднення ґрунту. Дозволяє садити дерева або культури на платформах, навіть якщо ґрунт під ними не придатний."
thTH = "ป้องกันไม่ให้การปนเปื้อนของดินถูกดึงขึ้นมา และทำให้สามารถปลูกต้นไม้หรือพืชบนแพลตฟอร์มได้ แม้ว่าดินด้านล่างจะไม่เหมาะสมก็ตาม"
csCZ = "Zabraňuje kontaminaci půdy. Umožňuje sázení stromů nebo plodin na platformách, i když je půda pod nimi nevhodná."
viVN = "Ngăn chặn ô nhiễm đất bị đưa lên bề mặt. Cho phép trồng cây trên các nền tảng ngay cả khi đất ở bên dưới không phù hợp."
caES = "Evita que la contaminació del terreny sigui aflorada. Permet plantar arbres o cultius sobre les plataformes encara que el terreny de sota no sigui adequat."
beBY = "Прадухіляе ўздым забруджвання зямлі. Дазваляе садзіць дрэвы або культуры на платформах, нават калі зямля пад імі не падыходзіць."
roRO = "Previne aducerea contaminării terenului la suprafață. Permite plantarea de copaci sau culturi pe platforme, chiar dacă terenul de dedesubt nu este potrivit."
huHU = "Megakadályozza, hogy a szennyezett talaj felszínre kerüljön. Lehetővé teszi fák vagy növények ültetését platformokon akkor is, ha az alatta lévő talaj nem alkalmas erre."
arSA = "يمنع نقل التلوث الأرضي إلى الأعلى. يتيح زراعة الأشجار أو المحاصيل على المنصات حتى لو كانت الأرض أسفلها غير صالحة."

["LV.CPl.GrowthSect"]
raw = "<b>Growth options:</b> Set below default ×1 to decrease difficulty except for Output Multiplier. Examples:\n- Planting Time Multiplier ×0.5: Planting Oak 1 hours → 0.5 hours.\n- Growth Time ×0.5: Potato grows in 5 days → 2.5 days.\n- Output Multiplier ×1.5: Carrot yields 3 → 4.\n- Harvest Time Multiplier ×0.5: Oak cutting 2 hours → 1 hour.\n- Demolishing Time Multiplier ×0.5: demolishing Pine 1.2 hours → 0.6 hours."
status = "normal"
enUS = "<b>Growth options:</b> Set below default ×1 to decrease difficulty except for Output Multiplier. Examples:\n- Planting Time Multiplier ×0.5: Planting Oak 1 hour → 0.5 hours.\n- Growth Time ×0.5: Potato grows in 5 days → 2.5 days.\n- Output Multiplier ×1.5: Carrot yields 3 → 4.\n- Harvest Time Multiplier ×0.5: Oak cutting 2 hours → 1 hour.\n- Demolishing Time Multiplier ×0.5: demolishing Pine 1.2 hours → 0.6 hours."
zhCN = "<b>生长选项：</b>将其他参数设为低于默认值×1可以降低难度，产出数量倍数除外。示例：<br>- 种植时间倍数×0.5：种植橡树耗时 1小时→0.5小时<br>- 生长时间×0.5：土豆成熟耗时 5天→2.5天<br>- 产出数量倍数×1.5：每棵胡萝卜有 3个→4个<br>- 收获时间倍数×0.5：砍伐橡树耗时 2小时→1小时<br>- 拆除时间倍数×0.5：拆除松树耗时 1.2小时→0.6小时"
zhTW = "<b>成長選項：</b> 將以下設置低於預設值 ×1 以降低難度，但產出倍數除外。例子：\n- 種植時間倍數 ×0.5：種植橡樹 1 小時 → 0.5 小時。\n- 成長時間 ×0.5：馬鈴薯在 5 天內生長 → 2.5 天。\n- 產出倍數 ×1.5：胡蘿蔔產量從 3 → 4。\n- 收穫時間倍數 ×0.5：砍伐橡樹 2 小時 → 1 小時。\n- 拆除時間倍數 ×0.5：拆除松樹 1.2 小時 → 0.6 小時。"
ruRU = "<b>Опции роста:</b> Установите ниже значения по умолчанию ×1, чтобы снизить сложность, кроме Множителя выходной продукции. Примеры:\n- Множитель времени посадки ×0.5: Посадка дуба 1 час → 0.5 часа.\n- Множитель времени роста ×0.5: Картофель вмещается за 5 дней → 2.5 дня.\n- Множитель выходной продукции ×1.5: Урожай моркови 3 → 4.\n- Множитель времени сбора урожая ×0.5: Уборка дуба 2 часа → 1 час.\n- Множитель времени сноса ×0.5: снос сосны 1.2 часа → 0.6 часа."
jaJP = "<b>成長オプション:</b> デフォルトの×1未満に設定すると、出力倍率を除いて難易度が下がります。例：\n- 植える時間倍率 ×0.5：オークを植えるのに1時間 → 0.5時間。\n- 成長時間 ×0.5：ジャガイモが成長するのに5日 → 2.5日。\n- 出力倍率 ×1.5：ニンジンの収穫量が3 → 4。\n- 収穫時間倍率 ×0.5：オークの伐採に2時間 → 1時間。\n- 解体時間倍率 ×0.5：マツを解体するのに1.2時間 → 0.6時間。"
frFR = "<b>Options de croissance :</b> Régler en dessous de la valeur par défaut ×1 pour diminuer la difficulté, sauf pour le multiplicateur de rendement. Exemples :\n- Multiplicateur de temps de plantation ×0.5 : Planter un chêne 1 heure → 0.5 heure.\n- Temps de croissance ×0.5 : La pomme de terre pousse en 5 jours → 2.5 jours.\n- Multiplicateur de rendement ×1.5 : La carotte produit 3 → 4.\n- Multiplicateur de temps de récolte ×0.5 : Abattage d'un chêne 2 heures → 1 heure.\n- Multiplicateur de temps de démolition ×0.5 : démolition d'un pin 1.2 heures → 0.6 heures."
deDE = "<b>Wachstumsoptionen:</b> Setzen Sie unter dem Standard ×1, um die Schwierigkeit zu verringern, außer für den Ertragsmultiplikator. Beispiele:\n- Pflanzzeitmultiplikator ×0,5: Eiche pflanzen 1 Stunde → 0,5 Stunden.\n- Wachstumszeit ×0,5: Kartoffel wächst in 5 Tagen → 2,5 Tage.\n- Ertragsmultiplikator ×1,5: Karotte bringt 3 → 4.\n- Erntezeitmultiplikator ×0,5: Eiche fällen 2 Stunden → 1 Stunde.\n- Abbruchzeitmultiplikator ×0,5: Abbruch von Fichte 1,2 Stunden → 0,6 Stunden."
plPL = "<b>Opcje wzrostu:</b> Ustaw poniżej domyślnego ×1, aby zmniejszyć trudność z wyjątkiem mnożnika wydajności. Przykłady:\n- Mnożnik czasu sadzenia ×0.5: Sadzenie dębu 1 godzina → 0.5 godziny.\n- Mnożnik czasu wzrostu ×0.5: Ziemniak rośnie w 5 dni → 2.5 dni.\n- Mnożnik wydajności ×1.5: Marchewka plonuje 3 → 4.\n- Mnożnik czasu zbiorów ×0.5: Ścinanie dębu 2 godziny → 1 godzina.\n- Mnożnik czasu burzenia ×0.5: Burzenie sosny 1.2 godziny → 0.6 godziny."
ptBR = "<b>Opções de crescimento:</b> Defina abaixo do padrão ×1 para diminuir a dificuldade, exceto para o Multiplicador de Saída. Exemplos:\n- Multiplicador de Tempo de Plantio ×0.5: Plantar Carvalho 1 hora → 0,5 hora.\n- Tempo de Crescimento ×0.5: Batata cresce em 5 dias → 2,5 dias.\n- Multiplicador de Saída ×1.5: Cenoura rende 3 → 4.\n- Multiplicador de Tempo de Colheita ×0.5: Corte de Carvalho 2 horas → 1 hora.\n- Multiplicador de Tempo de Demolição ×0.5: demolir Pinho 1,2 horas → 0,6 horas."
koKR = "<b>성장 옵션:</b> 기본값 ×1 아래로 설정하여 Output Multiplier를 제외한 난이도를 감소시킵니다. 예시:\n- 식재 시간 배수 ×0.5: 참나무 식재 1시간 → 0.5시간.\n- 성장 시간 ×0.5: 감자가 5일에 성장 → 2.5일.\n- 출력 배수 ×1.5: 당근 수확량 3 → 4.\n- 수확 시간 배수 ×0.5: 참나무 베기 2시간 → 1시간.\n- 철거 시간 배수 ×0.5: 소나무 철거 1.2시간 → 0.6시간."
trTR = "<b>Büyüme seçenekleri:</b> Aşağıda varsayılanı ×1'den daha düşük ayarlayarak zorluğu azaltın, Çıktı Katkısı hariç. Örnekler:\n- Dikim Zamanı Katkısı ×0.5: Meşe dikimi 1 saat → 0.5 saat.\n- Büyüme Süresi ×0.5: Patates 5 günde büyür → 2.5 günde.\n- Çıktı Katkısı ×1.5: Havuç verimi 3 → 4.\n- Hasat Zamanı Katkısı ×0.5: Meşe kesimi 2 saat → 1 saat.\n- Yıkım Süresi Katkısı ×0.5: Çam ağacının yıkımı 1.2 saat → 0.6 saat."
esES = "<b>Opciones de crecimiento:</b> Establezca por debajo del valor predeterminado ×1 para reducir la dificultad, excepto en el Multiplicador de rendimiento. Ejemplos:\n- Multiplicador de tiempo de siembra ×0.5: plantar roble tarda 1 hora → 0.5 horas.\n- Tiempo de crecimiento ×0.5: la patata crece en 5 días → 2.5 días.\n- Multiplicador de rendimiento ×1.5: la zanahoria produce 3 → 4.\n- Multiplicador de tiempo de cosecha ×0.5: cosechar esqueje de roble tarda 2 horas → 1 hora.\n- Multiplicador de tiempo de demolición ×0.5: demoler pino tarda 1.2 horas → 0.6 horas."
itIT = "<b>Opzioni di crescita:</b> Impostare sotto il valore predefinito ×1 per ridurre la difficoltà, eccetto per il Moltiplicatore di produzione. Esempi:\n- Moltiplicatore del tempo di semina ×0.5: la semina di una Quercia richiede 1 ora → 0.5 ore.\n- Tempo di crescita ×0.5: la Patata cresce in 5 giorni → 2.5 giorni.\n- Moltiplicatore di produzione ×1.5: la Carota produce 3 → 4.\n- Moltiplicatore del tempo di raccolta ×0.5: il taglio di una Quercia richiede 2 ore → 1 ora.\n- Moltiplicatore del tempo di demolizione ×0.5: la demolizione di un Pino richiede 1.2 ore → 0.6 ore."
ukUA = "<b>Параметри росту:</b> Значення нижче за стандартне ×1 знижують складність, крім множника виходу. Приклади:\n- Множник часу посадки ×0.5: посадка дуба 1 година → 0.5 години.\n- Час росту ×0.5: картопля росте 5 днів → 2.5 дні.\n- Множник виходу ×1.5: морква дає 3 → 4.\n- Множник часу збирання ×0.5: зрізання дуба 2 години → 1 година.\n- Множник часу зносу ×0.5: знесення сосни 1.2 години → 0.6 години."
thTH = "<b>ตัวเลือกการเติบโต:</b> ตั้งค่าต่ำกว่าค่าเริ่มต้น ×1 เพื่อลดความยาก ยกเว้น Output Multiplier ตัวอย่าง:\n- Planting Time Multiplier ×0.5: การปลูกต้นโอ๊ก 1 ชั่วโมง → 0.5 ชั่วโมง\n- Growth Time ×0.5: มันฝรั่งเติบโตใน 5 วัน → 2.5 วัน\n- Output Multiplier ×1.5: แครอทให้ผลผลิต 3 → 4\n- Harvest Time Multiplier ×0.5: การตัดกิ่งโอ๊ก 2 ชั่วโมง → 1 ชั่วโมง\n- Demolishing Time Multiplier ×0.5: การรื้อถอนต้นสน 1.2 ชั่วโมง → 0.6 ชั่วโมง"
csCZ = "<b>Možnosti růstu:</b> Nastavte níže výchozí hodnotu ×1 pro snížení obtížnosti kromě multiplikátoru výstupu. Příklady:\n- Multiplikátor doby výsadby ×0.5: Výsadba dubu 1 hodina → 0.5 hodiny.\n- Doba růstu ×0.5: Brambor roste 5 dní → 2.5 dní.\n- Multiplikátor výstupu ×1.5: Mrkev přináší 3 → 4.\n- Multiplikátor doby sklizně ×0.5: Řezání dubu 2 hodiny → 1 hodina.\n- Multiplikátor doby demontáže ×0.5: demontáž smrku 1.2 hodiny → 0.6 hodiny."
viVN = "<b>Tùy chọn tăng trưởng:</b> Đặt dưới mức mặc định ×1 để giảm độ khó, trừ Hệ số đầu ra. Ví dụ:\n- Hệ số thời gian gieo trồng ×0.5: Gieo cây sồi 1 giờ → 0.5 giờ.\n- Thời gian phát triển ×0.5: Khoai tây phát triển trong 5 ngày → 2.5 ngày.\n- Hệ số đầu ra ×1.5: Cà rốt cho ra 3 → 4.\n- Hệ số thời gian thu hoạch ×0.5: Cắt cây sồi 2 giờ → 1 giờ.\n- Hệ số thời gian phá dỡ ×0.5: Phá dỡ cây thông 1.2 giờ → 0.6 giờ."
caES = "<b>Opcions de creixement:</b> Estableix per sota del valor predeterminat ×1 per reduir la dificultat, excepte per al Multiplicador de producció. Exemples:\n- Multiplicador del temps de plantació ×0.5: plantar un roure triga 1 hora → 0.5 hores.\n- Temps de creixement ×0.5: la patata creix en 5 dies → 2.5 dies.\n- Multiplicador de producció ×1.5: la pastanaga produeix 3 → 4.\n- Multiplicador del temps de collita ×0.5: tallada de roure de 2 hores → 1 hora.\n- Multiplicador del temps d'enderrocament ×0.5: enderrocar un pi d'1.2 hores → 0.6 hores."
beBY = "<b>Опцыі росту:</b> Устанаўлівайце значэнне ніжэй за стандартнае ×1, каб знізіць складанасць, за выключэннем Output Multiplier. Прыклады:\n- Planting Time Multiplier ×0.5: пасадка дуба 1 гадзіна → 0.5 гадзіны.\n- Growth Time ×0.5: бульба расце 5 дзён → 2.5 дня.\n- Output Multiplier ×1.5: морква дае 3 → 4.\n- Harvest Time Multiplier ×0.5: зрэзанне дуба 2 гадзіны → 1 гадзіна.\n- Demolishing Time Multiplier ×0.5: зносіны хвоі 1.2 гадзіны → 0.6 гадзіны."
roRO = "<b>Opțiuni de creștere:</b> Setați sub valoarea implicită ×1 pentru a reduce dificultatea, cu excepția Multiplicatorului de producție. Exemple:\n- Multiplicator al timpului de plantare ×0.5: plantarea unui stejar durează 1 oră → 0.5 ore.\n- Timp de creștere ×0.5: cartoful crește în 5 zile → 2.5 zile.\n- Multiplicator de producție ×1.5: morcovul produce 3 → 4.\n- Multiplicator al timpului de recoltare ×0.5: recoltarea unui butaș de stejar durează 2 ore → 1 oră.\n- Multiplicator al timpului de demolare ×0.5: demolarea unui pin durează 1.2 ore → 0.6 ore."
huHU = "<b>Növekedési beállítások:</b> Az alapértelmezett ×1 alá állítva csökkenti a nehézséget, a Termelési szorzó kivételével. Példák:\n- Ültetési idő szorzója ×0,5: Tölgy ültetése 1 óra → 0,5 óra.\n- Növekedési idő ×0,5: A burgonya 5 nap alatt nő → 2,5 nap.\n- Termelési szorzó ×1,5: A répa 3-at terem → 4-et terem.\n- Betakarítási idő szorzója ×0,5: Tölgyvessző betakarítása 2 óra → 1 óra.\n- Bontási idő szorzója ×0,5: Fenyő bontása 1,2 óra → 0,6 óra."
arSA = "<b>خيارات النمو:</b> اضبط القيمة أدنى من الافتراضي ×1 لتقليل الصعوبة، باستثناء مضاعف الإنتاج. أمثلة:\n- مضاعف وقت الزراعة ×0.5: زراعة شجرة بلوط تستغرق ساعة واحدة ← 0.5 ساعة.\n- وقت النمو ×0.5: البطاطس تنمو خلال 5 أيام ← 2.5 يوم.\n- مضاعف الإنتاج ×1.5: الجزر ينتج 3 ← 4.\n- مضاعف وقت الحصاد ×0.5: قطع شجرة بلوط تستغرق ساعتين ← ساعة واحدة.\n- مضاعف وقت الهدم ×0.5: هدم شجرة صنوبر يستغرق 1.2 ساعة ← 0.6 ساعة."

