["LV.CPl.WithoutGroundDesc"]
raw = "Allows planting directly on roofs and platforms without soil. These plants receive irrigation and contamination from the land below."
status = "normal"
enUS = "Allows planting directly on roofs and platforms without soil. These plants receive irrigation and contamination from the land below."
zhCN = "勾选后，可以将植物种植在屋顶、平台等建筑上，无需泥土；植物的灌溉或污染受正下方的土地影响。"
zhTW = "允許在沒有土壤的屋頂和平台上直接種植。這些植物會接收到下面土地的灌溉和污染。"
ruRU = "Позволяет сажать прямо на крышах и платформах без земли. Эти растения получают орошение и загрязнение от земли под ними."
jaJP = "土壌なしで屋根やプラットフォーム上に直接植えることができます。これらの植物は、下の土地からの灌漑と汚染を受けます。"
frFR = "Permet de planter directement sur des toits et des plateformes sans sol. Ces plantes reçoivent l'irrigation et la contamination du sol en dessous."
deDE = "Ermöglicht das Pflanzen direkt auf Dächern und Plattformen ohne Erde. Diese Pflanzen erhalten Bewässerung und Kontamination von dem darunter liegenden Boden."
plPL = "Pozwala na sadzenie bezpośrednio na dachach i platformach bez gleby. Rośliny te otrzymują nawadnianie i zanieczyszczenie z ziemi poniżej."
ptBR = "Permite o plantio diretamente em telhados e plataformas sem solo. Essas plantas recebem irrigação e contaminação do solo abaixo."
koKR = "이 식물들은 토양 없이 지붕과 플랫폼에 직접 심을 수 있습니다. 이 식물들은 아래의 땅에서부터 물과 오염을 받습니다."
trTR = "Toprak olmadan doğrudan çatı ve platformlara ekim yapılmasına izin verir. Bu bitkiler, altında bulunan toprağın sulama ve kirliliğini alır."
esES = "Permite plantar directamente sobre tejados y plataformas sin suelo. Estas plantas reciben riego y contaminación del terreno situado debajo."
itIT = "Consente di piantare direttamente su tetti e piattaforme senza terreno. Queste piante ricevono irrigazione e contaminazione dal terreno sottostante."
ukUA = "Дозволяє садити рослини безпосередньо на дахах і платформах без ґрунту. Такі рослини отримують зрошення та забруднення від землі під ними."
thTH = "อนุญาตให้ปลูกพืชได้โดยตรงบนหลังคาและแพลตฟอร์มโดยไม่ต้องใช้ดิน พืชเหล่านี้จะได้รับน้ำชลประทานและการปนเปื้อนจากพื้นดินด้านล่าง"
csCZ = "Umožňuje sázení přímo na střechy a platformy bez půdy. Tyto rostliny dostávají zavlažování a kontaminaci z půdy pod nimi."
viVN = "Cho phép trồng trực tiếp trên mái nhà và các nền tảng mà không cần đất. Những cây này nhận nước tưới và ô nhiễm từ đất phía dưới."
caES = "Permet plantar directament sobre teulades i plataformes sense sòl. Aquestes plantes reben reg i contaminació del terreny que hi ha a sota."
beBY = "Дазваляе садзіць проста на дахах і платформах без глебы. Гэтыя расліны атрымліваюць арашэнне і забруджванне з зямлі пад імі."
roRO = "Permite plantarea direct pe acoperișuri și platforme, fără sol. Aceste plante primesc irigare și contaminare de la terenul de dedesubt."
huHU = "Lehetővé teszi, hogy növényeket közvetlenül tetőkre és platformokra ültessünk talaj nélkül. Ezek a növények a alattuk lévő földről kapják az öntözést és a szennyeződést."
arSA = "يسمح بزراعة النباتات مباشرةً على الأسقف والمنصات دون تربة. تتلقى هذه النباتات الري والتلوث من الأرض الموجودة أسفلها."

