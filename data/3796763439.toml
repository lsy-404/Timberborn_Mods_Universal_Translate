["Battery.Flywheels.SmallFlywheel.Description"]
status = "normal"
raw = "A small and low-capacity flywheel built inline with a shaft. Platforms can be built over them similar to shafts."
enUS = "A small, low-capacity flywheel built inline with a shaft. Platforms can be built over it, just like over shafts."
zhCN = "一种小型、低容量的飞轮，与轴同轴安装。其上方可以像轴一样建造平台。"
zhTW = "一種小型、低容量的飛輪，與軸桿串聯建造。其上方可像軸桿一樣建造平台。"
ruRU = "Небольшой маховик малой ёмкости, встроенный в линию вала. Над ним можно строить платформы, как и над валами."
jaJP = "シャフトに直結する、小型で容量の小さいフライホイール。シャフトと同様に、上にプラットフォームを建設できます。"
frFR = "Un volant d’inertie compact et de faible capacité, intégré à un arbre. Des plateformes peuvent être construites au-dessus, comme pour les arbres."
deDE = "Ein kleines Schwungrad mit geringer Kapazität, das inline in eine Welle eingebaut wird. Darüber können wie über Wellen Plattformen gebaut werden."
plPL = "Małe koło zamachowe o niewielkiej pojemności, wbudowane w wał. Można nad nim budować platformy, tak jak nad wałami."
ptBR = "Um volante pequeno e de baixa capacidade, instalado em linha com um eixo. É possível construir plataformas sobre ele, assim como sobre os eixos."
koKR = "축에 일렬로 설치하는 작고 용량이 적은 플라이휠입니다. 축과 마찬가지로 위에 플랫폼을 건설할 수 있습니다."
csCZ = "Malý setrvačník s nízkou kapacitou, zabudovaný do hřídele. Podobně jako nad hřídeli lze i nad nimi stavět plošiny."
viVN = "Một bánh đà nhỏ, dung lượng thấp, được lắp thẳng hàng với trục. Có thể xây bục phía trên chúng, tương tự như với trục."
trTR = "Bir mile doğrusal biçimde bağlanan, küçük ve düşük kapasiteli bir volan. Üzerlerine, millerde olduğu gibi platformlar inşa edilebilir."

