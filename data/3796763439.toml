["Battery.Flywheels.SmallFlywheel.Description"]
raw = "A small and low-capacity flywheel built inline with a shaft. Platforms can be built over them similar to shafts."
status = "normal"
enUS = "A small, low-capacity flywheel built inline with a shaft. Platforms can be built over them, just like shafts."
zhCN = "一种与轴内联建造的小型低容量飞轮。可以像轴一样在其上方建造平台。"
zhTW = "一種小型、低容量的飛輪，與軸輪建成一線。和軸輪一樣，可以在其上方建造平台。"
ruRU = "Небольшой маховик малой ёмкости, встроенный в линию вала. Над ним можно строить платформы, как и над валами."
jaJP = "シャフトに直結する、小型で容量の小さいフライホイール。シャフトと同様に、その上にプラットフォームを建設できます。"
frFR = "Un volant d'inertie petit et de faible capacité, intégré en ligne avec un arbre. Des plateformes peuvent être construites au-dessus, comme pour les arbres."
deDE = "Ein kleines Schwungrad mit geringer Kapazität, das inline in eine Welle eingebaut wird. Wie über Wellen können auch über ihnen Plattformen gebaut werden."
plPL = "Małe koło zamachowe o niewielkiej pojemności, wbudowane w wał. Można nad nim budować platformy, podobnie jak nad wałami."
ptBR = "Um volante de baixa capacidade e pequeno, integrado em linha a um eixo. É possível construir plataformas sobre ele, assim como sobre os eixos."
koKR = "축에 인라인으로 설치하는 작고 용량이 낮은 플라이휠입니다. 축과 마찬가지로 위에 플랫폼을 건설할 수 있습니다."
csCZ = "Malý setrvačník s nízkou kapacitou, zabudovaný přímo do hřídele. Stejně jako nad hřídeli lze i nad nimi stavět plošiny."
viVN = "Bánh đà nhỏ, dung lượng thấp, được lắp thẳng hàng với trục truyền động. Có thể xây bục phía trên chúng, tương tự như với trục truyền động."
trTR = "Bir mile doğrusal olarak yerleştirilen, küçük ve düşük kapasiteli bir volan. Üzerlerine, millerde olduğu gibi platformlar inşa edilebilir."

