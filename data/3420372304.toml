["LV.TI.Update1220"]
raw = "Prioritize Rubbles has been changed to let you choose the priority. It has been reset to Normal. Please choose a new priority if you want to use it. A new opiton Default building priority has also been added."
status = "normal"
enUS = "Prioritize Rubbles has been changed to let you choose the priority. It has been reset to Normal. Please choose a new priority if you want to use it. A new option Default building priority has also been added."
zhCN = "“优先处理碎片”已更改为让您选择优先级。已重置为正常。如果您想使用它，请选择一个新的优先级。还添加了一个新的选项：默认建筑优先级。"
zhTW = "“優先處理碎片”的選項已更改，讓您選擇優先順序。它已重置為正常。若想使用此功能，請選擇新的優先順序。另外，還新增了一個選項“默認建築優先順序”。"
ruRU = "Приоритет обломков был изменен, чтобы позволить вам выбрать приоритет. Он был сброшен на нормальный. Пожалуйста, выберите новый приоритет, если хотите его использовать. Также была добавлена новая опция стандартного приоритета строительства."
jaJP = "優先順位を付けるラブルが変更され、優先順位を選択できるようになりました。初期設定は通常にリセットされました。使用したい場合は、新しい優先順位を選択してください。また、新しいオプションとしてデフォルトの建物優先順位も追加されました。"
frFR = "Prioriser les débris a été modifié pour vous permettre de choisir la priorité. Il a été réinitialisé à Normal. Veuillez choisir une nouvelle priorité si vous souhaitez l'utiliser. Une nouvelle option Priorité de construction par défaut a également été ajoutée."
deDE = "Die Priorität der Rubbles wurde geändert, um Ihnen die Wahl der Priorität zu ermöglichen. Sie wurde auf Normal zurückgesetzt. Bitte wählen Sie eine neue Priorität, wenn Sie sie verwenden möchten. Eine neue Option für die Standard-Baupriorität wurde ebenfalls hinzugefügt."
plPL = "Priorytet Rubbles został zmieniony, aby umożliwić wybór priorytetu. Został zresetowany do Normy. Proszę wybrać nowy priorytet, jeśli chcesz go używać. Dodano także nową opcję Domyślny priorytet budowania."
ptBR = "Priorizar Detritos foi alterado para permitir que você escolha a prioridade. Foi redefinido para Normal. Por favor, escolha uma nova prioridade se quiser usá-la. Uma nova opção de Prioridade de Construção Padrão também foi adicionada."
koKR = "우선순위 풀 내기 설정이 변경되어 우선 순위를 선택할 수 있습니다. 기본값으로 재설정되었습니다. 사용하려면 새 우선순위를 선택해 주세요. 기본 건물 우선순위라는 새로운 옵션도 추가되었습니다."
trTR = "Rubble'ları Önceliklendir seçeneği, önceliği seçmenize olanak tanıyacak şekilde değiştirildi. Normal olarak sıfırlanmıştır. Kullanmak istiyorsanız lütfen yeni bir öncelik seçin. Ayrıca yeni bir seçenek olarak Varsayılan bina önceliği eklenmiştir."
esES = "Priorizar escombros ahora te permite elegir la prioridad. Se ha restablecido a Normal. Elige una nueva prioridad si quieres usarlo. También se ha añadido una nueva opción: Prioridad de construcción predeterminada."
itIT = "Priorità Macerie è stata modificata per permetterti di scegliere la priorità. È stata reimpostata su Normale. Scegli una nuova priorità se vuoi usarla. È stata inoltre aggiunta una nuova opzione: Priorità edificio predefinita."
ukUA = "Пріоритет розбору завалів тепер можна обрати самостійно. Його було скинуто до «Звичайного». Будь ласка, виберіть новий пріоритет, якщо хочете ним скористатися. Також додано нову опцію «Пріоритет будівель за замовчуванням»."
thTH = "การตั้งค่า \"Prioritize Rubbles\" ถูกเปลี่ยนให้คุณเลือกลำดับความสำคัญได้แล้ว ค่าดังกล่าวถูกรีเซ็ตเป็น \"ปกติ\" กรุณาเลือกลำดับความสำคัญใหม่หากคุณต้องการใช้งานฟีเจอร์นี้ นอกจากนี้ยังมีตัวเลือกใหม่ชื่อ \"ลำดับความสำคัญเริ่มต้นของอาคาร\" เพิ่มเข้ามาด้วย"
csCZ = "Prioritizace sutin byla změněna, aby vám umožnila vybrat prioritu. Byla resetována na Normální. Prosím, vyberte novou prioritu, pokud ji chcete použít. Také byla přidána nová možnost Výchozí priorita budov."
viVN = "Chức năng Ưu tiên Rubbles đã được thay đổi để cho phép bạn chọn mức độ ưu tiên. Nó đã được thiết lập lại thành Bình thường. Vui lòng chọn mức độ ưu tiên mới nếu bạn muốn sử dụng nó. Một tùy chọn mới về mức độ ưu tiên xây dựng mặc định cũng đã được thêm vào."
caES = "Priorititzar runes ha canviat perquè puguis triar la prioritat. S'ha restablert a Normal. Tria una nova prioritat si vols utilitzar-lo. També s'ha afegit una nova opció: Prioritat predeterminada d'edificis."
beBY = "Функцыя «Prioritize Rubbles» зменена: цяпер вы можаце выбраць прыярытэт. Яна скінута да «Звычайнага». Калі ласка, выберыце новы прыярытэт, калі хочаце яе выкарыстоўваць. Таксама дададзена новая опцыя «Прыярытэт будынкаў па змаўчанні»."
roRO = "Prioritatea Dărâmăturilor a fost modificată, astfel încât acum poți alege prioritatea. A fost resetată la Normală. Te rugăm să alegi o prioritate nouă dacă vrei să o folosești. A fost adăugată și o opțiune nouă: Prioritatea implicită a clădirilor."
huHU = "A „Prioritize Rubbles\" beállítása mostantól lehetővé teszi a prioritás kiválasztását. Alapértelmezésben Normálra lett visszaállítva, ezért kérjük, válassz új prioritást, ha használni szeretnéd. Új lehetőségként megjelent az Alapértelmezett épületprioritás opció is."
arSA = "تم تغيير خيار \"إعطاء الأولوية للأنقاض\" ليتيح لك اختيار الأولوية. وقد أُعيد ضبطه إلى \"عادية\". يُرجى اختيار أولوية جديدة إذا كنت تريد استخدامه. كما أُضيف خيار جديد هو \"أولوية المباني الافتراضية\"."

