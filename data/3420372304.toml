["LV.TI.BiggerBuildDragAreaDesc"]
raw = "Increase the build drag area for buildings like Dams (default 10x10) or Roads (25).\nThis significantly increases the load time and memory usage so use it with caution.\nExample: setting this to 5 will make the drag area 15x15 Dams or 30 Roads.\nCan only be changed at anytime <b>but need to reload a save to take effect.</b>"
status = "normal"
enUS = "Increase the build drag area for buildings like Dams (default 10x10) or Roads (25). This significantly increases the load time and memory usage, so use it with caution. For example, setting this to 5 will make the drag area 15x15 for Dams or 30 for Roads. This can only be changed at any time but requires reloading a save to take effect."
zhCN = "可以增加建筑物（如大坝，默认10x10）或道路（25）的建造拖动区域。这会显著增加加载时间和内存使用，因此请谨慎使用。示例：将此设置为5将使拖动区域变为15x15的大坝或30条道路。可以随时修改，但需要重新加载存档以生效。"
zhTW = "增加建築物的拖曳區域，例如大壩（默認為10x10）或道路（25）。這會顯著增加加載時間和內存使用量，因此使用時請小心。範例：將此設置為5將使拖曳區域變為15x15的大壩或30條道路。<b>但需要重新載入存檔才能生效。</b>"
ruRU = "Увеличьте область перетаскивания для зданий, таких как дамбы (по умолчанию 10x10) или дороги (25). Это значительно увеличивает время загрузки и использование памяти, поэтому используйте это с осторожностью. Пример: установка этого значения на 5 сделает область перетаскивания 15x15 для дамб или 30 для дорог. Изменить можно в любое время, <b>но нужно перезагрузить сохранение, чтобы изменения вступили в силу.</b>"
jaJP = "ダム（デフォルトは10x10）や道路（25）などの建物のビルドドラッグエリアを増やします。これにより、読み込み時間とメモリ使用量が大幅に増加するため、注意して使用してください。例：これを5に設定すると、ドラッグエリアは15x15のダムまたは30の道路になります。変更はいつでも可能ですが、<b>効果を得るにはセーブを再ロードする必要があります。</b>"
frFR = "Augmentez la zone de glissement pour les bâtiments tels que les barrages (par défaut 10x10) ou les routes (25). Cela augmente considérablement le temps de chargement et l'utilisation de la mémoire, donc utilisez-le avec prudence. Exemple : définir cela à 5 rendra la zone de glissement 15x15 pour les barrages ou 30 pour les routes. Ne peut être modifié à tout moment <b>mais nécessite de recharger une sauvegarde pour prendre effet.</b>"
deDE = "Erhöhen Sie die Ziehfläche für Gebäude wie Dämme (Standard 10x10) oder Straßen (25). Dies erhöht signifikant die Ladezeit und den Speicherbedarf, daher sollte es mit Vorsicht verwendet werden. Beispiel: Wenn Sie dies auf 5 setzen, wird die Ziehfläche 15x15 Dämme oder 30 Straßen. Kann jederzeit geändert werden <b>muss jedoch gespeichert werden, um wirksam zu werden.</b>"
plPL = "Zwiększ obszar przeciągania budowli, takich jak tamy (domyślnie 10x10) lub drogi (25). Znacząco zwiększa to czas ładowania i zużycie pamięci, dlatego należy używać tego ostrożnie. Na przykład ustawienie tego na 5 sprawi, że obszar przeciągania wyniesie 15x15 tam lub 30 dróg. Może być zmieniane w dowolnym momencie <b>ale należy załadować zapis, aby to zadziałało.</b>"
ptBR = "Aumente a área de arrasto de construção para edifícios como Barragens (padrão 10x10) ou Estradas (25). Isso aumenta significativamente o tempo de carregamento e o uso de memória, então use com cautela. Exemplo: definir isso para 5 fará com que a área de arrasto seja 15x15 Barragens ou 30 Estradas. Pode ser alterado a qualquer momento <b>mas é necessário recarregar um salvamento para ter efeito.</b>"
koKR = "건물의 빌드 드래그 영역을 댐(기본 10x10)이나 도로(25)와 같은 건물에 대해 늘립니다. 이로 인해 로드 시간과 메모리 사용량이 크게 증가하므로 주의해서 사용하세요. 예를 들어, 이 값을 5로 설정하면 드래그 영역이 15x15 댐이나 30 도로가 됩니다. 이 설정은 언제든지 변경할 수 있지만 <b>효과를 적용하려면 세이브를 다시 로드해야 합니다.</b>"
trTR = "Binalar için inşa sürükleme alanını artırın, örneğin Barajlar (varsayılan 10x10) veya Yollar (25).\nBu, yükleme süresini ve bellek kullanımını önemli ölçüde artırır, bu nedenle dikkatli kullanın.\nÖrnek: bunu 5 olarak ayarlamak, sürükleme alanını 15x15 Barajlar veya 30 Yol yapar.\nDeğişiklik sadece herhangi bir zamanda yapılabilir <b>ancak etkin olması için bir kaydı yeniden yüklemeniz gerekir.</b>"
esES = "Aumente el área de arrastre de construcción para edificios como las Presas (predeterminado 10x10) o las Carreteras (25).\nEsto aumenta considerablemente el tiempo de carga y el uso de memoria, así que úselo con precaución.\nEjemplo: si establece este valor en 5, el área de arrastre será de 15x15 para las Presas o de 30 para las Carreteras.\nSe puede cambiar en cualquier momento, <b>pero es necesario recargar una partida guardada para que surta efecto.</b>"
itIT = "Aumenta l'area di trascinamento della costruzione per edifici come le Dighe (predefinito 10x10) o le Strade (25).\nQuesto aumenta notevolmente i tempi di caricamento e l'uso della memoria, quindi usalo con cautela.\nEsempio: impostando questo valore a 5, l'area di trascinamento diventerà 15x15 per le Dighe o 30 per le Strade.\nPuò essere modificato in qualsiasi momento, <b>ma è necessario ricaricare un salvataggio affinché abbia effetto.</b>"
ukUA = "Збільшує зону перетягування для будівель, як-от Греблі (типово 10x10) або Дороги (25).\nЦе значно збільшує час завантаження та використання пам'яті, тож користуйтеся цим обережно.\nПриклад: якщо встановити значення 5, зона перетягування для Гребель становитиме 15x15, а для Доріг — 30.\nЗмінювати можна будь-коли, <b>але для набуття чинності потрібно перезавантажити збереження.</b>"
thTH = "เพิ่มพื้นที่ลากสร้างสำหรับอาคารต่างๆ เช่น เขื่อน (ค่าเริ่มต้น 10x10) หรือถนน (25)\nการตั้งค่านี้จะเพิ่มเวลาในการโหลดและการใช้หน่วยความจำอย่างมาก ดังนั้นโปรดใช้ด้วยความระมัดระวัง\nตัวอย่าง: หากตั้งค่านี้เป็น 5 พื้นที่ลากสำหรับเขื่อนจะเป็น 15x15 และสำหรับถนนจะเป็น 30\nสามารถเปลี่ยนแปลงได้ตลอดเวลา <b>แต่ต้องโหลดเซฟใหม่เพื่อให้มีผล</b>"
csCZ = "Zvyšte oblast přetahování staveb pro stavby jako jsou hráze (výchozí 10x10) nebo silnice (25).\nTo výrazně zvyšuje načítací čas a využití paměti, takže to používejte opatrně.\nPříklad: nastavení na 5 způsobí, že oblast přetahování bude 15x15 hráze nebo 30 silnic.\nMůže být změněno kdykoliv <b>ale je nutné znovu načíst uloženou hru, aby změna nabyla účinnosti.</b>"
viVN = "Tăng vùng kéo khi xây dựng cho các công trình như Đập (mặc định 10x10) hoặc Đường (25).\nĐiều này làm tăng đáng kể thời gian tải và mức tiêu thụ bộ nhớ, vì vậy hãy sử dụng nó một cách thận trọng.\nVí dụ: đặt giá trị này thành 5 sẽ làm vùng kéo 15x15 cho Đập hoặc 30 cho Đường.\nCó thể thay đổi bất cứ lúc nào <b>nhưng cần tải lại một bản lưu để có hiệu lực.</b>"
caES = "Augmenta l'àrea d'arrossegament de construcció per a edificis com les Preses (per defecte 10x10) o els Camins (25).\nAixò augmenta considerablement el temps de càrrega i l'ús de memòria, així que utilitza-ho amb precaució.\nExemple: si ho poses a 5, l'àrea d'arrossegament serà de 15x15 per a les Preses o de 30 per als Camins.\nEs pot canviar en qualsevol moment, <b>però cal tornar a carregar una partida perquè tingui efecte.</b>"
beBY = "Павялічвае зону перацягвання для будынкаў, напрыклад Плацін (стандартна 10x10) або Дарог (25).\nГэта значна павялічвае час загрузкі і выкарыстанне памяці, таму карыстайцеся з асцярожнасцю.\nПрыклад: калі задаць 5, зона перацягвання для Плацін будзе 15x15, а для Дарог — 30.\nМожна змяняць у любы час, <b>але для ўступлення ў сілу трэба перазагрузіць захаванне.</b>"
roRO = "Mărește zona de tragere a construcției pentru clădiri precum Barajele (implicit 10x10) sau Drumurile (25).\nAceasta crește considerabil timpul de încărcare și utilizarea memoriei, așa că folosește-o cu precauție.\nExemplu: setarea acestei valori la 5 va face zona de tragere de 15x15 pentru Baraje sau 30 pentru Drumuri.\nPoate fi modificată oricând, <b>dar trebuie să reîncarci un salvat pentru ca modificarea să aibă efect.</b>"
huHU = "Növeld az építési vonszolási terület méretét olyan épületeknél, mint a gátak (alapértelmezés: 10x10) vagy az utak (25).\nEz jelentősen megnöveli a betöltési időt és a memóriahasználatot, ezért óvatosan használd.\nPélda: ha ezt 5-re állítod, a gátak vonszolási területe 15x15, az utaké pedig 30 lesz.\nBármikor megváltoztatható, <b>de a hatálybalépéshez be kell tölteni a mentést.</b>"
arSA = "زد من منطقة السحب الخاصة بالبناء للمباني مثل السدود (الافتراضي 10×10) أو الطرق (25).\nهذا يزيد بشكل كبير من وقت التحميل واستخدام الذاكرة، لذا استخدمه بحذر.\nمثال: ضبط هذه القيمة على 5 سيجعل منطقة السحب 15×15 للسدود أو 30 للطرق.\nيمكن تغييرها في أي وقت، <b>لكن يجب إعادة تحميل الحفظ لكي يسري التغيير.</b>"

