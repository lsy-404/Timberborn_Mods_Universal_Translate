["LV.TI.EnableSpeedS25Desc"]
raw = "Unlock the 0.25x speed option in the game by pressing Shift+1.\nNormally, this is only available in Dev Mode."
status = "abandoned"
enUS = "Unlock the 0.25x speed option in the game by pressing Shift+1. Normally, this is only available in Dev Mode."
zhCN = "勾选后，可以通过按下快捷键（Shift+数字键1）将游戏速度设置为0.25倍速度。<br>不启用此模组时，只能在开发者模式下使用此速度。"
zhTW = "透過按下 Shift+1 解鎖遊戲中的 0.25x 速度選項。通常，這僅在開發模式中可用。"
ruRU = "Разблокируйте опцию скорости 0,25x в игре, нажав Shift+1. Обычно это доступно только в режиме разработчика."
