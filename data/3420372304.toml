zhCN = "自动清除已死亡的树桩或灌木（那些你可以在上面建造时立即摧毁的）：  \n- 否：不清除任何东西  \n- 工具：使用拆除工具时  \n- 自动：它们出现时立即清除"
zhTW = "自動清除死樹樁或灌木叢（那些您可以立即通過在其上建築來摧毀的）：\n- 否：不要清除任何東西\n- 工具：使用拆除工具時\n- 自動：當它們出現時立即清除"
ruRU = "Автоматически очищать мертвые пни или кусты (те, которые вы могли бы уничтожить сразу, построив на их месте)."
jaJP = "自動的に枯れた切り株や茂みを取り除く（すぐに建物を建てることで破壊できたもの）：\n- いいえ：何も取り除かない\n- ツール：解体ツールを使用する際\n- 自動：出現した瞬間にただ取り除く"
frFR = "Effacer automatiquement les souches ou buissons morts (ceux que vous auriez pu détruire immédiatement en construisant par-dessus) :  \n- Non : ne rien effacer  \n- Outil : lors de l'utilisation de l'outil de démolition  \n- Automatique : effacez-les simplement dès qu'ils apparaissent"
deDE = "Tote Baumstümpfe oder Büsche automatisch entfernen (diese hätten Sie sofort durch Überbauen zerstören können)."
plPL = "Automatycznie usuwaj martwe pniaki lub krzaki (te, które mogłeś zniszczyć od razu, budując na ich miejscu):"
ptBR = "Limpar automaticamente tocos ou arbustos mortos (aqueles que você poderia ter destruído imediatamente construindo sobre eles):\n- Não: não limpe nada\n- Ferramenta: ao usar a Ferramenta de Demolição\n- Automático: apenas limpe-os assim que aparecerem"
koKR = "자동으로 죽은 그루터기나 덤불을 제거합니다(건물을 올려 즉시 파괴할 수 있었던 것들):\n- 아니요: 아무것도 제거하지 않음\n- 도구: 철거 도구를 사용할 때\n- 자동: 나타나면 바로 제거합니다."
trTR = "Otomatik olarak ölü kütükleri veya çalıları temizleyin (üzerine inşa ederek hemen yok edebileceğiniz olanlar)."
esES = "Eliminar automáticamente los tocones o arbustos muertos (aquellos que podrías haber destruido de inmediato construyendo encima)."
itIT = "Rimuove automaticamente i ceppi o i cespugli morti (quelli che avresti potuto eliminare subito costruendoci sopra)."
ukUA = "Автоматично прибирати мертві пні або кущі (ті, які ви могли б знищити миттєво, просто збудувавши на їхньому місці)."
thTH = "ล้างตอไม้ที่ตายแล้วหรือพุ่มไม้ที่ตายแล้วโดยอัตโนมัติ (ซึ่งคุณสามารถทำลายได้ทันทีด้วยการสร้างสิ่งก่อสร้างทับลงไป)"
csCZ = "Automaticky odstraňte mrtvé pařezy nebo keře (ty, které byste mohli okamžitě zničit stavbou přes ně)."
viVN = "Tự động dọn sạch các gốc cây chết hoặc bụi cây chết (những thứ bạn có thể phá hủy ngay bằng cách xây dựng lên trên chúng)."
caES = "Neteja automàticament els soques o matolls morts (aquells que podries haver destruït a l'instant construint-hi a sobre)."
beBY = "Аўтаматычна выдаляць мёртвыя пні або кусты (тыя, якія можна было б знішчыць адразу, пабудаваўшы паверх іх)."
roRO = "Curăță automat cioatele sau tufișurile uscate (cele pe care le-ai fi putut distruge imediat prin construire deasupra)."
huHU = "Automatikusan eltávolítja az elpusztult tuskókat vagy bokrokat (azokat, amelyeket azonnal lerombolhatott volna egy építménnyel való lefedéssel)."
