frFR = "Débloquez l'option de vitesse 0,25x dans le jeu en appuyant sur Shift+1. Normalement, cela n'est disponible que dans le mode développeur."
deDE = "Entsperren Sie die 0,25-fache Geschwindigkeitsoption im Spiel, indem Sie Shift+1 drücken. Normalerweise ist dies nur im Entwicklermodus verfügbar."
plPL = "Odblokuj opcję prędkości 0,25x w grze, klikając Shift+1. Zwykle jest to dostępne tylko w trybie dewelopera."
ptBR = "Desbloqueie a opção de velocidade 0,25x no jogo pressionando Shift+1. Normalmente, isso está disponível apenas no Modo de Desenvolvimento."
koKR = "게임에서 Shift+1을 눌러 0.25배 속도 옵션을 활성화하세요. 일반적으로, 이 기능은 개발자 모드에서만 사용 가능합니다."
trTR = "Oyun içinde Shift+1 tuşuna basarak 0.25x hız seçeneğini açın. Normalde bu sadece Geliştirici Modu'nda mevcuttur."
esES = "Desbloquea la opción de velocidad 0.25x en el juego pulsando Shift+1.\nNormalmente, esta opción solo está disponible en el Modo de desarrollo."
itIT = "Sblocca l'opzione di velocità 0.25x nel gioco premendo Maiusc+1.\nNormalmente, questa opzione è disponibile solo in modalità sviluppatore."
ukUA = "Розблокуйте опцію швидкості 0.25x у грі, натиснувши Shift+1.\nЗазвичай вона доступна лише в режимі розробника."
thTH = "ปลดล็อกตัวเลือกความเร็ว 0.25x ในเกมโดยกด Shift+1\nตามปกติ ตัวเลือกนี้จะใช้ได้เฉพาะในโหมดพัฒนาเท่านั้น"
csCZ = "Odblokujte možnost rychlosti 0,25x ve hře stisknutím Shift+1. Obvykle je to k dispozici pouze v režimu vývojáře."
viVN = "Mở khóa tùy chọn tốc độ 0.25x trong trò chơi bằng cách nhấn Shift+1. Thông thường, tùy chọn này chỉ có sẵn trong Chế độ Phát triển."
caES = "Desbloqueja l'opció de velocitat 0,25x del joc prement Maj+1.\nNormalment, això només està disponible en el mode de desenvolupament."
beBY = "Разблакіруйце параметр хуткасці 0.25x у гульні, націснуўшы Shift+1.\nЗвычайна ён даступны толькі ў рэжыме распрацоўшчыка."
roRO = "Deblocați opțiunea de viteză 0.25x din joc apăsând Shift+1.\nÎn mod normal, aceasta este disponibilă doar în Modul Dezvoltator."
huHU = "0,25x sebesség opció feloldása a játékban a Shift+1 megnyomásával.\nNormál esetben ez csak Fejlesztői módban érhető el."
arSA = "افتح خيار السرعة 0.25x في اللعبة بالضغط على Shift+1.\nعادةً، يكون هذا الخيار متاحًا فقط في وضع المطور."

