zhTW = "設定建築物的預設優先順序：\n- 非常低 - 非常高：新建築的固定優先順序\n- 記住：記住您上次設定的優先順序並使用。僅在相同的會話中有效，並不會被保存。"
ruRU = "Установите приоритет по умолчанию для зданий:\n- Очень низкий - Очень высокий: фиксированный приоритет для нового здания\n- Запомнить: запоминать последний установленный вами приоритет и использовать его. Работает только в текущей сессии и не сохраняется."
jaJP = "建物のデフォルトの優先順位を設定します：\n- 非常に低い - 非常に高い：新しい建物に対する固定の優先順位\n- 記憶する：最後に設定した優先順位を記憶し、それを使用します。同じセッション内でのみ機能し、保存されません。"
frFR = "Définissez la priorité par défaut pour les bâtiments :  \n- Très basse - Très élevée : priorité fixe sur le nouveau bâtiment  \n- Se souvenir : se souvenir de la dernière priorité que vous avez définie et l'utiliser. Ne fonctionne que dans la même session et n'est pas sauvegardé."
deDE = "Setze die Standardpriorität für Gebäude:\n- Sehr niedrig - Sehr hoch: feste Priorität für neue Gebäude\n- Merken: merke dir die letzte von dir gesetzte Priorität und verwende sie. Funktioniert nur in derselben Sitzung und wird nicht gespeichert."
plPL = "Ustaw domyślny priorytet dla budynków:  \n- Bardzo niski - Bardzo wysoki: stały priorytet dla nowego budynku  \n- Zapamiętaj: zapamiętuj ostatni ustawiony priorytet i używaj go. Działa tylko w tej samej sesji i nie jest zapisywane."
ptBR = "Defina a prioridade padrão para os edifícios:\n- Muito baixa - Muito alta: prioridade fixa em novo edifício\n- Lembrar: lembre-se da última prioridade que você definiu e use-a. Funciona apenas na mesma sessão e não é salva."
koKR = "건물의 기본 우선 순위를 설정합니다:\n- 매우 낮음 - 매우 높음: 새 건물에 대한 고정 우선 순위\n- 기억: 마지막으로 설정한 우선 순위를 기억하고 사용합니다. 같은 세션에서만 작동하며 저장되지 않습니다."
trTR = "Binalar için varsayılan önceliği ayarla:\n- Çok düşük - Çok yüksek: yeni binalarda sabit öncelik\n- Hatırla: Ayarladığın son önceliği hatırla ve kullan. Sadece aynı oturumda çalışır ve kaydedilmez."
esES = "Establezca la prioridad predeterminada para los edificios:\n- Muy baja - Muy alta: prioridad fija para los nuevos edificios\n- Recordar: recuerda la última prioridad que estableció y la utiliza. Solo funciona en la misma sesión y no se guarda."
itIT = "Imposta la priorità predefinita per gli edifici:\n- Molto bassa - Molto alta: priorità fissa per i nuovi edifici\n- Ricorda: ricorda l'ultima priorità impostata e la usa. Funziona solo nella stessa sessione e non viene salvata."
ukUA = "Встановіть типовий пріоритет для будівель:\n- Дуже низький - Дуже високий: фіксований пріоритет для нової будівлі\n- Запам'ятати: запам'ятовує останній встановлений вами пріоритет і використовує його. Працює лише в межах поточної сесії і не зберігається."
thTH = "การตั้งค่าความสำคัญเริ่มต้นสำหรับอาคาร:\n- ต่ำมาก - สูงมาก: กำหนดความสำคัญคงที่ให้กับอาคารที่สร้างใหม่\n- จำไว้: จดจำความสำคัญล่าสุดที่คุณตั้งไว้และนำไปใช้ ใช้ได้เฉพาะในเซสชันเดียวกันและจะไม่ถูกบันทึกไว้"
csCZ = "Nastavte výchozí prioritu pro budovy:\n- Velmi nízká - Velmi vysoká: pevná priorita pro novou budovu\n- Pamatuj: zapamatuje si poslední prioritu, kterou jste nastavili, a použije ji. Funguje pouze v rámci stejné relace a není uložena."
viVN = "Đặt ưu tiên mặc định cho các tòa nhà:\n- Rất thấp - Rất cao: ưu tiên cố định cho tòa nhà mới\n- Nhớ: nhớ ưu tiên cuối cùng bạn đã thiết lập và sử dụng nó. Chỉ hoạt động trong cùng một phiên và không được lưu."
caES = "Estableix la prioritat predeterminada per als edificis:\n- Molt baixa - Molt alta: prioritat fixa en els edificis nous\n- Recorda: recorda l'última prioritat que has establert i fes-la servir. Només funciona en la mateixa sessió i no es desa."
beBY = "Задайце прадвызначаны прыярытэт для будынкаў:\n- Вельмі нізкі - Вельмі высокі: фіксаваны прыярытэт для новага будынка\n- Запомніць: запомніць апошні заданы вамі прыярытэт і выкарыстоўваць яго. Працуе толькі ў межах той жа сесіі і не захоўваецца."
roRO = "Setați prioritatea implicită pentru clădiri:\n- Foarte scăzută - Foarte ridicată: prioritate fixă pentru clădirile noi\n- Reține: reține ultima prioritate setată și o folosește. Funcționează doar în aceeași sesiune și nu este salvată."
huHU = "Állítsa be az épületek alapértelmezett prioritását:\n- Nagyon alacsony – Nagyon magas: rögzített prioritás az új épületeken\n- Emlékezés: emlékszik az utolsó beállított prioritásra, és azt használja. Csak az aktuális munkamenetben működik, és nem mentődik el."
arSA = "تعيين الأولوية الافتراضية للمباني:\n- من منخفضة جدًا إلى مرتفعة جدًا: أولوية ثابتة للمباني الجديدة\n- تذكّر: يتذكّر آخر أولوية حددتها ويستخدمها. يعمل فقط في الجلسة نفسها ولا يُحفظ."

