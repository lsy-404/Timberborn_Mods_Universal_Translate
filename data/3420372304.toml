["LV.TI.EnableSpeed5Desc"]
raw = "Unlock the 5th speed 99x option in the game by pressing 5.\nNormally, this is only available in Dev Mode.\n<RedHighlight>Be warned that this speed is unstable and may cause issues with the game. Somebody said beavers may stay hungry and thirsty.</RedHighlight>"
status = "abandoned"
enUS = "Unlock the 5th speed 99x option in the game by pressing 5. Normally, this is only available in Dev Mode. <RedHighlight>Be warned that this speed is unstable and may cause issues with the game. Someone reported that beavers might stay hungry and thirsty.</RedHighlight>"
zhCN = "解锁游戏中的第5速度99倍选项，只需按下5键。通常情况下，此选项仅在开发者模式下可用。<RedHighlight>请注意，该速度不稳定，可能会导致游戏出现问题。有些人说海狸可能会一直饥饿和口渴。</RedHighlight>"
zhTW = "在遊戲中按下 5 鍵解鎖第五速度 99x 選項。通常，這只在開發模式下可用。<RedHighlight>請注意，這個速度不穩定，可能會導致遊戲出現問題。有些人說海狸可能會保持飢餓和口渴。</RedHighlight>"
ruRU = "Разблокируйте 5-ю скорость 99x в игре, нажав 5. Обычно эта опция доступна только в режиме разработчика. <RedHighlight>Будьте осторожны, эта скорость нестабильна и может вызвать проблемы с игрой. Кто-то сказал, что бобры могут оставаться голодными и жаждущими.</RedHighlight>"
jaJP = "ゲーム内で5を押すことで、5番目の速度99倍オプションをアンロックします。通常、これは開発モードでのみ利用可能です。<RedHighlight>この速度は不安定で、ゲームに問題を引き起こす可能性があるため、注意が必要です。誰かがビーバーが空腹や渇きのままでいる可能性があると言っていました。</RedHighlight>"
frFR = "Débloquez l'option de 5ème vitesse 99x dans le jeu en appuyant sur 5. Normalement, cela est uniquement disponible en mode développeur. <RedHighlight>Attention, cette vitesse est instable et peut causer des problèmes avec le jeu. Quelqu'un a dit que les castors pourraient rester affamés et assoiffés.</RedHighlight>"
deDE = "Schalte die 5. Geschwindigkeitsoption 99x im Spiel frei, indem du die 5 drückst. Normalerweise ist dies nur im Entwicklermodus verfügbar. <RedHighlight>Sei gewarnt, dass diese Geschwindigkeit instabil ist und Probleme mit dem Spiel verursachen kann. Jemand hat gesagt, dass Biber hungrig und durstig bleiben könnten.</RedHighlight>"
plPL = "Odblokuj opcję 5. prędkości 99x w grze, naciskając 5. Zwykle jest ona dostępna tylko w trybie dewelopera. <RedHighlight>Uważaj, że ta prędkość jest niestabilna i może powodować problemy w grze. Ktoś powiedział, że bobry mogą pozostać głodne i spragnione.</RedHighlight>"
ptBR = "Desbloqueie a opção de velocidade 5x 99 no jogo pressionando 5. Normalmente, isso só está disponível no Modo Dev. <RedHighlight>Esteja avisado de que essa velocidade é instável e pode causar problemas no jogo. Alguém disse que os castores podem ficar com fome e sede.</RedHighlight>"
koKR = "게임에서 5번을 눌러 5단계 속도 99배 옵션을 잠금 해제하세요. 일반적으로 이는 개발자 모드에서만 사용 가능합니다. <RedHighlight>이 속도는 불안정할 수 있으며 게임에 문제가 발생할 수 있습니다. 누군가는 비버들이 배고프고 목마를 수 있다고 말했습니다.</RedHighlight>"
trTR = "5. hızı 99x seçeneğini oyunda 5'e basarak açın. Normalde, bu yalnızca Geliştirici Modu'nda mevcut. <RedHighlight>Dikkatli olun, bu hız kararsızdır ve oyunda sorunlara neden olabilir. Birisi, kunduzların aç ve susuz kalabileceğini söyledi.</RedHighlight>"
esES = "Desbloquea la opción de velocidad 99x n.º 5 en el juego pulsando 5.\nNormalmente, esto solo está disponible en el Modo de desarrollo.\n<RedHighlight>Ten en cuenta que esta velocidad es inestable y puede causar problemas en el juego. Alguien dijo que los castores podrían seguir teniendo hambre y sed.</RedHighlight>"
itIT = "Sblocca la 5ª opzione di velocità 99x nel gioco premendo 5.\nNormalmente, questa è disponibile solo in Modalità Sviluppatore.\n<RedHighlight>Attenzione: questa velocità è instabile e può causare problemi con il gioco. Qualcuno ha detto che i castori potrebbero restare affamati e assetati.</RedHighlight>"
ukUA = "Розблокуйте 5-ту швидкість 99x у грі, натиснувши 5.\nЗазвичай це доступно лише в режимі розробника.\n<RedHighlight>Майте на увазі, що ця швидкість є нестабільною і може спричинити проблеми з грою. Хтось казав, що бобри можуть залишатися голодними та спраглими.</RedHighlight>"
thTH = "ปลดล็อกตัวเลือกความเร็ว 99x ระดับที่ 5 ในเกมได้โดยกดปุ่ม 5\nปกติแล้ว ตัวเลือกนี้มีให้ใช้เฉพาะในโหมดนักพัฒนาเท่านั้น\n<RedHighlight>ขอเตือนไว้ก่อนว่าความเร็วนี้ไม่เสถียรและอาจก่อให้เกิดปัญหากับเกม มีคนบอกว่าบีเวอร์อาจยังคงหิวและกระหายน้ำ</RedHighlight>"
csCZ = "Odemkněte 5. možnost rychlosti 99x ve hře stisknutím 5. Normálně je to k dispozici pouze v režimu vývojáře. <RedHighlight>Buďte upozorněni, že tato rychlost je nestabilní a může způsobit problémy se hrou. Někdo řekl, že bobři mohou zůstat hladoví a žízniví.</RedHighlight>"
viVN = "Mở khóa tùy chọn tốc độ 99x thứ 5 trong trò chơi bằng cách nhấn phím 5.\nThông thường, tùy chọn này chỉ có ở Chế độ Phát triển.\n<RedHighlight>Cảnh báo: tốc độ này không ổn định và có thể gây ra sự cố cho trò chơi. Có người nói rằng hải ly có thể vẫn đói và khát.</RedHighlight>"
caES = "Desbloqueja l'opció de velocitat 99x de 5a marxa al joc prement 5.\nNormalment, això només està disponible en el mode de desenvolupament.\n<RedHighlight>Tingues en compte que aquesta velocitat és inestable i pot causar problemes al joc. Algú ha dit que els castors podrien quedar-se amb fam i set.</RedHighlight>"
beBY = "Разблакіруйце 5-ю хуткасць 99x у гульні, націснуўшы 5.\nЗвычайна гэта даступна толькі ў рэжыме распрацоўшчыка.\n<RedHighlight>Заўважце: гэтая хуткасць нестабільная і можа выклікаць праблемы ў гульні. Нехта казаў, што бабры могуць застацца голачнымі і спragnёнымі.</RedHighlight>"
roRO = "Deblochează a 5-a opțiune de viteză 99x din joc apăsând tasta 5.\nÎn mod normal, aceasta este disponibilă doar în Modul Dezvoltator.\n<RedHighlight>Atenție, această viteză este instabilă și poate cauza probleme în joc. Cineva a spus că castorii pot rămâne înfometați și însetați.</RedHighlight>"
huHU = "Nyomja meg az 5-ös billentyűt a játékban az 5. sebesség (99x) opció feloldásához.\nNormális esetben ez csak a fejlesztői módban érhető el.\n<RedHighlight>Figyelem: ez a sebesség instabil, és problémákat okozhat a játékban. Valaki azt mondta, hogy a bobrok éhesek és szomjasak maradhatnak.</RedHighlight>"
arSA = "يمكنك فتح سرعة اللعب الخامسة 99x في اللعبة بالضغط على الزر 5.\nعادةً، لا يتوفر هذا الخيار إلا في وضع المطوّر.\n<RedHighlight>تنبيه: هذه السرعة غير مستقرة وقد تسبب مشكلات في اللعبة. قال أحدهم إن البيفرز قد يبقون جائعين وعطشى.</RedHighlight>"

