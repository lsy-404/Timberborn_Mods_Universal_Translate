["LV.TI.QuickQuitDesc"]
raw = "Press Ctrl + Shift + Q to force exit the game immediately by killing the game process. NO SAVE or game state clean up. Be careful!"
status = "normal"
enUS = "Press Ctrl + Shift + Q to immediately force exit the game by terminating the game process. NO SAVE or game state cleanup. Be careful!"
zhCN = "勾选后，可以通过按下快捷键（Ctrl+Shift+Q）快速退出游戏。<br>注意，执行此操作时不会自动存档。"
zhTW = "按 Ctrl + Shift + Q 立即強制退出遊戲，並終止遊戲進程。沒有保存或遊戲狀態清理。請小心！"
ruRU = "Нажмите Ctrl + Shift + Q, чтобы немедленно завершить игру, убив процесс игры. БЕЗ СОХРАНЕНИЯ или очистки состояния игры. Будьте осторожны!"
jaJP = "Ctrl + Shift + Q を押して、ゲームプロセスを強制終了して直ちにゲームを終了します。セーブもなく、ゲームの状態のクリーンアップもありません。注意してください！"
frFR = "Appuyez sur Ctrl + Shift + Q pour quitter le jeu immédiatement en tuant le processus du jeu. AUCUNE SAUVEGARDE ou nettoyage de l'état du jeu. Faites attention !"
deDE = "Drücken Sie Strg + Shift + Q, um das Spiel sofort durch Beenden des Spielprozesses zwangsweise zu beenden. KEIN SPIELSTAND oder Bereinigung des Spielstatus. Seien Sie vorsichtig!"
plPL = "Naciśnij Ctrl + Shift + Q, aby natychmiast wymusić zakończenie gry, zabijając proces gry. BEZ ZAPISU ani czyszczenia stanu gry. Uważaj!"
ptBR = "Pressione Ctrl + Shift + Q para sair do jogo imediatamente, encerrando o processo do jogo. NÃO HÁ SALVAMENTO ou limpeza do estado do jogo. Tenha cuidado!"
koKR = "게임 프로세스를 강제로 종료하여 즉시 게임을 종료하려면 Ctrl + Shift + Q를 누르세요. 저장이나 게임 상태 정리가 없습니다. 주의하세요!"
trTR = "Oyunu hemen kapatmak için Ctrl + Shift + Q tuşlarına basın, bu oyun işlemine son verecektir. KAYIT YOK veya oyun durumu temizlenmeyecektir. Dikkatli olun!"
esES = "Pulse Ctrl + Mayús + Q para forzar la salida inmediata del juego terminando el proceso del juego. NO se guarda la partida ni se limpia el estado del juego. ¡Ten cuidado!"
itIT = "Premi Ctrl + Maiusc + Q per forzare l'uscita immediata dal gioco terminando il processo di gioco. NON viene effettuato alcun salvataggio né alcuna pulizia dello stato di gioco. Fai attenzione!"
ukUA = "Натисніть Ctrl + Shift + Q, щоб примусово негайно вийти з гри, завершивши процес гри. БЕЗ ЗБЕРЕЖЕННЯ та без очищення стану гри. Будьте обережні!"
thTH = "กด Ctrl + Shift + Q เพื่อบังคับปิดเกมทันทีโดยสั่งยกเลิกโปรเซสของเกม จะไม่มีการบันทึกเกมหรือเคลียร์สถานะเกมใดๆ ระวังให้ดี!"
csCZ = "Stiskněte Ctrl + Shift + Q pro okamžité nucené ukončení hry zabitím proces hry. ŽÁDNÉ ULOŽENÍ ani úklid stavu hry. Buďte opatrní!"
viVN = "Nhấn Ctrl + Shift + Q để buộc thoát khỏi trò chơi ngay lập tức bằng cách kết thúc tiến trình trò chơi. Không lưu trò chơi hoặc dọn dẹp trạng thái trò chơi. Hãy cẩn thận!"
caES = "Premeu Ctrl + Maj + Q per forçar la sortida immediata del joc aturant-ne el procés. NO es desa la partida ni es neteja l'estat del joc. Aneu amb compte!"
beBY = "Націсніце Ctrl + Shift + Q, каб неадкладна прымусова выйсці з гульні, завяршыўшы працэс гульні. БЕЗ ЗАХАВАННЯ і без ачысткі стану гульні. Будзьце асцярожныя!"
roRO = "Apasă Ctrl + Shift + Q pentru a forța ieșirea din joc imediat, prin oprirea procesului jocului. NU se salvează și nu se curăță starea jocului. Fii atent!"
huHU = "Nyomja meg a Ctrl + Shift + Q billentyűkombinációt, hogy a játékfolyamat leállításával azonnal kényszerítetten kilépjen a játékból. NINCS mentés és nincs játékállapot-takarítás. Legyen óvatos!"
arSA = "اضغط Ctrl + Shift + Q لفرض الخروج من اللعبة فورًا عن طريق إنهاء عملية اللعبة. لا يتم حفظ أي شيء ولا تُنظَّف حالة اللعبة. كن حذرًا!"

