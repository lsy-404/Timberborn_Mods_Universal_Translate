["AutoNames.Settings.AutoAutomateAlmostFull.Tooltip"]
raw = "Also wires producers to the counter. When you set a resource counter to a fill rate below a threshold (e.g. \"Planks not full\"), every building in its district that makes that good and has no automation input yet is connected to it, so it pauses while the stores are full. Counters set to a fill rate above a threshold (\"almost full\") are only on when full and are not used. Buildings placed later are not wired."
status = "normal"
enUS = "Also connects producers to the counter. When you set a resource counter to a fill rate below a threshold (e.g. \"Planks not full\"), every building in its district that produces that good and doesn't already have an automation input is connected to it, so it pauses while stores are full. Counters set to a fill rate above a threshold (\"almost full\") are only on when full and aren't used. Buildings placed later aren't connected."
zhCN = "还会将生产建筑连接到计数器。将资源计数器设置为低于某个阈值的填充率（例如“木板未满”）时，其所在城区内所有生产该资源且尚未接入自动化输入的建筑都会连接到该计数器，因此仓库满时它们会暂停。填充率设置为高于某个阈值（“即将满”）的计数器只有在仓库满时才会启用，因此不会被使用。之后放置的建筑不会接入自动化。"
zhTW = "此外，也會將生產建築連接到計數器。當你將資源計數器設為低於某個門檻的填滿率（例如「木板未滿」）時，該區域內所有生產該資源且尚未接上自動化輸入的建築都會連接到計數器，因此儲存空間滿了時便會暫停運作。設為高於某個門檻的填滿率（「快滿了」）的計數器只有在滿載時才會啟動，因此不會用到。之後放置的建築不會接上自動化線路。"
ruRU = "Также подключает производителей к счётчику. Если задать для счётчика ресурсов уровень заполнения ниже порогового (например, «Доски не заполнены»), к нему подключаются все здания в его районе, производящие этот ресурс и ещё не имеющие входа автоматизации, поэтому они приостанавливают работу, когда склады заполнены. Счётчики с уровнем заполнения выше порогового («почти заполнен») активны только при заполнении до максимума и не используются. Здания, размещённые позже, не подключаются."
jaJP = "生産施設もカウンターに接続します。資源カウンターの充填率をしきい値未満（例：「板材が満杯でない」）に設定すると、同じ地区にある、その資源を生産し、まだ自動化入力に接続されていないすべての建物がカウンターに接続され、倉庫が満杯の間は稼働を停止します。充填率をしきい値超過（「ほぼ満杯」）に設定したカウンターは、満杯のときだけオンになり、使用されません。後から配置した建物は接続されません。"
frFR = "Relie également les producteurs au compteur. Lorsque vous réglez un compteur de ressources sur un taux de remplissage inférieur à un seuil (par exemple, « Planches pas pleines »), chaque bâtiment de son district qui produit cette ressource et ne possède pas encore d’entrée d’automatisation y est connecté. Il se met alors en pause lorsque les réserves sont pleines. Les compteurs réglés sur un taux de remplissage supérieur à un seuil (« presque plein ») ne sont actifs que lorsque les réserves sont pleines et ne sont pas utilisés. Les bâtiments placés par la suite ne sont pas reliés."
deDE = "Verbindet auch Produzenten mit dem Zähler. Wenn du bei einem Ressourcenzähler eine Füllrate unterhalb eines Schwellenwerts einstellst (z. B. „Bretter nicht voll“), werden alle Gebäude in seinem Distrikt, die diese Ware herstellen und noch keinen Automatisierungseingang haben, damit verbunden. Sie pausieren also, solange die Lager voll sind. Zähler, bei denen eine Füllrate oberhalb eines Schwellenwerts eingestellt ist („fast voll“), sind nur aktiv, wenn sie voll sind, und werden nicht verwendet. Später platzierte Gebäude werden nicht verbunden."
plPL = "Łączy również producentów z licznikiem. Gdy ustawisz licznik zasobów na poziom zapełnienia poniżej progu (np. „Deski nie są pełne”), wszystkie budynki w jego dzielnicy, które produkują dany towar i nie mają jeszcze wejścia automatyzacji, zostaną z nim połączone, więc wstrzymają pracę, gdy zapasy się zapełnią. Liczniki ustawione na poziom zapełnienia powyżej progu („prawie pełne”) są aktywne tylko wtedy, gdy zapasy są pełne, i nie są używane. Budynki postawione później nie zostaną podłączone."
ptBR = "Também conecta os produtores ao contador. Quando você define um contador de recursos com uma taxa de preenchimento abaixo de um limite (por exemplo, “Tábuas não estão cheias”), todos os edifícios do distrito que produzem esse recurso e ainda não têm uma entrada de automação são conectados a ele, fazendo com que pausem quando os estoques estiverem cheios. Contadores definidos com uma taxa de preenchimento acima de um limite (“quase cheio”) só ficam ativos quando estão cheios e não são usados. Edifícios construídos posteriormente não são conectados."
koKR = "생산 건물도 카운터에 연결합니다. 자원 카운터를 임계값보다 낮은 채움 비율로 설정하면(예: \"널빤지가 가득 차지 않음\"), 해당 구역에서 그 자원을 생산하고 자동화 입력이 아직 없는 모든 건물이 카운터에 연결되어 저장고가 가득 차면 작동을 멈춥니다. 임계값보다 높은 채움 비율로 설정한 카운터(\"거의 가득 참\")는 가득 찼을 때만 켜지므로 사용되지 않습니다. 나중에 배치한 건물은 연결되지 않습니다."
csCZ = "Propojí s počítadlem také výrobní budovy. Když nastavíte počítadlo zdrojů na míru naplnění pod prahovou hodnotou (např. „Prkna nejsou plná“), připojí se k němu každá budova v jeho okrsku, která daný zdroj vyrábí a dosud nemá žádný vstup automatizace, takže se při plných zásobách pozastaví. Počítadla nastavená na míru naplnění nad prahovou hodnotou („téměř plné“) jsou aktivní pouze při plném stavu a nepoužívají se. Budovy umístěné později se nepřipojí."
viVN = "Đồng thời kết nối các cơ sở sản xuất với bộ đếm. Khi bạn đặt bộ đếm tài nguyên ở mức đầy dưới một ngưỡng (ví dụ: \"Ván chưa đầy\"), mọi công trình trong khu của nó sản xuất loại hàng đó và chưa có đầu vào tự động hóa sẽ được kết nối với bộ đếm, nhờ đó tạm dừng khi kho đã đầy. Các bộ đếm được đặt ở mức đầy trên một ngưỡng (\"gần đầy\") chỉ bật khi kho đầy và sẽ không được sử dụng. Các công trình được đặt sau đó sẽ không được kết nối."
trTR = "Ayrıca üreticileri sayaca bağlar. Bir kaynak sayacını bir eşik değerinin altındaki doluluk oranına ayarladığınızda (ör. \"Kereste dolu değil\"), bölgesinde bu ürünü üreten ve henüz otomasyon girişi olmayan her bina sayaca bağlanır; böylece depolar doluyken üretimi duraklar. Eşik değerinin üzerindeki doluluk oranına ayarlanan sayaçlar (\"neredeyse dolu\") yalnızca depo doluyken açıktır ve kullanılmaz. Daha sonra yerleştirilen binalar bağlanmaz."

