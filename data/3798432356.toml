["AutoNames.Settings.AutoAutomateCompleted.Tooltip"]
raw = "When a building finishes construction, and for every building on reset (when a save is loaded), the mod looks in the building's district for resource counters set to a fill rate below a threshold (e.g. \"Planks not full\") for a good the building produces. If there is exactly one such counter and the building has no automation input yet, the building is connected to it, so it pauses while the stores are full. With two or more matching counters nothing happens. Buildings that already have an input are never changed, and nothing is ever disconnected."
status = "normal"
enUS = "When a building finishes construction, and for every building on reset (when a save is loaded), the mod checks the building's district for resource counters set to a fill rate below a threshold (e.g. \"Planks not full\") for a good the building produces. If there is exactly one such counter and the building has no automation input yet, the building is connected to it, so it pauses while the stores are full. If two or more matching counters are found, nothing happens. Buildings that already have an input are never changed, and nothing is ever disconnected."
zhCN = "建筑完成建造时，以及每次重置时（加载存档时），此模组都会在该建筑所属的区内，查找针对该建筑所生产物品、填充率低于某个阈值的资源计数器（例如“木板未满”）。如果恰好找到一个这样的计数器，且该建筑尚无自动化输入，便会将建筑连接到该计数器，使建筑在库存满时暂停。如果找到两个或更多符合条件的计数器，则不会发生任何操作。已有输入的建筑绝不会被更改，也绝不会断开任何连接。"
zhTW = "建築完成時，以及每次重設時（載入存檔時），模組會在該建築所屬的區域中，尋找針對該建築所生產物品、填充率低於閾值的資源計數器（例如「木板未滿」）。如果符合條件的計數器恰好只有一個，且該建築尚無自動化輸入，便會將建築連接至該計數器，使其在儲存庫存滿時暫停。若有兩個或以上符合條件的計數器，則不會有任何動作。已有輸入的建築絕不會被更改，也不會解除任何連接。"
ruRU = "Когда строительство здания завершается, а также для каждого здания при сбросе (когда загружается сохранение), мод ищет в районе здания счётчики ресурсов, установленные на скорость заполнения ниже порогового значения (например, «Доски не заполнены») для ресурса, который производит это здание. Если такой счётчик ровно один, а у здания ещё нет входа автоматизации, здание подключается к нему и приостанавливает работу, когда запасы полны. Если подходящих счётчиков два или больше, ничего не происходит. Здания, у которых уже есть вход, никогда не изменяются, и подключения никогда не отключаются."
jaJP = "建物の建設が完了したとき、およびリセット時（セーブデータの読み込み時）に、建物が生産する資源について、補充率がしきい値を下回るよう設定された資源カウンター（例：「板材が満杯でない」）が建物の地区内にあるかを確認します。そのようなカウンターがちょうど1つあり、建物に自動化入力がまだない場合、建物をそのカウンターに接続し、倉庫が満杯の間は停止するようにします。一致するカウンターが2つ以上ある場合は何も起こりません。すでに入力がある建物は変更されず、接続が解除されることもありません。"
frFR = "Lorsqu’un bâtiment termine sa construction, et pour chaque bâtiment lors de la réinitialisation (au chargement d’une sauvegarde), le mod recherche dans le district du bâtiment des compteurs de ressources dont le taux de remplissage est inférieur à un seuil (par exemple, « Planches pas pleines ») pour une ressource produite par le bâtiment. S’il trouve exactement un compteur de ce type et que le bâtiment n’a pas encore d’entrée d’automatisation, il le relie à ce compteur afin que le bâtiment se mette en pause lorsque les stocks sont pleins. Si plusieurs compteurs correspondants sont trouvés, rien ne se passe. Les bâtiments qui ont déjà une entrée ne sont jamais modifiés, et aucun lien n’est jamais supprimé."
deDE = "Wenn der Bau eines Gebäudes abgeschlossen ist und bei jedem Gebäude beim Zurücksetzen (wenn ein Spielstand geladen wird), sucht der Mod im Bezirk des Gebäudes nach Ressourcenzählern, deren Füllrate unter einem Schwellenwert liegt (z. B. „Bretter nicht voll“), für ein Gut, das das Gebäude produziert. Gibt es genau einen solchen Zähler und hat das Gebäude noch keinen Automatisierungseingang, wird das Gebäude damit verbunden, sodass es pausiert, wenn die Lager voll sind. Bei zwei oder mehr passenden Zählern geschieht nichts. Gebäude, die bereits einen Eingang haben, werden niemals geändert, und es wird niemals eine Verbindung getrennt."
plPL = "Gdy budowa budynku dobiega końca oraz przy każdym resetowaniu (po wczytaniu zapisu) mod szuka w dzielnicy budynku liczników zasobów z ustawionym tempem napełniania poniżej progu (np. „Deski niepełne”) dla towaru produkowanego przez ten budynek. Jeśli znajdzie dokładnie jeden taki licznik, a budynek nie ma jeszcze wejścia automatyzacji, podłącza go do tego licznika, dzięki czemu budynek wstrzymuje pracę, gdy zapasy są pełne. Jeśli pasują co najmniej dwa liczniki, nic się nie dzieje. Budynki, które mają już wejście, nigdy nie są zmieniane, a żadne połączenie nie jest nigdy rozłączane."
ptBR = "Quando a construção de um edifício é concluída e, ao reiniciar (quando um jogo salvo é carregado), o mod procura, no distrito do edifício, contadores de recursos com uma taxa de enchimento abaixo de um limite (por exemplo, \"Tábuas não estão cheias\") para um recurso produzido pelo edifício. Se houver exatamente um contador assim e o edifício ainda não tiver uma entrada de automação, ele será conectado a esse contador, fazendo uma pausa enquanto os estoques estiverem cheios. Se houver dois ou mais contadores correspondentes, nada acontece. Edifícios que já têm uma entrada nunca são alterados, e nenhuma conexão é desfeita."
koKR = "건물 건설이 완료될 때마다, 그리고 초기화 시(저장된 게임을 불러올 때) 모든 건물에 대해, 모드는 해당 건물이 생산하는 자원 중 채움 비율이 임계값 미만으로 설정된 자원 카운터(예: \"널빤지 부족\")가 건물의 구역에 있는지 확인합니다. 이러한 카운터가 정확히 하나 있고 건물에 자동화 입력이 아직 없다면 건물을 해당 카운터에 연결하여 저장량이 가득 차면 작동을 멈추게 합니다. 조건에 맞는 카운터가 두 개 이상이면 아무 작업도 하지 않습니다. 입력이 이미 있는 건물은 변경되지 않으며, 연결이 해제되는 일도 없습니다."
csCZ = "Po dokončení stavby a u každé stavby při resetu (po načtení uložené hry) mod vyhledá v jejím okrsku počítadla surovin s nastavenou rychlostí doplňování pod určitou hranicí (např. „Prkna nejsou plná“) pro surovinu, kterou stavba vyrábí. Pokud takové počítadlo existuje přesně jedno a stavba zatím nemá vstup automatizace, stavba se k němu připojí, takže se pozastaví, když jsou zásoby plné. Pokud odpovídající počítadla existují dvě nebo více, nic se nestane. U staveb, které už mají vstup, se nikdy nic nemění a žádné připojení se nikdy neodpojí."
viVN = "Khi một công trình xây xong, và với mỗi công trình khi đặt lại (khi tải một bản lưu), mod sẽ tìm trong quận của công trình các bộ đếm tài nguyên có mức lấp đầy được đặt thấp hơn một ngưỡng (ví dụ: \"Ván gỗ chưa đầy\") đối với một loại hàng hóa mà công trình sản xuất. Nếu có chính xác một bộ đếm như vậy và công trình chưa có đầu vào tự động hóa, công trình sẽ được kết nối với bộ đếm đó, nhờ vậy tạm dừng khi kho đã đầy. Nếu có từ hai bộ đếm phù hợp trở lên thì sẽ không có gì xảy ra. Công trình đã có đầu vào sẽ không bao giờ bị thay đổi, và sẽ không bao giờ bị ngắt kết nối."
trTR = "Bir binanın inşaatı tamamlandığında ve sıfırlama sırasında (kayıt yüklendiğinde) mod, binanın ürettiği bir mal için dolum oranı bir eşik değerin altında ayarlanmış kaynak sayaçlarını (ör. “Keresteler dolu değil”) binanın bulunduğu bölgede arar. Tam olarak böyle bir sayaç varsa ve binanın henüz bir otomasyon girişi yoksa bina bu sayaca bağlanır; böylece stoklar doluyken üretimi duraklatır. Eşleşen iki veya daha fazla sayaç varsa hiçbir şey olmaz. Zaten girişi olan binalar hiçbir zaman değiştirilmez ve hiçbir bağlantı kesilmez."
