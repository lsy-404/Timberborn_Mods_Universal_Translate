["AutoNames.Settings.AutoAutomateAlmostFull.Tooltip"]
status = "normal"
raw = "Also wires producers to the counter. When you set a resource counter to a fill rate below a threshold (e.g. \"Planks not full\"), every building in its district that makes that good and has no automation input yet is connected to it, so it pauses while the stores are full. Counters set to a fill rate above a threshold (\"almost full\") are only on when full and are not used. Buildings placed later are not wired."
enUS = "Also connects producers to the counter. When you set a resource counter to a fill rate below a threshold (e.g. \"Planks not full\"), every building in its district that produces that good and has no automation input yet is connected to it, so it pauses while stocks are full. Counters set to a fill rate above a threshold (\"almost full\") are only on when full and are not used. Buildings placed later are not connected."
zhCN = "还会将生产建筑连接到计数器。当你将资源计数器设为低于某个阈值的填充率（例如“木板未满”）时，该区中所有生产该资源且尚未接入自动化输入的建筑都会连接到计数器，因此储备充足时它们会暂停。设为高于某个阈值的填充率（“接近满仓”）的计数器只有在满仓时才会开启，因此不会被使用。之后放置的建筑不会接入。"
zhTW = "也會將生產建築連接到計數器。當你將資源計數器設為低於閾值的填滿率（例如「木板未滿」）時，該區域內所有生產該資源且尚未連接自動化輸入的建築都會連接到計數器，因此庫存滿時便會暫停生產。設為高於閾值的填滿率（「即將滿載」）的計數器只會在庫存滿時啟動，不會用於此功能。之後放置的建築不會連接。"
ruRU = "Также подключает производственные здания к счётчику. Если задать счётчику ресурса уровень заполнения ниже порога (например, «Досок недостаточно»), к нему подключится каждое здание в его районе, производящее этот ресурс и ещё не подключённое к автоматизации. Такие здания будут останавливаться, когда склады заполнены. Счётчики с уровнем заполнения выше порога («почти заполнено») включаются только при заполнении до конца и не используются. Здания, размещённые позднее, подключены не будут."
jaJP = "生産施設もカウンターに接続します。資源カウンターをしきい値未満の充填率（例：「板材が満杯でない」）に設定すると、同じ地区にあるその資源を生産し、まだ自動化入力に接続されていないすべての建物がカウンターに接続され、倉庫が満杯の間は稼働を一時停止します。しきい値を超える充填率（「ほぼ満杯」）に設定されたカウンターは、満杯のときだけオンになり、使用されません。後から配置した建物は接続されません。"
frFR = "Relie également les producteurs au compteur. Lorsque vous réglez un compteur de ressources sur un taux de remplissage inférieur à un seuil (par ex. « Planches pas pleines »), chaque bâtiment de son district qui produit cette ressource et qui n’a pas encore d’entrée d’automatisation y est relié ; il se met donc en pause lorsque les réserves sont pleines. Les compteurs réglés sur un taux de remplissage supérieur à un seuil (« presque plein ») ne sont utilisés que lorsque les réserves sont pleines et ne sont pas reliés. Les bâtiments placés par la suite ne sont pas reliés."
deDE = "Verbindet auch Produzenten mit dem Zähler. Wenn du für einen Ressourcen-Zähler eine Füllrate unterhalb eines Schwellenwerts einstellst (z. B. „Bretter nicht voll“), wird jedes Gebäude in seinem Bezirk, das diese Ware herstellt und noch keinen Automatisierungseingang hat, mit ihm verbunden. Dadurch pausiert es, solange die Lager voll sind. Zähler, bei denen eine Füllrate oberhalb eines Schwellenwerts eingestellt ist („fast voll“), sind nur dann aktiv, wenn sie voll sind, und werden nicht verwendet. Später platzierte Gebäude werden nicht verbunden."
plPL = "Łączy też producentów z licznikiem. Gdy ustawisz licznik zasobów na poziom zapełnienia poniżej progu (np. „Deski nie są pełne”), każdy budynek w jego dzielnicy, który wytwarza dany towar i nie ma jeszcze wejścia automatyzacji, zostanie z nim połączony, dzięki czemu zatrzyma się, gdy zapasy będą pełne. Liczniki ustawione na poziom zapełnienia powyżej progu („prawie pełne”) są aktywne tylko wtedy, gdy zapasy są pełne, więc nie są używane. Budynki postawione później nie zostaną połączone."
ptBR = "Também conecta os produtores ao contador. Quando você configura um contador de recursos para uma taxa de enchimento abaixo de um limite (por exemplo, “Tábuas não estão cheias”), todos os edifícios do distrito que produzem esse recurso e ainda não têm uma entrada de automação são conectados a ele, então pausam quando os estoques estão cheios. Contadores configurados para uma taxa de enchimento acima de um limite (“quase cheio”) só ficam ativos quando estão cheios e não são usados. Edifícios colocados depois não são conectados."
koKR = "생산 시설도 카운터에 연결합니다. 자원 카운터를 기준치보다 낮은 충전율로 설정하면(예: “널빤지 부족”), 해당 구역에서 그 물품을 생산하며 아직 자동화 입력이 없는 모든 건물이 카운터에 연결되어 저장량이 가득 찼을 때 작동을 멈춥니다. 기준치보다 높은 충전율(“거의 가득 참”)로 설정한 카운터는 가득 찼을 때만 켜지므로 사용되지 않습니다. 나중에 배치한 건물은 연결되지 않습니다."
csCZ = "Také propojí výrobce s počítadlem. Když nastavíte počítadlo surovin na míru naplnění pod prahem (např. „Prkna nejsou plná“), propojí se s ním každá budova v jeho oblasti, která dané zboží vyrábí a ještě nemá vstup automatizace, takže se pozastaví, když jsou zásoby plné. Počítadla nastavená na míru naplnění nad prahem („téměř plné“) jsou aktivní pouze při plném stavu a nepoužívají se. Později umístěné budovy se nepropojí."
viVN = "Đồng thời kết nối các công trình sản xuất với bộ đếm. Khi bạn đặt bộ đếm tài nguyên ở mức đầy thấp hơn ngưỡng (ví dụ: \"Ván gỗ chưa đầy\"), mọi công trình trong khu vực của nó sản xuất loại hàng hóa đó và chưa có đầu vào tự động hóa sẽ được kết nối với bộ đếm, vì vậy chúng sẽ tạm dừng khi kho đã đầy. Các bộ đếm được đặt ở mức đầy cao hơn ngưỡng (\"gần đầy\") chỉ bật khi đầy và không được sử dụng. Các công trình được đặt sau đó sẽ không được kết nối."
trTR = "Üreticileri de sayaca bağlar. Bir kaynak sayacını eşik değerinin altında bir doluluk oranına ayarladığınızda (ör. “Keresteler dolu değil”), o bölgede bu kaynağı üreten ve henüz otomasyon girişine bağlı olmayan her bina sayaca bağlanır; böylece depolar doluyken üretimi durdururlar. Eşik değerinin üzerinde bir doluluk oranına ayarlanan sayaçlar (“neredeyse dolu”) yalnızca depolar doluyken açıktır ve kullanılmaz. Daha sonra yerleştirilen binalar kablolanmaz."

