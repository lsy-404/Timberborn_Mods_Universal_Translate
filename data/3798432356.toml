["AutoNames.Settings.AutoAutomateCompleted.Tooltip"]
status = "normal"
raw = "When a building finishes construction, and for every building on reset (when a save is loaded), the mod looks in the building's district for resource counters set to a fill rate below a threshold (e.g. \"Planks not full\") for a good the building produces. If there is exactly one such counter and the building has no automation input yet, the building is connected to it, so it pauses while the stores are full. With two or more matching counters nothing happens. Buildings that already have an input are never changed, and nothing is ever disconnected."
enUS = "When a building finishes construction, and for every building during reset (when a save is loaded), the mod looks in the building's district for resource counters set to a fill rate below a threshold (e.g. \"Planks not full\") for a good the building produces. If there is exactly one such counter and the building doesn't already have an automation input, the building is connected to it, so it pauses while the stores are full. If there are two or more matching counters, nothing happens. Buildings that already have an input are never changed, and nothing is ever disconnected."
zhCN = "建筑完成建造时，以及重置时（加载存档时），模组会在该建筑所在的区内查找针对该建筑所生产商品的资源计数器，这些计数器的填充率设定低于某个阈值（例如“木板未满”）。如果恰好找到一个这样的计数器，且建筑尚无自动化输入，建筑就会连接到该计数器，以便在库存满时暂停。如果找到两个或更多符合条件的计数器，则不会进行任何操作。已经有输入的建筑绝不会被更改，也绝不会断开任何连接。"
zhTW = "建築完成時，以及每次重設時（載入存檔時），模組會在建築所在的區域中，搜尋建築所生產的物品是否有資源計數器，其填充率設在低於某個門檻（例如「木板未滿」）。如果符合條件的計數器恰好只有一個，而且建築尚無自動化輸入，便會將建築連接至該計數器，使其在庫存已滿時暫停。若有兩個或更多符合條件的計數器，則不會進行任何操作。已有輸入的建築絕不會被更改，也絕不會解除任何連接。"
ruRU = "Когда строительство здания завершается, а также при сбросе настроек каждого здания (при загрузке сохранения) мод проверяет, есть ли в районе здания счётчик ресурса, установленный на заполнение ниже порогового значения (например, «Доски не заполнены»), для ресурса, который производит это здание. Если такой счётчик ровно один и у здания ещё нет входа автоматизации, мод подключает его к этому счётчику, чтобы здание приостанавливалось, когда запасы заполнены. Если подходящих счётчиков два или больше, ничего не происходит. Здания, у которых уже есть вход, никогда не меняются, и никакие подключения никогда не отключаются."
jaJP = "建物の建設が完了したとき、およびリセット時（セーブデータの読み込み時）に、MODは建物の地区内で、その建物が生産する品目について、補充率がしきい値を下回るように設定された資源カウンター（例：「板材が満杯でない」）を探します。そのようなカウンターがちょうど1つあり、建物にまだ自動化入力が接続されていない場合、建物をそのカウンターに接続し、保管場所が満杯の間は建物が停止するようにします。一致するカウンターが2つ以上ある場合は、何も起こりません。すでに入力がある建物は変更されず、接続が解除されることもありません。"
frFR = "Lorsqu’un bâtiment termine sa construction, ainsi que pour chaque bâtiment lors d’une réinitialisation (au chargement d’une sauvegarde), le mod recherche, dans le district du bâtiment, les compteurs de ressources dont le taux de remplissage est inférieur à un seuil (par exemple, « Planches pas pleines ») pour une ressource produite par le bâtiment. S’il existe exactement un compteur correspondant et que le bâtiment n’a pas encore d’entrée d’automatisation, le bâtiment y est connecté et se met en pause lorsque les stocks sont pleins. S’il existe au moins deux compteurs correspondants, rien ne se passe. Les bâtiments qui ont déjà une entrée ne sont jamais modifiés, et aucune connexion n’est jamais supprimée."
deDE = "Wenn ein Gebäude fertiggestellt wird und bei jedem Zurücksetzen (also beim Laden eines Spielstands) sucht der Mod im Bezirk des Gebäudes nach Ressourcenzählern, deren Füllrate unter einem Schwellenwert liegt (z. B. „Bretter nicht voll“) und die eine Ware zählen, die das Gebäude produziert. Gibt es genau einen solchen Zähler und hat das Gebäude noch keinen Automatisierungseingang, wird das Gebäude damit verbunden, sodass es pausiert, solange die Lager voll sind. Bei zwei oder mehr passenden Zählern geschieht nichts. Gebäude, die bereits einen Eingang haben, werden niemals geändert, und es wird niemals etwas getrennt."
plPL = "Gdy budowa budynku zostanie ukończona oraz dla każdego budynku po zresetowaniu (przy wczytywaniu zapisu), mod szuka w dzielnicy budynku liczników zasobów z ustawioną szybkością napełniania poniżej progu (np. „Deski niepełne”) dla dobra produkowanego przez ten budynek. Jeśli jest dokładnie jeden taki licznik, a budynek nie ma jeszcze wejścia automatyzacji, zostaje z nim połączony, dzięki czemu wstrzymuje pracę, gdy zapasy są pełne. Jeśli pasują co najmniej dwa liczniki, nic się nie dzieje. Budynki, które mają już wejście, nigdy nie są zmieniane, a żadne połączenie nigdy nie zostaje rozłączone."
ptBR = "Quando a construção de um edifício é concluída e, para cada edifício, ao reiniciar (quando um jogo salvo é carregado), o mod procura no distrito do edifício contadores de recursos configurados com uma taxa de abastecimento abaixo de um limite (por exemplo, “Tábuas não estão cheias”) para um recurso produzido pelo edifício. Se houver exatamente um contador correspondente e o edifício ainda não tiver uma entrada de automação, ele será conectado a esse contador e fará uma pausa enquanto os estoques estiverem cheios. Se houver dois ou mais contadores correspondentes, nada acontece. Edifícios que já têm uma entrada nunca são alterados, e nada é desconectado."
koKR = "건물 건설이 완료될 때마다, 그리고 초기화 시(저장된 게임을 불러올 때) 모든 건물에 대해, 모드는 건물의 구역에서 해당 건물이 생산하는 물품의 자원 카운터를 찾습니다. 이때 카운터의 채우기 비율은 임계값보다 낮게 설정되어 있어야 합니다(예: “판자가 가득 차지 않음”). 일치하는 카운터가 정확히 하나이고 건물에 자동화 입력이 아직 없다면, 건물을 해당 카운터에 연결하여 저장고가 가득 찼을 때 건물이 멈추게 합니다. 일치하는 카운터가 둘 이상이면 아무 일도 일어나지 않습니다. 이미 입력이 있는 건물은 절대 변경되지 않으며, 연결을 해제하는 일도 없습니다."
csCZ = "Po dokončení stavby a při každém resetu (po načtení uložené hry) mod v okrsku stavby vyhledá počítadla surovin nastavená na úroveň naplnění pod určitou hranicí (např. „Prkna nejsou plná“) pro surovinu, kterou stavba vyrábí. Pokud takové počítadlo existuje právě jedno a stavba zatím nemá žádný vstup automatizace, stavba se k němu připojí, takže se pozastaví, když jsou zásoby plné. Pokud odpovídají dvě nebo více počítadel, nic se nestane. Stavby, které už vstup mají, se nikdy nezmění a žádné připojení se nikdy neodpojí."
viVN = "Khi một công trình xây xong, và với mỗi công trình khi khởi động lại (khi tải bản lưu), bản mod sẽ tìm trong khu vực của công trình các bộ đếm tài nguyên có tốc độ lấp đầy được đặt dưới một ngưỡng nhất định (ví dụ: “Ván chưa đầy”) cho một loại hàng hóa mà công trình đó sản xuất. Nếu có đúng một bộ đếm như vậy và công trình chưa có đầu vào tự động hóa, công trình sẽ được kết nối với bộ đếm đó để tạm dừng khi kho đã đầy. Nếu có từ hai bộ đếm phù hợp trở lên thì sẽ không có gì xảy ra. Các công trình đã có đầu vào sẽ không bao giờ bị thay đổi, và sẽ không bao giờ có kết nối nào bị ngắt."
trTR = "Bir binanın inşaatı tamamlandığında ve her sıfırlamada (kayıt yüklendiğinde), mod binanın bölgesinde, binanın ürettiği bir mal için dolum oranı eşik değerin altında olacak şekilde ayarlanmış kaynak sayaçlarını (ör. “Kalastan stok dolu değil”) arar. Tam olarak böyle bir sayaç varsa ve binada henüz otomasyon girişi yoksa bina bu sayaca bağlanır; böylece stoklar doluyken üretimi duraklar. Eşleşen iki veya daha fazla sayaç varsa hiçbir şey olmaz. Zaten otomasyon girişi olan binalar asla değiştirilmez ve hiçbir bağlantı asla kesilmez."
