csCZ = "Automaticky automatizovat dokončené budovy (a všechny budovy po resetu) pomocí existující automatizace „Zdroj není plný“ v jejich okrsku"
viVN = "Tự động thiết lập tự động hóa cho các công trình đã hoàn thành (và mọi công trình khi đặt lại) bằng cách sử dụng tự động hóa “Tài nguyên chưa đầy” hiện có trong khu của chúng"
