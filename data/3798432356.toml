["AutoNames.Settings.AutoAutomateAlmostFull"]
new = "Auto-Automate Buildings when creating Resource Almost Full automations"
status = "normal"

["AutoNames.Settings.AutoAutomateAlmostFull.Tooltip"]
new = "Also wires producers to the counter. When you set a resource counter to a fill rate below a threshold (e.g. \"Planks not full\"), every building in its district that makes that good and has no automation input yet is connected to it, so it pauses while the stores are full. Counters set to a fill rate above a threshold (\"almost full\") are only on when full and are not used. Buildings placed later are not wired."
status = "normal"

["AutoNames.Settings.AutoAutomateCompleted"]
new = "Auto-Automate completed buildings (and every building on reset) using an existing 'Resource Not Full' automation in their district"
status = "normal"

["AutoNames.Settings.AutoAutomateCompleted.Tooltip"]
new = "When a building finishes construction, and for every building on reset (when a save is loaded), the mod looks in the building's district for resource counters set to a fill rate below a threshold (e.g. \"Planks not full\") for a good the building produces. If there is exactly one such counter and the building has no automation input yet, the building is connected to it, so it pauses while the stores are full. With two or more matching counters nothing happens. Buildings that already have an input are never changed, and nothing is ever disconnected."
status = "normal"
