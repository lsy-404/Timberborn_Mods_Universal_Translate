["academicunwinds.MOM.Settings.DirtPerBlock.Tooltip"]
raw = "How much Dirt each finished dig drops next to the hole for builders to collect. Builders collect it the same way as demolition leftovers."
status = "normal"
enUS = "How much Dirt each completed dig drops next to the hole for builders to collect. Builders collect it the same way as demolition leftovers."
zhCN = "每次挖掘完成后，会在坑洞旁留下多少泥土供建造者收集。建造者收集泥土的方式与收集拆除遗留物相同。"
zhTW = "每完成一次挖掘，會在洞旁留下多少泥土供建築工收集。建築工收集泥土的方式與收集拆除後的剩餘物相同。"
ruRU = "Сколько земли оставляет каждый завершённый раскоп рядом с ямой, чтобы строители могли её собрать. Строители собирают её так же, как остатки после сноса."
jaJP = "掘削が完了するたびに、穴の隣に建築者が回収できるように落とされる土の量。建築者は、解体後の残骸と同じ方法で回収します。"
frFR = "Quantité de terre déposée à côté du trou après chaque excavation terminée, que les constructeurs peuvent ramasser. Ils la ramassent comme les débris de démolition."
deDE = "Wie viel Erde bei jedem abgeschlossenen Abbau neben dem Loch abgelegt wird, damit Bauarbeiter sie aufsammeln können. Bauarbeiter sammeln sie genauso auf wie die Überreste eines Abrisses."
plPL = "Ile ziemi pozostawia każde ukończone kopanie obok dołu, aby budowniczowie mogli ją zebrać. Budowniczowie zbierają ją tak samo jak pozostałości po rozbiórce."
ptBR = "Quanto de Terra cada escavação concluída deixa ao lado do buraco para os construtores coletarem. Os construtores coletam essa terra da mesma forma que os restos da demolição."
koKR = "굴착이 완료될 때마다 구멍 옆에 떨어져 건설가가 수거할 수 있는 흙의 양입니다. 건설가는 철거 잔해와 같은 방식으로 흙을 수거합니다."
csCZ = "Kolik hlíny zanechá každý dokončený výkop vedle jámy, aby ji mohli stavitelé posbírat. Stavitelé ji sbírají stejně jako zbytky po demolici."
viVN = "Mỗi lần đào xong, thợ đào để lại bao nhiêu Đất cạnh hố để thợ xây thu gom. Thợ xây thu gom đất này theo cách tương tự như phế liệu còn lại sau khi phá dỡ."
trTR = "Her tamamlanan kazının, inşaatçıların toplaması için çukurun yanına ne kadar Toprak bıraktığı. İnşaatçılar bunu yıkım artıklarını topladıkları şekilde toplar."

