trTR = "Arazi bloğunu koru"

["academicunwinds.MOM.Settings.KeepTerrainBlock.Tooltip"]
status = "normal"
raw = "Keep the terrain block instead of removing it; the block is never removed and the flag re-arms itself after every dig, so with this on you may dig under paths and buildings safely."
enUS = "Keep the terrain block instead of removing it. The block is never removed, and the flag re-arms itself after every dig, so with this enabled, you can safely dig under paths and buildings."
zhCN = "保留地形方块，而不是将其移除；该方块永远不会被移除，且每次挖掘后标记都会自动重新启用，因此开启此选项后，你可以安全地在道路和建筑下方挖掘。"
zhTW = "保留地形方塊而不將其移除；方塊永遠不會被移除，而且每次挖掘後旗標都會自行重新啟用，因此開啟此選項後，你可以安全地在道路和建築物下方挖掘。"
ruRU = "Оставляйте блок грунта на месте, а не удаляйте его: блок никогда не исчезает, а флажок снова устанавливается после каждой выемки грунта. С этой настройкой можно безопасно копать под дорожками и зданиями."
jaJP = "地形ブロックを取り除かずに残します。ブロックは決して取り除かれず、掘削のたびにフラグが再設定されるため、これを有効にすると、道や建物の下を安全に掘ることができます。"
frFR = "Conservez le bloc de terrain au lieu de le retirer ; le bloc n'est jamais retiré et le drapeau se réarme après chaque excavation. Ainsi, avec cette option activée, vous pouvez creuser sous les chemins et les bâtiments sans danger."
deDE = "Der Gelände-Block bleibt erhalten, statt entfernt zu werden; er wird nie entfernt und die Markierung wird nach jedem Graben automatisch wieder aktiviert. Damit kannst du sicher unter Wegen und Gebäuden graben."
plPL = "Zachowuje blok terenu zamiast go usuwać; blok nigdy nie jest usuwany, a przełącznik aktywuje się ponownie po każdym wykopaniu, więc po włączeniu tej opcji można bezpiecznie kopać pod ścieżkami i budynkami."
ptBR = "Mantenha o bloco de terreno em vez de removê-lo; o bloco nunca é removido e a opção é reativada após cada escavação. Assim, com essa opção ativada, você pode escavar sob caminhos e edifícios com segurança."
koKR = "지형 블록을 제거하지 않고 유지합니다. 블록은 절대 제거되지 않으며, 땅을 팔 때마다 플래그가 다시 활성화되므로 이 옵션을 켜면 길과 건물 아래를 안전하게 팔 수 있습니다."
csCZ = "Ponechá blok terénu místo jeho odstranění; blok se nikdy neodstraní a příznak se po každém vykopání znovu aktivuje, takže při zapnutém nastavení můžete bezpečně kopat pod cestami a budovami."
viVN = "Giữ lại khối địa hình thay vì loại bỏ nó; khối này không bao giờ bị loại bỏ và cờ sẽ tự kích hoạt lại sau mỗi lần đào, nên khi bật tùy chọn này, bạn có thể đào bên dưới đường đi và các công trình một cách an toàn."
trTR = "Arazi bloğunu kaldırmak yerine yerinde tutun; blok hiçbir zaman kaldırılmaz ve bayrak her kazıdan sonra yeniden etkinleşir. Bu ayar açıkken yolların ve binaların altını güvenle kazabilirsiniz."

