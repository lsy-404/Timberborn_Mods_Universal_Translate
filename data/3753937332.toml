["academicunwinds.MOM.Settings.DirtPerBlock.Tooltip"]
status = "normal"
raw = "How much Dirt each finished dig drops next to the hole for builders to collect. Builders collect it the same way as demolition leftovers."
enUS = "How much Dirt each completed dig drops next to the hole for builders to collect. Builders collect it the same way as demolition leftovers."
zhCN = "每挖完一块，会在坑边留下多少泥土供建造者收集。建造者收集这些泥土的方式与收集拆除遗留物相同。"
zhTW = "每完成一次挖掘，會在洞穴旁掉落多少泥土供建築工收集。建築工收集泥土的方式與收集拆除後的殘料相同。"
ruRU = "Сколько земли остаётся рядом с ямой после каждого завершённого раскопа, чтобы строители могли её собрать. Строители собирают её так же, как остатки после сноса."
jaJP = "掘削が1回完了するごとに、穴の隣に建設作業員が回収できる土がどれだけ落ちるかを示します。建設作業員は、解体後の残骸と同じ方法で回収します。"
frFR = "Quantité de terre déposée à côté du trou par chaque excavation terminée, à récupérer par les constructeurs. Ceux-ci la récupèrent comme les débris laissés par une démolition."
deDE = "Wie viel Erde jeder abgeschlossene Abbau neben dem Loch abwirft, damit Bauarbeiter sie einsammeln können. Bauarbeiter sammeln sie genauso ein wie die Überreste eines Abrisses."
plPL = "Ile ziemi pozostawia każde ukończone kopanie obok dołu, aby budowniczowie mogli ją zebrać. Budowniczowie zbierają ją tak samo jak pozostałości po rozbiórce."
ptBR = "Quanto de Terra cada escavação concluída deixa ao lado do buraco para os construtores coletarem. Os construtores a coletam da mesma forma que os restos de demolição."
koKR = "완료된 굴착 작업마다 구멍 옆에 건축가가 수거할 흙이 얼마나 떨어지는지 나타냅니다. 건축가는 철거 잔해와 같은 방식으로 흙을 수거합니다."
csCZ = "Kolik hlíny zanechá každé dokončené kopání vedle jámy, aby ji mohli stavitelé sebrat. Stavitelé ji sbírají stejně jako zbytky po demolici."
viVN = "Mỗi lần đào xong, có bao nhiêu Đất được thả cạnh hố để thợ xây thu gom. Thợ xây thu gom số Đất này giống như phế liệu còn lại sau khi phá dỡ."
trTR = "Tamamlanan her kazının, inşaatçıların toplaması için deliğin yanına ne kadar Toprak bıraktığı. İnşaatçılar bunu yıkım artıklarını topladıkları şekilde toplar."

