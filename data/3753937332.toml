["academicunwinds.MOM.Building.ExcavationFlag.Description"]
raw = "Mark a terrain block for removal. A builder hauls a pickaxe over and digs the block out. The pickaxe is consumed by the dig and the tile is clear once it finishes."
status = "normal"
enUS = "Mark a terrain block for removal. A builder brings a pickaxe and digs out the block. The pickaxe is consumed by the digging, and the tile is clear when the work is done."
zhCN = "标记一个地形方块以便移除。建筑工会带着镐前来挖掉该方块。挖掘时会消耗这把镐，挖掘完成后，该地块便会清空。"
zhTW = "標記要移除的地形方塊。建造者會帶著十字鎬前來，挖除該方塊。挖掘時會消耗十字鎬，完成後該地塊便會清空。"
ruRU = "Отметьте блок рельефа для удаления. Строитель принесёт кирку и выкопает блок. Кирка израсходуется при раскопке, а после её завершения клетка будет расчищена."
jaJP = "撤去する地形ブロックを指定します。建築者がつるはしを運んできて、ブロックを掘り出します。掘削時につるはしは消費され、完了するとタイルが空きます。"
frFR = "Marque un bloc de terrain à retirer. Un constructeur vient avec une pioche et creuse le bloc. La pioche est consommée pendant le creusement et la case est dégagée une fois le travail terminé."
deDE = "Markiert einen Terrainblock zum Entfernen. Ein Bauarbeiter bringt eine Spitzhacke herbei und gräbt den Block aus. Die Spitzhacke wird beim Ausgraben verbraucht, und das Feld ist danach frei."
plPL = "Oznacz blok terenu do usunięcia. Budowniczy przynosi kilof i wykopuje blok. Kilof zostaje zużyty podczas kopania, a po jego zakończeniu pole jest oczyszczone."
ptBR = "Marque um bloco de terreno para remoção. Um construtor leva uma picareta até o local e escava o bloco. A picareta é consumida durante a escavação, e o espaço fica livre quando ela termina."
koKR = "제거할 지형 블록을 지정합니다. 건설자가 곡괭이를 가져와 블록을 파냅니다. 굴착이 끝나면 곡괭이는 소모되고 해당 타일은 비워집니다."
csCZ = "Označte terénní blok k odstranění. Stavitel k němu donese krumpáč a blok vykope. Krumpáč se při kopání spotřebuje a po jeho dokončení je dlaždice volná."
viVN = "Đánh dấu một khối địa hình để dỡ bỏ. Thợ xây mang cuốc đến và đào khối đó lên. Cuốc sẽ bị tiêu hao khi đào, và ô đất sẽ trống sau khi hoàn tất."
trTR = "Kaldırılacak bir arazi bloğunu işaretleyin. Bir inşaatçı kazmayı getirip bloğu kazarak çıkarır. Kazma kazı sırasında tüketilir ve işlem tamamlandığında karo temizlenmiş olur."

