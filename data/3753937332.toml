["academicunwinds.MOM.Settings.KeepTerrainBlock.Tooltip"]
raw = "Keep the terrain block instead of removing it; the block is never removed and the flag re-arms itself after every dig, so with this on you may dig under paths and buildings safely."
status = "normal"
enUS = "Keep the terrain block instead of removing it. The block is never removed, and the flag re-arms itself after every dig, so with this enabled, you can safely dig under paths and buildings."
zhCN = "保留地形方块，不将其移除；该方块永远不会被移除，而且每次挖掘后标记都会自动重新启用，因此开启此选项后，可以安全地在道路和建筑下方挖掘。"
zhTW = "保留地形方塊，不要將其移除；方塊永遠不會被移除，而且每次挖掘後旗標都會自動重新啟用，因此開啟此選項後，你可以放心在道路和建築物下方挖掘。"
ruRU = "Оставляет блок грунта на месте, а не удаляет его: блок никогда не удаляется, а флаг снова активируется после каждой раскопки. С этой настройкой можно безопасно копать под дорожками и зданиями."
jaJP = "地形ブロックを取り除かずに残します。ブロックは決して取り除かれず、掘削のたびにフラグが再設定されるため、この設定を有効にすると、道や建物の下を安全に掘ることができます。"
frFR = "Conserve le bloc de terrain au lieu de le retirer ; il n’est jamais retiré et le drapeau se réarme après chaque excavation. Cette option permet donc de creuser sous les chemins et les bâtiments sans risque."
deDE = "Behalte den Terrainblock, statt ihn zu entfernen. Der Block wird nie entfernt, und die Markierung wird nach jedem Abbauvorgang erneut aktiviert. Mit dieser Einstellung kannst du sicher unter Wegen und Gebäuden graben."
plPL = "Zachowuje blok terenu zamiast go usuwać; blok nigdy nie jest usuwany, a flaga uzbraja się ponownie po każdym kopaniu, więc po włączeniu tej opcji można bezpiecznie kopać pod ścieżkami i budynkami."
ptBR = "Mantenha o bloco de terreno em vez de removê-lo; o bloco nunca é removido, e a opção se reativa após cada escavação. Assim, com ela ativada, você pode escavar com segurança sob caminhos e edifícios."
koKR = "지형 블록을 제거하지 않고 그대로 둡니다. 블록은 절대 제거되지 않으며, 땅을 팔 때마다 플래그가 다시 활성화됩니다. 따라서 이 설정을 켜면 길과 건물 아래를 안전하게 팔 수 있습니다."
csCZ = "Ponechá terénní blok na místě, místo aby ho odstranil; blok se nikdy neodstraní a příznak se po každém kopání znovu aktivuje, takže s touto volbou můžete bezpečně kopat pod cestami a budovami."
viVN = "Giữ lại khối địa hình thay vì xóa nó; khối này không bao giờ bị xóa và cờ sẽ tự kích hoạt lại sau mỗi lần đào, nên bật tùy chọn này sẽ giúp bạn đào bên dưới đường đi và công trình một cách an toàn."
trTR = "Arazi bloğunu kaldırmak yerine yerinde tutar; blok hiçbir zaman kaldırılmaz ve her kazıdan sonra bayrak kendini yeniden etkinleştirir. Bu seçenek açıkken yolların ve binaların altını güvenle kazabilirsiniz."

