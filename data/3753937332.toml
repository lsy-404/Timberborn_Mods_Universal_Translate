["academicunwinds.MOM.Building.ExcavationFlag.Description"]
status = "normal"
raw = "Mark a terrain block for removal. A builder hauls a pickaxe over and digs the block out. The pickaxe is consumed by the dig and the tile is clear once it finishes."
enUS = "Mark a terrain block for removal. A builder brings a pickaxe and digs out the block. The pickaxe is consumed during digging, and the tile is clear when the work is finished."
zhCN = "标记一块地形方块以便移除。建筑工会带上镐子前来挖出该方块。挖掘时会消耗镐子，挖掘完成后该地块便会清空。"
zhTW = "標記要移除的地形方塊。建築工會帶著十字鎬前來，挖出方塊。挖掘時會消耗十字鎬，完成後該格便會清空。"
ruRU = "Пометьте блок ландшафта для удаления. Строитель принесёт кирку и выкопает блок. Кирка израсходуется при копке, а после её завершения клетка будет свободна."
jaJP = "撤去する地形ブロックに印を付けます。建築者がつるはしを運んできて、ブロックを掘り出します。掘削でつるはしは消費され、完了するとタイルが空になります。"
frFR = "Marquez un bloc de terrain à enlever. Un constructeur apporte une pioche et dégage le bloc. La pioche est consommée pendant le creusement, et la case est dégagée une fois l’opération terminée."
deDE = "Markiert einen Geländeblock zum Entfernen. Ein Bauarbeiter bringt eine Spitzhacke herbei und gräbt den Block aus. Die Spitzhacke wird beim Graben verbraucht, und sobald der Vorgang abgeschlossen ist, ist das Feld frei."
plPL = "Oznacz blok terenu do usunięcia. Budowniczy przynosi kilof i wykopuje blok. Kilof zostaje zużyty podczas kopania, a po jego zakończeniu pole jest oczyszczone."
ptBR = "Marque um bloco de terreno para remoção. Um construtor leva uma picareta até lá e escava o bloco. A picareta é consumida durante a escavação, e o bloco fica livre quando ela termina."
koKR = "제거할 지형 블록을 지정합니다. 건설자가 곡괭이를 가져와 블록을 파냅니다. 파내는 데 곡괭이가 소모되며, 작업이 끝나면 해당 타일이 비워집니다."
csCZ = "Označí blok terénu k odstranění. Stavitel přinese krumpáč a blok vykope. Krumpáč se při kopání spotřebuje a po dokončení zůstane dlaždice volná."
viVN = "Đánh dấu một khối địa hình để đào bỏ. Một thợ xây mang cuốc đến rồi đào khối đó. Cuốc sẽ bị tiêu hao khi đào, và ô đất sẽ được dọn trống sau khi hoàn tất."
trTR = "Kaldırılacak bir arazi bloğunu işaretler. Bir inşaatçı kazmayı oraya taşır ve bloğu kazarak çıkarır. Kazma kazı sırasında tüketilir ve işlem tamamlandığında karo temizlenmiş olur."

