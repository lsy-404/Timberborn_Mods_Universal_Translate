deDE = "{0}: Nichts konnte mehr Dung aufnehmen, also stellten arbeitslose Biber diesen leeren Tank auf Dung ein."
plPL = "{0}: nic już nie mogło pomieścić więcej łajna, więc bezrobotne bobry przeznaczyły ten pusty zbiornik na łajno."
