csCZ = "{0}: Nikdo už nemohl přijmout další hnůj, a tak nezaměstnaní bobři změnili účel této prázdné nádrže na hnůj."
viVN = "{0}: không còn chỗ nào chứa thêm Phân, nên những hải ly thất nghiệp đã đặt chiếc bể trống này thành Phân."
