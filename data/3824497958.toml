viVN = "Hôi hám: -3 tâm trạng, di chuyển và làm việc chậm hơn tới 10%. Mùi hôi sẽ biến mất sau 0.1 h kể từ khi rời khỏi nơi có mùi."
caES = "Pudent: -3 d’estat d’ànim, es mou i treballa fins a un 10% més lentament. S’esvaeix 0,1 h després de deixar enrere la pudor."
beBY = "Смярдзючы: -3 да настрою, рухаецца і працуе да 10% павольней. Знікае праз 0,1 г пасля выхаду з зоны смуроду."
roRO = "Mirositor: -3 la dispoziție, se deplasează și lucrează cu până la 10% mai încet. Dispare la 0.1 h după ce iese din zona mirosului."
huHU = "Büdös: -3 hangulat, akár 10%-kal lassabban mozog és dolgozik. A szag elhagyása után 0,1 h alatt elmúlik."
