itIT = "Imbarazzato: -10 umore, si nasconde a casa dopo un incidente (i castori senza casa vagano intorno al centro del distretto), svanisce entro 8 h."
ukUA = "Зніяковілість: -10 до настрою, після нещасного випадку ховається вдома (бобри без житла блукають центром району), минає протягом 8 год."
thTH = "อับอาย: อารมณ์ -10, หลบอยู่ที่บ้านหลังเกิดอุบัติเหตุ (บีเวอร์ไร้บ้านจะเดินเตร่ไปรอบๆ ศูนย์กลางเขต), หายไปภายใน 8 ชม."
csCZ = "Zahanbení: −10 k náladě, po nehodě se schovává doma (bezdomoví bobři se potulují kolem centra čtvrti), do 8 h odezní."
viVN = "Xấu hổ: -10 tâm trạng, trốn ở nhà sau một tai nạn (hải ly vô gia cư đi lang thang quanh trung tâm khu), biến mất trong vòng 8 h."
caES = "Avergonyit: -10 d’estat d’ànim, s’amaga a casa després d’un accident (els castors sense llar vagaregen pel centre del districte), s’esvaeix en un màxim de 8 h."
beBY = "Збянтэжанасць: -10 да настрою, пасля няшчаснага выпадку хаваецца дома (бяздомныя бабры бадзяюцца па цэнтры раёна), знікае на працягу 8 г."
roRO = "Stânjenit: -10 dispoziție, se ascunde acasă după un accident (castorii fără adăpost hoinăresc prin centrul districtului), dispare în 8 h."
huHU = "Zavarban: -10 hangulat, baleset után otthon rejtőzik (a hajléktalan hódok a körzetközpont körül bolyonganak), 8 h alatt elmúlik."
arSA = "مُحرَج: -10 للمزاج، يختبئ في المنزل بعد حادث (يتجول القنادس بلا مأوى حول مركز الحي)، ويزول خلال 8 h."

