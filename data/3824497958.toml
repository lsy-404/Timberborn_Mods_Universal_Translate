["Building.DamItStinksComposter.Description"]
raw = "Turns 2 Dung into 1 Fertilizer. When it runs out of Dung, the worker picks up dung piles within 10 tiles, and waits on site when there is nothing to do. Haulers bring Fertilizer to farms (each farm stores 25); a new crop takes 1 Fertilizer from a farm or, if no farm has any, from a tank or composter (within 25 tiles): about +33% yield at harvest. Stinks while it holds anything."
status = "normal"
enUS = "Turns 2 Dung into 1 Fertilizer. When it runs out of Dung, the worker picks up dung piles within 10 tiles and waits on site when there is nothing to do. Haulers bring Fertilizer to farms (each farm stores 25); a new crop takes 1 Fertilizer from a farm or, if no farm has any, from a tank or composter (within 25 tiles): about +33% yield at harvest. Stinks while it holds anything."
zhCN = "将 2 份粪便转化为 1 份肥料。粪便用完后，工人会拾取 10 格内的粪堆；无事可做时会原地等待。搬运工会将肥料送到农场（每个农场可储存 25 份）；种植新作物时，会从农场取用 1 份肥料，若所有农场都没有肥料，则从 25 格内的水箱或堆肥箱取用：收获时产量约提高 33%。只要存有任何物品，就会散发臭味。"
zhTW = "將 2 份糞便轉化為 1 份肥料。糞便用完時，工作人員會撿起 10 格範圍內的糞便堆；無事可做時，會在原地等候。搬運工會將肥料送到農場（每座農場可存放 25 份）；新作物會從農場取用 1 份肥料，若沒有任何農場存有肥料，則會從 25 格範圍內的水槽或堆肥機取用：收成時產量約增加 +33%。只要裡面還有東西，就會發臭。"
ruRU = "Превращает 2 единицы навоза в 1 единицу удобрения. Когда навоз заканчивается, рабочий подбирает кучи навоза в радиусе 10 клеток, а если делать нечего — ждёт на месте. Перевозчики доставляют удобрение на фермы (на каждой хранится 25 единиц); для нового посева с фермы берётся 1 единица удобрения, а если его нет ни на одной ферме — из резервуара или компостера в радиусе 25 клеток: урожайность при сборе увеличивается примерно на 33%. Воняет, пока внутри что-нибудь есть."
jaJP = "糞2個を肥料1個に変換します。糞がなくなると、作業員は10タイル以内にある糞の山を拾い、作業することがない場合はその場で待機します。運搬人が肥料を農場に運びます（農場ごとに25個保管）。新しい作物は農場から肥料を1個消費し、どの農場にも肥料がない場合は、25タイル以内にあるタンクまたは堆肥製造所から消費します。収穫量が約+33%増加します。中に何かがある間は臭います。"
frFR = "Transforme 2 excréments en 1 engrais. Quand il n’a plus d’excréments, l’ouvrier ramasse les tas d’excréments dans un rayon de 10 cases et attend sur place lorsqu’il n’a rien à faire. Les transporteurs apportent l’engrais aux fermes (chacune peut en stocker 25) ; une nouvelle culture prélève 1 engrais dans une ferme ou, si aucune ferme n’en a, dans un réservoir ou un composteur (dans un rayon de 25 cases) : environ +33 % de rendement à la récolte. Dégage une mauvaise odeur tant qu’il contient quelque chose."
deDE = "Verarbeitet 2 Mist zu 1 Dünger. Wenn der Mist ausgeht, sammelt der Arbeiter Misthaufen innerhalb von 10 Feldern auf und wartet vor Ort, wenn es nichts zu tun gibt. Träger bringen den Dünger zu den Farmen (jede Farm lagert 25); eine neue Nutzpflanze nimmt 1 Dünger von einer Farm oder, falls keine Farm Dünger hat, aus einem Tank oder Komposter (innerhalb von 25 Feldern): etwa +33% Ertrag bei der Ernte. Stinkt, solange sich etwas darin befindet."
plPL = "Przetwarza 2 sztuki Łajna na 1 sztukę Nawozu. Gdy zabraknie Łajna, pracownik zbiera kupy łajna w promieniu 10 pól, a gdy nie ma nic do zrobienia, czeka na miejscu. Transportowcy dostarczają Nawóz na farmy (każda przechowuje 25 sztuk); nowa uprawa pobiera 1 Nawóz z farmy lub, jeśli żadna farma go nie ma, ze zbiornika albo kompostownika (w promieniu 25 pól): około +33% plonów podczas zbiorów. Śmierdzi, gdy cokolwiek się w nim znajduje."
ptBR = "Transforma 2 esterco em 1 fertilizante. Quando fica sem esterco, o trabalhador recolhe pilhas de esterco a até 10 blocos de distância e espera no local quando não há nada para fazer. Os transportadores levam fertilizante às fazendas (cada fazenda armazena 25); uma nova plantação usa 1 fertilizante de uma fazenda ou, se nenhuma fazenda tiver, de um tanque ou compostor (a até 25 blocos de distância): cerca de +33% de rendimento na colheita. Solta mau cheiro enquanto contém qualquer coisa."
koKR = "똥 2개를 비료 1개로 바꿉니다. 똥이 떨어지면 작업자가 10타일 이내에 있는 똥 더미를 줍고, 할 일이 없으면 그 자리에서 기다립니다. 운반꾼이 비료를 농장으로 가져옵니다(농장마다 25개를 저장합니다). 새 작물은 농장에서 비료 1개를 가져가며, 비료가 있는 농장이 없으면 25타일 이내의 탱크나 퇴비통에서 가져갑니다. 수확량이 약 +33% 증가합니다. 무언가를 보관하는 동안 악취가 납니다."
csCZ = "Zpracovává 2 kusy hnoje na 1 hnojivo. Když dojde hnůj, pracovník posbírá hromádky hnoje v okruhu 10 polí a při nečinnosti čeká na místě. Nosiči dopravují hnojivo na farmy (každá farma pojme 25 kusů); nová plodina spotřebuje 1 hnojivo z farmy, nebo, pokud ho žádná farma nemá, z nádrže či kompostéru (do vzdálenosti 25 polí): při sklizni poskytuje výnos vyšší asi o 33 %. Dokud v něm něco je, zapáchá."
viVN = "Chuyển 2 Phân thành 1 Phân bón. Khi hết Phân, công nhân nhặt các đống phân trong phạm vi 10 ô và chờ tại chỗ nếu không có việc gì. Người vận chuyển đưa Phân bón đến các nông trại (mỗi nông trại chứa được 25); cây trồng mới lấy 1 Phân bón từ nông trại hoặc, nếu không nông trại nào có, từ bể chứa hoặc máy ủ phân (trong phạm vi 25 ô): năng suất khi thu hoạch tăng khoảng +33%. Bốc mùi khi chứa bất cứ thứ gì."
trTR = "2 Gübreden 1 Gübre üretir. Gübresi bittiğinde çalışan, 10 kare içindeki gübre yığınlarını toplar; yapacak işi olmadığında bulunduğu yerde bekler. Taşıyıcılar Gübreyi tarlalara götürür (her tarla 25 tane depolar); yeni bir ürün ekildiğinde, tarladan 1 Gübre alır veya hiçbir tarlada yoksa 25 kare içindeki bir tanktan ya da kompost makinesinden alır: hasattaki verimi yaklaşık %33 artırır. İçinde herhangi bir şey varken kötü koku yayar."

