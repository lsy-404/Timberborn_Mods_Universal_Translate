["Building.DamItStinksLatrine.Description"]
raw = "Beavers relieve themselves here. Homes have no cesspit: without a latrine the dung lands in front of the door. Holds 20 Dung, haulers empty it. Stinks a little."
status = "normal"
enUS = "Beavers relieve themselves here. Homes have no cesspit: without a latrine, dung lands in front of the door. Holds 20 Dung; haulers empty it. Stinks a little."
zhCN = "海狸在这里解决内急。住宅没有粪坑：没有厕所的话，粪便就会落在门前。可容纳20单位粪便，由搬运工清空。有点臭。"
zhTW = "海狸在此如廁。住所沒有糞坑：若沒有廁所，糞便就會掉在門前。可存放 20 糞便，由搬運工清空。有點臭。"
ruRU = "Бобры справляют здесь нужду. В домах нет выгребной ямы: без уборной помёт оказывается прямо у порога. Вмещает 20 единиц помёта, перевозчики его вывозят. Немного воняет."
jaJP = "ビーバーがここで用を足します。住居には便所がありません。簡易トイレがないと、糞が戸口の前に落ちます。糞を20個貯蔵でき、運搬人が空にします。少し臭います。"
frFR = "Les castors viennent ici pour se soulager. Les habitations n’ont pas de fosse d’aisance : sans latrines, les excréments atterrissent devant la porte. Contient 20 excréments ; les transporteurs le vident. Ça sent un peu mauvais."
deDE = "Hier verrichten Biber ihre Notdurft. Wohnhäuser haben keine Latrine: Ohne eine landet der Dung vor der Haustür. Fasst 20 Dung, die von Transporteuren abgeholt werden. Stinkt ein wenig."
plPL = "Bobry załatwiają tu swoje potrzeby. Domy nie mają latryny: bez niej odchody lądują przed drzwiami. Mieści 20 jednostek odchodów, które opróżniają tragarze. Trochę śmierdzi."
ptBR = "Os castores fazem suas necessidades aqui. As casas não têm fossa: sem uma latrina, o esterco cai em frente à porta. Armazena 20 unidades de esterco; os carregadores esvaziam. Tem um leve mau cheiro."
koKR = "비버들이 여기서 볼일을 봅니다. 집에는 변소가 없습니다. 변소가 없으면 똥이 문 앞에 떨어집니다. 똥을 20개까지 저장할 수 있으며, 운반꾼이 비웁니다. 악취가 조금 납니다."
csCZ = "Bobři se zde vyprazdňují. Domy nemají žumpu: bez latríny končí trus před dveřmi. Pojme 20 jednotek trusu, odvoz zajišťují přepravci. Trochu zapáchá."
viVN = "Hải ly đi vệ sinh ở đây. Nhà ở không có hố phân: nếu không có nhà vệ sinh, phân sẽ rơi ngay trước cửa. Chứa được 20 Phân, người vận chuyển sẽ dọn sạch. Hơi bốc mùi."
trTR = "Kunduzlar burada ihtiyaçlarını giderir. Evlerde helâ yoktur: helâ olmadan dışkı kapının önüne düşer. 20 Dışkı depolar, taşıyıcılar boşaltır. Biraz kötü kokar."

