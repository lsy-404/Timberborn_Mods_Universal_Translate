["ebbflow.settings.updateintervalinticks.desc"]
raw = "How often the mod's main logic cycle runs. Lower values are more frequent but may impact performance. Default is 200."
status = "normal"
enUS = "How often the mod's main logic cycle runs. Lower values are more frequent but may impact performance. Default is 200."
zhCN = "模组主逻辑的运行频率，每运行一次为1轮次。数值越低，运行越频繁、轮次越短，但可能影响性能（模组默认：200游戏刻，约等于游戏内1小时）。"
zhTW = "模組的主要邏輯循環運行的頻率。較低的值會更頻繁，但可能會影響性能。默認值為200。"
ruRU = "С какой частотой выполняется основной логический цикл мода. Более низкие значения приводят к более частому выполнению, но могут повлиять на производительность. Значение по умолчанию - 200."
jaJP = "モッドの主要なロジックサイクルがどの頻度で実行されるか。値が低いほど頻繁になりますが、パフォーマンスに影響を与える可能性があります。デフォルトは200です。"
frFR = "À quelle fréquence le cycle principal de la logique du mod s'exécute-t-il ? Des valeurs plus basses sont plus fréquentes mais peuvent avoir un impact sur les performances. La valeur par défaut est de 200."
deDE = "Wie oft der Hauptlogikzyklus des Mods läuft. Niedrigere Werte bedeuten häufigere Ausführung, können jedoch die Leistung beeinträchtigen. Der Standardwert ist 200."
plPL = "Jak często działa główny cykl logiki moda. Niższe wartości są bardziej częste, ale mogą wpłynąć na wydajność. Domyślna wartość to 200."
ptBR = "Com que frequência o ciclo principal de lógica do mod é executado. Valores mais baixos são mais frequentes, mas podem impactar o desempenho. O padrão é 200."
koKR = "모드의 주요 로직 주기가 얼마나 자주 실행되는지를 나타냅니다. 값이 낮을수록 더 자주 실행되지만 성능에 영향을 미칠 수 있습니다. 기본값은 200입니다."
trTR = "Modun ana mantık döngüsünün ne sıklıkta çalıştığı. Daha düşük değerler daha sık çalışır ancak performansı etkileyebilir. Varsayılan 200'dür."
esES = "Con qué frecuencia se ejecuta el ciclo de lógica principal del mod. Valores más bajos son más frecuentes, pero pueden afectar al rendimiento. El valor predeterminado es 200."
itIT = "Ogni quanto viene eseguito il ciclo logico principale della mod. Valori più bassi significano esecuzioni più frequenti, ma possono influire sulle prestazioni. Il valore predefinito è 200."
ukUA = "Частота, з якою виконується основний цикл логіки моду. Менші значення означають частіші оновлення, але можуть знижувати продуктивність. За замовчуванням 200."
thTH = "ความถี่ในการทำงานของลอจิกหลักของม็อดนี้ ค่าที่ต่ำลงจะทำงานบ่อยขึ้นแต่อาจส่งผลต่อประสิทธิภาพ ค่าเริ่มต้นคือ 200"
csCZ = "Jak často se běží hlavní logika módu. Nižší hodnoty znamenají častější spuštění, ale mohou mít vliv na výkon. Výchozí hodnota je 200."
viVN = "Chu trình logic chính của mod được thực thi bao nhiêu lần. Giá trị nhỏ hơn cho chu trình này sẽ thực thi thường xuyên hơn nhưng có thể ảnh hưởng đến hiệu suất. Mặc định là 200."
caES = "Com de sovint s'executa el cicle de lògica principal del mod. Valors més baixos són més freqüents però poden afectar el rendiment. El valor per defecte és 200."
beBY = "Як часта выконваецца асноўны цыкл логікі мода. Меншыя значэнні выконваюцца часцей, але могуць паўплываць на прадукцыйнасць. Стандартнае значэнне — 200."
roRO = "Cât de des rulează ciclul principal de logică al modului. Valori mai mici înseamnă o frecvență mai mare, dar pot afecta performanța. Valoarea implicită este 200."
huHU = "A mod fő logikai ciklusának gyakorisága. Az alacsonyabb értékek gyakrabban futnak, de ronthatják a teljesítményt. Alapértelmezett érték: 200."
arSA = "كم مرة تعمل الدورة الرئيسية لمنطق المود. القيم الأقل تعني تكراراً أكبر لكنها قد تؤثر على الأداء. القيمة الافتراضية هي 200."

