["ebbflow.settings.fluctuationdurationticks.desc"]
raw = "How long a random water strength fluctuation lasts. A higher number means the fluctuation will last longer. Each cycle is approximately one hour of in-game time."
status = "normal"
enUS = "How long a random water strength fluctuation lasts. A higher number means the fluctuation will last longer. Each cycle is approximately one hour of in-game time."
zhCN = "随机波动的持续时间（模组默认：6轮次）。"
zhTW = "隨機水強度波動持續的時間。數字越高，波動持續的時間越長。每個循環約為遊戲內的一小時。"
ruRU = "Как долго длится случайное колебание силы воды. Более высокое число означает, что колебание будет длиться дольше. Каждый цикл составляет примерно один час игрового времени."
jaJP = "ランダムな水の強さの変動がどれくらい続くか。数値が高いほど、変動が長続きします。各サイクルはゲーム内時間で約1時間です。"
frFR = "Combien de temps dure une fluctuation de force de l'eau aléatoire. Un nombre plus élevé signifie que la fluctuation durera plus longtemps. Chaque cycle représente environ une heure de temps de jeu."
deDE = "Wie lange eine zufällige Schwankung der Wasserstärke dauert. Eine höhere Zahl bedeutet, dass die Schwankung länger anhält. Jeder Zyklus dauert ungefähr eine Stunde Spielzeit."
plPL = "Jak długo trwa losowa fluktuacja siły wody. Wyższa liczba oznacza, że fluktuacja będzie trwała dłużej. Każdy cykl trwa aproximadamente jedną godzinę czasu gry."
ptBR = "Quanto tempo dura uma oscilação aleatória na força da água. Um número mais alto significa que a oscilação durará mais. Cada ciclo é de aproximadamente uma hora de tempo dentro do jogo."
koKR = "무작위 물의 세기 변동이 지속되는 시간. 숫자가 클수록 변동이 더 오래 지속됩니다. 각 주기는 게임 내 시간으로 약 1시간입니다."
trTR = "Rastgele bir su gücü dalgalanmasının ne kadar sürdüğünü belirtir. Daha yüksek bir sayı, dalgalanmanın daha uzun süreceği anlamına gelir. Her döngü, oyun içi zaman için yaklaşık bir saat sürer."
esES = "Cuánto dura una fluctuación aleatoria de la intensidad del agua. Un número más alto hace que la fluctuación dure más. Cada ciclo equivale a aproximadamente una hora de tiempo de juego."
itIT = "Per quanto tempo dura una fluttuazione casuale dell'intensità dell'acqua. Un valore più alto significa che la fluttuazione durerà più a lungo. Ogni ciclo corrisponde a circa un'ora di tempo di gioco."
ukUA = "Скільки часу триватиме випадкова зміна сили водного потоку. Чим більше число, тим довше триватиме зміна. Кожен цикл триває приблизно одну годину ігрового часу."
thTH = "ระยะเวลาที่ความแรงของน้ำที่สุ่มเปลี่ยนแปลงจะคงอยู่ ตัวเลขที่สูงขึ้นหมายความว่าการเปลี่ยนแปลงจะคงอยู่นานขึ้น แต่ละรอบใช้เวลาในเกมประมาณหนึ่งชั่วโมง"
csCZ = "Jak dlouho trvá náhodná fluktuace síly vody. Vyšší číslo znamená, že fluktuace potrvá déle. Každý cyklus trvá přibližně jednu hodinu herního času."
viVN = "Thời lượng của một biến động ngẫu nhiên về cường độ nước kéo dài. Một giá trị lớn hơn đồng nghĩa với việc biến động sẽ kéo dài hơn. Mỗi chu kỳ xấp xỉ bằng một giờ thời gian trong trò chơi."
caES = "Quant durarà una fluctuació aleatòria de la intensitat de l'aigua. Com més gran sigui el número, més durarà la fluctuació. Cada cicle equival aproximadament a una hora de temps de joc."
beBY = "Тое, як доўга працуе выпадковае змяненне сілы вады. Большы лік азначае, што змяненне будзе доўжыцца даўжэй. Кожны цыкл прыблізна адпавядае адной гадзіне ігравога часу."
roRO = "Cât timp durează o fluctuație aleatorie a intensității apei. Un număr mai mare înseamnă că fluctuația va dura mai mult. Fiecare ciclu durează aproximativ o oră de timp din joc."
huHU = "Hogy meddig tart a véletlenszerű vízerő-ingadozás. Minél nagyobb a szám, annál tovább tart az ingadozás. Egy ciklus körülbelül egy óra játékidőnek felel meg."
arSA = "مدة استمرار التقلب العشوائي في قوة المياه. كلما كان الرقم أعلى، استمر التقلب لفترة أطول. تستغرق كل دورة نحو ساعة واحدة من وقت اللعبة."

