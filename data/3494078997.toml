status = "normal"
enUS = "Divides total map sources by this number to determine how many to check for toggling (e.g., 3 = check 1/3 of sources)."
zhCN = "模组刷新时，会对多少水源和恶水源进行开关检测（模组默认：3，表示检测整个地图1/3的水源和恶水源）。"
zhTW = "將總地圖來源除以這個數字，以確定要檢查多少個以進行切換（例如，3 = 檢查1/3的來源）。"
ruRU = "Разделите общее количество источников карты на это число, чтобы определить, сколько из них проверять для переключения (например, 3 = проверять 1/3 источников)."
jaJP = "この数でマップソースの合計を割り、切り替えのために何をチェックするかを決定します（例：3 = ソースの1/3をチェック）。"
frFR = "Divisez le total des sources de la carte par ce nombre pour déterminer combien vérifier pour le basculement (par exemple, 3 = vérifier 1/3 des sources)."
deDE = "Teile die gesamten Kartendatenquellen durch diese Zahl, um zu bestimmen, wie viele auf Umschaltung überprüft werden sollen (z. B. 3 = überprüfe 1/3 der Quellen)."
plPL = "Dzieli całkowitą liczbę źródeł mapy przez tę liczbę, aby określić, ile należy sprawdzić w celu przełączania (np. 3 = sprawdź 1/3 źródeł)."
ptBR = "Divide o total de fontes do mapa por este número para determinar quantas verificar para alternar (por exemplo, 3 = verificar 1/3 das fontes)."
koKR = "이 숫자로 총 맵 소스를 나누어 전환 여부를 확인할 소스의 수를 결정합니다 (예: 3 = 소스의 1/3 확인)."
trTR = "Toplam harita kaynaklarını bu sayı ile böler ve açma/kapama için kontrol edilecek kaynak sayısını belirler (örn. 3 = kaynakların 1/3'ünü kontrol et)."
esES = "Divide el número total de fuentes del mapa entre este valor para determinar cuántas se revisan para alternar (por ejemplo, 3 = revisar 1/3 de las fuentes)."
itIT = "Divide il numero totale delle sorgenti della mappa per questo valore per determinare quante controllarne per l'attivazione/disattivazione (ad esempio, 3 = controlla 1/3 delle sorgenti)."
ukUA = "Ділить загальну кількість джерел карти на це число, щоб визначити, скільки з них перевіряти на перемикання (наприклад, 3 = перевірити 1/3 джерел)."
thTH = "หารจำนวนแหล่งน้ำทั้งหมดในแผนที่ด้วยตัวเลขนี้ เพื่อกำหนดว่าจะตรวจสอบแหล่งน้ำกี่แหล่งสำหรับการสลับสถานะ (เช่น 3 = ตรวจสอบ 1/3 ของแหล่งน้ำ)"
csCZ = "Rozdělí celkové mapové zdroje podle tohoto čísla, aby určil, kolik jich má kontrolovat pro přepínání (např. 3 = zkontrolovat 1/3 zdrojů)."
viVN = "Chia tổng số nguồn trên bản đồ cho con số này để xác định có bao nhiêu nguồn được kiểm tra khi bật/tắt (ví dụ, 3 = kiểm tra 1/3 tổng số nguồn)."
