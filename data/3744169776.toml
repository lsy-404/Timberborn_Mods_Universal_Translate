["Building.Refinery.FlavorDescription"]
new = "The Hoomans called it Black Gold, I dont know what this has to do with gold, it just sticks to your fur!"
status = "normal"
enUS = "The Hoomans called it Black Gold. I don't know what this has to do with gold; it just sticks to your fur!"
zhCN = "人类管它叫黑金。我不知道这跟黄金有什么关系，它只会粘在你的毛上！"
zhTW = "人類稱它為黑金，我不知道這跟黃金有什麼關係，它只會黏在你的毛上！"
ruRU = "Хуманы называли это чёрным золотом. Не знаю, при чём тут золото, оно просто липнет к шерсти!"
jaJP = "ホーマンたちはこれを「黒い金」と呼んでいた。金と何の関係があるのかはわからないけど、毛にくっつくんだ！"
deDE = "Die Hoomans nannten es Schwarzes Gold. Ich weiß nicht, was das mit Gold zu tun hat, es klebt einfach an deinem Fell!"
plPL = "Hoomani nazywali to czarnym złotem. Nie wiem, co ma wspólnego ze złotem, skoro po prostu przykleja się do futra!"
ptBR = "Os Hoomans chamavam isso de Ouro Negro. Não sei o que isso tem a ver com ouro, só sei que gruda no seu pelo!"
koKR = "인간들은 이걸 검은 황금이라고 불렀어. 황금이랑 무슨 상관인지 모르겠지만, 그냥 털에 들러붙잖아!"
csCZ = "Hoomani tomu říkali černé zlato. Nevím, co má společného se zlatem, vždyť se to jen lepí na srst!"
viVN = "Lũ Hooman gọi nó là Vàng Đen. Tôi chẳng biết thứ này thì liên quan gì đến vàng, nó chỉ dính bết vào lông thôi!"
trTR = "Hoomanlar buna Kara Altın diyordu. Altınla ne ilgisi var, bilmiyorum; sadece kürküne yapışıyor!"
