["Building.Brewery.FlavorDescription"]
raw = "the Hoomans probably had to cough a lot, when they've conquered half the world for it."
status = "normal"
enUS = "The Hoomans probably had to cough a lot when they conquered half the world for it."
zhCN = "人类为了征服半个世界，大概咳了不少吧。"
zhTW = "人類大概咳得很厲害，才征服了半個世界來換取它。"
