["Building.Refinery.FlavorDescription"]
raw = "The Hoomans called it Black Gold, I dont know what this has to do with gold, it just sticks to your fur!"
status = "normal"
enUS = "The Hoomans called it Black Gold. I don't know what this has to do with gold; it just sticks to your fur!"
zhCN = "人类称它为“黑金”，我不知道这跟金子有什么关系，它只会粘在你的毛上！"
zhTW = "人類稱它為黑金，我不知道這跟黃金有什麼關係，它只是會黏在你的毛皮上！"
ruRU = "Хуманы называли это чёрным золотом. Не знаю, при чём тут золото, оно просто липнет к шерсти!"
jaJP = "ホーマンたちはこれを「黒い金」と呼んでいた。金と何の関係があるのかは分からない。毛にくっつくだけなのに！"
frFR = "Les Hoomans appelaient ça l’or noir. Je ne vois pas ce que ça a à voir avec l’or, ça colle juste à votre fourrure !"
deDE = "Die Hoomans nannten es Schwarzes Gold. Ich weiß nicht, was das mit Gold zu tun hat – es klebt einfach nur an deinem Fell!"
plPL = "Hoomanie nazywali to czarnym złotem. Nie wiem, co to ma wspólnego ze złotem, skoro po prostu przykleja się do futra!"
ptBR = "Os Hoomans chamavam isso de Ouro Negro. Não sei o que isso tem a ver com ouro, só sei que gruda no seu pelo!"
koKR = "호우만들은 이걸 검은 황금이라고 불렀다. 황금이랑 무슨 상관인지는 모르겠다. 털에 그냥 들러붙을 뿐인데!"
trTR = "Hoomanlar buna Kara Altın derdi. Altınla ne ilgisi var bilmiyorum, sadece kürküne yapışıyor!"
esES = "Los humanos lo llamaban Oro Negro. No sé qué tiene que ver esto con el oro, ¡pero se te pega al pelaje!"
itIT = "Gli Umani lo chiamavano Oro Nero. Non so cosa c'entri con l'oro, si attacca solo al pelo!"
ukUA = "Людці називали це Чорним золотом. Не знаю, яке відношення це має до золота, просто воно липне до хутра!"
thTH = "มนุษย์เรียกมันว่าทองคำดำ ฉันไม่รู้ว่ามันเกี่ยวอะไรกับทองคำ แค่มันติดขนของเราไม่หลุดเลย!"
csCZ = "Hoomani tomu říkali černé zlato. Nevím, co to má společného se zlatem, jen se to lepí na srst!"
viVN = "Đám Người gọi nó là Vàng Đen. Tôi chẳng hiểu nó liên quan gì đến vàng, nó chỉ dính bết vào lông của bạn thôi!"
caES = "Els humans l'anomenaven Or Negre, no sé què té a veure això amb l'or, només s'enganxa al pel!"
beBY = "Людзі называлі яго Чорным золатам, не ведаю, што тут da золата, проста яно прыліпае да поўсці!"
roRO = "Oamenii îi spuneau Aur Negru. Nu știu ce legătură are asta cu aurul, doar că se lipește de blană!"
huHU = "A emberek Fekete aranynak hívták, nem tudom, mi köze ennek az aranyhoz, csak odaragad a szőrödhöz!"
arSA = "قال البشر إنه يسمونه \"الذهب الأسود\"، لا أعرف ما علاقة هذا بالذهب، كل ما في الأمر أنه يلتصق بفرائك!"
