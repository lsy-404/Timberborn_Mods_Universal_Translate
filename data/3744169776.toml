["Building.Recicler.Desciption"]
raw = "Recicles Goods so they can be processed more efficiently."
status = "normal"
enUS = "Recycles goods so they can be processed more efficiently."
zhCN = "“回收商品，以便更高效地处理。”"
zhTW = "回收物品以便更有效地進行加工。"
ruRU = "Перерабатывает товары, чтобы их можно было обрабатывать более эффективно."
jaJP = "「リサイクルされた商品は、より効率的に処理される。」"
frFR = "Recycle des biens afin qu'ils puissent être traités plus efficacement."
deDE = "Verarbeitet Güter, damit sie effizienter verarbeitet werden können."
plPL = "Przetwarza surowce, aby mogły być przetwarzane bardziej efektywnie."
ptBR = "Recicle bens para que possam ser processados de forma mais eficiente."
koKR = "재활용하여 더 효율적으로 가공할 수 있도록 합니다."
trTR = "Eşyaları yeniden işlenebilir şekilde daha verimli bir şekilde işlenmek üzere geri dönüştürür."
esES = "Recicla los bienes para que puedan procesarse con mayor eficiencia."
itIT = "Ricicla i beni in modo che possano essere lavorati con maggiore efficienza."
ukUA = "Переробляє товари, щоб їх можна було ефективніше обробляти далі."
thTH = "แปลงของที่รีไซเคิลแล้วให้สามารถนำกลับมาแปรรูปได้อย่างมีประสิทธิภาพมากขึ้น"
csCZ = "Recikluje zboží, aby mohlo být zpracováno efektivněji."
viVN = "Thu hồi hàng hóa để chúng có thể được xử lý hiệu quả hơn."
caES = "Recicla béns perquè es puguin processar de manera més eficient."
beBY = "Перапрацоўвае тавары, каб іх можна было апрацоўваць эфектыўней."
roRO = "Reciclează bunurile, astfel încât acestea să poată fi procesate mai eficient."
huHU = "Újrahasznosítja a termékeket, hogy hatékonyabban lehessen feldolgozni őket."
arSA = "يعيد تدوير السلع لتتمكن من معالجتها بكفاءة أكبر."

["Building.Recicler.FlavorDescription"]
raw = "Somethong the Hoomans didnt do, now they're dead."
status = "normal"
enUS = "Something the Hoomans didn't do, now they're dead."
zhCN = "人类没做某件事，现在他们死了。"
zhTW = "人類沒做到的事，現在他們死了。"
ruRU = "Что-то, чего Хуманы не сделали, теперь они мертвы."
jaJP = "人間たちがやらなかった何か。そのせいで、今や彼らは死んでいる。"
frFR = "Quelque chose que les Hoomans n'ont pas fait, maintenant ils sont morts."
deDE = "Etwas, das die Menschen nicht getan haben – jetzt sind sie tot."
plPL = "Coś, czego Hoomanie nie zrobili. Teraz nie żyją."
ptBR = "Algo que os Hoomans não fizeram; agora estão mortos."
koKR = "인간들이 하지 않은 어떤 일, 이제 그들은 죽었다."
trTR = "İnsanların yapmadığı bir şey, şimdi de hepsi öldü."
esES = "Algo que los humanos no hicieron, y ahora están muertos."
itIT = "Qualcosa che gli Umani non hanno fatto, ora sono morti."
ukUA = "Щось, чого людці не зробили, а тепер вони мертві."
thTH = "ของบางอย่างที่มนุษย์ไม่ได้ทำ ตอนนี้พวกเขาตายไปแล้ว"
csCZ = "Něco, co Hoomani neudělali, a teď jsou mrtví."
viVN = "Có điều gì đó loài Hoomans đã không làm, giờ thì họ chết rồi."
caES = "Alguna cosa que els Humans no van fer, ara estan morts."
beBY = "Нешта, чаго людзі не зрабілі, і цяпер яны мёртвыя."
roRO = "Ceva ce oamenii nu au făcut, acum sunt morți."
huHU = "Valami, amit az emberek nem csináltak meg, és most már halottak."
arSA = "شيء لم يفعله البشر، والآن هم موتى."

