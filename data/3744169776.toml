frFR = "Les Hoomans ont probablement beaucoup toussé, puisqu’ils ont conquis la moitié du monde pour ça."
deDE = "Die Hoomans mussten wahrscheinlich viel husten, als sie dafür die halbe Welt eroberten."
plPL = "Hoomani pewnie musieli sporo kaszleć, skoro podbili w tym celu połowę świata."
ptBR = "Os Hoomans provavelmente tossiam bastante quando conquistaram metade do mundo por causa disso."
koKR = "인간들은 아마 그걸 위해 세계의 절반을 정복하면서 기침을 많이 했을 거야."
trTR = "Hoomanlar bunun için dünyanın yarısını fethettiklerine göre, muhtemelen çok öksürmüşlerdir."
esES = "Los Humanos probablemente tuvieron que toser mucho, ya que conquistaron medio mundo para conseguirlo."
itIT = "Gli Umani probabilmente hanno dovuto tossire parecchio, dato che hanno conquistato metà del mondo per averlo."
ukUA = "Людям, мабуть, довелося багато кашляти, коли вони за це завоювали півсвіту."
thTH = "ฮูแมนส์คงต้องไอกันเยอะแน่ ๆ ตอนที่พวกเขายึดครองโลกไปครึ่งหนึ่งเพื่อสิ่งนี้"
csCZ = "Hoomani při dobývání poloviny světa kvůli tomu nejspíš hodně kašlali."
viVN = "Có lẽ người Hooman đã phải ho rất nhiều khi chinh phục được một nửa thế giới vì thứ này."
caES = "Els Hoomans probablement havien de tossir molt, quan han conquerit mig món per això."
beBY = "Людзі, напэўна, моцна кашлялі, калі для гэтага заваявалі паўсвету."
roRO = "Hoomanii probabil au trebuit să tușească mult, după ce au cucerit jumătate din lume pentru asta."
huHU = "Az emberek valószínűleg sokat köhögtek, mire az egész világ felét meghódították érte."
arSA = "يبدو أن البشر كان عليهم أن يسعلوا كثيرًا، بعدما احتلوا نصف العالم من أجل ذلك."

