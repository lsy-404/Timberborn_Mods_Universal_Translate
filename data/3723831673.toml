roRO = "Procentul materialelor de construcție ale clădirii perceput pentru fiecare mutare. 0 înseamnă gratuit. Materialele sunt luate mai întâi din stocurile publice din districtul sursei, apoi din districtele mai apropiate."
huHU = "Az épület építőanyagainak minden áthelyezésért fizetendő százalékos aránya. A 0 ingyenességet jelent. Az anyagokat először a forrás kerületében lévő nyilvános készletekből, majd a közelebbi kerületekből veszi el."
