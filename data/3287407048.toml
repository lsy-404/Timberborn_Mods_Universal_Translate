["Tobbert.PipetteTool.Setting.PipetteToolModeToolTip"]
raw = "Hold Mode: Hold the Pipette Tool Keybind button and use the Mouse Selection button to start pipetting.\nPress Mode: Pipette Tool is activated after the Pipette Tool Keybind is pressed and released.\nDirect Mode (Key Bind): This setting allows for direct pipetting without having to click. Using the key bind above it will directly switch to the relevant building (Factorio player approved).\nDirect Mode (Middle Mouse Button): This setting allows for direct pipetting without having to use the Key bind. Using the Middle Mouse Button will directly switch to the relevant building (Minecraft player approved).\nInverted Mode: When a building is selected, press the Pipette Tool Key Bind to switch the relevant object."
status = "normal"
enUS = "Hold Mode: Hold the Pipette Tool Keybind button and use the Mouse Selection button to start pipetting.\nPress Mode: Pipette Tool is activated after the Pipette Tool Keybind is pressed and released.\nDirect Mode (Key Bind): This setting allows for direct pipetting without having to click. Using the key bind above it will directly switch to the relevant building (Factorio player approved).\nDirect Mode (Middle Mouse Button): This setting allows for direct pipetting without having to use the Key bind. Using the Middle Mouse Button will directly switch to the relevant building (Minecraft player approved).\nInverted Mode: When a building is selected, press the Pipette Tool Key Bind to switch the relevant object."
zhCN = "- 按住模式：按住快捷键时进入吸管工具，点击建筑进行吸取<br>- 按下模式：按下并释放快捷键后进入吸管工具，点击建筑进行吸取<br>- 直接模式（按键绑定）：按下并释放快捷键后直接吸取（Factorio玩家首选）<br>直接模式（鼠标中键）：按下并释放鼠标中键后直接吸取（Minecraft玩家首选）<br>反转模式：点击一个建筑后，按下快捷键进行吸取"
zhTW = "保持模式：按住移液管工具的快捷鍵，並使用滑鼠選擇按鈕開始移液。  \n按壓模式：在按下並釋放移液管工具快捷鍵後，移液管工具被啟動。  \n直接模式（快捷鍵）：此設置允許直接移液而無需點擊。使用上面的快捷鍵將直接切換到相關建築（經過 Factorio 玩家批准）。  \n直接模式（中鍵）：此設置允許直接移液而無需使用快捷鍵。使用中鍵將直接切換到相關建築（經過 Minecraft 玩家批准）。  \n反轉模式：當選擇一個建築時，按下移液管工具快捷鍵以切換到相關物件。"
ruRU = "Режим удержания: Удерживайте кнопку привязки инструмента пипетки и используйте кнопку выбора мыши для начала пипетирования.  \nРежим нажатия: Инструмент пипетки активируется после нажатия и отпускания кнопки привязки инструмента пипетки.  \nПрямой режим (привязка клавиши): Эта настройка позволяет выполнять пипетирование напрямую без необходимости щелчка. Используя приведенную выше клавишу привязки, вы сразу переключитесь на соответствующее здание (одобрено игроками Factorio).  \nПрямой режим (средняя кнопка мыши): Эта настройка позволяет выполнять пипетирование напрямую без необходимости использовать клавишу привязки. Используя среднюю кнопку мыши, вы сразу переключитесь на соответствующее здание (одобрено игроками Minecraft).  \nОбратный режим: Когда здание выбрано, нажмите клавишу привязки инструмента пипетки, чтобы переключить соответствующий объект."
jaJP = "ホールドモード：ピペットツールのキーbindボタンを押し続け、マウス選択ボタンを使用してピペッティングを開始します。  \nプレスモード：ピペットツールキーbindが押されて放されると、ピペットツールがアクティブになります。  \nダイレクトモード（キーbind）：この設定は、クリックすることなく直接ピペッティングを可能にします。上記のキーbindを使用すると、関連する建物に直接切り替わります（Factorioプレイヤーの承認済み）。  \nダイレクトモード（中ボタン）：この設定は、キーbindを使用することなく直接ピペッティングを可能にします。中ボタンを使用すると、関連する建物に直接切り替わります（Minecraftプレイヤーの承認済み）。  \n反転モード：建物が選択されているときに、ピペットツールのキーbindを押すと、関連オブジェクトに切り替わります。"
frFR = "Mode Maintien : Maintenez le bouton de raccourci de l'outil Pipette et utilisez le bouton de sélection de la souris pour commencer à pipetter.  \nMode Appui : L'outil Pipette est activé après que le raccourci de l'outil Pipette a été pressé et relâché.  \nMode Direct (Raccourci) : Ce paramètre permet de pipetter directement sans avoir à cliquer. En utilisant le raccourci ci-dessus, cela permettra de passer directement au bâtiment pertinent (approuvé par les joueurs de Factorio).  \nMode Direct (Bouton du milieu de la souris) : Ce paramètre permet de pipetter directement sans avoir à utiliser le raccourci. En utilisant le bouton du milieu de la souris, cela permettra de passer directement au bâtiment pertinent (approuvé par les joueurs de Minecraft).  \nMode Inversé : Lorsqu'un bâtiment est sélectionné, appuyez sur le raccourci de l'outil Pipette pour changer l'objet pertinent."
deDE = "Halten-Modus: Halten Sie die Taste für das Pipettenwerkzeug und verwenden Sie die Maustaste für die Auswahl, um mit dem Pipettieren zu beginnen.  \nDrücken-Modus: Das Pipettenwerkzeug wird aktiviert, nachdem die Taste für das Pipettenwerkzeug gedrückt und losgelassen wurde.  \nDirektmodus (Tastenkombination): Diese Einstellung ermöglicht direktes Pipettieren, ohne klicken zu müssen. Mit der oben genannten Tastenkombination wird direkt zum relevanten Gebäude gewechselt (von Factorio-Spielern genehmigt).  \nDirektmodus (Mittlere Maustaste): Diese Einstellung ermöglicht direktes Pipettieren, ohne die Tastenkombination verwenden zu müssen. Mit der mittleren Maustaste wird direkt zum relevanten Gebäude gewechselt (von Minecraft-Spielern genehmigt).  \nUmkehrmodus: Wenn ein Gebäude ausgewählt ist, drücken Sie die Tastenkombination für das Pipettenwerkzeug, um das relevante Objekt zu wechseln."
plPL = "Tryb Trzymania: Przytrzymaj przycisk skrótu narzędzia pipetowego i użyj przycisku wyboru myszy, aby rozpocząć pipetowanie.  \nTryb Naciśnięcia: Narzędzie pipetowe jest aktywowane po naciśnięciu i zwolnieniu przycisku skrótu narzędzia pipetowego.  \nTryb Bezpośredni (Skrót): To ustawienie umożliwia bezpośrednie pipetowanie bez konieczności klikania. Używając powyższego skrótu, przełączysz się bezpośrednio na odpowiedni budynek (zaakceptowane przez graczy Factorio).  \nTryb Bezpośredni (Przycisk Środkowy Myszy): To ustawienie umożliwia bezpośrednie pipetowanie bez użycia skrótu. Używając przycisku środkowego myszy, przełączysz się bezpośrednio na odpowiedni budynek (zaakceptowane przez graczy Minecraft).  \nTryb Odwrócony: Gdy budynek jest wybrany, naciśnij skrót narzędzia pipetowego, aby przełączyć odpowiedni obiekt.  "
ptBR = "Modo de Manter: Mantenha o botão de atalho da Ferramenta de Pipeta pressionado e use o botão de Seleção do Mouse para começar a pipetar.  \nModo de Pressionar: A Ferramenta de Pipeta é ativada após o botão de atalho da Ferramenta de Pipeta ser pressionado e solto.  \nModo Direto (Atalho): Esta configuração permite pipetagem direta sem precisar clicar. Usar o atalho acima mudará diretamente para o prédio relevante (aprovado por jogadores de Factorio).  \nModo Direto (Botão do Meio do Mouse): Esta configuração permite pipetagem direta sem precisar usar o atalho. Usar o Botão do Meio do Mouse mudará diretamente para o prédio relevante (aprovado por jogadores de Minecraft).  \nModo Invertido: Quando um prédio está selecionado, pressione o Atalho da Ferramenta de Pipeta para trocar o objeto relevante."
koKR = "홀드 모드: 파이펫 도구 키 바인드 버튼을 누르고 마우스 선택 버튼을 사용하여 파이펫을 시작하세요.  \n프레스 모드: 파이펫 도구 키 바인드가 눌러지고 해제된 후 파이펫 도구가 활성화됩니다.  \n직접 모드 (키 바인드): 이 설정은 클릭 없이 직접 파이펫을 가능하게 합니다. 위의 키 바인드를 사용하면 관련 건물로 직접 전환됩니다 (팩토리오 플레이어 승인).  \n직접 모드 (중간 마우스 버튼): 이 설정은 키 바인드를 사용하지 않고 직접 파이펫을 가능하게 합니다. 중간 마우스 버튼을 사용하면 관련 건물로 직접 전환됩니다 (마인크래프트 플레이어 승인).  \n반전 모드: 건물이 선택된 상태에서 파이펫 도구 키 바인드를 눌러 관련 객체로 전환합니다."
trTR = "Tutma Modu: Pipet Aracı Kısayol tuşuna basılı tutun ve pipetleme başlatmak için Fare Seçim tuşunu kullanın. \nBasılı Mod: Pipet Aracı, Pipet Aracı Kısayolu tuşuna basıldığında ve bırakıldığında etkinleştirilir. \nDoğrudan Mod (Kısayol): Bu ayar, tıklamaya gerek kalmadan doğrudan pipetlemeye olanak tanır. Yukarıdaki kısayolu kullanarak ilgili binaya doğrudan geçiş yapabilirsiniz (Factorio oyuncuları onaylıyor). \nDoğrudan Mod (Orta Fare Tuşu): Bu ayar, Kısayol kullanmadan doğrudan pipetlemeye olanak tanır. Orta Fare Tuşunu kullanarak ilgili binaya doğrudan geçiş yapabilirsiniz (Minecraft oyuncuları onaylıyor). \nTers Mod: Bir bina seçildiğinde, ilgili nesneye geçmek için Pipet Aracı Kısayolu tuşuna basın."
esES = "Modo mantener: mantén pulsado el botón de atajo de la herramienta pipeta y usa el botón de selección con el ratón para empezar a usar la pipeta.\nModo pulsar: la herramienta pipeta se activa después de pulsar y soltar el atajo de la herramienta pipeta.\nModo directo (atajo de teclado): este ajuste permite usar la pipeta directamente sin tener que hacer clic. Al usar el atajo de teclado indicado arriba, se cambiará directamente al edificio correspondiente (aprobado por jugadores de Factorio).\nModo directo (botón central del ratón): este ajuste permite usar la pipeta directamente sin tener que usar el atajo de teclado. Al usar el botón central del ratón, se cambiará directamente al edificio correspondiente (aprobado por jugadores de Minecraft).\nModo invertido: cuando hay un edificio seleccionado, pulsa el atajo de la herramienta pipeta para cambiar al objeto correspondiente."
itIT = "Modalità Tenere premuto: tieni premuto il tasto assegnato allo Strumento Pipetta e usa il pulsante di selezione del mouse per iniziare a usare la pipetta.\nModalità Premere: lo Strumento Pipetta viene attivato dopo aver premuto e rilasciato il tasto assegnato allo Strumento Pipetta.\nModalità Diretta (tasto assegnato): questa impostazione consente di usare la pipetta direttamente senza dover cliccare. Usando il tasto assegnato qui sopra, si passerà direttamente all'edificio pertinente (approvato dai giocatori di Factorio).\nModalità Diretta (pulsante centrale del mouse): questa impostazione consente di usare la pipetta direttamente senza dover usare il tasto assegnato. Usando il pulsante centrale del mouse, si passerà direttamente all'edificio pertinente (approvato dai giocatori di Minecraft).\nModalità Invertita: quando un edificio è selezionato, premi il tasto assegnato allo Strumento Pipetta per passare all'oggetto pertinente."
ukUA = "Режим утримання: утримуйте кнопку прив'язки інструмента піпетки та натисніть кнопку вибору мишею, щоб почати піпетування.\nРежим натискання: інструмент піпетки активується після натискання та відпускання прив'язки інструмента піпетки.\nПрямий режим (прив'язка клавіші): цей параметр дозволяє піпетувати напряму без потреби клацати. Використання вказаної вище прив'язки клавіші одразу перемкне на відповідну будівлю (схвалено гравцями Factorio).\nПрямий режим (середня кнопка миші): цей параметр дозволяє піпетувати напряму без потреби використовувати прив'язку клавіші. Використання середньої кнопки миші одразу перемкне на відповідну будівлю (схвалено гравцями Minecraft).\nІнвертований режим: коли будівлю вибрано, натисніть прив'язку клавіші інструмента піпетки, щоб перемкнути відповідний об'єкт."
thTH = "Hold Mode: กดปุ่มทางลัดเครื่องมือหยดของเหลวค้างไว้ แล้วใช้ปุ่มเลือกด้วยเมาส์เพื่อเริ่มการหยดของเหลว\nPress Mode: เครื่องมือหยดของเหลวจะเปิดใช้งานหลังจากกดแล้วปล่อยปุ่มทางลัดเครื่องมือหยดของเหลว\nDirect Mode (Key Bind): การตั้งค่านี้ให้หยดของเหลวได้โดยตรงโดยไม่ต้องคลิก เมื่อใช้ปุ่มทางลัดด้านบน ระบบจะสลับไปยังอาคารที่เกี่ยวข้องทันที (ผู้เล่น Factorio ยอมรับ)\nDirect Mode (Middle Mouse Button): การตั้งค่านี้ให้หยดของเหลวได้โดยตรงโดยไม่ต้องใช้ปุ่มทางลัด เมื่อใช้ปุ่มเมาส์กลาง ระบบจะสลับไปยังอาคารที่เกี่ยวข้องทันที (ผู้เล่น Minecraft ยอมรับ)\nInverted Mode: เมื่อเลือกอาคารแล้ว ให้กดปุ่มทางลัดเครื่องมือหยดของเหลวเพื่อสลับไปยังวัตถุที่เกี่ยวข้อง"
csCZ = "Režim držení: Držte tlačítko klávesové zkratky pro Pipette Tool a použijte tlačítko pro výběr myši k začátku pipetování.  \nRežim stisknutí: Pipette Tool je aktivován po stisknutí a uvolnění klávesové zkratky pro Pipette Tool.  \nPřímý režim (klávesová zkratka): Toto nastavení umožňuje přímé pipetování bez nutnosti kliknutí. Použití výše uvedené klávesové zkratky se přímo přepne na relevantní budovu (podporováno hráči Factorio).  \nPřímý režim (střední tlačítko myši): Toto nastavení umožňuje přímé pipetování bez použití klávesové zkratky. Použití středního tlačítka myši se přímo přepne na relevantní budovu (podporováno hráči Minecraft).  \nInvertovaný režim: Když je vybrána budova, stiskněte klávesovou zkratku pro Pipette Tool, abyste přepnuli na relevantní objekt."
viVN = "Chế độ Giữ: Giữ phím tắt của Công cụ Pipette và sử dụng nút Chọn Chuột để bắt đầu thao tác pipette.\nChế độ Nhấn: Công cụ Pipette được kích hoạt sau khi phím tắt của Công cụ Pipette được nhấn và thả.\nChế độ Trực tiếp (Phím tắt): Cài đặt này cho phép thực hiện pipette trực tiếp mà không cần nhấp chuột. Sử dụng phím tắt ở trên sẽ trực tiếp chuyển sang tòa nhà liên quan (được người chơi Factorio phê duyệt).\nChế độ Trực tiếp (Nút Chuột giữa): Cài đặt này cho phép thực hiện pipette trực tiếp mà không cần dùng phím tắt. Sử dụng Nút Chuột giữa sẽ trực tiếp chuyển sang tòa nhà liên quan (được người chơi Minecraft phê duyệt).\nChế độ Đảo ngược: Khi một tòa nhà được chọn, nhấn phím tắt của Công cụ Pipette để chuyển đổi đối tượng liên quan."
caES = "Mode mantenir premut: manteniu premuda la tecla assignada a l'eina de pipeta i useu el botó de selecció del ratolí per començar a fer pipeta.\nMode prémer: l'eina de pipeta s'activa després de prémer i deixar anar la tecla assignada a l'eina de pipeta.\nMode directe (tecla assignada): Aquest ajust permet fer pipeta directament sense haver de fer clic. Si s'utilitza la tecla assignada de dalt, es canviarà directament a l'edifici corresponent (aprovat pels jugadors de Factorio).\nMode directe (botó central del ratolí): Aquest ajust permet fer pipeta directament sense haver d'utilitzar la tecla assignada. Si s'utilitza el botó central del ratolí, es canviarà directament a l'edifici corresponent (aprovat pels jugadors de Minecraft).\nMode invertit: quan se selecciona un edifici, premeu la tecla assignada a l'eina de pipeta per canviar a l'objecte corresponent."
beBY = "Рэжым утрымання: утрымлівайце кнопку прывязкі інструмента піпеткі і націсніце кнопку выбару мышшу, каб пачаць набор.\nРэжым націскання: інструмент піпеткі актывуецца пасля націскання і адпускання прывязкі інструмента піпеткі.\nПрамы рэжым (прывязка клавіш): гэты параметр дазваляе выконваць прамы набор без націскання. Пры выкарыстанні прывязкі вышэй будзе адразу выбрана адпаведная пабудова (падтрымліваецца гульцамі Factorio).\nПрамы рэжым (сярэдняя кнопка мышы): гэты параметр дазваляе выконваць прамы набор без выкарыстання прывязкі клавіш. Пры выкарыстанні сярэдняй кнопкі мышы будзе адразу выбрана адпаведная пабудова (падтрымліваецца гульцамі Minecraft).\nІнвертаваны рэжым: калі пабудова выбрана, націсніце прывязку інструмента піпеткі, каб пераключыць адпаведны аб'ект."
roRO = "Modul Hold: Țineți apăsat butonul de tastă rapidă al uneltei Pipetă și folosiți butonul de selecție cu mouse-ul pentru a începe pipetarea.\nModul Press: Unealta Pipetă este activată după ce tasta rapidă a uneltei Pipetă este apăsată și eliberată.\nModul Direct (Tastă rapidă): Această setare permite pipetarea directă fără a fi nevoie să faceți clic. Folosind tasta rapidă de mai sus, se trece direct la clădirea relevantă (aprobat de jucătorii Factorio).\nModul Direct (Butonul de mijloc al mouse-ului): Această setare permite pipetarea directă fără a fi nevoie să folosiți tasta rapidă. Folosind butonul de mijloc al mouse-ului, se trece direct la clădirea relevantă (aprobat de jucătorii Minecraft).\nModul Inversat: Când este selectată o clădire, apăsați tasta rapidă a uneltei Pipetă pentru a schimba obiectul relevant."
huHU = "Tartás mód: Tartsa lenyomva a Pipetta eszköz billentyűparancs gombját, és használja az egér kijelölés gombját a pipettázás megkezdéséhez.\nNyomásos mód: A Pipetta eszköz aktiválódik, miután a Pipetta eszköz billentyűparancsát megnyomták és elengedték.\nKözvetlen mód (billentyűparancs): Ez a beállítás lehetővé teszi a közvetlen pipettázást kattintás nélkül. A fenti billentyűparancs használatával közvetlenül átvált a megfelelő épületre (Factorio játékosok által jóváhagyva).\nKözvetlen mód (középső egérgomb): Ez a beállítás lehetővé teszi a közvetlen pipettázást a billentyűparancs használata nélkül. A középső egérgomb használatával közvetlenül átvált a megfelelő épületre (Minecraft játékosok által jóváhagyva).\nFordított mód: Amikor egy épület ki van jelölve, nyomja meg a Pipetta eszköz billentyűparancsát a megfelelő objektum átváltásához."
arSA = "وضع الإمساك: امسك زر اختصار أداة القطارة واستخدم زر تحديد الفأرة لبدء السحب بالقطارة.\nوضع الضغط: تُفعّل أداة القطارة بعد الضغط على اختصار أداة القطارة ثم تحريره.\nالوضع المباشر (اختصار لوحة المفاتيح): يتيح هذا الإعداد السحب المباشر بالقطارة دون الحاجة إلى النقر. باستخدام الاختصار أعلاه سينتقل مباشرةً إلى المبنى المعني (معتمد من لاعبي Factorio).\nالوضع المباشر (زر الفأرة الأوسط): يتيح هذا الإعداد السحب المباشر بالقطارة دون الحاجة إلى استخدام اختصار لوحة المفاتيح. باستخدام زر الفأرة الأوسط سينتقل مباشرةً إلى المبنى المعني (معتمد من لاعبي Minecraft).\nالوضع المعكوس: عند تحديد مبنى، اضغط على اختصار أداة القطارة للتبديل إلى الكائن المعني."

