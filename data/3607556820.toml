["oo.ApocalypticMode.ApocalypticModeDescription"]
raw = "Timberborn endless mode.\n\nYou start with double the usual number of beavers.\n\nDroughts and badtides get infinitely longer.\n\nYou are bound to fail."
status = "normal"
enUS = "Timberborn endless mode.\n\nYou start with double the usual number of beavers.\n\nDroughts and badtides get infinitely longer.\n\nYou are bound to fail."
zhCN = "末日无尽模式。<br><br>游戏开始时海狸数量翻倍。<br><br>干旱与恶水潮持续时间无限延长。<br><br>失败终将降临。"
zhTW = "「木材之子」無盡模式。\n\n您將以雙倍的海狸數量開始。\n\n乾旱和惡潮的時間將無限延長。\n\n您注定會失敗。"
ruRU = "Безконечный режим Timberborn.\n\nВы начинаете с удвоенного количества бобров.\n\nЗасухи и плохие приливы становятся бесконечно длинными.\n\nВы обречены на провал."
jaJP = "「ティンバーボーンのエンドレスモード。\n\n通常の倍のビーバーでスタートします。\n\n干ばつと悪潮は無限に長くなります。\n\n失敗する運命にあります。」"
frFR = "Mode sans fin Timberborn.\n\nVous commencez avec le double du nombre habituel de castors.\n\nLes sécheresses et les marées mauvaises deviennent infiniment plus longues.\n\nVous êtes condamné à échouer."
deDE = "Timberborn-Endlosmodus.\n\nSie starten mit der doppelten Anzahl an Bibern.\n\nDürreperioden und schlechte Gezeiten werden unendlich länger.\n\nSie sind zum Scheitern verurteilt."
plPL = "Tryb bez końca Timberborn.\n\nZaczynasz z podwójną liczbą bobrów.\n\nSusze i złe przypływy trwają nieskończoność.\n\nJesteś skazany na porażkę."
ptBR = "Modo Apocalíptico do Timberborn.\n\nVocê começa com o dobro do número habitual de castores.\n\nAs secas e as marés ruins duram infinitamente mais.\n\nVocê está fadado ao fracasso."
koKR = "팀버본 무한 모드.\n\n너는 평소의 두 배에 해당하는 비버로 시작한다.\n\n가뭄과 나쁜 조수는 무한히 길어진다.\n\n너는 실패할 운명이다."
trTR = "Timberborn sonsuz modu.\n\nNormalda olduğundan iki kat fazla kunduz ile başlarsınız.\n\nKuraklıklar ve kötü dalgalar sonsuz bir şekilde uzar.\n\nBaşarısız olmaya mahkumsunuz."
esES = "Timberborn: modo sin fin.\n\nEmpiezas con el doble del número habitual de castores.\n\nLas sequías y las mareas de aguas malas duran infinitamente más.\n\nEstás destinado a fracasar."
itIT = "Modalità infinita di Timberborn.\n\nInizi con il doppio del numero abituale di castori.\n\nSiccità e maree di acqua cattiva durano infinitamente più a lungo.\n\nSei destinato a fallire."
ukUA = "Режим нескінченної гри в Timberborn.\n\nВи починаєте з удвічі більшою кількістю бобрів, ніж зазвичай.\n\nПосухи та отруйні паводки стають нескінченно довшими.\n\nВам судилося провалитися."
thTH = "โหมดไม่มีที่สิ้นสุดของ Timberborn\n\nคุณเริ่มต้นด้วยจำนวนบีเวอร์เป็นสองเท่าของปกติ\n\nภัยแล้งและช่วงน้ำพิษจะยาวนานขึ้นอย่างไม่มีที่สิ้นสุด\n\nคุณจะต้องล้มเหลวอย่างแน่นอน"
csCZ = "Režim bez konce Timberborn.\n\nZačínáte s dvojnásobným počtem bobrů.\n\nSucha a špatné přílivy trvají nekonečně dlouho.\n\nJste odsouzeni k neúspěchu."
viVN = "Chế độ vô hạn Timberborn.\n\nBạn bắt đầu với gấp đôi số lượng hải ly như thường lệ.\n\nHạn hán và thủy triều xấu kéo dài vô tận.\n\nBạn chắc chắn sẽ thất bại."
caES = "Timberborn en mode infinit.\n\nComencES amb el doble del nombre habitual de castors.\n\nLes sequeres i les marees de aigua contaminada es fan infinitament més llargues.\n\nEstàs condemnat al fracàs."
beBY = "Бясконцы рэжым Timberborn.\n\nВы пачынаеце з удвая большай, чым звычайна, колькасцю баброў.\n\nЗасухі і паводкі з таксічнай вадой бясконца падаўжаюцца.\n\nВам наканавана пацярпець няўдачу."
roRO = "Timberborn în modul infinit.\n\nÎncepi cu dublul numărului obișnuit de castori.\n\nSecetele și badtide-urile devin infinit de lungi.\n\nEști sortit să eșuezi."
huHU = "Timberborn végtelen mód.\n\nA szokásos mennyiség kétszeresével kezdesz hódokkal.\n\nAz aszályok és a mérgezett áradások végtelenül hosszúra nyúlnak.\n\nBukásra vagy ítélve."
arSA = "وضع Timberborn اللانهائي.\n\nتبدأ بضعف العدد المعتاد من القنادس.\n\nتصبح فترات الجفاف وموجات المياه الفاسدة أطول بلا حدود.\n\nستفشل حتمًا."
