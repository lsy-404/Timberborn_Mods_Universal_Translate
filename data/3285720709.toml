["Knatte.Valve1X.Description"]
raw = "Oneway Valve with levee in the middle\nNo power needed and does not transfer\n1.5cms max flow"
status = "abandoned"
enUS = "One-way valve with a levee in the middle. No power needed and does not transfer. Maximum flow of 1.5 cm."
zhCN = "能单向流过液体，两侧水位达到阈值或相等时会停止运作，取消水位检测可以解除部分限制。<br><color=#FFA500>最大流量可调节，上限为每秒 1.5 立方米，出口水位阈值为高于 0.6 米，进口水位阈值为低于 0.2 米（相对于单向阀平面）。</color>"
