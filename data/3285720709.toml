["Knatte.PipeU.Description"]
raw = "Levees on both sides of the pipe and a input and output pipe.\nPipe going underground between Levees\nLeeve need to be powered but also act as transfer\nDo not place Levees in hex above the Output Pipe! it will crash!"
status = "normal"
enUS = "Levees on both sides of the pipe and an input and output pipe. Pipe going underground between levees. Levees need to be powered but also act as a transfer. Do not place levees in hex above the output pipe! It will crash!"
zhCN = "改进的机械液体泵，能单向输送液体，输送管道位于地下，水位高于出口时会停止运作。<br><color=#FFA500>防洪堤部分能传输能量；最大流量每秒 0.4 立方米。</color><br><color=#FF4C4C>禁止在出口上方一格建造防洪堤或其他防水建筑，否则会游戏崩溃。</color>"
zhTW = "兩側有堤防和一個進水管及一個出水管。管道在堤防之間埋入地下。堤防需要供電，並且也需作為轉移。請不要在輸出管上方的六邊形中放置堤防！這會導致崩潰！"
ruRU = "На обоих концах трубы должны быть дамбы, а также входная и выходная трубы. Дамбы должны быть подключены к энергосети. \nНе размещайте дамбы в шестиграннике выше выходной трубы! Это приведет к крашу игры!"
jaJP = "パイプの両側に堤防があり、入力と出力のパイプがあります。  \n堤防の間を通る地下のパイプ。  \n堤防には電源が必要ですが、転送としても機能します。  \n出力パイプの上に堤防を配置しないでください！クラッシュします！"
frFR = "Des digues des deux côtés du tuyau et un tuyau d'entrée et de sortie. \nTuyau allant sous terre entre les digues. \nLes digues doivent être alimentées mais doivent également agir comme un transfert. \nNe placez pas les digues dans l'hexagone au-dessus du tuyau de sortie ! Cela fera planter le jeu !"
deDE = "Dämme auf beiden Seiten des Rohrs und ein Ein- und Auslassrohr. Rohr, das unterirdisch zwischen den Dämmen verläuft. Dämme müssen mit Strom versorgt werden, funktionieren aber auch als Transfer. Platziere keine Dämme in dem Hexfeld über dem Auslassrohr! Das führt zum Absturz!"
plPL = "Wały po obu stronach rury oraz rura wejściowa i wyjściowa.  \nRura przechodzi pod ziemią między wałami.  \nWały muszą być zasilane, ale także działać jako transfer.  \nNie umieszczaj wałów w heksach powyżej rury wyjściowej! To spowoduje awarię!"
ptBR = "Barragens de ambos os lados do tubo e um tubo de entrada e saída.  \nTubo indo para baixo entre as barragens.  \nAs barragens precisam ser alimentadas, mas também atuar como transferência.  \nNão coloque as barragens no hex acima do tubo de saída! Isso causará uma falha!"
koKR = "파이프 양쪽에 제방이 있고 입력 및 출력 파이프가 있습니다.\n제방 사이로 땅속에 있는 파이프\n제방은 전원이 필요하지만 전송 역할도 합니다.\n출력 파이프 위의 육각형에 제방을 배치하지 마세요! 크래시가 발생합니다!"
trTR = "Borunun her iki tarafında setler ve bir giriş ve çıkış borusu.  \nSetler arasında yer altına giden boru.  \nSetlerin enerjiye ihtiyacı var ama aynı zamanda aktarma işlevi de görmelidir.  \nÇıkış borusunun üzerindeki altıgenlere set yerleştirmeyin! Çöker!"
esES = "Diques a ambos lados de la tubería, y una tubería de entrada y otra de salida.\nTubería que pasa bajo tierra entre diques\nEl dique debe recibir energía, pero también transmite energía\n¡No coloques diques en el hexágono encima de la tubería de salida! ¡El juego se bloqueará!"
itIT = "Argini su entrambi i lati del tubo e un tubo di ingresso e uno di uscita.\nTubo che passa sottoterra tra gli argini\nGli argini devono essere alimentati, ma fungono anche da trasferimento di energia\nNon posizionare argini nell'esagono sopra il tubo di uscita! Il gioco andrà in crash!"
ukUA = "Дамби з обох боків труби, а також вхідна й вихідна труби.\nТруба проходить під землею між дамбами\nДамба потребує живлення, але також передає енергію\nНе розміщуйте дамби на гексі над вихідною трубою! Гра аварійно завершиться!"
thTH = "คันกั้นน้ำอยู่ทั้งสองด้านของท่อ พร้อมท่อทางเข้าและท่อทางออก\nท่อที่ลอดใต้ดินระหว่างคันกั้นน้ำ\nคันกั้นน้ำต้องได้รับพลังงาน แต่ก็ทำหน้าที่ถ่ายทอดพลังงานด้วย\nห้ามวางคันกั้นน้ำในช่องหกเหลี่ยมเหนือท่อทางออก! เกมจะล่ม!"
csCZ = "Fonáží na obou stranách potrubí a vstupní a výstupní potrubí.\nPotrubí jdoucí pod zem mezi fonážemi.\nFonáže je třeba napájet, ale také fungují jako převodní zařízení.\nNeskládejte fonáže do hexu nad výstupním potrubím! dojde k pádu!"
viVN = "Đê hai bên của ống và một ống đầu vào và một ống đầu ra.\nỐng ngầm giữa các đê.\nĐê cần được cấp nguồn nhưng cũng hoạt động như một điểm truyền tải.\nKhông đặt đê trên ô lục giác phía trên ống đầu ra! Nó sẽ làm game bị treo!"
caES = "Dics a banda i banda de la canonada, i una canonada d’entrada i una de sortida.\nCanonada que passa per sota terra entre els dics\nEl dic ha d’estar alimentat, però també actua com a transmissor\nNo col·loquis dics a l’hexàgon situat damunt de la canonada de sortida! El joc es bloquejarà!"
beBY = "Дамбы па абодва бакі трубы, а таксама ўваходная і выходная трубы.\nТруба, якая праходзіць пад зямлёй паміж дамбамі\nДамба павінна атрымліваць энергію, але таксама служыць для яе перадачы\nНе размяшчайце дамбы ў гексе над выходнай трубой! Гэта прывядзе да збою!"
roRO = "Diguri de ambele părți ale conductei și o conductă de intrare și una de ieșire.\nConductă care trece pe sub pământ între diguri\nDigul trebuie alimentat cu energie, dar transmite și puterea\nNu amplasa diguri în hexagonul de deasupra conductei de ieșire! Jocul se va bloca!"
huHU = "Töltések a cső mindkét oldalán, valamint egy bemeneti és egy kimeneti cső.\nA töltések között a föld alatt haladó cső\nA töltésnek erőt kell kapnia, de az erőt is továbbítja\nNe helyezz töltéseket a kimeneti cső fölötti hatszögmezőre! A játék össze fog omlani!"
arSA = "سدود على جانبي الأنبوب، وأنبوب إدخال وأنبوب إخراج.\nأنبوب يمر تحت الأرض بين السدود\nيحتاج السد إلى الطاقة، لكنه يعمل أيضًا كناقل للطاقة\nلا تضع السدود في الخانة السداسية فوق أنبوب الإخراج! ستتعطل اللعبة!"

