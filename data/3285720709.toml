["Knatte.Pipe.Description"]
raw = "Levees on both sides of the pipe and a input and output pipe. Leeve need to be powered but also act as transfer\nDo not place Levees in hex above the Output Pipe! it will crash!"
status = "normal"
enUS = "Levees on both sides of the pipe and an input and output pipe. Levees need to be powered but also act as transfer. Do not place Levees in hex above the Output Pipe! It will crash!"
zhCN = "改进的机械液体泵，能单向输送液体，水位高于出口时会停止运作。<br><color=#FFA500>防洪堤部分能传输能量；最大流量每秒 0.4 立方米。</color><br><color=#FF4C4C>禁止在出口上方一格建造防洪堤或其他防水建筑，否则会游戏崩溃。</color>"
zhTW = "在管道兩側設置壩體，並有一個輸入管和一個輸出管。壩體需要有電力供應，但也必須能作為傳輸介質。請勿將壩體放置在輸出管上方的六邊形中！這樣會導致崩潰！"
ruRU = "На обоих концах трубы должны быть дамбы, а также входная и выходная трубы. Дамбы должны быть подключены к энергосети. \nНе размещайте дамбы в шестиграннике выше выходной трубы! Это приведет к крашу игры!"
jaJP = "パイプの両側にレバーがあり、入力と出力のパイプがあります。レバーは電源が必要ですが、転送機能も果たします。\n出力パイプの上にヘクス形式でレバーを配置しないでください！クラッシュします！"
frFR = "Des levées de chaque côté du tuyau et un tuyau d'entrée et de sortie. Les levées doivent être alimentées mais doivent également agir comme un transfert. Ne placez pas de levées dans l'hexagone au-dessus du tuyau de sortie ! Cela fera planter le jeu !"
deDE = "Dämme auf beiden Seiten des Rohres und ein Eingangs- und Auslassrohr. Die Dämme müssen mit Energie versorgt werden, sollen aber auch als Transfer fungieren. \nPlatziere keine Dämme in der Hex über dem Auslassrohr! Es wird abstürzen!"
plPL = "Tam, tamy po obu stronach rury oraz rura wejściowa i wyjściowa. Tamy muszą być zasilane, ale także pełnić rolę transferu. \nNie umieszczaj tam w systemie heksowym nad rurą wyjściową! To spowoduje awarię!"
ptBR = "Diques em ambos os lados do tubo e um tubo de entrada e saída. Os diques precisam ser alimentados, mas também atuar como transferência. Não coloque diques em hex acima do tubo de saída! Isso fará com que o jogo trave!"
koKR = "파이프 양쪽에 레벨이 있고, 입력 및 출력 파이프가 있습니다. 레벨은 전력이 필요하지만 전송 역할도 합니다. 출력 파이프 위의 육각형에 레벨을 배치하지 마세요! 게임이 충돌할 수 있습니다!"
trTR = "Borunun her iki yanında setler ve bir giriş ve çıkış borusu var. Setlerin güçlenmesi gerekiyor ancak aktarım işlevi de görmelidir. Çıkış borusunun üzerindeki altıgenlere set yerleştirmeyin! Çökmesine neden olacaktır!"
esES = "Diques a ambos lados de la tubería y una tubería de entrada y otra de salida. El dique necesita energía, pero también sirve para transmitirla.\n¡No coloques diques en la casilla hexagonal encima de la tubería de salida! ¡El juego se bloqueará!"
itIT = "Argini su entrambi i lati del tubo, con un tubo di ingresso e uno di uscita. Gli argini devono ricevere energia, ma fungono anche da trasmissione di energia\nNon posizionare argini nell'esagono sopra il tubo di uscita! Il gioco andrà in crash!"
ukUA = "Греблі по обидва боки труби, а також вхідна та вихідна труби. Гребля має отримувати живлення, але також слугує для передавання енергії\nНе розміщуйте греблі в гексі над вихідною трубою! Це призведе до аварійного завершення гри!"
thTH = "เขื่อนกั้นน้ำทั้งสองด้านของท่อ และท่อรับเข้าและท่อส่งออก เขื่อนกั้นน้ำต้องได้รับพลังงาน แต่ยังทำหน้าที่ถ่ายทอดพลังงานด้วย\nห้ามวางเขื่อนกั้นน้ำในช่องหกเหลี่ยมเหนือท่อส่งออก! มิเช่นนั้นเกมจะขัดข้อง!"
csCZ = "Stěny na obou stranách potrubí a vstupní a výstupní potrubí. Stěny je třeba napájet, ale také fungují jako přenos. \nNesázujte stěny do hexu nad výstupním potrubím! dojde k chybě!"
viVN = "Đê chắn nước ở hai bên của ống và một ống đầu vào và đầu ra. Đê cần được cấp nguồn nhưng cũng hoạt động như truyền tải\nKhông đặt đê chắn nước ở ô lục giác phía trên Ống Đầu Ra! nó sẽ làm game bị treo!"
caES = "Dics a banda i banda de la canonada, i una canonada d'entrada i una de sortida. El dic ha de rebre potència, però també serveix per transmetre-la.\nNo col·loqueu dics a la casella situada damunt de la canonada de sortida! El joc es bloquejarà!"
beBY = "Плаціны па абодва бакі трубы, а таксама ўваходная і выходная трубы. Плаціны мусяць атрымліваць механічную магутнасць, але таксама перадаюць яе\nНе размяшчайце плаціны ў клетцы над выходнай трубой! Гэта прывядзе да збою!"
roRO = "Diguri de ambele părți ale conductei și o conductă de intrare și una de ieșire. Digurile trebuie alimentate cu energie, dar transferă și energia.\nNu amplasa diguri în hexagonul de deasupra conductei de ieșire! Jocul se va bloca!"
huHU = "Töltések a cső mindkét oldalán, valamint egy bemeneti és egy kimeneti cső. A töltéseknek meghajtást kell kapniuk, de erőátviteli elemként is működnek\nNe helyezz töltéseket a kimeneti cső fölötti hexára! Összeomlik a játék!"
arSA = "سدود على جانبي الأنبوب، وأنبوب إدخال وأنبوب إخراج. يجب تزويد السدود بالطاقة، لكنها تعمل أيضًا كناقل للطاقة.\nلا تضع السدود في الخانة السداسية فوق أنبوب الإخراج! سيؤدي ذلك إلى تعطل اللعبة!"

