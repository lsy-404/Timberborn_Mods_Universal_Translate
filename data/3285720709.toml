["Knatte.PipeHU.Description"]
raw = "High Power version with a Levees on both sides of the pipe and a input and output pipe.\nPipe going underground between Levees\nLeeve need to be powered but also act as transfer\nDo not place Levees in hex above the Output Pipe! it will crash!"
status = "normal"
enUS = "High Power version with levees on both sides of the pipe and an input and output pipe. The pipe goes underground between the levees. Levees need to be powered but also act as transfer. Do not place levees in hex above the output pipe! It will crash!"
zhCN = "改进的机械液体泵，能单向输送液体，输送管道位于地下，出口较高，水位高于出口时会停止运作。<br><color=#FFA500>防洪堤部分能传输能量；最大流量每秒 1.2 立方米。</color><br><color=#FF4C4C>禁止在出口上方一格建造防洪堤或其他防水建筑，否则会游戏崩溃。</color>"
zhTW = "高功率版本，管道兩側有堤防，並且有進口管和出口管。  \n管道在堤防之間埋入地下。  \n堤防需要供電，但也要作為轉運。  \n請勿在出口管上方的六邊形放置堤防！這樣會崩潰！"
ruRU = "Версия с высокой мощностью. На обоих концах трубы должны быть дамбы, а также входная и выходная трубы. Дамбы должны быть подключены к энергосети. \nНе размещайте дамбы в шестиграннике выше выходной трубы! Это приведет к крашу игры!"
jaJP = "高出力バージョンで、パイプの両側にレヴがあり、入力パイプと出力パイプがあります。レヴの間に地下にパイプが通っています。レヴには電力が供給される必要がありますが、転送機能も果たします。出力パイプの上のヘックスにはレヴを配置しないでください！クラッシュします！"
frFR = "Version haute puissance avec des levees des deux côtés du tuyau et un tuyau d'entrée et de sortie. Tuyau allant sous terre entre les levees. Les levees doivent être alimentées mais aussi servir de transfert. Ne placez pas les levees dans l'hexagone au-dessus du tuyau de sortie ! Cela provoquera un crash !"
deDE = "Hochleistungsversion mit Dämmen auf beiden Seiten des Rohres sowie einem Einlass- und Auslassrohr. Rohr geht unterirdisch zwischen den Dämmen. Dämme müssen mit Strom versorgt werden, dienen aber auch als Transfer. Setzen Sie die Dämme nicht in das Hex über dem Auslassrohr! Es wird abstürzen!"
plPL = "Wersja o wysokiej mocy z wałami po obu stronach rury oraz rurą wejściową i wyjściową. Rura idąca pod ziemią między wałami. Wały muszą być zasilane, ale również pełnić funkcję transferu. Nie umieszczaj wałów w heksagonie nad rurą wyjściową! To spowoduje awarię!"
ptBR = "Versão de Alta Potência com um dique de cada lado do tubo e um tubo de entrada e saída. Tubo indo para baixo entre os diques. Os diques precisam ser alimentados, mas também atuar como transferência. Não coloque diques no hex acima do Tubo de Saída! Isso fará o sistema travar!"
koKR = "파이프 양쪽에 제방이 있는 고출력 버전으로, 입력 및 출력 파이프가 포함되어 있습니다.  \n제방 사이로 지하로 가는 파이프입니다.  \n제방은 전원이 필요하지만 전달 역할도 해야 합니다.  \n출력 파이프 위의 육각형에 제방을 두지 마세요! 게임이 충돌할 수 있습니다!"
trTR = "Her iki tarafında set bulunan yüksek güç versiyonu ve bir giriş ve çıkış borusu. Boru setler arasında yer altına gidiyor. Setin güçlendirilmesi gerekiyor ancak aynı zamanda transfer işlevi görüyor. Çıkış borusunun üstündeki altıgen alana set yerleştirmeyin! Bu bir çöküşe neden olur!"
esES = "Versión de alta potencia con diques a ambos lados de la tubería y una tubería de entrada y otra de salida.\nTubería que pasa bajo tierra entre diques\nEl dique debe recibir energía, pero también transmite potencia.\n¡No coloques diques en el hexágono situado encima de la tubería de salida! ¡El juego se bloqueará!"
itIT = "Versione ad alta potenza con argini su entrambi i lati del tubo e un tubo di ingresso e uno di uscita.\nTubo che passa sottoterra tra gli argini\nGli argini devono essere alimentati, ma fungono anche da trasmissione di energia\nNon posizionare argini nell’esagono sopra il tubo di uscita! Il gioco andrà in crash!"
ukUA = "Високопотужна версія з дамбами по обидва боки труби та вхідною й вихідною трубами.\nТруба проходить під землею між дамбами\nДамба має отримувати живлення, але також передає потужність\nНе розміщуйте дамби в гексі над вихідною трубою! Це призведе до аварійного завершення гри!"
thTH = "รุ่นกำลังสูง พร้อมคันกั้นน้ำทั้งสองด้านของท่อ และมีท่อทางเข้าและทางออก\nท่อลอดใต้ดินระหว่างคันกั้นน้ำ\nคันกั้นน้ำต้องได้รับพลังงาน แต่ก็ทำหน้าที่ถ่ายทอดพลังงานด้วย\nห้ามวางคันกั้นน้ำในช่องหกเหลี่ยมเหนือท่อทางออก! มิฉะนั้นเกมจะขัดข้อง!"
csCZ = "Verze s vysokým výkonem se hrázemi na obou stranách potrubí a vstupním a výstupním potrubím.\nPotrubí vedoucí pod zemí mezi hrázemi.\nHráze musí být napájeny, ale také fungují jako přenos.\nNenesazujte hráze na hex nad výstupním potrubím! dojde k pádu!"
viVN = "Phiên bản công suất cao với đê chắn nước hai bên của ống và ống đầu vào và đầu ra.\nỐng đi ngầm giữa các đê\nĐê cần được cấp nguồn nhưng cũng đóng vai trò chuyển tiếp\nĐừng đặt đê trên ô lục giác phía trên Ống Đầu Ra! nó sẽ bị treo!"
caES = "Versió d'alta potència amb dics a banda i banda de la canonada, i una canonada d'entrada i una de sortida.\nCanonada que passa per sota terra entre dics\nEl dic ha d'estar alimentat, però també serveix per transmetre potència\nNo col·loquis dics a l'hexàgon situat damunt de la canonada de sortida! El joc es bloquejarà!"
beBY = "Версія з высокай магутнасцю, з дамбамі па абодва бакі трубы і ўваходнай і выходнай трубамі.\nТруба праходзіць пад зямлёй паміж дамбамі\nДамба павінна быць падключана да сеткі магутнасці, але яна таксама служыць для перадачы магутнасці\nНе размяшчайце дамбы ў клетцы над выходнай трубой! Гэта прывядзе да збою гульні!"
roRO = "Versiune de mare putere, cu diguri de ambele părți ale conductei și conducte de intrare și de ieșire.\nConductă care trece pe sub pământ între diguri\nDigurile trebuie alimentate cu energie, dar transmit și ele energia\nNu amplasa diguri pe hexagonul de deasupra conductei de ieșire! Jocul se va bloca!"
huHU = "Nagy teljesítményű változat, a cső mindkét oldalán gáttal, valamint egy be- és egy kimeneti csővel.\nA cső a gátak között halad a föld alatt.\nA gátaknak hajtást kell kapniuk, de az erőátvitelt is biztosítják.\nNe helyezz gátat a kimeneti cső feletti mezőre! Összeomlik a játék!"
arSA = "نسخة ذات قدرة عالية مع سدود جانبية على جانبي الأنبوب، وأنبوب إدخال وأنبوب إخراج.\nالأنبوب يمر تحت الأرض بين السدود الجانبية\nيجب تزويد السدود الجانبية بالطاقة، وتعمل أيضًا كناقل للطاقة\nلا تضع السدود الجانبية في الخلية السداسية الواقعة فوق أنبوب الإخراج! سيؤدي ذلك إلى عطل!"

