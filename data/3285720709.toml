["Knatte.PipeH1X.Description"]
raw = "High Volume Pump Two Levees and a input and output pipe.\nLeeve need to be powered but also act as transfer"
status = "abandoned"
enUS = "High Volume Pump Two Levees and an input and output pipe. Levees need to be powered but also act as transfer."
zhCN = "改进的机械液体泵，能单向输送液体，出口较高，水位高于出口时会停止运作。<br><color=#FFA500>防洪堤部分能传输能量；最大流量每秒 1.2 立方米。</color><br><color=#FF4C4C>禁止在出口上方一格建造防洪堤或其他防水建筑，否则会游戏崩溃。</color>"
zhTW = "高容量泵，兩個壩一道進水管和一道出水管。壩需要通電，但同時也要作為轉移使用。"
ruRU = "Насос с высоким объемом, два ливня и входная и выходная трубы. Ливни необходимо питать, но они также должны выполнять функцию передачи."
jaJP = "ハイボリュームポンプ、2つの堤防、および入力と出力のパイプ。堤防は電力を供給する必要がありますが、同時に移送としても機能します。"
frFR = "Pompe à haut débit, deux digues et un tube d'entrée et de sortie. Les digues doivent être alimentées, mais doivent également servir de transfert."
deDE = "Hochvolumenpumpe zwei Dämme und ein Ein- und Auslassrohr. Dämme müssen mit Energie versorgt werden, aber auch als Transfer fungieren."
plPL = "Pomp o dużej wydajności, dwa wały i rura wejściowa oraz rura wyjściowa. Wały muszą być zasilane, ale także działać jako transfer."
ptBR = "Bomba de Alto Volume Dois Diques e um tubo de entrada e saída. Os diques precisam ser alimentados, mas também atuar como transferência."
koKR = "대용량 펌프 두 개의 제방과 입력 및 출력 파이프. 제방은 전원이 필요하지만 또한 전송 역할을 합니다."
trTR = "Yüksek Hacimli Pompa İki Set ve bir giriş ve çıkış borusu. Setler enerjiye ihtiyaç duyar ama aynı zamanda aktarma işlevi de görür."
esES = "Bomba de gran volumen, dos diques y una tubería de entrada y otra de salida.\nEl dique debe recibir energía, pero también sirve para transmitirla."
itIT = "Pompa ad alto volume, due argini e un tubo di ingresso e uno di uscita.\nL'argine deve essere alimentato, ma funge anche da trasmissione di energia."
ukUA = "Насос великої продуктивності, дві греблі та вхідна й вихідна труби.\nГреблям потрібне живлення, але вони також передають механічну потужність."
thTH = "ปั๊มอัตราการสูบสูง เขื่อนกั้นน้ำสองแห่ง และท่อทางเข้าและทางออก\nเขื่อนกั้นน้ำต้องใช้พลังงาน แต่ยังทำหน้าที่ถ่ายทอดพลังงานด้วย"
csCZ = "Velkokapacitní čerpadlo, dvě hráze a vstupní a výstupní potrubí. Hráze musí být napájeny, ale také slouží jako přenos."
viVN = "Máy bơm lưu lượng lớn, hai đê điều và một ống đầu vào và đầu ra. Đê điều cần được cấp nguồn nhưng cũng hoạt động như một đường truyền."
caES = "Bomba de gran cabal: dues rescloses i una canonada d’entrada i una de sortida.\nLes rescloses necessiten potència, però també serveixen per transmetre-la."
beBY = "Помпа вялікай прадукцыйнасці: дзве дамбы, уваходная труба і выходная труба.\nДамбы павінны быць забяспечаны энергіяй, але яны таксама служаць для яе перадачы."
roRO = "Pompă de mare debit, două diguri și o conductă de intrare și ieșire.\nDigurile trebuie să primească putere, dar servesc și la transmiterea acesteia."
huHU = "Nagy térfogatáramú szivattyú, két töltés, egy bemeneti és egy kimeneti cső.\nA töltést hajtóerővel kell ellátni, de továbbítja is azt."
arSA = "مضخة عالية التدفق، وسدّان، وأنبوب إدخال وأنبوب إخراج.\nيجب تزويد السد بالطاقة، لكنه يعمل أيضًا ناقلًا للطاقة"

