["Knatte.Pipe1X.Description"]
raw = "Two Levees and a input and output pipe. Leeve need to be powered but also act as transfer\nDo not place Levees in hex above the Output Pipe! it will crash!"
status = "abandoned"
enUS = "Two Levees and an input and output pipe. Levees need to be powered but also act as transfer. Do not place Levees in hex above the Output Pipe! It will crash!"
zhCN = "改进的机械液体泵，能单向输送液体，水位高于出口时会停止运作。<br><color=#FFA500>防洪堤部分能传输能量；最大流量每秒 0.4 立方米。</color><br><color=#FF4C4C>禁止在出口上方一格建造防洪堤或其他防水建筑，否则会游戏崩溃。</color>"
zhTW = "兩個堤防和一個進出口管道。堤防需要供電，但也要作為傳輸使用。不要將堤防放置在輸出管道上方的六邊形內！這樣會崩潰！"
ruRU = "Два левого и один входной и выходной трубопровод. Левое необходимо подключить к питанию, но оно также должно действовать как передатчик. Не размещайте левое в шестиугольниках над выходной трубой! Это приведет к сбою!"
jaJP = "二つの堤防と入力および出力パイプがあります。堤防は電力を供給する必要がありますが、転送としても機能します。\n出力パイプの上に堤防を六角形で配置しないでください！クラッシュします！"
frFR = "Deux digues et un tuyau d'entrée et de sortie. Les digues doivent être alimentées mais aussi agir comme un transfert. Ne placez pas les digues en hexagone au-dessus du tuyau de sortie ! Cela va provoquer un crash !"
deDE = "Zwei Schleusen und ein Ein- und Auslaufrohr. Die Schleusen müssen mit Strom versorgt werden, wirken aber auch als Transfer. Platziere die Schleusen nicht im Hex über dem Auslaufrohr! Es wird abstürzen!"
plPL = "Dwa groble i rura wejściowa i wyjściowa. Groble muszą być zasilane, ale również działać jako transfer. \nNie umieszczaj grobli w heksie nad rurą wyjściową! To spowoduje awarię!"
ptBR = "Dois diques e um tubo de entrada e saída. Os diques precisam ser alimentados, mas também devem atuar como transferência. Não coloque os diques em hex acima do tubo de saída! Isso causará uma falha!"
koKR = "두 개의 둑과 입력 및 출력 파이프. 둑은 전원이 필요하지만 전송 역할도 수행합니다. 출력 파이프 위의 육각형에 둑을 설치하지 마세요! 크래시가 발생할 것입니다!"
trTR = "İki Set ve bir giriş ve çıkış borusu. Setlerin güçlendirilmesi gerekir, ancak aynı zamanda aktarım görevi görür. Setleri Çıkış Borusunun üstündeki altıgenlere yerleştirmeyin! Çöker!"
esES = "Dos diques y una tubería de entrada y otra de salida. Los diques necesitan recibir energía, pero también la transmiten.\n¡No coloques diques en el hexágono encima de la tubería de salida! ¡El juego se cerrará de forma inesperada!"
itIT = "Due argini e un tubo di ingresso e uno di uscita. Gli argini devono essere alimentati, ma fungono anche da trasmissione di energia.\nNon posizionare gli argini nell'esagono sopra il tubo di uscita! Il gioco andrà in crash!"
ukUA = "Дві дамби, вхідна й вихідна труби. Дамби мають отримувати живлення, але також передають його далі\nНе розміщуйте дамби в гексі над вихідною трубою! Це призведе до аварійного завершення гри!"
thTH = "เขื่อนกั้นน้ำสองอัน และท่อทางเข้าและท่อทางออก เขื่อนกั้นน้ำต้องได้รับพลังงาน แต่ยังทำหน้าที่ถ่ายทอดพลังงานด้วย\nห้ามวางเขื่อนกั้นน้ำในช่องหกเหลี่ยมเหนือท่อทางออก! เกมจะขัดข้อง!"
csCZ = "Dvě hráze a vstupní a výstupní potrubí. Hráze potřebují být napájeny, ale také fungují jako přenos. \nNenechávejte hráze v hexu nad výstupním potrubím! Způsobí to pád!"
viVN = "Hai đê và một ống đầu vào và đầu ra. Đê cần được cấp nguồn nhưng cũng đóng vai trò truyền nước.\nKhông đặt đê trên lưới hình lục giác phía trên ống đầu ra! Nó sẽ làm game bị treo!"
caES = "Dos dics i una canonada d'entrada i de sortida. Els dics han de rebre energia, però també serveixen per transmetre-la\nNo col·loqueu dics a l'hexàgon per sobre de la canonada de sortida! El joc es bloquejarà!"
beBY = "Дзве дамбы, а таксама ўваходная і выходная трубы. Дамбы павінны атрымліваць механічную магутнасць, але таксама служаць для яе перадачы\nНе размяшчайце дамбы ў клетцы над выходнай трубой! Гульня аварыйна завершыцца!"
roRO = "Două diguri și o conductă de intrare și una de ieșire. Digurile trebuie să fie alimentate cu energie, dar servesc și la transferul puterii\nNu amplasați diguri în hexagonul de deasupra conductei de ieșire! Jocul se va bloca!"
huHU = "Két gát, valamint egy bemeneti és egy kimeneti cső. A gátaknak meghajtásra van szükségük, de erőátviteli elemként is működnek.\nNe helyezz gátakat a kimeneti cső feletti hexmezőre! Ettől összeomlik a játék!"
arSA = "سدّان وأنبوب إدخال وأنبوب إخراج. يجب تزويد السدود بالطاقة، لكنها تعمل أيضًا كناقل للطاقة.\nلا تضع السدود في الخانة السداسية فوق أنبوب الإخراج! سيؤدي ذلك إلى تعطّل اللعبة!"

