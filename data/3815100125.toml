["Deepfurs.ReversiblePump.Hint.Pumping"]
raw = "Pumping. Switch on reverse mode to open the pump into a pipe and generate power from the water flowing through it."
status = "normal"
enUS = "Pumping. Switch on reverse mode to open the pump into a pipe and generate power from the water flowing through it."
zhCN = "抽水。开启反向模式，将水泵接入管道，并利用流经其中的水产生动力。"
zhTW = "抽水中。開啟反向模式，讓水泵連接管道，並利用流經管道的水產生動力。"
ruRU = "Перекачка. Включите реверсивный режим, чтобы открыть насос в сторону трубы и вырабатывать энергию за счёт протекающей через него воды."
jaJP = "揚水中。逆転モードをオンにすると、ポンプを開いてパイプにつなぎ、そこを流れる水から電力を生み出します。"
frFR = "Pompage. Activez le mode inversé pour ouvrir la pompe sur un tuyau et produire de l’énergie grâce à l’eau qui la traverse."
deDE = "Pumpbetrieb. Aktiviere den Umkehrmodus, um die Pumpe zu einem Rohr hin zu öffnen und Strom aus dem hindurchfließenden Wasser zu erzeugen."
plPL = "Pompowanie. Włącz tryb odwrotny, aby otworzyć pompę do rury i wytwarzać energię z przepływającej przez nią wody."
ptBR = "Bombeamento. Ative o modo reverso para abrir a bomba para um cano e gerar energia com a água que flui por ele."
koKR = "양수 중입니다. 역방향 모드를 켜면 펌프가 파이프처럼 열려, 그 안을 흐르는 물로 동력을 생성합니다."
trTR = "Pompalama. Pompayı bir boruya açmak ve içinden akan sudan güç üretmek için ters modu açın."
esES = "Bombeo. Active el modo inverso para abrir la bomba hacia una tubería y generar energía a partir del agua que fluye por ella."
itIT = "Pompaggio. Attiva la modalità inversa per aprire la pompa in una tubatura e generare energia dall'acqua che vi scorre attraverso."
ukUA = "Накачування. Увімкніть зворотний режим, щоб відкрити насос у трубу та генерувати енергію з води, що тече крізь неї."
thTH = "สูบน้ำ เปิดโหมดย้อนกลับเพื่อเปลี่ยนปั๊มให้เป็นท่อ และผลิตพลังงานจากน้ำที่ไหลผ่านท่อ"
csCZ = "Čerpání. Zapněte reverzní režim, aby se čerpadlo otevřelo do potrubí a vyrábělo energii z vody, která jím protéká."
viVN = "Bơm. Bật chế độ đảo chiều để mở máy bơm vào đường ống và tạo ra năng lượng từ dòng nước chảy qua đó."
caES = "Bombament. Activeu el mode invers per obrir la bomba cap a una canonada i generar energia a partir de l'aigua que hi circula."
beBY = "Помпаванне. Уключыце зваротны рэжым, каб адкрыць помпу ў трубу і выпрацоўваць энергію з вады, якая праз яе працякае."
roRO = "Pompare. Activează modul invers pentru a deschide pompa într-o conductă și a genera energie din apa care curge prin ea."
huHU = "Szivattyúzás. Kapcsold be a fordított üzemmódot, hogy a szivattyú csőként működjön, és a rajta átfolyó vízből áramot termelj."
arSA = "ضخ. فعّل الوضع العكسي لفتح المضخة على شكل أنبوب وتوليد الطاقة من الماء المتدفق عبرها."

