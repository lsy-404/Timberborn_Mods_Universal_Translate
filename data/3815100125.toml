["Building.Deepfurs.FuelGatheringDepot.Description"]
raw = "Holds 80 units of liquid; fill it with biofuel. Idle bots gather around it instead of the District Center and top up from it when they run low. Dry ground only, and one per district."
status = "normal"
enUS = "Holds 80 units of liquid; fill it with biofuel. Idle bots gather around it instead of the District Center and top up from it when they run low. Dry ground only, and one per district."
zhCN = "可储存 80 单位液体；请装入生物燃料。闲置机器人会聚集在这里，而不是区中心，并在燃料不足时从这里补充。只能建在干燥地面上，每个区仅限建造一个。"
zhTW = "可容納 80 單位的液體；請裝入生質燃料。閒置機器人會聚集在此處，而非區域中心，燃料不足時會在此補充。只能建在乾燥地面上，每個區域限建一座。"
ruRU = "Вмещает 80 единиц жидкости; заполните его биотопливом. Бездействующие боты собираются вокруг него вместо районного центра и пополняют запасы, когда топлива становится мало. Только на сухой земле, по одному на район."
jaJP = "液体を80単位貯蔵できます。バイオ燃料を補給してください。待機中のボットは地区センターではなくここに集まり、燃料が少なくなるとここで補給します。乾燥した地面にのみ設置でき、各地区に1つだけ設置できます。"
frFR = "Contient 80 unités de liquide ; remplissez-le de biocarburant. Les bots inactifs se rassemblent autour de ce dépôt plutôt qu'au Centre du district et s'y ravitaillent lorsqu'ils en manquent. Terrain sec uniquement, un seul par district."
deDE = "Fasst 80 Einheiten Flüssigkeit; fülle es mit Biokraftstoff. Untätige Bots versammeln sich darum statt um das Bezirkszentrum und tanken dort auf, wenn ihr Vorrat zur Neige geht. Nur auf trockenem Boden platzierbar, eines pro Bezirk."
plPL = "Mieści 80 jednostek płynu; napełnij go biopaliwem. Nieaktywne boty gromadzą się wokół niego zamiast wokół Centrum dzielnicy i uzupełniają z niego paliwo, gdy zaczyna im go brakować. Tylko na suchym gruncie; jeden na dzielnicę."
ptBR = "Armazena 80 unidades de líquido; abasteça-o com biocombustível. Robôs ociosos se reúnem ao redor dele em vez de no Centro do Distrito e reabastecem nele quando estão com pouco combustível. Somente em terreno seco, e um por distrito."
koKR = "액체를 80단위 저장합니다. 바이오연료를 채워 넣으세요. 대기 중인 봇은 구역 중심지 대신 이곳에 모이며, 연료가 부족해지면 여기서 보충합니다. 마른 땅에만 설치할 수 있으며, 구역당 하나만 설치할 수 있습니다."
csCZ = "Pojme 80 jednotek kapaliny; naplňte ho biopalivem. Nečinní roboti se shromažďují kolem něj místo u centra okrsku a doplňují si z něj zásoby, když jim docházejí. Pouze na suchou půdu, jeden na okrsek."
viVN = "Chứa 80 đơn vị chất lỏng; hãy đổ nhiên liệu sinh học vào đây. Bot đang rảnh sẽ tụ tập quanh đây thay vì ở Trung tâm Quận và tiếp nhiên liệu từ đây khi sắp cạn. Chỉ đặt được trên nền đất khô, mỗi quận chỉ được đặt một công trình."
trTR = "80 birim sıvı depolar; biyoyakıtla doldurun. Boştaki botlar Bölge Merkezi yerine burada toplanır ve yakıtları azaldığında depodan doldurur. Yalnızca kuru zemine yerleştirilebilir ve her bölgede bir tane bulunabilir."

["Building.Deepfurs.FuelGatheringDepot.FlavorDescription"]
raw = "The centre is a lake now. The bots needed somewhere to stand, so they chose the tank that feeds them."
status = "normal"
enUS = "The center is a lake now. The bots needed somewhere to stand, so they chose the tank that feeds them."
zhCN = "中心现在变成了一片湖。机器人需要一个能站的地方，于是它们选了给自己供水的水箱。"
zhTW = "中心現在變成湖了。機器人需要一個站立的地方，所以牠們選了供應燃料給牠們的儲槽。"
ruRU = "Теперь в центре озеро. Ботам нужно было где-то стоять, и они выбрали резервуар, который их снабжает."
jaJP = "中心部は今や湖だ。ボットたちは立つ場所が必要だったので、自分たちに燃料を供給するタンクを選んだ。"
frFR = "Le centre est maintenant un lac. Les robots avaient besoin d’un endroit où se tenir, alors ils ont choisi le réservoir qui les alimente."
deDE = "Das Zentrum ist jetzt ein See. Die Bots brauchten einen Platz zum Stehen und entschieden sich für den Tank, der sie versorgt."
plPL = "Teraz w centrum jest jezioro. Boty potrzebowały miejsca, na którym mogłyby stanąć, więc wybrały zbiornik, który je zasila."
ptBR = "O centro agora é um lago. Os robôs precisavam de um lugar para ficar, então escolheram o tanque que os abastece."
koKR = "이제 중앙은 호수야. 로봇들이 서 있을 곳이 필요해서, 자신들에게 연료를 공급하는 탱크를 골랐어."
csCZ = "Uprostřed je teď jezero. Boti potřebovali někde stát, a tak si vybrali nádrž, která je zásobuje."
viVN = "Giờ trung tâm là một cái hồ. Các bot cần chỗ để đứng, nên chúng chọn cái bể cung cấp nhiên liệu cho mình."
trTR = "Merkez artık bir göl. Botların duracak bir yere ihtiyacı vardı, onlar da kendilerini besleyen tankı seçtiler."

