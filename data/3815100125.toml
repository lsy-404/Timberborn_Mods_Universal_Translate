["Deepfurs.Breeding.Dry.Water"]
status = "normal"
raw = "Dry — needs extra water per cycle. Submerge it and it needs no water at all."
enUS = "Dry — needs extra water per cycle. Submerge it and it needs no water at all."
zhCN = "干燥时——每个周期需要额外的水。将它浸入水中后，则完全不需要水。"
zhTW = "乾燥——每個週期需要額外的水。將其淹沒後，就完全不需要水。"
ruRU = "Сухая — требует дополнительной воды за цикл. Погрузите её в воду, и ей вовсе не понадобится вода."
jaJP = "乾燥時は1サイクルあたりに追加の水が必要です。水没させると水はまったく必要ありません。"
frFR = "À sec — nécessite plus d’eau par cycle. Immergez-le et il n’aura plus besoin d’eau du tout."
deDE = "Trocken – benötigt pro Zyklus zusätzliches Wasser. Tauche es unter, dann benötigt es überhaupt kein Wasser."
plPL = "Sucha — potrzebuje dodatkowej wody na cykl. Zanurz ją, a nie będzie potrzebować wody wcale."
ptBR = "Seco — precisa de água extra por ciclo. Submerja-o e ele não precisará de água alguma."
koKR = "건조 상태 — 주기마다 물이 추가로 필요합니다. 물에 잠기게 하면 물이 전혀 필요하지 않습니다."
csCZ = "Suchý — potřebuje na cyklus více vody. Ponořte ho a nebude potřebovat vůbec žádnou vodu."
viVN = "Khô — cần thêm nước mỗi chu kỳ. Ngập nó trong nước thì hoàn toàn không cần nước."
trTR = "Kuru — döngü başına fazladan suya ihtiyaç duyar. Suya batırıldığında hiç suya ihtiyaç duymaz."

["Deepfurs.Breeding.Submerged.Water"]
status = "normal"
raw = "Submerged — no water needed. Berries alone grow the babies."
enUS = "Submerged — no water needed. Berries alone grow the babies."
zhCN = "浸没状态——无需水。仅靠浆果就能养大幼崽。"
zhTW = "浸沒狀態——不需要水。光靠莓果就能養大幼崽。"
ruRU = "Под водой — вода не нужна. Детёныши растут только на ягодах."
jaJP = "水中でも水は不要。赤ちゃんを育てるのはベリーだけ。"
frFR = "Immergé — pas besoin d’eau. Les baies à elles seules font grandir les bébés."
deDE = "Unter Wasser – kein Wasser nötig. Nur Beeren lassen die Kleinen wachsen."
plPL = "Pod wodą — woda nie jest potrzebna. Same jagody wystarczą, by wychować młode."
ptBR = "Submerso — não precisa de água. Só as frutas silvestres fazem os filhotes crescerem."
