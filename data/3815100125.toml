["Building.Deepfurs.TidalTurbine.Description"]
status = "normal"
raw = "Generates power from flowing water. Output rises with the speed of the current and with how deeply the turbine is submerged, reaching full power once fully underwater. Can be built dry — it simply waits for the water to arrive."
enUS = "Generates power from flowing water. Output increases with the current's speed and how deeply the turbine is submerged, reaching full power when fully underwater. Can be built dry—it simply waits for the water to arrive."
zhCN = "利用流动的水产生动力。输出功率会随水流速度和涡轮机的浸没深度增加；完全浸没时可达到满功率。可以在干燥处建造——它只需等待水流到来。"
zhTW = "利用流動的水產生動力。輸出會隨著水流速度及渦輪機的浸水深度增加；完全沒入水中時，便能達到最大動力輸出。可以在乾燥處建造——它只會等待水流到來。"
ruRU = "Вырабатывает энергию за счёт потока воды. Мощность растёт с увеличением скорости течения и глубины погружения турбины; максимальной мощности она достигает, только полностью скрывшись под водой. Можно построить и на суше — турбина будет ждать, пока придёт вода."
jaJP = "流れる水から動力を生み出します。出力は水流の速さとタービンの水没深度に応じて上昇し、完全に水中に沈むと最大出力に達します。乾いた場所にも建設でき、水が来るのを待つだけです。"
frFR = "Produit de l'énergie grâce à l'eau en mouvement. La puissance augmente avec la vitesse du courant et la profondeur d'immersion de la turbine, jusqu'à atteindre sa pleine puissance une fois complètement immergée. Peut être construite à sec : elle attend simplement que l'eau arrive."
deDE = "Erzeugt aus fließendem Wasser Strom. Die Leistung steigt mit der Fließgeschwindigkeit und der Eintauchtiefe der Turbine und erreicht unter Wasser ihre volle Leistung. Kann im Trockenen gebaut werden – sie wartet einfach, bis das Wasser kommt."
plPL = "Wytwarza moc z płynącej wody. Moc wyjściowa rośnie wraz z prędkością nurtu i głębokością zanurzenia turbiny, osiągając pełną moc, gdy turbina znajdzie się całkowicie pod wodą. Można ją zbudować na sucho — po prostu czeka, aż dopłynie woda."
ptBR = "Gera energia mecânica a partir da água corrente. A potência aumenta com a velocidade da correnteza e com o nível de submersão da turbina, atingindo a potência máxima quando ela fica totalmente submersa. Pode ser construída em terreno seco — ela simplesmente aguarda a chegada da água."
koKR = "흐르는 물로 동력을 생산합니다. 물살이 빠를수록, 터빈이 물속에 더 깊이 잠길수록 출력이 높아지며, 완전히 물에 잠기면 최대 출력을 냅니다. 물이 없는 곳에도 건설할 수 있습니다. 물이 도착할 때까지 기다릴 뿐입니다."
csCZ = "Vyrábí energii z proudící vody. Výkon roste s rychlostí proudu a hloubkou ponoření turbíny; plného výkonu dosáhne, až když je zcela pod vodou. Lze ji postavit i na suchu — jednoduše počká, až dorazí voda."
viVN = "Tạo ra năng lượng từ dòng nước chảy. Công suất tăng theo tốc độ dòng chảy và độ ngập của tua-bin, đạt công suất tối đa khi tua-bin ngập hoàn toàn. Có thể xây dựng khi chưa có nước — tua-bin sẽ chờ nước đến."
trTR = "Akan sudan güç üretir. Çıkış gücü, akıntının hızına ve türbinin ne kadar derine batırıldığına bağlı olarak artar; tamamen su altında kaldığında tam güce ulaşır. Kuru zemine inşa edilebilir — suyun gelmesini bekler."

["Building.Deepfurs.TidalTurbine.FlavorDescription"]
status = "normal"
raw = "No sails, no spokes above the surface — just a hum in the deep and a shaft that never freezes over."
enUS = "No sails, no spokes above the surface—just a hum in the deep and a shaft that never freezes over."
zhCN = "没有帆，也没有露出水面的辐条——只有深处的嗡鸣，以及一根永远不会结冰的轴。"
zhTW = "沒有帆，也沒有露出水面的輪輻——只有深處的嗡鳴聲，以及一根永不結冰的軸。"
ruRU = "Ни парусов, ни лопастей над поверхностью — только гул в глубине и вал, который никогда не замерзает."
jaJP = "帆もなく、水面上にスポークもない。ただ深みで唸り、決して凍りつかないシャフトがある。"
frFR = "Pas de voiles, pas de rayons au-dessus de la surface — juste un bourdonnement dans les profondeurs et un arbre qui ne gèle jamais."
deDE = "Keine Segel, keine Speichen über der Wasseroberfläche – nur ein Summen in der Tiefe und eine Welle, die niemals zufriert."
plPL = "Żadnych żagli ani łopat nad powierzchnią — tylko pomruk w głębinach i wał, który nigdy nie zamarza."
ptBR = "Sem velas, sem pás acima da superfície — só um zumbido nas profundezas e um eixo que nunca congela."
koKR = "수면 위에는 돛도 바퀴살도 없다 — 깊은 곳에서 울리는 웅웅거림과 얼지 않는 축만 있을 뿐."
csCZ = "Žádné plachty, žádné lopatky nad hladinou — jen hučení v hlubinách a hřídel, která nikdy nezamrzá."
viVN = "Không cánh buồm, không bánh xe nan hoa trên mặt nước — chỉ có tiếng rì rầm dưới đáy sâu và một trục truyền lực chẳng bao giờ đóng băng."
trTR = "Yüzeyde ne yelken var ne de çark — yalnızca derinlerde bir uğultu ve asla donmayan bir mil."

