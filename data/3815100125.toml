["Building.CompactMechanicalPump.Deepfurs.Description"]
status = "normal"
raw = "Draws water or badwater in from one side and discharges it on the other. In reverse mode the pump opens into a free-flowing pipe and the current spins it, generating 135 hp for every 0.25 cms passing through."
enUS = "Draws water or badwater in from one side and discharges it on the other. In reverse mode, the pump opens into a free-flowing pipe, and the current spins it, generating 135 hp for every 0.25 cms passing through."
zhCN = "从一侧抽入水或恶水，并从另一侧排出。反向模式下，水泵会接入一段畅通的管道，水流将带动水泵旋转；每有 0.25 cms 的水流通过，就能产生 135 hp 的动力。"
zhTW = "從一側抽入水或毒水，並從另一側排出。反向模式下，幫浦會開啟通往自由流動管道的通道，水流會帶動幫浦旋轉；每有 0.25 cms 的水流通過，就會產生 135 hp。"
ruRU = "Забирает воду или грязную воду с одной стороны и выпускает её с другой. В реверсивном режиме насос открывается в трубу со свободным потоком, и течение вращает его, вырабатывая 135 hp на каждые 0.25 cms проходящей воды."
jaJP = "片側から水または汚染水を取り込み、反対側へ排出します。逆モードではポンプが自由に流れるパイプへ開き、流れによって回転し、通過する水量が0.25 cms増えるごとに135 hpを発生させます。"
frFR = "Aspire de l’eau ou de l’eau polluée d’un côté et la rejette de l’autre. En mode inversé, la pompe s’ouvre sur une conduite à écoulement libre, que le courant fait tourner, produisant 135 hp pour chaque tranche de 0,25 cms qui la traverse."
deDE = "Pumpt Wasser oder Schlechtwasser auf der einen Seite an und gibt es auf der anderen Seite ab. Im Umkehrmodus mündet die Pumpe in ein frei fließendes Rohr, und die Strömung treibt sie an. Dabei erzeugt sie 135 hp pro 0.25 cms, die hindurchfließen."
plPL = "Pobiera wodę lub skażoną wodę z jednej strony i wypuszcza ją po drugiej. W trybie odwrotnym pompa otwiera się na swobodny przepływ w rurze, a nurt wprawia ją w ruch, generując 135 hp na każde przepływające 0.25 cms."
ptBR = "Capta água ou água tóxica por um lado e a descarrega pelo outro. No modo reverso, a bomba se abre para um cano de fluxo livre, e a corrente a faz girar, gerando 135 hp para cada 0.25 cms que passa por ela."
koKR = "한쪽에서 물이나 독성 폐수를 끌어들여 반대쪽으로 내보냅니다. 역방향 모드에서는 펌프가 물이 자유롭게 흐르는 관으로 열리며, 물살이 펌프를 돌려 0.25cms가 통과할 때마다 135hp를 생성합니다."
csCZ = "Čerpá vodu nebo znečištěnou vodu z jedné strany a vypouští ji na druhé. V režimu zpětného chodu se čerpadlo otevře do volně průtočného potrubí a proud ho roztáčí, čímž vyrábí 135 hp za každých 0.25 cms vody, která jím protéká."
viVN = "Hút nước hoặc nước ô nhiễm từ một phía và xả ra ở phía bên kia. Ở chế độ đảo chiều, máy bơm mở thông với một đường ống chảy tự do và dòng nước làm quay máy bơm, tạo ra 135 hp cho mỗi 0.25 cms chảy qua."
trTR = "Suyu veya kötü suyu bir tarafından çeker ve diğer tarafından boşaltır. Ters modda pompa serbest akışlı bir boruya açılır ve akıntı pompayı döndürerek içinden geçen her 0.25 cms için 135 hp üretir."

