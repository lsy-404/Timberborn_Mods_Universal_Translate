["Faction.Deepfurs.Description"]
raw = "Sleek-furred divers who thrive beneath the surface. Deepfurs are happiest soaked to the bone — dry land dampens their spirits and slows their work — while their loyal bots refuse to touch water at all."
status = "normal"
enUS = "Sleek-furred divers who thrive beneath the surface. Deepfurs are happiest soaked to the bone—dry land dampens their spirits and slows their work—while their loyal bots refuse to touch water at all."
zhCN = "皮毛光滑、擅长潜水，在水下如鱼得水。深毛族全身湿透时最快乐——干燥的陆地会令他们情绪低落、工作变慢；而他们忠诚的机器人则完全不碰水。"
zhTW = "毛皮光滑、擅長潛水，能在水下自在生活。深潛族全身濕透時最開心——乾燥的陸地會讓他們情緒低落、工作變慢——而他們忠心的機器人卻完全不碰水。"
ruRU = "Гладкошёрстные ныряльщики, которые процветают под водой. Дипфуры счастливее всего, промокнув до нитки: на суше их настроение портится, а работа замедляется. Их верные боты, напротив, совсем не переносят воду."
jaJP = "なめらかな毛並みを持つ、潜水が得意なビーバーたち。ディープファーは骨の髄まで濡れていると最も幸せで、乾いた陸地では気分が落ち込み、作業も遅くなる。一方、忠実なボットたちは水に触れることを一切拒む。"
frFR = "Des plongeurs au pelage lisse qui s’épanouissent sous la surface. Les Pelages profonds sont plus heureux que jamais quand ils sont trempés jusqu’aux os : la terre ferme leur mine le moral et ralentit leur travail, tandis que leurs fidèles robots refusent de toucher à l’eau."
deDE = "Glattfellige Taucher, die unter der Wasseroberfläche aufblühen. Tiefpelze sind am glücklichsten, wenn sie bis auf die Knochen durchnässt sind – trockenes Land drückt ihre Stimmung und verlangsamt ihre Arbeit –, während ihre treuen Bots Wasser gänzlich meiden."
plPL = "Gładkofutri nurkowie, którzy doskonale czują się pod powierzchnią wody. Głębinowce są najszczęśliwsze, gdy są mokre do szpiku kości — suchy ląd przygnębia ich i spowalnia ich pracę — podczas gdy ich lojalne boty za nic nie chcą dotknąć wody."
ptBR = "Mergulhadores de pelo lustroso que prosperam sob a superfície. Os Pelos-do-fundo são mais felizes encharcados até os ossos — a terra seca desanima e desacelera seu trabalho —, enquanto seus robôs leais se recusam a tocar na água."
koKR = "매끈한 털을 지닌 잠수꾼으로, 물속에서 번성합니다. 딥퍼들은 뼛속까지 흠뻑 젖었을 때 가장 행복합니다. 마른 땅에서는 기운이 꺾이고 작업 속도도 느려지지만, 충직한 로봇들은 물에 닿는 것조차 꺼립니다."
csCZ = "Potápěči s hebkou srstí, kterým se daří pod hladinou. Hlubinosrstí jsou nejšťastnější, když jsou promočení až na kost — souš jim kazí náladu a zpomaluje práci, zatímco jejich věrní boti se vody odmítají vůbec dotknout."
viVN = "Những thợ lặn có bộ lông mượt mà, phát triển mạnh dưới mặt nước. Deepfurs vui vẻ nhất khi ướt sũng từ đầu đến chân — đất khô làm giảm tinh thần và khiến họ làm việc chậm hơn — trong khi những robot trung thành của họ nhất quyết không chạm vào nước."
trTR = "Yüzeyin altında gelişen, parlak kürklü dalgıçlar. Derinkürklüler iliklerine kadar ıslanmışken en mutlu hâllerindedir — kuru toprak morallerini bozar ve işlerini yavaşlatır — sadık botları ise suya asla dokunmaz."

