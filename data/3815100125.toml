["Deepfurs.Breeding.Dry.Water"]
raw = "Dry — needs extra water per cycle. Submerge it and it needs no water at all."
status = "normal"
enUS = "Dry — requires extra water per cycle. Submerge it, and it requires no water at all."
zhCN = "干燥时——每个周期需要额外的水。将其浸没后，它就完全不需要水了。"
zhTW = "乾燥時——每個週期需要額外的水。將它淹沒後，完全不需要水。"
ruRU = "В сухом виде — требует дополнительной воды за цикл. Погрузите его в воду, и вода ему вовсе не понадобится."
jaJP = "乾燥状態では、1サイクルごとに追加の水が必要です。水中に沈めると、水はまったく必要ありません。"
frFR = "À sec — nécessite un supplément d’eau par cycle. Submergez-le et il n’aura plus besoin d’eau du tout."
deDE = "Trocken – benötigt pro Zyklus zusätzliches Wasser. Tauche es unter, dann benötigt es überhaupt kein Wasser."
plPL = "Suchy — wymaga dodatkowej wody w każdym cyklu. Zanurz go, a nie będzie potrzebował wody wcale."
ptBR = "Seco — precisa de água extra por ciclo. Submerja-o e ele não precisará de água alguma."
koKR = "건조 상태에서는 주기마다 물이 더 필요합니다. 물에 잠기면 물이 전혀 필요하지 않습니다."
csCZ = "Suché — při každém cyklu potřebuje více vody. Ponořte ho a nebude potřebovat žádnou vodu."
viVN = "Khô — cần thêm nước mỗi chu kỳ. Ngập hoàn toàn thì không cần nước nữa."
trTR = "Kuru — her döngüde ekstra su gerekir. Suya batırılırsa hiç su gerekmez."

["Deepfurs.Breeding.Submerged.Water"]
raw = "Submerged — no water needed. Berries alone grow the babies."
status = "normal"
enUS = "Submerged — no water needed. Berries alone grow the babies."
zhCN = "浸没——无需水。仅靠浆果就能养育幼崽。"
zhTW = "淹沒——不需要水。寶寶只靠莓果就能長大。"
ruRU = "Под водой — вода не нужна. Детёныши растут только на ягодах."
jaJP = "水中に設置 — 水は不要。赤ちゃんを育てるのはベリーだけ。"
frFR = "Immergé — pas besoin d’eau. Les baies seules font grandir les bébés."
deDE = "Unter Wasser – kein Wasser nötig. Nur Beeren lassen die Kleinen heranwachsen."
plPL = "Zanurzone — woda nie jest potrzebna. Młode rosną wyłącznie dzięki jagodom."
ptBR = "Submerso — não precisa de água. Só as bagas fazem os filhotes crescerem."
koKR = "잠수 상태 — 물은 필요 없습니다. 아기들은 열매만으로 자랍니다."
