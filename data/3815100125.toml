["Faction.Deepfurs.Description"]
status = "normal"
raw = "Sleek-furred divers who thrive beneath the surface. Deepfurs are happiest soaked to the bone — dry land dampens their spirits and slows their work — while their loyal bots refuse to touch water at all."
enUS = "Sleek-furred divers who thrive beneath the surface. Deepfurs are happiest soaked to the bone—dry land dampens their spirits and slows their work—while their loyal bots refuse to touch water at all."
zhCN = "毛皮光滑、擅长潜水，能在水下如鱼得水。深潜者最喜欢浑身湿透——干燥的陆地会让他们情绪低落、工作效率下降；而他们忠诚的机器人则完全不肯碰水。"
zhTW = "毛皮光滑、擅長潛水，能在水面之下如魚得水。深毛族全身濕透時最開心——乾燥的陸地會讓他們情緒低落、工作變慢；而他們忠心耿耿的機器人則完全不碰水。"
ruRU = "Гладкошёрстные ныряльщики, процветающие под водой. Дипфуры счастливее всего, промокнув до нитки: на суше их дух падает, а работа замедляется. Их верные боты, напротив, ни за что не сунутся в воду."
jaJP = "滑らかな毛並みを持ち、水面下で生き生きと活動する潜水名人。ディープファーは骨の髄までずぶ濡れのときが最も幸せで、乾いた陸地では気分が沈み、仕事も遅くなる。一方、忠実なボットたちは水に触れることを一切拒む。"
frFR = "Des plongeurs au pelage lisse qui s’épanouissent sous la surface. Les Fourrures profondes sont plus heureux lorsqu’ils sont trempés jusqu’aux os : la terre ferme leur sape le moral et ralentit leur travail, tandis que leurs fidèles robots refusent de toucher à l’eau."
deDE = "Glattfellige Taucher, die unter der Wasseroberfläche aufblühen. Tiefpelze sind am glücklichsten, wenn sie bis auf die Knochen durchnässt sind – trockenes Land drückt auf ihre Stimmung und verlangsamt ihre Arbeit –, während ihre treuen Bots Wasser unter allen Umständen meiden."
plPL = "Gładkofutre nurki, które najlepiej czują się pod powierzchnią wody. Głębokofutre są najszczęśliwsze, gdy są mokre do szpiku kości — suchy ląd odbiera im humor i spowalnia ich pracę — za to ich wierne boty za nic nie chcą dotknąć wody."
ptBR = "Mergulhadores de pelagem lustrosa que prosperam sob a superfície. Os Pelos Profundos são mais felizes encharcados até os ossos — a terra seca desanima e desacelera seu trabalho —, enquanto seus robôs leais se recusam a tocar na água."
koKR = "매끈한 털을 지닌 잠수부로, 물속에서 번성합니다. 딥퍼들은 흠뻑 젖었을 때 가장 행복합니다. 마른 땅에서는 기운이 꺾이고 작업 속도가 느려지지만, 충직한 로봇들은 물에 닿는 걸 아예 거부합니다."
csCZ = "Elegantní potápěči s hladkou srstí, kteří prospívají pod hladinou. Hlubináři jsou nejšťastnější, když jsou promočení až na kost — suchá země jim kazí náladu a zpomaluje práci — zatímco jejich věrní boti se vody odmítají byť jen dotknout."
viVN = "Những thợ lặn lông mượt sinh sống khỏe mạnh dưới mặt nước. Deepfurs vui vẻ nhất khi ướt sũng từ đầu đến chân — đất khô làm họ mất tinh thần và chậm trễ công việc — trong khi những robot trung thành của họ nhất quyết không chạm vào nước."
trTR = "Yüzeyin altında gelişen, pürüzsüz kürklü dalgıçlar. Derinkürklüler iliklerine kadar ıslandıklarında en mutlu hâllerindedir; kuru toprak keyiflerini kaçırıp işlerini yavaşlatırken, sadık botları suya hiç dokunmayı reddeder."

