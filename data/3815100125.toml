["Building.CompactMechanicalPump.Deepfurs.Description"]
raw = "Draws water or badwater in from one side and discharges it on the other. In reverse mode the pump opens into a free-flowing pipe and the current spins it, generating 135 hp for every 0.25 cms passing through."
status = "normal"
enUS = "Draws water or badwater in from one side and discharges it on the other. In reverse mode, the pump opens into a free-flowing pipe, and the current spins it, generating 135 hp for every 0.25 cms passing through."
zhCN = "从一侧抽入水或恶水，再从另一侧排出。反向模式下，泵会接入一段自由流动的管道，水流会带动泵旋转；每通过 0.25 cms 的水流，可产生 135 hp 的动力。"
zhTW = "從一側抽入水或毒水，再從另一側排出。反向模式下，幫浦會接入自由流動的管道，水流會帶動幫浦旋轉；每有 0.25 cms 的水流通過，就會產生 135 hp。"
ruRU = "Забирает воду или скверноводу с одной стороны и выпускает с другой. В обратном режиме насос открывается в свободно текущую трубу, и поток вращает его, вырабатывая 135 hp на каждые 0.25 cms проходящей через него воды."
jaJP = "片側から水または汚染水を吸い込み、反対側へ排出します。逆モードではポンプが自由に流れるパイプへと開放され、流れによって回転し、通過する水量0.25 cmsごとに135 hpを発生させます。"
frFR = "Aspire de l’eau ou de l’eau polluée d’un côté et la rejette de l’autre. En mode inversé, la pompe s’ouvre sur une conduite à écoulement libre et le courant la fait tourner, générant 135 hp pour chaque tranche de 0,25 cms qui la traverse."
deDE = "Pumpt Wasser oder Schadwasser auf einer Seite an und lässt es auf der anderen wieder ab. Im Umkehrmodus öffnet die Pumpe sich zu einem frei durchströmten Rohr. Die Strömung treibt sie an und erzeugt 135 hp pro 0.25 cms, die hindurchfließen."
plPL = "Pobiera wodę lub skażoną wodę z jednej strony i wypuszcza ją po drugiej. W trybie odwrotnym pompa otwiera się na swobodny przepływ wody przez rurę, a nurt wprawia ją w ruch, generując 135 hp na każde 0.25 cms przepływu."
ptBR = "Capta água ou água contaminada por um lado e a descarrega pelo outro. No modo reverso, a bomba se abre para um cano de fluxo livre, e a corrente a faz girar, gerando 135 hp para cada 0.25 cms que passa por ela."
koKR = "한쪽에서 물이나 오염수를 끌어들여 반대쪽으로 내보냅니다. 역방향 모드에서는 펌프가 물이 자유롭게 흐르는 관으로 열리고, 흐름이 펌프를 회전시켜 0.25 cms가 통과할 때마다 135 hp를 생산합니다."
csCZ = "Nasává vodu nebo znečištěnou vodu z jedné strany a vypouští ji na druhé. V reverzním režimu se čerpadlo otevře do volně průtočného potrubí a proud jím roztáčí, čímž vyrábí 135 hp za každých 0.25 cms, které jím protečou."
viVN = "Hút nước hoặc nước ô nhiễm từ một phía và xả ra phía bên kia. Ở chế độ đảo chiều, máy bơm mở thông với đường ống cho nước chảy tự do, dòng nước làm nó quay, tạo ra 135 hp cho mỗi 0.25 cms nước chảy qua."
trTR = "Bir taraftan su veya kötü su çeker ve diğer taraftan boşaltır. Ters modda pompa, serbest akışlı bir boruya açılır; akıntı pompayı döndürerek içinden geçen her 0.25 cms için 135 hp güç üretir."

