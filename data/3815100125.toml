["Building.Deepfurs.FuelGatheringDepot.Description"]
status = "normal"
raw = "Holds 80 units of liquid; fill it with biofuel. Idle bots gather around it instead of the District Center and top up from it when they run low. Dry ground only, and one per district."
enUS = "Holds 80 units of liquid; fill it with biofuel. Idle bots gather around it instead of the District Center and top up from it when they run low. Dry ground only, and one per district."
zhCN = "可储存 80 单位液体；请在其中装满生物燃料。闲置机器人会聚集在这里，而不是区中心，并在燃料不足时从这里补充。只能建在干燥地面上，每个区限建一个。"
zhTW = "可儲存 80 單位的液體；請裝入生質燃料。閒置機器人會聚集在這裡，而非聚集在區域中心，並在燃料不足時從這裡補充。只能建在乾燥地面上，每個區域限建一座。"
ruRU = "Вмещает 80 единиц жидкости; заполните его биотопливом. Бездействующие боты собираются вокруг него вместо районного центра и пополняют запасы, когда они заканчиваются. Только на суше, по одному на район."
jaJP = "液体を80単位貯蔵できます。バイオ燃料を入れてください。待機中のボットは地区センターではなくこの施設の周りに集まり、燃料が少なくなるとここで補給します。乾いた地面にのみ設置でき、各地区に1つまでです。"
frFR = "Contient 80 unités de liquide ; remplissez-le de biocarburant. Les bots inactifs se rassemblent autour de ce bâtiment plutôt qu’au centre de district et s’y ravitaillent quand ils sont à court. Sol sec uniquement, et un seul par district."
deDE = "Fasst 80 Einheiten Flüssigkeit; befülle es mit Biokraftstoff. Untätige Bots sammeln sich darum statt um das Bezirkszentrum und füllen dort ihren Vorrat auf, wenn er zur Neige geht. Nur auf trockenem Boden und eines pro Bezirk."
plPL = "Mieści 80 jednostek cieczy; napełnij go biopaliwem. Bezczynne boty gromadzą się wokół niego zamiast wokół centrum dzielnicy i uzupełniają z niego zapasy, gdy zaczyna im brakować paliwa. Tylko na suchym podłożu, jeden na dzielnicę."
ptBR = "Armazena 80 unidades de líquido; abasteça-o com biocombustível. Bots ociosos se reúnem ao redor dele em vez de irem ao Centro do Distrito e reabastecem nele quando o combustível está acabando. Apenas em terreno seco, e um por distrito."
koKR = "액체 80단위를 저장합니다. 바이오연료를 채워 넣으세요. 대기 중인 봇은 구역 센터 대신 이곳에 모이며, 연료가 부족해지면 여기서 보충합니다. 마른 땅에만 건설할 수 있으며, 구역당 하나만 건설할 수 있습니다."
csCZ = "Pojme 80 jednotek kapaliny; naplňte ho biopalivem. Nečinní roboti se shromažďují kolem něj místo u okresního centra a doplňují si z něj zásoby, když jim docházejí. Pouze na suché půdě a jeden na okres."
viVN = "Chứa 80 đơn vị chất lỏng; đổ nhiên liệu sinh học vào đây. Bot nhàn rỗi sẽ tập trung quanh đây thay vì Trung tâm Khu vực và tiếp nhiên liệu từ đây khi sắp hết. Chỉ đặt được trên đất khô, mỗi khu vực chỉ được đặt một cái."
trTR = "80 birim sıvı depolar; biyoyakıtla doldurun. Boştaki robotlar Bölge Merkezi yerine bunun çevresinde toplanır ve yakıtları azaldığında buradan depolarını doldurur. Yalnızca kuru zemine yerleştirilebilir ve bölge başına bir tane kurulabilir."

["Building.Deepfurs.FuelGatheringDepot.FlavorDescription"]
status = "normal"
raw = "The centre is a lake now. The bots needed somewhere to stand, so they chose the tank that feeds them."
enUS = "The center is a lake now. The bots needed somewhere to stand, so they chose the tank that feeds them."
zhCN = "中心现在成了一片湖。机器人得找个地方站着，于是选了给它们供油的储罐。"
zhTW = "中心現在變成湖了。機器人需要找個地方站，所以選了供應燃料給它們的儲槽。"
ruRU = "Теперь в центре озеро. Ботам нужно было где-то стоять, и они выбрали резервуар, который их снабжает."
jaJP = "今では中心部は湖になっている。ボットたちには立つ場所が必要だったので、自分たちに燃料を供給するタンクを選んだ。"
frFR = "Le centre est maintenant un lac. Les robots avaient besoin d'un endroit où se tenir, alors ils ont choisi le réservoir qui les alimente."
deDE = "Die Mitte ist jetzt ein See. Die Bots brauchten einen Platz zum Stehen und wählten deshalb den Tank, der sie versorgt."
plPL = "W centrum jest teraz jezioro. Boty potrzebowały miejsca, na którym mogłyby stanąć, więc wybrały zbiornik, który je zasila."
ptBR = "O centro agora é um lago. Os robôs precisavam de um lugar para ficar, então escolheram o tanque que os abastece."
koKR = "이제 중앙은 호수다. 봇들이 설 곳이 필요해서, 자신들에게 연료를 공급하는 탱크를 골랐다."
csCZ = "Uprostřed je teď jezero. Boti potřebovali někde stát, a tak si vybrali nádrž, která jim dodává palivo."
viVN = "Giờ trung tâm là một cái hồ. Những con bot cần chỗ đứng, nên chúng chọn cái bồn cung cấp nhiên liệu cho chúng."
trTR = "Merkez artık bir göl. Botların duracak bir yere ihtiyacı vardı, bu yüzden onları besleyen tankı seçtiler."

