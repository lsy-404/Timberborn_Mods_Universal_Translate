["Building.Deepfurs.TidalTurbine.Description"]
raw = "Generates power from flowing water. Output rises with the speed of the current and with how deeply the turbine is submerged, reaching full power once fully underwater. Can be built dry — it simply waits for the water to arrive."
status = "normal"
enUS = "Generates power from flowing water. Output increases with the speed of the current and how deeply the turbine is submerged, reaching full power once it is fully underwater. Can be built dry—it simply waits for the water to arrive."
zhCN = "利用流动的水产生动力。动力输出会随水流速度和涡轮机的浸没深度增加，并在完全浸没时达到满功率。可以在干燥处建造——它只需等待水流到来。"
zhTW = "利用流動的水產生動力。輸出會隨著水流速度及渦輪機的浸水深度增加；完全淹沒時即可達到全功率。可以在乾燥處建造——它只會等待水流到來。"
ruRU = "Вырабатывает энергию за счёт текущей воды. Мощность возрастает с увеличением скорости течения и глубины погружения турбины, достигая максимума, когда она полностью находится под водой. Можно построить на суше — турбина просто будет ждать, пока придёт вода."
jaJP = "流れる水から電力を生成します。出力は水流の速さとタービンが水に沈んでいる深さに応じて増加し、完全に水没すると最大出力に達します。水のない場所にも建設できます。その場合、水が流れ込むのを待ちます。"
frFR = "Produit de l’énergie grâce à l’eau en mouvement. La puissance augmente avec la vitesse du courant et la profondeur d’immersion de la turbine, jusqu’à atteindre sa pleine puissance lorsqu’elle est complètement sous l’eau. Peut être construit à sec : il attend simplement que l’eau arrive."
deDE = "Erzeugt Strom aus fließendem Wasser. Die Leistung steigt mit der Strömungsgeschwindigkeit und der Eintauchtiefe der Turbine. Unter Wasser erreicht sie ihre volle Leistung. Kann auch im Trockenen gebaut werden – sie wartet einfach, bis das Wasser kommt."
plPL = "Wytwarza moc z płynącej wody. Moc wyjściowa rośnie wraz z prędkością nurtu i głębokością zanurzenia turbiny, osiągając pełną moc po całkowitym zanurzeniu. Można ją zbudować na sucho — po prostu czeka, aż dopłynie woda."
ptBR = "Gera energia mecânica a partir da água corrente. A potência aumenta com a velocidade da correnteza e com a profundidade em que a turbina está submersa, atingindo a potência máxima quando fica totalmente submersa. Pode ser construída em local seco — ela simplesmente espera a água chegar."
koKR = "흐르는 물로 동력을 생산합니다. 출력은 물살이 빠를수록, 터빈이 더 깊이 잠길수록 증가하며, 완전히 물에 잠기면 최대 출력에 도달합니다. 물이 없는 곳에도 건설할 수 있으며, 물이 도달할 때까지 기다립니다."
csCZ = "Vyrábí energii z proudící vody. Výkon roste s rychlostí proudu a hloubkou ponoření turbíny a dosáhne maxima, jakmile je turbína zcela pod vodou. Lze postavit i na suchu — jednoduše počká, až dorazí voda."
viVN = "Tạo ra năng lượng từ dòng nước chảy. Công suất tăng theo tốc độ dòng chảy và độ ngập của tua-bin, đạt công suất tối đa khi chìm hoàn toàn dưới nước. Có thể xây dựng khi chưa có nước — tua-bin chỉ đơn giản là chờ nước đến."
trTR = "Akan sudan güç üretir. Çıkış gücü, akıntının hızı ve türbinin ne kadar derine batırıldığı arttıkça yükselir; tamamen su altında kaldığında tam güce ulaşır. Kuru alana inşa edilebilir — suyun gelmesini bekler."

["Building.Deepfurs.TidalTurbine.FlavorDescription"]
raw = "No sails, no spokes above the surface — just a hum in the deep and a shaft that never freezes over."
status = "normal"
enUS = "No sails, no spokes above the surface—just a hum in the deep and a shaft that never freezes over."
zhCN = "没有帆，也没有露出水面的辐条——只有深处的嗡鸣，以及一根永远不会结冰的轴。"
zhTW = "沒有帆，水面上也沒有葉片——只有深處的嗡鳴，以及永不結冰的軸。"
ruRU = "Ни парусов, ни лопастей над водой — лишь гул в глубине и вал, который никогда не замерзает."
jaJP = "水面の上に帆もスポークもない――深みで響くうなりと、決して凍りつかないシャフトだけ。"
frFR = "Pas de voiles, pas de rayons au-dessus de la surface — juste un grondement dans les profondeurs et un arbre qui ne gèle jamais."
deDE = "Keine Segel, keine Speichen über der Oberfläche – nur ein Summen in der Tiefe und eine Welle, die niemals zufriert."
plPL = "Żadnych żagli ani łopat nad powierzchnią — tylko buczenie w głębinach i wał, który nigdy nie zamarza."
ptBR = "Sem velas, sem pás acima da superfície — apenas um zumbido nas profundezas e um eixo que nunca congela."
koKR = "수면 위에는 돛도 바퀴살도 없다. 깊은 곳에서 웅웅거리는 소리와 얼어붙지 않는 축만 있을 뿐."
csCZ = "Žádné plachty, žádné lopatky nad hladinou — jen hučení v hlubinách a hřídel, která nikdy nezamrzne."
viVN = "Không có cánh buồm, không có nan hoa trên mặt nước — chỉ có tiếng rì rầm dưới đáy sâu và một trục truyền động không bao giờ đóng băng."
trTR = "Yüzeyde ne yelken var ne de çark — yalnızca derinlerde bir uğultu ve asla donmayan bir şaft."

