["Deepfurs.Bot.HybridWorkRefusalWarning"]
raw = "Stops working only if both charge and fuel run out."
status = "normal"
enUS = "Stops working only if both the charge and the fuel run out."
zhCN = "只有在电量和燃料都耗尽时才会停止工作。"
zhTW = "只有在電量和燃料都耗盡時才會停止運作。"
ruRU = "Перестаёт работать, только если заканчиваются и заряд, и топливо."
jaJP = "充電と燃料の両方が切れた場合にのみ、動作を停止します。"
frFR = "Ne cesse de fonctionner que si la charge et le combustible sont tous deux épuisés."
deDE = "Stellt den Betrieb nur ein, wenn sowohl die Ladung als auch der Treibstoff aufgebraucht sind."
plPL = "Przestaje działać tylko wtedy, gdy skończą się zarówno ładunek, jak i paliwo."
ptBR = "Só para de funcionar quando tanto a carga quanto o combustível acabam."
koKR = "충전량과 연료가 모두 떨어져야만 작동을 멈춥니다."
csCZ = "Přestane fungovat pouze tehdy, když dojde jak energie, tak palivo."
viVN = "Chỉ ngừng hoạt động khi cả điện tích và nhiên liệu đều cạn."
trTR = "Yalnızca hem şarjı hem de yakıtı biterse çalışmayı durdurur."

["Deepfurs.Bot.OutOfPowerAndFuel"]
raw = "Out of charge and fuel. Hybrid bots run on either supply alone, but this one has neither and has stopped working."
status = "normal"
enUS = "Out of charge and fuel. Hybrid bots can run on either supply alone, but this one has neither and has stopped working."
zhCN = "电量和燃料耗尽。混合机器人只需其中一种供应即可运行，但这台两者都没有，已经停止工作。"
zhTW = "電量和燃料都耗盡了。混合型機器人只靠其中一種供應也能運作，但這台兩者都沒有，因此已停止運作。"
ruRU = "Заряд и топливо закончились. Гибридные боты могут работать на любом из этих ресурсов, но у этого нет ни того ни другого, поэтому он остановился."
jaJP = "充電も燃料も切れています。ハイブリッドボットはどちらか一方だけでも動きますが、このボットはどちらもなく、停止しています。"
frFR = "À court de charge et de carburant. Les robots hybrides fonctionnent avec l’une ou l’autre de ces ressources, mais celui-ci n’a ni l’une ni l’autre et a cessé de fonctionner."
deDE = "Kein Ladestrom und kein Treibstoff mehr. Hybrid-Bots können mit nur einer der beiden Versorgungsarten laufen, aber dieser hier hat keine von beiden und funktioniert nicht mehr."
plPL = "Brak ładunku i paliwa. Boty hybrydowe mogą działać, korzystając tylko z jednego z tych źródeł, ale ten nie ma żadnego i przestał działać."
ptBR = "Sem carga e sem combustível. Bots híbridos funcionam com qualquer um dos dois, mas este não tem nenhum e parou de funcionar."
koKR = "충전량과 연료가 모두 떨어졌습니다. 하이브리드 봇은 둘 중 하나만으로도 작동하지만, 이 봇은 둘 다 없어 작동을 멈췄습니다."
csCZ = "Došla energie i palivo. Hybridní roboti fungují na kterékoli z těchto zásob samostatně, ale tento nemá ani jednu a přestal pracovat."
viVN = "Đã hết năng lượng và nhiên liệu. Bot lai có thể chạy chỉ bằng một trong hai nguồn, nhưng con bot này không còn nguồn nào nên đã ngừng hoạt động."
trTR = "Şarjı ve yakıtı bitmiş. Hibrit botlar bu kaynaklardan herhangi biriyle çalışabilir, ancak bunun ikisi de yok ve çalışmayı durdurmuş."

