["Deepfurs.Bot.HybridWorkRefusalWarning"]
status = "normal"
raw = "Stops working only if both charge and fuel run out."
enUS = "Stops working only if both charge and fuel run out."
zhCN = "只有在电量和燃料都耗尽时才会停止工作。"
zhTW = "只有在電量和燃料都耗盡時才會停止運作。"
ruRU = "Прекращает работу, только если заканчиваются и заряд, и топливо."
jaJP = "充電と燃料の両方が尽きた場合にのみ、動作を停止します。"
frFR = "Ne s’arrête que si la charge et le combustible sont tous deux épuisés."
deDE = "Stellt die Arbeit nur ein, wenn sowohl die Ladung als auch der Brennstoff ausgehen."
plPL = "Przestaje działać tylko wtedy, gdy zabraknie zarówno ładunku, jak i paliwa."
ptBR = "Só para de funcionar se tanto a carga quanto o combustível acabarem."
koKR = "충전량과 연료가 모두 바닥나야만 작동을 멈춥니다."
csCZ = "Přestane fungovat pouze tehdy, když dojde náboj i palivo."
viVN = "Chỉ ngừng hoạt động khi cả điện tích lẫn nhiên liệu đều cạn."
trTR = "Yalnızca hem şarjı hem de yakıtı biterse çalışmayı durdurur."

["Deepfurs.Bot.OutOfPowerAndFuel"]
status = "normal"
raw = "Out of charge and fuel. Hybrid bots run on either supply alone, but this one has neither and has stopped working."
enUS = "Out of charge and fuel. Hybrid bots can run on either supply alone, but this one has neither and has stopped working."
zhCN = "电量和燃料均已耗尽。混合型机器人只需其中一种供应即可运行，但这台两者都没有，已经停止工作。"
zhTW = "電量和燃料耗盡。混合型機器人只靠其中一種供應也能運作，但這台兩者皆無，已停止工作。"
ruRU = "Нет заряда и топлива. Гибридные боты могут работать на любом из этих ресурсов, но у этого нет ни того, ни другого, поэтому он остановился."
jaJP = "充電も燃料も切れています。ハイブリッドボットはどちらか一方だけでも動きますが、このボットはどちらもなく、停止しています。"
frFR = "Batterie et carburant épuisés. Les robots hybrides fonctionnent avec l’une ou l’autre de ces sources, mais celui-ci n’a ni l’un ni l’autre et a cessé de fonctionner."
deDE = "Ladung und Treibstoff sind aufgebraucht. Hybridbots laufen mit jeweils nur einer der beiden Versorgungen, aber dieser hier hat keine von beiden mehr und funktioniert nicht."
plPL = "Brak energii i paliwa. Hybrydowe boty mogą działać, korzystając tylko z jednego z tych źródeł, ale ten nie ma żadnego i przestał pracować."
ptBR = "Sem carga e sem combustível. Bots híbridos funcionam com qualquer um dos dois, mas este está sem ambos e parou de funcionar."
koKR = "충전량과 연료가 모두 떨어졌습니다. 하이브리드 로봇은 둘 중 하나만 있어도 작동하지만, 이 로봇은 둘 다 없어 작동을 멈췄습니다."
csCZ = "Došla energie i palivo. Hybridní roboti mohou běžet na kteroukoli z těchto zásob samostatně, ale tomuto došly obě a přestal pracovat."
viVN = "Đã hết năng lượng và nhiên liệu. Bot lai có thể chạy chỉ bằng một trong hai nguồn, nhưng con bot này không có nguồn nào và đã ngừng hoạt động."
trTR = "Şarjı ve yakıtı bitmiş. Hibrit botlar bu kaynaklardan herhangi biriyle çalışabilir, ancak bunun ikisi de yok ve çalışmayı durdurdu."

