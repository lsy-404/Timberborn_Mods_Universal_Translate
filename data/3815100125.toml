["NaturalResource.Deepfurs.WeepingWillow.FlavorDescription"]
status = "normal"
raw = "Roots drink straight from the channel; the branches trail in it until the water goes."
enUS = "Roots drink straight from the channel; the branches trail in it until the water goes."
zhCN = "根系直接从水渠中汲水；枝条垂入水中，直到水流干涸。"
zhTW = "根部直接從水道汲水；枝條垂入水中，直到水流消失。"
ruRU = "Корни пьют прямо из канала, а ветви тянутся по воде, пока она не уйдёт."
jaJP = "根は水路から直接水を吸い、枝は水がなくなるまで水に浸かっている。"
frFR = "Les racines boivent directement dans le canal ; les branches y trempent jusqu’à ce que l’eau s’en aille."
deDE = "Die Wurzeln trinken direkt aus dem Kanal; die Zweige hängen hinein, bis das Wasser versiegt."
plPL = "Korzenie piją bezpośrednio z kanału, a gałęzie zwisają w nim, dopóki woda nie odpłynie."
ptBR = "As raízes bebem diretamente do canal; os galhos ficam mergulhados nele até a água baixar."
koKR = "뿌리는 수로에서 바로 물을 마시고, 물이 빠질 때까지 가지는 물속에 늘어져 있다."
csCZ = "Kořeny pijí přímo z kanálu; větve se v něm vlečou, dokud voda neodteče."
viVN = "Rễ cây hút nước trực tiếp từ kênh; cành cây rủ xuống nước cho đến khi nước rút đi."
trTR = "Kökleri doğrudan kanaldan su içer; su çekilene kadar dalları suyun içinde sürüklenir."

