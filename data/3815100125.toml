["NaturalResource.Deepfurs.WeepingWillow.FlavorDescription"]
raw = "Roots drink straight from the channel; the branches trail in it until the water goes."
status = "normal"
enUS = "Roots drink straight from the channel; the branches trail in it until the water goes."
zhCN = "树根直接从水渠中汲水；树枝垂入水中，直到水流消失。"
zhTW = "根部直接從水道中吸水；枝條垂入水中，直到水流消失。"
ruRU = "Корни пьют прямо из канала; ветви свисают в воду, пока она не уйдёт."
jaJP = "根は水路から直接水を吸い、枝は水がなくなるまで水路に垂れ下がっている。"
frFR = "Les racines boivent directement dans le canal ; les branches y trempent jusqu’à ce que l’eau s’en aille."
deDE = "Die Wurzeln trinken direkt aus dem Kanal; die Zweige hängen hinein, bis das Wasser verschwindet."
plPL = "Korzenie piją prosto z kanału; gałęzie zwisają w wodzie, dopóki jej nie zabraknie."
ptBR = "As raízes bebem direto do canal; os galhos ficam submersos até a água acabar."
koKR = "뿌리는 수로에서 직접 물을 마시고, 물이 빠질 때까지 가지는 물속에 늘어져 있다."
csCZ = "Kořeny pijí přímo z kanálu; větve se v něm vlečou, dokud voda neodteče."
viVN = "Rễ hút nước trực tiếp từ dòng kênh; cành cây rủ xuống làn nước cho đến khi nước cạn."
trTR = "Kökleri doğrudan kanaldan su içer; dalları, su çekilene kadar kanalın içinde sürüklenir."

