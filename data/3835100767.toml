["LV.TPO.DispatchPostFlavor"]
raw = "'Seal it tight. No chewing until it reaches the other side.'"
status = "normal"
enUS = "'Seal it tight. No chewing until it reaches the other side.'"
zhCN = "“把它封严实。送到另一边之前不许啃。”"
zhTW = "「封緊一點。送到另一邊之前不准啃。」"
ruRU = "«Запечатай покрепче. Не грызть, пока не доберётся до другого конца.»"
jaJP = "「しっかり封をしろ。向こう側に届くまで噛むな。」"
frFR = "« Scellez-le bien. Pas de grignotage avant qu'il n'arrive de l'autre côté. »"
deDE = "„Dicht verschließen. Nicht daran knabbern, bis es auf der anderen Seite angekommen ist.“"
plPL = "„Zaklej porządnie. Nie gryźć, dopóki nie dotrze na drugą stronę.”"
ptBR = "Lacre bem. Nada de roer até chegar ao outro lado."
koKR = "'꼼꼼히 봉해. 반대편에 도착할 때까지 씹지 마.'"
csCZ = "'Pořádně to zalep. Žádné žvýkání, dokud to nedorazí na druhou stranu.'"
viVN = "'Niêm phong cho thật kín. Không được nhai cho đến khi nó tới bên kia.'"
trTR = "'Sıkıca kapat. Karşı tarafa ulaşana kadar kemirmek yok.'"

