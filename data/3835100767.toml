trTR = "Bu bölgeden ortak depoya mal gönderir."
esES = "Envía bienes desde este distrito al almacenamiento compartido."
itIT = "Invia merci da questo distretto allo stoccaggio condiviso."
ukUA = "Надсилає товари з цього району до спільного сховища."
thTH = "ส่งสินค้าจากเขตนี้ไปยังคลังสินค้าร่วม"
caES = "Envia els béns d'aquest districte a l'emmagatzematge compartit."
beBY = "Адпраўляе тавары з гэтага раёна ў агульнае сховішча."
roRO = "Trimite bunuri din acest district în depozitul comun."
huHU = "A körzetből származó árukat a közös raktárba küldi."
arSA = "يرسل البضائع من هذه المنطقة إلى المخزن المشترك."

["LV.TPO.DispatchPostFlavor"]
raw = "'Seal it tight. No chewing until it reaches the other side.'"
status = "normal"
enUS = "'Seal it tight. No chewing until it reaches the other side.'"
zhCN = "“把它封严实。送到另一边之前不许啃。”"
zhTW = "「封緊一點。送到另一邊之前不准啃。」"
ruRU = "«Запечатай покрепче. Не грызть, пока не доберётся до другого конца.»"
jaJP = "「しっかり封をしろ。向こう側に届くまで噛むな。」"
frFR = "« Scellez-le bien. Pas de grignotage avant qu'il n'arrive de l'autre côté. »"
deDE = "„Dicht verschließen. Nicht daran knabbern, bis es auf der anderen Seite angekommen ist.“"
plPL = "„Zaklej porządnie. Nie gryźć, dopóki nie dotrze na drugą stronę.”"
ptBR = "Lacre bem. Nada de roer até chegar ao outro lado."
koKR = "'꼼꼼히 봉해. 반대편에 도착할 때까지 씹지 마.'"
csCZ = "'Pořádně to zalep. Žádné žvýkání, dokud to nedorazí na druhou stranu.'"
viVN = "'Niêm phong cho thật kín. Không được nhai cho đến khi nó tới bên kia.'"
trTR = "'Sıkıca kapat. Karşı tarafa ulaşana kadar kemirmek yok.'"
esES = "'Séllalo bien. Nada de mordisquear hasta que llegue al otro lado.'"
itIT = "'Sigillalo bene. Niente rosicchiature finché non raggiunge l'altra parte.'"
ukUA = "'Запечатай міцно. Не гризти, доки не дійде до іншого боку.'"
thTH = "ปิดผนึกให้แน่น ห้ามเคี้ยวจนกว่ามันจะไปถึงอีกฝั่ง"
caES = "Segella-ho bé. No el masteguis fins que arribi a l'altre costat."
beBY = "'Запячатайце добра. Не грызіце, пакуль не дойдзе да другога боку.'"
roRO = "Sigilează-l bine. Să nu-l rozi până nu ajunge pe cealaltă parte."
huHU = "„Szorosan zárd le. Ne rágd addig, amíg el nem ér a másik oldalra.\""
arSA = "أحكِم إغلاقه جيدًا. لا تقضم حتى يصل إلى الجانب الآخر."

