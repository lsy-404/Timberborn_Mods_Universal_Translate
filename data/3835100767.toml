["LV.TPO.HoldingLodgeDesc"]
raw = "Adds shared storage while it is connected to a district. No workers."
status = "normal"
enUS = "Adds shared storage while connected to a district. No workers."
zhCN = "连接到区时会增加共享存储空间。无需工人。"
zhTW = "連接至區域時，會增加共用儲存空間。無需工人。"
ruRU = "Пока здание подключено к району, оно добавляет общее хранилище. Рабочие не требуются."
jaJP = "地区に接続されている間、共有保管庫を追加します。労働者は不要です。"
frFR = "Ajoute un stockage partagé lorsqu’il est connecté à un district. Ne nécessite aucun travailleur."
deDE = "Fügt gemeinsamen Lagerraum hinzu, solange es mit einem Bezirk verbunden ist. Keine Arbeiter."
plPL = "Zapewnia wspólny magazyn, gdy jest połączony z dzielnicą. Nie wymaga pracowników."
ptBR = "Adiciona armazenamento compartilhado enquanto estiver conectado a um distrito. Não requer trabalhadores."
koKR = "지구에 연결되어 있으면 공유 저장 공간을 추가합니다. 일꾼은 필요하지 않습니다."
csCZ = "Přidává sdílené úložiště, pokud je napojeno na okrsek. Bez pracovníků."
viVN = "Bổ sung kho dùng chung khi được kết nối với một khu. Không cần công nhân."
trTR = "Bir bölgeye bağlıyken ortak depolama alanı sağlar. İşçi yok."
esES = "Añade almacenamiento compartido mientras esté conectado a un distrito. No requiere trabajadores."
itIT = "Aggiunge spazio di archiviazione condiviso mentre è collegato a un distretto. Non richiede lavoratori."
ukUA = "Додає спільне сховище, поки під'єднано до району. Робітників немає."
thTH = "เพิ่มพื้นที่เก็บของร่วมขณะที่เชื่อมต่อกับเขต ไม่มีคนงาน"
caES = "Afegeix emmagatzematge compartit mentre està connectat a un districte. Sense treballadors."
beBY = "Дадае агульнае сховішча, пакуль яно звязана з раёнам. Працаўнікоў не патрабуе."
roRO = "Adaugă spațiu de depozitare comun cât timp este conectat la un district. Fără lucrători."
huHU = "Amíg egy körzethez csatlakozik, közös tárolóterületet ad hozzá. Nincs munkás."
arSA = "يضيف تخزينًا مشتركًا طالما هو متصل بأحد الأحياء. لا يحتاج إلى عمال."

["LV.TPO.HoldingLodgeFlavor"]
raw = "Goods sleep here until a district calls them home."
status = "normal"
enUS = "Goods sleep here until a district calls them home."
zhCN = "货物在这里安睡，直到某个区召唤它们回家。"
zhTW = "貨物在這裡安睡，直到某個區域呼喚它們回家。"
ruRU = "Товары спят здесь, пока район не позовёт их домой."
jaJP = "物資は、地区からお呼びがかかるまでここで眠っている。"
frFR = "Les marchandises dorment ici jusqu’à ce qu’un district les appelle à la maison."
deDE = "Die Waren schlafen hier, bis ein Bezirk sie nach Hause ruft."
plPL = "Towary śpią tu, dopóki dzielnica nie wezwie ich do domu."
ptBR = "As mercadorias dormem aqui até que um distrito as chame de volta para casa."
koKR = "물품은 구역이 집으로 불러갈 때까지 이곳에서 잠듭니다."
csCZ = "Zboží tu spí, dokud si je nějaká čtvrť nezavolá domů."
viVN = "Hàng hóa ngủ yên ở đây cho đến khi một khu gọi chúng về nhà."
trTR = "Mallar, bir bölge onları yuvalarına çağırana dek burada uyur."
esES = "Los bienes duermen aquí hasta que un distrito los llame a casa."
itIT = "I beni dormono qui finché un distretto non li richiama a casa."
ukUA = "Товари тут відпочивають, доки район не покличе їх додому."
thTH = "สินค้านอนพักอยู่ที่นี่จนกว่าเขตจะเรียกให้กลับบ้าน"
caES = "Les mercaderies dormen aquí fins que un districte les crida a casa."
beBY = "Тавары спяць тут, пакуль раён не пакліча іх дадому."
roRO = "Bunurile dorm aici până când un district le cheamă acasă."
huHU = "Az áruk itt alszanak, amíg egy körzet haza nem hívja őket."
arSA = "تنام البضائع هنا حتى تناديها منطقة لتعود إلى موطنها."

