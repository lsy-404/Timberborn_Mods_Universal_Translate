["LV.TPO.SenderAutoHelp"]
raw = "Queues the next parcel when shared stock falls below the target by the margin, so haulers can fill it while a send is underway."
status = "normal"
enUS = "Queues the next parcel when shared stock falls below the target by the margin, so haulers can fill it while a send is underway."
zhCN = "当共享库存低于目标值达到设定幅度时，排入下一份包裹，以便搬运工能在发送过程中将其装满。"
zhTW = "當共享庫存低於目標值達到差額時，便會排入下一個包裹，讓搬運工能在寄送進行期間將其裝滿。"
ruRU = "Ставит следующую посылку в очередь, когда общий запас опускается ниже целевого уровня на заданную величину, чтобы грузчики могли заполнить её, пока отправка ещё выполняется."
jaJP = "共有在庫が目標値を設定した幅だけ下回ると、次の荷物をキューに追加し、発送中に運搬人が荷物を積み込めるようにします。"
frFR = "Met le colis suivant en file d’attente lorsque le stock partagé passe sous la cible de la marge définie, afin que les transporteurs puissent le remplir pendant qu’un envoi est en cours."
deDE = "Stellt das nächste Paket in die Warteschlange, sobald der gemeinsame Bestand den Zielwert um den Puffer unterschreitet, damit Träger es befüllen können, während eine Sendung unterwegs ist."
plPL = "Kolejkuje następną paczkę, gdy wspólny zapas spadnie poniżej celu o wielkość marginesu, dzięki czemu tragarze mogą ją napełnić w trakcie wysyłki."
ptBR = "Enfileira a próxima encomenda quando o estoque compartilhado fica abaixo da meta pela margem, para que os carregadores possam preenchê-la enquanto um envio está em andamento."
koKR = "공동 재고가 목표치보다 여유분만큼 부족해지면 다음 소포를 대기열에 추가하여, 발송이 진행되는 동안 운반꾼들이 소포를 채울 수 있습니다."
csCZ = "Zařadí další zásilku do fronty, když společné zásoby klesnou o stanovenou rezervu pod cílovou hodnotu, aby ji nosiči mohli naplnit, zatímco probíhá odesílání."
viVN = "Khi lượng hàng tồn chung thấp hơn mục tiêu một khoảng bằng biên độ, xếp bưu kiện tiếp theo vào hàng đợi để người vận chuyển có thể chất đầy bưu kiện trong khi một chuyến gửi đang diễn ra."
trTR = "Ortak stok hedefin marj kadar altına düştüğünde, gönderim devam ederken taşıyıcıların doldurabilmesi için sonraki paketi sıraya alır."
esES = "Encola el siguiente paquete cuando las existencias compartidas caigan por debajo del objetivo en el margen indicado, para que los transportistas puedan llenarlo mientras se realiza un envío."
itIT = "Accoda il prossimo pacco quando la scorta condivisa scende sotto l'obiettivo di almeno il margine indicato, così che i trasportatori possano riempirlo mentre un invio è in corso."
ukUA = "Ставить у чергу наступну партію, коли спільний запас опускається нижче цільового рівня на вказану величину, щоб переносники встигли її заповнити, поки триває відправлення."
thTH = "คิวพัสดุชุดถัดไปเมื่อสต็อกที่ใช้ร่วมกันลดลงต่ำกว่าเป้าหมายตามค่าส่วนต่างที่กำหนด เพื่อให้ผู้ขนส่งเติมสินค้าได้ขณะที่กำลังส่งพัสดุอยู่"
caES = "Encadena el següent paquet quan l'estoc compartit baixa per sota de l'objectiu en el marge indicat, perquè els transportistes puguin omplir-lo mentre hi ha un enviament en curs."
beBY = "Ставіць у чаргу наступную пасылку, калі агульны запас апускаецца ніжэй за мэтавы паказчык на велічыню запасу, каб пераносчыкі маглі запоўніць яго, пакуль адбываецца адпраўка."
roRO = "Pune următorul colet în coadă atunci când stocul comun scade sub ținta stabilită cu marja respectivă, astfel încât cărăușii să îl poată umple în timp ce o expediere este în desfășurare."
huHU = "A következő csomagot akkor állítja sorba, amikor a közös készlet a céltól a megadott különbséggel elmarad, hogy a szállítók fel tudják tölteni, miközben egy küldés folyamatban van."
arSA = "تضع الطرد التالي في قائمة الانتظار عندما ينخفض المخزون المشترك دون الهدف بالهامش المحدد، حتى يتمكن الناقلون من ملئه أثناء إرسال شحنة جارية."

["LV.TPO.ReceiverAutoHelp"]
raw = "Queues one parcel when stock here falls below the amount by the margin, and refills toward that amount."
status = "normal"
enUS = "Queues one parcel when stock here falls below the amount by the margin, then refills toward that amount."
zhCN = "当此处库存低于目标数量减去余量时，会排入一个包裹，并朝该数量补货。"
zhTW = "當此處庫存低於該數量減去差額時，排入一件包裹，並朝該數量補貨。"
ruRU = "Ставит в очередь одну посылку, когда запас здесь опускается ниже заданного количества на величину отступа, и пополняет его до этого количества."
jaJP = "ここでの在庫が設定量をマージン分下回ると、小包を1個キューに入れ、設定量を目指して補充します。"
frFR = "Met un colis en file d’attente lorsque le stock local passe sous la quantité cible moins la marge, puis le réapprovisionne jusqu’à cette quantité."
deDE = "Stellt ein Paket in die Warteschlange, sobald der Bestand hier um den Abstand unter die angegebene Menge fällt, und füllt ihn wieder bis zu dieser Menge auf."
plPL = "Kolejkuje jedną paczkę, gdy zapas w tym miejscu spadnie poniżej ustawionej ilości o wartość marginesu, i uzupełnia go do tej ilości."
ptBR = "Enfileira uma encomenda quando o estoque aqui ficar abaixo da quantidade-alvo por essa margem e repõe até essa quantidade."
koKR = "이곳의 재고가 설정량보다 여유분만큼 낮아지면 소포 1개를 주문 대기열에 추가하고, 설정량까지 보충합니다."
csCZ = "Zařadí do fronty jednu zásilku, když zdejší zásoba klesne o danou rezervu pod stanovené množství, a doplňuje ji zpět na tuto hodnotu."
viVN = "Xếp một kiện hàng vào hàng chờ khi lượng hàng ở đây thấp hơn mức đó một khoảng bằng biên độ, rồi bổ sung dần đến mức đó."
trTR = "Buradaki stok hedef miktarın belirlenen fark kadar altına düştüğünde bir paketi sıraya alır ve stoku hedef miktara doğru tamamlar."
esES = "Pone en cola un paquete cuando las existencias aquí caen por debajo de la cantidad menos el margen, y repone hasta alcanzar esa cantidad."
itIT = "Accoda un pacco quando la scorta qui scende sotto la quantità impostata di oltre il margine e riporta la scorta verso tale quantità."
ukUA = "Ставить в чергу одну посилку, коли запас тут падає нижче заданої величини на зазначений поріг, і поповнює запас до цієї величини."
