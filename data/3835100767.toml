["LV.TPO.ParcelOfficeFlavor"]
status = "normal"
raw = "It's like Christmas every day. The crates keep coming."
enUS = "It's like Christmas every day. The crates keep coming."
zhCN = "每天都像过圣诞节一样。箱子源源不断地送来。"
zhTW = "每天都像在過聖誕節。貨箱源源不絕地送來。"
ruRU = "Каждый день словно Рождество. Ящики всё прибывают."
jaJP = "毎日がクリスマスみたいだ。木箱が次々届く。"
frFR = "C'est comme Noël tous les jours. Les caisses n'arrêtent pas d'arriver."
deDE = "Es ist jeden Tag wie Weihnachten. Die Kisten kommen einfach immer weiter."
plPL = "Jakby codziennie były Święta. Skrzynie wciąż napływają."
ptBR = "É como se fosse Natal todo dia. Os caixotes não param de chegar."
koKR = "매일이 크리스마스 같아. 상자가 계속 들어와."
csCZ = "Je to jako mít Vánoce každý den. Bedny se jen hrnou."
viVN = "Cứ như Giáng sinh mỗi ngày. Thùng hàng cứ liên tục được chuyển đến."
trTR = "Her gün Noel gibi. Kasalar gelmeye devam ediyor."

