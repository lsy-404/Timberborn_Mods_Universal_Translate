status = "normal"
enUS = "Queues the next parcel when shared stock falls below the target by the margin, so haulers can fill it while a send is underway."
zhCN = "当共享库存低于目标值达到设定幅度时，排入下一份包裹，以便搬运工能在发送过程中将其装满。"
