["Building.VisualTerrainBlock.Description"]
status = "normal"
raw = "Looks exactly like a terrain block but needs no support underneath - stack it out of a cliff face or hang it in the air."
enUS = "Looks exactly like a terrain block but needs no support underneath - stack it out of a cliff face or hang it in the air."
zhCN = "外观与地形方块完全一样，但下方无需支撑——可以将其堆叠在悬崖上，或悬挂在半空中。"
zhTW = "看起來與地形方塊完全相同，但不需要下方支撐，可以疊在懸崖面上，或懸掛在半空中。"
ruRU = "Выглядит точно как блок ландшафта, но не требует опоры снизу: ставьте его на край обрыва или подвешивайте в воздухе."
jaJP = "地形ブロックとまったく同じ見た目ですが、下に支えを必要としません。崖の面に積み重ねたり、空中に吊るしたりできます。"
frFR = "Ressemble exactement à un bloc de terrain, mais ne nécessite aucun support en dessous : empilez-le depuis une falaise ou suspendez-le dans les airs."
deDE = "Sieht genau wie ein Geländeblock aus, benötigt aber keine Unterstützung darunter. Stapele ihn aus einer Felswand oder hänge ihn in der Luft auf."
plPL = "Wygląda dokładnie jak blok terenu, ale nie wymaga żadnego podparcia od spodu - możesz go ułożyć na zboczu klifu albo zawiesić w powietrzu."
ptBR = "Parece exatamente um bloco de terreno, mas não precisa de apoio por baixo: empilhe-o para fora de um penhasco ou deixe-o suspenso no ar."
koKR = "지형 블록과 똑같이 생겼지만 아래에 받침이 필요 없습니다. 절벽 면에 쌓거나 공중에 매달아 둘 수 있습니다."
trTR = "Arazi bloğuna tamamen benzer görünür ama altına destek gerektirmez; bir uçurum yüzüne yığabilir veya havada asılı bırakabilirsiniz."
esES = "Tiene el aspecto exacto de un bloque de terreno, pero no necesita soporte debajo: puedes apilarlo sobre un acantilado o colgarlo en el aire."
itIT = "Ha l'aspetto esatto di un blocco di terreno, ma non richiede alcun supporto sottostante: puoi impilarlo su una parete rocciosa o sospenderlo in aria."
ukUA = "Виглядає точно як блок ландшафту, але не потребує опори під собою — постав його на схилі скелі або підвісь у повітрі."
thTH = "ดูเหมือนบล็อกภูมิประเทศทุกประการ แต่ไม่ต้องมีที่รองรับด้านล่าง สามารถวางซ้อนบนหน้าผาหรือแขวนไว้กลางอากาศได้"
csCZ = "Vypadá úplně jako blok terénu, ale nepotřebuje žádnou podporu zespodu – můžete jej postavit na útesu nebo zavěsit ve vzduchu."
viVN = "Trông giống hệt một khối địa hình nhưng không cần chỗ đỡ bên dưới - có thể xếp chồng trên vách đá hoặc treo lơ lửng giữa không trung."
caES = "Sembla exactament un bloc de terreny, però no necessita cap suport a sota: apila'l des d'un penya-segat o penja'l a l'aire."
beBY = "Выглядае дакладна як звычайны бларк мясцовасці, але не патрабуе апоры знізу — можна скласці яго з схілу скалы або падвесіць у паветры."
roRO = "Arată exact ca un bloc de teren, dar nu necesită niciun suport dedesubt. Poate fi așezat peste o stâncă sau suspendat în aer."
huHU = "Pontosan úgy néz ki, mint egy terep-blokk, de nem igényel alátámasztást alatta: rakd ki egy sziklafalból, vagy lebegtesd a levegőben."
arSA = "يبدو تماماً مثل كتلة تضاريس، لكنه لا يحتاج إلى أي دعم من الأسفل، لذا يمكن تكديسه على وجه صخرة أو تعليقه في الهواء."
