["oo.UtopianMode.UtopianModeDescription"]
raw = "A relaxing city-building experience.\n\nYou start with plenty of food and water.\n\nBeavers eat and drink at one fifth the normal rate.\n\nDemolishing a building recovers all resources.\n\nDroughts are rare and short. No badtides."
status = "normal"
enUS = "A relaxing city-building experience.\n\nYou start with plenty of food and water.\n\nBeavers eat and drink at one fifth the normal rate.\n\nDemolishing a building recovers all resources.\n\nDroughts are rare and short. No badtides."
zhCN = "轻松惬意的城市建造体验。<br><br>游戏开始时聚居地资源非常丰富。<br><br>海狸饮食消耗速率降至正常五分之一。<br><br>拆除建筑可回收全部资源。<br><br>干旱短暂，没有恶水潮侵袭。"
zhTW = "一個放鬆的城市建設體驗。\n\n你開始時擁有充足的食物和水源。\n\n海狸的飲食速度是正常速度的五分之一。\n\n拆除建築物會回收所有資源。\n\n乾旱罕見且短暫。沒有壞潮。"
ruRU = "Расслабляющий опыт строительства города.\n\nВы начинаете с достаточным количеством еды и воды.\n\nБобры едят и пьют в пять раз медленнее обычного.\n\nСнос здания восстанавливает все ресурсы.\n\nЗасухи редки и короче. Нет плохих погодных условий."
jaJP = "リラックスできる都市建設体験。\n\n食料と水がたくさんあります。\n\nビーバーは通常の5分の1のペースで食べたり飲んだりします。\n\n建物を解体するとすべての資源が回収されます。\n\n干ばつは稀で短期間です。悪化する潮位はありません。"
frFR = "Une expérience de construction de ville relaxante.\n\nVous commencez avec beaucoup de nourriture et d'eau.\n\nLes castors mangent et boivent à un cinquième du taux normal.\n\nDémolir un bâtiment récupère toutes les ressources.\n\nLes sécheresses sont rares et courtes. Pas de marées nocives."
deDE = "Ein entspannendes Städtebau-Erlebnis.\n\nDu startest mit ausreichend Essen und Wasser.\n\nBiber essen und trinken nur ein Fünftel des normalen Raten.\n\nDas Abräumen eines Gebäudes stellt alle Ressourcen wieder her.\n\nDürreperioden sind selten und kurz. Keine schlechten Zeiten."
plPL = "Relaksujące doświadczenie w budowie miasta.\n\nZaczynasz z dużą ilością jedzenia i wody.\n\nBobry jedzą i piją w jednej piątej normalnej stawki.\n\nZburzenie budynku odzyskuje wszystkie zasoby.\n\nSusze są rzadkie i krótkie. Brak złych przypływów."
ptBR = "Uma experiência relaxante de construção de cidades.\n\nVocê começa com muita comida e água.\n\nCastores comem e bebem a um quinto da taxa normal.\n\nDerrubar um edifício recupera todos os recursos.\n\nSecas são raras e curtas. Não há maré baixa."
koKR = "편안한 도시 건설 경험입니다.\n\n충분한 음식과 물로 시작합니다.\n\n너구리는 정상 속도의 1/5로 먹고 마십니다.\n\n건물을 철거하면 모든 자원이 회복됩니다.\n\n가뭄은 드물고 짧습니다. 나쁜 조수는 없습니다."
trTR = "Rahatlatıcı bir şehir inşa deneyimi.\n\nBol miktarda yiyecek ve su ile başlıyorsunuz.\n\nKunduzlar normal oranının beşte biri kadar yer ve içer.\n\nBir yapıyı yıkmak tüm kaynakları geri kazandırır.\n\nKuraklıklar nadirdir ve kısadır. Kötü gelgit yok."
esES = "Una experiencia relajante de construcción de ciudades.\n\nEmpiezas con abundante comida y agua.\n\nLos castores comen y beben a una quinta parte del ritmo normal.\n\nAl demoler un edificio se recuperan todos los recursos.\n\nLas sequías son raras y breves. Sin badtides."
itIT = "Un'esperienza rilassante di costruzione di città.\n\nInizi con tanto cibo e acqua.\n\nI castori mangiano e bevono a un quinto della velocità normale.\n\nDemolire un edificio recupera tutte le risorse.\n\nLe siccità sono rare e brevi. Niente maree cattive."
ukUA = "Розслаблююча гра про будівництво міста.\n\nВи починаєте з великими запасами їжі та води.\n\nБобри їдять і п'ють з швидкістю в одну п'яту від звичайної.\n\nЗнесення будівлі повертає всі ресурси.\n\nПосухи трапляються рідко і тривають недовго. Жодних отруйних припливів."
thTH = "ประสบการณ์สร้างเมืองที่ผ่อนคลาย\n\nคุณเริ่มต้นด้วยอาหารและน้ำจำนวนมาก\n\nบีเวอร์กินและดื่มในอัตราหนึ่งในห้าของปกติ\n\nการรื้อถอนอาคารจะคืนทรัพยากรทั้งหมด\n\nภัยแล้งเกิดขึ้นไม่บ่อยและมีระยะเวลาสั้น ไม่มี badtide"
csCZ = "Uvolněný zážitek z budování města.\n\nZačínáte s dostatkem jídla a vody.\n\nBobři jedí a pijí jednu pětinu normálního množství.\n\nDemolice budovy obnoví všechny zdroje.\n\nSucha jsou vzácná a krátká. Žádné špatné přílivy."
viVN = "Một trải nghiệm xây dựng thành phố thư giãn.\nBạn bắt đầu với rất nhiều thức ăn và nước.\nHải ly ăn và uống với tốc độ bằng một phần năm so với bình thường.\nPhá hủy một tòa nhà sẽ thu hồi tất cả tài nguyên.\nHạn hán hiếm và ngắn. Không có triều xấu."
caES = "Una experiència relaxant de construcció de ciutats.\n\nComences amb molt d'aliment i aigua.\n\nEls castors mengen i beuen a una cinquena part de la velocitat normal.\n\nEnderrocar un edifici recupera tots els recursos.\n\nLes sequeres són rares i curtes. Sense badtides."
beBY = "Адпачынковае гарадское будаўніцтва.\n\nВы пачынаеце з вялікай колькасцю ежы і вады.\n\nБабры ядуць і п'юць у пяць разоў менш за звычайную норму.\n\nЗнос будынка вяртае ўсе рэсурсы.\n\nЗасухі бываюць рэдка і праходзяць хутка. Жыццёвых бедстваў з атрутнай вадою не будзе."
roRO = "O experiență relaxantă de construire a orașului.\n\nÎncepi cu multă hrană și apă.\n\nCastorii mănâncă și beau cu o cincime din rata obișnuită.\n\nDemolarea unei clădiri recuperează toate resursele.\n\nSecetele sunt rare și scurte. Fără badtides."
huHU = "Relaxáló városépítő élmény.\n\nBőséges élelmiszerrel és vízzel indulsz.\n\nA hódok a szokásos ütem egyötödén esznek és isznak.\n\nEgy épület lebontásakor minden erőforrás visszanyerhető.\n\nAz aszályok ritkák és rövidek. Nincsenek mérgezett vízáradások."
arSA = "تجربة بناء مدن مريحة.\n\nتبدأ اللعبة بكمية وفيرة من الطعام والماء.\n\nيأكل القنادس ويشربون بمعدل خُمس المعدل الطبيعي.\n\nهدم أي مبنى يستعيد جميع الموارد.\n\nالجفاف نادر وقصير. لا توجد فيضانات من المياه السامة."
