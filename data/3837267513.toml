["PausableRecipes.PauseWholeBuilding.Tooltip"]
status = "normal"
raw = "Off: pausing here only stops production. Residents stay housed and workers stay assigned. On: the whole building is paused like the normal pause button, so workers are released and residents move out. The normal pause button and automation always pause the whole building."
enUS = "Off: pausing here only stops production. Residents stay housed and workers stay assigned. On: the whole building is paused like the normal pause button, so workers are released and residents move out. The normal pause button and automation always pause the whole building."
zhCN = "关闭：此处暂停仅会停止生产。居民仍住在住所内，工作者仍保持分配。开启：整座建筑会像普通暂停按钮一样被暂停，因此工作者会被释放，居民会搬离。普通暂停按钮和自动化始终会暂停整座建筑。"
zhTW = "關閉：在此暫停只會停止生產。居民仍居住在住所內，工作者仍維持指派。開啟：整棟建築會像一般暫停按鈕一樣全部暫停，因此工作者會被釋放，居民會搬離。一般暫停按鈕與自動化總是會暫停整棟建築。"
ruRU = "Выкл.: пауза здесь лишь останавливает производство. Жители остаются в своих домах, а рабочие остаются закреплёнными за зданием. Вкл.: приостанавливается всё здание, как при обычной кнопке паузы, поэтому рабочие освобождаются, а жители выселяются. Обычная кнопка паузы и автоматизация всегда приостанавливают всё здание."
jaJP = "オフ：ここで一時停止すると生産だけが止まります。住民は住居に残り、労働者も割り当てられたままです。オン：通常の一時停止ボタンと同様に建物全体が停止するため、労働者は解放され、住民は退去します。通常の一時停止ボタンとオートメーションは、常に建物全体を一時停止させます。"
frFR = "Désactivé : suspendre ici arrête seulement la production. Les habitants restent logés et les travailleurs restent affectés. Activé : tout le bâtiment est suspendu comme avec le bouton de pause normal, donc les travailleurs sont libérés et les habitants déménagent. Le bouton de pause normal et l'automatisation suspendent toujours tout le bâtiment."
deDE = "Aus: Das Pausieren hier stoppt nur die Produktion. Bewohner bleiben untergebracht und Arbeiter bleiben zugewiesen. An: Das gesamte Gebäude wird wie beim normalen Pausenknopf angehalten, sodass Arbeiter freigegeben werden und Bewohner ausziehen. Der normale Pausenknopf und die Automatisierung pausieren immer das gesamte Gebäude."
plPL = "Wyłączone: wstrzymanie tutaj zatrzymuje tylko produkcję. Mieszkańcy pozostają zakwaterowani, a robotnicy pozostają przypisani. Włączone: cały budynek zostaje wstrzymany tak jak przy zwykłym przycisku pauzy, więc robotnicy zostają zwolnieni, a mieszkańcy się wyprowadzają. Zwykły przycisk pauzy oraz automatyzacja zawsze wstrzymują cały budynek."
ptBR = "Desligado: pausar aqui apenas interrompe a produção. Os moradores continuam alojados e os trabalhadores continuam designados. Ligado: o prédio inteiro é pausado, como no botão de pausa normal, então os trabalhadores são liberados e os moradores se mudam. O botão de pausa normal e a automação sempre pausam o prédio inteiro."
koKR = "꺼짐: 여기서 일시 정지하면 생산만 멈춥니다. 거주자는 계속 거주하고 작업자는 계속 배정된 상태로 남습니다. 켜짐: 건물 전체가 일반 일시 정지 버튼처럼 멈추므로, 작업자는 배정이 해제되고 거주자는 이사를 나갑니다. 일반 일시 정지 버튼과 자동화는 항상 건물 전체를 일시 정지합니다."
trTR = "Kapalı: Burada duraklatmak yalnızca üretimi durdurur. Sakinler konutta kalmaya devam eder ve işçiler atanmış olarak kalır. Açık: Bina bütünüyle, normal duraklatma düğmesi gibi duraklatılır; bu durumda işçiler serbest bırakılır ve sakinler taşınır. Normal duraklatma düğmesi ve otomasyon her zaman tüm binayı duraklatır."
esES = "Desactivado: pausar aquí solo detiene la producción. Los residentes siguen alojados y los trabajadores siguen asignados. Activado: todo el edificio se pausa como con el botón de pausa normal, así que los trabajadores son liberados y los residentes se mudan. El botón de pausa normal y la automatización siempre pausan todo el edificio."
itIT = "Off: mettere in pausa qui ferma solo la produzione. I residenti restano alloggiati e i lavoratori restano assegnati. On: l'intero edificio viene messo in pausa come con il normale pulsante di pausa, quindi i lavoratori vengono liberati e i residenti si trasferiscono altrove. Il normale pulsante di pausa e l'automazione mettono sempre in pausa l'intero edificio."
ukUA = "Вимкнено: призупинення тут лише зупиняє виробництво. Мешканці залишаються в житлі, а працівники залишаються призначеними. Увімкнено: призупиняється вся будівля, як за звичайною кнопкою паузи, тож працівники звільняються, а мешканці виселяються. Звичайна кнопка паузи та автоматизація завжди призупиняють усю будівлю."
thTH = "ปิด: การหยุดชั่วคราวตรงนี้หยุดเฉพาะการผลิต ผู้อยู่อาศัยยังคงมีที่พักและคนงานยังคงถูกมอบหมายงานอยู่ เปิด: อาคารทั้งหลังจะถูกหยุดชั่วคราวเหมือนปุ่มหยุดชั่วคราวปกติ ดังนั้นคนงานจะถูกปลดจากงานและผู้อยู่อาศัยจะย้ายออกไป ปุ่มหยุดชั่วคราวปกติและระบบอัตโนมัติจะหยุดชั่วคราวทั้งอาคารเสมอ"
csCZ = "Vypnuto: pozastavení zde pouze zastaví výrobu. Obyvatelé zůstanou ubytováni a pracovníci zůstanou přiřazeni. Zapnuto: celá budova je pozastavena stejně jako při použití běžného tlačítka pozastavení, takže pracovníci jsou uvolněni a obyvatelé se odstěhují. Běžné tlačítko pozastavení i automatizace vždy pozastaví celou budovu."
viVN = "Tắt: tạm dừng tại đây chỉ dừng sản xuất. Cư dân vẫn ở trong nhà và công nhân vẫn được phân công. Bật: toàn bộ tòa nhà bị tạm dừng giống như nút tạm dừng thông thường, nên công nhân được giải phóng và cư dân chuyển ra ngoài. Nút tạm dừng thông thường và tự động hóa luôn tạm dừng toàn bộ tòa nhà."
caES = "Desactivat: pausar aquí només atura la producció. Els residents continuen allotjats i els treballadors continuen assignats. Activat: tot l'edifici queda pausat com el botó de pausa normal, de manera que els treballadors són alliberats i els residents es traslladen. El botó de pausa normal i l'automatització sempre pausen tot l'edifici."
beBY = "Выключана: прыпыненне тут спыняе толькі вытворчасць. Жыхары застаюцца рассяленымі, а работнікі — прызначанымі. Уключана: уся будынак прыпыняецца, як пры звычайнай кнопцы паўзы, таму работнікі вызваляюцца, а жыхары выязджаюць. Звычайная кнопка паўзы і аўтаматызацыя заўсёды прыпыняюць увесь будынак."
roRO = "Dezactivat: pauza aplicată aici oprește doar producția. Locuitorii rămân cazați, iar lucrătorii rămân repartizați. Activat: întreaga clădire este pusă pe pauză, ca prin butonul normal de pauză, astfel încât lucrătorii sunt eliberați, iar locuitorii se mută afară. Butonul normal de pauză și automatizarea pun întotdeauna pe pauză întreaga clădire."
huHU = "Ki: a szüneteltetés itt csak a termelést állítja le. A lakosok továbbra is lakhatnak az épületben, a munkások pedig továbbra is hozzá vannak rendelve. Be: az egész épület szünetel, ahogy a normál szünet gomb esetén, így a munkásokat felszabadítják, a lakosok pedig kiköltöznek. A normál szünet gomb és az automatizálás mindig az egész épületet szünetelteti."
arSA = "إيقاف: الإيقاف هنا يوقف الإنتاج فقط. يبقى السكان مقيمين في المنازل ويبقى العمال مكلّفين بوظائفهم. تشغيل: يُوقف المبنى بأكمله كما يفعل زر الإيقاف العادي، فيُفرَج عن العمال ويغادر السكان المنازل. يوقف زر الإيقاف العادي والأتمتة المبنى بأكمله دائمًا."
