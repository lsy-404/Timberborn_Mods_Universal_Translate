beBY = "Гаршчык трэба было закрыць пасля таго, як занадта многа бабраў з салодкім зубам спакусіліся на смачны джэм."
roRO = "Oala trebuia închisă după ce prea mulți castori cu poftă de dulce au fost ispitiți de delicioasa gem."
huHU = "A lekvárt befőttes edényben tartották, de túl sok édesszájú bóbiskoló embert csábított el a finom lekvár, ezért le kellett zárni az edényt."
