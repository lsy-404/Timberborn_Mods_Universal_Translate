beBY = "Раскошныя таркі з найлепшай драўніны, пакрытыя сасновай смалой. Вялікая колькасць бабраў сочыць за тым, каб ніхто не глядзеў на яго зубамі."
roRO = "Torii luxoase, făcute din cel mai fin lemn și acoperite cu rășină de pin. Un număr mare de castori stau de pază pentru a se asigura că nimeni nu roade din ele."
huHU = "Fényűző torii, a legjobb fából, fenyőgyantával bevonva. Nagyszámú bóbita őrködik, hogy senki ne rágcsálja meg."
arSA = "أبواب تورّي فاخرة مصنوعة من أجود أنواع الخشب ومطلية بالراتنج الصنوبري. عدد كبير من القنادس يراقب المكان للتأكد من أن أحدًا لا يقضم منها شيئًا."

