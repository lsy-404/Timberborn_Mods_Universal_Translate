koKR = "자연과 기술의 융합으로 비버의 갉아먹음에 저항하는 고급 토리 게이트가 생성되었습니다."
trTR = "Doğa ve teknolojinin birleşimi, kunduzların kemirmeğine dayanıklı gelişmiş bir torii kapısının yaratılmasına yol açtı."
esES = "La fusión de naturaleza y tecnología ha dado lugar a la creación de una puerta torii avanzada que resiste los roeres de los castores."
itIT = "La fusione di natura e tecnologia ha portato alla creazione di un avanzato portale torii, resistente ai roditori castori."
ukUA = "Поєднання природи та технологій призвело до створення вдосконаленої torii-брами, стійкої до гризіння бобрами."
thTH = "การผสานกันของธรรมชาติและเทคโนโลยีนำไปสู่การสร้างประตูโทริอิขั้นสูงที่ต้านทานการแทะของบีเวอร์ได้"
csCZ = "Fúze přírody a technologie vedla k vytvoření pokročilých torii bran, které odolávají okousávání bobry."
