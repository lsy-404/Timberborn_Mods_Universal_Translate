csCZ = "Torii brána svatyně Kumano Hongu Taisha je tak obrovská, že ji lze vidět z jiného okresu. Není třeba dodávat, že je nepoživatelná."
viVN = "Cổng torii của đền Kumano Hongu Taisha lớn đến mức có thể nhìn thấy từ một khu vực khác. Đương nhiên nó không thể ăn được."
caES = "El torii del santuari Kumano Hongu Taisha és tan enorme que es pot veure des d'un altre districte. Sense dir-ho, no és comestible."
beBY = "Вораты святыні Кумано Хонгу Таісі такія вялікія, што іх можна ўбачыць з іншага раёна. Зразумела, што ёсць іх нельга."
roRO = "Poarta torii a sanctuarului Kumano Hongu Taisha este atât de uriașă încât poate fi văzută dintr-un alt district. Nici nu mai trebuie spus că nu este comestibilă."
huHU = "A Kumano Hongu Taisha Szentély torii kapuja olyan hatalmas, hogy egy másik körzetből is látni lehet. Nem is kell mondani, hogy nem ehető."
arSA = "يُعد بوابة توري في ضريح كومانو هونغو تايشا ضخمة جدًا لدرجة أنه يمكن رؤيتها من حي آخر. وغني عن القول إنها غير صالحة للأكل."

["minorunara.ToriiGates.HugeToriiGateIT.Flavor"]
raw = "\"But I thought torii were originally made for the great beavers to eat?\" —Pina"
status = "normal"
enUS = "\"But I thought torii were originally made for the great beavers to eat?\" —Pina"
zhCN = "但是，鸟居不是给海狸长老吃的吗？"
zhTW = "「但我以為鳥居最初是為了讓大海狸吃的？」—皮娜"
ruRU = "\"Но я думала, что тории изначально делали для того, чтобы великие бобры могли их кушать?\" —Пина"
jaJP = "「でも、鳥居は最初は大きなビーバーが食べるために作られたと思っていたよ？」 — ピナ"
frFR = "\"Mais je pensais que les torii étaient à l'origine faits pour que les grands castors les mangent ?\" —Pina"
deDE = "\"Aber ich dachte, Torii wurden ursprünglich für die großen Biber gemacht, um sie zu essen?\" —Pina"
plPL = "„Ale myślałem, że torii pierwotnie były robione, żeby wielkie bobry mogły je jeść?” —Pina"
ptBR = "\"Mas eu pensei que os torii foram feitos originalmente para os grandes castores comerem?\" —Pina"
koKR = "\"하지만 나는 토리이(새겨진 문)는 원래 큰 비버들이 먹기 위해 만들어졌다고 생각했어?\" —피나"
trTR = "\"Ama torilerin aslında büyük kunduzlar için yapıldığını düşünmüştüm?\" —Pina"
esES = "\"¿Pero yo pensaba que los torii se hicieron originalmente para que los grandes castores los comieran?\" —Pina"
itIT = "\"Ma non pensavo che i torii fossero stati originariamente creati perché i grandi castori li mangiassero?\" —Pina"
ukUA = "«Але я думала, що торії спочатку робили для того, щоб великі бобри їх їли?» —Піна"
thTH = "\" แต่ฉันนึกว่าโทริอิสร้างขึ้นมาตั้งแต่แรกเพื่อให้บีเวอร์ตัวใหญ่กินไม่ใช่หรือ?\" —พินา"
csCZ = "\"Ale myslel/a jsem, že torii byla původně vyrobena pro velké bobry, aby je jedli?\" —Pina"
viVN = "\"Nhưng tôi tưởng torii ban đầu được làm ra để cho những chú hải ly khổng lồ ăn sao?\" —Pina"
caES = "«Però jo pensava que els torii es van fer originalment perquè els grans castors se'ls mengessin?» —Pina"
beBY = "«Але ж я думала, што торыі спачатку рабілі для вялікіх бабраў, каб яны іх елі?» —Піна"
roRO = "„Dar nu credeam că torii au fost inițial făcute ca să fie mâncate de castorii cei mari?\" —Pina"
huHU = "„De nem a nagy hódoknak készültek eredetileg a torii kapuk, hogy megegyék őket?\" —Pina"
arSA = "«لكنني ظننت أن البوابات التوري صُنعت في الأصل لكي يأكلها البيفر العملاقون؟» —بينا"

