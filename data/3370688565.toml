koKR = "소나무 수지로 코팅된 최고의 나무로 만든 호화로운 도리이. 많은 비버들이 지켜보며 누구도 이를 갉아먹지 않도록 합니다."
trTR = "En kaliteli ağaçtan yapılmış, çam reçinesi ile kaplanmış lüks torii. Hiç kimsenin ona zarar vermemesi için birçok kunduz nöbet tutuyor."
