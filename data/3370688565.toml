ukUA = "Розкішні торії з найкращої деревини, покриті сосновою смолою. Велика кількість бобрів стежить, щоб ніхто не гриз їх."
thTH = "ประตูโทริอิหรูหราทำจากไม้ชั้นดีที่สุดและเคลือบด้วยยางสน มีบีเวอร์จำนวนมากคอยเฝ้าระวังเพื่อไม่ให้ใครมากัดแทะมัน"
csCZ = "Luxusní torii vyrobené z nejjemnějšího dřeva potaženého borovicovou pryskyřicí. Velké množství bobrů dbá na to, aby se na něm nikdo neodvážil okusovat."
viVN = "Cổng torii sang trọng làm từ gỗ tốt nhất được phủ nhựa thông. Rất nhiều hải ly canh chừng để đảm bảo không ai gặm nó."
