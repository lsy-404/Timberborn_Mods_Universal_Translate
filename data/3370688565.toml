["minorunara.Lantern.PaperLantern.Description"]
raw = "These lanterns are used during festivals and in front of bars to create an atmosphere different from that of everyday life."
status = "normal"
enUS = "These lanterns are used during festivals and in front of bars to create an atmosphere that differs from everyday life."
zhCN = "庆典上常用的灯笼，居酒屋门前也会悬挂，以营造不同的氛围。"
zhTW = "這些燈籠在節慶期間和酒吧前使用，以創造不同於日常生活的氛圍。"
ruRU = "Эти фонарики используются во время фестивалей и перед барами, чтобы создать атмосферу, отличающуюся от повседневной жизни."
jaJP = "これらのランタンは、祭りの間やバーの前で使用され、日常とは異なる雰囲気を作り出します。"
frFR = "Ces lanternes sont utilisées pendant les festivals et devant les bars pour créer une atmosphère différente de celle de la vie quotidienne."
deDE = "Diese Laternen werden während Festivals und vor Bars verwendet, um eine Atmosphäre zu schaffen, die sich von der des Alltags unterscheidet."
plPL = "Te latarnie są używane podczas festiwali oraz przed barami, aby stworzyć atmosferę różniącą się od codziennego życia."
ptBR = "Estas lanternas são usadas durante festivais e em frente a bares para criar uma atmosfera diferente da vida cotidiana."
koKR = "이 랜턴은 축제 기간이나 바 앞에서 일상과 다른 분위기를 만들기 위해 사용됩니다."
trTR = "Bu fenerler, festivallerde ve barların önünde günlük yaşamdan farklı bir atmosfer yaratmak için kullanılır."
esES = "Estos faroles se usan durante los festivales y frente a las tabernas para crear una atmósfera distinta a la de la vida cotidiana."
itIT = "Queste lanterne vengono usate durante i festival e davanti ai bar per creare un'atmosfera diversa da quella della vita quotidiana."
ukUA = "Ці ліхтарі використовують під час свят і перед барами, щоб створити атмосферу, відмінну від повсякденного життя."
thTH = "โคมไฟเหล่านี้ใช้ในเทศกาลและหน้าบาร์ต่าง ๆ เพื่อสร้างบรรยากาศที่แตกต่างจากชีวิตประจำวัน"
csCZ = "„Tyto lampiony se používají během festivalů a před bary, aby vytvořily atmosféru odlišnou od každodenního života.“"
viVN = "Những chiếc đèn lồng này được sử dụng trong các lễ hội và trước quán bar để tạo ra một bầu không khí khác biệt so với cuộc sống hàng ngày."
caES = "Aquests fanalets s'utilitzen durant les festes i davant dels bars per crear una atmosfera diferent de la de la vida quotidiana."
beBY = "Гэтыя ліхтары выкарыстоўваюцца падчас свят і перад барамі, каб стварыць атмасферу, якая адрозніваецца ад будзённага жыцця."
roRO = "Aceste lanterne sunt folosite în timpul festivalurilor și în fața barurilor pentru a crea o atmosferă diferită de cea din viața de zi cu zi."
huHU = "Ezeket a lámpásokat fesztiválokon és kocsmák előtt használják, hogy a mindennapitól eltérő hangulatot teremtsenek."
arSA = "تُستخدم هذه الفوانيس خلال المهرجانات وأمام الحانات لخلق أجواء تختلف عن أجواء الحياة اليومية."

["minorunara.Lantern.PaperLantern.Flavor"]
raw = "Staying up late will probably excite you, but in moderation, because you have to work tomorrow."
status = "normal"
enUS = "Staying up late might be exciting, but in moderation, because you have to work tomorrow."
zhCN = "彻夜狂欢可能会让你兴奋，但要适度，因为明天还得工作。"
zhTW = "熬夜可能會讓你感到興奮，但要適度，因為你明天有工作。"
