["minorunara.Lantern.IndoorLantern.Description"]
raw = "Although it is called an indoor lantern it can be installed outdoors."
status = "normal"
enUS = "Although it is called an indoor lantern, it can be installed outdoors."
zhCN = "虽然叫做室内灯，但也可以放在室外照明。"
zhTW = "雖然它被稱為室內燈籠，但可以安裝在戶外。"
ruRU = "Хотя это называется настольным фонарем для помещений, его можно установить на улице."
jaJP = "屋内ランタンと呼ばれていますが、屋外にも設置可能です。"
frFR = "Bien qu'il soit appelé lanterne d'intérieur, il peut être installé à l'extérieur."
deDE = "Obwohl es als Innenlaterne bezeichnet wird, kann es im Freien installiert werden."
plPL = "Chociaż nazywa się ją latarnią wewnętrzną, można ją zainstalować na zewnątrz."
ptBR = "Embora seja chamada de lanterna interna, ela pode ser instalada ao ar livre."
koKR = "실내 랜턴이라고 불리지만 외부에도 설치할 수 있습니다."
trTR = "İç mekan lambası olarak adlandırılsa da, dış mekanlarda da kurulabilir."
esES = "Aunque se llama farol de interior, puede instalarse al aire libre."
itIT = "Sebbene si chiami lanterna da interno, può essere installata anche all'esterno."
ukUA = "Хоча його називають внутрішнім ліхтарем, його можна встановлювати й надворі."
thTH = "แม้จะเรียกว่าโคมไฟในร่ม แต่ก็สามารถติดตั้งกลางแจ้งได้"
csCZ = "Ačkoliv se nazývá vnitřní lucerna, může být nainstalována venku."
viVN = "Mặc dù được gọi là đèn lồng trong nhà, nó có thể được lắp đặt ngoài trời."
caES = "Tot i que es diu llum d'interior, també es pot instal·lar a l'exterior."
beBY = "Хоць гэты ліхтар і называецца ўнутраным, ён можа быць усталяваны і на вуліцы."
roRO = "Deși se numește lanternă de interior, poate fi instalată și în exterior."
huHU = "Bár beltéri lámpásnak nevezik, kültérre is telepíthető."
arSA = "على الرغم من أنه يُسمّى فانوساً داخلياً، إلا أنه يمكن تركيبه في الهواء الطلق."

["minorunara.Lantern.IndoorLantern.Flavor"]
raw = "The ancestors of beavers were nocturnal to avoid predators, but now, as the crown of all creation, we enjoy basking in the daylight."
status = "normal"
enUS = "The ancestors of beavers were nocturnal to avoid predators, but now, as the crown of all creation, we enjoy basking in the daylight."
zhCN = "海狸的祖先曾是夜行动物，以避开捕食者。但如今，作为万物之灵的我们，享受着沐浴在阳光下的乐趣。"
zhTW = "海狸的祖先是夜行性的，以避開掠食者，但現在，作為所有生物中的頂尖存在，我們享受在陽光下沐浴。"
ruRU = "Предки бобров были ночными, чтобы избегать хищников, но теперь, как венец всего творения, мы наслаждаемся солнцем в дневное время."
jaJP = "ビーバーの祖先は捕食者を避けるために夜行性でしたが、今やすべての創造物の頂点として、私たちは日光浴を楽しんでいます。"
frFR = "Les ancêtres des castors étaient nocturnes pour éviter les prédateurs, mais maintenant, en tant que couronnement de toute la création, nous apprécions de nous prélasser sous la lumière du jour."
deDE = "Die Vorfahren der Biber waren nachtaktiv, um Raubtieren zu entkommen, aber jetzt, als die Krone der Schöpfung, genießen wir es, uns im Tageslicht zu sonnen."
plPL = "Przodkowie bobrów byli nocnymi zwierzętami, aby unikać drapieżników, ale teraz, jako ukoronowanie całego stworzenia, cieszymy się przebywaniem w świetle dziennym."
ptBR = "Os ancestrais dos castores eram noturnos para evitar predadores, mas agora, como a coroa de toda a criação, nós desfrutamos de nos bronzearmos à luz do dia."
koKR = "비버의 조상들은 포식자를 피하기 위해 야행성이었지만, 이제 우리는 모든 창조물의 왕관으로서 낮의 햇빛을 즐기는 것을 만끽합니다."
trTR = "Kunduzların ataları yırtıcılardan kaçınmak için gececiydi, ancak şimdi, tüm yaratılışın tacı olarak, gün ışığında keyiflenmenin tadını çıkarıyoruz."
esES = "Los ancestros de los castores eran nocturnos para evitar a los depredadores, pero ahora, como corona de toda la creación, disfrutamos de tomar el sol a la luz del día."
itIT = "Gli antenati dei castori erano notturni per sfuggire ai predatori, ma ora, in quanto corona di tutta la creazione, ci godiamo il piacere di crogiolarci alla luce del giorno."
ukUA = "Предки бобрів були нічними, щоб уникати хижаків, але тепер, як вінець усього творіння, ми насолоджуємося купанням у денному світлі."
thTH = "บรรพบุรุษของบีเวอร์เคยหากินเวลากลางคืนเพื่อหลีกเลี่ยงนักล่า แต่ตอนนี้ ในฐานะมงกุฎแห่งการสร้างสรรค์ทั้งปวง เราชอบอาบแดดในยามกลางวันเสียมากกว่า"
csCZ = "Otroci bobrů byli nočními tvory, aby se vyhli predátorům, ale nyní, jako koruna celé přírody, si užíváme slunečního svitu."
viVN = "Các tổ tiên của hải ly đã hoạt động về đêm để tránh kẻ săn mồi, nhưng bây giờ, như đỉnh cao của mọi sự sáng tạo, chúng ta thích đắm mình dưới ánh sáng ban ngày."
caES = "Els avantpassats dels castors eren nocturns per evitar els depredadors, però ara, com a corona de tota la creació, ens agrada prendre el sol a la llum del dia."
beBY = "Продкі бабраў вялі ночны лад жыцця, каб пазбягаць драпежнікаў, але цяпер, як вянец усяго стварэння, мы асалоджваемся купаннем у дзённым святле."
roRO = "Strămoșii castorilor erau nocturni pentru a evita prădătorii, dar acum, ca and coroană a întregii creații, ne bucurăm să ne încălzim la lumina zilei."
huHU = "A hódok ősei éjszaka tevékenyek voltak, hogy elkerüljék a ragadozókat, de most, a teremtés koronájaként, élvezzük a napfényben való sütkérezést."
arSA = "كان أسلاف القنادس ينشطون ليلاً لتجنب الحيوانات المفترسة، أما نحن الآن، تاج الخليقة كلها، فنستمتع بالاستلقاء تحت ضوء النهار."

