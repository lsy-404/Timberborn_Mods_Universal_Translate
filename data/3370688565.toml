trTR = "Geç saatlere kadar uyanık kalmak sizi heyecanlandırabilir, ama ölçülü olmak şartıyla, çünkü yarın çalışmanız gerekiyor."
esES = "Quedarte despierto hasta tarde probablemente te emocione, pero con moderación, porque mañana tienes que trabajar."
itIT = "Restare svegli fino a tardi probabilmente ti eccitera, ma con moderazione, perché domani devi lavorare."
ukUA = "Не сидіть допізна, це, мабуть, захопить вас, але з міркою, адже завтра на роботу."
thTH = "การอยู่ดึกอาจทำให้คุณตื่นเต้นได้ แต่ควรพอประมาณ เพราะพรุ่งนี้คุณยังต้องทำงาน"
csCZ = "Zůstat vzhůru dlouho do noci vás pravděpodobně nadchne, ale s mírou, protože zítra musíte pracovat."
viVN = "Việc thức khuya có thể làm bạn phấn khích, nhưng hãy điều độ, vì ngày mai bạn phải đi làm."
