jaJP = "遅くまで起きていると興奮するかもしれませんが、明日仕事があるので適度にしてください。"
frFR = "Rester éveillé tard va probablement vous exciter, mais avec modération, car vous devez travailler demain."
deDE = "Lange wach zu bleiben wird dich wahrscheinlich aufregen, aber in Maßen, denn du musst morgen arbeiten."
plPL = "Z staying awake do późna prawdopodobnie cię ekscytuje, ale z umiarem, ponieważ jutro musisz pracować."
ptBR = "Ficar acordado até tarde provavelmente vai te animar, mas com moderação, porque você tem que trabalhar amanhã."
