["minorunara.Lantern.StreetLantern.Description"]
raw = "These lanterns are often installed in front of guardhouses and on streets.  It will also be used for store signage."
status = "normal"
enUS = "These lanterns are often installed in front of guardhouses and on streets. They will also be used for store signage."
zhCN = "街头常见的路灯，有些店铺会用来挂招牌。"
zhTW = "這些燈籠通常安裝在警衛室前面和街道上。它還將用於商店招牌。"
ruRU = "Эти фонари часто устанавливаются перед караульными помещениями и на улицах. Они также будут использоваться для вывесок магазинов."
jaJP = "これらのランタンは、警備所の前や通りに設置されることが多いです。また、店舗の看板としても使用されます。"
frFR = "Ces lanternes sont souvent installées devant les postes de garde et dans les rues. Elles seront également utilisées pour la signalisation des magasins."
deDE = "Diese Laternen werden oft vor Wachen und auf Straßen installiert. Sie werden auch für Geschäftsbeschilderungen verwendet."
plPL = "Te latarnie często są instalowane przed budkami wartowniczymi i na ulicach. Będą również wykorzystywane do oznakowania sklepów."
ptBR = "Essas lanternas são frequentemente instaladas em frente a casas de guardas e nas ruas. Também serão usadas para sinalização de lojas."
koKR = "이 랜턴은 종종 경비실 앞이나 거리에서 설치됩니다. 또한 상점 간판으로도 사용됩니다."
trTR = "Bu lambalar genellikle bekçi kulübelerinin önüne ve sokaklara yerleştirilir. Ayrıca dükkan tabelası olarak da kullanılacaktır."
esES = "Estos faroles suelen instalarse frente a los puestos de guardia y en las calles. También se usarán para la señalización de las tiendas."
itIT = "Queste lanterne vengono spesso installate davanti ai corpi di guardia e lungo le strade. Possono anche essere usate per le insegne dei negozi."
ukUA = "Ці ліхтарі часто встановлюють перед сторожовими будками та на вулицях. Їх також використовують для вивісок магазинів."
thTH = "โคมไฟเหล่านี้มักถูกติดตั้งไว้หน้าป้อมยามและตามถนน และยังใช้สำหรับป้ายหน้าร้านด้วย"
csCZ = "Tyto lampy jsou často instalovány před strážními domy a na ulicích. Budou také použity pro označení obchodů."
viVN = "Những chiếc đèn lồng này thường được lắp đặt trước các trạm gác và trên các con phố. Nó cũng được dùng làm biển hiệu cho các cửa hàng."
caES = "Aquests fanals sovint s'instal·len davant dels cos de guàrdia i als carrers. També es faran servir per a la retolació de les botigues."
beBY = "Гэтыя ліхтары часта ўсталёўваюць перад варткамі і на вуліцах. Таксама іх будуць выкарыстоўваць для вывескаў крамаў."
roRO = "Aceste lanterne sunt adesea instalate în fața posturilor de pază și pe străzi. Ele vor fi folosite și pentru semnalizarea magazinelor."
huHU = "Ezeket a lámpásokat gyakran őrházak elé és utcákra telepítik. Üzlettáblák megvilágítására is használják."
arSA = "تُثبَّت هذه الفوانيس غالبًا أمام أبراج الحراسة وعلى الشوارع. كما ستُستخدم أيضًا للَافتات المتاجر."

