caES = "La fusió de la natura i la tecnologia ha portat a la creació d'una porta torii avançada que resisteix els intents de rosegament dels castors."
beBY = "Злучэнне прыроды і тэхналогій прывяло да стварэння дасканалай варотаў торыі, устойлівых да грызення бабрамі."
roRO = "Fuziunea dintre natură și tehnologie a dus la crearea unei porți torii avansate, rezistentă la roaderea castorilor."
