["minorunara.ToriiGates.PrimitiveToriiGate.Flavor"]
raw = "It is not well known why the torii gate was built but the prevailing theory is that it was to offer delicious logs to the beaver king."
status = "normal"
enUS = "It is not well known why the torii gate was built, but the prevailing theory is that it was to offer delicious logs to the beaver king."
zhCN = "虽然海狸不太记得鸟居的起源，但普遍的说法是为了向海狸长老献上最好的原木而建造的。"
zhTW = "不清楚鳥居為何而建，但普遍的理論是這是為了向海狸王奉獻美味的木頭。"
ruRU = "Не известно точно, почему была построена тории, но преобладающая теория заключается в том, что она была создана, чтобы предложить вкусные бревна королю бобров."
jaJP = "なぜ鳥居が建てられたのかよく知られていませんが、一般的な説は、ビーバーの王に美味しい丸太を提供するためだということです。"
frFR = "On ne sait pas exactement pourquoi la porte torii a été construite, mais la théorie dominante est qu'elle était destinée à offrir de délicieux troncs au roi des castors."
deDE = "Es ist nicht gut bekannt, warum das Torii-Tor erbaut wurde, aber die vorherrschende Theorie besagt, dass es dazu diente, dem Biberkönig köstliche Stämme anzubieten."
plPL = "Nie jest dobrze znane, dlaczego brama torii została zbudowana, ale panująca teoria głosi, że miała na celu ofiarowanie pysznych kłód królowi bobrów."
ptBR = "Não se sabe ao certo por que o portão torii foi construído, mas a teoria predominante é que foi para oferecer deliciosas toras ao rei dos castores."
koKR = "토리이 게이트가 왜 세워졌는지는 잘 알려져 있지 않지만, 통설은 비버 왕에게 맛있는 나무를 제공하기 위함이라고 한다."
trTR = "Torii kapısının neden yapıldığı pek bilinmiyor ama hâkim teori, bunun kunduz kralına lezzetli kütükler sunmak için yapıldığı yönünde."
esES = "No se sabe bien por qué se construyó la puerta torii, pero la teoría predominante es que se hizo para ofrecer troncos deliciosos al rey castor."
itIT = "Non si sa con certezza perché sia stato costruito il torii, ma la teoria più diffusa è che servisse a offrire deliziosi tronchi al re dei castori."
ukUA = "Незрозуміло, навіщо було збудовано ворота торії, але найпоширеніша версія полягає в тому, що вони слугували для того, щоб пропонувати смачні колоди бобровому королю."
thTH = "ไม่ค่อยมีใครรู้ว่าทำไมจึงสร้างประตูโทริอิขึ้นมา แต่ทฤษฎีที่เป็นที่ยอมรับมากที่สุดคือ เพื่อนำท่อนซุงอันโอชะไปถวายราชาบีเวอร์"
csCZ = "Není dobře známo, proč byl torii brána postavena, ale převládající teorií je, že měla nabídnout lahodné klády bobřímu králi."
viVN = "Không ai biết rõ lý do tại sao cổng torii được xây dựng, nhưng giả thuyết phổ biến cho rằng nó được xây để dâng những khúc gỗ ngon cho vua hải ly."
caES = "No se sap gaire bé per què es va construir el portal torii, però la teoria més acceptada és que servia per oferir troncs deliciosos al rei castor."
beBY = "Няма дакладнага ведання пра тое, навошта была пабудавана вароту торыі, але найбольш пашыранае меркаванне такое: яна павінна была прапаноўваць смачныя калоды баброваму караю."
roRO = "Nu se știe exact de ce a fost construită poarta torii, dar teoria predominantă este că ar fi fost ridicată pentru a oferi bușteni delicioși regelui castorilor."
huHU = "Nem ismert pontosan, miért épült a torii kapu, de az elterjedt elmélet szerint azért, hogy finom fatörzseket kínáljon a hód királynak."
arSA = "لا يُعرف على وجه اليقين لماذا بُنيت بوابة توري، لكن النظرية السائدة هي أنها أُقيمت لتقديم جذوع أشجار شهية إلى ملك القنادس."

