[_meta]
name = "Wild Terrain"

["WildTerrain.Description"]
raw = "An artificial block of Wild terrain. Construction builds in any order. With high chance of stranded beavers and unfinished blocks"
status = "normal"
enUS = "An artificial block of Wild terrain. Construction can occur in any order. There is a high chance of stranded beavers and unfinished blocks."
zhCN = "一块人工的荒野地形。建造可以按任意顺序进行。很可能出现被困的海狸和未完成的方块。"
zhTW = "一個人工的野生地形區塊。建造可在任意順序進行。很高的機率會出現被困的海狸與未完成的區塊。"
ruRU = "Искусственный блок дикой местности. Строительство может выполняться в любом порядке. С высокой вероятностью застрянут бобры и блоки останутся незавершёнными."
jaJP = "野生の地形の人工ブロック。建設は任意の順序で行われます。取り残されたビーバーと未完成のブロックが発生する可能性が高い"
frFR = "Un bloc artificiel de terrain sauvage. La construction peut se faire dans n'importe quel ordre. Avec une forte probabilité d'avoir des castors bloqués et des blocs inachevés."
deDE = "Ein künstlicher Block des wilden Terrains. Der Bau erfolgt in beliebiger Reihenfolge. Mit großer Wahrscheinlichkeit von gestrandeten Bibern und unfertigen Blöcken"
plPL = "Sztuczny blok dzikiego terenu. Budowa przebiega w dowolnej kolejności. Z dużym prawdopodobieństwem uwięzionych bobrów i niedokończonych bloków"
ptBR = "Um bloco artificial de Terreno Selvagem. A construção pode ser feita em qualquer ordem. Com alta probabilidade de castores encalhados e blocos inacabados."
koKR = "야생 지형의 인공 블록. 건설은 어떤 순서로든 진행됩니다. 좌초된 비버들과 미완성된 블록이 발생할 가능성이 큵니다"
trTR = "Yapay bir Vahşi arazi bloğu. İnşaat herhangi bir sırayla yapılır. Sıkışmış kunduzlar ve tamamlanmamış bloklar için yüksek olasılık ile."
esES = "Un bloque artificial de terreno salvaje. La construcción puede realizarse en cualquier orden. Con alta probabilidad de que queden castores varados y bloques sin terminar."
itIT = "Un blocco artificiale di terreno selvaggio. La costruzione procede in qualsiasi ordine. Con alta probabilità di castori bloccati e blocchi non completati"
ukUA = "Штучний блок дикої місцевості. Будівництво можна вести в будь-якому порядку. З високою ймовірністю бобри опиняться в пастці, а блоки залишаться недобудованими."
thTH = "บล็อกภูมิประเทศป่าที่สร้างขึ้นเทียม การก่อสร้างสามารถดำเนินการตามลำดับใดก็ได้ มีโอกาสสูงที่บีเวอร์จะติดค้างและบล็อกที่สร้างไม่เสร็จ"
csCZ = "Umělý blok divokého terénu. Stavba probíhá v libovolném pořadí. S vysokou pravděpodobností uvězněných bobrů a nedokončených bloků"
viVN = "Một khối địa hình hoang dã nhân tạo. Việc xây dựng có thể được thực hiện theo bất kỳ trình tự nào. Có xác suất cao khiến các hải ly bị mắc kẹt và các khối chưa được hoàn thiện."
caES = "Un bloc artificial de terreny salvatge. La construcció es pot fer en qualsevol ordre. Amb una probabilitat alta de castors varats i blocs sense acabar."
beBY = "Штучны блок дзікай мясцовасці. Будаваць можна ў любым парадку. Высокая верагоднасць, што бабры застануцца без месца, а блокі застануцца незавершанымі."
roRO = "Un bloc artificial de teren sălbatic. Construcția poate fi realizată în orice ordine. Există o probabilitate mare ca castorii să rămână blocați și ca blocurile să rămână neterminate."
huHU = "Egy mesterséges vadon terep blokk. Az építés tetszőleges sorrendben történik. Nagy valószínűséggel elakadt bobrok és befejezetlen blokkok maradnak vissza."
arSA = "كتلة اصطناعية من التضاريس البرية. يمكن البناء بأي ترتيب. مع احتمال كبير أن يعلق بعض القنادس ويبقى بعض الكتل غير مكتملة"

