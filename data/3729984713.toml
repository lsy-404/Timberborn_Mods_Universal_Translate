["TE.WaterOnlyTooltip"]
raw = "When enabled only water tanks evaporate. When disabled all liquid tanks evaporate including badwater and extract. Default on."
status = "normal"
enUS = "When enabled, only water tanks evaporate. When disabled, all liquid tanks evaporate, including polluted water and extract. Default is on."
zhCN = "启用时仅水箱蒸发。禁用时所有液体箱都会蒸发，包括废水和提取。默认为开启状态。"
zhTW = "啟用時僅水箱會蒸發。關閉時所有液體箱體會蒸發，包括污水和提取。默認開啟。"
ruRU = "Когда включено, испаряются только водяные баки. Когда отключено, испаряются все жидкие баки, включая сточные воды и извлечение. По умолчанию включено."
jaJP = "有効にすると水タンクのみが蒸発します。無効にするとすべての液体タンクが蒸発し、汚水や抽出物も含まれます。デフォルトはオンです。"
frFR = "Lorsque c'est activé, seuls les réservoirs d'eau s'évaporent. Lorsqu'il est désactivé, tous les réservoirs de liquide s'évaporent, y compris les eaux usées et les extraits. Par défaut activé."
deDE = "Wenn aktiviert, verdampfen nur Wassertanks. Wenn deaktiviert, verdampfen alle Flüssigkeitstanks, einschließlich Schmutzwasser und Extrakt. Standardmäßig aktiviert."
plPL = "Gdy włączone, tylko zbiorniki na wodę parują. Gdy wyłączone, wszystkie zbiorniki na płyny parują, w tym brudna woda i ekstrakt. Domyślnie włączone."
ptBR = "Quando ativado, apenas os tanques de água evaporam. Quando desativado, todos os tanques de líquido evaporam, incluindo água suja e extrações. Padrão ligado."
koKR = "활성화하면 물탱크만 증발합니다. 비활성화할 경우 모든 액체 탱크가 증발하며, 여기에는 오수 및 추출액이 포함됩니다. 기본값은 켜짐입니다."
trTR = "Açık olduğunda yalnızca su tankları buharlaşır. Kapalı olduğunda, kötü su ve ekstrakt dahil olmak üzere tüm sıvı tankları buharlaşır. Varsayılan olarak açıktır."
esES = "Cuando está activado, solo se evaporan los tanques de agua. Cuando está desactivado, se evaporan todos los tanques de líquidos, incluidos los de agua contaminada y los de extracción. Activado por defecto."
itIT = "Quando attivato, solo i serbatoi d'acqua evaporano. Quando disattivato, evaporano tutti i serbatoi di liquido, inclusi quelli di acqua dannosa e di estrazione. Attivo di default."
ukUA = "Коли увімкнено, випаровуються лише водяні баки. Коли вимкнено, випаровуються всі рідинні баки, включно з поганою водою та екстрактом. За замовчуванням увімкнено."
thTH = "เมื่อเปิดใช้งาน จะมีเพียงถังน้ำเท่านั้นที่ระเหย เมื่อปิดใช้งาน ถังของเหลวทั้งหมดจะระเหย รวมถึงน้ำเสียและของเหลวที่สกัดได้ ค่าเริ่มต้นคือเปิด"
csCZ = "Když je aktivováno, evaporují pouze vodní nádrže. Když je deaktivováno, evaporují všechny kapalné nádrže včetně odpadu a extraktu. Výchozí nastavení je zapnuto."
viVN = "Khi được bật, chỉ có các bể chứa nước bay hơi. Khi tắt, tất cả các bể chứa chất lỏng sẽ bay hơi bao gồm cả nước thải và vật liệu trích xuất. Mặc định là bật."
caES = "Quan està activat, només s'evaporen els dipòsits d'aigua. Quan està desactivat, s'evaporen tots els dipòsits de líquid, inclosa l'aigua dolenta i l'extracte. Activat per defecte."
beBY = "Калі ўключана, выпараецца толькі вада ў рэзервуарах. Калі выключана, выпараюцца ўсе вадкасныя рэзервуары, у тым ліку з брудной вадой і экстрактам. Па змаўчанні ўключана."
roRO = "Când este activată, doar rezervoarele de apă se evaporă. Când este dezactivată, toate rezervoarele de lichide se evaporă, inclusiv cele cu apă tulbure și cele de extracție. Implicit activat."
huHU = "Ha engedélyezve, csak a víztartályok párolognak el. Ha letiltva, minden folyadéktartály párolog el, beleértve a mérgező vizet és a kivonatot. Alapértelmezés: bekapcsolva."
arSA = "عند التفعيل، تتبخر خزانات المياه فقط. عند التعطيل، تتبخر جميع خزانات السوائل، بما في ذلك مياه السموم والاستخراج. الإعداد الافتراضي: مفعل."
