["Building.BotStorage.FlavorDescription"]
raw = "Even perfect machines need a place to power down and collect dust... safely."
status = "normal"
enUS = "Even perfect machines need a place to power down and collect dust... safely."
zhCN = "“即使是完美的机器也需要一个安全的地方来关机并积灰……”"
zhTW = "即使是完美的機器也需要一個地方來關閉並積灰塵……安全地。"
ruRU = "Даже совершенные машины нуждаются в месте, чтобы отключиться и собирать пыль... в безопасности."
jaJP = "完璧な機械にも、電源を切って安全に埃をかぶる場所が必要です..."
frFR = "Même les machines parfaites ont besoin d'un endroit pour s'éteindre et accumuler la poussière... en toute sécurité."
deDE = "Sogar perfekte Maschinen benötigen einen Ort, um sich auszuschalten und Staub zu sammeln... sicher."
plPL = "Nawet doskonałe maszyny potrzebują miejsca, aby się wyłączyć i zbierać kurz... w bezpieczny sposób."
ptBR = "Mesmo máquinas perfeitas precisam de um lugar para desligar e acumular poeira... com segurança."
koKR = "완벽한 기계도 안전하게 전원을 끄고 먼지를 쌓을 공간이 필요하다..."
trTR = "Her ne kadar mükemmel makinelerin de duraklayıp toz biriktireceği bir yere ihtiyacı olsa da... güvenli bir şekilde."
esES = "Hasta las máquinas perfectas necesitan un lugar donde apagarse y acumular polvo... a salvo."
itIT = "Anche le macchine perfette hanno bisogno di un posto dove spegnersi e impolverarsi... in tutta sicurezza."
ukUA = "Навіть ідеальним машинам потрібне місце, щоб безпечно вимкнутися й припасти пилом..."
thTH = "แม้แต่เครื่องจักรที่สมบูรณ์แบบก็ยังต้องมีที่ให้ปิดเครื่องแล้วปล่อยให้ฝุ่นจับ...อย่างปลอดภัย"
csCZ = "I dokonalé stroje potřebují místo, kde se mohou vypnout a shromažďovat prach... bezpečně."
viVN = "Ngay cả những cỗ máy hoàn hảo cũng cần một nơi để ngắt nguồn và thu bụi... một cách an toàn."
caES = "Fins i tot les màquines perfectes necessiten un lloc on apagar-se i acumular pols... amb seguretat."
beBY = "Нават дасканалым машынам патрэбнае месца, каб выключыцца і бяспечна збіраць пыл..."
roRO = "Chiar și mașinile perfecte au nevoie de un loc unde să se oprească și să adune praf... în siguranță."
huHU = "Még a tökéletes gépeknek is kell egy hely, ahol biztonságosan leállhatnak és porosodhatnak..."
arSA = "حتى الآلات المثالية تحتاج إلى مكان تُطفَأ فيه وتجمع الغبار... بأمان."
