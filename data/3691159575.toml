esES = "Una dinamita que libera una explosión de agua contaminada al estallar. No afecta al terreno ni a los castores."
itIT = "Una dinamite che rilascia una scarica di acqua sporca quando esplode. Non influisce sul terreno né sui castori."
ukUA = "Динаміт, який при вибуху викидає сплеск токсичної води. Не впливає на місцевість і бобрів."
thTH = "ไดนาไมต์ที่ปล่อยน้ำเสียพิษออกมาเป็นกลุ่มเมื่อระเบิด ไม่ส่งผลต่อพื้นที่หรือบีเวอร์"
csCZ = "Dynamit, který při výbuchu uvolňuje nálož špatné vody. Neovlivňuje terén ani bobry."
viVN = "Một quả bom dynamite giải phóng một luồng nước bẩn khi nó phát nổ. Không ảnh hưởng đến địa hình hoặc những con chồn."
caES = "Una dinamita que allibera una ràfega d'aigua fangosa en explotar. No afecta el terreny ni els castors."
