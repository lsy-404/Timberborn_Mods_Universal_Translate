roRO = "Un dinamită care eliberează o explozie de apă toxică (badwater) atunci când explodează. Nu afectează terenul sau castorii."
huHU = "Dinamit, amely felrobbanáskor egy adag mérgező szennyvizet (badwater) szabadít fel. Nem károsítja a terepet és a bővereket."
arSA = "ديناميت ينفجر فيُطلق دفعة من المياه الملوثة (البادwater السام) عند انفجاره. لا يؤثر في التضاريس ولا في القنادس."

["LV.BBb.DirtyBathBomb.Flavor"]
raw = "In the same manual, apparently this explosive discharge is sure to follow after the use of an interesting artifact called taco."
status = "normal"
enUS = "In the same manual, it seems that this explosive discharge is sure to follow after the use of an interesting artifact called taco."
zhCN = "在同一本手册中，显然这种爆炸性排放在使用一种名为塔可的有趣神器后必然会发生。"
zhTW = "在同一本手冊中，顯然這種爆炸性釋放肯定會在使用一個名為塔可的有趣神器後發生。"
ruRU = "В том же руководстве, похоже, за использованием интересного артефакта под названием тако обязательно последует этот взрывной выброс."
jaJP = "同じマニュアルによると、どうやらこの爆発的な排出は、「タコ」と呼ばれる興味深いアーティファクトの使用後に確実に続くようです。"
frFR = "Dans le même manuel, apparemment cette décharge explosive suivra sûrement après l'utilisation d'un artefact intéressant appelé taco."
deDE = "Im selben Handbuch scheint es, dass diese explosive Entladung sicher folgt, nachdem ein interessantes Artefakt namens Taco verwendet wurde."
plPL = "W tym samym podręczniku najwyraźniej to eksplodujące wyładowanie na pewno nastąpi po użyciu interesującego artefaktu zwanego taco."
ptBR = "No mesmo manual, aparentemente essa descarga explosiva certamente acontecerá após o uso de um artefato interessante chamado taco."
koKR = "같은 매뉴얼에 따르면, 이 폭발적인 방출은 타코라는 흥미로운 유물 사용 후 반드시 따를 것이라고 합니다."
trTR = "Aynı kılavuzda, görünüşe göre bu patlayıcı boşaltma, taco adı verilen ilginç bir nesnenin kullanımından sonra gerçekleşecektir."
esES = "En el mismo manual, al parecer esta descarga explosiva seguro que ocurre tras el uso de un curioso artefacto llamado taco."
itIT = "Nello stesso manuale, a quanto pare questa esplosione è sicuramente la conseguenza dell'uso di un curioso artefatto chiamato taco."
ukUA = "У тому ж посібнику, мабуть, цей вибуховий викид обов'язково станеться після використання цікавого артефакту під назвою taco."
thTH = "ในคู่มือเดียวกันนี้ ดูเหมือนว่าการระเบิดที่รุนแรงนี้จะเกิดขึ้นตามมาอย่างแน่นอนหลังจากใช้สิ่งประดิษฐ์น่าสนใจที่เรียกว่าทาโก้"
csCZ = "„Ve stejném manuálu, zřejmě po použití zajímavého artefaktu zvaného taco, toto výbušné vybití jistě následovat.“"
viVN = "Trong cùng một hướng dẫn, rõ ràng sự phun trào bùng nổ này chắc chắn sẽ xảy ra sau khi sử dụng một hiện vật thú vị được gọi là taco."
caES = "Al mateix manual, pel que sembla, aquesta descàrrega explosiva segur que es produeix després d'utilitzar un artefacte interessant anomenat taco."
beBY = "У тым самым кіраўстве, мабыць, гэты выбуховы выкід абавязкова адбываецца пасля выкарыстання цікавага артэфакта пад назвай taco."
roRO = "În același manual, se pare că această descărcare explozivă urmează cu siguranță după utilizarea unui artefact interesant numit taco."
huHU = "Ugyanebben a kézikönyvben állítólag ez a robbanásszerű kisülés biztosan bekövetkezik, miután használjuk az egyik érdekes műtárgyat, a taco nevűt."
arSA = "في الدليل نفسه، يبدو أن هذا التفريغ المتفجر حتمي الحدوث بعد استخدام قطعة أثرية مثيرة للاهتمام تُدعى تاكو."

