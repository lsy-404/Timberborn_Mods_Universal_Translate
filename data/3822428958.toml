["Building.RepairMonitor.StockGuard.Tooltip"]
raw = "A repair is skipped if it would leave too little stock (for example the only water tank)."
status = "normal"
enUS = "A repair is skipped if it would leave too little stock (for example, the only water tank)."
zhCN = "如果修理会导致库存过少（例如只剩下一个蓄水罐），则会跳过修理。"
zhTW = "如果修復會導致庫存量過低（例如只剩一座水箱），就會略過修復。"
ruRU = "Ремонт пропускается, если после него останется слишком мало запасов (например, если это единственный резервуар для воды)."
jaJP = "修理によって在庫が少なすぎる状態になる場合、その修理はスキップされます（たとえば、水タンクが1つしか残らない場合）。"
frFR = "Une réparation est ignorée si elle risque de laisser un stock trop faible (par exemple, s’il ne reste qu’un seul réservoir d’eau)."
deDE = "Eine Reparatur wird übersprungen, wenn dadurch zu wenig Bestand übrig bliebe (zum Beispiel beim einzigen Wassertank)."
plPL = "Naprawa jest pomijana, jeśli pozostawiłaby zbyt małe zapasy (na przykład gdy to jedyny zbiornik na wodę)."
ptBR = "Um reparo é ignorado se deixar pouco estoque (por exemplo, se for o único reservatório de água)."
koKR = "수리 후 비축량이 너무 적어질 경우(예: 유일한 물탱크), 수리를 건너뜁니다."
csCZ = "Oprava se přeskočí, pokud by po ní zbylo příliš málo zásob (například jediná nádrž na vodu)."
viVN = "Việc sửa chữa sẽ bị bỏ qua nếu khiến lượng dự trữ còn lại quá ít (ví dụ: chỉ còn lại bể chứa nước duy nhất)."
trTR = "Onarım, stokta çok az ürün bırakacaksa atlanır (örneğin, geriye yalnızca su deposu kalacaksa)."

