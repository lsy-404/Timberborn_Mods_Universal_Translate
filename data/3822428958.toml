["Building.RepairMonitor.BuilderPriority.Tooltip"]
raw = "Builder priority for all repairs from this Manager. Critical repairs go one step higher. Normal or higher repairs before new construction."
status = "normal"
enUS = "Builder priority for all repairs from this Manager. Critical repairs go one step higher. Normal- or higher-priority repairs take precedence over new construction."
zhCN = "此管理器的所有维修任务的建造优先级。紧急维修的优先级提高一级。普通及更高优先级的维修任务优先于新建建筑。"
zhTW = "此管理器的所有修理工作之建造者優先度。緊急修理的優先度提高一級。一般或更高優先度的修理工作會排在新建工程之前。"
ruRU = "Приоритет строителей для всех ремонтов от этого менеджера. Критические ремонты на ступень выше. Обычные ремонты и ремонты с более высоким приоритетом выполняются до нового строительства."
jaJP = "このマネージャーが担当するすべての修理の建設優先度。重大な修理は1段階上げます。通常以上の修理は新規建設より優先されます。"
frFR = "Priorité du constructeur pour toutes les réparations gérées par ce gestionnaire. Les réparations critiques passent à l’échelon supérieur. Les réparations normales ou prioritaires sont effectuées avant les nouvelles constructions."
deDE = "Baupriorität für alle Reparaturen durch diesen Manager. Kritische Reparaturen liegen eine Stufe höher. Normale oder höher priorisierte Reparaturen haben Vorrang vor Neubauten."
plPL = "Priorytet budowniczych dla wszystkich napraw zleconych przez tego menedżera. Naprawy krytyczne mają priorytet wyższy o jeden poziom. Naprawy o priorytecie normalnym lub wyższym są wykonywane przed nowymi budowami."
ptBR = "Prioridade de construtor para todos os reparos deste Gerenciador. Reparos críticos sobem um nível. Reparos normais ou prioritários têm precedência sobre novas construções."
koKR = "이 관리자에게서 발생하는 모든 수리의 건설자 우선순위입니다. 긴급 수리는 한 단계 높아집니다. 보통 수리 이상의 작업은 신규 건설보다 우선합니다."
csCZ = "Priorita stavitele pro všechny opravy řízené tímto manažerem. Kritické opravy mají o jeden stupeň vyšší prioritu. Opravy s normální nebo vyšší prioritou mají přednost před novou výstavbou."
viVN = "Mức ưu tiên của thợ xây cho mọi công việc sửa chữa do Người quản lý này giao. Sửa chữa khẩn cấp có mức ưu tiên cao hơn một bậc. Sửa chữa ở mức ưu tiên bình thường trở lên được thực hiện trước công trình mới."
trTR = "Bu Yöneticinin tüm onarımları için inşaatçı önceliği. Kritik onarımlar bir kademe yükselir. Yeni inşaatlardan önce normal veya daha yüksek öncelikli onarımlar yapılır."

