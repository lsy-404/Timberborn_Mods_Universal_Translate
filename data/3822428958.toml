frFR = "Pourcentage des matériaux de construction et des marchandises stockées dans un bâtiment qui tombent au sol lorsqu’il s’effondre à 0 % d’état.\\\\n0 = rien.\\\\nFacile 75, Normal 50, Difficile 25, Brutal 0.\\\\nUtilisé uniquement lorsque la difficulté est personnalisée."
deDE = "Prozentsatz der Baumaterialien und gelagerten Waren eines Gebäudes, die bei einem Einsturz mit 0 % Zustand auf den Boden fallen.\\n0 = nichts.\\nEinfach 75, Normal 50, Schwer 25, Brutal 0.\\nWird nur verwendet, wenn der Schwierigkeitsgrad auf „Benutzerdefiniert“ eingestellt ist."
