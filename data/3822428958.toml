["Building.RepairMonitor.Description"]
raw = "Automatically monitors building condition and issues repair requests when structures reach the configured wear threshold."
status = "normal"
enUS = "Automatically monitors building condition and issues repair requests when structures reach the configured wear threshold."
zhCN = "自动监测建筑状况，并在建筑达到设定的磨损阈值时发出维修请求。"
zhTW = "自動監測建築物狀況，並在結構磨損程度達到設定門檻時發出維修請求。"
ruRU = "Автоматически отслеживает состояние зданий и запрашивает ремонт, когда износ достигает установленного порога."
jaJP = "建物の状態を自動的に監視し、建物の摩耗が設定したしきい値に達すると修理を要求します。"
frFR = "Surveille automatiquement l’état des bâtiments et demande leur réparation lorsque leur usure atteint le seuil défini."
deDE = "Überwacht automatisch den Zustand von Gebäuden und fordert Reparaturen an, sobald sie den eingestellten Verschleißgrenzwert erreichen."
plPL = "Automatycznie monitoruje stan budynków i zgłasza potrzebę naprawy, gdy ich zużycie osiągnie skonfigurowany próg."
ptBR = "Monitora automaticamente a condição das construções e solicita reparos quando elas atingem o limite de desgaste configurado."
koKR = "건물 상태를 자동으로 감시하고, 구조물이 설정된 마모 임계값에 도달하면 수리 요청을 보냅니다."
csCZ = "Automaticky sleduje stav budov a zadává požadavky na opravu, když opotřebení staveb dosáhne nastaveného prahu."
viVN = "Tự động theo dõi tình trạng công trình và gửi yêu cầu sửa chữa khi công trình đạt đến ngưỡng hao mòn đã thiết lập."
trTR = "Binaların durumunu otomatik olarak izler ve yapılar belirlenen yıpranma eşiğine ulaştığında onarım talebi oluşturur."

