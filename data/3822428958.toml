["WearAndTear.Settings.Difficulty.Tooltip"]
raw = "The difficulty for new maps.\\nEach map keeps the difficulty it started with,\\nso changing this won't affect maps you already have.\\nAuto follows the game's own difficulty choice.\\nCustom uses the Categories, Speed & Timing, Machine Output\\nand Paused Buildings settings below."
status = "normal"
enUS = "The difficulty for new maps.\\nEach map keeps the difficulty it started with,\\nso changing this won't affect maps you already have.\\nAuto follows the game's own difficulty choice.\\nCustom uses the Categories, Speed & Timing, Machine Output\\nand Paused Buildings settings below."
zhCN = "新地图的难度。\\\\n每张地图都会保留创建时的难度，\\\\n因此更改此设置不会影响已有地图。\\\\n自动会跟随游戏自身的难度选择。\\\\n自定义使用下方的类别、速度与时间、机器产出\\\\n和暂停建筑设置。"
zhTW = "新地圖的難度。\\\\n每張地圖都會保留建立時的難度，\\\\n因此變更此設定不會影響你已有的地圖。\\\\n自動會遵循遊戲本身的難度選擇。\\\\n自訂則會使用下方的「類別」、「速度與時間」、「機器輸出」\\\\n和「已暫停建築物」設定。"
ruRU = "Сложность новых карт.\\nУ каждой карты сохраняется выбранная при её создании сложность,\\nтак что изменение этой настройки не повлияет на уже созданные карты.\\nРежим «Авто» использует выбранную в игре сложность.\\nРежим «Настраиваемая» использует настройки категорий, скорости и времени, производительности машин\\nи приостановки зданий ниже."
jaJP = "新しいマップの難易度。\\\\n各マップは開始時の難易度を維持するため、\\\\nこの設定を変更しても、すでにあるマップには影響しません。\\\\n自動ではゲーム独自の難易度設定に従います。\\\\nカスタムでは、以下の「カテゴリ」「速度とタイミング」「機械の出力」、\\\\n「建物の一時停止」の設定を使用します。"
frFR = "La difficulté des nouvelles cartes.\\nChaque carte conserve la difficulté avec laquelle elle a commencé,\\ndonc la modifier n’affectera pas les cartes que vous avez déjà.\\nAuto suit le choix de difficulté du jeu.\\nPersonnalisé utilise les paramètres Catégories, Vitesse et timing, Production des machines\\net Bâtiments en pause ci-dessous."
deDE = "Der Schwierigkeitsgrad für neue Karten.\\nJede Karte behält den Schwierigkeitsgrad, mit dem sie begonnen hat,\\ndaher wirkt sich eine Änderung hier nicht auf bereits vorhandene Karten aus.\\nAuto übernimmt die Schwierigkeitsauswahl des Spiels.\\nBenutzerdefiniert verwendet die nachfolgenden Einstellungen für Kategorien, Geschwindigkeit und Timing, Maschinenausstoß\\nund pausierte Gebäude."
plPL = "Poziom trudności dla nowych map.\\nKażda mapa zachowuje poziom trudności, z którym została rozpoczęta,\\nwięc zmiana tego ustawienia nie wpłynie na istniejące mapy.\\nAutomatyczny — korzysta z wyboru poziomu trudności w grze.\\nNiestandardowy — korzysta z poniższych ustawień: Kategorie, Szybkość i czas, Produkcja maszyn\\ni Wstrzymane budynki."
ptBR = "A dificuldade para novos mapas.\\nCada mapa mantém a dificuldade com que começou,\\nportanto, mudar isso não afetará os mapas que você já tem.\\nAutomático segue a escolha de dificuldade do próprio jogo.\\nPersonalizado usa as configurações de Categorias, Velocidade e Tempo, Produção das Máquinas\\ne Edifícios Pausados abaixo."
koKR = "새 맵의 난이도.\\n각 맵은 시작할 때 설정된 난이도를 유지하므로,\\n이 설정을 변경해도 이미 있는 맵에는 영향을 주지 않습니다.\\n자동은 게임 자체의 난이도 선택을 따릅니다.\\n사용자 지정은 아래의 범주, 속도 및 타이밍, 기계 출력,\\n건물 일시 정지 설정을 사용합니다."
csCZ = "Obtížnost nových map.\\nKaždá mapa si zachovává obtížnost, se kterou začínala,\\ntakže změna tohoto nastavení neovlivní mapy, které už máte.\\nAutomaticky použije obtížnost zvolenou samotnou hrou.\\nVlastní nastavení používá níže uvedené volby Kategorie, Rychlost a načasování, Výstup strojů\\na Pozastavené budovy."
viVN = "Độ khó cho các bản đồ mới.\\nMỗi bản đồ giữ nguyên độ khó lúc bắt đầu,\\nnên thay đổi tùy chọn này sẽ không ảnh hưởng đến các bản đồ bạn đã có.\\nTự động dùng lựa chọn độ khó của trò chơi.\\nTùy chỉnh dùng các cài đặt Danh mục, Tốc độ & Thời gian, Sản lượng máy\\nvà Công trình tạm dừng bên dưới."
trTR = "Yeni haritaların zorluk seviyesi.\\nHer harita, başladığı zorluk seviyesini korur,\\nbu nedenle bunu değiştirmek mevcut haritalarınızı etkilemez.\\nOtomatik, oyunun kendi zorluk seçimini izler.\\nÖzel, aşağıdaki Kategoriler, Hız ve Zamanlama, Makine Çıktısı\\nve Duraklatılmış Binalar ayarlarını kullanır."

