["WearAndTear.Settings.Paused.Switch.Tooltip"]
raw = "Paused buildings wear down more slowly (only buildings with a pause button).\\nEasy 25%, Normal 50%, Hard 75%, Brutal 100% of normal wear.\\nA map keeps the choice it started with. Changing this affects new maps only; older saves have it off."
status = "normal"
enUS = "Paused buildings wear down more slowly (only buildings with a pause button).\\nEasy 25%, Normal 50%, Hard 75%, Brutal 100% of normal wear.\\nA map keeps the choice it started with. Changing this affects new maps only; older saves have it off."
zhCN = "已暂停的建筑磨损速度会更慢（仅限带有暂停按钮的建筑）。\\n简单：正常磨损速度的 25%，普通：50%，困难：75%，残酷：100%。\\n地图会保留创建时的选项。更改此设置只会影响新地图；旧存档中此选项处于关闭状态。"
zhTW = "暫停中的建築磨損速度較慢（僅限有暫停按鈕的建築）。\\n簡單：25%，普通：50%，困難：75%，殘酷：正常磨損的 100%。\\n地圖會保留建立時選擇的設定。變更此設定只會影響新地圖；舊存檔中此設定為關閉。"
ruRU = "Здания с кнопкой паузы изнашиваются медленнее (только здания с кнопкой паузы).\\nЛёгкий: 25%, обычный: 50%, сложный: 75%, жестокий: 100% от обычного износа.\\nКарта сохраняет выбранное при её создании значение. Изменение этого параметра влияет только на новые карты; в старых сохранениях он отключён."
jaJP = "一時停止中の建物は、摩耗が遅くなります（一時停止ボタンのある建物のみ）。\\nイージー：25%、ノーマル：50%、ハード：75%、ブルータル：通常の摩耗の100%。\\nマップには、作成時に選択されていた設定が保持されます。この設定を変更しても、新しいマップにのみ適用されます。古いセーブデータではオフになっています。"
frFR = "Les bâtiments en pause s’usent moins vite (uniquement ceux qui ont un bouton de pause).\\nFacile : 25 %, Normal : 50 %, Difficile : 75 %, Brutal : 100 % de l’usure normale.\\nUne carte conserve le choix effectué à sa création. Cette modification ne concerne que les nouvelles cartes ; elle est désactivée pour les anciennes sauvegardes."
deDE = "Pausierte Gebäude verschleißen langsamer (nur Gebäude mit einer Pausentaste).\\nEinfach 25 %, Normal 50 %, Schwer 75 %, Brutal 100 % des normalen Verschleißes.\\nEine Karte behält die Einstellung, mit der sie gestartet wurde. Änderungen wirken sich nur auf neue Karten aus; bei älteren Spielständen ist die Funktion deaktiviert."
plPL = "Wstrzymane budynki zużywają się wolniej (dotyczy tylko budynków z przyciskiem wstrzymania).\\nŁatwy 25%, Normalny 50%, Trudny 75%, Brutalny 100% normalnego zużycia.\\nMapa zachowuje ustawienie wybrane podczas jej tworzenia. Ta zmiana dotyczy tylko nowych map; na starszych zapisach jest wyłączona."
ptBR = "Edifícios pausados se desgastam mais lentamente (somente edifícios com botão de pausa).\\nFácil 25%, Normal 50%, Difícil 75%, Brutal 100% do desgaste normal.\\nUm mapa mantém a escolha feita quando foi iniciado. Alterar isso afeta somente mapas novos; salvamentos antigos ficam com essa opção desativada."
koKR = "일시 정지된 건물은 더 천천히 마모됩니다(일시 정지 버튼이 있는 건물만 해당).\\n쉬움 25%, 보통 50%, 어려움 75%, 잔혹 100%의 정상 마모율.\\n맵은 시작할 때 선택한 설정을 유지합니다. 이 설정을 변경하면 새 맵에만 적용되며, 기존 세이브에서는 꺼져 있습니다."
csCZ = "Pozastavené budovy se opotřebovávají pomaleji (pouze budovy s tlačítkem pozastavení).\\nLehká obtížnost: 25 %, Normální: 50 %, Těžká: 75 %, Brutální: 100 % běžného opotřebení.\\nMapa si ponechá volbu, se kterou byla vytvořena. Změna se týká pouze nových map; u starších uložených pozic je tato možnost vypnutá."
viVN = "Các công trình đang tạm dừng xuống cấp chậm hơn (chỉ áp dụng với công trình có nút tạm dừng).\\nDễ 25%, Bình thường 50%, Khó 75%, Cực khó 100% mức xuống cấp thông thường.\\nBản đồ giữ nguyên lựa chọn đã thiết lập khi bắt đầu. Thay đổi này chỉ ảnh hưởng đến bản đồ mới; các bản lưu cũ sẽ tắt tùy chọn này."
