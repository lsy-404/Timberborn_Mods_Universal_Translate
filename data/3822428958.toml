plPL = "Jak szybko budynki niszczeją podczas suszy, jako procent normalnego tempa.\\n100 = normalne tempo, 200 = dwa razy szybsze.\\nUżywane tylko przy niestandardowym poziomie trudności."
ptBR = "Com que rapidez os edifícios se desgastam durante uma seca, em porcentagem do normal.\\\\n100 = velocidade normal, 200 = duas vezes mais rápido.\\\\nUsado apenas quando a Dificuldade está definida como Personalizada."
koKR = "가뭄 중 건물이 마모되는 속도를 평소 속도의 백분율로 나타냅니다.\\n100 = 평소 속도, 200 = 2배 빠른 속도입니다.\\n난이도가 사용자 지정일 때만 사용됩니다."
