zhTW = "退潮期間建築磨損的速度，以正常速度的百分比表示。\\n100 = 正常速度，200 = 兩倍速度。\\n僅在難度設定為自訂時使用。"
ruRU = "Как быстро изнашиваются постройки во время плохого прилива, в процентах от обычной скорости.\\n100 = обычная скорость, 200 = вдвое быстрее.\\nИспользуется только при пользовательской сложности."
jaJP = "badwaterの潮流中に建物が劣化する速度（通常時を100とした割合）。\\n100 = 通常の速度、200 = 2倍の速度。\\nDifficultyがCustomの場合のみ使用されます。"
frFR = "Vitesse d'usure des bâtiments pendant une marée toxique, en pourcentage de la vitesse normale.\\\\n100 = vitesse normale, 200 = deux fois plus rapide.\\\\nUtilisé uniquement lorsque la difficulté est personnalisée."
deDE = "Wie schnell Gebäude während einer Schadflut verschleißen, in Prozent der normalen Geschwindigkeit.\\\\n100 = normale Geschwindigkeit, 200 = doppelt so schnell.\\\\nWird nur verwendet, wenn der Schwierigkeitsgrad auf „Benutzerdefiniert“ eingestellt ist."
plPL = "Jak szybko budynki zużywają się podczas złej fali, jako procent normalnej wartości.\\\\n100 = normalne tempo, 200 = dwa razy szybsze.\\\\nUżywane tylko przy poziomie trudności Niestandardowy."
ptBR = "A velocidade de desgaste das construções durante uma maré tóxica, em porcentagem do normal.\\n100 = velocidade normal, 200 = duas vezes mais rápido.\\nUsado somente quando a dificuldade está definida como Personalizada."
koKR = "나쁜 물결 동안 건물이 마모되는 속도(정상 속도의 백분율).\\\\n100 = 정상 속도, 200 = 2배 빠른 속도.\\\\n난이도가 사용자 지정일 때만 사용됩니다."
trTR = "Badtide sırasında binaların yıpranma hızı, normal hızın yüzdesi olarak.\\n100 = normal hız, 200 = iki katı hız.\\nYalnızca Zorluk Özel olarak ayarlandığında kullanılır."
esES = "Qué tan rápido se desgastan los edificios durante una marea mala, en porcentaje de lo normal.\\n100 = velocidad normal, 200 = el doble de rápido.\\nSolo se usa cuando la dificultad es Personalizada."
itIT = "Con quale velocità gli edifici si deteriorano durante una marea cattiva, in percentuale rispetto al normale.\\n100 = velocità normale, 200 = due volte più veloce.\\nUsato solo quando la Difficoltà è impostata su Personalizzata."
ukUA = "Наскільки швидко зношуються будівлі під час badtide, у відсотках від звичайної швидкості.\\n100 = звичайна швидкість, 200 = удвічі швидше.\\nВикористовується лише тоді, коли складність має значення «Користувацька»."
thTH = "ความเร็วที่อาคารสึกหรอระหว่างช่วงน้ำเสีย (badtide) เทียบเป็นเปอร์เซ็นต์ของปกติ\\\\n100 = ความเร็วปกติ, 200 = เร็วเป็นสองเท่า\\\\nใช้เฉพาะเมื่อความยากถูกตั้งเป็นแบบกำหนดเอง"
csCZ = "Jak rychle se budovy během otráveného přílivu opotřebovávají, v procentech běžné rychlosti.\\n100 = běžná rychlost, 200 = dvakrát rychleji.\\nPoužívá se pouze při nastavení obtížnosti na Vlastní."
viVN = "Tốc độ công trình xuống cấp trong đợt thủy triều độc hại, tính theo phần trăm so với bình thường.\\n100 = tốc độ bình thường, 200 = nhanh gấp đôi.\\nChỉ áp dụng khi Độ khó được đặt là Tùy chỉnh."
caES = "Amb quina rapidesa es desgasten els edificis durant una mala marea, en percentatge de la velocitat normal.\\n100 = velocitat normal, 200 = dues vegades més ràpid.\\nNomés s'utilitza quan la Dificultat és Personalitzada."
beBY = "Наколькі хутка будынкі зношваюцца падчас дрэннага ліха, у працэнтах ад звычайнага.\\n100 = звычайная хуткасць, 200 = удвая хутчэй.\\nВыкарыстоўваецца толькі тады, калі складанасць роўная «Карыстальніцкая»."
roRO = "Cât de repede se uzează clădirile în timpul unei badtide, în procente din viteza normală.\\n100 = viteza normală, 200 = de două ori mai repede.\\nSe folosește doar când Dificultatea este Custom."
huHU = "Milyen gyorsan kopnak az épületek egy rossz víz idején (badtide), a normál sebesség százalékában.\\n100 = normál sebesség, 200 = kétszer olyan gyorsan.\\nCsak akkor használatos, ha a nehézség értéke Egyedi."
arSA = "مدى سرعة تآكل المباني خلال المد السام، كنسبة مئوية من المعدل الطبيعي.\\n100 = السرعة الطبيعية، 200 = ضعف السرعة.\\nيُستخدم فقط عند ضبط الصعوبة على «مخصص»."

