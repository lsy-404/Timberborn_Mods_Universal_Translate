huHU = "Mennyi gyorsabban kopnak le az épületek szárazság idején, a normál sebesség százalékában.\\n100 = normál sebesség, 200 = kétszer olyan gyors.\\nCsak akkor használatos, ha a nehézségi szint Egyéni."
