["WearAndTear.Settings.Speed.Grace.Tooltip"]
raw = "Full cycles at the start of a new map before wear begins.\\n0 = wear from day 1.\\nOnly used when Difficulty is Custom."
status = "normal"
enUS = "Full cycles at the start of a new map before wear begins.\\n0 = wear from day 1.\\nOnly used when Difficulty is Custom."
zhCN = "新地图开始时，在磨损开始前的完整周期数。\\n0 = 从第 1 天开始磨损。\\n仅在难度设为自定义时使用。"
zhTW = "新地圖開始時、損耗開始前的完整週期數。\\\\n0 = 從第 1 天開始損耗。\\\\n僅在難度設為自訂時使用。"
ruRU = "Полные циклы в начале новой карты до начала износа.\\n0 = износ с 1-го дня.\\nИспользуется только при пользовательской сложности."
jaJP = "劣化が始まるまでの、新しいマップ開始時の完全なサイクル数。\\\\n0 = 1日目から劣化。\\\\n難易度がカスタムの場合のみ使用されます。"
frFR = "Cycles complets au début d'une nouvelle carte avant le début de l'usure.\\\\n0 = usure dès le jour 1.\\\\nUtilisé uniquement lorsque la difficulté est personnalisée."
deDE = "Vollständige Zyklen zu Beginn einer neuen Karte, bevor der Verschleiß einsetzt.\\n0 = Verschleiß ab Tag 1.\\nWird nur verwendet, wenn der Schwierigkeitsgrad auf „Benutzerdefiniert“ eingestellt ist."
plPL = "Pełne cykle na początku nowej mapy, zanim zacznie się zużycie.\\n0 = zużycie od 1. dnia.\\nUżywane tylko przy poziomie trudności Niestandardowy."
ptBR = "Ciclos completos no início de um novo mapa antes de o desgaste começar.\\n0 = desgaste desde o dia 1.\\nUsado somente quando a dificuldade está definida como Personalizada."
koKR = "마모가 시작되기 전 새 맵 시작 시의 전체 주기 수입니다.\\n0 = 첫날부터 마모됩니다.\\n난이도가 사용자 지정일 때만 사용됩니다."
trTR = "Aşınma başlamadan önce yeni bir haritada geçen tam döngü sayısı.\\n0 = 1. günden itibaren aşınma.\\nYalnızca Zorluk Özel olarak ayarlandığında kullanılır."
esES = "Ciclos completos al inicio de un mapa nuevo antes de que comience el desgaste.\\n0 = desgaste desde el día 1.\\nSolo se usa cuando la Dificultad está en Personalizada."
itIT = "Cicli completi all'inizio di una nuova mappa prima che l'usura inizi.\\n0 = usura dal giorno 1.\\nUtilizzato solo quando la Difficoltà è impostata su Personalizzata."
ukUA = "Повні цикли на початку нової карти до початку зносу.\\n0 = знос з першого дня.\\nВикористовується лише тоді, коли складність встановлено як «Користувацька»."
thTH = "จำนวนรอบเต็มเมื่อเริ่มแมปใหม่ก่อนที่การสึกหรอจะเริ่มต้น\\\\n0 = การสึกหรอเริ่มตั้งแต่วันที่ 1\\\\nใช้เฉพาะเมื่อความยาก (Difficulty) ถูกตั้งเป็นแบบกำหนดเอง (Custom)"
csCZ = "Celé cykly na začátku nové mapy, než začne opotřebení.\\n0 = opotřebení od 1. dne.\\nPoužívá se pouze při vlastní obtížnosti."
viVN = "Số chu kỳ trọn vẹn vào đầu bản đồ mới trước khi bắt đầu hao mòn.\\n0 = hao mòn từ ngày 1.\\nChỉ được sử dụng khi Độ khó là Tùy chỉnh."
caES = "Cicles complets a l'inici d'un mapa nou abans que comenci el desgast.\\n0 = desgast des del dia 1.\\nNomés s'utilitza quan la Dificultat és Personalitzada."
beBY = "Колькі поўных цыклаў на пачатку новай карты перад тым, як пачынаецца зношванне.\\n0 = зношванне з 1-га дня.\\nВыкарыстоўваецца толькі тады, калі складанасць — «Карыстальніцкая»."
roRO = "Cicluri complete la începutul unei hărți noi înainte ca uzura să înceapă.\\nLa 0 = uzura începe din ziua 1.\\nFolosit doar când Dificultatea este setată pe Personalizat."
huHU = "Teljes ciklusok egy új térkép elején, mielőtt az elhasználódás elkezdődik.\\n0 = az elhasználódás az 1. naptól kezdődik.\\nCsak akkor használatos, ha a nehézség beállítása Egyéni."
arSA = "دورات كاملة في بداية خريطة جديدة قبل أن يبدأ البلى.\\nالقيمة 0 = يبدأ البلى من اليوم الأول.\\nيُستخدم فقط عندما تكون الصعوبة مخصصة."

