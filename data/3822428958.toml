esES = "Qué tan rápido se desgastan los edificios durante una sequía, en porcentaje de lo normal.\\n100 = velocidad normal, 200 = el doble de rápida.\\nSolo se usa cuando la dificultad es Personalizada."
itIT = "Quanto velocemente gli edifici si deteriorano durante una siccità, in percentuale rispetto al normale.\\n100 = velocità normale, 200 = il doppio della velocità.\\nUsato solo quando la Difficoltà è impostata su Personalizzata."
ukUA = "Наскільки швидко будівлі зношуються під час посухи, у відсотках від нормального.\\n100 = звичайна швидкість, 200 = удвічі швидше.\\nВикористовується лише тоді, коли складність встановлено на «Власна»."
thTH = "การสึกหรอของอาคารระหว่างภัยแล้ง มีความเร็วเป็นเปอร์เซ็นต์เทียบกับปกติ\\n100 = ความเร็วปกติ, 200 = เร็วเป็นสองเท่า\\nใช้เฉพาะเมื่อความยากถูกตั้งเป็นแบบกำหนดเอง"
csCZ = "Jak rychle se během sucha budovy opotřebovávají, v procentech normální rychlosti.\\n100 = normální rychlost, 200 = dvakrát rychleji.\\nPoužívá se pouze při vlastní obtížnosti."
viVN = "Tốc độ các công trình xuống cấp trong thời hạn hán, tính theo phần trăm so với bình thường.\\n100 = tốc độ bình thường, 200 = nhanh gấp đôi.\\nChỉ được dùng khi Độ khó được đặt thành Tùy chỉnh."
caES = "Amb quina rapidesa es desgasten els edificis durant una sequera, en percentatge del normal.\\n100 = velocitat normal, 200 = el doble de ràpid.\\nNomés s'utilitza quan la Dificultat és Personalitzada."
beBY = "Наколькі хутка будынкі зношваюцца падчас засухі, у працэнтах ад звычайнага.\\n100 = звычайная хуткасць, 200 = удвая хутчэй.\\nВыкарыстоўваецца толькі тады, калі складанасць усталявана як «Карыстальніцкая»."
