["WearAndTear.Settings.Preset.Tooltip"]
raw = "Copies a difficulty's values into the Custom settings as a starting point:\\nCategories, Speed & Timing, Machine Output and Paused Buildings.\\nIt replaces your current Custom values. Only used when Difficulty is Custom.\\nMaps you already have keep their own values."
status = "normal"
enUS = "Copies a difficulty's values into the Custom settings as a starting point:\\nCategories, Speed & Timing, Machine Output, and Paused Buildings.\\nIt replaces your current Custom values. Only used when Difficulty is Custom.\\nMaps you already have keep their own values."
zhCN = "将某个难度的数值复制到自定义设置中，作为起点：\\n类别、速度与时机、机器产出和暂停建筑。\\n这会替换你当前的自定义数值。仅在难度为“自定义”时使用。\\n已有地图会保留各自的数值。"
zhTW = "將某個難度的數值複製到自訂設定中作為起始值：\\\\n分類、速度與時序、機器輸出及暫停的建築。\\\\n這會取代你目前的自訂數值。僅在難度設為「自訂」時使用。\\\\n你已有的地圖會保留各自的數值。"
ruRU = "Копирует значения уровня сложности в пользовательские настройки в качестве отправной точки:\\\\nКатегории, скорость и время, производительность механизмов и приостановленные постройки.\\\\nЗаменяет текущие пользовательские значения. Используется, только если выбрана пользовательская сложность.\\\\nУ уже имеющихся у вас карт сохраняются собственные значения."
jaJP = "難易度の値をカスタム設定にコピーし、出発点として使用します：\\\\nカテゴリー、速度と時間、機械の出力、停止中の建物。\\\\n現在のカスタム設定の値は置き換えられます。難易度が「カスタム」の場合のみ使用されます。\\\\nすでに所有しているマップには、それぞれ固有の値が維持されます。"
frFR = "Copie les valeurs d’un niveau de difficulté dans les paramètres personnalisés pour servir de point de départ :\\nCatégories, vitesse et durée, production des machines et bâtiments en pause.\\nCela remplace vos valeurs personnalisées actuelles. Utilisé uniquement si le niveau de difficulté est Personnalisé.\\nLes cartes que vous possédez déjà conservent leurs propres valeurs."
deDE = "Kopiert die Werte eines Schwierigkeitsgrads als Ausgangspunkt in die benutzerdefinierten Einstellungen:\\\\nKategorien, Geschwindigkeit & Timing, Maschinenausstoß und pausierte Gebäude.\\\\nErsetzt deine aktuellen benutzerdefinierten Werte. Wird nur verwendet, wenn der Schwierigkeitsgrad „Benutzerdefiniert“ ist.\\\\nBereits vorhandene Karten behalten ihre eigenen Werte."
plPL = "Kopiuje wartości poziomu trudności do ustawień niestandardowych jako punkt wyjścia:\\nKategorie, szybkość i czas, produkcja maszyn oraz wstrzymane budynki.\\nZastępuje obecne wartości niestandardowe. Używane tylko wtedy, gdy poziom trudności to niestandardowy.\\nMapy, które już masz, zachowują własne wartości."
ptBR = "Copia os valores de uma dificuldade para as configurações Personalizadas, como ponto de partida:\\nCategorias, Velocidade e tempo, Produção das máquinas e Edifícios pausados.\\nSubstitui os valores Personalizados atuais. Usado somente quando a dificuldade é Personalizada.\\nOs mapas que você já tem mantêm seus próprios valores."
koKR = "난이도 설정값을 맞춤 설정의 시작점으로 복사합니다:\\\\n카테고리, 속도 및 시간, 기계 출력, 일시 정지된 건물.\\\\n현재 맞춤 설정값을 대체합니다. 난이도가 맞춤으로 설정된 경우에만 사용됩니다.\\\\n이미 보유한 맵은 각자의 설정값을 유지합니다."
csCZ = "Zkopíruje hodnoty obtížnosti do vlastního nastavení jako výchozí bod:\\nKategorie, rychlost a načasování, výstup strojů a pozastavené budovy.\\nNahradí vaše aktuální vlastní hodnoty. Použije se pouze tehdy, když je obtížnost nastavena na Vlastní.\\nMapy, které už máte, si ponechají své vlastní hodnoty."
viVN = "Sao chép các giá trị của một độ khó vào phần cài đặt Tùy chỉnh làm điểm khởi đầu:\\nDanh mục, Tốc độ & Thời gian, Sản lượng máy móc và Công trình bị tạm dừng.\\nThao tác này thay thế các giá trị Tùy chỉnh hiện tại của bạn. Chỉ được sử dụng khi Độ khó là Tùy chỉnh.\\nCác bản đồ bạn đã có vẫn giữ nguyên các giá trị riêng."
trTR = "Bir zorluğun değerlerini başlangıç noktası olarak Özel ayarlara kopyalar:\\nKategoriler, Hız ve Zamanlama, Makine Çıktısı ve Duraklatılmış Binalar.\\nMevcut Özel ayarlarınızın yerini alır. Yalnızca Zorluk Özel olarak ayarlandığında kullanılır.\\nSahip olduğunuz haritalar kendi değerlerini korur."

