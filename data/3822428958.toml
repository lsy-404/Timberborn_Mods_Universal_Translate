["WearAndTear.Settings.Speed.Calm.Tooltip"]
raw = "How fast buildings wear down in calm weather, in percent of normal.\\n100 = normal speed, 200 = twice as fast.\\nOnly used when Difficulty is Custom."
status = "normal"
enUS = "How fast buildings wear down in calm weather, as a percentage of normal.\\n100 = normal speed, 200 = twice as fast.\\nOnly used when Difficulty is Custom."
zhCN = "平静天气下建筑损耗的速度，以正常速度的百分比表示。\\\\n100 = 正常速度，200 = 两倍速度。\\\\n仅在难度设为自定义时使用。"
zhTW = "平靜天氣下建築物的磨損速度，以正常速度的百分比表示。\\\\n100 = 正常速度，200 = 兩倍速度。\\\\n僅在難度設為自訂時使用。"
ruRU = "Как быстро здания изнашиваются в спокойную погоду, в процентах от нормы.\\n100 = нормальная скорость, 200 = вдвое быстрее.\\nИспользуется, только если выбрана пользовательская сложность."
jaJP = "穏やかな天候で建物が劣化する速さ。通常の何パーセントかで表示します。\\\\n100 = 通常の速さ、200 = 2倍の速さ。\\\\n難易度がカスタムの場合のみ使用されます。"
frFR = "Vitesse d’usure des bâtiments par temps calme, en pourcentage de la valeur normale.\\n100 = vitesse normale, 200 = deux fois plus rapide.\\nUtilisé uniquement si la difficulté est personnalisée."
deDE = "Wie schnell Gebäude bei ruhigem Wetter verschleißen, in Prozent des Normalwerts.\\n100 = normale Geschwindigkeit, 200 = doppelt so schnell.\\nWird nur verwendet, wenn der Schwierigkeitsgrad auf „Benutzerdefiniert“ steht."
plPL = "Jak szybko budynki niszczeją przy spokojnej pogodzie, w procentach normalnego tempa.\\n100 = normalne tempo, 200 = dwa razy szybciej.\\nUżywane tylko przy niestandardowym poziomie trudności."
ptBR = "Velocidade com que os edifícios se desgastam em clima calmo, em porcentagem do normal.\\n100 = velocidade normal, 200 = duas vezes mais rápido.\\nUsado apenas quando a dificuldade está definida como Personalizada."
koKR = "평온한 날씨에 건물이 마모되는 속도입니다. 정상 속도의 백분율로 표시됩니다.\\n100 = 정상 속도, 200 = 두 배 빠른 속도입니다.\\n난이도가 사용자 지정일 때만 사용됩니다."
csCZ = "Jak rychle se budovy opotřebovávají za klidného počasí, v procentech běžné rychlosti.\\n100 = běžná rychlost, 200 = dvakrát rychleji.\\nPoužívá se pouze při nastavení obtížnosti na Vlastní."
viVN = "Tốc độ công trình xuống cấp khi thời tiết yên ả, tính theo phần trăm so với bình thường.\\n100 = tốc độ bình thường, 200 = nhanh gấp đôi.\\nChỉ được sử dụng khi Độ khó là Tùy chỉnh."
trTR = "Sakin havalarda binaların yıpranma hızı, normal hızın yüzdesi olarak.\\n100 = normal hız, 200 = iki katı hız.\\nYalnızca Zorluk Özel olarak ayarlandığında kullanılır."

