esES = "Cada avería es simplemente mantenimiento que llegó tarde."
itIT = "Ogni guasto è semplicemente manutenzione arrivata in ritardo."
ukUA = "Кожна поломка — це просто технічне обслуговування, яке прийшло із запізненням."
thTH = "ทุกความล้มเหลวก็แค่การบำรุงรักษาที่มาถึงช้าไป"
csCZ = "Každá porucha je jen údržba, která přišla pozdě."
