deDE = "Wie schnell Gebäude während einer Schadflut verschleißen, in Prozent der normalen Geschwindigkeit.\\\\n100 = normale Geschwindigkeit, 200 = doppelt so schnell.\\\\nWird nur verwendet, wenn der Schwierigkeitsgrad auf „Benutzerdefiniert“ eingestellt ist."
plPL = "Jak szybko budynki zużywają się podczas złej fali, jako procent normalnej wartości.\\\\n100 = normalne tempo, 200 = dwa razy szybsze.\\\\nUżywane tylko przy poziomie trudności Niestandardowy."
ptBR = "A velocidade de desgaste das construções durante uma maré tóxica, em porcentagem do normal.\\n100 = velocidade normal, 200 = duas vezes mais rápido.\\nUsado somente quando a dificuldade está definida como Personalizada."
koKR = "나쁜 물결 동안 건물이 마모되는 속도(정상 속도의 백분율).\\\\n100 = 정상 속도, 200 = 2배 빠른 속도.\\\\n난이도가 사용자 지정일 때만 사용됩니다."
csCZ = "Jak rychle se budovy během otráveného přílivu opotřebovávají, v procentech běžné rychlosti.\\n100 = běžná rychlost, 200 = dvakrát rychleji.\\nPoužívá se pouze při nastavení obtížnosti na Vlastní."
viVN = "Tốc độ công trình xuống cấp trong đợt thủy triều độc hại, tính theo phần trăm so với bình thường.\\n100 = tốc độ bình thường, 200 = nhanh gấp đôi.\\nChỉ áp dụng khi Độ khó được đặt là Tùy chỉnh."
trTR = "Badtide sırasında binaların yıpranma hızı, normal hızın yüzdesi olarak.\\n100 = normal hız, 200 = iki katı hız.\\nYalnızca Zorluk Özel olarak ayarlandığında kullanılır."

