["WearAndTear.Panel.Flavor.Folktails"]
raw = "The hoomans had a phrase: 'If it ain't broke...' They rarely finished that sentence."
status = "normal"
enUS = "The hoomans had a phrase: 'If it ain't broke...' They rarely finished that sentence."
zhCN = "人类有句格言：“没坏的话，就别……”他们很少把这句话说完。"
zhTW = "人類有句俗話：「東西沒壞……」他們很少把這句話說完。"
ruRU = "У людей была поговорка: «Работает — не трогай…» Они редко заканчивали эту фразу."
jaJP = "人間たちには「壊れていないなら……」という言い回しがあった。彼らがこの文を最後まで言うことはめったになかった。"
frFR = "Les hoomans avaient une expression : « Si ce n’est pas cassé… » Ils finissaient rarement cette phrase."
deDE = "Die Hoomans hatten einen Spruch: „Wenn es nicht kaputt ist …“ Sie haben diesen Satz nur selten beendet."
plPL = "Ludziska miały takie powiedzenie: „Jak coś nie jest zepsute…” Rzadko kończyły to zdanie."
ptBR = "Os humanos tinham uma frase: 'Se não está quebrado...' Eles raramente terminavam essa frase."
koKR = "호오만들에게는 이런 말이 있었다. '고장 나지 않았다면...' 그들은 그 말을 끝까지 하는 일이 드물었다."
trTR = "İnsanların şöyle bir sözü vardı: 'Bozuk değilse...' Bu cümleyi nadiren tamamlarlardı."
esES = "Los humanos tenían un refrán: «Si no está roto...». Rara vez terminaban esa frase."
itIT = "I \"hoomans\" avevano un detto: \"Se non è rotto...\" Raramente finivano la frase."
ukUA = "Людяни мали приказку: «Якщо не зламано...» Вони рідко дорікали цю фразу до кінця."
thTH = "ชาวมนุษย์มีสำนวนหนึ่งว่า \"ถ้ามันยังไม่พัง...\" แต่พวกเขาแทบไม่เคยพูดประโยคนั้นจนจบ"
csCZ = "Hoomani měli jedno rčení: „Když se to nerozbilo…“ Tenhle výrok jen málokdy dokončili."
viVN = "Loài người có câu nói: 'Nếu nó chưa hỏng...' Họ hiếm khi nói hết câu đó."
caES = "Els humans tenien una frase: \"Si no està trencat...\" Gairebé mai acabaven aquesta frase."
beBY = "Людзі мелі прыказку: «Калі не зламалася…» Яны рэдка дагаворвалі гэтае сказ да канца."
roRO = "Oamenii aveau o zicală: „Dacă nu e stricat...” Rareori terminau propoziția."
huHU = "A emberek egyik mondása az volt: „Ha nem tört el...” Ezt a mondatot ritkán fejezték be."
arSA = "لطالما كان لدى البشر عبارة: \"إذا لم يكن معطوبًا...\" لكنهم نادرًا ما كانوا يُكملون تلك الجملة."

