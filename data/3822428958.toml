["WearAndTear.Settings.Output.Switch.Tooltip"]
raw = "Worn machines (power generators, workshops and so on) produce less.\\nA map keeps the choice it started with. Changing this affects new maps only; older saves have it off."
status = "normal"
enUS = "Worn machines (power generators, workshops, and so on) produce less.\\nA map keeps the choice it started with. Changing this affects new maps only; older saves have it off."
zhCN = "老旧机器（动力发电机、工坊等）的产出会减少。\\n地图会保留创建时的选择。更改此设置只会影响新地图；旧存档中此选项处于关闭状态。"
zhTW = "老舊機器（發電機、工坊等等）的產出會降低。\\n地圖會保留建立時的選擇。變更此設定只會影響新地圖；舊存檔中此設定為關閉。"
ruRU = "Изношенные машины (генераторы энергии, мастерские и так далее) производят меньше.\\\\nКарта сохраняет выбранный при создании вариант. Изменение этой настройки касается только новых карт; на старых сохранениях она отключена."
jaJP = "老朽化した機械（発電機や作業場など）の生産量が減少します。\\nマップには、作成時に選択した設定が維持されます。この設定の変更は新しいマップにのみ適用され、古いセーブデータではオフのままです。"
frFR = "Les machines usées (générateurs d’énergie, ateliers, etc.) produisent moins.\\\\nUne carte conserve le choix effectué lors de sa création. Modifier ce réglage n’affecte que les nouvelles cartes ; il est désactivé dans les anciennes sauvegardes."
deDE = "Abgenutzte Maschinen (Stromerzeuger, Werkstätten usw.) produzieren weniger.\\\\nEine Karte behält die bei ihrem Start gewählte Einstellung bei. Eine Änderung betrifft nur neue Karten; bei älteren Spielständen ist die Option deaktiviert."
plPL = "Zużyte maszyny (generatory energii, warsztaty itd.) produkują mniej.\\nMapa zachowuje początkowy wybór. Zmiana tej opcji dotyczy tylko nowych map; w starszych zapisach jest ona wyłączona."
ptBR = "Máquinas desgastadas (geradores de energia, oficinas e assim por diante) produzem menos.\\nUm mapa mantém a escolha com que foi criado. Alterar isso afeta apenas mapas novos; em saves mais antigos, fica desativado."
koKR = "마모된 기계(동력 발전기, 작업장 등)는 생산량이 감소합니다.\\n지도는 생성될 때의 선택을 유지합니다. 이 설정을 변경해도 새 지도에만 적용되며, 이전 저장 파일에서는 비활성화되어 있습니다."
csCZ = "Opotřebované stroje (výrobníky energie, dílny a podobně) mají nižší produkci.\\nMapa si ponechá volbu, se kterou začínala. Změna se projeví jen u nových map; u starších uložených pozic je tato možnost vypnutá."
viVN = "Máy móc hao mòn (máy phát điện, xưởng và những thứ tương tự) sản xuất ít hơn.\\nBản đồ giữ nguyên lựa chọn đã được thiết lập khi tạo. Thay đổi tùy chọn này chỉ ảnh hưởng đến bản đồ mới; các bản lưu cũ sẽ tắt tùy chọn này."
trTR = "Yıpranmış makineler (güç jeneratörleri, atölyeler vb.) daha az üretir.\\nBir harita, oluşturulurken seçilen ayarı korur. Bu ayarı değiştirmek yalnızca yeni haritaları etkiler; eski kayıtlar için kapalıdır."

