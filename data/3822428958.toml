viVN = "Việc sửa chữa sẽ bị bỏ qua nếu khiến lượng dự trữ còn lại quá ít (ví dụ: chỉ còn lại bể chứa nước duy nhất)."
caES = "Una reparació s'omet si deixaria massa poc estoc (per exemple, l'únic dipòsit d'aigua)."
beBY = "Рамонт прапускаецца, калі ён пакінуў бы занадта мала запасу (напрыклад, адзіны вадзяны бак)."
roRO = "O reparație este omisă dacă ar lăsa prea puțin stoc (de exemplu, singurul rezervor de apă)."
