ptBR = "Percentual dos materiais de construção e dos bens armazenados em um edifício que caem no chão quando ele desmorona com 0% de condição.\\n0 = nada.\\nFácil 75, Normal 50, Difícil 25, Brutal 0.\\nUsado somente quando a dificuldade é Personalizada."
koKR = "건물의 상태가 0%가 되어 무너질 때 건설 자재와 보관 중인 물품이 바닥에 떨어지는 비율입니다.\\n0 = 없음.\\n쉬움 75, 보통 50, 어려움 25, 극한 0.\\n난이도가 사용자 지정일 때만 사용됩니다."
csCZ = "Procento stavebního materiálu a uskladněného zboží v budově, které se při jejím zhroucení při 0% stavu vysype na zem.\\n0 = nic.\\nLehká 75, Normální 50, Těžká 25, Brutální 0.\\nPoužívá se pouze při vlastním nastavení obtížnosti."
