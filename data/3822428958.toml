["WearAndTear.Settings.Refund.Tooltip"]
raw = "Percent of a building's build materials and stored goods that drops on the ground when it collapses at 0% condition.\\n0 = nothing.\\nEasy 75, Normal 50, Hard 25, Brutal 0.\\nOnly used when Difficulty is Custom."
status = "normal"
enUS = "Percent of a building's construction materials and stored goods that drop on the ground when it collapses at 0% condition.\\n0 = nothing.\\nEasy 75, Normal 50, Hard 25, Brutal 0.\\nOnly used when Difficulty is Custom."
zhCN = "建筑在耐久度降至 0% 时坍塌，掉落到地面的建造材料和储存物品的百分比。\\\\n0 = 什么都不掉落。\\\\n简单 75、普通 50、困难 25、残酷 0。\\\\n仅在难度为自定义时使用。"
zhTW = "建築物耐久度降至 0% 並倒塌時，其建造材料和儲存貨物掉落在地上的百分比。\\\\n0 = 無。\\\\n簡單 75、普通 50、困難 25、殘酷 0。\\\\n僅在難度為自訂時使用。"
ruRU = "Процент строительных материалов и хранящихся товаров, которые выпадают на землю при разрушении здания с 0% прочности.\\n0 = ничего.\\nЛегко — 75, Нормально — 50, Сложно — 25, Беспощадно — 0.\\nИспользуется только при пользовательском уровне сложности."
jaJP = "建物が耐久度0%で崩壊したとき、建設資材と保管品のうち地面に落ちる割合。\\\\n0 = 何も落ちない。\\\\nイージー 75、ノーマル 50、ハード 25、ブルータル 0。\\\\n難易度がカスタムの場合のみ使用されます。"
frFR = "Pourcentage des matériaux de construction et des marchandises stockées dans un bâtiment qui tombent au sol lorsqu’il s’effondre à 0 % d’état.\\\\n0 = rien.\\\\nFacile 75, Normal 50, Difficile 25, Brutal 0.\\\\nUtilisé uniquement lorsque la difficulté est personnalisée."
deDE = "Prozentsatz der Baumaterialien und gelagerten Waren eines Gebäudes, die bei einem Einsturz mit 0 % Zustand auf den Boden fallen.\\n0 = nichts.\\nEinfach 75, Normal 50, Schwer 25, Brutal 0.\\nWird nur verwendet, wenn der Schwierigkeitsgrad auf „Benutzerdefiniert“ eingestellt ist."
plPL = "Procent materiałów budowlanych i przechowywanych dóbr w budynku, które wypadają na ziemię, gdy budynek zawali się przy stanie 0%.\\\\n0 = nic.\\\\nŁatwy 75, Normalny 50, Trudny 25, Brutalny 0.\\\\nUżywane tylko wtedy, gdy poziom trudności jest ustawiony na Niestandardowy."
ptBR = "Percentual dos materiais de construção e dos bens armazenados em um edifício que caem no chão quando ele desmorona com 0% de condição.\\n0 = nada.\\nFácil 75, Normal 50, Difícil 25, Brutal 0.\\nUsado somente quando a dificuldade é Personalizada."
koKR = "건물의 상태가 0%가 되어 무너질 때 건설 자재와 보관 중인 물품이 바닥에 떨어지는 비율입니다.\\n0 = 없음.\\n쉬움 75, 보통 50, 어려움 25, 극한 0.\\n난이도가 사용자 지정일 때만 사용됩니다."
trTR = "Bir bina %0 dayanıklılıkta çöktüğünde, inşaat malzemelerinin ve depolanan mallarının yere dökülen yüzdesi.\\n0 = hiçbir şey.\\nKolay 75, Normal 50, Zor 25, Acımasız 0.\\nYalnızca Zorluk Özel olarak ayarlandığında kullanılır."
esES = "Porcentaje de los materiales de construcción y de los bienes almacenados de un edificio que caen al suelo cuando se derrumba con un estado del 0%.\\n0 = nada.\\nFácil 75, Normal 50, Difícil 25, Brutal 0.\\nSolo se usa cuando la dificultad es Personalizada."
itIT = "Percentuale dei materiali da costruzione e dei beni immagazzinati di un edificio che cade a terra quando crolla con condizione dello 0%.\\n0 = nulla.\\nFacile 75, Normale 50, Difficile 25, Brutale 0.\\nUsato solo quando la Difficoltà è impostata su Personalizzata."
ukUA = "Відсоток будівельних матеріалів і складених товарів будівлі, що падають на землю, коли вона руйнується при стані 0%.\\n0 = нічого.\\nЛегко 75, Нормально 50, Важко 25, Жорстоко 0.\\nВикористовується лише тоді, коли складність встановлено як «Користувацька»."
thTH = "เปอร์เซ็นต์ของวัสดุก่อสร้างและสินค้าที่เก็บไว้ในอาคารซึ่งจะตกลงสู่พื้นเมื่ออาคารพังลงที่สภาพ 0%\\n0 = ไม่มีอะไรตก\\nง่าย 75, ปกติ 50, ยาก 25, โหดร้าย 0\\nใช้เฉพาะเมื่อความยาก (Difficulty) ตั้งเป็นกำหนดเอง"
csCZ = "Procento stavebního materiálu a uskladněného zboží v budově, které se při jejím zhroucení při 0% stavu vysype na zem.\\n0 = nic.\\nLehká 75, Normální 50, Těžká 25, Brutální 0.\\nPoužívá se pouze při vlastním nastavení obtížnosti."
viVN = "Tỷ lệ phần trăm vật liệu xây dựng và hàng hóa được lưu trữ của một công trình rơi xuống đất khi công trình sụp đổ ở mức độ bền 0%.\\n0 = không có gì.\\nDễ 75, Thường 50, Khó 25, Cực khó 0.\\nChỉ được sử dụng khi Độ khó được đặt thành Tùy chỉnh."
caES = "Percentatge dels materials de construcció i dels béns emmagatzemats d'un edifici que cauen a terra quan es col·lapsa amb una condició del 0%.\\n0 = res.\\nFàcil 75, Normal 50, Difícil 25, Brutal 0.\\nNomés s'utilitza quan la Dificultat és Personalitzada."
beBY = "Адсотак будаўнічых матэрыялаў і захаваных тавараў будынка, які выпадае на зямлю, калі ён руйнуецца пры стане 0%.\\n0 = нічога.\\nЛёгкі 75, Звычайны 50, Складаны 25, Брутальны 0.\\nВыкарыстоўваецца толькі тады, калі складанасць — «Карыстальніцкая»."
roRO = "Procentul din materialele de construcție și bunurile depozitate ale unei clădiri care cad pe sol atunci când aceasta se prăbușește la 0% integritate.\\n0 = nimic.\\nUșor 75, Normal 50, Greu 25, Brutal 0.\\nFolosit doar când Dificultatea este Personalizată."
huHU = "Az épület építőanyagainak és tárolt árucikkeinek azon százaléka, amely a földre hullik, amikor az épület 0%-os állapotnál összeomlik.\\n0 = semmi.\\nKönnyű 75, Normál 50, Nehéz 25, Brutális 0.\\nCsak akkor használatos, ha a nehézségi szint Egyéni."
arSA = "النسبة المئوية لمواد بناء المبنى والبضائع المخزنة التي تسقط على الأرض عندما ينهار المبنى عند حالة 0%.\\n0 = لا شيء.\\nسهل 75، عادي 50، صعب 25، وحشي 0.\\nتُستخدم فقط عندما تكون الصعوبة مخصصة."

