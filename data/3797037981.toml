["RestaurantsPack.Building.Automat.Description"]
raw = "3 corn rations and 1 canola oil make 8 hot trays. Runs on a bot and mechanical power: no beaver is assigned to it."
status = "normal"
enUS = "3 corn rations and 1 canola oil make 8 hot trays. Runs on a bot and mechanical power: no beaver is assigned to it."
zhCN = "3份玉米口粮和1份菜籽油可制作8份热餐。由机器人和机械动力驱动：无需分配海狸。"
zhTW = "3 份玉米口糧和 1 份油菜籽油可製作 8 份熱餐。由機器人和機械動力運作：不會指派海狸到此處工作。"
ruRU = "Из 3 пайков из кукурузы и 1 рапсового масла получается 8 горячих подносов. Работает на боте и механической энергии: бобры к нему не назначаются."
jaJP = "トウモロコシの配給食3個と菜種油1個から、熱々のトレイを8個作ります。ボットと機械動力で稼働し、ビーバーは割り当てられません。"
frFR = "3 rations de maïs et 1 huile de colza produisent 8 plateaux chauds. Fonctionne avec un bot et de l’énergie mécanique : aucun castor ne lui est affecté."
deDE = "3 Maisrationen und 1 Rapsöl ergeben 8 warme Mahlzeiten. Läuft mit einem Bot und mechanischer Energie: Es ist kein Biber zugewiesen."
plPL = "3 racje kukurydziane i 1 olej rzepakowy dają 8 gorących tac. Działa na bota i zasilanie mechaniczne: nie przypisuje się do niego bobra."
ptBR = "3 rações de milho e 1 óleo de canola produzem 8 bandejas quentes. Funciona com um autômato e energia mecânica: nenhum castor é designado para operá-lo."
koKR = "옥수수 배급식량 3개와 카놀라유 1개로 뜨거운 요리 8개를 만듭니다. 자동봇과 기계 동력으로 작동하므로 비버가 배정되지 않습니다."
trTR = "3 mısır tayını ve 1 kanola yağı, 8 sıcak tepsi üretir. Bir otomat ve mekanik güçle çalışır: buraya hiçbir kunduz atanmaz."
esES = "3 raciones de maíz y 1 aceite de colza producen 8 bandejas calientes. Funciona con un bot y energía mecánica: no se asigna ningún bobo a este edificio."
itIT = "3 razioni di mais e 1 olio di colza producono 8 vassoi caldi. Funziona con un robot e energia meccanica: nessun castoro è assegnato a questo edificio."
ukUA = "3 порції кукурудзи та 1 одиниця олії канола виготовляють 8 гарячих підносів. Працює від робота та механічної енергії: жоден бобер до нього не призначається."
