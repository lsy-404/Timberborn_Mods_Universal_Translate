["Building.WagonYard.Description"]
raw = "Replaced by the Cart & Wagon Yard; kept so placed ones keep working. Haulers with four-wheel wagons carry eight times a normal beaver's load, dropping it at several workshops on the way."
status = "normal"
enUS = "Replaced by the Cart & Wagon Yard; kept so placed ones keep working. Haulers with four-wheel wagons carry eight times a normal beaver's load, dropping it at several workshops on the way."
zhCN = "被冷藏车场和货车场取代，保留此建筑是为了让已放置的建筑继续运作。四轮货车的运输人员所搬运的货物是普通海狸的八倍，并会在途中的多个工坊卸下货物。"
zhTW = "取代為推車與貨車場；保留此建築，以便已放置的建築繼續運作。配備四輪貨車的搬運者，其載運量為一般海狸的八倍，並會在途中於數個工坊卸下貨物。"
ruRU = "Заменено на «Двор телег и повозок»; оставлено, чтобы уже построенные здания продолжали работать. Перевозчики с четырёхколёсными повозками переносят в восемь раз больше груза, чем обычный бобёр, и по пути доставляют его сразу на несколько мастерских."
jaJP = "Cart & Wagon Yardに置き換えられましたが、設置済みのものが引き続き機能するよう残しています。四輪ワゴンを使う運搬係は、通常のビーバーの8倍の積荷を運び、途中のいくつかの作業場で降ろします。"
frFR = "Remplacé par le Parc à charrettes et wagons ; conservé pour que les bâtiments déjà placés continuent de fonctionner. Les transporteurs avec des wagons à quatre roues transportent huit fois la charge d'un castor normal, en la déposant dans plusieurs ateliers sur le trajet."
deDE = "Durch den Wagenhof mit Karren ersetzt; bleibt erhalten, damit bereits platzierte Exemplare weiterhin funktionieren. Transporter mit vierrädrigen Wagen tragen die achtfache Last eines normalen Bibers und laden sie unterwegs an mehreren Werkstätten ab."
plPL = "Zastąpiony przez Dwór Wozów i Wagonów; zachowany, aby już postawione budynki nadal działały. Woźnice z czterokołowymi wozami przewożą osiem razy większy ładunek niż zwykły bóbr, zostawiając go w kilku warsztatach po drodze."
ptBR = "Substituído pelo Pátio de Carrinhos e Vagões; mantido para que os já colocados continuem funcionando. Transportadores com vagões de quatro rodas carregam oito vezes a carga de um castor comum, deixando-a em várias oficinas no caminho."
koKR = "대체됨: 수레 및 마차 마당으로 대체되었지만, 이미 설치된 건물이 계속 작동하도록 남겨 둡니다. 사 륜 마차를 가진 운반꾼은 일반 비버가 나르는 양의 여덟 배를 운반하며, 가는 길에 여러 작업장에 짐을 내려놓습니다."
trTR = "Cart & Wagon Yard ile değiştirildi; yerleştirilmiş olanlar çalışmaya devam etsin diye korundu. Dört tekerlekli vagonlu taşıyıcılar, normal bir kunduzun taşıyabildiğinin sekiz katı yük taşır ve yol boyunca birkaç atölyede bırakır."
esES = "Reemplazado por el Patio de Carros y Carretas; se mantiene para que los ya colocados sigan funcionando. Los transportistas con carretas de cuatro ruedas cargan ocho veces la carga de un castor normal, descargándola en varios talleres durante el recorrido."
itIT = "Sostituito dal Deposito di Carri e Carretti; mantenuto affinché quelli già piazzati continuino a funzionare. I trasportatori con carri a quattro ruote trasportano otto volte il carico di un normale castoro, scaricandolo in diversi laboratori lungo il percorso."
ukUA = "Замінено на Двір возів і карт; залишено, щоб уже розміщені будівлі продовжували працювати. Перевізники з чотириколісними возами переносять у вісім разів більше вантажу, ніж звичайний бобер, і по дорозі залишають його в кількох майстернях."
thTH = "แทนที่ด้วย Cart & Wagon Yard แต่คงไว้เพื่อให้สิ่งที่วางไว้แล้วยังทำงานต่อได้ ผู้ขนส่งที่ใช้รถลากสี่ล้อจะขนของได้แปดเท่าของปริมาณปกติของบีเวอร์หนึ่งตัว และทิ้งของไว้ที่โรงงานหลายแห่งระหว่างทาง"
csCZ = "Nahrazeno Dvorem pro vozy a povozy; ponecháno, aby už umístěné budovy dál fungovaly. Nákladní zvířata s čtyřkolovými vozy nesou osmkrát větší náklad než běžný bobr a cestou ho vykládají v několika dílnách."
viVN = "Đã được thay thế bởi Bãi Xe Đẩy & Xe Ngựa; giữ lại để các công trình đã đặt vẫn hoạt động. Người vận chuyển dùng xe bốn bánh chở gấp tám lần lượng hàng của một hải ly bình thường, và trả hàng tại nhiều xưởng dọc đường."
caES = "Substituït pel Pati de carros i carretons; es manté perquè les unitats ja col·locades continuïn funcionant. Els transportistes amb carretons de quatre rodes carreguen vuit vegades la càrrega d'un castor normal, i la deixen en diversos tallers pel camí."
beBY = "Заменена на двор повозок і фур; захавана, каб размешчаныя будынкі працягвалі працаваць. Ганчакі з чатырохколавымі фурамі перавозяць у восем разоў большы груз, чым звычайны бабёр, і пакідаюць яго на некалькіх майстэрнях па дарозе."
roRO = "Înlocuit de Cart & Wagon Yard; păstrat pentru ca cele deja plasate să continue să funcționeze. Transportatorii cu care-cu patru roți transportă de opt ori încărcătura unui castor obișnuit și o lasă în mai multe ateliere pe drum."
huHU = "Helyét a Kocsi- és szekérudvar váltotta fel; a lerakott példányok azért maradnak meg, hogy tovább működjenek. A négykerekű szekerekkel közlekedő szállítók egy átlagos bóbita terhének nyolcszorosát viszik, és útközben több műhelynél is leadják a rakományt."
arSA = "استُبدلت بساحة العربات والعجلات؛ أُبقي عليها حتى تواصل المباني الموضوعة عملها. تحمل الناقلات بعربات ذات أربع عجلات ثمانية أضعاف حمولة البيفر العادي، وتُفرغها في عدة ورش على الطريق."

