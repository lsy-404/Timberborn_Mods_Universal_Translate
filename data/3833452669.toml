["Building.CartShed.Description"]
raw = "Replaced by the Cart & Wagon Yard; kept so placed ones keep working. Haulers with carts carry four times a normal beaver's load per trip."
status = "normal"
enUS = "Replaced by the Cart & Wagon Yard; kept so placed ones keep working. Haulers with carts carry four times a normal beaver's load per trip."
zhCN = "由推车与马车场取代；保留此建筑，以便已放置的建筑继续工作。搭载推车的搬运工每趟运送的货物量是普通海狸的四倍。"
zhTW = "已被「推車與貨車場」取代；保留此建築，以讓已放置的建築繼續運作。配備推車的搬運工每趟運送的貨物量為一般海狸的四倍。"
ruRU = "Заменено на «Двор телег и повозок»; оставлено, чтобы уже построенные работали. Погонщики с телегами перевозят за один рейс в четыре раза больше груза, чем обычный бобёр."
jaJP = "カート＆ワゴン置き場に置き換えられました。配置済みのものが引き続き機能するよう残しています。カート付きの運搬作業員は、1回の運搬で通常のビーバーの4倍の荷物を運びます。"
frFR = "Remplacé par le Parc à charrettes et wagons ; conservé pour que ceux déjà placés continuent de fonctionner. Les transporteurs avec charrettes transportent quatre fois la charge d'un castor normal par trajet."
deDE = "Durch den Karren- und Wagenhof ersetzt; bleibt erhalten, damit bereits platzierte Exemplare weiterhin funktionieren. Transporteure mit Karren tragen pro Fahrt die vierfache Last eines normalen Bibers."
plPL = "Zastąpione przez Podwórze Wozów i Wagonów; zachowane, aby już postawione budynki nadal działały. Przewoźnicy z wozami przenoszą czterokrotnie większy ładunek w jednym kursie niż zwykły bóbr."
ptBR = "Substituído pelo Pátio de Carroças e Vagões; mantido para que os já colocados continuem funcionando. Transportadores com carroças carregam quatro vezes a carga de um castor comum por viagem."
koKR = "대체되었으며 Cart & Wagon Yard로 바뀌었습니다. 이미 배치된 건물이 계속 작동하도록 남겨 둡니다. 수레를 가진 운반꾼은 한 번에 일반 비버의 네 배 분량을 운반합니다."
trTR = "Cart & Wagon Yard ile değiştirildi; yerleştirilmiş olanlar çalışmaya devam etsin diye tutuldu. Arabalı taşıyıcılar, her seferde normal bir kunduzun taşıdığı yükün dört katını taşır."
esES = "Reemplazado por el Patio de Carros y Carretas; se conserva para que los ya construidos sigan funcionando. Los transportistas con carros transportan cuatro veces la carga de un castor normal por viaje."
itIT = "Sostituito dal Deposito Carri e Carretti; mantenuto affinché quelli già piazzati continuino a funzionare. I trasportatori con carri trasportano quattro volte il carico di un normale castoro per viaggio."
ukUA = "Замінено Двором возів і фургонів; залишено, щоб уже розміщені будівлі продовжували працювати. Возові перевізники переносять учетверо більше вантажу за один рейс, ніж звичайний бобер."
thTH = "ถูกแทนที่ด้วยลานเกวียนและรถลาก แต่คงไว้เพื่อให้สิ่งที่สร้างไว้แล้วยังทำงานต่อไปได้ ผู้ขนส่งที่ใช้เกวียนจะขนของได้สี่เท่าของปริมาณที่บีเวอร์ทั่วไปขนได้ในแต่ละเที่ยว"
csCZ = "Nahrazeno dvorem pro vozy a povozy; ponecháno, aby stávající umístěné budovy dál fungovaly. Dopravci s vozy odnesou při jedné cestě čtyřikrát tolik nákladu než běžný bobr."
viVN = "Được thay thế bởi Bãi Xe Đẩy & Xe Kéo; giữ lại để các công trình đã đặt vẫn hoạt động. Những người vận chuyển có xe đẩy mang được gấp bốn lần lượng hàng của một hải ly thông thường trong mỗi chuyến."
caES = "Substituït pel Pati de Carros i Carruatges; es conserva perquè els ja construïts continuïn funcionant. Els transportistes amb carros porten quatre vegades la càrrega d'un castor normal per viatge."
beBY = "Замененае двара для коней і фур; пакінута, каб размешчаныя будынкі працягвалі працаваць. Перавозчыкі з вазамі нясуць у чатыры разы больш за звычайнага бабра за адзін рэйс."
roRO = "Înlocuit de Curtea pentru care și vagoane; păstrat pentru ca cele deja amplasate să continue să funcționeze. Transportatorii cu care transportă de patru ori mai mult decât încărcătura unui castor obișnuit pe fiecare cursă."
huHU = "Felváltotta a Kocsi- és szekérudvar; azért maradt meg, hogy a már lerakott épületek továbbra is működjenek. A kocsikkal közlekedő szállítók egy menetben a szokásos hód rakományának négyszeresét szállítják."
arSA = "استُبدلت بساحة العربات والعربات الكارّة؛ أُبقي عليها حتى تستمر المباني الموضوعة في العمل. ينقل الناقلون الذين يستخدمون العربات أربعة أضعاف حمولة البيفر العادي في كل رحلة."

