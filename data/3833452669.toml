["Building.CartShedIronTeeth.Description"]
status = "normal"
raw = "Up to 5 haulers push hand carts and carry four times a normal beaver's load per trip. Bots carry the load without a cart."
enUS = "Up to 5 haulers push hand carts and carry four times a normal beaver's load per trip. Bots carry the load without a cart."
zhCN = "最多可有 5 名搬运工推动手推车，每趟搬运量是普通海狸的四倍。机器人无需手推车即可搬运货物。"
zhTW = "最多可有 5 名搬運工推手推車，每趟搬運量是普通海狸的四倍。機器人不使用手推車也能搬運貨物。"
ruRU = "До 5 грузчиков толкают ручные тележки и за одну ходку переносят в четыре раза больше обычного бобра. Боты переносят груз без тележки."
jaJP = "最大5人の運搬係が手押し車を押し、1回の運搬で通常のビーバーの4倍の荷物を運びます。ボットは手押し車なしで荷物を運びます。"
frFR = "Jusqu'à 5 transporteurs poussent des chariots à bras et transportent quatre fois la charge d'un castor normal par trajet. Les bots transportent la charge sans chariot."
deDE = "Bis zu 5 Träger schieben Handkarren und transportieren pro Fahrt das Vierfache der üblichen Last eines Bibers. Bots transportieren die Last ohne Karren."
plPL = "Do 5 tragarzy pcha wózki ręczne i przewozi w jednym kursie ładunek czterokrotnie większy niż ładunek zwykłego bobra. Boty przenoszą ładunek bez wózka."
ptBR = "Até 5 carregadores empurram carrinhos de mão e transportam, por viagem, quatro vezes a carga de um castor normal. Bots transportam a carga sem carrinho."
koKR = "최대 5명의 운반꾼이 손수레를 밀며, 한 번 운반할 때 일반 비버가 나르는 양의 4배를 나릅니다. 봇은 수레 없이 짐을 나릅니다."
trTR = "En fazla 5 taşıyıcı el arabalarını iter ve sefer başına normal bir kunduzun taşıdığı yükün dört katını taşır. Botlar yükü el arabası olmadan taşır."
esES = "Hasta 5 transportistas empujan carretillas y llevan cuatro veces la carga de un castor normal por viaje. Los bots transportan la carga sin carretilla."
itIT = "Fino a 5 trasportatori spingono carretti a mano e trasportano quattro volte il carico di un castoro normale per viaggio. I bot trasportano il carico senza carretto."
ukUA = "До 5 вантажників штовхають ручні візки й перевозять за один рейс у чотири рази більше вантажу, ніж звичайний бобер. Боти перевозять вантаж без візка."
thTH = "ผู้ขนของสูงสุด 5 คนช่วยกันเข็นรถเข็นมือ และบรรทุกของต่อเที่ยวได้มากกว่าบีเวอร์ทั่วไป 4 เท่า บอตบรรทุกของได้โดยไม่ต้องใช้รถเข็น"
csCZ = "Až 5 přepravců tlačí ruční vozíky a na jednu cestu unesou čtyřnásobek nákladu běžného bobra. Boti přenášejí náklad bez vozíku."
viVN = "Tối đa 5 người vận chuyển đẩy xe kéo tay và mang lượng hàng gấp bốn lần một hải ly bình thường mỗi chuyến. Bot mang hàng mà không cần xe."
caES = "Fins a 5 transportistes empenyen carretons de mà i transporten quatre vegades la càrrega d'un castor normal per viatge. Els bots transporten la càrrega sense carretó."
beBY = "Да 5 грузчыкаў штурхаюць ручныя каляскі і за адну паездку перавозяць груз, у чатыры разы большы за звычайную ношу бабра. Боты пераносяць гэты груз без каляскі."
roRO = "Până la 5 cărăuși împing cărucioare de mână și transportă la fiecare cursă de patru ori încărcătura unui castor obișnuit. Boții transportă încărcătura fără cărucior."
huHU = "Legfeljebb 5 szállító tol kézikocsit, és fuvaronként egy átlagos hód rakományának négyszeresét szállítja. A botok kocsi nélkül viszik a rakományt."
arSA = "يمكن لما يصل إلى 5 ناقلين دفع عربات يد وحمل أربعة أضعاف حمولة قندس عادي في الرحلة الواحدة. وتحمل الروبوتات الحمولة من دون عربة."

