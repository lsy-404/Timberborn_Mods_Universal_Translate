["Building.CartWagonYard.Description"]
raw = "Up to 12 haulers. Each trip they pick a vehicle: the four-wheel wagon for loads over four beaver loads, deliveries to several workshops or trips over 30 tiles (up to eight beaver loads); otherwise the hand cart, 20% faster."
status = "normal"
enUS = "Up to 12 haulers. Each trip they pick a vehicle: the four-wheel wagon for loads over four beaver loads, deliveries to several workshops or trips over 30 tiles (up to eight beaver loads); otherwise the hand cart, 20% faster."
zhCN = "最多12名搬运工。每次出行时，他们会选择一种车辆：若载重超过四个海狸负载单位、需送往多个工坊，或行程超过30格（最多可载八个海狸负载单位），则使用四轮马车；否则使用手推车，速度快20%。"
zhTW = "最多12名搬運工。每趟運送時，他們會選擇一種載具：若負載超過四份海狸負載、需要送往多個工坊，或行程超過30格（最多八份海狸負載），則使用四輪貨車；否則使用手推車，速度快20%。"
ruRU = "До 12 перевозчиков. Для каждой поездки они выбирают транспорт: четырёхколёсную повозку для грузов более четырёх бобриных грузов, доставки на несколько мастерских или поездки более чем на 30 клеток (до восьми бобриных грузов); в остальных случаях — ручную тележку, которая на 20% быстрее."
jaJP = "最大12台の運搬係。運搬のたびに車両を選択します。4頭分の荷物を超える場合、複数の作業場への配送、または30タイルを超える移動（ビーバー8頭分の荷物まで）には四輪荷車を使用します。それ以外の場合は手押し車を使用し、こちらは20%速くなります。"
frFR = "Jusqu'à 12 transporteurs. À chaque trajet, ils choisissent un véhicule : le chariot à quatre roues pour les charges de plus de quatre charges de castor, les livraisons à plusieurs ateliers ou les trajets de plus de 30 cases (jusqu'à huit charges de castor) ; sinon, la charrette à main, 20 % plus rapide."
deDE = "Bis zu 12 Transporter. Bei jeder Fahrt wählen sie ein Fahrzeug: den vierrädrigen Wagen für Ladungen über vier Biberladungen, Lieferungen an mehrere Werkstätten oder Fahrten über 30 Kacheln (bis zu acht Biberladungen); andernfalls den Handkarren, der 20 % schneller ist."
plPL = "Do 12 transporterów. Przy każdym kursie wybierają pojazd: czterokołowy wóz dla ładunków powyżej czterech ładunków bobra, dostaw do kilku warsztatów lub kursów dłuższych niż 30 kafelków (do ośmiu ładunków bobra); w pozostałych przypadkach ręczny wózek, o 20% szybszy."
ptBR = "Até 12 transportadores. A cada viagem, eles escolhem um veículo: a carroça de quatro rodas para cargas acima de quatro cargas de castor, entregas a várias oficinas ou viagens de mais de 30 tiles (até oito cargas de castor); caso contrário, o carrinho de mão, 20% mais rápido."
koKR = "최대 12대의 운반원. 각 운반 시 차량을 선택합니다. 네 바퀴 수레는 네 명분 이상의 짐이나 여러 작업장에 배송하거나 30타일을 넘는 운반(최대 여덟 명분의 짐)에 사용되며, 그렇지 않으면 20% 더 빠른 손수레를 사용합니다."
trTR = "Üst sınır 12 taşıyıcı. Her seferde bir araç seçerler: dört tekerlekli vagon, dörtten fazla kunduz yükü için, birden çok atölyeye teslimat veya 30 kareden uzun seferler için (sekiz kunduz yüküne kadar); bunun dışında, %20 daha hızlı olan el arabası."
esES = "Hasta 12 transportistas. En cada viaje eligen un vehículo: el carro de cuatro ruedas para cargas de más de cuatro cargas de castor, entregas a varios talleres o viajes de más de 30 casillas (hasta ocho cargas de castor); de lo contrario, la carretilla de mano, un 20 % más rápida."
itIT = "Fino a 12 trasportatori. Ogni viaggio scelgono un veicolo: il carro a quattro ruote per carichi superiori a quattro carichi di castoro, consegne a diversi laboratori o viaggi oltre 30 tile (fino a otto carichi di castoro); altrimenti il carretto a mano, più veloce del 20%."
ukUA = "До 12 перевізників. Щоразу вони обирають транспорт: чотириколісний віз для вантажів понад чотири вантажі бобрів, доставок до кількох майстерень або поїздок понад 30 клітинок (до восьми вантажів бобрів); в інших випадках ручний візок, який на 20% швидший."
thTH = "ผู้ขนส่งได้สูงสุด 12 ตัว ในแต่ละเที่ยว พวกมันจะเลือกยานพาหนะดังนี้: รถลากสี่ล้อสำหรับการขนของที่มากกว่าสี่ภาระของบีเวอร์ การส่งไปยังโรงงานหลายแห่ง หรือการเดินทางที่ยาวเกิน 30 ช่อง (ได้สูงสุดแปดภาระของบีเวอร์) มิฉะนั้นจะใช้รถเข็นมือ ซึ่งเร็วกว่า 20%"
csCZ = "Až 12 povozníků. Při každé cestě si vyberou vozidlo: čtyřkolový vůz pro náklady nad čtyři náklady bobrů, doručování do několika dílen nebo cesty delší než 30 dlaždic (až osm nákladů bobrů); jinak ruční vozík, který je o 20 % rychlejší."
viVN = "Tối đa 12 xe vận chuyển. Mỗi chuyến, chúng chọn một phương tiện: xe bốn bánh cho những chuyến chở trên bốn tải trọng hải ly, giao hàng đến nhiều xưởng hoặc chuyến đi dài hơn 30 ô (tối đa tám tải trọng hải ly); nếu không thì dùng xe đẩy tay, nhanh hơn 20%."
caES = "Fins a 12 transportistes. A cada viatge trien un vehicle: el carro de quatre rodes per a càrregues de més de quatre càrregues de castor, lliuraments a diversos tallers o viatges de més de 30 caselles (fins a vuit càrregues de castor); si no, la carretó de mà, un 20% més ràpida."
beBY = "Да 12 перавозчыкаў. Кожную паездку яны выбіраюць транспарт: чатырохколавы воз для грузаў больш за чатыры бабровыя грузы, дастаўкі ў некалькі майстэрняў або паездкі больш за 30 клетак (да васьмі бабровых грузаў); інакш — ручны вазок, які на 20% хутчэйшы."
roRO = "Până la 12 hamali. La fiecare cursă aleg un vehicul: căruța cu patru roți pentru încărcături de peste patru încărcături de castor, livrări către mai multe ateliere sau curse de peste 30 de plăci (până la opt încărcături de castor); în caz contrar, cărucioarul manual, cu 20% mai rapid."
huHU = "Legfeljebb 12 szállító. Minden fuvarnál kiválasztják a járművet: a négykerekű szekeret, ha a rakomány négynél több beavatkozónyi (beaver load), több műhelybe szállítanak, vagy 30 csempénél hosszabb az út (legfeljebb nyolc beaver load); egyébként a kézikocsit, amely 20%-kal gyorsabb."
arSA = "تصل سعة هذا الموقع إلى 12 ناقلًا. في كل رحلة يختارون مركبة: العربة ذات العجلات الأربع للأحمال التي تتجاوز أربعة أحمال من القنادس، أو للتسليم إلى عدة ورش، أو للرحلات التي تتجاوز 30 بلاطة (بسعة تصل إلى ثمانية أحمال من القنادس)؛ وفي غير ذلك يستخدمون العربة اليدوية، وهي أسرع بنسبة 20%."

