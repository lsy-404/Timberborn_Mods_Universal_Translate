name: Auto Translate Mods

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify production translation on isolated samples
        type: boolean
        default: false
  schedule:
    # Run daily at 07:00 UTC to process new translations
    - cron: '0 7 * * *'

jobs:
  translate:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner || contains(fromJSON(vars.WORKFLOWS_ALLOWLIST || '[]'), github.actor)
    runs-on: ubuntu-latest
    environment: automations
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_TOKEN }}
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements.txt tiktoken==0.14.0
      
      - name: Check production translation contracts
        run: |
          python -m unittest discover -s test -p 'test_translation_production.py'
          python -m unittest discover -s test -p 'test_translation_artifact.py'
          python -m unittest discover -s test -p 'test_translation_recovery.py'

      - name: Verify production translation on isolated samples
        if: inputs.verify_only == true
        env:
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
        run: python test/verify_production_translation.py

      - name: Sync ingame TOML files from raw sources
        if: inputs.verify_only != true
        run: |
          python .github/scripts/sync_ingame.py \
            --config .github/config/config.toml \
            --raw-dir .github/data/raw \
            --data-dir data

      - name: Run translation
        if: inputs.verify_only != true
        id: translate
        env:
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
        run: |
          LOG_FILE=".github/log/translation.log"
          THREAD_LOG_FILE=".github/log/thread_work.log"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          TEMP_BRANCH="translate/auto-$(date -u '+%Y%m%d')-${GITHUB_RUN_ID}"
          CHECKPOINT_INTERVAL=60
          CHECKPOINT_PID=""
          TRANSLATE_PID=""
          CHECKPOINT_STOP_FILE="$(git rev-parse --git-path translation-checkpoint.stop)"
          ORIGIN_SHA=$(git rev-parse HEAD)

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b "$TEMP_BRANCH"
          rm -f -- "$CHECKPOINT_STOP_FILE"

          {
            echo "TEMP_BRANCH=${TEMP_BRANCH}"
            echo "TARGET_BRANCH=${TARGET_BRANCH}"
            echo "ORIGIN_SHA=${ORIGIN_SHA}"
            echo "FIRST_COMMIT_DONE=false"
          } >> "$GITHUB_ENV"

          commit_and_push_changes() {
            local index_lock checkpoint_head retry
            index_lock=$(git rev-parse --git-path index.lock) || return 1
            if [ -e "$index_lock" ]; then
              echo "::error::Git index is locked; translation data will be retained in the run artifacts"
              return 1
            fi

            # Temporary files must never enter a checkpoint commit.
            git add -- ':(glob)data/*.toml' || return 1
            if ! git diff --cached --quiet -- ':(glob)data/*.toml'; then
              checkpoint_head=$(git rev-parse HEAD) || return 1
              if [ "$checkpoint_head" = "$ORIGIN_SHA" ]; then
                git commit -m "chore: Auto-translate mod entries [skip ci]" || return 1
              else
                git commit --amend --no-edit || return 1
              fi
            fi

            checkpoint_head=$(git rev-parse HEAD) || return 1
            if [ "$checkpoint_head" = "$ORIGIN_SHA" ]; then
              echo "No translation changes to checkpoint"
              return 0
            fi

            # A clean index may still contain a commit whose previous push failed.
            for retry in 1 2 3; do
              if git push --force-with-lease origin "HEAD:${TEMP_BRANCH}"; then
                echo "Saved translation progress to $TEMP_BRANCH"
                return 0
              fi
              echo "Checkpoint push failed (attempt $retry/3)"
              if [ "$retry" -lt 3 ]; then
                sleep 2
              fi
            done
            return 1
          }

          checkpoint_loop() {
            local elapsed
            while [ ! -e "$CHECKPOINT_STOP_FILE" ]; do
              for ((elapsed = 0; elapsed < CHECKPOINT_INTERVAL; elapsed++)); do
                sleep 1
                if [ -e "$CHECKPOINT_STOP_FILE" ]; then
                  return 0
                fi
              done
              if ! commit_and_push_changes; then
                echo "::warning::Checkpoint failed; finalization will retry after translation stops"
              fi
            done
          }

          # shellcheck disable=SC2329
          stop_checkpoint_loop() {
            touch "$CHECKPOINT_STOP_FILE" || return 1
            if [ -n "$CHECKPOINT_PID" ]; then
              # Let an active Git command finish before the final checkpoint.
              wait "$CHECKPOINT_PID" || return 1
              CHECKPOINT_PID=""
            fi
          }

          # shellcheck disable=SC2329
          on_exit() {
            local exit_code=$? final_head
            trap - EXIT
            trap '' TERM INT

            if [ -n "$TRANSLATE_PID" ]; then
              kill -TERM "$TRANSLATE_PID" 2>/dev/null || true
              wait "$TRANSLATE_PID" 2>/dev/null || true
              TRANSLATE_PID=""
            fi
            if ! stop_checkpoint_loop; then
              echo "::error::Could not join the checkpoint process; refusing concurrent Git operations"
              exit 1
            fi

            if commit_and_push_changes; then
              final_head=$(git rev-parse HEAD) || exit_code=1
              if [ -n "$final_head" ] && [ "$final_head" != "$ORIGIN_SHA" ]; then
                echo "FIRST_COMMIT_DONE=true" >> "$GITHUB_ENV" || exit_code=1
              fi
            else
              echo "::error::Final checkpoint failed; skipping merge and preserving the data artifact"
              exit_code=1
            fi

            if [ "$exit_code" -eq 0 ]; then
              echo "completed=true" >> "$GITHUB_OUTPUT"
            else
              echo "failed=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$exit_code"
          }

          trap 'on_exit' EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT

          mkdir -p "$(dirname "$LOG_FILE")"
          rm -f "$LOG_FILE"

          checkpoint_loop &
          CHECKPOINT_PID=$!

          python .github/scripts/translate_mods.py \
            --config .github/config/config.toml \
            --data-dir data \
            --glossary data/_glossary.toml \
            --log-file "$LOG_FILE" \
            --thread-log-file "$THREAD_LOG_FILE" &
          TRANSLATE_PID=$!

          EXIT_CODE=0
          wait "$TRANSLATE_PID" || EXIT_CODE=$?
          TRANSLATE_PID=""
          exit "$EXIT_CODE"
      
      - name: Merge translation results to target branch
        id: merge
        if: always() && env.FIRST_COMMIT_DONE == 'true'
        run: |
          TARGET_BRANCH="${{ env.TARGET_BRANCH }}"
          TEMP_BRANCH="${{ env.TEMP_BRANCH }}"
          ORIGIN_SHA="${{ env.ORIGIN_SHA }}"
          FIRST_COMMIT_DONE="${{ env.FIRST_COMMIT_DONE }}"
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # ----------------------------------------------------------------
          # cleanup_temp_branch
          # Deletes the remote temp branch once it has been merged.
          # ----------------------------------------------------------------
          cleanup_temp_branch() {
            git push origin --delete "$TEMP_BRANCH" 2>/dev/null || true
            echo "Deleted remote temp branch $TEMP_BRANCH"
          }
          
          # ----------------------------------------------------------------
          # merge_to_target
          # Fetch and rebase onto the current target before publishing.
          # A conflict leaves the translation branch available for review.
          # ----------------------------------------------------------------
          merge_to_target() {
            if [ "$FIRST_COMMIT_DONE" != "true" ]; then
              echo "No translation commits to merge into $TARGET_BRANCH"
              cleanup_temp_branch
              return 0
            fi
            
            echo "Merging translation results into $TARGET_BRANCH..."
            
            # Fetch the latest state of the target branch.
            git fetch origin "$TARGET_BRANCH"
            CURRENT_TARGET_SHA=$(git rev-parse "origin/${TARGET_BRANCH}")
            
            if [ "$CURRENT_TARGET_SHA" = "$ORIGIN_SHA" ]; then
              # Nobody pushed to the target branch while we ran.
              # A plain (non-force) push is a safe fast-forward here.
              echo "No upstream changes detected; fast-forwarding $TARGET_BRANCH"
              git push origin "HEAD:${TARGET_BRANCH}"
              echo "Successfully merged translation into $TARGET_BRANCH"
              cleanup_temp_branch
            else
              # The target branch has new commits that appeared during the run.
              # First, attempt a clean rebase onto the updated target branch.
              echo "Upstream $TARGET_BRANCH has new commits since $ORIGIN_SHA (now $CURRENT_TARGET_SHA)"
              echo "Attempting rebase onto origin/${TARGET_BRANCH}..."
              
              if git rebase "origin/${TARGET_BRANCH}" 2>&1; then
                # Rebase succeeded with no conflicts — push normally.
                echo "Rebase succeeded cleanly; pushing to $TARGET_BRANCH"
                git push origin "HEAD:${TARGET_BRANCH}"
                echo "Successfully merged translation into $TARGET_BRANCH (rebased)"
                cleanup_temp_branch
              else
                git rebase --abort 2>/dev/null || true
                echo "Rebase conflict; translation progress remains on $TEMP_BRANCH"
                exit 1
              fi
            fi
          }
          
          if ! git diff --quiet -- data/ || ! git diff --cached --quiet -- data/; then
            echo "::error::Translation data has unsaved changes; refusing to merge"
            exit 1
          fi

          # Checkout the temp branch to merge
          git checkout "$TEMP_BRANCH"
          echo "Checked out temp branch $TEMP_BRANCH for merge"
          
          # Perform merge
          merge_to_target
          echo "Merge step completed"
      
      - name: Stage translation data for upload
        id: stage_translation_data
        if: always()
        env:
          ARTIFACT_STAGING_PARENT: ${{ runner.temp }}
        run: |
          python .github/scripts/stage_translation_artifact.py \
            --data-dir data --staging-parent "$ARTIFACT_STAGING_PARENT"

      - name: Upload translation data as artifact
        if: always() && steps.stage_translation_data.outcome == 'success' && steps.stage_translation_data.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: translation-data-${{ github.run_number }}
          path: ${{ steps.stage_translation_data.outputs.path }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

      - name: Upload translation logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-logs-${{ github.run_number }}
          path: |
            .github/log/translation.log
            .github/log/thread_work.log
            .github/log/cost_report.json
            test/results/production-smoke/
          retention-days: 30
          include-hidden-files: false
      
      - name: Generate Cost Summary
        if: always()
        run: |
          {
            echo "## Translation Cost Report"
            python3 .github/scripts/cost_summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Action Summary
        if: always()
        env:
          TRANSLATION_STATUS: ${{ job.status }}
        run: |
          LOG_FILE=".github/log/translation.log"
          {
            echo "## Translation Summary"
            echo "Status: $TRANSLATION_STATUS"
            if [ -f "$LOG_FILE" ]; then
              echo "### Recent Log Entries"
              echo '```'
              tail -n 20 "$LOG_FILE"
              echo '```'
              echo "Full logs and verification outputs are available in the run artifacts."
            else
              echo "Translation log not found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
